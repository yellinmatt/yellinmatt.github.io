<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1F3A4D">
<meta name="color-scheme" content="light">
<title>Claude OS · Matt Yellin</title>
<meta name="description" content="A short course in how Matt Yellin's Claude OS works: why a chat forgets, how a folder of plain files gives it memory, rules and checks, and where it always stops for approval.">
<link rel="canonical" href="https://mattyellin.com/system/">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* A learner-paced course in the Claude OS Deck v4 palette: slate-teal, cream, gold, bronze.
   Content slides put the evidence on the left (the system map or a real file) and the claim on the right. */
:root{
  --navy:#1F3A4D;--navy2:#294a60;--gold:#C9A96A;--bronze:#8a5a26;--cream:#F4EEE2;--paper:#FBF8F2;--white:#ffffff;
  --ink:#16242e;--ink2:#3a4852;--mut:#5f6a73;--line:rgba(31,58,77,.14);--line2:rgba(31,58,77,.26);
  --lit:#fff3dc;--ok:#256b4a;--okbg:#e4f2ea;--bad:#a63a25;--badbg:#f9e6e1;
  --on-navy:#f4eee2;--on-navy2:#c9d3da;
  --sans:"Instrument Sans",system-ui,-apple-system,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior-x:none}
body{background:var(--paper);color:var(--ink);font:400 19px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:none;box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--bronze);border-radius:8px}
.ctl button:focus-visible,.opts button:focus-visible,.parts button:focus-visible,.chip:focus-visible,.node.pick:focus-visible,.sbtn button:focus-visible{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--bronze)!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) 64px}
.top{background:var(--navy);color:var(--on-navy)}
.top .row{display:flex;align-items:center;gap:20px;height:52px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.home{display:flex;align-items:center;gap:10px;text-decoration:none;font-size:15px;white-space:nowrap}
.home i{font-style:normal;color:var(--gold);font-weight:600;background:var(--navy)}
.home b{font-weight:600}
.home span{color:var(--on-navy2)}
.parts{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none;min-width:0;padding:0 16px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent)}
.parts::-webkit-scrollbar{display:none}
.parts button{flex:none;font-size:13px;color:var(--on-navy2);padding:6px 11px;border-radius:999px;white-space:nowrap;background:var(--navy)}
.parts button.on{background:var(--gold);color:var(--navy);font-weight:600}
.parts button.done{color:var(--on-navy)}

.deck{position:relative;overflow:hidden;min-height:0;touch-action:pan-y}
.slide{position:absolute;inset:0;display:none;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(32px,4vw,64px);align-items:safe center;padding:clamp(24px,4vh,48px) max(48px,env(safe-area-inset-right,0px)) clamp(24px,4vh,48px) max(48px,env(safe-area-inset-left,0px));overflow:auto;background:var(--paper)}
.slide.on{display:grid;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.text{max-width:600px;min-width:0}
.kick{font:600 12px var(--mono);color:var(--bronze);letter-spacing:.09em;text-transform:uppercase}
.text h2{font:600 clamp(26px,2.25vw,36px)/1.15 var(--sans);letter-spacing:-.028em;color:var(--navy);margin-top:12px;text-wrap:balance}
.text .sub{margin-top:16px;font-size:clamp(17.5px,1.3vw,20px);color:var(--ink2);text-wrap:pretty}
.text .sub b{color:var(--ink);font-weight:600}
.notes{list-style:none;margin-top:22px;display:grid;gap:12px}
.notes li{display:grid;grid-template-columns:26px 1fr;gap:12px;font-size:clamp(16.5px,1.2vw,18px);color:var(--ink2)}
.notes li b{color:var(--ink);font-weight:600}
.badge{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 4px;border-radius:12px;background:var(--navy);color:var(--on-navy);font:600 12px var(--sans);flex:none}
.notes .badge{margin-top:2px}
.ev{min-width:0;align-self:center}
.ask{margin-top:20px;font:600 15px var(--sans);color:var(--bronze)}

/* dark slides */
.slide.dark{background:var(--navy);color:var(--on-navy)}
.slide.dark .kick{color:var(--gold)}
.slide.dark h2,.slide.dark h1{color:var(--on-navy)}
.slide.dark .sub{color:var(--on-navy2)}
.slide.solo{grid-template-columns:minmax(0,1fr);align-content:safe center}
.bill .text,.gloss .text,.recap .text{max-width:1180px}
.solo .text{max-width:920px}
.cold h1{font:600 clamp(44px,6vw,92px)/1 var(--sans);letter-spacing:-.045em;margin-top:18px;max-width:16ch}
.cold .sub{font-size:clamp(20px,1.8vw,26px);max-width:44ch;margin-top:24px}
.cold .src{margin-top:34px;font:500 13px var(--mono);color:var(--gold)}

/* part divider */
.divider .num{font:600 clamp(90px,12vw,190px)/.82 var(--sans);letter-spacing:-.06em;color:var(--gold)}
.divider h1{font:600 clamp(40px,4.6vw,70px)/1.02 var(--sans);letter-spacing:-.045em;margin-top:18px;color:var(--on-navy)}
.divider .q{margin-top:28px;padding:16px 20px;border-radius:12px;background:var(--navy2);font-size:clamp(19px,1.5vw,23px);max-width:40ch;color:var(--on-navy)}
.divider .q small{display:block;font:600 11.5px var(--mono);letter-spacing:.09em;color:var(--on-navy2);background:var(--navy2);margin-bottom:4px}
.divider .ev .cap2{margin-top:12px;font:500 12.5px var(--mono);color:var(--on-navy2)}

/* cards */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--white);border-radius:12px;box-shadow:0 0 0 1px var(--line);padding:18px 20px;font-size:16.5px;color:var(--ink2)}
.card small{display:block;font:600 11.5px var(--mono);letter-spacing:.09em;color:var(--bronze);margin-bottom:6px;text-transform:uppercase}
.card b{color:var(--ink);font-weight:600}
.card.hi{background:var(--lit);box-shadow:0 0 0 1.5px var(--gold)}
.card.wide{grid-column:1/-1}
.card ol{padding-left:18px;display:grid;gap:4px}

/* the system map */
.map{position:relative;width:100%;aspect-ratio:16/10.5;border-radius:16px;background:var(--white);box-shadow:0 0 0 1px var(--line),0 18px 40px rgba(31,58,77,.08)}
.map svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.map path{fill:none;stroke:rgba(31,58,77,.3);stroke-width:1.6;transition:stroke .3s,opacity .3s}
.map path.lit{stroke:var(--bronze);stroke-width:3;stroke-dasharray:7 5;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.map path.dim{opacity:.4}
.node{position:absolute;transform:translate(-50%,-50%);width:15%;padding:9px 4px;border-radius:11px;background:var(--paper);box-shadow:0 0 0 1px var(--line2);text-align:center;transition:background .3s,box-shadow .3s}
.node b{display:block;font:600 clamp(12.5px,1vw,15px)/1.2 var(--sans);color:var(--navy)}
.node span{display:block;font:400 clamp(10px,.76vw,11.5px)/1.3 var(--mono);color:var(--mut);margin-top:2px}
.node.lit{background:var(--lit);box-shadow:0 0 0 2px var(--gold),0 6px 18px rgba(201,169,106,.35)}
.node.dim{box-shadow:0 0 0 1px var(--line)}.node.dim b,.node.dim span{color:var(--mut)}
.node.you{background:var(--navy)}.node.you b{color:var(--on-navy)}.node.you span{color:var(--on-navy2)}
.node.you.dim{background:var(--cream)}.node.you.dim b,.node.you.dim span{color:var(--mut)}
.node.pick{cursor:pointer}
@media (hover:hover){.node.pick:hover{box-shadow:0 0 0 2px var(--navy)}}
.node.right{background:var(--okbg);box-shadow:0 0 0 2.5px var(--ok)}.node.right b{color:var(--ok)}
.node.wrong{background:var(--badbg);box-shadow:0 0 0 2.5px var(--bad)}.node.wrong b{color:var(--bad)}
.node.off{background:var(--badbg);box-shadow:0 0 0 2px var(--bad)}.node.off b{color:var(--bad);text-decoration:line-through}
.say{position:absolute;max-width:30%;padding:9px 13px;border-radius:12px;background:var(--navy);color:var(--on-navy);font-size:14px;line-height:1.35;box-shadow:0 8px 20px rgba(31,58,77,.25);z-index:2}
.say.claude{max-width:44%;background:var(--white);color:var(--ink);box-shadow:0 0 0 1.5px var(--gold),0 8px 20px rgba(31,58,77,.12)}
.say small{display:block;font:600 10.5px var(--mono);letter-spacing:.06em;margin-bottom:2px;color:inherit}
.says-m{display:none}

/* a real file */
.file{border-radius:14px;background:var(--white);box-shadow:0 0 0 1px var(--line),0 18px 40px rgba(31,58,77,.08);overflow:hidden}
.file .tab{display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--cream);border-bottom:1px solid var(--line);font:500 13px var(--mono);color:var(--navy)}
.file .tab span{color:var(--mut)}
.file pre{padding:14px 0;font:400 clamp(13px,.98vw,15px)/1.85 var(--mono);color:var(--ink2);overflow-x:auto;background:var(--white)}
.file pre div{padding:0 20px;white-space:pre}
.file pre div.h{background:var(--lit);color:var(--ink);box-shadow:inset 3px 0 0 var(--gold)}
.file pre div.x{color:var(--bad)}
.file pre div.g{color:var(--ok)}
.file pre .badge{min-width:19px;height:19px;font-size:10.5px;margin-left:10px;vertical-align:1px}
.file .cap{padding:10px 18px;border-top:1px solid var(--line);font:400 12.5px var(--mono);color:var(--mut);background:var(--paper)}

/* window diagram */
.win{border-radius:14px;background:var(--white);box-shadow:0 0 0 1px var(--line),0 18px 40px rgba(31,58,77,.08);padding:22px}
.win .lbl{font:600 11.5px var(--mono);letter-spacing:.08em;color:var(--mut);text-transform:uppercase;margin-bottom:10px}
.win .bar{display:flex;height:64px;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--line2)}
.win .bar div{display:grid;place-items:center;font:600 12.5px var(--sans);text-align:center;padding:0 6px}
.win .s1{background:var(--navy);color:var(--on-navy)}.win .s2{background:var(--gold);color:var(--navy)}.win .s3{background:var(--cream);color:var(--navy)}.win .s4{background:var(--paper);color:var(--mut)}
.win.gone .bar div:not(.s4){display:none}
.win .after{margin-top:18px;font-size:16px;color:var(--ink2)}

/* checks */
.prompt{border-radius:14px;background:var(--white);box-shadow:0 0 0 1px var(--line);padding:26px 26px 22px}
.prompt small{display:block;font:600 11.5px var(--mono);letter-spacing:.09em;color:var(--bronze);margin-bottom:10px}
.prompt p{font-size:clamp(19px,1.5vw,23px);line-height:1.45;color:var(--ink)}
.opts{display:grid;gap:10px;margin-top:20px}
.opts button{text-align:left;padding:14px 16px;border-radius:12px;background:var(--white);box-shadow:inset 0 0 0 1px var(--line2);font-size:17px;color:var(--ink)}
@media (hover:hover){.opts:not([data-done]) button:hover{box-shadow:inset 0 0 0 1.5px var(--navy)}}
.opts button.right{background:var(--okbg);box-shadow:inset 0 0 0 2px var(--ok);color:var(--ok)}
.opts button.wrong{background:var(--badbg);box-shadow:inset 0 0 0 2px var(--bad);color:var(--bad)}
.opts[data-done] button{cursor:default}
.verdict{margin-top:16px;font-size:17px;color:var(--ink2);min-height:52px}
.verdict b{color:var(--ink)}

/* sort */
.sort{display:grid;gap:8px;margin-top:12px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--white);box-shadow:0 0 0 1px var(--line)}
.st{font-size:16px;color:var(--ink)}
.sbtn{display:flex;gap:6px}
.sbtn button{font:600 13px var(--sans);padding:8px 11px;border-radius:9px;box-shadow:inset 0 0 0 1px var(--line2);color:var(--navy);background:var(--paper);white-space:nowrap}
.sbtn button.right{background:var(--okbg);box-shadow:inset 0 0 0 2px var(--ok);color:var(--ok)}
.sbtn button.wrong{background:var(--badbg);box-shadow:inset 0 0 0 2px var(--bad);color:var(--bad)}

/* break it */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{padding:8px 13px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line2);font:600 14px var(--sans);color:var(--navy);background:var(--white)}
.chip.on{background:var(--bad);color:var(--white);box-shadow:none}

/* the one thing */
.one .box{border-radius:14px;background:var(--cream);box-shadow:inset 4px 0 0 var(--gold);padding:28px 30px}
.one .box small{display:block;font:600 11.5px var(--mono);letter-spacing:.09em;color:var(--bronze);margin-bottom:8px}
.one .box p{font:600 clamp(22px,2vw,30px)/1.3 var(--sans);letter-spacing:-.02em;color:var(--navy)}
.one ul{list-style:none;margin-top:20px;display:grid;gap:10px}
.one li{padding-left:20px;position:relative;font-size:17px;color:var(--ink2)}
.one li::before{content:"";position:absolute;left:0;top:.65em;width:9px;height:2px;background:var(--gold)}

/* close */
.bgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:26px}
.bcell{background:var(--white);border-radius:12px;box-shadow:0 0 0 1px var(--line);padding:18px 20px}
.bcell b{display:block;font:600 clamp(28px,3vw,44px)/1 var(--sans);letter-spacing:-.04em;color:var(--navy)}
.bcell span{display:block;margin-top:8px;font-size:16px;color:var(--ink)}
.bcell small{display:block;margin-top:2px;font:400 12px var(--mono);color:var(--mut)}
.rlist{list-style:none;margin-top:24px;display:grid;gap:9px}
.rlist li{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;font-size:16.5px;color:var(--ink);padding:7px 0;border-top:1px solid var(--line)}
.rlist li span{font:600 12.5px var(--mono);color:var(--bronze);padding-top:3px}
.glist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 28px;margin-top:18px}
.glist div{padding:8px 0;border-top:1px solid var(--line)}
.glist dt{font:600 16px var(--sans);color:var(--navy)}
.glist dd{font-size:15px;line-height:1.4;color:var(--ink2)}

.foot{display:flex;align-items:center;gap:18px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);background:var(--paper);font:500 13px var(--mono);color:var(--mut)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line2)}
.dots i.done{background:var(--mut)}.dots i.on{background:var(--bronze)}
.ctl{display:flex;gap:8px;margin-left:auto}
.ctl button{height:40px;padding:0 18px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line2);color:var(--navy);font:600 14px var(--sans);background:var(--white)}
.ctl button.next{background:var(--navy);color:var(--on-navy);box-shadow:none}
.ctl button:disabled{opacity:.4;cursor:default}

@media (max-width:900px){
  body{overflow:auto;font-size:17px}
  .app{height:auto;min-height:100%;grid-template-rows:auto auto 60px}
  .top .row{padding:0 16px;gap:12px}.home span,.home b{display:none}
  .parts{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 calc(100% - 18px),transparent);padding:0 14px}
  .deck{min-height:calc(100svh - 112px)}
  .slide{position:static;grid-template-columns:minmax(0,1fr);gap:22px;padding:24px 16px 36px;align-content:start;overflow:visible}
  .slide .text{order:-1;max-width:none}
  .slide.check .text,.slide.one .text,.slide.sortslide .text{order:0}
  .slide.dark{min-height:calc(100svh - 112px)}
  .cards{grid-template-columns:minmax(0,1fr)}
  .file pre{font-size:12px}.file pre div{white-space:pre-wrap;padding:0 14px}
  .map{aspect-ratio:16/13}
  .node{padding:4px 2px;min-height:40px;display:grid;place-items:center}.node span,.node.lit span{display:none}.node b{font-size:12px;line-height:1.15}
  .map .say{display:none}
  .says-m{display:grid;gap:8px;margin-top:12px}.says-m .say{position:static;max-width:none}
  .srow{grid-template-columns:minmax(0,1fr)}
  .bgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rlist li{grid-template-columns:minmax(0,1fr);gap:2px}
  .glist{grid-template-columns:minmax(0,1fr)}
  .foot{position:sticky;bottom:0;z-index:5;padding:0 16px;gap:10px}.dots{display:none}
  .ctl button{padding:0 14px}
}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}.map path.lit{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="row"><a class="home" href="../"><i>MY</i> <b>Matt Yellin</b> <span>/ Claude OS, a short course</span></a><nav class="parts" id="parts" aria-label="Parts of the course"></nav></div></header>
  <main class="deck" id="deck"></main>
  <footer class="foot"><span id="where"></span><div class="dots" id="dots" aria-hidden="true"></div><div class="ctl"><button type="button" id="prev">Back</button><button type="button" class="next" id="next">Next</button></div></footer>
  <div class="sr" id="live" aria-live="polite"></div>
</div>

var ROUTE={'memory-claude':'M89 44 C89 31 31 33 31 45','lessons-rules':'M89 91 L89 97 L21.5 97 L21.5 14 L23 14','skills-claude':'M70 14 C70 32 31 30 31 50','kernel-claude':'M50.5 14 C50.5 32 31 30 31 50','claude-gates':'M31 50 C31 70 70 68 70 86'};

    p.setAttribute('d',d);p.setAttribute('vector-effect','non-scaling-stroke');if(path.indexOf(k)>=0)p.setAttribute('class','lit');else if(dim||path.length)p.setAttribute('class','dim');svg.appendChild(p)});
