<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="VP check">
<title>Viewport check</title>
<style>
html,body{margin:0;height:100%;background:#123;color:#fff;font:15px/1.4 -apple-system,sans-serif}
#p{position:fixed;top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom);left:env(safe-area-inset-left);right:env(safe-area-inset-right);visibility:hidden}
.edge{position:fixed;left:0;right:0;height:6px;background:#f33}
#t{top:0}#b{bottom:0}
#sb{position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top);background:rgba(0,200,120,.5)}
#hb{position:fixed;left:0;right:0;bottom:0;height:env(safe-area-inset-bottom);background:rgba(0,200,120,.5)}
pre{position:fixed;left:12px;right:12px;top:40%;margin:0;font:600 16px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap}
</style></head><body>
<div id="p"></div><div id="sb"></div><div id="hb"></div><div class="edge" id="t"></div><div class="edge" id="b"></div>
<pre id="o"></pre>
<script>
function go(){var r=document.getElementById('p').getBoundingClientRect(),vv=window.visualViewport;
document.getElementById('o').textContent=
'standalone '+(navigator.standalone||matchMedia('(display-mode: standalone)').matches)+
'\ninner '+innerWidth+' x '+innerHeight+
'\nvv '+(vv?Math.round(vv.width)+' x '+Math.round(vv.height)+' s'+vv.scale.toFixed(2):'-')+
'\nscreen '+screen.width+' x '+screen.height+' dpr '+devicePixelRatio+
'\nsafe top '+Math.round(r.top)+' bottom '+Math.round(innerHeight-r.bottom)+
'\nsafe l/r '+Math.round(r.left)+' / '+Math.round(innerWidth-r.right)+
'\nclient '+document.documentElement.clientWidth+' x '+document.documentElement.clientHeight+
'\nua '+navigator.userAgent.replace(/.*OS ([0-9_]+).*/,'iOS $1');}
go();addEventListener('resize',go);setTimeout(go,500);
</script></body></html>
