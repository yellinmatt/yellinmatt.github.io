<meta charset="utf-8">

<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://mattyellin.com/">
<title>Work · Matt Yellin</title>
<meta name="theme-color" content="#0a0b0e">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#0a0b0e;--ink:#efede7;--mut:#8b8f98;--line:rgba(255,255,255,.16);--acc:#ff6a4d}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Instrument Sans",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.mk{font:400 28px/1 Georgia,serif;letter-spacing:-.02em}.mk i{font-style:normal;color:var(--acc)}
h1{font-size:clamp(28px,4vw,44px);font-weight:600;letter-spacing:-.045em;line-height:1.05}
p{color:var(--mut);max-width:40ch}
a.b{display:inline-flex;align-items:center;height:42px;padding:0 18px;border-radius:999px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:500;font-size:14px}
a.b:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
</style>
</head>
<body>
<main>
<span class="mk">M<i>Y</i></span>
<h1>The work is on the home page</h1>
<p>Every project now lives on the home page.</p>
<a class="b" href="/#work">See the work</a>
</main>
<script>location.replace('/#work');</script>
</body>
