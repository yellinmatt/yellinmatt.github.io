/* ============ CARDIO / RUN RAMP ============ */
function mondayOf(d){var m=new Date(d);m.setDate(d.getDate()-((d.getDay()+6)%7));m.setHours(0,0,0,0);return m;}
function rnd5(x){return Math.round(x*2)/2;}
/* Run tab: driven by run COUNT + GAPS, not a calendar ramp (mirrors the lift engine). */
function allRuns(){return S.sessions.filter(function(s){return s.type==="run";}).sort(function(a,b){return a.date<b.date?-1:1;});}
function runRhythm(){var r=allRuns();if(!r.length)return{total:0,count:0,gap:null,last:null};var count=1;for(var i=r.length-1;i>0;i--){if(daysBetween(r[i-1].date,r[i].date)<7)count++;else break;}return{total:r.length,count:count,gap:daysBetween(r[r.length-1].date,TODAY),last:r[r.length-1].date};}
function nextRunTarget(){var rr=runRhythm();if(rr.gap!==null&&rr.gap>=7)return{mi:2,restart:true,block:0};var block=Math.floor(rr.count/3);return{mi:Math.min(4.5,2+block*0.5),restart:false,block:block};}
function runStatusLine(rr){if(rr.total===0)return"No runs logged yet. Start with an easy 2 miles - that is the whole ask.";if(rr.gap===0)return"You ran today. That is the streak working.";if(rr.gap<=3)return"In rhythm - last run "+rr.gap+" day"+(rr.gap===1?"":"s")+" ago. Keep it rolling.";if(rr.gap<=6)return rr.gap+" days since your last run. Get one in before the week resets.";return"It has been "+rr.gap+" days. Restart easy, no penalty - the rhythm repairs itself.";}
function milesThisWeek(){var k=keyOf(mondayOf(NOW)),mi=0;S.sessions.forEach(function(s){if(s.type==="run"&&s.date>=k)mi+=(s.distanceMi||0);});return mi;}
function weeklyMiHistory(){var by={};S.sessions.forEach(function(s){if(s.type!=="run")return;by[isoWeek(s.date)]=(by[isoWeek(s.date)]||0)+(s.distanceMi||0);});var ks=Object.keys(by).sort().slice(-12);return ks.map(function(k){return by[k];});}
/* Pace zones as a proportional scale rather than four rows of text: the bar shows where each
   zone sits relative to the others, so "most of your miles live down here" is visible instead
   of merely asserted. Easy is the widest band on purpose. */
var ZONES=[
 {n:"Easy",lo:630,hi:660,note:"most of your miles",k:"easy"},
 {n:"Long",lo:660,hi:690,note:"keep it relaxed",k:"long"},
 {n:"Steady",lo:585,hi:600,note:"only if it feels easy",k:"steady"},
 {n:"Tempo",lo:545,hi:560,note:"once the base is back",k:"tempo"}
];
function paceZonesHTML(){
  var all=ZONES.reduce(function(a,z){return a.concat([z.lo,z.hi]);},[]);
  var mn=Math.min.apply(null,all)-20,mx=Math.max.apply(null,all)+20;
  function px(v){return ((v-mn)/(mx-mn))*100;}
  var rows=ZONES.slice().sort(function(a,b){return b.lo-a.lo;}).map(function(z){
    /* lo is the faster (smaller) pace, so it is the LEFT edge; width runs lo->hi. Reading these
       the other way round made every band collapse to the 4% minimum. */
    var x=px(z.lo),w=Math.max(px(z.hi)-px(z.lo),6);
    return '<div class="zrow" data-z="'+z.k+'"><div class="zhead"><span class="zn">'+z.n+'</span><span class="zp num">'+mmss(z.lo)+'&ndash;'+mmss(z.hi)+'</span></div>'+
      '<div class="ztrack"><i style="left:'+x.toFixed(1)+'%;width:'+w.toFixed(1)+'%"></i></div>'+
      '<div class="znote">'+z.note+'</div></div>';
  }).join("");
  return '<div class="card"><h3><span>Pace zones</span><span class="t">per mile</span></h3>'+
    '<div class="ksub">Slower is to the right. You run hot, so nearly everything should sit in the two bands at the top.</div>'+
    rows+'</div>';
}
function scrollToWarm(){var e=document.getElementById("warmblock");if(e)e.scrollIntoView({behavior:"smooth",block:"start"});}
/* ============ CARDIO LEVEL SYSTEM (Round C) ============
   Levels come from an exponentially weighted average of daily cardio load, the way TrainingPeaks
   and Strava compute fitness, rather than from points added and taken away. That one choice makes
   decay honest and non-punitive: missing a week is not a penalty event, it is the same formula
   running with zero input, and the curve bends gently instead of docking you.
   The displayed level never animates downward mid-session; it changes only when a real threshold
   is crossed, and it is phrased as a location rather than a loss. */
var CARDIO_TC=21; /* days; slower than a 7-day fatigue line, faster than a 42-day fitness one */
function loadFor(s){
  /* Load is minutes weighted by intensity, so a hard 20 counts more than an easy 20 and a walk
     still counts for something. Distance is used when there is no duration. */
  if(!s)return 0;
  var min=(s.durationSec||0)/60;
  if(!min&&s.distanceMi)min=s.distanceMi*10;
  if(!min)return 0;
  var k=1;
  if(s.type==="run")k=1.5;
  else if(s.activity==="Walk")k=0.45;
  else if(s.type==="activity")k=0.9;
  else if(s.type==="lift")k=0.6;
  var rpe=(""+(s.rpe||"")).toLowerCase();
  if(rpe.indexOf("hard")>=0)k*=1.25; else if(rpe.indexOf("easy")>=0)k*=0.9;
  return min*k;
}
function dailyLoad(){
  var by={};S.sessions.forEach(function(s){if(!s.date)return;by[s.date]=(by[s.date]||0)+loadFor(s);});return by;
}
/* Walk the calendar day by day so gaps feed real zeros into the average. */
function fitnessSeries(days){
  days=days||120;
  var by=dailyLoad(),out=[],slow=0,fast=0,a=1/CARDIO_TC,af=1/7;
  var d=new Date(NOW);d.setDate(d.getDate()-days+1);
  for(var i=0;i<days;i++){
    var v=by[keyOf(d)]||0;
    slow=slow+(v-slow)*a;
    fast=fast+(v-fast)*af;
    out.push({date:keyOf(d),slow:slow,fast:fast});
    d.setDate(d.getDate()+1);
  }
  return out;
}
/* Levels scale so early ones arrive fast and later ones take real work. */
function levelFloor(n){return Math.round(6*Math.pow(n-1,1.45));}
function levelFor(score){var n=1;while(n<50&&score>=levelFloor(n+1))n++;return n;}
function cardioLevel(){
  var s=fitnessSeries(120);
  if(!s.length)return {lvl:1,score:0,pct:0,into:0,span:1,fast:0,slow:0,trend:"flat",series:s};
  var last=s[s.length-1],score=last.slow,lvl=levelFor(score);
  var lo=levelFloor(lvl),hi=levelFloor(lvl+1),span=Math.max(hi-lo,1);
  var monthAgo=s[Math.max(0,s.length-29)].slow;
  var trend=(score>monthAgo+0.6)?"up":(score<monthAgo-0.6)?"down":"flat";
  return {lvl:lvl,score:score,into:score-lo,span:span,pct:Math.max(0,Math.min(1,(score-lo)/span)),
          fast:last.fast,slow:last.slow,trend:trend,delta:score-monthAgo,series:s};
}
function levelCaption(L){
  if(L.trend==="up")return "Building. Up "+Math.round(L.delta)+" points in the last four weeks.";
  if(L.trend==="flat")return "Holding. Level with where you were a month ago.";
  return "Easing off. A couple of runs gets this climbing again.";
}
function levelRingHTML(L){
  var r=40,C=2*Math.PI*r,off=C*(1-L.pct);
  return '<svg class="lring" width="104" height="104" viewBox="0 0 96 96" role="img" aria-label="Level '+L.lvl+', '+Math.round(L.pct*100)+' percent to level '+(L.lvl+1)+'">'+
    '<g transform="rotate(-90 48 48)">'+
    '<circle cx="48" cy="48" r="'+r+'" fill="none" stroke="var(--surface-2)" stroke-width="8"/>'+
    '<circle cx="48" cy="48" r="'+r+'" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/></g>'+
    '<text x="48" y="46" text-anchor="middle" class="num" style="font-size:28px;font-weight:800;fill:var(--ink)">'+L.lvl+'</text>'+
    '<text x="48" y="63" text-anchor="middle" style="font-size:9.5px;font-weight:700;letter-spacing:.08em;fill:var(--faint)">LEVEL</text></svg>';
}
function fitnessSpark(L){
  var s=L.series.slice(-90);if(s.length<4)return "";
  var vs=s.map(function(p){return p.slow;}),mx=Math.max.apply(null,vs)||1,mn=Math.min.apply(null,vs);
  var W=300,H=30;
  var d=vs.map(function(v,i){var x=(i/(vs.length-1))*W,y=H-2-((v-mn)/((mx-mn)||1))*(H-6);return (i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1);}).join(" ");
  return '<svg class="lspark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true"><path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
/* Badges are dated records, shown in the order earned; locked ones stay visible as goals. */
function badgeList(){
  var runs=allRuns(),total=runs.reduce(function(a,s){return a+(s.distanceMi||0);},0);
  var longest=runs.reduce(function(a,s){return Math.max(a,s.distanceMi||0);},0);
  var L=cardioLevel();
  var defs=[
    {id:"first",n:"First mile",d:"Log your first run",got:runs.length>=1,when:runs.length?runs[0].date:null},
    {id:"ten",n:"Ten runs",d:"Bank ten runs",got:runs.length>=10,when:runs.length>=10?runs[9].date:null},
    {id:"25mi",n:"25 miles",d:"25 miles total",got:total>=25,when:null},
    {id:"100mi",n:"100 miles",d:"100 miles total",got:total>=100,when:null},
    {id:"5k",n:"5K",d:"Run 3.1 in one go",got:longest>=3.1,when:null},
    {id:"10k",n:"10K",d:"Run 6.2 in one go",got:longest>=6.2,when:null},
    {id:"lvl5",n:"Level 5",d:"Reach level 5",got:L.lvl>=5,when:null},
    {id:"lvl10",n:"Level 10",d:"Reach level 10",got:L.lvl>=10,when:null}
  ];
  var got=defs.filter(function(b){return b.got;}),left=defs.filter(function(b){return !b.got;});
  var cells=got.concat(left).map(function(b){
    return '<div class="badge'+(b.got?" got":"")+'"><div class="bdot">'+(b.got?I.trophy:I.rest)+'</div><div class="bn">'+b.n+'</div><div class="bd">'+(b.got&&b.when?shortDate(b.when):b.d)+'</div></div>';
  }).join("");
  return '<div class="card"><h3><span>Badges</span><span class="t">'+got.length+' of '+defs.length+'</span></h3><div class="badges">'+cells+'</div></div>';
}
function renderCardio(){
  refreshDate();
  var rr=runRhythm(),tgt=nextRunTarget(),runs=allRuns();
  var inBlock=tgt.restart?0:(rr.count%3),toNext=3-inBlock;
  var L=cardioLevel();
  var h='<div class="head"><div><div class="date">Level '+L.lvl+' &middot; '+(L.trend==="up"?"building":L.trend==="flat"?"holding":"easing off")+'</div><div class="title">Cardio</div></div></div>';
  /* Top card mirrors Today: one headline, one call to action, nothing to read first. */
  h+='<div class="hero"><div class="lbl">Next run</div><h2>'+(tgt.restart?"Ease back in":"Easy")+' &middot; '+tgt.mi+' mi</h2>'+
    '<div class="meta">'+(rr.gap===0?"You already ran today.":runStatusLine(rr))+'</div>'+
    '<button class="big-start" onclick="runSheet('+tgt.mi+')">'+I.run+' Start a run</button>'+
    '<div class="herorow"><button class="wbtn" onclick="actSheet(\'walk\')">Log a walk</button>'+
    '<button class="wbtn" onclick="scrollToWarm()">Warm up first</button></div></div>';
  /* The level system replaces the old wordy "where you are" card. */
  h+='<div class="card lcard"><div class="lwrap">'+levelRingHTML(L)+
    '<div class="lmeta"><div class="lt">'+Math.round(L.into)+' / '+Math.round(L.span)+' to level '+(L.lvl+1)+'</div>'+
    '<div class="ld">'+levelCaption(L)+'</div>'+
    '<div class="lstats"><span><b class="num">'+runs.length+'</b> runs</span><span><b class="num">'+runs.reduce(function(a,s){return a+(s.distanceMi||0);},0).toFixed(0)+'</b> mi</span><span><b class="num">'+(rr.gap===null?"--":rr.gap+"d")+'</b> since</span></div></div></div>'+
    fitnessSpark(L)+
    '<div class="foot" style="margin-top:6px">Your level tracks a rolling average of what you actually do, so a quiet week bends it gently rather than taking points away.</div></div>';
  /* Warm-up sits high on the page, directly after the call to action, because it only works as
     a prompt if you meet it on the way out the door rather than below the history. */
  h+='<div id="warmblock"></div>'+guidedHTML("runwarm","Warm up first","Five to ten minutes before you head out. This is the part that keeps you running.",1);
  h+=paceZonesHTML();
  h+=badgeList();
  if(runs.length){var rec=runs.slice(-5).reverse().map(function(s){return '<div class="arow"><span class="an">'+shortDate(s.date)+'<div style="font-size:12px;color:var(--faint);font-weight:500">'+(s.rpe?esc(s.rpe):"easy")+'</div></span><span class="ad">'+(s.distanceMi||0)+' mi'+(s.paceSecPerMi?' &middot; '+mmss(s.paceSecPerMi)+'/mi':'')+'</span></div>';}).join("");
    h+='<div class="card"><h3>Recent runs <span class="t">last '+Math.min(5,runs.length)+'</span></h3>'+rec+'</div>';}
  var hist=weeklyMiHistory();
  h+=barChart("Weekly miles","last "+hist.length+" weeks",hist,
      hist.map(function(v,i){return i===hist.length-1?"now":"";}),
      function(v){return v.toFixed(1);},"mi");
  h+='<div class="card"><h3>Walk <span class="t">counts as a day</span></h3>'+
    '<div class="anote" style="margin-top:0;padding-top:0;border-top:0">Easy movement on non-run days keeps the base building and costs you no recovery.</div>'+
    '<button class="big-start" style="margin-top:12px" onclick="actSheet(\'walk\')">'+I.run+' Log a walk</button>'+
    '<div style="display:flex;gap:8px;margin-top:8px"><button class="wbtn" style="flex:1" onclick="logWalkQuick(15)">Quick 15</button><button class="wbtn" style="flex:1" onclick="logWalkQuick(30)">Quick 30</button></div></div>';
  h+=guidedHTML("recovery","Cool down after","Stretch while you are still warm, not an hour later.",5);
  h+='<div class="foot">This adapts to how often you actually run, not a fixed calendar plan. Every mile easy - base before speed.</div>';
  h+=libraryHTML("cardio");
  document.getElementById("v-cardio").innerHTML=h;
}

/* ============ boot ============ */
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
function maybeNagBackup(){if(!S.sessions.length)return;var last=S.profile.lastBackup;var days=last?((new Date(TODAY)-new Date(last))/86400000):999;if(days>14)toast("Time to back up your data (Track, then Export).",function(){exportSheet();});}
applyTheme();
if(!S.profile.setup){firstRun();}
document.addEventListener("visibilitychange",function(){var woOn=document.getElementById("v-workout").classList.contains("on");if(document.hidden){if(woOn)woFreeze();}else{refreshDate();if(woOn)woResume();else if(document.getElementById("v-today").classList.contains("on"))renderToday();}});
renderToday();
setTimeout(maybeNagBackup,1500);
</script>
<script src="train-sync-auto.js"></script>
</body>
