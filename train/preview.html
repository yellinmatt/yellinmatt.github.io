<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- frame-src is youtube-nocookie only, and img-src deliberately does NOT include i.ytimg.com:
     remote thumbnails would ping Google on every library render. The facades are drawn locally,
     so nothing reaches YouTube until you actually tap play on a specific video. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; frame-src https://www.youtube-nocookie.com; connect-src https://train-sync.yellinmatt.workers.dev; form-action 'none'; base-uri 'none'">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Train">
<meta name="theme-color" content="#F7F8FA" id="theme-color">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Train</title>
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#EEF0F3; --raise:#FFFFFF;
  --ink:#0E1116; --sub:#616875; --faint:#767C86; --white:#FFFFFF;
  --line:#E7E9ED; --line-2:#D8DCE2;
  --accent:#FF4E2B; --accent-press:#E63E1E; --accent-tint:#FFE9E3;
  --good:#12A150; --good-tint:#E4F6EC; --amber:#B7791F; --amber-tint:#FBF1DD;
  --nav-bg:rgba(245,246,248,.86); --restbar-bg:#14181E; --restbar-ink:#FFFFFF; --on-good:#FFFFFF; --scrim:rgba(16,17,22,.42);
  --shadow:0 1px 2px rgba(16,17,22,.04), 0 3px 12px rgba(16,17,22,.06);
  --shadow-lg:0 12px 44px rgba(16,17,22,.18);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --r-card:16px; --r-btn:14px; --r-field:11px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0D11; --surface:#14181E; --surface-2:#1E242C; --raise:#191E25;
    --ink:#F3F5F8; --sub:#9BA3AF; --faint:#6B7079; --white:#FFFFFF;
    --line:#242A32; --line-2:#30363F;
    --accent:#FF5C3A; --accent-press:#FF7053; --accent-tint:#3A1E17;
    --good:#34D399; --good-tint:#12271E; --amber:#F0C36B; --amber-tint:#2A2213;
    --nav-bg:rgba(11,13,17,.86); --restbar-bg:#1E242C; --restbar-ink:#FFFFFF; --on-good:#FFFFFF; --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.45);
    --shadow-lg:0 16px 52px rgba(0,0,0,.6);
  }
}
html[data-theme="dark"]{
  --bg:#0B0D11; --surface:#14181E; --surface-2:#1E242C; --raise:#191E25;
  --ink:#F3F5F8; --sub:#9BA3AF; --faint:#6B7079; --white:#FFFFFF;
  --line:#242A32; --line-2:#30363F;
  --accent:#FF5C3A; --accent-press:#FF7053; --accent-tint:#3A1E17;
  --good:#34D399; --good-tint:#12271E; --amber:#F0C36B; --amber-tint:#2A2213;
  --nav-bg:rgba(11,13,17,.86); --restbar-bg:#1E242C; --restbar-ink:#FFFFFF; --on-good:#FFFFFF; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.45);
  --shadow-lg:0 16px 52px rgba(0,0,0,.6);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;overscroll-behavior-y:none;padding-top:env(safe-area-inset-top);min-height:100vh}
button,input,select{font-family:inherit;color:inherit;font-size:16px}
button{touch-action:manipulation;border:0;background:none;cursor:pointer}
input,select{border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:540px;margin:0 auto;padding:0 16px calc(92px + env(safe-area-inset-bottom));position:relative}
.view{display:none}
.view.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* header */
.head{display:flex;align-items:center;justify-content:space-between;padding:16px 2px 12px;gap:10px}
.head .date{font-size:13.5px;font-weight:600;color:var(--sub)}
.head .title{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:1px}
.head .tools{display:flex;align-items:center;gap:8px}
.iconbtn{width:38px;height:38px;border-radius:11px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:var(--sub)}
.iconbtn:active{background:var(--surface-2)}
.iconbtn svg{width:19px;height:19px}
.streak{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 13px 8px 11px;box-shadow:var(--shadow)}
.streak svg{width:16px;height:16px;color:var(--accent)}
.streak.zero svg{color:var(--faint)}
.streak b{font-size:15px;font-weight:800}.streak span{font-size:12px;font-weight:600;color:var(--sub)}

/* hero */
.hero{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);padding:20px;margin-bottom:12px;border:1px solid var(--line);position:relative}
.hero .chg{position:absolute;top:14px;right:14px;height:34px;padding:0 12px;gap:6px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--sub)}
.hero .chg span{font-size:13px;font-weight:700}
.hero .chg svg{width:17px;height:17px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.hero h2{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:8px 0 5px;padding-right:92px}
.hero .meta{font-size:14.5px;color:var(--sub);font-weight:500}.hero .meta b{color:var(--ink);font-weight:600}
.big-start{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;height:56px;margin-top:18px;background:var(--accent);color:var(--white);border-radius:var(--r-btn);font-size:18px;font-weight:700;box-shadow:0 6px 18px rgba(255,78,43,.26)}
.big-start:active{background:var(--accent-press);transform:translateY(1px)}
.big-start svg{width:20px;height:20px}
.big-start.ghost{background:var(--surface-2);color:var(--ink);box-shadow:none}
.done-pill{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;margin-top:18px;background:var(--good-tint);color:var(--good);border-radius:var(--r-btn);font-size:16px;font-weight:700}
.done-pill svg{width:18px;height:18px}

/* progress ring inline (anchor) */
.miniring{width:34px;height:34px;flex:none}
.miniring svg{transform:rotate(-90deg)}

/* week dots */
.dots-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:15px 12px;margin-bottom:12px}
.dots{display:flex;justify-content:space-between}
.dot{display:flex;flex-direction:column;align-items:center;gap:7px;flex:1}
.dot .dw{font-size:11px;font-weight:700;color:var(--faint)}
.dot .di{width:30px;height:30px;border-radius:50%;background:var(--surface-2);color:var(--faint);display:flex;align-items:center;justify-content:center}
.dot .di svg{width:15px;height:15px}
.dot.done .di{background:var(--accent);color:var(--white)}
.dot.today .di{background:var(--surface);border:2px solid var(--accent);color:var(--accent)}
.dot.today.done .di{background:var(--accent);border-color:var(--accent);color:var(--white)}
.dot.today .dw{color:var(--accent)}
.dot.rest .di{background:transparent;border:1px dashed var(--line-2)}
/* Days still to come show their icon quietly; days already past without a session show it
   fainter still, so the week reads as a plan rather than a row of empty holes. */
.dot.ahead .di{opacity:.72}
.dot.missed .di{opacity:.4}

/* generic card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:12px}
.card h3,.trend h3{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 .t,.trend h3 .t{font-size:12px;font-weight:600;color:var(--sub);text-transform:none;letter-spacing:0}
.card h3 .t b{color:var(--accent);font-weight:800}
.arow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none}
.arow:last-child{border-bottom:0;padding-bottom:2px}
.arow:active{background:var(--surface-2)}
.arow .an{flex:1;font-size:15px;font-weight:500;color:var(--ink)}
.arow .ad{font-size:12px;font-weight:600;color:var(--sub);font-variant-numeric:tabular-nums}
.arow.checked .an{color:var(--faint)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-2);flex:none;display:flex;align-items:center;justify-content:center;transition:.15s}
.chk svg{width:13px;height:13px;opacity:0;transition:.15s}
.checked .chk{background:var(--accent);border-color:var(--accent);color:var(--white)}
.checked .chk svg{opacity:1}
.anote{font-size:13px;line-height:1.5;color:var(--sub);margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.anote b{color:var(--accent);font-weight:700}
.weighrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.weighrow .wcur{font-size:14px;color:var(--sub);font-weight:600}.weighrow .wcur b{color:var(--ink);font-weight:800;font-size:18px}
.wbtn{background:var(--surface-2);border-radius:10px;height:40px;padding:0 15px;font-size:14px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.wbtn svg{width:15px;height:15px;flex:none}
.wbtn.accent{background:var(--accent);color:var(--white)}
.wbtn:disabled{opacity:.4}
.wknav{display:flex;gap:8px;margin:6px 0 10px}
.wknav .wbtn{flex:1;height:36px;font-weight:600}
.arow.sel{background:var(--surface-2)}

/* workout player */
.ptop{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;
  padding:calc(14px + env(safe-area-inset-top)) 16px 12px;margin:0 -16px 2px}
.ptop .back{display:flex;align-items:center;gap:3px;font-size:15px;font-weight:600;color:var(--sub)}
.ptop .back svg{width:19px;height:19px}
.ptop .mid{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.ptop .fin{font-size:15px;font-weight:700;color:var(--accent)}
.warmcard{background:var(--surface-2);border-radius:var(--r-card);padding:12px 15px;margin-bottom:12px;font-size:13px;line-height:1.5;color:var(--sub)}
.warmcard b{color:var(--ink);font-weight:600}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:15px 15px 9px;margin-bottom:12px}
.ex .exhead{display:flex;align-items:flex-start;gap:10px;margin-bottom:3px}
.ex .exname{font-size:18px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0}
.ex .more{width:32px;height:32px;border-radius:9px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--sub);flex:none;margin-top:-2px}
.ex .more svg{width:18px;height:18px}
.aim{font-size:12.5px;color:var(--sub);font-weight:500;margin-bottom:6px}
.aim b{color:var(--accent);font-weight:700}
.colhead{display:grid;grid-template-columns:26px 1fr 1fr 54px 42px;gap:6px;padding:6px 2px 2px}
.colhead span{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);text-align:center}
.set{display:grid;grid-template-columns:26px 1fr 1fr 54px 42px;gap:6px;align-items:center;padding:5px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}
.set .sn{width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--sub);margin:0 auto}
.set.on .sn{background:var(--accent-tint);color:var(--accent)}
.stp{display:flex;align-items:center;background:var(--surface-2);border-radius:10px;height:42px;overflow:hidden}
.set.on .stp{background:var(--accent-tint)}
/* per-set stopwatch button */
.tick.sw{width:auto;min-width:52px;padding:0 9px;background:var(--surface-2);color:var(--sub)}
.tick.sw .swt{font-size:11.5px;font-weight:700;letter-spacing:.02em}
.tick.sw.had{color:var(--faint)}
.tick.sw.run{background:var(--accent);color:var(--white)}
.stp button{width:34px;height:42px;font-size:20px;font-weight:600;color:var(--sub);flex:none;display:flex;align-items:center;justify-content:center}
.stp button:active{background:rgba(0,0,0,.06)}
.stp .val{flex:1;text-align:center;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;min-width:0;padding:0}
.stp .val:focus-visible{outline:none}
.stp .u{font-size:10px;color:var(--faint);font-weight:600;padding-right:8px}
.bwtag{height:42px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--sub)}
.tick{width:42px;height:42px;border-radius:10px;border:2px solid var(--line-2);display:flex;align-items:center;justify-content:center;margin-left:auto}
.tick svg{width:17px;height:17px;opacity:0}
.set.on .tick{background:var(--accent);border-color:var(--accent);color:var(--white);animation:pop .25s ease}
.set.on .tick svg{opacity:1}
.set.on .val{color:var(--accent)}
.setbtns{display:flex;gap:8px;margin:6px 0 6px}
.setbtn{flex:1;padding:9px;border:1px dashed var(--line-2);border-radius:10px;font-size:12.5px;font-weight:600;color:var(--sub)}
.setbtn:active{background:var(--surface-2)}
.setbtn.rm{border-style:solid;color:var(--faint)}

/* rest bar */
.restbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--restbar-bg);color:var(--restbar-ink);
  padding:14px 16px calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;
  box-shadow:0 -6px 24px rgba(0,0,0,.18);transform:translateY(120%);transition:transform .28s cubic-bezier(.4,0,.2,1)}
.restbar.on{transform:none}
.restbar .rt{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;min-width:60px}
.restbar .rlab{font-size:10.5px;font-weight:600;opacity:.7;text-transform:uppercase;letter-spacing:.05em}
.restbar .bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.restbar .bar i{display:block;height:100%;background:var(--accent);width:100%}
.restbar.warn .bar i{background:var(--good)}
.restbar .rb{font-size:13px;font-weight:700;padding:11px 12px;border-radius:9px;background:rgba(255,255,255,.14);min-width:44px}
.restbar .rb:active{background:rgba(255,255,255,.26)}
.restbar .skip{color:var(--accent);background:none;padding:11px 8px}

/* run */
.runhero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:22px 20px;text-align:center;margin-bottom:12px}
.runhero .rd{font-size:54px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.runhero .rd small{font-size:19px;font-weight:700;color:var(--sub);letter-spacing:0}
.runhero .pace{display:inline-flex;align-items:center;gap:7px;margin-top:14px;background:var(--accent-tint);color:var(--accent);border-radius:999px;padding:9px 15px;font-size:13.5px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.runhero .pace svg{width:15px;height:15px;flex:none}
.runstruct .rs{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.runstruct .rs:last-child{border-bottom:0}
.runstruct .rs .n{width:24px;height:24px;border-radius:7px;background:var(--surface-2);font-size:12px;font-weight:700;color:var(--sub);display:flex;align-items:center;justify-content:center;flex:none}
.runstruct .rs b{font-weight:600}

/* sheet */
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);display:none;align-items:flex-end;justify-content:center}
.scrim.on{display:flex;animation:fade .18s ease}
.sheet{width:100%;max-width:540px;background:var(--surface);border-radius:22px 22px 0 0;padding:8px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:var(--shadow-lg);animation:up .26s cubic-bezier(.4,0,.2,1);max-height:88vh;overflow-y:auto}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line-2);margin:8px auto 14px}
.sheet h3{font-size:20px;font-weight:800;letter-spacing:-.01em;text-align:center;margin-bottom:3px}
.sheet .ssub{text-align:center;color:var(--sub);font-size:13.5px;margin-bottom:16px}
.opt{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--line);background:none}
.opt:last-of-type{border-bottom:0}
.opt:active{background:var(--surface-2)}
.opt .oi{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--sub);flex:none}
.opt .oi svg{width:18px;height:18px}
.opt .on2{font-size:15px;font-weight:600}.opt .oc{font-size:12.5px;color:var(--sub)}
.opt.danger .on2{color:var(--accent)}
.opt .oar{margin-left:auto;color:var(--faint)}.opt .oar svg{width:18px;height:18px}
.logrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.logrow label{font-size:15px;font-weight:600}
.stp.sheetstp{max-width:170px;flex:1}
.inp{background:var(--surface-2);border-radius:10px;height:44px;display:flex;align-items:center;padding:0 14px;gap:4px}
.inp input{width:78px;text-align:right;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}.inp .u{font-size:13px;color:var(--faint);font-weight:600}
.paceout{text-align:center;padding:14px 0 4px;font-size:13px;color:var(--sub)}
.paceout b{font-size:26px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;display:block;letter-spacing:-.02em}
.rpe{display:flex;gap:8px;margin:14px 0 4px}
.rpe button{flex:1;height:44px;border-radius:11px;background:var(--surface-2);font-size:14px;font-weight:700;color:var(--sub)}
.rpe button.sel{background:var(--accent-tint);color:var(--accent)}
.seg{display:flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;height:38px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--sub)}
.seg button.sel{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tin{width:100%;background:var(--surface-2);border-radius:10px;height:44px;padding:0 14px;font-size:15px;font-weight:600}
.ta{width:100%;background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:13px;font-weight:500;font-family:var(--sans);min-height:120px;resize:vertical;line-height:1.5}
.sheet-cta{width:100%;height:54px;margin-top:16px;background:var(--accent);color:var(--white);border-radius:var(--r-btn);font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:9px}
/* Without this the inline icon inherits no size and expands to fill the button. */
.sheet-cta svg{width:18px;height:18px;flex:0 0 18px}
.sheet-cta:active{background:var(--accent-press)}
.sheet-cta.ghost{background:var(--surface-2);color:var(--ink);margin-top:8px}
.celebrate{text-align:center;padding:6px 0 0}
.celebrate .ring{width:76px;height:76px;border-radius:50%;background:var(--accent-tint);display:flex;align-items:center;justify-content:center;margin:4px auto 12px;animation:pop .4s ease}
.celebrate .ring svg{width:36px;height:36px;color:var(--accent)}
.sumgrid{display:flex;justify-content:center;gap:20px;margin:14px 0 4px}
.sumgrid .sg{text-align:center}.sumgrid .sg b{display:block;font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}.sumgrid .sg span{font-size:12px;color:var(--sub);font-weight:600}
.prbadge{display:flex;align-items:center;gap:8px;justify-content:center;background:var(--amber-tint);color:var(--amber);border-radius:11px;padding:10px;font-size:13.5px;font-weight:700;margin-top:12px}
.prbadge svg{width:17px;height:17px}

/* week / progress */
.ringcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:20px;margin-bottom:12px;display:flex;align-items:center;gap:20px}
.ringcard.complete{border-color:var(--accent)}
.ringwrap{position:relative;width:100px;height:100px;flex:none}.ringwrap svg{transform:rotate(-90deg)}
.ringwrap .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringwrap .ctr b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}.ringwrap .ctr span{font-size:11px;font-weight:600;color:var(--sub)}
.rmeta .rt{font-size:16px;font-weight:700}.rmeta .rd{font-size:13px;color:var(--sub);margin-top:3px;line-height:1.5}
.mibar{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:6px}.mibar i{display:block;height:100%;background:var(--accent)}
.weeklist .wl{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none}
.weeklist .wl:last-child{border-bottom:0}.weeklist .wl:active{background:var(--surface-2)}
.weeklist .wl.today{border-radius:10px;background:var(--accent-tint);padding-left:8px;padding-right:8px}
.weeklist .wl .wd{width:38px;font-size:13px;font-weight:700;color:var(--sub)}.weeklist .wl.today .wd{color:var(--accent)}
.weeklist .wl .ic{width:32px;height:32px;border-radius:9px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--sub)}
.weeklist .wl .ic svg{width:16px;height:16px}
.weeklist .wl.done .ic{background:var(--accent-tint);color:var(--accent)}
.weeklist .wl .wn{flex:1;font-size:14.5px;font-weight:600}.weeklist .wl .wt{font-size:12px;color:var(--sub);font-weight:600}
.stattiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 15px}
.stat .sl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--faint)}
.stat .sv{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:5px;font-variant-numeric:tabular-nums}.stat .sv small{font-size:13px;color:var(--sub);font-weight:700}
.stat .st{font-size:11.5px;font-weight:600;margin-top:2px;color:var(--good)}.stat .st.flat{color:var(--sub)}
.trend{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:16px 16px 10px;margin-bottom:12px}
.prlist .pr{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.prlist .pr:last-child{border-bottom:0}
.prlist .pr .pn{flex:1;font-size:14.5px;font-weight:600}.prlist .pr .pv{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}.prlist .pr .pd{font-size:11px;color:var(--faint);font-weight:600;width:64px;text-align:right}

/* library */
.sectlbl{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin:14px 2px 9px}
/* B2 weigh dial */
.wdial{display:flex;align-items:center;justify-content:center;gap:14px;margin:14px 0 2px}
.wdb{width:52px;height:52px;flex:0 0 52px;border-radius:50%;background:var(--surface-2);color:var(--text);font-size:26px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center}
.wdb:active{background:var(--accent-tint);color:var(--accent)}
.wbig{width:150px;text-align:center;font-size:44px;font-weight:800;letter-spacing:-.03em;background:transparent;border:0;color:var(--text);padding:0}
.wunit{text-align:center;font-size:13px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:16px}
.wunit b{font-weight:800}
/* exercise lookup, collapsed by default */
.libdrop{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin:12px 0 6px;overflow:hidden}
.libdrop>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 16px;font-size:14.5px;font-weight:700}
.libdrop>summary::-webkit-details-marker{display:none}
.libdrop>summary .lcount{font-size:11px;font-weight:700;color:var(--faint);background:var(--surface-2);border-radius:7px;padding:3px 8px}
.libdrop[open]>summary{border-bottom:1px solid var(--line)}
.libdrop .libsearch{margin:12px 14px 4px;width:calc(100% - 28px)}
.libdrop .sectlbl,.libdrop .libgrid{margin-left:14px;margin-right:14px}
.libpad{padding:4px 14px 12px}
.libpad .sectlbl:first-child{margin-top:8px}
.libdrop .libgrid{margin-bottom:12px}
/* press-play video cards */
.vrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.vcard.wide{grid-column:1/-1}
.vface,.vframe{display:block;width:100%;aspect-ratio:16/9;border:0}
/* Facades are drawn locally rather than pulled from ytimg, so they get their identity from a
   per-category wash instead of a thumbnail. Thirteen identical cards would read as a wall. */
.vface{background:linear-gradient(140deg,var(--surface-2),var(--accent-tint));display:flex;align-items:center;justify-content:center}
.vcard[data-c="strength"] .vface{background:linear-gradient(140deg,var(--accent-tint),var(--surface-2))}
.vcard[data-c="core"] .vface{background:linear-gradient(155deg,var(--surface-2) 20%,var(--amber-tint))}
.vcard[data-c="mobility"] .vface{background:linear-gradient(120deg,var(--good-tint),var(--surface-2))}
.vcard[data-c="yoga"] .vface{background:linear-gradient(200deg,var(--surface-2),var(--good-tint))}
.vcard[data-c="recovery"] .vface{background:linear-gradient(160deg,var(--amber-tint),var(--surface-2))}
.vcard[data-c="meditation"] .vface{background:linear-gradient(180deg,var(--surface-2),var(--line))}
.vface:active{filter:brightness(.94)}
.vplay{width:46px;height:46px;border-radius:50%;background:var(--surface);color:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.vplay svg{width:20px;height:20px;margin-left:2px}
.vmeta{padding:10px 12px 12px}
.vmeta .vt{font-size:13.5px;font-weight:700;line-height:1.3}
.vmeta .va{font-size:11.5px;color:var(--sub);font-weight:600;margin-top:3px;line-height:1.4}
.vmeta .va a{color:var(--accent);text-decoration:none;font-weight:700}
/* shared bar chart */
.bwrap{position:relative;margin-top:6px}
.brow{display:flex;align-items:flex-end;gap:5px;min-height:calc(var(--bh) + 34px)}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}
.bcol i{display:block;width:70%;border-radius:3px 3px 2px 2px;background:var(--surface-2)}
.bcol i.on{background:var(--accent)}
.bcol i.zero{background:var(--line);border-radius:2px}
.bcol .bv{font-size:10px;font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums;min-height:12px}
.bcol .bv.on{color:var(--accent)}
.bcol .bx{font-size:10px;font-weight:700;color:var(--faint);min-height:12px}
.bmean{position:absolute;left:0;right:0;border-top:1px dashed var(--line-2);pointer-events:none}
.bmean span{position:absolute;right:0;top:-14px;font-size:10px;font-weight:700;color:var(--faint);background:var(--surface);padding:0 3px}
/* Lift: program rotation + movements (Round D) */
.prow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow .pl{width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:var(--surface-2);color:var(--sub);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
.prow.next .pl{background:var(--accent);color:var(--white)}
.prow .pm{flex:1;min-width:0}
.prow .pn{font-size:14.5px;font-weight:700}
.prow .pd{font-size:12px;color:var(--faint);font-weight:600;margin-top:1px}
.prow .ptag{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);background:var(--accent-tint);border-radius:6px;padding:4px 8px}
.mrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
.mrow .mi{width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:var(--surface-2);color:var(--sub);display:flex;align-items:center;justify-content:center}
.mrow .mi svg{width:16px;height:16px}
.mrow .mm{flex:1;min-width:0}
.mrow .mn{display:block;font-size:14px;font-weight:700;line-height:1.25}
.mrow .md{display:block;font-size:11.5px;color:var(--faint);font-weight:600;margin-top:2px}
.mrow .mv{text-align:right;flex:0 0 auto}
.mrow .mw{display:block;font-size:13px;font-weight:800}
.mrow .mp{display:block;font-size:10.5px;font-weight:700;color:var(--accent);margin-top:2px}
.msum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 4px}
.msum .ms{background:var(--surface-2);border-radius:12px;padding:12px 10px;text-align:center}
.msum .ms b{display:block;font-size:17px;font-weight:800;letter-spacing:-.01em}
.msum .ms span{display:block;font-size:10.5px;font-weight:600;color:var(--faint);margin-top:3px}
.msp{display:block;width:100%;height:42px;margin-top:12px}
/* Cardio level system (Round C) */
.herorow{display:flex;gap:8px;margin-top:10px}
.herorow .wbtn{flex:1}
.lcard{padding-bottom:14px}
.lwrap{display:flex;align-items:center;gap:16px}
.lring{flex:0 0 104px}
.lmeta{min-width:0}
.lmeta .lt{font-size:14.5px;font-weight:800;letter-spacing:-.01em}
.lmeta .ld{font-size:12.5px;color:var(--sub);line-height:1.5;margin-top:3px}
.lstats{display:flex;gap:14px;margin-top:9px}
.lstats span{font-size:11.5px;font-weight:600;color:var(--faint)}
.lstats b{font-size:15px;font-weight:800;color:var(--ink);display:block;line-height:1.1}
.lspark{display:block;width:100%;height:30px;margin-top:12px}
/* badges */
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:4px}
.badge{text-align:center;opacity:.4}
.badge.got{opacity:1}
.badge .bdot{width:42px;height:42px;margin:0 auto;border-radius:50%;background:var(--surface-2);color:var(--faint);display:flex;align-items:center;justify-content:center;border:1px dashed var(--line-2)}
.badge.got .bdot{background:var(--accent-tint);color:var(--accent);border:0}
.badge .bdot svg{width:19px;height:19px}
.badge .bn{font-size:11px;font-weight:700;margin-top:6px;line-height:1.2}
.badge .bd{font-size:10px;font-weight:600;color:var(--faint);margin-top:2px;line-height:1.25}
/* pace zones */
.zrow{padding:11px 0;border-top:1px solid var(--line)}
.zrow:first-of-type{border-top:0}
.zhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.zhead .zn{font-size:14px;font-weight:700}
.zhead .zp{font-size:13px;font-weight:700;color:var(--sub)}
.ztrack{position:relative;height:8px;border-radius:4px;background:var(--surface-2);margin:7px 0 5px}
.ztrack i{position:absolute;top:0;height:8px;border-radius:4px;background:var(--accent);opacity:.35}
.zrow[data-z="easy"] .ztrack i{background:var(--good);opacity:1}
.zrow[data-z="long"] .ztrack i{background:var(--good);opacity:.55}
.zrow[data-z="steady"] .ztrack i{background:var(--amber);opacity:.8}
.zrow[data-z="tempo"] .ztrack i{background:var(--accent);opacity:.8}
.znote{font-size:11.5px;font-weight:600;color:var(--faint)}
/* KPI scorecard (Round B) */
.ksub{font-size:12.5px;color:var(--sub);line-height:1.5;margin:2px 0 14px}
.kpi{display:block;width:100%;text-align:left;padding:11px 0;border-top:1px solid var(--line)}
.kpi:first-of-type{border-top:0;padding-top:2px}
.kpi[data-rag="good"]{--rag:var(--good)}
.kpi[data-rag="amber"]{--rag:var(--amber)}
.kpi[data-rag="red"]{--rag:var(--accent)}
.kpi[data-rag="none"]{--rag:var(--faint)}
.kpi .bullet{display:block;width:100%;height:14px;margin:7px 0 5px}
.kpi .bullet rect.val{fill:var(--rag)}
.krow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.krow .kl{font-size:14px;font-weight:700}
.krow .kv{font-size:16px;font-weight:800;letter-spacing:-.01em}
.krow .kv small{font-size:11.5px;font-weight:700;color:var(--faint)}
.kfoot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ktag{color:var(--rag);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.khint{font-size:11px;font-weight:600;color:var(--faint)}
.kstrip{display:flex;gap:2px;margin-top:8px}
.kstrip i{flex:1;height:8px;border-radius:1px;background:var(--surface-2)}
.kstrip i:first-child{border-radius:3px 1px 1px 3px}.kstrip i:last-child{border-radius:1px 3px 3px 1px}
.kstrip i[data-l="1"]{background:var(--line-2)}
.kstrip i[data-l="2"]{background:var(--rag,var(--accent));opacity:.35}
.kstrip i[data-l="3"]{background:var(--rag,var(--accent));opacity:.65}
.kstrip i[data-l="4"]{background:var(--rag,var(--accent))}
.klegend{display:flex;align-items:center;gap:4px;margin-top:14px;font-size:10.5px;font-weight:600;color:var(--faint)}
.klegend i{width:12px;height:8px;border-radius:2px;background:var(--surface-2)}
.klegend i[data-l="1"]{background:var(--line-2)}
.klegend i[data-l="2"]{background:var(--accent);opacity:.35}
.klegend i[data-l="3"]{background:var(--accent);opacity:.65}
.klegend i[data-l="4"]{background:var(--accent)}
/* weight trend card */
.wtop{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 2px}
.wtop .wbig{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.wtop .wbig small{font-size:14px;font-weight:700;color:var(--faint)}
.wtop .wwhen{font-size:11.5px;font-weight:600;color:var(--faint);margin-top:5px}
.wtop .wgoal{font-size:13px;font-weight:600;color:var(--sub);text-align:right}
.wtop .wgoal b{color:var(--accent);font-weight:800;font-size:15px}
.wchart{margin:12px 0 4px}
.wchart svg{display:block;width:100%;height:112px}
.wlegend{display:flex;justify-content:space-between;font-size:10.5px;font-weight:600;color:var(--faint);margin-top:5px}
.wstate{font-size:15px;font-weight:800;margin-top:8px}
.wstate[data-s="down"]{color:var(--good)}
.wstate[data-s="up"]{color:var(--accent)}
.wstate[data-s="flat"],.wstate[data-s="thin"],.wstate[data-s="stale"]{color:var(--sub)}
.wsub{font-size:13px;color:var(--sub);line-height:1.5;margin-top:3px}
/* B5 body dashboard */
.bhero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px 16px 16px;margin-bottom:12px}
.bhero .bnum{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.bhero .bnum small{font-size:15px;font-weight:700;color:var(--faint);margin-left:3px}
.bhero .brow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.bhero .bside{text-align:right;font-size:12.5px;font-weight:600;color:var(--sub);line-height:1.5}
.bhero .bside b{color:var(--accent);font-weight:800}
.stat.pend{opacity:.55}
.stat.pend .sv{color:var(--faint)}
.ptog{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;background:var(--surface-2);border-radius:13px;margin-top:10px}
.ptog .pc{width:26px;height:26px;flex:0 0 26px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:transparent;display:flex;align-items:center;justify-content:center}
.ptog .pc svg{width:16px;height:16px}
.ptog.on{background:var(--good-tint)}
.ptog.on .pc{background:var(--good);border-color:var(--good);color:var(--on-good)}
.ptog .pt{font-size:14.5px;font-weight:700}
.ptog .ps{font-size:12.5px;color:var(--sub);font-weight:600;margin-top:1px}
.glist{margin-top:2px}
.grow{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.grow:last-child{border-bottom:0}
.grow .gi{width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:var(--accent-tint);color:var(--accent);display:flex;align-items:center;justify-content:center}
.grow .gi svg{width:16px;height:16px}
.grow .gt{font-size:14px;font-weight:700;line-height:1.3}
.grow .gd{font-size:12.5px;color:var(--sub);line-height:1.45;margin-top:2px}
.grow .gd b{color:var(--text);font-weight:700}
.lib a,.lib .lg{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:9px;color:inherit;text-decoration:none}
.lib a:active{background:var(--surface-2)}
.lib .li{width:38px;height:38px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--sub);flex:none}
.lib .li.acc{background:var(--accent-tint);color:var(--accent)}
.lib .li svg{width:18px;height:18px}
.lib .ln{font-size:14.5px;font-weight:700}.lib .lc{font-size:12px;color:var(--sub);font-weight:500;margin-top:1px}
.lib .lar{margin-left:auto;color:var(--faint)}.lib .lar svg{width:17px;height:17px}
.lib .tag{font-size:10px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.03em;background:var(--surface-2);border-radius:6px;padding:3px 6px;margin-left:auto}

/* settings */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .sk{font-size:15px;font-weight:600}.setrow .skc{font-size:12px;color:var(--sub);margin-top:1px}

/* toast */
.toast{position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:60;max-width:508px;margin:0 auto;
  background:var(--restbar-bg);color:var(--restbar-ink);border-radius:13px;padding:13px 16px;display:none;align-items:center;gap:12px;box-shadow:var(--shadow-lg);animation:up .24s ease}
.toast.on{display:flex}
.toast .tm{flex:1;font-size:14px;font-weight:600}
.toast .tu{color:var(--accent);font-weight:800;font-size:14px;padding:4px 6px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--nav-bg);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--line);display:flex;justify-content:center;gap:2px;padding:7px 8px calc(7px + env(safe-area-inset-bottom))}
.nav.hide{display:none}
.nav button{flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;color:var(--faint)}
.nav button svg{width:22px;height:22px}.nav button span{font-size:10px;font-weight:700}
.nav button.on{color:var(--accent)}
.foot{text-align:center;font-size:11.5px;color:var(--faint);padding:16px 8px 6px;line-height:1.6}
.genrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.genrow:last-child{border-bottom:0}
.genrow .gi{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--sub);flex:none}
.genrow .gi svg{width:18px;height:18px}
.genrow .gt{flex:1;min-width:0}.genrow .gn{font-size:15px;font-weight:700}.genrow .gc{font-size:12px;color:var(--sub);margin-top:1px}

/* ============ EQUIPMENT PER SESSION (Round D) ============
   Equipment is a property of the session, not of you. A global "bodyweight or dumbbell" mode was
   wrong because a Monday with dumbbells and a Thursday without are the same person in a different
   room, and a mixed session had nowhere to live at all. So each built session carries its own
   equipment list; the profile only supplies the default for the next one. Any single movement can
   still be swapped inside the workout, which is what makes mixed sessions work. */
function defaultEquip(){var e=(S.profile.equip||["BW"]).slice();if(!e.length)e=["BW"];return e;}
function sessionEquip(w){w=w||S.wk[TODAY];return (w&&w.equip&&w.equip.length)?w.equip:defaultEquip();}
function hasDB(eq){return (eq||[]).indexOf("DB")>=0;}
function trainMode(w){return hasDB(sessionEquip(w))?"db":"bw";}
function slotEx(sl,eq){
  var db=hasDB(eq||defaultEquip());
  var id=(db&&sl.db)?sl.db:sl.bw;return LIB[id]?id:sl.bw;
}
function equipLabel(eq){
  eq=eq||defaultEquip();
  var names={DB:"dumbbells",BW:"bodyweight",band:"bands",bar:"pull-up bar"};
  var out=eq.map(function(k){return names[k]||k;});
  if(out.length===1)return out[0];
  if(out.length===2)return out[0]+" and "+out[1];
  return out.slice(0,-1).join(", ")+" and "+out[out.length-1];
}
/* Change the kit for THIS session only, and rebuild it around what is actually in the room. */
function equipSheet(){
  var cur=sessionEquip().slice();
  var opts=[["BW","Bodyweight"],["DB","Dumbbells"],["band","Bands"],["bar","Pull-up bar"]];
  var chips=opts.map(function(o){
    return '<button class="eqchip'+(cur.indexOf(o[0])>=0?" on":"")+'" onclick="toggleSessEquip(this,\''+o[0]+'\')">'+o[1]+'</button>';

function weightCardHTML(){

function trendChart(){
  var st=weightStats();if(!st||S.weigh.length<2)return "";
  var t=trendState(),draw=(t.state==="down"||t.state==="up"||t.state==="flat");
  var pts=S.weigh.slice(-24);
  var a=0.12,ev=[],e=pts[0].w;pts.forEach(function(p,i){e=i===0?p.w:a*p.w+(1-a)*e;ev.push(e);});
  var goal=st.goal,ws=pts.map(function(p){return p.w;});
  var mn=Math.min.apply(null,ws.concat([goal]))-1.2,mx=Math.max.apply(null,ws)+1.2;
  var W=320,H=112,pad=8;
  function x(i){return pad+(pts.length<=1?W/2:(i/(pts.length-1))*(W-2*pad));}
  function y(v){return pad+(1-(v-mn)/((mx-mn)||1))*(H-2*pad);}
  var gy=y(goal).toFixed(1);
  var dots=pts.map(function(p,i){return '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.w).toFixed(1)+'" r="2" fill="var(--faint)" opacity=".55"/>';}).join("");
  var line=draw?('<path d="'+ev.map(function(v,i){return (i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1);}).join(" ")+'" fill="none" stroke="'+(t.state==="stale"?"var(--faint)":"var(--accent)")+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'):"";
  var endDot=draw?('<circle cx="'+x(pts.length-1).toFixed(1)+'" cy="'+y(ev[ev.length-1]).toFixed(1)+'" r="3.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/>'):"";
  /* A projection is drawn as a widening dashed wedge and never as something mistakable for data. */
  var wedge="";
  if(draw&&t.rate&&t.rate<-0.05&&st.to>0.3){
    var x0=x(pts.length-1),y0=y(ev[ev.length-1]),wk=(W-pad-x0)/((W-2*pad)/Math.max(pts.length-1,1))||4;
    var slowY=y(Math.max(goal-0.5,ev[ev.length-1]+t.rate*0.6*4)),fastY=y(Math.max(goal-0.5,ev[ev.length-1]+t.rate*1.4*4));
    wedge='<path d="M'+x0.toFixed(1)+' '+y0.toFixed(1)+' L'+(W-pad)+' '+fastY.toFixed(1)+' L'+(W-pad)+' '+slowY.toFixed(1)+' Z" fill="var(--accent)" opacity=".10"/>';
  }
  return '<div class="wchart"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Weight trend">'+
    '<line x1="0" y1="'+gy+'" x2="'+W+'" y2="'+gy+'" stroke="var(--good)" stroke-width="1" stroke-dasharray="4 4" opacity=".6"/>'+
    wedge+dots+line+endDot+'</svg>'+
    '<div class="wlegend"><span>goal '+goal+'</span><span>'+(draw?"trend, roughly two-week smoothing":S.weigh.length+" weigh-ins")+'</span></div></div>';
}

/* ============ WORKOUT ============ */
var woTimer=null;var openEx={};
function AW(){return S.activeMode==="gen"?S.genWk:S.wk[TODAY];}

   you launched it from. Both paths used to hard-code Today, which stranded you off the Lift tab. */
var RETV="today";
function startActive(){var w=AW();if(w.accum==null)w.accum=0;openEx={};w.paused=false;w.start=Date.now();RETV=(CURV==="lift"||CURV==="cardio"||CURV==="track")?CURV:"today";save();renderWorkout();show("workout");startWoTick();}
function exComplete(o){return o.sets.length>0&&o.sets.every(function(s){return s.on;});}
function elapsedSec(){var w=AW();if(!w)return 0;return Math.floor((w.accum||0)+((w.start&&!w.paused)?(Date.now()-w.start)/1000:0));}
function startWoTick(){if(woTimer)clearInterval(woTimer);function t(){var e=document.getElementById("wo-elapsed");if(e)e.textContent=mmss(elapsedSec());}t();woTimer=setInterval(t,1000);updatePico();}
function updatePico(){var p=document.getElementById("wo-pico");if(!p)return;var w=AW();p.innerHTML=(w&&w.paused)?I.play2:I.pause;}
function woFreeze(){var w=AW();if(w&&w.start){w.accum=(w.accum||0)+(Date.now()-w.start)/1000;w.start=null;save();}if(woTimer){clearInterval(woTimer);woTimer=null;}}
function woResume(){var w=AW();if(w&&!w.paused&&!w.start){w.start=Date.now();save();startWoTick();}}
function togglePause(){var w=AW();if(!w)return;if(w.paused){w.paused=false;w.start=Date.now();save();startWoTick();}else{woFreeze();w.paused=true;save();var e=document.getElementById("wo-elapsed");if(e)e.textContent=mmss(elapsedSec());updatePico();}}
function startWorkout(){S.activeMode="plan";var w=workDay();w.id=TODAY;save();startActive();}

function exCardHTML(oi,isActive){var o=AW().order[oi],e=LIB[o.exId],setsHtml="";
  o.sets.forEach(function(s,si){
    var wcell=o.bw?'<div class="bwtag">'+(e.equip==="band"?"Band":"BW")+'</div>':'<div class="stp"><button onclick="step('+oi+','+si+',\'w\',-1)" aria-label="less weight">&minus;</button><input class="val num" inputmode="decimal" value="'+s.w+'" aria-label="weight" onchange="setVal('+oi+','+si+',\'w\',this.value)"><span class="u">'+wLbl()+'</span><button onclick="step('+oi+','+si+',\'w\',1)" aria-label="more weight">+</button></div>';

    /* Per-set clock. Start it when you begin the set, stop it when you rack; the elapsed

  });
  return '<div class="ex'+(isActive?" active":"")+'" data-ex="'+oi+'"><div class="exhead"><div class="exname">'+esc(e.name)+(o.side?' <span style="font-size:12px;color:var(--faint);font-weight:600">/side</span>':'')+'</div><button class="more" onclick="exMenu('+oi+')" aria-label="Exercise options">'+I.more+'</button></div><div class="aim">'+aimText(o)+'</div><div class="colhead"><span>Set</span><span>'+(o.bw?"Load":"Weight")+'</span><span>'+(o.unit==="s"?"Time":"Reps")+'</span><span></span></div>'+setsHtml+'<div class="setbtns"><button class="setbtn" onclick="addSet('+oi+')">+ Add set</button>'+(o.sets.length>1?'<button class="setbtn rm" onclick="removeSet('+oi+')">&minus; Remove set</button>':'')+'</div></div>';}
function exDoneHTML(oi){var o=AW().order[oi],e=LIB[o.exId];var summ=o.sets.map(function(s){return (o.bw?"":s.w+"x")+s.reps+(o.unit==="s"?"s":"");}).join(", ");
  return '<button class="exdone" onclick="openEx['+oi+']=true;renderWorkout()"><span class="edc">'+I.check+'</span><span class="edt"><span class="edn">'+esc(e.name)+'</span><span class="eds">'+summ+'</span></span><span class="ede">'+I.edit+'</span></button>';}
function renderWorkout(){var w=AW();if(!w){show(RETV||"today");return;}
  var active=[],doneL=[];w.order.forEach(function(o,oi){if(exComplete(o)&&!openEx[oi])doneL.push(oi);else active.push(oi);});

  active.forEach(function(oi,idx){h+=exCardHTML(oi,idx===0&&active.length>1);});

function step(oi,si,f,dir){var o=AW().order[oi],s=o.sets[si];
  if(f==="w"){var v=(parseFloat(s.w)||0)+dir*inc();s.w=Math.max(0,Math.round(v*10)/10);}
  else{var d=o.unit==="s"?5:1;s.reps=Math.max(0,(parseInt(s.reps)||0)+dir*d);}
  save();var el=document.getElementById("set-"+oi+"-"+si);if(el){var inp=el.querySelectorAll(".val");inp[0].value=s.w;inp[1].value=s.reps;}}
function setVal(oi,si,f,v){var s=AW().order[oi].sets[si];v=(""+v).replace(/[^0-9.]/g,"");s[f]=f==="w"?(v===""?0:parseFloat(v)):(v===""?0:parseInt(v));save();}
/* Set stopwatch. ST holds which set is currently running; the tick only repaints one label,
   so it never re-renders the card mid-set and steals your input focus. */
var ST={oi:-1,si:-1,t0:0,int:null};
function setElapsed(s){return (s.sec||0)+(ST.t0?Math.floor((Date.now()-ST.t0)/1000):0);}
function startSet(oi,si){
  if(ST.oi>=0)stopSet(ST.oi,ST.si,true);
  ST.oi=oi;ST.si=si;ST.t0=Date.now();
  if(ST.int)clearInterval(ST.int);
  ST.int=setInterval(function(){
    var w=AW();if(!w||ST.oi<0)return;
    var el=document.getElementById("swt-"+ST.oi+"-"+ST.si);
    if(!el){stopSet(ST.oi,ST.si,true);return;}
    el.textContent=mmss(setElapsed(w.order[ST.oi].sets[ST.si]));
  },1000);
  endRest();renderWorkout();
}
function stopSet(oi,si,quiet){
  var w=AW();if(!w)return;
  if(ST.oi===oi&&ST.si===si&&ST.t0){
    var s=w.order[oi].sets[si];
    s.sec=(s.sec||0)+Math.floor((Date.now()-ST.t0)/1000);
    save();
  }
  if(ST.int){clearInterval(ST.int);ST.int=null;}
  ST={oi:-1,si:-1,t0:0,int:null};
  if(!quiet){
    /* Stopping a set is the natural moment to mark it done and start the rest clock. */
    var st=w.order[oi].sets[si];
    if(!st.on)toggleSet(oi,si);else renderWorkout();
  }
}
function toggleSet(oi,si){var o=AW().order[oi],s=o.sets[si];
  if(ST.oi===oi&&ST.si===si)stopSet(oi,si,true);
  s.on=!s.on;if(s.on)s.ts=Date.now();else delete s.ts;save();
  var last=(oi===AW().order.length-1&&si===o.sets.length-1);
  if(s.on&&!last){startRest(S.profile.rest||90);if(navigator.vibrate)navigator.vibrate(12);}
  if(s.on&&last)endRest();
  if(exComplete(o))delete openEx[oi];
  renderWorkout();}
function addSet(oi){var o=AW().order[oi],last=o.sets[o.sets.length-1];o.sets.push({w:last?last.w:o.weight,reps:o.low,on:false});save();renderWorkout();}

var rpePick=null;
function finishWorkout(){var w=AW();if(!w)return;var wp=wkProgress(AW());if(wp.done===0){toast("Log at least one set first, or tap Today to leave.",null);return;}rpePick=null;verifySheet(wp);}
function verifySheet(wp){var w=AW(),dur=elapsedSec(),setsN=0,vol=0,rows="";
  w.order.forEach(function(o){var done=o.sets.filter(function(s){return s.on;});if(!done.length)return;done.forEach(function(s){setsN++;if(o.unit!=="s")vol+=(parseFloat(s.w)||0)*(parseInt(s.reps)||0);});
    rows+='<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px"><span style="font-weight:600">'+esc(LIB[o.exId].name)+'</span><span style="color:var(--sub);font-variant-numeric:tabular-nums">'+done.map(function(s){return (o.bw?"":s.w+"x")+s.reps+(o.unit==="s"?"s":"");}).join(", ")+'</span></div>';});
  var partial=wp.done<wp.total;
  var m='<div class="grab"></div><h3>Finish workout</h3><div class="ssub">Look it over, then save.'+(partial?' '+wp.done+' of '+wp.total+' sets done.':'')+'</div>'+
    '<div class="sumgrid"><div class="sg"><b class="num">'+setsN+'</b><span>sets</span></div><div class="sg"><b class="num">'+Math.round(vol).toLocaleString()+'</b><span>'+wLbl()+'</span></div><div class="sg"><b class="num">'+mmss(dur)+'</b><span>time</span></div></div>'+
    '<div style="margin-top:8px">'+rows+'</div>'+
    '<div class="sectlbl" style="margin:16px 2px 8px">How hard? <span style="text-transform:none;font-weight:500;color:var(--sub)">optional</span></div><div class="rpe" id="v-rpe">'+[6,7,8,9,10].map(function(n){return '<button onclick="setRpe('+n+',this)">'+n+'</button>';}).join("")+'</div>'+
    '<textarea class="ta" id="rpe-notes" placeholder="Notes (optional): how it felt, the shoulder, energy..." style="min-height:78px;margin-top:10px"></textarea>'+
    '<button class="sheet-cta" onclick="doFinish()">Confirm &amp; save</button><button class="sheet-cta ghost" onclick="closeSheet()">Keep going</button>';

function setRpe(n,btn){rpePick=n;document.querySelectorAll("#v-rpe button").forEach(function(b){b.classList.remove("sel")});btn.classList.add("sel");}
function doFinish(){var w=AW();var dur=elapsedSec();var entries=[],setsN=0,vol=0,prs=[];
  w.order.forEach(function(o){var onSets=o.sets.filter(function(s){return s.on;});if(!onSets.length)return;
    var sets=onSets.map(function(s){setsN++;if(o.unit!=="s")vol+=(parseFloat(s.w)||0)*(parseInt(s.reps)||0);return {weightLb:parseFloat(s.w)||0,reps:parseInt(s.reps)||0,completed:true};});
    var ts=onSets.map(function(s){return s.ts;}).filter(Boolean);var exSec=ts.length>1?Math.round((Math.max.apply(null,ts)-Math.min.apply(null,ts))/1000):0;
    var prev=prFor(o.exId);
    entries.push({exerciseId:o.exId,targetLow:o.low,targetHigh:o.high,targetWeightLb:o.weight,sets:sets,exerciseSec:exSec,bw:!!o.bw,unit:o.unit});
    applyProgression(o,sets);
    if(o.unit!=="s"){var nb=null;sets.forEach(function(s){var val=o.bw?s.reps:e1rm(s.weightLb,s.reps);if(!nb||val>nb.v)nb={v:val,w:s.weightLb,r:s.reps};});
      if(nb){if(o.bw){if(!prev||nb.r>prev.r)prs.push(LIB[o.exId].name+" x"+nb.r);}else{if(!prev||nb.v>prev.e+0.01)prs.push(LIB[o.exId].name+" "+nb.w+wLbl()+" x"+nb.r);}}}
  });
  var nt=document.getElementById("rpe-notes");
  var rec={id:(AW().id||TODAY),date:TODAY,type:"lift",dayLetter:w.letter,durationSec:dur,rpe:rpePick,notes:nt?nt.value.slice(0,300):"",entries:entries};
  S.sessions=S.sessions.filter(function(s){return s.id!==rec.id;});S.sessions.push(rec);
  S.done[TODAY]=true;S.planPos=((S.planPos||0)+1)%3;advanceCycle();if(S.activeMode==="gen"){S.genWk=null;S.activeMode="plan";}
  if(woTimer){clearInterval(woTimer);woTimer=null;}endRest();rpePick=null;
  try{localStorage.setItem("train_v2_snapshot",JSON.stringify(S))}catch(e){}
  save();closeSheet();show(RETV||"today");
  toast(prs.length?("New PR: "+prs[0]):("Logged - "+setsN+" sets, "+mmss(dur)+"."),null);}
function applyProgression(o,sets){var t=S.progress[o.exId]||{low:o.low,high:o.high,weight:o.weight};
  var allHigh=sets.length>0&&sets.every(function(s){return (s.reps||0)>=o.high;});
  var repMode=(o.bw||!S.profile.adjustable);
  if(allHigh){if(repMode){if(o.high<20){t.low=o.high;t.high=o.high+2;}else{t.note="graduate";}t.weight=o.weight;}else{t.weight=(parseFloat(o.weight)||0)+inc();t.low=8;t.high=12;}}
  else{t.low=o.low;t.high=o.high;t.weight=o.weight;}
  t.ladderStep=repMode?"reps":"load";S.progress[o.exId]=t;}

function startRest(sec){restTot=sec;restEnd=Date.now()+sec*1000;var rb=document.getElementById("restbar");rb.classList.add("on");drawRest();if(restInt)clearInterval(restInt);restInt=setInterval(function(){if(drawRest()<=0){endRest();if(navigator.vibrate)navigator.vibrate([20,60,20]);}},250);}
function drawRest(){var left=Math.round((restEnd-Date.now())/1000);document.getElementById("rest-t").textContent=mmss(Math.max(left,0));document.getElementById("rest-fill").style.width=(restTot?Math.max(left,0)/restTot*100:0)+"%";document.getElementById("restbar").classList.toggle("warn",left<=5&&left>0);return left;}
function bumpRest(d){restEnd+=d*1000;restTot=Math.max(restTot,Math.round((restEnd-Date.now())/1000));drawRest();}
function endRest(){if(restInt){clearInterval(restInt);restInt=null;}var rb=document.getElementById("restbar");if(rb){rb.classList.remove("on");rb.classList.remove("warn");}}

function parseTime(t){t=(""+(t||"")).trim();if(!t)return null;if(t.indexOf(":")>=0){var p=t.split(":");var m=parseInt(p[0])||0,s=parseInt(p[1])||0;if(s>59)s=59;return m*60+s;}var n=parseFloat(t);if(isNaN(n))return null;return Math.round(n*60);}
function calcPace(){var d=parseFloat((document.getElementById("r-dist")||{}).value),sec=parseTime((document.getElementById("r-time")||{}).value),el=document.getElementById("r-pace");if(!el)return;el.textContent=(d>0&&sec>0)?mmss(Math.round(sec/d)):"--:--";}

/* B2 - frictionless weigh-in. Opens pre-filled with your last number, so the common
   case (a pound either side of yesterday) is two taps and Save, never typing. */
function wStep(){return 0.1;} /* was 0.2 in lb, which could not match the scale exactly */
function lastW(){return S.weigh.length?S.weigh[S.weigh.length-1].w:null;}
function weighSheet(){
  var lw=lastW(),start=(lw!=null?lw:(U()==="kg"?80:180));
  var age=lw!=null?daysBetween(S.weigh[S.weigh.length-1].date,TODAY):null;
  var sub=(lw!=null)?('Last was <b>'+lw.toFixed(1)+' '+wLbl()+'</b>'+(age===0?' earlier today':age===1?' yesterday':age!=null?', '+age+' days ago':'')+'. Nudge and save.'):'Morning scale. One number.';
  openSheet('<div class="grab"></div><h3>Weigh-in</h3><div class="ssub">'+sub+'</div>'+
    '<div class="wdial"><button class="wdb" onclick="nudgeW(-1)" aria-label="lower">&minus;</button>'+
    '<input class="wbig num" id="w-val" inputmode="decimal" value="'+start.toFixed(1)+'" aria-label="weight" oninput="wDelta()">'+
    '<button class="wdb" onclick="nudgeW(1)" aria-label="higher">+</button></div>'+
    '<div class="wunit">'+wLbl()+'<span id="w-delta"></span></div>'+
    (lw!=null?'<button class="sheet-cta ghost" onclick="quickWeigh('+lw+')">Same as last &middot; '+lw.toFixed(1)+'</button>':'')+
    '<button class="sheet-cta" onclick="saveWeigh()">Save</button>');
  wDelta();
}
function nudgeW(d){var el=document.getElementById("w-val");if(!el)return;var v=parseFloat(el.value)||0;el.value=(v+d*wStep()).toFixed(1);wDelta();}
function wDelta(){
  var el=document.getElementById("w-val"),out=document.getElementById("w-delta"),lw=lastW();
  if(!el||!out)return;
  var v=parseFloat(el.value);
  if(lw==null||!(v>0)||Math.abs(v-lw)<0.05){out.innerHTML="";return;}
  var d=v-lw;out.innerHTML=' &middot; <b style="color:'+(d<0?"var(--good)":"var(--sub)")+'">'+(d>0?"+":"")+d.toFixed(1)+'</b> vs last';

function quickWeigh(v){writeWeigh(v);}
function saveWeigh(){writeWeigh(parseFloat((document.getElementById("w-val")||{}).value));}
function writeWeigh(v){

    S.weigh=S.weigh.filter(function(x){return x.date!==TODAY;});
    S.weigh.push({date:TODAY,w:v});
    S.weigh.sort(function(a,b){return a.date<b.date?-1:1;});
    save();
  }
  closeSheet();refreshCurrent();
  if(v>0)toast("Logged "+v.toFixed(1)+" "+wLbl()+".",null);

/* B4/B5 - protein consistency is a yes/no you tap, never a macro you re-enter.

function proteinTarget(){

/* ============ LIFT: THE PROGRAM AND THE MOVEMENTS (Round D) ============
   Today answers "what now". Lift answers "what am I running, and is it getting heavier", which is
   the question nothing in the app used to answer. Two halves: the A/B/C rotation as a system you
   can see and edit, and every movement with its working weight, its last result, its trend and its
   next-time call. The old Lift top card duplicated Today's hero and is gone. */
function cycleHTML(){
  var next=letterFor();
  var rows=LETTERS.map(function(L){
    var tpl=DAYS[L],isNext=(L===next);
    var last=null;
    for(var i=S.sessions.length-1;i>=0;i--){var s=S.sessions[i];if(s.type==="lift"&&s.dayLetter===L){last=s;break;}}
    var when=last?("last "+shortDate(last.date)):"not yet run";
    return '<div class="prow'+(isNext?" next":"")+'"><div class="pl">'+L+'</div>'+
      '<div class="pm"><div class="pn">'+esc(tpl.name)+'</div>'+

      (isNext?'<span class="ptag">Next</span>':'')+'</div>';
  }).join("");
  var lifts=S.sessions.filter(function(s){return s.type==="lift";}).length;
  return '<div class="card"><h3><span>The program</span><span class="t">three days, on rotation</span></h3>'+
    '<div class="ksub">You run A, then B, then C, then round again. The next one is whatever you have not done, not whatever day of the week it is.</div>'+
    rows+
    '<div class="foot" style="margin-top:12px">'+lifts+' session'+(lifts===1?"":"s")+' banked'+(easingIn()?' &middot; easing in, volume is deliberately light':'')+'.</div></div>';
}
/* Per-movement state: what you lift now, what happened last time, and what to do next. */
function movementRows(){

  if(!ids.length)return '<div class="card"><h3><span>Your movements</span></h3><div class="ssub" style="text-align:left;margin:8px 0 0">Finish a session and every movement you trained shows up here with its working weight and its history.</div></div>';
  ids.sort(function(a,b){var la=lastEntry(a),lb=lastEntry(b);return (lb?lb.date:"")<(la?la.date:"")?-1:1;});
  var rows=ids.slice(0,14).map(function(id){
    var e=LIB[id],le=lastEntry(id),t=S.progress[id]||{},pr=prFor(id);
    var best=null;
    if(le)le.e.sets.forEach(function(s){if(!s.completed)return;var w=s.weightLb||0,r=s.reps||0;if(!best||w>best.w||(w===best.w&&r>best.r))best={w:w,r:r};});
    var now=e.bw?((t.low||8)+"-"+(t.high||12)+" reps"):((t.weight!=null?t.weight:15)+wLbl()+" x "+(t.low||8)+"-"+(t.high||12));

      '<span class="mv"><span class="mw num">'+now+'</span>'+(pr?'<span class="mp">PR '+(e.bw?"x"+pr.r:pr.w+wLbl()+" x"+pr.r)+'</span>':'')+'</span></button>';
  }).join("");
  return '<div class="card"><h3><span>Your movements</span><span class="t">working weight and last result</span></h3>'+
    '<div class="ksub">Tap any movement for its history, its record, and how to do it.</div>'+rows+'</div>';

function movementSheet(id){

    spark='<svg class="msp" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true"><path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    '<button class="sheet-cta ghost" onclick="closeSheet()">Close</button>');
}

/* ============ TRACK (body, trends, PRs, settings) ============ */

/* ============ KPI SCORECARD (Round B) ============
   Six measures, scored against a stated target, weekly bullet rows plus a 12-week strip so
   "how am I doing" and "is this week normal for me" answer at once with no period toggle.
   Geometry from Stephen Few's bullet-graph spec: bands are one hue at different intensities,
   the value bar is about a third of the track, the target is a perpendicular line behind it.
   Hue is never the only channel: every row also carries an uppercase status word.
   Thresholds are numeric and printed, so amber means a stated tolerance and not a mood. */
function mondayOfKey(k){var p=k.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()-((d.getDay()+6)%7));return keyOf(d);}
function weekStartKey(back){var d=new Date(NOW);d.setDate(d.getDate()-((DOW+6)%7)-7*(back||0));return keyOf(d);}
function weekDays(back){var s=weekStartKey(back),p=s.split("-"),out=[];var d=new Date(+p[0],+p[1]-1,+p[2]);
  for(var i=0;i<7;i++){out.push(keyOf(d));d.setDate(d.getDate()+1);}return out;}
function plannedMiles(){var mi=0;weekDays(0).forEach(function(k){var pl=planFor(k);if(pl&&pl.type==="run")mi+=(pl.dist||0);});return mi||5;}
/* One week's raw numbers. back=0 is this week. */
function weekMetrics(back){
  var days=weekDays(back),today=TODAY,m={lifts:0,protein:0,moved:0,miles:0,anchor:0,days:0};
  days.forEach(function(k){
    if(k>today)return;
    m.days++;
    if(S.sessions.some(function(s){return s.date===k&&s.type==="lift";}))m.lifts++;
    if(S.protein[k])m.protein++;
    if(isDone(k))m.moved++;
    if(anchorComplete(k))m.anchor++;
    S.sessions.forEach(function(s){if(s.date===k&&(s.type==="run"||s.distanceMi))m.miles+=(s.distanceMi||0);});
  });
  return m;
}
/* Green at or above target, amber inside a stated tolerance below it, red outside. */
function rag(val,target,tol){
  if(target<=0)return "good";
  if(val>=target-0.001)return "good";
  if(val>=target*(1-(tol==null?0.3:tol)))return "amber";
  return "red";
}
function kpiRows(){
  var m=weekMetrics(0),miTarget=plannedMiles(),st=weightStats();
  var rows=[
    {k:"lifts",label:"Strength sessions",val:m.lifts,target:3,unit:"",fmt:function(v){return v;},
     tag:{good:"On track",amber:"One short",red:"Behind"},act:"show('lift')"},
    {k:"moved",label:"Days moved",val:m.moved,target:6,unit:"/ 7",fmt:function(v){return v;},
     tag:{good:"On track",amber:"Slipping",red:"Behind"},act:"show('today')"},
    {k:"protein",label:"Protein days",val:m.protein,target:6,unit:"/ 7",fmt:function(v){return v;},
     tag:{good:"On track",amber:"Slipping",red:"Behind"},act:"show('track')"},
    {k:"miles",label:"Miles run",val:Math.round(m.miles*10)/10,target:miTarget,unit:"mi",fmt:function(v){return v.toFixed(1);},
     tag:{good:"On track",amber:"Short",red:"Behind"},act:"show('cardio')"},
    {k:"anchor",label:"Morning anchor",val:m.anchor,target:6,unit:"/ 7",fmt:function(v){return v;},
     tag:{good:"On track",amber:"Slipping",red:"Behind"},act:"show('today')"}
  ];
  /* Score against the PRO-RATED target, not the full week's. On a Tuesday, one session out of a
     weekly three is ahead of pace, and a scorecard that calls that "behind" every Monday and
     Tuesday trains you to ignore it. The bullet still draws the full-week target so the whole
     ask stays visible; the lighter tick is where you should be today. */
  var elapsed=Math.max(m.days,1);
  rows.forEach(function(r){
    r.pace=r.target*(elapsed/7);
    r.rag=rag(r.val,r.pace,0.3);
    r.status=r.tag[r.rag];
    if(r.rag==="good"&&r.val>=r.target)r.status="Done for the week";
  });
  /* Weight is an OUTCOME, not execution, so it is scored on direction rather than on a count
     and it stays silent until there is enough data to say anything true. */
  var w={k:"weight",label:"Weight trend",outcome:true,act:"weighSheet()"};
  if(!st||st.rate==null){w.rag="none";w.status=st?"No recent data":"Not logged";w.val=null;}
  else if(st.rate<=-0.25){w.rag="good";w.status="Coming off";w.val=st.rate;}
  else if(st.rate<0.15){w.rag="amber";w.status="Holding";w.val=st.rate;}
  else {w.rag="red";w.status="Climbing";w.val=st.rate;}
  rows.push(w);
  return rows;
}
function bulletSVG(val,target,pace){
  /* Everything is expressed as a percentage of target, so preserveAspectRatio="none" lets the
     row stretch to any width with no resize maths. Bar height 5 of 14 is Few's one-third rule. */
  var pct=target>0?Math.min(140,(val/target)*100):0;
  var tx=100/1.4; /* target sits at 100% of target on a 0-140% scale */
  var vx=pct/1.4;
  var px=(pace!=null&&target>0)?Math.min(100,(pace/target)*100/1.4):null;
  var paceTick=(px!=null&&px>1&&px<tx-1)?'<rect x="'+(px-0.4).toFixed(1)+'" y="3" width="0.8" height="8" fill="var(--ink)" opacity=".28"/>':"";
  return '<svg class="bullet" viewBox="0 0 100 14" preserveAspectRatio="none" aria-hidden="true">'+
    '<rect x="0" y="0" width="'+(tx*0.7).toFixed(1)+'" height="14" fill="var(--line-2)"/>'+
    '<rect x="'+(tx*0.7).toFixed(1)+'" y="0" width="'+(tx*0.3).toFixed(1)+'" height="14" fill="var(--line)"/>'+
    '<rect x="'+tx.toFixed(1)+'" y="0" width="'+(100-tx).toFixed(1)+'" height="14" fill="var(--surface-2)"/>'+
    '<rect class="val" x="0" y="4.5" width="'+vx.toFixed(1)+'" height="5" rx="0.5"/>'+
    paceTick+'<rect x="'+(tx-0.6).toFixed(1)+'" y="1.5" width="1.2" height="11" fill="var(--ink)" opacity=".5"/></svg>';
}
/* Twelve weeks, quantized to five levels. Reads as a week per block and a quarter as a whole. */
function kpiStrip(k){
  var blocks="";
  for(var i=11;i>=0;i--){
    var m=weekMetrics(i),v,t;
    if(k==="lifts"){v=m.lifts;t=3;} else if(k==="moved"){v=m.moved;t=6;}
    else if(k==="protein"){v=m.protein;t=6;} else if(k==="anchor"){v=m.anchor;t=6;}
    else if(k==="miles"){v=m.miles;t=plannedMiles();} else {v=0;t=1;}
    var r=t>0?v/t:0,lvl=(m.days===0)?0:(r>=1?4:r>=0.7?3:r>=0.4?2:r>0?1:0);
    blocks+='<i data-l="'+lvl+'"></i>';
  }
  return '<div class="kstrip" aria-hidden="true">'+blocks+'</div>';
}

/* No EWMA in the hero, on purpose. The smoothing constant assumes near-daily weigh-ins;
   against a real record of five readings across seven months it sits ~6 lb above the
   actual scale number, and even a fresh burst stays anchored to the oldest point. That is
   the v3.8 dual-weight bug wearing a different hat. The change since the previous weigh-in
   is smaller, duller, and always true, so that is what ships. */
function trendLine(){

/* One bar chart for every weekly series. Tufte's normal-range band becomes a dashed mean line,

function barChart(title,note,vals,labels,fmt,unit){
  if(!vals||vals.length<2)return "";

    var hh=v>0?Math.max(6,Math.round(v/mx*H)):2;

    return '<div class="bcol"><span class="bv'+(last?" on":"")+'">'+(v>0?fmt(v):"")+'</span>'+
      '<i class="'+(last?"on":"")+(v>0?"":" zero")+'" style="height:'+hh+'px"></i>'+
      '<span class="bx">'+(labels&&labels[i]!=null?labels[i]:"")+'</span></div>';
  }).join("");
  var meanPct=mx?Math.round((mean/mx)*H):0;
  return '<div class="card"><h3><span>'+title+'</span><span class="t">'+note+'</span></h3>'+
    '<div class="bwrap" style="--bh:'+H+'px">'+(mean>0?'<div class="bmean" style="bottom:'+(meanPct+16)+'px"><span>avg '+fmt(mean)+(unit?" "+unit:"")+'</span></div>':'')+
    '<div class="brow">'+bars+'</div></div></div>';
}
/* Single source for weekly tonnage, shared by the tile and the chart. */
function volumeByWeek(){
  var by={},bwLb=Math.round((lastW()||180)*0.65);
  S.sessions.forEach(function(s){if(s.type!=="lift")return;var wk=isoWeek(s.id),v=0;
    s.entries.forEach(function(en){if(en.unit==="s")return;
      en.sets.forEach(function(st){if(!st.completed)return;v+=(en.bw?bwLb:(st.weightLb||0))*(st.reps||0);});});
    by[wk]=(by[wk]||0)+v;});
  return by;
}
function volChart(){
  /* Bodyweight sets used to contribute nothing, so "week volume" read 0 lb forever on a
     bodyweight program. Reps now count as work at an assumed load so the series means something. */
  var volByWk=volumeByWeek();
  var wks=Object.keys(volByWk).sort().slice(-10);if(wks.length<2)return "";
  var vals=wks.map(function(k){return volByWk[k];});
  return barChart("Weekly lifting volume","last "+wks.length+" weeks",vals,
    wks.map(function(k,i){return i===wks.length-1?"now":"";}),
    function(v){return (v/1000).toFixed(v>=10000?0:1)+"k";},"lb");
}

function buildJSON(){

    profile:{units:U()==="kg"?"metric":"imperial",bodyweightGoalLb:S.profile.goalLb,bodyweightStretchLb:S.profile.stretchLb,startDate:S.profile.started},
    sessions:S.sessions,weighins:S.weigh.map(function(w){return {date:w.date,weightLb:w.w};}),anchor:S.anchor,
    progressState:S.progress,
    derived:{note:"advisory; recompute from raw",streakDays:computeStreak(),bodyweightEwmaLb:ewma()}};
}
function buildSummary(){
  var e=ewma(),lifts=S.sessions.filter(function(s){return s.type==="lift";}),runs=S.sessions.filter(function(s){return s.type==="run";});
  var out="# Train Export - "+TODAY+"\n\n## Snapshot\n";
  out+="- Bodyweight: "+(e?e.toFixed(1)+" "+wLbl()+" (EWMA)":"not logged")+(S.weigh.length?", latest "+S.weigh[S.weigh.length-1].w+" ("+S.weigh[S.weigh.length-1].date+")":"")+". Goal "+S.profile.goalLb+" (stretch "+S.profile.stretchLb+").\n";
  out+="- Training streak: "+computeStreak()+" days. Sessions logged: "+lifts.length+" lifts, "+runs.length+" runs.\n\n";
  out+="## Personal Records\n";Object.keys(LIB).forEach(function(id){var p=prFor(id);if(p)out+="- "+LIB[id].name+": "+(LIB[id].bw?"x"+p.r:p.w+wLbl()+" x "+p.r)+" ("+p.date+")\n";});
  out+="\n## Recent Sessions\n";
  lifts.slice(-10).reverse().forEach(function(s){out+="### "+s.id+" - Day "+s.dayLetter+" - "+mmss(s.durationSec)+(s.rpe?" - RPE "+s.rpe:"")+"\n";s.entries.forEach(function(en){out+="- "+(LIB[en.exerciseId]?LIB[en.exerciseId].name:en.exerciseId)+": "+en.sets.map(function(st){return (LIB[en.exerciseId]&&LIB[en.exerciseId].bw?"":st.weightLb+"x")+st.reps;}).join(", ")+"\n";});if(s.notes)out+="  note: "+s.notes+"\n";});
  out+="\n## Runs\n";runs.slice(-10).reverse().forEach(function(s){out+="- "+s.id+": "+s.distanceMi+" mi in "+mmss(s.durationSec)+" ("+(s.paceSecPerMi?mmss(s.paceSecPerMi):"--")+"/mi) - "+(s.rpe||"")+"\n";});
  out+="\n## Weigh-ins\n";S.weigh.slice(-12).forEach(function(w){out+="- "+w.date+": "+w.w+" "+wLbl()+"\n";});

function doImport(mode){var t=(document.getElementById("imp")||{}).value;var o;try{o=JSON.parse(t)}catch(e){toast("That isn\'t valid JSON.",null);return;}
  if(!o||o.schema!=="train.export"){toast("Not a Train backup.",null);return;}
  try{localStorage.setItem("train_v2_backup",JSON.stringify(S))}catch(e){}
  var inW=o.weighins?o.weighins.map(function(w){return {date:w.date,w:w.weightLb};}):[];
  if(mode==="replace"){
    if(o.sessions)S.sessions=o.sessions;S.weigh=inW;if(o.anchor)S.anchor=o.anchor;if(o.progressState)S.progress=o.progressState;
  }else{
    var seen={};S.sessions.forEach(function(s){seen[s.id]=true;});
    (o.sessions||[]).forEach(function(s){if(!seen[s.id]){S.sessions.push(s);seen[s.id]=true;}});
    var ws={};S.weigh.forEach(function(w){ws[w.date]=true;});
    inW.forEach(function(w){if(!ws[w.date]){S.weigh.push(w);ws[w.date]=true;}});
    S.weigh.sort(function(a,b){return a.date<b.date?-1:1;});
    if(o.anchor){for(var k in o.anchor){if(!S.anchor[k])S.anchor[k]=o.anchor[k];}}
    if(o.progressState){for(var p in o.progressState){if(!S.progress[p])S.progress[p]=o.progressState[p];}}
  }
  if(o.profile){if(o.profile.bodyweightGoalLb)S.profile.goalLb=o.profile.bodyweightGoalLb;if(o.profile.bodyweightStretchLb)S.profile.stretchLb=o.profile.bodyweightStretchLb;}
  S.sessions.sort(function(a,b){return (a.date+"|"+a.id)<(b.date+"|"+b.id)?-1:1;});
  S.sessions.forEach(function(s){S.done[s.date]=true;});
  save();closeSheet();toast(mode==="merge"?"Merged. Nothing lost.":"Replaced.",null);show("progress");}

function allowedEquip(){return (S.profile.equip&&S.profile.equip.length)?S.profile.equip:(S.profile.loc==="Boca"?["DB","BW","band"]:["DB","BW","band","bar"]);}
function pickForPattern(pat,used){
  var eq=allowedEquip();
  var c=Object.keys(LIB).filter(function(id){return LIB[id].pattern===pat&&eq.indexOf(LIB[id].equip)>=0&&used.indexOf(id)<0;});
  if(!c.length)c=Object.keys(LIB).filter(function(id){return LIB[id].pattern===pat&&used.indexOf(id)<0;});
  if(!c.length)c=Object.keys(LIB).filter(function(id){return LIB[id].pattern===pat;});
  return c.length?c[Math.floor(Math.random()*c.length)]:null;
}
function genSlot(id,sets){var e=LIB[id],t=S.progress[id]||{};
  var low=e.unit==="s"?30:8,high=e.unit==="s"?45:12;
  var w=e.bw?0:(t.weight!=null?t.weight:15);
  var arr=[];for(var i=0;i<sets;i++)arr.push({w:w,reps:low,on:false});
  return {exId:id,unit:e.unit||"reps",side:!!e.side,bw:!!e.bw,low:low,high:high,weight:w,sets:arr};
}
function genBuild(){
  var f=FOCUS[GEN.focus],nEx=GEN.time===20?4:GEN.time===45?6:5,sets=GEN.energy==="low"?2:3;
  var pats=[];for(var i=0;i<nEx;i++)pats.push(f.pats[i%f.pats.length]);
  var used=[],order=[];
  pats.forEach(function(p){var id=pickForPattern(p,used);if(id){used.push(id);order.push(genSlot(id,sets));}});
  GEN.session={focus:f.name,order:order};
}

/* ============ CAL AI WEEKLY DUMP ============
   Cal AI has no public API and no verified deep link, so nothing here pretends to talk to it.
   What it does is accept a week of nutrition in one paste: either the JSON shape below, or plain
   rows copied from a export, one day per line. Protein against your target sets the green days on
   the scorecard; calories are stored for the trend. A day already logged is overwritten, so
   re-pasting the same week is safe. */
function calaiSheet(){
  var pt=proteinTarget();
  openSheet('<div class="grab"></div><h3>Weekly nutrition dump</h3>'+
    '<div class="ssub">Paste a week from Cal AI. One day per line, or the JSON shape. '+(pt?('Protein target is <b>'+pt.lo+'-'+pt.hi+' g</b>.'):'Log a weigh-in to set your protein target.')+'</div>'+
    '<textarea class="ta" id="cj" style="min-height:150px" placeholder="2026-07-27, 168, 2210&#10;2026-07-26, 141, 1980&#10;&#10;or&#10;{&quot;days&quot;:[{&quot;date&quot;:&quot;2026-07-27&quot;,&quot;proteinG&quot;:168,&quot;calories&quot;:2210}]}"></textarea>'+
    '<div class="anote" style="margin-top:10px">Date, protein in grams, calories. Calories are optional.</div>'+
    '<button class="sheet-cta" onclick="doCalai()">Import the week</button>');
}
function parseCalai(t){
  t=(t||"").trim();if(!t)return [];
  if(t.charAt(0)==="{"||t.charAt(0)==="["){
    var o;try{o=JSON.parse(t)}catch(e){return null;}
    var arr=o.days||o.entries||(Array.isArray(o)?o:[]);
    return arr.map(function(r){
      return {date:r.date,protein:+(r.proteinG!=null?r.proteinG:r.protein),cals:+(r.calories!=null?r.calories:r.cals)||0};
    }).filter(function(r){return r.date&&!isNaN(r.protein);});
  }
  var out=[];
  t.split(/\n+/).forEach(function(line){
    var parts=line.split(/[,\t;]+/).map(function(x){return x.trim();});
    if(parts.length<2)return;
    var dt=parts[0],pr=parseFloat(parts[1]),cl=parts.length>2?parseFloat(parts[2]):0;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(dt)||isNaN(pr))return;
    out.push({date:dt,protein:pr,cals:isNaN(cl)?0:cl});
  });
  return out;
}
function doCalai(){
  var rows=parseCalai((document.getElementById("cj")||{}).value);
  if(rows===null){toast("That is not valid JSON.",null);return;}
  if(!rows.length){toast("Nothing readable in there. Date, protein, calories.",null);return;}
  var pt=proteinTarget(),lo=pt?pt.lo:120,hit=0;
  S.nutrition=S.nutrition||{};
  rows.forEach(function(r){
    S.nutrition[r.date]={p:r.protein,c:r.cals};
    if(r.protein>=lo){S.protein[r.date]=true;hit++;}else{delete S.protein[r.date];}
  });
  save();closeSheet();refreshCurrent();
  toast("Imported "+rows.length+" day"+(rows.length===1?"":"s")+", "+hit+" hit protein.",null);
}

function doHealth(){var t=(document.getElementById("hj")||{}).value,o;try{o=JSON.parse(t)}catch(e){toast("That is not valid JSON.",null);return;}
  var n=0;
  if(o.weighins)o.weighins.forEach(function(w){if(w.date&&w.weightLb){S.weigh=S.weigh.filter(function(x){return x.date!==w.date;});S.weigh.push({date:w.date,w:w.weightLb});n++;}});
  S.weigh.sort(function(a,b){return a.date<b.date?-1:1;});
  if(o.activities)o.activities.forEach(function(a){if(!a.date)return;n++;
    if(a.type==="run"||a.distanceMi){S.sessions.push({id:a.date+"-h"+n,date:a.date,type:"run",distanceMi:a.distanceMi||0,durationSec:a.durationSec||0,paceSecPerMi:(a.distanceMi&&a.durationSec)?Math.round(a.durationSec/a.distanceMi):0,rpe:"",notes:"Apple Health"});}
    else{S.sessions.push({id:a.date+"-h"+n,date:a.date,type:"activity",activity:a.type||"Workout",durationSec:a.durationSec||0,notes:"Apple Health"});}
    S.done[a.date]=true;});
  save();closeSheet();toast("Imported "+n+" items from Health.",null);show("progress");}

function anchorComplete(k){var a=S.anchor[k]||{};for(var i=0;i<ANCHOR.length;i++)if(!a[i])return false;return true;}
function planDow(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2]).getDay();}
function recomputeDone(k){
  var has=S.sessions.some(function(s){return s.date===k;})|| !!S.runs[k];
  var pl=planFor(k)||{type:"none"};
  if(has||(pl.type==="rest"&&anchorComplete(k)))S.done[k]=true;else delete S.done[k];
}

function delSession(id){var idx=-1;for(var i=0;i<S.sessions.length;i++)if(S.sessions[i].id===id){idx=i;break;}if(idx<0)return;
  var rm=S.sessions.splice(idx,1)[0];
  if(rm.type==="run")delete S.runs[rm.date];
  if(rm.type==="lift"&&S.wk[rm.date])delete S.wk[rm.date];
  recomputeDone(rm.date);save();renderToday();
  var lbl=rm.type==="lift"?"workout":rm.type==="run"?"run":(rm.activity||"activity");
  toast("Removed "+lbl,function(){S.sessions.splice(idx,0,rm);if(rm.type==="run")S.runs[rm.date]={dist:rm.distanceMi,time:mmss(rm.durationSec),pace:rm.paceSecPerMi?mmss(rm.paceSecPerMi):"--",rpe:rm.rpe};recomputeDone(rm.date);save();renderToday();});
}

  if(CAL.y==null){CAL.y=NOW.getFullYear();CAL.m=NOW.getMonth();}
  var first=new Date(CAL.y,CAL.m,1),lead=(first.getDay()+6)%7,days=new Date(CAL.y,CAL.m+1,0).getDate();
