}</style>
<script>
var SLOT="2026-11-04", PAGE="lift";
var SLOTID=SLOT+"-"+PAGE;
function today(){var d=new Date(),p=function(n){return (n<10?"0":"")+n;};
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}
var I={"check":"<svg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M5 12.5l4.2 4.2L19 7\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>","chevD":"<svg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>","play":"<svg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M7 5l12 7-12 7V5Z\" fill=\"currentColor\"/></svg>"};

var LS="train_v2";
function loadS(){try{return JSON.parse(localStorage.getItem(LS));}catch(e){return null;}}
function haveStore(){var s=loadS();return !!(s&&typeof s==="object"&&s.sessions);}
function logSession(rec,date){
  var S=loadS(); if(!S||!S.sessions) return false;
  S.sessions=S.sessions||[]; S.done=S.done||{};
  S.sessions=S.sessions.filter(function(x){return x.id!==rec.id;});
  if(!rec.draft) S.sessions.filter(function(x){return x&&x.draft&&x.slot===rec.slot;}).forEach(function(x){tombId(S,x.id);});
  S.sessions.push(rec); S.done[date]=true;
  try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){return false;}
  try{ if(window.TrainSyncAuto && typeof window.TrainSyncAuto.now==="function") window.TrainSyncAuto.now(); }catch(e){}
  return true;
}
function pkey(){return "trainday."+SLOT+"."+PAGE;}
function loadProg(){try{return JSON.parse(localStorage.getItem(pkey()))||{};}catch(e){return {};}}
function saveProg(p){try{localStorage.setItem(pkey(),JSON.stringify(p));}catch(e){}}
function noStore(){
  var w=document.createElement("div"); w.className="warn";
  w.innerHTML='This browser has no Train data yet, so a tick cannot be saved here. '+
    'Open <a href="../index.html">the Train app</a> once on this device, then come back.';
  var app=document.querySelector(".app"); app.insertBefore(w,app.children[1]);
  [].forEach.call(document.querySelectorAll(".cta"),function(b){if(!b.classList.contains("ghost"))b.disabled=true;});
}
function tombId(S,id){S.deleted=S.deleted||[];S.deleted.push({id:String(id),at:Date.now()});
  S.sessions=(S.sessions||[]).filter(function(x){return !x||String(x.id)!==String(id);});}
function isDead(S,id){return (S.deleted||[]).some(function(t){return t&&String(t.id)===String(id);});}
function localDay(ts){var d=new Date(ts),q=function(n){return (n<10?"0":"")+n;};
  return d.getFullYear()+"-"+q(d.getMonth()+1)+"-"+q(d.getDate());}
function draftFrom(slotId,slotDate,p,focus){
  var done=p.done||{}, keys=Object.keys(done); if(!keys.length) return null;
  var by={},ids=[],rounds={},ts=null;
  keys.forEach(function(k){var ri=k.split(":"),r=+ri[0],i=+ri[1],c=done[k];
    var cell=(c&&typeof c==="object")?c:((p.cells&&p.cells[r]&&p.cells[r][i])||(p.order&&p.order[i])||{});
    var id=cell.exId||(p.order&&p.order[i]&&p.order[i].exId); if(!id) return;
    if(c&&c.ts&&(ts==null||c.ts<ts)) ts=c.ts;
    rounds[r]=1;
    if(!by[id]){by[id]=[];ids.push(id);}
    by[id].push({weightLb:+cell.w||0,reps:+cell.reps||0,completed:true});});
  if(!ids.length) return null;
  var meta={};(p.order||[]).forEach(function(o){if(o&&!meta[o.exId])meta[o.exId]=o;});
  var entries=ids.map(function(id){var o=meta[id]||{};
    return {exerciseId:id,targetLow:o.lo!=null?o.lo:null,targetHigh:o.hi!=null?o.hi:null,
      targetWeightLb:o.w!=null?o.w:null,sets:by[id],bw:!!o.bw,unit:o.unit||"reps"};});
  var date=ts?localDay(ts):slotDate;
  return {id:slotId+"~draft"+(p.draftRev||0),slot:slotId,date:date,type:"lift",
    activity:"Full body"+(focus?", "+focus:""),durationSec:0,notes:"day-page autosave",
    rounds:Object.keys(rounds).length,focus:focus||null,entries:entries,warmup:!!p.wu,
    feel:null,twinge:false,draft:true};
}
function putDraft(S,rec){
  if(!rec) return false;
  if(S.sessions.some(function(x){return x&&x.slot===rec.slot&&!x.draft;})) return false;
  if(isDead(S,rec.id)||isDead(S,rec.slot)) return false;   /* he deleted this session once; never resurrect it */
  var prev=S.sessions.filter(function(x){return x&&x.id===rec.id;})[0];
  if(prev&&JSON.stringify(prev)===JSON.stringify(rec)) return false;
  S.sessions=S.sessions.filter(function(x){return !x||x.id!==rec.id;});
  S.sessions.push(rec); S.done=S.done||{}; S.done[rec.date]=true; return true;
}
function syncNow(){try{ if(window.TrainSyncAuto&&typeof window.TrainSyncAuto.now==="function") window.TrainSyncAuto.now(); }catch(e){}}
function sweepOrphans(){
  var S=loadS(); if(!S||!S.sessions) return 0; var n=0;
  for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);
    if(!k||k.indexOf("trainday.")!==0||k.slice(-5)!==".lift") continue;
    var slotDate=k.slice(9,-5), p=null;
    if(Date.now()-Date.parse(slotDate+"T12:00:00")>30*86400000) continue;   /* a month is rescue; older is archaeology */
    try{p=JSON.parse(localStorage.getItem(k));}catch(e){}
    if(!p||!p.done) continue;
    if(putDraft(S,draftFrom(slotDate+"-lift",slotDate,p,p.focus||null))) n++;}
  if(n){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){return 0;} syncNow();}
  return n;
}
try{ sweepOrphans(); }catch(e){}
function markDone(msg){
  var d=document.getElementById("doneflag");
  d.innerHTML='<div class="done-pill">'+"<svg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M5 12.5l4.2 4.2L19 7\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>"+' '+msg+'</div>';
  var c=document.getElementById("ctas"); if(c) c.style.display="none";
}
function openSheet(html){
  document.getElementById("scrim").classList.add("on");
  var old=document.getElementById("sheet"), s=old.cloneNode(false); old.parentNode.replaceChild(s,old);
  s.innerHTML='<div class="grab"></div>'+html; s.classList.add("on");
}
function closeSheet(){
  document.getElementById("scrim").classList.remove("on");
  var s=document.getElementById("sheet"); s.classList.remove("on"); s.innerHTML="";
}

var _rt=null;
function restStart(sec){
  var bar=document.getElementById("restbar"),out=document.getElementById("restt");
  if(_rt)clearInterval(_rt);
  var left=sec; bar.classList.add("on");
  out.textContent=Math.floor(left/60)+":"+("0"+(left%60)).slice(-2);
  _rt=setInterval(function(){left--;
    out.textContent=Math.floor(left/60)+":"+("0"+(Math.max(left,0)%60)).slice(-2);
    if(left<=0){restStop();}},1000);
}
function restStop(){if(_rt){clearInterval(_rt);_rt=null;}document.getElementById("restbar").classList.remove("on");}
document.addEventListener("DOMContentLoaded",function(){ if(!haveStore()) noStore(); });
</script>
</head><body>

  if(W.done[k])delete W.done[k]; else W.done[k]={exId:c0.exId,reps:c0.reps,w:c0.w,ts:Date.now()};
  var row=document.querySelector('.rnd[data-r="'+r+'"] .lrow[data-si="'+si+'"]');
  if(row){var on=cellOn(r,si);row.classList.toggle("checked",on);row.setAttribute("aria-pressed",String(on));}
  paintRound(r);
  var now=roundsDoneN();
  if(now>was){ persist(); syncNow(); }
  if(now>was&&now<W.rN){
    var nxt=Math.min(r+1,W.rN-1);
    var a=document.querySelector('.rnd[data-r="'+r+'"]'), b=document.querySelector('.rnd[data-r="'+nxt+'"]');
    if(a)a.open=false; if(b)b.open=true;
    OPEN[r]=false; OPEN[nxt]=true;
    restStart(REST);
  } else if(now>was&&now>=W.rN){
    [].forEach.call(document.querySelectorAll(".rnd"),function(d){d.open=false;OPEN[+d.getAttribute("data-r")]=false;});
    restStop();
    var fb=document.getElementById("fullbtn"); if(fb&&fb.scrollIntoView) fb.scrollIntoView({behavior:"smooth",block:"center"});
  }
  var dn=roundsDoneN();
  document.getElementById("meta").textContent=
    W.rN+" round"+(W.rN===1?"":"s")+" \u00b7 "+totalSets()+" sets \u00b7 "+REST+"s rest \u00b7 "+EFFORT+(dn?" \u00b7 "+dn+" done":"");
  persist();
}
document.getElementById("addround").addEventListener("click",function(){
  if(W.rN>=RX_CEIL){alert("Eight rounds is the ceiling for a day.");return;}
  var old=W.rN; W.order.forEach(function(o){if(o.upTo!=null&&o.upTo>=old)o.upTo=old+1;});
  W.cells[old]=W.cells[old-1].map(function(c){var n=cloneCell(c);return n;});
  W.rN++; render();
});
document.getElementById("rmround").addEventListener("click",function(){
  if(W.rN<=RX_FLOOR){alert("One round is the floor, and the floor logs the day.");return;}
  var r=W.rN-1;
  for(var i=0;i<W.order.length;i++) if(W.done[rkey(r,i)]){alert("That round has work in it. Untick it first.");return;}
  W.rN--; W.cells.length=W.rN; W.order.forEach(function(o){if(o.upTo!=null&&o.upTo>W.rN)o.upTo=W.rN;});
  render();
});

function numSheet(r,si,what){
  var o=C(r,si), isLoad=(what==="load");
  if(W.done[rkey(r,si)]){openSheet('<h3>'+esc(o.name)+'</h3><div class="ssub">This set is ticked, so it is locked at '+(o.w>0?o.w+' lb x ':'')+o.reps+'. Untick it to change it.</div><button class="sheet-cta ghost" onclick="closeSheet()">OK</button>');return;}
  if(isLoad&&o.band){openSheet('<h3>'+esc(o.name)+'</h3><div class="ssub">Band movements progress by a heavier band or a shorter anchor, not by pounds.</div><button class="sheet-cta ghost" onclick="closeSheet()">Done</button>');return;}
  var val=function(){return isLoad?o.w:o.reps;};
  var later=0;for(var q=r+1;q<W.rN;q++)if(slotIn(q,si)&&!W.done[rkey(q,si)])later++;
  openSheet('<h3>'+esc(o.name)+'</h3><div class="ssub">Round '+(r+1)+(later?' and the '+later+' round'+(later===1?'':'s')+' after it':'')+'. '+(isLoad?"Pounds per dumbbell":"Reps"+(o.lo?", range "+o.lo+" to "+o.hi:""))+'</div>'+
    '<div class="nedit"><button data-d="-1" aria-label="Less">&minus;</button>'+
    '<span class="nv" id="nv">'+val()+'<span class="nu">'+(isLoad?"lb":(o.unit==="s"?"s":"reps"))+'</span></span>'+
    '<button data-d="1" aria-label="More">+</button></div>'+
    '<button class="sheet-cta" onclick="closeSheet()">Done</button>');
  document.getElementById("sheet").addEventListener("click",function(ev){
    var b=ev.target.closest("[data-d]");if(!b)return; var d=+b.getAttribute("data-d");
    var nv=isLoad?stepLoad(o,o.w,d):Math.max(1,o.reps+d);
    forward(r,si,function(c){if(isLoad)c.w=nv;else c.reps=nv;});
    document.getElementById("nv").firstChild.nodeValue=val(); render();
  });
}
function swapSheet(r,si){
  var o=C(r,si), list=(W.alts[W.order[si].exId]||[]).concat(W.alts[o.exId]||[]).filter(function(a,i,arr){
    return a.exId!==o.exId&&arr.findIndex(function(b){return b.exId===a.exId;})===i;});
  if(!list.length){alert("No swap in your kit for that pattern.");return;}
  openSheet('<h3>Swap '+esc(o.name)+'</h3><div class="ssub">Same pattern, kit you own</div>'+
    list.map(function(a,i){return '<button class="optrow" data-alt="'+i+'"><span class="on2">'+esc(a.name)+
      '<div class="oc">'+esc(a.cue||"")+'</div></span></button>';}).join("")+
    '<button class="sheet-cta ghost" onclick="closeSheet()">Cancel</button>');
  document.getElementById("sheet").addEventListener("click",function(ev){
    var b=ev.target.closest("[data-alt]");if(!b)return;
    var a=list[+b.getAttribute("data-alt")];
    forward(r,si,function(c){c.exId=a.exId;c.name=a.name;c.cue=a.cue;c.q=a.name;c.vid=a.vid||null;c.band=!!a.band;c.bw=!!a.bw;
      c.unit=a.unit||"reps";c.bandUp=false;
      if(a.ladder!==c.ladder){c.ladder=a.ladder||null;c.w=(a.ladder==="db"?10:(a.ladder==="kb"?12:0));}});
    closeSheet();render();
  });
}
function addMvSheet(){
  var seen={};W.order.forEach(function(o){seen[o.exId]=1;});
  var pool=[];Object.keys(W.alts).forEach(function(k){(W.alts[k]||[]).forEach(function(a){
    if(!seen[a.exId]&&!pool.some(function(p){return p.exId===a.exId;}))pool.push(a);});});
  pool=pool.slice(0,14);
  if(!pool.length){alert("Nothing left in your kit to add.");return;}
  openSheet('<h3>Add a movement</h3><div class="ssub">Today only. It does not change next week.</div>'+
    pool.map(function(a,i){return '<button class="optrow" data-add="'+i+'"><span class="on2">'+esc(a.name)+
      '<div class="oc">'+esc(a.cue||"")+'</div></span></button>';}).join("")+
    '<button class="sheet-cta ghost" onclick="closeSheet()">Cancel</button>');
  document.getElementById("sheet").addEventListener("click",function(ev){
    var b=ev.target.closest("[data-add]");if(!b)return;
    var a=pool[+b.getAttribute("data-add")];
    var nm={exId:a.exId,name:a.name,cue:a.cue,reps:10,lo:10,hi:12,upTo:null,band:!!a.band,vid:a.vid||null,
      w:(a.ladder==="db"?10:(a.ladder==="kb"?12:0)),ladder:a.ladder||null,q:a.name,
      bw:!!a.bw,unit:a.unit||"reps",tmp:true};
    W.order.push(nm); for(var q=0;q<W.rN;q++)W.cells[q].push(mkCell(nm));
    closeSheet();render();
  });
}
document.getElementById("addmv").addEventListener("click",addMvSheet);
function demoSheet(r,si){
  var o=C(r,si);
  var video=o.vid?'<div class="vbox"><iframe src="https://www.youtube-nocookie.com/embed/'+encodeURIComponent(o.vid)+'?autoplay=1&playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="'+esc(o.name)+'"></iframe></div>'
    :'<a class="sheet-cta" style="text-align:center;line-height:52px;text-decoration:none;color:#fff" target="_blank" rel="noopener" '+
      'href="https://www.youtube.com/results?search_query='+encodeURIComponent(o.q+" form")+'">Find a form video</a>';
  openSheet('<h3>'+esc(o.name)+'</h3><div class="ssub">'+esc(o.cue||"")+'</div>'+video+
    '<button class="sheet-cta ghost" id="swapbtn">Swap for something comparable</button>'+
    '<div class="rsrow"><span class="rsl">Rounds this movement</span><div class="stp">'+
      '<button data-upto="-1">&minus;</button><span class="val num" id="upv">'+(o.upTo==null?W.rN:o.upTo)+'</span><button data-upto="1">+</button></div></div>'+
    '<button class="sheet-cta ghost" id="rmmv">Remove from today</button>'+
    '<button class="sheet-cta ghost" onclick="closeSheet()">Close</button>');
  document.getElementById("sheet").addEventListener("click",function(ev){
    var b=ev.target.closest("[data-upto]");if(!b)return;
    var cur=(o.upTo==null?W.rN:o.upTo), nx=Math.min(W.rN,Math.max(1,cur+(+b.getAttribute("data-upto"))));
    o.upTo=(nx>=W.rN?null:nx); document.getElementById("upv").textContent=(o.upTo==null?W.rN:o.upTo); render();
  });
  document.getElementById("swapbtn").addEventListener("click",function(){swapSheet(r,si);});
  document.getElementById("rmmv").addEventListener("click",function(){
    if(W.order.length<=1){alert("One movement is the floor.");return;}
    for(var q=0;q<W.rN;q++)if(W.done[rkey(q,si)]){alert("That movement has ticked sets. Untick them first, or leave it: what is ticked stays.");return;}
    W.order.splice(si,1); W.cells.forEach(function(row){row.splice(si,1);});
    var nd={};Object.keys(W.done).forEach(function(k){var p=k.split(":"),r=+p[0],i=+p[1];
      if(i===si)return; nd[rkey(r,i>si?i-1:i)]=W.done[k];});
    W.done=nd; closeSheet(); render();
  });
}
function warmSheet(){
  openSheet('<h3>The flow</h3><div class="ssub">Head to toe, before round one</div>'+
    WARM.map(function(w){return '<div class="rsrow"><span class="rsl">'+esc(w.n)+'</span><span class="num">'+esc(w.d)+'</span></div>';}).join("")+
    '<button class="sheet-cta ghost" onclick="closeSheet()">Close</button>');
}

function finish(kind){
  var n=kind==="floor"?1:Math.max(roundsDoneN(),1);
  var by={},ids=[];
  for(var r=0;r<W.rN;r++)for(var i=0;i<W.order.length;i++){var c=W.done[rkey(r,i)];
    if(!c)continue;
    var id=c.exId||W.order[i].exId;
    if(!by[id]){by[id]=[];ids.push(id);}
    by[id].push({weightLb:c.w||0,reps:c.reps||0,completed:true});}
  var entries=ids.map(function(id){
    var o=null;W.cells.forEach(function(row){row.forEach(function(x){if(!o&&x.exId===id)o=x;});});
    return {exerciseId:id,targetLow:o?o.lo:null,targetHigh:o?o.hi:null,
      targetWeightLb:o?(o.w||0):null,sets:by[id],bw:!!(o&&o.bw),unit:(o&&o.unit)||"reps"};});
  var D=today();
  var ok=logSession({id:SLOTID,slot:SLOTID,date:D,type:"lift",activity:"Full body, "+"pull",
    durationSec:n*179,notes:"day-page "+kind,rounds:n,focus:"pull",
    entries:entries, warmup:W.wu, feel:FEEL.feel, twinge:FEEL.twinge},D);
  if(!ok){noStore();return;}
  restStop();
  markDone(kind==="floor"?"Floor logged. One round is a kept day.":n+" round"+(n===1?"":"s")+" in the book");
}
var FEEL={feel:null,twinge:false};
function feelSheet(kind){
  openSheet('<h3>How did that feel?</h3><div class="ssub">One tap logs it. This is what sets next time.</div>'+
    '<button class="optrow" id="twg" aria-pressed="false"><span class="on2">Something twinged<div class="oc">neck, back, shoulder or a joint. Tap to mark, then pick below</div></span><span id="twgv" class="oc">no</span></button>'+
    '<button class="sheet-cta" data-feel="easy">Easy. Plenty left in the tank</button>'+
    '<button class="sheet-cta" data-feel="right" style="margin-top:8px">About right</button>'+
    '<button class="sheet-cta" data-feel="hard" style="margin-top:8px">Hard. Near my limit</button>'+
    '<button class="sheet-cta ghost" onclick="closeSheet()">Not yet</button>');
  var s=document.getElementById("sheet");
  s.addEventListener("click",function(ev){
    var b=ev.target.closest("button");if(!b)return;
    if(b.id==="twg"){FEEL.twinge=!FEEL.twinge;document.getElementById("twgv").textContent=FEEL.twinge?"yes":"no";b.setAttribute("aria-pressed",String(FEEL.twinge));return;}
    if(b.hasAttribute("data-feel")){FEEL.feel=b.getAttribute("data-feel");closeSheet();finish(kind);}
  });
}
document.getElementById("fullbtn").addEventListener("click",function(){feelSheet("full");});
document.getElementById("floorbtn").addEventListener("click",function(){feelSheet("floor");});
render();
</script>
