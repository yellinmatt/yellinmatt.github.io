<!doctype html>
<html lang="en"><head>

<!-- Same posture as the app, narrowed to what a day page actually needs. It shipped with no policy
     at all, which is a gap rather than a choice: these are published pages on the same origin as
     his health data. frame-src is nocookie only, img-src excludes ytimg so nothing reaches Google
     until he taps play, and connect-src carries self for the sync client plus the Worker. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; frame-src https://www.youtube-nocookie.com; connect-src 'self' https://train-sync.yellinmatt.workers.dev; form-action 'none'; base-uri 'none'">
<title>Lift, push focus</title>
<style>

width:100%;text-align:left;background:none}

display:flex;align-items:center;justify-content:center;transition:.15s}
.arow .chk svg{width:13px;height:13px;opacity:0;transition:.15s}
.arow.checked .chk{background:var(--good);border-color:var(--good);color:var(--white)}

.arow.checked .an{color:var(--faint)}
.arow .axv{width:44px;min-height:44px;flex:none;border:0;background:none;color:var(--faint);
display:flex;align-items:center;justify-content:center;border-radius:10px}
.arow .axv:active{background:var(--surface-2)}
.arow .axv svg{width:20px;height:20px}
.arow .axn{flex:none;min-width:56px;min-height:44px;border:0;background:none;padding:0 0 0 6px;
text-align:right;font-size:23px;font-weight:700;letter-spacing:-.02em;color:var(--ink);line-height:44px}
.arow .axn.word{font-size:14px;font-weight:600;color:var(--sub);letter-spacing:0;
max-width:48%;white-space:normal;line-height:1.3;text-align:right;height:auto;padding:8px 0 8px 8px;
display:flex;align-items:center;justify-content:flex-end}
.arow .an{overflow-wrap:anywhere}
.lrow{display:grid;grid-template-columns:22px minmax(0,1fr) 34px 60px 48px;column-gap:6px;align-items:center;
padding:9px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;cursor:pointer}
.lrow:last-child{border-bottom:0}
.lrow,.optrow{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.lrow.dragging,.optrow.dragging{background:var(--surface-2);box-shadow:var(--shadow);border-radius:10px;position:relative;z-index:5;transform:scale(1.02);transition:transform .12s}
body.dragmode{touch-action:none;overscroll-behavior:none}
.lrow .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);display:flex;
align-items:center;justify-content:center;transition:.15s}
.lrow .chk svg{width:14px;height:14px;opacity:0;transition:.15s}
.lrow.checked .chk{background:var(--good);border-color:var(--good);color:var(--white)}

.lrow .how{width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--accent);

.lrow .how svg{width:13px;height:13px;margin-left:2px}
.lrow .how:active,.lrow .how:hover{border-color:var(--accent)}

font-variant-numeric:tabular-nums;color:var(--ink);padding:0;cursor:pointer}
.lbox:hover{border-color:var(--sub)}

.lhead{display:grid;grid-template-columns:22px minmax(0,1fr) 34px 60px 48px;column-gap:6px;padding:10px 0 0}
.lhead span{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);text-align:center}
.rnd .abody{padding:4px 14px 10px}
.nedit{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0 4px}

.arow.checked .axn,.arow.checked .axn.word{color:var(--faint)}

box-shadow:var(--shadow);margin-bottom:8px}
.rnd>summary{list-style:none;cursor:pointer;display:flex;align-items:center;
justify-content:space-between;gap:10px;padding:13px 20px;min-height:56px}
.rnd>summary::-webkit-details-marker{display:none}
.rnd .asum{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.rnd .aright{display:flex;align-items:center;gap:10px}
.rnd .acount{font-size:13px;font-weight:700;color:var(--sub)}
.rnd.alldone .acount{color:var(--good)}
.rnd[open]>summary{border-bottom:1px solid var(--line)}
.rnd .abody{padding:4px 20px 12px}
.rnd .mrtrack{stroke:var(--line)}

.miniring svg{transform:rotate(-90deg)}
.miniring circle:last-child{transition:stroke-dashoffset .5s cubic-bezier(.22,1,.36,1)}

background:none;color:var(--sub);font-size:14px;font-weight:600;cursor:pointer}
.rndctl button:active{background:var(--surface-2)}
.tgs{font-size:11px;color:var(--faint);margin-top:6px;line-height:1.35}
.done-pill{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;
margin-top:18px;background:var(--good-tint);color:var(--good);border-radius:var(--r-btn);
font-size:17px;font-weight:700}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:50}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);
border-radius:20px 20px 0 0;padding:14px 20px calc(22px + env(safe-area-inset-bottom));
max-height:82vh;overflow:auto;display:none;box-shadow:0 -16px 52px rgba(0,0,0,.6)}

.sheet h3{font-size:19px;font-weight:800;margin-bottom:3px}
.ssub{font-size:13px;color:var(--sub);margin-bottom:12px}
.rsrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;
border-bottom:1px solid var(--line)}
.rsl{font-size:15px;color:var(--sub)}
.stp{display:flex;align-items:center;background:var(--surface-2);border-radius:10px;height:44px;overflow:hidden}
.stp button{width:44px;height:44px;font-size:24px;font-weight:600;color:var(--sub);flex:none;
display:flex;align-items:center;justify-content:center}
.stp .val{flex:1;text-align:center;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;
min-width:56px;padding:0}
.sheet-cta{display:block;width:100%;min-height:52px;border-radius:var(--r-btn);background:var(--accent);
color:#fff;font-size:17px;font-weight:800;margin-top:14px}
.sheet-cta.ghost{background:var(--surface-2);color:var(--ink);font-size:15px;font-weight:650;margin-top:8px}
.optrow{display:flex;align-items:center;gap:12px;width:100%;padding:13px 0;border-bottom:1px solid var(--line);
text-align:left;font-size:15px}
.optrow .on2{flex:1;font-weight:600}
.libq{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:transparent;color:inherit;margin-top:4px}
.optrow .oc{font-size:13px;color:var(--faint);font-weight:400}
.cta{display:block;width:100%;min-height:54px;border-radius:var(--r-btn);background:var(--accent);
color:#fff;font-size:17px;font-weight:800;margin-top:10px}
.cta.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);font-size:15px;font-weight:650}
.cta[disabled]{opacity:.45}
.warn{background:var(--accent-tint);border:1px solid var(--accent);border-radius:var(--r-btn);
padding:12px;font-size:14px;margin:12px 0;line-height:1.4}
.note{color:var(--faint);font-size:12.5px;margin-top:10px;line-height:1.4}
.back{display:inline-block;margin:20px 0 6px;color:var(--sub);text-decoration:none;font-size:14px;font-weight:650}
a{color:var(--accent)}
.restbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface-2);color:#fff;
display:none;align-items:center;justify-content:space-between;gap:14px;
padding:14px 20px calc(14px + env(safe-area-inset-bottom))}
.restbar.on{display:flex}
.restbar .rt{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.restbar button{color:var(--sub);font-size:14px;font-weight:700}
.vwrap{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000}
.vwrap iframe,.vwrap button{position:absolute;inset:0;width:100%;height:100%;border:0}
.vwrap button{background:linear-gradient(140deg,var(--accent-tint),var(--surface-2));color:#fff;
font:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px}
.vwrap button svg{width:30px;height:30px;flex:none}
.seg{display:flex;gap:6px;background:var(--surface-2);border-radius:11px;padding:4px;margin-bottom:12px}
.segb{flex:1;min-height:44px;border-radius:8px;background:none;color:var(--sub);font-size:15px;font-weight:700}
.segb.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.fld{width:112px;height:46px;border-radius:10px;background:var(--surface-2);color:var(--ink);
text-align:right;padding:0 13px;font-size:19px;font-weight:700;border:1px solid transparent}
.fld:focus{outline:none;border-color:var(--accent)}
.pace{font-size:13px;color:var(--faint);text-align:right;margin-top:10px;min-height:16px}
.planbtn{flex:none;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line-2);
background:var(--surface-2);color:var(--ink);font-size:14px;font-weight:700;margin-top:6px}
.nextup{margin-top:10px;font-size:14px;color:var(--sub);line-height:1.45;text-align:center}
@media (min-width:700px){
  .app{max-width:820px;padding:0 28px}
  .head .title{font-size:34px}
  .head .sub{font-size:15px}
  .rnd>summary{padding:16px 26px;min-height:64px}
  .rnd .asum,.rnd .acount{font-size:14px}
  .rnd .abody{padding:6px 26px 14px}
  .lrow,.lhead{grid-template-columns:32px minmax(0,1fr) 52px 120px 100px;column-gap:16px}
  .lrow{padding:12px 0}
  .lrow .chk{width:30px;height:30px}
  .lrow .an{font-size:19px}
  .lrow .how{width:48px;height:48px}
  .lrow .how svg{width:18px;height:18px}
  .lbox{height:56px;font-size:26px;border-radius:14px}
  .lbox.muted{font-size:16px}
  .lhead span{font-size:12px}
  .rndctl button,.cta{max-width:none}
  .sheet{left:0;right:0;margin:0 auto;bottom:24px;width:600px;max-width:calc(100% - 48px);border-radius:20px;padding:18px 26px 24px}
}</style>
<script>
function today(){var d=new Date(),p=function(n){return (n<10?"0":"")+n;};
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}
var PAGE="push";
var SLOT=(function(){
  var t=today(), y=new Date(Date.now()-86400000), p=function(n){return (n<10?"0":"")+n;};
  var yd=y.getFullYear()+"-"+p(y.getMonth()+1)+"-"+p(y.getDate());
  try{ var raw=localStorage.getItem("trainday."+yd+"."+PAGE), pr=raw?JSON.parse(raw):null;
    var S0=JSON.parse(localStorage.getItem("train_v2")||"null");
    var logged=S0&&S0.sessions&&S0.sessions.some(function(x){return x&&x.slot===yd+"-"+PAGE&&!x.draft;});
    if(pr&&pr.done&&Object.keys(pr.done).length&&!logged){
      var ts=0;for(var k in pr.done){var c=pr.done[k];if(c&&c.ts&&c.ts>ts)ts=c.ts;}
      if(ts&&Date.now()-ts<18*3600000) return yd; }
  }catch(e){}
  return t; })();
var SLOTID=SLOT+"-"+PAGE;
var I={"check":"<svg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M5 12.5l4.2 4.2L19 7\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>","chevD":"<svg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>","play":"<svg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M7 5l12 7-12 7V5Z\" fill=\"currentColor\"/></svg>"};

var LS="train_v2";
function loadS(){try{return JSON.parse(localStorage.getItem(LS));}catch(e){return null;}}
function haveStore(){var s=loadS();return !!(s&&typeof s==="object"&&s.sessions);}
function logSession(rec,date){
  var S=loadS(); if(!S||!S.sessions) return false;
  S.sessions=S.sessions||[]; S.done=S.done||{};
  S.sessions=S.sessions.filter(function(x){return x.id!==rec.id;});
  if(!rec.draft) S.sessions.filter(function(x){return x&&x.draft&&x.slot===rec.slot;}).forEach(function(x){tombId(S,x.id);});
  S.sessions.push(rec); S.done[date]=true;
  try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){return false;}
  try{ if(window.TrainSyncAuto && typeof window.TrainSyncAuto.now==="function") window.TrainSyncAuto.now(); }catch(e){}
  return true;
}
function pkey(){return "trainday."+SLOT+"."+PAGE;}
function loadProg(){try{return JSON.parse(localStorage.getItem(pkey()))||{};}catch(e){return {};}}
function saveProg(p){try{localStorage.setItem(pkey(),JSON.stringify(p));}catch(e){}}
function noStore(){
  var w=document.createElement("div"); w.className="warn";
  w.innerHTML='This browser has no Train data yet, so a tick cannot be saved here. '+
    'Open <a href="../index.html">the Train app</a> once on this device, then come back.';
  var app=document.querySelector(".app"); app.insertBefore(w,app.children[1]);
  [].forEach.call(document.querySelectorAll(".cta"),function(b){if(!b.classList.contains("ghost"))b.disabled=true;});
}
function tombId(S,id){S.deleted=S.deleted||[];S.deleted.push({id:String(id),at:Date.now()});
  S.sessions=(S.sessions||[]).filter(function(x){return !x||String(x.id)!==String(id);});}
function isDead(S,id){return (S.deleted||[]).some(function(t){return t&&String(t.id)===String(id);});}
function localDay(ts){var d=new Date(ts),q=function(n){return (n<10?"0":"")+n;};
  return d.getFullYear()+"-"+q(d.getMonth()+1)+"-"+q(d.getDate());}
function draftFrom(slotId,slotDate,p,focus){
  var done=p.done||{}, keys=Object.keys(done); if(!keys.length) return null;
  var by={},ids=[],rounds={},ts=null;
  keys.forEach(function(k){var ri=k.split(":"),r=+ri[0],i=+ri[1],c=done[k];
    var cell=(c&&typeof c==="object")?c:((p.cells&&p.cells[r]&&p.cells[r][i])||(p.order&&p.order[i])||{});
    var id=cell.exId||(p.order&&p.order[i]&&p.order[i].exId); if(!id) return;
    if(c&&c.ts&&(ts==null||c.ts<ts)) ts=c.ts;
    rounds[r]=1;
    if(!by[id]){by[id]=[];ids.push(id);}
    by[id].push({weightLb:+cell.w||0,reps:+cell.reps||0,completed:true});});
  if(!ids.length) return null;
  var meta={};(p.order||[]).forEach(function(o){if(o&&!meta[o.exId])meta[o.exId]=o;});
  var entries=ids.map(function(id){var o=meta[id]||{};
    return {exerciseId:id,targetLow:o.lo!=null?o.lo:null,targetHigh:o.hi!=null?o.hi:null,
      targetWeightLb:o.w!=null?o.w:null,sets:by[id],bw:!!o.bw,unit:o.unit||"reps"};});
  var date=ts?localDay(ts):slotDate;
  return {id:slotId+"~draft"+(p.draftRev||0),slot:slotId,date:date,type:"lift",
    activity:"Full body"+(focus?", "+focus:""),durationSec:0,notes:"day-page autosave",
    rounds:Object.keys(rounds).length,focus:focus||null,entries:entries,warmup:!!p.wu,
    feel:null,twinge:false,draft:true};
}
function putDraft(S,rec){
  if(!rec) return false;
  if(S.sessions.some(function(x){return x&&x.slot===rec.slot&&!x.draft;})) return false;
  if(isDead(S,rec.id)||isDead(S,rec.slot)) return false;   /* he deleted this session once; never resurrect it */
  var prev=S.sessions.filter(function(x){return x&&x.id===rec.id;})[0];
  if(prev&&JSON.stringify(prev)===JSON.stringify(rec)) return false;
  S.sessions=S.sessions.filter(function(x){return !x||x.id!==rec.id;});
  S.sessions.push(rec); S.done=S.done||{}; S.done[rec.date]=true; return true;
}
function syncNow(){try{ if(window.TrainSyncAuto&&typeof window.TrainSyncAuto.now==="function") window.TrainSyncAuto.now(); }catch(e){}}
function sweepOrphans(){
  var S=loadS(); if(!S||!S.sessions) return 0; var n=0;
  for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);
    if(!k||k.indexOf("trainday.")!==0) continue;
    var km=/^trainday\.(\d{4}-\d{2}-\d{2})\.(lift|push|pull|legs)$/.exec(k); if(!km) continue;
    var slotDate=km[1], sfx=km[2], p=null;
    if(Date.now()-Date.parse(slotDate+"T12:00:00")>30*86400000) continue;   /* a month is rescue; older is archaeology */
    try{p=JSON.parse(localStorage.getItem(k));}catch(e){}
    if(!p||!p.done) continue;
    if(sfx!=="lift"&&slotDate===SLOT&&sfx===PAGE) continue;   /* the session open on this page autosaves itself */
    if(putDraft(S,draftFrom(slotDate+"-"+sfx,slotDate,p,p.focus||(sfx!=="lift"?sfx:null)))) n++;}
  if(n){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){return 0;} syncNow();}
  return n;
}
try{ sweepOrphans(); }catch(e){}

var _rt=null;
function restStart(sec){
  var bar=document.getElementById("restbar"),out=document.getElementById("restt");
  if(_rt)clearInterval(_rt);
  var left=sec; bar.classList.add("on");
  out.textContent=Math.floor(left/60)+":"+("0"+(left%60)).slice(-2);
  _rt=setInterval(function(){left--;
    out.textContent=Math.floor(left/60)+":"+("0"+(Math.max(left,0)%60)).slice(-2);
    if(left<=0){restStop();}},1000);
}
function restStop(){if(_rt){clearInterval(_rt);_rt=null;}document.getElementById("restbar").classList.remove("on");}

      if(k==="hi")m.hi=Math.max(m.lo,m.hi+d);
      if(k==="nx")t.reps=Math.max(m.lo,Math.min(m.hi,(t.reps!=null?t.reps:m.lo)+d));
      if(k==="up"){var u=(m.upTo||0)+d;u=Math.max(0,Math.min(PROG_RN,u));m.upTo=u||undefined;if(!u)delete m.upTo;}
      m.reps=m.lo; t.top=0;
      var v={lb:t.lb,lo:m.lo,hi:m.hi,nx:t.reps,up:m.upTo||0}[k]; var el=document.getElementById("pv-"+k); if(el)el.textContent=v; return;}
    if(b.id==="peswap"){peSwap(i);return;}
    if(b.id==="peup"&&i>0){PE.splice(i-1,0,PE.splice(i,1)[0]);planSheet();return;}
    if(b.id==="pedn"&&i<PE.length-1){PE.splice(i+1,0,PE.splice(i,1)[0]);planSheet();return;}
    if(b.id==="perm"){if(PE.length<=1){alert("One movement is the floor.");return;}PE.splice(i,1);planSheet();return;}
    if(b.id==="peback"){planSheet();return;}});
}

}

function peAdd(){var seen={};PE.forEach(function(m){seen[shownId(m,WK)]=1;});
  var pool=Object.keys(LIBM).filter(function(k){return !seen[k];}).map(function(k){var l=LIBM[k];return {exId:k,name:l.n,cue:l.c};})
    .sort(function(a,b){return a.name<b.name?-1:1;});
  pickSheet("Add to the plan",pool,function(a){PE.push({exId:a.exId,reps:10,lo:10,hi:12,own:true,upTo:2,t:{}});peRow(PE.length-1);},seen);}
function copyToday(){var last=W.cells[W.rN-1]||W.cells[0]||[];
  return W.order.map(function(o,i){var c=(W.cells[W.rN-1]&&W.cells[W.rN-1][i])||(W.cells[0]&&W.cells[0][i])||o;
    var planId=(o.planId==="neutralpress"&&c.exId==="inclinepress")?"neutralpress":c.exId;
    var row={exId:planId,reps:c.lo||o.lo,lo:c.lo||o.lo,hi:c.hi||o.hi,own:true,t:{}};
    if(o.upTo)row.upTo=o.upTo;
    row.t[c.exId]={lb:c.w>0?c.w:null,reps:c.reps,top:0,at:SLOT};return row;});}
function peSave(){var S=loadS();if(!S){noStore();return;}
  var P=planDoc(S); P.days[FOCUS]=PE; if(!savePlan(S)){alert("Could not save on this device.");return;}
  PE=null; closeSheet();
  if(!Object.keys(W.done).length){ try{localStorage.removeItem(pkey());}catch(e){} location.reload(); }
  else alert("Plan saved. Today's session keeps what you already set; the next one starts from the new plan.");}
