  var S=loadS(); if(!S||!S.sessions) return false;

  S.sessions=S.sessions.filter(function(x){return x.id!==rec.id;});

}

var _rt=null;
function restStart(sec){
  var bar=document.getElementById("restbar"),out=document.getElementById("restt");
  if(_rt)clearInterval(_rt);
  var left=sec; bar.classList.add("on");

e","cue":"jump to the top, lower for five seconds, repeat","bw":true,"unit":"reps"},{"exId":"pullband","name":"Band-assisted pull-up","cue":"foot in the band, full hang to chin over the bar","bw":true,"unit":"reps"},{"exId":"chinup","name":"Chin-up","cue":"palms toward you, full hang, chest to the bar","bw":true,"unit":"reps"}],"bandcurl":[{"exId":"ohextend","name":"Overhead extension on a table edge","cue":"hands on the edge, upper arms beside the ears, hinge at the elbow only","bw":true,"unit":"reps"},{"exId":"ringcurl","name":"Bodyweight curl on a strap","cue":"elbows fixed and high, curl yourself up","bw":true,"unit":"reps"},{"exId":"dbcurl","name":"DB biceps curl","cue":"elbows pinned to ribs, no swing, slow lower","bw":false,"unit":"reps"},{"exId":"hammercurl","name":"DB hammer curl","cue":"neutral grip, elbows still, brachialis and forearm","bw":false,"unit":"reps"},{"exId":"facepull","name":"Band face pull","cue":"elbows high, external rotate (shoulder health)","bw":true,"unit":"reps"},{"exId":"pullapart","name":"Band pull-apart","cue":"straight arms, squeeze the shoulder blades, chin tucked","bw":true,"unit":"reps"},{"exId":"latraise","name":"DB lateral raise","cue":"soft elbows, lead with the elbow, stop at shoulder height, no shrug","bw":false,"unit":"reps"},{"exId":"ytw","name":"Prone Y-T-W raises","cue":"thumbs up, low traps, no neck","bw":true,"unit":"reps"}],"ohextend":[{"exId":"ringcurl","name":"Bodyweight curl on a strap","cue":"elbows fixed and high, curl yourself up","bw":true,"unit":"reps"},{"exId":"dbcurl","name":"DB biceps curl","cue":"elbows pinned to ribs, no swing, slow lower","bw":false,"unit":"reps"},{"exId":"hammercurl","name":"DB hammer curl","cue":"neutral grip, elbows still, brachialis and forearm","bw":false,"unit":"reps"},{"exId":"bandcurl","name":"Band biceps curl","cue":"stand on the band, elbows pinned to the ribs, slow on the way down","bw":true,"unit":"reps"},{"exId":"facepull","name":"Band face pull","cue":"elbows high, external rotate (shoulder health)","bw":true,"unit":"reps"},{"exId":"pullapart","name":"Band pull-apart","cue":"straight arms, squeeze the shoulder blades, chin tucked","bw":true,"unit":"reps"},{"exId":"latraise","name":"DB lateral raise","cue":"soft elbows, lead with the elbow, stop at shoulder height, no shrug","bw":false,"unit":"reps"},{"exId":"ytw","name":"Prone Y-T-W raises","cue":"thumbs up, low traps, no neck","bw":true,"unit":"reps"}]}};
var WARM=[{"n":"Pogo jumps","d":"x20"},{"n":"Neck counter-rotation","d":"x5/side, pause 3s"},{"n":"Shoulder pass-through","d":"x10, band, towel or no hands"},{"n":"Cossack squats","d":"x6/side, pause 3s"},{"n":"World's greatest stretch","d":"x5/side, pause 3s"},{"n":"Thread the needle","d":"x6/side, reach and hold 3s"},{"n":"90/90 hip switch","d":"x8, hold 5s each side"},{"n":"catcow","d":""}];
var OPEN={};

var BUILD="1789947310905";
(function(){ var p=loadProg();
  if(p&&p.build===BUILD&&p.order&&p.order.length){ W.rN=p.rN||W.rN; W.order=p.order; W.done=p.done||{}; W.wu=!!p.wu; }
})();
function persist(){ saveProg({build:BUILD,rN:W.rN,order:W.order,done:W.done,wu:W.wu}); }

function rkey(r,si){return r+":"+si;}
function slotIn(r,si){var o=W.order[si];return o.upTo==null||r<o.upTo;}
function roundSlots(r){var n=0;for(var i=0;i<W.order.length;i++)if(slotIn(r,i))n++;return n;}
function cellOn(r,si){return !!W.done[rkey(r,si)];}
function roundDoneN(r){var n=0;for(var i=0;i<W.order.length;i++)if(slotIn(r,i)&&cellOn(r,i))n++;return n;}
function roundComplete(r){var t=roundSlots(r);return t>0&&roundDoneN(r)>=t;}
function roundsDoneN(){var n=0;for(var r=0;r<W.rN;r++)if(roundComplete(r))n++;return n;}
function firstOpenRound(){for(var r=0;r<W.rN;r++)if(!roundComplete(r))return r;return W.rN-1;}
function doseOf(o){ return o.band ? ("band x"+o.reps) : ((o.w>0?o.w+"lb ":"")+"x"+o.reps); }

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function warmRow(){
  return '<div class="arow'+(W.wu?" checked":"")+'" role="button" tabindex="0" aria-pressed="'+W.wu+'" data-wu="1">'+
    '<span class="chk">'+I.check+'</span>'+
    '<span class="atxt"><span class="an">Warm-up</span></span>'+
    '<button class="axv" data-warmvid="1" aria-label="The flow">'+I.play+'</button>'+
    '<button class="axn word" data-warmsheet="1" aria-label="The flow, tap to see it">The flow</button>'+
    '</div>';
}
function rowHTML(r,si){
  var o=W.order[si],on=cellOn(r,si);
  return '<div class="arow'+(on?" checked":"")+'" data-si="'+si+'" data-r="'+r+'" role="button" tabindex="0" aria-pressed="'+on+'">'+
    '<span class="chk">'+I.check+'</span>'+
    '<span class="atxt"><span class="an">'+esc(o.name)+'</span></span>'+
    '<button class="axv" data-demo="'+si+'" aria-label="How to do '+esc(o.name)+'">'+I.play+'</button>'+
    '<button class="axn'+(o.band?" word":"")+'" data-sheet="'+si+'" aria-label="'+esc(doseOf(o))+', tap to change">'+
      esc(o.band?doseOf(o):doseOf(o).replace(/^x/,""))+'</button>'+
    '</div>';
}
function roundHTML(r){
  var n=roundDoneN(r),tot=roundSlots(r),full=tot>0&&n>=tot;
  var open = (OPEN[r]!=null) ? OPEN[r] : (r===firstOpenRound());
  var C=2*Math.PI*13, off=C*(1-(tot?n/tot:0));
  var rows = (r===0?warmRow():"");
  for(var i=0;i<W.order.length;i++) if(slotIn(r,i)) rows+=rowHTML(r,i);
  return '<details class="rnd'+(full?" alldone":"")+'" data-r="'+r+'"'+(open?" open":"")+'><summary>'+
    '<span class="asum">Round '+(r+1)+'</span>'+
    '<span class="aright"><span class="acount num">'+n+' of '+tot+'</span>'+
    '<span class="chev">'+I.chevD+'</span>'+
    '<span class="miniring"><svg width="30" height="30" viewBox="0 0 34 34">'+
    '<circle class="mrtrack" cx="17" cy="17" r="13" fill="none" stroke-width="4"/>'+
    '<circle cx="17" cy="17" r="13" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" '+
    'stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/>'+
    '</svg></span></span></summary><div class="abody">'+rows+'</div></details>';
}
function totalSets(){var t=0;for(var r=0;r<W.rN;r++)t+=roundSlots(r);return t;}
function render(){
  [].forEach.call(document.querySelectorAll(".rnd"),function(d){OPEN[+d.getAttribute("data-r")]=d.open;});
  var h="";for(var r=0;r<W.rN;r++)h+=roundHTML(r);
  document.getElementById("rounds").innerHTML=h;
  var dn=roundsDoneN();
  document.getElementById("meta").textContent=
    W.rN+" round"+(W.rN===1?"":"s")+" \u00b7 "+totalSets()+" sets \u00b7 "+REST+"s rest"+(dn?" \u00b7 "+dn+" done":"");
  persist();
}

document.addEventListener("click",function(ev){
  var t=ev.target.closest("button, .arow");
  if(!t)return;
  if(t.hasAttribute&&t.hasAttribute("data-demo")){ev.stopPropagation();demoSheet(+t.getAttribute("data-demo"));return;}
  if(t.hasAttribute&&t.hasAttribute("data-sheet")){ev.stopPropagation();repSheet(+t.getAttribute("data-sheet"));return;}
  if(t.hasAttribute&&t.hasAttribute("data-warmvid")){ev.stopPropagation();warmSheet();return;}
  if(t.hasAttribute&&t.hasAttribute("data-warmsheet")){ev.stopPropagation();warmSheet();return;}
  if(t.classList&&t.classList.contains("arow")){
    if(t.hasAttribute("data-wu")){W.wu=!W.wu;render();return;}
    tick(+t.getAttribute("data-r"), +t.getAttribute("data-si"));return;
  }
},true);

function paintRound(r){
  var card=document.querySelector('.rnd[data-r="'+r+'"]'); if(!card)return;
  var n=roundDoneN(r), tot=roundSlots(r);
  card.classList.toggle("alldone", tot>0&&n>=tot);
  var cnt=card.querySelector(".acount"); if(cnt)cnt.textContent=n+" of "+tot;
  var ring=card.querySelectorAll(".miniring circle")[1];
  if(ring){var C=2*Math.PI*13; ring.setAttribute("stroke-dashoffset",(C*(1-(tot?n/tot:0))).toFixed(1));}
}
function tick(r,si){
  var was=roundsDoneN(), k=rkey(r,si);
  if(W.done[k])delete W.done[k]; else W.done[k]={exId:W.order[si].exId,reps:W.order[si].reps,w:W.order[si].w,ts:Date.now()};
  var row=document.querySelector('.rnd[data-r="'+r+'"] .arow[data-si="'+si+'"]');
  if(row){var on=cellOn(r,si);row.classList.toggle("checked",on);row.setAttribute("aria-pressed",String(on));}
  paintRound(r);
  var now=roundsDoneN();
  if(now>was&&now<W.rN){
    var nxt=Math.min(r+1,W.rN-1);
    var a=document.querySelector('.rnd[data-r="'+r+'"]'), b=document.querySelector('.rnd[data-r="'+nxt+'"]');
    if(a)a.open=false; if(b)b.open=true;
    OPEN[r]=false; OPEN[nxt]=true;
    restStart(REST);
  }
  var dn=roundsDoneN();
  document.getElementById("meta").textContent=
    W.rN+" round"+(W.rN===1?"":"s")+" \u00b7 "+totalSets()+" sets \u00b7 "+REST+"s rest"+(dn?" \u00b7 "+dn+" done":"");
  persist();
}
document.getElementById("addround").addEventListener("click",function(){
  if(W.rN>=RX_CEIL){alert("Eight rounds is the ceiling for a day.");return;}
  var old=W.rN; W.order.forEach(function(o){if(o.upTo!=null&&o.upTo>=old)o.upTo=old+1;});
  W.rN++; render();
});
document.getElementById("rmround").addEventListener("click",function(){
  if(W.rN<=RX_FLOOR){alert("One round is the floor, and the floor logs the day.");return;}
  var r=W.rN-1;
  for(var i=0;i<W.order.length;i++) if(W.done[rkey(r,i)]){alert("That round has work in it. Untick it first.");return;}
  W.rN--; W.order.forEach(function(o){if(o.upTo!=null&&o.upTo>W.rN)o.upTo=W.rN;});
  render();
});

function repSheet(si){
  var o=W.order[si];
  openSheet('<h3>'+esc(o.name)+'</h3><div class="ssub">'+esc(o.cue||"")+'</div>'+
    '<button class="sheet-cta" id="swapbtn" style="margin-top:2px">Swap for something comparable</button>'+
    '<div class="rsrow" style="margin-top:14px"><span class="rsl">Reps</span><div class="stp">'+
      '<button data-rep="-1">&minus;</button><span class="val num" id="repv">'+o.reps+'</span><button data-rep="1">+</button></div></div>'+
    (o.band?'':'<div class="rsrow"><span class="rsl">Load (lb)</span><div class="stp">'+
      '<button data-wt="-1">&minus;</button><span class="val num" id="wtv">'+o.w+'</span><button data-wt="1">+</button></div></div>')+
    '<div class="rsrow"><span class="rsl">Rounds this movement</span><div class="stp">'+
      '<button data-upto="-1">&minus;</button><span class="val num" id="upv">'+(o.upTo==null?W.rN:o.upTo)+'</span><button data-upto="1">+</button></div></div>'+
    '<button class="sheet-cta ghost" id="rmmv">Remove from today</button>'+
    '<button class="sheet-cta ghost" onclick="closeSheet()">Done</button>');
  var s=document.getElementById("sheet");
  s.addEventListener("click",function(ev){
    var b=ev.target.closest("button");if(!b)return;
    if(b.hasAttribute("data-rep")){o.reps=Math.max(1,o.reps+(+b.getAttribute("data-rep")));document.getElementById("repv").textContent=o.reps;render();}
    if(b.hasAttribute("data-wt")){o.w=Math.max(0,o.w+(+b.getAttribute("data-wt")));document.getElementById("wtv").textContent=o.w;render();}
    if(b.hasAttribute("data-upto")){
      var cur=(o.upTo==null?W.rN:o.upTo), nx=Math.min(W.rN,Math.max(1,cur+(+b.getAttribute("data-upto"))));
      o.upTo=(nx>=W.rN?null:nx); document.getElementById("upv").textContent=(o.upTo==null?W.rN:o.upTo); render();
    }
  });
  document.getElementById("swapbtn").addEventListener("click",function(){swapSheet(si);});
  document.getElementById("rmmv").addEventListener("click",function(){
    if(W.order.length<=1){alert("One movement is the floor.");return;}
    W.order.splice(si,1);
    var nd={};Object.keys(W.done).forEach(function(k){var p=k.split(":"),r=+p[0],i=+p[1];
      if(i===si)return; nd[rkey(r,i>si?i-1:i)]=W.done[k];});
    W.done=nd; closeSheet(); render();
  });
}
function swapSheet(si){
  var o=W.order[si], list=(W.alts[o.exId]||[]);
  if(!list.length){alert("No swap in your kit for that pattern.");return;}
  openSheet('<h3>Swap '+esc(o.name)+'</h3><div class="ssub">Same pattern, kit you own</div>'+
    list.map(function(a,i){return '<button class="optrow" data-alt="'+i+'"><span class="on2">'+esc(a.name)+
      '<div class="oc">'+esc(a.cue||"")+'</div></span></button>';}).join("")+
    '<button class="sheet-cta ghost" onclick="closeSheet()">Cancel</button>');
  document.getElementById("sheet").addEventListener("click",function(ev){
    var b=ev.target.closest("[data-alt]");if(!b)return;
    var a=list[+b.getAttribute("data-alt")];
    o.exId=a.exId;o.name=a.name;o.cue=a.cue;o.q=a.name;
    closeSheet();render();
  });
}
function addMvSheet(){
  var seen={};W.order.forEach(function(o){seen[o.exId]=1;});
  var pool=[];Object.keys(W.alts).forEach(function(k){(W.alts[k]||[]).forEach(function(a){
    if(!seen[a.exId]&&!pool.some(function(p){return p.exId===a.exId;}))pool.push(a);});});
  pool=pool.slice(0,14);
  if(!pool.length){alert("Nothing left in your kit to add.");return;}
  openSheet('<h3>Add a movement</h3><div class="ssub">Today only. It does not change next week.</div>'+
    pool.map(function(a,i){return '<button class="optrow" data-add="'+i+'"><span class="on2">'+esc(a.name)+
      '<div class="oc">'+esc(a.cue||"")+'</div></span></button>';}).join("")+
    '<button class="sheet-cta ghost" onclick="closeSheet()">Cancel</button>');
  document.getElementById("sheet").addEventListener("click",function(ev){
    var b=ev.target.closest("[data-add]");if(!b)return;
    var a=pool[+b.getAttribute("data-add")];
    W.order.push({exId:a.exId,name:a.name,cue:a.cue,reps:10,upTo:null,band:false,w:0,q:a.name,
      bw:!!a.bw,unit:a.unit||"reps",tmp:true});
    closeSheet();render();
  });
}
document.getElementById("addmv").addEventListener("click",addMvSheet);
function demoSheet(si){
  var o=W.order[si];
  openSheet('<h3>'+esc(o.name)+'</h3><div class="ssub">'+esc(o.cue||"")+'</div>'+
    '<a class="sheet-cta" style="text-align:center;line-height:52px;text-decoration:none;color:#fff" target="_blank" rel="noopener" '+
    'href="https://www.youtube.com/results?search_query='+encodeURIComponent(o.q+" form")+'">Watch how it is done</a>'+
    '<button class="sheet-cta ghost" onclick="closeSheet()">Close</button>');
}
function warmSheet(){
  openSheet('<h3>The flow</h3><div class="ssub">Head to toe, before round one</div>'+
    WARM.map(function(w){return '<div class="rsrow"><span class="rsl">'+esc(w.n)+'</span><span class="num">'+esc(w.d)+'</span></div>';}).join("")+
    '<button class="sheet-cta ghost" onclick="closeSheet()">Close</button>');
}

function finish(kind){
  var n=kind==="floor"?1:Math.max(roundsDoneN(),1);
  var by={},ids=[];
  for(var r=0;r<W.rN;r++)for(var i=0;i<W.order.length;i++){var c=W.done[rkey(r,i)];
    if(!c)continue;
    var id=c.exId||W.order[i].exId;
    if(!by[id]){by[id]=[];ids.push(id);}
    by[id].push({weightLb:c.w||0,reps:c.reps||0,completed:true});}
  var entries=ids.map(function(id){
    var o=null;W.order.forEach(function(x){if(x.exId===id)o=x;});
    return {exerciseId:id,targetLow:o?o.reps:null,targetHigh:o?o.reps:null,
      targetWeightLb:o?(o.w||0):null,sets:by[id],bw:!!(o&&o.bw),unit:(o&&o.unit)||"reps"};});
  var D=today();
  var ok=logSession({id:SLOTID,slot:SLOTID,date:D,type:"lift",activity:"Full body, "+"pull",
    durationSec:n*179,notes:"day-page "+kind,rounds:n,focus:"pull",
    entries:entries, warmup:W.wu},D);
  if(!ok){noStore();return;}
  restStop();
  markDone(kind==="floor"?"Floor logged. One round is a kept day.":n+" round"+(n===1?"":"s")+" in the book");
}
document.getElementById("fullbtn").addEventListener("click",function(){finish("full");});
document.getElementById("floorbtn").addEventListener("click",function(){finish("floor");});
render();
</script>
