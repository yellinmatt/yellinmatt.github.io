<!doctype html>
<html lang="en" data-motion="auto"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0d11">
<title>Mobility session 11 — 2026-10-25</title>
<style>
:root{--bg:#0b0d11;--surface:#141821;--surface2:#1b2029;--line:#262c37;--text:#eef1f6;--sub:#98a2b3;
--accent:#FF5C3A;--accent2:#3A1E17;--good:#37d39b;--good2:#12352a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,system-ui,"Segoe UI",sans-serif;
-webkit-text-size-adjust:100%;padding:0 0 64px}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--sub);font-weight:700}
h1{font-size:25px;line-height:1.18;margin:2px 0 4px;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--sub);font-size:14px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:15px;margin:12px 0}
.card h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--sub);margin:0 0 10px;font-weight:700}
.row{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .nm{flex:1;min-width:0}
.row .nm b{font-weight:650;display:block}
.row .nm i{font-style:normal;color:var(--sub);font-size:13px;display:block;margin-top:2px}
.dose{font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap;font-size:15px}
.dose.kb{color:var(--good)}
.tick{width:27px;height:27px;flex:none;border-radius:50%;border:2px solid var(--line);background:transparent;
cursor:pointer;-webkit-tap-highlight-color:transparent;margin-top:1px}
.tick[aria-pressed="true"]{background:var(--good);border-color:var(--good)}
.rounds{display:flex;gap:8px;margin:4px 0 0}
.rbtn{flex:1;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);
color:var(--text);font:inherit;font-weight:700;cursor:pointer}
.rbtn[aria-pressed="true"]{background:var(--good2);border-color:var(--good);color:var(--good)}
.cta{display:block;width:100%;min-height:54px;border:0;border-radius:13px;background:var(--accent);color:#fff;
font:inherit;font-size:17px;font-weight:800;margin-top:10px;cursor:pointer}
.cta.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line);font-size:15px;font-weight:650}
.cta[disabled]{opacity:.45}
.done{background:var(--good2);border:1px solid var(--good);color:var(--good);border-radius:13px;padding:14px;
text-align:center;font-weight:700;margin-top:10px;display:none}
.done.on{display:block}
.note{color:var(--sub);font-size:13px;margin-top:10px}
.warn{background:var(--accent2);border:1px solid var(--accent);border-radius:12px;padding:12px;font-size:14px;margin:12px 0}
a{color:var(--accent)}
.back{display:inline-block;margin-top:22px;color:var(--sub);text-decoration:none;font-size:14px;font-weight:650}
.vwrap{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000}
.vwrap iframe,.vwrap button{position:absolute;inset:0;width:100%;height:100%;border:0}
.vwrap button{background:linear-gradient(140deg,var(--accent2),var(--surface2));color:#fff;font:inherit;
font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;font-size:16px}
.timer{font-variant-numeric:tabular-nums;font-size:44px;font-weight:800;text-align:center;letter-spacing:-.02em;margin:6px 0 12px}
</style>
</head><body>
<div class="wrap">
<div class="top"><span class="eyebrow">Sunday, October 25</span></div>
<h1>Mobility, session 11</h1>
<div class="sub">Mobility for Runners &middot; Runna &middot; session 11 of 26</div>

<div class="card"><h2>Follow along</h2>
<div class="vwrap" id="vw">
  <button id="play" aria-label="Play Mobility for Runners">&#9654;&nbsp; Tap to play</button>
</div>
<div class="note"><a href="https://www.youtube.com/watch?v=rDjMOLLa-RI" target="_blank" rel="noopener">Not playing? Open in YouTube</a></div></div>

<div id="ctas">
<button class="cta" id="fullbtn">Done &mdash; full session</button>
<button class="cta ghost" id="floorbtn">Floor &mdash; the first five minutes</button>
</div>
<div class="done" id="doneflag"></div>
<div class="note">The course runs 1 to 26. The next card picks up at 12.</div>

<script>
var VID_ID="rDjMOLLa-RI", N=11, KIND="mobility", LABEL="Mobility";
document.getElementById("play").addEventListener("click",function(){
  var f=document.createElement("iframe");
  f.setAttribute("allow","accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen");
  f.setAttribute("allowfullscreen",""); f.setAttribute("referrerpolicy","strict-origin-when-cross-origin");
  f.src="https://www.youtube-nocookie.com/embed/"+VID_ID+"?rel=0&playsinline=1&modestbranding=1";
  this.replaceWith(f);
});
function finish(kind){
  var ok=logSession({id:DATE+"-"+KIND,date:DATE,type:"activity",activity:LABEL+" session "+N,
    durationSec:(kind==="floor"?5:20)*60,notes:"day-page "+kind},DATE);
  if(!ok){noStore();return;}
  markDone(kind==="floor"?"Floor logged. Five minutes is a kept day.":"Logged. Session "+N+" done.");
}
document.getElementById("fullbtn").addEventListener("click",function(){finish("full");});
document.getElementById("floorbtn").addEventListener("click",function(){finish("floor");});
</script>
<a class="back" href="../index.html">&larr; Train</a>
</div>
<script>
var LS="train_v2";
function loadS(){try{return JSON.parse(localStorage.getItem(LS));}catch(e){return null;}}
function haveStore(){var s=loadS();return !!(s&&typeof s==="object"&&s.sessions);}
function logSession(rec,date){
  var S=loadS(); if(!S||!S.sessions) return false;
  S.sessions=S.sessions||[]; S.done=S.done||{};
  S.sessions=S.sessions.filter(function(x){return x.id!==rec.id;});
  S.sessions.push(rec); S.done[date]=true;
  try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){return false;}
  return true;
}
function markDone(msg){var d=document.getElementById("doneflag");d.textContent=msg;d.classList.add("on");
  var c=document.getElementById("ctas"); if(c) c.style.display="none";}
function noStore(){
  var w=document.createElement("div"); w.className="warn";
  w.innerHTML='This browser has no Train data yet, so the tick cannot be saved here. '+
    'Open <a href="../index.html">the Train app</a> once on this device, then come back.';
  document.querySelector(".wrap").appendChild(w);
  [].forEach.call(document.querySelectorAll(".cta"),function(b){if(!b.classList.contains("ghost"))b.disabled=true;});
}

var DATE="2026-10-25";
document.addEventListener("DOMContentLoaded",function(){ if(!haveStore()) noStore(); });
</script>
<script src="../train-sync-auto.js?v=v25.0"></script>
</body></html>
