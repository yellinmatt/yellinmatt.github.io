<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<!-- Same posture as the app, narrowed to what a day page actually needs. It shipped with no policy
     at all, which is a gap rather than a choice: these are published pages on the same origin as
     his health data. frame-src is nocookie only, img-src excludes ytimg so nothing reaches Google
     until he taps play, and connect-src carries self for the sync client plus the Worker. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; frame-src https://www.youtube-nocookie.com; connect-src 'self' https://train-sync.yellinmatt.workers.dev; form-action 'none'; base-uri 'none'">
<title>Lift, custom</title>
<style>/* Train workout page, round 8 (his approved round 7 design): the hero, the liquid-glass lower panel (Next or the round),
   the round's circles, tap and hold-to-reorder, the rest popup, the warm-up in mini, the Drift field. Always dark. */
:root{--bg:#000;--s1:#1C1C1E;--s2:#2C2C2E;--s3:#3A3A3C;--ink:#FFF;--sub:#98989F;--faint:#636366;--line:rgba(84,84,88,.42);
  --acc:#FF5C3A;--fill:#D63F1B;--good:#34D399;--ton:rgba(255,255,255,.12);--onf:#AEAEB2;
  --sf:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.32,.72,0,1);--dockH:0px;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:var(--ink);font:17px/22px var(--sf);-webkit-text-size-adjust:100%}
html{height:100%;overscroll-behavior:none;overflow-x:hidden}
#app,.stage,.full{overflow-x:clip}body{min-height:100%;overflow-x:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;-webkit-user-select:none;user-select:none}
.tab{font-variant-numeric:tabular-nums}
svg{display:block}
h1,h2,h3,p{margin-top:0}

#bgc{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
#app{position:relative;min-height:100vh;min-height:100dvh;transform-origin:center;display:flow-root;padding-top:env(safe-area-inset-top)}
#nav{position:relative;z-index:2}
.scr{min-height:calc(100vh - var(--topH,48px));padding:0 16px calc(var(--dockH) + 24px)}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:44px;margin-top:4px;padding:0 16px}
.nav .bk{justify-self:start;display:flex;align-items:center;gap:4px;min-height:44px;min-width:44px;padding-right:12px;font-weight:600;color:var(--ink);text-decoration:none}
.nav .bk svg{width:11px;height:18px}
.nav .it{font-weight:600;font-size:17px;line-height:22px;text-align:center;white-space:nowrap;transition:opacity .2s}
.nav .it:empty{opacity:0}
.nav .ed{justify-self:end;min-height:44px;min-width:44px;font-weight:600;color:var(--sub);text-align:right}
.sline{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:15px;line-height:20px;color:var(--sub);font-weight:600}
.sline .tab{color:var(--ink)}
.scr>.sline:first-child{margin-top:8px}
.xghost{position:fixed;left:0;right:0;z-index:3;pointer-events:none}
body.noscroll{overflow:hidden}

.pri{display:flex;align-items:center;justify-content:center;width:100%;height:52px;border-radius:26px;background:var(--fill);color:#fff;font-size:17px;line-height:22px;font-weight:600;transition:transform .12s}
.pri:active,.tonb:active{transform:scale(.97)}
.pri.ton,.tonb{background:var(--ton);color:#fff}
.tonb{display:flex;align-items:center;justify-content:center;height:52px;border-radius:26px;font-weight:600;min-width:0}
.tonb.sm{height:44px;padding:0 20px;border-radius:22px;flex:none}
.tbtn{display:flex;align-items:center;justify-content:center;min-height:44px;width:100%;font-weight:600;color:var(--sub);margin-top:4px}
.ick{width:18px;height:18px;margin-right:8px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:16px 16px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(rgba(0,0,0,0),#000 16px)}
#dock{transition:opacity .25s ease-out}
body.resting #dock{opacity:0;pointer-events:none}

.pager{position:relative;touch-action:pan-y}
.page{position:relative}
.ghost{position:absolute!important;left:0;right:0;pointer-events:none}

.rc{background:rgba(255,255,255,.07);-webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%);box-shadow:inset 0 .5px 0 rgba(255,255,255,.22),inset 0 0 0 .5px rgba(255,255,255,.10),0 12px 32px rgba(0,0,0,.28);border-radius:22px;padding:0 16px;margin-top:16px}
.rch{display:flex;justify-content:space-between;align-items:center;min-height:44px;font-size:15px;line-height:20px;font-weight:600;color:var(--sub)}
.rch .tab{color:var(--sub)}
.rl{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;column-gap:10px;width:100%;min-height:44px;border-top:.5px solid var(--line);text-align:left;transition:color .2s}
.rl.nt{grid-template-columns:minmax(0,1fr) auto}
.rl .tk i,.lr .tk i{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:11px;border:2px solid var(--s3);transition:background-color .2s,border-color .2s}
.rl .tk svg,.lr .tk svg{width:12px;height:12px;opacity:0;transition:opacity .2s}
.rl.on .tk i,.lr.on .tk i{background:#fff;border-color:#fff;color:#000}.rl.on .tk svg,.lr.on .tk svg{opacity:1}
.rl .n,.lr .n{font-size:17px;line-height:22px;font-weight:500;min-width:0;white-space:normal;padding:11px 0}
.rl .v,.lr .v{font-size:17px;line-height:22px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.rl .v small,.lr .v small,.nxc .nv small{font-size:15px;font-weight:500;color:var(--sub);margin-left:2px}
.rl .v .x,.lr .v .x,.nxc .nv .x{font-weight:500;color:var(--sub);margin:0 4px}
.rl.on .n,.rl.on .v,.lr.on .n,.lr.on .v{color:var(--sub)}
.rl.cur .n,.lr.cur .n{color:var(--acc);font-weight:600}
.rl.cur .tk i,.lr.cur .tk i{border-color:var(--acc)}
.lr.nx .tk i,.lr.nn .tk i{border-color:#8E8E93}.lr.nn .n{font-weight:600}
.lr.sk .n,.lr.sk .v{color:var(--faint)}
.rc>.rl:first-of-type{border-top:.5px solid var(--line)}
.rdone{display:flex;justify-content:space-between;align-items:center;min-height:44px;color:var(--sub);font-weight:600;font-size:15px}
.rdone .ck{display:flex;align-items:center;gap:8px}
.rdone svg{width:16px;height:16px;color:var(--good)}

.row3{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.row3>div{border-left:.5px solid var(--line);min-width:0}.row3>div:first-child{border-left:0}
.row3 b{display:block;font-size:28px;line-height:32px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.row3 span{display:block;margin-top:4px;font-size:13px;line-height:16px;color:var(--sub);font-weight:500}
.shero{text-align:center;padding:40px 0 8px}
.sname{font-size:40px;line-height:44px;font-weight:800;letter-spacing:-.03em;margin:0}
.srow{margin-top:24px}
.wcard{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:32px;padding:12px 12px 12px 16px;border-radius:22px;background:rgba(255,255,255,.07);-webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%);box-shadow:inset 0 .5px 0 rgba(255,255,255,.22),inset 0 0 0 .5px rgba(255,255,255,.10),0 12px 32px rgba(0,0,0,.28)}
.wcard .wl b{display:block;font-size:17px;line-height:22px;font-weight:600}
.wcard .wl span{display:block;font-size:15px;line-height:20px;color:var(--sub);font-variant-numeric:tabular-nums}

.scr.hzs{display:flex;flex-direction:column;height:calc(100vh - var(--topH,48px));height:calc(100dvh - var(--topH,48px));min-height:0;padding-bottom:var(--dockH)}
.hzs>.sline{flex:none}
.stage{position:relative;flex:1 1 auto;min-height:0;margin:4px -16px 0;display:flex;flex-direction:column;--hzH:clamp(262px,34vh,312px)}
.hzone{flex:none;height:var(--hzH);display:flex;align-items:center;touch-action:none} /* the hero never pans the page: sideways is ours, vertical does nothing */
.hblk{position:relative;width:100%}
.hero2{text-align:center;padding:0 16px}
.hvb{height:20px;display:flex;justify-content:center}
.vb{display:inline-flex;align-items:center;gap:6px;font-size:15px;line-height:20px;font-weight:600;color:var(--sub)}
.vb.ok{color:var(--good)}.vb svg{width:14px;height:14px}
.hnm{min-height:84px;display:flex;align-items:flex-end;justify-content:center}
.hname{display:block;font-size:34px;line-height:40px;font-weight:700;letter-spacing:-.02em;text-align:center;min-height:44px;padding:2px 8px;max-width:100%}
.hnum{display:grid;grid-template-columns:auto auto auto;justify-content:center;align-items:start;column-gap:22px;margin:16px 60px 0}
.hnum.one{grid-template-columns:auto}
.hblk:not(:has(.arw)) .hnum{margin-left:24px;margin-right:24px}
.hn{display:block;text-align:center;min-height:44px;min-width:0;padding:0 4px}
.hn b{display:block;font-size:80px;line-height:80px;font-weight:800;letter-spacing:-.045em;font-variant-numeric:tabular-nums;white-space:nowrap}
.hnum.wide .hn b{font-size:64px}
.hn span{display:block;margin-top:8px;font-size:13px;line-height:16px;font-weight:500;color:var(--sub);white-space:nowrap}
.hsep{display:block;width:.5px;align-self:stretch;margin:14px 0 6px;background:rgba(255,255,255,.22)}
.hn.live b{transition:color .3s}
.wh.hot .hn.live b{color:var(--acc)}
.arw{position:absolute;top:142px;width:44px;height:44px;border-radius:22px;background:rgba(255,255,255,.09);display:flex;align-items:center;justify-content:center;color:#fff;transition:opacity .2s,transform .12s}
.arw:active{transform:scale(.92)}
.arw.l{left:16px}.arw.r{right:16px}
.arw svg{width:9px;height:15px}
.arw.r svg{margin-left:2px}.arw.l svg{margin-right:2px}
.arw:disabled{opacity:.22}
.slot{display:flex;align-items:center;gap:12px;margin:16px 60px 0}
.sb{flex:1;height:4px;border-radius:2px;background:var(--s3);overflow:hidden}
.sb i{display:block;height:100%;width:100%;background:#fff;transform-origin:left center;transition:transform .25s linear,background-color .3s}
.slot b{font-size:17px;line-height:22px;font-weight:600;font-variant-numeric:tabular-nums;min-width:40px;text-align:right;transition:color .3s}
.slot.hot b{color:var(--acc)}.slot.hot .sb i{background:var(--acc)}

.pnl{position:relative;flex:1 1 auto;min-height:0;padding:8px 16px 0;display:flex;flex-direction:column}
.pglass{position:relative;display:flex;flex-direction:column;max-height:100%;min-height:0;overflow:hidden;border-radius:22px;background:rgba(255,255,255,.07);-webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%);box-shadow:inset 0 .5px 0 rgba(255,255,255,.22),inset 0 0 0 .5px rgba(255,255,255,.10),0 12px 32px rgba(0,0,0,.28)}
.pnp{min-width:0}
.pnr{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(#000 calc(100% - 14px),transparent);mask-image:linear-gradient(#000 calc(100% - 14px),transparent)}
.pglass>.pgg{position:absolute;left:0;right:0;top:0;pointer-events:none}
.pnx{position:relative}
.stage.kb{--hzH:clamp(286px,36vh,320px)}
.pglass .rc{background:none;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;border-radius:0;margin:0;padding:0 16px 6px}
.rch{width:100%;text-align:left}
button.rch{cursor:pointer}button.rch:active{opacity:.7}
.pdots{flex:none;display:flex;justify-content:center;height:44px}
.pdb{display:flex;align-items:center;justify-content:center;gap:4px;min-width:96px;height:44px;padding:0 12px;font-size:15px;line-height:20px;font-weight:600;color:rgba(235,235,245,.55)}.pdb svg{width:7px;height:12px}

.nxc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:10px;align-items:baseline;width:100%;min-height:52px;padding:14px 18px;border-radius:22px;text-align:left}
.nxc .nk{grid-column:1;font-size:13px;line-height:18px;font-weight:600;color:rgba(235,235,245,.5)}
.nxc .np{grid-column:3;font-size:15px;line-height:20px;font-weight:600;color:var(--onf);font-variant-numeric:tabular-nums}
.nxc .nn{grid-column:2;font-size:17px;line-height:22px;font-weight:600;min-width:0;color:rgba(255,255,255,.78);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nxc .nv{grid-column:3;font-size:17px;line-height:22px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;color:rgba(255,255,255,.6)}
.nxc .nv small{font-size:13px}
.nxc.end .nn{margin-bottom:2px}
button.nxc{transition:transform .12s}button.nxc:active{transform:scale(.98)}

.lr{position:relative;border-top:.5px solid var(--line);-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.lri{display:grid;grid-template-columns:44px minmax(0,1fr);margin:0 -8px;border-radius:12px;background:rgba(44,44,46,0);transition:transform .16s var(--ease),background-color .16s,box-shadow .16s}
.lr .tk{display:flex;align-items:center;justify-content:center;width:44px;min-height:44px}
.lr .rb{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:10px;min-height:44px;padding-right:8px;text-align:left}
.lr.lift{z-index:5;border-top-color:transparent}
.lr.lift .lri{background:rgba(58,58,60,1);transform:scale(1.03);box-shadow:0 10px 28px rgba(0,0,0,.55)}
.lr.lift+.lr,.lr.settling+.lr{border-top-color:transparent}
.lr.settling{z-index:5;border-top-color:transparent}.lr.settling .lri{background:rgba(58,58,60,1);box-shadow:0 10px 28px rgba(0,0,0,0)}
.nxc.nxg{position:absolute;left:0;right:0;top:0;width:auto;pointer-events:none}
.lrs.dragging>.lr:not(.lift){transition:transform .22s var(--ease)}

.full{position:fixed;inset:0;z-index:55;background:#000;box-shadow:-16px 0 40px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top)}
.full .bgm{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.fin2{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;overflow:hidden}
.fin2>.scr.hzs{flex:1 1 auto;height:auto;min-height:0;padding-bottom:0}
.full .wdock{position:relative;flex:none;background:none;padding:4px 16px calc(16px + env(safe-area-inset-bottom))}
.wbar{height:4px;border-radius:2px;background:var(--s3);overflow:hidden;margin:20px 24px 0}
.wbar i{display:block;height:100%;width:100%;background:#fff;transform-origin:left center;transition:transform .25s linear,background-color .3s}
.wh.hot .wbar i{background:var(--acc)}
.wh .hnum{margin:16px 24px 0}
.wctl{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;gap:12px;align-items:center}
.circ{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:26px;background:var(--ton);color:#fff;transition:transform .12s,opacity .2s}
.circ svg{width:10px;height:17px}
.circ:active{transform:scale(.94)}
.circ:disabled{opacity:.35}

.rbd{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.46);-webkit-backdrop-filter:blur(18px) saturate(1.15);backdrop-filter:blur(18px) saturate(1.15)}
.rpop{position:fixed;inset:0;z-index:41;display:flex;align-items:center;justify-content:center;padding:0 24px;pointer-events:none}
.rpin{pointer-events:auto;width:100%;max-width:360px;text-align:center}
.rpop .rn{font-size:104px;line-height:96px;font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums;transition:color .3s}
.rpop .rlab{margin-top:20px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.rpop .rx{margin-top:24px;font-size:17px;line-height:22px;font-weight:600;color:rgba(255,255,255,.72);transition:color .3s}
.rpop .rx .k{font-weight:500;color:var(--sub)}
.rpop.soon .rx{color:#fff}
.rpop .rb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:40px}
.rpop .rb button{height:52px;border-radius:26px;background:rgba(255,255,255,.14);font-weight:600;text-align:center;transition:transform .12s}
.rpop .rb button:active{transform:scale(.96)}
.rpop.go .rn{color:var(--acc)}

.fin .hero{margin:16px -16px 0;padding:32px 16px 24px;text-align:center;background:radial-gradient(70% 60% at 50% 45%,rgba(255,92,58,.22),transparent 72%)}
.fin .hero b{display:block;font-size:88px;line-height:80px;font-weight:800;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.fin .hero span{display:block;margin-top:12px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.fin .hero em{display:block;margin-top:8px;font-style:normal;font-size:15px;line-height:20px;font-weight:600}
.fin .hero em i{font-style:normal;color:var(--ink)}
.fin .row3{padding-top:16px;border-top:.5px solid var(--line)}
.fin .row3 b{font-size:24px;line-height:28px}
.fin .h{font-size:20px;line-height:24px;font-weight:600;margin:32px 0 8px}
.fin .r{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;border-bottom:.5px solid var(--line)}
.fin .r:last-child{border-bottom:0}
.fin .r b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.fin .r b small{font-size:15px;font-weight:500;color:var(--sub);margin-left:6px}
.fin .r b.up small{color:var(--good)}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px;border-radius:12px;background:var(--s2)}
.feel button{min-height:44px;border-radius:10px;font-size:15px;font-weight:600;text-align:center}
.feel button[aria-pressed="true"]{background:#636366}
.sw{display:flex;justify-content:space-between;align-items:center;min-height:52px;width:100%;margin-top:8px;font-weight:500}
.sw i,.sr .tg i{flex:none;display:block;width:51px;height:31px;border-radius:16px;background:var(--s3);position:relative;transition:background .2s}
.sw i::after,.sr .tg i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:14px;background:#fff;transition:left .2s}
.sw[aria-checked="true"] i,.sr[aria-checked="true"] .tg i{background:#34C759}.sw[aria-checked="true"] i::after,.sr[aria-checked="true"] .tg i::after{left:22px}

.scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:92vh;overflow:auto;background:var(--s1);border-radius:16px 16px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom));display:none;-webkit-user-select:none;user-select:none}
.sheet.on{display:block}
.grab{width:36px;height:5px;border-radius:3px;background:#48484A;margin:0 auto 16px}
.sheet h3{font-size:22px;line-height:28px;font-weight:700;margin:0;letter-spacing:-.01em}
.srs{margin-top:8px}
.sheet[data-t="how"] .srs{margin-top:16px}
.sr{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;border-bottom:.5px solid var(--line);width:100%;text-align:left}
.sr:last-child{border-bottom:0}
.sr .v{display:flex;align-items:center;gap:8px;color:var(--sub);font-variant-numeric:tabular-nums}
.sr .v svg{width:8px;height:14px;color:var(--faint)}
.sr .tg{flex:none}
.stp{display:flex;align-items:center;background:rgba(255,255,255,.08);border-radius:12px;height:44px}
.stp button{width:44px;height:44px;text-align:center;font-size:22px;font-weight:600}
.stp .val{min-width:36px;text-align:center;font-weight:600}
.bigstep{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;margin:24px 0 8px}
.bigstep button{width:64px;height:64px;border-radius:32px;background:var(--ton);font-size:28px;font-weight:600;text-align:center}
.bigstep b{text-align:center;font-size:72px;line-height:72px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.bigstep+.u{text-align:center;color:var(--sub);font-size:15px;margin:0 0 24px}
.cue{margin:4px 0 0;font-size:15px;line-height:20px;color:var(--sub)}
.hh{margin-top:16px}.hh.nm0{margin-top:0}
.hclip{width:100%;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:#0B0B0C}

function cap1(t){t=String(t||"");return t.charAt(0).toUpperCase()+t.slice(1);}
function mmss(s){s=Math.max(0,Math.round(+s||0));var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":"+("0"+m).slice(-2):m)+":"+("0"+x).slice(-2);}
window.__haps={};
function hap(kind){window.__haps[kind||"tap"]=(window.__haps[kind||"tap"]||0)+1;haptic();}

function isOn(r,si){return !!W.done[rkey(r,si)];}
function rowsOf(r){var o=[];for(var i=0;i<W.order.length;i++)if(slotIn(r,i))o.push(i);return o;}
function SQ(){var a=[];for(var r=0;r<W.rN;r++)rowsOf(r).forEach(function(i){a.push({r:r,si:i});});return a;}
function ordOf(r,si){var a=SQ();for(var x=0;x<a.length;x++)if(a[x].r===r&&a[x].si===si)return x;return -1;}
function firstOpen(){var a=SQ();for(var x=0;x<a.length;x++)if(!isOn(a[x].r,a[x].si))return a[x];return null;}
function nextOpenAfter(r,si){var L=rowsOf(r),p=L.indexOf(si),n=L.length;
  for(var d=1;d<=n;d++){var j=L[((p<0?-1:p)+d+n)%n];if(j!==si&&!isOn(r,j))return {r:r,si:j};}
  for(var rr=r+1;rr<W.rN;rr++){var L2=rowsOf(rr);for(var q=0;q<L2.length;q++)if(!isOn(rr,L2[q]))return {r:rr,si:L2[q]};}return null;}
function ndone(){var n=0;Object.keys(W.done).forEach(function(k){var p=k.split(":");if(+p[0]<W.rN&&W.order[+p[1]]&&slotIn(+p[0],+p[1]))n++;});return n;}
function valid(r,si){return r>=0&&r<W.rN&&si>=0&&si<W.order.length&&slotIn(r,si);}
function syncCur(force){
  if(U.view&&(!valid(U.view.r,U.view.si)||!isOn(U.view.r,U.view.si)))U.view=null;
  var f=firstOpen();
  if(!f){var a=SQ();if(a.length){U.r=a[a.length-1].r;U.si=a[a.length-1].si;}if(U.phase==="work")U.phase="complete";return;}
  if(U.phase==="complete")U.phase="work";
  if(valid(U.r,U.si)&&U.r===f.r&&!isOn(U.r,U.si))return;
  if(valid(U.r,U.si)&&U.r===f.r){var n=nextOpenAfter(U.r,U.si);if(n){U.r=n.r;U.si=n.si;return;}}
  U.r=f.r;U.si=f.si;}
function cur(){return U.view||{r:U.r,si:U.si};}
function t0(){var t=W.t0||0;Object.keys(W.done).forEach(function(k){var c=W.done[k];if(c&&c.ts&&(!t||c.ts<t))t=c.ts;});return t;}
function wt(r,si){var c=C(r,si);return Math.max(15,+c.w||0)*(c.unit==="s"?(+c.reps||0)/3:(+c.reps||0));}
function progress(){var a=0,b=0;SQ().forEach(function(x){var w=wt(x.r,x.si);b+=w;if(isOn(x.r,x.si))a+=w;});return b?a/b:0;}

function setTxt(r,si,html){var c=C(r,si),sm=function(t){return html?'<small>'+t+'</small>':" "+t;};
  if(c.unit==="s")return mmss(c.reps)+sm("hold");
  if(c.band)return c.reps+sm(c.bandUp?"reps, heavier band":"reps, band");
  if(c.bw||!(c.w>0))return c.reps+sm("reps");
  return html?c.w+'<small>lb</small><span class="x">×</span>'+c.reps:c.w+" lb × "+c.reps;}
function numCol(f,r,si,val,lab){return '<button class="hn" data-act="step" data-f="'+f+'" data-r="'+r+'" data-si="'+si+'" aria-label="'+esc(val+" "+lab)+', change"><b data-count="'+esc(val)+'">'+esc(val)+'</b><span>'+lab+'</span></button>';}
function heroNums(r,si){var c=C(r,si),cols=[],vals=[];
  if(!c.band&&!c.bw&&(c.w>0||c.ladder)){vals.push(c.w>0?String(c.w):"BW");cols.push(numCol("load",r,si,vals[0],"lb"));}
  var rv=c.unit==="s"?mmss(c.reps):String(c.reps);vals.push(rv);
  cols.push(numCol("reps",r,si,rv,c.unit==="s"?"hold":(c.band?(c.bandUp?"reps, heavier band":"reps, band"):"reps")));
  var wide=cols.length===2&&vals.some(function(v){return v.length>2;});
  return '<div class="hnum'+(cols.length===1?" one":"")+(wide?" wide":"")+'">'+cols.join('<i class="hsep" aria-hidden="true"></i>')+'</div>';}

function nav(inline){return '<div class="nav"><a class="bk navback" href="../index.html">'+IC.back+'Train</a><span class="it">'+(inline?esc(TITLE_N):"")+'</span>'+
  (LOGGED?'<span></span>':'<button class="ed" id="editbtn" data-act="edit" aria-label="Edit this session">Edit</button>')+'</div>';}
function sline(txt){var t=t0();return '<div class="sline" data-k="sl"><span>'+txt+'</span><span class="tab" data-live="el">'+mmss(t?(Date.now()-t)/1000:0)+'</span></div>';}
function slotMs(){if(SLOT_END)return Math.max(0,SLOT_END-Date.now());if(SLOT_LEFT)return SLOT_LEFT;return null;}
function slotLeft(){var m=slotMs();return m==null?null:Math.ceil(m/1000);}
function slotFrac(){var m=slotMs();if(m==null)return 0;return Math.min(1,Math.max(0,1-m/(SETREST*1000)));}
function slotStart(){SLOT_END=Date.now()+SETREST*1000;SLOT_LEFT=0;SLOT_ZERO=false;wakeOn();}
function slotPause(){if(!SLOT_END||SLOT_ZERO)return false;SLOT_LEFT=Math.max(1000,SLOT_END-Date.now());SLOT_END=0;return true;}
function slotResume(){if(!SLOT_LEFT)return false;SLOT_END=Date.now()+SLOT_LEFT;SLOT_LEFT=0;return true;}
function slotClear(){SLOT_END=0;SLOT_LEFT=0;SLOT_ZERO=false;}
function sidedOf(r,si){if(!valid(r,si))return "";var c=C(r,si),h=HOWTO[c.exId];if(h&&h.side)return h.side;
  return /\b(1-arm|one-arm|single-arm|single-leg|bulgarian|split squat|lateral lunge|suitcase)\b/i.test(c.name||"")?"arm":"";}
function sideNow(){var k=U.r+":"+U.si;if(U.sideK!==k){U.sideK=k;U.side=0;try{var v=sessionStorage.getItem("train.side."+PAGE);if(v&&v.split("|")[0]===k)U.side=+v.split("|")[1]||0;}catch(e){}}return U.side;}
function sideSet(v){U.side=v;U.sideK=U.r+":"+U.si;try{sessionStorage.setItem("train.side."+PAGE,U.sideK+"|"+v);}catch(e){}}
function sideLab(r,si){var k=sidedOf(r,si);if(!k)return "";return (sideNow()?"Left ":"Right ")+k;}
function doneBtn(){var sd=sidedOf(U.r,U.si),s0=sd&&!sideNow(),lab=sd?sideLab(U.r,U.si):"";
  if(SETREST>0&&!SLOT_END&&!SLOT_LEFT)return '<button class="pri" data-act="kbstart">Start'+(lab?" "+lab.toLowerCase():"")+'</button>';
  if(SETREST>0&&SLOT_LEFT)return '<button class="pri" data-act="kbresume">Resume</button><button class="tbtn" data-act="'+(s0?"sidedone":"done")+'">'+(s0?"Right side done":"Done")+'</button>';
  var main=s0?'<button class="pri" id="donebtn" data-act="sidedone">Right side done</button>':'<button class="pri" id="donebtn" data-act="done">Done</button>';
  if(SETREST>0&&SLOT_END&&!SLOT_ZERO)return main+'<button class="tbtn" data-act="kbpause">Pause</button>';
  return main;}
function viewDock(){var c=cur();return '<button class="pri ton" data-act="undo" data-r="'+c.r+'" data-si="'+c.si+'">Undo this set</button><button class="tbtn" data-act="backnow">Back to '+esc(C(U.r,U.si).name)+'</button>';}

function heroInner(r,si){var c=C(r,si),sl0=!U.view&&r===U.r&&si===U.si?sideLab(r,si):"",
  vb=U.view?'<span class="vb ok">'+IC.ck+'Done · round '+(r+1)+'</span>':(sl0?'<span class="vb sd'+(sideNow()?' l':'')+'"><i></i><i></i>'+esc(sl0)+(sideNow()?"":" first")+'</span>':'');
  var h='<div class="hero2"><div class="hvb">'+vb+'</div><div class="hnm"><button class="hname" data-act="how" data-r="'+r+'" data-si="'+si+'">'+esc(c.name)+'</button></div>'+heroNums(r,si);
  if(SETREST>0&&!U.view){var sl=slotLeft(),tk=isOn(r,si);
    h+='<div class="slot live'+(sl!=null&&sl<=3&&!tk?" hot":"")+(SLOT_ZERO?" zero":"")+(SLOT_LEFT?" paused":"")+'"><span class="sb"><i data-live="slotbar" style="transform:scaleX('+slotFrac().toFixed(4)+')"></i></span><b data-live="slot">'+(sl==null?mmss(SETREST):mmss(Math.max(0,sl)))+'</b></div>';}
  return h+'</div>';}
function arrows(){var c=cur(),a=ordOf(c.r,c.si),n=SQ().length;
  return '<button class="arw l" data-act="prev" aria-label="Previous set"'+(a<=0?' disabled':'')+'>'+IC.back+'</button><button class="arw r" data-act="next" aria-label="Next set"'+(a>=n-1?' disabled':'')+'>'+IC.fwd+'</button>';}
function pager(inner,key,o){return '<div class="pager" data-swipe="1"><div class="page" data-k="'+key+'" data-ord="'+o+'">'+inner+'</div></div>';}
function completeHero(){var t=t0();return '<div class="hero2 comp"><div class="hvb"></div><div class="hnm"><span class="hname">'+esc(TITLE_N)+'</span></div><div class="hnum wide"><div class="hn"><b>'+ndone()+'</b><span>sets</span></div><i class="hsep"></i><div class="hn"><b data-live="el2">'+mmss(t?(Date.now()-t)/1000:0)+'</b><span>time</span></div></div></div>';}

function panel(id,pv,nextH,listH){
  return '<div class="pnl" data-k="pnl'+id+'"><div class="pglass'+(pv?' isr':'')+'" data-k="pg'+id+'" data-pv="'+pv+'">'+
   (pv?'<div class="pnp pnr" data-k="pnr'+id+'">'+listH+'</div>':'<div class="pnp pnx" data-k="pnx'+id+'">'+nextH+'</div>')+'</div></div>'+
   '<div class="pdots" data-k="pd'+id+'"><button class="pdb" id="pv'+id+'" data-act="pv" data-p="'+id+'" aria-label="'+(pv?"Show next":"Show the round")+'">'+(pv?IC.sl+' Next':'Round '+IC.sr)+'</button></div>';}
function nextCard(){
  var endH='<button class="nxc end" data-k="nxcend" data-act="pv" data-p="m" aria-label="Show the round"><span class="nk">Next</span><span class="nn">Log the session</span></button>';
  if(U.phase==="complete"||!firstOpen())return endH;
  var n=nextOpenAfter(U.r,U.si);if(!n)return endH;
  return '<button class="nxc" data-k="nxc'+n.r+'-'+n.si+'" data-act="pv" data-p="m" aria-label="Show the round"><span class="nk">'+(n.r!==U.r?"Round "+(n.r+1):"Next")+'</span><span class="nn">'+esc(C(n.r,n.si).name)+'</span><span class="nv">'+setTxt(n.r,n.si,true)+'</span></button>';}
function listRow(r,j){var on=isOn(r,j),c=cur(),work=U.phase==="work",isc=work&&r===c.r&&j===c.si,live=work&&r===U.r&&j===U.si&&!on,
  nx=work&&!on&&!live&&!U.view&&(function(){var n=nextOpenAfter(U.r,U.si);return n&&n.r===r&&n.si===j;})(),nm=C(r,j).name;
  return '<div class="lr'+(on?" on":"")+(isc?" cur":"")+(live&&!isc?" nx":"")+(nx?" nn":"")+'" data-k="lr'+r+'-'+W.order[j].exId+'" data-r="'+r+'" data-si="'+j+'"><div class="lri">'+
   '<button class="tk" data-act="tick" data-r="'+r+'" data-si="'+j+'" aria-pressed="'+on+'" aria-label="'+esc(nm)+(on?", done":", not done")+'"><i>'+IC.ck+'</i></button>'+
   '<button class="rb" data-act="pick" data-r="'+r+'" data-si="'+j+'"><span class="n">'+esc(nm)+'</span><span class="v">'+setTxt(r,j,true)+'</span></button></div></div>';}
function roundList(){var x=U.r,h='<div class="rc lst" data-k="rcl">';
  for(var y=0;y<x;y++)h+='<div class="rdone" data-k="rd'+y+'"><span class="ck">'+IC.ck+'Round '+(y+1)+'</span><span class="tab">'+rowsOf(y).filter(function(i){return isOn(y,i);}).length+' sets</span></div>';
  var L=rowsOf(x),cnt=L.filter(function(i){return isOn(x,i);}).length;
  h+='<button class="rch" data-k="rh'+x+'" data-act="pv" data-p="m" aria-label="Show next"><span>Round '+(x+1)+'</span><span class="tab">'+cnt+'/'+L.length+'</span></button><div class="lrs" data-k="lrs'+x+'">';
  L.forEach(function(j){h+=listRow(x,j);});
  return h+'</div></div>';}
function hz(){if(U.phase==="fresh")return startScreen();
  var c=cur(),comp=U.phase==="complete";
  var hero=comp?completeHero():pager(heroInner(c.r,c.si),"p"+c.r+"-"+c.si+"-"+C(c.r,c.si).exId,ordOf(c.r,c.si));
  var h=sline(comp?(W.rN===1?"Round done":"All "+W.rN+" rounds"):"Round "+(U.r+1)+" of "+W.rN)+'<div class="stage'+(SETREST>0?" kb":"")+'" data-k="stg"><div class="hzone" data-k="hzn"><div class="hblk" data-k="hb">'+hero+(comp?"":arrows())+'</div></div>'+panel("m",U.pv,nextCard(),roundList())+'</div>';
  return {key:"hz:work",nav:nav(true),cls:"scr hzs",body:h,dock:comp?'<button class="pri" id="fullbtn" data-act="log">Log the session</button>':(U.view?viewDock():doneBtn())};}

function startScreen(){var n0=rowsOf(0).length,r3=SETREST>0?[[W.rN,"Rounds"],[n0,"Moves"],[mmss(SETREST),"Slot"]]:[[W.rN,"Rounds"],[n0,"Moves"],[mmss(REST),"Rest"]];
  var h='<div class="shero" data-k="sh"><h1 class="sname" data-rise="0">'+esc(TITLE_N)+'</h1>'+(TITLE_SUB?'<p class="ssubt" data-rise="0">'+esc(TITLE_SUB)+'</p>':'')+
   '<div class="row3 srow">'+r3.map(function(x,q){return '<div data-rise="'+(q+1)+'"><b data-count="'+x[0]+'">'+x[0]+'</b><span>'+x[1]+'</span></div>';}).join("")+'</div></div>';
  if(FOCUS==="custom"&&!W.order.length){
    h+='<div class="rc cempty" data-k="ce" data-rise="4"><b>Build your own</b><span>Add movements from the library, set your rounds, then log it. It saves as your own workout for next time.</span><button class="tonb sm" data-act="addmv">Add a movement</button></div>';
    return {key:"hz:fresh",nav:nav(false),cls:"scr start",body:h,dock:''};}
  h+='<div class="wcard" data-k="wc" data-rise="4"><div class="wl"><b>Warm-up</b><span>'+WARM.length+' moves · '+mmss(WSEC*WARM.length)+'</span></div><button class="tonb sm" data-act="warm">Start</button></div>';
  h+='<div class="rc" data-k="rc0" data-rise="5"><div class="rch"><span>Round 1</span><span class="tab">'+n0+' moves</span></div>';
  rowsOf(0).forEach(function(j){h+='<button class="rl nt" data-act="how" data-r="0" data-si="'+j+'"><span class="n">'+esc(C(0,j).name)+'</span><span class="v">'+setTxt(0,j,true)+'</span></button>';});
  return {key:"hz:fresh",nav:nav(false),cls:"scr start",body:h+'</div>',
   dock:'<button class="pri" data-act="warm">Start warm-up</button><button class="tbtn" data-act="skipwarm">Skip warm-up</button>'};}

function openWarm(i){U.warm={i:i||0,run:false,end:0,left:WSEC*1000,cued:false,zero:false};}
function wLeftMs(){var w=U.warm;if(!w.run)return w.left;return Math.max(0,w.end-Date.now());}
function wLeftS(){return Math.ceil(wLeftMs()/1000);}
function wTotalLeft(){return wLeftS()+(WARM.length-1-U.warm.i)*WSEC;}
function wFrac(){return 1-wLeftMs()/(WSEC*1000);}
function wHero(i){var x=WARM[i];
  return '<div class="hero2 wh'+(wLeftS()<=3?" hot":"")+'" data-live="wcard"><div class="hnm"><button class="hname" data-act="whow" data-i="'+i+'">'+esc(x.n)+'</button></div>'+
   '<div class="hnum"><div class="hn"><b>'+(x.d==null?"·":x.d)+'</b><span>'+esc(x.u||"")+'</span></div><i class="hsep"></i><div class="hn live"><b data-live="wl">'+mmss(wLeftS())+'</b><span>left</span></div></div>'+
   '<div class="wbar"><i data-live="wbar" style="transform:scaleX('+wFrac().toFixed(4)+')"></i></div></div>';}
function wRow(j){var w=U.warm,on=j<w.i,c=j===w.i,y=WARM[j];
  return '<button class="rl'+(on?" on":"")+(c?" cur":"")+'" data-k="wr'+j+'" data-act="whow" data-i="'+j+'"><span class="tk"><i>'+IC.ck+'</i></span><span class="n">'+esc(y.n)+'</span><span class="v">'+(y.d==null?"":y.d+'<small>'+esc(y.u)+'</small>')+'</span></button>';}
function wNext(){var j=U.warm.i+1;
  if(j>=WARM.length){var f=rowsOf(0)[0];return '<button class="nxc end" data-k="wnxend" data-act="pv" data-p="w" aria-label="Show the list"><span class="nk">Next</span><span class="nn">Round 1</span><span class="nv">'+(f!=null?esc(C(0,f).name):"")+'</span></button>';}
  var y=WARM[j];return '<button class="nxc" data-k="wnx'+j+'" data-act="pv" data-p="w" aria-label="Show the list"><span class="nk">Next</span><span class="nn">'+esc(y.n)+'</span><span class="nv">'+(y.d==null?"":y.d+'<small>'+esc(y.u)+'</small>')+'</span></button>';}
function wCtl(){var w=U.warm,z=w.run&&wLeftMs()<=0,last=w.i>=WARM.length-1;
  var main=!w.run&&w.left===WSEC*1000?["wstart","Start"]:(z?["wnext",last?"Done":"Next"]:(w.run?["wpause","Pause"]:["wstart","Resume"]));
  return '<div class="wctl"><button class="circ" data-act="wback" aria-label="Back"'+(w.i===0?' disabled':'')+'>'+IC.back+'</button><button class="pri" id="wmain" data-act="'+main[0]+'" data-live="wmain">'+main[1]+'</button><button class="circ" data-act="wnext" aria-label="'+(last?"Done":"Next")+'">'+IC.fwd+'</button></div>';}
function warmScreen(){var w=U.warm,h='<div class="nav"><button class="bk" data-act="wclose">'+IC.back+esc(TITLE_N)+'</button><span class="it">Warm-up</span><button class="ed" data-act="wskip">Skip</button></div>';
  var list='<div class="rc wlist" data-k="wrc"><button class="rch" data-k="wrh" data-act="pv" data-p="w" aria-label="Show next"><span>Warm-up</span><span class="tab">'+(w.i+1)+'/'+WARM.length+'</span></button>';for(var j=0;j<WARM.length;j++)list+=wRow(j);list+='</div>';
  var body='<div class="sline"><span>'+(w.i+1)+"/"+WARM.length+'</span><span class="tab" data-live="wtot">'+mmss(wTotalLeft())+'</span></div>'+
   '<div class="stage" data-k="wstg"><div class="hzone" data-k="whz"><div class="hblk">'+pager(wHero(w.i),"w"+w.i,w.i)+'</div></div>'+panel("w",U.pv,wNext(),list)+'</div>';
  return {nav:h,cls:"scr hzs",body:body,dock:wCtl()};}
function warmGo(j,dir){var w=U.warm;if(j<0)return;if(j>=WARM.length){warmFinish();return;}
  var running=w.run;w.i=j;w.left=WSEC*1000;w.cued=false;w.zero=false;if(running){w.end=Date.now()+WSEC*1000;}hap("tap");draw({dir:dir});}
function warmFinish(){U.warm=null;W.wu=true;W.st=1;if(U.phase==="fresh")U.phase="work";if(!W.t0)W.t0=Date.now();U.arrive=true;hap("go");persist();syncCur();draw({instant:true});}

var REST_END=0,REST_BUZZ=false,SLOT_END=0,SLOT_LEFT=0,SLOT_ZERO=false,_rt=null;
function restNext(){var f=firstOpen();if(!f)return "Log the session";
  return '<span class="k">'+(f.r!==U.r||rowsOf(f.r).indexOf(f.si)===0?"Round "+(f.r+1):"Next")+'</span> '+esc(C(f.r,f.si).name)+' <span class="k">'+setTxt(f.r,f.si)+'</span>';}
function roundStats(r){var L=rowsOf(r),n=0,a=0,b=0;L.forEach(function(i){var c=W.done[rkey(r,i)];if(c){n++;if(c.ts){if(!a||c.ts<a)a=c.ts;if(c.ts>b)b=c.ts;}}});return {n:n,of:L.length,sec:a&&b?(b-a)/1000:0};}
function restHTML(){
  if(U.cd){var s=Math.max(1,Math.ceil((U.cd-Date.now())/1000)),f=firstOpen();
    return '<div class="rpin cdn" data-k="cdn"><div class="rlab" >'+(f?"Round "+(f.r+1):"")+'</div><div class="rn cdd" data-live="cdn">'+s+'</div><div class="rx">'+(f?esc(C(f.r,f.si).name)+' <span class="k">'+setTxt(f.r,f.si)+'</span>':"")+'</div></div>';}

  openSheet(media+'<h3 class="hh'+(media?'':' nm0')+'">'+esc(x.n)+'</h3><div class="wdose">'+(x.d==null?'':'<b>'+x.d+'</b><span>'+esc(x.u)+'</span>')+(x.x?'<em>'+esc(x.x)+'</em>':'')+'</div>'+

    (U.warm&&i!==U.warm.i?'<button class="sr" id="wjump"><span>Do this one now</span><span class="v">'+IC.chev+'</span></button>':''));
  var b=document.getElementById("wjump");if(b)b.addEventListener("click",function(){closeSheet();if(U.warm&&i!==U.warm.i)warmGo(i,i>U.warm.i?1:-1);});}
var CLK=null;
function clocksPause(){if(CLK)return;var c={};if(U.warm&&U.warm.run){U.warm.left=Math.max(0,U.warm.end-Date.now());U.warm.run=false;c.w=1;}
  if(SETREST>0&&slotPause())c.s=1;if(c.w||c.s){CLK=c;draw();}}
function clocksResume(){var c=CLK;CLK=null;if(!c)return;if(c.w&&U.warm&&!U.warm.run){U.warm.run=true;U.warm.end=Date.now()+U.warm.left;}if(c.s)slotResume();draw();}
var _openSheet0=openSheet,_closeSheetNow0=closeSheetNow;
openSheet=function(h){_openSheet0(h);clocksPause();};
closeSheetNow=function(){_closeSheetNow0();clocksResume();};
function warmSheet(){if(U.warm)return;openWarm(0);wakeOn();draw();}
function noteSheet(){openSheet('<h3>Note</h3><textarea id="fcom" class="fcom" rows="3" maxlength="500" placeholder="Note" aria-label="Note on this session">'+esc(FEEL.comment||"")+'</textarea><button class="sheet-cta" id="notesave">Save</button>');
  keepNote();document.getElementById("notesave").addEventListener("click",function(){var fc=document.getElementById("fcom");FEEL.comment=fc?String(fc.value||"").trim().slice(0,500):"";closeSheet();refeel();});}

document.addEventListener("click",function(e){if(suppressClick){suppressClick=false;e.preventDefault();e.stopPropagation();return;}
  var rb=e.target.closest("[data-rest]");if(rb&&!rb.closest(".leaving")){var ra=rb.getAttribute("data-rest");
    if(ra==="skip"){rgo();}else restNudge(+ra);return;}
  var b=e.target.closest("[data-act]");if(!b||b.disabled)return;var a=b.getAttribute("data-act"),si=+b.getAttribute("data-si"),r=+b.getAttribute("data-r"),i=+b.getAttribute("data-i");
  if(b.closest(".leaving")||LIFT)return;
  if(LOGGED&&["feel","twinge","note","how","edit","noop"].indexOf(a)<0)return;
  switch(a){
  case "noop":return;
  case "done":if(REST_END&&SETREST===0)restStop();tick(U.r,U.si);return;
  case "tick":tick(r,si);return;
  case "pick":pick(r,si);return;
  case "pv":setPv(b.getAttribute("data-p"),U.pv?0:1);return;
  case "kbstart":if(!W.t0)W.t0=Date.now();W.st=1;if(U.phase==="fresh")U.phase="work";slotStart();hap("tap");persist();draw();return;
  case "kbpause":slotPause();hap("tap");draw();return;
  case "kbresume":slotResume();hap("tap");draw();return;
  case "sidedone":sideSet(1);slotClear();hap("go");draw();return;
  case "rstart":restStart(REST);hap("tap");return;
  case "rgo":rgo();return;
  case "warm":openWarm(0);wakeOn();draw();return;
  case "skipwarm":W.st=1;U.phase="work";U.arrive=true;persist();syncCur();draw();return;
  case "wclose":U.warm=null;draw();return;
  case "wskip":U.warm=null;W.st=1;if(U.phase==="fresh")U.phase="work";U.arrive=true;persist();syncCur();draw({instant:true});return;
  case "wstart":var w=U.warm;w.run=true;w.end=Date.now()+w.left;draw();return;
  case "wpause":var w2=U.warm;w2.left=Math.max(0,w2.end-Date.now());w2.run=false;draw();return;
  case "wnext":warmGo(U.warm.i+1,1);return;
  case "wback":warmGo(U.warm.i-1,-1);return;
  case "whow":warmHow(i);return;
  case "prev":step(-1);return;
  case "next":step(1);return;
  case "how":demoSheet(r,si);return;
  case "edit":editSheet();return;
  case "addmv":addMvSheet();return;
  case "undo":tick(r,si);return;
  case "backnow":var c1=cur();U.view=null;draw({dir:ordOf(U.r,U.si)>ordOf(c1.r,c1.si)?1:-1});return;
  case "log":doLog("full");return;
  case "step":numSheet(r,si,b.getAttribute("data-f"));return;
  case "rskip":rgo();return;
  case "feel":refeel(b.getAttribute("data-v"),null);return;
  case "twinge":refeel(null,!FEEL.twinge);return;
  case "note":noteSheet();return;}});

function liveTick(){var t=Date.now(),q=function(s,root){return [].filter.call((root||document).querySelectorAll('[data-live="'+s+'"]'),function(e){return !e.closest(".ghost,.leaving");});};
  if(U.cd){var cs=Math.ceil((U.cd-t)/1000);if(cs<=0){cdEnd();return;}if(cs!==U.cdS){U.cdS=cs;hap("cue");q("cdn").forEach(function(e){setT(e,String(cs));if(!RM)anim(e,[{transform:"scale(1.25)",opacity:.4},{transform:"none",opacity:1}],{duration:380,easing:"cubic-bezier(.2,.8,.2,1)"});});}}
  if(SETREST>0&&SLOT_END&&U.phase==="work"&&!U.warm&&!LIFT&&!LOGGED){var sl=Math.max(0,Math.ceil((SLOT_END-t)/1000));
    if(sl<=0&&!SLOT_ZERO){SLOT_ZERO=true;hap("go");draw();return;}
    if(!U.view){q("slot").forEach(function(e){setT(e,mmss(sl));var c=e.closest(".live");if(c)c.classList.toggle("hot",sl<=3&&!isOn(U.r,U.si));});
      q("slotbar").forEach(function(e){e.style.transform="scaleX("+slotFrac().toFixed(4)+")";});}}
  if(U.warm&&U.warm.run){var w=U.warm,ms=Math.max(0,w.end-t),wl=Math.ceil(ms/1000);
    if(ms<=0&&!w.zero){w.zero=true;hap("go");}
    if(wl<=3&&!w.cued){w.cued=true;hap("cue");}
    q("wl").forEach(function(e){setT(e,mmss(wl));});q("wtot").forEach(function(e){setT(e,mmss(wTotalLeft()));});
    q("wbar").forEach(function(e){e.style.transform="scaleX("+(1-ms/(WSEC*1000)).toFixed(4)+")";});
    q("wcard").forEach(function(e){e.classList.toggle("hot",wl<=3);});
    var mb=document.querySelector('[data-live="wmain"]');if(mb){var z=ms<=0,lab=z?(w.i>=WARM.length-1?"Done":"Next"):"Pause",act=z?"wnext":"wpause";if(mb.textContent!==lab){setT(mb,lab);mb.setAttribute("data-act",act);}}}
  var t1=t0();if(t1&&!LOGGED){var el=mmss((t-t1)/1000);q("el").forEach(function(e){setT(e,el);});q("el2").forEach(function(e){if(!e.hasAttribute("data-counting"))setT(e,el);});}}

var RO=window.ResizeObserver?new ResizeObserver(function(){requestAnimationFrame(measure);}):null;
function measure(){if(!BODY)return;var de=document.documentElement,dh=DOCK&&DOCK.style.display!=="none"?DOCK.offsetHeight+"px":"0px",top=Math.round(BODY.getBoundingClientRect().top+scrollY)+"px";
  if(de.style.getPropertyValue("--dockH")!==dh)de.style.setProperty("--dockH",dh);
  if(de.style.getPropertyValue("--topH")!==top)de.style.setProperty("--topH",top);
}
function noStore(){var n=document.getElementById("storenote");if(n)n.hidden=false;}
function bootUI(){APP=document.getElementById("app");NAV=document.getElementById("nav");BODY=document.getElementById("body");DOCK=document.getElementById("dock");
  ensureCells();
  var sp=null;try{sp=sessionStorage.getItem("train.pv."+PAGE);}catch(e){}U.pv=(sp!=null?+sp:(+W.pv||0))?1:0;
  if(LOGGED)U.phase="finished";else if(ndone()||W.st||W.wu)U.phase="work";else U.phase="fresh";
  if(U.phase==="work"){syncCur();var f0=firstOpen();
    if(f0&&f0.r>0&&!rowsOf(f0.r).some(function(i){return isOn(f0.r,i);}))roundEnd(f0.r-1,true);}
  draw({instant:true});
  if(RO){RO.observe(DOCK);var nt=document.getElementById("notes");if(nt)RO.observe(nt);}
  bgSetup();setInterval(liveTick,250);try{document.fonts.ready.then(measure);}catch(e){}addEventListener("load",measure);addEventListener("resize",function(){measure();if(BG.cv)bgDims();});}

restoreLogged();
bootUI();
