<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B0D11">
<!-- Same posture as the app, narrowed to what a day page actually needs. It shipped with no policy
     at all, which is a gap rather than a choice: these are published pages on the same origin as
     his health data. frame-src is nocookie only, img-src excludes ytimg so nothing reaches Google
     until he taps play, and connect-src carries self for the sync client plus the Worker. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; frame-src https://www.youtube-nocookie.com; connect-src 'self' https://train-sync.yellinmatt.workers.dev; form-action 'none'; base-uri 'none'">
<title>Lift, legs focus</title>
<style>
:root{--bg:#0B0D11;--surface:#14181E;--surface-2:#1E242C;--ink:#F3F5F8;--sub:#9BA3AF;--faint:#6B7079;
--white:#FFF;--line:#242A32;--line-2:#30363F;--accent:#FF5C3A;--accent-tint:#3A1E17;--good:#34D399;
--good-tint:#12271E;--amber:#F0C36B;--r-card:16px;--r-btn:13px;
--shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.45)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,system-ui,"Segoe UI",sans-serif;
-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;
padding:env(safe-area-inset-top) 0 calc(40px + env(safe-area-inset-bottom));min-height:100vh}
button,input,select{font-family:inherit;color:inherit;font-size:17px}
button{touch-action:manipulation;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:540px;margin:0 auto;padding:0 16px}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 0 10px}
.head .date{font-size:13px;font-weight:600;color:var(--sub)}
.head .title{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:1px}
.head .sub{font-size:13px;color:var(--faint);margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
box-shadow:var(--shadow);padding:15px 20px;margin-bottom:8px}
.sectlbl{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.arow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);
width:100%;text-align:left;background:none}
.arow:last-child{border-bottom:0;padding-bottom:2px}
.arow:active{background:var(--surface-2)}
.arow .chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-2);flex:none;
display:flex;align-items:center;justify-content:center;transition:.15s}
.arow .chk svg{width:13px;height:13px;opacity:0;transition:.15s}
.arow.checked .chk{background:var(--good);border-color:var(--good);color:var(--white)}
.arow.checked .chk svg{opacity:1}
.atxt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.arow .an{font-size:15px;font-weight:500;color:var(--ink);line-height:1.25}
.arow.checked .an{color:var(--faint)}
.arow .axv{width:44px;min-height:44px;flex:none;border:0;background:none;color:var(--faint);
display:flex;align-items:center;justify-content:center;border-radius:10px}
.arow .axv:active{background:var(--surface-2)}
.arow .axv svg{width:20px;height:20px}
.arow .axn{flex:none;min-width:56px;min-height:44px;border:0;background:none;padding:0 0 0 6px;
text-align:right;font-size:23px;font-weight:700;letter-spacing:-.02em;color:var(--ink);line-height:44px}
.arow .axn.word{font-size:14px;font-weight:600;color:var(--sub);letter-spacing:0;
max-width:48%;white-space:normal;line-height:1.3;text-align:right;height:auto;padding:8px 0 8px 8px;
display:flex;align-items:center;justify-content:flex-end}
.arow .an{overflow-wrap:anywhere}
.lrow{display:grid;grid-template-columns:22px minmax(0,1fr) 34px 60px 48px;column-gap:6px;align-items:center;
padding:9px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;cursor:pointer}
.lrow:last-child{border-bottom:0}
.lrow,.optrow{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.lrow.dragging,.optrow.dragging{background:var(--surface-2);box-shadow:var(--shadow);border-radius:10px;position:relative;z-index:5;transform:scale(1.02);transition:transform .12s}
body.dragmode{touch-action:none;overscroll-behavior:none}
.lrow .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);display:flex;
align-items:center;justify-content:center;transition:.15s}
.lrow .chk svg{width:14px;height:14px;opacity:0;transition:.15s}
.lrow.checked .chk{background:var(--good);border-color:var(--good);color:var(--white)}
.lrow.checked .chk svg{opacity:1}
.lrow .an{font-size:15px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.lrow.checked .an{color:var(--faint)}
.lrow .how{width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--accent);
border-radius:50%;background:var(--accent-tint);border:1px solid transparent}
.lrow .how svg{width:13px;height:13px;margin-left:2px}
.lrow .how:active,.lrow .how:hover{border-color:var(--accent)}
.lbox{height:46px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);
display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;letter-spacing:-.01em;
font-variant-numeric:tabular-nums;color:var(--ink);padding:0;cursor:pointer}
.lbox:hover{border-color:var(--sub)}
.lbox:active{border-color:var(--accent)}
.lbox.muted{font-size:13px;font-weight:700;color:var(--sub)}
.fcom{display:block;width:100%;min-height:64px;margin:12px 0 4px;padding:12px;border-radius:var(--r-btn);border:1px solid var(--line);
background:var(--surface-2);color:var(--ink);font:inherit;font-size:16px;line-height:1.4;resize:vertical}
.lbox.none{visibility:hidden}
.lrow.checked .lbox{color:var(--faint)}
.lhead{display:grid;grid-template-columns:22px minmax(0,1fr) 34px 60px 48px;column-gap:6px;padding:10px 0 0}
.lhead span{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);text-align:center}
.rnd .abody{padding:4px 14px 10px}
.nedit{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0 4px}
.nedit button{width:64px;height:64px;border-radius:16px;background:var(--surface-2);font-size:30px;font-weight:700;color:var(--ink)}
.nedit .nv{flex:1;text-align:center;font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.nedit .nu{font-size:16px;font-weight:700;color:var(--sub);margin-left:4px}
.vbox{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000;margin:4px 0 12px}
.vbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

.arow.checked .axn,.arow.checked .axn.word{color:var(--faint)}
.rnd{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
box-shadow:var(--shadow);margin-bottom:8px}
.rnd>summary{list-style:none;cursor:pointer;display:flex;align-items:center;
justify-content:space-between;gap:10px;padding:13px 20px;min-height:56px}
.rnd>summary::-webkit-details-marker{display:none}
.rnd .asum{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.rnd .aright{display:flex;align-items:center;gap:10px}
.rnd .acount{font-size:13px;font-weight:700;color:var(--sub)}
.rnd.alldone .acount{color:var(--good)}
.rnd[open]>summary{border-bottom:1px solid var(--line)}
.rnd .abody{padding:4px 20px 12px}
.rnd .mrtrack{stroke:var(--line)}
.chev{display:flex;color:var(--faint);transition:transform .2s ease}
.chev svg{width:16px;height:16px}
.rnd[open] .chev{transform:rotate(180deg)}
.miniring{width:34px;height:34px;flex:none}
.miniring svg{transform:rotate(-90deg)}
.miniring circle:last-child{transition:stroke-dashoffset .5s cubic-bezier(.22,1,.36,1)}
.rndctl{display:flex;gap:8px;margin:2px 0 12px}
.rndctl button{flex:1;min-height:48px;border:1px dashed var(--line-2);border-radius:var(--r-card);
background:none;color:var(--sub);font-size:14px;font-weight:600;cursor:pointer}
.rndctl button:active{background:var(--surface-2)}
.tgs{font-size:11px;color:var(--faint);margin-top:6px;line-height:1.35}
.done-pill{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;
margin-top:18px;background:var(--good-tint);color:var(--good);border-radius:var(--r-btn);
font-size:17px;font-weight:700}
.done-pill svg{width:18px;height:18px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:50}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);
border-radius:20px 20px 0 0;padding:14px 20px calc(22px + env(safe-area-inset-bottom));
max-height:82vh;overflow:auto;display:none;box-shadow:0 -16px 52px rgba(0,0,0,.6)}
.sheet.on{display:block}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto 14px}
.sheet h3{font-size:19px;font-weight:800;margin-bottom:3px}
.ssub{font-size:13px;color:var(--sub);margin-bottom:12px}
.rsrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;
border-bottom:1px solid var(--line)}
.rsl{font-size:15px;color:var(--sub)}
.stp{display:flex;align-items:center;background:var(--surface-2);border-radius:10px;height:44px;overflow:hidden}
.stp button{width:44px;height:44px;font-size:24px;font-weight:600;color:var(--sub);flex:none;
display:flex;align-items:center;justify-content:center}
.stp .val{flex:1;text-align:center;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;
min-width:56px;padding:0}
.sheet-cta{display:block;width:100%;min-height:52px;border-radius:var(--r-btn);background:var(--accent);
color:#fff;font-size:17px;font-weight:800;margin-top:14px}
.sheet-cta.ghost{background:var(--surface-2);color:var(--ink);font-size:15px;font-weight:650;margin-top:8px}
.optrow{display:flex;align-items:center;gap:12px;width:100%;padding:13px 0;border-bottom:1px solid var(--line);
text-align:left;font-size:15px}
.optrow .on2{flex:1;font-weight:600}
.libq{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:transparent;color:inherit;margin-top:4px}
.optrow .oc{font-size:13px;color:var(--faint);font-weight:400}
.cta{display:block;width:100%;min-height:54px;border-radius:var(--r-btn);background:var(--accent);
color:#fff;font-size:17px;font-weight:800;margin-top:10px}
.cta.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);font-size:15px;font-weight:650}
.cta[disabled]{opacity:.45}
.warn{background:var(--accent-tint);border:1px solid var(--accent);border-radius:var(--r-btn);
padding:12px;font-size:14px;margin:12px 0;line-height:1.4}
.note{color:var(--faint);font-size:12.5px;margin-top:10px;line-height:1.4}
.back{display:inline-block;margin:20px 0 6px;color:var(--sub);text-decoration:none;font-size:14px;font-weight:650}
a{color:var(--accent)}
.restbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface-2);color:#fff;
display:none;align-items:center;justify-content:space-between;gap:14px;
padding:14px 20px calc(14px + env(safe-area-inset-bottom))}
.restbar.on{display:flex}
.restbar .rt{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.restbar button{color:var(--sub);font-size:14px;font-weight:700}
.vwrap{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000}
.vwrap iframe,.vwrap button{position:absolute;inset:0;width:100%;height:100%;border:0}
.vwrap button{background:linear-gradient(140deg,var(--accent-tint),var(--surface-2));color:#fff;
font:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px}
.vwrap button svg{width:30px;height:30px;flex:none}
.seg{display:flex;gap:6px;background:var(--surface-2);border-radius:11px;padding:4px;margin-bottom:12px}
.segb{flex:1;min-height:44px;border-radius:8px;background:none;color:var(--sub);font-size:15px;font-weight:700}
.segb.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.fld{width:112px;height:46px;border-radius:10px;background:var(--surface-2);color:var(--ink);
text-align:right;padding:0 13px;font-size:19px;font-weight:700;border:1px solid transparent}
.fld:focus{outline:none;border-color:var(--accent)}
.pace{font-size:13px;color:var(--faint);text-align:right;margin-top:10px;min-height:16px}
.planbtn{flex:none;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line-2);
background:var(--surface-2);color:var(--ink);font-size:14px;font-weight:700;margin-top:6px}
.nextup{margin-top:10px;font-size:14px;color:var(--sub);line-height:1.45;text-align:center}
.sumg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 4px}
.sumt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:12px}
.sutl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.sutv{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.sutv i{font-style:normal;font-size:14px;color:var(--sub);margin-left:2px;font-weight:600}
.sutd{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}.sutd.up{color:var(--good)}
.sulab{display:flex;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:18px 2px 4px}
.sulab span{letter-spacing:0;text-transform:none;font-weight:600}
.sur{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:15px}
.sur span{min-width:0}.sur .why{display:block;font-style:normal;font-size:13px;color:var(--sub);margin-top:2px}
.sur b{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}.sur b.up{color:var(--good)}.sur b i{font-style:normal;color:var(--faint);margin:0 5px}
.sunote{padding:10px 2px;font-size:15px;line-height:1.45;color:var(--ink);overflow-wrap:anywhere}
.sutw{margin:12px 2px 0;font-size:13px;color:var(--sub)}

@media (min-width:700px){
  .app{max-width:820px;padding:0 28px}
  .head .title{font-size:34px}
  .head .sub{font-size:15px}
  .rnd>summary{padding:16px 26px;min-height:64px}
  .rnd .asum,.rnd .acount{font-size:14px}
  .rnd .abody{padding:6px 26px 14px}
  .lrow,.lhead{grid-template-columns:32px minmax(0,1fr) 52px 120px 100px;column-gap:16px}
  .lrow{padding:12px 0}
  .lrow .chk{width:30px;height:30px}
  .lrow .an{font-size:19px}
  .lrow .how{width:48px;height:48px}
  .lrow .how svg{width:18px;height:18px}
  .lbox{height:56px;font-size:26px;border-radius:14px}
  .lbox.muted{font-size:16px}
  .lhead span{font-size:12px}
  .rndctl button,.cta{max-width:none}
  .sheet{left:0;right:0;margin:0 auto;bottom:24px;width:600px;max-width:calc(100% - 48px);border-radius:20px;padding:18px 26px 24px}
}
.cempty{display:flex;flex-direction:column;gap:10px;padding:22px 18px;border:1px dashed var(--line-2);border-radius:var(--r-card);margin:6px 0 14px;text-align:center}
.cempty b{font-size:20px;font-weight:800}
.cempty span{font-size:15px;color:var(--sub);line-height:1.45}
.nextup.dbl{color:var(--ink);font-weight:700}
.app{padding-bottom:110px}
.navtxt{flex:none;min-height:44px;min-width:44px;padding:0 4px;margin-top:4px;font-size:17px;font-weight:600;color:var(--accent)}
.navback{display:inline-flex;align-items:center;min-height:44px;min-width:44px;margin:4px 0 -14px -4px;padding:0 4px;
color:var(--accent);text-decoration:none;font-size:17px;font-weight:600}
.txtrow button[disabled],.rndctl button[disabled],.lnk1[disabled],.sheet-cta[disabled]{opacity:.35;cursor:default}
.ist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:4px 0 8px}
.ist span{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.ist b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.wprog2{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.wprog2 .bar{flex:1;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.wprog2 .bar i{display:block;height:100%;width:0;background:var(--good);transition:width .3s}
.lrow .an .lt{display:block;font-size:12.5px;font-weight:600;color:var(--faint);margin-top:2px;font-variant-numeric:tabular-nums}
.lrow .an .lt.up{color:var(--good)}
.lrow.checked .an .lt{color:var(--faint)}
.how2{width:44px;height:44px;margin:0 -5px;display:flex;align-items:center;justify-content:center;color:var(--faint);border-radius:10px}
.how2 svg{width:12px;height:12px;margin-left:2px}
.how2:active{background:var(--surface-2)}
.lbox{border-color:transparent}
.mring{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:50%;position:relative;margin:-5px -7px -5px 0}
.mring:active{background:var(--surface-2)}
.mring .tk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--sub)}
.mring .tk svg{width:12px;height:12px}
.rnd.alldone .mring .tk{color:var(--good)}
.txtrow{display:flex;justify-content:center;gap:22px;margin:6px 0 4px}
.txtrow button{min-height:44px;padding:0 4px;font-size:15px;font-weight:600;color:var(--accent)}
.lnk1{display:block;width:100%;min-height:44px;margin-top:4px;font-size:15px;font-weight:600;color:var(--sub);text-align:center}
.restbar.rb2{gap:10px;padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
.rb2 .rbl{min-width:0;flex:1}
.rb2 .rbk{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.rb2 .rt{display:block;font-size:28px;line-height:1.1}
.rb2.over .rt,.rb2.over .rbk{color:var(--amber)}
.rb2 .rbn{display:block;font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb2 .rbb{display:flex;gap:6px;flex:none}
.rb2 .rbb button{min-width:48px;height:44px;border-radius:12px;padding:0 8px;font-size:15px;font-weight:700;color:var(--ink)}
.rb2 .rbb button[data-rest="skip"]{color:var(--accent)}
.fnote{font-size:13px;color:var(--amber);margin:2px 0 6px}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;width:100%;text-align:left;border-bottom:1px solid var(--line);font-size:16px;color:var(--ink)}
.sw{width:51px;height:31px;border-radius:16px;background:var(--line-2);position:relative;flex:none;transition:background .15s}
.sw i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.sw.on{background:var(--good)}.sw.on i{left:22px}
.fbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0 6px}
.fbtns button{min-height:52px;border-radius:13px;background:var(--accent);color:#fff;font-size:16px;font-weight:700}
.cancel{display:block;width:100%;min-height:44px;margin-top:4px;font-size:16px;font-weight:600;color:var(--accent);text-align:center}
.sutv.good{color:var(--good)}
.sur .best{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--good-tint);color:var(--good);font-size:11.5px;font-weight:800;letter-spacing:.02em;vertical-align:1px}

<script>
function today(){var d=new Date(),p=function(n){return (n<10?"0":"")+n;};
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}
var PAGE="legs";
var SLOT=(function(){
  var t=today(), y=new Date(Date.now()-86400000), p=function(n){return (n<10?"0":"")+n;};
  var yd=y.getFullYear()+"-"+p(y.getMonth()+1)+"-"+p(y.getDate());
  try{ var raw=localStorage.getItem("trainday."+yd+"."+PAGE), pr=raw?JSON.parse(raw):null;
    var S0=JSON.parse(localStorage.getItem("train_v2")||"null");
    var logged=S0&&S0.sessions&&S0.sessions.some(function(x){return x&&x.slot===yd+"-"+PAGE&&!x.draft;});
    if(pr&&pr.done&&Object.keys(pr.done).length&&!logged){
      var ts=0;for(var k in pr.done){var c=pr.done[k];if(c&&c.ts&&c.ts>ts)ts=c.ts;}
      if(ts&&Date.now()-ts<18*3600000) return yd; }
  }catch(e){}
  return t; })();
var SLOTID=SLOT+"-"+PAGE;
var I={"check":"<svg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M5 12.5l4.2 4.2L19 7\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>","chevD":"<svg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>","play":"<svg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M7 5l12 7-12 7V5Z\" fill=\"currentColor\"/></svg>"};

var LS="train_v2";
function loadS(){try{return JSON.parse(localStorage.getItem(LS));}catch(e){return null;}}
function haveStore(){var s=loadS();return !!(s&&typeof s==="object"&&s.sessions);}
var LAST_RESOLVE=null;
function logSession(rec,date,quiet){
  var S=loadS(); if(!S||!S.sessions) return false;
  S.sessions=S.sessions||[]; S.done=S.done||{};
  LAST_RESOLVE=null;
  var prior=rec.draft?null:S.sessions.filter(function(x){return x&&x.id===rec.id&&x.type==="lift"&&!x.draft;})[0];
  var RS=(window.TrainSyncAuto&&typeof window.TrainSyncAuto.resolve==="function")?window.TrainSyncAuto.resolve:null;
  if(prior&&RS){var rr=RS(prior,rec);LAST_RESOLVE={kept:rr.keep===rec?"this":"other",aside:rr.aside,other:prior};
    rec=rr.keep;if(rr.aside&&!S.sessions.some(function(x){return x&&x.id===rr.aside.id;}))S.sessions.push(rr.aside);}
  S.sessions=S.sessions.filter(function(x){return x.id!==rec.id;});
  if(!rec.draft) S.sessions.filter(function(x){return x&&x.draft&&x.slot===rec.slot;}).forEach(function(x){tombId(S,x.id);});
  S.sessions.push(rec); S.done[date]=true;
  try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){return false;}
  if(!quiet){ try{ if(window.TrainSyncAuto && typeof window.TrainSyncAuto.now==="function") window.TrainSyncAuto.now(); }catch(e){} }
  return true;
}
function pkey(){return "trainday."+SLOT+"."+PAGE;}
function loadProg(){try{return JSON.parse(localStorage.getItem(pkey()))||{};}catch(e){return {};}}
function saveProg(p){try{localStorage.setItem(pkey(),JSON.stringify(p));}catch(e){}}
function noStore(){
  var w=document.createElement("div"); w.className="warn";
  w.innerHTML='This browser has no Train data yet, so a tick cannot be saved here. '+
    'Open <a href="../index.html">the Train app</a> once on this device, then come back.';
  var app=document.querySelector(".app"); app.insertBefore(w,app.children[1]);
  [].forEach.call(document.querySelectorAll(".cta"),function(b){if(!b.classList.contains("ghost"))b.disabled=true;});
}
function tombId(S,id){S.deleted=S.deleted||[];S.deleted.push({id:String(id),at:Date.now()});
  S.sessions=(S.sessions||[]).filter(function(x){return !x||String(x.id)!==String(id);});}
function isDead(S,id){return (S.deleted||[]).some(function(t){return t&&String(t.id)===String(id);});}
function localDay(ts){var d=new Date(ts),q=function(n){return (n<10?"0":"")+n;};
  return d.getFullYear()+"-"+q(d.getMonth()+1)+"-"+q(d.getDate());}
function draftFrom(slotId,slotDate,p,focus){
  var done=p.done||{}, keys=Object.keys(done); if(!keys.length) return null;
  var by={},ids=[],rounds={},ts=null;
  keys.forEach(function(k){var ri=k.split(":"),r=+ri[0],i=+ri[1],c=done[k];
    var cell=(c&&typeof c==="object")?c:((p.cells&&p.cells[r]&&p.cells[r][i])||(p.order&&p.order[i])||{});
    var id=cell.exId||(p.order&&p.order[i]&&p.order[i].exId); if(!id) return;
    if(c&&c.ts&&(ts==null||c.ts<ts)) ts=c.ts;
    rounds[r]=1;
    if(!by[id]){by[id]=[];ids.push(id);}
    by[id].push({weightLb:+cell.w||0,reps:+cell.reps||0,completed:true});});
  if(!ids.length) return null;
  var meta={};(p.order||[]).forEach(function(o){if(o&&!meta[o.exId])meta[o.exId]=o;});
  var entries=ids.map(function(id){var o=meta[id]||{};
    return {exerciseId:id,targetLow:o.lo!=null?o.lo:null,targetHigh:o.hi!=null?o.hi:null,
      targetWeightLb:o.w!=null?o.w:null,sets:by[id],bw:!!o.bw,unit:o.unit||"reps"};});
  var date=ts?localDay(ts):slotDate;
  return {id:slotId+"~draft"+(p.draftRev||0),slot:slotId,date:date,type:"lift",
    activity:"Full body"+(focus?", "+focus:""),durationSec:0,notes:"day-page autosave",
    rounds:Object.keys(rounds).length,focus:focus||null,entries:entries,warmup:!!p.wu,
    feel:null,twinge:false,draft:true};
}
function putDraft(S,rec){
  if(!rec) return false;
  if(S.sessions.some(function(x){return x&&x.slot===rec.slot&&!x.draft;})) return false;
  if(isDead(S,rec.id)||isDead(S,rec.slot)) return false;   /* he deleted this session once; never resurrect it */
  var prev=S.sessions.filter(function(x){return x&&x.id===rec.id;})[0];
  if(prev&&JSON.stringify(prev)===JSON.stringify(rec)) return false;
  S.sessions=S.sessions.filter(function(x){return !x||x.id!==rec.id;});
  S.sessions.push(rec); S.done=S.done||{}; S.done[rec.date]=true; return true;
}
function syncNow(){try{ if(window.TrainSyncAuto&&typeof window.TrainSyncAuto.now==="function") window.TrainSyncAuto.now(); }catch(e){}}
function sweepOrphans(){
  var S=loadS(); if(!S||!S.sessions) return 0; var n=0;
  for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);
    if(!k||k.indexOf("trainday.")!==0) continue;
    var km=/^trainday\.(\d{4}-\d{2}-\d{2})\.(lift|push|pull|legs)$/.exec(k); if(!km) continue;
    var slotDate=km[1], sfx=km[2], p=null;
    if(Date.now()-Date.parse(slotDate+"T12:00:00")>30*86400000) continue;   /* a month is rescue; older is archaeology */
    try{p=JSON.parse(localStorage.getItem(k));}catch(e){}
    if(!p||!p.done) continue;
    if(sfx!=="lift"&&slotDate===SLOT&&sfx===PAGE) continue;   /* the session open on this page autosaves itself */
    if(putDraft(S,draftFrom(slotDate+"-"+sfx,slotDate,p,p.focus||(sfx!=="lift"?sfx:null)))) n++;}
  if(n){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){return 0;} syncNow();}
  return n;
}
try{ sweepOrphans(); }catch(e){}

}

var _rt=null;
function restStart(sec){
  var bar=document.getElementById("restbar"),out=document.getElementById("restt");
  if(_rt)clearInterval(_rt);
  var left=sec; bar.classList.add("on");
  out.textContent=Math.floor(left/60)+":"+("0"+(left%60)).slice(-2);
  _rt=setInterval(function(){left--;
    out.textContent=Math.floor(left/60)+":"+("0"+(Math.max(left,0)%60)).slice(-2);
    if(left<=0){restStop();}},1000);
}
function restStop(){if(_rt){clearInterval(_rt);_rt=null;}document.getElementById("restbar").classList.remove("on");}

function untouched(){return !LOGGED&&Object.keys(W.done).length===0&&ordSig()===ORDER0;}
function reloadIfUntouched(){if(!untouched())return false;var sh=document.getElementById("sheet");if(sh&&sh.classList.contains("on"))return false;
  try{localStorage.removeItem(pkey());}catch(e){} location.reload(); return true;}
function checkPlan(){
  if(LOGGED) return "logged";
  var sig; try{sig=JSON.stringify(canonRows(loadS()));}catch(e){return "err";}
  if(sig===PLAN_SIG) return "same";
  if(!untouched()){ if(!PLAN_NOTED){PLAN_NOTED=true;var n=document.getElementById("plannote");
      if(n){n.textContent="The plan changed on another device. It applies next session.";n.hidden=false;}} return "noted"; }
  return reloadIfUntouched()?"reload":"sheet";
}
function prevSessionOf(D){return typeof prevSession==="function"?prevSession(D):null;}
function freshPlan(cb){var fired=false,fin=function(r){if(fired)return;fired=true;cb(r||{ok:false});};
  try{var T=window.TrainSyncAuto;if(T&&typeof T.now==="function"){
    T.now().then(fin,function(){fin({ok:false,reason:"error"});});setTimeout(function(){fin({ok:false,reason:"slow"});},8000);return;}}catch(e){}
  fin({ok:false,reason:"no sync"});}
function queueAdvance(entries){try{var q=JSON.parse(localStorage.getItem(PEND_K)||"[]");
  q=q.filter(function(x){return x.slot!==SLOTID;});
  q.push({slot:SLOTID,focus:FOCUS,entries:entries,feel:FEEL.feel,twinge:!!FEEL.twinge,at:Date.now()});
  localStorage.setItem(PEND_K,JSON.stringify(q.slice(-6)));}catch(e){}}
function applyPending(){var q=[];try{q=JSON.parse(localStorage.getItem(PEND_K)||"[]");}catch(e){return 0;}
  var mine=q.filter(function(x){return x.focus===FOCUS;}); if(!mine.length) return 0;
  var F0={feel:FEEL.feel,twinge:FEEL.twinge};
  mine.sort(function(a,b){return a.at-b.at;}).forEach(function(x){FEEL.feel=x.feel;FEEL.twinge=!!x.twinge;try{advancePlan(x.entries);}catch(e){}});
  FEEL.feel=F0.feel;FEEL.twinge=F0.twinge;
  try{localStorage.setItem(PEND_K,JSON.stringify(q.filter(function(x){return x.focus!==FOCUS;})));}catch(e){}
  return mine.length;}
function planWatch(force){var t=Date.now();if(!force&&t-LAST_WATCH<20000)return;LAST_WATCH=t;
  freshPlan(function(r){ var ap=r.ok&&applyPending(); if(LOGGED)return; if(ap&&reloadIfUntouched())return; checkPlan(); });}
document.addEventListener("visibilitychange",function(){ if(!document.hidden){ planWatch(); if(!LOGGED&&Object.keys(W.done).length) wakeOn(); } });
window.addEventListener("pageshow",function(ev){ if(ev.persisted) planWatch(true); });
setInterval(checkPlan,15000);
(function(){try{var q=JSON.parse(localStorage.getItem(PEND_K)||"[]");
  if(q.some(function(x){return x.focus===FOCUS;})) setTimeout(function(){planWatch(true);},1500);}catch(e){}})();
(function(){try{if(haveStore()&&!(localStorage.getItem("train.syncToken")||"").trim()){var n=document.getElementById("syncnote");if(n)n.hidden=false;}}catch(e){}})();
var WAKE=null;
function wakeOn(){try{if(WAKE||LOGGED||!navigator.wakeLock||document.hidden)return;
  navigator.wakeLock.request("screen").then(function(l){WAKE=l;l.addEventListener("release",function(){WAKE=null;});},function(){});}catch(e){}}
function wakeOff(){try{if(WAKE){WAKE.release();WAKE=null;}}catch(e){}}

function rkey(r,si){return r+":"+si;}
function slotIn(r,si){var o=W.order[si];return o.upTo==null||r<o.upTo;}
function lastTick(si){var lt=-1;for(var q=0;q<W.rN;q++)if(W.done[rkey(q,si)])lt=q;return lt;}
function roundSlots(r){var n=0;for(var i=0;i<W.order.length;i++)if(slotIn(r,i))n++;return n;}
function cellOn(r,si){return !!W.done[rkey(r,si)];}
function roundDoneN(r){var n=0;for(var i=0;i<W.order.length;i++)if(slotIn(r,i)&&cellOn(r,i))n++;return n;}
function roundComplete(r){var t=roundSlots(r);return t>0&&roundDoneN(r)>=t;}
function roundsDoneN(){var n=0;for(var r=0;r<W.rN;r++)if(roundComplete(r))n++;return n;}
function firstOpenRound(){for(var r=0;r<W.rN;r++)if(!roundComplete(r))return r;return W.rN-1;}
function doseOf(o){ var r=(o.unit==="s")?(o.reps+"s"):("x"+o.reps);
  return o.band ? ((o.bandUp?"heavier band ":"band ")+r) : ((o.w>0?o.w+"lb ":"")+r); }

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

    '<span class="lbox none"></span><span class="lbox none"></span></div>';

function loadCell(o,key){
  if(o.band) return '<button class="lbox muted" data-load="'+key+'" aria-label="Band">'+(o.bandUp?"heavier":"band")+'</button>';
  if(o.bw||(!(o.w>0)&&!o.ladder)) return '<span class="lbox muted">BW</span>';
  if(!(o.w>0)) return '<button class="lbox muted" data-load="'+key+'" aria-label="Bodyweight, tap to add load">BW</button>';
  return '<button class="lbox num" data-load="'+key+'" aria-label="'+o.w+' pounds, tap to change">'+o.w+'</button>';

function rowHTML(r,si){
  var o=C(r,si),on=cellOn(r,si),key=r+":"+si;

    '<span class="chk">'+I.check+'</span><span class="an">'+esc(o.name)+ltLine(o)+'</span>'+
    '<button class="'+(V26_PAGE?"how2":"how")+'" data-demo="'+key+'" aria-label="How to do '+esc(o.name)+'">'+I.play+'</button>'+
    loadCell(o,key)+
    '<button class="lbox num" data-reps="'+key+'" aria-label="'+o.reps+(o.unit==="s"?" seconds":" reps")+', tap to change">'+o.reps+(o.unit==="s"?"s":"")+'</button>'+
    '</div>';

function roundHTML(r){
  var n=roundDoneN(r),tot=roundSlots(r),full=tot>0&&n>=tot;
  var open = (OPEN[r]!=null) ? OPEN[r] : (r===firstOpenRound());
  var C=2*Math.PI*13, off=C*(1-(tot?n/tot:0));
  var rows = '<div class="lhead"><span></span><span></span><span></span><span>lb</span><span>reps</span></div>'+(r===0?warmRow():"");
  for(var i=0;i<W.order.length;i++) if(slotIn(r,i)) rows+=rowHTML(r,i);
  var ring='<span class="miniring"><svg width="30" height="30" viewBox="0 0 34 34">'+
    '<circle class="mrtrack" cx="17" cy="17" r="13" fill="none" stroke-width="4"/>'+
    '<circle cx="17" cy="17" r="13" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" '+
    'stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/>'+
    '</svg></span>';
  if(V26_PAGE) ring='<button class="mring" data-rr="'+r+'" aria-label="'+(full?"Untick":"Tick")+' every set in round '+(r+1)+'">'+ring+'<span class="tk">'+I.check+'</span></button>';
  return '<details class="rnd'+(full?" alldone":"")+'" data-r="'+r+'"'+(open?" open":"")+'><summary>'+
    '<span class="asum">Round '+(r+1)+'</span>'+
    '<span class="aright">'+(V26_PAGE?'':'<span class="acount num">'+n+' of '+tot+'</span>')+
    '<span class="chev">'+I.chevD+'</span>'+ring+
    '</span></summary><div class="abody">'+rows+'</div></details>';
}
function totalSets(){var t=0;for(var r=0;r<W.rN;r++)t+=roundSlots(r);return t;}
function render(){
  [].forEach.call(document.querySelectorAll(".rnd"),function(d){OPEN[+d.getAttribute("data-r")]=d.open;});
  var h="";
  if(FOCUS==="custom"&&!W.order.length)h='<div class="cempty"><b>Build your own</b><span>Add movements from the library, set your rounds, then log it. It saves as your own workout for next time.</span><button class="cta" onclick="addMvSheet()">Add a movement</button></div>';
  else for(var r=0;r<W.rN;r++)h+=roundHTML(r);
  document.getElementById("rounds").innerHTML=h;
  paintMeta();
  persist();
}
function mmss(s){return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2);}
function tankShort(){var t=String(EFFORT||""),i=t.indexOf(" ");return (i>0?t.slice(0,i):t).replace("-","\u2013");}
function paintMeta(){
  var dn=roundsDoneN(), m=document.getElementById("meta");
  if(!V26_PAGE){m.textContent=W.rN+" round"+(W.rN===1?"":"s")+" \u00b7 "+totalSets()+" sets \u00b7 "+REST+"s rest \u00b7 "+EFFORT+(dn?" \u00b7 "+dn+" done":"");return;}
  m.innerHTML='<div><span>Rounds</span><b>'+W.rN+'</b></div><div><span>Rest</span><b>'+mmss(REST)+'</b></div><div><span>In tank</span><b>'+esc(tankShort())+'</b></div>';
  var tot=totalSets(), t=0; Object.keys(W.done).forEach(function(k){var p=k.split(":");if(+p[0]<W.rN&&slotIn(+p[0],+p[1]))t++;});
  document.getElementById("wprogi").style.width=(tot?Math.round(t/tot*100):0)+"%";
  document.getElementById("wprogt").textContent=t+" of "+tot;
  if(HAVE==null) HAVE=haveStore();
  var fb=document.getElementById("fullbtn"); if(fb&&HAVE&&!LOGGED) fb.disabled=!t;
  var fl=document.getElementById("floorbtn"); if(fl&&HAVE&&!LOGGED) fl.disabled=!t;
  paintCtl();
}
var HAVE=null;

document.addEventListener("click",function(ev){
  if(Date.now()-DRAG_EAT_CLICK<250)return;
  var t=ev.target.closest("button, .lrow");
  if(!t)return;
  var rs=function(a){var p=String(t.getAttribute(a)).split(":");return [+p[0],+p[1]];};
  if(t.hasAttribute&&t.hasAttribute("data-rr")){ev.preventDefault();ev.stopPropagation();if(!LOGGED)tickRound(+t.getAttribute("data-rr"));return;}
  if(t.hasAttribute&&t.hasAttribute("data-rest")){ev.stopPropagation();var ra=t.getAttribute("data-rest");
    if(ra==="skip")restStop(); else {RLEFT+=+ra; restPaint();} return;}
  if(t.hasAttribute&&t.hasAttribute("data-demo")){ev.stopPropagation();var a=rs("data-demo");demoSheet(a[0],a[1]);return;}
  if(t.hasAttribute&&t.hasAttribute("data-load")){ev.stopPropagation();if(LOGGED)return;var b=rs("data-load");numSheet(b[0],b[1],"load");return;}
  if(t.hasAttribute&&t.hasAttribute("data-reps")){ev.stopPropagation();if(LOGGED)return;var c=rs("data-reps");numSheet(c[0],c[1],"reps");return;}
  if(t.hasAttribute&&t.hasAttribute("data-warmvid")){ev.stopPropagation();warmSheet();return;}
  if(t.hasAttribute&&t.hasAttribute("data-warmsheet")){ev.stopPropagation();warmSheet();return;}
  if(t.classList&&t.classList.contains("lrow")){
    if(LOGGED)return;   /* a logged session is in the book (v26.1) */
    if(t.hasAttribute("data-wu")){W.wu=!W.wu;render();return;}
    tick(+t.getAttribute("data-r"), +t.getAttribute("data-si"));return;
  }
},true);

function paintRound(r){
  var card=document.querySelector('.rnd[data-r="'+r+'"]'); if(!card)return;
  var n=roundDoneN(r), tot=roundSlots(r);
  card.classList.toggle("alldone", tot>0&&n>=tot);
  var cnt=card.querySelector(".acount"); if(cnt)cnt.textContent=n+" of "+tot;
  var ring=card.querySelectorAll(".miniring circle")[1];
  if(ring){var C=2*Math.PI*13; ring.setAttribute("stroke-dashoffset",(C*(1-(tot?n/tot:0))).toFixed(1));}
  var mr=card.querySelector(".mring"); if(mr) mr.setAttribute("aria-label",(tot>0&&n>=tot?"Untick":"Tick")+" every set in round "+(r+1));
}
function paintRow(r,si){var row=document.querySelector('.rnd[data-r="'+r+'"] .lrow[data-si="'+si+'"]');
  if(row){var on=cellOn(r,si);row.classList.toggle("checked",on);row.setAttribute("aria-pressed",String(on));}}
function tick(r,si){if(LOGGED)return;wakeOn();
  var was=roundsDoneN(), k=rkey(r,si);
  var c0=C(r,si);
  if(W.done[k])delete W.done[k]; else W.done[k]={exId:c0.exId,reps:c0.reps,w:c0.w,ts:Date.now()};
  paintRow(r,si);
  paintRound(r);
  afterTick(r,was);
}
function tickRound(r){if(LOGGED)return;wakeOn();
  var was=roundsDoneN(), full=roundComplete(r), t=Date.now();
  for(var i=0;i<W.order.length;i++){if(!slotIn(r,i))continue;var k=rkey(r,i);
    if(full) delete W.done[k];
    else if(!W.done[k]){var c0=C(r,i);W.done[k]={exId:c0.exId,reps:c0.reps,w:c0.w,ts:t};}
    paintRow(r,i);}
  paintRound(r);
  afterTick(r,was);
}
function afterTick(r,was){
  var now=roundsDoneN();
  if(now>was){ persist(); syncNow(); }
  if(now<was) restStop();
  if(now>was&&now<W.rN){
    var nxt=Math.min(r+1,W.rN-1);
    var a=document.querySelector('.rnd[data-r="'+r+'"]'), b=document.querySelector('.rnd[data-r="'+nxt+'"]');
    if(a)a.open=false; if(b)b.open=true;
    OPEN[r]=false; OPEN[nxt]=true;
    restStart(REST);
  } else if(now>was&&now>=W.rN){
    [].forEach.call(document.querySelectorAll(".rnd"),function(d){d.open=false;OPEN[+d.getAttribute("data-r")]=false;});
    restStop();
    var fb=document.getElementById("fullbtn"); if(fb&&fb.scrollIntoView) fb.scrollIntoView({behavior:"smooth",block:"center"});
  }
  paintMeta();
  persist();
}
if(V26_PAGE){
  var RLEFT=0;
  var restLabel=function(){var r=firstOpenRound();if(roundComplete(r))return "";
    for(var i=0;i<W.order.length;i++)if(slotIn(r,i)&&!cellOn(r,i))return "Round "+(r+1)+" \u00b7 "+C(r,i).name;return "";};
  var restPaint=function(){var b=document.getElementById("restbar");
    if(!b.querySelector(".rbb")) b.innerHTML='<div class="rbl"><span class="rbk"></span><span class="rt num" id="restt"></span><span class="rbn"></span></div>'+
      '<div class="rbb"><button data-rest="-15" aria-label="Fifteen seconds less">\u221215</button><button data-rest="15" aria-label="Fifteen seconds more">+15</button><button data-rest="skip">Skip</button></div>';
    b.className="restbar on rb2"+(RLEFT<0?" over":"");
    b.querySelector(".rbk").textContent=RLEFT<0?"Rest over":"Rest";
    b.querySelector(".rt").textContent=(RLEFT<0?"+":"")+mmss(Math.abs(RLEFT));
    b.querySelector(".rbn").textContent=restLabel();};
  restStart=function(sec){if(_rt)clearInterval(_rt);RLEFT=sec;restPaint();
    _rt=setInterval(function(){RLEFT--;if(RLEFT<-600){restStop();return;}restPaint();},1000);};
  restStop=function(){if(_rt){clearInterval(_rt);_rt=null;}var b=document.getElementById("restbar");b.className="restbar";b.innerHTML="";};
}
function lastRoundWorked(){var r=W.rN-1;for(var i=0;i<W.order.length;i++)if(W.done[rkey(r,i)])return true;return false;}
function paintCtl(){var a=document.getElementById("addround"),m=document.getElementById("rmround");
  if(a)a.disabled=LOGGED||W.rN>=RX_CEIL;
  if(m){m.disabled=LOGGED||W.rN<=RX_FLOOR||lastRoundWorked();
    m.setAttribute("aria-label",W.rN<=RX_FLOOR?"Remove a round (one round is the floor)":(lastRoundWorked()?"Remove a round (the last round has ticks)":"Remove a round"));}}
document.getElementById("addround").addEventListener("click",function(){
  if(LOGGED||W.rN>=RX_CEIL)return;
  var old=W.rN; W.order.forEach(function(o){if(o.upTo!=null&&o.upTo>=old)o.upTo=old+1;});
  W.cells[old]=W.cells[old-1].map(function(c){var n=cloneCell(c);return n;});
  W.rN++; render();
});
document.getElementById("rmround").addEventListener("click",function(){
  if(LOGGED||W.rN<=RX_FLOOR||lastRoundWorked())return;
  W.rN--; W.cells.length=W.rN; W.order.forEach(function(o){if(o.upTo!=null&&o.upTo>W.rN)o.upTo=W.rN;});
  render();
});

var DRAG=null, DRAG_EAT_CLICK=0;
function dragArm(ev,row,listSel,itemSel,onDrop){
  if(ev.button!=null&&ev.button!==0)return;
  var sx=ev.clientX, sy=ev.clientY;
  var st={row:row,list:row.closest(listSel),itemSel:itemSel,onDrop:onDrop,live:false,id:ev.pointerId,sy:sy,
    t:setTimeout(function(){st.live=true;row.classList.add("dragging");document.body.classList.add("dragmode");
      if(navigator.vibrate)try{navigator.vibrate(10);}catch(e){}},300)};
  st.sx=sx; DRAG=st;
}
function dragMove(ev){var d=DRAG;if(!d)return;
  if(!d.live){if(Math.abs(ev.clientY-d.sy)>8||Math.abs(ev.clientX-d.sx)>8){clearTimeout(d.t);DRAG=null;}return;}
  ev.preventDefault();
  var items=[].slice.call(d.list.querySelectorAll(d.itemSel)), y=ev.clientY;
  for(var i=0;i<items.length;i++){var it=items[i];if(it===d.row)continue;var b=it.getBoundingClientRect(),mid=b.top+b.height/2;
    var rb=d.row.getBoundingClientRect();
    if(y<mid&&rb.top>b.top){it.parentNode.insertBefore(d.row,it);break;}
    if(y>mid&&rb.top<b.top){it.parentNode.insertBefore(d.row,it.nextSibling);break;}}
}
function dragEnd(){var d=DRAG;if(!d)return;clearTimeout(d.t);DRAG=null;
  if(!d.live)return;
  d.row.classList.remove("dragging");document.body.classList.remove("dragmode");DRAG_EAT_CLICK=Date.now();
  d.onDrop([].slice.call(d.list.querySelectorAll(d.itemSel)),d.row);
}
document.addEventListener("pointermove",dragMove,{passive:false});
document.addEventListener("touchmove",function(ev){if(DRAG&&DRAG.live)ev.preventDefault();},{passive:false});
document.addEventListener("pointerup",dragEnd);
document.addEventListener("pointercancel",function(){if(DRAG&&DRAG.live)dragEnd();else if(DRAG){clearTimeout(DRAG.t);DRAG=null;}});
document.addEventListener("contextmenu",function(ev){if(DRAG)ev.preventDefault();});
document.addEventListener("click",function(ev){if(Date.now()-DRAG_EAT_CLICK<250){ev.stopPropagation();ev.preventDefault();}},true);
function reorderMove(from,beforeSi,afterSi){
  var n=W.order.length, arr=[];for(var i=0;i<n;i++)if(i!==from)arr.push(i);
  var at=(beforeSi!=null)?arr.indexOf(beforeSi):arr.indexOf(afterSi)+1; if(at<0)return;
  arr.splice(at,0,from);
  var inv={};arr.forEach(function(old,nw){inv[old]=nw;});
  W.order=arr.map(function(i){return W.order[i];});
  W.cells=W.cells.map(function(row){return arr.map(function(i){return row[i];});});
  var nd={};Object.keys(W.done).forEach(function(k){var p=k.split(":");nd[rkey(+p[0],inv[+p[1]])]=W.done[k];});W.done=nd;
  render(); syncNow();
}
document.addEventListener("pointerdown",function(ev){
  var pr=ev.target.closest("#sheet .optrow[data-pe]");
  if(pr&&PE){dragArm(ev,pr,"#sheet",".optrow[data-pe]",function(items){
    var nw=items.map(function(it){return PE[+it.getAttribute("data-pe")];});PE=nw;planSheet();});return;}
  if(ev.target.closest("button")||LOGGED)return;
  var row=ev.target.closest(".rnd .lrow[data-si]");
  if(row){dragArm(ev,row,".abody",".lrow[data-si]",function(items,moved){
    var vis=items.map(function(it){return +it.getAttribute("data-si");}), from=+moved.getAttribute("data-si"), pos=vis.indexOf(from);
    if(vis.length<2){render();return;}
    reorderMove(from,pos<vis.length-1?vis[pos+1]:null,pos>0?vis[pos-1]:null);});}
},true);

function numSheet(r,si,what){
  var o=C(r,si), isLoad=(what==="load");
  if(W.done[rkey(r,si)]){openSheet('<h3>'+esc(o.name)+'</h3><div class="ssub">This set is ticked, so it is locked at '+(o.w>0?o.w+' lb x ':'')+o.reps+'. Untick it to change it.</div><button class="sheet-cta ghost" onclick="closeSheet()">OK</button>');return;}
  if(isLoad&&o.band){openSheet('<h3>'+esc(o.name)+'</h3><div class="ssub">Band movements progress by a heavier band or a shorter anchor, not by pounds.</div><button class="sheet-cta ghost" onclick="closeSheet()">Done</button>');return;}
  var val=function(){return isLoad?(o.w>0?o.w:"BW"):o.reps;};
  var later=0;for(var q=r+1;q<W.rN;q++)if(slotIn(q,si)&&!W.done[rkey(q,si)])later++;
  openSheet('<h3>'+esc(o.name)+'</h3><div class="ssub">Round '+(r+1)+(later?' and the '+later+' round'+(later===1?'':'s')+' after it':'')+'. '+(isLoad?"Pounds per dumbbell":"Reps"+(o.lo?", range "+o.lo+" to "+o.hi:""))+'</div>'+
    '<div class="nedit"><button data-d="-1" aria-label="Less">&minus;</button>'+
    '<span class="nv" id="nv">'+val()+'<span class="nu">'+(isLoad?(o.w>0?"lb":""):(o.unit==="s"?"s":"reps"))+'</span></span>'+
    '<button data-d="1" aria-label="More">+</button></div>'+
    '<button class="sheet-cta" onclick="closeSheet()">Done</button>');
  document.getElementById("sheet").addEventListener("click",function(ev){
    var b=ev.target.closest("[data-d]");if(!b)return; var d=+b.getAttribute("data-d");
    var nv=isLoad?stepLoad(o,o.w,d):(d>0?niceNext(o.reps):niceDown(o.reps));
    forward(r,si,function(c){if(isLoad)c.w=nv;else c.reps=nv;});
    var nvEl=document.getElementById("nv"); nvEl.firstChild.nodeValue=val();
    if(isLoad) nvEl.lastChild.textContent=o.w>0?"lb":""; render();
  });
}
function swapSheet(r,si){
  var o=C(r,si); if(!W.alts[o.exId]){var ax=altsFor([o.exId]);W.alts[o.exId]=ax[o.exId];}

function stepW(ladder,w,dir){var L=ladder==="kb"?KB_LADDER:(ladder==="db"?DB_LADDER:null);if(!L)return w;
  if(dir>0){for(var i=0;i<L.length;i++)if(L[i]>w)return L[i];return L[L.length-1];}
  for(var j=L.length-1;j>=0;j--)if(L[j]<w)return L[j];return 0;}   /* 0 = bodyweight, as stepLoad (v26.1) */
function planDoc(S){S.progs=S.progs||{};var key=progKey(S);var P=S.progs[key];
  if(!P){P={v:2,key:key,name:"Full body, rotating emphasis",rN:PROG_RN,restSec:REST,rotate:["push","pull","legs"],days:{}};S.progs[key]=P;}
  P.days=P.days||{}; if(!P.days[FOCUS]||!P.days[FOCUS].length) P.days[FOCUS]=JSON.parse(JSON.stringify(BASE));

function advancePlan(entries){
  var S=loadS(); if(!S) return []; var P=planDoc(S), rows=P.days[FOCUS], out=[];
  servedRows(rows,WK).forEach(function(m){
    var id=shownId(m,WK), e=null; entries.forEach(function(x){if(x.exerciseId===id)e=x;}); if(!e) return;
    var sets=(e.sets||[]).filter(function(t){return t.completed!==false;}); if(!sets.length) return;
    var l=libOf(id), lad=ladderE(l.e), rg=rangeOf(m,id), lo=rg[0], hi=rg[1];
    var clamp=function(r){return Math.max(lo,Math.min(hi,r));};
    var w=Math.max.apply(null,sets.map(function(t){return +t.weightLb||0;}));
    var r=Math.min.apply(null,sets.map(function(t){return +t.reps||0;}));
    m.t=m.t||{}; var cur=m.t[id]||{}; var nx={lb:w>0?w:(cur.lb!=null?cur.lb:null),reps:niceIn(clamp(r),lo,hi),top:0,at:SLOT};
    if(FEEL.twinge||FEEL.feel==="hard"){ nx.top=cur.top||0; }
    else if(r>=hi){ var top=(cur.top||0)+1;
      if(top>=2||FEEL.feel==="easy"){ if(lad&&w>0){nx.lb=stepW(lad,w,1);nx.reps=lo;}
        else if(l.e==="band"){nx.bandUp=true;nx.reps=lo;} else nx.reps=hi; }
      else {nx.reps=hi;nx.top=top;} }
    else nx.reps=niceIn(niceNext(r),lo,hi);
    m.t[id]=nx;
    var why=(FEEL.twinge?"held: twinge":(FEEL.feel==="hard"?"held: hard":lo===hi?"same":(nx.lb!==cur.lb&&cur.lb!=null&&nx.lb>cur.lb?"load up":
      (nx.bandUp?"heavier band":(nx.top?"repeat":(nx.reps>r?"more reps":"same"))))));
    out.push(V26_PAGE?{n:l.n,lb:nx.lb,reps:nx.reps,s:l.u==="s",b:l.e==="band",why:why}:l.n+" "+(nx.lb>0?nx.lb+" lb x ":"")+nx.reps+(l.u==="s"?"s":""));
  });
  P.days[FOCUS]=rows; savePlan(S); return out;
}

    PE.map(function(m,i){var id=peId(m),w=waiting(m,WK),sub=w?' · from week '+(m.fromWeek+1):
        (WK<OHW&&id==="inclinepress"&&shownId(m,OHW)!=="inclinepress"?' · stands in for '+esc(libOf(m.exId).n)+' until week '+(OHW+1):'');
      return '<button class="optrow" data-pe="'+i+'"><span class="on2">'+(i+1)+'. '+esc(libOf(id).n)+
      '<div class="oc">'+esc(peLine(m))+sub+'</div></span></button>';}).join("")+
    '<button class="sheet-cta ghost" id="peadd">+ Add a movement</button>'+
    '<button class="sheet-cta ghost" id="pecopy">Copy today&rsquo;s session into the plan</button>'+
    '<button class="sheet-cta" id="pesave">Save plan</button>'+
    '<button class="sheet-cta ghost" id="pecancel">Cancel</button>');
  var s=document.getElementById("sheet");
  s.addEventListener("click",function(ev){var b=ev.target.closest("button");if(!b)return;
    if(b.hasAttribute("data-pe")){peRow(+b.getAttribute("data-pe"));return;}
    if(b.id==="peadd"){peAdd();return;}
    if(b.id==="pecopy"){PE=copyToday();planSheet();return;}
    if(b.id==="pecancel"){PE=null;closeSheet();return;}
    if(b.id==="pesave"){peSave();return;}});
}
function peRow(i){
  var m=PE[i], id=peId(m), l=libOf(id), lad=ladderE(l.e), rg=rangeOf(m,id);
  m.lo=rg[0]; m.hi=rg[1]; m.t=m.t||{}; var t=m.t[id]=m.t[id]||{};
  var stp=function(k,label,val){return '<div class="rsrow"><span class="rsl">'+label+'</span><div class="stp"><button data-k="'+k+'" data-d="-1">&minus;</button><span class="val num" id="pv-'+k+'">'+val+'</span><button data-k="'+k+'" data-d="1">+</button></div></div>';};
  openSheet('<h3>'+esc(l.n)+'</h3><div class="ssub">Saved plan, '+esc(FOCUS)+' day</div>'+
    (lad?stp("lb","Load per dumbbell (lb)",t.lb!=null?t.lb:0):'')+
    stp("lo","Rep range, low",m.lo)+stp("hi","Rep range, high",m.hi)+
    stp("nx","Next session reps",t.reps!=null?t.reps:m.lo)+
    stp("up","Rounds (0 = every round)",m.upTo||0)+
    '<button class="sheet-cta ghost" id="peswap">Swap for another movement</button>'+
    '<div class="rndctl" style="margin-top:8px"><button id="peup">Move up</button><button id="pedn">Move down</button></div>'+
    '<button class="sheet-cta ghost" id="perm"'+(PE.length<=1?' disabled':'')+'>Remove from the plan</button>'+
    '<button class="sheet-cta" id="peback">Back to the plan</button>');
  var s=document.getElementById("sheet");
  s.addEventListener("click",function(ev){var b=ev.target.closest("button");if(!b)return;
    var k=b.getAttribute("data-k");
    if(k){var d=+b.getAttribute("data-d");
      if(k==="lb")t.lb=stepW(lad,t.lb||0,d);
      if(k==="lo")m.lo=Math.max(1,Math.min(m.hi,d>0?niceNext(m.lo):niceDown(m.lo)));
      if(k==="hi")m.hi=Math.max(m.lo,d>0?niceNext(m.hi):niceDown(m.hi));
      if(k==="nx"){var c0=(t.reps!=null?t.reps:m.lo);t.reps=Math.max(m.lo,Math.min(m.hi,d>0?niceNext(c0):niceDown(c0)));}
      if(k==="up"){var u=(m.upTo||0)+d;u=Math.max(0,Math.min(PLAN_RMAX,u));m.upTo=u||undefined;if(!u)delete m.upTo;}
      m.reps=m.lo; t.top=0;
      var v={lb:t.lb,lo:m.lo,hi:m.hi,nx:t.reps,up:m.upTo||0}[k]; var el=document.getElementById("pv-"+k); if(el)el.textContent=v; return;}
    if(b.id==="peswap"){peSwap(i);return;}
    if(b.id==="peup"&&i>0){PE.splice(i-1,0,PE.splice(i,1)[0]);planSheet();return;}
    if(b.id==="pedn"&&i<PE.length-1){PE.splice(i+1,0,PE.splice(i,1)[0]);planSheet();return;}
    if(b.id==="perm"){if(PE.length<=1)return;PE.splice(i,1);planSheet();return;}
    if(b.id==="peback"){planSheet();return;}});
}
function pickSheet(title,list,cb,skip){
  openSheet('<h3>'+esc(title)+'</h3>'+SEARCHBOX+'<div class="ssub" style="margin-top:14px">'+(list.length&&skip&&list.length<Object.keys(LIBM).length-Object.keys(skip).length?'Comparable, same pattern':'Kit you own')+'</div>'+optRows(list,"data-pk")+
    '<button class="sheet-cta ghost" id="pkback">Back</button>');
  wireSearch(skip||{},cb);
  document.getElementById("sheet").addEventListener("click",function(ev){var b=ev.target.closest("button");if(!b)return;
    if(b.id==="pkback"){planSheet();return;} if(b.hasAttribute("data-pk"))cb(list[+b.getAttribute("data-pk")]);});
}
function peSwap(i){var m=PE[i],id=peId(m),al=altsFor([id])[id]||[],sk={};sk[id]=1;
  pickSheet("Swap "+libOf(id).n,al,function(a){var rg=rangeOf(m,id);PE[i]={exId:a.exId,reps:rg[0],lo:rg[0],hi:rg[1],own:true,upTo:m.upTo,t:{}};if(!PE[i].upTo)delete PE[i].upTo;
    if(m.fromWeek!=null)PE[i].fromWeek=m.fromWeek;   /* a swapped waiting row still waits (v26.1) */
    peRow(i);},sk);}
function peAdd(){var seen={};PE.forEach(function(m){seen[peId(m)]=1;});
  var pool=Object.keys(LIBM).filter(function(k){return !seen[k];}).map(function(k){var l=LIBM[k];return {exId:k,name:l.n,cue:l.c};})
    .sort(function(a,b){return a.name<b.name?-1:1;});
  pickSheet("Add to the plan",pool,function(a){PE.push({exId:a.exId,reps:10,lo:10,hi:12,own:true,upTo:2,t:{}});peRow(PE.length-1);},seen);}
function copyToday(){var rows=canonRows(loadS()), used={};
  var cellOf=function(i){return (W.cells[W.rN-1]&&W.cells[W.rN-1][i])||(W.cells[0]&&W.cells[0][i])||W.order[i];};
  rows.forEach(function(m){if(waiting(m,WK))return;var sid=shownId(m,WK);
    for(var i=0;i<W.order.length;i++){var o=W.order[i];if(used[i]||o.planId!==m.exId)continue;used[i]=1;
      var c=cellOf(i);m.lo=c.lo||o.lo;m.hi=c.hi||o.hi;m.reps=m.lo;
      if(o.upTo)m.upTo=o.upTo;else delete m.upTo;
      if(c.exId===sid){m.t=m.t||{};m.t[sid]={lb:c.w>0?c.w:null,reps:c.reps,top:0,at:SLOT};}
      return;}});
  W.order.forEach(function(o,i){if(used[i]||o.planId||!o.tmp)return;var c=cellOf(i);
    var row={exId:c.exId,reps:c.lo||o.lo,lo:c.lo||o.lo,hi:c.hi||o.hi,own:true,t:{}};if(o.upTo)row.upTo=o.upTo;
    row.t[c.exId]={lb:c.w>0?c.w:null,reps:c.reps,top:0,at:SLOT};rows.push(row);});
  return rows;}
function peSave(){var S=loadS();if(!S){noStore();return;}
  var P=planDoc(S); P.days[FOCUS]=PE;
  if(!savePlan(S)){openSheet('<h3>Not saved</h3><div class="ssub">This device could not save the plan.</div><button class="sheet-cta ghost" onclick="closeSheet()">OK</button>');return;}
  PE=null; closeSheet();
  if(!LOGGED&&!Object.keys(W.done).length){ try{localStorage.removeItem(pkey());}catch(e){} location.reload(); }
  else openSheet('<h3>Plan saved</h3><div class="ssub">Today keeps its numbers. The next '+esc(FOCUS)+' day starts from the new plan.</div><button class="sheet-cta ghost" onclick="closeSheet()">OK</button>');}
function planNext(entries){var out=[];
  servedRows(canonRows(loadS()),WK).forEach(function(m){var id=shownId(m,WK),t=m.t&&m.t[id],e=null;
    (entries||[]).forEach(function(x){if(x.exerciseId===id)e=x;}); if(!e||!t||t.at!==SLOT) return;
    var a=sumLast(e); if(!a) return; var l=libOf(id);
    var why=t.bandUp?"heavier band":((t.lb!=null&&a.w>0&&t.lb>a.w)?"load up":(t.reps>a.r?"more reps":"same"));
    out.push({n:l.n,lb:t.lb,reps:t.reps,s:l.u==="s",b:l.e==="band",why:why});});
  return out;}
function restoreLogged(){var S=loadS(), rec=null;
  ((S&&S.sessions)||[]).forEach(function(x){if(x&&x.slot===SLOTID&&!x.draft&&x.type==="lift")rec=x;});
  if(!rec) return false;
  LOGGED=true; FEEL.feel=rec.feel||null; FEEL.twinge=!!rec.twinge; FEEL.comment=rec.comment||"";
  var floor=/floor$/.test(rec.notes||""), head=V26_PAGE?(floor?"Floor logged":capF(FOCUS)+" logged"):(floor?"Floor logged. One round is a kept day.":(rec.rounds||1)+" round"+(rec.rounds===1?"":"s")+" in the book");
  var nx=planNext(rec.entries);
  markDone(head+(V26_PAGE?summaryHTML(rec.entries||[],rec.durationSec||0,prevSession(rec.date||SLOT),nx,rec.comment,true):
    (nx.length?'<div class="nextup">Next time: '+nx.map(function(x){return esc(x.n);}).join(" · ")+'</div>':'')));
  paintCtl(); return true;}
document.getElementById("planbtn").addEventListener("click",function(){PE=null;planSheet();});
document.getElementById("fullbtn").addEventListener("click",function(){feelSheet("full");});
document.getElementById("floorbtn").addEventListener("click",function(){feelSheet("floor");});
render();
restoreLogged();
</script>
