/* ============ KPI SCORECARD (Round B) ============
   Six measures, scored against a stated target, weekly bullet rows plus a 12-week strip so
   "how am I doing" and "is this week normal for me" answer at once with no period toggle.
   Geometry from Stephen Few's bullet-graph spec: bands are one hue at different intensities,
   the value bar is about a third of the track, the target is a perpendicular line behind it.
   Hue is never the only channel: every row also carries an uppercase status word.
   Thresholds are numeric and printed, so amber means a stated tolerance and not a mood. */
function mondayOfKey(k){var p=k.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()-((d.getDay()+6)%7));return keyOf(d);}
function weekStartKey(back){var d=new Date(NOW);d.setDate(d.getDate()-((DOW+6)%7)-7*(back||0));return keyOf(d);}
function weekDays(back){var s=weekStartKey(back),p=s.split("-"),out=[];var d=new Date(+p[0],+p[1]-1,+p[2]);
  for(var i=0;i<7;i++){out.push(keyOf(d));d.setDate(d.getDate()+1);}return out;}
function plannedMiles(){var mi=0;weekDays(0).forEach(function(k){var pl=planFor(k);if(pl&&pl.type==="run")mi+=(pl.dist||0);});return mi||5;}
/* One week's raw numbers. back=0 is this week. */
function weekMetrics(back){
  var days=weekDays(back),today=TODAY,m={lifts:0,protein:0,moved:0,miles:0,anchor:0,days:0};
  days.forEach(function(k){
    if(k>today)return;
    m.days++;
    if(S.sessions.some(function(s){return s.date===k&&s.type==="lift";}))m.lifts++;
    if(S.protein[k])m.protein++;
    if(isDone(k))m.moved++;
    if(anchorComplete(k))m.anchor++;
    S.sessions.forEach(function(s){if(s.date===k&&(s.type==="run"||s.distanceMi))m.miles+=(s.distanceMi||0);});
  });
  return m;
}
/* Green at or above target, amber inside a stated tolerance below it, red outside. */
function rag(val,target,tol){
  if(target<=0)return "good";
  if(val>=target-0.001)return "good";
  if(val>=target*(1-(tol==null?0.3:tol)))return "amber";
  return "red";
}
function kpiRows(){
  var m=weekMetrics(0),miTarget=plannedMiles(),st=weightStats();
  var rows=[
    {k:"lifts",label:"Strength sessions",val:m.lifts,target:3,unit:"",fmt:function(v){return v;},
     tag:{good:"On track",amber:"One short",red:"Behind"},act:"show('lift')"},
    {k:"moved",label:"Days moved",val:m.moved,target:6,unit:"/ 7",fmt:function(v){return v;},
     tag:{good:"On track",amber:"Slipping",red:"Behind"},act:"show('today')"},
    {k:"protein",label:"Protein days",val:m.protein,target:6,unit:"/ 7",fmt:function(v){return v;},
     tag:{good:"On track",amber:"Slipping",red:"Behind"},act:"show('track')"},
    {k:"miles",label:"Miles run",val:Math.round(m.miles*10)/10,target:miTarget,unit:"mi",fmt:function(v){return v.toFixed(1);},
     tag:{good:"On track",amber:"Short",red:"Behind"},act:"show('cardio')"},
    {k:"anchor",label:"Morning anchor",val:m.anchor,target:6,unit:"/ 7",fmt:function(v){return v;},
     tag:{good:"On track",amber:"Slipping",red:"Behind"},act:"show('today')"}
  ];
  /* Score against the PRO-RATED target, not the full week's. On a Tuesday, one session out of a
     weekly three is ahead of pace, and a scorecard that calls that "behind" every Monday and
     Tuesday trains you to ignore it. The bullet still draws the full-week target so the whole
     ask stays visible; the lighter tick is where you should be today. */
  var elapsed=Math.max(m.days,1);
  rows.forEach(function(r){
    r.pace=r.target*(elapsed/7);
    r.rag=rag(r.val,r.pace,0.3);
    r.status=r.tag[r.rag];
    if(r.rag==="good"&&r.val>=r.target)r.status="Done for the week";
  });
  /* Weight is an OUTCOME, not execution, so it is scored on direction rather than on a count
     and it stays silent until there is enough data to say anything true. */
  var w={k:"weight",label:"Weight trend",outcome:true,act:"weighSheet()"};
  if(!st||st.rate==null){w.rag="none";w.status=st?"No recent data":"Not logged";w.val=null;}
  else if(st.rate<=-0.25){w.rag="good";w.status="Coming off";w.val=st.rate;}
  else if(st.rate<0.15){w.rag="amber";w.status="Holding";w.val=st.rate;}
  else {w.rag="red";w.status="Climbing";w.val=st.rate;}
  rows.push(w);
  return rows;
}
function bulletSVG(val,target,pace){
  /* Everything is expressed as a percentage of target, so preserveAspectRatio="none" lets the
     row stretch to any width with no resize maths. Bar height 5 of 14 is Few's one-third rule. */
  var pct=target>0?Math.min(140,(val/target)*100):0;
  var tx=100/1.4; /* target sits at 100% of target on a 0-140% scale */
  var vx=pct/1.4;
  var px=(pace!=null&&target>0)?Math.min(100,(pace/target)*100/1.4):null;
  var paceTick=(px!=null&&px>1&&px<tx-1)?'<rect x="'+(px-0.4).toFixed(1)+'" y="3" width="0.8" height="8" fill="var(--ink)" opacity=".28"/>':"";
  return '<svg class="bullet" viewBox="0 0 100 14" preserveAspectRatio="none" aria-hidden="true">'+
    '<rect x="0" y="0" width="'+(tx*0.7).toFixed(1)+'" height="14" fill="var(--line-2)"/>'+
    '<rect x="'+(tx*0.7).toFixed(1)+'" y="0" width="'+(tx*0.3).toFixed(1)+'" height="14" fill="var(--line)"/>'+
    '<rect x="'+tx.toFixed(1)+'" y="0" width="'+(100-tx).toFixed(1)+'" height="14" fill="var(--surface-2)"/>'+
    '<rect class="val" x="0" y="4.5" width="'+vx.toFixed(1)+'" height="5" rx="0.5"/>'+
    paceTick+'<rect x="'+(tx-0.6).toFixed(1)+'" y="1.5" width="1.2" height="11" fill="var(--ink)" opacity=".5"/></svg>';
}
/* Twelve weeks, quantized to five levels. Reads as a week per block and a quarter as a whole. */
function kpiStrip(k){
  var blocks="";

    var m=weekMetrics(i),v,t;
    if(k==="lifts"){v=m.lifts;t=3;} else if(k==="moved"){v=m.moved;t=6;}
    else if(k==="protein"){v=m.protein;t=6;} else if(k==="anchor"){v=m.anchor;t=6;}
    else if(k==="miles"){v=m.miles;t=plannedMiles();} else {v=0;t=1;}
    var r=t>0?v/t:0,lvl=(m.days===0)?0:(r>=1?4:r>=0.7?3:r>=0.4?2:r>0?1:0);
    blocks+='<i data-l="'+lvl+'"></i>';
  }

}

/* One bar chart for every weekly series. Tufte's normal-range band becomes a dashed mean line,
   the latest bar is the only accented one, and each bar carries its value so the chart is
   readable without an axis. Empty weeks draw a hairline rather than nothing, so a gap looks
   like a zero instead of a rendering failure. */
function barChart(title,note,vals,labels,fmt,unit){
  if(!vals||vals.length<2)return "";
  fmt=fmt||function(v){return Math.round(v);};
  var mx=Math.max.apply(null,vals)||1;
  var nz=vals.filter(function(v){return v>0;});
  var mean=nz.length?nz.reduce(function(a,v){return a+v;},0)/nz.length:0;
  var H=64;
  var bars=vals.map(function(v,i){
    var hh=v>0?Math.max(6,Math.round(v/mx*H)):2;
    var last=(i===vals.length-1);
    return '<div class="bcol"><span class="bv'+(last?" on":"")+'">'+(v>0?fmt(v):"")+'</span>'+
      '<i class="'+(last?"on":"")+(v>0?"":" zero")+'" style="height:'+hh+'px"></i>'+
      '<span class="bx">'+(labels&&labels[i]!=null?labels[i]:"")+'</span></div>';
  }).join("");
  var meanPct=mx?Math.round((mean/mx)*H):0;
  return '<div class="card"><h3><span>'+title+'</span><span class="t">'+note+'</span></h3>'+
    '<div class="bwrap" style="--bh:'+H+'px">'+(mean>0?'<div class="bmean" style="bottom:'+(meanPct+16)+'px"><span>avg '+fmt(mean)+(unit?" "+unit:"")+'</span></div>':'')+
    '<div class="brow">'+bars+'</div></div></div>';
}
/* ============ VOLUME AND FATIGUE DIAGNOSTICS (Batch 5) ============

function setsByPattern(back){

var vseq=0;

}
function playVid(id,slot){
  var v=vidById(id),host=document.getElementById(slot);if(!v||!host)return;
  var face=host.querySelector(".vface");if(!face)return;
  var f=document.createElement("iframe");
  f.className="vframe";
  f.setAttribute("allow","accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen");
  f.setAttribute("allowfullscreen","");
  f.setAttribute("referrerpolicy","strict-origin-when-cross-origin");

  f.src="https://www.youtube.com/embed/"+id+"?autoplay=1&rel=0&playsinline=1";
  face.replaceWith(f);
}

  var eq=allowedEquip();

  if(!c.length)c=Object.keys(LIB).filter(function(id){return LIB[id].pattern===pat&&used.indexOf(id)<0;});

  return {exId:id,unit:e.unit||"reps",side:!!e.side,bw:!!e.bw,low:low,high:high,weight:w,sets:arr};

/* ============ CAL AI WEEKLY DUMP ============
   Cal AI has no public API and no verified deep link, so nothing here pretends to talk to it.
   What it does is accept a week of nutrition in one paste: either the JSON shape below, or plain
   rows copied from a export, one day per line. Protein against your target sets the green days on
   the scorecard; calories are stored for the trend. A day already logged is overwritten, so
   re-pasting the same week is safe. */
function calaiSheet(){
  var pt=proteinTarget();
  openSheet('<div class="grab"></div><h3>Weekly nutrition dump</h3>'+
    '<div class="ssub">Paste a week from Cal AI. One day per line, or the JSON shape. '+(pt?('Protein target is <b>'+pt.lo+'-'+pt.hi+' g</b>.'):'Log a weigh-in to set your protein target.')+'</div>'+
    '<textarea class="ta" id="cj" style="min-height:150px" placeholder="2026-07-27, 168, 2210&#10;2026-07-26, 141, 1980&#10;&#10;or&#10;{&quot;days&quot;:[{&quot;date&quot;:&quot;2026-07-27&quot;,&quot;proteinG&quot;:168,&quot;calories&quot;:2210}]}"></textarea>'+
    '<div class="anote" style="margin-top:10px">Date, protein in grams, calories. Calories are optional.</div>'+
    '<button class="sheet-cta" onclick="doCalai()">Import the week</button>');
}
function parseCalai(t){
  t=(t||"").trim();if(!t)return [];
  if(t.charAt(0)==="{"||t.charAt(0)==="["){
    var o;try{o=JSON.parse(t)}catch(e){return null;}
    var arr=o.days||o.entries||(Array.isArray(o)?o:[]);
    return arr.map(function(r){
      return {date:r.date,protein:+(r.proteinG!=null?r.proteinG:r.protein),cals:+(r.calories!=null?r.calories:r.cals)||0};
    }).filter(function(r){return r.date&&!isNaN(r.protein);});
  }
  var out=[];
  t.split(/\n+/).forEach(function(line){
    var parts=line.split(/[,\t;]+/).map(function(x){return x.trim();});
    if(parts.length<2)return;
    var dt=parts[0],pr=parseFloat(parts[1]),cl=parts.length>2?parseFloat(parts[2]):0;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(dt)||isNaN(pr))return;
    out.push({date:dt,protein:pr,cals:isNaN(cl)?0:cl});
  });
  return out;
}

   needs nothing but the Health app. Apple's own "Export All Health Data" produces a zip holding

    '<button class="sheet-cta" onclick="doHealthXml()">Read it</button>');
}
/* Parsed with the browser's own XML parser rather than by hand, and with a cap on how much is
   walked, because a multi-year export can carry hundreds of thousands of records. */
function doHealthXml(){
  var t=(document.getElementById("hx")||{}).value||"";
  if(t.indexOf("<HealthData")<0){toast("That does not look like export.xml.",null);return;}
  var doc;try{doc=new DOMParser().parseFromString(t,"text/xml");}catch(e){toast("Could not read that file.",null);return;}
  if(doc.getElementsByTagName("parsererror").length){toast("That file is not complete XML.",null);return;}
  var recs=doc.getElementsByTagName("Record"),stepsBy={},nW=0,nS=0;
  for(var i=0;i<recs.length;i++){
    var r=recs[i],ty=r.getAttribute("type")||"",dt=(r.getAttribute("startDate")||"").slice(0,10),v=parseFloat(r.getAttribute("value"));
    if(!dt||isNaN(v))continue;
    if(ty.indexOf("StepCount")>=0){stepsBy[dt]=(stepsBy[dt]||0)+v;}
    else if(ty.indexOf("BodyMass")>=0){
      var unit=r.getAttribute("unit")||"lb";
      var lb=(unit.indexOf("kg")>=0)?v*2.20462:v;
      S.weigh=S.weigh.filter(function(x){return x.date!==dt;});
      S.weigh.push({date:dt,w:Math.round(lb*10)/10});nW++;
    }
  }
  Object.keys(stepsBy).forEach(function(k){S.steps[k]=Math.round(stepsBy[k]);nS++;});
  var wo=doc.getElementsByTagName("Workout"),nA=0,seen={};
  S.sessions.forEach(function(x){seen[x.id]=true;});
  for(var j=0;j<wo.length;j++){
    var w=wo[j],dt2=(w.getAttribute("startDate")||"").slice(0,10);
    if(!dt2)continue;
    var mins=parseFloat(w.getAttribute("duration"))||0;
    var ty2=(w.getAttribute("workoutActivityType")||"").replace("HKWorkoutActivityType","");
    var dist=parseFloat(w.getAttribute("totalDistance"))||0;
    var id=dt2+"-h"+j;
    if(seen[id])continue;
    var isRun=/Running/i.test(ty2);
    var rec={id:id,date:dt2,type:isRun?"run":"activity",durationSec:Math.round(mins*60),notes:"Apple Health"};
    if(isRun){rec.distanceMi=Math.round(dist*10)/10;if(rec.distanceMi>0&&rec.durationSec)rec.paceSecPerMi=Math.round(rec.durationSec/rec.distanceMi);}
    else rec.activity=ty2||"Workout";
    S.sessions.push(rec);S.done[dt2]=true;nA++;
  }
  S.weigh.sort(function(a,b){return a.date<b.date?-1:1;});
  S.sessions.sort(function(a,b){return a.date<b.date?-1:1;});
  save();closeSheet();refreshCurrent();
  toast("Read "+nS+" days of steps, "+nW+" weigh-ins and "+nA+" workouts.",null);
}

function mondayOf(d){var m=new Date(d);m.setDate(d.getDate()-((d.getDay()+6)%7));m.setHours(0,0,0,0);return m;}
function rnd5(x){return Math.round(x*2)/2;}
/* Run tab: driven by run COUNT + GAPS, not a calendar ramp (mirrors the lift engine). */
function allRuns(){return S.sessions.filter(function(s){return s.type==="run";}).sort(function(a,b){return a.date<b.date?-1:1;});}

/* ============ LEVEL SYSTEM v2 ============
   Rebuilt to the spec at Daily-Tool/research/LEVELING-SPEC-2026-07-28.md, which found the previous
   curve was calibrated for a professional: a symmetric 21-day average settles at mean daily load, so
   four sessions a week parked the score at about 20 forever, and level 10 would have demanded
   roughly eleven hours of running a week. The number could not move, which is the worst property a
   level can have.

   Load is TrainingPeaks' TSS algebra with a MET-based intensity substituted for a power meter,
   hours x 100 x IF^2, where IF is the session's METs over 9.4, the published cost of running a ten
   minute mile. MET regressions come from the 2024 Adult Compendium. That substitution is the one
   genuinely novel move and it is what lets a run, a walk and a lift land on one scale without a
   hand-tuned multiplier per activity.

   The average is ASYMMETRIC: it rises on a 42-day constant and falls on a 120-day one. Detraining
   research puts real VO2max loss near five percent over a fortnight, so a score that fell 28 percent
   in the same fortnight was not measuring the athlete. Falling slowly also means a short lift is
   never punished for being smaller than the running average. */
var REF_MET=9.40,IF_CAP=1.30,DAY_CAP=300;

      return '<button class="rrow" onclick="sessionSheet(\''+r.id+'\')">'+
        '<span class="rdate">'+shortDate(r.date)+'</span>'+
        '<span class="rbar"><i style="width:'+w.toFixed(0)+'%"></i></span>'+
        '<span class="rmi num">'+mi.toFixed(1)+'<small> mi</small></span>'+
        '<span class="rpace num'+(isBest?" best":"")+'">'+(pace||"--")+'</span></button>';
    }).join("");
    h+='<div class="card"><h3><span>Recent runs</span><span class="t">'+(best?("best "+mmss(best)+"/mi"):"last "+Math.min(6,runs.length))+'</span></h3>'+rec+'</div>';}

  var hist=weeklyMiHistory();
  h+=barChart("Weekly miles","last "+hist.length+" weeks &middot; "+(hist.length?hist[hist.length-1].toFixed(1):"0")+" this week",hist,
      hist.map(function(v,i){return i===hist.length-1?"now":"";}),
      function(v){return v.toFixed(1);},"mi");
  h+='<div class="card"><h3>Walk <span class="t">counts as a day</span></h3>'+
    '<div class="anote" style="margin-top:0;padding-top:0;border-top:0">Easy movement on non-run days keeps the base building and costs you no recovery.</div>'+
    '<button class="big-start" style="margin-top:12px" onclick="actSheet(\'walk\')">'+I.run+' Log a walk</button>'+
    '<div style="display:flex;gap:8px;margin-top:8px"><button class="wbtn" style="flex:1" onclick="logWalkQuick(15)">Quick 15</button><button class="wbtn" style="flex:1" onclick="logWalkQuick(30)">Quick 30</button></div></div>';
  h+='<div class="foot">This adapts to how often you actually run, not a fixed calendar plan. Every mile easy - base before speed.</div>';
  h+=libraryHTML("cardio");
  h+=badgeList();
  document.getElementById("v-cardio").innerHTML=h;
}

/* ============ boot ============ */
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
/* Retired as a load-time toast. Backup age is now a row in the freshness card, which is where
   every other "how current is this" signal lives. Kept as a helper for that row. */
function backupAgeDays(){var last=S.profile.lastBackup;return last?daysBetween(last,TODAY):null;}
applyTheme();
/* No gate on first open. The defaults are good enough to train on, and the one thing the app
   genuinely needs from you, a weigh-in, is asked for by the empty state rather than by a form
   standing between you and the app. Setup still lives in Settings for anyone who wants it. */
/* Offline is a service-worker concern; registration is best-effort and silent. */
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js").catch(function(){});}catch(e){}}
if(!S.profile.setup){S.profile.setup=true;S.profile.started=S.profile.started||TODAY;S.profile.programStart=S.profile.programStart||TODAY;save();}
document.addEventListener("visibilitychange",function(){var woOn=document.getElementById("v-workout").classList.contains("on");if(document.hidden){if(woOn)woFreeze();}else{refreshDate();if(woOn)woResume();else if(document.getElementById("v-today").classList.contains("on"))renderToday();}});
renderToday();

</script>
<script src="train-sync-auto.js"></script>
