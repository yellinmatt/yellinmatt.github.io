<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- frame-src is youtube-nocookie only, and img-src deliberately does NOT include i.ytimg.com:
     remote thumbnails would ping Google on every library render. The facades are drawn locally,
     so nothing reaches YouTube until you actually tap play on a specific video. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; frame-src https://www.youtube.com https://www.youtube-nocookie.com; connect-src https://train-sync.yellinmatt.workers.dev; media-src https://train-sync.yellinmatt.workers.dev blob:; form-action 'none'; base-uri 'none'">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Train">
<meta name="theme-color" content="#F7F8FA" id="theme-color">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Train</title>
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#EEF0F3; --raise:#FFFFFF;
  --ink:#0E1116; --sub:#616875; --faint:#767C86; --white:#FFFFFF;
  --line:#E7E9ED; --line-2:#D8DCE2;
  --accent:#FF4E2B; --accent-press:#E63E1E; --accent-tint:#FFE9E3;
  --good:#12A150; --good-tint:#E4F6EC; --amber:#B7791F; --amber-tint:#FBF1DD;
  --dir-up:#0E7C3F; --dir-down:#C2410C; --dir-flat:#5C636E;
  --nav-bg:rgba(245,246,248,.86); --restbar-bg:#14181E; --restbar-ink:#FFFFFF; --on-good:#FFFFFF; --scrim:rgba(16,17,22,.42);
  --shadow:0 1px 2px rgba(16,17,22,.04), 0 3px 12px rgba(16,17,22,.06);
  --shadow-lg:0 12px 44px rgba(16,17,22,.18);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --r-card:16px; --r-btn:14px; --r-field:11px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0D11; --surface:#14181E; --surface-2:#1E242C; --raise:#191E25;
    --ink:#F3F5F8; --sub:#9BA3AF; --faint:#6B7079; --white:#FFFFFF;
    --line:#242A32; --line-2:#30363F;
    --accent:#FF5C3A; --accent-press:#FF7053; --accent-tint:#3A1E17;
    --good:#34D399; --good-tint:#12271E; --amber:#F0C36B; --amber-tint:#2A2213;
  --dir-up:#3DDC97; --dir-down:#FF8A7A; --dir-flat:#A8B0BC;
    --dir-up:#3DDC97; --dir-down:#FF8A7A; --dir-flat:#A8B0BC;
    --nav-bg:rgba(11,13,17,.86); --restbar-bg:#1E242C; --restbar-ink:#FFFFFF; --on-good:#FFFFFF; --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.45);
    --shadow-lg:0 16px 52px rgba(0,0,0,.6);
  }
}
html[data-theme="dark"]{
  --bg:#0B0D11; --surface:#14181E; --surface-2:#1E242C; --raise:#191E25;
  --ink:#F3F5F8; --sub:#9BA3AF; --faint:#6B7079; --white:#FFFFFF;
  --line:#242A32; --line-2:#30363F;
  --accent:#FF5C3A; --accent-press:#FF7053; --accent-tint:#3A1E17;
  --good:#34D399; --good-tint:#12271E; --amber:#F0C36B; --amber-tint:#2A2213;
  --nav-bg:rgba(11,13,17,.86); --restbar-bg:#1E242C; --restbar-ink:#FFFFFF; --on-good:#FFFFFF; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.45);
  --shadow-lg:0 16px 52px rgba(0,0,0,.6);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;overscroll-behavior-y:none;padding-top:env(safe-area-inset-top);min-height:100vh}
button,input,select{font-family:inherit;color:inherit;font-size:17px}
button{touch-action:manipulation;border:0;background:none;cursor:pointer}
input,select{border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:540px;margin:0 auto;padding:0 16px calc(92px + env(safe-area-inset-bottom));position:relative}
.view{display:none}
.view.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
html[data-motion="off"] *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){html:not([data-motion="on"]) *{animation:none!important;transition:none!important}}

  #v-today.on>.head{animation:tRise .42s cubic-bezier(.22,1,.36,1) both}
  #v-today.on>.hero{animation:tRise .46s .05s cubic-bezier(.22,1,.36,1) both}
  #v-today.on>.dots-card{animation:tRise .46s .1s cubic-bezier(.22,1,.36,1) both}
  #v-today.on>.msect{animation:tRise .46s .15s cubic-bezier(.22,1,.36,1) both}
  @keyframes tRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .view.on{animation:vIn .3s cubic-bezier(.22,1,.36,1) both}
  @keyframes vIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  #v-workout.on,#v-run.on{animation:none}
  .dots .dot.done{animation:dStamp .5s cubic-bezier(.34,1.5,.5,1) both}
  .dots .dot:nth-child(1){animation-delay:.18s}.dots .dot:nth-child(2){animation-delay:.22s}
  .dots .dot:nth-child(3){animation-delay:.26s}.dots .dot:nth-child(4){animation-delay:.3s}
  .dots .dot:nth-child(5){animation-delay:.34s}.dots .dot:nth-child(6){animation-delay:.38s}
  .dots .dot:nth-child(7){animation-delay:.42s}
  @keyframes dStamp{0%{opacity:0;transform:scale(.55)}62%{transform:scale(1.13)}100%{opacity:1;transform:none}}
  .dots .dot.today{animation:dRing .55s .4s cubic-bezier(.22,1,.36,1) both}
  @keyframes dRing{from{box-shadow:0 0 0 0 transparent}to{box-shadow:none}}
  .pcbar i{animation:barFill .75s .3s cubic-bezier(.22,1,.36,1) both;transform-origin:left center}
  @keyframes barFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .pcol{animation:tRise .44s cubic-bezier(.22,1,.36,1) both}
  .pcol:nth-child(1){animation-delay:.14s}.pcol:nth-child(2){animation-delay:.19s}.pcol:nth-child(3){animation-delay:.24s}
  .lvlcard .lcnum{transition:color .3s ease}
  .streak.bumped{animation:stPulse .8s .3s cubic-bezier(.34,1.4,.5,1) both}
  @keyframes stPulse{0%{transform:scale(1)}35%{transform:scale(1.12)}100%{transform:scale(1)}}
  .big-start.hasfill::before{content:"";position:absolute;inset:0;border-radius:inherit;
    background:rgba(255,255,255,.17);transform-origin:left center;transform:scaleX(0);
    animation:fillTo .8s .25s cubic-bezier(.22,1,.36,1) forwards;pointer-events:none}
  @keyframes fillTo{to{transform:scaleX(var(--fill,0))}}

  #v-lift.on>*,#v-cardio.on>*,#v-track.on>*{animation:tRise .44s cubic-bezier(.22,1,.36,1) both}
  #v-lift.on>*:nth-child(1),#v-cardio.on>*:nth-child(1),#v-track.on>*:nth-child(1){animation-delay:0s}
  #v-lift.on>*:nth-child(2),#v-cardio.on>*:nth-child(2),#v-track.on>*:nth-child(2){animation-delay:.05s}
  #v-lift.on>*:nth-child(3),#v-cardio.on>*:nth-child(3),#v-track.on>*:nth-child(3){animation-delay:.1s}
  #v-lift.on>*:nth-child(4),#v-cardio.on>*:nth-child(4),#v-track.on>*:nth-child(4){animation-delay:.14s}
  #v-lift.on>*:nth-child(n+5),#v-cardio.on>*:nth-child(n+5),#v-track.on>*:nth-child(n+5){animation-delay:.17s}

  .dbody.anim>*,.abody.anim>*{animation:tRise .34s cubic-bezier(.22,1,.36,1) both}
  .dbody.anim>*:nth-child(2),.abody.anim>*:nth-child(2){animation-delay:.045s}
  .dbody.anim>*:nth-child(3),.abody.anim>*:nth-child(3){animation-delay:.09s}
  .dbody.anim>*:nth-child(n+4),.abody.anim>*:nth-child(n+4){animation-delay:.12s}
  .anim .m2b i,.anim .kstrip i,.anim .pvbar i{animation:barFill .6s .12s cubic-bezier(.22,1,.36,1) both;transform-origin:left center}
  #v-cardio.on .cwbar i{animation:barFill .7s .22s cubic-bezier(.22,1,.36,1) both;transform-origin:left center}
  #v-cardio.on .cwbar u{animation:tickIn .4s .55s ease both}
  @keyframes tickIn{from{opacity:0}to{opacity:.42}}

.big-start{position:relative;overflow:hidden}
.big-start.hasfill>*{position:relative;z-index:1}

.head{display:flex;align-items:center;justify-content:space-between;padding:16px 2px 12px;gap:10px}
.head .date{font-size:13px;font-weight:600;color:var(--sub)}
.head .title{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:1px}
.head>div:first-child{min-width:0;flex:1}
.head .title{font-size:clamp(19px,5.4vw,28px)}
.head .tools{flex:none}
.head .tools{display:flex;align-items:center;gap:8px}
.iconbtn{width:44px;height:44px;border-radius:11px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:var(--sub)}
.iconbtn:active{background:var(--surface-2)}
.iconbtn,.calnav,.hero .chg{position:relative}
.iconbtn::after,.calnav::after,.hero .chg::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:100%;height:100%;min-width:44px;min-height:44px}
.sesday{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.sdl{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.sdrow{display:flex;align-items:center;gap:11px;width:100%;min-height:44px;padding:10px 12px;text-align:left;
  background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.sdrow .sdi{display:flex;width:30px;height:30px;flex:none;border-radius:9px;background:var(--surface);color:var(--accent);align-items:center;justify-content:center}
.sdrow .sdi svg{width:15px;height:15px}
.sdrow .sdt{flex:1;min-width:0}
.sdrow .sdt b{display:block;font-size:13px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sdrow .sdt span{display:block;font-size:13px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sdrow .sda{flex:none;color:var(--faint);display:flex}
.sesday.gd .sdrow{border-color:var(--good);background:var(--good-tint)}

.sorerow{display:flex;align-items:center;gap:9px;width:100%;min-height:44px;margin-top:16px;padding-top:13px;
  border-top:1px solid var(--line);text-align:left;font-size:13px;color:var(--faint);background:none}
.sorerow .sdot{width:7px;height:7px;border-radius:50%;background:var(--line-2);flex:none}
.sorerow .stx{flex:1;min-width:0;line-height:1.35}
.sorerow .stx b{font-weight:700}
.sorerow .sarr{flex:none;display:flex;color:var(--faint)}
.sorerow .sarr svg{width:14px;height:14px}
.sorerow.on{color:var(--amber)}
.sorerow.on .sdot{background:var(--amber)}
.sorerow.lapsed{color:var(--sub)}
.sorerow.lapsed .sdot{background:var(--good)}
.sorebody{margin:10px 0 0;padding-left:16px}
.sorebody .sgrp{padding:0 0 14px}
.sorebody .sgrp:last-child{padding-bottom:0}
.sorebody .srw{display:flex;align-items:baseline;justify-content:space-between;gap:14px}
.sorebody .srk{font-size:15px;color:var(--ink);font-weight:600}
.sorebody .srv{font-size:13px;color:var(--amber);font-variant-numeric:tabular-nums;flex:none}
.sorebody .srwhy{font-size:13px;color:var(--sub);line-height:1.45;margin:3px 0 0}
.soreclip{display:flex;align-items:center;gap:11px;width:100%;min-height:44px;margin:12px 0 0;
  padding:10px 12px;border-radius:11px;background:var(--surface-2);text-align:left}
.soreclip .sci{width:26px;height:26px;flex:none;border-radius:50%;background:var(--surface);color:var(--ink);
  display:flex;align-items:center;justify-content:center}
.soreclip .sci svg{width:13px;height:13px}
.soreclip .scb{flex:1 1 0;min-width:0}
.soreclip .scn{display:block;font-size:15px;font-weight:600;color:var(--ink);line-height:1.3}
.soreclip .scc{display:block;font-size:13px;color:var(--sub);margin-top:2px}
.opt.sorepick.sel .oi{background:var(--accent);color:var(--white)}

.mrow2{display:grid;grid-template-columns:1fr auto;grid-template-areas:"n v" "b b" "w w";gap:2px 10px;
  padding:12px 0;min-height:44px;text-align:left}
.mrow2 .m2n{grid-area:n;font-size:15px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow2 .m2v{grid-area:v;font-size:15px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.mrow2 .m2v small{font-size:13px;font-weight:600;color:var(--faint)}
.mrow2 .m2b{grid-area:b;display:block;height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin:5px 0 3px}
.mrow2 .m2b i{display:block;height:100%;border-radius:2px;background:var(--sub)}
.mrow2 .m2w{grid-area:w;font-size:13px;font-weight:700;color:var(--faint)}
.mrow2[data-dir="up"] .m2b i{background:var(--good)}
.mrow2[data-dir="up"] .m2w{color:var(--good)}
.mrow2[data-dir="down"] .m2b i{background:var(--line-2)}
.mrow2[data-dir="down"] .m2w{color:var(--sub)}

.cweek{margin:14px 0 2px}
.cwl{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.cwpair{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr))}
.cwpair>.cwc:only-child{padding-right:0;padding-left:0;border-left:0}
.cwc{display:block;width:100%;text-align:left;background:none;border:0;padding:0}
.cwpair .cwc:first-child{padding-right:14px}
.cwpair .cwc:last-child{padding-left:14px;border-left:1px solid var(--line)}
.cwk{display:block;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.cwv{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em;color:var(--ink);margin:3px 0 7px;line-height:1.05}
.cwv small{font-size:13px;font-weight:700;color:var(--sub);margin-left:3px}
.cwbar{position:relative;display:block;height:6px;border-radius:3px;background:var(--surface-2);overflow:visible}
.cwbar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}
.cwbar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.42;border-radius:1px;transform:translateX(-1px)}
.cww{display:block;font-size:13px;font-weight:600;color:var(--sub);margin-top:7px;line-height:1.3}
.cww[data-dir="up"]{color:var(--good)}
.cww[data-dir="down"]{color:var(--sub)}
.cwsub{display:block;font-size:13px;color:var(--faint);margin-top:2px}

.libgrid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:2px 0 14px}
.libtile2{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:80px;padding:13px 14px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);text-align:left}
.libtile2.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.libtile2 .ltn{font-size:15px;font-weight:700;color:var(--ink)}
.libtile2 .ltd{font-size:13px;color:var(--faint);line-height:1.3}
.libtile2 .ltc{margin-top:auto;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--sub)}
.libtile2 .ltc.gd{color:var(--good)}
.vgrid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:520px){.vgrid{grid-template-columns:1fr 1fr}}

.tapfix{position:relative}
.tapfix::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:100%;height:100%;min-width:44px;min-height:44px}
.iconbtn svg{width:19px;height:19px}
.streak{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 13px 8px 11px;box-shadow:var(--shadow)}
.streak svg{width:16px;height:16px;color:var(--accent)}
.streak.zero svg{color:var(--faint)}
.streak b{font-size:15px;font-weight:800}.streak span{font-size:13px;font-weight:600;color:var(--sub)}

.hero{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);padding:20px;margin-bottom:12px;border:1px solid var(--line);position:relative}
.hero .chg{position:absolute;top:14px;right:14px;min-height:44px;padding:0 12px;gap:6px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--sub)}
.hero .chg span{font-size:13px;font-weight:700}
.hero .chg svg{width:17px;height:17px}
.lbl{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.hero h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:8px 0 5px;padding-right:92px}
.hero .meta{font-size:15px;color:var(--sub);font-weight:500}.hero .meta b{color:var(--ink);font-weight:600}
.big-start{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;height:56px;margin-top:18px;background:var(--accent);color:var(--white);border-radius:var(--r-btn);font-size:20px;font-weight:700;box-shadow:0 6px 18px rgba(255,78,43,.26)}
.big-start:active{background:var(--accent-press);transform:translateY(1px)}
.big-start svg{width:20px;height:20px}
.big-start.ghost{background:var(--surface-2);color:var(--ink);box-shadow:none}
.done-pill{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;margin-top:18px;background:var(--good-tint);color:var(--good);border-radius:var(--r-btn);font-size:17px;font-weight:700}
.done-pill svg{width:18px;height:18px}

.miniring{width:34px;height:34px;flex:none}
.miniring svg{transform:rotate(-90deg)}

.dots-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:15px 12px;margin-bottom:12px}
.dots{display:flex;justify-content:space-between}
.dot{display:flex;flex-direction:column;align-items:center;gap:7px;flex:1}
.dot .dw{font-size:13px;font-weight:700;color:var(--faint)}
.dot .di{width:30px;height:30px;border-radius:50%;background:var(--surface-2);color:var(--faint);display:flex;align-items:center;justify-content:center}
.dot .di svg{width:15px;height:15px}
.dot.done .di{background:var(--accent);color:var(--white)}
.dot.today .di{background:var(--surface);border:2px solid var(--accent);color:var(--accent)}
.dot.today.done .di{background:var(--accent);border-color:var(--accent);color:var(--white)}
.dot.today .dw{color:var(--accent)}
.dot.rest .di{background:transparent;border:1px dashed var(--line-2)}
.dot.ahead .di{opacity:.72}  /* a DOT, not words: opacity is fine here and states.py allows it */
.dot.missed .di{opacity:1;background:none;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--line-2)}
.dot{position:relative}
.dot::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:44px;height:44px;border-radius:50%}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:12px}
.card h3,.trend h3{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 .t,.trend h3 .t{font-size:13px;font-weight:600;color:var(--sub);text-transform:none;letter-spacing:0}
.card h3 .t b{color:var(--accent);font-weight:800}

details.dcard[open]>.dbody{animation:dopen .26s cubic-bezier(.22,1,.36,1)}
details.more[open]>.moreb{animation:dopen .26s cubic-bezier(.22,1,.36,1)}
details.hanchor[open]>.abody{animation:dopen .26s cubic-bezier(.22,1,.36,1)}
@keyframes dopen{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  details.hanchor.closing>.abody{animation:aFoldOut .42s cubic-bezier(.4,0,.6,1) both;overflow:hidden}
  @keyframes aFoldOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-10px) scaleY(.93);transform-origin:top}}
  details.hanchor.closing .abody .arow{animation:aRowOut .28s cubic-bezier(.4,0,.6,1) both}
  details.hanchor.closing .abody .arow:nth-child(1){animation-delay:.1s}
  details.hanchor.closing .abody .arow:nth-child(2){animation-delay:.075s}
  details.hanchor.closing .abody .arow:nth-child(3){animation-delay:.05s}
  details.hanchor.closing .abody .arow:nth-child(4){animation-delay:.025s}
  details.hanchor.closing .abody .arow:nth-child(5){animation-delay:0s}
  @keyframes aRowOut{from{opacity:1;transform:none}to{opacity:0;transform:translateX(-7px)}}
  details.hanchor.closing>summary svg{transform:rotate(0)}
  details.hanchor.closing>summary .acount{display:inline;opacity:1;transform:none;transition-delay:.2s}


  details.hanchor>.abody{overflow:hidden}
  details.hanchor[open]>.abody{animation:aFold .34s cubic-bezier(.22,1,.36,1) both}
  @keyframes aFold{from{opacity:0;transform:translateY(-8px) scaleY(.96);transform-origin:top}to{opacity:1;transform:none}}
  details.hanchor[open] .abody .arow{animation:aRow .34s cubic-bezier(.22,1,.36,1) both}
  details.hanchor[open] .abody .arow:nth-child(1){animation-delay:.06s}
  details.hanchor[open] .abody .arow:nth-child(2){animation-delay:.11s}
  details.hanchor[open] .abody .arow:nth-child(3){animation-delay:.16s}
  details.hanchor[open] .abody .arow:nth-child(4){animation-delay:.21s}
  details.hanchor[open] .abody .arow:nth-child(5){animation-delay:.26s}
  @keyframes aRow{from{opacity:0;transform:translateX(-9px)}to{opacity:1;transform:none}}
  details.hanchor[open] .abody .avid{animation:aFold .38s .02s cubic-bezier(.22,1,.36,1) both}
  .hanchor>summary svg{transition:transform .3s cubic-bezier(.22,1,.36,1)}
  .hanchor[open]>summary svg{transform:rotate(180deg)}
  .hanchor .acount{transition:opacity .22s ease,transform .22s ease}
  .hanchor[open]>summary .acount{display:inline;opacity:0;transform:translateX(8px);pointer-events:none}
  .arow.checked .an{animation:aTick .42s cubic-bezier(.34,1.4,.5,1) both}
  @keyframes aTick{0%{transform:translateX(0)}40%{transform:translateX(4px)}100%{transform:translateX(0)}}

.woprog .wpd i{transition:width .5s cubic-bezier(.22,1,.36,1)}
.miniring circle:last-child{transition:stroke-dashoffset .5s cubic-bezier(.22,1,.36,1)}
.runsegs i{transition:background .3s ease}

.lvhero{display:flex;align-items:center;gap:16px;margin:2px 0 14px}
.lvbig{font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1}
.lvhero .lvmeta{flex:1;min-width:0}
.lvhero .lvtierrow{display:flex;align-items:center;gap:8px}
.lvhero .lvword{font-size:13px;font-weight:700;color:var(--sub)}
.lvpipbar{display:flex;gap:3px;margin:8px 0 6px}
.lvpipbar i{flex:1;height:6px;border-radius:3px;background:var(--surface-2);display:block;transition:background .4s ease}
.lvpipbar i.on{background:var(--accent)}
.lvdtxt{font-size:13px;color:var(--sub);line-height:1.4}
details[open] .lvbig{animation:c9bump .4s cubic-bezier(.22,1,.36,1)}
.stepin{animation:stepin .3s cubic-bezier(.22,1,.36,1)}
@keyframes stepin{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
.wpulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:1px;animation:wpulse 1.6s ease infinite}
@keyframes wpulse{0%{box-shadow:0 0 0 0 rgba(255,92,58,.5)}70%{box-shadow:0 0 0 9px rgba(255,92,58,0)}100%{box-shadow:0 0 0 0 rgba(255,92,58,0)}}
.runsegs i.cur{animation:segin .4s ease}
@keyframes segin{from{transform:scaleX(.4);opacity:.4}to{transform:none;opacity:1}}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>

<body>
<div class="app">
  <section class="view on" id="v-today"></section>
  <section class="view" id="v-workout">
    <div class="ptop">
      <button class="back" onclick="closeWorkout()" aria-label="Back to today"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Today</button>
      <button class="wtime" onclick="togglePause()" aria-label="pause or resume timer"><span id="wo-pico" aria-hidden="true"></span><span class="num" id="wo-elapsed">0:00</span></button>
      <button class="fin" onclick="finishWorkout()">Finish</button>
    </div>
    <div id="wo-body"></div>
  </section>
  <!-- ROUND B. The run tool is a STEPPER now, rebuilt from a blank page on the agreed model:
       the app times nothing and counts nothing. The watch owns measurement; this screen owns
       the plan. The 17c clock, pause control and cue engine are deliberately gone. -->
  <section class="view" id="v-run">
    <div class="ptop">
      <button class="back" onclick="leaveRun()" aria-label="Back to today"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Today</button>
      <span class="mid">Run</span>
      <button class="fin" onclick="runLogNow()">Log it</button>
    </div>
    <div id="run-body"></div>
  </section>
  <section class="view" id="v-lift"></section>
  <section class="view" id="v-cardio"></section>
  <section class="view" id="v-track"></section>
  <section class="view" id="v-library"></section>
  <!-- v7.81. The Deep report's three groups become their own screen rather than three drawers on
       Track. Modelled on `v-library`, which is the sub-screen pattern this app already has, so
       there is one way to be a screen reached from a tab rather than two. -->
  <section class="view" id="v-deep"></section>
  <section class="view" id="v-generate"></section>
</div>

<div class="restover" id="restover" role="timer" aria-label="Rest timer">
  <div class="rocap">Rest</div>
  <div class="rot num" id="rest-t">1:30</div>
  <div class="ronext" id="rest-next"></div>
  <div class="robar"><i id="rest-fill"></i></div>
  <div class="rorow">
    <button class="rob" onclick="bumpRest(-15)">&minus;15</button>
    <button class="rob" onclick="bumpRest(15)">+15</button>
    <button class="rob skip" onclick="skipRest()">Skip</button>
  </div>
</div>
<div class="toast" id="toast"><span class="tm" id="toast-m"></span><button class="tu" id="toast-u">Undo</button></div>
<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<nav class="nav" id="nav">
  <button data-nav="today" class="on" onclick="show('today')"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9h12v-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Today</span></button>
  <button data-nav="lift" onclick="show('lift')"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Lift</span></button>
  <button data-nav="cardio" onclick="show('cardio')"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="14" cy="5" r="2" fill="currentColor"/><path d="M13 9l-3 3 3 2 1 5M13 9l4 2M10 12l-4 1M11 16l-3 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Cardio</span></button>
  <button data-nav="track" onclick="show('track')"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 19V5M5 19h14M8 16l3-4 3 2 4-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Track</span></button>
</nav>

function lastSetsFor(exId){
  var best=null;
  for(var i=0;i<S.sessions.length;i++){
    var ss=S.sessions[i];
    if(ss.type!=="lift"||!ss.entries)continue;
    for(var j=0;j<ss.entries.length;j++){
      var e=ss.entries[j];
      if(e.exerciseId!==exId)continue;
      var reps=(e.sets||[]).filter(function(x){return x.completed||x.on;})
                           .map(function(x){return +(x.reps||0);})
                           .filter(function(r){return r>0;});
      if(!reps.length)continue;
      if(!best||ss.date>best.date)best={date:ss.date,reps:reps};
    }
  }
  return best;
}
function lastAmrap(exId){var l=lastSetsFor(exId);return l?l.reps[l.reps.length-1]:null;}
var PRESCRIBE_FRACTION=0.55, PRESCRIBE_FLOOR=5;
function prescribe(sl,eq){
  var id=slotEx(sl,eq), guard=0;
  if(!sl.amrap)return {id:id,reps:sl.low,sets:sl.sets,amrap:false,from:"set"};
  if(sl.base)id=variantFor(sl.base,id);   /* gate the day's variant behind what he has earned */
  while(guard++<6){
    var n=lastAmrap(id);
    if(n==null)return {id:id,reps:sl.low,sets:sl.sets,amrap:!!sl.amrap,from:"opening"};
    var t=Math.round(n*PRESCRIBE_FRACTION);
    if(t>=PRESCRIBE_FLOOR||!EASIER[id])
      return {id:id,reps:Math.max(PRESCRIBE_FLOOR,t),sets:sl.sets,amrap:!!sl.amrap,
              from:(t<PRESCRIBE_FLOOR?"floored":"earned"),amrapWas:n};
    id=EASIER[id];
  }
  return {id:id,reps:sl.low,sets:sl.sets,amrap:!!sl.amrap,from:"opening"};
}

function variantFor(base,want){

function slotCandidates(sl,eq){

  if(eq.indexOf("bar")>=0&&sl.bar)order.push(sl.bar);
  if(eq.indexOf("band")>=0&&sl.band)order.push(sl.band);
  if(sl.none)order.push(sl.none);
  order.push(sl.bw);
  var seen={};
  return order.filter(function(id){
    var e=LIB[id];if(!e)return false;
    if(seen[id])return false;seen[id]=true;
    if(e.equip==="band")return eq.indexOf("band")>=0;
    if(e.equip==="bar")return eq.indexOf("bar")>=0;
    if(e.equip==="DB"||e.equip==="dumbbell")return hasDB(eq);
    return true; /* "none" or pure bodyweight */
  });

function rampSets(base){
  if(deloading())return Math.max(1,Math.round(base*0.66)); /* deload cuts sets, keeps the loads */
  if(reentryOn())return Math.max(1,Math.round(base*0.5)); /* round, not floor: floor turns 3 sets

  return (daysIntoProgram()<7)?Math.min(base,2):base;
}

  var p=mondayKey.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]);
  for(var i=0;i<7;i++){if(didKindOn(kind,keyOf(d)))return true;d.setDate(d.getDate()+1);}
  return false;
}
function kindStreak(kind){
  refreshDate();

  if(!kindInWeek(kind,wk)){var p=wk.split("-");var pd=new Date(+p[0],+p[1]-1,+p[2]);pd.setDate(pd.getDate()-7);wk=keyOf(pd);}
  for(var i=0;i<200;i++){
    if(!kindInWeek(kind,wk))break;
    n++;
    var q=wk.split("-");var prev=new Date(+q[0],+q[1]-1,+q[2]);prev.setDate(prev.getDate()-7);wk=keyOf(prev);
  }

var WTAU=10;
function trendSeries(){
  if(!S.weigh.length)return [];
  var out=[{date:S.weigh[0].date,v:S.weigh[0].w}];
  for(var i=1;i<S.weigh.length;i++){
    var dt=Math.max(1,daysBetween(S.weigh[i-1].date,S.weigh[i].date));
    var a=1-Math.exp(-dt/WTAU);
    out.push({date:S.weigh[i].date,v:a*S.weigh[i].w+(1-a)*out[i-1].v});
  }
  return out;
}
function ewma(){var t=trendSeries();return t.length?t[t.length-1].v:null;}
var WSPAN_MIN={28:14,56:28,84:42},WMIN_N={28:3,56:4,84:5},WGATE_K={28:1.0,56:1.5,84:1.5};
function sUser(){
  var tr=trendSeries(),n=0,ss=0;
  for(var i=0;i<S.weigh.length;i++){
    if(daysBetween(S.weigh[i].date,TODAY)>90)continue;
    var d=S.weigh[i].w-tr[i].v;ss+=d*d;n++;
  }
  if(n<8)return 1.5;
  return Math.max(0.6,Math.min(3.0,Math.sqrt(ss/n)));
}
function olsFit(win){
  var pts=[],t0=null;
  for(var i=0;i<S.weigh.length;i++){
    var ago=daysBetween(S.weigh[i].date,TODAY);
    if(ago>win||ago<0)continue;
    if(t0===null)t0=S.weigh[i].date;
    pts.push({x:daysBetween(t0,S.weigh[i].date),y:S.weigh[i].w});
  }
  var n=pts.length;if(n<3)return null;
  var span=pts[n-1].x-pts[0].x;
  var mx=0,my=0;pts.forEach(function(p){mx+=p.x;my+=p.y;});mx/=n;my/=n;
  var sxx=0,sxy=0;pts.forEach(function(p){sxx+=(p.x-mx)*(p.x-mx);sxy+=(p.x-mx)*(p.y-my);});
  if(sxx<=0)return null;
  var b=sxy/sxx;
  var ss=0;pts.forEach(function(p){var e=p.y-(my+b*(p.x-mx));ss+=e*e;});
  var sFit=(n>2)?Math.sqrt(ss/(n-2)):0;
  var s=Math.max(sFit,sUser(),0.6);
  return {n:n,span:span,rate:7*b,se:7*(s/Math.sqrt(sxx))};
}
function weightStats(){
  if(!S.weigh.length)return null;
  var tr=trendSeries(),T=tr[tr.length-1].v;
  var latest=S.weigh[S.weigh.length-1];
  var goal=S.profile.goalLb;
  var ageDays=daysBetween(latest.date,TODAY);
  var rec=0;for(var i=0;i<S.weigh.length;i++)if(daysBetween(S.weigh[i].date,TODAY)<=28)rec++;
  var chosen=null;
  [28,56,84].forEach(function(w){
    if(chosen)return;
    var f=olsFit(w);
    if(!f||f.n<WMIN_N[w]||f.span<WSPAN_MIN[w])return;
    var gate=Math.max(0.15,WGATE_K[w]*f.se);
    if(Math.abs(f.rate)>=gate)chosen={win:w,fit:f,gate:gate};
  });
  var fallback=null;
  if(!chosen){
    [84,56,28].forEach(function(w){
      if(fallback)return;
      var f=olsFit(w);
      if(f&&f.n>=WMIN_N[w]&&f.span>=WSPAN_MIN[w])fallback={win:w,fit:f,gate:Math.max(0.15,WGATE_K[w]*f.se)};
    });
  }
  var use=chosen||fallback;
  var band=(U()==="kg")?1.134:2.5;
  return {trend:T,raw:latest.w,rawDate:latest.date,goal:goal,to:T-goal,toRaw:latest.w-goal,
    ageDays:ageDays,recent:rec,n:S.weigh.length,
    rate:chosen?chosen.fit.rate:null,se:use?use.fit.se:null,win:use?use.win:null,
    fitN:use?use.fit.n:0,gate:use?use.gate:null,called:!!chosen,
    inBand:Math.abs(T-goal)<=band,band:band,stale:ageDays>10,
    minTrend:effortMin(tr).v,minTrendDate:effortMin(tr).date,
    effortStart:effortStart(),effortHigh:effortHigh(tr)};
}
function trendState(){
  var st=weightStats();
  if(!st)return {state:"none"};
  if(st.ageDays>=28)return {state:"dead",st:st};
  if(st.ageDays>=11)return {state:"gone",st:st};
  if(!st.win||st.recent<3)return {state:"thin",st:st};
  if(!st.called)return {state:"flat",st:st,rate:st.rate};
  return {state:(st.rate<0?"down":"up"),st:st,rate:st.rate};
}
function rateWords(r,se){
  var kg=(U()==="kg"),a=Math.abs(r)*(kg?1/2.20462:1);
  var band;
  if(kg){
    band=(a<0.11)?"a tenth of a kilo":(a<0.18)?"a quarter kilo":(a<0.32)?"half a kilo":
         (a<0.45)?"three quarters of a kilo":(a<0.8)?"a kilo":(Math.round(a*2)/2)+" kilos";
  }else{
    band=(a<0.40)?"a quarter pound a week":(a<0.70)?"half a pound a week":(a<1.20)?"a pound a week":
         (a<1.70)?"a pound and a half a week":(a<2.50)?"two pounds a week":(Math.round(a*2)/2)+" pounds a week";
  }
  var qual=(se!=null&&se>0.5*Math.abs(r))?"somewhere around ":"about ";

var EFFORT_GAP=120;
function effortStart(){
  var w=S.weigh;if(!w||!w.length)return null;
  for(var i=w.length-1;i>0;i--)if(daysBetween(w[i-1].date,w[i].date)>EFFORT_GAP)return w[i].date;
  return w[0].date;
}
function effortTrend(tr){
  var es=effortStart();if(!es)return tr;
  var e=tr.filter(function(x){return x.date>=es;});
  return e.length?e:tr;
}
function effortMin(tr){
  var e=effortTrend(tr);if(!e.length)return {v:null,date:null};
  var best=e[0];e.forEach(function(x){if(x.v<best.v)best=x;});
  return {v:best.v,date:best.date};
}
function effortHigh(tr){
  var e=effortTrend(tr);if(!e.length)return null;
  var hi=e[0].v;e.forEach(function(x){if(x.v>hi)hi=x.v;});
  return hi;
}
function milestoneLadder(){
  var st=weightStats();if(!st)return [];
  var start=(st.effortHigh!=null?st.effortHigh:S.weigh[0].w),goal=st.goal,dist=start-goal;
  if(dist<=0.5)return [goal];
  var step=[2,2.5,5,10].filter(function(s){return Math.ceil(dist/s)<=8;})[0]||10;
  var out=[],v=Math.floor((start-0.001)/step)*step;
  while(v>goal+0.001){out.push(Math.round(v*10)/10);v-=step;}
  out.push(goal);

}
function nextMilestone(){
  var st=weightStats();if(!st)return null;
  var lad=milestoneLadder();

}
function monthThird(d){var day=d.getDate();return day<=10?"early":day<=20?"mid":"late";}
function mName(d){return d.toLocaleDateString(undefined,{month:"long"});}
function milestoneLine(t){
  var st=t.st;if(!st)return "";
  if(st.inBand){
    return '<div class="anote" style="margin-top:10px">Inside your maintenance range, '+
      (st.goal-st.band).toFixed(1)+' to '+(st.goal+st.band).toFixed(1)+' '+wLbl()+'. The job now is staying here.</div>';
  }
  var mark=nextMilestone();
  if(mark==null)return "";
  var d=st.trend-mark;
  if(d<=0.05)return "";
  if(t.state!=="down"||st.rate==null||st.se==null)
    return '<div class="anote" style="margin-top:10px">Next mark <b>'+mark+' '+wLbl()+'</b>, '+d.toFixed(1)+' '+wLbl()+' away. No date until the trend has a direction.</div>';
  var a=Math.abs(st.rate);
  if(a<=st.se)return '<div class="anote" style="margin-top:10px">Next mark <b>'+mark+' '+wLbl()+'</b>, '+d.toFixed(1)+' '+wLbl()+' away.</div>';

  var tf=d/rf,ts=d/rs;

  var df=new Date(NOW);df.setDate(df.getDate()+Math.round(tf));
  var ds=new Date(NOW);ds.setDate(ds.getDate()+Math.round(ts));

  if(mName(df)===mName(ds)&&monthThird(df)===monthThird(ds))when="around "+monthThird(df)+" "+mName(df);
  else if(mName(df)===mName(ds))when="somewhere from "+monthThird(df)+" to "+monthThird(ds)+" "+mName(df);
  else when="somewhere from "+monthThird(df)+" "+mName(df)+" into "+mName(ds);

function famBars(pts,o){

  var fmt=o.fmt||function(v){return Math.round(v).toLocaleString();};

function workedWeight(sets){

    if(!(w>0))return;
    counts[w]=(counts[w]||0)+1;

  });

function runSess(){return (S.runSess&&S.runSess.d===TODAY)?S.runSess:null;}

var rpeRun="";
function runSheet(dist,prefillSec){rpeRun="";
  openSheet('<div class="grab"></div><h3>Log run</h3><div class="ssub">Nice one. Punch in the numbers.</div>'+
    '<div class="logrow"><label>Distance</label><div class="inp"><input id="r-dist" inputmode="decimal" value="'+dist+'" oninput="calcPace()" aria-label="distance"><span class="u">mi</span></div></div>'+
    '<div class="logrow"><label>Time <span style="color:var(--faint);font-weight:500">mm:ss</span></label><div class="inp"><input id="r-time" inputmode="numeric" placeholder="22:40" value="'+(prefillSec>0?mmss(prefillSec):"")+'" oninput="calcPace()" aria-label="time" style="width:92px"></div></div>'+
    '<div class="paceout">pace<b id="r-pace">--:--</b></div>'+
    '<div class="rerr" id="r-err" style="display:none"></div>'+
    '<div class="rpe"><button onclick="pickRpe(this,\'Easy\')">Easy</button><button onclick="pickRpe(this,\'OK\')">OK</button><button onclick="pickRpe(this,\'Hard\')">Hard</button></div>'+
    '<button class="sheet-cta" onclick="saveRun()">Save run</button>');
  setTimeout(calcPace,0);
}
function parseTime(t){t=(""+(t||"")).trim();if(!t)return null;if(t.indexOf(":")>=0){var p=t.split(":");var m=parseInt(p[0])||0,s=parseInt(p[1])||0;if(s>59)s=59;return m*60+s;}var n=parseFloat(t);if(isNaN(n))return null;return Math.round(n*60);}
function calcPace(){var d=parseFloat((document.getElementById("r-dist")||{}).value),sec=parseTime((document.getElementById("r-time")||{}).value),el=document.getElementById("r-pace");if(!el)return;el.textContent=(d>0&&sec>0)?mmss(Math.round(sec/d)):"--:--";}
function pickRpe(b,v){rpeRun=v;document.querySelectorAll(".rpe button").forEach(function(x){x.classList.remove("sel")});b.classList.add("sel");}
function runError(msg){
  var el=document.getElementById("r-err");
  if(el){el.textContent=msg;el.style.display=msg?"block":"none";}
  else if(msg)toast(msg,null);
}
function validDist(raw){
  var t=String(raw==null?"":raw).trim();
  if(!/^\d{1,3}(\.\d{1,2})?$/.test(t))return null;
  var v=parseFloat(t);
  if(!isFinite(v)||v<=0||v>200)return null;
  return Math.round(v*100)/100;
}
function saveRun(){
  var d=validDist((document.getElementById("r-dist")||{}).value);
  if(d==null){runError("Enter a distance between 0.1 and 200 "+(U()==="kg"?"km":"mi")+".");return;}
  var tRaw=((document.getElementById("r-time")||{}).value||"").trim();
  var sec=tRaw?parseTime(tRaw):0;
  if(tRaw&&(sec==null||!(sec>0))){runError("Time should look like 22:40.");return;}
  if(sec>86400){runError("That is over 24 hours. Check the time.");return;}
  if(sec>0){
    var pace=sec/d;
    if(pace<150){runError("That works out at "+mmss(Math.round(pace))+" a mile. Check the distance and time.");return;}
    if(pace>3600){runError("That works out at "+mmss(Math.round(pace))+" a mile. Check the distance and time.");return;}
  }
  runError("");
  var paceStr=sec>0?mmss(Math.round(sec/d)):"--:--";
  S.runs[TODAY]={dist:d,time:tRaw||"--",pace:paceStr,rpe:rpeRun};
  var id=TODAY+"-run-"+Math.round(sec)+"-"+Math.round(d*100);
  S.sessions=S.sessions.filter(function(x){return !(x.date===TODAY&&x.type==="run");});
  S.sessions.push({id:id,date:TODAY,type:"run",distanceMi:d,durationSec:sec||0,paceSecPerMi:sec>0?Math.round(sec/d):0,rpe:rpeRun,notes:""});
  S.sessions.sort(function(a,b){return (a.date+"|"+a.id)<(b.date+"|"+b.id)?-1:1;});
  S.done[TODAY]=true;advanceCycle();save();closeSheet();
  S.runSess=null;save();
  if(rpeRun==="Hard")toast("Logged. Keep easy runs easy - that protects your lifting.",null);
  else toast("Logged "+d.toFixed(2).replace(/\.?0+$/,"")+" mi"+(sec>0?" at "+paceStr+"/mi":"")+".",null);
  renderRun();
}
function wStep(){return 0.1;} /* was 0.2 in lb, which could not match the scale exactly */
function lastW(){return S.weigh.length?S.weigh[S.weigh.length-1].w:null;}
function weighLogSheet(){
  if(!S.weigh.length){openSheet('<div class="grab"></div><h3>Weigh-in history</h3><div class="ssub">Nothing logged yet.</div><button class="sheet-cta" onclick="closeSheet();weighSheet()">Log one</button>');return;}
  var tr=trendSeries();

        '<span class="wlsub2">trend '+t.v.toFixed(1)+(d!=null?' &middot; '+(d>0?'+':'')+d.toFixed(1)+' vs '+(gap===1?'the day before':gap+' days earlier'):' &middot; first reading')+'</span></div>'+
      '<div class="wlv num">'+w.w.toFixed(1)+'</div>'+

    '</div>';

function fullDate(k){var p=k.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);
  return d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short",year:(String(d.getFullYear())!==TODAY.slice(0,4))?"numeric":undefined});}

function saveEditWeigh(date){

function delWeigh(date){
  var rec=null;S.weigh.forEach(function(x){if(x.date===date)rec=x;});
  if(!rec)return;
  var keep=S.weigh.filter(function(x){return x.date!==date;});
  S.weigh=keep;save();refreshCurrent();
  toast("Removed "+rec.w.toFixed(1)+" "+wLbl(),function(){
    S.weigh.push(rec);S.weigh.sort(function(a,b){return a.date<b.date?-1:1;});save();weighLogSheet();refreshCurrent();
  });
  weighLogSheet();
}
function validWeight(raw){
  var t=String(raw==null?"":raw).trim();
  if(!/^\d{1,3}(\.\d{1,2})?$/.test(t))return null;
  var v=parseFloat(t);
  if(!isFinite(v))return null;
  var lo=(U()==="kg")?23:50, hi=(U()==="kg")?317:700;
  if(v<lo||v>hi)return null;
  return Math.round(v*10)/10;
}

    '<div class="wdial"><button class="wdb" onclick="nudgeW(-1)" aria-label="lower">&minus;</button>'+
    '<input class="wbig num" id="w-val" inputmode="decimal" value="'+start.toFixed(1)+'" aria-label="weight" oninput="wDelta()">'+
    '<button class="wdb" onclick="nudgeW(1)" aria-label="higher">+</button></div>'+
    '<div class="wunit">'+wLbl()+'<span id="w-delta"></span></div>'+

function nudgeW(d){var el=document.getElementById("w-val");if(!el)return;var v=parseFloat(el.value)||0;el.value=(v+d*wStep()).toFixed(1);wDelta();}
function wDelta(){
  var el=document.getElementById("w-val"),out=document.getElementById("w-delta"),lw=lastW();

function writeWeigh(v,dateK){
  var d=dateK||TODAY;
  if(!(v>0)){closeSheet();return;}
  var had=null;S.weigh.forEach(function(x){if(x.date===d)had=x.w;});
  S.weigh=S.weigh.filter(function(x){return x.date!==d;});
  S.weigh.push({date:d,w:v});
  S.weigh.sort(function(a,b){return a.date<b.date?-1:1;});
  save();closeSheet();refreshCurrent();
  if(had!=null&&Math.abs(had-v)>0.001){
    toast("Updated "+fullDate(d)+" from "+had.toFixed(1)+" to "+v.toFixed(1),function(){
      S.weigh=S.weigh.filter(function(x){return x.date!==d;});

      save();refreshCurrent();});

    toast("Logged "+v.toFixed(1)+" "+wLbl()+" on "+fullDate(d),null);
  }

function proteinTarget(){

function toggleProtein(k){k=k||TODAY;if(S.protein[k])delete S.protein[k];else S.protein[k]=true;save();refreshCurrent();}
function proteinStreak(n){

function daysMoved(n){

function dayPatternSummary(L){
  var tpl=DAYS[L];if(!tpl)return "";
  var seen=[],order=["squat","hinge","h-push","v-push","h-pull","v-pull","core","isolation"];
  (tpl.slots||[]).forEach(function(sl){
    var _p=slotExFor(L,sl);var id=_p&&_p.id;var e=id&&LIB[id];if(!e||!e.pattern)return;
    if(seen.indexOf(e.pattern)<0)seen.push(e.pattern);
  });
  if(!seen.length)return "";
  seen.sort(function(a,b){return order.indexOf(a)-order.indexOf(b);});
  var words=seen.map(function(k){return (PATTERNS[k]||k).toLowerCase();});
  if(words.length<=3)return words.join(", ").replace(/, ([^,]*)$/," and $1");
  return words.slice(0,3).join(", ")+" and "+(words.length-3)+" more";
}
function movementDayGroups(){
  var g={A:[],B:[],C:[]},seen={};
  ["A","B","C"].forEach(function(L){
    (DAYS[L]?DAYS[L].slots:[]).forEach(function(sl){
      var _p=slotExFor(L,sl);var id=_p&&_p.id;if(!id||!LIB[id]||seen[L+id])return;
      seen[L+id]=1;g[L].push(id);
    });
  });
  var inDay={};["A","B","C"].forEach(function(L){g[L].forEach(function(id){inDay[id]=1;});});
  var other=Object.keys(LIB).filter(function(id){return !inDay[id]&&(lastEntry(id)||S.progress[id]);});
  return {A:g.A,B:g.B,C:g.C,other:other};
}
var PAT_SHORT={squat:"SQ",hinge:"HN","h-push":"PUSH","v-push":"OHP","h-pull":"ROW","v-pull":"PULL",core:"CORE",isolation:"PRE"};
function dayPatternPips(L){
  var tpl=DAYS[L];if(!tpl)return "";
  var seen=[],order=["squat","hinge","h-push","v-push","h-pull","v-pull","core","isolation"];
  (tpl.slots||[]).forEach(function(sl){
    var _p=slotExFor(L,sl);var id=_p&&_p.id,e=id&&LIB[id];if(!e||!e.pattern)return;
    if(seen.indexOf(e.pattern)<0)seen.push(e.pattern);
  });
  seen.sort(function(a,b){return order.indexOf(a)-order.indexOf(b);});

function exerciseSeries(id){
  var e=LIB[id];if(!e)return [];
  var out=[];
  S.sessions.forEach(function(s){
    if(s.type!=="lift"||!s.entries)return;
    s.entries.forEach(function(en){
      if(en.exerciseId!==id)return;
      var best=null;
      (en.sets||[]).forEach(function(st){
        if(!st.completed)return;
        var v=e.bw?(st.reps||0):e1rm(st.weightLb||0,st.reps||0);
        if(best==null||v>best)best=v;
      });
      if(best!=null&&best>0)out.push({d:s.id,v:best});
    });
  });
  out.sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:0;});   /* newest first */
  return out;
}
function exerciseTrend(id){
  var ser=exerciseSeries(id);
  if(ser.length<3)return {dir:"none",tone:"flat",word:"not enough sessions yet",n:ser.length};
  var vs=ser.map(function(x){return x.v;}).slice(0,12);
  var latest=vs[0],prior=vs.slice(1);                        /* judge the last session against the level built BEFORE it */
  if(prior.length<2)return {dir:"none",tone:"flat",word:"not enough sessions yet",n:ser.length};
  function ewma(a){var c=0;a.forEach(function(v){var tau=(v>c)?3:6;c=c+(v-c)*(1-Math.exp(-1/tau));});return c;}
  var older=prior.slice().reverse();                         /* oldest first, as weekBase walks it */
  var cap=ewma(older),cap4=ewma(older.slice(0,Math.max(1,older.length-3)));
  var med=tMed(prior.slice());
  var mad=tMed(prior.map(function(v){return Math.abs(v-med);}));
  var band=Math.max(0.6*1.4826*mad,0.06*cap);
  var rising=cap>cap4*1.04;
  if(latest>=cap+band)return {dir:"up",tone:"good",n:ser.length,
    word:rising?"climbing on a strong run":"a strong session for you",short:"climbing",cap:cap};
  if(latest>cap-band)return {dir:"flat",tone:rising?"good":"flat",n:ser.length,
    word:rising?"holding a level you have raised":"right at your usual",
    short:rising?"holding":"at your usual",cap:cap};
  return {dir:"down",tone:"flat",n:ser.length,
    word:rising?"lighter, on top of a strong run":"a lighter session",short:"lighter",cap:cap};
}

function suggestWeight(id){
  var e=LIB[id];if(!e||e.bw)return null;

  var le=lastEntry(id);if(!le)return null;
  var sets=(le.e.sets||[]).filter(function(x){return x.completed;});
  if(sets.length<2)return null;
  var hi=(t.high||12),lo=(t.low||8);
  var did=workedWeight(sets);
  if(did!=null&&Math.abs(did-cur)>=inc()){
    return {dir:(did>cur?"up":"down"),from:cur,to:did,reconcile:true,
      why:"You have been lifting "+did+wLbl()+" here while the card said "+cur+wLbl()+
          ". Match the card to what you are actually doing."};
  }
  var ref=(did!=null)?did:cur;
  var at=sets.filter(function(x){return (x.weightLb||0)===ref;});
  if(at.length<2)return null;

  var anyLow=at.some(function(x){return (x.reps||0)<lo;});
  if(allTop)return {dir:"up",from:cur,to:ref+inc(),why:"You cleared "+hi+" reps on every set at "+ref+wLbl()+" last time."};

  return null;

function rewindRotationFor(rec){

  var adv=(rec.advancedRotation!=null)?rec.advancedRotation:(rec.dayLetter&&rec.dayLetter!=="Gen");
  if(!adv)return;

function purgeDerived(date){
  if(!date)return;
  var stillRun=S.sessions.some(function(x){return x.date===date&&(x.type==="run"||x.distanceMi);});
  var stillLift=S.sessions.some(function(x){return x.date===date&&x.type==="lift";});
  if(!stillRun)delete S.runs[date];
  if(!stillLift&&S.wk[date])delete S.wk[date];
  recomputeDone(date);
}
function deleteDay(k){
  var rec=null;
  S.sessions.forEach(function(s){if(s.id===k){rec=s;tomb(s.id);rewindRotationFor(s);}});
  S.sessions=S.sessions.filter(function(s){return s.id!==k;});
  var date=rec?rec.date:(/^\d{4}-\d{2}-\d{2}/.test(k)?k.slice(0,10):null);
  if(date){delete S.done[date];purgeDerived(date);}
  save();closeSheet();refreshCurrent();toast("Entry deleted",null);}

  if(!red.length)return {t:"Log today",a:"show('today')",why:"everything is at or above your usual level"};

function syncHealth(){
  var tok=null,h=null;
  try{tok=localStorage.getItem("train.syncToken");h=JSON.parse(localStorage.getItem("train.syncHealth")||"null");}catch(e){}
  if(!tok)return {rag:"none",txt:"not connected",hint:"no passphrase on this device"};
  if(!h||!h.lastTry)return {rag:"amber",txt:"unknown",hint:"connected, no exchange recorded yet"};
  if(!h.lastOk)return {rag:"red",txt:"never",hint:(h.fails||0)+" failed attempt"+((h.fails||0)===1?"":"s")+(h.lastErr?", "+h.lastErr:"")};
  var d=Math.floor((Date.now()-h.lastOk)/86400000);
  var txt=(d===0)?"today":(d===1)?"yesterday":d+" days ago";
  var hint=(h.fails>0)?("last exchange "+txt+", "+h.fails+" failure"+(h.fails===1?"":"s")+" since"):"last successful exchange";
  return {rag:(h.fails>2||d>=3)?"red":(h.fails>0||d>=1)?"amber":"good",txt:txt,hint:hint};
}

function rollSeries(get,win,stat,points,stepDays){
  stepDays=stepDays||1;var out=[];
  for(var p=points-1;p>=0;p--){
    var end=new Date(NOW);end.setDate(end.getDate()-p*stepDays);
    var xs=[],d=new Date(end);
    for(var i=0;i<win;i++){var v=get(keyOf(d));if(v!=null&&!isNaN(v))xs.push(v);d.setDate(d.getDate()-1);}
    if(!xs.length){out.push(null);continue;}
    if(stat==="sum")out.push(xs.reduce(function(a,x){return a+x;},0));
    else if(stat==="med")out.push(tMed(xs.slice()));
    else if(stat==="last")out.push(xs[0]);
    else out.push(xs.reduce(function(a,x){return a+x;},0)/xs.length);
  }
  return out;
}
function sparkSVG(pts,tone){
  var real=pts.filter(function(v){return v!=null;});
  if(real.length<4)return "";
  var lo=Math.min.apply(null,real),hi=Math.max.apply(null,real);
  if(!(hi>lo))return "";
  var W=100,H=20,pad=2;
  var srt=real.slice().sort(function(a,b){return a-b;});
  var q1=srt[Math.floor(srt.length*0.25)],q3=srt[Math.floor(srt.length*0.75)];
  var y=function(v){return pad+(H-2*pad)*(1-(v-lo)/(hi-lo));};
  var x=function(i){return pts.length>1?(W*i/(pts.length-1)):0;};
  var seg=[],cur=[];
  pts.forEach(function(v,i){
    if(v==null){if(cur.length>1)seg.push(cur);cur=[];return;}
    cur.push(x(i).toFixed(1)+","+y(v).toFixed(2));
  });
  if(cur.length>1)seg.push(cur);
  var last=-1;for(var i=pts.length-1;i>=0;i--){if(pts[i]!=null){last=i;break;}}
  var bandY=y(q3),bandH=Math.max(1,y(q1)-y(q3));
  return '<svg class="gspk" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<rect class="gsb" x="0" y="'+bandY.toFixed(2)+'" width="'+W+'" height="'+bandH.toFixed(2)+'"/>'+
    seg.map(function(s){return '<polyline class="gsl" points="'+s.join(" ")+'"/>';}).join("")+
    (last>=0?'<circle class="gsd" cx="'+x(last).toFixed(1)+'" cy="'+y(pts[last]).toFixed(2)+'" r="2.2"/>':"")+
    '</svg>';
}

function weekBase(k){
  var vs=weekSeries(k).slice(0,11);            /* eleven COMPLETED weeks; this week is excluded */
  if(!vs.length)return null;
  var any=false;for(var i=0;i<vs.length;i++)if(vs[i]>0){any=true;break;}
  if(!any)return null;
  function ewma(a){var c=0;a.forEach(function(v){var tau=(v>c)?3:6;c=c+(v-c)*(1-Math.exp(-1/tau));});return c;}
  var cap=ewma(vs),cap4=ewma(vs.slice(0,Math.max(1,vs.length-4)));
  var med=tMed(vs.slice());
  var mad=tMed(vs.map(function(v){return Math.abs(v-med);}));
  var band=Math.max(0.6*1.4826*mad,0.10*cap,WEEK_FLOOR[k]||0.5);

function weekVerdict(k,val,elapsed){

  var f=(elapsed==null?7:Math.max(1,Math.min(7,elapsed)))/7;
  var R=b.cap*f,B=b.band*f;
  if(val<=0)    return {base:b,dir:"down",tone:"flat",word:"nothing logged yet this week"};
  if(val>=R+B)  return {base:b,dir:"up",  tone:"good",word:b.rising?"building on a strong run":"a big week for you"};
  if(val>R-B)   return {base:b,dir:"flat",tone:b.rising?"good":"flat",
                        word:b.rising?"holding a level you have raised":"right at your usual"};
  if(val>0)     return {base:b,dir:"down",tone:"flat",word:b.rising?"lighter, on top of a strong run":"a lighter week"};

function weightVerdict(){
  var st=weightStats();
  if(!st)return {tone:"",word:"",val:null};
  var word=(st.rate==null)?"too few weigh-ins":(st.rate<=-0.25?"coming off":st.rate<0.15?"holding":"climbing");
  var tone;
  if(st.ageDays>=14)tone="red";
  else if(st.ageDays>=7)tone="amber";
  else if(st.rate==null)tone="flat";
  else if(st.rate<=-0.25)tone="good";
  else if(st.rate<0.15)tone="flat";
  else tone="amber";
  return {tone:tone,word:word,val:st.raw,st:st};
}

function barBody(vals,fmt,unit,firstLabel,floor){
  if(!vals||vals.length<2)return '<div class="ksub">Not enough weeks logged yet.</div>';
  fmt=fmt||function(v){return Math.round(v);};
  var base=floor||0;
  var mx=Math.max.apply(null,vals)||1;
  var nz=vals.filter(function(v){return v>0;});
  var mean=nz.length?nz.reduce(function(a,v){return a+v;},0)/nz.length:0;
  var H=96,last=vals.length-1,peak=vals.indexOf(mx);
  var bars=vals.map(function(v,i){
    var hh=v>0?Math.max(4,Math.round((v-base)/((mx-base)||1)*H)):2;
    var isLast=(i===last),isPeak=(i===peak&&v>0&&peak!==last);
    var show=(isLast||isPeak)&&v>0;
    var xl=(i===0)?(firstLabel||(vals.length+"w ago")):(isLast?"now":"");
    return '<div class="bcol"><span class="bv'+(isLast?" on":"")+'">'+(show?fmt(v):"")+'</span>'+
      '<i class="'+(isLast?"on":"")+(v>0?"":" zero")+'" style="height:'+hh+'px"></i>'+
      '<span class="bx">'+xl+'</span></div>';
  }).join("");
  var meanPct=mx?Math.round(((mean-base)/((mx-base)||1))*H):0;
  return '<div class="bwrap tall" style="--bh:'+H+'px">'+
    (mean>0?'<div class="bmean" style="bottom:'+(meanPct+22)+'px"><span>avg '+fmt(mean)+(unit?" "+unit:"")+'</span></div>':'')+
    '<div class="brow">'+bars+'</div><div class="bbase"></div></div>';
}
function barChart(title,note,vals,labels,fmt,unit){
  if(!vals||vals.length<2)return "";
  fmt=fmt||function(v){return Math.round(v);};
  var mx=Math.max.apply(null,vals)||1;
  var nz=vals.filter(function(v){return v>0;});
  var mean=nz.length?nz.reduce(function(a,v){return a+v;},0)/nz.length:0;
  var H=64;
  var bars=vals.map(function(v,i){
    var hh=v>0?Math.max(6,Math.round(v/mx*H)):2;
    var last=(i===vals.length-1);
    return '<div class="bcol"><span class="bv'+(last?" on":"")+'">'+(v>0?fmt(v):"")+'</span>'+
      '<i class="'+(last?"on":"")+(v>0?"":" zero")+'" style="height:'+hh+'px"></i>'+
      '<span class="bx">'+(labels&&labels[i]!=null?labels[i]:"")+'</span></div>';
  }).join("");
  var meanPct=mx?Math.round((mean/mx)*H):0;
  return '<div class="card"><h3><span>'+title+'</span><span class="t">'+note+'</span></h3>'+
    '<div class="bwrap" style="--bh:'+H+'px">'+(mean>0?'<div class="bmean" style="bottom:'+(meanPct+16)+'px"><span>avg '+fmt(mean)+(unit?" "+unit:"")+'</span></div>':'')+
    '<div class="brow">'+bars+'</div></div></div>';
}

}

function lifetimeHTML(){

function bwFactor(){var f=S.profile.bwFactor;return (typeof f==="number"&&f>=10&&f<=100)?f/100:0.65;}
function bwLoadLb(){return Math.round((lastW()||180)*bwFactor());}

  var by={},bwLb=bwLoadLb();
  S.sessions.forEach(function(s){if(s.type!=="lift")return;var wk=isoWeek(s.id),v=0;
    s.entries.forEach(function(en){if(en.unit==="s")return;
      en.sets.forEach(function(st){if(!st.completed)return;v+=(en.bw?bwLb:(st.weightLb||0))*(st.reps||0);});});
    by[wk]=(by[wk]||0)+v;});

function volChart(){

}

  var out="# Train Export - "+TODAY+"\n\n## Snapshot\n";
  out+="- Bodyweight: "+(e?e.toFixed(1)+" "+wLbl()+" (EWMA)":"not logged")+(S.weigh.length?", latest "+S.weigh[S.weigh.length-1].w+" ("+S.weigh[S.weigh.length-1].date+")":"")+". Goal "+S.profile.goalLb+" (stretch "+S.profile.stretchLb+").\n";

  out+="\n## Runs\n";runs.slice(-10).reverse().forEach(function(s){out+="- "+s.id+": "+s.distanceMi+" mi in "+mmss(s.durationSec)+" ("+(s.paceSecPerMi?mmss(s.paceSecPerMi):"--")+"/mi) - "+(s.rpe||"")+"\n";});

function copyText(txt,msg){

}

  '<button class="sheet-cta" onclick="doImport(\'merge\')">Merge (combine devices)</button><button class="sheet-cta ghost" onclick="doImport(\'replace\')">Replace everything</button>');}
function doImport(mode){var t=(document.getElementById("imp")||{}).value;var o;try{o=JSON.parse(t)}catch(e){toast("That isn\'t valid JSON.",null);return;}
  if(!o||o.schema!=="train.export"){toast("Not a Train backup.",null);return;}
  try{localStorage.setItem("train_v2_backup",JSON.stringify(S))}catch(e){}
  var inW=o.weighins?o.weighins.map(function(w){return {date:w.date,w:w.weightLb};}):[];
  if(mode==="replace"){
    if(o.sessions)S.sessions=o.sessions;S.weigh=inW;if(o.anchor)S.anchor=o.anchor;if(o.progressState)S.progress=o.progressState;
  }else{
    var seen={};S.sessions.forEach(function(s){seen[s.id]=true;});
    (o.sessions||[]).forEach(function(s){if(!seen[s.id]){S.sessions.push(s);seen[s.id]=true;}});
    var ws={};S.weigh.forEach(function(w){ws[w.date]=true;});
    inW.forEach(function(w){if(!ws[w.date]){S.weigh.push(w);ws[w.date]=true;}});
    S.weigh.sort(function(a,b){return a.date<b.date?-1:1;});

    if(o.progressState){for(var p in o.progressState){if(!S.progress[p])S.progress[p]=o.progressState[p];}}
  }

  try{

    if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)
      jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister();}));}));
    if(!jobs.length){done();return;}
    Promise.all(jobs).then(done).catch(done);
    setTimeout(done,2500);
  }catch(e){done();}

    var to=parseFloat(card.getAttribute("data-to")),fromA=card.getAttribute("data-from");
    var from=(fromA===""||fromA==="null")?null:parseFloat(fromA);
    if(!isFinite(to))return;
    if(from==null||!isFinite(from))from=0;
    var delta=to-from;
    var LNow=(card.getAttribute("data-kind")==="lift")?liftLevel():cardioLevel();
    if(motionOff()){
      num.textContent=LNow.lvl;
      arc.setAttribute("stroke-dashoffset",(RINGC*(1-LNow.pips/10)).toFixed(1));
      return;
    }
    var dur=Math.min(2600,Math.max(700,Math.abs(delta)*900||700));
    var t0=null;
    function ease(x){return 1-Math.pow(1-x,3);}
    function frame(ts){
      if(t0==null)t0=ts;
      var k=Math.min(1,(ts-t0)/dur),v=from+delta*ease(k);
      var frac=v-Math.floor(v);
      arc.setAttribute("stroke-dashoffset",(RINGC*(1-frac)).toFixed(1));
      num.textContent=Math.floor(v+1e-9);
      if(k<1){requestAnimationFrame(frame);return;}
      num.textContent=LNow.lvl;
      arc.setAttribute("stroke-dashoffset",(RINGC*(1-LNow.pips/10)).toFixed(1));
    }
    arc.setAttribute("stroke-dashoffset",(RINGC*(1-(from-Math.floor(from)))).toFixed(1));
    num.textContent=Math.floor(from);
    setTimeout(function(){requestAnimationFrame(frame);},260);
  });
}

function recoveryState(){
  var act=soreActive();
  if(act.length){
    var worst=act.slice().sort(function(a,b){return (soreAge(a)||0)-(soreAge(b)||0);})[0];
    var age=soreAge(worst)||0,left=Math.max(0,SORE_DAYS-age);
    var clear=new Date(NOW);clear.setDate(clear.getDate()+left);
    return {k:"sore",w:"Recovering",tone:"warn",areas:act,left:left,age:age,
            clear:keyOf(clear),
            why:act.map(function(k){return SORE[k].n;}).join(", ")};
  }
  var gap=0,d=new Date(NOW);
  for(var i=1;i<=21;i++){d=new Date(NOW);d.setDate(d.getDate()-i);
    if(didAnything(keyOf(d)))break;gap++;}
  if(!didAnything(TODAY)&&gap>=4)
    return {k:"off",w:"Backing off",tone:"amber",gap:gap};
  var a=weekMetrics(0),b=weekMetrics(1);
  if(a&&b&&a.moved>=b.moved+2)
    return {k:"ramp",w:"Ramping",tone:"good",now:a.moved,prev:b.moved};
  return {k:"steady",w:"Steady",tone:"flat",now:a?a.moved:0};
}

function parseCalai(t){
  t=(t||"").trim();if(!t)return [];
  if(t.charAt(0)==="{"||t.charAt(0)==="["){
    var o;try{o=JSON.parse(t)}catch(e){return null;}
    var arr=o.days||o.entries||(Array.isArray(o)?o:[]);
    return arr.map(function(r){
      return {date:r.date,protein:+(r.proteinG!=null?r.proteinG:r.protein),cals:+(r.calories!=null?r.calories:r.cals)||0};
    }).filter(function(r){return r.date&&!isNaN(r.protein);});
  }
  var out=[];
  t.split(/\n+/).forEach(function(line){
    var parts=line.split(/[,\t;]+/).map(function(x){return x.trim();});
    if(parts.length<2)return;
    var dt=parts[0],pr=parseFloat(parts[1]),cl=parts.length>2?parseFloat(parts[2]):0;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(dt)||isNaN(pr))return;
    out.push({date:dt,protein:pr,cals:isNaN(cl)?0:cl});
  });
  return out;
}
function doCalai(){
  var rows=parseCalai((document.getElementById("cj")||{}).value);

  var pt=proteinTarget(),lo=pt?pt.lo:120,hit=0;
  S.nutrition=S.nutrition||{};
  S.stamps=S.stamps||{nutrition:{},steps:{}};S.stamps.nutrition=S.stamps.nutrition||{};
  var _at=Date.now();
  rows.forEach(function(r){
    S.nutrition[r.date]={p:r.protein,c:r.cals};

    if(r.protein>=lo){S.protein[r.date]=true;hit++;}else{delete S.protein[r.date];}
  });
  save();closeSheet();refreshCurrent();
  toast("Imported "+rows.length+" day"+(rows.length===1?"":"s")+", "+hit+" hit protein.",null);
}

function doHealthXml(){
  var t=(document.getElementById("hx")||{}).value||"";
  if(t.indexOf("<HealthData")<0){toast("That does not look like export.xml.",null);return;}
  var doc;try{doc=new DOMParser().parseFromString(t,"text/xml");}catch(e){toast("Could not read that file.",null);return;}
  if(doc.getElementsByTagName("parsererror").length){toast("That file is not complete XML.",null);return;}
  var recs=doc.getElementsByTagName("Record"),stepsBy={},nW=0,nS=0,nDup=0;
  for(var i=0;i<recs.length;i++){
    var r=recs[i],ty=r.getAttribute("type")||"",dt=(r.getAttribute("startDate")||"").slice(0,10),v=parseFloat(r.getAttribute("value"));
    if(!dt||isNaN(v))continue;
    if(ty.indexOf("StepCount")>=0){stepsBy[dt]=(stepsBy[dt]||0)+v;}
    else if(ty.indexOf("BodyMass")>=0){
      var unit=r.getAttribute("unit")||"lb";
      var lb=(unit.indexOf("kg")>=0)?v*2.20462:v;
      S.weigh=S.weigh.filter(function(x){return x.date!==dt;});
      S.weigh.push({date:dt,w:Math.round(lb*10)/10});nW++;
    }
  }
  Object.keys(stepsBy).forEach(function(k){S.steps[k]=Math.round(stepsBy[k]);nS++;});
  var wo=doc.getElementsByTagName("Workout"),nA=0,seen={};
  S.sessions.forEach(function(x){seen[x.id]=true;});
  for(var j=0;j<wo.length;j++){
    var w=wo[j],dt2=(w.getAttribute("startDate")||"").slice(0,10);
    if(!dt2)continue;
    var mins=parseFloat(w.getAttribute("duration"))||0;
    var ty2=(w.getAttribute("workoutActivityType")||"").replace("HKWorkoutActivityType","");
    var dist=parseFloat(w.getAttribute("totalDistance"))||0;
    var du=(w.getAttribute("totalDistanceUnit")||"mi").toLowerCase();
    if(du.indexOf("km")>=0)dist=dist*0.621371;
    else if(du==="m"||du.indexOf("meter")>=0)dist=dist*0.000621371;
    var isRun=/Running/i.test(ty2);
    var id=dt2+"-h"+(isRun?"run":(ty2||"act").toLowerCase())+"-"+Math.round(mins*60)+"-"+Math.round(dist*100);
    if(seen[id])continue;
    var rec={id:id,date:dt2,type:isRun?"run":"activity",durationSec:Math.round(mins*60),notes:"Apple Health",src:"health-xml"};
    if(isRun){rec.distanceMi=Math.round(dist*10)/10;if(rec.distanceMi>0&&rec.durationSec)rec.paceSecPerMi=Math.round(rec.durationSec/rec.distanceMi);}
    else rec.activity=ty2||"Workout";
    if(rec.type==="run"&&!(rec.distanceMi>0)){rec.type="activity";rec.activity="Cardio";delete rec.paceSecPerMi;}
    if(alreadyHave(rec)){nDup++;continue;}
    seen[id]=true;
    S.sessions.push(rec);S.done[dt2]=true;nA++;
  }
  S.weigh.sort(function(a,b){return a.date<b.date?-1:1;});
  S.sessions.sort(function(a,b){return a.date<b.date?-1:1;});
  save();closeSheet();refreshCurrent();
  toast("Read "+nS+" days of steps, "+nW+" weigh-ins and "+nA+" workouts."+(nDup?" Skipped "+nDup+" already on record.":""),null);
}

function sessionClock(s){

function mondayOf(d){var m=new Date(d);m.setDate(d.getDate()-((d.getDay()+6)%7));m.setHours(0,0,0,0);return m;}
function isRealRun(s){return s.type==="run"&&(s.distanceMi||0)>0;}
function allRuns(){return S.sessions.filter(isRealRun).sort(function(a,b){return a.date<b.date?-1:1;});}
function runRhythm(){var r=allRuns();if(!r.length)return{total:0,count:0,gap:null,last:null};var count=1;for(var i=r.length-1;i>0;i--){if(daysBetween(r[i-1].date,r[i].date)<7)count++;else break;}return{total:r.length,count:count,gap:daysBetween(r[r.length-1].date,TODAY),last:r[r.length-1].date};}
function nextRunTarget(){
  var rr=runRhythm();

    var wk=bwTarget("miles").t||2;
    var per=Math.max(0.5,Math.round(wk/3*4)/4);
    return {mi:per,restart:(rr.gap!==null&&rr.gap>=7),block:0,fromTarget:true,wk:wk};
  }
  if(rr.gap!==null&&rr.gap>=7)return{mi:2,restart:true,block:0};

function runStatusLine(rr){if(rr.total===0)return"No runs logged yet. Start with an easy 2 miles - that is the whole ask.";if(rr.gap===0)return"You ran today. That is the streak working.";if(rr.gap<=3)return"In rhythm - last run "+rr.gap+" day"+(rr.gap===1?"":"s")+" ago. Keep it rolling.";if(rr.gap<=6)return rr.gap+" days since your last run. A short one puts the rhythm back.";return"It has been "+rr.gap+" days. Restart easy, no penalty - the rhythm repairs itself.";}

function bestWeekEver(){
  var first=S.sessions.reduce(function(a,x){return (!a||x.date<a)?x.date:a;},null);
  if(!first)return {mi:0,week:null};
  var weeks=Math.max(1,Math.ceil((daysBetween(first,TODAY)+7)/7));
  var ws=weeklyMilesSeries(Math.min(weeks,600)),best={mi:0,week:null};
  ws.forEach(function(w){if(w.mi>best.mi)best={mi:w.mi,week:w.w};});

}

function weekSteps(back,capDays){
  var days=weekDays(back||0),sum=0,n=0;
  days.forEach(function(k,i){
    if(k>TODAY)return;
    if(capDays!=null&&i>=capDays)return;
    var v=(S.steps||{})[k];
    if(v!=null&&isFinite(v)){sum+=+v;n++;}
  });
  return {sum:sum,days:n};
}
function bestWeek(read){
  var best=0;
  for(var i=1;i<=12;i++){var v=read(i);if(v>best)best=v;}
  return best;
}
function cweekCell(label,val,v,best,fmt,unit,act,tgt,tgtFull){
  var ref=(v&&v.base)?v.base.cap:0;
  var mark=(tgt>0)?tgt:ref;
  var top=Math.max(best,val,ref,mark,0.0001);
  var fill=Math.max(0,Math.min(100,(val/top)*100));
  var tick=(mark>0)?Math.max(0,Math.min(100,(mark/top)*100)):null;
  var word=v?v.word:"first weeks on record",dir=v?v.dir:"flat";
  var sameRef=(ref>0&&tgtFull>0&&fmt(ref)===fmt(tgtFull));
  var sub=(tgtFull>0)?("target "+fmt(tgtFull)+" a week"+((ref>0&&!sameRef)?(" · usual "+fmt(ref)):""))
        :((best>0)?("best week "+fmt(best)+(ref>0?(" · usual "+fmt(ref)):"")):"first weeks on record");
  return '<button class="cwc" onclick="'+act+'">'+
    '<span class="cwk">'+esc(label)+'</span>'+
    '<span class="cwv num">'+fmt(val)+(unit?('<small>'+esc(unit)+'</small>'):'')+'</span>'+
    '<span class="cwbar"><i style="width:'+fill.toFixed(1)+'%"></i>'+
      (tick!=null?'<u style="left:'+tick.toFixed(1)+'%"></u>':'')+'</span>'+
    '<span class="cww" data-dir="'+dir+'">'+word+'</span>'+
    (sub===word?'':'<span class="cwsub">'+esc(sub)+'</span>')+'</button>';
}
function cardioWeekHTML(){

function paceZonesParts(srcRuns,winLabel){
  var zs=ZONES.slice().sort(function(a,b){return a.lo-b.lo;});
  var paced=(srcRuns||allRuns()).filter(function(r){return r.paceSecPerMi>0;});
  var runs,winW;
  if(srcRuns){runs=paced;winW=winLabel||"this window";}
  else{
    runs=paced.filter(function(r){return daysBetween(r.date,TODAY)<=365;});winW="the last year";
    if(runs.length<8){runs=paced;winW="every run on record";}
  }
  function zoneOf(p){
    for(var i=0;i<zs.length;i++)if(p<=zs[i].hi)return zs[i].k;
    return "long";
  }
  var counts={},n=runs.length;
  zs.forEach(function(z){counts[z.k]=0;});
  var faster=0;
  runs.forEach(function(r){
    if(r.paceSecPerMi<zs[0].lo){faster++;return;}
    counts[zoneOf(r.paceSecPerMi)]++;
  });
  var easyish=(counts.easy||0)+(counts.long||0);
  var hard=(counts.tempo||0)+(counts.steady||0)+faster;
  var head,tone,line;
  if(!n){
    head="No runs to read yet.";tone="none";
    line="Once a few runs are logged this shows how many of them actually landed in the easy band.";
  }else if(hard>easyish){
    head="Your easy runs are not easy.";tone="red";
    line="<b>"+hard+"</b> of your "+n+" runs came in at steady pace or faster. That is the usual reason a base stalls, and it is why your legs turn up tired to a lift day. The fix is dull and it works: run the easy ones slower than feels right.";
  }else if(hard===0){
    head="Every run has been easy.";tone="good";
    line="All "+n+" runs sat in the easy or long band. That is exactly how a base gets built. Speed comes later and it comes cheaply once this holds.";
  }else{
    head="Mostly easy, which is right.";tone="good";
    line="<b>"+easyish+"</b> of "+n+" runs landed easy or long, <b>"+hard+"</b> did not. Keep that ratio and the base keeps building.";
  }
  var bar="",legend="";
  var order=[{k:"tempo",n:"Tempo"},{k:"steady",n:"Steady"},{k:"easy",n:"Easy"},{k:"long",n:"Long"}];
  if(n){
    if(faster){
      bar+='<i class="pz" data-z="faster" style="width:'+(faster/n*100).toFixed(1)+'%" title="Faster than tempo"></i>';
    }
    order.forEach(function(o){
      var c=counts[o.k]||0;if(!c)return;
      bar+='<i class="pz" data-z="'+o.k+'" style="width:'+(c/n*100).toFixed(1)+'%" title="'+o.n+': '+c+'"></i>';
    });
  }
  var rows=order.map(function(o){
    var z=null;zs.forEach(function(x){if(x.k===o.k)z=x;});
    if(!z)return "";
    var c=counts[o.k]||0,pct=n?Math.round(c/n*100):0;
    return '<div class="pzr2" data-z="'+o.k+'">'+
      '<span class="pzd"></span>'+
      '<span class="pzn">'+o.n+'</span>'+
      '<span class="pzp num">'+mmss(z.lo)+'&ndash;'+mmss(z.hi)+'</span>'+
      '<span class="pzmph num">'+mphTxt(z.hi)+'&ndash;'+mphTxt(z.lo)+'<small>mph</small></span>'+
      '<span class="pzc num">'+c+'</span></div>';
  }).join("");
  var extra=faster?('<div class="pzr2" data-z="faster"><span class="pzd"></span><span class="pzn">Faster</span>'+
      '<span class="pzp num">&lt;'+mmss(zs[0].lo)+'</span>'+
      '<span class="pzmph num">&gt;'+mphTxt(zs[0].lo)+'<small>mph</small></span>'+
      '<span class="pzc num">'+faster+'</span></div>'):"";
  var inner='<div class="pzhead" data-tone="'+tone+'">'+head+'</div>'+
    '<div class="pzline">'+line+'</div>'+
    (n?'<div class="pzbar">'+bar+'</div>':'')+
    (n?('<div class="pznow"><span class="pznl">Where your running actually sits</span>'+
      '<span class="pznv num">'+(function(){var ps=runs.map(function(r){return r.paceSecPerMi;}).sort(function(a,b){return a-b;});
        var med=ps.length%2?ps[(ps.length-1)/2]:Math.round((ps[ps.length/2-1]+ps[ps.length/2])/2);
        return mmss(med)+' /mi &middot; '+mphTxt(med)+' mph';})()+'</span>'+
      (function(){var ez=null;zs.forEach(function(x){if(x.k==="easy")ez=x;});if(!ez)return "";
        return '<span class="pznl">Where it should sit for base building</span>'+
        '<span class="pznv num">'+mmss(ez.lo)+'&ndash;'+mmss(ez.hi)+' /mi &middot; '+mphTxt(ez.hi)+'&ndash;'+mphTxt(ez.lo)+' mph</span>';})()+
      '</div>'):'')+
    '<div class="pzr2 hd"><span class="pzd" style="visibility:hidden"></span><span class="pzn">Band</span>'+
      '<span class="pzp">pace /mi</span><span class="pzmph">treadmill</span><span class="pzc">runs</span></div>'+
    '<div class="pzrows">'+extra+rows+'</div>'+
    '<div class="ksub" style="margin:10px 0 0">Set the treadmill to the mph beside each band.'+
      (srcRuns?'':(' Reading '+runs.length+' run'+(runs.length===1?'':'s')+' from '+winW+'.'))+'</div>';
  return {inner:inner,chip:(n?(easyish+" of "+n+" easy"):"per mile"),tone:tone};
}

  var pace=s.paceSecPerMi||0,mph=pace>0?(3600/pace):0;
  if(s.type==="run"&&pace>=240&&pace<=1200)return runMET(mph);
  if(s.type==="activity"&&pace>0&&pace<720)return runMET(mph);
  if(s.type==="activity"&&pace>=720&&pace<=2400)return walkMET(mph);
  if(s.type==="lift"&&typeof s.rpe==="number")return LIFT_MET[Math.max(6,Math.min(10,Math.round(s.rpe)))]||4.5;
  if(s.type==="lift")return 4.5;
  var lab=(""+(s.rpe||"")).toLowerCase();

function sessionHours(s){

  if(!sec&&s.type==="lift"&&s.entries){var n=0;s.entries.forEach(function(e){n+=(e.sets||[]).length;});sec=Math.min(n*240,5400);}

function sameRun(a,b){
  if(a.date!==b.date)return false;
  var d1=a.distanceMi||0,d2=b.distanceMi||0,s1=a.durationSec||0,s2=b.durationSec||0;
  if(!(d1>0)||!(d2>0))return false;
  if(Math.abs(d1-d2)>Math.max(0.05,0.02*Math.max(d1,d2)))return false;
  if(s1>0&&s2>0&&Math.abs(s1-s2)>Math.max(20,0.02*Math.max(s1,s2)))return false;
  return true;
}
function sameActivity(a,b){
  if(a.date!==b.date)return false;
  var s1=a.durationSec||0,s2=b.durationSec||0;
  if(!(s1>0)||!(s2>0))return false;
  if(Math.abs(s1-s2)>Math.max(60,0.05*Math.max(s1,s2)))return false;
  var d1=a.distanceMi||0,d2=b.distanceMi||0;
  if(d1>0&&d2>0&&Math.abs(d1-d2)>Math.max(0.05,0.02*Math.max(d1,d2)))return false;
  return true;
}

    var x=S.sessions[i];
    if(x.date!==rec.date)continue;
    if(x.id===rec.id)return true;
    if(rec.type==="run"&&x.type==="run"&&sameRun(x,rec))return true;
    if(rec.type!=="lift"&&x.type!=="lift"&&sameActivity(x,rec))return true;
  }

}
function runDupeGroups(){
  var runs=S.sessions.filter(isRealRun).slice().sort(function(a,b){return a.date<b.date?-1:1;});
  var used={},groups=[];
  for(var i=0;i<runs.length;i++){
    if(used[runs[i].id])continue;
    var g=[runs[i]];used[runs[i].id]=1;
    for(var j=i+1;j<runs.length;j++){
      if(runs[j].date>runs[i].date)break;
      if(used[runs[j].id]||!sameRun(runs[i],runs[j]))continue;
      g.push(runs[j]);used[runs[j].id]=1;
    }
    if(g.length>1)groups.push(g);
  }
  return groups;
}
function pickKeeper(g){

  return dev.length?dev[0]:g[0];

function mergeDupeRuns(){

  groups.forEach(function(g){
    var keep=pickKeeper(g);

      if(r===keep)return;
      if(!keep.rpe&&r.rpe)keep.rpe=r.rpe;
      if(r.notes&&(keep.notes||"").indexOf(r.notes)<0)keep.notes=(keep.notes?keep.notes+" \u00b7 ":"")+r.notes;
      var idx=S.sessions.indexOf(r);
      if(idx>=0)S.sessions.splice(idx,1);
      tomb(r.id);                    /* without this the next pull puts it straight back */
      n++;
    });
    keep.notes=(keep.notes?keep.notes+" \u00b7 ":"")+"merged duplicate import";
    S.runs[keep.date]={dist:keep.distanceMi,time:mmss(keep.durationSec||0),

  });

function reconDays(){

    if(S.vetted[k])return;

  });

function dataAudit(){

      say:g[0].distanceMi.toFixed(2)+" mi logged "+g.length+" times, "+mi.toFixed(2)+" mi counted twice"});
  });
  S.sessions.forEach(function(r,i){
    var d=r.distanceMi||0,sec=r.durationSec||0;
    if(r.type==="run"){
      if(d<=0&&sec>0)issues.push({id:r.id,date:r.date,kind:"run-no-distance",fix:"reclassify",
        say:Math.round(sec/60)+" min logged as a run with no distance"});
      else if(d>0&&sec>0){

function weeklyMilesSeries(weeks){
  weeks=weeks||52;
  var out=[],d=new Date(NOW);
  d.setDate(d.getDate()-((d.getDay()+6)%7));           /* this Monday */
  d.setDate(d.getDate()-7*(weeks-1));
  for(var i=0;i<weeks;i++){
    var start=keyOf(d),e=new Date(d);e.setDate(e.getDate()+6);var end=keyOf(e);
    var mi=0,runs=0;
    S.sessions.forEach(function(r){
      if(r.type!=="run"||!(r.distanceMi>0))return;
      if(r.date>=start&&r.date<=end){mi+=r.distanceMi;runs++;}
    });
    out.push({w:start,mi:mi,runs:runs});
    d.setDate(d.getDate()+7);
  }
  return out;
}
function cardioModel(){
  var ws=weeklyMilesSeries(52);
  var cwm=0,peak=0,series=[];
  ws.forEach(function(w){
    var tau=(w.mi>cwm)?3:6;
    cwm=cwm+(w.mi-cwm)*(1-Math.exp(-1/tau));
    if(cwm>peak)peak=cwm;
    series.push({w:w.w,cwm:cwm,mi:w.mi});
  });
  var last8=ws.slice(-8),weeksRun=last8.filter(function(w){return w.runs>0;}).length;
  var rhythm=0.55+0.45*(weeksRun/8);            /* 0.55 at nothing, 1.0 at every week */
  var recent=[],older=[];
  S.sessions.forEach(function(r){
    if(r.type!=="run"||!(r.paceSecPerMi>0)||!(r.distanceMi>=0.75))return;
    var ago=daysBetween(r.date,TODAY);
    if(ago<=90)recent.push(r.paceSecPerMi); else if(ago<=365)older.push(r.paceSecPerMi);
  });
  function med(a){if(!a.length)return null;var b=a.slice().sort(function(x,y){return x-y;});return b[Math.floor(b.length/2)];}
  var mr=med(recent),mo=med(older),paceBonus=0;
  if(mr&&mo&&mr<mo)paceBonus=Math.min(0.15,(mo-mr)/mo);
  var long8=0;last8.forEach(function(){});
  S.sessions.forEach(function(r){
    if(r.type!=="run"||!(r.distanceMi>0))return;
    if(daysBetween(r.date,TODAY)<=56&&r.distanceMi>long8)long8=r.distanceMi;
  });
  var longBonus=Math.min(0.15,long8/40);
  var score=levelScore({rhythm:rhythm,paceBonus:paceBonus,longBonus:longBonus},cwm);
  return {cwm:cwm,peak:peak,rhythm:rhythm,weeksRun:weeksRun,paceBonus:paceBonus,longBonus:longBonus,
          long8:long8,score:score,series:series,weekly:ws,medRecent:mr,medOlder:mo};
}
function milesLevelFloor(n){return n<=1?0:0.62*Math.pow(n-1,1.18);}
function milesLevelFor(score){var n=1;while(n<100&&score>=milesLevelFloor(n+1))n++;return n;}
function cardioLevel(){
  var m=cardioModel();
  var score=m.score,lvl=milesLevelFor(score);
  var lo=milesLevelFloor(lvl),hi=milesLevelFloor(lvl+1),span=Math.max(hi-lo,1);
  var pips=Math.max(0,Math.min(9,Math.floor(10*(score-lo)/span)));
  var back4=m.series.length>4?m.series[m.series.length-5].cwm:0;
  var lvl4=milesLevelFor(back4*m.rhythm);
  var r=(m.cwm-back4)/Math.max(back4,0.5);
  return {lvl:lvl,score:score,lo:lo,hi:hi,span:span,pips:pips,r:r,delta:lvl-lvl4,
          cwm:m.cwm,peak:m.peak,rhythm:m.rhythm,weeksRun:m.weeksRun,long8:m.long8,
          paceBonus:m.paceBonus,longBonus:m.longBonus,medRecent:m.medRecent,medOlder:m.medOlder,
          model:m,series:m.series.map(function(x){return {date:x.w,slow:x.cwm};}),
          sessions:allRuns().length};
}
