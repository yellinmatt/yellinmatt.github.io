.bpr{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden;margin:5px auto 0;width:64%}
.bpr i{display:block;height:100%;background:var(--accent);border-radius:2px;opacity:.75}
/* month labels positioned where the month actually starts */
.hmonths{position:relative;height:14px}
.hmonths span{position:absolute;top:0;font-size:10px;font-weight:700;color:var(--faint)}

/* v7.13 weigh-in history */
.wlab{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
.wwhen b{color:var(--ink);font-weight:700}
.wllist{max-height:46vh;overflow:auto;margin:4px 0 12px;-webkit-overflow-scrolling:touch}
.wlrow2{display:flex;align-items:center;gap:10px;padding:11px 2px}
.wlrow2+.wlrow2{border-top:1px solid var(--line)}
.wlrow2 .wld{flex:1;min-width:0;font-size:14px;font-weight:650;color:var(--ink)}
.wlrow2 .wlsub2{display:block;font-size:12px;font-weight:500;color:var(--faint);margin-top:2px}
.wlrow2 .wtag{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-tint);border-radius:4px;padding:2px 5px;margin-left:4px}
.wlrow2 .wlv{font-size:17px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;flex:none;min-width:56px;text-align:right}
.wlrow2 .wlb{flex:none;width:36px;height:36px;border-radius:10px;background:var(--surface-2);color:var(--sub);display:inline-flex;align-items:center;justify-content:center;border:0}
.wlrow2 .wlb svg{width:17px;height:17px}
.wlrow2 .wlb.dang{color:var(--accent)}
.wbtn.accent{background:var(--accent);color:var(--white)}

/* v7.13 */
.rerr{font-size:13px;line-height:1.45;color:var(--accent);font-weight:600;background:var(--accent-tint);border-radius:10px;padding:9px 11px;margin:8px 0 2px}

/* v7.13 video diagnostic */
.vdiag{margin:12px 0 4px}
.vdiag .vdl{font-size:12.5px;font-weight:800;letter-spacing:.04em;color:var(--ink);margin-bottom:6px}
.vdiag .vdn{font-size:12px;color:var(--faint);margin-top:5px}
.vdiag iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000;display:block}

/* v7.14: a partially-met day is amber, never a green tick */
.wlsub b{color:var(--ink);font-weight:700}

/* v7.15: the circle is the plan's movement, the pip is the morning anchor */
.dot{position:relative}
.dot .dan{display:block;width:6px;height:6px;border-radius:50%;margin:5px auto 0;background:var(--line-2)}
.dot .dan.on{background:var(--good)}

.vdst{font-size:11px;font-weight:800;letter-spacing:.03em;padding:2px 6px;border-radius:5px;background:var(--surface-2);color:var(--faint);margin-left:6px}
.vdst.good{background:var(--good-tint);color:var(--good)}
.vdst.bad{background:var(--accent-tint);color:var(--accent)}
.vesc.loud{display:block;background:var(--accent);color:var(--white);font-weight:750;text-align:center;padding:12px;border-radius:11px;margin-top:8px;text-decoration:none}

.dfield{width:100%;height:42px;border-radius:11px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);padding:0 12px;font-size:14.5px;font-weight:650;font-family:inherit}

/* v7.17. Ratio box on a plain div, because Safari does not reliably honour aspect-ratio on a
   <button> and the preview collapsed to nothing on iOS. */
.vratio{position:relative;width:100%;padding-top:56.25%;display:block;overflow:hidden;border-radius:var(--r-card) var(--r-card) 0 0}
.vratio>.vface{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;flex-direction:column;gap:8px}
.vfl{font-size:12px;font-weight:750;letter-spacing:.02em;color:var(--sub)}

/* ============ v7.18 CONTROLS, built to the exemplar pass ============ */
/* Switch. Material Design 3 geometry verbatim: track 52x32, full radius, 2px outline; handle 16
   unselected growing to 24 selected. The growth is deliberate, because the HIG forbids relying on
   colour alone and thumb travel plus size gives two channels that do not need colour vision. */
.sw{width:52px;height:32px;flex:none;border-radius:999px;background:var(--surface-2);
    border:2px solid var(--line-2);position:relative;padding:0;transition:background .18s ease,border-color .18s ease}
.sw .swt{position:absolute;top:50%;left:5px;width:16px;height:16px;border-radius:999px;background:var(--faint);
    transform:translateY(-50%);transition:left .18s cubic-bezier(.2,.7,.3,1),width .18s ease,height .18s ease,background .18s ease}
.sw.on{background:var(--accent);border-color:var(--accent)}
.sw.on .swt{left:22px;width:24px;height:24px;background:var(--white)}
.sw:active .swt{width:28px;height:28px}
/* Grouped inset list, the iOS Settings structure. Label above, rows in a rounded card with the
   divider inset to the text column, explanation in a footnote UNDER the group rather than inside
   the row, which is what lets every row stay one line. */
.sgt{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:20px 4px 8px}
.sgc{background:var(--surface);border:1px solid var(--line);border-radius:15px;overflow:hidden}
.sgf{font-size:12.5px;line-height:1.55;color:var(--faint);margin:8px 6px 0}
.sgf b{color:var(--sub);font-weight:700}
.srow{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:9px 14px;background:none;border:0;text-align:left}
.srow+.srow{position:relative}
.srow+.srow::before{content:"";position:absolute;left:14px;right:0;top:0;height:1px;background:var(--line)}
.srow .srl{flex:1;min-width:0;font-size:15px;font-weight:600;color:var(--ink)}
.srow .src{flex:none;display:flex;align-items:center;gap:8px}
.srow.wide{flex-direction:column;align-items:stretch;gap:9px}
.srow.wide .src{width:100%}
.srow.wide .seg{width:100%}
.snav{cursor:pointer}
.snav .snv{font-size:14px;color:var(--sub);font-weight:600}
.snav .snc{display:inline-flex;color:var(--faint);transform:rotate(-90deg)}
.snav .snc svg{width:18px;height:18px}
.snav.dang .srl{color:var(--accent)}
.srow .stp{max-width:none}
.srow .seg{max-width:none}
.scad .caddot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--faint)}
.scad[data-rag="good"] .caddot{background:var(--good)}
.scad[data-rag="amber"] .caddot{background:var(--amber)}
.scad[data-rag="red"] .caddot{background:var(--accent)}
.scad[data-rag="none"] .caddot{background:var(--line-2)}
.minibtn{height:34px;padding:0 13px;border-radius:10px;background:var(--surface-2);color:var(--ink);font-size:13.5px;font-weight:700;border:0}

/* v7.19. The Units segment collapsed to 38px with 13px buttons, because .seg button is flex:1 with
   no minimum and the row's control column is flex:none, so a two-letter label shrank to the width
   of two letters. That is both ugly and under Apple's 44pt minimum touch target. Every control in
   the right-hand column now shares one minimum width, so the column is a line rather than a ragged
   edge, and no button can shrink below a thumb. */
.srow .src{min-width:132px;justify-content:flex-end}
.srow .seg{min-width:132px}
.srow .seg button{min-width:58px;padding:0 14px}
.srow .stp{min-width:132px;justify-content:space-between}
.srow.wide .src,.srow.wide .seg{min-width:0}
.srow.wide .seg button{min-width:0}
.srow .sw{margin-right:0}

/* v7.20 vetting row on a video card */
.vvet{display:flex;gap:6px;padding:0 12px 12px}
.vvb{flex:1;height:34px;border-radius:9px;background:var(--surface-2);color:var(--sub);font-size:12.5px;font-weight:700;border:0}
.vvb.good{background:var(--good-tint);color:var(--good)}
.vvb.bad{background:var(--accent-tint);color:var(--accent)}

/* v7.22 movements as a two-column grid */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px 12px}
.mcard{position:relative;text-align:left;background:var(--surface-2);border:1px solid transparent;border-radius:13px;padding:12px 12px 11px;display:block}
.mcard.untrained{opacity:.72}
.mcard .mcn{display:block;font-size:13.5px;font-weight:750;color:var(--ink);line-height:1.25;margin-bottom:6px;padding-right:22px}
.mcard .mcw{display:block;font-size:15px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.mcard .mcl{display:block;font-size:11.5px;color:var(--faint);margin-top:3px;line-height:1.35}
.mcard .mcp{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.03em;color:var(--good);background:var(--good-tint);border-radius:5px;padding:2px 6px;margin-top:6px}
.mcard .mcplay{position:absolute;top:10px;right:10px;width:18px;height:18px;color:var(--faint);display:inline-flex}
.mcard .mcplay svg{width:18px;height:18px}
/* v7.22 library as a grid of category cards */
.libgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 0 10px}
.libtile{text-align:left;background:var(--surface-2);border:1px solid transparent;border-radius:13px;padding:13px 13px 12px}
.libtile.on{border-color:var(--accent);background:var(--accent-tint)}
.libtile .ltn{display:block;font-size:14px;font-weight:750;color:var(--ink)}
.libtile .ltd{display:block;font-size:11.5px;color:var(--faint);margin-top:2px}
.libtile .ltc{display:block;font-size:11px;font-weight:700;color:var(--sub);margin-top:8px}
.libtile .ltc.gd{color:var(--good)}
.libpane{margin-top:6px}

/* v7.23 */
.altcard{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--surface-2);border:1px dashed var(--line-2);border-radius:13px;padding:12px 13px;margin-top:10px}
.altcard .aci{width:20px;height:20px;color:var(--sub);flex:none;display:inline-flex}
.altcard .aci svg{width:20px;height:20px}
.altcard .acm{flex:1;min-width:0}
.altcard .acn{display:block;font-size:14px;font-weight:750;color:var(--ink)}
.altcard .acd{display:block;font-size:12px;color:var(--faint);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.altcard .aca{width:18px;height:18px;color:var(--faint);flex:none;display:inline-flex}
.altcard .aca svg{width:18px;height:18px}
.lstat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.ls3{background:var(--surface-2);border-radius:11px;padding:11px 12px}
.ls3 b{display:block;font-size:19px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.ls3 span{display:block;font-size:11px;font-weight:600;color:var(--faint);margin-top:2px}
.dlbar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:7px}
.dlbar i{display:block;height:100%;background:var(--amber);border-radius:3px}
.odosplit{height:1px;background:var(--line);margin:16px 0 12px}
.odoct{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.odofoot{font-size:12px;color:var(--faint);margin-top:10px}
.rrow .rdate{flex:0 0 92px}
.badge .bdot{width:52px!important;height:52px!important}
.badge .bdot svg{width:23px;height:23px}
.badge .bn{font-size:13px}

/* v7.23 pace zones: a verdict, a distribution, then the ranges */
.pzhead{font-size:17px;font-weight:800;letter-spacing:-.02em;color:var(--ink);margin-bottom:6px}
/* v7.33 THE ACCENT SYSTEM. Matthew: "the accents on the data should be the colour reflected in the
   status." Three defects sat behind that.
   1. The app had TWO tone vocabularies. The scorecard has spoken good/amber/red/none through a
      `--rag` custom property since v7.5; the drawer cards spoke a separate warn/good, so a card
      could not express amber at all and a genuinely bad state rendered the same amber as a mild
      drift. The scorecard's vocabulary wins, because it was already right, and `--rag` now carries
      the tone down to every accented element in the card.
   2. Every verdict-bearing call site SWALLOWED its own verdict: `tone==="red"?"warn":""` throws
      away amber AND good, so sleep holding and steps rising could never be green no matter what
      the card computed. The verdict is passed through whole now.
   3. The colour never reached the DATA. Only the headline sentence was tinted; the chip, the
      current bar and the headline number stayed neutral ink, which is exactly the accent he is
      asking for. */
.pzhead[data-tone]{color:var(--rag,var(--ink))}
.pzline{font-size:13.5px;line-height:1.6;color:var(--sub)}
.pzline b{color:var(--ink);font-weight:700}
.pzbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface-2);margin:14px 0 12px}
.pzbar .pz{height:100%}
.pz[data-z="faster"],.pzr[data-z="faster"] .pzd{background:#C2410C}
.pz[data-z="tempo"],.pzr[data-z="tempo"] .pzd{background:var(--accent)}
.pz[data-z="steady"],.pzr[data-z="steady"] .pzd{background:var(--amber)}
.pz[data-z="easy"],.pzr[data-z="easy"] .pzd{background:var(--good)}
.pz[data-z="long"],.pzr[data-z="long"] .pzd{background:var(--good);opacity:.55}
.pzr{display:flex;align-items:center;gap:9px;padding:8px 0}
.pzr+.pzr{border-top:1px solid var(--line)}
.pzr .pzd{width:9px;height:9px;border-radius:3px;flex:none}
.pzr .pzn{font-size:13.5px;font-weight:700;color:var(--ink);flex:0 0 54px}
.pzr .pzp{font-size:12.5px;font-weight:600;color:var(--sub);flex:0 0 92px}
.pzr .pzb{flex:1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;min-width:20px}
.pzr .pzb i{display:block;height:100%;background:var(--faint);border-radius:3px}
.pzr[data-z="easy"] .pzb i{background:var(--good)}
.pzr[data-z="long"] .pzb i{background:var(--good);opacity:.55}
.pzr[data-z="steady"] .pzb i{background:var(--amber)}
.pzr[data-z="tempo"] .pzb i,.pzr[data-z="faster"] .pzb i{background:var(--accent)}
.pzr .pzc{font-size:13px;font-weight:800;color:var(--ink);flex:0 0 22px;text-align:right}

/* v7.24 */
.prcard{padding:14px 16px 15px}
.prcard .prct{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.prcard .prbar{margin:0}
.lvhist{margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.lvht{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
.lvhs{width:100%;height:64px;display:block}
.lvhr{display:flex;align-items:baseline;gap:10px;font-size:11.5px;color:var(--faint);margin-top:5px}
.lvhr span:nth-child(2){flex:1;text-align:center;color:var(--sub);line-height:1.45}
.lvhr b{color:var(--ink);font-weight:750}
.yrow{display:flex;align-items:center;gap:9px;padding:7px 0}
.yrow+.yrow{border-top:1px solid var(--line)}
.yrow .yy{font-size:13px;font-weight:750;color:var(--ink);flex:0 0 38px}
.yrow .yb{flex:1;height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden;min-width:24px}
.yrow .yb i{display:block;height:100%;background:var(--accent);border-radius:4px;opacity:.8}
.yrow .ym{font-size:13px;font-weight:800;color:var(--ink);flex:0 0 58px;text-align:right;font-variant-numeric:tabular-nums}
.yrow .yn{font-size:11.5px;color:var(--faint);flex:0 0 52px;text-align:right}

/* v7.25 consistency */
.conscard{padding:15px 16px 14px}
.consh{display:flex;align-items:baseline;margin-bottom:10px}
.consh .const{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.consh .consv{margin-left:auto;font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
.consh .consv small{font-size:12px;color:var(--sub);font-weight:700}
.consgrid{display:grid;grid-template-columns:repeat(28,1fr);gap:3px}
.consgrid i{display:block;aspect-ratio:1;border-radius:2px;background:var(--surface-2)}
.consgrid i[data-l="1"]{background:var(--amber);opacity:.75}
.consgrid i[data-l="2"]{background:var(--good)}
.consl{font-size:13.5px;line-height:1.55;color:var(--sub);margin-top:11px}
.consl b{color:var(--ink);font-weight:700}
.consk{display:flex;align-items:center;gap:14px;margin-top:10px;font-size:11px;font-weight:600;color:var(--faint)}
.consk span{display:inline-flex;align-items:center;gap:5px}
.consk i{width:8px;height:8px;border-radius:2px;display:inline-block}
.consk i[data-l="1"]{background:var(--amber);opacity:.75}
.consk i[data-l="2"]{background:var(--good)}
.consk .conss{margin-left:auto;color:var(--accent);font-weight:750}
</style>
</head>
<body>
<div class="app">
  <section class="view on" id="v-today"></section>
  <section class="view" id="v-workout">
    <div class="ptop">
      <button class="back" onclick="closeWorkout()" aria-label="Back to today"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Today</button>
      <button class="wtime" onclick="togglePause()" aria-label="pause or resume timer"><span id="wo-pico" aria-hidden="true"></span><span class="num" id="wo-elapsed">0:00</span></button>
      <button class="fin" onclick="finishWorkout()">Finish</button>
    </div>
    <div id="wo-body"></div>
  </section>
  <section class="view" id="v-run">
    <div class="ptop">
      <button class="back" onclick="show('today')" aria-label="Back to today"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Today</button>
      <div class="mid" style="color:var(--sub);font-weight:600">Run</div><div style="width:44px"></div>
    </div>
    <div id="run-body"></div>
  </section>
  <section class="view" id="v-lift"></section>
  <section class="view" id="v-cardio"></section>
  <section class="view" id="v-track"></section>
  <section class="view" id="v-generate"></section>
</div>

<div class="restbar" id="restbar" role="timer" aria-label="Rest timer">
  <div><div class="rt num" id="rest-t">1:30</div><div class="rlab">Rest</div></div>
  <div class="bar"><i id="rest-fill"></i></div>
  <button class="rb" onclick="bumpRest(-15)">-15</button>
  <button class="rb" onclick="bumpRest(15)">+15</button>
  <button class="rb skip" onclick="endRest()">Skip</button>
</div>
<div class="toast" id="toast"><span class="tm" id="toast-m"></span><button class="tu" id="toast-u">Undo</button></div>
<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<nav class="nav" id="nav">
  <button data-nav="today" class="on" onclick="show('today')"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9h12v-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Today</span></button>
  <button data-nav="lift" onclick="show('lift')"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Lift</span></button>

/* ============ EQUIPMENT PER SESSION (Round D) ============
   Equipment is a property of the session, not of you. A global "bodyweight or dumbbell" mode was
   wrong because a Monday with dumbbells and a Thursday without are the same person in a different
   room, and a mixed session had nowhere to live at all. So each built session carries its own
   equipment list; the profile only supplies the default for the next one. Any single movement can
   still be swapped inside the workout, which is what makes mixed sessions work. */
function defaultEquip(){var e=(S.profile.equip||["BW"]).slice();if(!e.length)e=["BW"];return e;}
function sessionEquip(w){w=w||S.wk[TODAY];return (w&&w.equip&&w.equip.length)?w.equip:defaultEquip();}
function hasDB(eq){return (eq||[]).indexOf("DB")>=0;}
function trainMode(w){return hasDB(sessionEquip(w))?"db":"bw";}
function slotEx(sl,eq){
  eq=eq||defaultEquip();
  var order=[];
  if(hasDB(eq)&&sl.db)order.push(sl.db);
  if(eq.indexOf("bar")>=0&&sl.bar)order.push(sl.bar);
  if(eq.indexOf("band")>=0&&sl.band)order.push(sl.band);
  if(sl.none)order.push(sl.none);
  order.push(sl.bw);
  function ok(id){
    var e=LIB[id];if(!e)return false;
    if(e.equip==="band")return eq.indexOf("band")>=0;
    if(e.equip==="bar")return eq.indexOf("bar")>=0;
    if(e.equip==="DB"||e.equip==="dumbbell")return hasDB(eq);
    return true; /* "none" or pure bodyweight */
  }
  for(var i=0;i<order.length;i++){if(ok(order[i]))return order[i];}
  /* Nothing in this slot is doable with the kit declared. Returning the template default anyway
     would prescribe a pull-up to someone in a hotel room, so the slot is dropped instead. */
  return null;
}
function equipLabel(eq){
  eq=eq||defaultEquip();
  var names={DB:"dumbbells",BW:"bodyweight",band:"bands",bar:"pull-up bar"};
  var out=eq.map(function(k){return names[k]||k;});
  if(out.length===1)return out[0];
  if(out.length===2)return out[0]+" and "+out[1];
  return out.slice(0,-1).join(", ")+" and "+out[out.length-1];
}
/* Change the kit for THIS session only, and rebuild it around what is actually in the room. */
/* Named scenarios rather than a checkbox soup. You are almost never assembling equipment from
   scratch: you are in one of a handful of places, and each place has a known kit. Pick the place,
   then adjust if something is missing. The scenario list stays short on purpose. */
var EQ_SCENES=[
  {id:"home",n:"Home, bodyweight",d:"Nothing but the floor",eq:["BW"]},
  {id:"bands",n:"Home, plus bands",d:"Bodyweight and resistance bands",eq:["BW","band"]},
  {id:"light",n:"Light dumbbells",d:"A fixed pair, 15 to 25",eq:["BW","DB"]},
  {id:"adj",n:"Adjustable dumbbells",d:"A pair you can load up",eq:["BW","DB"],adj:true},
  {id:"full",n:"Full home setup",d:"Dumbbells, bands and a bar",eq:["BW","DB","band","bar"],adj:true},
  {id:"gym",n:"A real gym",d:"Everything, loaded properly",eq:["BW","DB","band","bar"],adj:true},
  {id:"travel",n:"Travelling",d:"Hotel room, no kit",eq:["BW"]}
];
function currentScene(){
  var eq=sessionEquip().slice().sort().join(","),adj=!!S.profile.adjustable;
  for(var i=0;i<EQ_SCENES.length;i++){
    var sc=EQ_SCENES[i];
    if(sc.eq.slice().sort().join(",")===eq&&(!!sc.adj)===adj)return sc.id;
  }
  return null;
}
function equipSheet(){
  var cur=sessionEquip().slice(),now=currentScene();
  var scenes=EQ_SCENES.map(function(sc){
    return '<button class="opt'+(sc.id===now?" sel":"")+'" onclick="pickScene(\''+sc.id+'\')"><span class="oi">'+(sc.eq.indexOf("DB")>=0?I.dumbbell:I.bolt)+'</span>'+
      '<span><div class="on2">'+sc.n+'</div><div class="oc">'+sc.d+'</div></span>'+
      '<span class="oar">'+(sc.id===now?I.check:I.arrow)+'</span></button>';
  }).join("");
  var opts=[["BW","Bodyweight"],["DB","Dumbbells"],["band","Bands"],["bar","Pull-up bar"]];
  var chips=opts.map(function(o){
    return '<button class="eqchip'+(cur.indexOf(o[0])>=0?" on":"")+'" onclick="toggleSessEquip(this,\''+o[0]+'\')">'+o[1]+'</button>';
  }).join("");
  openSheet('<div class="grab"></div><h3>What have you got today?</h3>'+
    '<div class="ssub">Pick where you are. This changes today\'s session only, never the plan.</div>'+
    scenes+
    /* v7.22. The chips are not a second way of doing the same thing, they are what a preset SETS,
       so they are labelled as such instead of reading as a duplicate list. And "Can you add weight"
       was a two-button segment for a plain yes/no, which is the control the exemplar pass retired. */
    '<div class="sectlbl" style="margin:16px 2px 6px">What that gives you</div>'+
    '<div class="ssub" style="margin:0 0 8px">A preset just ticks these. Change any of them and the preset above unselects itself.</div>'+
    '<div class="eqchips" id="eqchips" style="margin:0 0 4px">'+chips+'</div>'+
    sgroup("", srow('Adjustable dumbbells',swCtl(!!S.profile.adjustable,"frAdjSw(this)")),
      "With adjustable dumbbells the plan adds weight; without them it adds reps.")+
    '<button class="sheet-cta" onclick="applySessEquip()">Rebuild today</button>'+
    '<button class="sheet-cta ghost" onclick="closeSheet()">Cancel</button>');
  EQ_PICK=cur;
}
function pickScene(id){
  var sc=null;EQ_SCENES.forEach(function(x){if(x.id===id)sc=x;});
  if(!sc)return;
  EQ_PICK=sc.eq.slice();S.profile.adjustable=!!sc.adj;
  applySessEquip();
}
function frAdjSess(v,btn){S.profile.adjustable=v;save();segSel(btn);}

var EQ_PICK=null;
function toggleSessEquip(btn,k){
  EQ_PICK=EQ_PICK||sessionEquip().slice();
  var i=EQ_PICK.indexOf(k);
  if(i>=0){if(EQ_PICK.length>1){EQ_PICK.splice(i,1);btn.classList.remove("on");}}
  else{EQ_PICK.push(k);btn.classList.add("on");}
}
function applySessEquip(){
  var eq=(EQ_PICK&&EQ_PICK.length)?EQ_PICK.slice():defaultEquip();

/* Three states about the body, four non-states about the DATA. Never more. */
function trendState(){

/* ---- MILESTONES ----

   would be crossed and un-crossed by hydration alone. */
/* ============ THE EFFORT WINDOW, v7.27 ============
   The milestone system was anchored on `S.weigh[0]` — the OLDEST weigh-in in the record — and
   judged "reached" on the minimum trend across all of it. That was harmless on a four-month record
   and fatal on a five-year one. His first weigh-in is 14 May 2022 at 185 lb and his trend passed
   through 180 in January 2023, so on the live store the app had quietly marked EVERY milestone
   down to the 180 goal as reached and `nextMilestone()` returned null. He is 188.8. The one card
   whose whole job is to show progress toward a goal was switched off, and nothing said so.
   An effort is the stretch of weigh-ins since the last gap longer than 120 days. It is a FIXED
   date rather than a rolling window, so a mark reached inside the effort can never un-reach itself
   as time passes, which was the original design's good idea and is kept.
   Reached is still judged on the effort's best TREND, never a raw reading, so one dehydrated
   morning cannot ratchet a mark. But the NEXT mark is judged on where he is TODAY, because a
   target you passed sixteen months ago and have since regained is not a target. History stays on
   the card as evidence, underneath. */

function effortMin(tr){
  var e=effortTrend(tr);if(!e.length)return {v:null,date:null};

function effortHigh(tr){

function milestoneLadder(){

  if(dist<=0.5)return [goal];

/* Reached is judged on the MINIMUM TREND, never on the best raw weigh-in. One dehydrated morning
   must not ratchet a milestone permanently and leave him "un-losing" a pound he never lost. The set
   of reached marks is monotone, so a milestone can never un-complete, and it needs no stored state,
   so it survives an export, an import and a cleared cache. */
/* The next mark is the highest one BELOW where the trend sits today. Was: the highest one below
   the all-time best trend, which on a long record is a mark he passed years ago. */
function nextMilestone(){
  var st=weightStats();if(!st)return null;

function monthThird(d){var day=d.getDate();return day<=10?"early":day<=20?"mid":"late";}

  }

    return '<div class="anote" style="margin-top:10px">Next mark <b>'+mark+' '+wLbl()+'</b>, '+d.toFixed(1)+' '+wLbl()+' away. No date until the trend has a direction.</div>';
  var a=Math.abs(st.rate);
  if(a<=st.se)return '<div class="anote" style="margin-top:10px">Next mark <b>'+mark+' '+wLbl()+'</b>, '+d.toFixed(1)+' '+wLbl()+' away.</div>';

  else if(mName(df)===mName(ds))when="somewhere from "+monthThird(df)+" to "+monthThird(ds)+" "+mName(df);

function chartW(){

function trendChart(){

/* ---- THE READOUT ----

function weightCardHTML(){
  var st=weightStats();

  if(!st)return '<div class="card">'+head+'<div class="anote" style="margin-top:2px">Log a weigh-in to start tracking toward '+S.profile.goalLb+'.</div></div>';

  else if(t.state==="up"){title="Trending up";tone="up";}
  else if(t.state==="flat"){title="Holding steady";tone="flat";}
  else if(t.state==="thin"){title="Not enough weigh-ins yet";tone="thin";}
  else if(t.state==="gone"){title="Nothing logged for "+st.ageDays+" days";tone="thin";}

/* The ladder itself, as a row of marks. Reached is monotone, so this is a record rather than a

function ladderHTML(){
  var st=weightStats();if(!st)return "";
  var lad=milestoneLadder();if(lad.length<2)return "";
  var nx=nextMilestone();
  var pips=lad.slice().reverse().map(function(m){
    var done=(st.minTrend<=m+0.001),isNext=(m===nx),above=(st.trend>m+0.001);
    if(done&&above)return '<span class="mpip done back'+(isNext?" next":"")+'" title="'+m+' '+wLbl()+', reached earlier in this run"></span>';
    return '<span class="mpip'+(done?" done":"")+(isNext?" next":"")+'" title="'+m+' '+wLbl()+'"></span>';
  }).join("");
  /* v7.27. The count is what he HOLDS today, not what he has ever touched. Reached-ever was the
     headline until this pass and it read "5 of 7" at 188.8 lb, which counts two marks he is
     currently above. Held is the headline; reached is the evidence, and it moves to the footnote
     with its date so a mark earned in 2024 cannot read as this morning. */

  var ever=lad.filter(function(m){return st.minTrend<=m+0.001;}).length;
  var foot=lad[lad.length-1]+' '+wLbl()+' goal, in steps of '+(Math.round((lad[0]-lad[1])*10)/10);

    '<div class="mladr">'+pips+'</div>'+

function isoWeek(k){var p=k.split("-");var d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));var day=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-day+3);var f=new Date(Date.UTC(d.getUTCFullYear(),0,4));var w=1+Math.round(((d-f)/86400000-3+((f.getUTCDay()+6)%7))/7);return d.getUTCFullYear()+"-W"+("0"+w).slice(-2);}

/* ============ ADAPTIVE COACH (Batch 4) ============

   the two things that make a program adapt rather than merely increment: how hard the last few
   sessions felt, and how long you have been away. Autoregulation is the standard traffic-light
   model, green pushes, amber holds, red backs off, driven by logged session RPE rather than by
   how you say you feel today. Deload is detected from accumulated load, not from the calendar,
   because a light fortnight should not earn you a rest week. */
function recentLiftRPE(n){
  n=n||3;var out=[];
  for(var i=S.sessions.length-1;i>=0&&out.length<n;i--){

function daysSinceLift(){

/* green: push. amber: hold and repeat. red: back off a step. layoff: rebuild, no judgement. */
function coachState(){

  if(gap!=null&&gap>=14)return {k:"layoff",gap:gap,
    t:"Back after "+gap+" days",d:"Loads are pulled back a step for the first session or two. This is a ramp, not a reset."};
  var lifted=S.sessions.filter(function(x){return x.type==="lift";}).length;
  if(!rec.length&&lifted>=3)
    return {k:"green",t:"Push, unguided",d:"No effort ratings on your last sessions, so this is running blind. Tap a number when you finish and the coach starts adjusting loads for you."};
  if(!rec.length)return {k:"green",t:"Push",d:"Nothing logged yet, so the plan starts conservative and moves up as you finish sets."};
  var avg=rec.reduce(function(a,x){return a+x.rpe;},0)/rec.length;
  if(avg>=9)return {k:"red",avg:avg,t:"Back off",d:"Your last "+rec.length+" sessions averaged RPE "+avg.toFixed(1)+". Loads hold and volume drops until that comes down."};
  if(avg>=8.2)return {k:"amber",avg:avg,t:"Hold",d:"Averaging RPE "+avg.toFixed(1)+". Repeat these loads and earn the jump rather than forcing it."};
  return {k:"green",avg:avg,t:"Push",d:"Averaging RPE "+avg.toFixed(1)+", which is room to add. Take the top of the rep range, then add load."};

/* Accumulated load over four weeks decides the deload, so a quiet stretch does not trigger one. */
function deloadState(){

  var vals=ks.map(function(k){return by[k];});

  var rising=vals[3]>=vals[0]&&vals[0]>0;

function liftDelta(L){
  var ser=L.series||[];if(ser.length<8)return null;
  var now=ser[ser.length-1],prev=ser[ser.length-8];if(!now||!prev)return null;
  var a=now.slow||0,b=prev.slow||0;
  if(!a&&!b)return null;
  var d=a-b;
  return {d:d,dir:(Math.abs(d)<0.15)?"flat":(d>0?"up":"down")};
}

  var dl=liftDelta(L);if(!dl)return "";

function applyProgression(o,sets){var t=S.progress[o.exId]||{low:o.low,high:o.high,weight:o.weight};
  /* Autoregulation gates the increase: the same finished sets progress differently depending on
     how the recent block has actually felt. */
  var cs=coachState();
  if(cs.k==="red"||cs.k==="layoff"){
    t.low=o.low;t.high=o.high;
    t.weight=(o.bw||!S.profile.adjustable)?o.weight:Math.max(0,(parseFloat(o.weight)||0)-inc());
    t.ladderStep=(o.bw||!S.profile.adjustable)?"reps":"load";S.progress[o.exId]=t;return;
  }
  if(cs.k==="amber"){t.low=o.low;t.high=o.high;t.weight=o.weight;t.ladderStep="hold";S.progress[o.exId]=t;return;}
  var allHigh=sets.length>0&&sets.every(function(s){return (s.reps||0)>=o.high;});
  var repMode=(o.bw||!S.profile.adjustable);
  if(allHigh){if(repMode){var ceil=(o.unit==="s")?90:20,step=(o.unit==="s")?10:2;if(o.high<ceil){t.low=o.high;t.high=o.high+step;}else{t.note="graduate";}t.weight=o.weight;}else{t.weight=(parseFloat(o.weight)||0)+inc();t.low=8;t.high=12;}}
  else{t.low=o.low;t.high=o.high;t.weight=o.weight;}
  t.ladderStep=repMode?"reps":"load";S.progress[o.exId]=t;}

function parseTime(t){t=(""+(t||"")).trim();if(!t)return null;if(t.indexOf(":")>=0){var p=t.split(":");var m=parseInt(p[0])||0,s=parseInt(p[1])||0;if(s>59)s=59;return m*60+s;}var n=parseFloat(t);if(isNaN(n))return null;return Math.round(n*60);}
function calcPace(){var d=parseFloat((document.getElementById("r-dist")||{}).value),sec=parseTime((document.getElementById("r-time")||{}).value),el=document.getElementById("r-pace");if(!el)return;el.textContent=(d>0&&sec>0)?mmss(Math.round(sec/d)):"--:--";}

/* v7.13. This accepted anything parseFloat would swallow and SILENTLY closed on anything it would
   not, so a typo lost the run with no message and "12abc" logged as 12 miles. Both inputs are
   validated against a stated range now, the sheet says what is wrong instead of vanishing, and the
   session id is content-keyed rather than the bare date, which is the same id/date collision that
   produced the deleteDay orphan: two runs on one day used to overwrite each other. */
function runError(msg){
  var el=document.getElementById("r-err");
  if(el){el.textContent=msg;el.style.display=msg?"block":"none";}
  else if(msg)toast(msg,null);
}
function validDist(raw){
  /* Same rule as validWeight: reject, never strip. "12abc" is a typo, not twelve miles. */
  var t=String(raw==null?"":raw).trim();
  if(!/^\d{1,3}(\.\d{1,2})?$/.test(t))return null;
  var v=parseFloat(t);
  if(!isFinite(v)||v<=0||v>200)return null;
  return Math.round(v*100)/100;
}
function saveRun(){
  var d=validDist((document.getElementById("r-dist")||{}).value);
  if(d==null){runError("Enter a distance between 0.1 and 200 "+(U()==="kg"?"km":"mi")+".");return;}
  var tRaw=((document.getElementById("r-time")||{}).value||"").trim();
  var sec=tRaw?parseTime(tRaw):0;
  if(tRaw&&(sec==null||!(sec>0))){runError("Time should look like 22:40.");return;}
  if(sec>86400){runError("That is over 24 hours. Check the time.");return;}
  if(sec>0){
    var pace=sec/d;
    /* A 2:00/mi pace or a 45:00/mi pace is a typo, not a run. Refuse rather than poison the pace
       zones, the level and every average with one bad row. */
    if(pace<150){runError("That works out at "+mmss(Math.round(pace))+" a mile. Check the distance and time.");return;}
    if(pace>3600){runError("That works out at "+mmss(Math.round(pace))+" a mile. Check the distance and time.");return;}
  }
  runError("");
  var paceStr=sec>0?mmss(Math.round(sec/d)):"--:--";
  S.runs[TODAY]={dist:d,time:tRaw||"--",pace:paceStr,rpe:rpeRun};
  var id=TODAY+"-run-"+Math.round(sec)+"-"+Math.round(d*100);
  S.sessions=S.sessions.filter(function(x){return !(x.date===TODAY&&x.type==="run");});
  S.sessions.push({id:id,date:TODAY,type:"run",distanceMi:d,durationSec:sec||0,paceSecPerMi:sec>0?Math.round(sec/d):0,rpe:rpeRun,notes:""});
  S.sessions.sort(function(a,b){return (a.date+"|"+a.id)<(b.date+"|"+b.id)?-1:1;});
  S.done[TODAY]=true;advanceCycle();save();closeSheet();
  setTimeout(function(){coolSheet("run");},900);
  if(rpeRun==="Hard")toast("Logged. Keep easy runs easy - that protects your lifting.",null);
  else toast("Logged "+d.toFixed(2).replace(/\.?0+$/,"")+" mi"+(sec>0?" at "+paceStr+"/mi":"")+".",null);
  renderRun();
}

/* ============ WEIGH-IN HISTORY, v7.13 ============
   Matthew entered 189.8 and the card showed 189.1, so he concluded the app had recorded the wrong
   number and went looking for a way to correct it. Two separate failures behind that.
   ONE, a labelling failure that is mine. v7.8 made the hero the TREND, which is the right number to
   lead with, but it was labelled only by a small line underneath. A number you just typed, shown
   back to you smaller than a different number you did not type, reads as a bug however correct the
   maths is. The hero now says TREND on it, and the scale reading says exactly what it is.
   TWO, a genuine gap: there was no way to edit or delete any weigh-in except today's. A log you

function weighLogSheet(){

        '<span class="wlsub2">trend '+t.v.toFixed(1)+(d!=null?' &middot; '+(d>0?'+':'')+d.toFixed(1)+' vs '+(gap===1?'the day before':gap+' days earlier'):' &middot; first reading')+'</span></div>'+
      '<div class="wlv num">'+w.w.toFixed(1)+'</div>'+

  }).join("");

/* One validator for every weight field, so a stray letter, an empty box or a fat-fingered 1898
   cannot enter the record. Returns null when the value is not a usable weight. */
function validWeight(raw){
  /* v7.13a. The first version STRIPPED non-numeric characters instead of rejecting them, so "18a9"
     became 189 and "-3" became 3. Stripping is how garbage gets in wearing a clean shirt. The whole
     string has to be a plain positive number or it is refused. */
  var t=String(raw==null?"":raw).trim();
  if(!/^\d{1,3}(\.\d{1,2})?$/.test(t))return null;
  var v=parseFloat(t);
  if(!isFinite(v))return null;
  var lo=(U()==="kg")?23:50, hi=(U()==="kg")?317:700;
  if(v<lo||v>hi)return null;
  return Math.round(v*10)/10;
}
function weighSheet(dateK){
  /* v7.16. This always wrote to TODAY and silently replaced whatever was already there, so logging
     a second reading destroyed the first and there was no way to add a missed day at all. The sheet
     now carries a DATE, defaulting to today, and if that date already holds a reading it says so
     and makes replacing an explicit choice rather than a side effect.
     One reading per date is deliberate and stays: the smoother steps per elapsed day and the OLS
     fit treats each date as one observation, so two values on one date would have to be silently
     averaged somewhere. Editing and deleting live in the history, which is the right place. */
  var d=dateK||TODAY;
  var lw=lastW(),start=(lw!=null?lw:(U()==="kg"?80:180));
  var existing=null;S.weigh.forEach(function(x){if(x.date===d)existing=x;});
  if(existing)start=existing.w;
  /* One weight per day, Matthew's rule as of 30 July, so re-saving a date simply updates it. The
     toast still names what it replaced and offers an undo, because overwriting is fine and
     overwriting SILENTLY is what made this look broken. */
  var sub=existing
    ? ('<b>'+fullDate(d)+'</b> is logged at <b>'+existing.w.toFixed(1)+' '+wLbl()+'</b>. Saving updates it.')
    : (lw!=null?('Last was <b>'+lw.toFixed(1)+' '+wLbl()+'</b>. Morning scale, one number a day.'):'Morning scale. One number a day.');
  openSheet('<div class="grab"></div><h3>'+(existing?'Update weigh-in':'Log a weigh-in')+'</h3><div class="ssub">'+sub+'</div>'+
    '<div class="logrow"><label>Date</label><div class="ctlw"><input class="dfield" type="date" id="w-date" value="'+d+'" max="'+TODAY+'" onchange="weighSheet(this.value)"></div></div>'+
    '<div class="wdial"><button class="wdb" onclick="nudgeW(-1)" aria-label="lower">&minus;</button>'+
    '<input class="wbig num" id="w-val" inputmode="decimal" value="'+start.toFixed(1)+'" aria-label="weight" oninput="wDelta()">'+
    '<button class="wdb" onclick="nudgeW(1)" aria-label="higher">+</button></div>'+
    '<div class="wunit">'+wLbl()+'<span id="w-delta"></span></div>'+

    '<button class="sheet-cta ghost" onclick="closeSheet()">Cancel</button>');
  wDelta();
}
function nudgeW(d){var el=document.getElementById("w-val");if(!el)return;var v=parseFloat(el.value)||0;el.value=(v+d*wStep()).toFixed(1);wDelta();}

function dayPatternSummary(L){

  if(!recent.length)return null;

  var rb=vitalWindow("rhr",baseDays||180);

  var alsoRhr=rb?dips.filter(function(p){return rhrBy[p.d]!=null&&rhrBy[p.d]>rb.mean+rb.sd;}).length:0;

/* One bar chart for every weekly series. Tufte's normal-range band becomes a dashed mean line,
   the latest bar is the only accented one, and each bar carries its value so the chart is
   readable without an axis. Empty weeks draw a hairline rather than nothing, so a gap looks
   like a zero instead of a rendering failure. */

   in a phone-width card became a wall of 9px digits with no air. Reference charts (Strava's weekly
   volume, Apple Health's bar summaries) label the ends and the peak and leave the rest to the
   shape. This does the same: a taller plot, value labels only on the latest bar and the best one,
   sparse x-labels, a real baseline, and the average as a dashed rule read at the right.

  fmt=fmt||function(v){return Math.round(v);};

      '<i class="'+(isLast?"on":"")+(v>0?"":" zero")+'" style="height:'+hh+'px"></i>'+

/* ============ VOLUME AND FATIGUE DIAGNOSTICS (Batch 5) ============
   Sets per pattern per week is the unit that actually governs whether a muscle is trained enough,
   so that is what gets counted rather than tonnage, which flatters whoever lifts heaviest. Ten
   sets a week is the commonly cited working floor for a pattern you care about; six is the
   maintenance line. Both are stated on the card so the colour can be argued with. */
/* Floors are maintenance targets, not growth targets: in a deficit the job is keeping the muscle,
   and Bickel's work shows a fraction of accumulated volume maintains it. They are also set to what
   a full A+B+C round actually delivers, because a floor the program cannot reach makes the row red
   forever and teaches you to stop reading the card. */
var PATTERN_FLOOR={squat:9,hinge:9,"h-push":9,"v-push":6,"h-pull":9,"v-pull":4,core:6,isolation:4};
function setsByPattern(back){
  var days=weekDays(back||0),out={};
  Object.keys(PATTERNS).forEach(function(p){out[p]=0;});
  S.sessions.forEach(function(s){
    if(s.type!=="lift"||days.indexOf(s.date)<0)return;
    s.entries.forEach(function(en){
      var e=LIB[en.exerciseId];if(!e)return;
      var n=(en.sets||[]).filter(function(x){return x.completed;}).length;
      out[e.pattern]=(out[e.pattern]||0)+n;
    });
  });
  return out;
}
function patternVolumeHTML(icon){

  if(!any)return "";
  var rows=Object.keys(PATTERNS).map(function(p){
    var v=wk[p]||0,floor=PATTERN_FLOOR[p]||8,pv=prev[p]||0;
    var ragv=(v>=floor)?"good":(v>=floor*0.6)?"amber":"red";
    var delta=v-pv;
    return '<div class="pvrow" data-rag="'+ragv+'"><span class="pvn">'+PATTERNS[p]+'</span>'+
      '<span class="pvbar"><i style="width:'+Math.min(100,(v/floor)*100).toFixed(0)+'%"></i></span>'+
      '<span class="pvv num">'+v+'<small>/'+floor+'</small></span>'+

}

/* ============ THE LONG VIEW (Batch 7) ============
   Everything else in the app is a week. This is the year: one cell per day, quantized to five
   levels the way GitHub's contribution grid does, which reads as a week down a column and as a
   season across the whole thing without needing a period control. */
function dayLevel(k){
  var load=0;
  S.sessions.forEach(function(s){if(s.date===k)load+=loadFor(s);});
  if(!load)return isDone(k)?1:0;
  return load>=60?4:load>=35?3:load>=18?2:1;
}
function heatmapHTML(mode){

  var end=new Date(today);end.setDate(end.getDate()+(6-((end.getDay()+6)%7)));
  var start=new Date(end);start.setDate(start.getDate()-(weeks*7-1));
  var cols=[],cur=new Date(start),any=0,streakNow=computeStreak(),best=0,run=0;
  var scan=new Date(start);
  for(var i=0;i<weeks*7;i++){var kk=keyOf(scan);if(kk<=TODAY){if(isDone(kk)){run++;if(run>best)best=run;}else run=0;}scan.setDate(scan.getDate()+1);}
  for(var w=0;w<weeks;w++){
    var col="";
    for(var d=0;d<7;d++){
      var k=keyOf(cur),future=(k>TODAY),lvl=future?-1:dayLevel(k);
      if(lvl>0)any++;

    }
    cols+='<div class="hcol">'+col+'</div>';
  }
  /* v7.11. The month row printed six evenly spaced labels regardless of where the months actually
     fell, so every label sat over the wrong column. Labels are now placed at the percentage of the
     grid where each month genuinely begins, and a month too narrow to hold its own label is
     skipped rather than overlapping its neighbour. */
  var months="",mseen={},mcur2=new Date(start),lastPct=-99;
  if(weeks>2){
    for(var w2=0;w2<weeks;w2++){
      var key=mcur2.getFullYear()+"-"+mcur2.getMonth();
      var pct=(w2/weeks)*100;
      if(!mseen[key]&&pct-lastPct>=9){
        mseen[key]=1;lastPct=pct;
        months+='<span style="left:'+pct.toFixed(1)+'%">'+mcur2.toLocaleDateString(undefined,{month:"short"})+'</span>';
      }else if(!mseen[key]){mseen[key]=1;}
      mcur2.setDate(mcur2.getDate()+7);
    }
  }
  var pct=Math.round(any/(weeks*7)*100);
  if(weeks<=2){
    /* Two weeks is a strip, not a grid. Rendered as 14 equal columns that flex to the card width,
       so it fits its space exactly at any screen size rather than overflowing or leaving a gap. */
    var strip="",sc=new Date(start);
    for(var q=0;q<14;q++){
      var kk=keyOf(sc),fut=(kk>TODAY),lv=fut?-1:dayLevel(kk),isT=(kk===TODAY);
      var pl2=planFor(kk);
      strip+='<div class="scell'+(isT?" today":"")+'" data-l="'+(fut?"f":lv)+'">'+
        '<span class="sd">'+DWL[sc.getDay()]+'</span>'+

        '<span class="sn">'+(+kk.slice(-2))+'</span></div>';
      sc.setDate(sc.getDate()+1);
    }
    return '<div class="card hcard" data-sm="1"><h3><span>The last two weeks</span><span class="t">'+any+' of 14 active</span></h3>'+
      '<div class="strip">'+strip+'</div></div>';

  var htitle=(weeks<=2?"The last two weeks":weeks<=26?"The last six months":"The year");

    '<div class="hhead"><div class="hbig num">'+pct+'<small>%</small></div>'+
    '<div class="hsub">of days moved'+(best?', longest run <b>'+best+'</b> day'+(best===1?'':'s'):'')+(streakNow?', on <b>'+streakNow+'</b> now':'')+'</div></div>'+
    '<div class="hscroll"><div class="hgrid">'+cols+'</div></div>'+

/* Single source for weekly tonnage, shared by the tile and the chart. */
/* A bodyweight rep is real work, but calling it zero pounds made "week volume" read 0k forever
   on a bodyweight program. It is counted at a stated fraction of your bodyweight, which is a
   ratio you can see and change in Settings rather than a constant buried in the code. */
function bwFactor(){var f=S.profile.bwFactor;return (typeof f==="number"&&f>=10&&f<=100)?f/100:0.65;}
function bwLoadLb(){return Math.round((lastW()||180)*bwFactor());}
function volumeByWeek(){
  var by={},bwLb=bwLoadLb();
  S.sessions.forEach(function(s){if(s.type!=="lift")return;var wk=isoWeek(s.id),v=0;
    s.entries.forEach(function(en){if(en.unit==="s")return;
      en.sets.forEach(function(st){if(!st.completed)return;v+=(en.bw?bwLb:(st.weightLb||0))*(st.reps||0);});});
    by[wk]=(by[wk]||0)+v;});
  return by;
}
function volChart(){
  /* Bodyweight sets used to contribute nothing, so "week volume" read 0 lb forever on a
     bodyweight program. Reps now count as work at an assumed load so the series means something. */
  /* v7.5 BUG 3. This used to take the last ten weeks THAT HELD DATA, then label the last of them
     "now". On a record whose lifting stopped in April, the chart printed an April week as this
     week and read 0.5k while the Week volume tile directly below it read 0.0k. Two writers for
     one number, disagreeing on screen. The series is now twelve real calendar weeks ending on
     this one, which matches the twelve-week strip on every scorecard row, so a gap draws as the
     zero it is and "now" is genuinely now. */
  var volByWk=volumeByWeek(),N=12,wks=[],d=new Date(NOW);
  d.setDate(d.getDate()-(N-1)*7);
  for(var i=0;i<N;i++){wks.push(isoWeek(keyOf(d)));d.setDate(d.getDate()+7);}
  var vals=wks.map(function(k){return volByWk[k]||0;});
  var keys=Object.keys(volByWk).sort(),lastWk=keys.length?keys[keys.length-1]:null;

     rather than as the fact that nothing has been lifted. Say the fact. */
  if(!vals.some(function(v){return v>0;})){
    if(!lastWk)return "";
    return collapsible("Weekly lifting volume","nothing in 12 weeks",
      '<div class="ksub" style="margin:0">No lifting logged in the last twelve weeks. The last week that carried any was '+lastWk.replace("-W"," week ")+'.</div>',false,I.chart,"warn");
  }
  return drawerize(barChart("Weekly lifting volume","last "+N+" weeks",vals,
    wks.map(function(k,i){return i===N-1?"now":"";}),
    function(v){return (v/1000).toFixed(v>=10000?0:1)+"k";},"lb"),I.chart,"");
}

  if(mode==="replace"){

  }else{

   Private Relay or a VPN (shared egress IP, routinely challenged), a content blocker, or Safari's
   tracking prevention withholding the cookies playback auth needs.

   iOS that becomes the PRIMARY route, with inline offered as a second choice for anyone it works
   for. This is a worse experience than inline and a far better one than a dead play button. */
function isiOS(){
  return /iP(hone|od|ad)/.test(navigator.platform||"") ||

   a bot" message pointed at: YouTube challenges playback from shared VPN egress IPs, so the embed
   loads and then refuses to play. That is not a thing the app can authorise, but it IS a thing the
   app can know about, so it asks once instead of guessing from the user agent.
   VPN on  -> embeds cannot play, so open in the YouTube app.
   VPN off -> embeds inline, which is the better experience and now the default. */
function vpnOn(){return !!(S.profile||{}).vpn;}

/* ============ SETTINGS AND CONTROLS, v7.18 ============
   Rebuilt from `research/CONTROLS-EXEMPLAR-2026-07-30.md`, which is a real exemplar pass rather
   than another round of my own taste. The finding that reframed it, verbatim from Apple's HIG:
   "Use the switch toggle style ONLY IN A LIST ROW. You don't need to supply a label in this
   situation because the content in the row provides the context."
   Train had no switches at all. Every boolean was a two-button segment, which needs ~176px to say
   what a 52px switch says, and that is most of why the sheet read as cramped: every row was
   fighting for horizontal space it never needed to spend.
   Geometry is Material Design 3's published switch spec, copied not invented: track 52x32, full
   radius, handle 16 unselected growing to 24 selected. That growth is the point, because the HIG
   also says "avoid relying solely on different colors to communicate state" and the thumb travel
   plus the size change give two non-colour channels.
   Structurally the flat stack becomes grouped inset cards, which is what iOS Settings actually
   does: a small label above the group, the rows inside a rounded card with dividers inset to the
   text column, and the explanation moved OUT of the row into a footnote under the group. That last

function openVid(id){
  var v=vidById(id);
  if(v&&!vDone(id)){/* opening is not doing it; the tick stays his */}
  try{window.open(ytWatch(id),"_blank","noopener");}catch(e){location.href=ytWatch(id);}

function playVid(id,slot){
  if(vidRoute()==="app"){openVid(id);return;}
  playVidInline(id,slot);

function playVidInline(id,slot){
  var v=vidById(id),host=document.getElementById(slot);if(!v||!host)return;
  var face=host.querySelector(".vratio")||host.querySelector(".vface");if(!face)return;
  var f=document.createElement("iframe");
  f.className="vframe";
  f.setAttribute("allow","accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen");
  f.setAttribute("allowfullscreen","");
  f.setAttribute("referrerpolicy","strict-origin-when-cross-origin");
  f.setAttribute("title",v.t);
  /* v7.13. THE iOS FIX, third attempt, and this time the reasoning is written down.
     iOS will not start a cross-origin video without a user gesture DELIVERED INSIDE THAT FRAME.
     Tapping our facade is a gesture on OUR page; inserting an iframe that immediately asks for
     autoplay is a request Safari refuses without ever telling the page, which is precisely the
     black frame that never initialises. v7.x removed a synthetic click for the same reason but
     left autoplay=1 in the URL, so the same refusal survived the fix.
     No autoplay. The frame loads YouTube's own poster and play button, and the tap on THAT is a
     real in-frame gesture that iOS honours. One extra tap, and it actually plays.
     `origin` is sent because an embed without it is the usual source of a 153. */
  /* v7.15. `origin` is REMOVED. It is only meaningful alongside enablejsapi=1, and v7.13 added it
     on a wrong assumption about error 153. Matthew's report that embeds worked in an earlier build
     is consistent with that: the param arrived in v7.13 and nothing about it ever helped.
     Verified on desktop against his real library: this URL renders the poster, the title and the
     play button correctly. */
  f.src="https://www.youtube.com/embed/"+id+"?rel=0&playsinline=1&modestbranding=1";
  /* If the player never reports ready, the frame is being blocked on this device rather than being
     slow, and a grey rectangle is the worst possible answer mid warm-up. Six seconds, then the
     escape hatch is promoted from a quiet link to the main action. */
  vidWatchdog(host,id);
  face.replaceWith(f);
  /* An embed can still refuse to start, and a black rectangle with no way out is the worst
     possible answer in the middle of a warm-up. Every played frame therefore carries a visible
     escape underneath it from the moment it swaps in. */
  if(!host.querySelector(".vesc")){
    var a=document.createElement("a");
    a.className="vesc";a.href=ytWatch(id);a.target="_blank";a.rel="noopener";
    a.textContent="Not playing? Open in YouTube";
    host.appendChild(a);
  }
}

/* ============ SETTINGS, v7.10 ============
   Visual and functional, per Matthew. v7.2 only regrouped it.
   The visual defect was one line of CSS wearing a disguise: `.seg button.sel` used `var(--surface)`,
   which in DARK mode is DARKER than the `--surface-2` track, so the selected option read as a hole
   punched in the control rather than a raised chip. Every segmented control in the app looked
   broken, and the fix is a dedicated `--seg-chip` that is genuinely lighter than its track in dark
   and white in light. The second visual defect was arithmetic: every control carried its own
   hand-set max-width (210, 150, 120, 190, 160), so nothing lined up down the right edge. One width.
   Functionally it gained the four things it could not do: force a sync and see the real outcome,
   restore from a backup file (export existed, import was written but never exposed here), set the
   stretch goal that has been in the profile all along with no UI, and see the weigh-in cadence,
   which this session proved is the single thing gating the whole weight card. */

   Settings states the same reason in the same words rather than inventing a second vocabulary. */
function cadenceLine(){
  var st=weightStats();
  if(!st)return {rag:"none",t:"No weigh-ins yet",s:"One number switches on the protein target, the volume maths and the whole Track tab."};
  var spans=[];for(var i=0;i<S.weigh.length;i++)if(daysBetween(S.weigh[i].date,TODAY)<=28)spans.push(S.weigh[i].date);
  var span=spans.length>1?daysBetween(spans[0],spans[spans.length-1]):0;
  if(spans.length<3)return {rag:"red",t:spans.length+" weigh-in"+(spans.length===1?"":"s")+" in 28 days",s:"Three is the minimum. Below that there is nothing to fit a line to."};
  if(span<14)return {rag:"amber",t:spans.length+" weigh-ins, but only "+span+" days apart",s:"Three readings inside two weeks cannot separate a real trend from scale noise. Spread them out and the card starts measuring."};
  return {rag:"good",t:spans.length+" weigh-ins across "+span+" days",s:"Enough to fit a rate. Keep it up and the window tightens."};
}

/* SHEET GENERATION. closeSheet schedules a teardown 220ms out, to let the close animation finish
   before an iframe is destroyed. Any flow that closes one sheet and opens another inside that
   window therefore had its NEW sheet wiped by the OLD sheet's teardown. That is the warm-up gate
   exactly: primeGo closes at 0ms and opens the run sheet at 120ms, so at 220ms the run sheet was
   emptied and the screen went dead. It hit "Start the run" as well as "Skip the warm-up"; Matthew
   happened to find it on skip. The teardown now only runs if no sheet has been opened since.
   (2026-07-29) */
var SHEET_GEN=0;
function openSheet(html){SHEET_GEN++;document.getElementById("sheet").innerHTML=html;document.getElementById("scrim").classList.add("on");}
function closeSheet(){
  var gen=SHEET_GEN;
  var sc=document.getElementById("scrim");if(sc)sc.classList.remove("on");
  /* Tear the sheet down after the close animation. An <iframe> that leaves the screen keeps
     playing audio until it is removed from the document, which is why skipping a warm-up left a
     video running behind the workout. Killing the src first stops it immediately. */
  setTimeout(function(){
    if(gen!==SHEET_GEN)return; /* a new sheet opened in the meantime; it is not ours to tear down */
    var sh=document.getElementById("sheet");if(!sh)return;
    sh.querySelectorAll("iframe").forEach(function(f){try{f.src="about:blank";}catch(e){}f.remove();});
    sh.innerHTML="";
  },220);
}
/* Any full-screen view change should also silence a playing video, wherever it was started. */
function stopAllVideo(){
  document.querySelectorAll("iframe.vframe").forEach(function(f){try{f.src="about:blank";}catch(e){}f.remove();});
}
document.getElementById("scrim").addEventListener("click",function(e){if(e.target===this)closeSheet();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet();});

  var ub=document.getElementById("toast-u");ub.style.display=undo?"block":"none";toastUndo=undo||null;
  t.classList.add("on");if(toastT)clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("on")},undo?5000:2600);}

   the weight card with no way to clear it short of waiting. */
function hideToast(){var t=document.getElementById("toast");if(t)t.classList.remove("on");if(toastT)clearTimeout(toastT);}

/* ============ CAL AI WEEKLY DUMP ============
   Cal AI has no public API and no verified deep link, so nothing here pretends to talk to it.
   What it does is accept a week of nutrition in one paste: either the JSON shape below, or plain
   rows copied from a export, one day per line. Protein against your target sets the green days on
   the scorecard; calories are stored for the trend. A day already logged is overwritten, so
   re-pasting the same week is safe. */
function calaiSheet(){
  var pt=proteinTarget();
  openSheet('<div class="grab"></div><h3>Weekly nutrition dump</h3>'+
    '<div class="ssub">Paste a week from Cal AI. One day per line, or the JSON shape. '+(pt?('Protein target is <b>'+pt.lo+'-'+pt.hi+' g</b>.'):'Log a weigh-in to set your protein target.')+'</div>'+
    '<textarea class="ta" id="cj" style="min-height:150px" placeholder="2026-07-27, 168, 2210&#10;2026-07-26, 141, 1980&#10;&#10;or&#10;{&quot;days&quot;:[{&quot;date&quot;:&quot;2026-07-27&quot;,&quot;proteinG&quot;:168,&quot;calories&quot;:2210}]}"></textarea>'+
    '<div class="anote" style="margin-top:10px">Date, protein in grams, calories. Calories are optional.</div>'+
    '<button class="sheet-cta" onclick="doCalai()">Import the week</button>');
}
function parseCalai(t){
  t=(t||"").trim();if(!t)return [];
  if(t.charAt(0)==="{"||t.charAt(0)==="["){
    var o;try{o=JSON.parse(t)}catch(e){return null;}
    var arr=o.days||o.entries||(Array.isArray(o)?o:[]);
    return arr.map(function(r){
      return {date:r.date,protein:+(r.proteinG!=null?r.proteinG:r.protein),cals:+(r.calories!=null?r.calories:r.cals)||0};
    }).filter(function(r){return r.date&&!isNaN(r.protein);});
  }
  var out=[];
  t.split(/\n+/).forEach(function(line){
    var parts=line.split(/[,\t;]+/).map(function(x){return x.trim();});
    if(parts.length<2)return;
    var dt=parts[0],pr=parseFloat(parts[1]),cl=parts.length>2?parseFloat(parts[2]):0;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(dt)||isNaN(pr))return;
    out.push({date:dt,protein:pr,cals:isNaN(cl)?0:cl});
  });
  return out;
}

/* Two routes in, because the Shortcut route needs you to build a Shortcut and the export route
   needs nothing but the Health app. Apple's own "Export All Health Data" produces a zip holding
   export.xml; the parser below reads that XML directly for steps, bodyweight and workouts, so
   there is a working path even if the Shortcut never gets built. */

    '<div class="ssub">On your phone: Health, tap your photo, Export All Health Data. Unzip it, open <b>export.xml</b>, copy the whole thing and paste it below. It is large, so give it a moment.</div>'+
    '<textarea class="ta" id="hx" placeholder="&lt;HealthData&gt;..." style="min-height:150px"></textarea>'+
    '<div class="anote" style="margin-top:10px">Only step counts, bodyweight and workouts are read. Everything else in the file is ignored and nothing leaves this device.</div>'+
    '<button class="sheet-cta" onclick="doHealthXml()">Read it</button>');

/* Parsed with the browser's own XML parser rather than by hand, and with a cap on how much is
   walked, because a multi-year export can carry hundreds of thousands of records. */
function doHealthXml(){
  var t=(document.getElementById("hx")||{}).value||"";
  if(t.indexOf("<HealthData")<0){toast("That does not look like export.xml.",null);return;}
  var doc;try{doc=new DOMParser().parseFromString(t,"text/xml");}catch(e){toast("Could not read that file.",null);return;}
  if(doc.getElementsByTagName("parsererror").length){toast("That file is not complete XML.",null);return;}
  var recs=doc.getElementsByTagName("Record"),stepsBy={},nW=0,nS=0,nDup=0;
  for(var i=0;i<recs.length;i++){
    var r=recs[i],ty=r.getAttribute("type")||"",dt=(r.getAttribute("startDate")||"").slice(0,10),v=parseFloat(r.getAttribute("value"));
    if(!dt||isNaN(v))continue;
    if(ty.indexOf("StepCount")>=0){stepsBy[dt]=(stepsBy[dt]||0)+v;}
    else if(ty.indexOf("BodyMass")>=0){
      var unit=r.getAttribute("unit")||"lb";
      var lb=(unit.indexOf("kg")>=0)?v*2.20462:v;
      S.weigh=S.weigh.filter(function(x){return x.date!==dt;});
      S.weigh.push({date:dt,w:Math.round(lb*10)/10});nW++;
    }
  }
  Object.keys(stepsBy).forEach(function(k){S.steps[k]=Math.round(stepsBy[k]);nS++;});
  var wo=doc.getElementsByTagName("Workout"),nA=0,seen={};
  S.sessions.forEach(function(x){seen[x.id]=true;});
  for(var j=0;j<wo.length;j++){
    var w=wo[j],dt2=(w.getAttribute("startDate")||"").slice(0,10);
    if(!dt2)continue;
    var mins=parseFloat(w.getAttribute("duration"))||0;
    var ty2=(w.getAttribute("workoutActivityType")||"").replace("HKWorkoutActivityType","");
    /* v7.12 BUG. totalDistance is expressed in whatever totalDistanceUnit says, which is km for a
       metric export and mi for an imperial one, and this read the number raw. A km export therefore
       recorded every run 1.609x short, silently, and every derived pace with it. Convert. */
    var dist=parseFloat(w.getAttribute("totalDistance"))||0;
    var du=(w.getAttribute("totalDistanceUnit")||"mi").toLowerCase();
    if(du.indexOf("km")>=0)dist=dist*0.621371;
    else if(du==="m"||du.indexOf("meter")>=0)dist=dist*0.000621371;
    var isRun=/Running/i.test(ty2);
    /* Was dt2 + the loop index, which changes whenever Apple reorders the file, so the same workout
       could import repeatedly under different ids. Content-keyed, matching the Shortcut path. */
    var id=dt2+"-h"+(isRun?"run":(ty2||"act").toLowerCase())+"-"+Math.round(mins*60)+"-"+Math.round(dist*100);
    if(seen[id])continue;
    var rec={id:id,date:dt2,type:isRun?"run":"activity",durationSec:Math.round(mins*60),notes:"Apple Health",src:"health-xml"};
    if(isRun){rec.distanceMi=Math.round(dist*10)/10;if(rec.distanceMi>0&&rec.durationSec)rec.paceSecPerMi=Math.round(rec.durationSec/rec.distanceMi);}
    else rec.activity=ty2||"Workout";
    /* A run that arrives with no distance is cardio, decided at the door rather than by every
       reader afterwards. Same rule `isRealRun` enforces on the way out. */
    if(rec.type==="run"&&!(rec.distanceMi>0)){rec.type="activity";rec.activity="Cardio";delete rec.paceSecPerMi;}
    if(alreadyHave(rec)){nDup++;continue;}
    seen[id]=true;
    S.sessions.push(rec);S.done[dt2]=true;nA++;
  }
  S.weigh.sort(function(a,b){return a.date<b.date?-1:1;});
  S.sessions.sort(function(a,b){return a.date<b.date?-1:1;});
  save();closeSheet();refreshCurrent();
  toast("Read "+nS+" days of steps, "+nW+" weigh-ins and "+nA+" workouts."+(nDup?" Skipped "+nDup+" already on record.":""),null);
}
function healthSheet(){
  openSheet('<div class="grab"></div><h3>Import from Apple Health</h3><div class="ssub">Paste the JSON your Shortcut produces. Pulls in weight and workouts (incl. Apple Watch).</div>'+
    '<textarea class="ta" id="hj" placeholder=\'{"weighins":[{"date":"2026-07-16","weightLb":189}],"activities":[{"type":"run","date":"2026-07-16","durationSec":1400,"distanceMi":2.1}]}\' style="min-height:150px"></textarea>'+
    '<button class="sheet-cta" onclick="doHealth()">Import</button>');
}
function doHealth(){var t=(document.getElementById("hj")||{}).value,o;try{o=JSON.parse(t)}catch(e){toast("That is not valid JSON.",null);return;}
  var n=0;
  if(o.steps)o.steps.forEach(function(x){if(x.date&&x.count!=null){S.steps[x.date]=+x.count;n++;}});
  if(o.weighins)o.weighins.forEach(function(w){if(w.date&&w.weightLb){S.weigh=S.weigh.filter(function(x){return x.date!==w.date;});S.weigh.push({date:w.date,w:w.weightLb});n++;}});
  S.weigh.sort(function(a,b){return a.date<b.date?-1:1;});
  /* v7.12 BUG. APPLE-HEALTH-SHORTCUT.md promises that "a day already present is overwritten rather
     than duplicated, so re-importing an overlapping range is safe and is in fact the expected
     behaviour". That was true of weigh-ins and false of workouts: the id was date + a running
     counter, so importing the same week twice created a second copy of every session, inflating
     mileage, volume and the cardio level. The id is now derived from the CONTENT, so the same
     workout imported twice is the same record twice and the second one is skipped. */
  if(o.activities)o.activities.forEach(function(a){
    if(!a.date)return;
    var isRun=(a.type==="run"||!!a.distanceMi);
    var key=a.date+"-h"+(isRun?"run":String(a.type||"act").toLowerCase())+"-"+Math.round(a.durationSec||0)+"-"+Math.round((a.distanceMi||0)*100);
    if(S.sessions.some(function(x){return x.id===key;}))return;
    var arec=isRun
      ?{id:key,date:a.date,type:"run",distanceMi:a.distanceMi||0,durationSec:a.durationSec||0,paceSecPerMi:(a.distanceMi&&a.durationSec)?Math.round(a.durationSec/a.distanceMi):0,rpe:"",notes:"Apple Health",src:"health-json"}
      :{id:key,date:a.date,type:"activity",activity:a.type||"Workout",durationSec:a.durationSec||0,notes:"Apple Health",src:"health-json"};
    if(arec.type==="run"&&!(arec.distanceMi>0)){arec.type="activity";arec.activity="Cardio";delete arec.paceSecPerMi;}
    if(alreadyHave(arec))return;
    n++;
    S.sessions.push(arec);
    S.done[a.date]=true;});
  S.sessions.sort(function(a,b){return (a.date+"|"+a.id)<(b.date+"|"+b.id)?-1:1;});
  save();closeSheet();toast("Imported "+n+" items from Health.",null);show("track");}

function anchorComplete(k){var a=S.anchor[k]||{},n=anchorList().length;for(var i=0;i<n;i++)if(!a[i])return false;return true;}
function planDow(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2]).getDay();}
function recomputeDone(k){
  var has=S.sessions.some(function(s){return s.date===k;})|| !!S.runs[k];
  var pl=planFor(k)||{type:"none"};
  /* Completing the morning anchor marks the day moved on ANY day, not just a recover day. It is
     the declared minimum: the four movements plus the mobility routine. Lifts and runs are what
     gets added on top of it, so they cannot be the only thing that counts. */
  if(has||anchorComplete(k))S.done[k]=true;else delete S.done[k];
}

function tomb(id){S.deleted=S.deleted||[];for(var i=0;i<S.deleted.length;i++)if(S.deleted[i].id===String(id))return;S.deleted.push({id:String(id),at:Date.now()});}

function delSession(id){var idx=-1;for(var i=0;i<S.sessions.length;i++)if(S.sessions[i].id===id){idx=i;break;}if(idx<0)return;
  var rm=S.sessions.splice(idx,1)[0];

  rewindRotationFor(rm); /* the rotation moved when this was saved; it moves back now */
  purgeDerived(rm.date);save();refreshCurrent();
  var lbl=rm.type==="lift"?"workout":rm.type==="run"?"run":(rm.activity||"activity");
  toast("Removed "+lbl,function(){untomb(id);S.sessions.splice(idx,0,rm);if(rm.type==="run")S.runs[rm.date]={dist:rm.distanceMi,time:mmss(rm.durationSec),pace:rm.paceSecPerMi?mmss(rm.paceSecPerMi):"--",rpe:rm.rpe};
    var adv=(rm.advancedRotation!=null)?rm.advancedRotation:(rm.type==="lift"&&rm.dayLetter&&rm.dayLetter!=="Gen");
    if(adv){S.planPos=((S.planPos||0)+1)%3;var n=cycleLen();S.cycleNext=((S.cycleNext||0)+1)%n;}

/* ============ CARDIO LEVEL SYSTEM (Round C) ============
   Levels come from an exponentially weighted average of daily cardio load, the way TrainingPeaks
   and Strava compute fitness, rather than from points added and taken away. That one choice makes
   decay honest and non-punitive: missing a week is not a penalty event, it is the same formula
   running with zero input, and the curve bends gently instead of docking you.
   The displayed level never animates downward mid-session; it changes only when a real threshold
   is crossed, and it is phrased as a location rather than a loss. */

   Rebuilt to the spec at Daily-Tool/research/LEVELING-SPEC-2026-07-28.md, which found the previous
   curve was calibrated for a professional: a symmetric 21-day average settles at mean daily load, so
   four sessions a week parked the score at about 20 forever, and level 10 would have demanded
   roughly eleven hours of running a week. The number could not move, which is the worst property a
   level can have.

   Load is TrainingPeaks' TSS algebra with a MET-based intensity substituted for a power meter,
   hours x 100 x IF^2, where IF is the session's METs over 9.4, the published cost of running a ten
   minute mile. MET regressions come from the 2024 Adult Compendium. That substitution is the one
   genuinely novel move and it is what lets a run, a walk and a lift land on one scale without a
   hand-tuned multiplier per activity.

   The average is ASYMMETRIC: it rises on a 42-day constant and falls on a 120-day one. Detraining
   research puts real VO2max loss near five percent over a fortnight, so a score that fell 28 percent
   in the same fortnight was not measuring the athlete. Falling slowly also means a short lift is
   never punished for being smaller than the running average. */

   He is right, and FALL_SLOW was the reason. At 120 days the half-life of accumulated work is 83
   days, so a March block was still worth most of its value in July and thirteen days off had cost
   him about a tenth. That is not what detraining does; meaningful decline shows up in two to four
   weeks. The fall constant goes to 56 (half-life 39 days), which is still kinder than the
   symmetric 42 that training-load models normally use, but no longer pretends old work keeps.
   Measured on his real record, today: score 7.40 -> 5.17, level 14 -> 12, and it keeps falling
   while he does not run. Rise stays 42, so coming back is as quick as it ever was. */

function sessionHours(s){

function levelTier(n){

/* The level as a line over a year, so "where has this been and where is it now" is answerable.

/* ============ DATA INTEGRITY, v7.26 ============
   Matthew: "Why does this month show a 1 hour run? with 0 miles?"
   Because the Apple Health importer types a workout as a RUN from its activity type alone, and
   writes whatever distance the file carries. Six workouts came through with real durations and no
   distance at all: 12, 15, 13, 23, 22 and 60 minutes. They are almost certainly treadmill or
   untracked sessions. They were counted as runs, so they inflated the run count, the session
   count and the load, while contributing nothing to mileage and nothing to pace.
   THE RULE: a run without distance is not a run. It is cardio. It still counts for days moved and
   for load, because he did it, but it is out of mileage, out of pace and out of the running level. */
/* ============ DUPLICATE RUNS, v7.27 ============

   his own running profile records a 15.3 mile peak. Every run in that week was in the store twice:
   once as `2024-07-29-run`, the manual/Strava import, and once as `2024-07-29-hrun-1829-312`, the
   same session arriving later from Apple Health. The v7.12 fix made ids CONTENT-KEYED so that
   re-importing the same file cannot duplicate, and the /hae consolidation merged eight pairs on
   the first import — but two DIFFERENT importers key the same run differently, and the distances
   disagree in the second decimal (3.12 vs 3.12, 2.63 vs 2.64), so an exact-match rule never saw
   them. 22 pairs, 55.6 miles, about a fifth of the all-time total.
   Matching is deliberately tolerant on values and strict on structure: same DATE, distance within
   2 percent, duration within 20 seconds. Two real runs on one day survive that test only if they
   were also the same length at the same pace, which is not a thing that happens.

   runs and 55.6 miles ended up counted twice: the manual import wrote `2024-07-29-run` and Apple

/* ============ THE CARDIO LEVEL, v7.26 ============
   Matthew: "the main goal is to teach me to do a strong weekly mileage and to slowly improve my
   speed, pace, total miles etc per week."
   The old level was TRAINING LOAD, effort multiplied by minutes. That measures how tired you got,
   which is why an hour on a treadmill with no distance could raise it and why a year of not
   running barely lowered it. It taught nothing about mileage.
   The new one is built from what he actually wants to grow, in the order he wants to grow it:
     MILES   - an exponentially weighted weekly mileage, the spine of the whole thing
     RHYTHM  - how many of the last 8 weeks had a run in them, because 15 miles in one week and
               nothing for a month is exactly the build-then-abandon pattern his own Strava profile
               calls out, and it must be worth less than 5 a week for two months

   Calibrated against his real record: peak week 15.3 mi (Jul 2024), best sustained block about
   12 mi/wk for three months, median pace 9:51, best 8:26, current 0. Research:
   `Health/Daily-Tool/data/running-profile.md`. */

  /* v7.35: this line used to sit BETWEEN the last card and the Library, which is what he meant by

  h+=libraryHTML("cardio");
  h+='<div class="foot">This adapts to how often you actually run, not a fixed calendar plan. Every mile easy - base before speed.</div>';
  document.getElementById("v-cardio").innerHTML=h;
}

/* ============ boot ============ */
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
/* Retired as a load-time toast. Backup age is now a row in the freshness card, which is where
   every other "how current is this" signal lives. Kept as a helper for that row. */
function backupAgeDays(){var last=S.profile.lastBackup;return last?daysBetween(last,TODAY):null;}
applyTheme();
/* No gate on first open. The defaults are good enough to train on, and the one thing the app
   genuinely needs from you, a weigh-in, is asked for by the empty state rather than by a form
   standing between you and the app. Setup still lives in Settings for anyone who wants it. */
/* Offline is a service-worker concern; registration is best-effort and silent. */
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js").catch(function(){});}catch(e){}}
/* Any device that deleted an entry before v7.6 still carries the orphaned run record the old
   deleteDay left behind, and no amount of fixing the delete path repairs a store that is already
   wrong. The derived run records are reconciled against the sessions on every load: a run record
   for a day that holds no run session is residue by definition. Sessions, weigh-ins and the
   prescription pins are never touched. */
(function reconcileDerived(){
  var changed=false;
  Object.keys(S.runs||{}).forEach(function(d){
    if(!S.sessions.some(function(x){return x.date===d&&(x.type==="run"||x.distanceMi);})){delete S.runs[d];changed=true;}
  });
  if(changed){invalidateDayIndex();save();}
})();
if(!S.profile.setup){S.profile.setup=true;S.profile.started=S.profile.started||TODAY;S.profile.programStart=S.profile.programStart||TODAY;save();}
document.addEventListener("visibilitychange",function(){var woOn=document.getElementById("v-workout").classList.contains("on");if(document.hidden){if(woOn)woFreeze();}else{refreshDate();if(woOn)woResume();else if(document.getElementById("v-today").classList.contains("on"))renderToday();}});
renderToday();

</script>
<script>
/* v7.10. The sync script was referenced with a bare src, and Pages serves it with max-age=600, so
   after every change to it each device kept running the OLD sync code for up to ten minutes, and
   longer behind the service worker. That is how a sync fix ships and appears not to work. Loading
   it with the app's own VERSION appended means the URL changes on every release and the two can
   never drift apart, because the version is read from the constant rather than typed twice. */
(function(){var s=document.createElement("script");s.src="train-sync-auto.js?v="+VERSION;s.async=false;document.body.appendChild(s);})();
</script>
</body>
</html>
