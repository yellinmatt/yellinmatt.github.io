<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- frame-src is youtube-nocookie only, and img-src deliberately does NOT include i.ytimg.com:
     remote thumbnails would ping Google on every library render. The facades are drawn locally,
     so nothing reaches YouTube until you actually tap play on a specific video. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; frame-src https://www.youtube.com https://www.youtube-nocookie.com; connect-src https://train-sync.yellinmatt.workers.dev; media-src https://train-sync.yellinmatt.workers.dev blob:; form-action 'none'; base-uri 'none'">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Train">
<meta name="theme-color" content="#F7F8FA" id="theme-color">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Train</title>
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#EEF0F3; --raise:#FFFFFF;
  --ink:#0E1116; --sub:#616875; --faint:#767C86; --white:#FFFFFF;
  --line:#E7E9ED; --line-2:#D8DCE2;
  --accent:#FF4E2B; --accent-press:#E63E1E; --accent-tint:#FFE9E3;
  --good:#12A150; --good-tint:#E4F6EC; --amber:#B7791F; --amber-tint:#FBF1DD;
  --dir-up:#0E7C3F; --dir-down:#C62828; --dir-flat:#B26A00;
  --nav-bg:rgba(245,246,248,.86); --restbar-bg:#14181E; --restbar-ink:#FFFFFF; --on-good:#FFFFFF; --scrim:rgba(16,17,22,.42);
  --shadow:0 1px 2px rgba(16,17,22,.04), 0 3px 12px rgba(16,17,22,.06);
  --shadow-lg:0 12px 44px rgba(16,17,22,.18);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --r-card:16px; --r-btn:14px; --r-field:11px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0D11; --surface:#14181E; --surface-2:#1E242C; --raise:#191E25;
    --ink:#F3F5F8; --sub:#9BA3AF; --faint:#6B7079; --white:#FFFFFF;
    --line:#242A32; --line-2:#30363F;
    --accent:#FF5C3A; --accent-press:#FF7053; --accent-tint:#3A1E17;
    --good:#34D399; --good-tint:#12271E; --amber:#F0C36B; --amber-tint:#2A2213;
  --dir-up:#3DDC97; --dir-down:#FF6B6B; --dir-flat:#FFB020;
    --dir-up:#3DDC97; --dir-down:#FF6B6B; --dir-flat:#FFB020;
    --nav-bg:rgba(11,13,17,.86); --restbar-bg:#1E242C; --restbar-ink:#FFFFFF; --on-good:#FFFFFF; --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.45);
    --shadow-lg:0 16px 52px rgba(0,0,0,.6);
  }
}
html[data-theme="dark"]{
  --bg:#0B0D11; --surface:#14181E; --surface-2:#1E242C; --raise:#191E25;
  --ink:#F3F5F8; --sub:#9BA3AF; --faint:#6B7079; --white:#FFFFFF;
  --line:#242A32; --line-2:#30363F;
  --accent:#FF5C3A; --accent-press:#FF7053; --accent-tint:#3A1E17;
  --good:#34D399; --good-tint:#12271E; --amber:#F0C36B; --amber-tint:#2A2213;
  --nav-bg:rgba(11,13,17,.86); --restbar-bg:#1E242C; --restbar-ink:#FFFFFF; --on-good:#FFFFFF; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.45);
  --shadow-lg:0 16px 52px rgba(0,0,0,.6);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;overscroll-behavior-y:none;padding-top:env(safe-area-inset-top);min-height:100vh}
button,input,select{font-family:inherit;color:inherit;font-size:17px}
button{touch-action:manipulation;border:0;background:none;cursor:pointer}
input,select{border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:540px;margin:0 auto;padding:0 16px calc(92px + env(safe-area-inset-bottom));position:relative}
.view{display:none}
.view.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
html[data-motion="off"] *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){html:not([data-motion="on"]) *{animation:none!important;transition:none!important}}

  #v-today.on>.head{animation:tRise .42s cubic-bezier(.22,1,.36,1) both}
  #v-today.on>.hero{animation:tRise .46s .05s cubic-bezier(.22,1,.36,1) both}
  #v-today.on>.dots-card{animation:tRise .46s .1s cubic-bezier(.22,1,.36,1) both}
  #v-today.on>.msect{animation:tRise .46s .15s cubic-bezier(.22,1,.36,1) both}
  @keyframes tRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .view.on{animation:vIn .3s cubic-bezier(.22,1,.36,1) both}
  @keyframes vIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .pcbar i{animation:barFill .75s .3s cubic-bezier(.22,1,.36,1) both;transform-origin:left center}
  @keyframes barFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .pcol{animation:tRise .44s cubic-bezier(.22,1,.36,1) both}
  .pcol:nth-child(1){animation-delay:.14s}.pcol:nth-child(2){animation-delay:.19s}.pcol:nth-child(3){animation-delay:.24s}
  .lvlcard .lcnum{transition:color .3s ease}
[data-lvnum].lvmove{animation:lvPop .9s cubic-bezier(.22,1,.36,1) both}
@keyframes lvPop{0%{transform:scale(1)}22%{transform:scale(1.16)}100%{transform:scale(1)}}
text[data-lvnum].lvmove{transform-box:fill-box;transform-origin:center;animation:lvPopS .9s cubic-bezier(.22,1,.36,1) both}
@keyframes lvPopS{0%{transform:scale(1)}22%{transform:scale(1.14)}100%{transform:scale(1)}}
[data-dir="up"] [data-lvnum].lvmove{color:var(--dir-up)}
[data-dir="down"] [data-lvnum].lvmove{color:var(--dir-down)}
svg.lring[data-dir="up"] text[data-lvnum].lvmove{fill:var(--dir-up)}
svg.lring[data-dir="down"] text[data-lvnum].lvmove{fill:var(--dir-down)}
@media (prefers-reduced-motion:reduce){
  [data-lvnum].lvmove,text[data-lvnum].lvmove{animation:none}
}
html[data-motion="off"] [data-lvnum].lvmove,html[data-motion="off"] text[data-lvnum].lvmove{animation:none}
  .streak.bumped{animation:stPulse .8s .3s cubic-bezier(.34,1.4,.5,1) both}
  @keyframes stPulse{0%{transform:scale(1)}35%{transform:scale(1.12)}100%{transform:scale(1)}}
  .big-start.hasfill::before{content:"";position:absolute;inset:0;border-radius:inherit;
    background:rgba(255,255,255,.17);transform-origin:left center;transform:scaleX(0);
    animation:fillTo .8s .25s cubic-bezier(.22,1,.36,1) forwards;pointer-events:none}
  @keyframes fillTo{to{transform:scaleX(var(--fill,0))}}

  #v-lift.on>*,#v-cardio.on>*,#v-track.on>*{animation:tRise .44s cubic-bezier(.22,1,.36,1) both}
  #v-lift.on>*:nth-child(1),#v-cardio.on>*:nth-child(1),#v-track.on>*:nth-child(1){animation-delay:0s}
  #v-lift.on>*:nth-child(2),#v-cardio.on>*:nth-child(2),#v-track.on>*:nth-child(2){animation-delay:.05s}
  #v-lift.on>*:nth-child(3),#v-cardio.on>*:nth-child(3),#v-track.on>*:nth-child(3){animation-delay:.1s}
  #v-lift.on>*:nth-child(4),#v-cardio.on>*:nth-child(4),#v-track.on>*:nth-child(4){animation-delay:.14s}
  #v-lift.on>*:nth-child(n+5),#v-cardio.on>*:nth-child(n+5),#v-track.on>*:nth-child(n+5){animation-delay:.17s}

  .dbody.anim>*,.abody.anim>*{animation:tRise .34s cubic-bezier(.22,1,.36,1) both}
  .dbody.anim>*:nth-child(2),.abody.anim>*:nth-child(2){animation-delay:.045s}
  .dbody.anim>*:nth-child(3),.abody.anim>*:nth-child(3){animation-delay:.09s}
  .dbody.anim>*:nth-child(n+4),.abody.anim>*:nth-child(n+4){animation-delay:.12s}
  .anim .kstrip i,.anim .pvbar i{animation:barFill .6s .12s cubic-bezier(.22,1,.36,1) both;transform-origin:left center}
  #v-cardio.on .cwbar i{animation:barFill .7s .22s cubic-bezier(.22,1,.36,1) both;transform-origin:left center}
  #v-cardio.on .cwbar u{animation:tickIn .4s .55s ease both}
  @keyframes tickIn{from{opacity:0}to{opacity:.42}}

.big-start{position:relative;overflow:hidden}
.big-start.hasfill>*{position:relative;z-index:1}

.head{display:flex;align-items:center;justify-content:space-between;padding:16px 2px 12px;gap:10px}
.head .date{font-size:13px;font-weight:600;color:var(--sub)}
.head .title{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:1px}
.head>div:first-child{min-width:0;flex:1}
.head .title{font-size:clamp(19px,5.4vw,28px)}
.head .tools{flex:none}
.head .tools{display:flex;align-items:center;gap:8px}
.iconbtn{width:44px;height:44px;border-radius:11px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:var(--sub)}
.iconbtn:active{background:var(--surface-2)}
.iconbtn,.calnav,.hero .chg{position:relative}
.iconbtn::after,.calnav::after,.hero .chg::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:100%;height:100%;min-width:44px;min-height:44px}
.sesday{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.sdl{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.sdrow{display:flex;align-items:center;gap:11px;width:100%;min-height:44px;padding:10px 12px;text-align:left;
  background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.sdrow .sdi{display:flex;width:30px;height:30px;flex:none;border-radius:9px;background:var(--surface);color:var(--accent);align-items:center;justify-content:center}
.sdrow .sdi svg{width:15px;height:15px}
.sdrow .sdt{flex:1;min-width:0}
.sdrow .sdt b{display:block;font-size:13px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sdrow .sdt span{display:block;font-size:13px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sdrow .sda{flex:none;color:var(--faint);display:flex}
.sesday.gd .sdrow{border-color:var(--good);background:var(--good-tint)}

.sorerow{display:flex;align-items:center;gap:9px;width:100%;min-height:44px;margin-top:16px;padding-top:13px;
  border-top:1px solid var(--line);text-align:left;font-size:13px;color:var(--faint);background:none}
.sorerow .sdot{width:7px;height:7px;border-radius:50%;background:var(--line-2);flex:none}
.sorerow .stx{flex:1;min-width:0;line-height:1.35}
.sorerow .stx b{font-weight:700}
.sorerow .sarr{flex:none;display:flex;color:var(--faint)}
.sorerow .sarr svg{width:14px;height:14px}
.sorerow.on{color:var(--amber)}
.sorerow.on .sdot{background:var(--amber)}
.sorerow.lapsed{color:var(--sub)}
.sorerow.lapsed .sdot{background:var(--good)}
.sorebody{margin:10px 0 0;padding-left:16px}
.sorebody .sgrp{padding:0 0 14px}
.sorebody .sgrp:last-child{padding-bottom:0}
.sorebody .srw{display:flex;align-items:baseline;justify-content:space-between;gap:14px}
.sorebody .srk{font-size:15px;color:var(--ink);font-weight:600}
.sorebody .srv{font-size:13px;color:var(--amber);font-variant-numeric:tabular-nums;flex:none}
.sorebody .srwhy{font-size:13px;color:var(--sub);line-height:1.45;margin:3px 0 0}
.soreclip{display:flex;align-items:center;gap:11px;width:100%;min-height:44px;margin:12px 0 0;
  padding:10px 12px;border-radius:11px;background:var(--surface-2);text-align:left}
.soreclip .sci{width:26px;height:26px;flex:none;border-radius:50%;background:var(--surface);color:var(--ink);
  display:flex;align-items:center;justify-content:center}
.soreclip .sci svg{width:13px;height:13px}
.soreclip .scb{flex:1 1 0;min-width:0}
.soreclip .scn{display:block;font-size:15px;font-weight:600;color:var(--ink);line-height:1.3}
.soreclip .scc{display:block;font-size:13px;color:var(--sub);margin-top:2px}
.opt.sorepick.sel .oi{background:var(--accent);color:var(--white)}



.cwc{display:block;width:100%;text-align:left;background:none;border:0;padding:0}
.cwk{display:block;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.cww{display:block;font-size:13px;font-weight:600;color:var(--sub);margin-top:7px;line-height:1.3}
.cww[data-dir="up"]{color:var(--good)}
.cww[data-dir="down"]{color:var(--sub)}

.libgrid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:2px 0 14px}
.libtile2{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:80px;padding:13px 14px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);text-align:left}
.libtile2.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.libtile2 .ltn{font-size:15px;font-weight:700;color:var(--ink)}
.libtile2 .ltd{font-size:13px;color:var(--faint);line-height:1.3}
.libtile2 .ltc{margin-top:auto;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--sub)}
.libtile2 .ltc.gd{color:var(--good)}
.vgrid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:520px){.vgrid{grid-template-columns:1fr 1fr}}
.iconbtn svg{width:19px;height:19px}
.streak{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 13px 8px 11px;box-shadow:var(--shadow)}
.streak svg{width:16px;height:16px;color:var(--accent)}
.streak.zero svg{color:var(--faint)}
.streak b{font-size:15px;font-weight:800}.streak span{font-size:13px;font-weight:600;color:var(--sub)}

.hero{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);padding:20px;margin-bottom:12px;border:1px solid var(--line);position:relative}
.hero .chg{position:absolute;top:14px;right:14px;min-height:44px;padding:0 12px;gap:6px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--sub)}
.hero .chg span{font-size:13px;font-weight:700}
.hero .chg svg{width:17px;height:17px}
.lbl{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.hero h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:8px 0 5px;padding-right:92px}
.hero .meta{font-size:15px;color:var(--sub);font-weight:500}.hero .meta b{color:var(--ink);font-weight:600}
.big-start{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;height:56px;margin-top:18px;background:var(--accent);color:var(--white);border-radius:var(--r-btn);font-size:20px;font-weight:700;box-shadow:0 6px 18px rgba(255,78,43,.26)}
.big-start:active{background:var(--accent-press);transform:translateY(1px)}
.big-start svg{width:20px;height:20px}
.big-start.ghost{background:var(--surface-2);color:var(--ink);box-shadow:none}
.done-pill{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;margin-top:18px;background:var(--good-tint);color:var(--good);border-radius:var(--r-btn);font-size:17px;font-weight:700}
.done-pill svg{width:18px;height:18px}

.miniring{width:34px;height:34px;flex:none}
.miniring svg{transform:rotate(-90deg)}

.dots-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:15px 12px;margin-bottom:12px}
.flist{display:flex;flex-direction:column;gap:2px;margin-top:12px}
.flrow{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
.flrow:last-child{border-bottom:0}
.fln{flex:0 0 20px;font-size:12px;font-weight:800;color:var(--faint);line-height:19px;text-align:center}
.fltx{display:flex;flex-direction:column;gap:1px;min-width:0}
.flnm{font-size:15px;font-weight:700;color:var(--ink)}
.fld{font-size:12px;font-weight:600;color:var(--sub)}
.flc{font-size:12px;color:var(--faint);line-height:1.35;margin-top:2px}
.wgrid{display:flex;flex-direction:column;gap:5px}
.wgrow{display:grid;grid-template-columns:66px repeat(7,1fr) 18px;align-items:center;
  column-gap:0}
.wgl{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--sub);white-space:nowrap;padding-right:4px}
.wgn{font-size:12px;font-weight:800;color:var(--sub);text-align:right;letter-spacing:-.01em;
  padding-left:4px}
.wghead{margin-bottom:2px}
.wgd{font-size:12px;font-weight:700;color:var(--sub);background:none;border:0;padding:0;
  text-align:center;position:relative;font-family:inherit}
.wgd.today{color:var(--accent)}
.wgd.ahead{color:var(--line-2)}
.wgd::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:100%;height:44px}
.wgm{display:block;height:9px;border-radius:3px;background:transparent;margin:0 2px;
  box-shadow:inset 0 0 0 1.25px var(--line)}
.wgm.on{background:var(--accent);box-shadow:none}
.wgm.ahead{box-shadow:none;border:1px dashed var(--line-2);height:7px;border-radius:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:12px}
.card h3,.trend h3{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 .t,.trend h3 .t{font-size:13px;font-weight:600;color:var(--sub);text-transform:none;letter-spacing:0}
.card h3 .t b{color:var(--accent);font-weight:800}
.arow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none}
.arow:last-child{border-bottom:0;padding-bottom:2px}
.arow:active{background:var(--surface-2)}
.arow .an{flex:1;font-size:15px;font-weight:500;color:var(--ink)}
.arow .ad{font-size:13px;font-weight:600;color:var(--sub);font-variant-numeric:tabular-nums}
.arow.checked .an{color:var(--faint)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-2);flex:none;display:flex;align-items:center;justify-content:center;transition:.15s}
.chk svg{width:13px;height:13px;opacity:0;transition:.15s}
.checked .chk{background:var(--accent);border-color:var(--accent);color:var(--white)}
.checked .chk svg{opacity:1}
.anote{font-size:13px;line-height:1.5;color:var(--sub);margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.anote b{color:var(--accent);font-weight:700}
.weighrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.weighrow .wcur{font-size:15px;color:var(--sub);font-weight:600}.weighrow .wcur b{color:var(--ink);font-weight:800;font-size:20px}
.wbtn{background:var(--surface-2);border-radius:10px;height:44px;padding:0 15px;font-size:15px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.wbtn svg{width:15px;height:15px;flex:none}
.wbtn.accent{background:var(--accent);color:var(--white)}
.wbtn:disabled{opacity:.4}

.msheet{margin-top:4px}/* ============ THE TRIO IS A ROW, NOT THREE CARDS (v8) ============

   single largest offender on the screen: three full-width-ish cards, each carrying an icon chip, a
   two-word verdict at 20px in a semantic colour, an uppercase label and a footnote, and between
   them they took roughly forty percent of the tab.

   Nothing is deleted, because every one of those parts is load-bearing and hard-won: the verdict
   WORD rather than an average is v7.57's whole finding (an average answers "how was the week" while
   a tile face is read as "how am I"), and the footnote naming its own day is what keeps a
   whole-day export from reading as stale. They are simply laid out as a three-up row at the
   density the numbers deserve on the screen he opens to decide what to do in the next hour.
   The tap target is unchanged and each tile still opens its own sheet, so nothing moves further
   away; it just stops shouting. *//* v8.2: a Track tile is a control now, so it gets the affordances of one — a chevron, a pressed
   state, and a real tap target. Nothing else about the tile changes. */

.rcvk{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.rcvw{font-size:19px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.rcvchips{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.rcvchips i{font-style:normal;font-size:12px;font-weight:600;color:var(--sub);

  margin-top:12px;padding:13px 2px 0;min-height:44px;background:none;border:0;
  border-top:1px solid var(--line);color:var(--sub);font-size:15px;text-align:left}

.mvt.done .mvi{color:var(--good)}

.gcage.warn{color:var(--amber);background:var(--amber-tint)}

.msheet [data-tone="good"]{--tone:var(--good);--tone-tint:var(--good-tint)}

.msheet [data-tone="red"]{--tone:var(--accent);--tone-tint:var(--accent-tint)}
.msheet [data-tone="flat"],.msheet [data-tone=""]{--tone:var(--sub);--tone-tint:var(--surface-2)}

.msheet .phead .pl{flex:1;min-width:0}

.msheet .psub{font-size:13px;color:var(--sub);margin-top:2px;display:block}

.msheet .hero56.toned{color:var(--tone)}

.msheet .verd{font-size:15px;color:var(--sub);line-height:1.4;margin-top:6px}

.msheet .pch i.miss{background:var(--faint);opacity:.3}

.msheet .pch i.gap{background:var(--surface-2);opacity:1;height:2px!important;align-self:flex-end}
.msheet .prule{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--faint);opacity:.6;z-index:1}

function lastSetsFor(exId){
  var best=null;
  for(var i=0;i<S.sessions.length;i++){
    var ss=S.sessions[i];
    if(ss.type!=="lift"||!ss.entries)continue;
    for(var j=0;j<ss.entries.length;j++){
      var e=ss.entries[j];
      if(e.exerciseId!==exId)continue;
      var reps=(e.sets||[]).filter(function(x){return x.completed||x.on;})
                           .map(function(x){return +(x.reps||0);})
                           .filter(function(r){return r>0;});
      if(!reps.length)continue;
      if(!best||ss.date>best.date)best={date:ss.date,reps:reps};
    }
  }
  return best;
}
function lastAmrap(exId){var l=lastSetsFor(exId);return l?l.reps[l.reps.length-1]:null;}
var PRESCRIBE_RIR=4, PRESCRIBE_RIR_DENSE=5, PRESCRIBE_FLOOR=5, PRESCRIBE_CEIL=24;
var PRESCRIBE_FRACTION_RETIRED_V14=0.55;
function prescribeReps(amrap,rounds){
  if(amrap==null)return null;
  var back=(rounds>=4)?PRESCRIBE_RIR_DENSE:PRESCRIBE_RIR;
  return Math.max(PRESCRIBE_FLOOR,Math.min(PRESCRIBE_CEIL,Math.round(amrap)-back));
}
function prescribe(sl,eq){
  var id=slotEx(sl,eq), guard=0;
  if(!sl.amrap)return {id:id,reps:sl.low,sets:sl.sets,amrap:false,from:"set"};
  if(sl.base)id=variantFor(sl.base,id);   /* gate the day's variant behind what he has earned */
  while(guard++<6){
    var n=lastAmrap(id);
    if(n==null)return {id:id,reps:sl.low,sets:sl.sets,amrap:!!sl.amrap,from:"opening"};
    var t=prescribeReps(n,(S.wk&&S.wk[TODAY]&&S.wk[TODAY].rN)||0);
    if(n>=9||!EASIER[id])
      return {id:id,reps:t,sets:sl.sets,amrap:!!sl.amrap,
              from:(n<9?"floored":(n>28?"ceiling":"earned")),amrapWas:n};
    id=EASIER[id];
  }
  return {id:id,reps:sl.low,sets:sl.sets,amrap:!!sl.amrap,from:"opening"};
}

  var cands=slotCandidates(sl,eq||defaultEquip());

}
function slotExFor(L,sl,eq,avoid){

function rampSets(base){

    '<button class="sheet-cta" onclick="logMin()">Done &mdash; keep my streak</button>');return;}
  renderToday();

function recentLiftRPE(n){
  n=n||3;var out=[];

    var s=S.sessions[i];
    if(s.type==="lift"&&typeof s.rpe==="number")out.push({rpe:s.rpe,date:s.id});
  }

}
function daysSinceLift(){
  var last=null;S.sessions.forEach(function(s){if(s.type==="lift"&&(!last||s.date>last))last=s.date;});
  return last?daysBetween(last,TODAY):null;
}
function coachState(){
  var gap=daysSinceLift(),rec=recentLiftRPE(3);
  if(S.liftHold&&S.liftHold.date&&daysBetween(S.liftHold.date,TODAY)<=7)
    return {k:"red",t:"Eased back",d:"You flagged something hurting on "+runDate(S.liftHold.date)+". Hold the loads a step down; one pain-free session clears this. Going too hard too soon is the one pattern that has ended every previous block."};
  if(reentryOn()){
    var _rl=reentryLeft()||REENTRY_SESSIONS,_rg=(S.reentry&&S.reentry.gap)||gap;
    return {k:"layoff",gap:_rg,left:_rl,
      t:"Re-entry",
      d:_rl+" session"+(_rl===1?"":"s")+" left",
      rows:[["Volume","Half"],["Load","Last easy weight"],["Increases","None"]],
      why:(_rl===REENTRY_SESSIONS?("Off "+_rg+" days. Going too hard too soon is the pattern that has ended every previous block."):"")};
  }
  var lifted=S.sessions.filter(function(x){return x.type==="lift";}).length;
  if(!rec.length&&lifted>=3)
    return {k:"green",t:"Push",d:"Running blind",rows:[["Effort logged","None"],["Loads","Not adjusting"]],
      why:"Tap a number when you finish and the coach starts moving loads for you."};
  if(!rec.length)return {k:"green",t:"Push",d:"Starting conservative",rows:[["Sessions logged","0"],["Loads","Climb as you finish sets"]]};
  var avg=rec.reduce(function(a,x){return a+x.rpe;},0)/rec.length;
  if(avg>=9)return {k:"red",avg:avg,t:"Back off",d:"Loads hold, volume drops",
    rows:[["Effort, last "+rec.length,"RPE "+avg.toFixed(1)],["Volume","One set down"],["Increases","None"]]};
  if(avg>=8.2)return {k:"amber",avg:avg,t:"Hold",d:"Repeat these loads and earn the jump",
    rows:[["Effort, last "+rec.length,"RPE "+avg.toFixed(1)],["Loads","Unchanged"]]};
  return {k:"green",avg:avg,t:"Push",d:"Room to add",
    rows:[["Effort, last "+rec.length,"RPE "+avg.toFixed(1)],["Reps","Top of the range"],["Then","Add load"]]};
}
function deloadState(){
  var by=volumeByWeek(),ks=Object.keys(by).sort().slice(-4);
  if(ks.length<4)return {due:false,weeks:ks.length};
  var vals=ks.map(function(k){return by[k];});
  var loaded=vals.filter(function(v){return v>0;}).length;
  var rising=vals[3]>=vals[0]&&vals[0]>0;
  var last=S.profile.lastDeload?daysBetween(S.profile.lastDeload,TODAY):999;
  return {due:(loaded>=4&&rising&&last>=21),weeks:loaded,since:last};
}
function deloading(){var d=S.profile.lastDeload;return d?daysBetween(d,TODAY)<7:false;}
function workedWeight(sets){
  var counts={},best=null,bn=0;
  (sets||[]).forEach(function(s){
    if(!s||s.completed===false||s.on===false)return;
    var w=parseFloat(s.weightLb!=null?s.weightLb:s.w)||0;
    if(!(w>0))return;
    counts[w]=(counts[w]||0)+1;
    if(counts[w]>bn||(counts[w]===bn&&w>best)){bn=counts[w];best=w;}
  });
  return best;
}
function fixedLoad(id){var e=(LIB[id]||{});return e.equip==="KB"||e.equip==="band";}
function repLever(o){return !!(o.bw||!S.profile.adjustable||fixedLoad(o.exId));}
function applyProgression(o,sets){var t=S.progress[o.exId]||{low:o.low,high:o.high,weight:o.weight};
  var did=repLever(o)?null:workedWeight(sets);
  var asked=parseFloat(o.weight)||0;
  var base=(did!=null)?did:asked;
  if(did!=null&&Math.abs(did-asked)>=0.5){t.fromLogged={did:did,asked:asked,date:TODAY};}
  else if(t.fromLogged)delete t.fromLogged;
  var cs=coachState();
  if(cs.k==="red"||cs.k==="layoff"){
    t.low=o.low;t.high=o.high;
    t.weight=repLever(o)?o.weight:Math.max(0,base-inc());
    t.ladderStep=repLever(o)?"reps":"load";
    S.progress[o.exId]=t;return;
  }
  if(cs.k==="amber"){t.low=o.low;t.high=o.high;t.weight=repLever(o)?o.weight:base;t.ladderStep="hold";S.progress[o.exId]=t;return;}
  var allHigh=sets.length>0&&sets.every(function(s){return (s.reps||0)>=o.high;});
  var repMode=repLever(o);
  if(allHigh){
    if(repMode||freezeOn()){t.low=o.low;t.high=o.high;t.weight=o.weight;t.ladderStep="reps";}
    else{t.weight=base+inc();t.low=8;t.high=12;t.ladderStep="load";}
  }
  else{t.low=o.low;t.high=o.high;t.weight=repMode?o.weight:base;t.ladderStep=repMode?"reps":"load";}
  S.progress[o.exId]=t;}

var CUT_RATE_LO=0.005, CUT_RATE_HI=0.010;
function cutRate(){
  var st=null;try{st=weightStats();}catch(e){}
  if(!st)return null;
  var rate=st.rate;
  if(rate==null||!isFinite(rate)){
    if(st.ageDays>=11||!st.win||st.recent<3)return null;
    rate=st.fitRate;
    if(rate==null||!isFinite(rate))return null;
  }
  var ref=st.trend;
  var lbPerWk=-rate;
  var pct=lbPerWk/Math.max(1,ref);
  return {lbPerWk:lbPerWk,pct:pct,now:ref,win:st.win,n:st.fitN,se:st.se};
}
function cutVerdict(){
  var r=cutRate();
  if(!r)return {state:"unknown",say:"Not enough weigh-ins yet to read a trend."};
  if(r.lbPerWk<=-0.15)return {state:"up",r:r,
    say:"Climbing about "+Math.abs(r.lbPerWk).toFixed(1)+" a week. The trend is "+r.now.toFixed(1)+" "+wLbl()+"."};
  if(r.lbPerWk<=0)return {state:"flat",r:r,
    say:"Holding. The trend is "+r.now.toFixed(1)+" "+wLbl()+"."};
  if(r.pct<CUT_RATE_LO)return {state:"slow",r:r,

  var card=host.querySelector('details.rnd[data-r="'+r+'"]');if(!card){renderLift();return;}
  var row=card.querySelector('.arow[data-si="'+si+'"]');if(!row){renderLift();return;}
  var on=roundCellOn(w,r,si);
  row.classList.toggle("checked",on);
  row.setAttribute("aria-pressed",on);
  var an=row.querySelector(".an");
  if(an&&on&&!motionOff()){an.classList.remove("antick");void an.offsetWidth;an.classList.add("antick");}
  var nOn=0;for(var i2=0;i2<w.order.length;i2++)if(roundCellOn(w,r,i2))nOn++;
  var cnt=card.querySelector(".acount");if(cnt)cnt.textContent=nOn+" of "+w.order.length;
  card.classList.toggle("alldone",nOn>=w.order.length);
  var ring=card.querySelector(".miniring circle:last-child");
  if(ring){var C=2*Math.PI*13;ring.setAttribute("stroke-dashoffset",(C*(1-(w.order.length?nOn/w.order.length:0))).toFixed(1));}
}
function warmTick(){
  var w=workDay();
  var on=!w.done.wu;
  if(w.done.wu)delete w.done.wu;else w.done.wu={ts:Date.now()};
  save();
  var host=document.getElementById("v-lift");
  var row=host?host.querySelector('.arow[data-wu]'):null;
  if(!row){renderLift();return;}
  row.classList.toggle("checked",on);row.setAttribute("aria-pressed",on);
}
function addRound(){var w=workDay();
  if(w.rN>=RX_CEIL){toast("Eight rounds is the ceiling for a day.",null);return;}
  w.rN++;save();renderLift();}
function removeRound(){var w=workDay();
  if(w.rN<=RX_FLOOR){toast("One round is the floor, and the floor logs the day.",null);return;}
  var r=w.rN-1;
  for(var i=0;i<w.order.length;i++)if(w.done[roundKey(r,i)]){toast("That round has work in it. Untick it first.",null);return;}
  w.rN--;save();renderLift();}

function routineWrite(o){
  if(!routineOn()||!o)return;
  var R=theRoutine();
  (R.order||[]).forEach(function(x){
    if(x.exId!==o.exId)return;
    x.reps=o.reps;
    if(!o.bw)x.weight=o.weight;
  });
  save();
}
function rowStep(si,f,dir){
  var w=workDay(),o=w.order[si];if(!o)return;
  if(f==="reps"){o.reps=Math.max(1,(parseInt(o.reps)||o.low)+dir);
    var el=document.getElementById("rs-reps");if(el)el.textContent=o.reps;}
  else{o.weight=Math.max(0,(parseFloat(o.weight)||0)+dir*2.5);
    var el2=document.getElementById("rs-w");if(el2)el2.textContent=o.weight;
    var pr=prFor(o.exId);
    if(dir>0&&pr&&pr.w&&o.weight>pr.w*1.2)toast("Above anything on record for this movement. Make the jump deliberate.",null);}
  routineWrite(o);
  save();renderLift();
}

      (freezeOn()?srow("Progression freeze",'<span class="snv">'+freezeLeft()+' days left</span>'):""),
      freezeOn()?"Reps climb, loads hold. Ends on its own.":"")+

function routineRounds(d){
  var R=theRoutine();

  R.rN=v;

  if(w.src==="routine"&&wkProgress(w).done===0){w.rN=v;w.rx=v;}
  save();

function rowSwap(si,id){
  var w=workDay(),o=w.order[si],e=LIB[id];if(!o||!e)return;
  var t=S.progress[id]||{};
  var pay=gpayOf(id)||{},ng=o.g;
  if(!(pay[ng]>=1))ng=Object.keys(pay).filter(function(k){return pay[k]>=1;})[0]||o.g;
  var G=GROUPS[ng]||GROUPS[o.g]||{};
  o.exId=id;o.bw=!!e.bw;o.unit=e.unit||"reps";o.side=!!e.side;
  o.g=ng;o.pat=patGroup(e.pattern)||e.pattern;
  var H=holdRange(id);
  o.low=(t.low!=null?t.low:(H?H.low:(G.low!=null?G.low:o.low)));
  o.high=(t.high!=null?t.high:(H?H.high:(G.high!=null?G.high:o.high)));
  o.weight=e.bw?0:(t.weight!=null?t.weight:(e.defw!=null?e.defw:15));
  o.reps=o.low;
  o.swapped=TODAY;
  reslotDay(w);
  if(routineOn()){var R=theRoutine();
    if(R.order&&R.order[si]){R.order[si]={exId:o.exId,reps:o.reps};if(!o.bw)R.order[si].weight=o.weight;}}
  syncRoundsSession(w);save();closeSheet();renderLift();
  toast("Swapped. It stays in your routine.",null);
}
function reslotDay(w){
  var seen={};
  w.groups=(w.order||[]).map(function(x){return x.g;})
    .filter(function(g){if(!g||seen[g])return false;seen[g]=1;return true;});
  w.name=w.groups.map(function(g){return (GROUPS[g]||{}).name||g;}).join(", ");
}
function slotFor(id){
  var e=LIB[id];if(!e)return null;
  var pay=gpayOf(id)||{},t=S.progress[id]||{};
  var g=Object.keys(pay).filter(function(k){return pay[k]>=1;})[0]||null;
  var G=(g&&GROUPS[g])||{};
  var H=holdRange(id);
  var low=(t.low!=null?t.low:(H?H.low:(G.low!=null?G.low:8)));
  var high=(t.high!=null?t.high:(H?H.high:(G.high!=null?G.high:15)));
  return {exId:id,g:g,pat:patGroup(e.pattern)||e.pattern,unit:e.unit||"reps",side:!!e.side,
    bw:!!e.bw,low:low,high:high,weight:e.bw?0:(t.weight!=null?t.weight:(e.defw!=null?e.defw:15)),reps:low};
}
var ADD_KEEP=false;
function addKeepToggle(btn){
  ADD_KEEP=!ADD_KEEP;
  if(btn){btn.classList.toggle("on",ADD_KEEP);btn.setAttribute("aria-checked",ADD_KEEP?"true":"false");}
}
function addMovementSheet(){
  ADD_KEEP=false;
  openSheet('<div class="grab"></div><h3>Add a movement</h3>'+
    '<div class="ssub">It joins every round of today\'s session. Today only, unless you keep it.</div>'+
    (routineOn()?sgroup("",srow("Keep it in my routine",swCtl(ADD_KEEP,"addKeepToggle(this)")),
      "Off means today only: tomorrow serves the routine you already have."):"")+
    exPickList("addMovement",-1,null,null)+
    '<button class="sheet-cta ghost" onclick="closeSheet()">Cancel</button>');
}
function addMovement(_oi,id){
  var w=workDay(),sl=slotFor(id);if(!sl)return;
  if((w.order||[]).length>=SLOT_CEIL){toast("Six movements is the ceiling for one round.",null);return;}
  sl.added=TODAY;
  var keep=(routineOn()&&ADD_KEEP);
  sl.tmp=!keep;
  w.order.push(sl);
  if(keep){var R=theRoutine();(R.order=R.order||[]).push({exId:sl.exId,reps:sl.reps});}
  reslotDay(w);
  syncRoundsSession(w);save();closeSheet();renderLift();
  toast(keep?"Added to your routine. Every round carries it from now on."
            :"Added for today. Every round today carries it; tomorrow is unchanged.",null);
}
function removeMovement(si){
  var w=workDay();
  var wasTmp=!!((w.order||[])[si]||{}).tmp;
  if((w.order||[]).length<=SLOT_FLOOR){toast("One movement is the floor.",null);return;}
  for(var r=0;r<w.rN;r++)if((w.done||{})[roundKey(r,si)]){
    toast("That movement has work in it. Untick it first.",null);return;}
  w.order.splice(si,1);
  var nd={};
  Object.keys(w.done||{}).forEach(function(k){
    var pr=k.split("_");
    if(pr.length!==2||!isFinite(+pr[1])){nd[k]=w.done[k];return;}
    var i=+pr[1];if(i===si)return;
    nd[pr[0]+"_"+(i>si?i-1:i)]=w.done[k];
  });
  w.done=nd;
  if(routineOn()&&!wasTmp){var R=theRoutine();if(R.order&&R.order.length>si)R.order.splice(si,1);}
  reslotDay(w);
  syncRoundsSession(w);save();closeSheet();renderLift();
  toast("Removed from today.",null);
}

function roundCardHTML(w,r,wasOpen){
  var open;
  if(RND_ADV!=null)open=(r===RND_ADV)||(!!wasOpen&&wasOpen[r]===true&&!roundComplete(w,r));
  else if(wasOpen&&Object.keys(wasOpen).length)open=(wasOpen[r]===true);
  else open=(r===firstOpenRound(w));
  var n=0;for(var i=0;i<w.order.length;i++)if(roundCellOn(w,r,i))n++;
  var tot=w.order.length,full=(n>=tot);
  var isHard=(w.hard&&r===w.rN-1&&w.rN>1);
  var C=2*Math.PI*13,off=C*(1-(tot?n/tot:0));
  var rows="";
  if(r===0)rows+=warmupRowHTML(w);
  for(var j=0;j<w.order.length;j++)rows+=roundRowHTML(w,r,j);
  if(isHard)rows='<div class="tgs">Final round: take the last set of each movement as far as it goes.</div>'+rows;
  return '<details class="rnd'+(full?" alldone":"")+'" data-r="'+r+'"'+(open?' open':'')+'><summary>'+
    '<span class="asum">Round '+(r+1)+(isHard?' &middot; hard':'')+'</span>'+
    '<span class="aright"><span class="acount num">'+n+' of '+tot+'</span>'+
    '<span class="chev">'+I.chevD+'</span>'+
    '<span class="miniring"><svg width="30" height="30" viewBox="0 0 34 34">'+
    '<circle class="mrtrack" cx="17" cy="17" r="13" fill="none" stroke="var(--surface-2)" stroke-width="4"/>'+
    '<circle cx="17" cy="17" r="13" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 17 17)"/>'+
    '</svg></span></span></summary><div class="abody">'+rows+'</div></details>';
}

  var lift=byDay("lift");

function syncHealth(){
  var tok=null,h=null;

  if(!tok)return {rag:"none",txt:"not connected",hint:"no passphrase on this device"};
  if(!h||!h.lastTry)return {rag:"amber",txt:"unknown",hint:"connected, no exchange recorded yet"};
  if(!h.lastOk)return {rag:"red",txt:"never",hint:(h.fails||0)+" failed attempt"+((h.fails||0)===1?"":"s")+(h.lastErr?", "+h.lastErr:"")};
  var d=Math.floor((Date.now()-h.lastOk)/86400000);
  var txt=(d===0)?"today":(d===1)?"yesterday":d+" days ago";
  var hint=(h.fails>0)?("last exchange "+txt+", "+h.fails+" failure"+(h.fails===1?"":"s")+" since"):"last successful exchange";
  return {rag:(h.fails>2||d>=3)?"red":(h.fails>0||d>=1)?"amber":"good",txt:txt,hint:hint};
}



function rollSeries(get,win,stat,points,stepDays){
  stepDays=stepDays||1;var out=[];
  for(var p=points-1;p>=0;p--){
    var end=new Date(NOW);end.setDate(end.getDate()-p*stepDays);
    var xs=[],d=new Date(end);
    for(var i=0;i<win;i++){var v=get(keyOf(d));if(v!=null&&!isNaN(v))xs.push(v);d.setDate(d.getDate()-1);}
    if(!xs.length){out.push(null);continue;}
    if(stat==="sum")out.push(xs.reduce(function(a,x){return a+x;},0));
    else if(stat==="med")out.push(tMed(xs.slice()));
    else if(stat==="last")out.push(xs[0]);
    else out.push(xs.reduce(function(a,x){return a+x;},0)/xs.length);
  }
  return out;
}
function sparkSVG(pts,tone){
  var real=pts.filter(function(v){return v!=null;});
  if(real.length<4)return "";
  var lo=Math.min.apply(null,real),hi=Math.max.apply(null,real);
  if(!(hi>lo))return "";
  var W=100,H=20,pad=2;
  var srt=real.slice().sort(function(a,b){return a-b;});
  var q1=srt[Math.floor(srt.length*0.25)],q3=srt[Math.floor(srt.length*0.75)];
  var y=function(v){return pad+(H-2*pad)*(1-(v-lo)/(hi-lo));};
  var x=function(i){return pts.length>1?(W*i/(pts.length-1)):0;};
  var seg=[],cur=[];
  pts.forEach(function(v,i){
    if(v==null){if(cur.length>1)seg.push(cur);cur=[];return;}
    cur.push(x(i).toFixed(1)+","+y(v).toFixed(2));
  });
  if(cur.length>1)seg.push(cur);
  var last=-1;for(var i=pts.length-1;i>=0;i--){if(pts[i]!=null){last=i;break;}}
  var bandY=y(q3),bandH=Math.max(1,y(q1)-y(q3));
  return '<svg class="gspk" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<rect class="gsb" x="0" y="'+bandY.toFixed(2)+'" width="'+W+'" height="'+bandH.toFixed(2)+'"/>'+
    seg.map(function(s){return '<polyline class="gsl" points="'+s.join(" ")+'"/>';}).join("")+
    (last>=0?'<circle class="gsd" cx="'+x(last).toFixed(1)+'" cy="'+y(pts[last]).toFixed(2)+'" r="2.2"/>':"")+
    '</svg>';
}
function sparkStrip(vals,tone){
  if(!vals||vals.length<2)return "";
  var pts=vals.slice(-14);
  var nz=pts.filter(function(v){return v>0;});
  if(nz.length<2)return "";
  var mn=Math.min.apply(null,nz),mx=Math.max.apply(null,nz),rng=(mx-mn)||1;
  var last=pts.length-1;
  return '<span class="spk" data-tone="'+(tone||"flat")+'">'+pts.map(function(v,i){
    var h=(v>0)?(3+Math.round((v-mn)/rng*17)):1;
    return '<i class="'+(i===last&&v>0?"on":"")+'" style="height:'+h+'px"></i>';
  }).join("")+'</span>';
}

function weekStartKey(back){var d=new Date(NOW);d.setDate(d.getDate()-((DOW+6)%7)-7*(back||0));return keyOf(d);}
function weekDays(back){var s=weekStartKey(back),p=s.split("-"),out=[];var d=new Date(+p[0],+p[1]-1,+p[2]);
  for(var i=0;i<7;i++){out.push(keyOf(d));d.setDate(d.getDate()+1);}return out;}
function weekMetrics(back,capDays){
  var days=weekDays(back),today=TODAY,m={lifts:0,protein:0,moved:0,miles:0,walkMi:0,anchor:0,days:0};
  days.forEach(function(k,i){
    if(k>today)return;
    if(capDays!=null&&i>=capDays)return;
    m.days++;
    if(S.sessions.some(function(s){return s.date===k&&s.type==="lift";}))m.lifts++;
    if(proteinMet(k).met)m.protein++;
    if(isDone(k))m.moved++;
    if(anchorComplete(k))m.anchor++;
    S.sessions.forEach(function(s){
      if(s.date!==k)return;
      if(isRealRun(s))m.miles+=s.distanceMi;
      else if(s.type!=="run"&&s.type!=="lift"&&(s.distanceMi||0)>0)m.walkMi+=s.distanceMi;
    });
  });
  return m;

function kpiDir(k){
  var r=kpiRows().filter(function(x){return x.k===k;})[0];
  return (r&&r.tone&&r.tone!=="none")?r.tone:"";
}
var WEEK_FLOOR={lifts:1,moved:1,protein:1,anchor:1,miles:0.5,walkMi:0.5};
function weekBase(k){
  var vs=weekSeries(k).slice(0,11);            /* eleven COMPLETED weeks; this week is excluded */
  if(!vs.length)return null;
  var any=false;for(var i=0;i<vs.length;i++)if(vs[i]>0){any=true;break;}
  if(!any)return null;
  function ewma(a){var c=0;a.forEach(function(v){var tau=(v>c)?3:6;c=c+(v-c)*(1-Math.exp(-1/tau));});return c;}
  var cap=ewma(vs),cap4=ewma(vs.slice(0,Math.max(1,vs.length-4)));
  var med=tMed(vs.slice());
  var mad=tMed(vs.map(function(v){return Math.abs(v-med);}));
  var band=Math.max(0.6*1.4826*mad,0.10*cap,WEEK_FLOOR[k]||0.5);
  return {cap:cap,cap4:cap4,med:med,band:band,n:vs.length,rising:cap>cap4*1.06};
}
function weekVerdict(k,val,elapsed){
  var b=weekBase(k);
  if(!b||b.n<3)return {base:null,dir:"none",tone:"flat",word:"first weeks on record",short:"first weeks"};
  var f=(elapsed==null?7:Math.max(1,Math.min(7,elapsed)))/7;
  var R=b.cap*f,B=b.band*f;

function barBody(vals,fmt,unit,firstLabel,floor){
  if(!vals||vals.length<2)return '<div class="ksub">Not enough weeks logged yet.</div>';
  fmt=fmt||function(v){return Math.round(v);};
  var base=floor||0;
  var mx=Math.max.apply(null,vals)||1;
  var nz=vals.filter(function(v){return v>0;});
  var mean=nz.length?nz.reduce(function(a,v){return a+v;},0)/nz.length:0;
  var H=96,last=vals.length-1,peak=vals.indexOf(mx);
  var bars=vals.map(function(v,i){
    var hh=v>0?Math.max(4,Math.round((v-base)/((mx-base)||1)*H)):2;
    var isLast=(i===last),isPeak=(i===peak&&v>0&&peak!==last);
    var show=(isLast||isPeak)&&v>0;
    var xl=(i===0)?(firstLabel||(vals.length+"w ago")):(isLast?"now":"");
    return '<div class="bcol"><span class="bv'+(isLast?" on":"")+'">'+(show?fmt(v):"")+'</span>'+
      '<i class="'+(isLast?"on":"")+(v>0?"":" zero")+'" style="height:'+hh+'px"></i>'+
      '<span class="bx">'+xl+'</span></div>';
  }).join("");
  var meanPct=mx?Math.round(((mean-base)/((mx-base)||1))*H):0;
  return '<div class="bwrap tall" style="--bh:'+H+'px">'+
    (mean>0?'<div class="bmean" style="bottom:'+(meanPct+22)+'px"><span>avg '+fmt(mean)+(unit?" "+unit:"")+'</span></div>':'')+
    '<div class="brow">'+bars+'</div><div class="bbase"></div></div>';
}
function barChart(title,note,vals,labels,fmt,unit){
  if(!vals||vals.length<2)return "";
  fmt=fmt||function(v){return Math.round(v);};
  var mx=Math.max.apply(null,vals)||1;
  var nz=vals.filter(function(v){return v>0;});
  var mean=nz.length?nz.reduce(function(a,v){return a+v;},0)/nz.length:0;
  var H=64;
  var bars=vals.map(function(v,i){
    var hh=v>0?Math.max(6,Math.round(v/mx*H)):2;
    var last=(i===vals.length-1);
    return '<div class="bcol"><span class="bv'+(last?" on":"")+'">'+(v>0?fmt(v):"")+'</span>'+
      '<i class="'+(last?"on":"")+(v>0?"":" zero")+'" style="height:'+hh+'px"></i>'+
      '<span class="bx">'+(labels&&labels[i]!=null?labels[i]:"")+'</span></div>';
  }).join("");
  var meanPct=mx?Math.round((mean/mx)*H):0;
  return '<div class="card"><h3><span>'+title+'</span><span class="t">'+note+'</span></h3>'+
    '<div class="bwrap" style="--bh:'+H+'px">'+(mean>0?'<div class="bmean" style="bottom:'+(meanPct+16)+'px"><span>avg '+fmt(mean)+(unit?" "+unit:"")+'</span></div>':'')+
    '<div class="brow">'+bars+'</div></div></div>';
}
var PATTERN_FLOOR={squat:9,hinge:9,"h-push":9,"v-push":6,"h-pull":9,"v-pull":4,core:6,isolation:4};
function setsByPattern(back){
  var days=weekDays(back||0),out={};
  Object.keys(PATTERNS).forEach(function(p){out[p]=0;});
  S.sessions.forEach(function(s){
    if(s.type!=="lift"||days.indexOf(s.date)<0)return;
    s.entries.forEach(function(en){
      var e=LIB[en.exerciseId];if(!e)return;
      var n=(en.sets||[]).filter(function(x){return x.completed;}).length;
      out[e.pattern]=(out[e.pattern]||0)+n;
    });
  });
  return out;
}

function rpeTrendHTML(){

  var early=vals.slice(0,3).reduce(function(a,v){return a+v;},0)/Math.min(3,vals.length);

function dayLevel(k){
  var load=0;
  S.sessions.forEach(function(s){if(s.date===k)load+=loadFor(s);});
  if(!load)return isDone(k)?1:0;
  return load>=60?4:load>=35?3:load>=18?2:1;
}

function bwFactor(){var f=S.profile.bwFactor;return (typeof f==="number"&&f>=10&&f<=100)?f/100:0.65;}

function volumeByWeek(){

  S.sessions.forEach(function(s){if(s.type!=="lift")return;var wk=isoWeek(s.id),v=0;
    s.entries.forEach(function(en){if(en.unit==="s")return;
      en.sets.forEach(function(st){if(!st.completed)return;v+=(en.bw?bwLb:(st.weightLb||0))*(st.reps||0);});});
    by[wk]=(by[wk]||0)+v;});
  return by;
}

  }else{

function forceUpdate(){
  var fired=false,timer=null;
  var done=function(){
    if(fired)return;
    fired=true;
    if(timer)clearTimeout(timer);
    try{location.replace(location.pathname+"?u="+Date.now());}catch(e){location.reload();}
  };
  try{
    var jobs=[];
    if(window.caches&&caches.keys)jobs.push(caches.keys().then(function(k){return Promise.all(k.map(function(n){return caches.delete(n);}));}));
    if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)
      jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister();}));}));
    if(!jobs.length){done();return;}
    Promise.all(jobs).then(done).catch(done);
    timer=setTimeout(done,2500);
  }catch(e){done();}
}

function openVid(id){
  var v=vidById(id);
  if(v&&!vDone(id)){/* opening is not doing it; the tick stays his */}
  try{window.open(ytWatch(id),"_blank","noopener");}catch(e){location.href=ytWatch(id);}
}
function ONNIT_URL(key){return "https://train-sync.yellinmatt.workers.dev/media/"+key;}
function playVid(id,slot){
  var v=vidById(id);
  if(v&&v.src==="onnit"){playOnnit(v,slot);return;}
  if(vidRoute()==="app"){openVid(id);return;}
  playVidInline(id,slot);
}
function playOnnit(v,slot){
  var host=document.getElementById(slot);if(!host)return;
  var face=host.querySelector(".vratio")||host.querySelector(".vface");if(!face)return;
  var el=document.createElement("video");
  el.className="vframe";el.setAttribute("playsinline","");el.setAttribute("controls","");
  el.setAttribute("preload","metadata");el.setAttribute("title",v.t);
  el.src=ONNIT_URL(v.id);
  face.parentNode.replaceChild(el,face);
  try{el.play();}catch(e){}
}
function playVidInline(id,slot){
  var v=vidById(id),host=document.getElementById(slot);if(!v||!host)return;
  var face=host.querySelector(".vratio")||host.querySelector(".vface");if(!face)return;
  var f=document.createElement("iframe");
  f.className="vframe";
  f.setAttribute("allow","accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen");
  f.setAttribute("allowfullscreen","");
  f.setAttribute("referrerpolicy","strict-origin-when-cross-origin");
  f.setAttribute("title",v.t);
  f.src="https://www.youtube.com/embed/"+id+"?rel=0&playsinline=1&modestbranding=1";
  vidWatchdog(host,id);
  face.replaceWith(f);
  if(!host.querySelector(".vesc")){
    var a=document.createElement("a");
    a.className="vesc";a.href=ytWatch(id);a.target="_blank";a.rel="noopener";
    a.textContent="Not playing? Open in YouTube";
    host.appendChild(a);
  }
}
function pickVid(cat,offset){
  var vs=vidsBy(cat).filter(function(v){return vidDaypart(v)!=="night";});
  if(!vs.length)vs=vidsBy(cat);
  if(!vs.length)return null;
  var p=TODAY.split("-"),n=Math.floor(Date.UTC(+p[0],+p[1]-1,+p[2])/86400000)+(offset||0);
  return vs[((n%vs.length)+vs.length)%vs.length];
}

var RINGC=2*Math.PI*18;
var _ringPlayed={};  /* per-page-load replay ledger, keyed kind|day|landing */
var _lvSeen={};
function lvNumEls(root){
  var host=root||document;
  return [].slice.call(host.querySelectorAll("[data-lvnum]"));
}
function lvCount(el,from,to,onDone){
  var reduced=motionOff();
  from=Math.round(from);to=Math.round(to);
  if(from===to){el.textContent=to;if(onDone)onDone();return;}
  var steps=Math.abs(to-from);
  var per=reduced?260:Math.max(140,Math.min(420,900/Math.max(1,steps)));
  var dur=Math.min(reduced?2200:2600,steps*per);
  var t0=null;
  function ease(x){return reduced?x:(1-Math.pow(1-x,3));}
  function frame(ts){
    if(t0==null)t0=ts;
    var p=Math.min(1,(ts-t0)/dur);
    el.textContent=Math.round(from+(to-from)*ease(p));
    if(p<1)requestAnimationFrame(frame);
    else{el.textContent=to;if(onDone)onDone();}
  }
  requestAnimationFrame(frame);
}
function levelNumAnim(root){
  lvNumEls(root).forEach(function(el){
    var key=el.getAttribute("data-lvnum");
    var to=parseFloat(el.getAttribute("data-lv"));
    if(!isFinite(to))return;
    var seen=_lvSeen[key];
    var stored=null;
    try{var raw=localStorage.getItem("train.lvseen."+key);if(raw!=null)stored=parseFloat(raw);}catch(e){}
    var from=(seen!=null)?seen:(stored!=null&&isFinite(stored)?stored:to);
    _lvSeen[key]=to;
    try{localStorage.setItem("train.lvseen."+key,String(to));}catch(e){}
    var host=el.closest?el.closest("[data-dir]"):null;
    if(from!==to){
      var d=(to>from)?"up":"down";
      if(host)host.setAttribute("data-dir",d);
      if(el.classList)el.classList.add("lvmove");
      setTimeout(function(){if(el.classList)el.classList.remove("lvmove");},1400);
    }
    lvCount(el,from,to);
  });
}
var _lvArc={};
var C_LRING=251.33;
function heroRingAnim(root,arrive){
  var host=root||document;
  [].slice.call(host.querySelectorAll("svg.lring")).forEach(function(sv){
    var arc=sv.querySelector(".lprog"),txt=sv.querySelector("[data-lvnum]");
    if(!arc||!txt)return;
    var key=txt.getAttribute("data-lvnum")||"x";
    var to=parseFloat(arc.getAttribute("stroke-dashoffset"));
    if(!isFinite(to))return;
    var prev=_lvArc[key];
    if(prev==null){try{var raw=localStorage.getItem("train.lvarc."+key);
      if(raw!=null&&isFinite(parseFloat(raw)))prev=parseFloat(raw);}catch(e){}}
    _lvArc[key]=to;
    try{localStorage.setItem("train.lvarc."+key,String(to));}catch(e){}
    if(arrive)prev=(prev!=null&&Math.abs(prev-to)>=0.5)?prev:C_LRING;
    if(prev==null||(!arrive&&Math.abs(prev-to)<0.5))return;
    if(motionOff())return;                          /* already drawn at the truth */
    arc.classList.add("snap");
    arc.setAttribute("stroke-dashoffset",prev.toFixed(2));
    void arc.getBoundingClientRect();               /* commit the start before releasing it */
    arc.classList.remove("snap");
    requestAnimationFrame(function(){arc.setAttribute("stroke-dashoffset",to.toFixed(2));});
  });
}
function levelRingAnim(){
  document.querySelectorAll(".lvlcard").forEach(function(card){
    var arc=card.querySelector(".lcring .lcarc"),num=card.querySelector(".lcnum");
    if(!arc||!num)return;
    var to=parseFloat(card.getAttribute("data-to")),fromA=card.getAttribute("data-from");
    var from=(fromA===""||fromA==="null")?null:parseFloat(fromA);
    if(!isFinite(to))return;
    if(from==null||!isFinite(from))from=0;
    var delta=to-from;
    var LNow=(card.getAttribute("data-kind")==="lift")?liftLevel():cardioLevel();
    if(motionOff()){
      arc.setAttribute("stroke-dashoffset",(RINGC*(1-LNow.pips/10)).toFixed(1));
      return;
    }
    var pk=(card.getAttribute("data-kind")||"x")+"|"+TODAY;
    if(_ringPlayed[pk]===to.toFixed(2)){
      arc.setAttribute("stroke-dashoffset",(RINGC*(1-LNow.pips/10)).toFixed(1));
      return;
    }
    _ringPlayed[pk]=to.toFixed(2);
    var dur=Math.min(2600,Math.max(700,Math.abs(delta)*900||700));
    var t0=null;
    function ease(x){return 1-Math.pow(1-x,3);}
    function frame(ts){
      if(t0==null)t0=ts;
      var k=Math.min(1,(ts-t0)/dur),v=from+delta*ease(k);
      var frac=v-Math.floor(v);
      arc.setAttribute("stroke-dashoffset",(RINGC*(1-frac)).toFixed(1));
      num.textContent=Math.floor(v+1e-9);
      if(k<1){requestAnimationFrame(frame);return;}
      num.textContent=LNow.lvl;
      arc.setAttribute("stroke-dashoffset",(RINGC*(1-LNow.pips/10)).toFixed(1));
    }
    arc.setAttribute("stroke-dashoffset",(RINGC*(1-(from-Math.floor(from)))).toFixed(1));
    num.textContent=Math.floor(from);
    setTimeout(function(){requestAnimationFrame(frame);},260);
  });
}

    }
    if(bstate){
      trendTxt=(bstate.state==="down")?"coming down":(bstate.state==="up")?"creeping up":
               (bstate.state==="flat")?"holding steady":(bstate.state==="thin")?"not enough yet":
               (bstate.state==="gone"||bstate.state==="dead")?"no recent weigh-in":"";

        (bs&&bs.rawDate?('<div class="lmr"><span class="lmk">Last weigh-in</span><span class="lmv num">'+esc(shortDate(bs.rawDate))+'</span></div>'):'')+

      :((d>0?"Up ":"Down ")+Math.abs(d).toFixed(1)+" of a level over the last 7 days."));

  var ep=(kind!=="lift")?easyPaceTrend():null;

    ((kind==="lift")?'':('<div class="lmech" style="margin-top:9px"><div class="lmr">'+

      (ep?(mmss(ep.now)+'<small> /mi &middot; '+Math.abs(Math.round(ep.diff))+'s '+(ep.diff>0?"quicker":"slower")+' than 8wk</small>')

    var age=soreAge(worst)||0,left=Math.max(0,SORE_DAYS-age);

  }
  var gap=0,d=new Date(NOW);
  for(var i=1;i<=21;i++){d=new Date(NOW);d.setDate(d.getDate()-i);
    if(didAnything(keyOf(d)))break;gap++;}

    return {k:"off",w:"Backing off",tone:"amber",gap:gap};

    return {k:"ramp",w:"Ramping",tone:"good",now:a.moved,prev:b.moved};

function parseCalai(t){
  t=(t||"").trim();if(!t)return [];
  if(t.charAt(0)==="{"||t.charAt(0)==="["){
    var o;try{o=JSON.parse(t)}catch(e){return null;}
    var arr=o.days||o.entries||(Array.isArray(o)?o:[]);
    return arr.map(function(r){
      return {date:r.date,protein:+(r.proteinG!=null?r.proteinG:r.protein),cals:+(r.calories!=null?r.calories:r.cals)||0};
    }).filter(function(r){return r.date&&!isNaN(r.protein);});
  }
  var out=[];
  t.split(/\n+/).forEach(function(line){
    var parts=line.split(/[,\t;]+/).map(function(x){return x.trim();});
    if(parts.length<2)return;
    var dt=parts[0],pr=parseFloat(parts[1]),cl=parts.length>2?parseFloat(parts[2]):0;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(dt)||isNaN(pr))return;
    out.push({date:dt,protein:pr,cals:isNaN(cl)?0:cl});
  });

function doHealthXml(){
  var t=(document.getElementById("hx")||{}).value||"";
  if(t.indexOf("<HealthData")<0){toast("That does not look like export.xml.",null);return;}
  var doc;try{doc=new DOMParser().parseFromString(t,"text/xml");}catch(e){toast("Could not read that file.",null);return;}
  if(doc.getElementsByTagName("parsererror").length){toast("That file is not complete XML.",null);return;}
  var recs=doc.getElementsByTagName("Record"),stepsBy={},nW=0,nS=0,nDup=0;
  for(var i=0;i<recs.length;i++){
    var r=recs[i],ty=r.getAttribute("type")||"",dt=(r.getAttribute("startDate")||"").slice(0,10),v=parseFloat(r.getAttribute("value"));
    if(!dt||isNaN(v))continue;
    if(ty.indexOf("StepCount")>=0){stepsBy[dt]=(stepsBy[dt]||0)+v;}
    else if(ty.indexOf("BodyMass")>=0){
      var unit=r.getAttribute("unit")||"lb";
      var lb=(unit.indexOf("kg")>=0)?v*2.20462:v;
      S.weigh=S.weigh.filter(function(x){return x.date!==dt;});
      S.weigh.push({date:dt,w:Math.round(lb*10)/10});nW++;
    }
  }
  Object.keys(stepsBy).forEach(function(k){S.steps[k]=Math.round(stepsBy[k]);nS++;});
  var wo=doc.getElementsByTagName("Workout"),nA=0,seen={};
  S.sessions.forEach(function(x){seen[x.id]=true;});
  for(var j=0;j<wo.length;j++){
    var w=wo[j],dt2=(w.getAttribute("startDate")||"").slice(0,10);
    if(!dt2)continue;
    var mins=parseFloat(w.getAttribute("duration"))||0;
    var ty2=(w.getAttribute("workoutActivityType")||"").replace("HKWorkoutActivityType","");
    var dist=parseFloat(w.getAttribute("totalDistance"))||0;
    var du=(w.getAttribute("totalDistanceUnit")||"mi").toLowerCase();
    if(du.indexOf("km")>=0)dist=dist*0.621371;
    else if(du==="m"||du.indexOf("meter")>=0)dist=dist*0.000621371;
    var isRun=/Running/i.test(ty2);
    var id=dt2+"-h"+(isRun?"run":(ty2||"act").toLowerCase())+"-"+Math.round(mins*60)+"-"+Math.round(dist*100);
    if(seen[id])continue;
    var rec={id:id,date:dt2,type:isRun?"run":"activity",durationSec:Math.round(mins*60),notes:"Apple Health",src:"health-xml"};
    if(isRun){rec.distanceMi=Math.round(dist*10)/10;if(rec.distanceMi>0&&rec.durationSec)rec.paceSecPerMi=Math.round(rec.durationSec/rec.distanceMi);}
    else rec.activity=ty2||"Workout";
    if(rec.type==="run"&&!(rec.distanceMi>0)){rec.type="activity";rec.activity="Cardio";delete rec.paceSecPerMi;}
    if(alreadyHave(rec)){nDup++;continue;}
    seen[id]=true;
    S.sessions.push(rec);S.done[dt2]=true;nA++;
  }
  S.weigh.sort(function(a,b){return a.date<b.date?-1:1;});
  S.sessions.sort(function(a,b){return a.date<b.date?-1:1;});
  save();closeSheet();refreshCurrent();
  toast("Read "+nS+" days of steps, "+nW+" weigh-ins and "+nA+" workouts."+(nDup?" Skipped "+nDup+" already on record.":""),null);
}

function weeklyMilesSeries(weeks){

  d.setDate(d.getDate()-7*(weeks-1));
  for(var i=0;i<weeks;i++){
    var start=keyOf(d),e=new Date(d);e.setDate(e.getDate()+6);var end=keyOf(e);
    var mi=0,runs=0;
    S.sessions.forEach(function(r){

      if(r.date>=start&&r.date<=end){mi+=r.distanceMi;runs++;}

function boutMph(s){

var CARDIO_BEST_MIN_MINUTES=10, CARDIO_BEST_SPAN=60, CARDIO_BEST_TAU=56, CARDIO_BEST_FLOOR=0.5;

    var isRun=(x.type==="run"||x.distanceMi),isLift=(x.type==="lift");
    if(kind==="cardio"&&!isRun&&x.type!=="activity")return;

function levelStatus(L){

  var age=firstDate?daysBetween(firstDate,TODAY):0;
  if(L.sessions<4||age<14)
    return {w:"Getting a baseline",k:"base",c:"Four sessions before this number means anything."};
  var mono=monotony();

  if(gap!=null&&gap>=10)
    return {w:"Easing",k:"flat",c:"Nothing logged for "+gap+" days, so this is drifting down. Nothing is lost yet."};
  var r=L.r;
  if(r>=0.20)return {w:"",k:"good",c:"Doing more than usual. Keep one of them easy."};
  if(r>=0.06)return {w:"",k:"good",c:"Up "+Math.max(1,Math.round(L.delta))+" level"+(Math.max(1,Math.round(L.delta))===1?"":"s")+" over the last 8 weeks."};

    var best=0;
    S.sessions.forEach(function(ss){
      if(ss.type!=="lift"||!ss.date||ss.date>asOf)return;
      var cut=dayFromKey(asOf);cut.setDate(cut.getDate()-(CAP_WINDOW-1));
      if(ss.date<keyOf(cut))return;
      (ss.entries||[]).forEach(function(e){
        var pay=gpayOf(e.exerciseId);if(!pay||!(pay[g]>=1))return;
        (e.sets||[]).forEach(function(x){

          var u=unitLoad(e.exerciseId,x.weightLb);if(u==null)return;
          var v=((LIB[e.exerciseId]||{}).unit==="s")?(reps/6)*u:reps*u;

function pastItems(kind){
  var out=[];
  if(kind==="cardio"){
    var seenC={};
    (S.sessions||[]).forEach(function(x){
      if(!x.date)return;
      if(isRealRun(x)){
        var mi=x.distanceMi||0,sec=x.durationSec||0;
        var pace=(mi>0&&sec>0)?Math.round(sec/mi):0;
        seenC[x.date]=true;
        out.push({date:x.date,head:mi.toFixed(2)+" mi",
          sub:"Run"+((pace?" \u00b7 "+mmss(pace)+" /mi":"")+(sec?(" \u00b7 "+Math.round(sec/60)+" min"):"")),
          rec:x});
      }else if(x.type==="activity"){
        var mn=Math.round((x.durationSec||0)/60);
        seenC[x.date]=true;
        out.push({date:x.date,head:(mn?mn+" min":"logged"),
          sub:esc(x.activity||"Activity"),rec:x});
      }else if(x.type==="run"){
        var sc=Math.round((x.durationSec||0)/60);
        seenC[x.date]=true;
        out.push({date:x.date,head:(sc?sc+" min":"logged"),sub:"Cardio · no distance",rec:x});
      }
    });
    Object.keys(S.steps||{}).forEach(function(k){
      if(seenC[k]||k>TODAY)return;
      var v=stepsOn(k); if(v==null||!stepsHitOn(k))return;
      out.push({date:k,head:tNum(v),sub:"Steps · goal met",rec:null});
    });
  }else{
    var seen={};
    (S.sessions||[]).forEach(function(x){
      if(x.type!=="lift"||!x.date)return;
      var sets=0,ex=0;
      (x.entries||[]).forEach(function(e){
        var n=(e.sets||[]).filter(function(t){return t.completed;}).length;
        if(n){ex++;sets+=n;}
      });
      if(!sets)return;
      seen[x.date]=true;
      out.push({date:x.date,head:sets+" set"+(sets===1?"":"s"),
        sub:ex+" movement"+(ex===1?"":"s")+(typeof sessRounds==="function"&&sessRounds(x)?(" · "+sessRounds(x)+" round"+(sessRounds(x)===1?"":"s")):""),
        rec:x,lift:true});
    });
    var log=(puState().log)||{};
    for(var k in log){
      if(!log[k]||seen[k])continue;
      seen[k]=true;
      out.push({date:k,head:log[k]+" push-ups",sub:"morning ladder",pu:true});
    }
    for(var a in (S.anchor||{})){
      if(seen[a])continue;
      var rec=S.anchor[a],n=0;for(var q in rec)if(rec[q])n++;
      if(!n)continue;
      out.push({date:a,head:"morning flow",sub:n+" of "+anchorSlugs(a).length+" done",anchor:true});
    }
  }
  out.sort(function(a,b){return a.date<b.date?1:-1;});
  return out;
}

function wkCounts(fn,weeks,amt){
  weeks=weeks||6;
  var out=[];
  for(var back=weeks-1;back>=0;back--){
    var n=0,days=0,v=0,live=false;
    weekDays(back).forEach(function(k){
      if(k>TODAY)return;                       /* the rest of this week has not happened yet */
      days++; if(fn(k))n++; v+=(amt?(amt(k)||0):(fn(k)?1:0));
      if(!live){
        if(stepsOn(k)!=null)live=true;
        else if((S.weigh||[]).some(function(x){return x.date===k;}))live=true;
        else if((S.sessions||[]).some(function(s){return s.date===k;}))live=true;
      }
    });
    out.push({n:n,days:days,v:v,live:live,start:weekStartKey(back)});
  }
  return out;
}
function wkVerdict(series){
  if(!series.length)return {k:"flat",w:"no record yet"};
  var cur=series[series.length-1];
  var prior=series.slice(0,-1).filter(function(x){return x.live!==false&&x.days>0;});
  if(!prior.length)return {k:"flat",w:"first week on record"};
  function amtOf(x){return (x.v!=null?x.v:x.n);}
  var avg=prior.reduce(function(a,x){return a+amtOf(x);},0)/prior.length;
  if(cur.days<3)return {k:"flat",w:"early in the week"};
  var rate=cur.days>0?(amtOf(cur)/cur.days*7):0;
  if(avg<=0)return {k:"flat",w:"nothing to compare against yet"};
  var d=(rate-avg)/avg;
  if(d>=0.15)return {k:"up",w:"ahead of your recent weeks"};
  if(d<=-0.15)return {k:"down",w:"behind your recent weeks"};
  return {k:"flat",w:"in line with your recent weeks"};
}

function stepRatio(){
  var d=dayFromKey(TODAY),n=0,t=0;
  for(var i=0;i<45&&n<14;i++){
    var k=keyOf(d);d.setDate(d.getDate()-1);
    var rec=stepsOn(k),v=(S.vitals||{})[k];
    if(rec==null||!v||!v.walkRunMi||!v.stepLen)continue;
    var imp=v.walkRunMi*63360/v.stepLen;
    if(imp<=0)continue;
    t+=rec/imp;n++;
  }
  return n>=4?(t/n):0.86;
}
function stepsEst(k){
  var v=(S.vitals||{})[k];
  if(!v||!v.walkRunMi||!v.stepLen)return null;
  var n=Math.round(v.walkRunMi*63360/v.stepLen*stepRatio());
  return (n>0&&n<60000)?n:null;
}
function stepsDayCardHTML(){

  var dir=(!est&&goal>0&&latestV>=goal)?"up":"flat";

  var rule=(goal>0&&goal<=max)?('<i class="wkrule" style="bottom:'+((goal/max)*100).toFixed(1)+'%"></i>'):"";
  var hit=(!est&&goal>0&&latestV>=goal);

  }
  var manual=((S.pedo||{})[latest]!=null);
  var srcWord=est?"est":(manual?"pedometer":"health");

    ' aria-label="Steps, '+esc(tNum(latestV)+" on "+when+", "+(hit?"goal met":"under the "+tNum(goal)+" goal")+", from "+(est?"an estimate from your distance and stride":(manual?"your manual entry":"Apple Health")))+'">'+
    '<span class="wkhead"><span class="wklab">Steps</span>'+
      '<span class="wksrc'+(est?" est":"")+'">'+srcWord+'</span></span>'+
    '<span class="wkbig num">'+tNum(latestV)+'<i class="wku">steps</i></span>'+
