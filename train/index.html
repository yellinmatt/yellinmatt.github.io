/* ============ EQUIPMENT PER SESSION (Round D) ============
   Equipment is a property of the session, not of you. A global "bodyweight or dumbbell" mode was
   wrong because a Monday with dumbbells and a Thursday without are the same person in a different
   room, and a mixed session had nowhere to live at all. So each built session carries its own
   equipment list; the profile only supplies the default for the next one. Any single movement can
   still be swapped inside the workout, which is what makes mixed sessions work. */
function defaultEquip(){var e=(S.profile.equip||["BW"]).slice();if(!e.length)e=["BW"];return e;}
function sessionEquip(w){w=w||S.wk[TODAY];return (w&&w.equip&&w.equip.length)?w.equip:defaultEquip();}
function hasDB(eq){return (eq||[]).indexOf("DB")>=0;}
function trainMode(w){return hasDB(sessionEquip(w))?"db":"bw";}
function slotEx(sl,eq){
  eq=eq||defaultEquip();
  var order=[];
  if(hasDB(eq)&&sl.db)order.push(sl.db);
  if(eq.indexOf("bar")>=0&&sl.bar)order.push(sl.bar);
  if(eq.indexOf("band")>=0&&sl.band)order.push(sl.band);
  if(sl.none)order.push(sl.none);
  order.push(sl.bw);
  function ok(id){
    var e=LIB[id];if(!e)return false;
    if(e.equip==="band")return eq.indexOf("band")>=0;
    if(e.equip==="bar")return eq.indexOf("bar")>=0;
    if(e.equip==="DB"||e.equip==="dumbbell")return hasDB(eq);
    return true; /* "none" or pure bodyweight */
  }
  for(var i=0;i<order.length;i++){if(ok(order[i]))return order[i];}
  /* Nothing in this slot is doable with the kit declared. Returning the template default anyway
     would prescribe a pull-up to someone in a hotel room, so the slot is dropped instead. */
  return null;
}
function equipLabel(eq){
  eq=eq||defaultEquip();
  var names={DB:"dumbbells",BW:"bodyweight",band:"bands",bar:"pull-up bar"};
  var out=eq.map(function(k){return names[k]||k;});
  if(out.length===1)return out[0];
  if(out.length===2)return out[0]+" and "+out[1];
  return out.slice(0,-1).join(", ")+" and "+out[out.length-1];
}
/* Change the kit for THIS session only, and rebuild it around what is actually in the room. */
/* Named scenarios rather than a checkbox soup. You are almost never assembling equipment from
   scratch: you are in one of a handful of places, and each place has a known kit. Pick the place,
   then adjust if something is missing. The scenario list stays short on purpose. */
var EQ_SCENES=[
  {id:"home",n:"Home, bodyweight",d:"Nothing but the floor",eq:["BW"]},
  {id:"bands",n:"Home, plus bands",d:"Bodyweight and resistance bands",eq:["BW","band"]},
  {id:"light",n:"Light dumbbells",d:"A fixed pair, 15 to 25",eq:["BW","DB"]},
  {id:"adj",n:"Adjustable dumbbells",d:"A pair you can load up",eq:["BW","DB"],adj:true},
  {id:"full",n:"Full home setup",d:"Dumbbells, bands and a bar",eq:["BW","DB","band","bar"],adj:true},
  {id:"gym",n:"A real gym",d:"Everything, loaded properly",eq:["BW","DB","band","bar"],adj:true},
  {id:"travel",n:"Travelling",d:"Hotel room, no kit",eq:["BW"]}
];
function currentScene(){
  var eq=sessionEquip().slice().sort().join(","),adj=!!S.profile.adjustable;
  for(var i=0;i<EQ_SCENES.length;i++){
    var sc=EQ_SCENES[i];
    if(sc.eq.slice().sort().join(",")===eq&&(!!sc.adj)===adj)return sc.id;
  }
  return null;
}
function equipSheet(){
  var cur=sessionEquip().slice(),now=currentScene();
  var scenes=EQ_SCENES.map(function(sc){
    return '<button class="opt'+(sc.id===now?" sel":"")+'" onclick="pickScene(\''+sc.id+'\')"><span class="oi">'+(sc.eq.indexOf("DB")>=0?I.dumbbell:I.bolt)+'</span>'+
      '<span><div class="on2">'+sc.n+'</div><div class="oc">'+sc.d+'</div></span>'+
      '<span class="oar">'+(sc.id===now?I.check:I.arrow)+'</span></button>';
  }).join("");
  var opts=[["BW","Bodyweight"],["DB","Dumbbells"],["band","Bands"],["bar","Pull-up bar"]];
  var chips=opts.map(function(o){
    return '<button class="eqchip'+(cur.indexOf(o[0])>=0?" on":"")+'" onclick="toggleSessEquip(this,\''+o[0]+'\')">'+o[1]+'</button>';
  }).join("");
  openSheet('<div class="grab"></div><h3>What have you got today?</h3>'+

/* Three states about the body, four non-states about the DATA. Never more. */
function trendState(){
  var st=weightStats();
  if(!st)return {state:"none"};
  if(st.ageDays>=28)return {state:"dead",st:st};
  if(st.ageDays>=11)return {state:"gone",st:st};
  if(!st.win||st.recent<3)return {state:"thin",st:st};
  if(!st.called)return {state:"flat",st:st,rate:st.rate};

/* Never toFixed a rate. Word bands, plus a qualifier chosen from the standard error, so the
   sentence carries its own confidence. */
function rateWords(r,se){
  var kg=(U()==="kg"),a=Math.abs(r)*(kg?1/2.20462:1);

    band=(a<0.11)?"a tenth of a kilo":(a<0.18)?"a quarter kilo":(a<0.32)?"half a kilo":
         (a<0.45)?"three quarters of a kilo":(a<0.8)?"a kilo":(Math.round(a*2)/2)+" kilos";
  }else{
    band=(a<0.40)?"a quarter pound a week":(a<0.70)?"half a pound a week":(a<1.20)?"a pound a week":
         (a<1.70)?"a pound and a half a week":(a<2.50)?"two pounds a week":(Math.round(a*2)/2)+" pounds a week";
  }

/* ---- MILESTONES ----
   Absolute weights on a round ladder anchored to multiples of the step, so a mark never moves when
   the current weight moves. The step floors at 2 lb because a 1 lb mark sits inside scale noise and
   would be crossed and un-crossed by hydration alone. */
function milestoneLadder(){
  var st=weightStats();if(!st)return [];
  var start=S.weigh[0].w,goal=st.goal,dist=start-goal;
  if(dist<=0.5)return [goal];
  var step=[2,2.5,5,10].filter(function(s){return Math.ceil(dist/s)<=8;})[0]||10;
  var out=[],v=Math.floor((start-0.001)/step)*step;

  out.push(goal);

}
/* Reached is judged on the MINIMUM TREND, never on the best raw weigh-in. One dehydrated morning
   must not ratchet a milestone permanently and leave him "un-losing" a pound he never lost. The set
   of reached marks is monotone, so a milestone can never un-complete, and it needs no stored state,
   so it survives an export, an import and a cleared cache. */
function nextMilestone(){
  var st=weightStats();if(!st)return null;
  var lad=milestoneLadder();
  for(var i=0;i<lad.length;i++)if(st.minTrend>lad[i]+0.001)return lad[i];
  return null;
}
function monthThird(d){var day=d.getDate();return day<=10?"early":day<=20?"mid":"late";}
function mName(d){return d.toLocaleDateString(undefined,{month:"long"});}
/* A point ETA jitters because the rate jitters and the division amplifies it. Defence: compute a
   RANGE, then quantise the ANSWER to thirds of a month rather than quantising the input, so a five
   day wobble usually prints the same words. And refuse outright when the range is not a range. */
function milestoneLine(t){
  var st=t.st;if(!st)return "";
  if(st.inBand){
    return '<div class="anote" style="margin-top:10px">Inside your maintenance range, '+
      (st.goal-st.band).toFixed(1)+' to '+(st.goal+st.band).toFixed(1)+' '+wLbl()+'. The job now is staying here.</div>';
  }
  var mark=nextMilestone();
  if(mark==null)return "";
  var d=st.trend-mark;
  if(d<=0.05)return "";
  if(t.state!=="down"||st.rate==null||st.se==null)
    return '<div class="anote" style="margin-top:10px">Next mark <b>'+mark+' '+wLbl()+'</b>, '+d.toFixed(1)+' '+wLbl()+' away. No date until the trend has a direction.</div>';
  var a=Math.abs(st.rate);
  if(a<=st.se)return '<div class="anote" style="margin-top:10px">Next mark <b>'+mark+' '+wLbl()+'</b>, '+d.toFixed(1)+' '+wLbl()+' away.</div>';
  var rf=(a+st.se)/7,rs=Math.max(0.01,(a-st.se)/7);
  var tf=d/rf,ts=d/rs;
  if(ts>112)return '<div class="anote" style="margin-top:10px">Next mark <b>'+mark+' '+wLbl()+'</b>, '+d.toFixed(1)+' '+wLbl()+' away. Too far out to put a date on.</div>';
  var df=new Date(NOW);df.setDate(df.getDate()+Math.round(tf));
  var ds=new Date(NOW);ds.setDate(ds.getDate()+Math.round(ts));
  var when;
  if(mName(df)===mName(ds)&&monthThird(df)===monthThird(ds))when="around "+monthThird(df)+" "+mName(df);
  else if(mName(df)===mName(ds))when="somewhere from "+monthThird(df)+" to "+monthThird(ds)+" "+mName(df);
  else when="somewhere from "+monthThird(df)+" "+mName(df)+" into "+mName(ds);
  return '<div class="anote" style="margin-top:10px">Next mark <b>'+mark+' '+wLbl()+'</b>, on this trend '+when+'.</div>';
}

function trendChart(){

    g+='<line x1="'+pl+'" y1="'+Y(goal).toFixed(1)+'" x2="'+pr.toFixed(1)+'" y2="'+Y(goal).toFixed(1)+'" stroke="var(--good)" stroke-width="1" stroke-dasharray="4 4" opacity=".5" vector-effect="non-scaling-stroke"/>';

  /* The projection wedge, bounded by rate +/- SE and capped at the next mark and eight weeks. It is

function step(oi,si,f,dir){var o=AW().order[oi],s=o.sets[si];

/* ============ ADAPTIVE COACH (Batch 4) ============
   Progression already existed but only ever looked at the set you just finished. The coach adds
   the two things that make a program adapt rather than merely increment: how hard the last few
   sessions felt, and how long you have been away. Autoregulation is the standard traffic-light
   model, green pushes, amber holds, red backs off, driven by logged session RPE rather than by
   how you say you feel today. Deload is detected from accumulated load, not from the calendar,
   because a light fortnight should not earn you a rest week. */
function recentLiftRPE(n){
  n=n||3;var out=[];
  for(var i=S.sessions.length-1;i>=0&&out.length<n;i--){
    var s=S.sessions[i];
    if(s.type==="lift"&&typeof s.rpe==="number")out.push({rpe:s.rpe,date:s.id});
  }
  return out;
}
function daysSinceLift(){
  var last=null;S.sessions.forEach(function(s){if(s.type==="lift"&&(!last||s.date>last))last=s.date;});
  return last?daysBetween(last,TODAY):null;
}
/* green: push. amber: hold and repeat. red: back off a step. layoff: rebuild, no judgement. */
function coachState(){
  var gap=daysSinceLift(),rec=recentLiftRPE(3);
  if(gap!=null&&gap>=14)return {k:"layoff",gap:gap,
    t:"Back after "+gap+" days",d:"Loads are pulled back a step for the first session or two. This is a ramp, not a reset."};
  var lifted=S.sessions.filter(function(x){return x.type==="lift";}).length;
  if(!rec.length&&lifted>=3)
    return {k:"green",t:"Push, unguided",d:"No effort ratings on your last sessions, so this is running blind. Tap a number when you finish and the coach starts adjusting loads for you."};
  if(!rec.length)return {k:"green",t:"Push",d:"Nothing logged yet, so the plan starts conservative and moves up as you finish sets."};
  var avg=rec.reduce(function(a,x){return a+x.rpe;},0)/rec.length;
  if(avg>=9)return {k:"red",avg:avg,t:"Back off",d:"Your last "+rec.length+" sessions averaged RPE "+avg.toFixed(1)+". Loads hold and volume drops until that comes down."};
  if(avg>=8.2)return {k:"amber",avg:avg,t:"Hold",d:"Averaging RPE "+avg.toFixed(1)+". Repeat these loads and earn the jump rather than forcing it."};
  return {k:"green",avg:avg,t:"Push",d:"Averaging RPE "+avg.toFixed(1)+", which is room to add. Take the top of the rep range, then add load."};
}
/* Accumulated load over four weeks decides the deload, so a quiet stretch does not trigger one. */
function deloadState(){
  var by=volumeByWeek(),ks=Object.keys(by).sort().slice(-4);
  if(ks.length<4)return {due:false,weeks:ks.length};
  var vals=ks.map(function(k){return by[k];});

  var rising=vals[3]>=vals[0]&&vals[0]>0;

function applyProgression(o,sets){var t=S.progress[o.exId]||{low:o.low,high:o.high,weight:o.weight};
  /* Autoregulation gates the increase: the same finished sets progress differently depending on
     how the recent block has actually felt. */

    t.weight=(o.bw||!S.profile.adjustable)?o.weight:Math.max(0,(parseFloat(o.weight)||0)-inc());

  }

  var allHigh=sets.length>0&&sets.every(function(s){return (s.reps||0)>=o.high;});

   advanced the A/B/C letter and the rhythm slot; both go back. Older records predate the
   advancedRotation flag, so a plain scheduled lift is inferred to have advanced. */
function rewindRotationFor(rec){
  if(!rec||rec.type!=="lift")return;
  var adv=(rec.advancedRotation!=null)?rec.advancedRotation:(rec.dayLetter&&rec.dayLetter!=="Gen");
  if(!adv)return;
  S.planPos=(((S.planPos||0)-1)%3+3)%3;
  var n=cycleLen();
  S.cycleNext=(((S.cycleNext||0)-1)%n+n)%n;
}
/* v7.6 BUG. This function read its one argument two different ways: it matched k against SESSION
   IDS to filter the array, then used the same k as a DATE KEY against S.runs, S.wk, S.done and
   S.daySlot. Those coincide only if a session's id equals its date, which it never does for a
   logged entry, so every delete through this path left the parallel run record behind. That is
   the residue Matthew found after deleting his test run. Both delete paths now resolve the record
   first and clean the derived stores by rec.date, through one shared function. */
function purgeDerived(date){
  if(!date)return;
  var stillRun=S.sessions.some(function(x){return x.date===date&&(x.type==="run"||x.distanceMi);});
  var stillLift=S.sessions.some(function(x){return x.date===date&&x.type==="lift";});
  if(!stillRun)delete S.runs[date];
  if(!stillLift&&S.wk[date])delete S.wk[date];
  /* S.daySlot is deliberately NOT cleared: it pins which rotation day this date was PRESCRIBED,
     which is set before any lift happens and must survive a deletion. */
  recomputeDone(date);
}
function deleteDay(k){
  var rec=null;
  S.sessions.forEach(function(s){if(s.id===k){rec=s;tomb(s.id);rewindRotationFor(s);}});
  S.sessions=S.sessions.filter(function(s){return s.id!==k;});
  var date=rec?rec.date:(/^\d{4}-\d{2}-\d{2}/.test(k)?k.slice(0,10):null);
  if(date){delete S.done[date];purgeDerived(date);}
  save();closeSheet();refreshCurrent();toast("Entry deleted",null);}

/* Sync is a first-class health signal now, because a silent sync failure makes every other number
   on this tab confidently wrong. */
/* v7.9. This read `train.syncStamps`, which records when a VALUE LAST CHANGED for last-write-wins.
   That is not a health signal: it would have reported "today" while every push and pull failed for a
   week, which is the precise failure this row exists to catch, and it is the same class of mistake as
   reading a moved day as a completed lift. `train-sync-auto.js` now writes `train.syncHealth` with an
   explicit lastOk, lastTry and consecutive failure count, and this reads that. If the key is absent
   the answer is "unknown", never a reassuring guess. */
function syncHealth(){
  var tok=null,h=null;
  try{tok=localStorage.getItem("train.syncToken");h=JSON.parse(localStorage.getItem("train.syncHealth")||"null");}catch(e){}
  if(!tok)return {rag:"none",txt:"not connected",hint:"no passphrase on this device"};
  if(!h||!h.lastTry)return {rag:"amber",txt:"unknown",hint:"connected, no exchange recorded yet"};
  if(!h.lastOk)return {rag:"red",txt:"never",hint:(h.fails||0)+" failed attempt"+((h.fails||0)===1?"":"s")+(h.lastErr?", "+h.lastErr:"")};
  var d=Math.floor((Date.now()-h.lastOk)/86400000);
  var txt=(d===0)?"today":(d===1)?"yesterday":d+" days ago";
  var hint=(h.fails>0)?("last exchange "+txt+", "+h.fails+" failure"+(h.fails===1?"":"s")+" since"):"last successful exchange";
  return {rag:(h.fails>2||d>=3)?"red":(h.fails>0||d>=1)?"amber":"good",txt:txt,hint:hint};
}

  var H=96,last=vals.length-1,peak=vals.indexOf(mx);

function barChart(title,note,vals,labels,fmt,unit){

/* ============ VOLUME AND FATIGUE DIAGNOSTICS (Batch 5) ============
   Sets per pattern per week is the unit that actually governs whether a muscle is trained enough,
   so that is what gets counted rather than tonnage, which flatters whoever lifts heaviest. Ten
   sets a week is the commonly cited working floor for a pattern you care about; six is the
   maintenance line. Both are stated on the card so the colour can be argued with. */
/* Floors are maintenance targets, not growth targets: in a deficit the job is keeping the muscle,
   and Bickel's work shows a fraction of accumulated volume maintains it. They are also set to what
   a full A+B+C round actually delivers, because a floor the program cannot reach makes the row red
   forever and teaches you to stop reading the card. */
var PATTERN_FLOOR={squat:9,hinge:9,"h-push":9,"v-push":6,"h-pull":9,"v-pull":4,core:6,isolation:4};
function setsByPattern(back){
  var days=weekDays(back||0),out={};
  Object.keys(PATTERNS).forEach(function(p){out[p]=0;});
  S.sessions.forEach(function(s){
    if(s.type!=="lift"||days.indexOf(s.date)<0)return;
    s.entries.forEach(function(en){
      var e=LIB[en.exerciseId];if(!e)return;
      var n=(en.sets||[]).filter(function(x){return x.completed;}).length;
      out[e.pattern]=(out[e.pattern]||0)+n;
    });
  });
  return out;
}
function patternVolumeHTML(icon){
  var wk=setsByPattern(0),prev=setsByPattern(1),any=0;
  Object.keys(wk).forEach(function(p){any+=wk[p];});
  if(!any)return "";
  var rows=Object.keys(PATTERNS).map(function(p){
    var v=wk[p]||0,floor=PATTERN_FLOOR[p]||8,pv=prev[p]||0;
    var ragv=(v>=floor)?"good":(v>=floor*0.6)?"amber":"red";
    var delta=v-pv;
    return '<div class="pvrow" data-rag="'+ragv+'"><span class="pvn">'+PATTERNS[p]+'</span>'+
      '<span class="pvbar"><i style="width:'+Math.min(100,(v/floor)*100).toFixed(0)+'%"></i></span>'+
      '<span class="pvv num">'+v+'<small>/'+floor+'</small></span>'+
      '<span class="pvd">'+(pv?((delta>0?"+":"")+delta):"new")+'</span></div>';
  }).join("");
  var under=Object.keys(PATTERNS).filter(function(p){return (wk[p]||0)<(PATTERN_FLOOR[p]||8);}).length;
  return collapsible("Sets per pattern",(under?under+" under":"all met"),
    '<div class="ksub">These are maintenance floors for a cut, not growth targets. In a deficit the job is keeping the muscle you have.</div>'+rows,false,icon||I.dumbbell,under?"warn":"good");
}

/* ============ THE LONG VIEW (Batch 7) ============
   Everything else in the app is a week. This is the year: one cell per day, quantized to five
   levels the way GitHub's contribution grid does, which reads as a week down a column and as a
   season across the whole thing without needing a period control. */
function dayLevel(k){
  var load=0;
  S.sessions.forEach(function(s){if(s.date===k)load+=loadFor(s);});
  if(!load)return isDone(k)?1:0;
  return load>=60?4:load>=35?3:load>=18?2:1;
}
function heatmapHTML(mode){

  var end=new Date(today);end.setDate(end.getDate()+(6-((end.getDay()+6)%7)));
  var start=new Date(end);start.setDate(start.getDate()-(weeks*7-1));
  var cols=[],cur=new Date(start),any=0,streakNow=computeStreak(),best=0,run=0;
  var scan=new Date(start);
  for(var i=0;i<weeks*7;i++){var kk=keyOf(scan);if(kk<=TODAY){if(isDone(kk)){run++;if(run>best)best=run;}else run=0;}scan.setDate(scan.getDate()+1);}
  for(var w=0;w<weeks;w++){
    var col="";
    for(var d=0;d<7;d++){
      var k=keyOf(cur),future=(k>TODAY),lvl=future?-1:dayLevel(k);
      if(lvl>0)any++;

      cur.setDate(cur.getDate()+1);
    }

  }
  /* v7.11. The month row printed six evenly spaced labels regardless of where the months actually
     fell, so every label sat over the wrong column. Labels are now placed at the percentage of the
     grid where each month genuinely begins, and a month too narrow to hold its own label is
     skipped rather than overlapping its neighbour. */
  var months="",mseen={},mcur2=new Date(start),lastPct=-99;
  if(weeks>2){
    for(var w2=0;w2<weeks;w2++){
      var key=mcur2.getFullYear()+"-"+mcur2.getMonth();
      var pct=(w2/weeks)*100;
      if(!mseen[key]&&pct-lastPct>=9){
        mseen[key]=1;lastPct=pct;
        months+='<span style="left:'+pct.toFixed(1)+'%">'+mcur2.toLocaleDateString(undefined,{month:"short"})+'</span>';
      }else if(!mseen[key]){mseen[key]=1;}
      mcur2.setDate(mcur2.getDate()+7);

  }
  var pct=Math.round(any/(weeks*7)*100);
  if(weeks<=2){
    /* Two weeks is a strip, not a grid. Rendered as 14 equal columns that flex to the card width,
       so it fits its space exactly at any screen size rather than overflowing or leaving a gap. */
    var strip="",sc=new Date(start);
    for(var q=0;q<14;q++){
      var kk=keyOf(sc),fut=(kk>TODAY),lv=fut?-1:dayLevel(kk),isT=(kk===TODAY);
      var pl2=planFor(kk);
      strip+='<div class="scell'+(isT?" today":"")+'" data-l="'+(fut?"f":lv)+'">'+
        '<span class="sd">'+DWL[sc.getDay()]+'</span>'+

    }
    return '<div class="card hcard" data-sm="1"><h3><span>The last two weeks</span><span class="t">'+any+' of 14 active</span></h3>'+
      '<div class="strip">'+strip+'</div></div>';
  }

  return '<div class="card hcard" data-title="'+htitle+'" data-any="'+any+'"><h3><span>'+htitle+'</span><span class="t">'+any+' active days</span></h3>'+
    '<div class="hhead"><div class="hbig num">'+pct+'<small>%</small></div>'+
    '<div class="hsub">of days moved'+(best?', longest run <b>'+best+'</b> day'+(best===1?'':'s'):'')+(streakNow?', on <b>'+streakNow+'</b> now':'')+'</div></div>'+
    '<div class="hscroll"><div class="hgrid">'+cols+'</div></div>'+
    '<div class="hmonths">'+months+'</div>'+
    '<div class="hlegend"><span>quiet</span><i data-l="0"></i><i data-l="1"></i><i data-l="2"></i><i data-l="3"></i><i data-l="4"></i><span>hard</span></div></div>';
}

/* Single source for weekly tonnage, shared by the tile and the chart. */
/* A bodyweight rep is real work, but calling it zero pounds made "week volume" read 0k forever
   on a bodyweight program. It is counted at a stated fraction of your bodyweight, which is a
   ratio you can see and change in Settings rather than a constant buried in the code. */
function bwFactor(){var f=S.profile.bwFactor;return (typeof f==="number"&&f>=10&&f<=100)?f/100:0.65;}
function bwLoadLb(){return Math.round((lastW()||180)*bwFactor());}
function volumeByWeek(){
  var by={},bwLb=bwLoadLb();
  S.sessions.forEach(function(s){if(s.type!=="lift")return;var wk=isoWeek(s.id),v=0;
    s.entries.forEach(function(en){if(en.unit==="s")return;
      en.sets.forEach(function(st){if(!st.completed)return;v+=(en.bw?bwLb:(st.weightLb||0))*(st.reps||0);});});
    by[wk]=(by[wk]||0)+v;});
  return by;
}
function volChart(){
  /* Bodyweight sets used to contribute nothing, so "week volume" read 0 lb forever on a
     bodyweight program. Reps now count as work at an assumed load so the series means something. */
  /* v7.5 BUG 3. This used to take the last ten weeks THAT HELD DATA, then label the last of them
     "now". On a record whose lifting stopped in April, the chart printed an April week as this
     week and read 0.5k while the Week volume tile directly below it read 0.0k. Two writers for
     one number, disagreeing on screen. The series is now twelve real calendar weeks ending on
     this one, which matches the twelve-week strip on every scorecard row, so a gap draws as the
     zero it is and "now" is genuinely now. */

  for(var i=0;i<N;i++){wks.push(isoWeek(keyOf(d)));d.setDate(d.getDate()+7);}

  var keys=Object.keys(volByWk).sort(),lastWk=keys.length?keys[keys.length-1]:null;

     rather than as the fact that nothing has been lifted. Say the fact. */
  if(!vals.some(function(v){return v>0;})){

      '<div class="ksub" style="margin:0">No lifting logged in the last twelve weeks. The last week that carried any was '+lastWk.replace("-W"," week ")+'.</div>',false,I.chart,"warn");
  }
  return drawerize(barChart("Weekly lifting volume","last "+N+" weeks",vals,
    wks.map(function(k,i){return i===N-1?"now":"";}),
    function(v){return (v/1000).toFixed(v>=10000?0:1)+"k";},"lb"),I.chart,"");
}

/* ============ VIDEO DIAGNOSTIC, v7.13 ============
   The iPhone playback failure has now been "fixed" twice without ever being observed, because it
   cannot be reproduced on a desktop browser. This renders the same video four ways on the actual
   device so the next report is evidence rather than a symptom: whichever tile plays tells us
   exactly which layer is refusing, and whichever tile is blank tells us as much again.
   A = no autoplay, youtube.com. B = no autoplay, nocookie. C = autoplay, what used to ship.
   D = the plain link out. */
function videoDiagSheet(){
  var v=(VID&&VID.length)?VID[0]:null;
  var id=v?v.id:"aqz-KE-bpKQ";
  var org=(location.protocol==="https:")?("&origin="+encodeURIComponent(location.origin)):"";
  function frame(lbl,src,note){
    return '<div class="vdiag"><div class="vdl">'+lbl+'</div>'+
      '<iframe class="vframe" src="'+src+'" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" title="'+lbl+'"></iframe>'+
      '<div class="vdn">'+note+'</div></div>';
  }
  openSheet('<div class="grab"></div><h3>Video check</h3>'+
    '<div class="ssub">Four ways of embedding the same clip. Tap the play button inside each. Tell me which ones play and which stay black, and the cause stops being a guess.</div>'+
    frame("A &middot; youtube.com, no autoplay","https://www.youtube.com/embed/"+id+"?rel=0&playsinline=1&modestbranding=1"+org,"what v7.13 now ships")+
    frame("B &middot; nocookie, no autoplay","https://www.youtube-nocookie.com/embed/"+id+"?rel=0&playsinline=1&modestbranding=1"+org,"stricter privacy host")+
    frame("C &middot; autoplay","https://www.youtube.com/embed/"+id+"?autoplay=1&rel=0&playsinline=1"+org,"what shipped before, expected to fail on iOS")+
    '<a class="sheet-cta ghost" href="'+ytWatch(id)+'" target="_blank" rel="noopener">D &middot; Open in the YouTube app</a>'+
    '<div class="anote" style="margin-top:10px">Running as an installed app: <b>'+((window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone?"yes, standalone":"no, in the browser")+'</b>. That difference matters, so check it both ways if you can.</div>'+
    '<button class="sheet-cta" onclick="closeSheet()">Done</button>');
}
function playVid(id,slot){
  var v=vidById(id),host=document.getElementById(slot);if(!v||!host)return;
  var face=host.querySelector(".vface");if(!face)return;
  var f=document.createElement("iframe");
  f.className="vframe";
  f.setAttribute("allow","accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen");
  f.setAttribute("allowfullscreen","");
  f.setAttribute("referrerpolicy","strict-origin-when-cross-origin");
  f.setAttribute("title",v.t);
  /* v7.13. THE iOS FIX, third attempt, and this time the reasoning is written down.
     iOS will not start a cross-origin video without a user gesture DELIVERED INSIDE THAT FRAME.
     Tapping our facade is a gesture on OUR page; inserting an iframe that immediately asks for
     autoplay is a request Safari refuses without ever telling the page, which is precisely the
     black frame that never initialises. v7.x removed a synthetic click for the same reason but
     left autoplay=1 in the URL, so the same refusal survived the fix.
     No autoplay. The frame loads YouTube's own poster and play button, and the tap on THAT is a
     real in-frame gesture that iOS honours. One extra tap, and it actually plays.
     `origin` is sent because an embed without it is the usual source of a 153. */
  var org=(location.protocol==="https:")?("&origin="+encodeURIComponent(location.origin)):"";
  f.src="https://www.youtube.com/embed/"+id+"?rel=0&playsinline=1&modestbranding=1"+org;
  face.replaceWith(f);
  /* An embed can still refuse to start, and a black rectangle with no way out is the worst
     possible answer in the middle of a warm-up. Every played frame therefore carries a visible
     escape underneath it from the moment it swaps in. */
  if(!host.querySelector(".vesc")){
    var a=document.createElement("a");
    a.className="vesc";a.href=ytWatch(id);a.target="_blank";a.rel="noopener";
    a.textContent="Not playing? Open in YouTube";
    host.appendChild(a);
  }
}

function pickVid(cat,offset){

  var p=TODAY.split("-"),n=Math.floor(Date.UTC(+p[0],+p[1]-1,+p[2])/86400000)+(offset||0);
  return vs[((n%vs.length)+vs.length)%vs.length];

/* ============ THE LADDERS ============
   A track like mobility is not a pile to shuffle, it is a course to walk up. Before this the
   anchor picked a mobility clip by date, so the morning never developed him, it just rotated four
   videos forever. A ladder remembers where he is and moves on only on a day he actually finished
   the anchor, which means the routine gets harder because he kept showing up, not because a
   calendar turned over. Position lives in S.progress so it rides the sync across devices. */
function ladderList(track){return VID.filter(function(v){return v.c===track&&v.lv;}).sort(function(a,b){return a.lv-b.lv;});}
function ladderPos(track){var p=(S.progress||{})["ladder_"+track];return (typeof p==="number"&&p>=0)?p:0;}
function ladderVid(track){var l=ladderList(track);if(!l.length)return null;return l[ladderPos(track)%l.length];}
/* Ticking session N means the course now sits at N+1, which is right whether he worked straight
   through or jumped ahead. Replaced the old blind +1 on anchor completion: that inferred the
   session from a checkbox about press-ups, which is not the same claim. */
function setLadderAfter(track,lv){
  var l=ladderList(track);if(!l.length)return;
  S.progress=S.progress||{};
  S.progress["ladder_"+track]=lv%l.length;
  S.progress["ladderday_"+track]=TODAY;
}

/* A hundred and sixty facades behind one disclosure is a wall, not a library. Each track is now
   its own drawer carrying its own count, and the three Runna courses are chunked into blocks of
   six with the block he is currently in opened by default, so reaching the next session is a tap
   instead of a scroll past everything he has already done. Counts turn green as blocks complete,
   which is the same done-language as the rest of the app. (Matthew, 2026-07-29) */
function libSection(cat,label){
  var vs=vidsBy(cat);if(!vs.length)return "";
  var lad=ladderList(cat),inner="",note="";
  if(lad.length>6){
    var pos=ladderPos(cat),cur=lad[pos%lad.length],curBlock=Math.floor((pos%lad.length)/6);
    note='You are on session '+(cur?cur.lv:1)+' of '+lad.length+'.';
    for(var b=0;b*6<lad.length;b++){
      var chunk=lad.slice(b*6,b*6+6);
      var dn=0;chunk.forEach(function(v){if(vDone(v.id))dn++;});
      inner+='<details class="libsub"'+(b===curBlock?' open':'')+'><summary><span>Sessions '+chunk[0].lv+' to '+chunk[chunk.length-1].lv+'</span>'+
        '<span class="lcount'+(dn===chunk.length?' gd':'')+'">'+dn+' of '+chunk.length+'</span></summary><div class="vrow">';
      chunk.forEach(function(v){inner+=vidCardHTML(v);});
      inner+='</div></details>';
    }
    var extra=vs.filter(function(v){return !v.lv;});
    if(extra.length){
      inner+='<details class="libsub"><summary><span>Standalone</span><span class="lcount">'+extra.length+'</span></summary><div class="vrow">';
      extra.forEach(function(v){inner+=vidCardHTML(v);});
      inner+='</div></details>';
    }
  }else{
    inner='<div class="vrow">';
    vs.forEach(function(v){inner+=vidCardHTML(v);});
    inner+='</div>';
  }
  var done=0;vs.forEach(function(v){if(vDone(v.id))done++;});
  return '<details class="libsub top"><summary><span>'+(label||VCAT[cat]||cat)+'</span>'+
    '<span class="lcount'+(done?' gd':'')+'">'+(done?done+' of '+vs.length:vs.length)+'</span></summary>'+
    (note?'<div class="libnote">'+note+'</div>':'')+inner+'</details>';
}
function vidRowHTML(cat,label){

  var h='<div class="sectlbl">'+(label||VCAT[cat])+'</div><div class="vrow">';

function libraryHTML(cat){
  cat=cat||"lift";
  /* Verified follow-alongs first, playable in place. The per-exercise search grid stays
     below them: those answer "how do I do this move", which a curated list cannot. */
  /* Eighty facades stacked open turn a focused tab into a scroll. The guided card already puts
     the right video in front of you where it matters, so the full shelf lives behind a disclosure
     and the tab stays about training rather than about browsing. */
  var groups=(cat==="lift")
    ? [["warmup","Warm up for lifting"],["strength","Follow along, strength"],["pilates","Pilates course"],["mobility","Mobility course"],["core","Core finishers"],["yoga","Yoga"]]
    : [["runwarm","Before a run"],["mobility","Mobility course"],["recovery","Stretch and stability"],["pilates","Pilates course"],["meditation","Wind down"]];
  var inner="",n=0;
  groups.forEach(function(g){inner+=libSection(g[0],g[1]);n+=vidsBy(g[0]).length;});
  var h='<details class="libdrop"><summary><span>Follow-along videos</span><span class="lcount">'+n+'</span></summary><div class="libpad nested">'+inner+'</div></details>';

     exercises with their form videos. Retired 2026-07-29: Your Movements now carries every
     movement grouped by day, with the video on each row, so this was the same shelf twice. */
  return h;
}

/* ============ SETTINGS, v7.10 ============
   Visual and functional, per Matthew. v7.2 only regrouped it.
   The visual defect was one line of CSS wearing a disguise: `.seg button.sel` used `var(--surface)`,
   which in DARK mode is DARKER than the `--surface-2` track, so the selected option read as a hole
   punched in the control rather than a raised chip. Every segmented control in the app looked
   broken, and the fix is a dedicated `--seg-chip` that is genuinely lighter than its track in dark
   and white in light. The second visual defect was arithmetic: every control carried its own
   hand-set max-width (210, 150, 120, 190, 160), so nothing lined up down the right edge. One width.
   Functionally it gained the four things it could not do: force a sync and see the real outcome,
   restore from a backup file (export existed, import was written but never exposed here), set the
   stretch goal that has been in the profile all along with no UI, and see the weigh-in cadence,

/* Cadence is reported, never nagged. The card refuses to measure a rate for a stated reason, so

  var spans=[];for(var i=0;i<S.weigh.length;i++)if(daysBetween(S.weigh[i].date,TODAY)<=28)spans.push(S.weigh[i].date);
  var span=spans.length>1?daysBetween(spans[0],spans[spans.length-1]):0;

  if(span<14)return {rag:"amber",t:spans.length+" weigh-ins, but only "+span+" days apart",s:"Three readings inside two weeks cannot separate a real trend from scale noise. Spread them out and the card starts measuring."};
  return {rag:"good",t:spans.length+" weigh-ins across "+span+" days",s:"Enough to fit a rate. Keep it up and the window tightens."};

/* SHEET GENERATION. closeSheet schedules a teardown 220ms out, to let the close animation finish
   before an iframe is destroyed. Any flow that closes one sheet and opens another inside that
   window therefore had its NEW sheet wiped by the OLD sheet's teardown. That is the warm-up gate
   exactly: primeGo closes at 0ms and opens the run sheet at 120ms, so at 220ms the run sheet was
   emptied and the screen went dead. It hit "Start the run" as well as "Skip the warm-up"; Matthew
   happened to find it on skip. The teardown now only runs if no sheet has been opened since.
   (2026-07-29) */
var SHEET_GEN=0;
function openSheet(html){SHEET_GEN++;document.getElementById("sheet").innerHTML=html;document.getElementById("scrim").classList.add("on");}
function closeSheet(){
  var gen=SHEET_GEN;
  var sc=document.getElementById("scrim");if(sc)sc.classList.remove("on");
  /* Tear the sheet down after the close animation. An <iframe> that leaves the screen keeps
     playing audio until it is removed from the document, which is why skipping a warm-up left a
     video running behind the workout. Killing the src first stops it immediately. */
  setTimeout(function(){
    if(gen!==SHEET_GEN)return; /* a new sheet opened in the meantime; it is not ours to tear down */
    var sh=document.getElementById("sheet");if(!sh)return;
    sh.querySelectorAll("iframe").forEach(function(f){try{f.src="about:blank";}catch(e){}f.remove();});
    sh.innerHTML="";
  },220);
}
/* Any full-screen view change should also silence a playing video, wherever it was started. */
function stopAllVideo(){
  document.querySelectorAll("iframe.vframe").forEach(function(f){try{f.src="about:blank";}catch(e){}f.remove();});
}
document.getElementById("scrim").addEventListener("click",function(e){if(e.target===this)closeSheet();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet();});
var toastT=null,toastUndo=null;
function toast(msg,undo){var t=document.getElementById("toast");document.getElementById("toast-m").textContent=msg;
  var ub=document.getElementById("toast-u");ub.style.display=undo?"block":"none";toastUndo=undo||null;
  t.classList.add("on");if(toastT)clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("on")},undo?5000:2600);}
/* Tapping anywhere on the toast dismisses it. The backup nag in particular used to sit on top of
   the weight card with no way to clear it short of waiting. */
function hideToast(){var t=document.getElementById("toast");if(t)t.classList.remove("on");if(toastT)clearTimeout(toastT);}
(function(){var t=document.getElementById("toast");if(t)t.addEventListener("click",function(e){
  if(e.target&&e.target.id==="toast-u")return; hideToast();});})();

/* ============ CAL AI WEEKLY DUMP ============
   Cal AI has no public API and no verified deep link, so nothing here pretends to talk to it.
   What it does is accept a week of nutrition in one paste: either the JSON shape below, or plain
   rows copied from a export, one day per line. Protein against your target sets the green days on
   the scorecard; calories are stored for the trend. A day already logged is overwritten, so
   re-pasting the same week is safe. */
function calaiSheet(){
  var pt=proteinTarget();
  openSheet('<div class="grab"></div><h3>Weekly nutrition dump</h3>'+
    '<div class="ssub">Paste a week from Cal AI. One day per line, or the JSON shape. '+(pt?('Protein target is <b>'+pt.lo+'-'+pt.hi+' g</b>.'):'Log a weigh-in to set your protein target.')+'</div>'+
    '<textarea class="ta" id="cj" style="min-height:150px" placeholder="2026-07-27, 168, 2210&#10;2026-07-26, 141, 1980&#10;&#10;or&#10;{&quot;days&quot;:[{&quot;date&quot;:&quot;2026-07-27&quot;,&quot;proteinG&quot;:168,&quot;calories&quot;:2210}]}"></textarea>'+
    '<div class="anote" style="margin-top:10px">Date, protein in grams, calories. Calories are optional.</div>'+
    '<button class="sheet-cta" onclick="doCalai()">Import the week</button>');
}
function parseCalai(t){
  t=(t||"").trim();if(!t)return [];
  if(t.charAt(0)==="{"||t.charAt(0)==="["){
    var o;try{o=JSON.parse(t)}catch(e){return null;}
    var arr=o.days||o.entries||(Array.isArray(o)?o:[]);
    return arr.map(function(r){
      return {date:r.date,protein:+(r.proteinG!=null?r.proteinG:r.protein),cals:+(r.calories!=null?r.calories:r.cals)||0};
    }).filter(function(r){return r.date&&!isNaN(r.protein);});
  }
  var out=[];
  t.split(/\n+/).forEach(function(line){
    var parts=line.split(/[,\t;]+/).map(function(x){return x.trim();});
    if(parts.length<2)return;
    var dt=parts[0],pr=parseFloat(parts[1]),cl=parts.length>2?parseFloat(parts[2]):0;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(dt)||isNaN(pr))return;
    out.push({date:dt,protein:pr,cals:isNaN(cl)?0:cl});
  });
  return out;
}
function doCalai(){
  var rows=parseCalai((document.getElementById("cj")||{}).value);
  if(rows===null){toast("That is not valid JSON.",null);return;}
  if(!rows.length){toast("Nothing readable in there. Date, protein, calories.",null);return;}
  var pt=proteinTarget(),lo=pt?pt.lo:120,hit=0;
  S.nutrition=S.nutrition||{};
  rows.forEach(function(r){
    S.nutrition[r.date]={p:r.protein,c:r.cals};
    if(r.protein>=lo){S.protein[r.date]=true;hit++;}else{delete S.protein[r.date];}
  });
  save();closeSheet();refreshCurrent();
  toast("Imported "+rows.length+" day"+(rows.length===1?"":"s")+", "+hit+" hit protein.",null);
}

/* Two routes in, because the Shortcut route needs you to build a Shortcut and the export route
   needs nothing but the Health app. Apple's own "Export All Health Data" produces a zip holding
   export.xml; the parser below reads that XML directly for steps, bodyweight and workouts, so
   there is a working path even if the Shortcut never gets built. */
function healthChoiceSheet(){

    optRow(I.bolt,"Paste Shortcut JSON","If you built the Train export Shortcut","healthSheet()"));

  openSheet('<div class="grab"></div><h3>Apple Health export</h3>'+
    '<div class="ssub">On your phone: Health, tap your photo, Export All Health Data. Unzip it, open <b>export.xml</b>, copy the whole thing and paste it below. It is large, so give it a moment.</div>'+
    '<textarea class="ta" id="hx" placeholder="&lt;HealthData&gt;..." style="min-height:150px"></textarea>'+
    '<div class="anote" style="margin-top:10px">Only step counts, bodyweight and workouts are read. Everything else in the file is ignored and nothing leaves this device.</div>'+
    '<button class="sheet-cta" onclick="doHealthXml()">Read it</button>');
}
/* Parsed with the browser's own XML parser rather than by hand, and with a cap on how much is
   walked, because a multi-year export can carry hundreds of thousands of records. */
function doHealthXml(){
  var t=(document.getElementById("hx")||{}).value||"";
  if(t.indexOf("<HealthData")<0){toast("That does not look like export.xml.",null);return;}
  var doc;try{doc=new DOMParser().parseFromString(t,"text/xml");}catch(e){toast("Could not read that file.",null);return;}
  if(doc.getElementsByTagName("parsererror").length){toast("That file is not complete XML.",null);return;}
  var recs=doc.getElementsByTagName("Record"),stepsBy={},nW=0,nS=0;
  for(var i=0;i<recs.length;i++){
    var r=recs[i],ty=r.getAttribute("type")||"",dt=(r.getAttribute("startDate")||"").slice(0,10),v=parseFloat(r.getAttribute("value"));
    if(!dt||isNaN(v))continue;
    if(ty.indexOf("StepCount")>=0){stepsBy[dt]=(stepsBy[dt]||0)+v;}
    else if(ty.indexOf("BodyMass")>=0){
      var unit=r.getAttribute("unit")||"lb";
      var lb=(unit.indexOf("kg")>=0)?v*2.20462:v;
      S.weigh=S.weigh.filter(function(x){return x.date!==dt;});
      S.weigh.push({date:dt,w:Math.round(lb*10)/10});nW++;
    }
  }
  Object.keys(stepsBy).forEach(function(k){S.steps[k]=Math.round(stepsBy[k]);nS++;});
  var wo=doc.getElementsByTagName("Workout"),nA=0,seen={};
  S.sessions.forEach(function(x){seen[x.id]=true;});
  for(var j=0;j<wo.length;j++){
    var w=wo[j],dt2=(w.getAttribute("startDate")||"").slice(0,10);
    if(!dt2)continue;
    var mins=parseFloat(w.getAttribute("duration"))||0;
    var ty2=(w.getAttribute("workoutActivityType")||"").replace("HKWorkoutActivityType","");
    /* v7.12 BUG. totalDistance is expressed in whatever totalDistanceUnit says, which is km for a
       metric export and mi for an imperial one, and this read the number raw. A km export therefore
       recorded every run 1.609x short, silently, and every derived pace with it. Convert. */
    var dist=parseFloat(w.getAttribute("totalDistance"))||0;
    var du=(w.getAttribute("totalDistanceUnit")||"mi").toLowerCase();
    if(du.indexOf("km")>=0)dist=dist*0.621371;
    else if(du==="m"||du.indexOf("meter")>=0)dist=dist*0.000621371;
    var isRun=/Running/i.test(ty2);
    /* Was dt2 + the loop index, which changes whenever Apple reorders the file, so the same workout
       could import repeatedly under different ids. Content-keyed, matching the Shortcut path. */
    var id=dt2+"-h"+(isRun?"run":(ty2||"act").toLowerCase())+"-"+Math.round(mins*60)+"-"+Math.round(dist*100);
    if(seen[id])continue;
    seen[id]=true;
    var rec={id:id,date:dt2,type:isRun?"run":"activity",durationSec:Math.round(mins*60),notes:"Apple Health"};
    if(isRun){rec.distanceMi=Math.round(dist*10)/10;if(rec.distanceMi>0&&rec.durationSec)rec.paceSecPerMi=Math.round(rec.durationSec/rec.distanceMi);}
    else rec.activity=ty2||"Workout";
    S.sessions.push(rec);S.done[dt2]=true;nA++;
  }
  S.weigh.sort(function(a,b){return a.date<b.date?-1:1;});
  S.sessions.sort(function(a,b){return a.date<b.date?-1:1;});
  save();closeSheet();refreshCurrent();
  toast("Read "+nS+" days of steps, "+nW+" weigh-ins and "+nA+" workouts.",null);
}
function healthSheet(){
  openSheet('<div class="grab"></div><h3>Import from Apple Health</h3><div class="ssub">Paste the JSON your Shortcut produces. Pulls in weight and workouts (incl. Apple Watch).</div>'+
    '<textarea class="ta" id="hj" placeholder=\'{"weighins":[{"date":"2026-07-16","weightLb":189}],"activities":[{"type":"run","date":"2026-07-16","durationSec":1400,"distanceMi":2.1}]}\' style="min-height:150px"></textarea>'+
    '<button class="sheet-cta" onclick="doHealth()">Import</button>');
}
function doHealth(){var t=(document.getElementById("hj")||{}).value,o;try{o=JSON.parse(t)}catch(e){toast("That is not valid JSON.",null);return;}
  var n=0;
  if(o.steps)o.steps.forEach(function(x){if(x.date&&x.count!=null){S.steps[x.date]=+x.count;n++;}});
  if(o.weighins)o.weighins.forEach(function(w){if(w.date&&w.weightLb){S.weigh=S.weigh.filter(function(x){return x.date!==w.date;});S.weigh.push({date:w.date,w:w.weightLb});n++;}});
  S.weigh.sort(function(a,b){return a.date<b.date?-1:1;});
  /* v7.12 BUG. APPLE-HEALTH-SHORTCUT.md promises that "a day already present is overwritten rather
     than duplicated, so re-importing an overlapping range is safe and is in fact the expected
     behaviour". That was true of weigh-ins and false of workouts: the id was date + a running
     counter, so importing the same week twice created a second copy of every session, inflating
     mileage, volume and the cardio level. The id is now derived from the CONTENT, so the same
     workout imported twice is the same record twice and the second one is skipped. */
  if(o.activities)o.activities.forEach(function(a){
    if(!a.date)return;
    var isRun=(a.type==="run"||!!a.distanceMi);
    var key=a.date+"-h"+(isRun?"run":String(a.type||"act").toLowerCase())+"-"+Math.round(a.durationSec||0)+"-"+Math.round((a.distanceMi||0)*100);
    if(S.sessions.some(function(x){return x.id===key;}))return;
    n++;
    if(isRun)S.sessions.push({id:key,date:a.date,type:"run",distanceMi:a.distanceMi||0,durationSec:a.durationSec||0,paceSecPerMi:(a.distanceMi&&a.durationSec)?Math.round(a.durationSec/a.distanceMi):0,rpe:"",notes:"Apple Health"});
    else S.sessions.push({id:key,date:a.date,type:"activity",activity:a.type||"Workout",durationSec:a.durationSec||0,notes:"Apple Health"});
    S.done[a.date]=true;});
  S.sessions.sort(function(a,b){return (a.date+"|"+a.id)<(b.date+"|"+b.id)?-1:1;});
  save();closeSheet();toast("Imported "+n+" items from Health.",null);show("track");}

function scrollToWarm(){var e=document.getElementById("warmblock");if(e)e.scrollIntoView({behavior:"smooth",block:"start"});}
/* ============ CARDIO LEVEL SYSTEM (Round C) ============
   Levels come from an exponentially weighted average of daily cardio load, the way TrainingPeaks
   and Strava compute fitness, rather than from points added and taken away. That one choice makes
   decay honest and non-punitive: missing a week is not a penalty event, it is the same formula
   running with zero input, and the curve bends gently instead of docking you.
   The displayed level never animates downward mid-session; it changes only when a real threshold
   is crossed, and it is phrased as a location rather than a loss. */
/* ============ LEVEL SYSTEM v2 ============
   Rebuilt to the spec at Daily-Tool/research/LEVELING-SPEC-2026-07-28.md, which found the previous
   curve was calibrated for a professional: a symmetric 21-day average settles at mean daily load, so
   four sessions a week parked the score at about 20 forever, and level 10 would have demanded
   roughly eleven hours of running a week. The number could not move, which is the worst property a
   level can have.

   Load is TrainingPeaks' TSS algebra with a MET-based intensity substituted for a power meter,
   hours x 100 x IF^2, where IF is the session's METs over 9.4, the published cost of running a ten
   minute mile. MET regressions come from the 2024 Adult Compendium. That substitution is the one
   genuinely novel move and it is what lets a run, a walk and a lift land on one scale without a
   hand-tuned multiplier per activity.

   The average is ASYMMETRIC: it rises on a 42-day constant and falls on a 120-day one. Detraining
   research puts real VO2max loss near five percent over a fortnight, so a score that fell 28 percent
   in the same fortnight was not measuring the athlete. Falling slowly also means a short lift is
   never punished for being smaller than the running average. */
var REF_MET=9.40,IF_CAP=1.30,DAY_CAP=300;
var RISE_SLOW=42,FALL_SLOW=120,RISE_FAST=7,FALL_FAST=20;
var LIFT_MET={6:3.5,7:4.2,8:5.0,9:5.5,10:6.0};
var EFFORT_MET={easy:3.5,moderate:5.0,hard:7.5};
function runMET(mph){return 1.4396*mph+0.7615;}
function walkMET(mph){return Math.max(2.0,1.7630*mph-1.3589);}
function intensityMET(s){
  var pace=s.paceSecPerMi||0,mph=pace>0?(3600/pace):0;
  if(s.type==="run"&&pace>=240&&pace<=1200)return runMET(mph);
  if(s.type==="activity"&&pace>0&&pace<720)return runMET(mph);
  if(s.type==="activity"&&pace>=720&&pace<=2400)return walkMET(mph);
  if(s.type==="lift"&&typeof s.rpe==="number")return LIFT_MET[Math.max(6,Math.min(10,Math.round(s.rpe)))]||4.5;
  if(s.type==="lift")return 4.5;
  var lab=(""+(s.rpe||"")).toLowerCase();
  if(EFFORT_MET[lab])return EFFORT_MET[lab];
  if(s.type==="run")return 8.6;
  return 3.8;
}
function sessionHours(s){
  var sec=s.durationSec||0;
  if(!sec&&s.distanceMi&&s.paceSecPerMi)sec=s.distanceMi*s.paceSecPerMi;
  if(!sec&&s.type==="lift"&&s.entries){var n=0;s.entries.forEach(function(e){n+=(e.sets||[]).length;});sec=Math.min(n*240,5400);}
  return sec/3600;
}
function loadFor(s){
  if(!s)return 0;
  var hrs=sessionHours(s);if(hrs<=0)return 0;
  var IF=Math.min(intensityMET(s)/REF_MET,IF_CAP);
  return hrs*100*IF*IF;
}
function dailyLoad(){
  var by={};S.sessions.forEach(function(s){if(!s.date)return;by[s.date]=(by[s.date]||0)+loadFor(s);});
  Object.keys(by).forEach(function(k){if(by[k]>DAY_CAP)by[k]=DAY_CAP;});
  return by;
}
/* The rise and fall constants must share a ratio on both lines, or fast minus slow carries a
   permanent offset and the status word stops meaning anything. 42:120 and 7:20 are the same ratio. */
function ewStep(cur,load,rise,fall){var tau=(load>cur)?rise:fall;return cur+(load-cur)/tau;}
function fitnessSeries(days){
  days=days||180;
  var by=dailyLoad(),out=[],slow=0,fast=0;
  var d=new Date(NOW);d.setDate(d.getDate()-days+1);
  for(var i=0;i<days;i++){
    var v=by[keyOf(d)]||0;
    slow=ewStep(slow,v,RISE_SLOW,FALL_SLOW);
    fast=ewStep(fast,v,RISE_FAST,FALL_FAST);
    out.push({date:keyOf(d),slow:slow,fast:fast,load:v});
    d.setDate(d.getDate()+1);

}
/* T(n) = 0.109 * (n-1)^1.6, capped at 100 levels. Matthew asked for a 1-to-100 scale on
   2026-07-29, for more frequent level-ups and a ceiling worth climbing toward. The exponent was
   chosen so that level 100 lands on 170 load, which was the practical ceiling of the old 25-level
   curve, and so the early levels come quickly: level 2 at 0.11, level 5 at 1.0, level 10 at 3.7.
   Calibration against real training: three months steady reaches about 13, six months solid about
   26, a hard year about 52. Nobody hits 100 by accident, which is the point of a ceiling. */
var LVL_A=0.109, LVL_P=1.6, LVL_MAX=100;
function levelFloor(n){return n<=1?0:LVL_A*Math.pow(n-1,LVL_P);}
function levelFor(score){var n=1;while(n<LVL_MAX&&score>=levelFloor(n+1))n++;return n;}
/* Four tiers over the hundred, named and coloured. The ramp is a heat ramp rather than a
   good-to-bad one, because a low level is not a failure state, it is an early one. */
function levelTier(n){
  if(n>=70)return {k:"elite",w:"Elite"};
  if(n>=45)return {k:"strong",w:"Strong"};
  if(n>=20)return {k:"built",w:"Built"};
  return {k:"base",w:"Base"};
}
function cardioLevel(){
  var s=fitnessSeries(180);
  var last=s.length?s[s.length-1]:{slow:0,fast:0};
  var score=last.slow,lvl=levelFor(score);
  var lo=levelFloor(lvl),hi=levelFloor(lvl+1),span=Math.max(hi-lo,1);
  var pips=Math.max(0,Math.min(9,Math.floor(10*(score-lo)/span)));
  var monthAgo=s.length>29?s[s.length-30].slow:0;
  var r=(last.fast-last.slow)/Math.max(last.slow,1);
  return {lvl:lvl,score:score,lo:lo,hi:hi,span:span,pips:pips,fast:last.fast,slow:last.slow,
          r:r,delta:score-monthAgo,series:s,sessions:S.sessions.length};
}
/* Five words, no red state and no downward arrow. Amber is reserved for the one fixable condition. */
function levelStatus(L){
  var firstDate=null;S.sessions.forEach(function(x){if(!firstDate||x.date<firstDate)firstDate=x.date;});
  var age=firstDate?daysBetween(firstDate,TODAY):0;
  if(L.sessions<4||age<14)
    return {w:"Getting a baseline",k:"base",c:"Four sessions before this number means anything."};
  var mono=monotony();
  var wkLoad=lastNLoad(7),base4=lastNLoad(28)/4;
  if(mono>2.0&&base4>0&&wkLoad>base4*1.3&&sessionsIn(7)>=4)
    return {w:"Ramping fast",k:"warn",c:"Every day the same effort this week. Make one of them easy."};
  var r=L.r;
  if(r>=0.20)return {w:"Ramping",k:"good",c:"Doing more than usual. Keep one of them easy."};
  if(r>=0.06)return {w:"Building",k:"good",c:"Up "+Math.max(1,Math.round(L.delta))+" points in the last four weeks."};
  if(r>-0.06)return {w:"Holding",k:"flat",c:"Level with where you were a month ago."};
  if(r>-0.20)return {w:"Easing",k:"flat",c:"Quieter than usual. Nothing has been lost."};
  return {w:"Coming back",k:"flat",c:"A couple of runs gets this climbing again."};
}
function lastNLoad(n){var by=dailyLoad(),t=0,d=new Date(NOW);for(var i=0;i<n;i++){t+=by[keyOf(d)]||0;d.setDate(d.getDate()-1);}return t;}
function sessionsIn(n){var c=0,d=new Date(NOW);for(var i=0;i<n;i++){var k=keyOf(d);if(S.sessions.some(function(x){return x.date===k;}))c++;d.setDate(d.getDate()-1);}return c;}
/* Foster's monotony: mean daily load over its standard deviation. High monotony plus a load spike is
   the combination the overtraining literature associates with trouble. */
function monotony(){
  var by=dailyLoad(),v=[],d=new Date(NOW);
  for(var i=0;i<7;i++){v.push(by[keyOf(d)]||0);d.setDate(d.getDate()-1);}
  var m=v.reduce(function(a,x){return a+x;},0)/7;
  if(m<=0)return 0;
  var sd=Math.sqrt(v.reduce(function(a,x){return a+Math.pow(x-m,2);},0)/7);
  return sd>0?(m/sd):0;
}
/* The level tracks training load. Easy pace answers the different question, whether you got fitter,
   and it ships with its caveat visible because without heart rate "easy" is self-reported. */
function easyPaceTrend(){
  var A=[],B=[];
  S.sessions.forEach(function(x){
    if(x.type!=="run"||!x.paceSecPerMi)return;
    if((""+(x.rpe||"")).toLowerCase()!=="easy")return;
    var age=daysBetween(x.date,TODAY);
    if(age<=56)A.push(x.paceSecPerMi);else if(age<=112)B.push(x.paceSecPerMi);
  });
  if(A.length<4||B.length<4)return null;
  function med(a){a=a.slice().sort(function(x,y){return x-y;});var h=Math.floor(a.length/2);return a.length%2?a[h]:(a[h-1]+a[h])/2;}
  var a=med(A),bm=med(B),diff=bm-a;
  if(Math.abs(diff)<8)return null;
  return {now:a,prev:bm,diff:diff};
}
/* ============ THE LIFT LEVEL ============
   Matthew's call, 2026-07-29: he did not want any of the three coach designs, he wanted the Cardio
   level system again, for lifting. So this is not a lookalike. It is the SAME machinery: the same
   asymmetric EWMA with the same 42/120 constants, the same quadratic level curve, the same ten
   pips, the same five-word status vocabulary. Only the load unit differs, because a lift is not a
   run.

   Cardio prices a session in MET-hours. Lifting has no MET worth trusting, so it uses the standard
   resistance-training unit instead: Foster's session RPE, effort multiplied by minutes. The app has
   collected both since the RPE picker was widened to 1-10. An unrated session is priced at 7, which
   is a real assumption and is stated on the card rather than hidden.

   The divide-by-four is a scale match, not a fudge: a 30-minute lift at RPE 7 is 210 Foster units
   against about 50 for a 30-minute easy run, so dividing by four puts the two on ONE scale. That is
   deliberate. Lift level 6 and cardio level 6 should mean roughly the same amount of training. */
var LIFT_RPE_ASSUMED=7, LIFT_SCALE=4;
function liftLoadFor(s){
  if(!s||s.type!=="lift")return 0;
  var mins=(s.durationSec||0)/60;if(mins<=0)return 0;
  var rpe=(typeof s.rpe==="number"&&s.rpe>0)?s.rpe:LIFT_RPE_ASSUMED;
  return (rpe*mins)/LIFT_SCALE;
}
function liftDailyLoad(){
  var by={};S.sessions.forEach(function(x){if(!x.date||x.type!=="lift")return;by[x.date]=(by[x.date]||0)+liftLoadFor(x);});
  Object.keys(by).forEach(function(k){if(by[k]>DAY_CAP)by[k]=DAY_CAP;});
  return by;
}
function liftSeries(days){
  days=days||180;
  var by=liftDailyLoad(),out=[],slow=0,fast=0;
  var d=new Date(NOW);d.setDate(d.getDate()-days+1);
  for(var i=0;i<days;i++){
    var v=by[keyOf(d)]||0;
    slow=ewStep(slow,v,RISE_SLOW,FALL_SLOW);
    fast=ewStep(fast,v,RISE_FAST,FALL_FAST);
    out.push({date:keyOf(d),slow:slow,fast:fast,load:v});
    d.setDate(d.getDate()+1);
  }
  return out;
}
function liftLevel(){
  var s=liftSeries(180);
  var last=s.length?s[s.length-1]:{slow:0,fast:0};
  var score=last.slow,lvl=levelFor(score);
  var lo=levelFloor(lvl),hi=levelFloor(lvl+1),span=Math.max(hi-lo,1);
  var pips=Math.max(0,Math.min(9,Math.floor(10*(score-lo)/span)));
  var monthAgo=s.length>29?s[s.length-30].slow:0;
  var r=(last.fast-last.slow)/Math.max(last.slow,1);
  var n=S.sessions.filter(function(x){return x.type==="lift";}).length;
  return {lvl:lvl,score:score,lo:lo,hi:hi,span:span,pips:pips,fast:last.fast,slow:last.slow,
          r:r,delta:score-monthAgo,series:s,sessions:n};
}
/* Same vocabulary as Cardio, with the one lifting-specific amber: training hard while never
   actually adding load is the failure mode that a level alone cannot see. */
function liftLevelStatus(L){
  if(L.sessions<4)return {w:"Getting a baseline",k:"base",c:"Four sessions before this number means anything."};
  var c=coachState();
  if(c.k==="layoff")return {w:"Coming back",k:"flat",c:"Loads pull back a step for a session or two. This is a ramp, not a reset."};
  if(c.k==="red")return {w:"Ramping fast",k:"warn",c:"Effort has averaged "+(c.avg?c.avg.toFixed(1):"high")+" over three sessions. Hold the loads until that settles."};
  var r=L.r;
  if(r>=0.20)return {w:"Ramping",k:"good",c:"Doing more than usual. Keep the next one honest rather than heavier."};
  if(r>=0.06)return {w:"Building",k:"good",c:"Up "+Math.max(1,Math.round(L.delta))+" points in the last four weeks."};
  if(r>-0.06)return {w:"Holding",k:"flat",c:"Level with a month ago. "+(c.k==="green"?"There is room to add load.":"Repeat the loads and earn the jump.")};
  if(r>-0.20)return {w:"Easing",k:"flat",c:"Quieter than usual. Nothing has been lost."};
  return {w:"Coming back",k:"flat",c:"One session gets this climbing again."};
}
function levelRingHTML(L){
  /* Three circles and two text nodes. The third circle punches ten hairline separators through both
     the track and the arc, because 2 + 23.13 is exactly a tenth of the circumference, so the pips
     need no per-pip geometry. Butt caps, because a round cap on a quantised arc overhangs its
     separator and makes six pips look like six and a half. The rotation sits on the group rather
     than the svg so the numeral stays upright. */
  var C=251.33,off=C*(1-L.pips/10);
  var _t=levelTier(L.lvl);
  return '<svg class="lring" data-tier="'+_t.k+'" width="104" height="104" viewBox="0 0 96 96" role="img" aria-label="Level '+L.lvl+', '+L.pips+' of 10 toward level '+(L.lvl+1)+'">'+
    '<g transform="rotate(-90 48 48)">'+
    '<circle cx="48" cy="48" r="40" fill="none" stroke="var(--surface-2)" stroke-width="8"/>'+
    '<circle class="lprog" cx="48" cy="48" r="40" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="butt" stroke-dasharray="'+C+'" stroke-dashoffset="'+off.toFixed(2)+'"/>'+
    '<circle cx="48" cy="48" r="40" fill="none" stroke="var(--surface)" stroke-width="8" stroke-dasharray="2 23.13"/></g>'+
    /* One numeral, optically centred with dominant-baseline rather than a guessed baseline offset,
       which is what had it sitting high. The word LEVEL used to sit under it and crowd the ring;
       it now lives outside, where it is said once instead of three times. (Matthew, 2026-07-29) */
    '<text x="48" y="48" text-anchor="middle" dominant-baseline="central" class="num" style="font-size:34px;font-weight:800;fill:var(--ink);letter-spacing:-.02em">'+L.lvl+'</text></svg>';
}
function fitnessSpark(L){
  var s=L.series.slice(-90);if(s.length<4)return "";
  var vs=s.map(function(p){return p.slow;}),mx=Math.max.apply(null,vs)||1,mn=Math.min.apply(null,vs);
  var W=300,H=30;
  var d=vs.map(function(v,i){var x=(i/(vs.length-1))*W,y=H-2-((v-mn)/((mx-mn)||1))*(H-6);return (i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1);}).join(" ");
  /* vector-effect keeps the stroke an even 1.5px; without it preserveAspectRatio="none" smears it. */
  return '<svg class="lspark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true"><path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
/* The ring and the headline moved up into the hero, so what is left here is the reading BEHIND
   the number: the trend line, the totals, the easy-pace check and the caveat about what a training
   load level is and is not. That is reference, not a call to action, so it is collapsed. */
/* Strava's Fitness & Freshness page makes the point that "the overall numbers aren't as important
   as general trends", and puts a seven-day delta beside the score for exactly that reason. The
   level had a number and a ring and no direction, so it could not answer the only question worth
   asking, which is whether this is going up. `research/exemplars-leveling-2026-07-28/
   strava_fitness-and-freshness.md`. (2026-07-29) */
function levelDelta(L){
  var ser=L.series||[];if(ser.length<8)return null;
  var now=ser[ser.length-1],prev=ser[ser.length-8];
  if(!now||!prev)return null;
  var a=now.slow||0,b=prev.slow||0;
  if(!b&&!a)return null;
  var d=a-b;
  return {d:d,pct:b?Math.round(d/b*100):null,dir:(Math.abs(d)<0.15)?"flat":(d>0?"up":"down")};
}
function levelDeltaHTML(L){
  var dl=levelDelta(L);if(!dl)return "";
  var w=dl.dir==="flat"?"holding":(dl.dir==="up"?"rising":"easing off");
  var sign=dl.d>0?"+":"";
  return '<div class="ldelta" data-d="'+dl.dir+'"><span class="ldv num">'+sign+dl.d.toFixed(1)+'</span>'+
    '<span class="ldl">over 7 days &middot; '+w+'</span></div>';
}
function levelDetailHTML(){
  var L=cardioLevel(),st=levelStatus(L),ep=easyPaceTrend();
  var runs=allRuns(),mi=runs.reduce(function(a,r){return a+(r.distanceMi||0);},0);
  var inner=levelDeltaHTML(L)+'<div class="ld" style="margin:10px 0">'+st.c+'</div>'+
    fitnessSpark(L)+
    '<div class="lstats"><span><b class="num">'+runs.length+'</b> runs</span><span><b class="num">'+mi.toFixed(0)+'</b> mi</span><span><b class="num">'+Math.round(L.score)+'</b> load</span></div>'+
    (ep?'<div class="anote" style="margin-top:12px">Easy pace <b>'+mmss(ep.now)+'/mi</b>, about '+Math.abs(Math.round(ep.diff))+' s/mi '+(ep.diff>0?"quicker":"slower")+' than eight weeks ago, at self-reported easy effort. That is the fitness part, which the level cannot show.</div>':'')+
    '<div class="foot" style="margin-top:10px">This is a training-load level, not a fitness test. It rises on a six-week average and falls on a seventeen-week one, so a quiet fortnight bends it rather than docking you.</div>';
  return collapsible("Where the level comes from","Level "+L.lvl,inner,false,I.spark,st.k==="base"?"warn":"");
}
/* Badges are dated records, shown in the order earned; locked ones stay visible as goals. */

/* ============ THE ODOMETER (v7.6) ============
   Matthew asked for a total-miles counter "same as within Nike Run Club". The geometry below was
   read off the real NRC Activity card rather than guessed: a W/M/Y/All segment on top, a context
   label, one very large numeral, the UNIT AS A CAPTION UNDERNEATH IT rather than inline, then
   three equal LEFT-ALIGNED columns with the value over a sentence-case grey label, all three at
   one type size. The first attempt right-aligned the supporting stats behind the hero number in
   tracked uppercase micro-labels, which is exactly what made it read as clutter.
   Avg pace is total time over total distance, NOT the mean of the per-run paces: on his record
   those differ by forty seconds a mile, and the aggregate is the true one. */
var ODOP="all";
function odoPeriod(p){
  var r=allRuns();
  if(p==="w"){var d=new Date(NOW);d.setDate(d.getDate()-((d.getDay()+6)%7));var k=keyOf(d);
    return {runs:r.filter(function(x){return x.date>=k;}),ctx:"This week"};}
  if(p==="m")return {runs:r.filter(function(x){return x.date.slice(0,7)===TODAY.slice(0,7);}),ctx:"This month"};
  if(p==="y")return {runs:r.filter(function(x){return x.date.slice(0,4)===TODAY.slice(0,4);}),ctx:"This year"};
  return {runs:r,ctx:"All time"};
}
function setOdo(p){
  ODOP=p;
  var e=document.getElementById("odoslot");if(!e)return;
  var tmp=document.createElement("div");tmp.innerHTML=odoCardHTML();
  var fresh=tmp.querySelector("#odoslot");
  if(fresh)e.innerHTML=fresh.innerHTML;
}
function hms(s){var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=Math.floor(s%60);
  return h?(h+":"+("0"+m).slice(-2)+":"+("0"+x).slice(-2)):(m+":"+("0"+x).slice(-2));}
function odoCardHTML(){
  var d=odoPeriod(ODOP),rs=d.runs;
  if(!allRuns().length)return "";
  var mi=rs.reduce(function(a,x){return a+(x.distanceMi||0);},0);
  var secs=rs.reduce(function(a,x){return a+(x.durationSec||0);},0);
  var pace=(mi>0&&secs>0)?Math.round(secs/mi):0;
  var seg=["w","m","y","all"].map(function(k){
    return '<button class="'+(k===ODOP?"on":"")+'" onclick="setOdo(\''+k+'\')">'+(k==="all"?"All":k.toUpperCase())+'</button>';}).join("");
  /* Matthew's call after seeing it live: a drawer like every other card on this tab, not a
     standing card. That also retires the card-law exception it would otherwise have needed. The
     lifetime total rides on the summary line, so it is readable without opening anything. */
  var body='<div class="odo2body" id="odoslot">'+
    '<div class="oseg">'+seg+'</div>'+
    '<div class="octx">'+d.ctx+'</div>'+
    '<div class="oN">'+mi.toFixed(1)+'</div><div class="oU">Miles</div>'+
    '<div class="orow">'+
      '<div><b>'+rs.length+'</b><span>Runs</span></div>'+
      '<div><b>'+(pace?mmss(pace):"--")+'</b><span>Avg. Pace</span></div>'+
      '<div><b>'+(secs?hms(secs):"--")+'</b><span>Time</span></div>'+
    '</div></div>';
  var total=allRuns().reduce(function(a,x){return a+(x.distanceMi||0);},0);
  return collapsible("Miles",total.toFixed(1)+" mi all time",body,false,I.gauge,"");
}

function renderCardio(){
  refreshDate();
  var rr=runRhythm(),tgt=nextRunTarget(),runs=allRuns();
  var inBlock=tgt.restart?0:(rr.count%3),toNext=3-inBlock;
  var L=cardioLevel(),LS=levelStatus(L);
  var h='<div class="head"><div><div class="date">Level '+L.lvl+' &middot; '+LS.w.toLowerCase()+'</div><div class="title">Cardio</div></div>'+
    '<div class="tools">'+streakChipHTML("cardio")+
    '<button class="iconbtn" onclick="settingsSheet()" aria-label="Settings">'+I.gear+'</button></div></div>';
  /* Top card mirrors Today: one headline, one call to action, nothing to read first. */
  /* Cardio's hero now carries the level ring itself rather than repeating a Today-shaped card and
     then showing the level underneath. The ring is the one thing this tab knows that no other tab
     does, so it belongs beside the call to action, not below it. The detail that used to sit in
     the level card moved into a drawer under it. (Matthew, 2026-07-29) */
  /* The level was being said three times on one card: in the page eyebrow, inside the ring, and
     again in a status line, with the status word repeated in two of them. It is said once now,
     next to the ring, as LEVEL n / one status word / n of 10 to the next. The run itself is the
     headline underneath, because that is what the tab is for. The mobility, stretch and pilates
     chips were removed entirely: they belong on Today and were pulling attention off the run.
     (Matthew, 2026-07-29) */
  h+='<div class="hero"><div class="chero"><div class="cheroL">'+levelRingHTML(L)+'</div>'+
    '<div class="cheroR" data-tier="'+levelTier(L.lvl).k+'"><div class="lvlk">Level '+L.lvl+'<span class="tierpill">'+levelTier(L.lvl).w+'</span></div>'+
    '<div class="lvlw" data-k="'+LS.k+'">'+esc(LS.w)+'</div>'+
    '<div class="lvlp">'+(LS.k==="base"?(allRuns().length+' of 4 runs logged'):('<b class="num">'+L.pips+'</b> of 10 to Level '+(L.lvl+1)))+'</div>'+
    '</div></div>'+
    '<div class="chsplit"></div>'+
    '<div class="lbl">Next run</div>'+
    '<h2 style="padding-right:0">'+(tgt.restart?"Ease back in":"Easy")+' &middot; '+tgt.mi+' mi</h2>'+
    '<div class="meta">'+(rr.gap===0?"You already ran today.":runStatusLine(rr))+'</div>'+
    '<button class="big-start" onclick="primeSheet(\'run\',function(){runSheet('+tgt.mi+')})">'+I.run+' Start a run</button>'+
    '<div class="herorow"><button class="wbtn" onclick="runSheet('+tgt.mi+')">Log a run</button>'+
    '<button class="wbtn" onclick="actSheet(\'walk\')">Log a walk</button></div></div>';
  h+=odoCardHTML();
  h+=levelDetailHTML();
  /* Warm-up sits high on the page, directly after the call to action, because it only works as
     a prompt if you meet it on the way out the door rather than below the history. */
  h+=paceZonesHTML();
  if(runs.length){
    var best=runs.reduce(function(a,r){return (r.paceSecPerMi&&(!a||r.paceSecPerMi<a))?r.paceSecPerMi:a;},0);
    var rec=runs.slice(-6).reverse().map(function(r){
      var pace=r.paceSecPerMi?mmss(r.paceSecPerMi):null;
      var isBest=(pace&&r.paceSecPerMi===best);
      var mi=r.distanceMi||0,w=Math.max(6,Math.min(100,(mi/5)*100));
      return '<button class="rrow" onclick="sessionSheet(\''+r.id+'\')">'+
        '<span class="rdate">'+shortDate(r.date)+'</span>'+
        '<span class="rbar"><i style="width:'+w.toFixed(0)+'%"></i></span>'+
        '<span class="rmi num">'+mi.toFixed(1)+'<small> mi</small></span>'+
        '<span class="rpace num'+(isBest?" best":"")+'">'+(pace||"--")+'</span></button>';
    }).join("");
    h+=collapsible("Recent runs",(best?("best "+mmss(best)+"/mi"):("last "+Math.min(6,runs.length))),rec,false,I.run,"");}

  var hist=weeklyMiHistory();
  h+=collapsible("Weekly miles",(hist.length?hist[hist.length-1].toFixed(1)+" mi this week":"no runs yet"),
      barBody(hist,function(v){return v.toFixed(1);},"mi"),false,I.chart,"");
  /* The standalone Walk card is gone. "Log a walk" already sits in the hero at the top of this
     tab, beside "Log a run", which is where a logging action belongs. Two entry points for the
     same action on one screen was the duplication flagged twice. */
  h+='<div class="foot">This adapts to how often you actually run, not a fixed calendar plan. Every mile easy - base before speed.</div>';
  h+=libraryHTML("cardio");
  h+=badgeList();
  document.getElementById("v-cardio").innerHTML=h;
}

/* ============ boot ============ */
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
/* Retired as a load-time toast. Backup age is now a row in the freshness card, which is where
   every other "how current is this" signal lives. Kept as a helper for that row. */
function backupAgeDays(){var last=S.profile.lastBackup;return last?daysBetween(last,TODAY):null;}
applyTheme();
/* No gate on first open. The defaults are good enough to train on, and the one thing the app
   genuinely needs from you, a weigh-in, is asked for by the empty state rather than by a form
   standing between you and the app. Setup still lives in Settings for anyone who wants it. */
/* Offline is a service-worker concern; registration is best-effort and silent. */
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js").catch(function(){});}catch(e){}}
/* Any device that deleted an entry before v7.6 still carries the orphaned run record the old
   deleteDay left behind, and no amount of fixing the delete path repairs a store that is already
   wrong. The derived run records are reconciled against the sessions on every load: a run record
   for a day that holds no run session is residue by definition. Sessions, weigh-ins and the
   prescription pins are never touched. */
(function reconcileDerived(){
  var changed=false;
  Object.keys(S.runs||{}).forEach(function(d){
    if(!S.sessions.some(function(x){return x.date===d&&(x.type==="run"||x.distanceMi);})){delete S.runs[d];changed=true;}
  });
  if(changed){invalidateDayIndex();save();}
})();
if(!S.profile.setup){S.profile.setup=true;S.profile.started=S.profile.started||TODAY;S.profile.programStart=S.profile.programStart||TODAY;save();}
document.addEventListener("visibilitychange",function(){var woOn=document.getElementById("v-workout").classList.contains("on");if(document.hidden){if(woOn)woFreeze();}else{refreshDate();if(woOn)woResume();else if(document.getElementById("v-today").classList.contains("on"))renderToday();}});
renderToday();

</script>
<script>
/* v7.10. The sync script was referenced with a bare src, and Pages serves it with max-age=600, so
   after every change to it each device kept running the OLD sync code for up to ten minutes, and
   longer behind the service worker. That is how a sync fix ships and appears not to work. Loading
   it with the app's own VERSION appended means the URL changes on every release and the two can
   never drift apart, because the version is read from the constant rather than typed twice. */
(function(){var s=document.createElement("script");s.src="train-sync-auto.js?v="+VERSION;s.async=false;document.body.appendChild(s);})();
</script>
