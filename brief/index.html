a deal for Lumentum, an $83 billion optical supplier to AI data centers", "s": "Marvell Technology is nearing an agreement to acquire Lumentum Holdings that could be announced as soon as next week, Bloomberg reported early Thursday, citing people familiar with the matter. Lumentum, whose lasers feed the co-packaged optics that link GPU clusters, has a market value of about $83 billion, against about $221 billion for Marvell.", "paras": ["<button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Marvell Technology<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>A designer of custom accelerators for cloud companies, so the deal would join the chips that compute with the optics that connect them.<\/span><\/button> is nearing an agreement to acquire Lumentum Holdings that could be announced as soon as next week, Bloomberg reported early Thursday, citing people familiar with the matter. Lumentum, whose lasers feed the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">co-packaged optics<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Optical engines placed beside the processor rather than at the edge of the rack, which cuts power per bit and makes laser supply a choke point.<\/span><\/button> that link GPU clusters, has a market value of about $83 billion, against about $221 billion for Marvell. No terms were reported."], "why": "If signed it would be the largest deal of the window by far, and until then it rests on one report.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Bloomberg", "u": "https://news.bgov.com/artificial-intelligence/marvell-is-said-to-near-megadeal-for-lumentum-in-ai-push-2", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-29/s6.webp?h=b5bddfce", "col": "#353d3d", "cap": "", "credit": "King of Hearts, CC BY-SA 3.0 / Wikimedia Commons", "pull": null}, {"id": "s7", "sec": "Law & the Courts", "sid": "s-law", "h": "Judge Carter refuses to set aside up to 20,000 California ballots, saying it would “wreak havoc”", "s": "U.S. District Judge David O.", "paras": ["U.S. District Judge David O. Carter on Wednesday denied the Justice Department’s request to stop California from processing the ballots of up to 20,000 people it calls likely noncitizens, writing that it “would wreak havoc” on the election, the Associated Press reported. He said the step would amount to a purge barred in the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">final 90 days<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The National Voter Registration Act bars systematic removals from the rolls that close to a federal election, which is why a hold on counting reads as a removal.<\/span><\/button> before an election, writing, “This Court declines to be a party to such process.”", "More than 3.7 million Californians had voted, and more than 500,000 ballots had been processed, leaving them nearly impossible to link to voters, Los Angeles County testified. Carter, who said Tuesday he might name a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">special master<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A court-appointed aide under Federal Rule 53 who can take evidence and report findings, which the judge then reviews afresh.<\/span><\/button>, did not. First Assistant U.S. Attorney <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Bill Essayli<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>He argued on social media that “segregating a ballot does not prevent it from being counted later.”<\/span><\/button> said the department would appeal at once, to a Ninth Circuit that dismissed its first appeal Monday."], "why": "Election Day is Tuesday, and federal courts have now twice declined to pause counting on a list the state disputes; Washington and Alaska face similar suits.", "c": {"L": 0, "LL": 1, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "Associated Press", "u": "https://www.clickondetroit.com/news/politics/2026/10/29/judge-denies-federal-request-to-segregate-california-ballots-says-it-would-wreak-havoc-on-voting/", "t": null}, {"n": "ABC News", "u": "https://abcnews.com/Politics/judge-appoint-special-master-california-voting-case-setback/story?id=137622503", "t": "LL"}, {"n": "Spectrum News", "u": "https://spectrumlocalnews.com/ca/california/politics/2026/10/27/california-noncitizen-voting-ballots", "t": "C"}, {"n": "Yahoo News (AP)", "u": "https://ca.news.yahoo.com/judge-consider-whether-california-count-193901177.html", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-29/s7.webp?h=346040af", "col": "#16283a", "cap": "The First Street U.S. Courthouse in downtown Los Angeles.", "credit": "Levi Clancy, CC0 / Wikimedia Commons", "pull": null}, {"id": "s8", "sec": "Law & the Courts", "sid": "s-law", "h": "Wachtell reads the Cloudflare ruling: Delaware’s new safe harbor nearly held, but deleted chats did not", "s": "Wachtell Lipton partners wrote in a Harvard Law School Forum post on Wednesday that the Court of Chancery’s Oct. 16 preliminary-injunction ruling in In re Cloudflare found the special committee likely did not act in good faith on a recapitalization preserving founder control, and that absent credibility problems the new Section 144 controller safe harbor would likely have applied. The court cited founder pressure outside the negotiations and Signal autodelete left running after a litigation hold.", "paras": ["Wachtell Lipton partners wrote in a Harvard Law School Forum post on Wednesday that the Court of Chancery’s Oct. 16 preliminary-injunction ruling in In re Cloudflare found the special committee likely did not act in good faith on a recapitalization preserving founder control, and that absent credibility problems the new <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Section 144<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Rewritten by Senate Bill 21 in 2025, it shields a controller deal approved by an independent committee or disinterested stockholders from entire-fairness review.<\/span><\/button> controller safe harbor would likely have applied. The court cited founder pressure outside the negotiations and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Signal autodelete<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Once litigation is foreseeable, letting messages vanish is spoliation, which allows a court to infer the lost messages were harmful.<\/span><\/button> left running after a litigation hold. The firm warned that one-sided AI prompts can become evidence."], "why": "The first test of Delaware’s 2025 rewrite shows the safe harbor turns on the record a committee keeps, AI prompts included.", "c": {"L": 0, "LL": 0, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "Harvard Law School Forum", "u": "https://corpgov.law.harvard.edu/2026/10/28/cloudflare-important-lessons-for-conflict-transactions/", "t": null}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-29/s8.webp?h=8568f66c", "col": "#43413f", "cap": "", "credit": "John Phelan, CC BY-SA 3.0 / Wikimedia Commons", "pull": null}, {"id": "s9", "sec": "The World", "sid": "s-world", "h": "With about 90% counted, Netanyahu’s bloc holds 53 seats and Eisenkot’s 48 as Arab parties win a record 19", "s": "Prime Minister Benjamin Netanyahu’s bloc held 53 of the Knesset’s 120 seats, eight short of a majority, with 89.8% of votes counted Wednesday night, the Times of Israel reported, against 48 for Gadi Eisenkot’s bloc and 19 for Arab-led parties, up from 10. Likud led with 26 seats to 21 for Eisenkot’s Yashar.", "paras": ["Prime Minister Benjamin Netanyahu’s bloc held 53 of the Knesset’s 120 seats, eight short of a majority, with 89.8% of votes counted Wednesday night, the Times of Israel reported, against 48 for Gadi Eisenkot’s bloc and 19 for Arab-led parties, up from 10. Likud led with 26 seats to 21 for Eisenkot’s Yashar. More than half a million <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">double-envelope ballots<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Votes of soldiers, diplomats, prisoners and hospital patients, tallied separately at the Knesset after the regular count, which is why final results lag.<\/span><\/button> are being counted Thursday, with official results due Nov. 4.", "Yair Golan of the Democrats said, “Netanyahu lost. I know how to count to 120.” President Isaac Herzog said Israel must do everything to avoid another election, AFP reported. Netanyahu told his far-right partners, “We are together and we are staying together,” while Avigdor Liberman reportedly pressed for a Netanyahu-Eisenkot <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">unity government<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Israel last formed one in 2020 on a rotation deal, and the government fell before Netanyahu handed over the premiership.<\/span><\/button>. Outlets split the Joint List and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Ra’am<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Mansour Abbas’s party joined the 2021 Bennett-Lapid coalition, the first Arab party in an Israeli government.<\/span><\/button> at 12 and 7 or 13 and 6."], "why": "Neither bloc reaches 61 without Arab parties or a defection, so Herzog’s choice of who forms a government, not the count, is the next decisive act.", "c": {"L": 0, "LL": 1, "C": 2, "LR": 0, "R": 1}, "src": [{"n": "Times of Israel", "u": "https://www.timesofisrael.com/with-85-of-votes-counted-netanyahu-bloc-has-53-seats-eisenkots-48-arab-parties-surge-to-19/", "t": null}, {"n": "Ynet", "u": "https://www.ynetnews.com/article/hjnatbkaml", "t": "C"}, {"n": "AFP via Arab News", "u": "https://www.arabnews.com/middle-east/netanyahu-falls-short-of-majority-as-opposition-arab-parties-win-67-seats-3008632", "t": "C"}, {"n": "CNN", "u": "https://www.cnn.com/2026/10/28/world/live-news/israel-election-result-live-latest-netanyahu-eisenkot-intl", "t": "LL"}, {"n": "Fox News", "u": "https://www.foxnews.com/world/netanyahu-defies-exit-polls-vote-shifts-his-favor-majority-remains-elusive", "t": "R"}], "framing": "Fox News led with “Netanyahu defies exit polls as vote shifts in his favor, but majority remains elusive”; AFP led with “Netanyahu falls short of majority as opposition, Arab parties win 67 seats.”", "min": 1, "front": false, "img": "img/2026-10-29/s9.webp?h=b675068d", "col": "#454850", "cap": "The Knesset in Jerusalem.", "credit": "Clema12, CC BY-SA 4.0 / Wikimedia Commons", "pull": null}, {"id": "s10", "sec": "The World", "sid": "s-world", "h": "Vance wrote to Iran’s Mohsen Rezaei to revive talks, the Journal reports, as Trump says it was about medical supplies", "s": "Vice President JD Vance sent a letter at President Trump’s direction to Mohsen Rezaei seeking to restart peace talks and possibly head off a renewed U.S. attack, The Wall Street Journal reported Wednesday, according to AFP. Trump denied directing a peace overture, saying “they need help with medical supplies and various things,”", "paras": ["Vice President JD Vance sent a letter at President Trump’s direction to <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Mohsen Rezaei<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>He commanded the Revolutionary Guards through the Iran-Iraq War and has run for president several times; he warned this week that Iran could strike U.S.-linked data centers.<\/span><\/button> seeking to restart peace talks and possibly head off a renewed U.S. attack, The Wall Street Journal reported Wednesday, according to AFP. Trump denied directing a peace ov d French Open packages, about $515 million a year combined, as the likeliest to be sold.<\/span><\/button> costing more than $6.6 billion a year against about $80 billion of debt. Skydance Sports Entertainment joins the studios group, with details to follow."], "why": "The org chart decides where post-merger cuts land, and one sports chief now negotiates every renewal against that debt load.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "Variety", "u": "https://au.variety.com/2026/tv/news/skydance-george-cheeks-channing-dungey-executive-structure-42051/", "t": null}, {"n": "The Ankler", "u": "https://theankler.com/david-ellison-has-36-sports-deals-he-cant-afford-what-goes-first/", "t": "C"}, {"n": "TheWrap (Oct. 2)", "u": "https://www.thewrap.com/media-platforms/tv/skydance-tv-studio-leadership-george-cheeks-paramount-warner-bros/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-29/s12.webp?h=e7f9478c", "col": "#3a3c3b", "cap": "The Melrose Gate at the Paramount lot in Hollywood.", "credit": "Chris Brown (zoonabar), CC BY 2.0 / Wikimedia Commons", "pull": null}, {"id": "s13", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "The NFL made Saquon Barkley sell his Polymarket stake, Front Office Sports reports", "s": "Saquon Barkley no longer holds his stake in Polymarket after the NFL told players they cannot have financial interests in prediction-market platforms, Front Office Sports reported Wednesday. “I am not allowed to be in that,”", "paras": ["Saquon Barkley no longer holds his stake in Polymarket after the NFL told players they cannot have financial interests in <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">prediction-market platforms<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Their sports contracts are regulated by the CFTC as swaps, which lets them operate in states where sportsbooks are illegal, the jurisdiction fight leagues are now in.<\/span><\/butt <script>
const Chart=(()=>{
 const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
 const shown=r=>r[2]!=null?String(r[2]):String(r[1]);
 const num=v=>typeof v==='number'&&isFinite(v);
 const ok=d=>d&&Array.isArray(d.rows)&&d.rows.length>=2&&d.rows.every(r=>Array.isArray(r)&&num(r[1]))&&(d.type!=='bar'||d.rows.every(r=>r[1]>=0));
 const table=d=>`<table class="sr"><tbody>${d.rows.map(r=>`<tr><th scope="row">${esc(r[0])}</th><td>${esc(shown(r))}</td></tr>`).join('')}</tbody></table>`;
 const FACE="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif";
 const VAL='600 14px '+FACE,LAB='500 12.5px '+FACE;
 let ctx;const measure=(t,font)=>{try{ctx=ctx||document.createElement('canvas').getContext('2d');ctx.font=font;return ctx.measureText(String(t)).width*1.06}catch(e){return String(t).length*8}};
 const fit=(t,max,font)=>{t=String(t);if(measure(t,font)<=max)return t;while(t.length>1&&measure(t+'…',font)>max)t=t.slice(0,-1);return t.trimEnd()+'…'};

 function bar(d){
  const vals=d.rows.map(r=>+r[1]),m=Math.max(...vals)||1;
  return `<div class="ch ch-bar" aria-hidden="true">${d.rows.map((r,i)=>`<div class="cr"><div class="ch-h"><span class="cl">${esc(r[0])}</span><b>${esc(shown(r))}</b></div><i style="--p:${(vals[i]/m).toFixed(4)};--m:${vals[i]>0?'4px':'0px'};--d:${i*60}ms"></i></div>`).join('')}</div>`}

 // does the box b cross the segment from (x1,y1) to (x2,y2)?
 const segHit=(b,x1,y1,x2,y2)=>{const xa=Math.max(b.l,Math.min(x1,x2)),xb=Math.min(b.r,Math.max(x1,x2));if(xa>xb)return false;
  const at=x=>x2===x1?y1:y1+(y2-y1)*(x-x1)/(x2-x1),ya=at(xa),yb=at(xb);return Math.max(ya,yb)>=b.t&&Math.min(ya,yb)<=b.b};

 function line(d,W){
  W=Math.max(240,Math.round(+W||340));const n=d.rows.length,H=164,top=30,bot=28,axis=H-bot+4;
  const lw=d.rows.map(r=>measure(shown(r),VAL)),side=Math.min(56,Math.max(22,Math.ceil(Math.max(lw[0],lw[n-1])/2)+4));
  const ys=d.rows.map(r=>+r[1]),mn=Math.min(...ys),mx=Math.max(...ys),span=mx-mn||Math.abs(mx)||1,lo=mn-span*.38,hi=mx+span*.14;
  const X=i=>side+i*(W-2*side)/(n-1),Y=v=>top+(hi-v)/(hi-lo)*(H-top-bot);
  // value labels: every point up to four; beyond that only the first, last, high and low.
  // Each label tries above, below, then beside its point (a low point tries below first) and is dropped only if every place collides.
  const pos=[],boxes=[],key=new Set([0,n-1,ys.indexOf(mx),ys.indexOf(mn)]);
  const segs=d.rows.slice(1).map((_,i)=>[X(i),Y(ys[i]),X(i+1),Y(ys[i+1])]);
  const hit=b=>b.l<2||b.r>W-2||b.t<2||b.b>axis-3||boxes.some(o=>b.l<o.r+4&&b.r>o.l-4&&b.t<o.b+2&&b.b>o.t-2)||segs.some(s=>segHit(b,...s));
  const order=n<=4?d.rows.map((_,i)=>i):[...key];
  const cand=(x,y,w,low)=>{const up=[[x,'middle',y-10],[x-4,'end',y-10],[x+4,'start',y-10]],dn=[[x,'middle',y+19],[x+4,'start',y+19],[x-4,'end',y+19]],sd=[[x+9,'start',y+5],[x-9,'end',y+5]];
   return (low?[...dn,...up]:[...up,...dn]).concat(sd).map(([tx,a,by])=>({tx,a,by,l:a==='middle'?tx-w/2:a==='end'?tx-w:tx,t:by-12,b:by+2}))};
  for(const i of order){const x=X(i),y=Y(ys[i]),low=n>2&&ys[i]===mn&&(i===0||ys[i]<=ys[i-1])&&(i===n-1||ys[i]<=ys[i+1]);
   for(const k of cand(x,y,lw[i],low)){k.r=k.l+lw[i];if(!hit(k)){pos[i]=k;boxes.push(k);break}}}
  // x labels: first anchored at its left, last at its right, middle centred where they clear their neighbours;
  // the end labels are shortened with an ellipsis if they would meet each other
  const xw=d.rows.map(r=>measure(r[0],LAB)),half=(W-2*side)/2+side-6,xs=new Map();
  const first=fit(d.rows[0][0],half,LAB),last=fit(d.rows[n-1][0],half,LAB);
  xs.set(0,{t:first,a:'start',x:Math.max(2,X(0)-Math.min(xw[0],measure(first,LAB))/2)});
  const lastW=measure(last,LAB),lastL=Math.min(W-2,X(n-1)+lastW/2)-lastW;let edge=xs.get(0).x+measure(first,LAB);
  for(let i=1;i<n-1;i++){const l=X(i)-xw[i]/2,r=X(i)+xw[i]/2;if(l>edge+12&&r+12<lastL){xs.set(i,{t:String(d.rows[i][0]),a:'middle',x:X(i)});edge=r}}
  xs.set(n-1,{t:last,a:'end',x:Math.min(W-2,X(n-1)+lastW/2)});
  const pts=d.rows.map((r,i)=>`${X(i).toFixed(1)},${Y(ys[i]).toFixed(1)}`).join(' ');
  let s=`<line x1="${side-8}" x2="${W-side+8}" y1="${axis}" y2="${axis}" class="cb" stroke-width="1"/>`;
  s+=`<polyline class="cp" pathLength="1" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${pts}"/>`;
  d.rows.forEach((r,i)=>{const x=X(i),y=Y(ys[i]);
   s+=`<circle class="cd" style="--d:${200+i*70}ms" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4"/>`;
   if(pos[i])s+=`<text class="cv" x="${pos[i].tx.toFixed(1)}" y="${pos[i].by.toFixed(1)}" text-anchor="${pos[i].a}" style="--d:${200+i*70}ms;font:${VAL}">${esc(shown(r))}</text>`;
   const xl=xs.get(i);if(xl)s+=`<text x="${xl.x.toFixed(1)}" y="${H-6}" class="cx" text-anchor="${xl.a}" style="font:${LAB}">${esc(xl.t)}</text>`});
  return `<svg class="ch ch-line" width="100%" viewBox="0 0 ${W} ${H}" aria-hidden="true">${s}</svg>`}

 function html(d,W){if(!ok(d)||(d.type!=='bar'&&d.type!=='line'))return'';
  return `<figure class="dia"><figcaption class="tt">${esc(d.t)}</figcaption>${d.type==='bar'?bar(d):line(d,W)}${table(d)}</figure>`}
 function play(root){const f=root&&root.querySelector('.dia');if(!f)return;requestAnimationFrame(()=>requestAnimationFrame(()=>f.classList.add('go')))}
 return {html,play}})();

 const e=E,old=tab==='past',G=secs(e),front=G.find(x=>x.k==='s-front')||{rows:[]},rest=G.filter(x=>x!==front);
 rest.sort((a,b)=>(S.like.includes(b.name)?1:0)-(S.like.includes(a.name)?1:0));
