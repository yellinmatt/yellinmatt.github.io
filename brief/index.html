 incomplete. Mario Cristobal said the ACC crew gave him “zero” explanation. Miami meets Duke next, the school that sued Darian Mensah in January over his transfer.", "paras": ["Notre Dame beat top-ranked Miami 31-24 on Saturday, and Mario Cristobal spent Sunday on the call that decided it. With 3:36 left, Elija Lofton appeared to catch the tying touchdown; it was ruled incomplete, and Notre Dame took over on downs. “Really, really disappointed that they negated Elija Lofton’s touchdown with two hands on the ball and two feet in bounds,” Cristobal said, adding that the ACC crew gave him “zero” explanation.", "CJ Carr threw for 319 yards and three touchdowns for Notre Dame, now 8-1, which had lacked the signature win the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">playoff committee<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Notre Dame entered the weekend as the last team in the committee’s provisional 12-team field.<\/span><\/button> wanted. Miami quarterback Darian Mensah, whose <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">NIL valuation<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>On3’s figure is a proprietary estimate, not a disclosed contract, which is why it can top any deal on record.<\/span><\/button> On3 puts at $6.5 million, the highest in men’s college sports, threw for 302. Miami, also 8-1, meets Duke next, the school that <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">sued Mensah<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>He had signed a two-year, $8 million deal at Duke. Front Office Sports calls the January suit the first by a school against a current athlete over an NIL contract; it settled.<\/span><\/button> in January over his transfer."], "why": "The highest-valued player in college football lost on a replay call and now meets the school that sued him over his contract, a live test of whether NIL deals bind like employment agreements.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 1}, "src": [{"n": "Yahoo Sports", "u": "https://sports.yahoo.com/college-football/article/no-1-miamis-mario-cristobal-pissed-off-after-potential-game-tying-td-catch-was-ruled-incomplete-in-loss-to-no-11-notre-dame-140426419.html", "t": null}, {"n": "CBS Sports", "u": "https://www.cbssports.com/college-football/gametracker/NCAAF_20261107_MIAMI@ND/", "t": "C"}, {"n": "Front Office Sports", "u": "https://frontofficesports.com/newsletter/miami-s-6-5m-qb-faces-big-test/", "t": "C"}, {"n": "OutKick", "u": "https://www.foxnews.com/outkick-sports/miami-coach-furious-officials-possible-td-catch-ruled-incomplete-crucial-loss-notre-dame", "t": "R"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-09/s12.webp?h=82399fa1", "col": "#2c3a46", "cap": "Notre Dame Stadium.", "credit": "PROjck_photos, CC BY 2.0 / Wikimedia Commons", "pull": null, "chart": {"type": "bar", "t": "Passing yards", "rows": [["CJ Carr", 319, "319 yards"], ["Darian Mensah", 302, "302 yards"]]}}, {"id": "s13", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "Trump says his press secretary offer to Dana White was “only kidding”", "s": "President Trump said Sunday that his offer of the White House press secretary job to Dana White was a joke: “I was only kidding. But Dana loves the idea.” White said he was flying to Washington: “We have a meeting on Monday.”", "paras": ["President Trump said Sunday that his offer of the White House <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">press secretary<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Katie Zacharia left the post last month after five days, and Karoline Leavitt left in August, Front Office Sports reported.<\/span><\/button> job to Dana White was a joke: “I was only kidding. But Dana loves the idea.” On Saturday Trump had posted that White was “offered the job of Press Secretary,” adding, “Dana, please take the job!” The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">UFC<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>It sits inside TKO Group Holdings, a public company that also owns WWE. None of the coverage reviewed carried a TKO statement on the offer.<\/span><\/button> chief said he was flying to Washington: “We have a meeting on Monday.”"], "why": "A public company’s marquee executive weighing a federal job is a disclosure and succession question for TKO’s board, joke or not.", "c": {"L": 1, "LL": 1, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/9/a-joke-or-test-why-trump-floated-ufcs-dana-white-as-his-press-secretary", "t": "L"}, {"n": "Front Office Sports", "u": "https://frontofficesports.com/article/donald-trump-dana-white-ufc-press-secretary-white-house/", "t": "C"}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/11/07/trump-ufc-dana-white-press-secretary-offer.html", "t": "C"}, {"n": "ESPN", "u": "https://www.espn.com/espn/story/_/id/50412085/trump-offers-press-secretary-role-ufc-boss-dana-white", "t": "C"}, {"n": "NBC News", "u": "https://www.nbcnews.com/politics/2026-election/live-blog/rump-taps-stephen-miller-chief-staff-wiles-cabinet-midterm-elections-rcna607914", "t": "LL"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}], "week": [], "cover": "img/2026-11-09/s4.webp?h=33340338"}, {"date": "2026-11-08", "no": 164, "min": 8.3, "stand": "Israel’s president passed over Netanyahu, Washington talked down a new war while carrying its blockade of Iran onto land, and Beijing’s veto sent SoftBank and ABB back to the table.", "note": "EDITOR’S NOTE. The Sunday Special changes the unit of analysis from the day to the week and does not relax the bar: the Front is recency-gated to the hours from Friday 6 p.m. Eastern, and the departments carry items that already cleared a daily brief, plus the Godzilla and Washington items first covered inside the window. This edition was produced about nine hours late, so the window runs to Sunday afternoon. Front 6, sector briefs 10, week in review 7 days, framing notes 1. Conflict disclosed: Anthropic, whose model helps produce this paper, appears in the generator item, the Suno item, the AI brief and the week in review. SoftBank and ABB, held on Nov. 6 for want of a second source, run today on a fresh beat. Not run: a magistrate’s ruling letting Claude Max buyers sue Anthropic (order unread, timing unclear, conflict); the Justice Department joining Texas’s False Claims Act suit against Planned Parenthood and a special master for the golf-course case (below the line on space); Robert Pattinson’s Bond screen test (reported before the window); Berkshire Hathaway’s third quarter and GFL’s Monday bid deadline (space). Sourcing limits: the Financial Times, Bloomberg, Reuters, the BBC, the Guardian and The New York Times were not opened directly; the generator figures rest on the FT via The Next Web; box office figures are Sunday estimates. Missed this week, on the record: AstraZeneca’s reported $10 billion approach for Rhythm Pharmaceuticals on Nov. 4, and the grand-jury subpoenas in the Justice Department’s Dobbs-leak inquiry, reported Nov. 5.", "items": [{"id": "s1", "sec": "The Front", "sid": "s-front", "h": "Herzog gives Eisenkot, not Netanyahu, the first shot at a government", "s": "President Isaac Herzog gave Gadi Eisenkot the first mandate after lawmakers holding 67 of the Knesset’s 120 seats recommended him and 46 backed Benjamin Netanyahu, Al Jazeera and the Associated Press reported. Eisenkot has 28 days, extendable by 14.", "paras": ["President Isaac Herzog on Saturday gave <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Gadi Eisenkot<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>Chief of the General Staff from 2015 to 2019, he later sat in the war cabinet formed after October 7, 2023, and quit it in June 2024 alongside Benny Gantz.<\/span><\/button>, the former army chief who leads the opposition alliance, the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">first mandate<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Under Basic Law: The Government, the president picks the member he judges likeliest to succeed after consulting every faction. He is not bound to choose the leader of the largest list.<\/span><\/button> to form a government, after lawmakers holding 67 of the Knesset’s 120 seats recommended him and 46 backed Prime Minister Benjamin Netanyahu, Al Jazeera and the Associated Press reported. The formal presentation was set for 5 p.m. Israeli time on Sunday, Fox News reported.", "The 67 include a record 19 seats won by Arab-led parties in the October 27 election, among them <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Ra’am<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The Islamist party led by Mansour Abbas. In 2021 it became the first Arab party to join a governing coalition, under Naftali Bennett and Yair Lapid.<\/span><\/button>, while Eisenkot’s own four-party alliance holds 48. Netanyahu’s bloc won 53, and the seven members of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">United Torah Judaism<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>An Ashkenazi ultra-Orthodox alliance. Military conscription of yeshiva students, which Fox News named as a dividing line in the talks, is its central demand.<\/span><\/button> endorsed no one. Winning both ultra-Orthodox parties would give Eisenkot exactly 61, and Al Jazeera noted he could govern with fewer by surviving a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">confidence vote<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A cabinet is installed by a majority of those voting, so abstentions help a minority government. Yitzhak Rabin governed from 1993 with Arab parties backing him from outside the coalition.<\/span><\/button>.", "Eisenkot has 28 days, extendable by 14. If he fails, Herzog can name another candidate, a Knesset majority can then back a third, and only after that does a new election follow within 90 days, with Netanyahu staying on as caretaker. Eisenkot wrote that “this is the time to establish a national emergency government.” Netanyahu called instead for a national unity government and warned against hastily swearing in one that relied on Arab votes. The Joint List’s Ahmad Tibi called the decision “expected.” The AP noted that coalition talks will turn on draft exemptions for the ultra-Orthodox and on a state inquiry into the October 7 failures."], "why": "Every road to 61 now runs through the Arab parties or the draft fight with the ultra-Orthodox, and whoever wins it inherits the Iran war and the ceasefire diplomacy. Netanyahu keeps the office while the clock runs.", "c": {"L": 1, "LL": 0, "C": 2, "LR": 0, "R": 1}, "src": [{"n": "AP via PBS NewsHour", "u": "https://www.pbs.org/newshour/world/israels-president-taps-opposition-candidate-eisenkot-to-form-a-government-in-setback-for-netanyahu", "t": "C"}, {"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/7/israels-president-picks-eisenkot-over-netanyahu-to-form-next-government", "t": "L"}, {"n": "Fox News", "u": "https://www.foxnews.com/world/israeli-president-picks-netanyahu-rival-form-government-coalition-battle-looms", "t": "R"}, {"n": "Jerusalem Post", "u": "https://www.jpost.com/israel-election-2026/article-914236", "t": "C"}], "framing": "The left (Al Jazeera) led with the Arab parties’ record seats as the margin that carried the endorsement; the right (Fox News) framed the same arithmetic as “deep coalition divisions over Arab parties and conscription” that cloud his path.", "min": 1, "front": true, "img": "img/2026-11-08/s1.webp?h=a33597cc", "col": "#383a24", "cap": "", "credit": "Chris Yunker from St. Louis, United States, CC BY-SA 2.0 / Wikimedia Commons", "pull": {"text": "Such a government, dependent on Islamists, will dismantle the state of Israel from within.", "attr": "Benjamin Netanyahu, via Al Jazeera, November 7"}, "chart": {"type": "bar", "t": "Recommendations, of 120 Knesset seats", "rows": [["Eisenkot", 67, "67 seats"], ["Netanyahu", 46, "46 seats"]]}}, {"id": "s2", "sec": "The Front", "sid": "s-front", "h": "Trump calls renewed Iran war “highly unlikely” as blockade moves to land", "s": "President Trump told CNN on Sunday that resuming strikes was “highly unlikely” to be necessary, a line he repeated five times. Central Command set up Task Force Iron Gate to choke trade across Iran’s land borders and the Caspian Sea, Al Jazeera reported.", "paras": ["President Trump told CNN on Sunday that resuming strikes on Iran was “highly unlikely” to be necessary, a line he repeated five times in a 20-minute phone interview. “It depends on whether or not they sign a very strong agreement,” he said, adding that he had three aircraft carriers in the region and 38 bridges on a target list, and that he did not like “ripping down bridges.”", "The pressure kept building. Central Command on Saturday set up <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Task Force Iron Gate<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Adm. Brad Cooper said it reinforces “our ironclad blockade against Iran at sea,” which has redirected 147 ships and disabled five since July.<\/span><\/button>, about 20 people in Tampa, to choke weapons, dual-use goods and oil revenue crossing Iran’s land borders and the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Caspian Sea<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>Iran’s northern coast faces Russia, Kazakhstan, Turkmenistan and Azerbaijan, trade routes that the naval blockade in the Gulf never reached.<\/span><\/button>, Al Jazeera reported, and a St. Kitts-flagged cargo ship, the Huda, was disabled in the Gulf of Oman. Tehran is reviewing Qatari proposals but still wants its <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">seven conditions<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>They include lifting the sanctions reimposed in July, restored oil waivers, released frozen funds and recognition of a new shipping route built with Oman.<\/span><\/button> met first. Brent settled at $98.32 on Friday."], "why": "Oil fell about 13% last week on hopes of an exit. A land blockade says Washington wants any deal signed on its terms before the new Democratic Congress sits in January.", "c": {"L": 1, "LL": 1, "C": 2, "LR": 0, "R": 1}, "src": [{"n": "CNN via Local 3", "u": "https://www.local3news.com/regional-national/trump-says-renewed-attacks-on-iran-highly-unlikely-if-talks-show-progress/article_ca63faea-fcfe-59d3-9a3b-ed0e69f53d5c.html", "t": "LL"}, {"n": "Reuters via Yahoo", "u": "https://www.yahoo.com/news/politics/articles/trump-says-unlikely-order-iran-175946542.html", "t": "C"}, {"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/8/us-launches-task-force-to-disrupt-irans-land-based-supply-routes", "t": "L"}, {"n": "Fox News", "u": "https://www.foxnews.com/live-news/iran-war-news-trump-saudi-houthi-november-8", "t": "R"}, {"n": "CBS News", "u": "https://www.cbsnews.com/live-updates/iran-war-trump-us-strait-hormuz-persian-gulf/", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-08/s2.webp?h=76b24a93", "col": "#2e3945", "cap": "", "credit": "MODIS Land Rapid Response Team, NASA GSFC, Public domain / Wikimedia Commons", "pull": null, "fig": {"v": "$98.32", "l": "Brent settlement on Friday"}}, {"id": "s3", "sec": "The Front", "sid": "s-front", "h": "Anthropic takes over a stranded $3.4 billion gas-generator order, FT says", "s": "Anthropic agreed in late September to buy large Caterpillar gas-fired generators, about 1.7 gigawatts of capacity, from orders OnePWR Solutions could not finance, the Financial Times reported. Anthropic’s model helps produce this paper.", "paras": ["Anthropic agreed in late September to pay $3.4 billion for large Caterpillar <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">gas-fired generators<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>On-site generation sidesteps the multi-year queue to connect a data center to the grid. Elon Musk’s xAI faces litigation over gas turbines it ran at its Memphis site.<\/span><\/button>, about 1.7 gigawatts of capacity, the Financial Times reported on Sunday, calling it the biggest known single purchase of power equipment by an AI company. The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">orders<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Taking over another buyer’s production slot jumps a backlog that suppliers quote in years. The scarce asset is the place in line, not the hardware.<\/span><\/button> had been placed about two years earlier by OnePWR Solutions, a San Antonio power supplier that could not finance them. Anthropic took over the orders and the installation work without buying the company.", "Neither company commented, and where the units will run is not known. The disclosure lands as Anthropic prepares a listing whose amended filing showed $895 billion of commitments, mostly compute. Renaissance Capital said on Friday that the roadshow could launch as early as Tuesday, with pricing possible the week of Nov. 16. Conflict disclosed: Anthropic’s model helps produce this paper."], "why": "Power, not chips, is the constraint an IPO cannot finance away. Buying a stranded queue slot is how an issuer shows investors the build is real before it prices.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "The Next Web, citing the FT", "u": "https://thenextweb.com/news/anthropic-3-4bn-gas-generators-onepwr-ft", "t": "C"}, {"n": "Reuters via StreetInsider", "u": "https://www.streetinsider.com/Reuters/Anthropic+secures+$3.4+billion+generator+deal+for+AI+data+centers,+FT+reports/27309458.html", "t": "C"}, {"n": "Bloomberg", "u": "https://bloomberg.com/news/articles/2026-11-08/anthropic-buys-power-for-ai-data-centres-in-3-4b-deal-ft-says", "t": "C"}, {"n": "MarketScreener", "u": "https://www.marketscreener.com/news/anthropic-strikes-3-4-billion-deal-for-data-center-generators-ft-reports-ce785fd2d08cf124", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-08/s3.webp?h=cceca6d3", "col": "#43352c", "cap": "", "credit": "Bryansfiles, CC BY-SA 3.0 / Wikimedia Commons", "pull": null, "fig": {"v": "$895 billion", "l": "Commitments in the amended IPO filing"}}, {"id": "s4", "sec": "The Front", "sid": "s-front", "h": "Elvis’s rights holders and Eminem’s publisher sue Suno, the AI music maker", "s": "Eight Mile Style sued Suno late Friday in federal court in San Francisco over 269 songs, about $41 million in all, Variety reported. A separate complaint by Presley’s publishers adds a claim under Tennessee’s ELVIS Act.", "paras": ["Eight Mile Style, which owns much of Eminem’s catalog, sued Suno late Friday in federal court in San Francisco, seeking <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">statutory damages<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Under 17 U.S.C. 504(c) the $150,000 ceiling applies only to willful infringement, and a plaintiff may elect it instead of proving actual losses.<\/span><\/button> of $150,000 for each of 269 songs plus $672,000 for stripped copyright information, about $41 million in all, Variety reported. Eminem is not a party. A separate 51-page complaint by Authentic Brands Group and Presley’s publishers adds a claim under Tennessee’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">ELVIS Act<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The Ensuring Likeness Voice and Image Security Act, signed in March 2024, extended the state’s publicity right to a person’s voice, the first law written for AI cloning.<\/span><\/button>: “The next Elvis won’t pick up a guitar.”", "The same four lawyers, <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Richard Busch<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>The Nashville litigator who won the 2015 “Blurred Lines” verdict for Marvin Gaye’s family against Robin Thicke and Pharrell Williams.<\/span><\/button> among them, filed both. Suno says it bars artists’ names in prompts and screens for misuse. It raised $400 million in June at a $5.4 billion valuation and still faces suits from Universal and Sony, while Warner settled for a license in 2025. Conflict disclosed: the Presley publishers are separately suing Anthropic."], "why": "One firm, two famous catalogs and a state publicity claim stacked on copyright make a template. The AI music settlements so far have been licenses, and these plaintiffs are setting their price.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Variety via Yahoo", "u": "https://www.yahoo.com/news/politics/articles/elvis-music-owners-eminem-publisher-161526743.html", "t": "C"}, {"n": "Engadget", "u": "https://engadget.com/2310316/suno-ai-music-generator-sued-again-for-copyright-infringement", "t": "C"}, {"n": "Vice", "u": "https://www.vice.com/en/article/elvis-presley-estate-warns-the-next-elvis-wont-pick-up-a-guitar-in-new-lawsuit-against-ai-music-company-suno/", "t": "C"}, {"n": "Billboard", "u": "https://www.billboard.com/pro/elvis-presley-ai-voice-cloning-lawsuit-suno/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-08/s4.webp?h=6cba6579", "col": "#3f3729", "cap": "", "credit": "Fallaner, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "fig": {"v": "$5.4 billion", "l": "Suno’s valuation in its June round"}}, {"id": "s5", "sec": "The Front", "sid": "s-front", "h": "Blocked by Beijing, SoftBank and ABB weigh a China carve-out", "s": "SoftBank and ABB are studying putting the robotics unit’s China business into a separately owned entity, Bloomberg reported, after China’s security review blocked the purchase on Thursday. ABB is also weighing other buyers.", "paras": ["SoftBank Group and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">ABB<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The Zurich engineering group had planned to list robotics as a separate company before agreeing to SoftBank’s offer in October 2025.<\/span><\/button> are studying a carve-out that would put the robotics unit’s China business into a separately owned entity, Bloomberg reported on Saturday, after China’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">foreign-investment security review<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Run by the National Development and Reform Commission and the Commerce Ministry under 2021 measures, it is Beijing’s counterpart to CFIUS and can reach a deal between two foreign parties.<\/span><\/button> blocked SoftBank’s purchase on Thursday. China is the unit’s largest market, with a major plant in Shanghai. ABB is also weighing other buyers, who could value the business at $2 billion to $3 billion.", "SoftBank shares fell 11% in Tokyo on Friday, and ABB lost more than 5% on the week. Citi analyst Martin Wilkie said the block roughly halves ABB’s capacity for acquisitions, to about $5 billion. The unit employs about 7,000 people and had $2.3 billion of revenue in 2024."], "why": "Beijing has used its review to stop a Japanese buyer taking a Swiss asset. Any cross-border deal with a China footprint now has to price that veto, and a geographic carve-out is the precedent to watch.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Bloomberg via swissinfo", "u": "https://www.swissinfo.ch/eng/softbank,-abb-consider-china-carve-out-to-salvage-robotics-deal/92343217", "t": "C"}, {"n": "Japan Times", "u": "https://www.japantimes.co.jp/business/2026/11/08/companies/softbank-abb-china-carve-out/", "t": "C"}, {"n": "Investing.com", "u": "https://www.investing.com/news/company-news/softbank-abb-consider-china-carveout-to-rescue-54bn-robotics-deal--bloomberg-5009777", "t": "C"}, {"n": "Euronext / Reuters", "u": "https://live.euronext.com/en/financial-news/softbank-abb-explore-china-carve-out-salvage-robotics-deal-bloomberg-news-reports", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-08/s5.webp?h=8babccd2", "col": "#5c2514", "cap": "", "credit": "Dependability, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "fig": {"v": "11%", "l": "SoftBank’s share fall in Tokyo on Friday"}}, {"id": "s6", "sec": "The Front", "sid": "s-front", "h": "Gunman with far-right views kills six in Kraków’s Main Square", "s": "A 25-year-old Polish man drove around the square on Saturday afternoon, firing at each stop, the Associated Press reported. Six people were killed and 15 wounded. Police say he acted alone.", "paras": ["A 25-year-old Polish man drove around Kraków’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Main Square<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>Rynek Główny was laid out in 1257. The old town around it was among the first sites UNESCO put on its World Heritage list, in 1978.<\/span><\/button> on Saturday afternoon, stopping to fire an <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">automatic weapon<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Polish civilians need a police permit for any firearm and cannot lawfully own fully automatic ones, so how he got it is central to the inquiry.<\/span><\/button> at each stop, killing six people, four women and two men, and wounding 15, the Associated Press reported. At least three of the dead were Polish and one was British. Police detained him and say he acted alone.", "Interior Minister Marcin Kierwiński said “everything indicates that he was fascinated by far-right ideologies.” Prime Minister Donald Tusk said the bodies of three close relatives were found at the suspect’s home in Ostrowiec Świętokrzyski, about 150 kilometers away. The defense minister called it an act of terror, and the city is in official mourning until Wednesday."], "why": "A far-right massacre in the country’s most visited square lands on a government already fighting the president over the courts, and the source of the weapon will decide which fight comes next.", "c": {"L": 1, "LL": 0, "C": 2, "LR": 0, "R": 1}, "src": [{"n": "AP via PBS NewsHour", "u": "https://www.pbs.org/newshour/world/gunman-opens-fire-in-polish-city-of-krakow-killing-6-people-and-injuring-15", "t": "C"}, {"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/7/casualties-reported-after-shooting-in-polands-krakow", "t": "L"}, {"n": "CBS News", "u": "https://www.cbsnews.com/news/shooting-main-market-square-krakow-poland/", "t": "C"}, {"n": "Fox News", "u": "https://www.foxnews.com/world/gunman-opens-fire-moving-car-european-tourist-hotspot-leaving-5-dead-12-wounded", "t": "R"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-08/s6.webp?h=acb0c48b", "col": "#41362a", "cap": "", "credit": "Igor123121, CC BY 4.0 / Wikimedia Commons", "pull": null}, {"id": "s7", "sec": "AI", "sid": "d-ai", "h": "Anthropic’s IPO talk marks down", "s": "Bloomberg reported on Nov. 6 that valuation discussions had slipped to $1.2 trillion to $1.3 trillion from $1.4 trillion to $1.5 trillion, a day after Reuters reported doubts about a roadshow planned for as soon as Nov. 9. Conflict disclosed.", "paras": ["Bloomberg r  try{if(s){await fetch(PUSH.url+'/unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({endpoint:s.endpoint})}).catch(()=>{});await s.unsubscribe();btn.setAttribute('aria-checked','false');endNote()}
 else{if(await Notification.requestPermission()!=='granted'){if(end){endNote(true);return}if(note)note.textContent=blocked();return}
  s=await r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(PUSH.key)});
  const res=await fetch(PUSH.url+'/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(s.toJSON())});
  if(!res.ok)throw new Error('worker '+res.status);if(end){endNote(true);return}btn.setAttribute('aria-checked','true');endNote();if(note)note.textContent='One headline each morning, when the paper is out.'}}
 catch(e){if(!was&&s)await s.unsubscribe().catch(()=>{});if(!end)btn.setAttribute('aria-checked','false');{const nn=$('#ntn');if(nn&&end)nn.textContent='Could not turn it on. Try again.'}if(note)note.textContent='Could not turn it on. Try again.'}finally{if(end){delete btn.dataset.busy;btn.removeAttribute('aria-disabled')}else btn.disabled=false}}
// the end of the paper offers the next 7:00 AM headline (the same notification as in Reading settings). The card only ever
// turns notifications on; it redraws from the real subscription whenever either control changes it.
let ntLate=false;
const iOSd=()=>/iPhone|iPad/.test(navigator.userAgent);
const blocked=()=>iOSd()?'Notifications are off for the Brief. Turn them on in iPhone Settings, Notifications, then try again.':'Notifications are blocked for this site. Allow them in your browser’s site settings, then try again.';
function endNote(focus){const n=$('#nt');if(!n)return;const w=ntLate?'Today’s':'Tomorrow’s',lw=w.toLowerCase(),when=ntLate==='out'?'when the paper is out':'at 7:00 AM';
 const draw=st=>{if(!n.isConnected)return;n.hidden=false;
  n.innerHTML=st==='on'?`<p class="ntd" tabindex="-1">You’ll get ${lw} headline ${when}.</p>`
  :`<h3>${w} headline ${when}</h3><p>One notification when the paper is out. Nothing else.</p>${st==='home'?'<p class="nth">On iPhone, add the Brief to your Home Screen first: Share, then Add to Home Screen.</p>':st==='denied'?`<p class="nth" tabindex="-1">${blocked()}</p>`:'<button class="btnp" data-a="push" data-from="end">Notify me</button>'}<p class="ntn" id="ntn" role="status"></p>`;
  if(focus){const f=$(st==='on'?'.ntd':'.nth',n);if(f)f.focus()}};
 if(!/\/brief\//.test(location.pathname))return;
 if(iOSd()&&!standalone()){draw('home');return}
 if(!pushable())return;
 if(Notification.permission==='denied'){draw('denied');return}
 pushState().then(draw,()=>{})}
function settings(){const A=[['light','Light','l'],['dark','Dark','d'],['auto','Automatic','a']],cur=S.appear||window.__APPEAR||'auto';
 sheet(`<span class="lbl">Text size</span><div class="tsz"><button data-a="fs-" class="s" aria-label="Smaller text">A</button><output id="fv">${Math.round(S.fs*100)}%</output><button data-a="fs+" class="b" aria-label="Larger text">A</button></div>

 ${pushable()?`<span class="lbl">Notification</span><div id="pushbox"></div>`:''}
 <span class="lbl">Read these first</span><div class="caps">${ALLSEC.map(n=>`<button data-like="${n}" aria-pressed="${S.like.includes(n)}">${short(n)}</button>`).join('')}</div><p class="small">Sections you pick move up the paper.</p>`,'Reading settings','set');
 const box=$('#pushbox');if(box&&pushable()){if(!standalone()&&/iPhone|iPad/.test(navigator.userAgent)){box.innerHTML='<p class="small" style="margin-top:0!important">To get the 7:00 AM headline, add the Brief to your Home Screen first: Share, then Add to Home Screen.</p>'}
  else Promise.race([pushState(),new Promise(r=>setTimeout(()=>r('none'),2000))]).then(st=>{if(st==='none'){box.previousElementSibling.hidden=true;box.remove();return}box.innerHTML=`<div class="rowt"><span>7:00 AM headline</span><button class="sw2" role="switch" data-a="push" aria-checked="${st==='on'}" aria-label="7:00 AM headline"></button></div><p class="small" id="pushnote">One headline each morning, when the paper is out.</p>`})}}

 else if(k==='today'){if(tab==='today'&&E===ED[0]){$('#sc').scrollTo({top:0,behavior:RM()?'auto':'smooth'});return}if(tab==='past'&&mode==='archive'&&nav(1))return;keep();tab='today';E=ED[0];today()}
