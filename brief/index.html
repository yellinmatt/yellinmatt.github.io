ies-in-major-breakup-of-its-117b-healthcare-empire", "t": "LL"}, {"n": "Becker’s", "u": "https://www.beckerspayer.com/financial/cvs-to-split-into-2-companies/", "t": "C"}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/11/04/cvs-to-split-off-drugstore-business.html", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-05/s1.webp?h=31bbff7f", "col": "#3e3729", "cap": "A CVS store in Beech Grove, Indiana. The drugstores become their own public company.", "credit": "deathpallie325, CC BY-SA 4.0 / Wikimedia Commons", "pull": {"text": "“We’re basically taking what I believe is one great company and making it two.”", "attr": "David Joyner, CVS chief executive, via CNN, Nov. 4"}, "fig": {"v": "$69 billion", "l": "What CVS paid for Aetna in 2018"}}, {"id": "s2", "sec": "The Front", "sid": "s-front", "h": "Brent falls 8.7% to $94.62 on bets the midterms end the Iran war", "s": "Oil settled at its lowest since Aug. 31 on Wednesday, Reuters reported. Trump told the Financial Times the United States had “no immediate plans to strike Iran.” Axios reported three options before him: strikes, a deal or a squeeze.", "paras": ["Oil settled at its lowest since Aug. 31 on Wednesday, Reuters reported. Brent fell $8.98, or 8.7 percent, to $94.62, and West Texas Intermediate fell 8.3 percent to $88.12, as investors bet that Democratic control of Congress could hasten the end of the war. Trump told the Financial Times on Tuesday that the United States had “no immediate plans to strike Iran.” Brent was up 0.9 percent at $95.56 early Thursday.", "Vice President Vance wrote, “The reason we lost is the war.” Axios, relayed by Iran International, reported three options before Trump: strikes, a deal or a squeeze. Vance leads the group favoring a deal, while <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Ratcliffe and Bessent<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>The CIA director and the Treasury secretary. Axios also reported that the military is completing preparations while Qatari mediators push a draft.<\/span><\/button> favor blockade and pressure. Enverus’s Carl Larry was unpersuaded by the rally: “I’m more concerned that we can see an escalation in Iran sooner than a resolution.” <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Gulf exports<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Vortexa’s figure covers crude, condensate and refined products, down from 18.9 million in September.<\/span><\/button> averaged 17.1 million barrels a day in October, about three-quarters of prewar levels. A senior Iranian official said Tuesday the two sides “remain far from a deal.”"], "why": "The market priced a political outcome into a chokepoint that remains constrained. Overriding a veto takes two-thirds of both chambers, so the premium could return fast.", "c": {"L": 0, "LL": 1, "C": 3, "LR": 0, "R": 1}, "src": [{"n": "Reuters via The Business Standard", "u": "https://www.tbsnews.net/worldbiz/middle-east/oil-slumps-after-midterm-election-rebuke-trump-raises-bets-iran-war-exit", "t": "C"}, {"n": "Fox News", "u": "https://www.foxnews.com/live-news/iran-war-news-trump-elections-oil-prices-november-4", "t": "R"}, {"n": "ABC News", "u": "https://abcnews.com/Politics/vance-blames-iran-war-republicans-midterms-defeat-trump/story?id=137849295", "t": "LL"}, {"n": "Axios via Iran International", "u": "https://www.iranintl.com/en/202611057794", "t": "C"}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/11/04/oil-price-iran-war-us-election-strait-hormuz.html", "t": "C"}], "framing": "", "min": 1, "front": true, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "fig": {"v": "17.1 million", "l": "Gulf barrels a day exported in October"}}, {"id": "s3", "sec": "The Front", "sid": "s-front", "h": "Ex-Weil partners hire a litigator as Gibson Dunn eyes 120 Weil lawyers", "s": "About 10 former Weil partners hired Peter Wang of Foley and Lardner, Above the Law reported, citing the Financial Times. They are examining possible fiduciary breaches. This paper found no report of a partner vote.", "paras": ["About 10 former Weil partners have hired Foley &amp; Lardner litigator Peter Wang, Above the Law reported Wednesday, citing the Financial Times. None of them left in this year’s exits. The group is examining whether <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Barry Wolf<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>Weil’s partners averaged over $5 million against $8 million to $10 million at rivals, by one account of the firm’s decline.<\/span><\/button> and firm management breached fiduciary duties at the end of the firm’s run. Equity is paid only if something remains after the wind-down.", "Gibson Dunn is in talks for up to 120 lawyers in the U.S. and London, more than 20 of them partners, including private funds heads Andrew Chizzik, James Bromley and James Sargent. Neither firm commented. Bloomberg Law put Ramona Nee’s Kirkland group at 40 or more, while Law.com said about 20. AI-native firms <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Vetta and Scissero<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Bidders want Weil’s precedents and playbooks too, and some sources say their use is possible if confidentiality holds.<\/span><\/button> are also bidding for talent and intellectual property, Artificial Lawyer reported. This paper found no report of a partner vote."], "why": "Outside bankruptcy no court sets the order of payment, so fiduciary claims may be how old equity gets heard. Every partnership agreement answers that question in advance, or does not.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Above the Law", "u": "https://abovethelaw.com/2026/11/former-weil-partners-lawyer-up-as-the-firms-wind-down-turns-into-a-fight-over-whats-left/", "t": null}, {"n": "Above the Law on Gibson Dunn", "u": "https://abovethelaw.com/2026/11/gibson-dunn-could-roll-out-the-welcome-mat-for-up-to-120-weil-lawyers/", "t": "C"}, {"n": "Law360", "u": "https://www.law360.com/articles/2546277/weil-s-london-wind-down-could-outlast-partner-exits", "t": "C"}, {"n": "9fin", "u": "https://www.9fin.com/insights/weil-partner-payouts-bankruptcy", "t": "C"}, {"n": "Artificial Lawyer", "u": "https://www.artificiallawyer.com/2026/11/02/ai-native-firm-vetta-bids-for-weil-ip-lawyers/", "t": "C"}], "framing": "", "min": 1, "front": true, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}, {"id": "s4", "sec": "AI", "sid": "s-ai", "h": "Apple cuts engineers’ AI budgets, and Canva lays off 22%", "s": "Apple cut its daily AI cap for engineers from $300 to $200 in October, TechCrunch reported, citing Bloomberg. Canva cut its growth forecast on AI costs, B and T reported. TechCrunch did not say AI caused the layoffs.", "paras": ["Apple cut its daily AI spending cap for engineers from $300 to $200 in October, with some falling to $100 and non-engineers possibly as low as $25, TechCrunch reported, citing Bloomberg. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Canva<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>It built its own models to lower those costs, and investors have reportedly marked the company near $35 billion.<\/span><\/button> laid off 1,271 people, or 22 percent of staff, and cut its growth forecast from 30 percent to 20 percent on AI costs, B&amp;T reported. “This has been our hardest year yet,” chief executive Melanie Perkins said. TechCrunch did not say AI caused the layoffs. Both moves reverse early 2026’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">tokenmaxxing<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Earlier reporting held that Apple once penalized low AI use, so the same engineers have gone from being pushed up to being capped.<\/span><\/button>."], "why": "Inference is now a line item that managers ration, and law firms budgeting for AI face the same arithmetic.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "TechCrunch", "u": "https://techcrunch.com/2026/11/04/apple-is-reportedly-cutting-budgets-for-its-internal-ai-usage/", "t": null}, {"n": "TechCrunch on Canva", "u": "https://techcrunch.com/2026/11/04/canva-lays-off-over-1200-people-amid-slowing-growth/", "t": "C"}, {"n": "B&T", "u": "https://www.bandt.com.au/canva-slashes-revenue-forecast-due-to-ai-spend-being-higher-than-expected/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-05/s4.webp?h=444061cd", "col": "#2f3848", "cap": "", "credit": "Daniel L. Lu, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "chart": {"t": "Apple daily AI cap for engineers", "type": "bar", "rows": [["Before October", 300, "$300"], ["Since October", 200, "$200"], ["Some engineers", 100, "$100"]]}}, {"id": "s5", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Treasury drops “at least,” opening the door to bigger 2027 auctions", "s": "Treasury kept next week’s refunding at $125 billion but dropped “at least” from its promise on auction sizes. Many analysts read “several” quarters as two, Reuters reported, which puts changes in the first half of 2027.", "paras": ["Treasury kept next week’s refunding at $125 billion on Wednesday but dropped the words “at least” from its promise on auction sizes. It now anticipates “maintaining nominal coupon and FRN auction sizes for the next several quarters.” Many analysts read “several” as two, Reuters reported, which puts changes in the first half of 2027. They expect larger sales from two to seven years, possibly 10, and cuts to the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">20- and 30-year<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Last month’s selloff pushed 10- and 30-year yields to their highest since 2002, Reuters noted.<\/span><\/button> bonds.", "The sales are $58 billion of 3-year notes, $42 billion of 10-year notes and $25 billion of 30-year bonds on Nov. 9, 10 and 12. The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Treasury Borrowing Advisory Committee<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The dealer and investor panel recommended the language change unanimously and said increases would likely be appropriate in the second half of fiscal 2027.<\/span><\/button> urged holding sizes for now. The 7-year moves to a quarterly cycle with two reopenings from March. No coupon auctions fell in the window. Par yields fell Wednesday to 4.58 percent at two years, 4.90 at 10 and 5.28 at 30. The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Bank of England<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>MoneyWeek’s live page carried a 25 basis point rise to 4 percent as the expected outcome, with Pantheon looking for an 8-1 split.<\/span><\/button> decides at noon London time today."], "why": "Every corporate bond desk prices off this curve. Less 30-year supply and more in the belly reshapes where issuers will want to come to market in 2027.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Treasury statement via EIN Presswire", "u": "https://www.einpresswire.com/article/954528240/quarterly-refunding-statement-of-assistant-secretary-for-financial-markets-hunter-mcmaster", "t": null}, {"n": "Reuters via AOL", "u": "https://www.aol.com/articles/us-treasury-shifts-language-opening-133354000.html", "t": "C"}, {"n": "Treasury advisory report", "u": "https://home.treasury.gov/news/press-releases/sb0680/", "t": "C"}, {"n": "Bloomberg", "u": "https://www.bloomberg.com/news/articles/2026-11-04/us-revamps-debt-sales-guidance-opening-path-to-auction-changes", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-05/s5.webp?h=6b4a5413", "col": "#3e3729", "cap": "The Treasury Building’s north entrance, with the Gallatin statue.", "credit": "Sealy j, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "chart": {"t": "Treasury par yields, Wednesday", "type": "line", "rows": [["2-year", 4.58, "4.58 percent"], ["10-year", 4.9, "4.90"], ["30-year", 5.28, "5.28"]]}}, {"id": "s6", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Meta draws a record €53 billion of orders for its first euro bond", "s": "Meta’s debut euro bond of up to €9 billion drew the orders, Reuters reported, citing Bloomberg News. It follows Tuesday’s $15 billion five-part dollar deal. This paper could not confirm final size.", "paras": ["Meta drew a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">record<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>April’s deal took $96 billion at peak for $25 billion of bonds, so the appetite is not new.<\/span><\/button> €53 billion of orders for a debut euro bond of up to €9 billion, Reuters reported Wednesday, citing Bloomberg News. The six tranches run from just over four years to more than 38, with Citi and Morgan Stanley managing. It follows Tuesday’s $15 billion five-part dollar deal. Meta carried $83.67 billion of debt at Sept. 30, per LSEG, against 2026 capital spending of $135 billion to $145 billion. This paper could not confirm <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">final size<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Reuters expected pricing Wednesday, and a trade report said Thursday.<\/span><\/button>. "], "why": "Hyperscalers are now shopping for investors currency by currency. Demand this deep suggests the AI debt story has not hit a wall, even after last week’s S&amp;P outlook cut.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Reuters via AOL", "u": "https://aol.com/articles/meta-draws-record-orders-debut-142348000.html", "t": "C"}, {"n": "Reuters on the dollar deal", "u": "https://www.aol.com/articles/meta-raises-15-billion-five-225011000.html", "t": "C"}, {"n": "Reuters via GBAF", "u": "https://www.globalbankingandfinance.com/meta-draws-record-orders-debut-euro-bond-sale-bloomberg-news/", "t": "C"}, {"n": "Bloomberg", "u": "https://www.bloomberg.com/news/articles/2026-11-03/meta-kicks-off-debt-offering-in-push-to-fund-ai-investments", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "fig": {"v": "$83.67 billion", "l": "Meta debt at Sept. 30, per LSEG"}}, {"id": "s7", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Helen of Troy rejects a $37 cash bid from Empower Brands", "s": "The board unanimously rejected the unsolicited, non-binding proposal, saying it “substantially undervalues” the company. Empower is owned by Spectrum Brands and Oaktree. This rests on the company’s release.", "paras": ["Helen of Troy’s board unanimously rejected an unsolicited, non-binding $37.00 a share cash proposal from <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Empower Brands<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Owned jointly by a listed strategic and a credit sponsor, so two investment committees would have to agree on any higher price.<\/span><\/button>, owned by Spectrum Brands and Oaktree, the company said Wednesday. The board said the bid “substantially undervalues” the company and is timed “to exploit the dislocation in its stock price since Liberation Day.” Empower declined a customary NDA, the release said, “highlighting the opportunistic nature of the approach.” BofA and Baker McKenzie advise. The board “remains open” to opportunities. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">No tender offer<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The accompanying 8-K says none has commenced. Helen of Troy cites total debt of $673 million and a stock up 67.5 percent fiscal year to date.<\/span><\/button> has begun."], "why": "A sponsor-strategic bid for a tariff-hit consumer name is the template for the next year. This is one side’s account: no independent report or Empower response was found.", "c": {"L": 0, "LL": 0, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "Helen of Troy release, SEC", "u": "https://www.sec.gov/Archives/edgar/data/0000916789/000091678926000141/ex-991finalhelepressrele.htm", "t": null}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}, {"id": "s8", "sec": "Law & the Courts", "sid": "s-law", "h": "Democrats gain subpoena power over Big Law’s Trump deals", "s": "Bloomberg Law reported that the midterm results give Democrats the power to compel what they have only been able to request. Lawmakers told Kirkland “we will use every tool at our disposal to pursue this investigation.”", "paras": ["The midterm results hand Democrats the power to compel what they have only been able to request from the law firms that struck deals with President Trump, Bloomberg Law reported. Nine firms pledged a combined $940 million in services, including $125 million from Kirkland &amp; Ellis and $100 million from <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Skadden<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Above the Law says it advised Intel on the Commerce Department’s stake while doing free Commerce work, the kind of overlap investigators would ask about.<\/span><\/button>. Rep. Jamie Raskin is expected to lead House Judiciary.", "Lawmakers wrote to Kirkland chair Jon Ballis that “we will use every tool at our disposal to pursue this investigation,” and say the firm produced no responsive documents and refused to meet staff. An appeals court has yet to rule on the executive orders against the four firms that sued. The firms had not commented in the reports this paper saw."], "why": "Associates at these firms may soon handle document holds on their own firm’s matter. Client conflicts and pro bono commitments become discoverable questions, not reputational ones.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Bloomberg Law", "u": "https://news.bloomberglaw.com/business-and-practice/democrats-gain-power-to-probe-trump-big-law-deals-in-election", "t": "C"}, {"n": "Above the Law", "u": "https://abovethelaw.com/2026/11/biglaw-firms-that-surrendered-to-trump-should-get-ready-for-the-congressional-probes/", "t": "C"}, {"n": "Bloomberg Law on DOJ tools", "u": "https://news.bloomberglaw.com/us-law-week/democrats-prep-doj-subpoenas-oversight-tools-with-majority-win", "t": "C"}, {"n": "National Law Journal", "u": "https://www.law.com/nationallawjournal/2026/11/04/lawyer-up-big-law-attorneys-prepare-for-congressional-investigations-ma-flurry-following-democratic-landslide/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-05/s8.webp?h=3962c69f", "col": "#383b0e", "cap": "The Rayburn building, home of the House Judiciary Committee’s offices.", "credit": "dconvertini, CC BY-SA 2.0 / Wikimedia Commons", "pull": null, "chart": {"t": "Pledged services to Trump", "type": "bar", "rows": [["Kirkland and Ellis", 125, "$125 million"], ["Skadden", 100, "$100 million"]]}}, {"id": "s9", "sec": "The World", "sid": "s-world", "h": "Bukele sends over 2,000 troops to Haiti; about 200 answer to the UN force", "s": "The UN says only about 200 Salvadoran troops fall under the Gang Suppression Force, Al Jazeera reported. Four Salvadoran technicians have been missing since Oct. 18. Haiti’s vote has slipped to July 18, 2027.", "paras": ["El Salvador has sent more than 2,000 troops to Haiti, but the UN says only about 200 fall under the Gang Suppression Force, Al Jazeera reported. President Nayib Bukele taunted gang leaders: “Gather your gangs so we can go fight with them.” UN spokesman Stéphane Dujarric said action must stay “within the framework of international human rights law.”", "Four Salvadoran aviation technicians have been missing since Oct. 18. A charred vehicle was found Tuesday in Croix-des-Bouquets. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Wilson Joseph<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>The 400 Mawozo leader carries a $1 million U.S. reward on his head, so his letter to the UN doubles as a bid for standing.<\/span><\/button> of 400 Mawozo says they are dead, blames a rival gang and has written to the UN seeking dialogue. The UN counts at least 5,700 killed or injured this year. Haiti’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">vote<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Under 1 million of about 6.5 million eligible voters have registered, the reporting said.<\/span><\/button> has slipped to July 18, 2027. Prime Minister Alix Fils-Aimé said the Salvadorans are “not here to replace the state.”"], "why": "Most of a foreign army is operating in Haiti outside the UN-backed force, which is a live test of who answers for what those troops do.", "c": {"L": 1, "LL": 1, "C": 0, "LR": 0, "R": 1}, "src": [{"n": "Al Jazeera, with AP", "u": "https://www.aljazeera.com/news/2026/11/5/el-salvadors-bukele-touts-military-intervention-in-haiti", "t": "L"}, {"n": "Fox News", "u": "https://www.foxnews.com/world/bukeles-warning-haitian-gang-leaders-forces-finish-el-salvador", "t": "R"}, {"n": "NPR, Oct. 22 background", "u": "https://www.npr.org/2026/10/22/nx-s1-6012029/bukele-military-operation-haiti", "t": "LL"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-05/s9.webp?h=5a08788e", "col": "#343b2d", "cap": "Port-au-Prince from the air, in a 2008 U.S. Navy photograph.", "credit": "U.S. Navy, James G. Pinsky, Public domain / Wikimedia Commons", "pull": null, "fig": {"v": "5,700", "l": "At least this many killed or injured, UN"}}, {"id": "s10", "sec": "The World", "sid": "s-world", "h": "Russia hits Ukraine’s power system with 76 missiles, then 310 drones the next night", "s": "Russia launched 289 drones and 76 missiles at nine regions overnight Tuesday, The Defense Post reported. DTEK said three thermal plants stopped. Talks are set for Abu Dhabi.", "paras": ["Russia launched 289 drones and 76 missiles at nine Ukrainian regions overnight Tuesday, then 310 drones the next night, with 272 downed and hits at 19 locations, The Defense Post reported. DTEK said three thermal plants stopped. A Kharkiv hospital strike injured 73. At Komyshuvakha, hit Nov. 2, police said 42 bodies have been recovered and 33 people may remain. “Emergency and rolling blackouts continue,” Volodymyr Zelenskyy said, complaining of “very little reaction from the world.” The U.S. approved a potential <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">$2.1 billion sale<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>It covers 500 Patriot interceptors. A foreign military sale approval is a ceiling, and deliveries come well after notification.<\/span><\/button>. Talks are set for <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Abu Dhabi<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>Zelenskyy has floated an energy ceasefire as an ask for the session, set for Nov. 10 and 11.<\/span><\/button>."], "why": "Grid strikes before winter shape what each side brings to Abu Dhabi next week.", "c": {"L": 0, "LL": 1, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "The Defense Post", "u": "https://thedefensepost.com/2026/11/04/russia-310-drones-ukraine/", "t": null}, {"n": "Interfax-Ukraine", "u": "https://en.interfax.com.ua/news/general/1231534.html", "t": "C"}, {"n": "NPR, Nov. 3", "u": "https://www.npr.org/2026/11/03/g-s1-151439/russia-ukraine-war", "t": "LL"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "fig": {"v": "42", "l": "Bodies recovered at Komyshuvakha, police said"}}, {"id": "s11", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "Sony raises its outlook as Nintendo misses and Switch 2 slows", "s": "Sony’s fiscal second-quarter operating profit rose 45 percent to ¥622.3 billion, Reuters reported, while it sold fewer consoles. Nintendo kept its 16.5 million forecast.", "paras": ["Sony’s fiscal second-quarter operating profit rose 45 percent to ¥622.3 billion on Thursday, beating an LSEG estimate of ¥505 billion, and it raised its full-year profit outlook 9 percent, Reuters reported. It sold 2.6 million <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">PS5<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Lifetime sales stand at 97.9 million, Engadget reported, and digital reached 78 percent of full-game sales, which is why profit can rise as hardware falls.<\/span><\/button> consoles against 4 million a year earlier. Games revenue rose 9 percent and games profit 83 percent, Engadget reported.", "Nintendo’s quarterly operating profit fell 16 percent to ¥73.9 billion, and net profit fell 29 percent to ¥73.5 billion, short of a Bloomberg survey at ¥82.2 billion. Switch 2 sold 6.49 million in the half, against about 10.4 million a year earlier. It kept its 16.5 million forecast. First-half <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">operating profit<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The rise was helped by a refund of IEEPA tariffs booked in the first quarter, a legal windfall rather than an operating one.<\/span><\/button> still rose 49.1 percent. “Sony is the bigger winner today,” analyst Serkan Toto said."], "why": "Software margin is carrying both companies as hardware slows, the setting for GTA 6 on Nov. 19.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Reuters via Investing.com", "u": "https://www.investing.com/news/stock-market-news/sony-posts-45-q2-profit-rise-on-movies-games-boost-5002354", "t": "C"}, {"n": "AFP via RTE", "u": "https://www.rte.ie/news/business/2026/1105/1598070-nintendo-quarterly-results/", "t": "C"}, {"n": "Engadget", "u": "https://www.engadget.com/2307531/sony-earnings-report-2026-selling-more-ps5-games-console-demand/", "t": "C"}, {"n": "Push Square", "u": "https://www.pushsquare.com/news/2026/11/ps5-closing-in-on-100-million-sales-as-gradual-drop-off-continues", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-05/s11.webp?h=edb98524", "col": "#383c09", "cap": "Sony City, the company’s Tokyo headquarters, in 2019.", "credit": "Tyvic, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "chart": {"t": "PS5 sold in the quarter, millions", "type": "bar", "rows": [["A year earlier", 4, "4 million"], ["This quarter", 2.6, "2.6 million"]]}}, {"id": "s12", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "The midterm sweep puts the college sports bill in peril before Jan. 3", "s": "The Protect College Sports Act passed the Senate 77-22, but the House must act before the new Congress sits or the bill restarts, Front Office Sports reported. The Congressional Black Caucus is “completely opposed.”", "paras": ["The Protect College Sports Act passed the Senate 77-22, but the House must act before the new Congress sits on Jan. 3 or the bill restarts, Front Office Sports reported Wednesday. House Majority Leader Steve Scalise’s concerns remain, and the Congressional Black Caucus is “completely opposed.” A Democratic aide said, “There’s absolutely zero reason to give Donald Trump a win on college sports.” The House has <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">few working days<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>On3 counted eight between Nov. 9 and 20, then Nov. 30 to a Dec. 17 target, and any amendment returns the bill to the Senate.<\/span><\/button> left. The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Big Ten<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>It raised its cap from $21.3 million to $49 million to align with the bill.<\/span><\/button> has already moved."], "why": "Without a federal shield, NIL and employment fights stay in the courts and state legislatures, and that is where the sports law work stays.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "Front Office Sports", "u": "https://frontofficesports.com/newsletter/college-sports-bill-in-jeopardy/", "t": null}, {"n": "On3 via Yahoo", "u": "https://sports.yahoo.com/articles/midterm-elections-mean-protect-college-033054853.html", "t": "C"}, {"n": "Yahoo Sports", "u": "https://sports.yahoo.com/articles/protect-college-sports-act-jeopardy-165642410.html", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-05/s12.webp?h=0e14a213", "col": "#1a3862", "cap": "", "credit": "Martin Falbisoner, CC BY-SA 3.0 / Wikimedia Commons", "pull": null}, {"id": "s13", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "Suno asks a court to toss Jason Isbell’s suit", "s": "Suno moved Tuesday to dismiss the right-of-publicity class action, Music Business Worldwide reported, calling artist names “shorthand for the genre they perform in.” The complaint has no copyright claim. Opposition is due Dec. 1.", "paras": ["Suno moved Tuesday to dismiss the right-of-publicity class action brought by Jason Isbell and three other plaintiffs, Music Business Worldwide reported. The 84-page complaint, filed Aug. 31 before Judge Angel Kelley in Boston, has no copyright claim. Suno argues that prompts use names as genre shorthand, that there was no public use, that the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Copyright Act<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A preemption win would stop plaintiffs using state publicity law to reach style, which copyright does not protect.<\/span><\/button> preempts the claims and that the First Amendment applies. It warned of a “shadow state law IP regime.” Opposition is due Dec. 1. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">UMG and Sony<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>They sued Suno separately on Sept. 18, so the company is defending on both the copyright and publicity flanks.<\/span><\/button> are in a separate case."], "why": "Style is not copyrightable, so publicity law is where artists are trying to reach AI. A ruling here would map the boundary for EASL practice.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Music Business Worldwide", "u": "https://www.musicbusinessworldwide.com/suno-asks-court-to-dismiss-jason-isbells-right-of-publicity-class-action-it-claims-artist-names-are-shorthand-for-musical-genres/", "t": null}, {"n": "Original complaint", "u": "https://www.musicbusinessworldwide.com/files/2026/09/Isbell.pdf", "t": null}, {"n": "ChatGPT Is Eating the World, background", "u": "https://chatgptiseatingtheworld.com/2026/09/01/jason-isbell-other-musicians-sue-suno-for-alleged-use-of-names-likeness-in-violation-of-bipa-and-rights-of-publicity/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}, {"id": "s14", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "Tinto Brass, who disowned the final cut of Caligula, dies at 93", "s": "The Italian director died in Rome on Wednesday, his family told ANSA. His name stays tied to Caligula, where producer Bob Guccione added scenes in post without his approval. Brass disowned the cut.", "paras": ["Tinto Brass, the Italian director ANSA called “il maestro del cinema erotico italiano,” died in Rome on Wednesday at 93, his wife Caterina Varzi and his children told the agency. The cause was not given. A Milan native, he took a law degree, then went to Paris and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Henri Langlois’s Cinémathèque<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>He went on to work with Roberto Rossellini and Joris Ivens, Artribune reported.<\/span><\/button>. His name stays tied to Caligula, where producer Bob Guccione added hardcore scenes in post without his approval. Brass disowned the cut and Gore Vidal asked that his own name be removed. The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Ultimate Cut<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>It premiered at Cannes in 2023. The original production cost $25 million, Cleveland.com reported.<\/span><\/button> came decades later."], "why": "Caligula remains the textbook case on final cut: who owns a film once the financier holds the negative, and what a director’s name is worth once he withdraws it.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "ANSA", "u": "https://www.ansa.it/sito/notizie/cultura/2026/11/04/lutto-nel-cinema-e-morto-il-regista-tinto-brass_bf039226-75f9-4f5f-867e-ae386d7959e0.html", "t": null}, {"n": "Sky TG24", "u": "https://tg24.sky.it/spettacolo/cinema/2026/11/04/tinto-brass-morto", "t": "C"}, {"n": "Artribune", "u": "https://www.artribune.com/arti-performative/cinema/2026/11/morto-tinto-brass-regista-roma-93-anni/", "t": "C"}, {"n": "The Hollywood Reporter", "u": "https://www.hollywoodreporter.com/news/general-news/tinto-brass-dead-caligula-malcolm-mcdowell-1236747742/", "t": "C"}, {"n": "Variety", "u": "https://variety.com/2026/film/global/tinto-brass-dead-caligula-salon-kitty-1236939212/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}], "week": [], "cover": "img/2026-11-05/s1.webp?h=31bbff7f"}, {"date": "2026-11-04", "no": 160, "min": 9.4, "stand": "Democrats take both chambers, futures fall and recover, oil slides while Iran says no deal is near, and Cadillac’s F1 team may be for sale.", "note": "Editor’s note. 14 items at 2,263 read-words, under the ten-minute cap. This edition closed before Treasury’s 8:30 a.m. refunding and before Flutter’s results. Counts are as of 2:58 a.m. Eastern. The 54 and 224-134 figures come from the Boston Globe alone, whose report carried two name errors elsewhere, and AP’s stories give no seat totals. Seven Senate flips are this paper’s reading of AP’s winners against the prior 53-47 split. Disclosures: Anthropic, whose model compiles this paper, is tied to Public First, which appears in the AI lead. Not run: Hg’s new European venture with Anthropic, published minutes before the window and without terms; Judge Walton’s poll-monitor order, dated Nov. 2 with no report on the Tuesday status filing; the Zaporizhzhia strike, death toll unsettled; reported target letters in the Alaska Senate probe, page unreadable; a trade report of a federal inquiry touching Mark Walter, unconfirmed; Helen Chiang’s Xbox exit, reason unknown; Warner’s purchase of Zebralution, single source; Flutter’s appointment of Christian Genetski, pre-window and single source. Magnitude: the largest signed deal confirmed in the window is CrowdStrike, on a relayed report, and Axios Pro Rata’s body was unreadable, so a larger deal may have been missed. DoorDash and Instacart signed at $17 billion on Oct. 29, before this window, and this paper has not yet run it. No fresh verified beat on Intesa and Monte dei Paschi, BASF and Evonik, or GFL before its Nov. 9 bid date. Hike odds are omitted as unconfirmed. Matt Levine’s only item surfaced was Monday’s, on Binance, already covered. Sourcing limits: quotes from Trump and Thune run as AP printed them; NBC, CNN, National Review, NPR, Law.com, SCOTUSblog and Sportico links were seen and not opened; The New York Times, The Guardian and the BBC were not reached; Sportico and The Wall Street Journal on Cadillac come through BlackBook; the Harvard forum and the Anthropic newsroom had nothing in the window. Watch: refunding and Flutter today; the Bank of England Thursday; the remaining Senate calls; Herzog’s consultations; GFL Nov. 9.", "items": [{"id": "s1", "sec": "The Front", "sid": "s-front", "h": "Democrats take the House and the Senate", "s": "Democrats took the Senate late Tuesday and the House around 1:30 a.m., in what the AP called “a decisive rebuke of Republican governance in Washington.” Seven Republican-held Senate seats fell, including Susan Collins’s in Maine.", "paras": ["Democrats won control of both chambers of Congress in Tuesday’s midterm elections, taking the Senate late in the evening and the House around 1:30 a.m. Wednesday, in what the Associated Press called “a decisive rebuke of Republican governance in Washington.” Republicans entered the night holding the Senate 53-47. The Boston Globe’s 2:58 a.m. count put Democrats at 54 Senate seats and ahead 224 to 134 in the House, with about 77 House seats unallocated.", "Seven Republican-held Senate seats fell: Roy Cooper in North Carolina, <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Annie Andrews<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>The seat belonged to the late Lindsey Graham, and Trump carried South Carolina by 18 points in 2024, Politico noted.<\/span><\/button> in South Carolina, <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">James Talarico<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>The first Texas Democrat elected to the Senate since 1988, the Globe said. Fox News called Trump’s backing of Paxton a gamble that backfired.<\/span><\/button> in Texas, Sherrod Brown in Ohio, <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Adam Hamilton<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>He becomes the first Democratic senator from Kansas since 1932, per the Globe.<\/span><\/button> in Kansas, Josh Turek in Iowa and Troy Jackson, who beat <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Susan Collins<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>Five terms and nearly 30 years in the Senate. The race was called just after 1 a.m., the Globe reported.<\/span><\/button> in Maine. Gina Hinojosa beat Gov. Greg Abbott of Texas, and Amy Acton beat Vivek Ramaswamy in Ohio. Florida held for Republicans, with Sen. Ashley Moody and Rep. Byron Donalds, the governor-elect. Alaska, Mississippi, Montana and Nebraska were uncalled in the Globe’s count.", "AP reported that Democrats plan investigations of senior officials and of how Trump has enriched his family, and that impeachment “is not off the table.” <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Hakeem Jeffries<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>He would be the first Black Speaker, but the House must elect him when it convenes in January.<\/span><\/button> promised a 100-day agenda on the cost of living and oversight. Trump, who vowed to veto Democratic bills, told Fox News voters “didn’t like the candidates” and said he would accept the results. Sen. John Thune wrote that Republicans “will not stand idly by.” The administration has also sued to block <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">certification in Alaska<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>This paper reported Nov. 2 that a federal judge dismissed a Justice Department ballot suit there for lack of redressability, and that the department planned an appeal.<\/span><\/button> if Republican Dan Sullivan loses."], "why": "Senate control is the fact for deal lawyers: from January every nomination, regulators and judges included, runs through Democrats, and House chairs hold subpoenas. Trump’s last two years now rest on vetoes and executive action.", "c": {"L": 0, "LL": 2, "C": 1, "LR": 0, "R": 2}, "src": [{"n": "Associated Press via Yahoo", "u": "https://ca.news.yahoo.com/midterm-elections-coming-close-voters-125045297.html", "t": null}, {"n": "Boston Globe", "u": "https://www.bostonglobe.com/2026/11/04/nation/midterm-elections-results-blue-wave/", "t": "C"}, {"n": "NBC News", "u": "https://www.nbcnews.com/politics/2026-election/live-blog/midterm-election-results-2026-news-trump-live-updates-rcna605763", "t": "LL"}, {"n": "CNN", "u": "https://www.cnn.com/2026/11/04/politics/live-news/midterm-election-congress", "t": "LL"}, {"n": "National Review", "u": "https://www.nationalreview.com/2026/11/armageddon/", "t": "R"}, {"n": "Fox News", "u": "https://www.foxnews.com/politics/trumps-gamble-ken-paxton-backfires-democrat-pulls-off-historic-texas-senate-upset", "t": "R"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-04/s1.webp?h=55d253d3", "col": "#1a3862", "cap": "The Capitol, where both chambers change hands in January.", "credit": "Martin Falbisoner, CC BY-SA 3.0 / Wikimedia Commons", "pull": {"text": "“I wasn’t on the Ballot and if I was, we would have won IN A LANDSLIDE!”", "attr": "Donald Trump, social media post quoted by AP, Nov. 4"}, "chart": {"t": "House count at 2:58 a.m., Boston Globe", "type": "bar", "rows": [["Democrats", 224, "224"], ["Republicans", 134, "134"], ["Unallocated", 77, "about 77"]]}}, {"id": "s2", "sec": "The Front", "sid": "s-front", "h": "Futures fall as much as 2% on the sweep, then recover", "s": "Stock futures fell as much as 2% overnight, then turned slightly positive by 4:09 a.m., Reuters reported. The 10-year yield stood at 4.92%, down 3 basis points. Treasury’s quarterly refunding comes at 8:30 a.m.", "paras": ["U.S. stock futures fell as much as 2% overnight as the Democratic sweep took shape, then turned slightly positive by 4:09 a.m. Eastern, Reuters reported, with Russell 2000 futures up 0.7% after losing 1%. The 10-year yield stood at 4.92%, down 3 basis points, after touching 4.89%. The euro rose 0.4% to $1.133. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Polymarket<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Yahoo Finance cited the prediction market on Tuesday morning: a 76% chance of Democrats taking both chambers.<\/span><\/button> had priced much of the result, which makes the size of the swing the news.", "Tuesday’s Treasury closes were 2-year 4.61%, 5-year 4.74%, 10-year 4.95%, <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">20-year 5.35%<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>It yielded more than the 30-year on both days of Treasury’s November table, a kink at the long end.<\/span><\/button> and 30-year 5.32%, each 2 to 4 basis points higher. The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">quarterly refunding<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The statement sets note and bond sizes. Treasury’s Nov. 2 estimates put borrowing need at $618 billion this quarter and $800 billion next.<\/span><\/button> comes at 8:30 a.m., after this paper’s deadline. The Fed next meets Dec. 8-9. Australia’s central bank raised its cash rate to an 18-year high of 4.85%, its <button aria-haspopup=\"dialog\" class=\"gloss\" data-gloss-ok=\"quoted reaction\" type=\"button\">fifth hike<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Governor Michele Bullock: “It is going to make people feel like it’s a recession because they feel poorer.”<\/span><\/button> this year, and the country’s four biggest banks will pass it on from Nov. 13."], "why": "A 76% outcome still moved futures 2%, so the market had priced a win and not a rout. Issuers now plan around a hostile Congress and a 10-year near 5%.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Reuters via AOL", "u": "https://www.aol.com/articles/us-stock-futures-dip-investors-010615000.html", "t": "C"}, {"n": "Treasury par yields", "u": "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_yield_curve&field_tdr_date_value_month=202611", "t": null}, {"n": "Reuters via Yahoo", "u": "https://finance.yahoo.com/markets/stocks/articles/us-stock-futures-dip-investors-010842458.html", "t": "C"}, {"n": "ABC Australia", "u": "https://www.abc.net.au/news/2026-11-04/australian-banks-lift-interest-rates-after-rba-cash-rate-hike/107341858", "t": "C"}, {"n": "CNBC", "u": "https://www.cnbc.com/amp/2026/11/03/treasury-yields-fall-as-democrats-win-big-in-us-midterm-elections.html", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-04/s2.webp?h=69f84cb3", "col": "#293b40", "cap": "", "credit": "Carol M. Highsmith, Public domain / Wikimedia Commons", "pull": null, "chart": {"t": "Treasury closes on Tuesday", "type": "line", "rows": [["2-year", 4.61, "4.61%"], ["5-year", 4.74, "4.74%"], ["10-year", 4.95, "4.95%"], ["20-year", 5.35, "5.35%"], ["30-year", 5.32, "5.32%"]]}}, {"id": "s3", "sec": "The Front", "sid": "s-front", "h": "Brent settles at a four-week low as Iran says a deal is far off", "s": "Brent fell $1.17 to $103.60, its lowest close since Oct. 7, as a senior Iranian official told Reuters the two sides remain far from a deal. A tanker was still struck off Oman, Gulf News said.", "paras": ["Brent fell $1.17 on Tuesday to settle at $103.60, its lowest close since Oct. 7, and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">West Texas Intermediate<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Analysts expected the first rise in U.S. crude stocks in five weeks, about 0.9 million barrels, Reuters said.<\/span><\/button> settled at $96.09, even as a senior Iranian official told Reuters the two sides remain <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">far from a deal<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Iran reportedly wants sanctions relief, an end to the naval blockade and release of frozen funds, Gulf News said.<\/span><\/button>. Qatar has stepped up mediation to head off escalation after the midterms, and its foreign ministry says both sides are reviewing proposals.", "The shipping picture did not improve. U.K. Maritime Trade Operations reported a tanker struck by two unidentified projectiles about 14 nautical miles northeast of Lima, Oman, hitting the engine room without casualties, Gulf News said. Tracking data showed five commodity vessels crossing the strait Saturday and none Sunday, against more than 130 ships a day before the war. The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Theodore Roosevelt<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Gulf News counts it as the third carrier strike group, and it is still in transit rather than on station.<\/span><\/button> is en route to Central Command, and Trump has been briefed on options, reportedly a “short, intense campaign.”"], "why": "Oil is pricing talks while tankers are still being hit. ING calls it “probably too early to think escalation risks have passed,” and a Democratic Congress now inherits the war’s funding.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Reuters via bdnews24", "u": "https://bdnews24.com/business/kio22yr8nx", "t": "C"}, {"n": "Gulf News", "u": "https://gulfnews.com/uae/usisrael-iran-war-what-uae-residents-need-to-know-today-nov-4-2026-1.500735252", "t": "C"}, {"n": "The Star", "u": "https://www.thestar.com.my/business/2026/11/04/oil-eases-to-four-week-low-on-peace-hopes", "t": "C"}, {"n": "OilPrice.com", "u": "https://oilprice.com/Latest-Energy-News/World-News/Brent-Flash-Crashes-6-Before-Rebounding-Towards-104.html", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-04/s3.webp?h=edac146a", "col": "#223d43", "cap": "", "credit": "ITookSomePhotos, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "fig": {"v": "130+", "l": "ships a day through the strait before the war"}}, {"id": "s4", "sec": "AI", "sid": "s-ai", "h": "Democrats ran against data centers and kept winning", "s": "Politico reported that Democrats made data centers and Big Tech a foil and kept winning. Musk spent roughly $224 million backing Texas Republicans, and statewide races there went nearly uniformly Democratic. This paper saw no polling that isolates data centers as a cause.", "paras": ["Democrats made data centers and Big Tech a foil across the country and kept winning, Politico reported Wednesday, naming Gina Hinojosa in Texas, Sherrod Brown in Ohio and Rebecca Cooke in Wisconsin. Elon Musk spent <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">roughly $224 million<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Fortune, citing a New York Times analysis, put more than $200 million behind electing Ken Paxton alone.<\/span><\/button> to support Texas Republicans, and statewide races there went nearly uniformly Democratic. Marc Andreessen and Ben Horowitz gave $116 million, mainly to Republicans. Greg and Anna Brockman gave $50 million, primarily to the GOP.", "The cleanest loss came in South Carolina, where Building the Future, a super PAC closely linked to <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Leading the Future<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The network is not winless: it spent more than $300,000 for Rep. Jared Moskowitz in Florida’s 25th, who won.<\/span><\/button>, put $4.8 million behind Sen. Darline Graham. The rest of the read is softer. Leading the Future and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Public First<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Politico describes it as tied to Anthropic, whose model compiles this paper. Brad Carson, its co-leader, says AI safety will be a 2028 litmus test.<\/span><\/button> “largely retreated” from direct support in most general elections, and this paper saw no polling that isolates data centers as a cause. Sen. Ed Markey was less cautious: “They are going to need to plant new forests for all of the subpoenas we’ll be printing.”"], "why": "Federal preemption of state AI law now needs chairs who campaigned the other way. The labs’ oversight problem has moved from statehouses to committee rooms.", "c": {"L": 1, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "Politico via Yahoo", "u": "https://www.yahoo.com/news/politics/articles/dems-made-big-tech-foil-095057496.html", "t": null}, {"n": "Fortune", "u": "https://fortune.com/2026/11/04/big-money-politics-billionaire-spending-midterm-election/", "t": "C"}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/11/04/elon-musk-midterms-ai-data-centers.html", "t": "C"}, {"n": "The Intercept", "u": "https://theintercept.com/2026/10/29/midterms-election-money-ai-super-pac/", "t": "L"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-04/s4.webp?h=6a369511", "col": "#41362a", "cap": "Cooling towers and generators on a data center roof.", "credit": "Rsparks3, CC0 / Wikimedia Commons", "pull": null, "chart": {"t": "Tech donors, mostly to Republicans", "type": "bar", "rows": [["Elon Musk", 224, "$224 million"], ["Andreessen, Horowitz", 116, "$116 million"], ["The Brockmans", 50, "$50 million"]]}}, {"id": "s5", "sec": "AI", "sid": "s-ai", "h": "Apple moves romantic AI companions to an 18+ rating", "s": "Apple told developers Monday that apps with dating or romantic features must carry an 18+ rating, AI companions included, TechCrunch reported. New content descriptors are required from Nov. 16, and Character.AI and Replika could be affected.", "paras": ["Apple told developers Monday that apps offering dating or romantic relationship features must carry an <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">18+ rating<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Brazil gets a carve-out: family location-sharing apps there can seek a Justice Ministry rating instead.<\/span><\/button>, TechCrunch reported, reaching AI companions with sexual or romantic content even when that is one function among many. New content descriptors are required from Nov. 16. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Character.AI<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Disney is the stalking horse in its Chapter 11 sale, with a floor near $20 million and an auction set for Nov. 23.<\/span><\/button> and Replika could be affected, though the effect on either app’s rating is unknown."], "why": "A platform rule can reprice an asset in bankruptcy. Any Character.AI bidder now has to underwrite a possibly narrower audience.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "TechCrunch", "u": "https://techcrunch.com/2026/11/03/apple-restricts-dating-apps-and-ai-companions-to-users-18-and-up/", "t": null}, {"n": "Android Headlines", "u": "https://www.androidheadlines.com/2026/11/apple-tightens-app-store-rules-for-dating-apps-and-ai-companions.html", "t": "C"}, {"n": "Gadget Review", "u": "https://www.gadgetreview.com/apple-labels-ai-companion-apps-as-dating-apps-raising-age-gate", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-04/s5.webp?h=f211b126", "col": "#393a26", "cap": "", "credit": "Arne Müseler, CC BY-SA 3.0 de / Wikimedia Commons", "pull": null}, {"id": "s6", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Florida cuts the assessment cap to 5% and lifts the homestead exemption", "s": "Amendment 3 cleared the 60% supermajority, with CBS12 putting the yes vote at 62% at the call. The assessment cap on non-homestead property, commercial sites included, falls to 5% from 10% starting Jan. 1, 2027.", "paras": ["Florida voters approved <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Amendment 3<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A CBS12 caption says a Leon County judge found earlier ballot language misleading and ordered a rewrite before November.<\/span><\/button> on Tuesday, clearing the 60% supermajority; CBS12 put the yes vote at 62% at the call. The non-school homestead exemption rises to $150,000 on Jan. 1, 2027, and $250,000 a year later. The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">annual assessment cap<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>It limits growth in assessed value, so the gap to market value widens on long-held assets until a sale resets it.<\/span><\/button> on non-homestead property, including commercial sites, second homes and rentals, falls to 5% from 10% starting Jan. 1, 2027. Opponents warn of a loss reaching “tens of billions of dollars over five years.”"], "why": "The cap flows straight into Miami underwriting, and the revenue hole flows into municipal bond disclosure.", "c": {"L": 0, "LL": 1, "C": 2, "LR": 0, "R": 1}, "src": [{"n": "Fox 13", "u": "https://www.fox13news.com/news/florida-amendment-3-voters-pass-historic-property-tax-caps", "t": "R"}, {"n": "CBS12", "u": "https://cbs12.com/news/local/florida-amendment-3-what-a-yes-or-no-vote-means-for-homeowners-and-local-services", "t": "C"}, {"n": "WJHG", "u": "https://www.wjhg.com/2026/11/04/florida-voters-approve-amendment-3-expand-property-tax-relief/", "t": "C"}, {"n": "NBC Miami", "u": "https://www.nbcmiami.com/elections/these-are-the-florida-amendments-on-the-november-2026-ballot/3877785/", "t": "LL"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-04/s6.webp?h=ef75ab3b", "col": "#3e3729", "cap": "Brickell, Miami, where the 5% cap meets the commercial tax roll.", "credit": "Rhododendrites, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "chart": {"t": "Non-school homestead exemption", "type": "bar", "rows": [["From Jan. 1, 2027", 150000, "$150,000"], ["A year later", 250000, "$250,000"]]}}, {"id": "s7", "sec": "Markets & Deals", "sid": "s-mkt", "h": "CrowdStrike pays $495 million for two AI security startups", "s": "CrowdStrike agreed to buy Fiddler AI and Dreadnode for a combined $495 million, The Wall Street Journal reported, and its shares rose more than 2% in early trading. It is the largest signed deal this paper could confirm in the window, on a thin sweep.", "paras": ["CrowdStrike agreed to buy Fiddler AI and Dreadnode for a combined $495 million, according to a Wall Street Journal report relayed by Yahoo Finance on Tuesday, and its shares rose more than 2% in early trading. No split between the targets, adviser or law firm was in anything this paper could read. It is the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">largest signed deal<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Marvell’s $115 billion agreement for Lumentum, signed Monday, falls just outside this edition’s window.<\/span><\/button> the desk could confirm in the window, on a thin sweep. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Axios Pro Rata<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Tuesday’s headline also lists a $16 billion valuation for Fal and an offer for Foodtastic. The body was not readable.<\/span><\/button> flagged it too."], "why": "AI security is becoming something incumbents buy. This is the day’s verified deal marker, and a bigger one may have escaped this sweep.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Yahoo Finance", "u": "https://finance.yahoo.com/markets/live/stock-market-today-tuesday-november-3-dow-sp-500-nasdaq-midterms-amd-earnings-141143244.html", "t": null}, {"n": "Axios Pro Rata", "u": "https://www.axios.com/pro/all-deals/2026/11/03/pro-rata-premium-first-look", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-04/s7.webp?h=61b7d9ea", "col": "#243a4f", "cap": "", "credit": "Coolcaesar, CC BY 4.0 / Wikimedia Commons", "pull": null}, {"id": "s8", "sec": "Law & the Courts", "sid": "s-law", "h": "Justices lean toward Colorado’s Catholic preschools", "s": "The Court appeared inclined to side with the schools in St. Mary Catholic Parish v. Roy, Reuters and SCOTUSblog reported. But Roberts rejected their reading of the funding cases: “That’s not the case here.” Lower courts had upheld the state.", "paras": ["The Supreme Court appeared inclined Tuesday to side with Catholic preschools in St. Mary Catholic Parish v. Roy, No. 25-581, a challenge to the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">nondiscrimination agreement<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Justice Kavanaugh tested the limits with questions on hiring gay coaches and athletic directors, K-12 Dive reported, so the case could reach employment.<\/span><\/button> required for Colorado’s universal preschool program, Reuters and SCOTUSblog reported. The program offers 15 free hours a week, which the schools value at about $6,000 per child. The Archdiocese of Denver oversees 34 preschools, and lower courts upheld the state.", "The path may matter more than the count. Chief Justice Roberts told the schools’ lawyer, Nicholas Reaves, that the Court’s earlier funding cases “expressly discriminated against religious schools on its face,” adding, “That’s not the case here.” Justice Jackson said, “it seems to me you’re asking for a special rule for religious schools.” The Court had declined to consider overruling <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Employment Division v. Smith<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Under the 1990 rule, a neutral, generally applicable law survives a free exercise challenge. Secular exceptions are the standard way to show a law is not general.<\/span><\/button>. The schools also argue that Colorado <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">grants many exemptions<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Principal Deputy Solicitor General Sarah Harris also argued, for the United States as amicus.<\/span><\/button>. A decision is due by the end of June."], "why": "A win on Colorado’s exemptions would be narrow in doctrine and wide in reach, because most public programs carry carve-outs. Voucher and pre-K statutes should be read against it.", "c": {"L": 0, "LL": 1, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "SCOTUSblog", "u": "https://www.scotusblog.com/2026/11/court-seems-poised-to-side-with-catholic-preschools-in-religious-discrimination-dispute/", "t": null}, {"n": "Reuters via Central Oregon Daily", "u": "https://www.centraloregondaily.com/news/politics/us-supreme-court-hears-catholic-preschools-challenge-to-lgbt-protections/article_9bd9ba79-67bf-5d1d-bc8d-eb46cfcc5b57.html", "t": "C"}, {"n": "K-12 Dive", "u": "https://www.k12dive.com/news/scotus-may-agree-some-schools-can-exclude-children-of-lgbtq-parents/873652/", "t": "C"}, {"n": "NPR", "u": "https://www.npr.org/2026/11/03/nx-s1-6026566/scotus-religious-freedom-case", "t": "LL"}, {"n": "AP via Durango Herald", "u": "https://durangoherald.com/articles/associated-press/case-over-state-funding-for-catholic-preschools-in-colorado-comes-before-the-supreme-court", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-04/s8.webp?h=bc444872", "col": "#17395e", "cap": "The Supreme Court’s west facade.", "credit": "Joe Ravi, CC BY-SA 3.0 / Wikimedia Commons", "pull": null}, {"id": "s9", "sec": "Law & the Courts", "sid": "s-law", "h": "Quinn Emanuel takes Weil’s Adam Fee as Kirkland nears a Nee team", "s": "Adam Fee, who led Bob Menendez’s 2024 defense, is joining Quinn Emanuel, Bloomberg Law reported. Kirkland is closer to hiring Ramona Nee with a team Law.com puts at 20 and Bloomberg Law at 40 or more. No Weil partner vote has been reported.", "paras": ["<button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Adam Fee<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>He joined Weil in 2025 from Paul Hastings and works from its Los Angeles and New York offices.<\/span><\/button>, the Weil litigator who led Bob Menendez’s 2024 defense, is joining Quinn Emanuel, Bloomberg Law reported Tuesday. Law.com said the same day that Kirkland &amp; Ellis is closer to hiring Ramona Nee with a 20-member team, while Bloomberg Law puts the group at 40 or more. The two figures are unreconciled. Partners were expected to vote on the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">wind-down<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Crosby, Vetta and Scissero are bidding for Weil’s brand, data or precedents, Artificial Lawyer and TechCrunch reported.<\/span><\/button> “in the coming days,” and this paper found no report that they have."], "why": "The market is pricing Weil’s practices before its partners vote. What remains to allocate is the trainees, the leases and the precedent bank.", "c": {"L": 0, "LL": 0, "C": 5, "LR": 0, "R": 0}, "src": [{"n": "Bloomberg Law", "u": "https://news.bloomberglaw.com/business-and-practice/quinn-emanuel-nabs-top-weil-litigator-fee-as-ny-firm-winds-down", "t": "C"}, {"n": "Law.com", "u": "https://www.law.com/americanlawyer/2026/11/03/kirkland-gets-closer-to-hiring-weils-ramona-nee-along-with-20-member-team-/", "t": "C"}, {"n": "Legal Cheek", "u": "https://www.legalcheek.com/2026/11/top-weil-lawyers-eye-lucrative-moves-as-trainees-face-uncertain-future/", "t": "C"}, {"n": "Bloomberg via Indiana Lawyer", "u": "https://www.theindianalawyer.com/articles/heavyweight-law-firm-weil-gotshal-winding-down-operations", "t": "C"}, {"n": "Artificial Lawyer", "u": "https://www.artificiallawyer.com/2026/11/02/ai-native-firm-vetta-bids-for-weil-ip-lawyers/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-04/s9.webp?h=3c4cd776", "col": "#313845", "cap": "", "credit": "Deans Charbal, CC BY-SA 4.0 / Wikimedia Commons", "pull": null}, {"id": "s10", "sec": "Law & the Courts", "sid": "s-law", "h": "Florida retains every appellate judge, one with an open ethics case", "s": "Voters retained Justice Carlos Muñiz and all 22 district court judges on the ballot, the Florida Trib reported. Judge Bronwyn Miller of Miami’s Third District kept her seat with a Judicial Qualifications Commission case still open.", "paras": ["Voters retained Justice Carlos Muñiz with <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">57.72%<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Florida retention needs only a simple majority, which he cleared by nearly eight points.<\/span><\/button> and all 22 district court judges on the ballot, the Florida Trib reported. Among them was Bronwyn Miller of the Third District Court of Appeal in Miami, retained with more than 60%. A <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Judicial Qualifications Commission<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The commission charges and recommends. Discipline belongs to the Supreme Court, so a just-retained justice’s court holds the file.<\/span><\/button> panel accused her of attempting to influence prosecutors on a death-penalty resentencing in a case she prosecuted in 2000. That matter remains open."], "why": "The Trib notes that no Florida judge has ever lost a retention vote. The live check on Miller is the open file, not the ballot.", "c": {"L": 0, "LL": 0, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "Florida Trib", "u": "https://floridatrib.org/2026/11/04/supreme-court-justice-carlos-muniz-22-district-court-judges-all-remain-on-the-bench-after-successful-merit-retention-votes/", "t": null}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-04/s10.webp?h=24f64226", "col": "#213955", "cap": "", "credit": "Tamanoeconomico, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "fig": {"v": "57.72%", "l": "retention vote for Justice Muñiz"}}, {"id": "s11", "sec": "The World", "sid": "s-world", "h": "Israel certifies its election as Herzog opens coalition talks", "s": "The Central Elections Committee approved the results with 15 in favor, 14 abstaining and two against, Ynet reported. Likud lawmaker Amit Halevi resigned his seat, saying the committee had no authority to approve them.", "paras": ["Israel’s Central Elections Committee approved the results Wednesday with 15 in favor, 14 abstaining and two against, Ynet reported. Likud lawmaker Amit Halevi resigned his seat, saying the committee “has <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">no authority<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The attorney general asked the Shin Bet to report on its fraud probe into Arab parties, noting no proof so far.<\/span><\/button> to discuss or approve the results.” Chairman Noam Sohlberg said, “None of this casts doubt on the election as a whole.” Seats stand at Netanyahu’s bloc 53, Gadi Eisenkot’s 48 and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Arab parties 19<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Reports of Arab parties backing Eisenkot have not settled the arithmetic. Their recommendations go to Herzog, who then names who tries first.<\/span><\/button>, with 61 needed."], "why": "No bloc reaches a majority without crossing a line it has sworn off, and Herzog’s office is already talking about exhausting every option to avoid another vote.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Ynet", "u": "https://www.ynetnews.com/article/syxx2dutfg", "t": null}, {"n": "Asharq Al-Awsat", "u": "https://english.aawsat.com/world/5337370-israel-president-opens-talks-rivals-struggle-form-government", "t": "C"}, {"n": "France 24", "u": "https://www.france24.com/en/live-news/20261104-israel-president-opens-talks-as-rivals-struggle-to-form-government", "t": "C"}, {"n": "Jerusalem Post", "u": "https://www.jpost.com/israel-election-2026/article-913448", "t": "C"}, {"n": "JNS", "u": "https://www.jns.org/news/israel-news/herzog-urges-factions-to-seek-solutions-to-avert-another-election", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-04/s11.webp?h=349a8907", "col": "#532b20", "cap": "Beit HaNassi, the president’s residence in Jerusalem.", "credit": "Haim Zach, CC BY-SA 3.0 / Wikimedia Commons", "pull": null, "chart": {"t": "Knesset seats, 61 needed", "type": "bar", "rows": [["Netanyahu’s bloc", 53, "53"], ["Eisenkot’s bloc", 48, "48"], ["Arab parties", 19, "19"]]}}, {"id": "s12", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "Walter explores selling Cadillac’s F1 team at up to $3 billion", "s": "Mark Walter is exploring a sale at up to $3 billion, with at least seven parties interested, Sportico reported; accounts differ on whether a stake or the team is for sale. TWG said in August it was not considering an exit, Athlon reported.", "paras": ["Mark Walter is exploring a sale of the Cadillac Formula One team worth up to $3 billion, with at least seven parties interested, Sportico reported, according to BlackBook Motorsport. BlackBook said The Wall Street Journal named John Henry’s Fenway Sports Group as a suitor. TWG said in August it was not considering an exit, Athlon reported. Cadillac and General Motors declined to comment.", "The team debuted this year and has no points with four races left. Setup costs are believed to exceed $1 billion, before an <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">anti-dilution fee<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>It compensates existing teams for sharing prize money with an eleventh entrant, so it is the price of the slot itself.<\/span><\/button> of about $450 million. Accounts differ on scope: Sportico’s headline says stake, BlackBook says the team. TWG Motorsports holds the majority and GM an undisclosed share. Walter has already <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">left the Lakers<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Athlon reported an Iger and Kushner group deal in August at $12.5 billion, against a reported $10 billion in 2025.<\/span><\/button> and Chelsea, and told the California Post he will keep the Dodgers “no matter what.”"], "why": "At $3 billion for a first-year team with no points, buyers are pricing the entry itselfConceptMercedes’s comp: about 5% went to George Kurtz at an estimated $6 billion valuation.. Change-of-control terms at F1 and the FIA, which no report has disclosed, will decide the deal.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Sportico", "u": "https://sportico.com/business/team-sales/2026/mark-walter-f1-cadillac-stake-sale-1234957228", "t": null}, {"n": "BlackBook Motorsport", "u": "https://www.blackbookmotorsport.com/news/cadillac-f1-team-general-motors-twg-global-mark-walter-lakers-chelsea/", "t": "C"}, {"n": "Athlon via Yahoo", "u": "https://sports.yahoo.com/articles/dodgers-owner-mark-walter-reportedly-124853701.html", "t": "C"}, {"n": "Yahoo Sports", "u": "https://sports.yahoo.com/mlb/article/dodgers-owner-mark-walter-reportedly-looking-to-sell-f1-team-stake-months-after-selling-lakers-and-chelsea-200154445.html", "t": "C"}, {"n": "Crash.net", "u": "https://www.crash.net/f1/news/1109288/1/cadillac-f1-team-owner-evaluating-3-billion-sale-after-sudden-u-turn", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-04/s12.webp?h=c7540dbe", "col": "#443332", "cap": "", "credit": "Liauzh, CC BY 4.0 / Wikimedia Commons", "pull": null}, {"id": "s13", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "The CW is “talking to everybody” as TNT’s sports rights come into play", "s": "The CW is eyeing TNT Sports rights and is in the final stages of several negotiations, its sports chief told Front Office Sports. FOS put Skydance’s debt at nearly $80 billion. No shed is confirmed.", "paras": ["The CW is eyeing rights held by TNT Sports, <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Michael Perman<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>His model is sublicensing: the CW’s May deal with ESPN takes ACC games on linear through 2030-31.<\/span><\/button>, its senior vice president of sports, told Front Office Sports, and is in the “final stages” of several negotiations. “We’re talking to everybody,” he said. FOS put Skydance’s debt at nearly $80 billion and listed the NHL at $225 million a year through 2027-28 and MLB at $535 million a year through 2028. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">No shed<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>TNT Sports now sits under David Berson and CBS Sports, so any sale would be a decision for one newly merged group.<\/span><\/button> is confirmed."], "why": "Any shed turns on assignment and consent clauses after the Warner change of control, which FOS does not address. It is a contract-drafting story first.", "c": {"L": 0, "LL": 0, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "Front Office Sports", "u": "https://frontofficesports.com/article/the-cw-eyes-tnt-sports-rights-more-cfp-games/", "t": null}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "chart": {"t": "TNT’s rights, per year", "type": "bar", "rows": [["MLB, to 2028", 535, "$535 million"], ["NHL, to 2027-28", 225, "$225 million"]]}}, {"id": "s14", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "BTS drives HYBE to a record $1.08 billion quarter", "s": "HYBE’s third-quarter revenue rose 109.8% from a year earlier on record concert sales, Music Business Worldwide reported. The controlling interest still took a KRW 6.8 billion loss, and the CFO tied most non-operating expenses to currency valuation losses.", "paras": ["HYBE posted third-quarter revenue of KRW 1.53 trillion, about $1.08 billion, up 109.8% from a year earlier, Music Business Worldwide reported. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Concerts<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>On this paper’s arithmetic they were about 47% of revenue, while recorded music fell 13.4% from the prior quarter.<\/span><\/button> brought a record KRW 726.8 billion ($512 million). Net profit still fell 89.7% from the second quarter to KRW 11.3 billion, and the controlling interest took a KRW 6.8 billion loss. The CFO tied most of KRW 142.8 billion in non-operating expenses to <button aria-haspopup=\"dialog\" class=\"gloss\" data-gloss-ok=\"mechanism\" type=\"button\">currency valuation losses<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>HYBE holds large foreign-currency cash and deposits, so a stronger won hits it as a paper loss rather than an operating one.<\/span><\/button>."], "why": "A touring peak flatters the multiple, and currency on cash can erase it below the line. Any K-pop comp needs both adjustments.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Music Business Worldwide", "u": "https://www.musicbusinessworldwide.com/bts-world-tour-powers-hybe-to-record-quarterly-revenues-of-1-08b-in-q3-up-109-8-yoy-as-concerts-generate-512m/", "t": null}, {"n": "MBW on Southeast Asia", "u": "https://www.musicbusinessworldwide.com/hybe-says-it-is-incubating-markets-in-southeast-asia-as-local-acts-rise-in-the-region/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-04/s14.webp?h=cbbf911c", "col": "#2e3945", "cap": "", "credit": "Ox1997cow, CC BY-SA 3.0 / Wikimedia Commons", "pull": null, "fig": {"v": "$512 million", "l": "record concert revenue in the quarter"}}], "week": [], "cover": "img/2026-11-04/s1.webp?h=55d253d3"}, {"date": "2026-11-03", "no": 159, "min": 9.9, "stand": "Marvell pays in stock the market just cut, the U.S. strikes Qeshm, and the justices turn away the DOJ on the eve of the vote.", "note": "Editor’s note. 14 items at 2,379 read-words, under the ten-minute cap. Disclosures: Anthropic, whose model compiles this paper, is the subject of the AI lead and is named in the Brave complaint as an API buyer; the Anthropic item rests on press accounts because the SEC filing could not be opened. Not run: Paris Jackson’s $600 million petition against the Michael Jackson estate, hearing Dec. 4, petition unseen; FanDuel’s reported move to make Christian Genetski permanent CEO, single source; Live Nation’s amended BOTS Act answer, single source and filing paywalled; Judge Walton’s reported refusal to limit DOJ poll monitors, a Bloomberg headline with no order opened; Judge Boasberg’s standing ruling in DSCC v. Trump; Israel’s coalition count, no fresh beat before Herzog’s consultations Wednesday; Sudan’s complaint against Ethiopia, one party’s figures; Nagoshi Studio’s dissolution; Monomoy’s rejected bid for LCI, which may predate the window. The largest deal in the window, Marvell, ran. No contested bid moved in the window that could be verified; Intesa and Monte dei Paschi had no new beat. Brent’s Monday move is reported between 4% and 8% across sources and no settlement page opened, so the paper says more than 7%. Oracle’s drop is given as more than 8% because sources differ between 8.6% and 8.8%. Watch: the polls tonight; refunding and Herzog Wednesday; Flutter Wednesday; the Bank of England Thursday; Disney Nov. 17. Sourcing limits: Florida’s bar figures date to Sept. 22 and run with this week’s national picture; the Reuters and Law.com bar links came through Above the Law and were not opened; the Marvell closing prices rest on TIKR and an Investing.com ticker; the Ninth Circuit stay rests on the order alone, and no wire report was found, and Judge Callahan’s vote is inferred; NPR, CNBC, NBC, Fox, The New York Times, Bloomberg, CNN on Poland, the Washington Post and Variety links were seen in search and not opened; National Review and The Guardian were not reached on any item; Matt Levine’s only item, on Binance, was paywalled; Axios Pro Rata returned no November issue; the Citi and JPMorgan refunding calls are relayed; hike odds are omitted as unofficial.", "items": [{"id": "s1", "sec": "The Front", "sid": "s-front", "h": "Marvell agrees to buy Lumentum, and the market cuts the price", "s": "Marvell agreed to pay in stock. By the close, the 4.5 shares promised per Lumentum share were worth about $771, down from $1,132. Close is due in 2028, and no collar appears in the release.", "paras": ["Marvell Technology agreed Monday to buy Lumentum Holdings in an all-stock deal with an <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">enterprise value<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Equity value is about $80 billion, The Wall Street Journal reported via TechCrunch. The balance of the headline is debt, so stockholders are not being handed $115 billion.<\/span><\/button> of $115 billion, and investors sold both stocks. Marvell closed down 12.7% at $171.41. Lumentum fell 18.6% to $684.40. TechCrunch set the price against Microsoft’s $68.7 billion purchase of Activision Blizzard.", "Lumentum holders receive <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">a fixed 4.500 Marvell shares<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Because the count is fixed, the seller carries every move in the buyer’s stock from signing to closing,
