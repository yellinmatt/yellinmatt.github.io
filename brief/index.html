ia-haspopup=\"dialog\" class=\"gloss\" type=\"button\">‘Fat City’<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Work<\/span>Huston’s 1972 boxing film paired him, as a fading fighter, with a young Jeff Bridges in Stockton.<\/span><\/button>, played Mike Hammer on CBS and won a Golden Globe for ‘Hemingway.’ His last film role was George Clooney’s father in ‘Jay Kelly.’ He entered the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">American Theater Hall of Fame<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>He was inducted in 2015; his last stage role was ‘Pamplona’ at the Goodman in 2017.<\/span><\/button> in 2015."], "why": "A classical stage actor who became a television detective, he is a reminder of a generation that never chose between the two.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Variety via Yahoo", "u": "https://www.yahoo.com/entertainment/celebrity/deaths-obituaries/articles/stacy-keach-star-mike-hammer-010815538.html", "t": null}, {"n": "IndieWire", "u": "https://www.yahoo.com/entertainment/celebrity/deaths-obituaries/articles/stacy-keach-fat-city-mike-012051019.html", "t": "C"}, {"n": "UPI", "u": "https://www.yahoo.com/entertainment/celebrity/deaths-obituaries/articles/american-film-tv-stage-actor-062152611.html", "t": "C"}, {"n": "Euronews", "u": "https://www.euronews.com/2026/11/11/stacy-keach-star-of-mike-hammer-and-prison-break-dies-aged-85", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}], "week": [], "cover": "img/2026-11-11/s1.webp?h=83727c85"}, {"date": "2026-11-10", "no": 166, "min": 9.1, "stand": "Anthropic’s IPO terms go out and come back, a Republican forces a vote on Hegseth, Waller talks half a point before CPI, and the justices let the wall go up in Big Bend.", "note": "Editor’s note. 13 items at 2,192 read-words, under the ten-minute cap. Disclosure: Anthropic, whose model compiles this paper, is the subject of two items, the recalled IPO terms and the Fable and Mythos release; both rest on reporting and the company’s own page, and Anthropic declined to comment on the IPO. Underwriters, a ticker and the ‘largest IPO’ framing were not confirmed beyond the arithmetic against Saudi Aramco. Google has not confirmed AMD’s role in its TPU system, and its April post named its own Axion processor. GFL’s $22 billion is the reported bid value; whether it includes debt was not confirmed. Rates: the 3-year results come from market reports, since TreasuryDirect was not reachable; Monday’s 2-year closed at 4.56 percent and the 10-year at 4.88 percent. Magnitude check: the largest transaction in the window was the Anthropic offering, up to $69.3 billion, run; the largest M&amp;A, GFL at about $22 billion, ran; the largest live contest, the $28 bid for Surgery Partners, ran. Unity’s talks with Silver Lake and PIF had no move found. Not run: Brad Jacobs’s $1 billion CKX Lands investment (cut for the cap); Strathcona’s up to C$2.9 billion deal for Greenfire (single paywalled source); Fox’s planned bond sale (not priced); Meta’s Muse Ember model (single source); Trump’s remarks on AI guardrails (Reuters not reached); Trump’s meeting with Qatar’s prime minister (cut for the cap); Saudi strikes in Yemen (single think-tank source); the Supreme Court’s Monday orders, including Larry Klayman’s disbarment from its bar; the Southern District of Florida’s new acting U.S. attorney, Yara Lorenzo Klukas, named only in a Monday release; the death of the actress and model Toukie Smith. Sourcing limits: The New York Times, the BBC, the Guardian, Reuters and AP directly, Fox News and National Review were not reached; Reuters copy came through syndication. Money Stuff and Pro Rata had nothing in the window, the Harvard forum’s newest posts are dated Nov. 7, and Above the Law posted only a roundup. Watch: CPI at 8:30 a.m. and the 10-year sale at 1 p.m. today; the Sun Valley Orchards argument at 10 a.m.; a possible Hegseth vote by Wednesday; an Anthropic price range this week; bond markets close Wednesday for Veterans Day.", "items": [{"id": "s1", "sec": "The Front", "sid": "s-front", "h": "Anthropic sends bankers IPO terms, then says the pricing was inaccurate", "s": "Anthropic circulated to its bankers on Monday an updated IPO filing showing about 867 million shares at $70 to $80, Reuters reported. A second email told the bankers the pricing details were inaccurate and that an updated filing would come later. Anthropic’s model compiles this paper.", "paras": ["Anthropic circulated to its bankers on Monday a copy of an updated IPO filing showing about <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">867 million shares<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>At the $75 midpoint the raise would be about $65 billion; the $69.3 billion figure assumes every share sells at the $80 top.<\/span><\/button> at a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">price range<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>SEC rules require a bona fide range in any preliminary prospectus used to market an offering, so the range is the number that opens the roadshow.<\/span><\/button> of $70 to $80, a raise of as much as $69.3 billion, Reuters reported, citing emails it had seen. A second email followed, telling the bankers the pricing details were inaccurate and that an updated filing would come later. An Anthropic spokesperson declined to comment to Bloomberg Law.", "The retracted document was an updated prospectus sent by the company’s outside counsel in Canada, The Information reported. At the top of the range the raise would be more than twice the $29.4 billion <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Saudi Aramco<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Its 2019 total counts the overallotment option exercised after listing; the base deal alone raised $25.6 billion.<\/span><\/button> took in 2019, the largest IPO on record. The Wall Street Journal, as relayed by TechCrunch, reported that Anthropic plans to set a valuation range this week and to begin trading Thursday or Friday of next week. Reuters did not report which figures were wrong.", "Some institutional investors want a valuation below $1.5 trillion, TechCrunch reported. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Futurum<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>A technology research firm; its estimate is an analyst’s arithmetic on the circulated terms, not a figure from the company.<\/span><\/button> puts the implied value of the recalled terms near $1.4 trillion, against about $1.5 trillion expected a week ago, and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Nasdaq Private Market<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>It marks private companies from secondary trades and tender offers, so its figure reflects what existing holders sold at rather than a negotiated round.<\/span><\/button> carries the private valuation at $1.46 trillion. The emails went out on a day the S&amp;P 500 rose more than 2 percent, and the same day Anthropic released two new models, below. Underwriters and a ticker have not been confirmed. Anthropic’s model compiles this paper."], "why": "The largest IPO ever attempted has recalled its first pricing document before filing a range, so the next amended S-1 must carry both the number and the explanation.", "c": {"L": 0, "LL": 0, "C": 5, "LR": 0, "R": 0}, "src": [{"n": "Reuters via Investing.com", "u": "https://sg.finance.yahoo.com/news/anthropic-retracts-ipo-details-sending-030830834.html", "t": "C"}, {"n": "Bloomberg Law", "u": "https://news.bloomberglaw.com/ip-law/anthropic-seeks-to-raise-69-3-billion-via-its-ipo-reuters-says", "t": "C"}, {"n": "TechCrunch", "u": "https://techcrunch.com/2026/11/09/anthropic-reportedly-plans-to-move-forward-with-ipo-plans/", "t": "C"}, {"n": "Stocktwits via Yahoo Finance", "u": "https://finance.yahoo.com/markets/stocks/articles/anthropic-retracts-reported-70-80-043206772.html", "t": "C"}, {"n": "InvestingLive", "u": "https://investinglive.com/stocks/anthropic-retracts-ipo-pricing-details-sent-to-bankers-says-figures-were-inaccurate/", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-10/s1.webp?h=83727c85", "col": "#592805", "cap": "The Nasdaq MarketSite in Times Square.", "credit": "ajay_suresh, CC BY 2.0 / Wikimedia Commons", "pull": {"text": "Anthropic subsequently sent another email to bankers saying the pricing details were inaccurate.", "attr": "Investing.com, reporting Reuters, Nov. 9"}, "fig": {"v": "$1.46 trillion", "l": "Nasdaq Private Market’s private valuation"}}, {"id": "s2", "sec": "The Front", "sid": "s-front", "h": "Massie forces an impeachment vote on Hegseth that could come by Wednesday", "s": "Rep. Thomas Massie introduced eight articles of impeachment against Defense Secretary Pete Hegseth on Monday, which obliges Speaker Mike Johnson to schedule a vote within two legislative days. Three articles concern the Iran war. Conviction needs two-thirds of the Senate.", "paras": ["Rep. Thomas Massie, a Kentucky Republican, introduced eight articles of impeachment against Defense Secretary Pete Hegseth on Monday as a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">question of privilege<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Any member can offer one, which is how a single backbencher overrides the Speaker’s control of the floor calendar.<\/span><\/button>, which obliges Speaker Mike Johnson to schedule a vote within two legislative days, Roll Call reported. Three articles concern the Iran war and the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">War Powers Resolution<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The articles say Congress ‘did not, and still has not, enacted any declaration or specific statutory authorization’ for the war.<\/span><\/button>. Others cite ‘extrajudicial killings of at least 243 suspected drug traffickers,’ retaliation against Sen. Mark Kelly, the seizure of Nicolás Maduro and strikes in Yemen.", "Leadership can move to table or refer the resolution. In a House split 218 to 214, Massie says three Republicans joining every Democrat would pass it, and Minority Leader Hakeem Jeffries is a ‘hard yes.’ Trump said he would ‘stand by’ Hegseth, saying ‘He won two wars.’ Hegseth called the effort a ‘political sham.’ Conviction needs two-thirds of the Senate. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Massie<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>His first attempt, on Sept. 15, lapsed when Johnson cancelled the last scheduled legislative day before the midterms. He lost his May primary to a Trump-backed challenger.<\/span><\/button> read the articles aloud for about an hour and 20 minutes."], "why": "A lame-duck vote on impeaching a sitting defense secretary over an undeclared war tests whether this House will reclaim war powers before the Democratic majority arrives in January.", "c": {"L": 0, "LL": 2, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Roll Call", "u": "https://rollcall.com/2026/11/09/massie-moves-to-force-hegseth-impeachment-vote/", "t": null}, {"n": "ABC News", "u": "https://abcnews.com/Politics/defense-secretary-pete-hegseth-face-impeachment-vote/story?id=137926360", "t": "LL"}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/11/09/pete-hegseth-impeachment-articles-massie.html", "t": "C"}, {"n": "MS NOW", "u": "https://www.ms.now/news/rep-thomas-massie-moves-to-force-vote-on-hegseth-impeachment", "t": "LL"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-10/s2.webp?h=6c6d2e16", "col": "#2c394b", "cap": "", "credit": "Architect of the Capitol, Public domain / Wikimedia Commons", "pull": null, "fig": {"v": "218 to 214", "l": "the current House split"}}, {"id": "s3", "sec": "AI", "sid": "s-ai", "h": "Anthropic releases Fable 5.2 and Mythos 5.2, cutting Fable’s price", "s": "Anthropic released Fable 5.2, open to all users, and Mythos 5.2, for vetted organizations, on Monday. Fable now costs $8 per million input tokens and $40 per million output, down from $10 and $50. Anthropic’s model compiles this paper.", "paras": ["Anthropic released Fable 5.2 and Mythos 5.2 on Monday, one model in two versions: Fable, with tighter cyber and biology safeguards, for all users, and Mythos for organizations vetted through its <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">verification programs<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>They are named Life Sciences and Cyber, the two domains where the public model’s safeguards are tightest.<\/span><\/button>. Fable now costs $8 per million input tokens and $40 per million output, down from $10 and $50. On the company’s FrontierCode 2.0 benchmark Fable 5.2 scored 49.1 percent, against 32.4 percent for Fable 5.1 and 42.8 percent for OpenAI’s GPT-6 Astra. Mythos 5.2 found 89.6 percent of the flaws in a test of 1,829 known <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">CVEs<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Entries in the public vulnerability catalog run by MITRE since 1999, so the test measures rediscovery of flaws already known to exist.<\/span><\/button>.", "Anthropic said about 1,000 Fable 5.2 agents formalized Fermat’s Last Theorem in 30 hours, against 11 days for its first attempt, and that attempted sandbox escapes fell to 3.1 percent from 39 percent for Mythos 5. TechCrunch framed the launch around <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">recursive self-improvement<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A METR assessment last week put Anthropic’s internal models at roughly 1.9 times the pace of its unassisted AI research.<\/span><\/button>. ‘Anthropic has cut the price of a token, not the price of a thought,’ Sanchit Vir Gogia of Greyhound Research told InfoWorld. Anthropic’s model compiles this paper."], "why": "A frontier model priced a fifth lower narrows the gap between the cost of a machine draft and an associate’s hour, the unit economics behind every firm’s AI budget.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Anthropic", "u": "https://www.anthropic.com/claude-fable-and-mythos-5-2", "t": null}, {"n": "TechCrunch", "u": "https://techcrunch.com/2026/11/09/anthropic-releases-new-mythos-and-fable-models-amid-rsi-concerns/", "t": "C"}, {"n": "InfoWorld", "u": "https://www.infoworld.com/article/4246681/anthropic-unveils-claude-fable-5-2-mythos-5-2-with-coding-gains-and-lower-prices.html", "t": "C"}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/11/09/anthropic-claude-fable-5-2-mythos-5-2.html", "t": "C"}, {"n": "MacRumors", "u": "https://www.macrumors.com/2026/11/09/anthropic-launches-claude-fable-5-2/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "chart": {"type": "bar", "t": "FrontierCode 2.0 scores, per Anthropic", "rows": [["Fable 5.2", 49.1, "49.1 percent"], ["GPT-6 Astra", 42.8, "42.8 percent"], ["Fable 5.1", 32.4, "32.4 percent"]]}}, {"id": "s4", "sec": "AI", "sid": "s-ai", "h": "AMD jumps 13 percent after saying it hosts Google’s newest TPU system", "s": "Google added two TPU variants on Monday, The Decoder reported. AMD said its fifth-generation EPYC processors host the newest system. AMD closed at $508.58, up 13.26 percent, and Nvidia fell 4.27 percent to $178.67.", "paras": ["Google added two TPU variants on Monday, the confidential-computing 8tx and the 8i Max, which pairs two 8i chips on one package, The Decoder reported, and said it now has nearly 100 outside TPU customers. AMD said its fifth-generation <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">EPYC<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Product<\/span>Google’s April TPU 8t and 8i announcement named its own Arm-based Axion as the host processor, and Google has not itself confirmed the AMD role.<\/span><\/button> processors host the newest system, ‘the first cloud TPU system with hardware-enforced <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">confidential computing<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Data and model weights stay encrypted even while in use, so a customer need not trust the cloud host with its weights.<\/span><\/button>.’ AMD closed at $508.58, up 13.26 percent, after an Oppenheimer upgrade, and Nvidia fell 4.27 percent to $178.67."], "why": "Google selling its own chips to outside customers, on a rival’s processor, is the clearest sign yet that Nvidia’s hold on AI compute is loosening at the margin.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "The Decoder", "u": "https://the-decoder.com/google-ships-four-tpu-variants-in-one-year-as-it-ramps-up-competition-with-nvidia/", "t": null}, {"n": "Motley Fool via Yahoo Finance", "u": "https://finance.yahoo.com/markets/stocks/articles/stock-market-today-nov-9-223002825.html", "t": "C"}, {"n": "247wallst.com", "u": "https://247wallst.com/investing/2026/11/09/nvidia-falls-5-as-board-probes-jensen-huangs-ties-to-alleged-chinese-spy-amd-rises-4-intel-holds-steady/", "t": "C"}, {"n": "StockTitan", "u": "https://www.stocktitan.net/articles/stock-market-today-live-november-9-2026", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-10/s4.webp?h=882bcf04", "col": "#562a0f", "cap": "", "credit": "Zinskauf, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "fig": {"v": "nearly 100", "l": "outside TPU customers, per Google"}}, {"id": "s5", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Surgery Partners raises its buyout to $25 and calls a $28 bid not superior", "s": "Surgery Partners amended its merger agreement with HealthSpan Partners to $25 a share in cash plus a ticking fee of up to $1.61, the company said Monday. A special committee concluded a non-binding $28 cash proposal was not a Superior Proposal.", "paras": ["Surgery Partners amended its merger agreement with HealthSpan Partners, an affiliate of Bon Secours Mercy Health, to $25 a share in cash plus a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">ticking fee<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The add-on accrues the longer closing slips, which moves regulatory and financing delay risk onto the buyer.<\/span><\/button> of up to $1.61, for a maximum of $26.61, the company said in a filing Monday. The deal values the company at up to about $6 billion including debt. Bain Capital, which owns about 39 percent, rolls its equity and takes no cash.", "The amendment follows a non-binding $28 cash proposal from an unnamed third party, first made Nov. 3. A special committee concluded it was not a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Superior Proposal<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The defined term that unlocks a board’s fiduciary out; a bid that falls short cannot be used to terminate the signed deal.<\/span><\/button>. Ropes &amp; Gray and McDermott Will &amp; Schulte advise the company, Goodwin the committee, Kirkland &amp; Ellis represents Bain and Paul, Weiss represents HealthSpan, with Jefferies as sole committed financing underwriter. Bain’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">rollover<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>When a controller stands on both sides of a deal, Delaware’s MFW framework grants business-judgment deference only with both an independent committee and a majority-of-the-minority vote.<\/span><\/button> keeps it on both sides of the deal."], "why": "A board turning down $3 more in cash while a 39 percent holder rolls over is the fact pattern Delaware courts read hardest, and the $28 bidder now holds the lever.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "Surgery Partners 8-K, Exhibit 99.1", "u": "https://www.sec.gov/Archives/edgar/data/0001638833/000110465926124236/tm2629312d1_ex99-1.htm", "t": null}, {"n": "Business Wire via Morningstar", "u": "https://www.morningstar.com/news/business-wire/20261109695957/surgery-partners-and-healthspan-partners-announce-amended-merger-agreement-following-receipt-of-unsolicited-proposal", "t": "C"}, {"n": "StockTitan", "u": "https://www.stocktitan.net/news/SGRY/surgery-partners-inc-announces-third-quarter-2026-vtz8udm6tx44.html", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "chart": {"type": "bar", "t": "Per-share values", "rows": [["Signed price", 25, "$25"], ["Maximum with fee", 26.61, "$26.61"], ["Rival proposal", 28, "$28"]]}}, {"id": "s6", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Waller backs a December hike and says half a point should be considered", "s": "Fed Governor Christopher Waller said he is leaning toward a 25 basis point increase in December, and that a 50 basis point hike should be considered if October’s monthly CPI comes in at 0.3 percent or higher, American Banker reported.", "paras": ["Fed Governor Christopher Waller said Tuesday he is ‘leaning toward supporting an increase in our policy rate of 25 basis points’ in December, and that ‘a 50 basis point hike’ should be considered if October’s monthly CPI comes in at <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">0.3 percent or higher<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>That is the consensus forecast for the headline index, so a print merely in line with expectations would meet his test.<\/span><\/button>, American Banker reported. ‘Hiking only 25 basis points would put our credibility at risk,’ he said. Monday’s $58 billion <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">3-year sale<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Indirect bidders, the usual proxy for foreign demand, took 55.5 percent, their smallest share in 15 months, while directs took a record 35 percent.<\/span><\/button> tailed half a basis point at 4.627 percent with a 2.53 bid-to-cover. CPI is due at 8:30 a.m."], "why": "If an in-line print triggers a half-point hike, every deal priced off Treasuries this month resets, the Anthropic offering included.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "American Banker", "u": "https://www.americanbanker.com/news/waller-calls-for-raising-interest-rates-25-basis-points-at-least", "t": null}, {"n": "InvestingLive", "u": "https://investinglive.com/news/u-s-treasury-sells-58-billion-of-3-year-notes-at-a-high-yield-of-4-627/", "t": "C"}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/11/10/fed-governor-waller-sees-december-hike-likely.html", "t": "C"}, {"n": "U.S. Treasury yield curve", "u": "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_yield_curve&field_tdr_date_value=2026", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "fig": {"v": "4.627 percent", "l": "3-year sale, tailing half a basis point"}}, {"id": "s7", "sec": "Markets & Deals", "sid": "s-mkt", "h": "GFL rejects a $52-a-share private equity bid and ends its sale review", "s": "GFL Environmental rejected a $52-a-share offer from Blackstone, KKR and Energy Capital Partners late Monday and ended a four-month review, The Globe and Mail reported. The board wanted $58 or more, two people told the paper.", "paras": ["GFL Environmental rejected a $52-a-share offer from Blackstone, KKR and Energy Capital Partners late Monday as inadequate and ended a four-month review, The Globe and Mail reported, a bid valued at about $22 billion. The board wanted $58 or more and the consortium would not go higher, two people told the paper. The offer was a 13 percent premium to Monday’s $45.88 close. Founder <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Patrick Dovigi<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>He would not back a deal the board considered unfair, the paper reported, which made his stake a block on any sale below $58.<\/span><\/button> holds 33 percent, and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">BC Partners<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The roughly 22 percent holder may now sell much of its stake, which turns a failed take-private into an overhang on the shares.<\/span><\/button> may sell down."], "why": "The year’s largest waste take-private failing over a $6 gap shows sponsors holding price discipline even with financing markets open.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "The Globe and Mail", "u": "https://www.theglobeandmail.com/business/article-gfl-environmental-turns-down-buyout-offer-wall-street-private-equity/", "t": null}, {"n": "Seeking Alpha News", "u": "https://seekingalpha.com/news/4669433-gfl-environmental-rejects-52share-offer-from-pe-consortium-ends-review-globe-mail", "t": "C"}, {"n": "Investing.com", "u": "https://ca.investing.com/news/stock-market-news/gfl-environmental-rejects-22-billion-buyout-offer-from-pe-funds-globe-93CH-4944979", "t": "C"}, {"n": "Waste Dive", "u": "https://www.wastedive.com/news/gfl-sets-nov-9-deadline-for-take-private-offers-touts-strong-q3/873194/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "chart": {"type": "bar", "t": "GFL per-share values", "rows": [["Monday close", 45.88, "$45.88"], ["Offer", 52, "$52"], ["Board’s ask", 58, "$58 or more"]]}}, {"id": "s8", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Related, BH and Pebb land $176.5 million for Boca Raton rentals", "s": "Related Group, BH Group and Pebb Capital closed a $176.5 million Wells Fargo financing for Broken Sound Residences, 494 rentals on the former Office Depot headquarters site, The Real Deal reported. Construction began last month, with completion due in 2028.", "paras": ["<button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Related Group<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The Miami developer Jorge Pérez founded in 1979, best known for condo towers rather than suburban rentals.<\/span><\/button>, BH Group and Pebb Capital closed a $176.5 million Wells Fargo financing for Broken Sound Residences, 494 rentals on the former <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Office Depot headquarters<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>The site sold for $104 million in 2023 and $50 million in 2025, The Real Deal reported, a halving in two years.<\/span><\/button> site at 6600 North Military Trail in Boca Raton, The Real Deal reported Monday. The package is a $140.7 million new loan plus $35.8 million assumed. Fifty units are workforce housing. Construction began last month, with completion due in 2028."], "why": "A money-center bank writing a construction loan for rentals on a dead corporate campus is South Florida’s office-to-housing trade, financed.", "c": {"L": 0, "LL": 0, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "The Real Deal", "u": "https://therealdeal.com/miami/2026/11/09/related-group-and-partners-score-177-million-for-boca-redev/", "t": null}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "chart": {"type": "bar", "t": "The $176.5 million package", "rows": [["New loan", 140.7, "$140.7 million"], ["Assumed debt", 35.8, "$35.8 million"]]}}, {"id": "s9", "sec": "Law & the Courts", "sid": "s-law", "h": "The justices let border wall work resume in Big Bend", "s": "The Supreme Court on Monday stayed a district court order that had halted border wall construction in the Big Bend region of Texas, in a four-page unsigned opinion. Justice Ketanji Brown Jackson would have denied the stay.", "paras": ["The Supreme Court on Monday stayed a district court order that had halted border wall construction in the Big Bend region of Texas, in a four-page unsigned opinion in Mullin v. Friends of the Ruidosa Church, No. 26A560, SCOTUSblog reported. The government is ‘exceedingly likely to prevail’ on its argument that Judge Kathleen Cardone lacked power to hear the challengers’ <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">major-questions<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The doctrine is a canon of statutory interpretation; dressing it as constitutional was the route around a waiver statute that lets courts hear constitutional claims only.<\/span><\/button> claim, the Court said, because “there is no such thing as a ‘constitutional’ major-questions claim.” Justice Ketanji Brown Jackson would have denied the stay. The Court declined the government’s request for <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">summary reversal<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>That would have vacated Cardone’s order on the merits without full briefing; a stay leaves the case alive below.<\/span><\/button>.", "The challengers contested <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">waivers<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Section 102 of the 1996 immigration law lets the homeland security secretary waive any law, environmental statutes included, to build barriers in areas of high illegal entry.<\/span><\/button> issued by Secretaries Kristi Noem and Markwayne Mullin. Cardone had found that Big Bend covers more than 25 percent of the border but accounts for 0.3 to 2.2 percent of apprehensions. The government said delays cost ‘nearly half a million dollars’ a day."], "why": "Shutting the constitutional label as a workaround leaves the waiver statute close to unreviewable, and the major-questions line will be cited well beyond immigration.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "SCOTUSblog", "u": "https://www.scotusblog.com/2026/11/supreme-court-allows-trump-administration-to-continue-border-wall-construction/", "t": null}, {"n": "AP via WPXI (background, Oct. 21)", "u": "https://www.wpxi.com/news/politics/trump-administration/M6IJWWB2SQ7OVGN5ADZLYX4CZU/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "fig": {"v": "0.3–2.2 percent", "l": "Big Bend’s share of border apprehensions"}}, {"id": "s10", "sec": "Law & the Courts", "sid": "s-law", "h": "The paramedic’s lawyer asks the justices to “end the Bivens experiment”", "s": "Arguing Monday in Nielsen v. Watanabe, Lucas Walker was asked for a case that could still be brought under Bivens and answered, “close to nothing.” Justice Brett Kavanaugh floated applying both precedents without extending them.", "paras": ["Arguing Monday in Nielsen v. Watanabe, No. 25-417, Lucas Walker asked the Court to ‘end the Bivens experiment and hand accountability for providing damages remedies back to Congress.’ Asked by Justice Clarence Thomas for a case that could still be brought under Bivens, Walker answered, ‘close to nothing.’ Justice Sonia Sotomayor said of the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Westfall Act<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Statute<\/span>Walker called the 1988 law’s treatment of Bivens ‘studied neutrality,’ the opposite reading.<\/span><\/button>, ‘So Congress itself ratified it.’ Justice Brett Kavanaugh noted that Congress has had ‘55 years since Bivens and 46 years since <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Carlson<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Case<\/span>The 1980 decision extended Bivens to Eighth Amendment prison medical claims, the exact claim Watanabe brings.<\/span><\/button>,’ then floated applying both precedents without extending them."], "why": "Kavanaugh’s narrower path may be where a majority lands, freezing Bivens at its three recognized contexts rather than overruling it.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Supreme Court transcript", "u": "https://www.supremecourt.gov/oral_arguments/argument_transcripts/2026/25-417_8n5a.pdf", "t": null}, {"n": "Cato Institute", "u": "https://cato.org/news-releases/scotus-hears-case-could-shield-all-federal-employees-damages", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-10/s10.webp?h=d6ca00bb", "col": "#18395e", "cap": "", "credit": "Joe Ravi, CC BY-SA 3.0 / Wikimedia Commons", "pull": null, "fig": {"v": "55 years", "l": "since Bivens, as Justice Kavanaugh noted"}}, {"id": "s11", "sec": "The World", "sid": "s-world", "h": "U.S.-brokered Ukraine and Russia talks open in Abu Dhabi", "s": "A two-day round of talks among the United States, Ukraine and Russia opened in Abu Dhabi on Tuesday, focused on security guarantees, CBS News and the Associated Press reported. Putin demands that Ukraine withdraw from four regions, and Zelenskyy rejects ceding territory.", "paras": ["A two-day round of talks among the United States, Ukraine and Russia opened in Abu Dhabi on Tuesday, focused on security guarantees, CBS News and the Associated Press reported. Jared Kushner said on X that the round could ‘build momentum’ toward ‘lasting peace’ and floated a security arrangement involving <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">European countries<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Ukraine, Germany, France and Britain met U.S., NATO and World Bank officials in Brussels on Nov. 4 to coordinate before this round.<\/span><\/button> and Russia. Putin demands that Ukraine withdraw from <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">four regions<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>Donetsk, Luhansk, Zaporizhzhia and Kherson, which Russia claimed to annex in 2022 without fully controlling any of them.<\/span><\/button>, and Zelenskyy rejects ceding territory. Politico listed a Black Sea ceasefire, an energy ceasefire and a front-line freeze as possible items."], "why": "A front-line freeze would set the order in which sanctions come off, the sequence every European bank and energy client is waiting on.", "c": {"L": 0, "LL": 1, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "CBS News and AP", "u": "https://www.cbsnews.com/news/us-russia-ukraine-war-talks-peace-abu-dhabi-deal/", "t": "C"}, {"n": "NBC News", "u": "https://www.nbcnews.com/world/ukraine/us-mediated-talks-ending-war-russia-ukraine-begin-abu-dhabi-rcna608499", "t": "C"}, {"n": "NPR", "u": "https://www.npr.org/2026/11/08/nx-s1-6034014/europe-join-us-brokered-ukraine-talks-abu-dhabi-russia", "t": "LL"}, {"n": "France 24", "u": "https://www.france24.com/en/europe/20261110-live-ukraine-russia-and-us-to-resume-peace-talks-in-abu-dhabi", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}, {"id": "s12", "sec": "The World", "sid": "s-world", "h": "The U.S. warns the EU at the G7 against an ICC blocking statute", "s": "Secretary of State Marco Rubio met French Foreign Minister Jean-Noël Barrot in Paris over U.S. concern that the EU could invoke a blocking statute against U.S. sanctions tied to the International Criminal Court. Washington has said it would respond.", "paras": ["G7 foreign ministers opened two days of talks in Paris on Monday, moved from Marseille at the last minute, AFP reported. Secretary of State <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Marco Rubio<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>On his first trip abroad since the midterms he said there were ‘some advances made in what that architecture could look like’ for a postwar Ukraine, Sinclair reported.<\/span><\/button> met French Foreign Minister Jean-Noël Barrot over U.S. concern that the EU could invoke a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">blocking statute<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>It bars EU companies from complying with listed foreign sanctions without a waiver and makes foreign judgments enforcing them unenforceable in EU courts; Brussels has aimed it at U.S. sanctions on Cuba and Iran.<\/span><\/button> against U.S. sanctions tied to the International Criminal Court, and Washington has said it would respond. Germany’s Johann Wadephul said Europe ‘must have a place at the table.’ Canada added 38 entities and 24 individuals to its Russia sanctions list."], "why": "A blocking statute would put every multinational’s sanctions team between two legal orders, a conflict that lands in compliance programs and risk-factor disclosure alike.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 1, "R": 0}, "src": [{"n": "AFP via Korea Times", "u": "https://www.koreatimes.co.kr/world/20261109/g7-ministers-press-rubio-on-iran-ukraine-at-paris-talks", "t": null}, {"n": "Sinclair via KTUL", "u": "https://ktul.com/news/nation-world/secretary-of-state-marco-rubio-faces-g7-allies-questions-on-iran-ukraine-after-gop-republican-midterm-losses-energy-security-artificial-intelligence-si-president-trump-united-nations-accountability-france-protests", "t": "LR"}, {"n": "The Globe and Mail", "u": "https://www.theglobeandmail.com/world/article-g7-talks-paris-unresolved-global-crises-questions-over-us-approach/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "fig": {"v": "38 entities", "l": "added to Canada’s Russia sanctions list"}}, {"id": "s13", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "Skydance details $6 billion in Warner cuts and new leadership at DC", "s": "In its first report since buying Warner Bros. Discovery, Skydance detailed $6 billion of savings over three years, Reuters reported. An HBO Max and Paramount+ bundle launches early next year, and James Gunn and Peter Safran step down at DC Studios in December.", "paras": ["In its first report since buying Warner Bros. Discovery, Skydance on Monday detailed $6 billion of savings over three years, 30 percent in the first, including at least $2.2 billion from overhead and real estate and $1 billion from marketing, Reuters reported. An HBO Max and Paramount+ bundle launches early next year, and the company will stop reporting quarterly subscribers, now 203 million. It carries $87 billion of gross debt. James Gunn and Peter Safran step down at <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">DC Studios<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>They stay on as producers; Superman, their first release, passed $618 million worldwide, per Deadline as cited by BuddyTV.<\/span><\/button> on Dec. 1 for former Marvel executive <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Jeremy Latcham<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>He will run film, television and animation and report to Skydance film co-chairs Dana Goldberg and Josh Greenstein.<\/span><\/button>."], "why": "Savings this size come mostly from people and real estate, and the DC change shows the new owner taking creative control, the two levers every studio merger pulls.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Reuters via CP24", "u": "https://www.cp24.com/news/money/2026/11/09/skydance-details-cost-cuts-sets-streaming-bundle-for-early-next-year/", "t": "C"}, {"n": "Reuters via GV Wire", "u": "https://gvwire.com/2026/11/09/skydance-details-cost-cuts-sets-streaming-bundle-for-early-next-year/", "t": "C"}, {"n": "The Hollywood Reporter", "u": "https://www.hollywoodreporter.com/business/business-news/skydance-first-earnings-q3-post-wb-deal-1236751164/", "t": "C"}, {"n": "BuddyTV", "u": "https://www.buddytv.com/james-gunn-exits-dc-studios-as-jeremy-latcham-takes-over/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "fig": {"v": "$87 billion", "l": "Skydance’s gross debt"}}], "week": [], "cover": "img/2026-11-10/s2.webp?h=6c6d2e16"}, {"date": "2026-11-09", "no": 165, "min": 9.5, "stand": "Nvidia’s board investigates its founder, bankers race a Democratic Congress to sign, the justices weigh what is left of Bivens, and Miami loses on a replay call.", "note": "Editor’s note. 13 items at 2,280 read-words, under the ten-minute cap. Disclosure: Anthropic, whose model compiles this paper, is not the subject of any item today; its IPO roadshow was held because no price range, filing or launch was verified in the window, and the Financial Times’s $1.25 trillion to $1.75 trillion range was reported Saturday, before it. Megaspeed’s Nvidia purchases are given as the New York Times’s figure via CBS. Reported claims about a House briefing request and Nvidia’s financing partners were not confirmed in the pages read and are left out. Rates: the 3-year sale prices after this edition; yields are Friday closes. Magnitude check: no large deal was signed in the window. The largest transaction was the NEXTDC stake, run. Final bids for GFL Environmental, about $30 billion, are due today, but no report inside the window was found; offered on the outcome. Brad Jacobs’s $1 billion investment in CKX Lands was released at 6:01 a.m., after the window, and is offered tomorrow. The largest live contests, CD&amp;R and GTCR’s approach for Global Payments and Intesa’s bid for Monte dei Paschi, had no move. Not run: the EU and the E3 joining the Abu Dhabi Ukraine talks Tuesday (cut for the cap); the Houthi strike claim on Riyadh’s financial district; Mike Tirico’s missed broadcast; Judge Kaplan’s ICE subpoena ruling (Nov. 6); the Above the Law weekend roundup, mostly threads already run; weekend box office, unchanged from Sunday’s Special. Sourcing limits: The New York Times, the BBC, the Guardian, NPR, National Review and Reuters and AP directly were not reached; the data center item is AP via a member station; Bloomberg rests on syndicated copy; the Israel item rests on Israeli outlets only. Money Stuff and Pro Rata did not publish in the window, and the Harvard forum and Anthropic newsroom had nothing new. Watch: Supreme Court orders at 9:30 a.m. and the 3-year sale at 1 p.m. today; CPI and the Sun Valley Orchards argument Tuesday; the 10-year and 30-year sales; the Abu Dhabi talks.", "items": [{"id": "s1", "sec": "The Front", "sid": "s-front", "h": "Nvidia’s board opens an independent investigation of Jensen Huang", "s": "Nvidia’s board said Sunday it has opened an independent investigation after reports that Jensen Huang was the target of a foreign intelligence effort. Huang admitted an affair with Alice Huang, a former Megaspeed executive. The board said it had no reason to believe company secrets or national security were compromised.", "paras": ["Nvidia’s board said Sunday it has opened an independent investigation after reports that founder and chief executive Jensen Huang was the target of a foreign intelligence effort, with a committee of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">independent directors<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>TechCrunch counts every member except Huang as independent, which means the whole remaining board is investigating its own founder.<\/span><\/button> and outside counsel overseeing it. Huang, in a memo to employees, admitted an affair with Alice Huang, a former executive at <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Megaspeed<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>TechCrunch calls it a chip company and CBS a data center operator. Southeast Asia is the region U.S. officials watch most closely for diversion of export-controlled chips to China.<\/span><\/button>, a Singapore company that has become one of Nvidia’s biggest customers in Southeast Asia. “I was unfaithful to my wife,” he wrote. “My actions hurt her and our children.”", "The board said it had no reason to believe that company secrets or national security were compromised, and that it has “confidence in Jensen and his leadership team.” A memo circulated among U.S. policymakers earlier this year claimed that China’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Ministry of State Security<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>China’s civilian intelligence service, which runs both espionage abroad and counterintelligence at home and is separate from the military’s own intelligence arm.<\/span><\/button> had recruited Alice Huang to spy on the chief executive. She has not been charged, and China called the claims “groundless speculation.” Megaspeed bought more than $4.8 billion of Nvidia chips over two years, according to The New York Times. Nvidia had earlier called the pair’s interactions “not unusual.”", "Governance specialists moved straight to succession. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Jeffrey Sonnenfeld<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>He told TechCrunch that boards in crisis reach for a “messianic solution” from outside, and floated Eric Schmidt as the type.<\/span><\/button> of the Yale School of Management put Huang’s odds of keeping the job at “about a 50-50,” called the episode “remarkably poor judgment” and said “any employee in Nvidia other than him would be fired over this.” Huang said he supports the investigation “and will cooperate fully.” His daughter Madison Huang, a senior director, cancelled her trip to Nvidia’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">AI Day in Seoul<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>The event runs Nov. 9 and 10 at the COEX convention center, and Bloomberg reported Monday that the controversy had thrown it into disarray.<\/span><\/button> and her meetings with Korean officials, Korean media reported."], "why": "An investigation of a founder run by his entire outside board is the work white-collar groups are built for, and the company the whole AI trade rests on now carries key-person risk into every disclosure it makes.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "TechCrunch", "u": "https://techcrunch.com/2026/11/08/nvidia-says-its-investigating-ceo-jensen-huangs-relationship-with-possible-chinese-spy/", "t": null}, {"n": "CBS News", "u": "https://www.cbsnews.com/news/nvidia-jensen-huang-investigation-china-intelligence/", "t": "C"}, {"n": "TechCrunch (Sonnenfeld)", "u": "https://techcrunch.com/2026/11/08/is-jensen-huangs-job-on-the-line-yales-jeffrey-sonnenfeld-estimates-its-about-a-50-50/", "t": "C"}, {"n": "Korea Times", "u": "https://www.koreatimes.co.kr/business/companies/20261107/nvidia-ceos-daughter-cancels-planned-visit-to-korea-sources", "t": "C"}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/11/08/nvidia-jensen-huang-investigation-china-spy.html", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-09/s1.webp?h=f1a505c3", "col": "#303d17", "cap": "Nvidia’s headquarters in Santa Clara, California.", "credit": "Coolcaesar, CC BY-SA 4.0 / Wikimedia Commons", "pull": {"text": "“There is no excuse for what I did. I am deeply sorry.”", "attr": "Jensen Huang, statement, Nov. 8"}, "fig": {"v": "$4.8 billion", "l": "Megaspeed’s Nvidia buys in two years, per Times"}}, {"id": "s2", "sec": "The Front", "sid": "s-front", "h": "Bankers tell clients a Democratic Congress has started the megadeal clock", "s": "Wall Street dealmakers are urging clients to sign large mergers before a Democratic Congress turns to oversight, Bloomberg reported Sunday. Paramount Skydance’s purchase of Warner Bros. Discovery closed last month with no remedies, and Sen. Cory Booker has promised oversight.", "paras": ["Wall Street dealmakers are urging clients to sign large mergers before a Democratic Congress turns to oversight, Bloomberg reported Sunday, noting that more than half of the $50 billion-plus deals involving a U.S. company over the past 20 years were announced while Trump was president. Democrats will not run the Justice Department or the FTC, so the pressure would come through <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">hearings and subpoenas<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Unlike merger review, a committee inquiry runs on no statutory clock, and no clearance letter ends it.<\/span><\/button>.", "The targets are already named. Paramount Skydance’s $110 billion purchase of Warner Bros. Discovery closed last month with <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">no remedies<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Without a consent decree there are no divestiture or conduct terms for a later administration to enforce, which leaves Congress as the only lever.<\/span><\/button>, and Sen. Cory Booker has promised oversight. Sens. Markey and Blumenthal have gone after <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">NextEra’s<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Based in Juno Beach, it owns Florida Power &amp; Light, the state’s largest electric utility, so a Senate fight over the deal lands in South Florida.<\/span><\/button> $67 billion deal for Dominion. “Congress has the ability to call executives in, issue subpoenas and put a transaction under a political spotlight,” said Paul Humphreys of Freshfields. Wharton’s Paul Nary said dealmakers “are now going to need a congressional strategy as well.”"], "why": "Clearance used to end a deal’s political risk. A closed deal can now be called before a committee, which adds a congressional workstream to every large merger a deal team staffs.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "Bloomberg via Yahoo Finance", "u": "https://finance.yahoo.com/markets/stocks/articles/wall-street-races-megadeals-countdown-140000480.html", "t": "C"}, {"n": "Bloomberg", "u": "https://www.bloomberg.com/news/articles/2026-11-08/wall-street-races-for-megadeals-as-countdown-begins-on-trump-era", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-09/s2.webp?h=6c6d2e16", "col": "#2c394b", "cap": "", "credit": "Architect of the Capitol, Public domain / Wikimedia Commons", "pull": null, "chart": {"type": "bar", "t": "Deals named as oversight targets", "rows": [["Paramount-WBD", 110, "$110 billion"], ["NextEra-Dominion", 67, "$67 billion"]]}}, {"id": "s3", "sec": "AI", "sid": "s-ai", "h": "Local voters approved data center limits in 44 of 45 referendums", "s": "Data centers were a losing issue in last week’s midterms, the Associated Press reported Sunday. More than $380 million of television ads mentioned data centers, with Democrats outspending Republicans about three to one, AdImpact said.", "paras": ["Data centers were a losing issue in last week’s midterms, the Associated Press reported Sunday. Voters approved restrictions in 44 of 45 completed <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">local referendums<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Siting power sits with counties and towns, so a friendly governor or statehouse cannot override a local vote against a project.<\/span><\/button>, according to Redbud Consulting, and 32 of 34 winning governor candidates back tighter rules, 12 of them bans or moratoriums, per Data Center Watch. More than $380 million of television ads mentioned data centers, with Democrats outspending Republicans about three to one, AdImpact said. Morgan Stanley called Texas’s governor race the “most important election result” for development, though <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">AP VoteCast<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>About three in four voters opposed a data center in their own community, yet only about one in four called the issue crucial to their vote.<\/span><\/button> found few voters decided on it."], "why": "The binding constraint on the AI buildout is now the county zoning board, which turns every project finance model into a local permitting bet.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "AP via Ideastream", "u": "https://www.ideastream.org/government-politics/2026-11-08/ai-data-centers-took-a-beating-in-the-midterm-elections-a-reckoning-may-be-ahead-for-tech-giants", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "fig": {"v": "32 of 34", "l": "winning governor candidates for tighter rules"}}, {"id": "s4", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Digital Realty and Goodman buy 9.9 percent of NEXTDC overnight", "s": "Digital Realty and Goodman Group bought the stake through a 50-50 vehicle at an average A$9.22 a share, Grafa reported Monday. The pair said they have no present intention of making a control proposal but reserve the right to.", "paras": ["Digital Realty and Goodman Group bought 9.9 percent of NEXTDC, the Australian data center operator, through a 50-50 vehicle at an average A$9.22 a share, Grafa reported Monday, a stake worth about A$730 million. The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">overnight bookbuild<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Assembling the stake after the close lets a buyer present it as done before the target’s board can respond at the open.<\/span><\/button> had offered up to A$9.50. The pair said they have <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">no present intention<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Australia’s truth-in-takeovers policy can hold a buyer to a stated intention, which is why the pair also reserved the right to change course.<\/span><\/button> of making a control proposal but reserve the right to, and want to consult NEXTDC’s board on its “operational and capital challenges.”", "NEXTDC shares jumped more than 40 percent in Sydney, according to local market reports, after a delay in power supply for its M3 site had weighed on the stock. IPE Real Assets reported that NEXTDC labeled the raid opportunistic. The stake stops well short of the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">20 percent threshold<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Section 606 of the Corporations Act bars going past it except by a formal bid, a scheme or narrow exceptions, so 9.9 percent is a toehold rather than a trigger.<\/span><\/button>."], "why": "A cash-rich buyer taking a toehold in a power-starved operator is how the AI selloff turns into consolidation: capital is flowing to whoever already holds the megawatts.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Grafa", "u": "https://grafa.com/en/news/australia/digital-realty-and-goodman-buy-9-9-nextdc-stake", "t": null}, {"n": "DCD", "u": "https://www.datacenterdynamics.com/en/news/digital-realty-and-goodman-group-line-up-au715m-bid-for-stake-in-australias-nextdc/", "t": "C"}, {"n": "Market Index", "u": "https://www.marketindex.com.au/news/nextdc-shares-surge-42-as-goodman-and-digital-realty-raid-the-register", "t": "C"}, {"n": "Business News Australia", "u": "https://www.businessnewsaustralia.com/articles/nextdc-shares-surge-50pc-after-goodman-and-digital-realty-launch-raid-on-embattled-group.html", "t": "C"}, {"n": "IPE Real Assets", "u": "https://realassets.ipe.com/news/nextdc-labels-goodman-and-digital-realty-share-raid-opportunistic/10139234.article", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-09/s4.webp?h=33340338", "col": "#383b1a", "cap": "NEXTDC’s P2 data center in Perth.", "credit": "Samuel Wiki, CC0 / Wikimedia Commons", "pull": null, "fig": {"v": "A$730 million", "l": "approximate value of the stake"}}, {"id": "s5", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Treasury sells $58 billion of 3-year notes before Tuesday’s CPI", "s": "Futures put the odds of a quarter-point Fed hike at the Dec. 8 and 9 meeting near 77 percent. October CPI is due Tuesday at 8:30 a.m., with economists expecting 0.3 percent headline and 0.2 percent core.", "paras": ["Treasury auctions $58 billion of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">3-year notes<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The sale is judged against its when-issued yield. A stop above it, a tail, is the market’s verdict of weak demand.<\/span><\/button> at 1 p.m. Monday, with futures putting the odds of a quarter-point Fed hike at the Dec. 8 and 9 meeting near 77 percent. The 2-year closed Friday at 4.51 percent and the 10-year near 4.86 percent. October <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">CPI<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The Bureau of Labor Statistics will not publish some October 12-month changes because of the data gap left by the 2025 shutdown.<\/span><\/button> is due Tuesday at 8:30 a.m., with economists expecting 0.3 percent headline and 0.2 percent core. Asian chipmakers rebounded overnight, with Taiwan’s Taiex up about 5 percent, Saxo said."], "why": "A hike decision riding on an incomplete inflation print sets the discount rate for every deal in the pipeline, the largest IPO ever attempted included.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Saxo", "u": "https://www.home.saxo/en-sg/content/articles/macro/market-quick-take---asian-chipmakers-rebound-and-brent-holds-below-usd-100---9-november-2026-09112026", "t": null}, {"n": "U.S. Treasury", "u": "https://home.treasury.gov/news/press-releases/sb0678", "t": "C"}, {"n": "Seeking Alpha", "u": "https://seekingalpha.com/article/4964841-wall-street-brunch-anthropic-ipo-goes-on-the-road", "t": "C"}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/11/09/us-treasurys-bonds-yields.html", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-09/s5.webp?h=60c144de", "col": "#263854", "cap": "", "credit": "Federalreserve, Public domain / Wikimedia Commons", "pull": null, "fig": {"v": "4.51 percent", "l": "2-year Treasury yield at Friday’s close"}}, {"id": "s6", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Miami-Dade expects to lose about $400 million in year one of the tax cut", "s": "Voters passed Amendment 3 with 62 percent, The Real Deal reported Sunday. The cap on yearly assessment increases for non-homestead property, including commercial real estate, falls to 5 percent from 10. Hialeah could lose $17 million in year one.", "paras": ["Miami-Dade Mayor Daniella Levine Cava expects the county to lose about $400 million of revenue in the first year of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Amendment 3<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>It cleared Florida’s 60 percent threshold for constitutional amendments by two points, and new residents arriving Jan. 1 wait until their fifth year for the full benefit.<\/span><\/button>, which voters passed with 62 percent, The Real Deal reported Sunday. The homestead exemption rises to $150,000 in 2027 and $250,000 in 2028, and the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">non-homestead cap<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A slower-rising assessment lets taxable value trail market value for longer, which flows straight into a landlord’s net operating income.<\/span><\/button> on yearly assessment increases, which covers commercial real estate, falls to 5 percent from 10. Hialeah could lose $17 million in year one and is weighing a hiring freeze."], "why": "The cut moves value from county budgets to commercial landlords, which reaches both municipal bond credit and South Florida property valuations.", "c": {"L": 0, "LL": 0, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "The Real Deal", "u": "https://therealdeal.com/miami/2026/11/08/south-florida-dirt-winners-losers-of-property-tax-cuts/", "t": null}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "chart": {"type": "line", "t": "Florida homestead exemption", "rows": [["2027", 150000, "$150,000"], ["2028", 250000, "$250,000"]]}}, {"id": "s7", "sec": "Law & the Courts", "sid": "s-law", "h": "Justices hear whether a federal prisoner can still sue under Bivens", "s": "The Supreme Court hears argument at 10 a.m. Monday in Nielsen v. Watanabe. The Ninth Circuit let the inmate’s Eighth Amendment claim proceed. Joshua Wesneski of Weil, Gotshal and Manges is counsel of record for Watanabe as the firm winds down.", "paras": ["The Supreme Court hears argument at 10 a.m. Monday in Nielsen v. Watanabe, No. 25-417, on whether a federal prisoner may sue a prison paramedic for damages under <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Bivens<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The 1971 case created a damages action against federal agents with no statute behind it. The Court has not recognized a new context for it since 1980.<\/span><\/button>. Kekai Watanabe, hurt in a fight at a federal detention center in Honolulu, reported pain of 10 out of 10 and got over-the-counter medication. An x-ray seven months later showed a fractured coccyx. The Ninth Circuit let his Eighth Amendment claim proceed as “identical to <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Carlson<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Carlson v. Green (1980) allowed an Eighth Amendment suit on behalf of a federal inmate who died after officials failed to treat his asthma.<\/span><\/button> in all meaningful respects.”", "The paramedic’s brief calls Bivens and its progeny “relics of the bygone days.” Solicitor General D. John Sauer, sharing the paramedic’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">argument time<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The Court granted divided argument on Oct. 13. In Egbert v. Boule it had noted declining 11 times to extend Bivens.<\/span><\/button>, says “Carlson has become entirely obsolete” but asks the Court not to reconsider Bivens itself here. Joshua Wesneski of Weil, Gotshal &amp; Manges is counsel of record for Watanabe as the firm winds down."], "why": "Damages suits are the main check on federal officers, and a Court that keeps refusing to extend Bivens may now narrow its core, argued for the inmate by a firm in its final weeks.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "Supreme Court docket", "u": "https://www.supremecourt.gov/docket/docketfiles/html/public/25-417.html", "t": null}, {"n": "SCOTUSblog", "u": "https://www.scotusblog.com/2026/11/court-to-hear-argument-on-whether-and-when-federal-officials-can-be-held-liable-for-violations-o/", "t": "C"}, {"n": "Law360", "u": "https://www.law360.com/articles/2492129", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-09/s7.webp?h=d6ca00bb", "col": "#18395e", "cap": "The Supreme Court Building at dusk.", "credit": "Joe Ravi, CC BY-SA 3.0 / Wikimedia Commons", "pull": null}, {"id": "s8", "sec": "Law & the Courts", "sid": "s-law", "h": "Landowners ask whether state or federal law prices a pipeline taking", "s": "In Monday’s second argument, Hoffmann v. WBI Energy Transmission, North Dakota farmers represented by the Institute for Justice ask whether compensation is measured by state or federal rules. The solicitor general shares WBI’s argument time.", "paras": ["In Monday’s second argument, Hoffmann v. WBI Energy Transmission, No. 25-159, North Dakota farmers represented by the Institute for Justice ask whether a pipeline company condemning land under the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Natural Gas Act<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Section 7(h) hands federal eminent domain to any pipeline holding a FERC certificate, so a private company does the condemning.<\/span><\/button> must pay <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">compensation<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The federal measure is fair market value. Some state regimes allow broader recovery, such as attorney fees, which is the money at stake.<\/span><\/button> measured by state or federal rules. McDermott Will &amp; Schulte represents WBI, and the solicitor general shares its time. The U.S. Chamber and the pipeline trade group filed for the company; a Florida property owners’ group filed for the farmers."], "why": "The winning rule prices every pipeline right-of-way in the country, and with it the gas buildout that data centers now lean on.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "Supreme Court docket", "u": "https://www.supremecourt.gov/docket/docketfiles/html/public/25-159.html", "t": null}, {"n": "Law360", "u": "https://www.law360.com/real-estate-authority/residential/articles/2512331", "t": "C"}, {"n": "E&E News", "u": "https://www.eenews.net/articles/supreme-court-asks-for-trump-admins-view-on-pipeline-fight/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}, {"id": "s9", "sec": "The World", "sid": "s-world", "h": "Herzog hands Eisenkot the mandate and 28 days to find a majority", "s": "President Isaac Herzog formally tasked Gadi Eisenkot with forming Israel’s next government Sunday. The Arab parties Ra’am and the Joint List, with a record 19 seats, are not committed to join a coalition. United Torah Judaism recommended no one.", "paras": ["President Isaac Herzog formally tasked Gadi <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Eisenkot<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>He has set four conditions for any partner, Likud included, among them mandatory service for all and destroying Hamas’s military and governing power.<\/span><\/button> with forming Israel’s next government Sunday, after 67 lawmakers recommended him against 46 for Benjamin Netanyahu. He has 28 days, extendable by 14, under the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">mandate<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>If he fails, a second candidate gets 28 days, then any lawmaker with 61 backers has 21, and only then does the Knesset dissolve for a new election.<\/span><\/button> rules. “I expect you to do everything in your power to establish a government that will serve the entire people,” Herzog said. The 67 include the Arab parties Ra’am and the Joint List, with a record 19 seats, which are not committed to join a coalition.", "Eisenkot called for “a national emergency government” and said “creative and unconventional political steps will be required.” <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">United Torah Judaism<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Its price is the draft. Avigdor Liberman, whom Eisenkot needs, has said he would accept “painful compromises” on Haredi enlistment.<\/span><\/button>, with seven seats, recommended no one after backing Netanyahu after each of the previous five elections. The Times of Israel reported a possible route to 61 through the Haredi parties, which Shas called “total fake news.” Netanyahu said it was “a time for unity.”"], "why": "A government built on Haredi draft terms or on Arab party votes decides Israel’s posture in a live war with Iran, which is what oil and defense credit are pricing.", "c": {"L": 0, "LL": 0, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "Jerusalem Post", "u": "https://www.jpost.com/israel-election-2026/article-914236", "t": null}, {"n": "Israel Hayom", "u": "https://www.israelhayom.com/2026/11/08/eisenkot-tasked-with-forming-government-calls-for-unity/", "t": null}, {"n": "Times of Israel", "u": "https://www.timesofisrael.com/president-herzog-taps-eisenkot-to-form-coalition-but-path-remains-fraught/", "t": null}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-09/s9.webp?h=26380cf0", "col": "#343b2d", "cap": "The Knesset in Jerusalem.", "credit": "Suicasmo, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "chart": {"type": "bar", "t": "Recommendations to Herzog", "rows": [["Eisenkot", 67, "67 lawmakers"], ["Netanyahu", 46, "46 lawmakers"]]}}, {"id": "s10", "sec": "The World", "sid": "s-world", "h": "Trump says the Iran war cost Republicans the midterms", "s": "President Trump told “60 Minutes” that voters “didn’t like the war” and called it “bad messaging, maybe by me.” He said he would “love to do something on immigration” and doesn’t “mind guardrails” on AI.", "paras": ["President Trump told <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Ross Douthat<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>A New York Times opinion columnist, interviewing for the CBS program after Trump settled his lawsuit against the network.<\/span><\/button> on CBS’s “60 Minutes” Sunday that voters “didn’t like the war” or “the fact that gasoline went up,” calling it “bad messaging, maybe by me.” Asked whether the war was a good decision “for today and tomorrow,” he said, “Maybe not,” adding, “I’ve stopped them from having a nuclear weapon.” He said he did not disagree with Vice President Vance that the war cost the election, would “love to do something on immigration” and doesn’t “mind <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">guardrails<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Democrats have said they will bring AI testing and liability bills in January, so the word reads as an opening for a deal.<\/span><\/button>” on AI."], "why": "Conceding the war’s cost while naming immigration and AI as deal areas is the first map of what a divided Washington might actually legislate.", "c": {"L": 0, "LL": 0, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "CBS News transcript", "u": "https://www.cbsnews.com/news/donald-trump-2026-post-midterm-elections-interview-60-minutes-transcript/", "t": null}, {"n": "Jewish Insider", "u": "https://jewishinsider.com/2026/11/trump-iran-war-israel-gop-losses-vance-60-minutes-interview/", "t": null}, {"n": "The Daily Beast", "u": "https://www.thedailybeast.com/trump-throws-jd-vance-under-the-bus-twice-in-one-night", "t": null}, {"n": "RedState", "u": "https://redstate.com/sister-toldjah/2026/11/08/trump-responds-to-vance-tweet-60-minutes-interview-n2209181", "t": null}], "framing": "The left-leaning Daily Beast said Trump “throws JD Vance under the bus twice in one night”; the right-leaning RedState headlined “the one thing he would have added to Vance’s Iran tweet.”", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}, {"id": "s11", "sec": "The World", "sid": "s-world", "h": "Rubio calls Iran’s terms “outrageous” as Trump meets Qatar’s prime minister", "s": "Secretary of State Marco Rubio said the United States is not “on the verge of a breakthrough” with Iran, CBS News reported. Iran’s preconditions include lifting the naval blockade and compensation for the killing of Ali Khamenei, CNN reported.", "paras": ["Secretary of State Marco Rubio said Sunday that the United States is not “on the verge of a breakthrough” with Iran and called Tehran’s demands “outrageous and ridiculous,” CBS News reported. Foreign Minister Abbas Araghchi answered with the midterms: “American voters have made their choice. Time for the White House to make its own.” Iran’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">seven preconditions<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Washington’s side of the bargain, according to reports, is Iran’s enriched uranium diluted or shipped abroad.<\/span><\/button> include lifting the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">naval blockade<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>CENTCOM says it has destroyed 10 Iranian commercial tankers, and Task Force Iron Gate now extends enforcement to land and Caspian routes.<\/span><\/button> and compensation for the killing of Supreme Leader Ali Khamenei, CNN reported. Trump meets Qatar’s prime minister Monday."], "why": "Tehran is reading the midterms as leverage, which argues for a longer blockade and a firmer oil risk premium than last week’s 13 percent slide implied.", "c": {"L": 0, "LL": 1, "C": 1, "LR": 0, "R": 1}, "src": [{"n": "CBS News", "u": "https://www.cbsnews.com/live-updates/iran-war-trump-us-strait-hormuz-persian-gulf/", "t": "C"}, {"n": "CNN via KESQ", "u": "https://kesq.com/news/national-world/cnn-world/2026/11/08/us-and-iran-are-quietly-negotiating-as-middle-east-remains-on-edge-heres-what-to-know/", "t": "LL"}, {"n": "Fox News", "u": "https://www.foxnews.com/live-news/iran-war-news-trump-saudi-houthi-november-8", "t": "R"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}, {"id": "s12", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "Notre Dame beats No. 1 Miami 31-24 after a late touchdown is overturned", "s": "With 3:36 left, Elija Lofton appeared to catch the tying touchdown; it was ruled incomplete. Mario Cristobal said the ACC crew gave him “zero” explanation. Miami meets Duke next, the school that sued Darian Mensah in January over his transfer.", "paras": ["Notre Dame beat top-ranked Miami 31-24 on Saturday, and Mario Cristobal spent Sunday on the call that decided it. With 3:36 left, Elija Lofton appeared to catch the tying touchdown; it was ruled incomplete, and Notre Dame took over on downs. “Really, really disappointed that they negated Elija Lofton’s touchdown with two hands on the ball and two feet in bounds,” Cristobal said, adding that the ACC crew gave him “zero” explanation.", "CJ Carr threw for 319 yards and three touchdowns for Notre Dame, now 8-1, which had lacked the signature win the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">playoff committee<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Notre Dame entered the weekend as the last team in the committee’s provisional 12-team field.<\/span><\/button> wanted. Miami quarterback Darian Mensah, whose <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">NIL valuation<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>On3’s figure is a proprietary estimate, not a disclosed contract, which is why it can top any deal on record.<\/span><\/button> On3 puts at $6.5 million, the highest in men’s college sports, threw for 302. Miami, also 8-1, meets Duke next, the school that <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">sued Mensah<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>He had signed a two-year, $8 million deal at Duke. Front Office Sports calls the January suit the first by a school against a current athlete over an NIL contract; it settled.<\/span><\/button> in January over his transfer."], "why": "The highest-valued player in college football lost on a replay call and now meets the school that sued him over his contract, a live test of whether NIL deals bind like employment agreements.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 1}, "src": [{"n": "Yahoo Sports", "u": "https://sports.yahoo.com/college-football/article/no-1-miamis-mario-cristobal-pissed-off-after-potential-game-tying-td-catch-was-ruled-incomplete-in-loss-to-no-11-notre-dame-140426419.html", "t": null}, {"n": "CBS Sports", "u": "https://www.cbssports.com/college-football/gametracker/NCAAF_20261107_MIAMI@ND/", "t": "C"}, {"n": "Front Office Sports", "u": "https://frontofficesports.com/newsletter/miami-s-6-5m-qb-faces-big-test/", "t": "C"}, {"n": "OutKick", "u": "https://www.foxnews.com/outkick-sports/miami-coach-furious-officials-possible-td-catch-ruled-incomplete-crucial-loss-notre-dame", "t": "R"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-09/s12.webp?h=82399fa1", "col": "#2c3a46", "cap": "Notre Dame Stadium.", "credit": "PROjck_photos, CC BY 2.0 / Wikimedia Commons", "pull": null, "chart": {"type": "bar", "t": "Passing yards", "rows": [["CJ Carr", 319, "319 yards"], ["Darian Mensah", 302, "302 yards"]]}}, {"id": "s13", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "Trump says his press secretary offer to Dana White was “only kidding”", "s": "President Trump said Sunday that his offer of the White House press secretary job to Dana White was a joke: “I was only kidding. But Dana loves the idea.” White said he was flying to Washington: “We have a meeting on Monday.”", "paras": ["President Trump said Sunday that his offer of the White House <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">press secretary<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Katie Zacharia left the post last month after five days, and Karoline Leavitt left in August, Front Office Sports reported.<\/span><\/button> job to Dana White was a joke: “I was only kidding. But Dana loves the idea.” On Saturday Trump had posted that White was “offered the job of Press Secretary,” adding, “Dana, please take the job!” The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">UFC<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>It sits inside TKO Group Holdings, a public company that also owns WWE. None of the coverage reviewed carried a TKO statement on the offer.<\/span><\/button> chief said he was flying to Washington: “We have a meeting on Monday.”"], "why": "A public company’s marquee executive weighing a federal job is a disclosure and succession question for TKO’s board, joke or not.", "c": {"L": 1, "LL": 1, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/9/a-joke-or-test-why-trump-floated-ufcs-dana-white-as-his-press-secretary", "t": "L"}, {"n": "Front Office Sports", "u": "https://frontofficesports.com/article/donald-trump-dana-white-ufc-press-secretary-white-house/", "t": "C"}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/11/07/trump-ufc-dana-white-press-secretary-offer.html", "t": "C"}, {"n": "ESPN
