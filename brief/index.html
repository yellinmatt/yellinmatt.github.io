hits the grid in four regions", "s": "A six-day local ceasefire around Oleshky in Ukraine’s Kherson region expired late Sunday with no violations reported by either side, the BBC reported. A Ukrainian official told AFP that Russia refused Kyiv’s offer to extend it.", "paras": ["A six-day local ceasefire around Oleshky in Ukraine’s Kherson region expired late Sunday with no violations reported by either side, the BBC reported. A Ukrainian official told AFP that Russia refused Kyiv’s offer to extend it. Ukraine evacuated 167 more people on Sunday, including 22 children, from a town that held about 2,000 civilians when the truce began, by a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">route<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>Evacuees went through occupied territory to southern Russia, flew to Belarus, then crossed Ukraine’s northern border.<\/span><\/button> that needed Russian cooperation.", "Russian strikes overnight Saturday hit energy sites in four regions, leaving hundreds of thousands of homes without power and forcing nationwide emergency cuts, with Kyiv dark for most of the day. Russia launched 433 drones, of which 371 were destroyed or suppressed. Zelensky said Russia is “trying to take maximum advantage of the shortage of ballistic missile interceptors.”"], "why": "The longest truceConceptAFP’s description of the Oleshky pause. Moscow’s Peskov called the operation positive, including the two human rights commissioners’ coordination. of the war produced an evacuation channel and nothing else, as winter grid attacks begin and interceptor stocks run short.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "BBC via AOL", "u": "https://www.aol.com/articles/russian-strikes-cut-power-thousands-194939000.html", "t": "C"}, {"n": "Al Jazeera, AFP/AP/Reuters", "u": "https://www.aljazeera.com/news/2026/11/1/ukraine-evacuates-civilians-in-kherson-region-as-localised-ceasefire-ends", "t": "C"}, {"n": "AFP", "u": "https://www.afp.com/en/longest-truce-ukraine-war-ends-kherson", "t": "C"}, {"n": "Japan Times", "u": "https://www.japantimes.co.jp/news/2026/11/01/world/kherson-truce-ukrainian-families/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-02/s11.webp?h=530293e3", "col": "#3e3729", "cap": "Kyiv in a wartime blackout, November 2022.", "credit": "Estemelmo Nólemë, CC BY 2.0 / Wikimedia Commons", "pull": null}, {"id": "s12", "sec": "The World", "sid": "s-world", "h": "Gen Z protests jump to Germany and turn violent as France’s turnout slips again", "s": "Germany’s interior minister blamed “violent left-wing groups and troublemakers from migrant communities” after weekend youth marches turned violent, CNN reported Sunday. Organizers claimed 120,000 demonstrators.", "paras": ["Germany’s interior minister blamed “violent left-wing groups and troublemakers from migrant communities” after weekend youth marches turned violent, CNN reported Sunday. Organizers claimed 120,000 demonstrators. In Frankfurt, Molotov cocktails were thrown at emergency workers and a gun shop was broken into; in Berlin, 27 officers were lightly hurt and just under 60 people detained. Organizers said they had no influence on what followed the marches. France’s Interior Ministry counted 320,000, down from 410,000 and 550,000 on the two prior weekends. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">German demands<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>They include opposition to a return of mandatory military service, a defense-spending link the French marches lack.<\/span><\/button> differ from France’s cost-of-living focus."], "why": "A movement crossing borders while shrinking at home is a test for European debt and defense budgets, with France on negative watch and Germany rearming.", "c": {"L": 0, "LL": 2, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "CNN Wire via Scripps News", "u": "https://www.scrippsnews.com/world/europe/germany-blames-infiltrators-as-gen-z-protests-turn-violent", "t": "LL"}, {"n": "CNN", "u": "https://edition.cnn.com/2026/11/01/europe/germany-gen-z-protests-turn-violent-intl", "t": "LL"}, {"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/10/31/tension-and-clashes-as-hundreds-of-thousands-protest-again-in-france", "t": "C"}, {"n": "Morocco World News", "u": "https://www.moroccoworldnews.com/2026/11/344679/france-sees-third-weekend-of-protests-police-fire-tear-gas-at-crowds/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-02/s12.webp?h=48a1c3f7", "col": "#243a4e", "cap": "", "credit": "Leonhard Lenz, CC0 / Wikimedia Commons", "pull": null}, {"id": "s13", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "Florida State fires Norvell with about $50 million owed, the third-largest buyout in college football", "s": "Florida State fired football coach Mike Norvell on Sunday, owing about $50 million on an eight-year, $84 million extension signed in 2024, Front Office Sports reported; ESPN put the figure at $50.3 million. Only Jimbo Fisher at Texas A&amp;M, near $77 million, and Brian Kelly at LSU, $54 million, cost more.", "paras": ["Florida State fired football coach Mike Norvell on Sunday, owing about $50 million on an eight-year, $84 million extension signed in 2024, Front Office Sports reported; ESPN put the figure at $50.3 million. Only Jimbo Fisher at Texas A&amp;M, near $77 million, and Brian Kelly at LSU, $54 million, cost more. The team is 3-5 and Norvell went 10-22 after the extension. President Richard McCullough told ESPN, “I just did not see that trajectory.” The buyout shrinks if Norvell takes another job, through <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">offset<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A mitigation clause. It turns a coach’s next contract into a credit against the old employer’s debt, so he has reason to wait.<\/span><\/button> language. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">One search firm<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Florida State let athletic director Michael Alford go Sept. 14, so the same firm is hiring both the boss and the coach.<\/span><\/button> is running the coach and athletic director searches."], "why": "Coach contracts are guaranteed-pay instruments with mitigation terms, and this one shows what a pre-revenue-sharing extension costs a public university once results turn.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Front Office Sports", "u": "https://frontofficesports.com/article/florida-states-norvell-fired-with-50m-left-on-contract/", "t": null}, {"n": "ESPN", "u": "https://www.espn.com/college-football/story/_/id/50350481/florida-state-fires-mike-norvell-amid-3-5-football-season", "t": "C"}, {"n": "Sports Illustrated", "u": "https://www.si.com/college-football/florida-state-fires-football-coach-mike-norvell", "t": "C"}, {"n": "Bleacher Report", "u": "https://bleacherreport.com/articles/25528180-mike-norvell-fired-fsu-latest-contract-buyout-info-and-top-replacements-after-clemson-loss", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-02/s13.webp?h=7d2190df", "col": "#313e0d", "cap": "Doak Campbell Stadium, Tallahassee.", "credit": "Mlsquad, CC BY-SA 4.0 / Wikimedia Commons", "pull": null}, {"id": "s14", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "Rockstar’s UK staff vote on a union in the week GTA VI ships, with the dismissal case near closings", "s": "Rockstar’s UK workers will ballot Nov. 12 to 26 on recognizing the Independent Workers of Great Britain, a vote that spans the Nov. 19 launch of Grand Theft Auto VI, IBTimes UK reported Monday. The union says a yes would cover more than 1,600 workers.", "paras": ["Rockstar’s UK workers will ballot Nov. 12 to 26 on recognizing the Independent Workers of Great Britain, a vote that spans the Nov. 19 launch of Grand Theft Auto VI, IBTimes UK reported Monday. The union says a yes would cover more than 1,600 workers. The ballot concerns <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">recognition only<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Voluntary recognition was requested June 30 and talks ran from July, so the ballot follows a failed negotiation.<\/span><\/button>, not a strike. In Glasgow, an employment tribunal hears closing submissions Nov. 17 and 18 over 34 staff dismissed in October 2025. Rockstar alleges Discord leaks; the workers say organizing. IWGB’s Alex Marshall called the ballot “just as historic as the game release.”"], "why": "The biggest launch in the medium arrives with a live UK labor case. A yes vote would make a template for AAA studios that have stayed largely unorganized.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "IBTimes UK", "u": "https://www.ibtimes.co.uk/rockstar-uk-staff-union-vote-gta-6-launch-1829466", "t": null}, {"n": "Game Developer", "u": "https://www.gamedeveloper.com/business/rockstar-workers-to-vote-on-unionization-ahead-of-grand-theft-auto-vi-release", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-02/s14.webp?h=1d5dd411", "col": "#46341d", "cap": "", "credit": "Alexander Kirwin, CC BY-SA 2.0 / Wikimedia Commons", "pull": null}], "week": [], "cover": "img/2026-11-02/s1.webp?h=ba88bc9e"}, {"date": "2026-11-01", "no": 157, "min": 9.3, "stand": "Iran named its price for the strait, a Miami judge ended Trump’s case against the Journal, and the private market marked down the leading AI lab.", "note": "EDITOR’S NOTE. The Sunday Special changes the unit of analysis from the day to the week and does not relax the bar: the Front is recency-gated to the 36 hours from Friday 6 p.m. Eastern, and the departments carry items that already cleared a daily brief, plus the Israel and box-office items first covered inside the window. Front 6, sector briefs 9, week in review 7 days, framing notes 0. Conflict disclosed: Anthropic, whose model helps produce this paper, appears in the OpenAI item, the AI brief and the week in review. Not run: CD&amp;R and GTCR’s reported $40 billion approach for Global Payments broke Friday afternoon, before the window, and is unsigned; Blackstone’s double-B call on Anthropic and Crosby’s bid for Weil already ran Saturday; a reported Justice Department appeal of Judge Thompson’s election-officials order rests on one unopened headline; Russia’s strikes that left 280,000 Ukrainian homes dark had a single source; Anthropic’s reported Claude Code rule against cloning games carried no confirmed time. Sourcing limits: Al Jazeera, NPR, Reuters and the Financial Times originals were not opened; the Hormuz offer rests on The Tribune’s report of Al Jazeera, with Fox and CBS on the surrounding facts; the box office figures are Saturday estimates; the Trump damages figure is withheld because outlets disagree. Missed this week, on the record: the Global Payments approach, which the Oct. 31 edition should have caught, and the drone sinking of a Greek container ship off Bulgaria on Oct. 29.", "items": [{"id": "s1", "sec": "The Front", "sid": "s-front", "h": "Iran offers to reopen Hormuz within two days on seven conditions, as its new supreme leader orders retaliation without limits", "s": "Iran’s foreign minister, Abbas Araghchi, said on Sunday that Qatari mediators have proposed reopening the Strait of Hormuz within two days if Washington meets Tehran’s terms, with the United States acting on the first day and shipping resuming on the second, The Tribune reported, citing Al Jazeera. An earlier draft allowed five days.", "paras": ["Iran’s foreign minister, Abbas Araghchi, said on Sunday that Qatari mediators have proposed reopening the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Strait of Hormuz<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>Under Article 38 of the Law of the Sea convention, ships enjoy transit passage through international straits. Iran signed the treaty in 1982 but never ratified it, the basis of its claim to regulate the lane.<\/span><\/button> within two days if Washington meets Tehran’s terms, with the United States acting on the first day and shipping resuming on the second, The Tribune reported, citing Al Jazeera. An earlier draft allowed five days. No direct talks between the two governments are planned.", "The terms run to seven: lifting the sanctions reimposed after the Islamabad memorandum collapsed in July, a smaller American military presence, restored oil waivers, released frozen funds, recognition of a new route built with Oman, the closure of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">every other route<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Shutting the alternatives would leave the Iran-Oman lane as the only lawful passage, which reads less as a reopening than as a claim to gate the waterway and set its terms.<\/span><\/button>, and an end to the war on all fronts, Lebanon included. President Trump said Iran wants a deal and that Washington is in no hurry, and Secretary of State Marco Rubio said no decision on new strikes has been made.", "Tehran paired the offer with a threat. On Saturday <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Mojtaba Khamenei<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>Al Jazeera noted he had not appeared in public since taking office in March. The same directive ordered the armed forces to update their target database.<\/span><\/button>, who succeeded his assassinated father, ordered an “immediate, impactful, and geographically unrestricted response” to any attack, Fox News reported, and a member of parliament’s security committee said ten bills to quit the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Non-Proliferation Treaty<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Article X allows withdrawal on three months’ notice citing “extraordinary events.” Only North Korea has used it, in 2003. Iran ratified the treaty in 1970.<\/span><\/button> have been filed. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">CENTCOM<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>U.S. Central Command. Its commander, Adm. Brad Cooper, said on Saturday that “Iran’s navy is all at the bottom of the sea.”<\/span><\/button> says its blockade has turned back 144 commercial ships, and December Brent settled at $117.64 on Friday after the Revolutionary Guard seized four tankers."], "why": "Oil near $118 prices a closed strait, so the offer is a trade with two legs: a fast reopening would unwind much of the premium, and a strike after Tuesday’s midterms would add to it. The sixth condition is the tell.", "c": {"L": 2, "LL": 0, "C": 3, "LR": 0, "R": 1}, "src": [{"n": "The Tribune / ANI", "u": "https://www.tribuneindia.com/news/world/araghchi-says-iran-qatar-propose-reopening-strait-of-hormuz-within-two-days-if-us-meets-tehrans-conditions", "t": "C"}, {"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/10/31/iran-warns-of-unfettered-retaliation-if-attacked-as-mediators-try-for-peace", "t": "L"}, {"n": "Fox News", "u": "https://www.foxnews.com/live-news/us-iran-war-trump-israel-strait-hormuz-10-31-26", "t": "R"}, {"n": "CBS News", "u": "https://www.cbsnews.com/live-updates/iran-war-us-trump-diplomacy-threat-resume-attacks/", "t": "C"}, {"n": "Middle East Eye", "u": "https://www.middleeasteye.net/live-blog/live-blog-update/araghchi-says-hormuz-could-be-reopened-two-days-if-conditions-met", "t": "C"}, {"n": "Al Jazeera, NPT bills", "u": "https://www.aljazeera.com/news/2026/10/31/iran-lawmakers-call-for-withdrawal-from-npt-will-we-have-war-or-peace", "t": "L"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-01/s1.webp?h=44305514", "col": "#2b3a47", "cap": "The frigate USS Taylor passes a tanker after transiting the Strait of Hormuz, 1990.", "credit": "Department of Defense. American Forces Information Service. Defense Visual Infor, Public domain / Wikimedia Commons", "pull": {"text": "Reopening the Strait of Hormuz in accordance with our conditions paves the way for the resumption of negotiations.", "attr": "Abbas Araghchi, via The Tribune, November 1"}}, {"id": "s2", "sec": "The Front", "sid": "s-front", "h": "A Miami federal judge throws out Trump’s suit against the Wall Street Journal over the Epstein letter, this time with prejudice", "s": "U.S. District Judge Darrin P.", "paras": ["U.S. District Judge Darrin P. Gayles dismissed President Trump’s defamation suit against Dow Jones, News Corp, Rupert Murdoch and the reporters on Saturday, ruling that the amended complaint again failed to <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">plausibly allege<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Twombly (2007) and Iqbal (2009) require facts that make a claim plausible, not merely conceivable, which is why a state-of-mind element can be decided before any discovery.<\/span><\/button> <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">actual malice<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The New York Times v. Sullivan (1964) standard: knowledge of falsity or reckless disregard for the truth. It concerns the publisher’s view of accuracy, not ill will toward the subject.<\/span><\/button>, the Associated Press reported. The 20-page order says the suit was “grasping at straws” and tried to “manufacture” flaws in the Journal’s reporting on a birthday letter to Jeffrey Epstein bearing Trump’s name.", "Gayles threw out the first complaint in April, finding it came “nowhere close” to the standard, and let Trump replead. A spokesperson said the president “will continue to press forward,” and CBS News cited a source saying an appeal is likely. Coverage disagrees on the damages sought, so this paper prints no figure until the amended complaint is read."], "why": "Dismissal with prejudiceConceptThe case cannot be refiled in that court. The Eleventh Circuit would review a Rule 12(b)(6) dismissal de novo, giving the district court no deference. at the pleading stage is the media bar’s best result in a public-figure case, and an appeal would test Sullivan in the circuit that hears Florida’s press cases.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "AP via Spectrum News", "u": "https://spectrumlocalnews.com/tx/san-antonio/politics/2026/10/31/trump-lawsuit-wall-street-journal-epstein-letter-dismissed", "t": "C"}, {"n": "CBS News", "u": "https://www.cbsnews.com/news/trump-lawsuit-wall-street-journal-epstein-birthday-letter-dismissed/", "t": "C"}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/10/31/trump-murdoch-wsj-epstein-defamation-lawsuit-dismissed.html", "t": "C"}, {"n": "Hollywood Reporter", "u": "https://www.hollywoodreporter.com/news/politics-news/trump-lawsuit-wall-street-journal-epstein-dismissed-1236744244/", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-01/s2.webp?h=2c4f2311", "col": "#41362a", "cap": "", "credit": "Phillip Pessar from Miami, USA, CC BY 2.0 / Wikimedia Commons", "pull": null}, {"id": "s3", "sec": "The Front", "sid": "s-front", "h": "OpenAI cuts its funding target by a third to $20 billion after a tepid response from some large investors", "s": "OpenAI has lowered the target for its new round to about $20 billion from $30 billion, at a $1.25 trillion valuation, the Financial Times reported on Friday, and the first close is likely to land below that, TechCrunch reported on Saturday. The company first pitched investors at $1.4 trillion.", "paras": ["OpenAI has lowered the target for its new round to about $20 billion from $30 billion, at a $1.25 trillion valuation, the Financial Times reported on Friday, and the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">first close<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The first tranche of commitments a round finalizes. Later investors can join on the same terms, which is how a round can be announced at a size it has not yet raised.<\/span><\/button> is likely to land below that, TechCrunch reported on Saturday. The company first pitched investors at $1.4 trillion. The Wall Street Journal reported that only $11 billion is secured and that some large investors were “tepid.”", "Investors from the United Arab Emirates, including the state-backed fund MGX, lead the round, and OpenAI would receive an <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">option to lease computing capacity<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Paying part of an equity check in data-center access makes the round partly a compute contract, which muddies any comparison of its price with an all-cash round.<\/span><\/button> in the region. Founders Fund, Coatue, Sequoia and Andreessen Horowitz also plan to invest, and a later offering for wealthy individuals would come at the same price. OpenAI is aiming for a 2027 listing and wants the round closed before Anthropic goes public, Reuters reported. Conflict disclosed: this paper is compiled with Anthropic’s model."], "why": "The markdown came the week Anthropic filed to list and the Nasdaq fell 2.9% in a day, so the private price of the leading lab is now being set by public comparables and Gulf capacity.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "TechCrunch", "u": "https://techcrunch.com/2026/10/31/openai-reportedly-lowers-funding-target-for-new-round/", "t": "C"}, {"n": "The Next Web (Reuters)", "u": "https://thenextweb.com/news/openai-funding-round-20bn-target-cut-ft", "t": "C"}, {"n": "Yahoo Finance", "u": "https://finance.yahoo.com/technology/ai/articles/openai-reportedly-lowers-funding-target-161255478.html", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-01/s3.webp?h=482bea61", "col": "#38392a", "cap": "", "credit": "HaeB, CC BY-SA 4.0 / Wikimedia Commons", "pull": null}, {"id": "s4", "sec": "The Front", "sid": "s-front", "h": "France’s third weekend of youth-led protests draws 320,000, and a firebomb sets a Paris riot officer alight", "s": "About 320,000 people marched across France on Saturday, 70,000 of them in Paris, by the authorities’ count, against organisers’ claim of nearly 500,000, Agence France-Presse reported. Interior Minister Laurent Nuñez reported 520 arrests by 9 p.m. and called the firebombing of a riot officer an “attempted murder.”", "paras": ["About 320,000 people marched across France on Saturday, 70,000 of them in Paris, by the authorities’ count, against organisers’ claim of nearly 500,000, Agence France-Presse reported. Interior Minister Laurent Nuñez reported 520 arrests by 9 p.m. and called the firebombing of a riot officer an “attempted murder.” Official turnout has fallen from about 550,000 on Oct. 17 and 410,000 on Oct. 24.", "The movement began with high-school students protesting crumbling schools, teacher shortages and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">university admissions<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Places are allocated through Parcoursup, a national platform whose opaque ranking has been a student grievance since its 2018 launch.<\/span><\/button>, and has since drawn the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">yellow vests<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The gilets jaunes rose in November 2018 over a fuel-tax rise and forced Macron to scrap it, the template for a leaderless movement that wins concessions.<\/span><\/button> and the unions. A curfew from 11 p.m. to 6 a.m. covers République and Châtelet-Les Halles through Sunday. Marine Le Pen, who leads presidential polling, demanded the attackers be “punished with the utmost severity.”"], "why": "Fitch has moved France’s outlook to negative and the economy shrank in the third quarter, so a government six months from a presidential vote cannot spend its way to calm, and the bond spread carries the risk.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 1, "R": 0}, "src": [{"n": "AFP via Free Malaysia Today", "u": "https://www.freemalaysiatoday.com/category/highlight/2026/11/01/clashes-break-out-as-hundreds-of-thousands-protest-in-france", "t": "C"}, {"n": "The Telegraph", "u": "https://www.yahoo.com/news/world/articles/protesters-firebomb-french-police-clowns-183632768.html", "t": "LR"}, {"n": "France 24", "u": "https://www.france24.com/en/france/20261031-live-france-braces-for-halloween-protests-government-vows-tough-response", "t": "C"}, {"n": "Times of Israel", "u": "https://www.timesofisrael.com/liveblog-october-31-2026/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-01/s4.webp?h=5d221ca9", "col": "#41362a", "cap": "", "credit": "Jorge Jaramillo, CC BY-SA 4.0 / Wikimedia Commons", "pull": null}, {"id": "s5", "sec": "The Front", "sid": "s-front", "h": "Israel’s Arab parties are set to back Eisenkot, leaving him one seat short of a majority before Herzog’s talks", "s": "The Joint List and Ra’am, with 19 seats between them, are expected to recommend Gadi Eisenkot for prime minister, a senior Joint List official told Walla on Sunday, the Jerusalem Post reported. Ynet’s tally puts Eisenkot at 60 recommendations to Benjamin Netanyahu’s 46, with Yisrael Beiteinu and United Torah Judaism, seven seats each, undecided.", "paras": ["The Joint List and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Ra’am<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>In 2021 it became the first Arab party to join an Israeli governing coalition, under Naftali Bennett and Yair Lapid.<\/span><\/button>, with 19 seats between them, are expected to recommend Gadi Eisenkot for prime minister, a senior Joint List official told Walla on Sunday, the Jerusalem Post reported. Ynet’s tally puts Eisenkot at 60 recommendations to Benjamin Netanyahu’s 46, with Yisrael Beiteinu and United Torah Judaism, seven seats each, undecided. A majority is 61.", "Avigdor Liberman’s seven would carry Eisenkot to 67, but Ynet warns that a government resting on both Arab parties and Liberman would be fragile, and Netanyahu has kept a unity option open. President Isaac Herzog receives the official results on Wednesday and must <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">assign the mandate<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Recommendations are advisory. The president may choose whichever member he judges most able to form a government, who then has 28 days, extendable by 14.<\/span><\/button> by Nov. 11."], "why": "Whoever forms Israel’s next government inherits the Iran war at its most delicate point, and an Eisenkot coalition would depend on Arab parties for the first time since 2021.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Jerusalem Post", "u": "https://www.jpost.com/israel-election-2026/article-913448", "t": "C"}, {"n": "Ynet", "u": "https://www.ynetnews.com/article/sk8eaw4pge", "t": "C"}, {"n": "Times of Israel", "u": "https://www.timesofisrael.com/liveblog-november-1-2026/", "t": "C"}, {"n": "The Media Line", "u": "https://themedialine.org/headlines/herzog-calls-for-creative-solutions-ahead-of-wednesday-coalition-talks/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-01/s5.webp?h=173bf843", "col": "#43342a", "cap": "", "credit": "B0x3rg1r1, CC BY-SA 4.0 / Wikimedia Commons", "pull": null}, {"id": "s6", "sec": "The Front", "sid": "s-front", "h": "A24’s You Can See Everything edges Clayface for No. 1 on a quiet Halloween weekend", "s": "A24’s You Can See Everything was on course for about $10.6 million this weekend, its first time at No. 1, against $10.2 million for Warner Bros.’ Clayface, according to Saturday estimates reported by TheWrap. It has about $63 million domestic, second among October releases to Amazon MGM’s Verity.", "paras": ["A24’s You Can See Everything was on course for about $10.6 million this weekend, its first time at No. 1, against $10.2 million for Warner Bros.’ Clayface, according to Saturday estimates reported by TheWrap. It has about $63 million domestic, second among October releases to Amazon MGM’s Verity. Clayface, down 57%, has $44 million after ten days on a reported $40 million budget. Black Bear’s Wicker, <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">bought at Sundance<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Festival buyers usually pay a flat fee for distribution rights, so the distributor, not the producer, keeps most of the upside once marketing costs are covered.<\/span><\/button> for $2.5 million, has grossed $13.2 million. No wide release opened, and Sunday figures follow."], "why": "Wicker’s fivefold return on a festival price is the number buyers will cite at the next market, and Clayface’s slide puts a studio franchise bet under review.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "TheWrap", "u": "https://www.thewrap.com/creative-content/movies/clayface-you-can-see-everything-halloween-box-office/", "t": "C"}, {"n": "Deadline", "u": "https://deadline.com/2026/10/box-office-you-can-see-everything-clayface-halloween-1237209579/", "t": "C"}, {"n": "Gold Derby", "u": "https://www.goldderby.com/film/2026/you-can-see-everything-clayface-halloween-box-office-weekend/", "t": "C"}, {"n": "Boxoffice Pro", "u": "https://www.boxofficepro.com/weekend-preview-you-can-s ’s outlook to negative on cash-flow concerns."], "why": "", "c": {"L": 0, "LL": 0, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "SEC filing", "u": "https://www.sec.gov/Archives/edgar/data/0001326801/000119312526432549/d382225dfwp.htm", "t": null}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-01/s8.webp?h=0d189aa6", "col": "#293363", "cap": "", "credit": "BalticServers.com, CC BY-SA 3.0 / Wikimedia Commons", "pull": null}, {"id": "s9", "sec": "Markets & Deals", "sid": "d-mkt", "h": "The Fed holds, with two votes to hike", "s": "The FOMC kept its range at 3.75% to 4% on Oct. 28, with Lisa Cook and Beth Hammack dissenting for a hike. The ten-year ended Friday near 4.93%, a seven-week low, and futures price about three-in-four odds of a December increase.", "paras": ["The FOMC kept its range at 3.75% to 4% on Oct. 28, with Lisa Cook and Beth Hammack dissenting for a hike. The ten-year ended Friday near 4.93%, a seven-week low, and futures price about three-in-four odds of a December increase. Treasury’s refunding is expected Wednesday, the day after the midterms."], "why": "", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "Federal Reserve", "u": "https://www.federalreserve.gov/newsevents/pressreleases/monetary20261028a.htm", "t": "C"}, {"n": "Trading Economics", "u": "https://tradingeconomics.com/united-states/government-bond-yield/news/596546", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-01/s9.webp?h=e62abb58", "col": "#263854", "cap": "", "credit": "Federalreserve, Public domain / Wikimedia Commons", "pull": null}, {"id": "s10", "sec": "Law & the Courts", "sid": "d-law", "h": "Weil Gotshal moves to wind itself down", "s": "Management recommended an out-of-court dissolution of the 95-year-old firm, advised by AlixPartners and Davis Polk, after about 30 partners left. By Friday Gibson Dunn was poised to take about 40 London lawyers and the AI-native firm Crosby had bid for the brand and data.", "paras": ["Managem
