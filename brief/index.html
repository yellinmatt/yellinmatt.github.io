.nb{position:absolute;left:0;right:0;top:0;z-index:3;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;min-height:calc(48px + var(--it));padding:var(--it) max(4px,var(--ir)) 0 max(4px,var(--il));transition:background-color .2s,box-shadow .2s}

 No South Florida item cleared the window. Watch: the Fed’s AI forum in San Francisco Monday; Nvidia earnings Nov. 17; Anthropic’s pricing Nov. 18; GTA VI on Nov. 19.", "items": [{"id": "s1", "sec": "The Front", "sid": "s-front", "h": "A four-hour nationwide ground stop puts the FAA’s new AI tool under review", "s": "The FAA halted departures nationwide at 3:54 p.m. on Friday and lifted the order at 8:15 p.m. Transportation Secretary Sean Duffy ruled out the new SMART system and blamed switches and routers that “actually got overloaded with data.” It was the second nationwide ground stop since 2001, ABC News reported.", "paras": ["The Federal Aviation Administration halted departures nationwide at 3:54 p.m. Eastern on Friday after radar and communications failures spread across control centers, and lifted the order at 8:15 p.m., Transportation Secretary Sean Duffy said. About 3,500 planes were airborne when it began. It was the second nationwide ground stop since Sept. 11, 2001, ABC News reported; the last came in January 2023, when the system that issues notices to pilots failed.", "The halt came three days after the FAA extended <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">SMART<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A cloud platform that merges airline schedules, weather, airport capacity and airspace data to forecast congestion before departure; controllers decide whether to take its advice.<\/span><\/button>, an AI system built to forecast congestion, to all 22 of its en route centers, where it advises controllers on routing. Homeland Security Secretary Markwayne Mullin said the department was ‘looking at’ any link and saw no sign of a cyberattack. ‘It doesn’t appear that way,’ he said, while declining to rule one out. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Air Space Intelligence<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The contractor holds an $875 million, 12-year FAA contract for the system, which was first used in the Washington, D.C., area in September.<\/span><\/button>, which built it, said the stop ‘is not based on or a result of the SMART system.’", "Duffy ruled the tool out, saying it only recommends routes and does not touch the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">radar systems<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>STARS, at approach facilities, and ERAM, at the en route centers, are the automation that tracks every flight; Duffy said SMART connects to neither.<\/span><\/button>. He blamed switches and routers that ‘actually got overloaded with data’ and asked Congress for <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">$50 billion<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The request rides on the Modern Skies Act; air traffic control already received $5 billion under the 2021 infrastructure law and $12.5 billion in the One Big Beautiful Bill.<\/span><\/button>, saying he expected flights to be ‘back up and operational’ heading into Thanksgiving. Cirium counted at least 827 diversions by early evening, AVweb reported. Sen. Maria Cantwell said the Commerce Committee would review the failure, and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Sen. Tammy Duckworth<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>Ranking Democrat on the Senate aviation subcommittee, she wrote that ‘safety of our skies is built on redundancies,’ the principle a single telecom failure puts to the test.<\/span><\/button> said she would demand answers."], "why": "Washington’s first suspect was the AI tool it had switched on three days earlier, and its defense, that a human makes every call, is the liability theory every deployer of advisory AI will lean on.", "c": {"L": 1, "LL": 1, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "ABC News", "u": "https://abcnews.com/US/nationwide-ground-stop-ordered-airports-faa/story?id=138121848", "t": "LL"}, {"n": "WMUR", "u": "https://www.wmur.com/article/faa-ground-stop-raises-questions-after-rollout-of-new-ai-air-traffic-system/74428995", "t": "C"}, {"n": "AVweb", "u": "https://avweb.com/aviation-news/faa-nationwide-ground-stop-lifts-smart-ai/", "t": "C"}, {"n": "KPRC Houston", "u": "https://www.click2houston.com/news/local/2026/11/13/faa-investigating-whether-new-ai-technology-contributed-to-nationwide-ground-stop/", "t": "C"}, {"n": "MLive via Yahoo", "u": "https://www.yahoo.com/news/us/articles/faa-rolled-ai-system-days-015602923.html", "t": "C"}, {"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/13/us-grounds-all-flights-after-communication-issue", "t": "L"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-14/s1.webp?h=68859d0b", "col": "#38392b", "cap": "Controllers at the FAA’s Washington Air Route Traffic Control Center.", "credit": "Work of the United States Federal Government under the terms of 17 U.S.C. § 105, Public domain / Wikimedia Commons", "pull": {"text": "But you will have more of these. You will have more of them unless the American people and the Congress tell us to build.", "attr": "Sean Duffy, White House briefing, Nov. 13"}, "fig": {"v": "3,500", "l": "Planes airborne when the stop began, per Duffy"}}, {"id": "s2", "sec": "The Front", "sid": "s-front", "h": "The SEC proposes cutting proxy pay disclosure to the CEO and finance chief", "s": "The SEC on Friday proposed the broadest rewrite of executive pay disclosure since 2006. Three new tables would replace the four primary tables, and the pay ratio would be computed from U.S. full-time employees only. Comments run 60 days after Federal Register publication.", "paras": ["The Securities and Exchange Commission on Friday proposed the broadest rewrite of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">executive pay disclosure<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Item 402 of Regulation S-K, last overhauled in 2006; Chairman Paul Atkins said it is ‘reaching nearly the end of the alphabet in its internal organizational system.’<\/span><\/button> since 2006, shrinking the named executive officers in most proxy statements from five or more to the principal executive and financial officers. Three new tables, for earned pay, granted pay and the status of equity awards, would replace the four primary tables, and the threshold for reporting perquisites would rise to $150,000 from $10,000.", "The pay ratio would be computed from U.S. full-time employees only, with the median worker re-identified every five years instead of three. Pay-versus-performance would drop <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">‘compensation actually paid,’<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The Dodd-Frank metric adopted in 2022, which marks unvested equity to market each year; the proposal swaps in the total from the new earned-compensation table.<\/span><\/button> and companies filing an S-1 would get up to 120 days after fiscal year-end to supply pay data, according to Cooley’s summary of the 542-page release. Atkins called it the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">second of three steps<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The first was a May 2026 proposal on emerging-growth-company accommodations and filer status; the agency acted as OIRA’s 90-day review window neared its close.<\/span><\/button> toward disclosure based on materiality. Comments run 60 days after Federal Register publication."], "why": "The summary compensation table sits in every proxy and S-1 a capital-markets associate touches; this rebuilds it and gives IPO issuers more time.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "SEC, Atkins statement", "u": "https://www.sec.gov/newsroom/speeches-statements/atkins-statement-proposing-release-executive-compensation-disclosure-reform-111326", "t": null}, {"n": "Reuters via Yahoo Finance", "u": "https://finance.yahoo.com/markets/stocks/articles/us-sec-proposes-scaling-back-171504632.html", "t": "C"}, {"n": "Cooley GovernanceBeat", "u": "https://governancebeat.cooley.com/the-secs-executive-pay-disclosure-reform-proposal-is-here-13-takeaways/", "t": "C"}, {"n": "VitalLaw", "u": "https://www.vitallaw.com/news/executive-compensation-sec-proposed-rules-aim-to-streamline-requirements-while-continuing-to-provide-needed-data/sld012adc292c2fc745f8977864e156ad3d24", "t": "C"}, {"n": "Bloomberg", "u": "https://www.bloomberg.com/news/articles/2026-11-13/sec-moves-to-rein-in-executive-pay-disclosures-to-investors", "t": "C"}], "framing": "", "min": 1, "front": true, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "chart": {"type": "bar", "t": "Perquisites reporting threshold", "rows": [["Current", 10000, "$10,000"], ["Proposed", 150000, "$150,000"]]}}, {"id": "s3", "sec": "The Front", "sid": "s-front", "h": "Anthropic’s IPO book is said to be six times covered", "s": "Orders reached about six times the shares on offer by the end of Thursday, Reuters reported, citing people familiar with the deal. Several underwriters rejected or set aside orders from mainland China and Hong Kong, Bloomberg reported. Pricing is expected Wednesday and trading on Nov. 19.", "paras": ["Orders for Anthropic’s initial public offering reached about six times the shares on offer by the end of Thursday, up from about twice after the roadshow’s first day, Reuters reported, citing people familiar with the deal. The company aims to raise up to $64.4 billion in the listing alongside a $26 billion private placement, with pricing expected Wednesday and trading on Nov. 19. Several underwriters rejected or set aside orders from mainland China and Hong Kong, Bloomberg reported, some citing <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">export rules<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The International Traffic in Arms Regulations govern defense-related goods and data; similar screens were applied to buyers in the SpaceX offering.<\/span><\/button>.", "Speaking with JPMorgan’s Jamie Dimon at the bank’s Manhattan headquarters on Friday, chief executive Dario Amodei called compute ‘the deepest business dilemma that the company faces.’ The latest filing shows nearly <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">$901 billion in commitments<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Valuation models in the book assume 2028 revenue of $270 billion to $280 billion, Reuters reported, so the obligations are underwritten by growth that has not yet arrived.<\/span><\/button>, mostly for compute and chips, about $71 billion of it due in the year to Sept. 30, 2027. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Evercore<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Its estimate gives JPMorgan about $44 million of the pool, against the $75 million the bank earned on the SpaceX listing.<\/span><\/button> estimates the 19 banks will share about $395 million in fees. ‘We want to underpromise and overdeliver,’ Amodei said."], "why": "The largest listing on record now tests whether public investors will fund a $901 billion compute bill, and the China screen shows national security reaching into who gets an allocation.", "c": {"L": 0, "LL": 0, "C": 5, "LR": 0, "R": 0}, "src": [{"n": "Reuters", "u": "https://www.933thedrive.com/2026/11/13/exclusive-investors-flock-to-anthropic-ipo-but-question-durability-of-ai-lead/", "t": "C"}, {"n": "Yahoo Finance", "u": "https://www.aol.com/articles/anthropic-ceo-dario-amodei-aims-181234000.html", "t": "C"}, {"n": "Bloomberg via Business Standard", "u": "https://www.business-standard.com/world-news/anthropic-ceo-dario-amodei-calls-computing-power-deepest-business-dilemma-126111400181_1.html", "t": "C"}, {"n": "The Decoder", "u": "https://the-decoder.com/banks-bar-chinese-and-hong-kong-investors-from-anthropic-ipo-over-us-export-controls/", "t": "C"}, {"n": "Quartz", "u": "https://qz.com/anthropic-ipo-oversubscribed-roadshow-demand-111126", "t": "C"}], "framing": "", "min": 1, "front": true, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "fig": {"v": "$901 billion", "l": "Commitments in the latest filing, mostly compute"}}, {"id": "s4", "sec": "AI", "sid": "s-ai", "h": "Ontario’s top court keeps publishers’ copyright suit against OpenAI", "s": "The Court of Appeal for Ontario on Friday unanimously dismissed OpenAI’s challenge to its jurisdiction over a suit by Canadian news publishers. The publishers plead copyright infringement, breach of their sites’ terms of use and unjust enrichment.", "paras": ["The Court of Appeal for Ontario on Friday unanimously dismissed OpenAI’s challenge to its jurisdiction over a suit by Torstar, Postmedia, The Globe and Mail, The Canadian Press and CBC/Radio-Canada, upholding Justice Jessica Kimmel of the Superior Court. OpenAI argued the alleged copying took place beyond Canada’s reach. ‘Ontario has a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">real and substantial connection<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The test comes from Club Resorts v. Van Breda (2012), where the Supreme Court of Canada listed presumptive factors such as a contract made, or a tort committed, in the province.<\/span><\/button> to the alleged breaches,’ Justice B.W. Miller wrote. The publishers plead copyright infringement, breach of their sites’ <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">terms of use<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A contract claim does not depend on the fair-dealing defence, which answers only copyright, so it can survive even if the copying is excused.<\/span><\/button> and unjust enrichment. OpenAI owes $100,000 in costs."], "why": "Publishers can now sue an AI developer where their readers are rather than where its servers run, a route other national presses can follow.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Broadcast Dialogue", "u": "https://broadcastdialogue.com/ontario-court-rejects-openai-appeal-in-canadian-media-lawsuit/", "t": null}, {"n": "Canadian Press via BNN Bloomberg", "u": "https://www.bnnbloomberg.ca/business/artificial-intelligence/2026/11/13/court-allows-news-publishers-copyright-lawsuit-against-openai-to-go-ahead/", "t": "C"}, {"n": "CTV News", "u": "https://www.ctvnews.ca/sci-tech/article/court-allows-news-publishers-copyright-lawsuit-against-openai-to-go-ahead/", "t": "C"}, {"n": "The Canadian Press", "u": "https://www.thecanadianpressnews.ca/science/court-allows-news-publishers-copyright-lawsuit-against-openai-to-go-ahead/article_afdcee71-4320-5549-9702-4c0b595b7764.html", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-14/s4.webp?h=f3571748", "col": "#3f3729", "cap": "Osgoode Hall in Toronto, seat of the Court of Appeal for Ontario.", "credit": "Thomas1313, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "fig": {"v": "$100,000", "l": "Costs OpenAI was ordered to pay"}}, {"id": "s5", "sec": "AI", "sid": "s-ai", "h": "SAG-AFTRA’s negotiator says performers want AI fakes taken down", "s": "Duncan Crabtree-Ireland told a Web Summit audience in Lisbon that members whose likeness is misused mostly want it removed rather than litigated, Deadline reported. He backed the No FAKES Act.", "paras": ["Duncan Crabtree-Ireland, national executive director of SAG-AFTRA, told a Web Summit audience in Lisbon that ‘90-plus percent of the time’ members whose likeness is misused want it removed rather than litigated, Deadline reported. He backed the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">No FAKES Act<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A pending federal bill that would create a right in voice and likeness and give platforms a notice-and-takedown safe harbor modeled on the copyright system.<\/span><\/button>: ‘What it’s really about is getting platforms to take stuff down when your image, likeness and voice is being used without your permission.’ He said 10 to 15 percent of members want the union to refuse AI entirely, and described his own likeness being misused during the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">2023 strike<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The 118-day walkout ended with the first contract terms requiring consent and pay for digital replicas of performers.<\/span><\/button>."], "why": "Publicity rights are shifting from damages to takedowns, and the practice that grows around them will look more like notice work than trial work.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Deadline via Yahoo", "u": "https://www.yahoo.com/entertainment/celebrity/articles/sag-aftra-boss-says-ai-124220292.html", "t": null}, {"n": "Variety", "u": "https://variety.com/2026/film/news/sag-aftra-artificial-intelligence-pensions-concerns-1236746577/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "fig": {"v": "10 to 15 percent", "l": "Members who want the union to refuse AI entirely"}}, {"id": "s6", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Producer prices rise 6.5 percent on the year; the two-year yield jumps", "s": "The producer price index for final demand rose 0.3 percent in October, below the 0.4 percent economists expected, the Bureau of Labor Statistics said Friday. Futures priced a December rate increase as close to certain, according to CME data cited by ActionForex.", "paras": ["The producer price index for final demand rose <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">0.3 percent in October<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The miss is smaller than it looks: the bureau revised June through September, and September now shows a 1.4 percent monthly gain.<\/span><\/button>, below the 0.4 percent economists expected, but 6.5 percent from a year earlier, the largest 12-month gain since November 2022, the Bureau of Labor Statistics said Friday. Goods prices rose 10.2 percent over the year. Prices excluding food, energy and trade services rose 0.5 percent on the month and 4.9 percent on the year.", "Treasury’s par curve closed with the two-year note at 4.88 percent, up from 4.56 percent on Monday, the 10-year at 5.15 percent and the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">30-year at 5.47 percent<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The 20-year closed at 5.52 percent, above the 30-year, a kink the curve has carried since the Treasury revived the 20-year bond in 2020.<\/span><\/button>. Futures priced a December rate increase as close to certain, with the debate now between a quarter point and a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">half<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The odds of at least 50 basis points of tightening by January rose to 76.6 percent from 15.8 percent a week earlier, on the same CME data.<\/span><\/button>, according to CME FedWatch data cited by ActionForex. The S&amp;P 500 fell 0.4 percent to 7,561.67 and the Nasdaq 0.9 percent."], "why": "Every deal in this paper prices off that curve, and a two-year yield up a third of a point in a week reprices loans, converts and IPO multiples days before Anthropic sets its price.", "c": {"L": 0, "LL": 1, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Bureau of Labor Statistics", "u": "https://www.bls.gov/news.release/ppi.nr0.htm", "t": null}, {"n": "U.S. Treasury yield curve", "u": "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/", "t": "C"}, {"n": "AP via KRMG", "u": "https://krmg.com/2026/11/13/how-major-us-stock-indexes-fared-friday-11-13-2026/", "t": "C"}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/11/13/treasury-yields-fed-rates.html", "t": "C"}, {"n": "CNN", "u": "https://www.cnn.com/2026/11/13/economy/us-wholesale-inflation-ppi-october", "t": "LL"}, {"n": "ActionForex", "u": "https://www.actionforex.com/action-insight/market-overview/weekly-report/660879-hawkish-fed-repricing-punishes-non-yielders-gold-and-bitcoin-slide-as-dollar-surges-to-2026-high/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-14/s6.webp?h=60c144de", "col": "#263854", "cap": "The Eccles Building, the Federal Reserve’s headquarters in Washington.", "credit": "Federalreserve, Public domain / Wikimedia Commons", "pull": null, "chart": {"type": "line", "t": "Treasury par yields at Friday’s close", "rows": [["Two-year", 4.88, "4.88 percent"], ["10-year", 5.15, "5.15 percent"], ["30-year", 5.47, "5.47 percent"]]}}, {"id": "s7", "sec": "Markets & Deals", "sid": "s-mkt", "h": "H&amp;R REIT unitholders reject a C$6.7 billion breakup backed by Blackstone", "s": "Unitholders on Friday voted down a plan of arrangement led by GO Residential REIT, backed by Blackstone Real Estate and an affiliate of chief executive Tom Hofstedter. H&amp;R ended the agreement with no fee owed and restored its monthly distribution.", "paras": ["Unitholders of H&amp;R Real Estate Investment Trust on Friday voted down a plan of arrangement under which GO Residential REIT, backed by Blackstone Real Estate, Crestpoint, PSP Investments and an affiliate of chief executive Tom Hofstedter, would have broken up the trust. The deal needed two-thirds of votes cast and a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">majority of the minority<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Canada’s MI 61-101 requires a separate minority vote when an insider sits on the buying side; the chief executive’s holding company, CRAL, was excluded from that count.<\/span><\/button>. H&amp;R ended the agreement with no fee owed, restored its monthly distribution and plans a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">special payout<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The board’s plan tracks the list Mill Pond’s Daniel Farb published before the vote: terminate, restore distributions, sell the industrial portfolio and refresh the board.<\/span><\/button> of about C$2.30 a unit before year-end, asset sales and up to four new trustees."], "why": "Pension holders including BCI, CalSTRS and New York City’s funds beat an insider-backed deal, which is the minority vote working as designed.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "H&R REIT release", "u": "https://www.tradingview.com/news/prnewswire:a75b4607f9806:0-h-r-reit-announces-next-steps-to-drive-unitholder-value-following-termination-of-arrangement-agreement-with-consortium-of-purchasers/", "t": null}, {"n": "The Real Deal", "u": "https://therealdeal.com/national/2026/11/13/hr-reit-shareholders-vote-down-go-deal", "t": "C"}, {"n": "GO Residential release", "u": "https://www.newswire.ca/news-releases/go-residential-reit-announces-results-of-special-meeting-and-termination-of-arrangement-agreement-with-h-amp-r-real-estate-investment-trust-898136904.html", "t": null}, {"n": "Bloomberg", "u": "https://bloomberg.com/news/articles/2026-11-13/h-r-investors-vote-down-sale-to-blackstone-and-go-rebuking-ceo", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "fig": {"v": "C$2.30", "l": "Planned special payout a unit, before year-end"}}, {"id": "s8", "sec": "Law & the Courts", "sid": "s-law", "h": "The Supreme Court takes Robinhood’s IPO disclosure case", "s": "The Supreme Court on Friday agreed to hear Robinhood Markets v. Sodha, on whether an issuer can be liable under the Securities Act of 1933 for omitting material interim financial information. The same conference added Mullin v. RAICES, the asylum proclamation case.", "paras": ["The Supreme Court on Friday agreed to hear Robinhood Markets v. Sodha, No. 25-944, which asks whether an issuer can be liable under the Securities Act of 1933 for omitting <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">material interim financial information<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Robinhood listed on July 29, 2021, weeks before its second-quarter figures were due; the claim is that the weakening quarter was already visible inside the company.<\/span><\/button> without any showing that the omission made an <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">affirmative statement misleading<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>In Macquarie v. Moab Partners (2024) the Court held a pure omission is not actionable under Rule 10b-5(b); this case asks whether Section 11 of the 1933 Act differs.<\/span><\/button>. Investors led by Vinod and Amee Sodha say the offering documents hid a shift in revenue toward meme stocks and dogecoin. The Ninth Circuit revived the suit in August 2025 after Judge Edward Chen dismissed it.", "The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Solicitor General<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The justices called for the government’s views on June 1; its brief came Oct. 7, and the case was relisted once before Friday’s grant.<\/span><\/button> backed Robinhood. Jeffrey Wall of Gibson Dunn represents the company; Deepak Gupta and Amanda Lawrence represent the investors. Argument is likely in the spring. The same conference added Mullin v. RAICES, the administration’s appeal of rulings against its proclamation suspending asylum at the southern border, which stays in force; the Court declined to review the class certification."], "why": "Section 11 is the strict-liability exposure every issuer and underwriter drafts against, and a win for Robinhood would narrow what an S-1 must say about the quarter in progress.", "c": {"L": 0, "LL": 1, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "SCOTUSblog", "u": "https://www.scotusblog.com/2026/11/supreme-court-agrees-to-hear-case-on-trump-administrations-suspension-of-asylum/", "t": null}, {"n": "Reuters via Investing.com", "u": "https://www.investing.com/news/stock-market-news/us-supreme-court-to-consider-lawsuit-over-robinhoods-2021-ipo-5026347", "t": "C"}, {"n": "Supreme Court docket", "u": "https://www.supremecourt.gov/docket/docketfiles/html/public/25-944.html", "t": null}, {"n": "CBS News", "u": "https://www.cbsnews.com/news/supreme-court-trump-asylum-u-s-mexico-border/", "t": "C"}, {"n": "Roll Call", "u": "https://rollcall.com/2026/11/13/trumps-invasion-asylum-ban-to-face-justices/", "t": "C"}, {"n": "Washington Post", "u": "https://www.washingtonpost.com/politics/2026/11/13/supreme-court-trump-asylum/070276aa-df94-11f1-912c-4fbb80d73f7f_story.html", "t": "LL"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-14/s8.webp?h=d6ca00bb", "col": "#18395e", "cap": "The west facade of the Supreme Court in Washington.", "credit": "Joe Ravi, CC BY-SA 3.0 / Wikimedia Commons", "pull": null}, {"id": "s9", "sec": "Law & the Courts", "sid": "s-law", "h": "Weil adopts a liquidation plan as Gibson Dunn takes its funds group", "s": "Weil’s partners voted on Friday to adopt a plan of liquidation, Reuters reported. Gibson Dunn is taking Weil’s 120-lawyer private funds practice from January, the ABA Journal reported.", "paras": ["Partners of Weil, Gotshal &amp; Manges voted on Friday to adopt a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">plan of liquidation<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Weil is paying staff for 90 days plus stay bonuses, the contrast with Dewey &amp; LeBoeuf’s 2012 bankruptcy that Jonah Perlin drew on Steve Vladeck’s One First.<\/span><\/button> and named Ben Schrag and James Mesterharm co-chief restructuring officers, Reuters reported. Gibson Dunn said the same day it is taking Weil’s 120-lawyer <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">private funds practice<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Separately Crosby, a two-year-old AI-native firm that has raised about $85 million, has bid for Weil’s name and some internal data, including templates that could tune legal models.<\/span><\/button>, including 23 partners in New York, Washington and London and co-managing partner Jonathon Soler, from January, the ABA Journal reported. Kirkland is taking about 40 Weil lawyers. ‘This is the most sought-after cross-border funds team in the market,’ said Gibson Dunn’s Shukie Grossman."], "why": "The largest firm collapse since Dewey is being sold practice by practice, and a funds group that moves whole takes its sponsor clients with it.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "ABA Journal", "u": "https://www.abajournal.com/news/article/gibson-dunn-snags-120-lawyer-group-from-weil-including-firms-co-managing-partner", "t": null}, {"n": "Reuters via AOL", "u": "https://www.aol.com/articles/weil-gotshal-manges-approves-liquidation-185151000.html", "t": "C"}, {"n": "Law360", "u": "https://www.law360.com/articles/2549214/gibson-dunn-gains-120-funds-lawyers-from-weil", "t": "C"}, {"n": "Global Legal Post", "u": "https://www.globallegalpost.com/news/gibson-dunn-brings-on-weil-co-managing-partner-soler-in-new-york-552553437", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "fig": {"v": "23 partners", "l": "In the funds group moving to Gibson Dunn"}}, {"id": "s10", "sec": "The World", "sid": "s-world", "h": "An LNG tanker strikes a mine in Hormuz, Iran says", "s": "Iran’s Revolutionary Guard navy said through state media that a liquefied natural gas tanker hit a naval mine and exploded in the Strait of Hormuz on Friday, Reuters reported. It named no vessel and gave no casualties.", "paras": ["Iran’s Revolutionary Guard navy said through state media that a liquefied natural gas tanker hit a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">naval mine<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>At least 10 ships were hit in the first 10 days of November after 37 attacks in October, a monthly record, by the Washington Institute’s count.<\/span><\/button> and exploded in the Strait of Hormuz on Friday on what it called an unauthorized route; it named no vessel and gave no casualties, Reuters reported. The U.S. military says it has cleared the strait’s routes of mines. Treasury Secretary <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Scott Bessent<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>He runs Operation Economic Outcast, the sanctions campaign begun in August alongside the naval blockade, which targets Gulf bank branches that handle Iranian transactions.<\/span><\/button> told CNBC he had moved from his home to a military base on Secret Service advice and called Iran ‘like a dangerous cornered animal.’ Brent settled at $96.21."], "why": "Gulf cargo insurance prices off claims like this one, and a Treasury secretary sleeping on a base shows how personal the sanctions war has become.", "c": {"L": 0, "LL": 1, "C": 3, "LR": 0, "R": 1}, "src": [{"n": "Reuters via Times of Israel", "u": "https://www.timesofisrael.com/liveblog_entry/us-treasurys-bessent-says-he-wont-be-cowed-by-iranian-death-threats/", "t": "C"}, {"n": "Reuters via gCaptain", "u": "https://gcaptain.com/iran-says-tanker-carrying-lng-hit-mine-suffered-explosion-in-hormuz/", "t": "C"}, {"n": "Fox News", "u": "https://www.foxnews.com/live-news/oil-prices-war-strikes-donald-trump-iran-11-13-26", "t": "R"}, {"n": "CBS News", "u": "https://www.cbsnews.com/live-updates/us-iran-war-trump-nuclear-material-no-deal/", "t": "C"}, {"n": "CNN", "u": "https://www.cnn.com/2026/11/13/middleeast/iran-targets-us-military-site-in-gulf-first-time-in-two-months-intl", "t": "LL"}], "framing": "Fox News described ‘a relative lull in kinetic warfare’; CNN’s headline said Iran struck at a U.S. site ‘as hopes for a deal fade.’", "min": 1, "front": false, "img": "img/2026-11-14/s10.webp?h=0617c083", "col": "#2b3a47", "cap": "A U.S. Navy frigate passes a tanker after transiting the Strait of Hormuz in 1990.", "credit": "Department of Defense. American Forces Information Service. Defense Visual Information Center. 1994, Public domain / Wikimedia Commons", "pull": null, "fig": {"v": "$96.21", "l": "Brent settlement on Friday"}}, {"id": "s11", "sec": "The World", "sid": "s-world", "h": "Europe names its Ukraine negotiators, and Moscow withholds a seat", "s": "European Union leaders meeting in Dublin agreed that Britain, France, Germany, Italy and Poland will represent Europe at the next round of Ukraine talks, RTÉ reported. Kremlin spokesman Dmitry Peskov said Moscow had not agreed to include them.", "paras": ["European Union leaders meeting informally in Dublin agreed that the E5, made up of Britain, France, Germany, Italy and Poland, will represent Europe alongside EU institutions at the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">next round<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Russia’s lead negotiator, Vladimir Medinsky, has said of the Europeans: ‘We don’t really understand what their status is here.’<\/span><\/button> of Ukraine talks, expected in Abu Dhabi next week, RTÉ reported. Kremlin spokesman Dmitry Peskov said Moscow had not agreed to include them and would decide ‘once we understand their genuine intention and readiness to contribute to the peace process.’ <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Kaja Kallas<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>The former Estonian prime minister, whom Moscow put on a wanted list in 2024, said Russia does not want her because she is ‘too strong.’<\/span><\/button>, the EU’s foreign policy chief, is not on the team. Leaders take up Ukraine’s financing at a summit on Nov. 26 and 27."], "why": "A seat decides who writes the terms of sanctions relief, and frozen Russian assets in Europe are a lever Washington does not hold.", "c": {"L": 1, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "RTÉ", "u": "https://www.rte.ie/news/ireland/2026/1113/1599056-eu-leaders-dublin/", "t": null}, {"n": "Kyiv Independent", "u": "https://kyivindependent.com/european-leaders-agree-on-joint-team-for-ukraine-peace-negotiations-costa-says", "t": "C"}, {"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/13/russias-demands-come-from-different-reality-as-war-efforts-stagnates", "t": "L"}, {"n": "BBC", "u": "https://www.bbc.co.uk/news/articles/ckn80j9jv3jxo", "t": "C"}, {"n": "The Hill", "u": "https://thehill.com/policy/international/6217318-macron-europe-ukraine-support/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}, {"id": "s12", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "Subscribers refile a suit to unwind the Paramount merger", "s": "A group of consumers has refiled a suit in California federal court asking a jury to unwind the merger, or force the sale of HBO Max, CNN and the Warner studio, The Hollywood Reporter and TheWrap reported Friday.", "paras": ["A group of consumers has <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">refiled a suit<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The case has been dismissed twice, and The Hollywood Reporter says this amended complaint is believed to be the plaintiffs’ last chance to plead it.<\/span><\/button> in California federal court asking a jury to unwind Skydance’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">$110 billion<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The deal closed in October only after settlements with 12 state attorneys general and the Writers Guild, leaving nearly $80 billion of net debt.<\/span><\/button> Paramount acquisition of Warner Bros. Discovery, or to force the sale of HBO Max, CNN and the Warner studio, and to keep Paramount+ and HBO Max apart, The Hollywood Reporter and TheWrap reported Friday. The complaint cites the bundle planned for early 2027 and a target of at least $6 billion in annual savings. ‘That choice between independent sellers has been eliminated,’ it says."], "why": "Private plaintiffs rarely unwind a closed merger, but a complaint that survives would put the bundle, and the savings promised to lenders, in front of a jury.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "The Hollywood Reporter via Yahoo", "u": "https://uk.finance.yahoo.com/news/hbo-max-paramount-bundle-targeted-192507213.html", "t": null}, {"n": "TheWrap", "u": "https://thewrap.com/industry-news/public-policy-legal/skydance-consumer-lawsuit-paramount-warner-bros-discovery-merger-refiled", "t": "C"}, {"n": "The Hollywood Reporter", "u": "https://www.hollywoodreporter.com/business/business-news/hbo-max-paramount-bundle-lawsuit-1236754933/", "t": "C"}, {"n": "Yahoo Entertainment", "u": "https://www.yahoo.com/entertainment/tv/articles/subscribers-sue-stop-paramount-hbo-120000597.html", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-14/s12.webp?h=6ca0d971", "col": "#3b3829", "cap": "The Melrose Avenue gate of Paramount’s Hollywood lot.", "credit": "Chris Brown, CC BY 2.0 / Wikimedia Commons", "pull": null, "fig": {"v": "$6 billion", "l": "Annual savings target the complaint cites"}}, {"id": "s13", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "John Fisher sells the San Jose Earthquakes and PayPal Park for $625 million", "s": "Fisher agreed to sell the MLS club, including the privately financed PayPal Park, to Heath Freeman, co-founder of Alden Global Capital, ESPN reported Friday. Freeman is buying as an individual, not through Alden, the San Francisco Chronicle said.", "paras": ["Fisher, who is moving the Athletics to Las Vegas, agreed to sell Major League Soccer’s San Jose Earthquakes, including the privately financed PayPal Park, to Heath Freeman, co-founder of the hedge fund <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Alden Global Capital<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Owner of the Chicago Tribune, the Denver Post and the San Jose Mercury News, the paper that covers the club.<\/span><\/button>, at an enterprise value of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">$625 million<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Forbes values the club at $540 million, 22nd in MLS; Real Salt Lake and the Utah Royals changed hands last year for about $600 million.<\/span><\/button>, ESPN reported Friday, confirming Sportico. Freeman is buying as an individual, not through Alden, the San Francisco Chronicle said. MLS owners approved the sale unanimously, and Moelis ran a process that began in June 2025. Fisher and Lew Wolff paid a $20 million expansion fee in 2007."], "why": "A price above the Forbes figure for a mid-table club says MLS franchises now trade on stadium control, and this one comes with its building.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "ESPN", "u": "https://www.espn.com/soccer/story/_/id/50474340/san-jose-earthquakes-sold-625-million-heath-freeman", "t": null}, {"n": "Sportico", "u": "https://www.sportico.com/business/team-sales/2026/mls-san-jose-earthquakes-sold-alden-freeman-1234958433/", "t": "C"}, {"n": "San Francisco Chronicle via Yahoo", "u": "https://sports.yahoo.com/articles/john-fisher-agrees-sell-san-235314409.html", "t": "C"}, {"n": "San Francisco Standard", "u": "https://sfstandard.com/2026/11/13/john-fisher-earthquakes-heath-freeman-bay-area/", "t": "C"}, {"n": "Las Vegas Review-Journal", "u": "https://www.reviewjournal.com/sports/soccer/as-fisher-sells-mls-earthquakes-for-reported-625m-3914076/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "fig": {"v": "$20 million", "l": "Expansion fee Fisher and Lew Wolff paid in 2007"}}], "week": [], "cover": "img/2026-11-14/s1.webp?h=68859d0b"}, {"date": "2026-11-13", "no": 169, "min": 10.0, "stand": "Nvidia loses its founder to a board inquiry, a law-firm clerk is charged with trading on five client deals, the long bond tails again, and Trump says he needs no deal with Iran.", "note": "Editor’s note. 14 items at 2,396 read-words, under the ten-minute cap. Disclosure: Anthropic, whose model compiles this paper, is a defendant in the AI lead and is preparing its own listing. The Nvidia lead rests on the company’s release and ABC News; the reporting on Huang’s personal relationships is the New York Times’s, relayed by CBS and Al Jazeera, and ABC said it could not verify it. Reports differ on the date of the House interview, so none is given. The Cravath charge is the Justice Department’s; the SEC complaint was not opened, and its figures come from a trade summary. The Hancock Whitney deal rests on the companies’ filing; no independent report was found. The auction figures and Fed odds come from market newsletters; closing yields were not confirmed and are not printed. The Simpson Thacher item relays the Financial Times through Above the Law. Posner’s death was first reported Tuesday night; it runs on Thursday’s wire coverage. Not run: the Brooklyn building collapse, now eight dead (cut for the cap); Spain’s housing decree after a general strike; Zelensky’s claim of new Starshield limits, which SpaceX denies; Eisenkot’s first security briefing; the FTC’s $63 million Family Dollar settlement; Foley’s salary match and Latham’s $1 million AI prize; OpenAI’s security agents; Trump’s SEC and CFTC nominees; Dan Hicks’s death; a $10 billion Bears stadium pitch; NFL viewership; the Anthropic book, reported six times covered (no new terms). Magnitude check: the largest announced deal found was Hancock Whitney and Trustmark, about $3.2 billion, run; the largest live bid was the Global Payments take-private, which ended, run. Sourcing limits: the Guardian, BBC and AP sites were not reached directly; the Times was seen by headline; National Review was seen by headline only. Money Stuff’s Thursday issue, on the Nvidia board, was seen in preview; Pro Rata was not retrieved; the Harvard forum’s newest post concerns special equity awards; the Anthropic newsroom had nothing after Nov. 10. No South Florida item cleared the window. Watch: October producer prices at 8:30 a.m. Friday; Supreme Court orders Monday; Nvidia earnings Nov. 17; Anthropic’s pricing Nov. 18; GTA VI on Nov. 19.", "items": [{"id": "s1", "sec": "The Front", "sid": "s-front", "h": "Jensen Huang resigns as Nvidia’s chief; the finance chief takes over", "s": "Jensen Huang resigned on Thursday as president, chief executive and a director of Nvidia, effective immediately, the company said. Colette Kress, the chief financial officer, becomes interim chief executive. A former Synopsys chief executive already on the board was named the company’s first-ever chair.", "paras": ["Jensen Huang resigned on Thursday as president, chief executive and a director of Nvidia, effective immediately, the company said, ending 33 years at the head of the chipmaker he co-founded. Colette Kress, the chief financial officer, becomes interim chief executive and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">keeps the finance job<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Under Sarbanes-Oxley Section 302 the chief executive and the chief financial officer each certify the quarterly report, so on Nov. 17 one person will sign both certifications.<\/span><\/button>. Harvey C. Jones, a former Synopsys chief executive already on the board, was named the company’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">first-ever chair<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Splitting the roles hands an independent director the board agenda and the succession search, the structure proxy advisers press for after a governance failure.<\/span><\/button>.", "The exit follows an inquiry by independent directors and outside counsel into Huang’s relationship with Alice Huang, a former executive at <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Megaspeed<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Singapore filings cited by Reuters show an Alibaba subsidiary financed Speedmatrix, a Malaysian company linked to it, the thread congressional investigators are now pulling.<\/span><\/button> whom U.S. intelligence reportedly believes China’s Ministry of State Security recruited, the New York Times reported. The Times reported on Thursday a second relationship, with Kimberly Powell, Nvidia’s vice president of health care, who reported to him. The shares fell more than 13 percent at the open and closed down 4.3 percent, ABC News reported.", "Third-quarter results stay on Tuesday, Nov. 17, as previously scheduled, the company said. Republican-led House committees have summoned Huang to a closed-door interview, CNN reported, and the Senate Banking chair asked him and Commerce Secretary Howard Lutnick to testify. A <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">securities class action<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Filed in San Jose on Nov. 10, it defines the class as buyers between Oct. 9 and Nov. 8; the stock fell 5.5 percent the day it was filed.<\/span><\/button> is pending. Bernstein’s Stacy Rasgon cut his price target to $200 from $400."], "why": "The founder of the company that supplies nearly every AI build-out is gone days before earnings, and a finance chief now runs it through a congressional inquiry, a class action and a succession nobody planned.", "c": {"L": 1, "LL": 3, "C": 0, "LR": 0, "R": 1}, "src": [{"n": "Nvidia newsroom", "u": "https://nvidianews.nvidia.com/news/nvidia-announces-ceo-transition", "t": null}, {"n": "ABC News", "u": "https://abcnews.com/Business/nvidia-stock-sinks-after-ceo-jensen-huang-resigns/story?id=138076153", "t": "LL"}, {"n": "NPR", "u": "https://www.npr.org/2026/11/12/nx-s1-6037833/jensen-huang-nvidia-stepped-down", "t": "LL"}, {"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/12/why-did-nvidia-ceo-jensen-huang-resign-and-who-is-colette-kress", "t": "L"}, {"n": "Fox Business", "u": "https://www.foxbusiness.com/business-leaders/nvidia-ceo-jensen-huang-resigns-amid-investigation-relationship-alleged-chinese-spy", "t": "R"}, {"n": "CNN", "u": "https://www.cnn.com/2026/11/11/business/live-news/nvidia-jensen-huang-investigation-fallout", "t": "LL"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-13/s1.webp?h=f1a505c3", "col": "#303d17", "cap": "Nvidia’s headquarters in Santa Clara, California.", "credit": "Coolcaesar, CC BY-SA 4.0 / Wikimedia Commons", "pull": {"text": "The Board has full confidence in Colette and the leadership team.", "attr": "Harvey C. Jones, Nvidia statement, Nov. 12"}, "fig": {"v": "4.3 percent", "l": "Nvidia’s fall at Thursday’s close, per ABC News"}}, {"id": "s2", "sec": "The Front", "sid": "s-front", "h": "A Cravath document specialist is charged with trading on five client deals", "s": "Prosecutors in Brooklyn on Thursday charged Chetram Balli, 54, with insider trading ahead of five client deals, for profits of more than $70,000. Bloomberg Law identified the firm as Cravath. Cravath said he was not legal staff and no longer works there.", "paras": ["Prosecutors in Brooklyn on Thursday charged Chetram Balli, 54, a document processing specialist at a major international law firm since about 1989, with <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">insider trading<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Because he owed no duty to the companies he traded, the case rests on the misappropriation theory upheld in United States v. O’Hagan (1997): the fraud is on the firm and clients whose secrets he took.<\/span><\/button> ahead of five client deals between April 2025 and October 2026, for profits of more than $70,000. Bloomberg Law identified the firm as Cravath, Swaine &amp; Moore. Balli was arrested and arraigned the same day on a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">criminal complaint<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A complaint lets prosecutors arrest on a sworn affidavit before a grand jury acts; the Speedy Trial Act then requires an indictment within 30 days.<\/span><\/button> and faces up to 20 years.", "The deals were WiseTech’s purchase of E2open, Schwab’s $660 million deal for Forge Global, Paramount Skydance’s $110 billion acquisition of Warner Bros. Discovery, UHS’s $853 million bid for Talkspace and Viatris’s $1.65 billion deal for Pacira. Prosecutors say he bought about 14,866 E2open shares on May 12, 2025, a stock he had never owned, and sold two days after the May 25 announcement. His last Paramount purchase came about four hours before that merger was announced, Bloomberg Law reported. The SEC filed a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">parallel civil suit<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The SEC counts about eight trades and roughly $55,000, against the Justice Department’s five stocks and more than $70,000; neither agency explained the gap.<\/span><\/button>. Cravath said he was not legal staff and no longer works there."], "why": "Deal secrets at a top M&amp;A firm pass through staff who never sign an engagement letter, and a trade four hours before the year’s largest media merger is exactly what surveillance is built to flag.", "c": {"L": 0, "LL": 1, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "U.S. Attorney, E.D.N.Y.", "u": "https://www.justice.gov/usao-edny/pr/employee-major-international-law-firm-charged-insider-trading", "t": null}, {"n": "Bloomberg Law", "u": "https://news.bloomberglaw.com/business-and-practice/cravath-employee-arrested-in-ny-accused-of-insider-trading", "t": "C"}, {"n": "NBC New York", "u": "https://www.nbcnewyork.com/news/local/crime-and-courts/former-employee-nyc-law-firm-cravath-charged-insider-trading/6571825/", "t": "LL"}, {"n": "Investment Executive", "u": "https://www.investmentexecutive.com/news/regulation/law-firm-employee-accused-of-insider-trading/", "t": "C"}, {"n": "FX News Group", "u": "https://fxnewsgroup.com/forex-news/regulatory/sec-charges-law-firm-employee-with-insider-trading/", "t": "C"}], "framing": "", "min": 1, "front": true, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}, {"id": "s3", "sec": "AI", "sid": "s-ai", "h": "Nonprofits sue five AI developers to halt frontier-model development", "s": "Public Citizen, the Heat Initiative and the Irreplaceable Education Fund sued in San Francisco Superior Court on Thursday, asking a judge to bar further development of advanced models, Reuters reported. The complaint pleads unfair competition and public nuisance. Anthropic, whose model compiles this paper, is a defendant.", "paras": ["Public Citizen, the Heat Initiative and the Irreplaceable Education Fund sued five AI developers in San Francisco Superior Court on Thursday, asking a judge to bar further development of advanced models including ChatGPT, Gemini and Claude, Reuters reported. The complaint pleads California’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">unfair competition law<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Section 17200 allows only injunctions and restitution, not damages, which is why the plaintiffs ask the court to stop the work rather than pay for it.<\/span><\/button> and public nuisance, and it builds its case on the defendants’ own warnings, citing Dario Amodei and Elon Musk on catastrophic risk.", "‘Nor is any industry granted the right to self-regulate the development of such dangerous products,’ the complaint says. Meta declined to comment and the others did not respond, Reuters said. The suit joins a pending <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Florida action<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>After the state sued in June, OpenAI said it had paused training its most capable models until more safeguards were in place.<\/span><\/button>, in which the attorney general asked in September for an order barring new models without outside oversight, and a separate eight-state suit filed last month."], "why": "A nuisance theory aimed at model training is untested, but it lands six days before Anthropic lists, and it puts a court order to stop the work into every frontier lab’s risk factors.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Reuters via Yahoo Finance", "u": "https://ca.finance.yahoo.com/news/openai-google-anthropic-hit-lawsuit-182622694.html", "t": "C"}, {"n": "The Register", "u": "https://theregister.com/security/2026/11/12/openai-launches-security-products-tells-orgs-theyre-doomed-if-they-dont-use-them/5309500", "t": "C"}, {"n": "Dataconomy", "u": "https://dataconomy.com/2026/11/13/nonprofits-sue-openai-google-and-meta-to-halt-advanced-ai", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-13/s3.webp?h=bb00dd8c", "col": "#2f3c2c", "cap": "San Francisco’s Civic Center, seat of the city’s Superior Court.", "credit": "Kitchen, CC BY 2.0 / Wikimedia Commons", "pull": null}, {"id": "s4", "sec": "AI", "sid": "s-ai", "h": "Chinese AI firms try to lock up Nvidia capacity abroad", "s": "Chinese AI companies are trying to rent Nvidia chips at overseas data centers, Reuters reported Thursday, citing three sources. Procurement records show a blacklisted university linked to China’s army bought H200 chips last month. The Information reported that Commerce is finalizing a licensing rule.", "paras": ["Chinese AI companies are trying to rent Nvidia chips at overseas data centers, with one major cloud provider discussing locking in capacity and smaller labs eyeing Southeast Asian providers, Reuters reported Thursday, citing three sources who fear the Huang scandal will speed the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Remote Access Security Act<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The House passed it 369 to 22 in January and the Senate has not acted; it would reach cloud access, which controls on physical chips do not.<\/span><\/button>. Procurement records show a blacklisted university linked to China’s army bought H200 chips last month. The Information reported that Commerce is finalizing a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">licensing rule<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The draft would require licenses for Blackwell-class chips shipped to Singapore, Malaysia, Thailand and others, exempting U.S.-run centers that block Chinese and Russian access.<\/span><\/button>."], "why": "Export controls target the hardware; the rental market is the gap, and the scandal has turned it into a race.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Reuters via Manila Times", "u": "https://www.manilatimes.net/2026/11/13/business/foreign-business/chinas-ai-firms-seek-nvidia-chip-capacity/2468348", "t": "C"}, {"n": "Forbes", "u": "https://www.forbes.com/sites/jonmarkman/2026/11/12/chinese-ai-firms-rush-to-rent-nvidia-chips-abroad-before-a-new-us-rule/", "t": "C"}, {"n": "Quartz", "u": "https://qz.com/chinese-ai-firms-overseas-nvidia-capacity-crackdown-111226", "t": "C"}, {"n": "The Information", "u": "https://www.theinformation.com/articles/commerce-department-finalizing-long-awaited-ai-remote-access-rule", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}, {"id": "s5", "sec": "Markets & Deals", "sid": "s-mkt", "h": "The 30-year bond tails again as Williams says the Fed has ‘work to do’", "s": "Thursday’s $25 billion reopening of the 30-year bond cleared at 5.441 percent, 0.4 basis point above the when-issued yield, investingLive reported. Dealers were left with 11.39 percent, the most since August. All three coupon auctions this week tailed.", "paras": ["Thursday’s $25 billion reopening of the 30-year bond cleared at 5.441 percent, 0.4 basis point above the when-issued yield, the long bond’s second straight <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">tail<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Primary dealers must bid at every auction, so when end investors step back the dealers absorb the shortfall and carry it on their balance sheets.<\/span><\/button>, investingLive reported. The bid-to-cover ratio fell to 2.36 from 2.54 in October, and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">indirect bidders<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Bids routed through dealers for foreign central banks and other institutions, the share the market reads as a gauge of overseas demand.<\/span><\/button> took 68.11 percent against 72.32 percent. Dealers were left with 11.39 percent, the most since August. All three coupon auctions this week tailed.", "‘We still have work to do,’ New York Fed President John Williams said Thursday evening, Reuters reported, as markets priced a quarter-point increase from the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">3.75 to 4 percent range<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Two more quarter-point moves, in December and January, would take the range to 4.25 to 4.5 percent.<\/span><\/button> in December and another in January. Cleveland’s Beth Hammack favored ‘smaller increments, more frequent.’ Initial jobless claims rose 9,000 to 200,000. October producer prices are due at 8:30 a.m. Friday."], "why": "Every deal in this paper is priced off the long end, and soft demand at 5.4 percent with hikes back on the table raises the cost of every financing in the pipeline.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "investingLive", "u": "https://investinglive.com/news/us-30-year-bond-auction-tails-as-demand-disappoints-for-second-straight-day/", "t": null}, {"n": "Reuters via WBOW", "u": "https://1027wbow.com/2026/11/12/feds-williams-says-central-bank-has-work-to-do-to-get-inflation-back-on-target/", "t": "C"}, {"n": "TheStreet Pro", "u": "https://pro.thestreet.com/stock-market-today/2026-11-12", "t": "C"}, {"n": "Anadolu", "u": "https://www.aa.com.tr/en/economy/us-weekly-jobless-claims-rise-to-200-000-above-expectations/4122947", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-13/s5.webp?h=983d888b", "col": "#38392a", "cap": "The Treasury Building in Washington.", "credit": "MeanieHyaena, CC BY 4.0 / Wikimedia Commons", "pull": null, "chart": {"type": "bar", "t": "30-year auctions, indirect bidders’ share", "rows": [["October", 72.32, "72.32 percent"], ["November", 68.11, "68.11 percent"]]}}, {"id": "s6", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Hancock Whitney agrees to buy Trustmark for about $3.2 billion in stock", "s": "Hancock Whitney agreed on Thursday to buy Trustmark in an all-stock deal, the companies said in a release filed with the SEC. Trustmark holders get 0.7463 Hancock Whitney shares each. Closing is expected late in the first quarter of 2027.", "paras": ["Hancock Whitney agreed on Thursday to buy Trustmark in an all-stock deal valued at about $3.2 billion, creating a lender with about $58 billion in assets across six Southeastern states, the companies said in a release filed with the SEC. Trustmark holders get 0.7463 Hancock Whitney shares each and will own 35 percent. The banks project about 7 percent accretion to 2028 earnings and about 7 percent dilution to <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">tangible book value<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Bank investors judge a stock deal by how long the buyer takes to rebuild per-share tangible equity; an earn-back under three years is generally treated as acceptable.<\/span><\/button>, earned back in about 2.8 years. Wachtell Lipton advises the buyer and Covington &amp; Burling advises <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Trustmark<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Based in Jackson, Miss., while the buyer is based in Gulfport, so the deal combines two banks from the same state.<\/span><\/button>. Closing is expected late in the first quarter of 2027."], "why": "The largest announced deal found in the window, it signals that regional bank consolidation is back on the table at a dilution investors once punished.", "c": {"L": 0, "LL": 0, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "Hancock Whitney release, SEC filing", "u": "https://www.sec.gov/Archives/edgar/data/0000750577/000119312526457037/hwc-ex99_1.htm", "t": null}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "fig": {"v": "$58 billion", "l": "in assets for the combined lender"}}, {"id": "s7", "sec": "Markets & Deals", "sid": "s-mkt", "h": "CD&R and GTCR walk away from a take-private of Global Payments", "s": "GTCR and its partner Clayton, Dubilier and Rice have dropped early-stage talks to take Global Payments private, Reuters reported on Thursday. Talks could resume, or another buyer could emerge, the sources said.", "paras": ["Clayton, Dubilier &amp; Rice and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">GTCR<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Already a Global Payments shareholder, having taken stock when it and FIS sold Worldpay to the company in a deal agreed in 2025.<\/span><\/button> have dropped early-stage talks to take Global Payments private, Reuters reported on Thursday, citing sources who pointed to ‘the complexities of arranging a take-private of this scale.’ The payments processor has a market value of about $26.4 billion. Talks could resume, or another buyer could emerge, the sources said. Reuters noted that lenders are scrutinizing leverage on the largest buyouts as borrowing costs rise."], "why": "Two sponsors walking from a $26 billion target shows that financing, not appetite, now sets the ceiling on buyouts.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "Reuters via SRN News", "u": "https://srnnews.com/exclusive-cdr-gtcr-drop-pursuit-of-global-payments-sources-say/", "t": "C"}, {"n": "StreetInsider", "u": "https://www.streetinsider.com/Mergers+and+Acquisitions/CD&R+and+GTCR+drop+pursuit+of+Global+Payments+takeover+-+Reuters/27334190.html", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "fig": {"v": "$26.4 billion", "l": "Global Payments’ market value"}}, {"id": "s8", "sec": "Law & the Courts", "sid": "s-law", "h": "Sidley lines up at least 50 Weil lawyers as Simpson Thacher goes dark", "s": "Sidley Austin is poised to take at least 50 lawyers, including 12 partners, from Weil in New York, Bloomberg Law reported on Thursday. Skadden is hiring three Weil partners. Simpson Thacher said it will stop publicly reporting its financial results.", "paras": ["Sidley Austin is poised to take at least 50 lawyers, including 12 partners, from <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Weil, Gotshal &amp; Manges<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Its partners voted on Nov. 10 to dissolve the firm; Gibson Dunn had already taken a 120-lawyer funds group and Kirkland about 40 lawyers.<\/span><\/button> in New York, across M&amp;A, private equity, finance, litigation and technology transactions, Bloomberg Law reported on Thursday. Skadden is hiring three Weil partners: Navneeta Rekhi in private equity and Max Scott in technology deals, both in the Bay Area, and Steve Argeris in Washington, a former general counsel of the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Carolina Panthers’ parent<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Tepper Sports &amp; Entertainment; the NFL now lets approved funds buy minority team stakes, which is what feeds demand for team-side deal lawyers.<\/span><\/button>.", "Simpson Thacher &amp; Bartlett said it will stop <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">publicly reporting<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Law firms are partnerships with no disclosure duty, so the American Lawyer tables rest on what firms volunteer; the magazine says it will keep publishing estimates.<\/span><\/button> its financial results, effective immediately, Above the Law reported, citing the Financial Times. The firm said the metrics ‘do not fully reflect the value we provide to our clients.’ It reported 2025 revenue of $3.55 billion, up 22.5 percent. Kirkland &amp; Ellis stopped in early October, and Paul, Weiss the week before Simpson."], "why": "The Weil break-up has become a pricing event for partner talent, just as elite firms go dark and leave laterals less to compare.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Bloomberg Law", "u": "https://news.bloomberglaw.com/business-and-practice/sidley-to-bring-on-group-of-12-partners-from-weil-in-new-york", "t": "C"}, {"n": "Bloomberg Law", "u": "https://news.bloomberglaw.com/business-and-practice/skadden-hires-weil-private-equity-sports-ip-deals-partners", "t": "C"}, {"n": "Above the Law", "u": "https://abovethelaw.com/2026/11/simpson-thacher-says-financial-metrics-provide-only-a-limited-view-of-a-firm-so-now-you-get-no-view-at-all/", "t": "C"}, {"n": "Financial Times", "u": "https://www.ft.com/content/31fe2e2d-630d-47c6-b747-54d4310ebf79", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-13/s8.webp?h=d0e4f98d", "col": "#2e3945", "cap": "The General Motors Building at 767 Fifth Avenue, Weil’s New York headquarters.", "credit": "Tdorante10, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "fig": {"v": "$3.55 billion", "l": "Simpson Thacher’s 2025 revenue"}}, {"id": "s9", "sec": "Law & the Courts", "sid": "s-law", "h": "Richard Posner, the judge who taught law to count costs, dies at 87", "s": "Richard A. Posner, who sat on the Seventh Circuit for 36 years, has died at 87, the Associated Press reported. He was chief judge from 1993 to 2000 and retired abruptly in 2017.", "paras": ["Richard A. Posner, who sat on the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Seventh Circuit<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The federal appeals court in Chicago for Illinois, Indiana and Wisconsin, which is why the marriage cases from two of those states came to his panel.<\/span><\/button> for 36 years, has died at 87, the University of Chicago Law School confirmed, the Associated Press reported. Appointed by Ronald Reagan in 1981, he was chief judge from 1993 to 2000 and retired abruptly in 2017. He wrote about 3,300 opinions and more than 60 books, the Chicago Sun-Times reported, among them <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">‘Economic Analysis of Law’<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>First published in 1973, it argued that common-law rules tend toward efficiency, the premise behind antitrust’s consumer-welfare standard.<\/span><\/button>, and in 2014 he wrote the ruling that struck down same-sex marriage bans in Indiana and Wisconsin."], "why": "Every first-year taught to ask what a rule costs is reading Posner, and his pace of about a book a year is unlikely to be matched.", "c": {"L": 1, "LL": 1, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "AP via ABC News", "u": "https://abcnews.com/US/wireStory/richard-posner-prolific-legal-scholar-outspoken-appeals-court-138085266", "t": "LL"}, {"n": "Above the Law", "u": "https://abovethelaw.com/2026/11/judge-richard-posner-the-model-of-a-scholarly-jurist-dies-at-87/", "t": "C"}, {"n": "New York Times", "u": "https://www.nytimes.com/2026/11/11/us/richard-posner-dead.html", "t": "L"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "fig": {"v": "about 3,300", "l": "opinions, per the Chicago Sun-Times"}}, {"id": "s10", "sec": "The World", "sid": "s-world", "h": "Trump says ‘We don’t need a deal with Iran’ and takes Vance off the file", "s": "President Trump wrote on Thursday that the United States has Iran’s money and ‘their Strait,’ USA Today and ABC News reported. A White House official would not say whether talks had ended. Trump told Hugh Hewitt a strike was possible.", "paras": ["President Trump wrote on Thursday that ‘We don’t need a deal with Iran. Those days have long since passed,’ saying the United States has Iran’s money and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">‘their Strait’<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>Iran says at least 12 tankers were hit in 12 days; Central Command says about 4,000 ships have crossed with U.S. help.<\/span><\/button>, and told <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Vice President JD Vance<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>He helped broker the June memorandum of understanding that collapsed over Hormuz, and wrote on X on Nov. 4 that ‘The reason we lost is the war.’<\/span><\/button> to turn to alleged corruption and crime in Democratic-run cities and states, USA Today and ABC News reported. A White House official would not say whether talks had ended.", "Asked by Hugh Hewitt later that day about striking Iran, Trump said ‘it’s possible I would do that right now’ if he saw things going the other way, the Times of Israel reported. He told CNN he would consider it a defeat to leave office with Iran’s current leadership in power. Iran’s parliament speaker, Mohammad Bagher Ghalibaf, says Tehran sent a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">seven-condition proposal<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The terms include lifting the blockade and sanctions, releasing frozen funds and a formal end to the war, Al Jazeera reported.<\/span><\/button> through Qatar and awaits a reply."], "why": "A president calling talks unnecessary keeps oil and shipping priced for war, and moving Vance off the file removes the official most invested in the last deal.", "c": {"L": 1, "LL": 2, "C": 0, "LR": 0, "R": 1}, "src": [{"n": "USA Today via Yahoo", "u": "https://www.yahoo.com/news/politics/articles/trump-says-deal-iran-not-223633935.html", "t": null}, {"n": "CNN via KITV", "u": "https://www.kitv.com/news/national/trump-tells-vance-to-turn-his-focus-away-from-iran-we-don-t-need-a/article_c993e054-e72e-503f-9915-46e676153306.html", "t": "LL"}, {"n": "ABC News", "u": "https://abcnews.com/International/live-updates/iran-live-updates-americans-tired-forever-wars-araghchi/?id=137967256", "t": "LL"}, {"n": "Al Jazeera", "u": "https://www.aljazeera.com/features/2026/11/13/why-is-trump-saying-no-deal-necessary-with-iran-as-he-sidelines-jd-vance", "t": "L"}, {"n": "National Review", "u": "https://www.nationalreview.com/corner/of-course-vance-can-t-execute-an-iran-policy-he-publicly-scorns", "t": "R"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-13/s10.webp?h=9c10d771", "col": "#443429", "cap": "The Strait of Hormuz from the space shuttle.", "credit": "NASA, Public domain / Wikimedia Commons", "pull": null}, {"id": "s11", "sec": "The World", "sid": "s-world", "h": "Putin offers a ‘humanitarian mission’ for Kostiantynivka", "s": "Vladimir Putin proposed a demining and evacuation mission for the contested Donetsk city of Kostiantynivka after meeting Steve Witkoff and Jared Kushner, Kremlin aide Yury Ushakov said. The envoys then met Volodymyr Zelensky in Dublin. Prisoner swap numbers were still not final.", "paras": ["Vladimir Putin proposed a demining and evacuation mission for the contested Donetsk city of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Kostiantynivka<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>Putin said any foreign forces deployed there would be legitimate targets; Kyiv Post sources say Ukrainian troops still hold the city.<\/span><\/button>, modeled on an earlier one in <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Oleshky<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>Kyiv says Russia used that evacuation in occupied Kherson region to move equipment in, which is why it reads the offer as a tactic.<\/span><\/button>, after meeting Steve Witkoff and Jared Kushner in Moscow on Thursday, Kremlin aide Yury Ushakov said, adding that the U.S. side supported it. Witkoff, on his 10th visit, said Europeans will join the next round, Reuters reported. The envoys then met Volodymyr Zelensky in Dublin. Prisoner swap numbers were still not final."], "why": "An offer that could hand Moscow a city it has not taken by force is the first concrete term to come out of the Witkoff channel, and Kyiv has already said no.", "c": {"L": 0, "LL": 1, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Reuters via The Moscow Times", "u": "https://themoscowtimes.com/2026/11/12/kremlin-says-putins-talks-with-us-envoys-were-useful-ukraine-peace-talks-to-continue-a94236", "t": "C"}, {"n": "Kremlin (state source)", "u": "http://en.kremlin.ru/events/president/news/81252", "t": "C"}, {"n": "Kyiv Independent", "u": "https://kyivindependent.com/zelensky-meets-with-trumps-envoys-in-dublin-after-their-summit-with-putin/", "t": "C"}, {"n": "Kyiv Post", "u": "https://www.kyivpost.com/post/89918", "t": "C"}, {"n": "CNN", "u": "https://www.cnn.com/2026/11/12/politics/ukraine-witkoff-kushner-putin-peace-talks-intl", "t": "LL"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}, {"id": "s12", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "Rockstar’s U.K. staff open a union ballot a week before GTA VI ships", "s": "More than 1,600 Rockstar Games employees in Britain began voting on Thursday on recognition of the Rockstar Game Workers Union, The Register reported. The ballot runs to Nov. 26. Closing submissions in the tribunal over 31 firings are due Nov. 17 and 18.", "paras": ["More than 1,600 Rockstar Games employees in Britain began voting on Thursday on recognition of the Rockstar Game Workers Union, a branch of the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">IWGB<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>A small independent union outside the Trades Union Congress, built on organizing couriers, cleaners and other precarious workers rather than salaried studio staff.<\/span><\/button>, in a ballot that runs to Nov. 26, The Register reported. The game launches on Nov. 19. A yes vote would create the largest recognized union in the U.K. games industry, with terms on pay, overtime, pensions, bonuses, leave, consultation on HR policy and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">AI<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>SAG-AFTRA, which backs this campaign, won consent and pay terms on digital replicas for game performers in its 2025 contract.<\/span><\/button>.", "The proposed agreement follows four months of talks, PC Gamer reported. An <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">employment tribunal<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Rockstar tried and failed to have the blacklisting allegations struck out before the hearing.<\/span><\/button> in Scotland is hearing claims over Rockstar’s firing of 31 union members in October 2025, which the union calls union busting and the company says was for gross misconduct over leaks. Closing submissions are due Nov. 17 and 18. ‘We go where the team goes. So if they want a union, they will have a union,’ Jennifer Kolbe, Rockstar’s head of publishing, told Bloomberg."], "why": "AI terms written into a recognition deal at the industry’s biggest studio, during its biggest launch, would give every games employer a template to bargain against.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "The Register", "u": "https://www.theregister.com/software/2026/11/12/rockstar-workers-v
