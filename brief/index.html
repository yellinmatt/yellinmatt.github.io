", "u": "https://www.espn.com/espn/story/_/id/50412085/trump-offers-press-secretary-role-ufc-boss-dana-white", "t": "C"}, {"n": "NBC News", "u": "https://www.nbcnews.com/politics/2026-election/live-blog/rump-taps-stephen-miller-chief-staff-wiles-cabinet-midterm-elections-rcna607914", "t": "LL"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}], "week": [], "cover": "img/2026-11-09/s1.webp?h=f1a505c3"}, {"date": "2026-11-08", "no": 164, "min": 8.3, "stand": "Israel’s president passed over Netanyahu, Washington talked down a new war while carrying its blockade of Iran onto land, and Beijing’s veto sent SoftBank and ABB back to the table.", "note": "EDITOR’S NOTE. The Sunday Special changes the unit of analysis from the day to the week and does not relax the bar: the Front is recency-gated to the hours from Friday 6 p.m. Eastern, and the departments carry items that already cleared a daily brief, plus the Godzilla and Washington items first covered inside the window. This edition was produced about nine hours late, so the window runs to Sunday afternoon. Front 6, sector briefs 10, week in review 7 days, framing notes 1. Conflict disclosed: Anthropic, whose model helps produce this paper, appears in the generator item, the Suno item, the AI brief and the week in review. SoftBank and ABB, held on Nov. 6 for want of a second source, run today on a fresh beat. Not run: a magistrate’s ruling letting Claude Max buyers sue Anthropic (order unread, timing unclear, conflict); the Justice Department joining Texas’s False Claims Act suit against Planned Parenthood and a special master for the golf-course case (below the line on space); Robert Pattinson’s Bond screen test (reported before the window); Berkshire Hathaway’s third quarter and GFL’s Monday bid deadline (space). Sourcing limits: the Financial Times, Bloomberg, Reuters, the BBC, the Guardian and The New York Times were not opened directly; the generator figures rest on the FT via The Next Web; box office figures are Sunday estimates. Missed this week, on the record: AstraZeneca’s reported $10 billion approach for Rhythm Pharmaceuticals on Nov. 4, and the grand-jury subpoenas in the Justice Department’s Dobbs-leak inquiry, reported Nov. 5.", "items": [{"id": "s1", "sec": "The Front", "sid": "s-front", "h": "Herzog gives Eisenkot, not Netanyahu, the first shot at a government", "s": "President Isaac Herzog gave Gadi Eisenkot the first mandate after lawmakers holding 67 of the Knesset’s 120 seats recommended him and 46 backed Benjamin Netanyahu, Al Jazeera and the Associated Press reported. Eisenkot has 28 days, extendable by 14.", "paras": ["President Isaac Herzog on Saturday gave <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Gadi Eisenkot<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>Chief of the General Staff from 2015 to 2019, he later sat in the war cabinet formed after October 7, 2023, and quit it in June 2024 alongside Benny Gantz.<\/span><\/button>, the former army chief who leads the opposition alliance, the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">first mandate<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Under Basic Law: The Government, the president picks the member he judges likeliest to succeed after consulting every faction. He is not bound to choose the leader of the largest list.<\/span><\/button> to form a government, after lawmakers holding 67 of the Knesset’s 120 seats recommended him and 46 backed Prime Minister Benjamin Netanyahu, Al Jazeera and the Associated Press reported. The formal presentation was set for 5 p.m. Israeli time on Sunday, Fox News reported.", "The 67 include a record 19 seats won by Arab-led parties in the October 27 election, among them <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Ra’am<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The Islamist party led by Mansour Abbas. In 2021 it became the first Arab party to join a governing coalition, under Naftali Bennett and Yair Lapid.<\/span><\/button>, while Eisenkot’s own four-party alliance holds 48. Netanyahu’s bloc won 53, and the seven members of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">United Torah Judaism<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>An Ashkenazi ultra-Orthodox alliance. Military conscription of yeshiva students, which Fox News named as a dividing line in the talks, is its central demand.<\/span><\/button> endorsed no one. Winning both ultra-Orthodox parties would give Eisenkot exactly 61, and Al Jazeera noted he could govern with fewer by surviving a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">confidence vote<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A cabinet is installed by a majority of those voting, so abstentions help a minority government. Yitzhak Rabin governed from 1993 with Arab parties backing him from outside the coalition.<\/span><\/button>.", "Eisenkot has 28 days, extendable by 14. If he fails, Herzog can name another candidate, a Knesset majority can then back a third, and only after that does a new election follow within 90 days, with Netanyahu staying on as caretaker. Eisenkot wrote that “this is the time to establish a national emergency government.” Netanyahu called instead for a national unity government and warned against hastily swearing in one that relied on Arab votes. The Joint List’s Ahmad Tibi called the decision “expected.” The AP noted that coalition talks will turn on draft exemptions for the ultra-Orthodox and on a state inquiry into the October 7 failures."], "why": "Every road to 61 now runs through the Arab parties or the draft fight with the ultra-Orthodox, and whoever wins it inherits the Iran war and the ceasefire diplomacy. Netanyahu keeps the office while the clock runs.", "c": {"L": 1, "LL": 0, "C": 2, "LR": 0, "R": 1}, "src": [{"n": "AP via PBS NewsHour", "u": "https://www.pbs.org/newshour/world/israels-president-taps-opposition-candidate-eisenkot-to-form-a-government-in-setback-for-netanyahu", "t": "C"}, {"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/7/israels-president-picks-eisenkot-over-netanyahu-to-form-next-government", "t": "L"}, {"n": "Fox News", "u": "https://www.foxnews.com/world/israeli-president-picks-netanyahu-rival-form-government-coalition-battle-looms", "t": "R"}, {"n": "Jerusalem Post", "u": "https://www.jpost.com/israel-election-2026/article-914236", "t": "C"}], "framing": "The left (Al Jazeera) led with the Arab parties’ record seats as the margin that carried the endorsement; the right (Fox News) framed the same arithmetic as “deep coalition divisions over Arab parties and conscription” that cloud his path.", "min": 1, "front": true, "img": "img/2026-11-08/s1.webp?h=a33597cc", "col": "#383a24", "cap": "", "credit": "Chris Yunker from St. Louis, United States, CC BY-SA 2.0 / Wikimedia Commons", "pull": {"text": "Such a government, dependent on Islamists, will dismantle the state of Israel from within.", "attr": "Benjamin Netanyahu, via Al Jazeera, November 7"}, "chart": {"type": "bar", "t": "Recommendations, of 120 Knesset seats", "rows": [["Eisenkot", 67, "67 seats"], ["Netanyahu", 46, "46 seats"]]}}, {"id": "s2", "sec": "The Front", "sid": "s-front", "h": "Trump calls renewed Iran war “highly unlikely” as blockade moves to land", "s": "President Trump told CNN on Sunday that resuming strikes was “highly unlikely” to be necessary, a line he repeated five times. Central Command set up Task Force Iron Gate to choke trade across Iran’s land borders and the Caspian Sea, Al Jazeera reported.", "paras": ["President Trump told CNN on Sunday that resuming strikes on Iran was “highly unlikely” to be necessary, a line he repeated five times in a 20-minute phone interview. “It depends on whether or not they sign a very strong agreement,” he said, adding that he had three aircraft carriers in the region and 38 bridges on a target list, and that he did not like “ripping down bridges.”", "The pressure kept building. Central Command on Saturday set up <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Task Force Iron Gate<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Adm. Brad Cooper said it reinforces “our ironclad blockade against Iran at sea,” which has redirected 147 ships and disabled five since July.<\/span><\/button>, about 20 people in Tampa, to choke weapons, dual-use goods and oil revenue crossing Iran’s land borders and the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Caspian Sea<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>Iran’s northern coast faces Russia, Kazakhstan, Turkmenistan and Azerbaijan, trade routes that the naval blockade in the Gulf never reached.<\/span><\/button>, Al Jazeera reported, and a St. Kitts-flagged cargo ship, the Huda, was disabled in the Gulf of Oman. Tehran is reviewing Qatari proposals but still wants its <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">seven conditions<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>They include lifting the sanctions reimposed in July, restored oil waivers, released frozen funds and recognition of a new shipping route built with Oman.<\/span><\/button> met first. Brent settled at $98.32 on Friday."], "why": "Oil fell about 13% last week on hopes of an exit. A land blockade says Washington wants any deal signed on its terms before the new Democratic Congress sits in January.", "c": {"L": 1, "LL": 1, "C": 2, "LR": 0, "R": 1}, "src": [{"n": "CNN via Local 3", "u": "https://www.local3news.com/regional-national/trump-says-renewed-attacks-on-iran-highly-unlikely-if-talks-show-progress/article_ca63faea-fcfe-59d3-9a3b-ed0e69f53d5c.html", "t": "LL"}, {"n": "Reuters via Yahoo", "u": "https://www.yahoo.com/news/politics/articles/trump-says-unlikely-order-iran-175946542.html", "t": "C"}, {"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/8/us-launches-task-force-to-disrupt-irans-land-based-supply-routes", "t": "L"}, {"n": "Fox News", "u": "https://www.foxnews.com/live-news/iran-war-news-trump-saudi-houthi-november-8", "t": "R"}, {"n": "CBS News", "u": "https://www.cbsnews.com/live-updates/iran-war-trump-us-strait-hormuz-persian-gulf/", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-08/s2.webp?h=76b24a93", "col": "#2e3945", "cap": "", "credit": "MODIS Land Rapid Response Team, NASA GSFC, Public domain / Wikimedia Commons", "pull": null, "fig": {"v": "$98.32", "l": "Brent settlement on Friday"}}, {"id": "s3", "sec": "The Front", "sid": "s-front", "h": "Anthropic takes over a stranded $3.4 billion gas-generator order, FT says", "s": "Anthropic agreed in late September to buy large Caterpillar gas-fired generators, about 1.7 gigawatts of capacity, from orders OnePWR Solutions could not finance, the Financial Times reported. Anthropic’s model helps produce this paper.", "paras": ["Anthropic agreed in late September to pay $3.4 billion for large Caterpillar <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">gas-fired generators<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>On-site generation sidesteps the multi-year queue to connect a data center to the grid. Elon Musk’s xAI faces litigation over gas turbines it ran at its Memphis site.<\/span><\/button>, about 1.7 gigawatts of capacity, the Financial Times reported on Sunday, calling it the biggest known single purchase of power equipment by an AI company. The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">orders<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Taking over another buyer’s production slot jumps a backlog that suppliers quote in years. The scarce asset is the place in line, not the hardware.<\/span><\/button> had been placed about two years earlier by OnePWR Solutions, a San Antonio power supplier that could not finance them. Anthropic took over the orders and the installation work without buying the company.", "Neither company commented, and where the units will run is not known. The disclosure lands as Anthropic prepares a listing whose amended filing showed $895 billion of commitments, mostly compute. Renaissance Capital said on Friday that the roadshow could launch as early as Tuesday, with pricing possible the week of Nov. 16. Conflict disclosed: Anthropic’s model helps produce this paper."], "why": "Power, not chips, is the constraint an IPO cannot finance away. Buying a stranded queue slot is how an issuer shows investors the build is real before it prices.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "The Next Web, citing the FT", "u": "https://thenextweb.com/news/anthropic-3-4bn-gas-generators-onepwr-ft", "t": "C"}, {"n": "Reuters via StreetInsider", "u": "https://www.streetinsider.com/Reuters/Anthropic+secures+$3.4+billion+generator+deal+for+AI+data+centers,+FT+reports/27309458.html", "t": "C"}, {"n": "Bloomberg", "u": "https://bloomberg.com/news/articles/2026-11-08/anthropic-buys-power-for-ai-data-centres-in-3-4b-deal-ft-says", "t": "C"}, {"n": "MarketScreener", "u": "https://www.marketscreener.com/news/anthropic-strikes-3-4-billion-deal-for-data-center-generators-ft-reports-ce785fd2d08cf124", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-08/s3.webp?h=cceca6d3", "col": "#43352c", "cap": "", "credit": "Bryansfiles, CC BY-SA 3.0 / Wikimedia Commons", "pull": null, "fig": {"v": "$895 billion", "l": "Commitments in the amended IPO filing"}}, {"id": "s4", "sec": "The Front", "sid": "s-front", "h": "Elvis’s rights holders and Eminem’s publisher sue Suno, the AI music maker", "s": "Eight Mile Style sued Suno late Friday in federal court in San Francisco over 269 songs, about $41 million in all, Variety reported. A separate complaint by Presley’s publishers adds a claim under Tennessee’s ELVIS Act.", "paras": ["Eight Mile Style, which owns much of Eminem’s catalog, sued Suno late Friday in federal court in San Francisco, seeking <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">statutory damages<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Under 17 U.S.C. 504(c) the $150,000 ceiling applies only to willful infringement, and a plaintiff may elect it instead of proving actual losses.<\/span><\/button> of $150,000 for each of 269 songs plus $672,000 for stripped copyright information, about $41 million in all, Variety reported. Eminem is not a party. A separate 51-page complaint by Authentic Brands Group and Presley’s publishers adds a claim under Tennessee’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">ELVIS Act<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The Ensuring Likeness Voice and Image Security Act, signed in March 2024, extended the state’s publicity right to a person’s voice, the first law written for AI cloning.<\/span><\/button>: “The next Elvis won’t pick up a guitar.”", "The same four lawyers, <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Richard Busch<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>The Nashville litigator who won the 2015 “Blurred Lines” verdict for Marvin Gaye’s family against Robin Thicke and Pharrell Williams.<\/span><\/button> among them, filed both. Suno says it bars artists’ names in prompts and screens for misuse. It raised $400 million in June at a $5.4 billion valuation and still faces suits from Universal and Sony, while Warner settled for a license in 2025. Conflict disclosed: the Presley publishers are separately suing Anthropic."], "why": "One firm, two famous catalogs and a state publicity claim stacked on copyright make a template. The AI music settlements so far have been licenses, and these plaintiffs are setting their price.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Variety via Yahoo", "u": "https://www.yahoo.com/news/politics/articles/elvis-music-owners-eminem-publisher-161526743.html", "t": "C"}, {"n": "Engadget", "u": "https://engadget.com/2310316/suno-ai-music-generator-sued-again-for-copyright-infringement", "t": "C"}, {"n": "Vice", "u": "https://www.vice.com/en/article/elvis-presley-estate-warns-the-next-elvis-wont-pick-up-a-guitar-in-new-lawsuit-against-ai-music-company-suno/", "t": "C"}, {"n": "Billboard", "u": "https://www.billboard.com/pro/elvis-presley-ai-voice-cloning-lawsuit-suno/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-08/s4.webp?h=6cba6579", "col": "#3f3729", "cap": "", "credit": "Fallaner, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "fig": {"v": "$5.4 billion", "l": "Suno’s valuation in its June round"}}, {"id": "s5", "sec": "The Front", "sid": "s-front", "h": "Blocked by Beijing, SoftBank and ABB weigh a China carve-out", "s": "SoftBank and ABB are studying putting the robotics unit’s China business into a separately owned entity, Bloomberg reported, after China’s security review blocked the purchase on Thursday. ABB is also weighing other buyers.", "paras": ["SoftBank Group and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">ABB<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The Zurich engineering group had planned to list robotics as a separate company before agreeing to SoftBank’s offer in October 2025.<\/span><\/button> are studying a carve-out that would put the robotics unit’s China business into a separately owned entity, Bloomberg reported on Saturday, after China’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">foreign-investment security review<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Run by the National Development and Reform Commission and the Commerce Ministry under 2021 measures, it is Beijing’s counterpart to CFIUS and can reach a deal between two foreign parties.<\/span><\/button> blocked SoftBank’s purchase on Thursday. China is the unit’s largest market, with a major plant in Shanghai. ABB is also weighing other buyers, who could value the business at $2 billion to $3 billion.", "SoftBank shares fell 11% in Tokyo on Friday, and ABB lost more than 5% on the week. Citi analyst Martin Wilkie said the block roughly halves ABB’s capacity for acquisitions, to about $5 billion. The unit employs about 7,000 people and had $2.3 billion of revenue in 2024."], "why": "Beijing has used its review to stop a Japanese buyer taking a Swiss asset. Any cross-border deal with a China footprint now has to price that veto, and a geographic carve-out is the precedent to watch.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Bloomberg via swissinfo", "u": "https://www.swissinfo.ch/eng/softbank,-abb-consider-china-carve-out-to-salvage-robotics-deal/92343217", "t": "C"}, {"n": "Japan Times", "u": "https://www.japantimes.co.jp/business/2026/11/08/companies/softbank-abb-china-carve-out/", "t": "C"}, {"n": "Investing.com", "u": "https://www.investing.com/news/company-news/softbank-abb-consider-china-carveout-to-rescue-54bn-robotics-deal--bloomberg-5009777", "t": "C"}, {"n": "Euronext / Reuters", "u": "https://live.euronext.com/en/financial-news/softbank-abb-explore-china-carve-out-salvage-robotics-deal-bloomberg-news-reports", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-08/s5.webp?h=8babccd2", "col": "#5c2514", "cap": "", "credit": "Dependability, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "fig": {"v": "11%", "l": "SoftBank’s share fall in Tokyo on Friday"}}, {"id": "s6", "sec": "The Front", "sid": "s-front", "h": "Gunman with far-right views kills six in Kraków’s Main Square", "s": "A 25-year-old Polish man drove around the square on Saturday afternoon, firing at each stop, the Associated Press reported. Six people were killed and 15 wounded. Police say he acted alone.", "paras": ["A 25-year-old Polish man drove around Kraków’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Main Square<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>Rynek Główny was laid out in 1257. The old town around it was among the first sites UNESCO put on its World Heritage list, in 1978.<\/span><\/button> on Saturday afternoon, stopping to fire an <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">automatic weapon<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Polish civilians need a police permit for any firearm and cannot lawfully own fully automatic ones, so how he got it is central to the inquiry.<\/span><\/button> at each stop, killing six people, four women and two men, and wounding 15, the Associated Press reported. At least three of the dead were Polish and one was British. Police detained him and say he acted alone.", "Interior Minister Marcin Kierwiński said “everything indicates that he was fascinated by far-right ideologies.” Prime Minister Donald Tusk said the bodies of three close relatives were found at the suspect’s home in Ostrowiec Świętokrzyski, about 150 kilometers away. The defense minister called it an act of terror, and the city is in official mourning until Wednesday."], "why": "A far-right massacre in the country’s most visited square lands on a government already fighting the president over the courts, and the source of the weapon will decide which fight comes next.", "c": {"L": 1, "LL": 0, "C": 2, "LR": 0, "R": 1}, "src": [{"n": "AP via PBS NewsHour", "u": "https://www.pbs.org/newshour/world/gunman-opens-fire-in-polish-city-of-krakow-killing-6-people-and-injuring-15", "t": "C"}, {"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/7/casualties-reported-after-shooting-in-polands-krakow", "t": "L"}, {"n": "CBS News", "u": "https://www.cbsnews.com/news/shooting-main-market-square-krakow-poland/", "t": "C"}, {"n": "Fox News", "u": "https://www.foxnews.com/world/gunman-opens-fire-moving-car-european-tourist-hotspot-leaving-5-dead-12-wounded", "t": "R"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-08/s6.webp?h=acb0c48b", "col": "#41362a", "cap": "", "credit": "Igor123121, CC BY 4.0 / Wikimedia Commons", "pull": null}, {"id": "s7", "sec": "AI", "sid": "d-ai", "h": "Anthropic’s IPO talk marks down", "s": "Bloomberg reported on Nov. 6 that valuation discussions had slipped to $1.2 trillion to $1.3 trillion from $1.4 trillion to $1.5 trillion, a day after Reuters reported doubts about a roadshow planned for as soon as Nov. 9. Conflict disclosed.", "paras": ["Bloomberg reported on Nov. 6 that valuation discussions had slipped to $1.2 trillion to $1.3 trillion from $1.4 trillion to $1.5 trillion, a day after Reuters reported doubts about a roadshow planned for as soon as Nov. 9. Conflict disclosed."], "why": "", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Investing.com / Bloomberg", "u": "https://www.investing.com/news/stock-market-news/anthropic-ipo-valuation-discussions-fall-to-13-trillion-bloomberg-reports-5008125", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}, {"id": "s8", "sec": "Markets & Deals", "sid": "d-mkt", "h": "A jobs surprise puts December in play", "s": "October payrolls rose 165,000 against a 65,000 forecast. Treasury’s curve closed Friday at 4.51% on the two-year, 4.86% on the ten-year and 5.26% on the thirty-year, and CME FedWatch put a December hike at 76.8%.", "paras": ["October payrolls rose 165,000 against a 65,000 forecast. Treasury’s curve closed Friday at 4.51% on the two-year, 4.86% on the ten-year and 5.26% on the thirty-year, and CME FedWatch put a December hike at 76.8%. Three-, ten- and thirty-year auctions run Monday, Tuesday and Thursday, with October CPI on Tuesday."], "why": "", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "BLS", "u": "https://www.bls.gov/news.release/empsit.nr0.htm", "t": "C"}, {"n": "Treasury", "u": "https://home.treasury.gov/news/press-releases/sb0678", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "chart": {"type": "line", "t": "Treasury yields at Friday’s close", "rows": [["Two-year", 4.51, "4.51%"], ["Ten-year", 4.86, "4.86%"], ["Thirty-year", 5.26, "5.26%"]]}}, {"id": "s9", "sec": "Markets & Deals", "sid": "d-mkt", "h": "CVS will split in two", "s": "The company said on Nov. 4 it will separate its Aetna insurer from the Caremark and pharmacy business, about 9,000 stores, in a tax-free split by the first half of 2028. The shares fell about 10%.", "paras": ["The company said on Nov. 4 it will separate its Aetna insurer from the Caremark and pharmacy business, about 9,000 stores, in a tax-free split by the first half of 2028. The shares fell about 10%."], "why": "", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Yahoo Finance", "u": "https://finance.yahoo.com/markets/article/cvs-announces-plan-to-split-into-2-companies-separating-pharmacy-from-insurance-124251282.htm", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}, {"id": "s10", "sec": "Law & the Courts", "sid": "d-law", "h": "Weil sets its end date", "s": "A Nov. 5 memo deems remaining equity partners withdrawn by Dec. 31, Bloomberg Law reported, as Kirkland takes a 40-lawyer finance group led by Ramona Nee and Gibson Dunn about 120 funds lawyers. On Monday a Weil team is counsel of record at the Supreme Court in Nielsen v.", "paras": ["A Nov. 5 memo deems remaining equity partners withdrawn by Dec. 31, Bloomberg Law reported, as Kirkland takes a 40-lawyer finance group led by Ramona Nee and Gibson Dunn about 120 funds lawyers. On Monday a Weil team is counsel of record at the Supreme Court in Nielsen v. Watanabe, a test of prisoners’ damages suits."], "why": "", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Bloomberg Law", "u": "https://news.bloomberglaw.com/business-and-practice/weil-gotshal-says-remaining-partners-can-resign-now-keep-profit", "t": "C"}, {"n": "Supreme Court docket", "u": "https://www.supremecourt.gov/docket/docketfiles/html/public/25-417.html", "t": null}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}, {"id": "s11", "sec": "The World", "sid": "d-world", "h": "Democrats take Congress, and the fight starts early", "s": "After the Nov. 3 sweep of both chambers, President Trump on Saturday called Democratic impeachment talk “extortion at the highest level,” and Rep. Robert Garcia, the likely Oversight chair, said “the days of us not fighting back are over,” the AP reported.", "paras": ["After the Nov. 3 sweep of both chambers, President Trump on Saturday called Democratic impeachment talk “extortion at the highest level,” and Rep. Robert Garcia, the likely Oversight chair, said “the days of us not fighting back are over,” the AP reported."], "why": "", "c": {"L": 1, "LL": 0, "C": 1, "LR": 0, "R": 1}, "src": [{"n": "AP via KRMG", "u": "https://krmg.com/2026/11/08/trump-and-his-justice-department-stand-defiant-as-democrats-ready-an-investigative-blitz/", "t": "C"}, {"n": "Fox News", "u": "https://www.foxnews.com/politics/trump-orders-doj-probe-democrats-over-alleged-threats-against-admin-officials", "t": "R"}, {"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/7/trump-orders-doj-to-investigate-democrats-for-threatening-people", "t": "L"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit
