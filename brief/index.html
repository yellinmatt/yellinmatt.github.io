ings $6.57 a share, and the Miami cruise line guided full-year adjusted earnings to $17.85 to $17.95."], "why": "", "c": {"L": 0, "LL": 0, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "8-K", "u": "https://www.sec.gov/Archives/edgar/data/0000884887/000088488726000042/a2026q3earningsrelease.htm", "t": null}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-01/s14.webp?h=3b0463ed", "col": "#0d4235", "cap": "", "credit": "Kiran891, CC BY-SA 4.0 / Wikimedia Commons", "pull": null}, {"id": "s15", "sec": "Wall Street South", "sid": "d-sofla", "h": "The InterContinental Miami trades for $300 million", "s": "Gencom and White Bridge Capital agreed to buy the 652-key bayfront hotel from Dajia, The Real Deal reported, citing Bloomberg.", "paras": ["Gencom and White Bridge Capital agreed to buy the 652-key bayfront hotel from Dajia, The Real Deal reported, citing Bloomberg."], "why": "", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "The Real Deal", "u": "https://therealdeal.com/miami/2026/10/30/gencom-white-bridge-capital-buy-intercontinental-miami/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-01/s15.webp?h=655d7017", "col": "#3c3827", "cap": "", "credit": "Averette, CC BY 3.0 / Wikimedia Commons", "pull": null}], "week": [{"day": "Mon Oct 26", "lead": "Lula won Brazil’s runoff with 51.8% as Flávio Bolsonaro sought annulment, and SpaceX closed $40 billion of GPU debt."}, {"day": "Tue Oct 27", "lead": "Anthropic filed its public S-1 for a Nasdaq listing, and EQT agreed to an all-stock merger with Range Resources."}, {"day": "Wed Oct 28", "lead": "Meta priced a $97.5 billion equity program, and Weil hired Davis Polk as restructuring adviser."}, {"day": "Thu Oct 29", "lead": "Alphabet reported negative free cash flow on $51.4 billion of capex, and the Fed held with two dissents for a hike."}, {"day": "Fri Oct 30", "lead": "Weil’s leaders recommended dissolving the firm, and Thrive agreed to take ADT private for $15.3 billion."}, {"day": "Sat Oct 31", "lead": "S&P put Meta on negative outlook as the Nasdaq fell 2.84%, and the Revolutionary Guard seized four tankers in Hormuz."}, {"day": "Sun Nov 1", "lead": "Iran offered a two-day Hormuz reopening on seven conditions, and a Miami judge ended Trump’s suit against the Journal."}], "cover": "img/2026-11-01/s1.webp?h=44305514"}, {"date": "2026-10-31", "no": 156, "min": 9.9, "stand": "The bill for AI reaches the credit markets, Hormuz burns again, and Weil’s rivals divide what is left.", "note": "Editor’s note. 13 items at 2,364 read-words, under the ten-minute cap. The Splash gathers four separate Friday reports on how AI spending is being financed; two of them concern Anthropic, whose model compiles this paper, and Amazon and Google, which also appear, are Anthropic investors. The Anthropic rating report rests on a summary of the Financial Times, which could not be opened. Not run: a judge’s misconduct inquiry into Justice Department lawyers over the East Potomac golf course; the Venice Biennale sculptures stranded by a shipping shortfall; Halloween box office (Friday figures came only from an unattributed site); the Marlins’ Alcantara option; Britain’s possible slavery apology; AutoNation’s quarter; Michal Strnad’s €30 billion offer for Delfin, which broke Thursday; a Wikimedia amicus brief in the Times’ suit against OpenAI (filing date unverified); Apple passing Nvidia in market value (no masthead could be opened). Watch: Tehran’s answer to the Qatari draft this weekend; Weil’s partner vote; Election Day Tuesday; the LIV hearings Nov. 5 and Nov. 19; GFL bids Nov. 9; the election-officials hearing Nov. 13; the Character.AI auction Nov. 23; the Fed Dec. 9. Sourcing limits: every desk exhausted its search budget; The New York Times, BBC, The Guardian, NPR and National Review were not reached directly; Bloomberg, the FT and Law360 were paywalled, so several items rest on syndicated or trade copies; the hotel sale and the Character.AI hearing each rest on one masthead; BASF’s rejection was first reported shortly before the window opened and runs on Friday’s updates.", "items": [{"id": "s1", "sec": "The Front", "sid": "s-front", "h": "S&P puts Meta on negative outlook as the cost of AI reaches the credit markets and the Nasdaq falls 2.8%", "s": "S&amp;P Global Ratings revised its outlook on Meta Platforms to negative from stable on Friday, citing “significant uncertainty around its capital spending and free operating cash flow,” Reuters reported.", "paras": ["S&amp;P Global Ratings revised its <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">outlook<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>An outlook is not a downgrade. It signals the likely direction of a rating over six months to two years, and S&amp;P tied this one to Meta’s planned $97.5 billion stock sale.<\/span><\/button> on Meta Platforms to negative from stable on Friday, citing “significant uncertainty around its capital spending and free operating cash flow,” Reuters reported. The agency forecasts free operating cash flow deficits of $39 billion this year and $71 billion in 2027, and said leverage could pass the 1.0 times limit for Meta’s current rating as early as 2027. Meta guides 2026 capital spending at $135 billion to $145 billion.", "The same day, Bloomberg reported that Amazon had set up a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">secured supplier facility<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Lenders take collateral rights over assets the filing does not name. Amazon’s earlier AI borrowing came through unsecured bonds backed only by its general credit.<\/span><\/button> of up to $80 billion, available from early 2027 to the third quarter of 2028, to borrow against AI hardware it buys. Nvidia is weighing a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">residual value guarantee<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A promise that an asset will hold a floor value, or that the guarantor steps in. If Nscale defaults during construction, Nvidia would take over the site and find a buyer or tenant.<\/span><\/button> on billions of dollars of debt for <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Nscale<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The British neocloud had about 25,000 chips running in August against a plan of nearly 500,000, and is seeking an IPO valuation of up to $35 billion.<\/span><\/button>’s West Virginia data center, whose first building Anthropic contracted for $44.6 billion, TechCrunch reported. And <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Blackstone<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Its funds put $9 billion into $18 billion of junior debt backed by Anthropic’s lease payments on Google-chip capacity, at a target yield above 10%.<\/span><\/button> told clients Anthropic may list with a rating “in the BB range or above,” below investment grade, the Financial Times reported.", "Stocks fell. The Nasdaq Composite dropped 2.84% to 25,442.31 and the S&amp;P 500 lost 1.83%, TheStreet reported, leaving the Nasdaq down 5.2% for October, its worst month since March 2025, according to Yahoo Finance. Intel fell about 29%, its worst day since 1974, on a weak forecast. “Strong AI demand is no longer enough on its own,” said analyst Daniela Hathorn."], "why": "The AI buildout is moving from cash to credit, where rating agencies, collateral and vendor guarantees set the price, and the first test of whether an AI lab is investment grade arrives with Anthropic’s IPO.", "c": {"L": 0, "LL": 0, "C": 6, "LR": 0, "R": 0}, "src": [{"n": "Reuters on S&P and Meta", "u": "https://lufkindailynews.com/news_reuters/business/s-p-global-revises-outlook-on-meta-to-negative-on-cashflow-concerns/article_81ccd3ca-2071-5cd3-9d9a-189180643aef.html", "t": "C"}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/10/30/meta-outlook-to-revised-to-negative-by-sp-after-cash-flow-negative.html", "t": "C"}, {"n": "Investing.com via Yahoo", "u": "https://uk.finance.yahoo.com/news/amazon-sets-80-billion-supplier-172413622.html", "t": "C"}, {"n": "TechCrunch", "u": "https://techcrunch.com/2026/10/30/nvidia-weighs-playing-the-cosigner-for-nscales-ai-data-center-in-west-virginia/", "t": "C"}, {"n": "Oninvest, citing the FT", "u": "https://en.oninvest.com/article/ft-anthropic-may-receive-a-junk-credit-rating-after-its-ipo", "t": "C"}, {"n": "TheStreet", "u": "https://thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-oct-30-2026", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-10-31/s1.webp?h=3ba0b022", "col": "#29394c", "cap": "The entrance to Meta’s headquarters in Menlo Park, California.", "credit": "LPS.1, CC0 / Wikimedia Commons", "pull": {"text": "“We are less certain that it will curtail its spending as previously anticipated.”", "attr": "S&P Global Ratings, on Meta, via Reuters, Oct. 30"}}, {"id": "s2", "sec": "The Front", "sid": "s-front", "h": "Iran says four tankers struck mines in Hormuz as Qatar carries a revised draft to Tehran and Brent settles at $117.64", "s": "Iran’s Revolutionary Guard said Friday that a supertanker carrying more than 2 million barrels of oil struck a naval mine and caught fire in the Strait of Hormuz, the fourth tanker explosion of the day; the AP could not verify the claims. Oman evacuated 25 crew from the burning Panama-flagged tanker RITI off Musandam, and UKMTO logged a projectile strike on another vessel.", "paras": ["Iran’s Revolutionary Guard said Friday that a supertanker carrying more than 2 million barrels of oil struck a naval mine and caught fire in the Strait of Hormuz, the fourth tanker explosion of the day; the AP could not verify the claims. Oman evacuated 25 crew from the burning Panama-flagged tanker RITI off Musandam, and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">UKMTO<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The Royal Navy’s maritime security reporting cell counts 145 incidents in the region since the war began, and just over 30 in October, the most of any month but March.<\/span><\/button> logged a projectile strike on another vessel. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Expiring December Brent<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The contract rolled off Friday. The January contract settled at $113.43, which explains the roughly $4 gap between front-month quotes.<\/span><\/button> settled at $117.64, up 2.4%, and rose 13.6% in October, Reuters reported.", "<button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Qatari mediators<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>A Reuters source said the trip was coordinated with Washington. A CBS source said the mediators saw “indications of progress.”<\/span><\/button> returned to Tehran with edits to a draft agreement and expect an answer by the weekend, CBS reported, while a senior Iranian official told Reuters they brought “unacceptable” ideas. President Trump said the war is “going to get wrapped up soon.” The Pentagon’s count of American dead stands at 23."], "why": "Oil’s 13.6% October gain runs straight into rates, inflation and every Gulf-exposed credit, and the weekend’s answer from Tehran decides whether it keeps climbing.", "c": {"L": 1, "LL": 0, "C": 3, "LR": 0, "R": 1}, "src": [{"n": "AP", "u": "https://www.whec.com/ap-top-news/iran-says-4-tankers-strike-mines-and-catch-fire-in-strait-of-hormuz-and-other-mideast-news/", "t": "C"}, {"n": "CBS News", "u": "https://www.cbsnews.com/live-updates/iran-war-us-trump-diplomacy-threat-resume-attacks/", "t": "C"}, {"n": "Reuters", "u": "https://lufkindailynews.com/news_reuters/business/oil-set-for-fourth-monthly-gain-as-hormuz-tanker-attack-highlights-supply-risks/article_713179c5-05da-573a-8327-a64d5d78eeaf.html", "t": "C"}, {"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/10/30/oman-rescues-25-from-burning-oil-tanker-in-strait-of-hormuz", "t": "L"}, {"n": "Fox News", "u": "https://www.foxnews.com/live-news/us-iran-war-oil-prices-strait-hormuz-10-30-26", "t": "R"}], "framing": "", "min": 1, "front": true, "img": "img/2026-10-31/s2.webp?h=44305514", "col": "#2b3a47", "cap": "", "credit": "Department of Defense. American Forces Information Service. Defense Visual Infor, Public domain / Wikimedia Commons", "pull": null}, {"id": "s3", "sec": "AI", "sid": "s-ai", "h": "A judge clears the Character.AI auction with Disney as the $20 million stalking horse and urges a privacy ombudsman", "s": "Judge Brendan Shannon of the U.S. Bankruptcy Court in Delaware approved bidding procedures Friday for Character Technologies, maker of Character.AI, with Disney as stalking horse at about $20 million for a non-exclusive technology license and the hiring of staff, not the platform or user data, Law360 reported.", "paras": ["Judge Brendan Shannon of the U.S. Bankruptcy Court in Delaware approved bidding procedures Friday for Character Technologies, maker of Character.AI, with Disney as <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">stalking horse<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The first bidder sets the price floor in exchange for protections. Here that is a $700,000 break-up fee if Disney is outbid.<\/span><\/button> at about $20 million for a non-exclusive technology license and the hiring of staff, not the platform or user data, Law360 reported. Rival bids must clear $21.7 million. Shannon overruled objections from more than 30 states and D.C. and said he would “strongly encourage” the company to appoint a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">consumer privacy ombudsman<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Bankruptcy Code section 332 provides one when a sale would transfer personal data in a way that conflicts with the debtor’s own privacy policy.<\/span><\/button>. Bids are due Nov. 20, with an auction Nov. 23."], "why": "Who owns intimate chatbot conversations is now a bankruptcy question, and Disney has structured its bid to take the engineers and the license while leaving the user data behind.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "Law360", "u": "https://www.law360.com/bankruptcy-authority/articles/2544743", "t": null}, {"n": "PPC Land", "u": "https://ppc.land/character-ai-rewrites-disney-sale-notice-after-39-states-and-dc-object/", "t": "C"}, {"n": "Pennsylvania attorney general", "u": "https://www.attorneygeneral.gov/taking-action/ag-sunday-takes-action-to-ensure-sensitive-consumer-information-is-protected-in-character-ai-bankruptcy-potential-sale/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}, {"id": "s4", "sec": "Markets & Deals", "sid": "s-mkt", "h": "SoftBank-backed OPay pulls its $304 million NYSE listing after pricing, citing a foreign regulator’s inquiry", "s": "OPay, the Nigerian payments company backed by SoftBank, withdrew its New York IPO on Friday after pricing 16 million American depositary shares at $19, the bottom of its range, raising $304 million at a valuation of about $4 billion, Reuters reported. OPay and its underwriters, led by Citi, Deutsche Bank and Standard Bank, “mutually agreed to postpone the underwriting agreement,” citing an inquiry in an unnamed foreign jurisdiction.", "paras": ["OPay, the Nigerian payments company backed by SoftBank, withdrew its New York IPO on Friday after pricing 16 million <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">American depositary shares<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Each represents 10 ordinary shares. A secondary listing on the Nigerian Exchange had also been planned.<\/span><\/button> at $19, <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">the bottom of its range<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The range was $19 to $21, and the underwriters held an over-allotment option on 2.4 million more shares.<\/span><\/button>, raising $304 million at a valuation of about $4 billion, Reuters reported. OPay and its underwriters, led by Citi, Deutsche Bank and Standard Bank, “mutually agreed to postpone the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">underwriting agreement<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Signed Oct. 29. Until closing, its conditions and termination clauses can still unwind a deal that has already priced.<\/span><\/button>,” citing an inquiry in an unnamed foreign jurisdiction.", "The shares never traded. At 2 p.m. they were indicated to open at $16.25 to $16.75, below the offer price, and at 3:30 p.m. the exchange halted the stock “with news pending,” Nairametrics reported. OPay said the probe “should not be misconstrued as a reflection on the Company’s business performance.” Closing had been set for Nov. 2, alongside a private placement of up to $200 million from Stanbic Africa."], "why": "A deal pulled between pricing and closing is rare, and it shows what the underwriting agreement’s conditions are for: the banks kept the right to walk until the money moved.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Reuters", "u": "https://www.centraloregondaily.com/news/consumer/softbank-backed-opay-withdraws-304-million-us-ipo-after-regulatory-inquiry/article_db6fed20-c83a-548f-8374-661df23048b6.html", "t": "C"}, {"n": "Bloomberg", "u": "https://www.bloomberg.com/news/articles/2026-10-30/softbank-backed-opay-prices-at-4-billion-value-for-new-york-ipo", "t": "C"}, {"n": "Nairametrics", "u": "https://nairametrics.com/2026/10/30/opay-post-ipo-trading-halted-after-raising-304-million/", "t": "C"}, {"n": "TechPoint Africa", "u": "https://techpoint.africa/news/opay-nyse-ipo/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-31/s4.webp?h=5ee7ef63", "col": "#3c3829", "cap": "The New York Stock Exchange on Broad Street, where OPay’s shares were halted before they traded.", "credit": "Billie Grace Ward, CC0 / Wikimedia Commons", "pull": null}, {"id": "s5", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Two Fed presidents call for more rate increases as Treasuries finish October with a rally anyway", "s": "St. Louis Fed President Alberto Musalem told the Shadow Open Market Committee on Friday that “additional firming of monetary policy will be necessary, and soon,” and Dallas Fed President Lorie Logan said the Fed needs at least two more quarter-point increases.", "paras": ["St. Louis Fed President Alberto Musalem told the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Shadow Open Market Committee<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>A private group of economists, founded in 1973, that critiques Federal Reserve policy from outside the Fed.<\/span><\/button> on Friday that “additional firming of monetary policy will be necessary, and soon,” and Dallas Fed President Lorie Logan said the Fed needs at least <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">two more quarter-point increases<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>One increase at the Dec. 9 meeting would lift the target range to 4.00% to 4.25%. CME futures put December odds near 80% on Thursday.<\/span><\/button>. The 10-year Treasury yield ended near 4.93% and the two-year near 4.60%, per Trading Economics, after a fall of more than 30 basis points in October as money left tech stocks."], "why": "With September inflation at 3.6%, hikes are back on the table, and the rate every pending convertible and IPO discounts against is now a two-way bet.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "St. Louis Fed remarks", "u": "https://www.stlouisfed.org/from-the-president/remarks/2026/remarks-on-us-economy-and-monetary-policy-somc", "t": null}, {"n": "Yahoo Finance", "u": "https://finance.yahoo.com/economy/policy/article/rates-need-to-be-higher-3-fed-members-say-the-question-is-how-much-173755732.html", "t": "C"}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/10/30/musalem-fed-monetary-policy-tightening.html", "t": "C"}, {"n": "Quartz", "u": "https://qz.com/fed-officials-signal-more-interest-rate-hikes-103026", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-31/s5.webp?h=baca25d0", "col": "#423627", "cap": "", "credit": "Christopher L. Riley, CC BY-SA 4.0 / Wikimedia Commons", "pull": null}, {"id": "s6", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Evonik rebuffs BASF’s raised €11.2 billion bid, keeping Germany’s chemicals takeover fight open", "s": "Evonik’s board said Friday that BASF’s raised offer of €24 a share, about €11.18 billion, was not enough to begin formal talks, though it asked BASF to explain its rationale, Reuters reported. Evonik rejected €22.15 in September.", "paras": ["<button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Evonik<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>It has explored buying Ashland, a deal reported at about $3.3 billion, an alternative to BASF’s approach.<\/span><\/button>’s board said Friday that BASF’s raised offer of €24 a share, about €11.18 billion, was not enough to begin formal talks, though it asked BASF to explain its rationale, Reuters reported. Evonik rejected €22.15 in September. BASF said it was surprised and would not overpay, while acknowledging “Evonik’s willingness to engage in discussions.” Chief executive Markus Kamieth called the deal a “strong German response to global competition.”"], "why": "A raised bid that still cannot open talks puts the next move on BASF: go to shareholders, pay more, or walk.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Reuters via Euronext", "u": "https://live.euronext.com/en/financial-news/evonik-rejects-basf-bid-despite-sweetened-125-billion-terms", "t": "C"}, {"n": "MarketScreener", "u": "https://www.marketscreener.com/news/evonik-declines-basf-takeover-talks-ce785fdbd88eff25", "t": "C"}, {"n": "Law360", "u": "https://www.law360.com/transactions-uk/articles/2544391", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-31/s6.webp?h=17f1fb81", "col": "#413807", "cap": "", "credit": "Felix König, CC BY 3.0 / Wikimedia Commons", "pull": null}, {"id": "s7", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Gencom and White Bridge buy the InterContinental Miami from a Chinese state insurer for about $300 million", "s": "Miami-based Gencom and White Bridge Capital bought the 652-room InterContinental Miami at 100 Chopin Plaza for about $300 million, The Real Deal reported Friday, citing Bloomberg. A buyers’ spokesperson confirmed the sale but not the price, which works out to about $460,000 a key, 9% above the Florida full-service average tracked by MSCI.", "paras": ["Miami-based Gencom and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">White Bridge Capital<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Its clients are Latin American family offices. Tommy Campbell is chief executive.<\/span><\/button> bought the 652-room InterContinental Miami at 100 Chopin Plaza for about $300 million, The Real Deal reported Friday, citing Bloomberg. A buyers’ spokesperson confirmed the sale but not the price, which works out to about $460,000 a key, 9% above the Florida full-service average tracked by MSCI. The seller was Strategic Hotels &amp; Resorts, owned by <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Dajia Insurance<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The state-run successor to Anbang Insurance, which bought Strategic Hotels in 2016.<\/span><\/button>. The same day, the ULI and PwC Emerging Trends report ranked Miami third for 2027."], "why": "Local capital is paying a premium per room for a downtown trophy hotel, a clean read on where Miami hotel values sit as Chinese owners keep selling.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "The Real Deal", "u": "https://therealdeal.com/miami/2026/10/30/gencom-white-bridge-capital-buy-intercontinental-miami/", "t": null}, {"n": "The Real Deal on ULI", "u": "https://therealdeal.com/miami/2026/10/30/uli-emerging-real-estate-trends-2027-miami-2/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-31/s7.webp?h=9ee6e52d", "col": "#383a20", "cap": "", "credit": "CC BY 2.0 / Wikimedia Commons", "pull": null}, {"id": "s8", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Analysts tie the record $6.3 billion Binance theft to North Korea as $3 billion is frozen", "s": "Blockchain analysts TRM Labs and Chainalysis attributed the $6.3 billion theft from Binance, most of it taken within about 20 minutes on Thursday across 10 blockchains, to North Korea’s TraderTraitor group. About $3 billion is frozen, more than $2.3 billion of it by Tether and Circle, Reuters reported.", "paras": ["Blockchain analysts TRM Labs and Chainalysis attributed the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">$6.3 billion theft<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>About four times the previous record, Bybit’s $1.5 billion in February 2025.<\/span><\/button> from Binance, most of it taken within about 20 minutes on Thursday across 10 blockchains, to North Korea’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">TraderTraitor<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>A hacking unit linked to the Lazarus Group, which the Treasury sanctioned in 2019.<\/span><\/button> group. About $3 billion is frozen, more than $2.3 billion of it by Tether and Circle, Reuters reported. Co-chief executive Richard Teng said “our investigation has not attributed responsibility to any individual.” Bitcoin hit a six-week low of $76,368."], "why": "Two stablecoin issuers froze more of the stolen money than any government did, which strengthens the case that issuers, not regulators, are crypto’s working enforcement layer.", "c": {"L": 1, "LL": 1, "C": 1, "LR": 0, "R": 1}, "src": [{"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/10/30/binance-says-6-3bn-stolen-in-biggest-crypto-heist-in-history-what-we-know", "t": "L"}, {"n": "CNN", "u": "https://www.cnn.com/2026/10/30/tech/binance-crypto-heist-hnk-intl", "t": "LL"}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/10/30/billions-in-crypto-frozen-in-binance-hack-heres-what-happens-next-.html", "t": "C"}, {"n": "Fox Business", "u": "https://www.foxbusiness.com/technology/expert-warns-ai-hacking-bloodbath-following-massive-binance-cryptocurrency-theft", "t": "R"}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-31/s8.webp?h=15e03b16", "col": "#3f381b", "cap": "", "credit": "BitcoinXio, CC0 / Wikimedia Commons", "pull": null}, {"id": "s9", "sec": "Law & the Courts", "sid": "s-law", "h": "Rivals carve up Weil as Gibson Dunn takes its London funds team and an AI law firm bids for the brand", "s": "Gibson Dunn is taking Weil, Gotshal &amp; Manges’ London private funds team of almost 40 lawyers, including 10 partners led by James Bromley and James Sargent, City AM reported Friday, and Simpson Thacher is set to hire London private equity partner Lewis Blakey, Legal Business reported. Sullivan &amp; Cromwell and Paul Weiss are talking with Weil associates and trainees, and Paul Weiss has already hired several partners, the ABA Journal reported.", "paras": ["Gibson Dunn is taking Weil, Gotshal &amp; Manges’ London private funds team of almost 40 lawyers, including 10 partners led by James Bromley and James Sargent, City AM reported Friday, and Simpson Thacher is set to hire London private equity partner Lewis Blakey, Legal Business reported. Sullivan &amp; Cromwell and Paul Weiss are talking with Weil associates and trainees, and Paul Weiss has already hired several partners, the ABA Journal reported. The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">partnership vote<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Weil confirmed to The New York Times that it was preparing to vote on dissolution, TechCrunch reported. No result had been reported by Saturday morning.<\/span><\/button> is expected this week.", "Crosby, an <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">AI-native law firm<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Its $60 million Series B was led by Lux and Index. ABA Model Rule 5.4 bars nonlawyer ownership of law firms, with exceptions in Arizona and Utah, so Crosby’s structure bears on what it can buy.<\/span><\/button> that has raised about $85 million, bid for Weil assets including its trademark, brand and some internal data, TechCrunch reported, following The Information. Terms were not disclosed. A former Weil partner told City AM it was “a Titanic situation.” Departing partners take their hourly matters under New York’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">unfinished business<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>In the 2014 Thelen and Coudert decisions, New York’s top court held that a dissolved firm has no property interest in hourly matters a partner takes to a new firm.<\/span><\/button> rule."], "why": "The question at Weil is no longer survival but who gets its practices, and an AI firm bidding for a BigLaw name is a first.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "ABA Journal", "u": "https://www.abajournal.com/news/article/rivals-race-to-rescue-weil-lawyers-as-firm-heads-towards-closure", "t": null}, {"n": "City AM", "u": "https://www.cityam.com/gibson-dunn-snaps-up-weils-private-funds-team-in-city-expansion/", "t": "C"}, {"n": "TechCrunch", "u": "https://techcrunch.com/2026/10/30/ai-law-firm-crosby-bids-on-disintegrating-famed-firm-weil-gotshal/", "t": "C"}, {"n": "Legal Business", "u": "https://www.legalbusiness.co.uk/law-firms/simpson-thacher-set-to-hire-london-pe-partner-as-weil-fallout-continues/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-31/s9.webp?h=8de49911", "col": "#39392a", "cap": "767 Fifth Avenue, Weil’s New York headquarters.", "credit": "Pablo Costa Tirado, CC BY-SA 3.0 / Wikimedia Commons", "pull": null}, {"id": "s10", "sec": "Law & the Courts", "sid": "s-law", "h": "A judge bars Justice Department threats against election officials as the Ninth Circuit again refuses to set aside California ballots", "s": "Judge Trina Thompson of the Northern District of California issued a temporary restraining order Friday barring the Justice Department and Homeland Security from threatening or coercing election officials to stop processing ballots of voters the government calls ineligible, citing likely violations of Section 11(b) of the Voting Rights Act. Unions and the NAACP brought the suit.", "paras": ["Judge Trina Thompson of the Northern District of California issued a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">temporary restraining order<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Granted without notice under Rule 65(b), it runs to 5 p.m. Nov. 16, with a preliminary injunction hearing set for Nov. 13.<\/span><\/button> Friday barring the Justice Department and Homeland Security from threatening or coercing election officials to stop processing ballots of voters the government calls ineligible, citing likely violations of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Section 11(b)<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>It reaches intimidation of anyone “aiding any person to vote,” which is why unions of election workers can bring the claim.<\/span><\/button> of the Voting Rights Act. Unions and the NAACP brought the suit. A Ninth Circuit panel separately ruled 2-1 against the department’s bid to set aside about 20,000 California mail ballots, finding “no feasible way to identify and segregate the ballots of specific individuals.”"], "why": "Three days before Election Day, two courts have told the department that the executive cannot direct how states count ballots.", "c": {"L": 1, "LL": 1, "C": 1, "LR": 0, "R": 1}, "src": [{"n": "TRO, SEIU v. DOJ", "u": "https://storage.courtlistener.com/recap/gov.uscourts.cand.482447/gov.uscourts.cand.482447.26.0.pdf", "t": null}, {"n": "Fox News", "u": "https://www.foxnews.com/politics/federal-judge-blocks-trump-doj-threats-against-election-workers-ahead-2026-midterms", "t": "R"}, {"n": "CNN", "u": "https://www.cnn.com/2026/10/30/politics/emergency-order-halts-doj-pressure-campaign-election-officials", "t": "LL"}, {"n": "CBS News", "u": "https://www.cbsnews.com/news/california-justice-department-ballots-appeals-court/", "t": "C"}, {"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/10/30/us-appeals-court-again-rejects-trump-bid-to-set-aside-california-ballots", "t": "L"}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-31/s10.webp?h=097db3e1", "col": "#41362a", "cap": "", "credit": "Michael Barera, CC BY-SA 4.0 / Wikimedia Commons", "pull": null}, {"id": "s11", "sec": "The World", "sid": "s-world", "h": "Rubio opens the G20 foreign ministers’ meeting in Atlanta with Lavrov present and the group photo cancelled", "s": "Secretary of State Marco Rubio opened a two-day meeting of G20 foreign ministers in Atlanta on Friday, ahead of a December leaders’ summit at Trump’s Doral resort, telling delegates the world faces a “moment of choosing.” The United States cancelled the customary group photograph after European diplomats objected to posing with Russian Foreign Minister Sergei Lavrov, two U.S. officials told the AP.", "paras": ["Secretary of State Marco Rubio opened a two-day meeting of G20 foreign ministers in Atlanta on Friday, ahead of a December leaders’ summit at Trump’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Doral<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>The Miami-area resort hosts the summit in December. Putin has been invited, and whether he will attend is unclear, the AP reported.<\/span><\/button> resort, telling delegates the world faces a “moment of choosing.” The United States cancelled the customary group photograph after European diplomats objected to posing with Russian Foreign Minister Sergei Lavrov, two U.S. officials told the AP.", "EU foreign policy chief Kaja Kallas said Lavrov “put forward a lot of lies, a lot of false narratives.” Lavrov attacked Europe’s “arrogant boycott” and called a brief exchange with Rubio a “decent talk,” AFP reported. Ukraine was not invited, <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">South Africa<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>It held the G20 presidency in 2025 and says its absence “was not voluntary.”<\/span><\/button> is absent, and China sent a deputy foreign minister. The meeting ends Saturday with a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">chair’s summary<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Issued on the host’s own authority, it needs no consensus, so Russia cannot block its wording.<\/span><\/button> rather than a joint declaration."], "why": "Atlanta is the rehearsal for the Doral summit, where Putin is invited, and it shows Europe will not lend Russia the optics.", "c": {"L": 1, "LL": 1, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "AP via CBS News", "u": "https://www.cbsnews.com/atlanta/news/g20-diplomats-including-from-china-and-russia-face-deep-rifts-as-they-prepare-to-meet-in-atlanta-2/", "t": "C"}, {"n": "CNN", "u": "https://www.cnn.com/2026/10/30/politics/g20-tensions-photo-canceled-lavrov-rubio", "t": "LL"}, {"n": "The Hill", "u": "https://thehill.com/policy/international/6185283-g20-foreign-ministers-skip-russia-photo/", "t": "C"}, {"n": "AFP", "u": "https://www.yahoo.com/news/politics/articles/rubio-hosts-g20-ministers-iran-055055507.html", "t": "C"}, {"n": "Al Jazeera", "u": "https://www.aljazeera.com/video/newsfeed/2026/10/30/aje-onl-nf_rubio-hosts-g20-talks-as-russias-lavrov-present-301026", "t": "L"}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-31/s11.webp?h=e73616d9", "col": "#323c27", "cap": "Downtown Atlanta, host of the G20 foreign ministers’ meeting.", "credit": "London looks, CC BY 2.0 / Wikimedia Commons", "pull": null}, {"id": "s12", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "EA closed BioWare and cancelled Mass Effect to fund a new Star Wars Battlefront under $18 billion of buyout debt, Bloomberg reports", "s": "Electronic Arts shut BioWare and cancelled its next Mass Effect game because it could not fund two science-fiction projects costing “hundreds of millions” each, choosing a Star Wars Battlefront 3 from DICE and Respawn, Bloomberg’s Jason Schreier reported Friday, according to Game Developer and VGC. The $55 billion buyout led by Saudi Arabia’s Public Investment Fund left EA with about $18 billion of debt and more than $1 billion a year of interest.", "paras": ["Electronic Arts shut <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">BioWare<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>EA announced the closure Oct. 21 with about 400 job cuts, Bloomberg reported. Amazon’s Mass Effect television series is still going ahead.<\/span><\/button> and cancelled its next Mass Effect game because it could not fund two science-fiction projects costing “hundreds of millions” each, choosing a Star Wars Battlefront 3 from DICE and Respawn, Bloomberg’s Jason Schreier reported Friday, according to Game Developer and VGC. The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">$55 billion buyout<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>In a leveraged buyout the acquired company’s own cash flow services the acquisition debt, so interest competes directly with game budgets.<\/span><\/button> led by Saudi Arabia’s Public Investment Fund left EA with about $18 billion of debt and more than $1 billion a year of interest.", "Laura Miele, president of EA Entertainment and BioWare’s main advocate, lost ground to executives from the sports side, the report said. EA said the decision followed “months of planning, review, and analysis.” BioWare co-founder Greg Zeschuk told 80.lv that “none of these people have ever made a game.” The Mass Effect project lost up to two years helping finish <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Dragon Age: The Veilguard<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The 2024 release was BioWare’s last game. EA closed Visceral Games in 2017 in a similar pivot on a Star Wars title.<\/span><\/button>."], "why": "A clean case of leverage setting creative strategy: the debt load decided which franchise lived, which is the question every studio buyout now invites.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Bloomberg", "u": "https://www.bloomberg.com/news/newsletters/2026-10-30/why-electronic-arts-shut-down-bioware-and-cancelled-mass-effect", "t": "C"}, {"n": "Game Developer", "u": "https://www.gamedeveloper.com/business/report-ea-shut-down-bioware-in-favor-of-star-wars-battlefront-sequel-after-previously-decrying-licensed-games", "t": "C"}, {"n": "VGC", "u": "https://www.videogameschronicle.com/news/ea-chose-to-shut-down-bioware-so-it-could-make-star-wars-battlefront-3-instead-its-claimed/", "t": "C"}, {"n": "PC Gamer", "u": "https://www.pcgamer.com/games/mass-effect/ea-reportedly-canned-bioware-and-mass-effect-5-to-make-a-new-star-wars-battlefront-instead/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-31/s12.webp?h=69f7f6f9", "col": "#393b0e", "cap": "Electronic Arts’ headquarters in Redwood Shores, California.", "credit": "King of Hearts, CC BY-SA 3.0 / Wikimedia Commons", "pull": null}, {"id": "s13", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "Salesforce asks the LIV Golf bankruptcy court to free it from its sponsorship, blaming AI features that never worked", "s": "Salesforce asked the bankruptcy court in New Jersey to force LIV Golf to decide quickly whether to assume or reject its $6.75 million-a-year sponsorship through 2029, and said it prefers rejection, Bloomberg Law reported Friday. Salesforce says LIV never delivered a fan “digital caddie” or live AI predictions and that its Agentforce chatbot erred at events.", "paras": ["Salesforce asked the bankruptcy court in New Jersey to force <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">LIV Golf<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The league plays its Miami event at Doral. Sergio Garcia left it on Oct. 29, the latest departure.<\/span><\/button> to decide quickly whether to <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">assume or reject<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Section 365(d)(2) of the Bankruptcy Code lets a contract counterparty ask the court to set that deadline before a plan is confirmed.<\/span><\/button> its $6.75 million-a-year sponsorship through 2029, and said it prefers rejection, Bloomberg Law reported Friday. Salesforce says LIV never delivered a fan “digital caddie” or live AI predictions and that its Agentforce chatbot erred at events. The next payment is due Jan. 4, two days before LIV’s restructuring takes effect. A hearing is set for Nov. 19."], "why": "A sponsor using a debtor’s bankruptcy to exit a deal over AI performance is a template other brand partners will study.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Bloomberg Law", "u": "https://news.bloomberglaw.com/bankruptcy-law/salesforce-aims-to-end-liv-golf-sponsorship-deal-over-ai-bugs", "t": "C"}, {"n": "EssentiallySports via Yahoo", "u": "https://sports.yahoo.com/articles/200-billion-tech-giant-targets-182719283.html", "t": "C"}, {"n": "Front Office Sports (background)", "u": "https://frontofficesports.com/article/liv-readies-for-next-phase-of-bankruptcy-as-court-proceedings-ramp-up/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}], "week": [], "cover": "img/2026-10-31/s1.webp?h=3ba0b022"}, {"date": "2026-10-30", "no": 155, "min": 8.4, "stand": "A 95-year-old law firm moves to close, Big Tech borrows to build AI, and a Boca Raton alarm company goes to an AI holding company.", "note": "Editor’s note. 13 items at 2,023 read-words, under the ten-minute cap. Weil’s dissolution leads; the decision was first reported late Wednesday, and this edition runs it on Thursday’s wind-down terms and Reuters’ account. Not run: DoorDash’s $17 billion agreement for Instacart (the announcement could not be placed inside the window); a Bloomberg report that Nvidia may guarantee credit for Nscale’s West Virginia data center for Anthropic (one paywalled report); Universal Music’s third quarter; GM’s $220 million privacy settlement with 36 states; Intel’s after-hours fall; Marvell and Lumentum, still unsigned. Watch: the Public Investment Fund’s LIV Golf decision and the Concord v. Anthropic Daubert hearing, both today; a possible ruling in the Alaska suit; Weil’s partner vote; Apple’s results Nov. 2; Election Day Tuesday; GFL bids Nov. 9; the new Knesset Nov. 10. Sourcing limits: Reuters, The Wall Street Journal, Bloomberg, The New York Times and CNBC could not be opened directly, so several items rest on syndicated copies or reports citing them; the Harvey item is single-source; the seven-year auction result comes from market reports, not the Treasury. No item concerns Anthropic, whose model compiles this paper, though Amazon is an Anthropic investor.", "items": [{"id": "s1", "sec": "The Front", "sid": "s-front", "h": "Weil Gotshal moves to dissolve after 95 years, promising staff 90 days’ pay as partners prepare to vote", "s": "Weil, Gotshal &amp; Manges, the New York firm with about 1,200 lawyers and more than $2 billion of revenue last year, plans to wind down after its management committee recommended dissolution to partners, Reuters reported Thursday. The partnership must still vote.", "paras": ["Weil, Gotshal &amp; Manges, the New York firm with about 1,200 lawyers and more than $2 billion of revenue last year, plans to wind down after its management committee recommended dissolution to partners, Reuters reported Thursday. The partnership must still vote. Weil intends to close <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">out of court<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>No bankruptcy case is needed while a firm stays solvent and pays employees, landlords and lenders. Stroock, which dissolved in 2023, took two years to settle with its major creditors.<\/span><\/button>, advised by <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">AlixPartners<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The turnaround firm follows consultants Weil had already hired to comb through obligations such as pensions and office leases, Above the Law reported.<\/span><\/button> and restructuring counsel from Davis Polk.", "In a message reported by Above the Law, the firm said associates, counsel, <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">non-capital partners<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Salaried partners who hold no equity, so in a dissolution they are paid like employees rather than sharing in what is left over.<\/span><\/button> and staff who stay will receive up to 90 days of salary and benefits. Staff bonuses come in mid-December, and associates who remain through Jan. 1 are paid in early January. Lawyers were told to keep billing and collecting. More than 30 partners left this year, including members of the executive committee, and it is unclear what the firm owes partners under its <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">partnership agreement<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>It governs capital accounts and unfunded retirement promises. In Dewey &amp; LeBoeuf’s 2012 bankruptcy, former partners paid about $71.5 million into a settlement to avoid clawback suits.<\/span><\/button>, Reuters reported.", "The unraveling took weeks. Merger talks with Willkie Farr broke down this month, and Ramona Nee backed away from succeeding longtime leader Barry Wolf. Days earlier Weil had told The Wall Street Journal that “no decision has been made to dissolve the firm.” Bloomberg columnist Matt Levine called it a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">run on the law firm<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Levine likened it to the Reserve Primary Fund breaking the buck in 2008, when early exits made staying irrational for everyone left.<\/span><\/button>, and David Lat wrote that Weil, which carried no debt, may be the most prestigious firm ever to collapse. Clients include Apple, Goldman Sachs and Dow."], "why": "The largest BigLaw failure since Dewey puts about 1,200 lawyers, a leading restructuring and private equity bench, and its clients into the lateral market at once, and shows that partner flight alone can end a debt-free firm.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 1}, "src": [{"n": "Reuters explainer", "u": "https://au.investing.com/news/stock-market-news/explainerwhats-next-for-law-firm-weil-gotshal-as-it-plans-dissolution-4727309", "t": "C"}, {"n": "Above the Law", "u": "https://abovethelaw.com/2026/10/weils-wind-down-message-to-associates-good-luck-out-there-and-dont-forget-your-timesheets/", "t": "C"}, {"n": "Fox Business", "u": "https://www.foxbusiness.com/economy/wall-street-law-firm-handled-enron-lehman-brothers-bankruptcies-plans-dissolve-nearly-century", "t": "R"}, {"n": "Money Stuff", "u": "https://news.bloomberglaw.com/securities-law/matt-levines-money-stuff-run-on-the-law-firm", "t": "C"}, {"n": "Original Jurisdiction", "u": "https://davidlat.substack.com/p/weil-gotshal-manges-biglaw-firm-failure-collapse-dissolution", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-10-30/s1.webp?h=8de49911", "col": "#39392a", "cap": "767 Fifth Avenue, the General Motors Building, where Weil lists more than 500 lawyers.", "credit": "Pablo Costa Tirado, CC BY-SA 3.0 / Wikimedia Commons", "pull": {"text": "“We recognize that asking everyone to remain focused on their work during a period of such personal uncertainty is difficult.”", "attr": "Weil leadership, message to lawyers, via Above the Law, Oct. 29"}}, {"id": "s2", "sec": "The Front", "sid": "s-front", "h": "Amazon’s free cash flow runs $42 billion negative as Microsoft sells its first bonds since 2017 and Alphabet sheds $500 billion", "s": "Amazon said Thursday that free cash flow over the past 12 months was minus $42.4 billion, against $14.8 billion a year earlier, after $215.2 billion of capital spending, and that long-term debt reached $173.1 billion, up from $65.6 billion at the end of 2025. AWS revenue grew 39% to $46.0 billion on total sales of $201.9 billion, and the shares fell as much as 9% after hours, Deadline reported.", "paras": ["Amazon said Thursday that free cash flow over the past 12 months was minus $42.4 billion, against $14.8 billion a year earlier, after $215.2 billion of capital spending, and that long-term debt reached $173.1 billion, up from $65.6 billion at the end of 2025. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">AWS<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Andy Jassy said he expects growth above 40% in both 2027 and 2028, the forecast the spending is sized to, Constellation Research reported.<\/span><\/button> revenue grew 39% to $46.0 billion on total sales of $201.9 billion, and the shares fell as much as 9% after hours, Deadline reported.", "Earlier, Microsoft sought at least $25 billion in 10 tranches, its <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">first U.S. bond sale since 2017<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Microsoft and Johnson &amp; Johnson are the only AAA-rated U.S. companies, so its spread prices AI debt with almost no credit risk attached.<\/span><\/button>, Bloomberg reported. Alphabet fell 12.6%, erasing about $500 billion, the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">second-largest one-day loss<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Nvidia lost about $593 billion on Jan. 27, 2025, the day China’s DeepSeek released a low-cost reasoning model.<\/span><\/button> on record, Platformer reported."], "why": "The three largest cloud builders now fund AI with debt rather than cash flow, which moves the risk from shareholders to bondholders.", "c": {"L": 0, "LL": 1, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Amazon third-quarter release", "u": "https://ir.aboutamazon.com/news-release/news-release-details/2026/Amazon-com-Announces-Third-Quarter-Results/", "t": null}, {"n": "Deadline", "u": "https://uk.finance.yahoo.com/news/amazon-shares-fall-q3-earnings-202746508.html", "t": "C"}, {"n": "Bloomberg via Investing.com", "u": "https://www.investing.com/news/stock-market-news/microsoft-seeks-at-least-25-billion-in-first-bond-sale-since-2017-4983281", "t": "C"}, {"n": "Platformer", "u": "https://www.platformer.news/thursday-newsletter-6/", "t": "C"}, {"n": "CNN", "u": "https://www.cnn.com/2026/10/29/investing/alphabet-google-stock-ai", "t": "LL"}], "framing": "", "min": 1, "front": true, "img": "img/2026-10-30/s2.webp?h=754f116d", "col": "#2d3c33", "cap": "", "credit": "Sea Cow, CC BY-SA 4.0 / Wikimedia Commons", "pull": null}, {"id": "s3", "sec": "AI", "sid": "s-ai", "h": "Harvey buys Aida, its fifth acquisition this year, to map how law firms’ knowledge fits together", "s": "Harvey has acquired Aida, a sales-execution startup founded by Glean co-founder Piyush Prahladka and Atish Das Sarma, Artificial Lawyer reported Thursday, its fifth purchase of 2026 after Benchmark in July and Guardails in September. Terms were not disclosed.", "paras": ["Harvey has acquired Aida, a sales-execution startup founded by <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Glean<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>An enterprise search company that indexes a business’s internal documents, the same retrieval problem Harvey faces inside a law firm.<\/span><\/button> co-founder Piyush Prahladka and Atish Das Sarma, Artificial Lawyer reported Thursday, its fifth purchase of 2026 after Benchmark in July and Guardails in September. Terms were not disclosed. The team joins Harvey’s product and engineering groups to build firm-specific <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">ontologies<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A structured map linking matters, clauses, people and precedents, so a model can retrieve what a firm already knows rather than what the open web says.<\/span><\/button>. Chief executive Winston Weinberg said unlocking that knowledge “will fundamentally change how they work.”"], "why": "Legal AI vendors are buying their way into a firm’s institutional memory, the asset that walks out the door when partners leave.", "c": {"L": 0, "LL": 0, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "Artificial Lawyer", "u": "https://www.artificiallawyer.com/2026/10/29/harvey-buys-aida-5th-purchase-in-2026/", "t": null}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-30/s3.webp?h=10dac0cf", "col": "#004155", "cap": "", "credit": "Energyme, CC BY-SA 4.0 / Wikimedia Commons", "pull": null}, {"id": "s4", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Kushner’s Thrive Holdings agrees to take Boca Raton’s ADT private for $15.3 billion, with Apollo funding the deal", "s": "ADT agreed Thursday to be acquired by Thrive Holdings for $10 a share in cash, a 45.6% premium to the unaffected Oct. 27 close, valuing the home-security company at about $7.6 billion in equity and $15.3 billion with debt, the companies said. Funds managed by Apollo committed all the financing, with no financing condition, and ADT shares rose 34%.", "paras": ["ADT agreed Thursday to be acquired by <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Thrive Holdings<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Built as permanent capital with no fund life, it buys service businesses such as accounting and IT firms to run them with AI rather than to resell them.<\/span><\/button> for $10 a share in cash, a 45.6% premium to the unaffected Oct. 27 close, valuing the home-security company at about $7.6 billion in equity and $15.3 billion with debt, the companies said. Funds managed by <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Apollo<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Apollo bought ADT in 2016 and took it public in 2018. This time its funds supply the financing rather than the equity.<\/span><\/button> committed all the financing, with no financing condition, and ADT shares rose 34%.", "A <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">go-shop<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A window after signing in which the target may court rival bidders, usually with a reduced break fee owed to the first buyer.<\/span><\/button> runs to Nov. 28, and closing is expected in the first quarter of 2027. Cravath represents ADT and Kirkland &amp; Ellis represents Thrive. Thrive, spun out of Josh Kushner’s Thrive Capital, counts OpenAI as a partner supplying models and engineers and plans to make ADT the base of a smart-home business, TechCrunch reported."], "why": "A take-private by an AI holding company, financed entirely by private credit, brings the newest buyout model to a South Florida public company.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "ADT and Thrive release", "u": "https://www.globenewswire.com/news-release/2026/10/29/3391374/0/en/adt-to-be-acquired-by-thrive-holdings-in-15-3-billion-transaction.html", "t": null}, {"n": "TechCrunch", "u": "https://techcrunch.com/2026/10/29/openai-backed-thrive-holdings-acquires-adt/", "t": "C"}, {"n": "Bloomberg", "u": "https://www.bloomberg.com/news/articles/2026-10-29/kushner-s-thrive-holdings-to-buy-adt-for-7-6-billion-in-cash", "t": "C"}, {"n": "Axios Pro", "u": "https://www.axios.com/pro/all-deals/2026/10/29/thrive-holdings-adt-15b-take-private", "t": "C"}, {"n": "Investing.com", "u": "https://www.investing.com/news/stock-market-news/adt-stock-spikes-34-on-76-billion-takeover-deal-by-josh-kushners-thrive-4984472", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-30/s4.webp?h=05ec7115", "col": "#333b2a", "cap": "The Boca Raton building that housed ADT under Tyco.", "credit": "Coolcaesar, CC BY-SA 3.0 / Wikimedia Commons", "pull": null}, {"id": "s5", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Monte dei Paschi shareholders reject their chief’s defense, clearing a path for Intesa’s €33 billion bid", "s": "Holders of about 60% of Monte dei Paschi capital on Thursday rejected chief executive Luigi Lovaglio’s all-share counteroffers for Banco BPM and Banca Generali, after voting down a full merger with Mediobanca, Reuters reported. Intesa Sanpaolo’s offer is worth about €33 billion, and the ECB approved it this week.", "paras": ["Holders of about 60% of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Monte dei Paschi<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Founded in 1472, it is the oldest bank still operating; Italy rescued it in 2017 and sold down its stake in 2023 and 2024.<\/span><\/button> capital on Thursday rejected chief executive Luigi Lovaglio’s all-share counteroffers for Banco BPM and Banca Generali, after voting down a full merger with Mediobanca, Reuters reported. Intesa Sanpaolo’s offer is worth about €33 billion, and the ECB approved it this week. Intesa plans to sell about half of the bank’s roughly 1,200 branches to <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Unipol<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The Bologna insurer is BPER’s largest shareholder, which is why the branches are to be combined with BPER’s network.<\/span><\/button>. Italy’s antitrust ruling is due in November."], "why": "Europe’s largest bank takeover fight was settled by a shareholder vote, and the defense failed once a top holder, Delfin, signed with the bidder.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Reuters via Euronext", "u": "https://live.euronext.com/en/financial-news/mps-investors-sink-ceos-defence-plan-against-intesa-bid", "t": "C"}, {"n": "Bloomberg", "u": "https://www.bloomberg.com/news/articles/2026-10-29/monte-paschi-investors-reject-banco-bpm-bid-in-win-for-intesa", "t": "C"}, {"n": "ANSA", "u": "https://ansa.it/toscana/notizie/2026/10/29/soci-mps-bocciano-lofferta-su-bpm-primo-stop-al-piano-lovaglio_b7d11825-be24-4b36-8d4e-8ea626d1e603.html", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}, {"id": "s6", "sec": "Markets & Deals", "sid": "s-mkt", "h": "The ECB holds at 2.5% as Lagarde says she will leave nine months early, and the Bank of Japan holds 8 to 1", "s": "The European Central Bank kept its deposit rate at 2.50% on Thursday after two increases in five months, and Christine Lagarde said she will step down in February 2027, nine months before her term ends, The Irish Times reported. Klaas Knot and Pablo Hernández de Cos are named as successors.", "paras": ["The European Central Bank kept its deposit rate at 2.50% on Thursday after two increases in five months, and Christine Lagarde said she will step down in February 2027, nine months before her term ends, The Irish Times reported. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Klaas Knot<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>The former Dutch central bank governor is backed by the Netherlands; Spain backs its own former governor.<\/span><\/button> and Pablo Hernández de Cos are named as successors. The Bank of Japan held at 1.25% on Friday, with one member voting to raise, Reuters reported. A $44 billion <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">seven-year note<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The sale came a day after the Fed held, so its yield is an early market read on how long rates stay high.<\/span><\/button> auction cleared at 4.894%, MarketScreener reported."], "why": "Central banks are holding or tightening with oil above $110, and an early handover at the ECB adds succession risk to European rates.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "The Irish Times", "u": "https://www.irishtimes.com/business/2026/10/29/ecb-holds-rates-steady-as-lagardes-departure-overshadows-decision/", "t": null}, {"n": "Reuters via Yahoo (BoJ)", "u": "https://finance.yahoo.com/economy/policy/articles/instant-view-analysts-react-boj-032614967.html", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-30/s6.webp?h=b8f4fd00", "col": "#0b3e50", "cap": "", "credit": "Thomas Wolf, www.foto-tw.de, CC BY-SA 3.0 de / Wikimedia Commons", "pull": null}, {"id": "s7", "sec": "Law & the Courts", "sid": "s-law", "h": "The Justice Department amends its Alaska certification suit, adding a Supremacy Clause claim to moot three dismissal motions", "s": "The Justice Department filed an amended complaint Thursday in its suit to block Alaska from certifying the Senate race if Sen. Dan Sullivan loses by fewer votes than went to Daniel J.", "paras": ["The Justice Department filed an <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">amended complaint<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A party may amend once as of right within 21 days of a motion to dismiss, and the new pleading supersedes the old, so motions aimed at it fall without a ruling on the merits.<\/span><\/button> Thursday in its suit to block Alaska from certifying the Senate race if Sen. Dan Sullivan loses by fewer votes than went to <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Daniel J. Sullivan<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Alaska’s ranked-choice system, adopted by ballot measure in 2020, transfers votes from eliminated candidates, the mechanism the department says confusion distorts.<\/span><\/button>, adding a Supremacy Clause count and asking Judge Sharon Gleason to deny three dismissal motions as moot, Democracy Docket reported. Gleason on Wednesday let the League of Women Voters and others intervene."], "why": "The amendment buys time and keeps a federal court poised over a Senate certification days before Tuesday’s vote.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "Democracy Docket", "u": "https://www.democracydocket.com/news-alerts/doj-seeks-to-wipe-out-bids-to-dismiss-alaska-election-case-after-amending-lawsuit/", "t": null}, {"n": "Juneau Independent", "u": "https://www.juneauindependent.com/post/trump-ordered-lawsuit-in-alaska-s-us-senate-race-gains-intensity-after-peltola-campaign-revelations", "t": "C"}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/10/29/alaska-senate-governor-investigation-sullivan-peltola-doj.html", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-30/s7.webp?h=45853063", "col": "#43342c", "cap": "", "credit": "James Brooks, CC BY 2.0 / Wikimedia Commons", "pull": null}, {"id": "s8", "sec": "Law & the Courts", "sid": "s-law", "h": "The SEC charges two firms that used fake SEC filings and a counterfeit agency seal to raise $130 million", "s": "The Securities and Exchange Commission on Thursday charged BG Wealth Sharing and DSJ Exchange with taking more than $130 million from tens of thousands of retail investors in over 40 states between October 2025 and June 2026 in a Ponzi-like crypto scheme. The two Colorado-incorporated, foreign-operated entities filed false Form D and Form ADV documents and showed investors certificates bearing a fake seal, the agency said.", "paras": ["The Securities and Exchange Commission on Thursday charged BG Wealth Sharing and DSJ Exchange with taking more than $130 million from tens of thousands of retail investors in over 40 states between October 2025 and June 2026 in a Ponzi-like crypto scheme. The two Colorado-incorporated, foreign-operated entities filed false <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Form D<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A notice of an exempt private offering that the agency does not review before it appears on EDGAR, so its presence proves nothing about legitimacy.<\/span><\/button> and Form ADV documents and showed investors certificates bearing a fake seal, the agency said. It has removed the filings from its site."], "why": "EDGAR publishes what filers submit, and fraudsters are selling that publication as an endorsement.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "SEC release 2026-110", "u": "https://www.sec.gov/newsroom/press-releases/2026-110-two-entities-charged-130-million-fraud-scheme-used-false-sec-filings-boost-investor-confidence", "t": null}, {"n": "ABA Banking Journal", "u": "https://bankingjournal.aba.com/2026/10/sec-charges-two-entities-in-130-million-fraud-scheme-using-false-filings-to-boost-investor-confidence", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-30/s8.webp?h=d3a80973", "col": "#2e3c33", "cap": "", "credit": "AgnosticPreachersKid, CC BY-SA 3.0 / Wikimedia Commons", "pull": null}, {"id": "s9", "sec": "The World", "sid": "s-world", "h": "Iran confirms it has Vance’s letter but sends no reply as the Houthis claim strikes on six Saudi targets", "s": "Iranian news agencies said Thursday that Tehran had received a letter from Vice President JD Vance, delivered by Qatari mediators to Mohsen Rezaei, and had not replied. The letter proposes talks led by Vance, possibly next week in Qatar or Turkey, with the nuclear issue on the table from the start, The New York Times reported.", "paras": ["Iranian news agencies said Thursday that Tehran had received a letter from Vice President JD Vance, delivered by Qatari mediators to <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Mohsen Rezaei<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>He commanded the Revolutionary Guards from 1981 to 1997 and has run for president several times.<\/span><\/button>, and had not replied. The letter proposes talks led by Vance, possibly next week in Qatar or Turkey, with the nuclear issue on the table from the start, The New York Times reported. Parliament Speaker <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Mohammad Bagher Ghalibaf<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>A former Revolutionary Guards air force commander and Tehran mayor, he led Iran’s side in earlier rounds of talks.<\/span><\/button> said any deal requires acceptance of Iran’s seven conditions, Fox News reported.", "The Houthis claimed attacks Thursday on six Saudi sites, including the Ras Tanura refinery, <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Abqaiq<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>The world’s largest crude stabilization plant; a 2019 drone and missile strike on it briefly halved Saudi output.<\/span><\/button> and airports in Riyadh and Dammam, Al Jazeera reported. Saudi Arabia said it intercepted two missiles over Riyadh. December Brent rose $1.20 to $116.08 early Friday, headed for a fourth monthly gain, after a tanker leaving Hormuz was hit by explosives, Reuters reported."], "why": "Tehran’s silence and strikes on Saudi oil leave markets pricing war rather than talks, with Brent near $116 feeding the inflation central banks are fighting.", "c": {"L": 3, "LL": 0, "C": 1, "LR": 0, "R": 1}, "src": [{"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/10/29/what-we-know-of-vances-letter-to-rezaei-as-trump-warns-gulf-to-prepare", "t": "L"}, {"n": "New York Times via Inquirer", "u": "https://www.inquirer.com/news/nation-world/jd-vance-peace-talks-iran-20261029.html", "t": "L"}, {"n": "Fox News", "u": "https://www.foxnews.com/live-news/us-iran-war-trump-military-options-strait-hormuz-10-29-26", "t": "R"}, {"n": "Reuters via Business Recorder", "u": "https://www.brecorder.com/news/40446647/oil-set-for-fourth-monthly-gain-as-hormuz-tanker-attack-highlights-supply-risks-from-war", "t": "C"}, {"n": "Al Jazeera on the Houthi claims", "u": "https://www.aljazeera.com/news/2026/10/30/houthi-forces-claim-six-attacks-on-saudi-airports-oil-facilities", "t": "L"}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-30/s9.webp?h=c430129b", "col": "#47322a", "cap": "", "credit": "Hasso Hohmann, CC BY 4.0 / Wikimedia Commons", "pull": null}, {"id": "s10", "sec": "The World", "sid": "s-world", "h": "Israel’s final count leaves Netanyahu’s bloc at 53 and Eisenkot’s at 48, and Likud says the vote was ‘stolen’", "s": "With all votes counted, Prime Minister Benjamin Netanyahu’s bloc won 53 of 120 Knesset seats and Gadi Eisenkot’s 48, while Arab-led parties won a record 19 on 77.9% turnout, the Times of Israel reported. Likud rose to 27 seats after the double-envelope count.", "paras": ["With all votes counted, Prime Minister Benjamin Netanyahu’s bloc won 53 of 120 Knesset seats and Gadi Eisenkot’s 48, while Arab-led parties won a record 19 on 77.9% turnout, the Times of Israel reported. Likud rose to 27 seats after the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">double-envelope<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Ballots of soldiers, diplomats, prisoners and hospital patients, counted last and nationally, which is how a party gains a seat after election night.<\/span><\/button> count. Elections chief Noam Sohlberg ordered an inquiry after the Shin Bet passed him material on alleged foreign funding of Arab turnout, and Likud said the election was “stolen.” Qatar denied involvement. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">President Isaac Herzog<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>After con  <span class="lbl">Appearance</span><div class="tiles">${A.map(([k,n,c])=>`<button class="tile" data-appear="${k}" aria-pressed="${cur===k}"><span class="sw ${c}" aria-hidden="true">Aa</span><span>${n}</span></button>`).join('')}</div>
 ${pushable()?`<span class="lbl">Notification</span><div id="pushbox"></div>`:''}
 <span class="lbl">Read these first</span><div class="caps">${ALLSEC.map(n=>`<button data-like="${n}" aria-pressed="${S.like.includes(n)}">${short(n)}</button>`).join('')}</div><p class="small">Sections you pick move up the paper.</p>`,'Reading settings','set');
 const box=$('#pushbox');if(box&&pushable()){if(!standalone()&&/iPhone|iPad/.test(navigator.userAgent)){box.innerHTML='<p class="small" style="margin-top:0!important">To get the 7:00 AM headline, add the Brief to your Home Screen first: Share, then Add to Home Screen.</p>'}
  else Promise.race([pushState(),new Promise(r=>setTimeout(()=>r('none'),2000))]).then(st=>{if(st==='none'){box.previousElementSibling.hidden=true;box.remove();return}box.innerHTML=`<div class="rowt"><span>7:00 AM headline</span><button class="sw2" role="switch" data-a="push" aria-checked="${st==='on'}" aria-label="7:00 AM headline"></button></div><p class="small" id="pushnote">One headline each morning, when the paper is out.</p>`})}}
// Contents, as Apple Books lays out a book's: the edition's size, then each section with its stories numbered in
// reading order; a story opens from here and swiping carries on in the same order.
function contents(){let k=0;sheet(`<p class="cmeta tn">No. ${E.no} · ${E.items.length} stories · ${Math.max(1,Math.round(E.min))} min read</p>${secs(E).map(g=>`<section class="cgrp" aria-label="${esc(nm(g.name))}"><h3 class="csec">${g.name}</h3>${g.rows.map(([it,i])=>`<button class="crow" data-open="${i}"><span class="cn tn" aria-hidden="true">${++k}</span><span class="ch">${it.h}</span></button>`).join('')}</section>`).join('')}`,'Contents')}
function fs(d){const i=Math.max(0,Math.min(FS.length-1,FS.indexOf(S.fs)+d));S.fs=FS[i];document.documentElement.style.setProperty('--fs',S.fs);save();const v=$('#fv');if(v)v.textContent=Math.round(S.fs*100)+'%'}
app.addEventListener('click',ev=>{const T=ev.target;if(performance.now()-flungAt<200){ev.preventDefault();return}
 const g=T.closest('.gloss');if(g){const b=g.querySelector('.gloss-body'),k=b.querySelector('.gloss-kind');sheet(`<div class="kick">${k?k.textContent:''}</div><h3 style="margin-top:6px">${g.firstChild.textContent}</h3><p>${b.textContent.replace(k?k.textContent:'','')}</p>`,'Note');return}
 const s=T.closest('[data-s]');if(s){story(+s.dataset.s,s);return}
 const o=T.closest('[data-open]');if(o){closeS(1);setTimeout(()=>story(+o.dataset.open,$('[data-a="contents"]')),RM()?0:200);return}
 const e=T.closest('[data-ed]');if(e){openEdition(+e.dataset.ed);return}
 const go=T.closest('[data-go]');if(go){const n=document.getElementById(go.dataset.go),tb=$('.tabs');if(tb)tb.classList.remove('away');jumping=1;jumpTick();n&&n.scrollIntoView({behavior:RM()?'auto':'smooth'});return}
 const ap=T.closest('[data-appear]');if(ap){S.appear=ap.dataset.appear;save();theme();$$('[data-appear]').forEach(b=>b.setAttribute('aria-pressed',b===ap));return}
 const l=T.closest('[data-like]');if(l){const n=l.dataset.like,i=S.like.indexOf(n);i<0?S.like.push(n):S.like.splice(i,1);l.setAttribute('aria-pressed',i<0);save();dirty=true;return}
 const a=T.closest('[data-a]');if(!a)return;const k=a.dataset.a;
 if(k==='close')closeS();
 else if(k==='closest')closest();
 else if(k==='today'){if(tab==='today'&&E===ED[0]){$('#sc').scrollTo({top:0,behavior:RM()?'auto':'smooth'});return}if(tab==='past'&&mode==='archive'&&nav(1))return;keep();tab='today';E=ED[0];today()}
 else if(k==='past'&&a.closest('.nb')){backToPast()}
 else if(k==='past'){if(tab==='past'&&mode==='archive'){$('#sc').scrollTo({top:0,behavior:RM()?'auto':'smooth'});return}if(tab==='today'&&E===ED[0]?nav(-1):nav(1))return;past()}
 else if(k==='contents')contents();else if(k==='set')settings();else if(k==='who')who();
 else if(k==='full'){const fb=$('#fb');fb.hidden=false;a.hidden=true;fb.classList.add('in');const p=$('.p',fb);if(p)p.focus({preventScroll:true})}
 else if(k==='note')sheet(`<p>${E.note.replace(/^\s*Editor’s note\.?\s*/i,'')}</p>`,'Editor’s note');
 else if(k==='push')pushToggle(a);
 else if(k==='fs+')fs(1);else if(k==='fs-')fs(-1)});
document.addEventListener('keydown',e=>{if((e.key==='ArrowRight'||e.key==='ArrowLeft')&&$('#st')&&!$('#sh')&&!/INPUT|TEXTAREA/.test(e.target.tagName)){e.preventDefault();page(e.key==='ArrowRight'?1:-1);return}if(e.key==='Escape'){if($('#sh'))closeS();else if($('#st'))closest();else if(tab==='past'&&mode==='paper')backToPast(0)}if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('gloss')){e.preventDefault();e.target.click()}});
const nyNow=()=>{const p=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hour12:false}).formatToParts(new Date()),g=t=>p.find(x=>x.type===t).value;return{date:`${g('year')}-${g('month')}-${g('day')}`,hour:+g('hour')%24}};
const LOADED=nyNow().date;
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&nyNow().date!==LOADED&&navigator.onLine!==false){keep();location.reload()}});
if(!!navigator.serviceWorker&&/\/brief\//.test(location.pathname)){navigator.serviceWorker.register('sw.js').then(r=>{const keepImgs=ED.flatMap(e=>e.items.map(x=>x.img).filter(Boolean));navigator.serviceWorker.ready.then(s=>s.active&&s.active.postMessage({keep:keepImgs,warm:ED[0].items.map(x=>x.img).concat(ED.map(e=>e.cover)).filter(Boolean).map(u=>new URL(u,location.href).href)}))}).catch(()=>{})}
addEventListener('pagehide',keep);S.pos[ED[0].date]=0;today();intro();

</script>
