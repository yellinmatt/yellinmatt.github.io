 in this case about 18 months.<\/span><\/button> for each share, a ratio that implied about $1,132 and a 23.9% premium to the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">unaffected close<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Oct. 28 is the last session before speculation began. Marvell fell about 13% the next day on reports of the talks, so the reference price predates the first leg of the slide.<\/span><\/button> of Oct. 28. Marvell holders keep about 67%. Three Lumentum directors, including chief executive Michael Hurlston, join a seven-member board, and Matt Murphy stays chairman and CEO. The companies project more than <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">$1 billion in annual cost synergies<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>BofA argues that sum cannot offset the share count, which it expects to rise about 50%.<\/span><\/button> and a close in the first half of 2028, after both stockholder votes and regulatory approval. Wilson Sonsini advised Marvell, with Qatalyst, J.P. Morgan and Goldman Sachs. Davis Polk advised <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Lumentum<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Nvidia put $2 billion into each company in March, the Lumentum stake alongside a laser purchase agreement, so buyer and target share an investor.<\/span><\/button>, with Citi and Evercore.", "At Monday’s close the same 4.5 shares were worth about $771, roughly 32% under the headline price and, on this paper’s arithmetic, about 16% below Lumentum’s unaffected level near $914. Lumentum trades about 11% under even that $771. The release mentions no collar. BofA cut Marvell to neutral from buy and its target to $225 from $400, citing the China review, the long wait for closing and possible conflicts with customers."], "why": "The premium has inverted before any vote. A stock deal is priced by the buyer’s holders, and they have now repriced this one, which gives Lumentum’s board and its counsel an 18-month problem with no floor in the disclosed terms.", "c": {"L": 0, "LL": 0, "C": 5, "LR": 0, "R": 0}, "src": [{"n": "Marvell release", "u": "https://investor.marvell.com/news-events/press-releases/detail/1040/marvell-and-lumentum-to-combine-creating-a-category-leader-in-ai-connectivity", "t": null}, {"n": "TechCrunch", "u": "https://techcrunch.com/2026/11/02/in-one-of-the-largest-deals-in-tech-history-marvell-buys-lumentum-for-115b/", "t": "C"}, {"n": "Bloomberg", "u": "https://www.bloomberg.com/news/articles/2026-11-02/marvell-reaches-115-billion-deal-for-lumentum-holdings", "t": "C"}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/11/02/marvell-lumentum-ai-deal.html", "t": "C"}, {"n": "Reuters via WHBL", "u": "https://whbl.com/2026/11/02/marvell-to-buy-lumentum-in-115-billion-deal-in-ai-data-center-bet/", "t": "C"}, {"n": "Investing.com on BofA", "u": "https://www.investing.com/news/analyst-ratings/marvell-stock-downgraded-by-bofa-on-lumentum-deal-concerns-93CH-4994008", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-03/s1.webp?h=67bc2409", "col": "#283b41", "cap": "Marvell’s Santa Clara headquarters, seen from Highway 237 in 2011.", "credit": "King of Hearts, CC BY-SA 3.0 / Wikimedia Commons", "pull": {"text": "“…an opportunity that comes along once in a generation.”", "attr": "Matt Murphy, Marvell chairman and CEO, Nov. 2"}, "chart": {"t": "Value per Lumentum share", "type": "bar", "rows": [["Deal at announcement", 1132, "$1,132"], ["Lumentum, unaffected", 914, "$914"], ["Deal at Monday close", 771, "$771"]]}}, {"id": "s2", "sec": "The Front", "sid": "s-front", "h": "U.S. strikes Iran’s Qeshm Island on the eve of the midterms", "s": "The Wall Street Journal says the raids have run quietly for weeks. Officials call them limited, and Central Command has not commented. Brent fell more than 7% Monday on hopes for Iran’s two-day Hormuz offer.", "paras": ["The United States struck <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Qeshm Island<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>The largest island in the Gulf, it hosts an underground missile site and a major desalination plant.<\/span><\/button>, about 14 miles from Bandar Abbas, on Monday, and The Wall Street Journal reported the raids are part of a series carried out without announcement in recent weeks. A U.S. official told Reuters the strikes “appeared to be limited and were not a resumption of major combat operations.” Another called them defensive measures against surface-to-air missiles, and one told CNN that Iran had fired at a U.S. aircraft. Central Command did not comment, so no U.S. confirmation is on the record.", "Iranian state media reported five explosions. Foreign ministry spokesman Esmail Baqaei said the ball is in the American court on Tehran’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">two-day Hormuz offer<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>No public U.S. acceptance exists. The plan requires an end to the blockade and to hostilities before ships move.<\/span><\/button>. Trump said, “This isn’t a war.” Reuters could not verify an IRGC claim that four tankers exploded on unauthorized routes. Brent fell more than 7% Monday to about $105 and traded near $106 Tuesday."], "why": "One official said the campaign stayed quiet to avoid signaling a return to major combat, while Trump says there has been no fighting for months. Oil traded the diplomacy, not the strikes, and that is the bet to watch.", "c": {"L": 1, "LL": 3, "C": 1, "LR": 0, "R": 1}, "src": [{"n": "CNN", "u": "https://www.yahoo.com/news/us/articles/us-military-conducts-strikes-iran-023749786.html", "t": "LL"}, {"n": "Reuters via Jerusalem Post", "u": "https://www.jpost.com/middle-east/iran-news/article-913644", "t": "C"}, {"n": "NBC", "u": "https://www.nbcwashington.com/news/national-international/us-military-limited-strikes-iran-qeshm-island/4175809/", "t": "LL"}, {"n": "ABC", "u": "https://abcnews.com/International/us-carries-defensive-airstrikes-irans-qeshm-island-officials/story?id=137792518", "t": "LL"}, {"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/3/explosions-hit-irans-qeshm-island-as-us-media-report-us-strikes-in-hormuz", "t": "L"}, {"n": "Fox News", "u": "https://www.foxnews.com/live-news/iran-war-news-trump-midterms-peace-deal-israel-november-2", "t": "R"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-03/s2.webp?h=8c9116c7", "col": "#2b3a43", "cap": "", "credit": "Spc. Noah Martin, U.S. Army, Public domain / Wikimedia Commons", "pull": null}, {"id": "s3", "sec": "The Front", "sid": "s-front", "h": "Justices refuse the DOJ’s 20,000-ballot request", "s": "The Supreme Court denied it with no noted dissent. The same day, a Ninth Circuit panel lifted an order against the department’s prosecution threats. The dissent: “These two decisions cannot be reconciled.”", "paras": ["The Supreme Court on Monday evening denied, with no noted dissent, the Justice Department’s request to separate about 20,000 California mail ballots from voters it suspects are noncitizens. The order in United States v. California, No. 26A624, runs one sentence. Solicitor General D. John Sauer had <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">relied on 18 U.S.C. 611<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The statute is a misdemeanor ban on noncitizen voting in federal elections, not a ballot-handling rule.<\/span><\/button> after Judge David Carter and a divided Ninth Circuit panel refused. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">California’s mail ballots<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The state accepts them through Nov. 10, and the merits hearing is set for Nov. 13, so the order does not end the case.<\/span><\/button> stay in its normal count.", "A different Ninth Circuit panel went the other way the same day. In SEIU v. DOJ, No. 26-7303, Judge Carlos Bea stayed a restraining order by Judge Trina Thompson that had blocked the department’s prosecution threats, finding a likelihood of success on the merits and holding that <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Section 11(b) of the Voting Rights Act<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The provision bars voter intimidation. Bea read it as having no express private right of action and as not reaching the Executive, which would close the main civil route against federal officials.<\/span><\/button> does not reach those demands. Chief Judge Mary Murguia dissented: “These two decisions cannot be reconciled.”"], "why": "The Court shut the front door and the circuit left a side door open. County officials face Election Day with a federal prosecution threat revived hours before polls open, and experts say 42% of the DOJ’s list could not be matched to voter files.", "c": {"L": 0, "LL": 2, "C": 1, "LR": 0, "R": 1}, "src": [{"n": "Supreme Court order", "u": "https://www.supremecourt.gov/orders/courtorders/110226zr_3eb4.pdf", "t": null}, {"n": "Ninth Circuit order", "u": "https://cdn.ca9.uscourts.gov/datastore/opinions/2026/11/02/26-7303.pdf", "t": null}, {"n": "NPR", "u": "https://www.npr.org/2026/11/02/nx-s1-6023802/supreme-court-california-voting-ballots-trump", "t": "LL"}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/11/02/supreme-court-california-mail-ballots-election.html", "t": "C"}, {"n": "NBC", "u": "https://www.nbcnews.com/politics/supreme-court/rejects-trump-effort-target-alleged-noncitizen-voters-california-midte-rcna606607", "t": "LL"}, {"n": "Daily Wire", "u": "https://www.dailywire.com/news/supreme-court-makes-key-ruling-in-trump-admins-ballot-fight-on-election-eve", "t": "R"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-03/s3.webp?h=9bb28041", "col": "#3f3729", "cap": "", "credit": "USCapitol, Public domain / Wikimedia Commons", "pull": null}, {"id": "s4", "sec": "AI", "sid": "s-ai", "h": "Anthropic’s S‑1 shows a $17 billion quarter and a warning", "s": "Revenue rose to $17 billion, with a $567 million operating loss. The filing says the company may “imminently meet” its threshold for AI-accelerated progress. Anthropic’s model compiles this paper.", "paras": ["Anthropic, whose model compiles this paper, reported third-quarter revenue of $17 billion in an amended IPO filing Monday, up from $11.6 billion in the second quarter and $1.4 billion a year earlier. Sequential growth slowed to 47%. Operating expenses of $17.5 billion produced a $567 million operating loss after a $974 million profit, and the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">$23.3 billion net loss<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Most of it is a revaluation of convertible notes, largely held by Amazon and expected to convert at the IPO.<\/span><\/button> is mostly non-cash, Fortune reported. Of $895.4 billion in commitments, about $448 billion falls due by the end of 2030.", "A new risk factor says internal estimates “indicate that we may imminently meet” the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">threshold<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Gizmodo reports the definition as double the baseline rate of improvement. “Imminently” carries no timeline in the filing.<\/span><\/button> in its safety policy for “dramatically accelerated progress attributable to AI,” TechCrunch reported. No current model is designated over it. The filing adds that the company has “in the past not identified, and may in the future not identify, a significant acceleration.” Listing on Nasdaq as ANT is planned before the end of November."], "why": "Investors now hold a disclosure that the issuer may not detect its own threshold event. Whether that is candor or liability drafting, it is now a risk investors have to price.", "c": {"L": 1, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Fortune", "u": "https://fortune.com/2026/11/02/anthropics-growth-slowed-and-costs-jumped-in-the-third-quarter-updated-ipo-filing-shows/", "t": null}, {"n": "TechCrunch", "u": "https://techcrunch.com/2026/11/02/anthropic-warns-that-its-very-close-to-rsi-capability-aka-self-building-ai/", "t": "C"}, {"n": "The Next Web", "u": "https://thenextweb.com/news/anthropic-ipo-filing-17bn-revenue-commitments", "t": "C"}, {"n": "Forbes via Yahoo", "u": "https://finance.yahoo.com/technology/ai/articles/anthropic-hit-17-billion-third-153132560.html", "t": "C"}, {"n": "New York Times", "u": "https://www.nytimes.com/2026/11/02/technology/anthropic-ai-computing-power.html", "t": "L"}, {"n": "Gizmodo", "u": "https://gizmodo.com/anthropic-claims-to-be-closing-in-on-recursive-self-improvement-2000834175", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-03/s4.webp?h=c08df5f1", "col": "#3f3729", "cap": "", "credit": "King of Hearts, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "chart": {"t": "Anthropic revenue by quarter", "type": "bar", "rows": [["A year earlier", 1.4, "$1.4 billion"], ["Second quarter", 11.6, "$11.6 billion"], ["Third quarter", 17, "$17 billion"]]}}, {"id": "s5", "sec": "AI", "sid": "s-ai", "h": "The Times and Tribune papers sue Brave and name AI labs as its customers", "s": "They say Brave built a search index from their work and earned over $100 million reselling it. The complaint names AI labs as buyers. None of them is sued.", "paras": ["The New York Times and Tribune newspapers sued Brave Software in Manhattan federal court on Monday, alleging it built a search index of more than 30 billion pages from their work and earned over $100 million reselling it. The Times complaint, No. 26-cv-9549, pleads infringement, a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">DMCA Section 1201(a) count<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>That theory sidesteps fair use. Judge Lewis Kaplan let one survive in Ace Cam v. Runway AI on Oct. 30, holding that YouTube’s public availability “does not render it unprotected.”<\/span><\/button> and unjust enrichment. Its first paragraph names Anthropic, Perplexity, Mistral, xAI and Cohere as API buyers, none of them sued. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Brave<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The complaint says Times letters to chief executive Brendan Eich in August 2025 and April 2026 went unanswered.<\/span><\/button> had not responded in reports seen."], "why": "Suing the supplier reaches the labs without suing them. A win on Section 1201 would give publishers a claim that fair use cannot answer.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Complaint", "u": "https://chatgptiseatingtheworld.com/wp-content/uploads/2026/11/COMPLAINT-NYT-v.-Brave-Software-gov.uscourts.nysd_.676306.1.0.pdf", "t": null}, {"n": "TheWrap", "u": "https://www.thewrap.com/industry-news/tech/new-york-times-chicago-tribune-brave-ai-copyright-lawsuit/", "t": "C"}, {"n": "The Next Web", "u": "https://thenextweb.com/news/nyt-newspapers-sue-brave-ai-scraping", "t": "C"}, {"n": "PPC Land", "u": "https://ppc.land/new-york-times-and-three-papers-sue-brave-over-ai-answers-and-ad-blocking/", "t": "C"}, {"n": "Kaplan opinion", "u": "https://chatgptiseatingtheworld.com/wp-content/uploads/2026/11/Opinion-denying-MTD-in-Ace-Cam-v.-Runway-AI-gov.uscourts.nysd_.658148.61.0.pdf", "t": null}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-03/s5.webp?h=a67e77a1", "col": "#443518", "cap": "", "credit": "Michal Osmenda from Brussels, Belgium, CC BY-SA 2.0 / Wikimedia Commons", "pull": null}, {"id": "s6", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Treasury’s $618 billion reads as a cut. It isn’t.", "s": "The drop comes from a larger cash balance, Reuters noted; without it, the need is $24 billion higher. The 30-year closed at 5.28%. The refunding statement lands Wednesday.", "paras": ["Treasury said Monday it expects to borrow $618 billion this quarter, $10 billion below its August estimate, assuming $850 billion in cash at year-end. Reuters noted the cut comes from a larger starting balance; without it, the need is $24 billion higher. Next quarter’s estimate is $800 billion with a $1 trillion cash target. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Buyback operations<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Treasury buys old off-the-run issues to support liquidity, so a larger maximum eases long-end supply without touching auction sizes.<\/span><\/button> rise to a maximum of $6 billion from $2 billion.", "Par yields closed at 4.59% on the two-year, 4.91% on the 10-year and 5.28% on the 30-year, with the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">20-year at 5.31%<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>It sits above the 30-year, a kink in the very sector dealers expect to be trimmed first.<\/span><\/button>. Citi expects 20- and 30-year cuts to start this month, while JPMorgan expects guidance to hold into 2027, a relayed account. The statement lands at 8:30 a.m. Wednesday. Australia’s central bank raised rates to 4.85% on Tuesday, a 6-3 vote and its fifth rise this year."], "why": "Every convertible and bond priced this week discounts off these numbers. A cut to long-end sizes would tell the market Treasury is managing term premium, with two Fed dissents for a hike already on the record.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Reuters via Kitco", "u": "https://www.kitco.com/news/off-the-wire/2026-11-02/us-treasury-cuts-fourth-quarter-borrowing-estimate-618-billion", "t": "C"}, {"n": "Treasury par yields", "u": "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_yield_curve&field_tdr_date_value_month=202611", "t": null}, {"n": "ABC Australia", "u": "https://www.abc.net.au/news/2026-11-03/rba-interest-rates-markets-live-coverage/107338216", "t": "C"}, {"n": "TheStreet", "u": "https://pro.thestreet.com/stock-market-today/2026-11-02", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-03/s6.webp?h=fc46a3a7", "col": "#38392a", "cap": "The Treasury building in Washington.", "credit": "MeanieHyaena, CC BY 4.0 / Wikimedia Commons", "pull": null, "chart": {"t": "Treasury par yields at the close, Nov. 2", "type": "line", "rows": [["2Y", 4.59, "4.59%"], ["10Y", 4.91, "4.91%"], ["20Y", 5.31, "5.31%"], ["30Y", 5.28, "5.28%"]]}}, {"id": "s7", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Oracle spends its funding cap in five days", "s": "Oracle raised $20 billion Monday, using up its four-year funding cap in five days. Stock sold 11.2% below Friday’s close, and notes ran as high as 8.65%. Shares fell more than 8%.", "paras": ["Oracle priced $20 billion of stock and notes Monday, filling the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">cap<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Set at Investor Day on Oct. 28, it allowed $10 billion of equity and $10 billion of gross debt, excluding refinancing, through fiscal 2030.<\/span><\/button> it had announced five days earlier. It sold 86,206,897 shares at $116, 11.2% below the Oct. 30 close of $130.67, and five tranches from 7.00% due 2029 to 8.65% due 2046. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">BofA ran the book<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>As sole global coordinator it led both deals, which close Wednesday and are not conditioned on each other.<\/span><\/button>. The stock fell more than 8% to about $119. Borrowings stood at $125.34 billion on Aug. 31."], "why": "An 8.65% coupon is the price of AI capex in plain terms. The promise lasted a week, and the next raise tests what the cap meant.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Oracle release", "u": "https://www.stocktitan.net/news/ORCL/oracle-announces-pricing-of-20-billion-of-common-stock-and-senior-jz9c35ilep3f.html", "t": null}, {"n": "TheStreet", "u": "https://www.thestreet.com/investing/stocks/oracle-stock-sinks-as-wall-street-confronts-a-20-billion-ai-problem", "t": "C"}, {"n": "Motley Fool", "u": "https://www.fool.com/investing/2026/11/02/why-oracle-stock-is-down-today/", "t": "C"}, {"n": "TipRanks", "u": "https://www.tipranks.com/news/oracle-stock-falls-after-20b-fundraising-putting-ai-returns-under-scrutiny", "t": "C"}, {"n": "Saxo", "u": "https://www.home.saxo/en-sg/content/articles/macro/market-quick-take---us-mid-term-elections-today-the-focus---3-november-2026-03112026", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-03/s7.webp?h=380ec966", "col": "#1e3a55", "cap": "", "credit": "Håkan Dahlström, CC BY 2.0 / Wikimedia Commons", "pull": null, "fig": {"v": "8.65%", "l": "top coupon, on the 2046 notes"}}, {"id": "s8", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Griffin’s Wynwood campus lands in a submarket that CBRE puts at 33% vacant", "s": "CBRE puts vacancy at 33%, the highest in Miami. Carnegie Mellon’s 35-acre campus, backed by Ken Griffin, is the bet on demand. One broker says the figure counts unfinished buildings.", "paras": ["Wynwood’s office vacancy stands at 33%, the highest of any Miami submarket, CBRE data cited by The Real Deal shows, after about 800,000 square feet arrived in five years. The test is the 35-acre Carnegie Mellon campus backed by <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Ken Griffin<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>His $1.1 billion purchase of the Mana holdings and a $3 billion gift underwrite it.<\/span><\/button>, with a first class due in 2028. One broker says the figure overstates vacancy by counting unfinished buildings. Asking rents run from the $70s to the $90s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">triple net<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The tenant also pays taxes, insurance and maintenance, so the all-in cost sits above the quoted rent.<\/span><\/button>, per one broker."], "why": "A university anchor is the bet that demand follows talent. The market will show within two years whether Wynwood’s supply was early or simply too much.", "c": {"L": 0, "LL": 1, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "The Real Deal", "u": "https://therealdeal.com/miami/2026/11/02/what-carnegie-mellon-means-for-wynwoods-office-market/", "t": null}, {"n": "CNN on the gift", "u": "https://www.cnn.com/2026/09/30/business/ken-griffin-carnegie-mellon-donation-miami", "t": "LL"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-03/s8.webp?h=ae5d3e2f", "col": "#2d3c33", "cap": "", "credit": "Phillip Pessar from Miami, USA, CC BY 2.0 / Wikimedia Commons", "pull": null}, {"id": "s9", "sec": "Law & the Courts", "sid": "s-law", "h": "Bar pass rates fall across the big states", "s": "California passed 48.3% of July takers, its lowest July in five years, the State Bar said, and New York passed 67%. Florida’s first-time rate was 75.2%.", "paras": ["California passed 48.3% of 7,942 July takers, down from 54.8% and its lowest July in five years, the State Bar said. New York passed 67% of 9,936, from 70%, and the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">national mean MBE<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The score is scaled across jurisdictions, so a drop signals weaker performance and not a harder curve.<\/span><\/button> fell to 140.7 from 142.4, Above the Law reported, with 35 of 42 jurisdictions down. Florida’s first-time rate was 75.2%: FSU 91.8%, Florida 90.9%, FIU 87.3%, Miami 84.9%, St. Thomas 79.8%, Nova 73.4%, Barry 59.9%. California’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">ABA-school first-timers<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>They passed at 78.1%, so the 48.3% headline leans on repeaters, who passed at 14.1%.<\/span><\/button> did far better than the headline."], "why": "The scores fell before NextGen arrived in any of the four largest states, which removes the easy explanation.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "State Bar of California", "u": "https://www.calbar.ca.gov/news/state-bar-announces-july-2026-bar-exam-results", "t": null}, {"n": "Above the Law", "u": "https://abovethelaw.com/2026/11/bar-exam-pass-rates-tanked-this-summer-and-not-just-in-california/", "t": "C"}, {"n": "The Florida Bar", "u": "https://www.floridabar.org/the-florida-bar-news/july-2026-bar-exam-results/", "t": "C"}, {"n": "Reuters", "u": "https://www.reuters.com/legal/legalindustry/lawyer-bar-exam-pass-rates-plummet-california-other-large-states-2026-11-02/", "t": "C"}, {"n": "Law.com", "u": "https://www.law.com/therecorder/2026/10/30/pass-rate-on-californias-july-2026-bar-exam-drops-to-483/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-03/s9.webp?h=96ffc29f", "col": "#343745", "cap": "", "credit": "Bruin79, CC BY-SA 3.0 / Wikimedia Commons", "pull": null, "chart": {"t": "Florida first-time pass rates, July", "type": "bar", "rows": [["FSU", 91.8, "91.8%"], ["Florida", 90.9, "90.9%"], ["FIU", 87.3, "87.3%"], ["University of Miami", 84.9, "84.9%"], ["St. Thomas", 79.8, "79.8%"], ["Nova", 73.4, "73.4%"], ["Barry", 59.9, "59.9%"]]}}, {"id": "s10", "sec": "Law & the Courts", "sid": "s-law", "h": "“That was our bad”: the government backs away from a win", "s": "The government conceded error and asked the justices to dismiss Maxwell v. Dinis, a case it won below. Alito called it “a very severe case of buyer’s regret.” Gorsuch said, “I haven’t heard ‘my bad’ before at the podium.”", "paras": ["Justice Alito called it “a very severe case of buyer’s regret” at Monday’s argument in Maxwell v. Dinis, No. 25-5930, on whether habeas reaches First Step Act prerelease transfers. Government lawyer Kevin Barber conceded error on Section 3621(b), “That was our bad,” and urged the Court to <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">dismiss as improvidently granted<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Kavanaugh and Jackson resisted. The petitioner claims about 42 months of credits, so a dismissal leaves him without an answer.<\/span><\/button>. Justice Gorsuch replied, “I haven’t heard ‘my bad’ before at the podium.” Because the government supports vacatur, <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">appointed amicus Brian Barnes<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>The Court appoints an amicus when the winner below abandons its judgment, leaving no one to defend it.<\/span><\/button> defended the Fifth Circuit."], "why": "A concession at this level forces the question of who owns a statute’s meaning once the agency walks away from its own win.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 1, "R": 0}, "src": [{"n": "Argument transcript", "u": "https://www.supremecourt.gov/oral_arguments/argument_transcripts/2026/25-5930_4f14.pdf", "t": null}, {"n": "Washington Examiner", "u": "https://www.washingtonexaminer.com/news/supreme-court/4787725/maxwell-v-dinis-first-step-act-criminal-justice-reform/", "t": "LR"}, {"n": "Law360 Pulse", "u": "https://www.law360.com/pulse/courts/articles/2545072", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-03/s10.webp?h=dc813002", "col": "#373b22", "cap": "", "credit": "颐园居, CC BY-SA 4.0 / Wikimedia Commons", "pull": null}, {"id": "s11", "sec": "The World", "sid": "s-world", "h": "Poland’s rival judges fight for the top court", "s": "A third envoy quit Monday as two judges claim to lead the constitutional court. Riot police kept one out, and the president pushed past the other.", "paras": ["Poland’s UN ambassador Krzysztof Szczerski resigned Monday, the third envoy to quit after Judge Korwin-Piotrowska suspended chief justice Bogdan Święczkowski on Oct. 30 and took the acting role. Riot police kept him out, and President Karol Nawrocki turned his plane around on the way home from Senegal and pushed past her at the door. The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">15-seat bench<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Eight judges were chosen by parliament in 2026, five of them unsworn by the president. Six PiS-era justices back Święczkowski.<\/span><\/button> now has two claimants. Her general assembly needs a quorum of 10 today, and that remains uncertain. All three envoys served under <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">ex-President Duda<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>The dispute dates to 2015, when his camp replaced three judges, and Tusk’s government has ignored rulings since December 2023.<\/span><\/button>."], "why": "An EU member’s top court has no agreed chief, and the U.S. ambassador has weighed in. A rule-of-law fight between two governments’ appointees has no clean remedy.", "c": {"L": 0, "LL": 1, "C": 0, "LR": 0, "R": 1}, "src": [{"n": "Notes from Poland", "u": "https://notesfrompoland.com/2026/11/02/polish-ambassador-to-un-becomes-third-envoy-to-resign-amid-crisis-over-constitutional-court/", "t": null}, {"n": "Fox News", "u": "https://www.foxnews.com/world/polands-constitutional-crisis-deepens-prime-minister-tusk-faces-accusations-power-grab", "t": "R"}, {"n": "CNN", "u": "https://www.cnn.com/2026/11/01/europe/poland-constitutional-tribunal-tusk-intl", "t": "LL"}], "framing": "The right (Fox) headlines a Tusk “power grab,” and a Heritage fellow calls it “an attempted coup.” The center-left (CNN) calls it a “long-running spat between pro-Europe PM and pro-Trump president.”", "min": 1, "front": false, "img": "img/2026-11-03/s11.webp?h=1fe47ae9", "col": "#3f3729", "cap": "", "credit": "Jurij, CC BY-SA 3.0 / Wikimedia Commons", "pull": null}, {"id": "s12", "sec": "The World", "sid": "s-world", "h": "Fake nuclear alerts hit Ukraine and Russia", "s": "Hackers pushed false warnings through Ukraine’s Air Alert app, CBS reported, and Russia’s emergencies app told 33 regions to stockpile food, by Russian state media’s count. Steve Witkoff said three-way talks are set for Nov. 10-11 in Abu Dhabi.", "paras": ["Hackers pushed false radiation and street-fighting warnings through <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Ukraine’s Air Alert app<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Built by the private firms Ajax Systems and Stfalcon, not the military. Sirens, television and radio were unaffected.<\/span><\/button> late Sunday, CBS reported, and hours later <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Russia’s Emergencies Ministry app<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Moscow says attackers used a flaw in an administrative panel.<\/span><\/button> told 33 regions, by Russian state media’s count, to stockpile food for three weeks. Ukraine blamed Russia, and an MP would neither confirm nor deny Ukrainian involvement in the Russian hack. Separately, envoy Steve Witkoff said trilateral talks are set for Nov. 10-11 in Abu Dhabi. U.S. officials meet Europeans in Brussels this week."], "why": "Whoever sent them, a civil-defense channel has been shown to work as a panic tool, a week before the sides sit down.", "c": {"L": 0, "LL": 2, "C": 2, "LR": 0, "R": 1}, "src": [{"n": "CBS News", "u": "https://www.cbsnews.com/news/ukraine-russia-war-app-hack-cyberattack-fake-nuclear-chemical-alerts/", "t": "C"}, {"n": "Fox News", "u": "https://www.foxnews.com/world/ukraine-air-alert-system-hacked-false-radiation-warning-kyiv", "t": "R"}, {"n": "Washington Post", "u": "https://www.washingtonpost.com/world/2026/11/02/ukrainian-russian-emergency-alert-apps-send-false-warnings-after-hacks/", "t": "LL"}, {"n": "NBC", "u": "https://www.nbcnews.com/world/ukraine/ukraine-russia-emergency-app-cyberattacks-alerts-radiation-kyiv-war-rcna606964", "t": "LL"}, {"n": "Meduza on talks", "u": "https://meduza.io/en/news/2026/11/03/trilateral-talks-between-russia-ukraine-and-us-set-for-november-10-11-in-abu-dhabi", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-03/s12.webp?h=982c4506", "col": "#303c2e", "cap": "", "credit": "Ввласенко, CC BY 4.0 / Wikimedia Commons", "pull": null}, {"id": "s13", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "Disney weighs thousands of job cuts and asks some managers for 20% savings", "s": "Bloomberg reports some managers were asked for 20% annual savings. Parks, TV and film would be hit hardest. Earnings come Nov. 17.", "paras": ["Disney is moving toward thousands of layoffs, with some managers targeting 20% annual savings, Bloomberg reported Monday; Reuters, relaying it, said “considering.” No total was given. Parks, the TV network and the film studio would be hit disproportionately, with part of the savings going back into programming, technology, parks and cruises. Disney declined to comment.", "The company had 231,000 employees at the end of fiscal 2025. It cut about 1,000 jobs in April and a few hundred in September, and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">100 to 200 in parks last week<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>TheWrap reports the cuts touched every part of Imagineering, and that eligible executives got an early-retirement offer.<\/span><\/button>, all before its Nov. 17 earnings. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Legal and global affairs<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The Wall Street Journal reported Oct. 1 that the unit was already cutting roles, so in-house lawyers are not spared.<\/span><\/button> is already shrinking. Bloomberg says the company has promised double-digit adjusted earnings growth this fiscal year."], "why": "A 20% target is a restructuring, not a trim. The Nov. 17 call will show how much of it Disney will put on the record.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Bloomberg via Yahoo", "u": "https://finance.yahoo.com/media-advertising/articles/disney-eyes-thousands-layoffs-managers-002025007.html", "t": "C"}, {"n": "Reuters via Investing.com", "u": "https://www.investing.com/news/stock-market-news/disney-eyes-thousands-of-layoffs-managers-asked-to-cut-20-in-costs-bloomberg-news-reports-4993288", "t": "C"}, {"n": "TheWrap", "u": "https://www.thewrap.com/industry-news/business/disney-plans-thousands-more-layoffs/", "t": "C"}, {"n": "WDW News Today", "u": "https://wdwnt.com/2026/11/disney-reportedly-cutting-thousands-of-jobs-managers-asked-to-cut-20-annually/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-03/s13.webp?h=97b45c61", "col": "#493225", "cap": "The Team Disney building in Burbank.", "credit": "Junkyardsparkle, CC0 / Wikimedia Commons", "pull": null}, {"id": "s14", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "Newsom proposes at least $1 billion a year for film and TV", "s": "The plan would raise California’s credit from $750 million, cover above-the-line pay and run through 2040. FilmLA says third-quarter shoot days sit nearly 29% under the five-year average.", "paras": ["Gov. Gavin Newsom proposed Monday raising California’s film and TV credit to at least $1 billion a year from $750 million, a cap set only last year. The plan adds <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">above-the-line credits<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Rival jurisdictions often go uncapped and already cover talent pay, which is what pulls star-driven shoots away.<\/span><\/button>, runs through 2040, lifts independent funding to $100 million from $26 million and adds a 5% boost. He also urged Congress to pass a 20% federal credit. FilmLA’s third-quarter shoot days fell 4.8% and sit nearly 29% under the five-year average. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">No bill number<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The governor’s office counters that shoot days rose 52% in the first year after the expansion, a measure FilmLA’s figures do not match.<\/span><\/button> has been reported."], "why": "Above-the-line credits would change who negotiates what, from agents’ deals to back-end structures. EASL lawyers should read the bill text when it lands.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Los Angeles Times via Yahoo", "u": "https://finance.yahoo.com/media-advertising/articles/newsom-proposes-1-billion-cap-171622794.html", "t": null}, {"n": "TheWrap", "u": "https://www.thewrap.com/media-platforms/politics/california-film-tv-tax-credit-1-billion-expansion-gavin-newsom/", "t": "C"}, {"n": "Variety", "u": "https://variety.com/2026/film/news/gavin-newsom-california-movie-tv-tax-credit-billion-dollars-1236937395/", "t": "C"}, {"n": "Hollywood Reporter", "u": "https://www.hollywoodreporter.com/business/business-news/gavin-newsom-major-california-tax-credit-expansion-1236745913/", "t": "C"}, {"n": "Quartz", "u": "https://qz.com/california-film-tv-tax-credit-1-billion-newsom-110226", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-03/s14.webp?h=f3e76f09", "col": "#0f3962", "cap": "", "credit": "Thomas Wolf, www.foto-tw.de, CC BY-SA 3.0 / Wikimedia Commons", "pull": null}], "week": [], "cover": "img/2026-11-03/s1.webp?h=67bc2409"}, {"date": "2026-11-02", "no": 158, "min": 9.9, "stand": "Iran names a two-day price for Hormuz, a judge ends the Alaska suit, and Weil’s lawyers leave before the vote.", "note": "Editor’s note. 14 items at 2,372 read-words, under the ten-minute cap. Disclosures: Anthropic, whose model compiles this paper, appears in the Japan item and leads the SemiAnalysis benchmark, which has no independent check; Alphabet and Amazon are Anthropic investors. Correction: Sunday’s paper put Clayface at $10.2 million for the weekend, from Saturday estimates; AP’s Sunday figure was $10.4 million, with You Can See Everything still first at $10.6 million. Not run: the CD&amp;R and GTCR approach for Global Payments at about $40 billion, no new development, unsigned, and DoorDash’s $17 billion Instacart deal, both outside the window; Intesa’s bid for Monte dei Paschi, the largest live contest, no new beat; Saudi strikes on Yemen’s Ras Issa port, Houthi-sourced with no roster outlet; The Information’s report that the White House withheld its AI testing framework, single paywalled source; Israel’s coalition count, no fresh beat before Herzog’s consultations; Suno’s subpoena fight with the Mechanical Licensing Collective, due today but dated Oct. 30; Treasury’s borrowing figure, published after this edition. No South Florida item cleared the window. Watch: the 3 p.m. borrowing estimate; Apple tonight; the midterms Tuesday; Israel’s results and refunding statement Wednesday; the Bank of England Thursday; the LIV hearing Nov. 5; payrolls Friday. Sourcing limits: Bloomberg, Reuters, Axios and The Information were not opened and their reports are relayed; The New York Times, Washington Post and CNBC links on the Alaska story were seen but not opened; no right-tier outlet carried a verified in-window report on any World item; Matt Levine and Axios Pro Rata returned nothing current; the Weil report rests on a secondary account.", "items": [{"id": "s1", "sec": "The Front", "sid": "s-front", "h": "Iran offers to reopen Hormuz in two days as Netanyahu presses Trump to strike and oil slides toward $100", "s": "Iran said Monday it could reopen the Strait of Hormuz within two days if the United States accepts its demands, putting on the record a faster timetable a day after President Trump told an Iowa rally the country may yet get “the hammer.” Foreign Ministry spokesman Esmaeil Baqaei called the shorter clock “another indication of Iran’s good-faith approach,”", "paras": ["Iran said Monday it could reopen the Strait of Hormuz within two days if the United States accepts its demands, putting on the record a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">faster timetable<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The September version, passed to Washington through Qatar, ran seven days, with the strait reopening only on the sixth.<\/span><\/button> a day after President Trump told an Iowa rally the country may yet get “the hammer.” Foreign Ministry spokesman Esmaeil Baqaei called the shorter clock “another indication of Iran’s good-faith approach,” Agence France-Presse reported, and said everything depends on Washington. “Only then can we discuss the subsequent stages,” he said.", "The core demands, per AFP, are an end to the war on all fronts, the release of frozen assets, relief on oil sanctions and an end to the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">U.S. naval blockade<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Central Command says it has redirected 144 vessels, up from 138 two weeks earlier.<\/span><\/button>. Foreign Minister Abbas Araghchi told Al Jazeera that Washington must also accept a new Iran-Oman transit route, lift <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">recent sanctions<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Washington has issued them since August under a campaign it calls “economic asphyxiation.”<\/span><\/button> and cut troop numbers in the region. Axios reported, via Anadolu, that Prime Minister Netanyahu pushed in a Saturday call for strikes right after Tuesday’s midterms and that Trump preferred to let diplomacy run. An Israeli source called the call “tough,” a U.S. source “direct.” Trump called it “a very good talk.”", "Oil fell. Brent lost more than 3% in early trading to about $110 a barrel and West Texas Intermediate dropped to $100.90, The National reported; Euronews later put Brent near $108.50 and WTI below $100. The strait stayed dangerous. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">UKMTO<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The Royal Navy’s shipping desk has logged 145 incidents since Feb. 28, with October the peak at about 30 attacks.<\/span><\/button> said a vessel was struck by an unknown projectile on Sunday. No formal U.S. answer to the two-day version had surfaced by this morning, and Trump said Saturday he still had to “take care” of targets including <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Pickaxe mountain<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>AFP describes a suspected nuclear site in central Iran. Tehran denies it is one.<\/span><\/button>."], "why": "Both clocks now run past Tuesday. Washington holds an unanswered two-day offer and an ally urging strikes, and every dollar off crude feeds the December rate-hike odds that bond desks are pricing.", "c": {"L": 0, "LL": 0, "C": 5, "LR": 0, "R": 0}, "src": [{"n": "AFP via The Manila Times", "u": "https://www.manilatimes.net/2026/11/02/world/iran-says-ready-to-reopen-hormuz-in-two-days-if-us-agrees-to-demands/2459258", "t": null}, {"n": "Euronews", "u": "https://www.euronews.com/2026/11/02/oil-slides-on-hormuz-deal-hopes-but-trump-keeps-iran-strikes-on-the-table", "t": "C"}, {"n": "The National", "u": "https://www.thenationalnews.com/business/2026/11/02/oil-prices-slide-more-than-3-as-trump-signals-more-time-for-iran-diplomacy/", "t": "C"}, {"n": "Anadolu via Express Tribune", "u": "https://tribune.com.pk/story/2638218/trump-favors-diplomacy-with-iran-as-netanyahu-urges-strikes-immediately-after-tuesdays-us-midterms", "t": "C"}, {"n": "Asharq Al-Awsat", "u": "https://english.aawsat.com/world/5336233-iran-warns-new-war-could-last-longer-after-trump-threatens-strikes", "t": "C"}, {"n": "CBS News (background)", "u": "https://www.cbsnews.com/live-updates/iran-war-us-trump-diplomacy-threat-resume-attacks/", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-02/s1.webp?h=ba88bc9e", "col": "#213956", "cap": "A U.S. Coast Guard cutter in the Strait of Hormuz, December 2020.", "credit": "MC2 Indra Beaufort, Public domain / Wikimedia Commons", "pull": {"text": "“At some point, we’re going to have to give them the hammer.”", "attr": "President Trump, Iowa rally, Nov. 1"}}, {"id": "s2", "sec": "The Front", "sid": "s-front", "h": "A judge throws out the Justice Department’s bid to freeze Alaska’s Senate count, and the department appeals the same day", "s": "U.S. District Judge Sharon Gleason dismissed the Justice Department’s Alaska Senate suit on Sunday, two days before the vote, holding that the government lacked Article III standing because a court could not deliver its remedy.", "paras": ["U.S. District Judge Sharon Gleason dismissed the Justice Department’s Alaska Senate suit on Sunday, two days before the vote, holding that the government lacked Article III standing because a court <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">could not deliver its remedy<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Alaska ballots carry no voter names and are commingled once cast, so a challenged ballot cannot be pulled out afterward. That is why redressability, not the merits, decided it.<\/span><\/button>. The department noticed an appeal to the Ninth Circuit the same day, Bloomberg Law reported.", "It sued Oct. 22 to block certification of any result affected by confusion between Sen. Dan S. Sullivan, the Republican incumbent, and a no-party candidate named Daniel J. Sullivan Jr., in a race against Democrat Mary Peltola, with ballots segregated pending investigation. Trump said he ordered the suit. Gleason’s 20-page order said “this Court lacks the authority to order that certain ballots cast by Alaskans be segregated,” and that the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Purcell principle<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>From a 2006 Supreme Court order: federal judges should hesitate to change election rules as voting nears, because late changes confuse voters and officials.<\/span><\/button> “strongly cautions” against relief. She did not reach the merits. The dismissal is <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">without prejudice<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Nearly hollow here: she denied leave to amend and directed final judgment, so the only live route is the appeal.<\/span><\/button>."], "why": "A suit the president says he ordered failed on remedy, not merit, which leaves the theory untested. Any Ninth Circuit emergency motion would have to land within hours of the polls.", "c": {"L": 1, "LL": 1, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Order, United States v. Alaska, No. 3:26-cv-00376", "u": "https://storage.courtlistener.com/recap/gov.uscourts.akd.80263/gov.uscourts.akd.80263.79.0_1.pdf", "t": null}, {"n": "New York Times", "u": "https://www.nytimes.com/2026/11/01/us/alaska-senate-election-lawsuit.html", "t": "L"}, {"n": "Washington Post", "u": "https://www.washingtonpost.com/politics/2026/11/01/judge-tosses-dojs-attempt-delay-alaska-senate-results-if-republican-loses/", "t": "LL"}, {"n": "Bloomberg Law", "u": "https://news.bloomberglaw.com/us-law-week/doj-appeals-judges-decision-to-toss-alaska-us-senate-lawsuit", "t": "C"}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/11/01/alaska-senate-doj-lawsuit-dismissed-sullivan-peltola.html", "t": "C"}, {"n": "Alaska Public Media", "u": "https://alaskapublic.org/news/politics/elections/2026-11-01/judge-tosses-doj-lawsuit-that-sought-to-block-election-results-if-republican-sen-dan-sullivan-loses", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-02/s2.webp?h=45853063", "col": "#43342c", "cap": "", "credit": "James Brooks, CC BY 2.0 / Wikimedia Commons", "pull": null}, {"id": "s3", "sec": "AI", "sid": "s-ai", "h": "OpenAI plans a post-midterm push built on AI “speed limits” and a new name for data centers", "s": "OpenAI is preparing a publicity campaign for after Tuesday’s midterms that includes AI “speed limits,” a U.S. role in global standards and renaming data centers “AI compute campuses,” Axios reported Sunday, according to TechCrunch.", "paras": ["OpenAI is preparing a publicity campaign for after Tuesday’s midterms that includes AI “speed limits,” a U.S. role in global standards and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">renaming data centers<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>It follows Trump’s September push for “Super Intelligence” in place of “artificial intelligence,” a term Gizmodo notes Sam Altman has not adopted.<\/span><\/button> “AI compute campuses,” Axios reported Sunday, according to TechCrunch. Chris Lehane, the chief global affairs officer, called the midterms “a bit of a movie trailer for what you’re going to see in 2028,” when he expects AI to be “*the* issue.”", "A spokesperson confirmed “compute campuses” as the preferred term to Business Insider, Gizmodo reported. Lehane called the fight over data centers “good and healthy,” a debate that has pushed Amazon and Microsoft to say they will stop using nondisclosure agreements with local governments. What a speed limit would bind is unclear: Techmeme’s summary called it mandatory and TechCrunch did not. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Pew<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>A separate summer survey found 16% of Americans expect AI to affect society positively.<\/span><\/button> found in September that 4% of Americans saw data centers as positive across all areas it measured."], "why": "The labs have read the polling. A voluntary speed limit proposed by the company it would bind is an opening bid for 2028, and lawyers should watch whether it becomes the floor or the ceiling of federal rules.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "TechCrunch, citing Axios", "u": "https://techcrunch.com/2026/11/01/openai-might-rebrand-its-data-centers-as-ai-compute-campuses/", "t": null}, {"n": "Gizmodo", "u": "https://gizmodo.com/openai-would-reportedly-like-you-to-use-its-pleasant-new-term-for-data-centers-2000833570", "t": "C"}, {"n": "Axios", "u": "https://www.axios.com/2026/11/01/scoop-openai-post-midterm-policy", "t": "C"}, {"n": "Business Insider", "u": "https://www.businessinsider.com/openai-ai-data-centers-rebrand-compute-campuses-midterms-2026-11", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-02/s3.webp?h=5c3a516f", "col": "#2f3848", "cap": "A Google data center in Council Bluffs, Iowa.", "credit": "Chad Davis, CC BY 2.0 / Wikimedia Commons", "pull": null}, {"id": "s4", "sec": "AI", "sid": "s-ai", "h": "SemiAnalysis benchmark: 20 tries at a Series B redline, none usable", "s": "SemiAnalysis on Monday published GDPx, a benchmark of frontier models on long professional tasks across 11 domains, including eight legal practice areas such as capital markets and M&amp;A. The best model scores 12% on a first-attempt pass measure.", "paras": ["SemiAnalysis on Monday published GDPx, a benchmark of frontier models on long professional tasks across 11 domains, including eight legal practice areas such as capital markets and M&amp;A. The best model scores 12% on a first-attempt pass measure. On a redline of a Series B amended and restated certificate of incorporation, the authors wrote, “no redline was usable” in 20 rollouts across four models, with a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">mean partial score<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Runs also treated a client email as overriding the signed term sheet, a hierarchy error any junior is trained out of.<\/span><\/button> of 18%. Techmeme’s summary says Anthropic’s Claude Opus 5.5 leads overall; the leaderboards could not be read. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Chakra<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The legal partner says its graders include senior partners at Wachtell and other large U.S. firms.<\/span><\/button> supplied the legal tasks."], "why": "All 20 runs missed a bypass of the protections through a subsidiary. That is the structural point a capital markets junior is paid to catch.", "c": {"L": 0, "LL": 0, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "SemiAnalysis", "u": "https://newsletter.semianalysis.com/p/gdpx-measuring-frontier-model-capabilities", "t": null}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-02/s4.webp?h=3610f00e", "col": "#3d3829", "cap": "", "credit": "Abbie Rowe, Public domain / Wikimedia Commons", "pull": null}, {"id": "s5", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Treasury’s refunding week opens with Wall Street split on whether Bessent trims the long end", "s": "The Treasury publishes borrowing estimates at 3 p.m. Monday and its quarterly refunding statement at 8:30 a.m.", "paras": ["The Treasury publishes borrowing estimates at 3 p.m. Monday and its quarterly refunding statement at 8:30 a.m. Wednesday, the first test of whether it will cut long-bond supply with the 30-year near 5.29%. Citi has forecast $3 billion cuts each to the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">20-year<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Revived in 2020, it often yields more than both the 10- and 30-year. Mnuchin, who revived it, later called it costly to the taxpayer.<\/span><\/button> and 30-year auctions, leaving maximums of $13 billion and $22 billion, MarketWatch reported last month. JPMorgan sees sizes flat through next August, and UBS called a guidance change “more likely than immediate action.”", "Yields sat at about 4.59% on the two-year and 4.93% on the 10-year on Monday, per Trading Economics, a curve near 34 basis points. Traders price roughly 70% to 75% odds of a hike Dec. 9. The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">guidance language<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The refunding wording has already moved from studying “increases” to studying “changes,” which desks read as the opening.<\/span><\/button> to watch is “at least the next several quarters,” in place since January 2024. Bills run about 22% of marketable debt, above the roughly 20% average Treasury’s advisers suggest."], "why": "Term supply is what every convertible and investment-grade deal prices off. A cut would be the first official concession that the long end is a problem, in a market already pricing a hike.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "MarketWatch via Yahoo Finance", "u": "https://finance.yahoo.com/economy/policy/articles/treasury-financing-plans-sparking-anxiety-194500699.html", "t": null}, {"n": "Bloomberg", "u": "https://bloomberg.com/news/articles/2026-11-01/wall-street-braces-for-biggest-treasury-sales-overhaul-in-years", "t": "C"}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/11/02/us-treasury-yields-bonds.html", "t": "C"}, {"n": "Bloomberg via Yahoo Finance", "u": "https://finance.yahoo.com/economy/policy/articles/wall-street-revives-case-scrapping-153531881.html", "t": "C"}, {"n": "Bloomberg via Yahoo Finance (August)", "u": "https://finance.yahoo.com/economy/policy/articles/bessent-treasury-twist-wall-street-185219883.html", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-02/s5.webp?h=e959beed", "col": "#333b27", "cap": "The Treasury building from the top of the Washington Monument.", "credit": "G. Edward Johnson, CC BY 4.0 / Wikimedia Commons", "pull": null}, {"id": "s6", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Alphabet returns to the euro market with a seven-part bond days after its selloff", "s": "Alphabet began marketing its second euro bond of 2026 on Monday, seven tranches from two to 19 years, Seoul Economic Daily reported, citing Bloomberg. The two-year was offered at 60 basis points over the benchmark and the 19-year at 205 to 210.", "paras": ["Alphabet began marketing its second euro bond of 2026 on Monday, seven tranches from two to 19 years, Seoul Economic Daily reported, citing Bloomberg. The two-year was offered at 60 basis points over the benchmark and the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">19-year<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Long euro paper from a U.S. issuer tests whether European insurers and pensions will fund AI capital spending at tenors U.S. buyers now charge more for.<\/span><\/button> at 205 to 210. Size and bookrunners were not disclosed. The sale follows a six-tranche euro deal in May and last week’s 12.6% fall in the stock after a quarter of negative free cash flow. < ss=\"gloss-kind\">Institution<\/span>Its implied timetable has a roadshow from the week of Nov. 9 and pricing the week of Nov. 16. Seoul Economic says only “next month.”<\/span><\/button> estimates the Nasdaq offering at $75 billion or more, with <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">22 joint bookrunners<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Goldman Sachs, Morgan Stanley and J.P. Morgan lead a syndicate sized for what could top SpaceX’s June offering as the largest IPO ever.<\/span><\/button>."], "why": "A named yen allotment spreads a record book beyond U.S. institutions as the AI selloff keeps other large issuers off the calendar this week.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Reuters via TradingView", "u": "https://www.tradingview.com/news/reuters.com,2026:newsml_L6N46J088:0-anthropic-plans-to-sell-3-5-billion-of-shares-to-japan-investors-in-ipo-filing-shows/", "t": "C"}, {"n": "Seoul Economic Daily", "u": "https://en.sedaily.com/international/2026/11/02/alphabet-launches-second-euro-bond-sale-of-the-year", "t": "C"}, {"n": "Renaissance Capital", "u": "https://www.renaissancecapital.com/IPO-Center/News/122417/ai-model-developer-anthropic-pbc-files-for-an-estimated-75-billion-ipo", "t": "C"}, {"n": "Renaissance week ahead", "u": "https://www.renaissancecapital.com/IPO-Center/News/122503/us-ipo-week-ahead-november%E2%80%99s-ipo-market-set-for-a-quiet-start", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}, {"id": "s8", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Affle buys Perion for $420 million in cash with a 40-day go-shop", "s": "India’s Affle agreed Sunday to buy Israel’s Perion Network for $11.70 a share in cash, a 34.5% premium to the Oct. 30 close and about $420 million of equity, Calcalist reported. Perion may solicit rival bids until Dec. 11.", "paras": ["India’s Affle agreed Sunday to buy Israel’s Perion Network for $11.70 a share in cash, a 34.5% premium to the Oct. 30 close and about $420 million of equity, Calcalist reported. Perion may solicit rival bids until Dec. 11. The deal needs a shareholder vote and Hart-Scott-Rodino clearance and should close in early 2027. Canaccord Genuity and Meitar advised <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Perion<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Founded in 1999 as IncrediMail. Microsoft’s 2024 change to its Bing terms cut revenue from nearly $900 million to about $400 million this year.<\/span><\/button>; LUMA Partners and Barnea Jaffa Lande advised Affle. Perion holds $228.3 million of cash and investments, <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">more than half the price<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Debt was not checked, so the net cost to Affle may differ.<\/span><\/button>."], "why": "It is the largest signed deal that could be dated inside the window, which says how quiet the tape was. A go-shop on a small cash deal echoes Thrive and ADT last week.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Calcalist", "u": "https://www.calcalistech.com/ctechnews/article/k5166udnc", "t": null}, {"n": "Globes", "u": "https://en.globes.co.il/en/article-affle-acquires-perion-network-for-420m-1001561492", "t": "C"}, {"n": "Reuters brief", "u": "https://www.tradingview.com/news/reuters.com,2026:newsml_FWN46I00E:0-affle-to-acquire-perion-at-a-deal-valuing-perion-at-implied-equity-value-of-us-420-mln/", "t": "C"}, {"n": "Pulse 2.0", "u": "https://pulse2.com/perion-to-be-acquired-by-affle-for-approximately-420-million/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-02/s8.webp?h=b17b3346", "col": "#263a4c", "cap": "", "credit": "Ynhockey, CC BY-SA 4.0 / Wikimedia Commons", "pull": null}, {"id": "s9", "sec": "Law & the Courts", "sid": "s-law", "h": "Weil’s partners have not voted and its practices are already leaving, with Nee reported near a Kirkland deal", "s": "Ramona Nee, the private equity partner once chosen to lead Weil, Gotshal &amp; Manges from 2027, is in advanced talks with Kirkland &amp; Ellis over a deal that could include more than 40 colleagues, Legal Cheek reported Monday, citing Bloomberg Law. A partner vote on the wind-down was still described as coming “in the coming days,” and no source confirmed it has happened.", "paras": ["Ramona Nee, the private equity partner once chosen to lead Weil, Gotshal &amp; Manges from 2027, is in advanced talks with Kirkland &amp; Ellis over a deal that could include more than 40 colleagues, Legal Cheek reported Monday, citing Bloomberg Law. A partner vote on the wind-down was still described as coming “in the coming days,” and no source confirmed it has happened.", "The cost falls lowest. Nearly 600 associates are reaching the market, Bloomberg Law reported, in a year when <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">large firms<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>NALP data show those firms hired 7.5% fewer graduates, so the Weil class arrives in a shrinking intake.<\/span><\/button> cut graduate hiring. About 30 London trainees have no announced placement before an expected Dec. 31 office closure. David Lat’s Sunday post-mortem centers on leadership, citing Wall Street Journal reporting of linked pay above $20 million each for Barry Wolf and Michael Aiello. Weil took $2.078 billion of revenue last year at <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">$5.593 million<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Kirkland and Wachtell pay more than $10 million, a gap that let rivals pick off Weil’s partners one book at a time.<\/span><\/button> per equity partner."], "why": "A firm in the Am Law top 30 can die of a profit gap with no debt and no bankruptcy. Stroock’s out-of-court dissolution took two years to reach a creditor settlement, so this ends well after the lawyers leave.", "c": {"L": 0, "LL": 0, "C": 5, "LR": 0, "R": 0}, "src": [{"n": "Legal Cheek, citing Bloomberg Law", "u": "https://legalcheek.com/2026/11/top-weil-lawyers-eye-lucrative-moves-as-trainees-face-uncertain-future", "t": "C"}, {"n": "Bloomberg Law", "u": "https://news.bloomberglaw.com/business-and-practice/weil-collapse-floods-market-with-lawyers-looking-for-new-jobs", "t": "C"}, {"n": "Original Jurisdiction", "u": "https://davidlat.substack.com/p/weil-gotshal-collapse-dane-butswinkas-williams-connolly-judge-ana-reyes", "t": "C"}, {"n": "Above the Law", "u": "https://abovethelaw.com/2026/11/last-weil-and-testament-see-generally/", "t": "C"}, {"n": "ABA Journal", "u": "https://www.abajournal.com/news/article/rivals-race-to-rescue-weil-lawyers-as-firm-heads-towards-closure", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-02/s9.webp?h=8de49911", "col": "#39392a", "cap": "767 Fifth Avenue, Weil’s New York home.", "credit": "Pablo Costa Tirado, CC BY-SA 3.0 / Wikimedia Commons", "pull": null}, {"id": "s10", "sec": "Law & the Courts", "sid": "s-law", "h": "The justices open November on a waived defense and a halfway-house habeas case, with Colorado’s preschools Tuesday", "s": "The Supreme Court’s November session opens Monday with two cases. Maxwell v.", "paras": ["The Supreme Court’s November session opens Monday with two cases. Maxwell v. Dinis asks whether a federal inmate can use habeas to contest a delayed transfer to a halfway house; the government will not defend the Fifth Circuit, so the Court <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">appointed Brian W. Barnes<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>An amicus appointment is how the Court fills the seat when the winner below abandons its judgment.<\/sp
