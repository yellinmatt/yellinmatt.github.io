laceable Education Fund sued five AI developers in San Francisco Superior Court on Thursday, asking a judge to bar further development of advanced models including ChatGPT, Gemini and Claude, Reuters reported. The complaint pleads California’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">unfair competition law<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Section 17200 allows only injunctions and restitution, not damages, which is why the plaintiffs ask the court to stop the work rather than pay for it.<\/span><\/button> and public nuisance, and it builds its case on the defendants’ own warnings, citing Dario Amodei and Elon Musk on catastrophic risk.", "‘Nor is any industry granted the right to self-regulate the development of such dangerous products,’ the complaint says. Meta declined to comment and the others did not respond, Reuters said. The suit joins a pending <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Florida action<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>After the state sued in June, OpenAI said it had paused training its most capable models until more safeguards were in place.<\/span><\/button>, in which the attorney general asked in September for an order barring new models without outside oversight, and a separate eight-state suit filed last month."], "why": "A nuisance theory aimed at model training is untested, but it lands six days before Anthropic lists, and it puts a court order to stop the work into every frontier lab’s risk factors.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Reuters via Yahoo Finance", "u": "https://ca.finance.yahoo.com/news/openai-google-anthropic-hit-lawsuit-182622694.html", "t": "C"}, {"n": "The Register", "u": "https://theregister.com/security/2026/11/12/openai-launches-security-products-tells-orgs-theyre-doomed-if-they-dont-use-them/5309500", "t": "C"}, {"n": "Dataconomy", "u": "https://dataconomy.com/2026/11/13/nonprofits-sue-openai-google-and-meta-to-halt-advanced-ai", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-13/s3.webp?h=bb00dd8c", "col": "#2f3c2c", "cap": "San Francisco’s Civic Center, seat of the city’s Superior Court.", "credit": "Kitchen, CC BY 2.0 / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": ""}, {"id": "s4", "sec": "AI", "sid": "s-ai", "h": "Chinese AI firms try to lock up Nvidia capacity abroad", "s": "Chinese AI companies are trying to rent Nvidia chips at overseas data centers, Reuters reported Thursday, citing three sources. Procurement records show a blacklisted university linked to China’s army bought H200 chips last month. The Information reported that Commerce is finalizing a licensing rule.", "paras": ["Chinese AI companies are trying to rent Nvidia chips at overseas data centers, with one major cloud provider discussing locking in capacity and smaller labs eyeing Southeast Asian providers, Reuters reported Thursday, citing three sources who fear the Huang scandal will speed the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Remote Access Security Act<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The House passed it 369 to 22 in January and the Senate has not acted; it would reach cloud access, which controls on physical chips do not.<\/span><\/button>. Procurement records show a blacklisted university linked to China’s army bought H200 chips last month. The Information reported that Commerce is finalizing a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">licensing rule<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The draft would require licenses for Blackwell-class chips shipped to Singapore, Malaysia, Thailand and others, exempting U.S.-run centers that block Chinese and Russian access.<\/span><\/button>."], "why": "Export controls target the hardware; the rental market is the gap, and the scandal has turned it into a race.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Reuters via Manila Times", "u": "https://www.manilatimes.net/2026/11/13/business/foreign-business/chinas-ai-firms-seek-nvidia-chip-capacity/2468348", "t": "C"}, {"n": "Forbes", "u": "https://www.forbes.com/sites/jonmarkman/2026/11/12/chinese-ai-firms-rush-to-rent-nvidia-chips-abroad-before-a-new-us-rule/", "t": "C"}, {"n": "Quartz", "u": "https://qz.com/chinese-ai-firms-overseas-nvidia-capacity-crackdown-111226", "t": "C"}, {"n": "The Information", "u": "https://www.theinformation.com/articles/commerce-department-finalizing-long-awaited-ai-remote-access-rule", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": ""}, {"id": "s5", "sec": "Markets & Deals", "sid": "s-mkt", "h": "The 30-year bond tails again as Williams says the Fed has ‘work to do’", "s": "Thursday’s $25 billion reopening of the 30-year bond cleared at 5.441 percent, 0.4 basis point above the when-issued yield, investingLive reported. Dealers were left with 11.39 percent, the most since August. All three coupon auctions this week tailed.", "paras": ["Thursday’s $25 billion reopening of the 30-year bond cleared at 5.441 percent, 0.4 basis point above the when-issued yield, the long bond’s second straight <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">tail<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Primary dealers must bid at every auction, so when end investors step back the dealers absorb the shortfall and carry it on their balance sheets.<\/span><\/button>, investingLive reported. The bid-to-cover ratio fell to 2.36 from 2.54 in October, and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">indirect bidders<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Bids routed through dealers for foreign central banks and other institutions, the share the market reads as a gauge of overseas demand.<\/span><\/button> took 68.11 percent against 72.32 percent. Dealers were left with 11.39 percent, the most since August. All three coupon auctions this week tailed.", "‘We still have work to do,’ New York Fed President John Williams said Thursday evening, Reuters reported, as markets priced a quarter-point increase from the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">3.75 to 4 percent range<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Two more quarter-point moves, in December and January, would take the range to 4.25 to 4.5 percent.<\/span><\/button> in December and another in January. Cleveland’s Beth Hammack favored ‘smaller increments, more frequent.’ Initial jobless claims rose 9,000 to 200,000. October producer prices are due at 8:30 a.m. Friday."], "why": "Every deal in this paper is priced off the long end, and soft demand at 5.4 percent with hikes back on the table raises the cost of every financing in the pipeline.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "investingLive", "u": "https://investinglive.com/news/us-30-year-bond-auction-tails-as-demand-disappoints-for-second-straight-day/", "t": null}, {"n": "Reuters via WBOW", "u": "https://1027wbow.com/2026/11/12/feds-williams-says-central-bank-has-work-to-do-to-get-inflation-back-on-target/", "t": "C"}, {"n": "TheStreet Pro", "u": "https://pro.thestreet.com/stock-market-today/2026-11-12", "t": "C"}, {"n": "Anadolu", "u": "https://www.aa.com.tr/en/economy/us-weekly-jobless-claims-rise-to-200-000-above-expectations/4122947", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-13/s5.webp?h=983d888b", "col": "#38392a", "cap": "The Treasury Building in Washington.", "credit": "MeanieHyaena, CC BY 4.0 / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": "", "chart": {"type": "bar", "t": "30-year auctions, indirect bidders’ share", "rows": [["October", 72.32, "72.32 percent"], ["November", 68.11, "68.11 percent"]]}}, {"id": "s6", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Hancock Whitney agrees to buy Trustmark for about $3.2 billion in stock", "s": "Hancock Whitney agreed on Thursday to buy Trustmark in an all-stock deal, the companies said in a release filed with the SEC. Trustmark holders get 0.7463 Hancock Whitney shares each. Closing is expected late in the first quarter of 2027.", "paras": ["Hancock Whitney agreed on Thursday to buy Trustmark in an all-stock deal valued at about $3.2 billion, creating a lender with about $58 billion in assets across six Southeastern states, the companies said in a release filed with the SEC. Trustmark holders get 0.7463 Hancock Whitney shares each and will own 35 percent. The banks project about 7 percent accretion to 2028 earnings and about 7 percent dilution to <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">tangible book value<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Bank investors judge a stock deal by how long the buyer takes to rebuild per-share tangible equity; an earn-back under three years is generally treated as acceptable.<\/span><\/button>, earned back in about 2.8 years. Wachtell Lipton advises the buyer and Covington &amp; Burling advises <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Trustmark<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Based in Jackson, Miss., while the buyer is based in Gulfport, so the deal combines two banks from the same state.<\/span><\/button>. Closing is expected late in the first quarter of 2027."], "why": "The largest announced deal found in the window, it signals that regional bank consolidation is back on the table at a dilution investors once punished.", "c": {"L": 0, "LL": 0, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "Hancock Whitney release, SEC filing", "u": "https://www.sec.gov/Archives/edgar/data/0000750577/000119312526457037/hwc-ex99_1.htm", "t": null}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "$58 billion", "l": "in assets for the combined lender"}}, {"id": "s7", "sec": "Markets & Deals", "sid": "s-mkt", "h": "CD&R and GTCR walk away from a take-private of Global Payments", "s": "GTCR and its partner Clayton, Dubilier and Rice have dropped early-stage talks to take Global Payments private, Reuters reported on Thursday. Talks could resume, or another buyer could emerge, the sources said.", "paras": ["Clayton, Dubilier &amp; Rice and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">GTCR<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Already a Global Payments shareholder, having taken stock when it and FIS sold Worldpay to the company in a deal agreed in 2025.<\/span><\/button> have dropped early-stage talks to take Global Payments private, Reuters reported on Thursday, citing sources who pointed to ‘the complexities of arranging a take-private of this scale.’ The payments processor has a market value of about $26.4 billion. Talks could resume, or another buyer could emerge, the sources said. Reuters noted that lenders are scrutinizing leverage on the largest buyouts as borrowing costs rise."], "why": "Two sponsors walking from a $26 billion target shows that financing, not appetite, now sets the ceiling on buyouts.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "Reuters via SRN News", "u": "https://srnnews.com/exclusive-cdr-gtcr-drop-pursuit-of-global-payments-sources-say/", "t": "C"}, {"n": "StreetInsider", "u": "https://www.streetinsider.com/Mergers+and+Acquisitions/CD&R+and+GTCR+drop+pursuit+of+Global+Payments+takeover+-+Reuters/27334190.html", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "$26.4 billion", "l": "Global Payments’ market value"}}, {"id": "s8", "sec": "Law & the Courts", "sid": "s-law", "h": "Sidley lines up at least 50 Weil lawyers as Simpson Thacher goes dark", "s": "Sidley Austin is poised to take at least 50 lawyers, including 12 partners, from Weil in New York, Bloomberg Law reported on Thursday. Skadden is hiring three Weil partners. Simpson Thacher said it will stop publicly reporting its financial results.", "paras": ["Sidley Austin is poised to take at least 50 lawyers, including 12 partners, from <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Weil, Gotshal &amp; Manges<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Its partners voted on Nov. 10 to dissolve the firm; Gibson Dunn had already taken a 120-lawyer funds group and Kirkland about 40 lawyers.<\/span><\/button> in New York, across M&amp;A, private equity, finance, litigation and technology transactions, Bloomberg Law reported on Thursday. Skadden is hiring three Weil partners: Navneeta Rekhi in private equity and Max Scott in technology deals, both in the Bay Area, and Steve Argeris in Washington, a former general counsel of the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Carolina Panthers’ parent<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Tepper Sports &amp; Entertainment; the NFL now lets approved funds buy minority team stakes, which is what feeds demand for team-side deal lawyers.<\/span><\/button>.", "Simpson Thacher &amp; Bartlett said it will stop <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">publicly reporting<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Law firms are partnerships with no disclosure duty, so the American Lawyer tables rest on what firms volunteer; the magazine says it will keep publishing estimates.<\/span><\/button> its financial results, effective immediately, Above the Law reported, citing the Financial Times. The firm said the metrics ‘do not fully reflect the value we provide to our clients.’ It reported 2025 revenue of $3.55 billion, up 22.5 percent. Kirkland &amp; Ellis stopped in early October, and Paul, Weiss the week before Simpson."], "why": "The Weil break-up has become a pricing event for partner talent, just as elite firms go dark and leave laterals less to compare.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Bloomberg Law", "u": "https://news.bloomberglaw.com/business-and-practice/sidley-to-bring-on-group-of-12-partners-from-weil-in-new-york", "t": "C"}, {"n": "Bloomberg Law", "u": "https://news.bloomberglaw.com/business-and-practice/skadden-hires-weil-private-equity-sports-ip-deals-partners", "t": "C"}, {"n": "Above the Law", "u": "https://abovethelaw.com/2026/11/simpson-thacher-says-financial-metrics-provide-only-a-limited-view-of-a-firm-so-now-you-get-no-view-at-all/", "t": "C"}, {"n": "Financial Times", "u": "https://www.ft.com/content/31fe2e2d-630d-47c6-b747-54d4310ebf79", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-13/s8.webp?h=d0e4f98d", "col": "#2e3945", "cap": "The General Motors Building at 767 Fifth Avenue, Weil’s New York headquarters.", "credit": "Tdorante10, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "$3.55 billion", "l": "Simpson Thacher’s 2025 revenue"}}, {"id": "s9", "sec": "Law & the Courts", "sid": "s-law", "h": "Richard Posner, the judge who taught law to count costs, dies at 87", "s": "Richard A. Posner, who sat on the Seventh Circuit for 36 years, has died at 87, the Associated Press reported. He was chief judge from 1993 to 2000 and retired abruptly in 2017.", "paras": ["Richard A. Posner, who sat on the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Seventh Circuit<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The federal appeals court in Chicago for Illinois, Indiana and Wisconsin, which is why the marriage cases from two of those states came to his panel.<\/span><\/button> for 36 years, has died at 87, the University of Chicago Law School confirmed, the Associated Press reported. Appointed by Ronald Reagan in 1981, he was chief judge from 1993 to 2000 and retired abruptly in 2017. He wrote about 3,300 opinions and more than 60 books, the Chicago Sun-Times reported, among them <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">‘Economic Analysis of Law’<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>First published in 1973, it argued that common-law rules tend toward efficiency, the premise behind antitrust’s consumer-welfare standard.<\/span><\/button>, and in 2014 he wrote the ruling that struck down same-sex marriage bans in Indiana and Wisconsin."], "why": "Every first-year taught to ask what a rule costs is reading Posner, and his pace of about a book a year is unlikely to be matched.", "c": {"L": 1, "LL": 1, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "AP via ABC News", "u": "https://abcnews.com/US/wireStory/richard-posner-prolific-legal-scholar-outspoken-appeals-court-138085266", "t": "LL"}, {"n": "Above the Law", "u": "https://abovethelaw.com/2026/11/judge-richard-posner-the-model-of-a-scholarly-jurist-dies-at-87/", "t": "C"}, {"n": "New York Times", "u": "https://www.nytimes.com/2026/11/11/us/richard-posner-dead.html", "t": "L"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "about 3,300", "l": "opinions, per the Chicago Sun-Times"}}, {"id": "s10", "sec": "The World", "sid": "s-world", "h": "Trump says ‘We don’t need a deal with Iran’ and takes Vance off the file", "s": "President Trump wrote on Thursday that the United States has Iran’s money and ‘their Strait,’ USA Today and ABC News reported. A White House official would not say whether talks had ended. Trump told Hugh Hewitt a strike was possible.", "paras": ["President Trump wrote on Thursday that ‘We don’t need a deal with Iran. Those days have long since passed,’ saying the United States has Iran’s money and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">‘their Strait’<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>Iran says at least 12 tankers were hit in 12 days; Central Command says about 4,000 ships have crossed with U.S. help.<\/span><\/button>, and told <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Vice President JD Vance<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>He helped broker the June memorandum of understanding that collapsed over Hormuz, and wrote on X on Nov. 4 that ‘The reason we lost is the war.’<\/span><\/button> to turn to alleged corruption and crime in Democratic-run cities and states, USA Today and ABC News reported. A White House official would not say whether talks had ended.", "Asked by Hugh Hewitt later that day about striking Iran, Trump said ‘it’s possible I would do that right now’ if he saw things going the other way, the Times of Israel reported. He told CNN he would consider it a defeat to leave office with Iran’s current leadership in power. Iran’s parliament speaker, Mohammad Bagher Ghalibaf, says Tehran sent a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">seven-condition proposal<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The terms include lifting the blockade and sanctions, releasing frozen funds and a formal end to the war, Al Jazeera reported.<\/span><\/button> through Qatar and awaits a reply."], "why": "A president calling talks unnecessary keeps oil and shipping priced for war, and moving Vance off the file removes the official most invested in the last deal.", "c": {"L": 1, "LL": 2, "C": 0, "LR": 0, "R": 1}, "src": [{"n": "USA Today via Yahoo", "u": "https://www.yahoo.com/news/politics/articles/trump-says-deal-iran-not-223633935.html", "t": null}, {"n": "CNN via KITV", "u": "https://www.kitv.com/news/national/trump-tells-vance-to-turn-his-focus-away-from-iran-we-don-t-need-a/article_c993e054-e72e-503f-9915-46e676153306.html", "t": "LL"}, {"n": "ABC News", "u": "https://abcnews.com/International/live-updates/iran-live-updates-americans-tired-forever-wars-araghchi/?id=137967256", "t": "LL"}, {"n": "Al Jazeera", "u": "https://www.aljazeera.com/features/2026/11/13/why-is-trump-saying-no-deal-necessary-with-iran-as-he-sidelines-jd-vance", "t": "L"}, {"n": "National Review", "u": "https://www.nationalreview.com/corner/of-course-vance-can-t-execute-an-iran-policy-he-publicly-scorns", "t": "R"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-13/s10.webp?h=9c10d771", "col": "#443429", "cap": "The Strait of Hormuz from the space shuttle.", "credit": "NASA, Public domain / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": ""}, {"id": "s11", "sec": "The World", "sid": "s-world", "h": "Putin offers a ‘humanitarian mission’ for Kostiantynivka", "s": "Vladimir Putin proposed a demining and evacuation mission for the contested Donetsk city of Kostiantynivka after meeting Steve Witkoff and Jared Kushner, Kremlin aide Yury Ushakov said. The envoys then met Volodymyr Zelensky in Dublin. Prisoner swap numbers were still not final.", "paras": ["Vladimir Putin proposed a demining and evacuation mission for the contested Donetsk city of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Kostiantynivka<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>Putin said any foreign forces deployed there would be legitimate targets; Kyiv Post sources say Ukrainian troops still hold the city.<\/span><\/button>, modeled on an earlier one in <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Oleshky<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>Kyiv says Russia used that evacuation in occupied Kherson region to move equipment in, which is why it reads the offer as a tactic.<\/span><\/button>, after meeting Steve Witkoff and Jared Kushner in Moscow on Thursday, Kremlin aide Yury Ushakov said, adding that the U.S. side supported it. Witkoff, on his 10th visit, said Europeans will join the next round, Reuters reported. The envoys then met Volodymyr Zelensky in Dublin. Prisoner swap numbers were still not final."], "why": "An offer that could hand Moscow a city it has not taken by force is the first concrete term to come out of the Witkoff channel, and Kyiv has already said no.", "c": {"L": 0, "LL": 1, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Reuters via The Moscow Times", "u": "https://themoscowtimes.com/2026/11/12/kremlin-says-putins-talks-with-us-envoys-were-useful-ukraine-peace-talks-to-continue-a94236", "t": "C"}, {"n": "Kremlin (state source)", "u": "http://en.kremlin.ru/events/president/news/81252", "t": "C"}, {"n": "Kyiv Independent", "u": "https://kyivindependent.com/zelensky-meets-with-trumps-envoys-in-dublin-after-their-summit-with-putin/", "t": "C"}, {"n": "Kyiv Post", "u": "https://www.kyivpost.com/post/89918", "t": "C"}, {"n": "CNN", "u": "https://www.cnn.com/2026/11/12/politics/ukraine-witkoff-kushner-putin-peace-talks-intl", "t": "LL"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": ""}, {"id": "s12", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "Rockstar’s U.K. staff open a union ballot a week before GTA VI ships", "s": "More than 1,600 Rockstar Games employees in Britain began voting on Thursday on recognition of the Rockstar Game Workers Union, The Register reported. The ballot runs to Nov. 26. Closing submissions in the tribunal over 31 firings are due Nov. 17 and 18.", "paras": ["More than 1,600 Rockstar Games employees in Britain began voting on Thursday on recognition of the Rockstar Game Workers Union, a branch of the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">IWGB<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>A small independent union outside the Trades Union Congress, built on organizing couriers, cleaners and other precarious workers rather than salaried studio staff.<\/span><\/button>, in a ballot that runs to Nov. 26, The Register reported. The game launches on Nov. 19. A yes vote would create the largest recognized union in the U.K. games industry, with terms on pay, overtime, pensions, bonuses, leave, consultation on HR policy and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">AI<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>SAG-AFTRA, which backs this campaign, won consent and pay terms on digital replicas for game performers in its 2025 contract.<\/span><\/button>.", "The proposed agreement follows four months of talks, PC Gamer reported. An <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">employment tribunal<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Rockstar tried and failed to have the blacklisting allegations struck out before the hearing.<\/span><\/button> in Scotland is hearing claims over Rockstar’s firing of 31 union members in October 2025, which the union calls union busting and the company says was for gross misconduct over leaks. Closing submissions are due Nov. 17 and 18. ‘We go where the team goes. So if they want a union, they will have a union,’ Jennifer Kolbe, Rockstar’s head of publishing, told Bloomberg."], "why": "AI terms written into a recognition deal at the industry’s biggest studio, during its biggest launch, would give every games employer a template to bargain against.", "c": {"L": 0, "LL": 0, "C
