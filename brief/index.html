.nb{position:absolute;left:0;right:0;top:0;z-index:3;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;min-height:calc(48px + var(--it));padding:var(--it) max(4px,var(--ir)) 0 max(4px,var(--il));transition:background-color .2s,box-shadow .2s}

<script>window.__E=[{"date": "2026-11-28", "no": 184, "min": 9.6, "stand": "OpenAI countersues Apple over trade secrets and pressure on shared suppliers; regulators close a $5.9 billion Indiana bank; banned Nvidia racks surface in Shanghai; and Tehran vows to break the US blockade.", "note": "Editor’s note. 13 items at 2,307 read-words, inside the ten-minute cap. Cut for length: an Israeli strike that killed two Médecins Sans Frontières staff outside a Gaza clinic, which the army says were militants posing as aid workers; it ranked last and is offered again on a fresh beat. Disclosure: one item concerns Anthropic, whose model compiles this paper (its shares on Friday). Also not run, and also an Anthropic matter: viral posts claiming that Claude models quietly degrade machine-learning work, which an Anthropic staff member called overcaution, not sabotage; no major outlet had covered them. The holiday thinned every beat. Federal courts, including the Southern District of Florida, were closed Friday, so Law &amp; the Courts carries one preview. Not run: Japan Tobacco’s 4.5 percent jump on talk of an Imperial Brands bid (no new terms, no advisers named); a Harvard governance forum post by Cooley on the SEC’s plan to scrap Rule 14a-8; the EU’s clearance of Deutsche Boerse’s purchase of Allfunds (no major outlet opened); a 5.5 percent holder’s opposition to Canadian Natural’s Advantage Energy deal; Musk’s claim that Google wants more SpaceX compute; Marvelous’s plan to cut 65 console jobs through early retirement; Aaron Rodgers’s termination pay; Taiwan’s local elections, as horse race; a school blast in Afghanistan; and a Sixth Circuit donor-disclosure ruling first reported before the window. Sourcing: Bloomberg, Reuters, CNN, AP and the FDIC pages were blocked, so wire copy was read through reprints. Bloomberg’s Nvidia report was read through Engadget, and the CNN, Bloomberg, Deadline and Reuters pages in the sources strips were seen but not opened. The Skydance item rests on the filing; no major outlet had written it up. The FDIC’s $1.83 billion cost estimate was not verified at the FDIC. Black Friday box office was not yet out. The dates of Apple’s original suit differ between CBS and the wires. Engadget dates Jensen Huang’s testimony to Dec. 3; earlier reports put a House hearing on Dec. 1. Magnitude check: no deal above $6 billion was signed in the window; the largest, Verizon’s talks for Fidium at about $6 billion, runs, and the largest live contest, a possible bid for Imperial Brands, had no new terms. South Florida: no local item cleared the window. Watch: OPEC+ on Sunday; the Supreme Court’s December sitting from Monday; baseball’s labor deadline on Dec. 1; the SEC’s LSU vote and Huang’s testimony on Dec. 3; the Fed on Dec. 9; the Anthropic lockup on Dec. 15; the ECB on Dec. 17.", "items": [{"id": "s1", "sec": "The Front", "sid": "s-front", "h": "OpenAI countersues Apple over trade secrets and pressure on suppliers", "s": "OpenAI filed counterclaims against Apple on Friday in federal court in San Jose, accusing it of misappropriating trade secrets and leaning on shared suppliers to slow its hardware push, CBS News and AFP reported. Trial is set for July 19, 2027, 9to5Mac reported.", "paras": ["OpenAI filed counterclaims against Apple on Friday in federal court in San Jose, accusing the iPhone maker of misappropriating <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">trade secrets<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">October<\/span>This fall OpenAI promised the court it would not touch the material Apple calls confidential, once the judge signaled an injunction was “highly likely,” AFP reported.<\/span><\/button> and of leaning on shared suppliers to slow its hardware push, CBS News and AFP reported. The filing answers Apple’s suit from this summer against OpenAI, its device unit <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">io Products<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Provenance<\/span>Jony Ive’s hardware studio. OpenAI announced the $6.4 billion purchase in May 2025, which brought the former Apple designers at the center of this case in house.<\/span><\/button>, chief hardware officer <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Tang Tan<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Background<\/span>A former Apple design executive, Interesting Engineering reported, so much of the dispute turns on what he and his recruits carried between employers.<\/span><\/button> and staffer Chang Liu.", "OpenAI alleges that Apple asked suppliers to identify OpenAI projects and the people working on them, AFP reported. Suppliers moved or rescheduled OpenAI meetings; one shifted OpenAI production to a night shift, and another dropped planned work “because of threats from Apple.” OpenAI also says a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">former employee<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Mirror claim<\/span>OpenAI first made this claim in October, putting the number of files at more than 100, 9to5Mac reported; Apple denied finding any.<\/span><\/button> spent six months at OpenAI, went back to Apple in June, sent “dozens of OpenAI documents” about a prototype to personal phone numbers and presented OpenAI’s plans to senior Apple staff in July.", "The counterclaims also attack a one-year ban on former Apple staff at OpenAI recruiting their old colleagues, and Apple’s alleged encouragement to mix work files with personal iCloud accounts. An Apple spokesperson called the filing “a transparent attempt to distract from the substance,” AFP reported. OpenAI withdrew its motion to dismiss on Friday without giving a reason, according to AFP. Trial is set for July 19, 2027, 9to5Mac reported."], "why": "This is the first courtroom fight over who builds the device after the phone. Employee-mobility terms, supplier pressure and a shared manufacturing base will all be tested in discovery, the kind of record that decides trade-secret cases long before trial.", "c": {"L": 1, "LL": 1, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "CBS News", "u": "https://www.cbsnews.com/news/openai-countersues-apple-trade-secrets-lawsuit/", "t": "LL"}, {"n": "Reuters (via Al Jazeera)", "u": "https://www.aljazeera.com/economy/2026/11/27/openai-countersues-apple-over-trade-secrets-as-ai-race-heats-up", "t": "L"}, {"n": "AFP (via Malay Mail)", "u": "https://www.malaymail.com/news/money/2026/11/28/openai-hits-back-at-apple-with-trade-secrets-countersuit/245050", "t": "C"}, {"n": "9to5Mac", "u": "https://9to5mac.com/2026/11/27/openai-countersues-apple-alleging-trade-secret-theft-and-supplier-threats/", "t": "C"}, {"n": "Engadget", "u": "https://www.engadget.com/2329747/openai-countersues-apple-and-accuses-it-of-stealing-trade-secrets/", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-28/s1.webp?h=32503de1", "col": "#2f3848", "cap": "Apple Park in Cupertino.", "credit": "Daniel L. Lu, CC BY-SA 4.0 / Wikimedia Commons", "pull": {"text": "… a trap that can be sprung whenever Apple sees an opportunity to slow down a potential competitor.", "attr": "OpenAI’s counterclaims, on Apple’s employment terms, via CBS News, Nov. 27"}, "kp": ["OpenAI filed counterclaims against Apple in federal court in San Jose on Friday.", "It accuses Apple of trade-secret theft and of pressuring shared suppliers.", "Trial in Apple’s original suit is set for July 19, 2027."], "bg": "Apple’s suit, filed this summer, alleges that former employees carried confidential hardware information to OpenAI when they left. OpenAI bought Ive’s company, io, in a $6.4 billion deal announced in May 2025. The counterclaims liken joining Apple to “Hotel California,” Engadget reported, and Reuters and CBS said Apple did not immediately comment on Friday. Reuters framed the dispute as a contest over who controls future AI devices that may not depend on apps or operating systems, a market in which neither company yet sells a dedicated product.", "nx": "Trial is set for July 19, 2027, 9to5Mac reported. Apple has not yet answered the counterclaims."}, {"id": "s2", "sec": "The Front", "sid": "s-front", "h": "Regulators close $5.9 billion United Fidelity Bank; First Citizens buys it", "s": "The Office of the Comptroller of the Currency closed United Fidelity Bank of Evansville, Indiana, on Friday, a local newspaper reported. First Citizens won the FDIC’s bidding, its release said.", "paras": ["The Office of the Comptroller of the Currency closed United Fidelity Bank of Evansville, Indiana, on Friday, finding it “in an unsafe or unsound condition to transact business,” the Evansville Courier &amp; Press reported. Neither the regulator nor the bank has given a cause. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">First Citizens<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Track record<\/span>The Raleigh bank bought Silicon Valley Bank from the FDIC in 2023, so it has absorbed a failed lender many times this size.<\/span><\/button> Bank &amp; Trust won the FDIC’s bidding with a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">whole-bank purchase<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Mechanism<\/span>The buyer takes substantially all loans and deposits out of receivership in one step, so branches reopen under the new owner without a payout to depositors.<\/span><\/button>, taking $5.9 billion of assets, $4.5 billion of deposits and $3.1 billion of loans at a discount of about $2.6 billion, with no deposit premium, its release said.", "The FDIC puts the cost to the deposit insurance fund at about $1.83 billion, Investing.com reported, the largest failure since <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Republic First<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Precedent<\/span>The Philadelphia lender, with about $6 billion of assets, was sold to Fulton Bank when regulators closed it in April 2024.<\/span><\/button> in April 2024. Total deposits were about $5.4 billion at the end of September; the gap to the assumed figure is brokered and other excluded accounts. The 20 branches in Indiana, Illinois, Colorado and Florida, and two in the US Virgin Islands, reopen Monday under First Citizens."], "why": "A bank fails while the Fed is still raising, and the same buyer steps in again. Loan books written before rates passed 5 percent are where the next losses sit.", "c": {"L": 0, "LL": 1, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "First Citizens release (via Yahoo Finance)", "u": "https://finance.yahoo.com/markets/stocks/articles/first-citizens-bank-enters-whole-003500854.html", "t": null}, {"n": "Evansville Courier & Press (via Yahoo)", "u": "https://finance.yahoo.com/economy/policy/articles/federal-government-closes-evansville-based-014150824.html", "t": "C"}, {"n": "Investing.com", "u": "https://uk.investing.com/news/company-news/united-fidelity-shut-by-regulators-in-biggest-us-bank-failure-in-two-years-5007186", "t": "C"}, {"n": "CNN", "u": "https://www.cnn.com/2026/11/27/business/united-fidelity-bank-fdic", "t": "LL"}], "framing": "", "min": 1, "front": true, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": ["The OCC closed United Fidelity Bank on Friday and named the FDIC receiver.", "First Citizens assumed $5.9 billion of assets at a $2.6 billion discount.", "The FDIC estimates a $1.83 billion cost to the insurance fund."], "bg": "It is the first failure of an Evansville bank since Integra in 2011, the Courier &amp; Press reported. The assumed figures are as of Sept. 30 and may be adjusted. Subsidiaries include Pedcor Homes, and the Virgin Islands branches trade as Bank of St. Croix, according to the First Citizens release.", "nx": "The former United Fidelity branches open for normal hours on Monday, Nov. 30, as a division of First Citizens.", "chart": {"type": "bar", "t": "Taken on by First Citizens, $ billion", "rows": [["Assets", 5.9, "$5.9 billion"], ["Deposits", 4.5, "$4.5 billion"], ["Loans", 3.1, "$3.1 billion"]]}}, {"id": "s3", "sec": "AI", "sid": "s-ai", "h": "Banned Nvidia Blackwell racks turn up at a Shanghai data center", "s": "Nvidia GB300 NVL72 and GB200 racks, which need a US license to enter China, were installed at a Shanghai site, Bloomberg reported on Friday, according to Engadget. Megaspeed denies wrongdoing.", "paras": ["Nvidia <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">GB300 NVL72<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Hardware<\/span>One rack holds 72 Blackwell Ultra GPUs and 36 Grace CPUs, so a single pledged unit is a training cluster, not a chip.<\/span><\/button> and GB200 racks, which need a US license to enter China, were installed at a Shanghai site called the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Yangtze River Delta Project<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">People<\/span>Bloomberg lists Kang Wei as the facility’s president. The New York Times has reported his ties to China’s Ministry of State Security.<\/span><\/button>, Bloomberg reported on Friday, according to Engadget. Hopper servers were there too. The trail ran through a loan: Shanghai Shuoyao pledged a GB300 rack as collateral for about $14 million from Shanghai Innovation Bank, and its serial number traced through a public warranty database to Taiwan’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Gigabyte<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Response<\/span>The server maker would not identify its customer and says it “conducts all business in compliance with applicable laws.”<\/span><\/button>.", "Shuoyao calls itself a service provider to Megaspeed, a company Alice Huang controlled from 2023 until August 2025, with ties “limited to ordinary commercial cooperation.” Bloomberg said it had no evidence that Megaspeed diverted the chips, and Megaspeed denies wrongdoing. The Justice Department is investigating Megaspeed, and US officials moved on Monday to add it to a trade blacklist, Gizmodo reported."], "why": "Collateral filings, not customs records, put restricted chips inside China. Any lender taking GPUs as security now holds evidence that export enforcers can reach.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Engadget, on Bloomberg’s report", "u": "https://www.engadget.com/2329748/restricted-nvidia-chips-were-installed-at-a-chinese-data-center-linked-to-alice-huang/", "t": "C"}, {"n": "Bloomberg", "u": "https://www.bloomberg.com/news/articles/2026-11-27/nvidia-blackwell-chips-turn-up-at-china-site-tied-to-alice-huang", "t": "C"}, {"n": "Gizmodo", "u": "https://gizmodo.com/nvidias-advanced-ai-chips-being-used-at-chinese-data-center-tied-to-alice-huang-2000846169", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-28/s3.webp?h=52194452", "col": "#413623", "cap": "Server racks in a data center.", "credit": "Carl Lender from Sunrise, USA, CC BY 2.0 / Wikimedia Commons", "pull": null, "kp": ["Restricted GB300 and GB200 racks were installed at a Shanghai data center.", "A pledged rack’s serial number traced back to Taiwan’s Gigabyte.", "The Justice Department is investigating Megaspeed, which denies wrongdoing."], "bg": "The finding follows a week of Nvidia export-control stories. A Commerce Department rule on remote access took effect on Nov. 19, and Nvidia then told Dell and Supermicro to halt server shipments to four Southeast Asian countries. Nvidia’s board reinstated Jensen Huang on Nov. 23. Engadget said the Shanghai facility may eventually house up to 800,000 servers, a figure no other source confirmed.", "nx": "Jensen Huang testifies publicly before Congress on Dec. 3 at 10 a.m., Engadget reported.", "fig": {"v": "$14 million", "l": "approximate loan against one pledged GB300 rack"}}, {"id": "s4", "sec": "AI", "sid": "s-ai", "h": "Anthropic shares jump 11 percent to $91.88, back above the $83 offer price", "s": "Anthropic shares closed at $91.88 on Friday, up 11 percent in the shortened session, Forbes reported. The stock had closed below the offer on Tuesday and Wednesday.", "paras": ["Anthropic shares closed at $91.88 on Friday, up 11 percent in the shortened session and $8.88 above the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">$83 IPO price<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Stabilization<\/span>Morgan Stanley exercised the full 147 million-share greenshoe and ended its price support after one day, Reuters reported last week.<\/span><\/button>, Forbes reported. The stock had closed below the offer on Tuesday and Wednesday, and Friday was only its third gain since the debut. It remains well under its $115 first-day high. Forbes credited a tech rebound; the Nasdaq rose 2.3 percent. The shares join <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">MSCI indexes<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Next test<\/span>A second supply event follows: about 300 million shares come free of lockup on Dec. 15, Reuters reported.<\/span><\/button> on Nov. 30."], "why": "Index buying on Nov. 30 and the Dec. 15 unlock now bracket the stock. An 11 percent day shows how thin the float still trades.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Forbes", "u": "https://www.forbes.com/sites/saradorn/2026/11/27/anthropic-surges-11-in-best-day-since-ipo-boom/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": "", "chart": {"type": "bar", "t": "Anthropic share price, dollars", "rows": [["IPO price", 83, "$83"], ["Friday close", 91.88, "$91.88"], ["First-day high", 115, "$115"]]}}, {"id": "s5", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Skydance retires a $3.9 billion WBD receivables line and calls 2027 notes", "s": "Skydance said in a filing on Friday that a Warner Bros. Discovery financing unit paid off and terminated its $4 billion receivables purchase agreement on Nov. 20. Skydance also registered 4,615,214,244 Class B shares for resale.", "paras": ["Skydance said in a filing on Friday that a Warner Bros. Discovery <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">financing unit<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Structure<\/span>WBD sold trade receivables to a bankruptcy-remote vehicle, WBD Receivables Funding LLC, under an agreement dating to Aug. 30, 2022.<\/span><\/button> paid off and terminated its $4 billion receivables purchase agreement on Nov. 20, with about $3.9 billion outstanding. On Nov. 25 it sent notices to redeem, at par plus accrued interest, $584.3 million of Paramount Global 2.90 percent notes and $33.4 million of Warner Media 3.80 percent notes on Dec. 23, and €84.3 million of Discovery Communications 1.90 percent notes on Dec. 29. All mature in 2027.", "Skydance also filed a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">424B7<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Form<\/span>The prospectus used for resales by selling holders under a shelf already on file, so no fresh registration review is needed before the shares trade.<\/span><\/button> supplement registering 4,615,214,244 Class B shares for resale, which brings it no proceeds. Its $47 billion PIPE, about 3.9 billion non-voting shares, stays <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">locked up until April 4, 2027<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">The gap<\/span>The extra 0.7 billion registered shares come from an August 2025 registration-rights agreement and are already free of lockup.<\/span><\/button>. Chief legal officer Makan Delrahim signed the filing. The stock is down about 49 percent this year, Stocktwits reported."], "why": "This is a merger’s capital structure being cleaned up in real time: a securitization unwound, 2027 stubs called at par and a resale shelf set for the April lockup cliff. Each step is a capital-markets mandate.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "SEC Form 8-K", "u": "https://www.sec.gov/Archives/edgar/data/2041610/000110465926132332/tm2626659d16_8k.htm", "t": null}, {"n": "Stocktwits (via Yahoo Finance)", "u": "https://finance.yahoo.com/markets/stocks/articles/skydance-plans-pay-down-debt-153422077.html", "t": "C"}, {"n": "The Filing Fool", "u": "https://www.thefilingfool.com/filing/0001104659-26-132332", "t": null}, {"n": "Quantisnow, on the 424B7", "u": "https://www.quantisnow.com/insight/sec-form-424b7-filed-by-skydance-corporation-6808142", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-28/s5.webp?h=41fdaa80", "col": "#393a22", "cap": "The Paramount gate on Melrose Avenue.", "credit": "Patrick Pelster, CC BY-SA 3.0 de / Wikimedia Commons", "pull": null, "kp": ["A $4 billion WBD receivables facility was paid off and terminated on Nov. 20.", "Three series of 2027 notes, about $710 million, will be redeemed at par.", "Skydance registered 4.6 billion Class B shares for resale on Friday."], "bg": "Skydance completed its purchase of Warner Bros. Discovery on Oct. 6, Stocktwits reported, funded in part by a $47 billion PIPE that Stocktwits priced at $12 a share. About $168 million of Discovery Global Holdings 3.755 percent notes due March 15, 2027, remain outstanding and are not callable at par.", "nx": "The dollar notes are redeemed on Dec. 23 and the euro notes on Dec. 29. The PIPE lockup expires on April 4, 2027.", "chart": {"type": "bar", "t": "Dollar notes called at par, $ million", "rows": [["Paramount Global", 584.3, "$584.3 million"], ["Warner Media", 33.4, "$33.4 million"]]}}, {"id": "s6", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Verizon is in talks to buy fiber provider Fidium for about $6 billion", "s": "Verizon is in talks to buy Fidium for about $6 billion including debt, the Financial Times reported on Friday, according to Reuters. A deal could come within weeks, though talks could fail or another bidder could emerge.", "paras": ["Verizon is in talks to buy Fidium for about $6 billion including debt, the Financial Times reported on Friday, according to Reuters. A deal could come within weeks, though talks could fail or another bidder could emerge. Fidium, formerly Consolidated Communications, is owned by Searchlight Capital Partners and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">BCI<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Owner<\/span>British Columbia Investment Management Corp., the Canadian public pension manager, which joined Searchlight in the take-private.<\/span><\/button>, which took it private for $3.1 billion. It runs fiber in 21 states and would add 351,000 homes in Maine, New Hampshire and Vermont. Verizon closed its $9.6 billion purchase of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Frontier<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Context<\/span>Verizon added 314,000 broadband customers in the third quarter, below estimates, and its chief executive, Dan Schulman, says customers prefer fiber to 5G home internet.<\/span><\/button> earlier this year."], "why": "A sponsor exit to a strategic buyer, and Verizon’s second fiber deal in a year, as carriers bet on lines in the ground over 5G home internet.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Reuters (via WIFC)", "u": "https://wifc.com/2026/11/27/verizon-in-talks-over-6-billion-deal-for-fidium-ft-reports/", "t": "C"}, {"n": "The Next Web", "u": "https://thenextweb.com/news/verizon-fidium-6b-talks-fibre-broadband", "t": "C"}, {"n": "Bloomberg", "u": "https://www.bloomberg.com/news/articles/2026-11-27/verizon-in-talks-to-buy-fidium-in-6-billion-deal-ft-says", "t": "C"}, {"n": "PhoneArena", "u": "https://www.phonearena.com/news/verizon-in-talks-to-buy-fidium_id185196", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "351,000", "l": "homes added in Maine, New Hampshire and Vermont"}}, {"id": "s7", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Treasury yields jump in Friday’s half session; a December hike is priced", "s": "The 10-year Treasury yield rose 7 basis points to 4.94 percent in Friday’s shortened session, TheStreet reported. CME FedWatch put a Dec. 9 increase at 99 percent.", "paras": ["The 10-year Treasury yield rose 7 basis points to 4.94 percent in Friday’s shortened session, the 2-year 6 points to 4.71 percent and the 30-year 7 points to 5.33 percent, TheStreet reported, after eight straight declines before the holiday. CME FedWatch put a Dec. 9 increase at 99 percent and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">back-to-back moves<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Pricing<\/span>LSEG data show a quarter point fully priced and about 71 basis points by mid-2027. Jefferies expects December to mark “peak hawkishness,” the Wall Street Journal reported.<\/span><\/button> in December and January at 66 percent. Brent settled at $95.44, up about 3 percent on the week, before an <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">OPEC+<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Drivers<\/span>The weekly gain followed attacks on tankers and Saudi facilities, IBTimes reported, citing Reuters.<\/span><\/button> meeting on Sunday. The S&amp;P 500 rose 1.6 percent to 7,297."], "why": "Every deal in this paper prices off a 10-year near 4.9 percent and a Fed still raising. Friday erased part of an eight-session rally.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 1, "R": 0}, "src": [{"n": "TheStreet Pro", "u": "https://pro.thestreet.com/market-commentary/not-your-typical-black-friday-unusually-large-gain-caps-best-week-for-stocks-since-april-2025", "t": "C"}, {"n": "Wall Street Journal (via Yahoo Finance)", "u": "https://finance.yahoo.com/markets/currencies/articles/u-treasury-yields-rise-shortened-094900410.html", "t": "LR"}, {"n": "Reuters (via IBTimes)", "u": "https://www.ibtimes.com.au/oil-prices-brent-weekly-gain-middle-east-attacks-opec-1879508", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-28/s7.webp?h=60c144de", "col": "#263854", "cap": "", "credit": "Federalreserve, Public domain / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": "", "chart": {"type": "line", "t": "Treasury yields, Friday’s close, percent", "rows": [["2-year", 4.71, "4.71 percent"], ["10-year", 4.94, "4.94 percent"], ["30-year", 5.33, "5.33 percent"]]}}, {"id": "s8", "sec": "Law & the Courts", "sid": "s-law", "h": "A $95,000 seaplane and 72 cans of beer go before the Supreme Court", "s": "The Supreme Court hears Jouppi v. Alaska on Tuesday, a challenge to the state’s forfeiture of a 1969 Cessna U206D worth about $95,000, according to the Institute for Justice. The United States backs Alaska.", "paras": ["The Supreme Court hears Jouppi v. Alaska on Tuesday, a challenge to the state’s forfeiture of a 1969 Cessna U206D worth about $95,000 after a passenger flew 72 cans of Budweiser and Bud Light toward Beaver, a dry village, according to the Institute for Justice, which represents the pilot. Alaska seized the plane at Fairbanks in April 2012, arguing that Kenneth Jouppi was willfully blind to at least one six-pack in plain view.", "The question is whether a court weighing an <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Excessive Fines Clause<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Reach<\/span>Timbs v. Indiana applied it to the states in 2019. Indiana’s high court later held the forfeiture of Tyson Timbs’s $40,000 Land Rover excessive.<\/span><\/button> claim judges the gravity of the offense <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">in the abstract<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Precedent<\/span>In United States v. Bajakajian (1998), the Court struck down forfeiture of $357,144 for failing to report cash, weighing the owner’s actual culpability.<\/span><\/button> or the defendant’s own conduct, SCOTUSblog reported. Alaska’s Supreme Court held that “the harm from even a six-pack of beer knowingly imported into a dry village is severe enough to warrant forfeiture of an aircraft.” The United States backs Alaska and takes <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">10 minutes<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Divided argument<\/span>The solicitor general asked on Oct. 13 and the Court agreed on Nov. 9, with Alaska’s consent.<\/span><\/button> of its time."], "why": "The case asks whether proportionality is measured against a statute or a person. The answer sets the value of every car, plane and account the government seizes.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Supreme Court docket, No. 25-246", "u": "https://www.supremecourt.gov/docket/docketfiles/html/public/25-246.html", "t": null}, {"n": "SCOTUSblog", "u": "https://www.scotusblog.com/case-files/cases/jouppi-v-alaska/", "t": "C"}, {"n": "Institute for Justice", "u": "https://ij.org/case/alaska-excessive-fines/", "t": "C"}, {"n": "Reuters", "u": "https://www.reuters.com/legal/government/alaska-seized-his-seaplane-over-some-beers-he-is-asking-us-supreme-court-help-2026-11-27/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-28/s8.webp?h=68e15bd4", "col": "#3e3729", "cap": "The Supreme Court in Washington.", "credit": "颐园居, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "kp": ["The Court hears Jouppi v. Alaska, No. 25-246, on Dec. 1.", "Alaska forfeited a $95,000 plane over beer bound for a dry village.", "The United States supports Alaska and shares its argument time."], "bg": "The Court granted review on July 20, 2026, from an Alaska Supreme Court decision of April 18, 2025. Samuel Gedge of the Institute for Justice represents Jouppi; Consovoy McCarthy represents Alaska. The government says federal statutes allow forfeiture of vehicles used to carry alcohol illegally. The December sitting opens Monday with Crowther, on whether school employees may sue under Title IX.", "nx": "Argument is Tuesday, Dec. 1. The December sitting runs through Dec. 9."}, {"id": "s9", "sec": "The World", "sid": "s-world", "h": "The US disables a ship leaving Iran as Tehran vows to break the blockade", "s": "A US aircraft disabled the Palau-flagged Pacific Archer in the Gulf of Oman on Thursday after it left Bandar Abbas, Reuters reported. Iran’s navy commander claimed commandos had retaken two tankers the US had seized, giving no names, place or date, CBS reported.", "paras": ["A US aircraft fired precision munitions at the stern of the Palau-flagged Pacific Archer in the Gulf of Oman on Thursday after it left Bandar Abbas, disabling its propulsion, Reuters reported. Central Command said the crew was unharmed. US forces have redirected 158 vessels and disabled six since the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">blockade<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Scope<\/span>Task Force Iron Gate, announced this month, extends it to sanctioned goods crossing Iran’s land borders and the Caspian, Reuters reported.<\/span><\/button> began in mid-July, Fox News reported. It was the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">first such announcement<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Signal<\/span>The Institute for the Study of War also reports Iranian officials discussing running tankers through the blockade and striking assets that support it.<\/span><\/button> since Nov. 7.", "Mohammad Mokhber, an adviser to Supreme Leader Mojtaba Khamenei, said through state media that “neither will the Strait of Hormuz be reopened, nor will we allow the blockade to remain in place.” On Friday the navy commander, Shahram Irani, claimed commandos had retaken two tankers the US had seized, giving no names, place or date, CBS reported; the US has announced no such seizure since April. Trump said renewed strikes would “absolutely hit <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Pickaxe Mountain<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Target<\/span>An underground complex near the Natanz enrichment site.<\/span><\/button>.”"], "why": "Tehran now threatens the blockade itself, not only shipping. War-risk premiums, sanctions screening and Gulf energy contracts all price off that threat.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 1}, "src": [{"n": "Reuters (via KFGO)", "u": "https://kfgo.com/2026/11/27/us-disables-ship-trying-to-leave-iran-as-tehran-vows-to-confront-blockade/", "t": "C"}, {"n": "Fox News", "u": "https://www.foxnews.com/world/us-military-disables-tanker-ship-attempting-slip-through-iran-blockade-thanksgiving-day", "t": "R"}, {"n": "CBS News", "u": "https://www.cbsnews.com/live-updates/iran-war-trump-us-threats-diplomacy-strait-of-hormuz/", "t": "C"}, {"n": "Institute for the Study of War", "u": "https://www.criticalthreats.org/analysis/iran-update-november-27-2026", "t": "C"}, {"n": "Reuters, on RAF Lakenheath (via ThePrint)", "u": "https://theprint.in/world/us-military-repelled-drones-at-uk-airbase-this-month-ft-reports/3111607/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": ["A US aircraft disabled the Pacific Archer after it left Bandar Abbas.", "A Khamenei adviser vowed Iran would not let the blockade stand.", "Iran claimed, without evidence, that it retook two US-seized tankers."], "bg": "Central Command said on Nov. 14 that Gulf partners had moved more than 1.7 billion barrels through the strait under US protection. Trump said on Nov. 26 that he doubts Iran will take a deal and gave it until the new year. The Financial Times reported on Saturday that US forces repelled about six drones over RAF Lakenheath on Nov. 13; Tehran denies involvement.", "nx": "", "fig": {"v": "158", "l": "vessels redirected since the blockade began"}}, {"id": "s10", "sec": "The World", "sid": "s-world", "h": "Zelensky tells Meloni the Libya strike was not coordinated with Europe", "s": "Zelensky said on X late Friday that Ukraine’s naval-drone attack near Benghazi was conducted “without prior coordination with our European partners,” after a call with Giorgia Meloni, Reuters reported.", "paras": ["Zelensky said on X late Friday that Ukraine’s naval-drone attack near Benghazi, which hit the corvette <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Merkury<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Correction<\/span>Libyan officials told AP the corvette was heavily damaged, not sunk, contradicting Kyiv’s first account.<\/span><\/button> and the cargo ship Angara, was conducted “without prior coordination with our European partners,” after a call with Giorgia Meloni, Reuters reported. Hours earlier Foreign Minister Antonio Tajani had said “what Zelenskyy said is not true.” Overnight about 460 drones flew at the Moscow region, Mayor Sergei Sobyanin said, and Russia claimed <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">1,246<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Not a record<\/span>Russia claimed 1,336 downed on Nov. 16 and 1,441 on Nov. 17, the Kyiv Independent reported.<\/span><\/button> downed nationwide. A Russian strike on Nizhyn killed seven."], "why": "Italy faces the Mediterranean front Kyiv has opened. A public rebuke from Rome shows how little cover Europe will give strikes beyond Ukraine.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Reuters (via ThePrint)", "u": "https://theprint.in/world/ukraines-attack-on-russian-ship-in-libya-was-not-coordinated-with-partners-zelenskiy-says/3111727/", "t": "C"}, {"n": "Reuters (via RTÉ)", "u": "https://www.rte.ie/news/ukraine/2026/1128/1600998-ukraine-russia/", "t": "C"}, {"n": "Ukrainska Pravda (via Yahoo)", "u": "https://www.yahoo.com/news/world/articles/italy-denies-zelenskyy-coordinated-attack-144700543.html", "t": "C"}, {"n": "Kyiv Independent", "u": "https://kyivindependent.com/ukraine-reportedly-launches-massive-attack-on-moscow-oblast-with-460-drones/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "about 460", "l": "drones flown at the Moscow region, Sobyanin said"}}, {"id": "s11", "sec": "The World", "sid": "s-world", "h": "Hackers breached the Air Force’s Cloud One platform, Reuters reports", "s": "Hackers breached Cloud One, the Air Force’s main cloud platform, Reuters reported on Friday, citing five people familiar with the matter. The attackers and any data loss are unknown.", "paras": ["Hackers breached <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Cloud One<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Record<\/span>Its leadership claimed a “100% success rate” against intrusion attempts in 2023, Reuters reported, citing FedScoop.<\/span><\/button>, the Air Force’s main cloud platform, Reuters reported on Friday, citing five people familiar with the matter; one said the attackers used a software flaw to reach its control plane. The intrusion was found within about the past month during upgrade work, and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Cyber Command<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Caseload<\/span>The government is handling at least six other recent cyber incidents, Reuters reported.<\/span><\/button> was called in. Migration of back-office applications was paused and some users lost administrator rights. The attackers and any data loss are unknown. The platform combines Microsoft, Amazon, Oracle and Alphabet clouds and hosts a system tracking munitions at more than 200 Air Force sites."], "why": "A breach at the management layer of a defense cloud is a disclosure and contract question for four hyperscalers and the prime contractor, Leidos.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Reuters (via Yahoo)", "u": "https://www.yahoo.com/news/us/articles/exclusive-hackers-breach-us-air-110252874.html", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "more than 200", "l": "Air Force sites with munitions it tracks"}}, {"id": "s12", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "Emails show the SEC ran its LSU message through a crisis-PR firm", "s": "The Southeastern Conference coordinated its public messaging against LSU through a crisis-communications firm, public records obtained by Front Office Sports show. The other members meet on Dec. 3 to consider expelling LSU.", "paras": ["The Southeastern Conference coordinated its public messaging against LSU through a crisis-communications firm, public records obtained by Front Office Sports show. Missouri president <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Mun Choi<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Op-ed<\/span>His draft of a USA Today op-ed called extra-eligibility athletes a small group trying to change the rules. The published version was softened, Sports Illustrated reported.<\/span><\/button> forwarded the firm’s strategy guide to Commissioner Greg Sankey and every SEC school leader except LSU days before the conference sued LSU on Sept. 3. The guide said complying with court orders “does not prevent the SEC from continuing to defend its rules.” FOS names the firm Legend Labs; Sports Illustrated spells it Legends Labs. No fees were disclosed.", "The firm tracked posts on X, including posts by the attorney Tom Mars. Tennessee’s Donde Plowman and Georgia’s Jere Morehead defended the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">professional-athlete rule<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Flashpoint<\/span>LSU played RJ Luis Jr., a former G League player, on Nov. 18 under a court order. The next day its president told the coach not to play him again.<\/span><\/button> on ESPN. The SEC added coach Will Wade as a defendant on Nov. 23, LSU moved to dismiss on Nov. 24, and the other members meet on <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Dec. 3<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Threshold<\/span>Expulsion needs two thirds of the other members, 10 of 15, under the conference rules cited in the Nov. 23 filing.<\/span><\/button> to consider expelling LSU."], "why": "A conference that scripts litigation messaging through a PR firm invites discovery into what its members agreed before they sued. That record now lands days before the vote.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Front Office Sports", "u": "https://frontofficesports.com/article/sec-coordinated-media-campaign-against-lsu-emails-show/", "t": "C"}, {"n": "Sports Illustrated (via Yahoo)", "u": "https://sports.yahoo.com/college-football/articles/newly-released-emails-expose-secs-221818979.html", "t": "C"}, {"n": "FOX 8 WVUE", "u": "https://www.fox8live.com/2026/11/28/sec-worked-with-crisis-communications-firm-during-legal-battle-with-lsu-report-says/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-28/s12.webp?h=20ae0c11", "col": "#2d394a", "cap": "Tiger Stadium in Baton Rouge.", "credit": "Daniel Foster, CC BY-SA 2.0 / Wikimedia Commons", "pull": null, "kp": ["Public records show the SEC used a crisis-PR firm in its LSU dispute.", "Missouri’s president shared the firm’s guide with every member but LSU.", "SEC members meet on Dec. 3 to consider expelling LSU."], "bg": "The SEC sued LSU on Sept. 3, alleging it used athletes who had played professionally in breach of conference rules. The records were obtained through public-records requests to member universities, FOS reported. FOS said the firm publicly lists the SEC, Tennessee, Florida and Texas as clients.", "nx": "The members meet on Dec. 3, without LSU, to consider expulsion."}, {"id": "s13", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "Sunrise on the Reaping takes Thanksgiving Day with $11.6 million", "s": "Lionsgate’s Sunrise on the Reaping took $11.6 million on Thanksgiving Day, Variety reported. Universal’s Focker-in-Law earned $7.7 million, ahead of Disney’s Hexed at $4.5 million.", "paras": ["Lionsgate’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Sunrise on the Reaping<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Franchise<\/span>Last weekend it carried the Hunger Games films past Twilight, to $3.43 billion worldwide.<\/span><\/button> took $11.6 million on Thanksgiving Day and is projected to reach $85 million over five days and about $233 million domestic, Variety reported. Universal’s Focker-in-Law earned $7.7 million, ahead of Disney’s original animation Hexed at $4.5 million; their five-day projections are $40 million and $34.4 million. Netflix’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">The Further Mis-Adventures of Cliff Booth<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Window<\/span>David Fincher directs Brad Pitt. The IMAX-only run is one of Netflix’s rare theatrical releases before streaming.<\/span><\/button>, playing only in IMAX, has $3.5 million in five days."], "why": "Two new family films split the holiday audience, and Netflix is testing what a premium-screen window is worth before it streams.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "Variety (via Yahoo)", "u": "https://www.yahoo.com/entertainment/movies/box-office-results/articles/thanksgiving-box-office-hunger-games-163526026.html", "t": "C"}, {"n": "Deadline", "u": "https://deadline.com/2026/11/box-office-hunger-games-hexed-focker-in-law-thanksgiving-1237233281/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": "", "chart": {"type": "bar", "t": "Thanksgiving Day grosses, $ million", "rows": [["Sunrise (Lionsgate)", 11.6, "$11.6 million"], ["Focker-in-Law", 7.7, "$7.7 million"], ["Hexed", 4.5, "$4.5 million"]]}}], "week": [], "cover": "img/2026-11-28/s1.webp?h=32503de1"}, {"date": "2026-11-27", "no": 183, "min": 9.1, "stand": "Altria weighs a cash bid for Imperial Brands with Japan Tobacco circling; drones kill two Italian contractors in Kuwait; Europe picks Pablo Hernández de Cos for the ECB; and Nvidia halts server shipments to four Southeast Asian countries.", "note": "Editor’s note. 12 items at 2,174 read-words, inside the ten-minute cap. Disclosure: no item concerns Anthropic, whose model compiles this paper. Thanksgiving thinned every beat: US markets and federal courts were closed Thursday, and Law &amp; the Courts carries a ruling from Wednesday reported inside the window. Not run: Reuters’ report that US curbs are slowing Chinese labs, with Z.ai’s next model likely slipping to early 2027 (read only through The Decoder); Zelenskyy’s warning of a new Russian mass strike after missiles hit Kyiv; North Korea’s reported pause in arms deliveries to Russia (Ukrainian intelligence, unverified); Myanmar’s refusal to fully comply with the ICJ genocide judgment (first reports landed before the window); a cyberattack that took AFP’s client platform offline; Adobe’s holiday online-spending forecasts (published before the window; actual Thanksgiving figures not yet out); Amazon’s free Black Friday sports slate; the Macy’s parade, moved to Saturday, and Ubisoft’s puffery defense, both noted yesterday with nothing new. Held for a later edition: a Florida Supreme Court order sending hurricane-bond suits to an appeals court, which could not be dated or found on the court’s site. Corrections: yesterday’s note called GTCR’s pursuit of Global Payments live; Reuters reported on Nov. 16 that CD&amp;R and GTCR had dropped it. No. 179 reported that Ukrainian drones sank the Russian corvette Merkury off Benghazi; Libyan officials told AP it was heavily damaged but not sunk. Sourcing: Reuters, the Guardian, BBC and CNBC pages were blocked, so Reuters and Guardian copy was read through reprints; the CNN, Guardian and Globe and Mail accounts cited were seen but not opened; Deadline’s box office figures were read through ComingSoon’s account of them. Friday’s Treasury yields are early overseas quotes, not a US close. The Bank of Korea decided on Thursday morning in Seoul, Wednesday evening in New York. Kuwait injury counts differ between AFP and CBS. The Argentina item is single-tier. No advisers have been named on the Imperial approach. Magnitude check: no large deal was signed in the window; the largest live situation is Altria’s possible bid for Imperial, about $34 billion in equity, which leads the paper. South Florida: no local item cleared the window. Watch: the Macy’s parade on Saturday; baseball’s labor deadline and the House hearing on Nvidia on Dec. 1; the Fed on Dec. 9; the ECB on Dec. 17; the December EU summit; Altria’s Takeover Code deadline on Dec. 24.", "items": [{"id": "s1", "sec": "The Front", "sid": "s-front", "h": "Altria weighs an all-cash bid for Imperial Brands; Japan Tobacco may join", "s": "Altria said on Thursday that it is considering a possible all-cash offer for Imperial Brands and is in talks with another party about buying part of the business, Reuters reported. No agreement has been reached.", "paras": ["Altria, the maker of Marlboro in the United States, said on Thursday that it is considering a possible all-cash offer for <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Imperial Brands<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Portfolio<\/span>The owner of Davidoff, Gauloises and Kool. Putin ordered its Russian assets seized this month, Reuters reported, which leaves Africa and the Middle East as the prizes JT may want.<\/span><\/button> and is in talks with another party about buying part of the business, Reuters reported. No agreement has been reached. Imperial said it had received no approach but would consider any proposal. Its shares closed 13.3 percent higher in London, giving it a market value of £25.90 billion ($34 billion). Under the UK <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Takeover Code<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Rule 2.6<\/span>Once a possible bidder is named, it has 28 days to announce a firm offer or walk away for six months. That clock produces the Christmas Eve date.<\/span><\/button>, Altria has until 5 p.m. London time on Dec. 24 to make a firm offer or withdraw, unless the deadline is extended.", "Bloomberg reported that <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Japan Tobacco<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Ownership<\/span>The Japanese government holds 37.6 percent. A Tokyo statute requires the state to keep more than a third, which limits how much new stock JT can issue to pay.<\/span><\/button> is weighing a joint bid. Under one structure reported by the Financial Times, Altria would take Imperial’s international operations and JT its US business. JT shares closed up 4.5 percent in Tokyo on Friday, against a 1.7 percent rise in the Topix. JT declined to comment.", "Neither buyer holds much cash. JT had 887.3 billion yen ($5.6 billion) at the end of September and Altria $2.7 billion, Reuters reported. BTIG’s Owen Bennett said JT could reissue about $7.4 billion of treasury shares. Morningstar’s Kristoffer Inton warned the deal could push Altria to its highest net leverage on record. Altria has sold only in the United States since the 2008 spinoff of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Philip Morris International<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Provenance<\/span>The split gave PMI the Marlboro rights outside the United States, so Imperial’s overseas markets are the only large route abroad left to Altria.<\/span><\/button>. At a premium, the deal would be the third-largest tobacco takeover on record, according to LSEG data, and the largest since BAT bought <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Reynolds American<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Precedent<\/span>BAT already owned about 42 percent of Reynolds before the 2016 deal, so it was buying out a partner rather than a stranger.<\/span><\/button> for $60 billion, including debt, in 2016. No advisers have been named."], "why": "A cash bid that neither buyer can fund from its balance sheet means a large acquisition financing and probably a split of the target along regulatory lines. The structure, the leverage and the UK clock will all be set by Christmas Eve.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Reuters (via Investing.com)", "u": "https://www.investing.com/news/stock-market-news/japan-tobacco-shares-surge-on-talk-it-may-acquire-part-of-imperial-5053257", "t": "C"}, {"n": "PYMNTS / CPI", "u": "https://www.pymnts.com/cpi-posts/altria-weighs-imperial-brands-takeover-with-japan-tobacco/", "t": "C"}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/11/26/marlboro-maker-altria-explores-takeover-of-uks-imperial-brands.html", "t": "C"}, {"n": "The Globe and Mail", "u": "https://theglobeandmail.com/business/article-altria-explores-takeover-of-imperial-brands", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-27/s1.webp?h=adbfaaee", "col": "#333c24", "cap": "Imperial Brands’ offices in Bristol.", "credit": "Neil Owen, CC BY-SA 2.0 / Wikimedia Commons", "pull": {"text": "… turn JT into a sizeable, diversified, and value-rational 3rd-place US competitor with cost synergy potential.", "attr": "Andrei Andon-Ionita, Jefferies analyst, on a deal, via Reuters, Nov. 27"}, "kp": ["Altria confirmed it is weighing an all-cash offer and talks with a third party.", "Imperial closed 13.3 percent higher, at a £25.90 billion market value.", "Altria must make a firm offer or withdraw by 5 p.m. London time on Dec. 24."], "bg": "Bloomberg first reported Altria’s interest, and Altria confirmed it in a regulatory statement on Thursday, PYMNTS reported. Imperial recently set out plans to cut as many as 4,600 jobs. Jefferies said shareholders would probably entertain offers above Imperial’s five-year peak of 9.6 times earnings, Reuters reported. BTIG said a deal could be done without hurting either buyer’s credit rating, while Morningstar said Altria might need several years to return to its leverage target even with buybacks paused. Reuters analysts said a sensible split would give JT the US assets and Altria some or all of the international business.", "nx": "Under the Takeover Code, Altria must announce a firm intention to bid or withdraw by 5 p.m. London time on Dec. 24, unless the Takeover Panel grants an extension.", "chart": {"type": "bar", "t": "Cash at the end of September, $ billion", "rows": [["Japan Tobacco", 5.6, "$5.6 billion"], ["Altria", 2.7, "$2.7 billion"]]}}, {"id": "s2", "sec": "The Front", "sid": "s-front", "h": "A drone strike in Kuwait kills two Italian Rheinmetall technicians", "s": "Two Italian technicians working for Rheinmetall Italia were killed on Thursday when drones struck Kuwaiti military sites, AFP reported. Kuwait said they were killed by shrapnel from intercepted Iranian drones.", "paras": ["Two Italian technicians working for Rheinmetall Italia were killed on Thursday when drones struck Kuwaiti military sites, including an air-defense station Kuwait’s defense ministry called a “vital site,” AFP reported. Antonio Saccoccio, 65, and Emanuele Lo Russo, 36, were servicing <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Skyguard<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">System<\/span>A radar fire-control unit, first built by Oerlikon, that aims short-range air-defense guns. Its operators work beside the sensors a drone raid targets first.<\/span><\/button> antennas, Fox News reported. Kuwait said they were killed by shrapnel from intercepted Iranian drones. AFP and Fox reported two others wounded; CBS put the injured at four.", "Foreign Minister Abbas Araghchi called the strike “suspicious,” said it “looks like a pre-cooked recipe for war” and offered a joint investigation. A military spokesman blamed a US and Israeli false flag, while outlets close to the Revolutionary Guards blamed Ukraine. Gulf states condemned the attack, and Bahrain asked the Security Council for accountability. “We must step up pressure on Iran,” said Ursula von der Leyen. Italy had moved most of its troops out of Kuwait in October."], "why": "These are the first European civilian deaths in the Gulf strikes, and the dead were defense contractors. Every Western supplier with staff at Gulf bases now carries that risk on its books.", "c": {"L": 1, "LL": 1, "C": 2, "LR": 0, "R": 1}, "src": [{"n": "AFP (via Arab News)", "u": "https://www.arabnews.com/middle-east/two-italian-workers-killed-in-iranian-drone-attack-on-kuwait-3014135", "t": "C"}, {"n": "Fox News", "u": "https://www.foxnews.com/world/iran-accuses-zelenskyy-false-flag-kuwait-drone-strike-op-get-trumps-attention", "t": "R"}, {"n": "CBS News", "u": "https://www.cbsnews.com/live-updates/iran-war-us-military-ai-weapons-oil/", "t": "C"}, {"n": "CNN", "u": "https://www.cnn.com/2026/11/26/middleeast/italians-killed-iranian-attack-kuwait-intl", "t": "LL"}, {"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/27/trump-downplays-russia-china-support-for-iran-during-talks-with-us-troops", "t": "L"}], "framing": "", "min": 1, "front": true, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": ["Drones hit Kuwaiti military sites about 2 p.m. local time on Thursday.", "Kuwait blamed shrapnel from intercepted Iranian drones for the two deaths.", "Iran’s foreign minister called the strike suspicious and offered a joint inquiry."], "bg": "Italy decided on Oct. 8 to relocate most of its troops from Kuwait, leaving about 10 personnel, AFP reported. Kuwait cited a Security Council resolution in its complaint. In a Thanksgiving call with US troops on Thursday, Trump said “we have victory at hand,” Al Jazeera reported. Accounts of the wounded differ between outlets.", "nx": ""}, {"id": "s3", "sec": "The Front", "sid": "s-front", "h": "Leaders choose Pablo Hernández de Cos to succeed Lagarde at the ECB", "s": "Leaders of the 21 euro-area countries on Thursday chose Pablo Hernández de Cos, the former Bank of Spain governor, to succeed Christine Lagarde, AP reported. He beat Klaas Knot, seen as a hawk.", "paras": ["Leaders of the 21 euro-area countries on Thursday chose Pablo Hernández de Cos, the former Bank of Spain governor, to succeed Christine Lagarde as president of the European Central Bank, AP reported. He beat Klaas Knot, seen as a hawk. Hernández de Cos sat on the ECB’s Governing Council from 2018 to 2024 and now runs the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Bank for International Settlements<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The Basel bank owned by central banks. As its general manager he sets no interest rates, so his voting record dates from his Madrid years.<\/span><\/button>. Commerzbank calls him a dove; in 2020 he backed the €1.85 trillion pandemic bond-buying program.", "Lagarde said on Oct. 30 that she would step down early, effective Feb. 7, 2027, Euronews reported. AP said the timing lets leaders choose while Emmanuel Macron is still in office. The package also names Princeton’s Markus Brunnermeier to replace Philip Lane in May and Laurence Boone to take Isabel Schnabel’s seat in January. The choice still needs consultation with the European Parliament, which AP called a formality. Euro-area inflation is 4 percent, double the target, and the ECB meets next on Dec. 17."], "why": "A dovish president from the south takes over with inflation at twice the target. Every euro sovereign spread, and every bank capital plan priced off them, now carries that bet.", "c": {"L": 0, "LL": 1, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "AP (via ABC News)", "u": "https://abcnews.com/International/wireStory/leaders-choose-spains-former-central-bank-head-european-138468703", "t": "C"}, {"n": "The Guardian", "u": "https://www.theguardian.com/business/2026/nov/26/spain-pablo-hernandez-de-cos-next-ecb-president", "t": "LL"}, {"n": "Euronews", "u": "https://www.euronews.com/2026/11/26/eu-summit-leaders-ready-to-spar-over-new-budget-and-ukraine-aid", "t": "C"}, {"n": "South China Morning Post", "u": "https://www.scmp.com/news/world/europe/article/3375963/spains-pablo-hernandez-de-cos-succeed-lagarde-european-central-bank-chief", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-27/s3.webp?h=30d0fbe9", "col": "#27394e", "cap": "", "credit": "Dr. Thomas Liptak, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "kp": ["Leaders picked Hernández de Cos over Klaas Knot at Thursday’s Brussels summit.", "Lagarde leaves on Feb. 7, 2027, about nine months early.", "Brunnermeier and Boone join the executive board in the same package."], "bg": "Lagarde announced her early exit on Oct. 30. AP reported that choosing now lets leaders settle the post before France’s next presidential election. Euro-area inflation stands at 4 percent, partly because of the Iran war, and AP said a rate increase remains possible. Hernández de Cos left the Bank of Spain in 2024 for the BIS.", "nx": "The ECB’s Governing Council meets on Dec. 17. The appointment still needs consultation with the European Parliament and an opinion from the council.", "fig": {"v": "4 percent", "l": "euro-area inflation, double the target"}}, {"id": "s4", "sec": "AI", "sid": "s-ai", "h": "Nvidia halts its server shipments to Southeast Asian countries", "s": "Nvidia has told Dell and Supermicro to stop shipping servers built on its chips to Malaysia, Singapore, Thailand and Indonesia, with no end date, TechCrunch reported.", "paras": ["Nvidia has told manufacturing partners Dell and Supermicro to stop shipping servers built on its chips to Malaysia, Singapore, Thailand and Indonesia, with no end date, TechCrunch reported on Thursday, following reports by the Financial Times and the Wall Street Journal. Dell and Supermicro told buyers Nvidia would not authorize the orders. None of the three companies commented.", "The halt follows a Commerce Department rule on <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">remote access<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Loophole<\/span>Chinese firms could rent Nvidia compute in third countries without importing a chip. The rule moves the burden to the cloud operator, which must now show who its customers are.<\/span><\/button> to advanced chips, which took effect on Nov. 19. The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Institute for Progress<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Source<\/span>A Washington think tank that tracks compute flows. Its figure counts rented capacity, which customs data on chip exports never shows.<\/span><\/button> estimates offshore data centers supply about 24 percent of China’s AI compute. Nvidia’s Singapore unit booked $104 billion of revenue in 2025, up 72 percent, the FT reported. Lenders had already paused a $480 million GPU loan for a Malaysian site that ByteDance would use, Bloomberg reported on Nov. 17."], "why": "The rule reaches the debt as well as the chips. Every GPU-backed loan in Southeast Asia now turns on who rents the compute, and lenders must underwrite the tenant list.", "c": {"L": 0, "LL": 0, "C": 5, "LR": 0, "R": 0}, "src": [{"n": "TechCrunch", "u": "https://techcrunch.com/2026/11/26/nvidia-hits-pause-on-chip-shipments-to-southeast-asia/", "t": "C"}, {"n": "Reuters (via Investing.com)", "u": "https://investing.com/news/stock-market-news/nvidia-halts-server-shipments-to-four-southeast-asian-countries-ft-reports-5052112", "t": "C"}, {"n": "TrendForce", "u": "https://www.trendforce.com/news/2026/11/26/news-nvidia-reportedly-suspends-ai-server-shipments-to-four-southeast-asian-countries-as-u-s-targets-chinese-ai-access/", "t": "C"}, {"n": "Financial News (Korea)", "u": "https://en.fnnews.com/news/202611270224421362", "t": "C"}, {"n": "The Decoder", "u": "https://the-decoder.com/nvidia-halts-server-shipments-to-malaysia-singapore-thailand-and-indonesia-after-tighter-us-export-controls/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-27/s4.webp?h=52194452", "col": "#413623", "cap": "Server racks in a data center.", "credit": "Carl Lender from Sunrise, USA, CC BY 2.0 / Wikimedia Commons", "pull": null, "kp": ["Nvidia told Dell and Supermicro not to ship its servers to four Southeast Asian countries.", "A Commerce Department remote-access rule took effect on Nov. 19.", "Lenders paused a $480 million GPU loan for a Malaysian site."], "bg": "The Commerce Department announced the remote-access rule on Nov. 16, Financial News of Korea reported, giving cloud providers 90 days to license existing compute. The House has passed the Remote Access Security Act, which is pending in the Senate, and Nvidia has warned of possible legal action if it becomes law. The halt follows Nvidia’s board reinstating Jensen Huang earlier this week.", "nx": "The House hearing on Nvidia is set for Dec. 1.", "fig": {"v": "about 24 percent", "l": "China’s AI compute from offshore, an estimate"}}, {"id": "s5", "sec": "AI", "sid": "s-ai", "h": "SAP weighs cutting at least 10,000 jobs in an AI-driven restructuring", "s": "SAP is considering cutting at least 10,000 positions, at least 9 percent of its workforce, Bloomberg reported on Thursday. The number could change after talks with employee representatives.", "paras": ["SAP is considering cutting at least 10,000 positions, at least 9 percent of its workforce, Bloomberg reported on Thursday, and the number could change after talks with employee representatives. SAP had 111,397 staff at the end of 2025 and declined to comment, Reuters reported. Its 2024 restructuring, first sized at about 8,000 roles, grew to as many as 10,000 and cost about €3.1 billion. An October agreement extends <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">job protections<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Constraint<\/span>The deal with German staff runs through 2028, Handelsblatt reported, so cuts at home lean on buyouts and early retirement rather than dismissals.<\/span><\/button> in Germany through 2028. SAP shares rose 2.28 percent to €194.14 by midday in Frankfurt."], "why": "Europe’s largest software company is pricing AI as a headcount reduction while revenue grows. The severance bill, not the software, sets the first-year cost.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Reuters (via MarketScreener)", "u": "https://www.marketscreener.com/news/sap-considers-at-least-10-000-job-cuts-in-ai-restructuring-bloomberg-reports-ce7851d9d98ff32d", "t": "C"}, {"n": "Bloomberg", "u": "https://www.bloomberg.com/news/articles/2026-11-26/sap-weighs-cutting-at-least-10-000-positions-in-ai-restructuring", "t": "C"}, {"n": "CTech", "u": "https://www.calcalistech.com/ctechnews/article/al8iwkfjx", "t": "C"}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/11/27/sap-job-cuts-ai-restructuring.html", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-27/s5.webp?h=a2256ae0", "col": "#2e3e1b", "cap": "", "credit": "Vladislav Bezrukov from Walldorf, Germany, CC BY 2.0 / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "111,397", "l": "SAP staff at the end of 2025"}}, {"id": "s6", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Treasuries reopen for a half day with a December Fed hike all but priced", "s": "The 10-year Treasury yield rose above 4.90 percent in early Friday trading, Trading Economics data showed. Futures price an almost certain quarter-point Fed increase on Dec. 9.", "paras": ["The 10-year Treasury yield rose above 4.90 percent in early Friday trading, Trading Economics data showed, with the 2-year near 4.70 percent and the 30-year near 5.30 percent. The cash market was shut on Thursday, and no auctions are scheduled before next week. Futures price an almost certain quarter-point Fed increase on Dec. 9. The Bank of Korea raised its rate a quarter point to 3.25 percent on Thursday in Seoul, by a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">5-2 vote<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Dissent<\/span>Two members wanted to hold, the Korea Herald reported, even as the bank raised its 2027 growth forecast to 4.1 percent from 2.9 percent.<\/span><\/button>, its third increase this year. Brent rose 0.5 percent to $91.09 on Thursday, AP reported."], "why": "Every deal in this paper is priced off a 10-year near 4.9 percent and a Fed still raising. Central banks abroad are moving the same way.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Trading Economics", "u": "https://tradingeconomics.com/united-states/government-bond-yield", "t": "C"}, {"n": "AP (via BNN Bloomberg)", "u": "https://bnnbloomberg.ca/markets/2026/11/26/world-shares-push-higher-while-markets-in-us-will-be-closed-for-thanksgiving", "t": "C"}, {"n": "The Korea Times", "u": "https://www.koreatimes.co.kr/economy/20261126/bok-raises-key-rate-by-quarter-point-to-325-as-inflation-concerns-mount", "t": "C"}, {"n": "The Korea Herald", "u": "https://www.koreaherald.com/article/10950549", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-27/s6.webp?h=60c144de", "col": "#263854", "cap": "The Federal Reserve’s Eccles Building.", "credit": "Federalreserve, Public domain / Wikimedia Commons", "pull": null, "kp": ["The 10-year yield traded above 4.90 percent early Friday.", "Futures price a near-certain quarter-point Fed increase on Dec. 9.", "The Bank of Korea raised its base rate to 3.25 percent."], "bg": "October core inflation came in at 3.3 percent and third-quarter growth at 4.3 percent earlier this week. The Bank of Korea’s move was its third this year, after July and August, and takes its rate to the highest since October 2024, the Korea Times reported. Brent traded near $72 before the Iran war began in late February, AP reported.", "nx": "The Fed decides on Dec. 9; the ECB on Dec. 17; the Bank of Korea on Jan. 14.", "chart": {"type": "line", "t": "Treasury yields early Friday, percent", "rows": [["2-year", 4.7, "near 4.70 percent"], ["10-year", 4.9, "above 4.90 percent"], ["30-year", 5.3, "near 5.30 percent"]]}}, {"id": "s7", "sec": "Law & the Courts", "sid": "s-law", "h": "Undisclosed AI use touched at least 25 court cases in England and Wales", "s": "A review of published judgments by the Bureau of Investigative Journalism and the Guardian found at least 25 cases in England and Wales this year affected by undisclosed AI. A barrister relied on a ruling that does not exist.", "paras": ["A review of published judgments by the Bureau of Investigative Journalism and the Guardian found at least 25 cases in England and Wales this year affected by undisclosed AI, including AI-written witness statements and invented case law. A barrister in a £16 million High Court dispute between two Nigerian oil companies relied on a ruling that does not exist. A police officer used Copilot to draft a victim’s statement. The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Civil Justice Council<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Reform<\/span>Its proposal would make witnesses of fact sign that their statements were not substantially written by AI, shifting the check from the judge to the witness.<\/span><\/button> wants a declaration rule. Lord Sales warned that the deeper risk is losing the skill to spot when AI is wrong."], "why": "Fake citations are now a pattern across a whole court system, not a stray sanction. A signed declaration would make verification a duty every litigator carries.", "c": {"L": 0, "LL": 1, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "The Bureau of Investigative Journalism", "u": "https://www.thebureauinvestigates.com/stories/2026-11-26/ai-is-throwing-the-court-system-into-disarray", "t": "C"}, {"n": "The Guardian (via AOL)", "u": "https://www.aol.co.uk/articles/dozens-court-cases-england-wales-100051000.html", "t": "LL"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-27/s7.webp?h=8d605467", "col": "#263952", "cap": "The Royal Courts of Justice, London.", "credit": "David Castor, CC0 / Wikimedia Commons", "pull": null, "kp": ["At least 25 cases in England and Wales were affected by undisclosed AI this year.", "A barrister relied on an invented ruling in a £16 million dispute.", "The Civil Justice Council proposes a signed declaration for witnesses of fact."], "bg": "The Court of Appeal criticized the police officer’s use of Copilot, and the officer was removed from frontline duty, the Bureau reported. An insolvency judge found a junior solicitor had cited a statute that does not exist, and a Crown Prosecution Service lawyer cited an imaginary precedent earlier this month. The council’s working group is led by Sir Colin Birss.", "nx": "", "fig": {"v": "£16 million", "l": "High Court dispute built on an invented ruling"}}, {"id": "s8", "sec": "Law & the Courts", "sid": "s-law", "h": "A judge declines a long-term ban on taxpayer-funded pro-Trump ads", "s": "Judge Loren AliKhan on Wednesday declined to extend her order blocking at least 11 government ads, AP reported. She found the DNC likely to win on the merits but denied relief because “the November 2026 midterm elections have come and gone.”", "paras": ["Judge Loren AliKhan on Wednesday declined to extend her order blocking the administration from distributing at least 11 government ads the Democratic National Committee calls propaganda, paid for partly with $20 million in Homeland Security contract funds, AP reported on Thursday. She found the DNC likely to win on the merits but denied relief because “the November 2026 midterm elections have come and gone.” Accepting that campaigns are permanent, she wrote, would let the DNC seek <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">preliminary relief<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Doctrine<\/span>An injunction needs ongoing irreparable harm as well as a likely merits win. Here the harm ended with the vote, so the stronger argument still lost.<\/span><\/button> “in perpetuity.” The DNC said it “will fight on.”"], "why": "A plaintiff can be right on the law and still lose on timing. Election-season relief expires with the election.", "c": {"L": 0, "LL": 1, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "AP (via PBS NewsHour)", "u": "https://www.pbs.org/newshour/politics/judge-declines-to-issue-a-long-term-ban-on-taxpayer-funded-pro-trump-ads-critics-called-propaganda", "t": "C"}, {"n": "NBC News", "u": "https://www.nbcnews.com/politics/trump-administration/judge-declines-issue-long-term-ban-taxpayer-funded-trump-ads-critics-c-rcna611375", "t": "LL"}, {"n": "UPI", "u": "https://www.upi.com/Top_News/US/2026/11/26/judge-Trump-ads-Democratic-National-Committee/4471795667714/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-27/s8.webp?h=6d082fd6", "col": "#2e3d2b", "cap": "", "credit": "Tony Webster, CC BY 2.0 / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "$20 million", "l": "Homeland Security contract funds behind the ads"}}, {"id": "s9", "sec": "The World", "sid": "s-world", "h": "Three states block a €45 billion EU loan for Ukraine", "s": "An EU summit in Brussels ended early on Friday without agreement on the bloc’s 2028 to 2034 budget or a €45 billion loan for Ukraine, Al Jazeera reported. Hungary, Slovakia and the Czech Republic oppose the loan.", "paras": ["An extraordinary EU summit in Brussels ended early on Friday without agreement on the bloc’s 2028 to 2034 budget or a €45 billion loan for Ukraine’s 2027 needs, Al Jazeera reported. “24 member states supported the proposal,” said Council President António Costa. “We will return to the issue at the summit in December.” Hungary, Slovakia and the Czech Republic oppose the loan, which would come on top of the €90 billion agreed last December and be repaid only once Ukraine receives <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Russian reparations<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Structure<\/span>The EU borrows on capital markets against its budget. If reparations never arrive, member states carry the debt, which makes the loan a grant in all but name.<\/span><\/button>.", "Costa’s compromise budget of about €1.78 trillion is roughly 10 percent below the Commission’s proposal, Euronews reported, and needs <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">unanimity<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Rule<\/span>The seven-year budget is one of the few EU acts with no majority route, so the three loan holdouts also hold a veto over the budget itself.<\/span><\/button>. “We can’t and we mustn’t take on more debt,” said Friedrich Merz. Emmanuel Macron said a deal by Dec. 31 is “the absolute limit.” Hungary’s prime minister, Péter Magyar, said the chance of agreement was “virtually zero.” Seven net contributors, among them Germany, the Netherlands and Sweden, boycotted Costa’s small-group format."], "why": "Ukraine’s 2027 financing now depends on three governments and the EU’s borrowing capacity. Any EU bond issued to fund it will price that risk.", "c": {"L": 1, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Al Jazeera", "u": "https://www.aljazeera.com/economy/2026/11/26/eu-leaders-struggle-to-agree-on-long-term-budget-more-money-for-ukraine", "t": "L"}, {"n": "Euronews", "u": "https://www.euronews.com/2026/11/26/eu-summit-leaders-ready-to-spar-over-new-budget-and-ukraine-aid", "t": "C"}, {"n": "AP (via The Hill)", "u": "https://thehill.com/homenews/ap/ap-international/ap-eu-leaders-split-over-budget-spending-and-a-49-billion-loan-to-ukraine/", "t": "C"}, {"n": "The Copenhagen Post", "u": "https://cphpost.dk/2026-11-27/global/eu-remains-divided-over-new-e45-billion-loan-to-ukraine/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-27/s9.webp?h=27287cfd", "col": "#3c3826", "cap": "The Europa building in Brussels.", "credit": "PPEscientist, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "kp": ["Twenty-four of 27 states backed the €45 billion Ukraine loan.", "Hungary, Slovakia and the Czech Republic oppose it.", "Costa’s budget compromise is about €1.78 trillion over seven years."], "bg": "The EU agreed a €90 billion loan for Ukraine in December 2025, from which Hungary, the Czech Republic and Slovakia opted out. Bulgaria backs only the €20 billion civilian strand of the new loan, not the €25 billion
