.nb{position:absolute;left:0;right:0;top:0;z-index:3;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;min-height:calc(48px + var(--it));padding:var(--it) max(4px,var(--ir)) 0 max(4px,var(--il));transition:background-color .2s,box-shadow .2s}

<script>window.__E=[{"date": "2026-11-22", "no": 178, "min": 8.9, "stand": "A machine-checked proof claimed mathematics’ most famous problem, NATO promised Poland every inch, and the war at sea reached the Gulf of Finland.", "note": "EDITOR’S NOTE. The Sunday Special changes the unit of analysis from the day to the week and does not relax the bar: the Front is recency-gated to the hours from Friday 6 p.m. Eastern, and the departments carry items that already cleared a daily brief plus the Geneva, Treasury, SCOTUS, COP31, box office and college sports items first reported inside the window. Front 6, sector briefs 10, week in review 7 days, framing notes 0. Conflict disclosed: the Splash concerns an Anthropic employee and Claude, and Anthropic’s model helps produce this paper; Anthropic also appears in the week in review. Import AI, whose author co-founded Anthropic, was not used as a source. Not run: the New York Times report that the SEC’s Nvidia inquiry is at an early stage (a confirmation, not a development); a reported Amazon deal for Decart and an FT interview on machine consciousness (paywalled, timing unverified); Wonder’s exploration of a Grubhub sale (below the line); the New York auction week tally (sources disagree); Houthi missiles at Riyadh and Israel’s coalition talks (no decisive development). Sourcing limits: every desk exhausted its search budget before the roster was complete; the New York Times, the BBC, the Guardian, NPR and National Review were not reached inside the window, so no item carries a framing note; the Kalshi item rests on trade and regional outlets; the COP31 plenary had not concluded at press time. Missed this week, on the record: Sullivan &amp; Cromwell named its next leaders, a capital markets co-head among them, on November 19, and California’s attorney general subpoenaed Nvidia on November 19.", "items": [{"id": "s1", "sec": "The Front", "sid": "s-front", "h": "Lean’s keepers certify a Claude-assisted proof of the Riemann Hypothesis", "s": "The community that maintains the Lean proof assistant said on Saturday it has “full confidence” in a machine-checked proof posted Friday by Levent Alpöge, a mathematician at Anthropic. The formal proof runs to about 17 million lines. Anthropic has posted no statement.", "paras": ["The community that maintains the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Lean<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A proof assistant whose small kernel checks every inference mechanically. A certificate vouches for the formal artifact, not for any human grasp of why the argument works.<\/span><\/button> proof assistant said on Saturday that it has “full confidence” in a machine-checked proof of the Riemann Hypothesis that Levent Alpöge, a mathematician at Anthropic, posted on Friday. Alpöge’s four-page note opens: “I believe I have, working with Claude, discovered a proof of the Riemann Hypothesis.”", "The formal proof runs to about 17 million lines of Lean and covers the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">generalized hypothesis<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Extends Riemann’s 1859 conjecture from the zeta function to Dirichlet L-functions. Many results in number theory were proved conditionally on it and would stand unconditionally.<\/span><\/button>; attempts at a human-readable version ran past 250,000 pages. The joint statement, endorsed by the Lean FRO and the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Mathlib<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The shared Lean library of formalized mathematics. Its existing definition of the conjecture was the fixed target, so the proof could not quietly prove a weaker statement.<\/span><\/button> Initiative, says the theorem matches the library’s own definition, that dozens of people reproduced the same build and that independent checkers agreed. Alpöge told Quanta he had the result on Monday and waited; he called the timing, the day after Anthropic’s Nasdaq debut, “horrible.” Anthropic has posted no statement.", "Number theorists split on what has been shown. James Maynard of Oxford told IBM Think it would be “clearly a historic milestone in mathematics” if it holds. Maksym Radziwiłł of NYU told Quanta the note contains “nonsensical statements” and that the formal proof does not explain why the result is true. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Terence Tao<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>UCLA mathematician and Fields medalist. His blog read the strategy as one that “appears to use the full power of modern developments on the Langlands program.”<\/span><\/button> wrote that the approach draws on the Langlands program. A separate 940-page human proof of the generalized hypothesis by Alessandro Masullo also surfaced Friday, with no machine check."], "why": "The most famous open problem in mathematics may have fallen to a commercial model, with a certificate no human can read in full. Verification without understanding is now a working question for every profession that signs off on work, law included.", "c": {"L": 0, "LL": 1, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Lean community statement", "u": "https://leanprover-community.github.io/blog/posts/riemann-hypothesis/", "t": "C"}, {"n": "The Guardian via AOL", "u": "https://www.aol.com/articles/anthropic-mathematician-claims-used-claude-163949000.html", "t": "LL"}, {"n": "Quanta Magazine", "u": "https://www.quantamagazine.org/updates/transformation/", "t": "C"}, {"n": "IBM Think", "u": "https://www.ibm.com/think/news/anthropic-claude-riemann-hypothesis-math-proof", "t": "C"}, {"n": "Terence Tao", "u": "https://terrytao.wordpress.com/2026/11/20/unforced-euler-singularity-unforced-navier-stokes-singularity-and-the-generalized-riemann-hypothesis/", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-22/s1.webp?h=d7c388a5", "col": "#343b2a", "cap": "The mathematics faculty at Göttingen, where Riemann worked, 2007.", "credit": "Daniel Schwen, CC BY-SA 2.5 / Wikimedia Commons", "pull": {"text": "We hereby certify that both the statement and the proof of the Riemann Hypothesis are correct.", "attr": "Lean community and Mathlib joint statement, November 21"}, "kp": ["Alpöge posted the claim on Friday, November 20, the day after Anthropic began trading on Nasdaq.", "The Lean community and Mathlib certified the statement and the proof on Saturday.", "Anthropic has issued no statement, and its newsroom carries no post on the proof."], "bg": "Bernhard Riemann stated the conjecture in 1859: every nontrivial zero of the zeta function lies on the line with real part one half. It is one of the seven Clay Millennium Prize problems, which pay $1 million only after publication in a qualifying outlet, a two-year wait and general acceptance by the field. Formal checking has grown with Mathlib, a community library that lets a proof be tested against a definition the prover did not write. Earlier AI-assisted work had placed at least 67.25% of the relevant zeros on the critical line, IBM Think reported. Simon Willison flagged both Friday notes, Alpöge’s and Masullo’s, within hours of posting.", "nx": "Anthropic’s shares trade again on Monday, November 23, the first session since the claim and its certification.", "fig": {"v": "250,000", "l": "pages a human-readable version ran past"}}, {"id": "s2", "sec": "The Front", "sid": "s-front", "h": "Kalshi faces a New York hearing Monday it says could shut it nationwide", "s": "US District Judge Lorna Schofield on Friday denied the CFTC’s second emergency request to halt New York’s suit against Kalshi. Justice Melissa Crane hears the state’s restraining-order request Monday at 11:30 a.m., The Block reported.", "paras": ["US District Judge Lorna Schofield on Friday denied the CFTC’s second emergency request to halt New York’s suit against Kalshi, finding from the bench that the agency could not show the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Commodity Exchange Act<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The federal statute behind CFTC oversight of event contracts. Whether it displaces state gambling law is the question splitting the circuits.<\/span><\/button> likely preempts state gaming law. Attorney General Letitia James has refiled for a restraining order barring Kalshi from running an unlicensed gambling business “within or from New York,” and Justice Melissa Crane hears it Monday at 11:30 a.m., The Block reported.", "Kalshi’s lawyer, Sean Murphy of Milbank, argues that because the exchange is based in New York, the order would close it for every customer and force liquidation of open positions, against the CFTC’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">August 11 order<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Chair Michael Selig used emergency authority to direct Kalshi to keep operating, saying New York “has no business regulating these interstate financial markets.”<\/span><\/button>. The state says it seeks no nationwide shutdown. Kalshi counts 1.2 million New York users. The case sits in state court because a federal judge sent it back on <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">remand<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Kalshi had moved the suit to federal court; Judge Vernon Broderick returned it, which is why a state justice rules first.<\/span><\/button>."], "why": "A home-state injunction reaches the whole order book, so New York may settle by Monday what four federal circuits have not.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "The Block", "u": "https://www.theblock.co/news/regulation/2026-11-21-kalshi-faces-monday-hearing-on-new-york-order-it-says-would-shut-down-its-exchange-nationwide-444813", "t": "C"}, {"n": "Times Union via Yahoo", "u": "https://finance.yahoo.com/markets/options/articles/restraining-order-looms-yorks-battle-120025336.html", "t": "C"}, {"n": "Gambling Insider", "u": "https://www.gamblinginsider.com/news/204997/cftc-emergency-tro-denied-new-york-kalshi", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-22/s2.webp?h=d8c07012", "col": "#40362a", "cap": "", "credit": "Photograph by Mike Peel, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "kp": ["Judge Schofield denied the CFTC’s second emergency request on Friday.", "Justice Crane hears New York’s restraining-order request on Monday at 11:30 a.m.", "Kalshi says the order would close its exchange for every customer."], "bg": "New York sued in July. On November 10 Judge Colleen McMahon wrote that the CFTC’s order “smacks of a collusive effort.” By The Block’s count the Fourth, Sixth and Ninth Circuits have sided with states and the Third with Kalshi; the Fourth Circuit ruled against Kalshi on November 18.", "nx": "The hearing is Monday, November 23, in New York County Supreme Court.", "fig": {"v": "1.2 million", "l": "New York users Kalshi counts"}}, {"id": "s3", "sec": "The Front", "sid": "s-front", "h": "Rutte promises NATO will defend “every inch” of Poland", "s": "NATO Secretary General Mark Rutte said in Warsaw on Saturday that the alliance will defend every inch of Polish territory, dpa reported. Lublin prosecutors said one object was a Russian Kh-101 cruise missile manufactured this quarter. The North Atlantic Council meets in Brussels on Monday.", "paras": ["NATO Secretary General Mark Rutte told reporters in Warsaw on Saturday, “I can guarantee that NATO will defend every inch of Polish territory,” after meeting Prime Minister Donald Tusk and President Karol Nawrocki, dpa reported. He would not rule out another breach. The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">North Atlantic Council<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>NATO’s top political body, acting by consensus of all 32 allies; Article 5 is never automatic and needs that political decision.<\/span><\/button> meets in Brussels on Monday.", "Lublin prosecutors said one object was a Russian <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Kh-101<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>An air-launched cruise missile fired from Tu-95 and Tu-160 bombers. A build date this quarter means new production, not old stock.<\/span><\/button> cruise missile, “manufactured in the fourth quarter of this year,” recovered at Nowy Lipowiec, about 60 km from Ukraine. Radar tracked 11 possible threats and three objects came down, with no casualties. A Swedish <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Gripen<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Sweden’s fighter, flying NATO air policing since Stockholm joined the alliance in 2024; its pilot needed visual confirmation before firing.<\/span><\/button> pilot cleared to shoot held fire because weather blocked visual confirmation."], "why": "A fresh missile on NATO soil and a pilot who could not fire test the alliance’s rules of engagement before Monday’s council.", "c": {"L": 1, "LL": 0, "C": 3, "LR": 0, "R": 1}, "src": [{"n": "dpa via Yahoo", "u": "https://www.yahoo.com/news/world/articles/rutte-vows-nato-defence-poland-181832820.html", "t": "C"}, {"n": "Kyiv Post", "u": "https://www.kyivpost.com/post/90841", "t": "C"}, {"n": "AP via PBS (Nov. 20)", "u": "https://www.pbs.org/newshour/world/nato-calls-russian-missiles-landing-in-poland-a-grave-violation-of-airspace", "t": "C"}, {"n": "Fox News (Nov. 20)", "u": "https://www.foxnews.com/world/putin-launches-ukraine-barrage-hours-after-trump-meeting-amid-alleged-russian-missile-breach-nato-airspace", "t": "R"}, {"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/21/russian-missiles-hit-poland-what-happened-and-could-nato-respond", "t": "L"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-22/s3.webp?h=054c13b0", "col": "#313845", "cap": "", "credit": "Romaine, CC0 / Wikimedia Commons", "pull": null, "kp": ["Prosecutors confirmed a Russian Kh-101 built in the fourth quarter of 2026.", "A Swedish pilot cleared to fire held off for want of visual confirmation.", "The North Atlantic Council meets Monday; Poland sends a deputy defense minister."], "bg": "The objects fell on November 19 and 20 during a Russian barrage on Ukraine. Tusk called it an “intentional provocation” and Rutte a “grave violation,” AP reported. Coalition of the willing drills of 2,800 troops from 11 countries end Sunday.", "nx": "The council meets in Brussels on Monday, November 23.", "fig": {"v": "11", "l": "possible threats Polish radar tracked"}}, {"id": "s4", "sec": "The Front", "sid": "s-front", "h": "Drones set a sanctioned Russian cargo ship ablaze off Finland", "s": "Drones struck the Sparta II, a Russian-flagged ship owned by Oboronlogistika, on Saturday west of Gogland island. It drifted into Finnish waters and burned overnight, Al Jazeera and ABC News reported. A Finnish Defence Forces spokesman said Ukraine is likely behind it.", "paras": ["Drones struck the Sparta II, a 121-meter Russian-flagged ship owned by <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Oboronlogistika<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The Russian Defense Ministry’s freight arm, already under US Treasury sanctions, which makes the hull a military target in Kyiv’s eyes.<\/span><\/button>, on Saturday west of Russia’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Gogland<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>Suursaari to Finns; the island was Finnish until the 1940 Moscow Peace Treaty ended the Winter War.<\/span><\/button> island, on a run from St. Petersburg to <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Kaliningrad<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>A Russian exclave between Poland and Lithuania, resupplied by sea, so this shipping lane is its lifeline.<\/span><\/button>. It drifted into Finnish waters and burned overnight; all 16 crew moved to a Russian vessel, Al Jazeera and ABC News reported.", "A Finnish Defence Forces spokesman said it is “likely that Ukraine” is behind the attack, and Prime Minister Petteri Orpo wrote that “war is spilling over into our immediate vicinity.” Ukraine has not claimed it. Early Sunday a Russian drone partly collapsed a building in Dymer, outside Kyiv, leaving 14 people unaccounted for."], "why": "A strike in a NATO member’s waters carries Ukraine’s sea campaign into the Baltic, where the alliance, not Kyiv, lives with the consequences.", "c": {"L": 1, "LL": 1, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/22/russian-cargo-ship-still-on-fire-off-finland-after-drone-attack", "t": "L"}, {"n": "ABC News (Australia)", "u": "https://www.abc.net.au/news/2026-11-22/russian-cargo-ship-burns-in-baltic-sea-after-drone-strike/107413782", "t": "C"}, {"n": "Reuters via Investing.com", "u": "https://in.investing.com/news/economy-news/russian-drone-strike-traps-14-in-kyiv-region-as-cargo-ship-burns-off-finland-5719627", "t": "C"}, {"n": "CNN", "u": "https://www.cnn.com/2026/11/21/europe/russian-ship-fire-baltic-latam-intl", "t": "LL"}, {"n": "France 24", "u": "https://www.france24.com/en/europe/20261121-drone-attack-sets-russian-cargo-ship-ablaze-in-gulf-of-finland", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-22/s4.webp?h=1bc30822", "col": "#5b2513", "cap": "", "credit": "Joe deSousa, CC0 / Wikimedia Commons", "pull": null, "kp": ["The Sparta II left St. Petersburg on November 20 for Kaliningrad.", "Finland’s military named Ukraine as the likely attacker; Kyiv has not claimed it.", "The cargo on board has not been confirmed, Finland’s border guard said."], "bg": "Finland reported a strike on a Russian warship in the Baltic on November 13, Al Jazeera reported. The Leningrad region’s governor said two drones hit the ship and 80 were shot down overnight. Estonia’s navy commander said more attacks cannot be ruled out.", "nx": "", "fig": {"v": "16", "l": "crew moved to a Russian vessel"}}, {"id": "s5", "sec": "The Front", "sid": "s-front", "h": "Péladeau defends his C$31 billion Telus bid as Bell’s talks surface", "s": "Quebecor chief executive Pierre Karl Péladeau defended his unsolicited bid for Telus on CBC, saying “telecom assets are strategic for our country.” Global News, citing the Globe and Mail, reported that BCE held preliminary talks with Telus.", "paras": ["Quebecor chief executive Pierre Karl Péladeau defended his unsolicited bid for Telus on CBC’s Rosemary Barton Live, saying “telecom assets are strategic for our country” and comparing <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Starlink<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>SpaceX’s satellite internet service, which Péladeau casts as a global rival that only a national champion of scale can answer.<\/span><\/button>’s reach to Netflix’s. Quebecor is worth about C$14.77 billion against Telus’s C$21.72 billion, CBC reported. The Telus <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">special committee<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Chaired by John Manley, a former Canadian deputy prime minister and finance minister, it runs the review so management is not judging its own fate.<\/span><\/button> cites “significant risks.”", "Global News, citing the Globe and Mail, reported that BCE held preliminary talks with Telus. Desjardins puts a Bell and Telus combination at about 55% of wireless, against about 40% for Quebecor and Telus, and called it a long shot at the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Competition Bureau<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>One of three reviewers; the CRTC and the industry department, which controls spectrum licence transfers, each rule separately.<\/span><\/button>."], "why": "The smaller company is bidding for the larger, and a rival suitor with a worse antitrust case is now a negotiating tool for Telus.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "CBC via Yahoo", "u": "https://ca.news.yahoo.com/quebecor-ceo-defends-telus-bid-090000586.html", "t": "C"}, {"n": "Canadian Press via Global News", "u": "https://globalnews.ca/news/12158293/quebecor-bell-telus-merger-talks/", "t": "C"}, {"n": "CBC", "u": "https://www.cbc.ca/news/politics/pierre-karl-peladeau-quebecor-telus-bid-9.7431320", "t": "C"}, {"n": "Bloomberg (Nov. 17)", "u": "https://www.bloomberg.com/news/articles/2026-11-17/quebecor-s-peladeau-makes-shocking-c-28-billion-bid-for-canada-s-telus", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-22/s5.webp?h=be797685", "col": "#2b3a47", "cap": "", "credit": "Jeangagnon, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "kp": ["Péladeau defended the bid on CBC on Sunday.", "BCE held preliminary talks with Telus, the Globe and Mail reported on November 18.", "Desjardins puts a Bell and Telus deal at about 55% of wireless."], "bg": "Telus confirmed the unsolicited proposal on November 16. Quebecor became Canada’s fourth national carrier when it bought Freedom Mobile as the remedy in the Rogers and Shaw merger, the basis of its claim that the deal adds competition. NDP leader Avi Lewis has asked the Competition Bureau to block it.", "nx": "", "chart": {"type": "bar", "t": "Market value, as reported by CBC", "rows": [["Quebecor", 14.77, "C$14.77 billion"], ["Telus", 21.72, "C$21.72 billion"]]}}, {"id": "s6", "sec": "The Front", "sid": "s-front", "h": "An Iranian strike sets a Bahrain site on fire as Araghchi opens a debate", "s": "Bahrain said it intercepted Iranian aerial attacks late Saturday and that a fire broke out at an unnamed industrial facility, Al Jazeera reported. Foreign Minister Abbas Araghchi told IRNA that changing Iran’s doctrine is “a major strategic debate.”", "paras": ["Bahrain said it intercepted Iranian aerial attacks late Saturday and that a fire broke out at an unnamed industrial facility, with damage but no injuries, Al Jazeera reported. The IRGC claimed it destroyed two US <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Patriot<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The US air-defense system guarding Gulf bases; its radars are the eyes of the battery, so a destroyed radar blinds the launchers it serves.<\/span><\/button> radars. At least three tankers were hit near Khasab, AP reported.", "Foreign Minister Abbas Araghchi told IRNA that changing Iran’s doctrine is “a major strategic debate,” adding, “For now, our doctrine has not changed.” The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Assembly of Experts<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The clerical body that chooses and can remove the supreme leader, which gives its call for new deterrence on November 12 constitutional weight.<\/span><\/button> called a review “unavoidable” on November 12. Leaving the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">NPT<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The 1970 treaty’s Article X lets a member withdraw on three months’ notice, so any exit would come with a public clock.<\/span><\/button> is the step the debate turns on."], "why": "A foreign minister on record that the bomb is debatable moves Iran from capability to intent while US carriers sit in range.", "c": {"L": 3, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/21/bahrain-says-iranian-attack-causes-fire-at-industrial-facility", "t": "L"}, {"n": "AP via ABC News", "u": "https://abcnews.com/Business/wireStory/iran-strikes-3-tankers-shows-off-missile-launchers-138345075", "t": "C"}, {"n": "Al Jazeera (doctrine)", "u": "https://www.aljazeera.com/news/2026/11/21/could-iran-reverse-its-stated-policy-of-a-civil-only-nuclear-programme", "t": "L"}, {"n": "Al Jazeera (tankers)", "u": "https://www.aljazeera.com/news/2026/11/21/tankers-hit-in-strait-of-hormuz-as-iran-tightens-grip-on-shipping", "t": "L"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-22/s6.webp?h=82d00b2a", "col": "#233a51", "cap": "", "credit": "Zairon, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "kp": ["Bahrain reported its first fire and damage from the Iranian attacks.", "Araghchi said Iran’s doctrine has not changed “for now.”", "AP counted at least three tankers struck on Saturday."], "bg": "Iran held about 440 kg of uranium enriched to 60% by a 2025 estimate, and IAEA chief Rafael Grossi said in March that at least 200 kg is believed to have survived the strikes. Qatari mediators visited Tehran on Friday, a deputy foreign minister said.", "nx": ""}, {"id": "s7", "sec": "AI", "sid": "d-ai", "h": "Killer robots get two more years of talk", "s": "The Geneva review conference ended Saturday with states agreeing only to “elaborate” rules on lethal autonomous weapons by 2028, AP reported. Seven states sought a negotiating mandate and fell short.", "paras": ["The Geneva review conference of the weapons convention ended Saturday with states agreeing only to “elaborate” rules on lethal autonomous weapons by 2028, AP reported. Seven states sought a negotiating mandate and fell short; activists blamed Russia. Max Tegmark said states had agreed to talk “for the 14th year.”"], "why": "", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "AP via Boston Globe", "u": "https://www.bostonglobe.com/2026/11/21/world/ai-killer-robots-un-more-talks/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-22/s7.webp?h=1a647e14", "col": "#3b3829", "cap": "", "credit": "Vassil, CC0 / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": ""}, {"id": "s8", "sec": "Markets & Deals", "sid": "d-mkt", "h": "The curve rallied into a holiday week of supply", "s": "Treasury’s par curve rallied on the week into Thanksgiving. Treasury sells $69 billion of two-year notes Monday, $70 billion of five-year Tuesday and $44 billion of seven-year Wednesday.", "paras": ["Treasury’s par curve closed Friday at 4.63% on the two-year, 4.92% on the ten-year and 5.31% on the thirty-year, down 25, 23 and 16 basis points on the week. Treasury sells $69 billion of two-year notes Monday, $70 billion of five-year Tuesday and $44 billion of seven-year Wednesday, before PCE and the Beige Book. Futures still price a December hike near 90%."], "why": "", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Treasury", "u": "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_yield_curve&field_tdr_date_value_month=202611", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": "", "chart": {"type": "line", "t": "Treasury par yields, Friday close", "rows": [["Two-year", 4.63, "4.63%"], ["Ten-year", 4.92, "4.92%"], ["Thirty-year", 5.31, "5.31%"]]}}, {"id": "s9", "sec": "Law & the Courts", "sid": "d-law", "h": "The Cravath scale spread", "s": "Cravath set 2027 salaries on November 17. Cleary matched within a day, then Paul Hastings, Proskauer and Dechert; Seyfarth stayed below market, Above the Law reported.", "paras": ["Cravath set 2027 salaries at $235,0 rgy use by 2035, AP reported. Panama vowed to object. No text had been adopted at press time."], "why": "", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "AP via Boston Globe", "u": "https://www.bostonglobe.com/2026/11/22/world/turkey-un-climate-fossil-fuels-global-warming/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "35%", "l": "electricity share of final energy by 2035"}}, {"id": "s12", "sec": "Entertainment & EASL", "sid": "d-cult", "h": "The Reaping opens big", "s": "Sunrise on the Reaping took $56 million on Friday, previews included. Lionsgate had guided to $85 million for the weekend.", "paras": ["Sunrise on the Reaping took $56 million on Friday, previews included, and Variety projects about $120 million for the weekend, well above Lionsgate’s $85 million guide."], "why": "", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "Cover Media via Yahoo", "u": "https://www.yahoo.com/entertainment/movies/box-office-results/articles/sunrise-reaping-heads-200-million-005517027.html", "t": "C"}, {"n": "Variety", "u": "https://variety.com/2026/film/box-office/box-office-hunger-games-sunrise-of-the-reaping-opening-day-1236954987/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "$120 million", "l": "Variety’s weekend projection"}}, {"id": "s13", "sec": "Entertainment & EASL", "sid": "d-cult", "h": "The college sports bill drops its exit penalty", "s": "Records show UNC led ACC schools, Miami among them, against a clause forcing a departing school into five years of independence. The revised bill drops it, Front Office Sports reported. Single-source.", "paras": ["Records show UNC led ACC schools, Miami among them, against a clause forcing a departing school into five years of independence; the revised bill released November 20 drops it and caps conferences at 22, Front Office Sports reported. Single-source."], "why": "", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Front Office Sports", "u": "https://frontofficesports.com/article/unc-led-coalition-acc-schools-against-realignment-punishment-college-sports-bill/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "22", "l": "conference cap in the revised bill"}}, {"id": "s14", "sec": "Wall Street South", "sid": "d-sofla", "h": "Vice City’s first day", "s": "Take-Two reported GTA VI’s first-day retail sales in an 8-K on November 20.", "paras": ["Take-Two reported $3.79 billion of GTA VI retail sales on day one in an 8-K on November 20."], "why": "", "c": {"L": 0, "LL": 0, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "SEC filing", "u": "https://www.sec.gov/Archives/edgar/data/0000946581/000162828026075217/exhibit9918k.htm", "t": null}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "$3.79 billion", "l": "GTA VI retail sales on day one"}}, {"id": "s15", "sec": "Wall Street South", "sid": "d-sofla", "h": "Cleary opens in Miami", "s": "Cleary Gottlieb launched a Miami office with four partners from Weil, Bloomberg Law reported on November 17.", "paras": ["Cleary Gottlieb launched a Miami office with four partners from Weil, Bloomberg Law reported on November 17."], "why": "", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Bloomberg Law", "u": "https://news.bloomberglaw.com/business-and-practice/cleary-gottlieb-adds-four-weil-partners-launches-miami-office", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": ""}, {"id": "s16", "sec": "Wall Street South", "sid": "d-sofla", "h": "LIV’s creditors want the Tour’s files", "s": "The creditors committee in LIV Golf’s Chapter 11 subpoenaed the PGA Tour; a hearing is set for Tuesday.", "paras": ["The creditors committee in LIV Golf’s Chapter 11 subpoenaed the PGA Tour on 18 categories; a hearing is set for Tuesday."], "why": "", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Front Office Sports", "u": "https://frontofficesports.com/article/pga-tour-liv-bankruptcy-subpoena-desperate-fishing-expedition/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "18", "l": "categories in the subpoena to the Tour"}}], "week": [{"day": "Mon Nov 16", "lead": "Duffy blamed an overloaded router for the ground stop and asked for $50 billion, and Iranian drones hit Bahrain."}, {"day": "Tue Nov 17", "lead": "California sued OpenAI over agents escaping their sandboxes, and Quebecor bid C$31 billion for Telus."}, {"day": "Wed Nov 18", "lead": "Nvidia reported $115.8 billion of quarterly revenue, and Cravath set its 2027 salary scale."}, {"day": "Thu Nov 19", "lead": "Anthropic’s IPO priced at $83 a share, and Trump, Xi and Putin met in Shenzhen without a deal."}, {"day": "Fri Nov 20", "lead": "ANT opened at $111.50 and closed at $97.17, and the Shenzhen declaration text left out Ukraine."}, {"day": "Sat Nov 21", "lead": "Nvidia fell 14% on a reported SEC accounting probe, two indexes entered correction, and a Russian missile landed in Poland."}, {"day": "Sun Nov 22", "lead": "Lean’s keepers certified a Claude-assisted proof of the Riemann Hypothesis, and NATO promised to defend every inch of Poland."}], "cover": "img/2026-11-22/s1.webp?h=d7c388a5"}, {"date": "2026-11-21", "no": 177, "min": 9.6, "stand": "An accounting question at Nvidia takes the Nasdaq down 5 percent and two indexes into correction; a Russian cruise missile lands in Poland; Anthropic’s offering closes at $119.5 billion; and Take-Two puts GTA VI’s first day at $3.79 billion.", "note": "Editor’s note. 12 items at 2,296 read-words, inside the ten-minute cap. Disclosure: Anthropic, whose model compiles this paper, is the subject of the AI lead, which rests on the company’s own release with Reuters, Fox Business and InvestmentNews for corroboration. The Nvidia report is Reuters’ alone, read through a syndicated copy; the SEC declined to comment and Nvidia had not responded. Index moves are Fox Business’s, and no official Dow close was confirmed at a wire. The Fifth Circuit item rests on the opinion and one Bloomberg Law report, and the Justice Department memo on one Bloomberg Law report; the memo itself was not seen. The LIV subpoena is Front Office Sports’ alone. The Poland item could not reach a left-of-center roster outlet; CNN and NPR pages refused automated reading, and the day’s search budget ran out before every cross-tier check could run. COP31 had not concluded at press time. Box office figures are Deadline projections as reported by Forbes. The $44 billion SpaceX financing figure is Apollo’s; Reuters’ three tranches account for about $32 billion. Cut for rank or length: GTCR’s filing that it is exploring a take-private of Global Payments, reported at up to $50 billion including debt; SoftBank’s reported soundings on a $1 trillion SK Hynix buyout, seen only as a headline; Databricks’ talks at about $225 billion; the Justice Department’s closing of its review of NextEra’s $66.8 billion Dominion deal; MasTec’s $1.25 billion Murphy close; Denmark’s expulsion of Russia’s defense attaché over a plot to kill the rapper Kyivstoner; The Hunger Games: Sunrise on the Reaping’s projected $110 million opening; Ubisoft’s 11 percent fall on a holiday guidance cut; Tom Brady’s Chelsea stake; NBCUniversal’s exit from 2030 World Cup bidding; Sullivan &amp; Cromwell’s 2028 leadership handover; approval of Bayer’s $7.25 billion Roundup settlement; Iraqi troops entering Jurf al-Sakhar; the Kryvyi Rih strike; the U.S. trustee’s objection in the Character.ai sale. Magnitude check: the largest financing in the window was the $44 billion SpaceX chip deal, which ran; the largest reported takeover was GTCR and Global Payments, cut as exploratory; the largest contested bid remains Quebecor’s for Telus, which had no new development. Watch: Rutte in Warsaw today; Telus holders meet Monday; the LIV hearing Monday; Huang’s testimony Dec. 1.", "items": [{"id": "s1", "sec": "The Front", "sid": "s-front", "h": "Nvidia falls 14 percent on a report of an SEC accounting probe", "s": "Two people briefed on the matter told Reuters that SEC enforcement staff are scrutinizing “potential accounting issues” at Nvidia. Reuters could not learn when the inquiry opened or which issues it covers, and the SEC declined to comment.", "paras": ["The Nasdaq Composite fell 5.28 percent on Friday, erasing its gain for the year in the second-largest one-day point drop on record, and the S&amp;P 500 lost 3.7 percent as it and the Dow, down nearly 950 points, closed in <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">correction<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Valuations have compressed faster than profit forecasts: the forward multiple is near 18 times earnings, 19 percent lower than in January, by a bank estimate in Fortune.<\/span><\/button>, Fox Business reported. Nvidia fell 14 percent to $125.53 after Reuters reported that federal securities regulators are examining the company’s books.", "Two people briefed on the matter told Reuters that staff in the SEC’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">enforcement division<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The SEC recently set up a unit inside Enforcement devoted to financial reporting and accounting, and its director, David Woodcock, told Reuters last month that the agency is reviewing what AI companies disclose.<\/span><\/button> are scrutinizing “potential accounting issues.” Reuters could not learn when the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">inquiry<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>At this stage staff can demand documents and testimony, but charges need a vote of the commission, and many investigations close with no action, as Reuters noted.<\/span><\/button> opened or which issues it covers, and the SEC declined to comment. Last year Nvidia began reporting revenue by where customers are headquartered rather than where they are billed, a change that removed <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Singapore<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>Nvidia has said customers often pay through a central office for chips shipped elsewhere. One Singapore buyer, Megaspeed, has been under U.S. export-control investigation since 2024, Reuters reported.<\/span><\/button> from its breakdown; the Financial Times has reported sales there near half of global revenue. The shares were down more than 6 percent before the report.", "Nvidia, run on an interim basis since <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Jensen Huang<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>Nvidia’s co-founder had led the company since 1993. Forbes estimated that he lost about $17.3 billion of personal wealth on Friday alone.<\/span><\/button> stepped down as chief executive on Nov. 12, did not immediately respond. AMD fell 13.3 percent and Broadcom 12.1 percent, the Motley Fool reported. The S&amp;P 500 posted a seventh straight loss, its longest run since February 2020, and the Nasdaq its worst week since March 2020, while the VIX closed at its highest since April 2025, Fox reported."], "why": "Goldman Sachs estimates that AI capital spending produced about half of S&amp;P 500 earnings growth this year, Fortune reported. An accounting question at the largest seller into that spending reprices every deal in this paper built on the same bet.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 1}, "src": [{"n": "Fox Business", "u": "https://www.foxbusiness.com/markets/wall-street-suffers-historic-losses-dow-sp-500-plunge-correction-territory", "t": "R"}, {"n": "Reuters (via Euronext)", "u": "https://live.euronext.com/en/financial-news/nvidias-accounting-focus-us-sec-investigation-sources-say", "t": "C"}, {"n": "Bloomberg Law", "u": "https://news.bloomberglaw.com/business-and-practice/wall-street-regulator-probing-nvidias-accounting-reuters-says", "t": "C"}, {"n": "Fortune", "u": "https://fortune.com/2026/11/20/ai-stocks-selloff-anthropic-record-ipo-wall-street-split-top/", "t": "C"}, {"n": "Forbes", "u": "https://www.forbes.com/sites/fionariley/2026/11/20/sec-is-investigating-nvidias-accounting-practices-according-to-report/", "t": "C"}, {"n": "Motley Fool (via Yahoo Finance)", "u": "https://finance.yahoo.com/markets/stocks/articles/stock-market-today-nov-20-215502847.html", "t": null}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-21/s1.webp?h=6539b178", "col": "#53292f", "cap": "The New York Stock Exchange on Wall Street, where the Dow closed in correction on Friday.", "credit": "Photograph by Mike Peel, CC BY-SA 4.0 / Wikimedia Commons", "pull": {"text": "It was a brutal day in the stock market with AI fears taking center stage.", "attr": "Gerri Willis, Fox Business, Nov. 20"}, "kp": ["Reuters reported SEC enforcement staff are examining potential accounting issues at Nvidia.", "Nvidia fell 14 percent to $125.53; AMD fell 13.3 percent and Broadcom 12.1 percent.", "The S&amp;P 500 and the Dow closed at least 10 percent below their records."], "bg": "The Wall Street Journal reported on Nov. 17 that the SEC had opened a probe of Nvidia, without knowing its focus, the day the company reported $115.8 billion of third-quarter revenue. Jensen Huang had left as chief executive on Nov. 12, and finance chief Colette Kress became interim chief. Nvidia has said its quarterly 10-Q will come “in the coming weeks,” after an independent committee of its board completes a review, Yahoo Finance reported. The stock is down 39 percent since the S&amp;P 500’s record on Oct. 6, Fortune reported, and the 10-year Treasury yield fell 12 basis points on Friday to 4.92 percent as investors bought bonds, Treasury data show.", "nx": "Huang testifies in a closed session before three House committees on Dec. 1, Forbes reported, and the Federal Reserve meets Dec. 8 and 9.", "chart": {"type": "bar", "t": "Friday’s falls, percent", "rows": [["Nasdaq Composite", 5.28, "5.28 percent"], ["S&P 500", 3.7, "3.7 percent"], ["Nvidia", 14, "14 percent"], ["AMD", 13.3, "13.3 percent"], ["Broadcom", 12.1, "12.1 percent"]]}}, {"id": "s2", "sec": "The Front", "sid": "s-front", "h": "A Russian cruise missile lands in Poland as allied troops drill nearby", "s": "Two suspected Russian missiles and a jet-powered drone fell in southeastern Poland overnight Thursday, injuring no one, according to the Kyiv Independent. AFP reported one object was confirmed as a Kh-101. “We are dealing with an intentional provocation,” Prime Minister Donald Tusk said.", "paras": ["Two suspected Russian missiles and a jet-powered drone fell in southeastern Poland overnight Thursday at Nowy Lipowiec, Rudnik nad Sanem and Molodycz, injuring no one, Defense Minister Władysław Kosiniak-Kamysz said, according to the Kyiv Independent. AFP reported that the object at Nowy Lipowiec was confirmed as a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Kh-101<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>An air-launched cruise missile carried by Russia’s Tu-95MS and Tu-160 bombers, with a range of about 2,500 kilometers, which lets crews fire from deep inside Russian airspace.<\/span><\/button>. “We are dealing with an intentional provocation,” Prime Minister Donald Tusk said, noting that <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">coalition of the willing<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The roughly 30 nations, led by Britain and France, planning a reassurance force for Ukraine to deploy after any ceasefire. Exercises on Polish ground make the group a party to the incident.<\/span><\/button> drills with British and French troops were under way at Nowa Dęba, about 90 minutes’ drive away.", "NATO secretary general Mark Rutte condemned “grave violations” and travels to Warsaw today. No outlet reported that Poland had requested consultations under <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Article 4<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Any ally that judges its territory or security threatened may call all members to consult. Poland invoked it in September 2025, after Russian drones crossed its border.<\/span><\/button>. The same night Russia fired more than 110 missiles and 404 drones at Ukraine, killing eight people, Fox News reported, a day after the Shenzhen summit."], "why": "A cruise missile on NATO soil during allied drills, a day after the Shenzhen declaration, tests whether the eastern flank answers with talk or with deployments. Rutte’s visit today is the first read.", "c": {"L": 0, "LL": 0, "C": 0, "LR": 0, "R": 1}, "src": [{"n": "AFP (via Yahoo News)", "u": "https://www.yahoo.com/news/world/articles/warsaw-says-russian-missiles-hit-143506907.html", "t": null}, {"n": "Fox News", "u": "https://www.foxnews.com/world/putin-launches-ukraine-barrage-hours-after-trump-meeting-amid-alleged-russian-missile-breach-nato-airspace", "t": "R"}, {"n": "Kyiv Independent", "u": "https://kyivindependent.com/poland-reports-airspace-violation-during-russian-attack-on-ukraine-investigates-debris-crash/", "t": null}, {"n": "Newsweek", "u": "https://www.newsweek.com/russian-missiles-crash-inside-poland-everything-we-know-12746043", "t": null}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-21/s2.webp?h=17332928", "col": "#41362a", "cap": "", "credit": "Pece, CC BY 3.0 / Wikimedia Commons", "pull": null, "kp": ["Two suspected missiles and a drone fell in southeastern Poland; no one was hurt.", "AFP reported one object was confirmed as a Kh-101 cruise missile.", "Allied drills with British and French troops were under way about 90 minutes away."], "bg": "Polish air defenses activated at about 3:30 a.m., and two Swedish Gripen fighters and a Dutch tanker aircraft were deployed, the Kyiv Independent reported. The barrage on Ukraine followed the Shenzhen summit of Donald Trump, Xi Jinping and Vladimir Putin, whose declaration did not mention Ukraine. The second missile was described by AFP as suspected, not confirmed.", "nx": "Rutte is due in Warsaw on Saturday, Nov. 21, after Tusk asked for recommendations on the eastern flank, AFP reported.", "fig": {"v": "404", "l": "drones Russia fired at Ukraine the same night"}}, {"id": "s3", "sec": "AI", "sid": "s-ai", "h": "Anthropic’s offering closes at $119.5 billion with a supplier placement", "s": "Anthropic said on Friday that its initial public offering had closed with underwriters fully exercising their option, for gross proceeds of about $93.5 billion. A concurrent private placement raised about $26 billion from seven chip and cloud suppliers.", "paras": ["Anthropic said on Friday that its initial public offering had closed with underwriters fully exercising their <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">option for 147 million more shares<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The overallotment equals 15 percent of the 980 million-share base deal. Underwriters exercise it when the stock trades above the offer price, which closes the short position they would otherwise buy back to support it.<\/span><\/button>, for 1.127 billion Class A shares at $83 and gross proceeds of about $93.5 billion, $91.6 billion of it to the company. A concurrent <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">private placement<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The Class N shares were not registered under the Securities Act, so they are restricted securities and sit outside the public float until registration or an exemption frees them.<\/span><\/button> of 313,253,007 Class N shares at the same price raised about $26 billion from AMD, Broadcom, Google, Micron, Microsoft, Nvidia and TSMC Partners, lifting the total to about $119.5 billion. The stock closed Friday at $88.91, down 8.5 percent, Fox Business reported, after touching $83.05, FinanceFeeds reported."], "why": "Seven of Anthropic’s chip and cloud suppliers bought a stake the size of a large IPO inside the record one. With the option exercised, the offer price has lost its natural buyer on the first bad day for AI stocks.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 1}, "src": [{"n": "Anthropic", "u": "https://www.anthropic.com/news/ipo-close", "t": null}, {"n": "Reuters (via Investing.com)", "u": "https://www.investing.com/news/economy-news/anthropic-ipo-haul-rises-to-935-billion-after-underwriters-exercise-greenshoe-5041607", "t": "C"}, {"n": "Fox Business", "u": "https://www.foxbusiness.com/markets/wall-street-suffers-historic-losses-dow-sp-500-plunge-correction-territory", "t": "R"}, {"n": "InvestmentNews", "u": "https://www.investmentnews.com/equities/anthropic-stock-sinks-85-as-ai-selloff-swamps-record-setting-ipo/269120", "t": "C"}, {"n": "Fortune", "u": "https://fortune.com/2026/11/20/ai-stocks-selloff-anthropic-record-ipo-wall-street-split-top/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-21/s3.webp?h=671174b5", "col": "#1f3663", "cap": "The Nasdaq tower in Times Square. Anthropic trades on the Nasdaq Global Select Market as ANT.", "credit": "Nielsoncaetanosalmeron, CC BY 4.0 / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": "", "chart": {"type": "bar", "t": "ANT, dollars a share", "rows": [["Offering price", 83, "$83"], ["Friday low", 83.05, "$83.05"], ["Friday close", 88.91, "$88.91"]]}}, {"id": "s4", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Apollo and Goldman price about $44 billion of notes for SpaceX’s chips", "s": "Apollo and Goldman Sachs on Friday priced about $44 billion of senior and subordinated notes to buy Nvidia Vera Rubin chips for SpaceX, calling the deal the largest GPU financing to date. Lease schedules begin when the chips arrive in the first half of 2027.", "paras": ["Apollo and Goldman Sachs on Friday priced about $44 billion of senior and subordinated notes to buy Nvidia Vera Rubin chips and related equipment for SpaceX’s ground-based computing, calling the deal oversubscribed, upsized and the largest GPU financing to date. The structure is asset-based: <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">lease schedules<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Bloomberg reported that SpaceX must keep paying even if the equipment fails or a force majeure event occurs, the hell-or-high-water term that lets lenders treat a lease of depreciating chips as bond collateral.<\/span><\/button> begin when the chips arrive in the first half of 2027. Funds managed by BlackRock and Goldman Sachs Asset Management and accounts advised by KKR anchored the book.", "Reuters reported three tranches: $25.17 billion of senior A3 notes due 2033 at 8.259 percent, about $4.4 billion of A2 notes due 2031 at 7.66 percent and $2.564 billion of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">class B notes<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Subordinated holders absorb the first losses if lease payments stop. A spread of only about 10 basis points over the senior paper says buyers see little risk in SpaceX’s rent.<\/span><\/button> at 8.36 percent, about $32 billion of the total. Latham &amp; Watkins advised Apollo and Paul, Weiss the investors. Lenders want assurance the chips stay on Earth, the Financial Times reported, according to Gizmodo."], "why": "The senior notes priced about 334 basis points over a 10-year Treasury that rallied on Friday. Junk-like yields on secured paper show what lenders now charge to fund AI compute off a company’s balance sheet.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "Apollo release", "u": "https://ir.apollo.com/news-events/press-releases/detail/662/apollo-and-goldman-sachs-announce-pricing-of-44-billion", "t": null}, {"n": "Reuters (via AOL)", "u": "https://www.aol.com/articles/apollo-goldman-lead-44-billion-174543000.html", "t": "C"}, {"n": "Reuters (via Investing.com)", "u": "https://www.investing.com/news/stock-market-news/apollo-goldman-lead-44-billion-spacex-gpu-debt-financing-5042346", "t": "C"}, {"n": "Gizmodo", "u": "https://gizmodo.com/elon-musks-lenders-have-one-request-please-dont-launch-our-ai-chips-into-space-2000843187", "t": null}, {"n": "Motley Fool", "u": "https://www.fool.com/investing/2026/11/20/spacex-just-raised-32-billion-for-ai-chips-lenders-want-elon-musk-to-keep-them-on-earth/", "t": null}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-21/s4.webp?h=97115e7c", "col": "#313845", "cap": "The Solow Building in Midtown Manhattan, where Apollo has its headquarters.", "credit": "Kidfly182, CC BY 4.0 / Wikimedia Commons", "pull": null, "kp": ["The notes finance Nvidia Vera Rubin chips that SpaceX will lease.", "The largest tranche, $25.17 billion due 2033, priced at 8.259 percent.", "Latham &amp; Watkins advised Apollo; Paul, Weiss advised the investors."], "bg": "SpaceX disclosed last month that an Apollo affiliate would buy the chips and lease them to it, with about $40 billion of principal payments, Reuters reported. Bloomberg reported on Nov. 19 that a trust holds title to the chips. Reuters’ three tranches sum to about $32 billion, and the release does not itemize the rest.", "nx": "Lease schedules start on delivery of the equipment in the first half of 2027, Apollo said.", "chart": {"type": "bar", "t": "Tranches reported by Reuters, coupon, percent", "rows": [["A3 notes due 2033", 8.259, "8.259 percent"], ["A2 notes due 2031", 7.66, "7.66 percent"], ["Class B notes", 8.36, "8.36 percent"]]}}, {"id": "s5", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Treasuries rally on the stock rout as the Fed’s Cook argues for a hike", "s": "Yields fell across the curve on Friday, Treasury’s par curve shows. Fed governor Lisa Cook said, “Waiting longer to implement rate increases risks getting behind the curve.”", "paras": ["The two-year Treasury yield fell 13 basis points on Friday to 4.63 percent, the 10-year 12 to 4.92 percent and the 30-year 9 to 5.31 percent, Treasury’s par curve shows, with the 20-year at 5.34 percent still above the 30-year. Germany’s 10-year yield had its largest one-day drop since April, Investing.com reported. In Santiago, Fed governor <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Lisa Cook<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>She dissented in favor of a hike at the October meeting, her first dissent, when the committee voted 10 to 2 to hold the funds rate at 3.75 to 4 percent.<\/span><\/button> said, “Waiting longer to implement rate increases risks getting behind the curve.” <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">CME FedWatch<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The tool reads meeting odds off fed funds futures prices; Investing.com reported about 10 percent odds of a 50-basis-point move.<\/span><\/button> put the odds of a quarter-point hike on Dec. 9 at 97.5 percent, Yahoo Finance reported."], "why": "The market is pricing a flight to safety and a Fed hike at once. A bull steepener lowers the base rate under every deal this week while the funding cost at the front end keeps rising.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "U.S. Treasury", "u": "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_yield_curve&field_tdr_date_value_month=202611", "t": null}, {"n": "Yahoo Finance", "u": "https://finance.yahoo.com/economy/policy/article/lisa-cook-warns-the-fed-could-get-behind-the-curve-if-it-doesnt-raise-rates-now-171832457.html", "t": "C"}, {"n": "Investing.com", "u": "https://ca.investing.com/news/forex-news/global-bond-yields-plunge-as-ai-rout-triggers-flight-to-safety-4971404", "t": null}, {"n": "Dow Jones (via MarketScreener)", "u": "https://www.marketscreener.com/news/u-s-treasury-yields-fall-as-investors-seek-safe-haven-assets-ce785ed2d089f725", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-21/s5.webp?h=39802814", "col": "#303845", "cap": "", "credit": "Tony Webster, CC BY-SA 3.0 / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": "", "chart": {"type": "line", "t": "Treasury par yields, Friday, percent", "rows": [["2-year", 4.63, "4.63 percent"], ["10-year", 4.92, "4.92 percent"], ["20-year", 5.34, "5.34 percent"], ["30-year", 5.31, "5.31 percent"]]}}, {"id": "s6", "sec": "Markets & Deals", "sid": "s-mkt", "h": "CrowdStrike is in talks to buy Zscaler, Bloomberg reports", "s": "CrowdStrike is in talks to acquire Zscaler, Bloomberg reported on Friday, and a deal could come together soon. Reuters cited two sources who said “no deal is guaranteed.” Neither company commented.", "paras": ["CrowdStrike is in talks to acquire <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Zscaler<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The cloud network-security company’s shares were down 13 percent this year before the report, Bloomberg said, which left a buyer room to pay a premium on a depressed base.<\/span><\/button>, Bloomberg reported on Friday, and a deal could come together soon. Zscaler has a market value of about $32 billion to $33.5 billion, by Bloomberg’s and Reuters’ counts, against about $233 billion for CrowdStrike. Zscaler rose 17 percent after hours and CrowdStrike fell about 8 percent, Reuters reported, citing two sources who said “no deal is guaranteed.” Neither company commented, and no advisers have been named. The deal would fill CrowdStrike’s gap in network security against <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Palo Alto Networks<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The rival agreed on Nov. 18 to buy Applied Compute for $4.5 billion in stock, so both platform consolidators bid for scale in the same week.<\/span><\/button>, Reuters reported."], "why": "A $30 billion-plus software takeover agreed in a week of AI-stock selling would show that strategic buyers still pay for scale when the IPO window is shut.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Bloomberg (via Yahoo Finance)", "u": "https://finance.yahoo.com/technology/articles/crowdstrike-talks-buy-cybersecurity-firm-210511823.html", "t": "C"}, {"n": "Reuters (via Investing.com)", "u": "https://www.investing.com/news/stock-market-news/crowdstrike-in-talks-to-acquire-zscaler-sources-say-5042720", "t": "C"}, {"n": "SiliconANGLE", "u": "https://siliconangle.com/2026/11/20/crowdstrike-reportedly-in-talks-to-acquire-cybersecurity-provider-zscaler/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-21/s6.webp?h=236b9aee", "col": "#383a24", "cap": "", "credit": "Comrade Goose, CC BY 4.0 / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "17 percent", "l": "Zscaler’s after-hours rise, Reuters reported"}}, {"id": "s7", "sec": "Law & the Courts", "sid": "s-law", "h": "Fifth Circuit, 9 to 8, rules House proxy votes broke the Quorum Clause", "s": "The en banc Fifth Circuit held on Friday that members voting by proxy cannot count toward a House quorum, so the passage of the 2023 omnibus spending law was unconstitutional. The injunction bars enforcement of the Pregnant Workers Fairness Act against Texas alone.", "paras": ["The en banc Fifth Circuit held on Friday, 9 to 8, that members voting by proxy cannot count toward a House quorum, so the passage of the 2023 omnibus spending law, which carried the Pregnant Workers Fairness Act, was unconstitutional. Judge Cory Wilson wrote for the majority in Texas v. Blanche, No. 24-10386, affirming a 2024 injunction by Judge James Wesley Hendrix that bars enforcement of the act against Texas alone. “Members of Congress must be present for quorum purposes,” Wilson wrote.", "The majority held that the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">enrolled-bill rule<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Since Marshall Field &amp; Co. v. Clark in 1892, courts have treated a bill signed by both presiding officers as conclusive proof it passed. The majority read that rule as covering facts, not the meaning of the Constitution.<\/span><\/button> did not bar review. Judge James Graves, for seven dissenters, wrote that “the plain text of the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Quorum Clause<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Article I, Section 5 requires a majority of each chamber to do business. The Senate never allowed proxies, Bloomberg Law reported, so the holding reaches only House votes from 2020 to 2023.<\/span><\/button> contains no physical presence requirement,” and Judge Catharina Haynes dissented separately. A three-judge panel had upheld the law, Bloomberg Law reported."], "why": "The same bill carried the Electoral Count Reform Act and the rest of the 2023 budget, so the reasoning invites suits against any provision it enacted. The Supreme Court will likely have to say whether courts may audit a quorum.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Fifth Circuit opinion", "u": "https://www.ca5.uscourts.gov/opinions/pub/24/24-10386-CV1.pdf", "t": null}, {"n": "Bloomberg Law", "u": "https://news.bloomberglaw.com/business-and-practice/congress-proxy-voting-found-unconstitutional-by-fifth-circuit", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-21/s7.webp?h=6b975735", "col": "#3b3542", "cap": "The John Minor Wisdom U.S. Court of Appeals Building in New Orleans, seat of the Fifth Circuit.", "credit": "ajay_suresh, CC BY 4.0 / Wikimedia Commons", "pull": null, "kp": ["The court split 9 to 8, with Judge Cory Wilson writing for the majority.", "The injunction protects Texas only; the act still applies elsewhere.", "The majority held the enrolled-bill rule does not bar review of a legal question."], "bg": "The House let members vote by proxy from May 2020 into 2023, and the omnibus passed in December 2022 with many proxy votes. Texas sued in 2023, and Hendrix enjoined the act as to the state in 2024. The case is expected to reach the Supreme Court, Bloomberg Law reported.", "nx": "A Democrat won the race for Texas attorney general, so the office that brought the suit changes hands in January, Bloomberg Law reported."}, {"id": "s8", "sec": "Law & the Courts", "sid": "s-law", "h": "The Justice Department tells its lawyers to stop citing the ABA", "s": "Acting Deputy Attorney General Trent McCotter told department lawyers to “generally avoid citing such materials” in court filings and public documents, Bloomberg Law reported on Friday. Reliance on the association “risks legitimizing the ABA and its positions,” the memo said.", "paras": ["Acting Deputy Attorney General Trent McCotter told department lawyers in a memo on Thursday to “exercise extreme caution when referencing ABA materials” and to “generally avoid citing such materials” in court filings and public documents, Bloomberg Law reported on Friday. Reliance on the association “risks legitimizing the ABA and its positions,” the memo said, citing its diversity policy and a court filing. The ABA has sued the administration for records about its deals with law firms, Raw Story reported. The memo limits citation, not compliance: under <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">28 U.S.C. § 530B<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Congress passed it in 1998 as the McDade Amendment, after the department had claimed in 1989 that its prosecutors were exempt from state no-contact rules.<\/span><\/button>, department lawyers remain bound by state ethics codes built on the ABA’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Model Rules<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Courts routinely cite the ABA’s formal ethics opinions to interpret those codes, so the memo reaches the commentary judges rely on, not the rules themselves.<\/span><\/button>."], "why": "The department cannot shed the rules but can stop citing the body that drafts them, so its briefs will argue ethics questions without the authority courts usually read first.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Bloomberg Law", "u": "https://news.bloomberglaw.com/business-and-practice/doj-tells-staff-to-stop-citing-american-bar-association-rules", "t": "C"}, {"n": "Raw Story", "u": "https://www.rawstory.com/trump-officials-declare-new-front-in-war-on-respected-american-legal-group/", "t": null}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-21/s8.webp?h=e2e46ad3", "col": "#3c3829", "cap": "", "credit": "APK, CC BY 4.0 / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": ""}, {"id": "s9", "sec": "Law & the Courts", "sid": "s-law", "h": "The Ninth Circuit pauses Essayli’s disqualification as he heads to Miami", "s": "The Ninth Circuit on Friday granted an interim stay of an order finding that Bill Essayli was unlawfully serving as de facto U.S. attorney in Los Angeles, Bloomberg Law reported. The department has assigned him to lead the stalled Mar-a-Lago search inquiry in Miami.", "paras": ["The Ninth Circuit on Friday granted an interim stay of Judge J. Michael Seabright’s October order finding that Bill Essayli was unlawfully serving as de facto U.S. attorney in Los Angeles, Bloomberg Law reported. The order barred him from two prosecutions and was to take effect Nov. 23. The department has assigned Essayli to the Southern District of Florida as a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">special assistant U.S. attorney<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A designation that lets a lawyer from another office work cases in a district. It needs no Senate confirmation and does not make him the district’s U.S. attorney.<\/span><\/button> to lead the stalled inquiry into people involved in the 2022 Mar-a-Lago search, Bloomberg Law reported. Joe diGenova, its prior head, resigned in September, and the Miami U.S. attorney, Jason Reding Quiñones, stepped down on Nov. 6. No one has been charged."], "why": "Miami’s federal prosecutors have no U.S. attorney, and a politically charged probe is now run by an official whose authority in his home district is still in litigation.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Bloomberg Law", "u": "https://news.bloomberglaw.com/business-and-practice/ninth-circuit-grants-interim-stay-of-essayli-disqualification", "t": "C"}, {"n": "Bloomberg Law", "u": "https://news.bloomberglaw.com/business-and-practice/doj-sends-essayli-to-miami-to-investigate-mar-a-lago-search", "t": "C"}, {"n": "Above the Law (Reuters link)", "u": "https://abovethelaw.com/2026/11/morning-docket-11-20-26/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-21/s9.webp?h=e59c119f", "col": "#393b0d", "cap": "", "credit": "Carol M. Highsmith, Public domain / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": ""}, {"id": "s10", "sec": "The World", "sid": "s-world", "h": "COP31 runs into Saturday after a draft drops every mention of fossil fuels", "s": "The climate talks in Antalya missed their Friday close and pushed into Saturday, Euronews reported. Panama’s environment minister blamed a “petroleum mafia” and has threatened to object.", "paras": ["The United Nations climate talks in Antalya missed their Friday close and pushed into Saturday, with a new draft expected during the day, Euronews reported. A second draft released Thursday removed all mention of coal, oil and gas, which the first had addressed, and instead sets how much carbon dioxide industry might capture each year by 2035, Ireland’s RTÉ reported. A $120 billion adaptation finance target was cut, AFP reported.", "France and Panama, with a bloc of nine other countries, demanded “a clear transition away from fossil fuels,” and the European Union said the text risked “turning this climate COP into a fossil summit.” Panama’s environment minister, Juan Carlos Navarro, blamed a “petroleum mafia” and has threatened to object, which under the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">consensus rule<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The UN climate convention never adopted voting rules, so since 1995 every decision has needed the absence of a formal objection, which gives one determined delegation a veto.<\/span><\/button> can block a deal. Saudi Arabia and the Arab Group oppose even acknowledging national roadmaps, RTÉ reported. “We are close to the finish line, but we are not there yet,” said <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Murat Kurum<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>Türkiye’s environment minister holds the COP31 presidency while Australia’s Chris Bowen chairs the negotiations, a split agreed in 2025 after both countries bid to host.<\/span><\/button>, the conference president. The United States sent no delegation for a second year, Al Jazeera reported."], "why": "A text that swaps phase-out language for carbon capture targets would be the first rollback of the COP28 pledge, and the capture numbers become the yardstick lenders use to price transition-linked debt.", "c": {"L": 1, "LL": 0, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "AFP (via Arab News Pakistan)", "u": "https://www.arabnews.pk/world/countries-race-to-secure-cop31-deal-after-fossil-fuel-row-3007663", "t": null}, {"n": "Al Jazeera (via Yahoo News)", "u": "https://www.yahoo.com/news/science/articles/fossil-fuel-talks-deadlock-pushes-230641602.html", "t": "L"}, {"n": "Euronews", "u": "https://www.euronews.com/2026/11/21/fossil-fuel-row-sees-cop31-talks-spill-into-overtime", "t": null}, {"n": "RTÉ", "u": "https://www.rte.ie/news/environment/2026/1121/1600094-cop31-turkey/", "t": null}, {"n": "UN News", "u": "https://news.un.org/en/story/2026/11/1168845", "t": null}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-21/s10.webp?h=5019bdad", "col": "#00414e", "cap": "The old town marina in Antalya, host of COP31.", "credit": "REHBER0770, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "kp": ["Talks missed the Friday close and continued into Saturday.", "Thursday’s draft dropped every mention of coal, oil and gas.", "Panama has threatened to object, which can block a consensus deal."], "bg": "At COP28 in Dubai in 2023, nearly 200 countries agreed to “transition away from fossil fuels” in energy systems. The Antalya draft would raise electricity to 35 percent of final energy by 2035 with no requirement that it be renewable, Al Jazeera reported. No outcome had been announced as of Saturday morning.", "nx": "A third draft was expected on Saturday, Nov. 21, AFP reported.", "fig": {"v": "$120 billion", "l": "adaptation finance target cut from the draft"}}, {"id": "s11", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "Take-Two puts GTA VI’s first day at $3.79 billion in retail sales", "s": "Take-Two Interactive said on Friday the figure is a company estimate through Nov. 19, filed with the SEC. On Nov. 9 it guided December-quarter net bookings to $3.35 billion to $3.5 billion, the Motley Fool reported, below the one-day figure.", "paras": ["Take-Two Interactive said on Friday that Grand Theft Auto VI generated $3.79 billion in retail sales on its first day, a company estimate through Nov. 19 that it filed with the SEC, after 32.5 million units sold before release. On Nov. 9 it guided December-quarter <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">net bookings<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Take-Two’s headline metric counts what it sells net of the platform and retailer share, so a retail sales total runs well above the bookings the same copies produce.<\/span><\/button> to $3.35 billion to $3.5 billion, the Motley Fool reported, below the one-day figure. The total is well above <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Sensor Tower<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The analytics firm tracks mainly digital storefronts, which is why its estimate of about $2.36 billion and 24.5 million copies misses disc sales, GTA Boom reported.<\/span><\/button>’s estimate. “We are incredibly humbled by the response from players around the world,” said Sam Houser, Rockstar’s founder."], "why": "The release shows how a company can print a record without restating guidance: retail sales and net bookings are different measures, and analysts will press the gap on the next call.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Take-Two, SEC filing", "u": "https://www.sec.gov/Archives/edgar/data/0000946581/000162828026075217/exhibit9918k.htm", "t": null}, {"n": "PC Gamer", "u": "https://www.pcgamer.com/games/grand-theft-auto/grand-theft-auto-6-earned-usd3-79-billion-on-launch-day/", "t": "C"}, {"n": "Motley Fool", "u": "https://fool.com/investing/2026/11/20/gta-vi-boasts-a-record-breaking-launch-with-usd3-79-billion-in-day-one-sales-is-it-time-to-buy-take-two-stock", "t": null}, {"n": "GTA Boom", "u": "https://www.gtaboom.com/gta-6-just-set-the-biggest-entertainment-launch-record-in-history-5193", "t": null}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-21/s11.webp?h=998c765e", "col": "#333c23", "cap": "Rockstar North’s studio in Edinburgh, which led development of GTA VI, set in a Miami called Vice City.", "credit": "Chabe01, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "32.5 million", "l": "units sold before release"}}, {"id": "s12", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "LIV Golf’s creditors subpoena the PGA Tour for its Saudi framework papers", "s": "LIV Golf’s official committee of unsecured creditors served a subpoena on the PGA Tour on Friday seeking 18 categories of documents, Front Office Sports reported. A Tour spokesperson called it “a desperate fishing expedition.”", "paras": ["The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">official committee of unsecured creditors<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The U.S. trustee appoints it from the largest unsecured claimants, and the estate pays its lawyers, here Fox Rothschild and Willkie Farr &amp; Gallagher.<\/span><\/button> in LIV Golf’s Chapter 11 case served a subpoena on the PGA Tour on Friday seeking 18 categories of documents by Dec. 4, Front Office Sports reported. They include its records from the LIV antitrust suit, player discipline, the DOJ review and the June 6, 2023 <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">framework agreement<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Announced as a plan for a new for-profit company backed by the Public Investment Fund, it drew Senate subcommittee hearings that July and a Justice Department antitrust review.<\/span><\/button> with Saudi Arabia’s wealth fund. A Tour spokesperson called it “a desperate fishing expedition.” Objections go to Judge Michael Kaplan, and the next hearing is Nov. 24."], "why": "Bankruptcy discovery could surface the 2023 deal records the antitrust case never made public, giving creditors leverage the players never had.", "c": {"L": 0, "LL": 0, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "Front Office Sports", "u": "https://frontofficesports.com/article/pga-tour-liv-bankruptcy-subpoena-desperate-fishing-expedition/", "t": null}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-21/s12.webp?h=d0d27001", "col": "#43342c", "cap": "", "credit": "Niagara, CC BY-SA 3.0 / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": ""}], "week": [], "cover": "img/2026-11-21/s1.webp?h=6539b178"}, {"date": "2026-11-20", "no": 176, "min": 8.8, "stand": "Anthropic opens 34 percent up and closes 17 percent up; three powers put leaders’ immunity in writing; TPG and Corpay take BILL private; and Paul Hastings matches Cravath on its own calendar.", "note": "Editor’s note. 13 items at 2,117 read-words, inside the ten-minute cap. Disclosure: Anthropic, whose model compiles this paper, is the subject of the lead story; the trade figures are StockTitan’s compilation, the founder and stake figures are TechCrunch’s, and outlets differ on the market value because some count fully diluted shares, so this paper prints the figure on shares outstanding. CNBC’s premarket report was seen as a headline only. The Shenzhen item rests on the White House text as reported by Fox News and The Independent; no left-of-center roster outlet was reached on the declaration, and European leaders’
