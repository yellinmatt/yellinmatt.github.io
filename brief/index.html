tz", "u": "https://qz.com/california-film-tv-tax-credit-1-billion-newsom-110226", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-03/s14.webp?h=f3e76f09", "col": "#1d2e42", "cap": "", "credit": "Thomas Wolf, www.foto-tw.de, CC BY-SA 3.0 / Wikimedia Commons", "pull": null}], "week": [], "cover": "img/2026-11-03/s1.webp?h=67bc2409"}, {"date": "2026-11-02", "no": 158, "min": 9.9, "stand": "Iran names a two-day price for Hormuz, a judge ends the Alaska suit, and Weil’s lawyers leave before the vote.", "note": "Editor’s note. 14 items at 2,372 read-words, under the ten-minute cap. Disclosures: Anthropic, whose model compiles this paper, appears in the Japan item and leads the SemiAnalysis benchmark, which has no independent check; Alphabet and Amazon are Anthropic investors. Correction: Sunday’s paper put Clayface at $10.2 million for the weekend, from Saturday estimates; AP’s Sunday figure was $10.4 million, with You Can See Everything still first at $10.6 million. Not run: the CD&amp;R and GTCR approach for Global Payments at about $40 billion, no new development, unsigned, and DoorDash’s $17 billion Instacart deal, both outside the window; Intesa’s bid for Monte dei Paschi, the largest live contest, no new beat; Saudi strikes on Yemen’s Ras Issa port, Houthi-sourced with no roster outlet; The Information’s report that the White House withheld its AI testing framework, single paywalled source; Israel’s coalition count, no fresh beat before Herzog’s consultations; Suno’s subpoena fight with the Mechanical Licensing Collective, due today but dated Oct. 30; Treasury’s borrowing figure, published after this edition. No South Florida item cleared the window. Watch: the 3 p.m. borrowing estimate; Apple tonight; the midterms Tuesday; Israel’s results and refunding statement Wednesday; the Bank of England Thursday; the LIV hearing Nov. 5; payrolls Friday. Sourcing limits: Bloomberg, Reuters, Axios and The Information were not opened and their reports are relayed; The New York Times, Washington Post and CNBC links on the Alaska story were seen but not opened; no right-tier outlet carried a verified in-window report on any World item; Matt Levine and Axios Pro Rata returned nothing current; the Weil report rests on a secondary account.", "items": [{"id": "s1", "sec": "The Front", "sid": "s-front", "h": "Iran offers to reopen Hormuz in two days as Netanyahu presses Trump to strike and oil slides toward $100", "s": "Iran said Monday it could reopen the Strait of Hormuz within two days if the United States accepts its demands, putting on the record a faster timetable a day after President Trump told an Iowa rally the country may yet get “the hammer.” Foreign Ministry spokesman Esmaeil Baqaei called the shorter clock “another indication of Iran’s good-faith approach,”", "paras": ["Iran said Monday it could reopen the Strait of Hormuz within two days if the United States accepts its demands, putting on the record a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">faster timetable<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The September version, passed to Washington through Qatar, ran seven days, with the strait reopening only on the sixth.<\/span><\/button> a day after President Trump told an Iowa rally the country may yet get “the hammer.” Foreign Ministry spokesman Esmaeil Baqaei called the shorter clock “another indication of Iran’s good-faith approach,” Agence France-Presse reported, and said everything depends on Washington. “Only then can we discuss the subsequent stages,” he said.", "The core demands, per AFP, are an end to the war on all fronts, the release of frozen assets, relief on oil sanctions and an end to the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">U.S. naval blockade<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Central Command says it has redirected 144 vessels, up from 138 two weeks earlier.<\/span><\/button>. Foreign Minister Abbas Araghchi told Al Jazeera that Washington must also accept a new Iran-Oman transit route, lift <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">recent sanctions<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Washington has issued them since August under a campaign it calls “economic asphyxiation.”<\/span><\/button> and cut troop numbers in the region. Axios reported, via Anadolu, that Prime Minister Netanyahu pushed in a Saturday call for strikes right after Tuesday’s midterms and that Trump preferred to let diplomacy run. An Israeli source called the call “tough,” a U.S. source “direct.” Trump called it “a very good talk.”", "Oil fell. Brent lost more than 3% in early trading to about $110 a barrel and West Texas Intermediate dropped to $100.90, The National reported; Euronews later put Brent near $108.50 and WTI below $100. The strait stayed dangerous. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">UKMTO<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The Royal Navy’s shipping desk has logged 145 incidents since Feb. 28, with October the peak at about 30 attacks.<\/span><\/button> said a vessel was struck by an unknown projectile on Sunday. No formal U.S. answer to the two-day version had surfaced by this morning, and Trump said Saturday he still had to “take care” of targets including <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Pickaxe mountain<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>AFP describes a suspected nuclear site in central Iran. Tehran denies it is one.<\/span><\/button>."], "why": "Both clocks now run past Tuesday. Washington holds an unanswered two-day offer and an ally urging strikes, and every dollar off crude feeds the December rate-hike odds that bond desks are pricing.", "c": {"L": 0, "LL": 0, "C": 5, "LR": 0, "R": 0}, "src": [{"n": "AFP via The Manila Times", "u": "https://www.manilatimes.net/2026/11/02/world/iran-says-ready-to-reopen-hormuz-in-two-days-if-us-agrees-to-demands/2459258", "t": null}, {"n": "Euronews", "u": "https://www.euronews.com/2026/11/02/oil-slides-on-hormuz-deal-hopes-but-trump-keeps-iran-strikes-on-the-table", "t": "C"}, {"n": "The National", "u": "https://www.thenationalnews.com/business/2026/11/02/oil-prices-slide-more-than-3-as-trump-signals-more-time-for-iran-diplomacy/", "t": "C"}, {"n": "Anadolu via Express Tribune", "u": "https://tribune.com.pk/story/2638218/trump-favors-diplomacy-with-iran-as-netanyahu-urges-strikes-immediately-after-tuesdays-us-midterms", "t": "C"}, {"n": "Asharq Al-Awsat", "u": "https://english.aawsat.com/world/5336233-iran-warns-new-war-could-last-longer-after-trump-threatens-strikes", "t": "C"}, {"n": "CBS News (background)", "u": "https://www.cbsnews.com/live-updates/iran-war-us-trump-diplomacy-threat-resume-attacks/", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-02/s1.webp?h=ba88bc9e", "col": "#495464", "cap": "A U.S. Coast Guard cutter in the Strait of Hormuz, December 2020.", "credit": "MC2 Indra Beaufort, Public domain / Wikimedia Commons", "pull": {"text": "“At some point, we’re going to have to give them the hammer.”", "attr": "President Trump, Iowa rally, Nov. 1"}}, {"id": "s2", "sec": "The Front", "sid": "s-front", "h": "A judge throws out the Justice Department’s bid to freeze Alaska’s Senate count, and the department appeals the same day", "s": "U.S. District Judge Sharon Gleason dismissed the Justice Department’s Alaska Senate suit on Sunday, two days before the vote, holding that the government lacked Article III standing because a court could not deliver its remedy.", "paras": ["U.S. District Judge Sharon Gleason dismissed the Justice Department’s Alaska Senate suit on Sunday, two days before the vote, holding that the government lacked Article III standing because a court <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">could not deliver its remedy<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Alaska ballots carry no voter names and are commingled once cast, so a challenged ballot cannot be pulled out afterward. That is why redressability, not the merits, decided it.<\/span><\/button>. The department noticed an appeal to the Ninth Circuit the same day, Bloomberg Law reported.", "It sued Oct. 22 to block certification of any result affected by confusion between Sen. Dan S. Sullivan, the Republican incumbent, and a no-party candidate named Daniel J. Sullivan Jr., in a race against Democrat Mary Peltola, with ballots segregated pending investigation. Trump said he ordered the suit. Gleason’s 20-page order said “this Court lacks the authority to order that certain ballots cast by Alaskans be segregated,” and that the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Purcell principle<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>From a 2006 Supreme Court order: federal judges should hesitate to change election rules as voting nears, because late changes confuse voters and officials.<\/span><\/button> “strongly cautions” against relief. She did not reach the merits. The dismissal is <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">without prejudice<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Nearly hollow here: she denied leave to amend and directed final judgment, so the only live route is the appeal.<\/span><\/button>."], "why": "A suit the president says he ordered failed on remedy, not merit, which leaves the theory untested. Any Ninth Circuit emergency motion would have to land within hours of the polls.", "c": {"L": 1, "LL": 1, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Order, United States v. Alaska, No. 3:26-cv-00376", "u": "https://storage.courtlistener.com/recap/gov.uscourts.akd.80263/gov.uscourts.akd.80263.79.0_1.pdf", "t": null}, {"n": "New York Times", "u": "https://www.nytimes.com/2026/11/01/us/alaska-senate-election-lawsuit.html", "t": "L"}, {"n": "Washington Post", "u": "https://www.washingtonpost.com/politics/2026/11/01/judge-tosses-dojs-attempt-delay-alaska-senate-results-if-republican-loses/", "t": "LL"}, {"n": "Bloomberg Law", "u": "https://news.bloomberglaw.com/us-law-week/doj-appeals-judges-decision-to-toss-alaska-us-senate-lawsuit", "t": "C"}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/11/01/alaska-senate-doj-lawsuit-dismissed-sullivan-peltola.html", "t": "C"}, {"n": "Alaska Public Media", "u": "https://alaskapublic.org/news/politics/elections/2026-11-01/judge-tosses-doj-lawsuit-that-sought-to-block-election-results-if-republican-sen-dan-sullivan-loses", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-02/s2.webp?h=45853063", "col": "#434343", "cap": "", "credit": "James Brooks, CC BY 2.0 / Wikimedia Commons", "pull": null}, {"id": "s3", "sec": "AI", "sid": "s-ai", "h": "OpenAI plans a post-midterm push built on AI “speed limits” and a new name for data centers", "s": "OpenAI is preparing a publicity campaign for after Tuesday’s midterms that includes AI “speed limits,” a U.S. role in global standards and renaming data centers “AI compute campuses,” Axios reported Sunday, according to TechCrunch.", "paras": ["OpenAI is preparing a publicity campaign for after Tuesday’s midterms that includes AI “speed limits,” a U.S. role in global standards and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">renaming data centers<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>It follows Trump’s September push for “Super Intelligence” in place of “artificial intelligence,” a term Gizmodo notes Sam Altman has not adopted.<\/span><\/button> “AI compute campuses,” Axios reported Sunday, according to TechCrunch. Chris Lehane, the chief global affairs officer, called the midterms “a bit of a movie trailer for what you’re going to see in 2028,” when he expects AI to be “*the* issue.”", "A spokesperson confirmed “compute campuses” as the preferred term to Business Insider, Gizmodo reported. Lehane called the fight over data centers “good and healthy,” a debate that has pushed Amazon and Microsoft to say they will stop using nondisclosure agreements with local governments. What a speed limit would bind is unclear: Techmeme’s summary called it mandatory and TechCrunch did not. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Pew<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>A separate summer survey found 16% of Americans expect AI to affect society positively.<\/span><\/button> found in September that 4% of Americans saw data centers as positive across all areas it measured."], "why": "The labs have read the polling. A voluntary speed limit proposed by the company it would bind is an opening bid for 2028, and lawyers should watch whether it becomes the floor or the ceiling of federal rules.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "TechCrunch, citing Axios", "u": "https://techcrunch.com/2026/11/01/openai-might-rebrand-its-data-centers-as-ai-compute-campuses/", "t": null}, {"n": "Gizmodo", "u": "https://gizmodo.com/openai-would-reportedly-like-you-to-use-its-pleasant-new-term-for-data-centers-2000833570", "t": "C"}, {"n": "Axios", "u": "https://www.axios.com/2026/11/01/scoop-openai-post-midterm-policy", "t": "C"}, {"n": "Business Insider", "u": "https://www.businessinsider.com/openai-ai-data-centers-rebrand-compute-campuses-midterms-2026-11", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-02/s3.webp?h=5c3a516f", "col": "#363432", "cap": "A Google data center in Council Bluffs, Iowa.", "credit": "Chad Davis, CC BY 2.0 / Wikimedia Commons", "pull": null}, {"id": "s4", "sec": "AI", "sid": "s-ai", "h": "SemiAnalysis benchmark: 20 tries at a Series B redline, none usable", "s": "SemiAnalysis on Monday published GDPx, a benchmark of frontier models on long professional tasks across 11 domains, including eight legal practice areas such as capital markets and M&amp;A. The best model scores 12% on a first-attempt pass measure.", "paras": ["SemiAnalysis on Monday published GDPx, a benchmark of frontier models on long professional tasks across 11 domains, including eight legal practice areas such as capital markets and M&amp;A. The best model scores 12% on a first-attempt pass measure. On a redline of a Series B amended and restated certificate of incorporation, the authors wrote, “no redline was usable” in 20 rollouts across four models, with a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">mean partial score<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Runs also treated a client email as overriding the signed term sheet, a hierarchy error any junior is trained out of.<\/span><\/button> of 18%. Techmeme’s summary says Anthropic’s Claude Opus 5.5 leads overall; the leaderboards could not be read. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Chakra<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The legal partner says its graders include senior partners at Wachtell and other large U.S. firms.<\/span><\/button> supplied the legal tasks."], "why": "All 20 runs missed a bypass of the protections through a subsidiary. That is the structural point a capital markets junior is paid to catch.", "c": {"L": 0, "LL": 0, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "SemiAnalysis", "u": "https://newsletter.semianalysis.com/p/gdpx-measuring-frontier-model-capabilities", "t": null}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-02/s4.webp?h=3610f00e", "col": "#454545", "cap": "", "credit": "Abbie Rowe, Public domain / Wikimedia Commons", "pull": null}, {"id": "s5", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Treasury’s refunding week opens with Wall Street split on whether Bessent trims the long end", "s": "The Treasury publishes borrowing estimates at 3 p.m. Monday and its quarterly refunding statement at 8:30 a.m.", "paras": ["The Treasury publishes borrowing estimates at 3 p.m. Monday and its quarterly refunding statement at 8:30 a.m. Wednesday, the first test of whether it will cut long-bond supply with the 30-year near 5.29%. Citi has forecast $3 billion cuts each to the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">20-year<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Revived in 2020, it often yields more than both the 10- and 30-year. Mnuchin, who revived it, later called it costly to the taxpayer.<\/span><\/button> and 30-year auctions, leaving maximums of $13 billion and $22 billion, MarketWatch reported last month. JPMorgan sees sizes flat through next August, and UBS called a guidance change “more likely than immediate action.”", "Yields sat at about 4.59% on the two-year and 4.93% on the 10-year on Monday, per Trading Economics, a curve near 34 basis points. Traders price roughly 70% to 75% odds of a hike Dec. 9. The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">guidance language<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The refunding wording has already moved from studying “increases” to studying “changes,” which desks read as the opening.<\/span><\/button> to watch is “at least the next several quarters,” in place since January 2024. Bills run about 22% of marketable debt, above the roughly 20% average Treasury’s advisers suggest."], "why": "Term supply is what every convertible and investment-grade deal prices off. A cut would be the first official concession that the long end is a problem, in a market already pricing a hike.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "MarketWatch via Yahoo Finance", "u": "https://finance.yahoo.com/economy/policy/articles/treasury-financing-plans-sparking-anxiety-194500699.html", "t": null}, {"n": "Bloomberg", "u": "https://bloomberg.com/news/articles/2026-11-01/wall-street-braces-for-biggest-treasury-sales-overhaul-in-years", "t": "C"}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/11/02/us-treasury-yields-bonds.html", "t": "C"}, {"n": "Bloomberg via Yahoo Finance", "u": "https://finance.yahoo.com/economy/policy/articles/wall-street-revives-case-scrapping-153531881.html", "t": "C"}, {"n": "Bloomberg via Yahoo Finance (August)", "u": "https://finance.yahoo.com/economy/policy/articles/bessent-treasury-twist-wall-street-185219883.html", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-02/s5.webp?h=e959beed", "col": "#2b2c2b", "cap": "The Treasury building from the top of the Washington Monument.", "credit": "G. Edward Johnson, CC BY 4.0 / Wikimedia Commons", "pull": null}, {"id": "s6", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Alphabet returns to the euro market with a seven-part bond days after its selloff", "s": "Alphabet began marketing its second euro bond of 2026 on Monday, seven tranches from two to 19 years, Seoul Economic Daily reported, citing Bloomberg. The two-year was offered at 60 basis points over the benchmark and the 19-year at 205 to 210.", "paras": ["Alphabet began marketing its second euro bond of 2026 on Monday, seven tranches from two to 19 years, Seoul Economic Daily reported, citing Bloomberg. The two-year was offered at 60 basis points over the benchmark and the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">19-year<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Long euro paper from a U.S. issuer tests whether European insurers and pensions will fund AI capital spending at tenors U.S. buyers now charge more for.<\/span><\/button> at 205 to 210. Size and bookrunners were not disclosed. The sale follows a six-tranche euro deal in May and last week’s 12.6% fall in the stock after a quarter of negative free cash flow. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Long-term debt<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The end-2025 figure was $46.5 billion, so the balance has nearly tripled in nine months.<\/span><\/button> stood at $125.1 billion at Sept. 30."], "why": "The AI bond calendar did not stop for the selloff. Spreads on the long tranche will show the price of duration for a triple-digit-billion borrower.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Seoul Economic Daily", "u": "https://en.sedaily.com/international/2026/11/02/alphabet-launches-second-euro-bond-sale-of-the-year", "t": null}, {"n": "Bloomberg", "u": "https://www.bloomberg.com/news/articles/2026-11-02/alphabet-kicks-off-sale-of-its-second-euro-bond-this-year", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-02/s6.webp?h=4e7b5e1c", "col": "#2f2b2c", "cap": "", "credit": "Grendelkhan, CC BY-SA 3.0 / Wikimedia Commons", "pull": null}, {"id": "s7", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Anthropic earmarks up to $3.5 billion of its IPO for Japanese investors", "s": "Anthropic will sell up to 552.9 billion yen ($3.5 billion) of shares in Japan as part of its U.S. listing, a filing showed Monday, Reuters reported. Mizuho Securities will manage the Japanese portion, and Mizuho and Mitsubishi UFJ are among the underwriters, Seoul Economic Daily reported, citing Bloomberg.", "paras": ["Anthropic will sell up to 552.9 billion yen ($3.5 billion) of shares in Japan as part of its U.S. listing, a filing showed Monday, Reuters reported. Mizuho Securities will manage the Japanese portion, and Mizuho and Mitsubishi UFJ are among the underwriters, Seoul Economic Daily reported, citing Bloomberg. Investors in Australia, Canada and parts of Europe are also expected to take part. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Renaissance Capital<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Its implied timetable has a roadshow from the week of Nov. 9 and pricing the week of Nov. 16. Seoul Economic says only “next month.”<\/span><\/button> estimates the Nasdaq offering at $75 billion or more, with <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">22 joint bookrunners<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Goldman Sachs, Morgan Stanley and J.P. Morgan lead a syndicate sized for what could top SpaceX’s June offering as the largest IPO ever.<\/span><\/button>."], "why": "A named yen allotment spreads a record book beyond U.S. institutions as the AI selloff keeps other large issuers off the calendar this week.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Reuters via TradingView", "u": "https://www.tradingview.com/news/reuters.com,2026:newsml_L6N46J088:0-anthropic-plans-to-sell-3-5-billion-of-shares-to-japan-investors-in-ipo-filing-shows/", "t": "C"}, {"n": "Seoul Economic Daily", "u": "https://en.sedaily.com/international/2026/11/02/alphabet-launches-second-euro-bond-sale-of-the-year", "t": "C"}, {"n": "Renaissance Capital", "u": "https://www.renaissancecapital.com/IPO-Center/News/122417/ai-model-developer-anthropic-pbc-files-for-an-estimated-75-billion-ipo", "t": "C"}, {"n": "Renaissance week ahead", "u": "https://www.renaissancecapital.com/IPO-Center/News/122503/us-ipo-week-ahead-november%E2%80%99s-ipo-market-set-for-a-quiet-start", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}, {"id": "s8", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Affle buys Perion for $420 million in cash with a 40-day go-shop", "s": "India’s Affle agreed Sunday to buy Israel’s Perion Network for $11.70 a share in cash, a 34.5% premium to the Oct. 30 close and about $420 million of equity, Calcalist reported. Perion may solicit rival bids until Dec. 11.", "paras": ["India’s Affle agreed Sunday to buy Israel’s Perion Network for $11.70 a share in cash, a 34.5% premium to the Oct. 30 close and about $420 million of equity, Calcalist reported. Perion may solicit rival bids until Dec. 11. The deal needs a shareholder vote and Hart-Scott-Rodino clearance and should close in early 2027. Canaccord Genuity and Meitar advised <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Perion<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Founded in 1999 as IncrediMail. Microsoft’s 2024 change to its Bing terms cut revenue from nearly $900 million to about $400 million this year.<\/span><\/button>; LUMA Partners and Barnea Jaffa Lande advised Affle. Perion holds $228.3 million of cash and investments, <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">more than half the price<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Debt was not checked, so the net cost to Affle may differ.<\/span><\/button>."], "why": "It is the largest signed deal that could be dated inside the window, which says how quiet the tape was. A go-shop on a small cash deal echoes Thrive and ADT last week.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Calcalist", "u": "https://www.calcalistech.com/ctechnews/article/k5166udnc", "t": null}, {"n": "Globes", "u": "https://en.globes.co.il/en/article-affle-acquires-perion-network-for-420m-1001561492", "t": "C"}, {"n": "Reuters brief", "u": "https://www.tradingview.com/news/reuters.com,2026:newsml_FWN46I00E:0-affle-to-acquire-perion-at-a-deal-valuing-perion-at-implied-equity-value-of-us-420-mln/", "t": "C"}, {"n": "Pulse 2.0", "u": "https://pulse2.com/perion-to-be-acquired-by-affle-for-approximately-420-million/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-02/s8.webp?h=b17b3346", "col": "#2a4045", "cap": "", "credit": "Ynhockey, CC BY-SA 4.0 / Wikimedia Commons", "pull": null}, {"id": "s9", "sec": "Law & the Courts", "sid": "s-law", "h": "Weil’s partners have not voted and its practices are already leaving, with Nee reported near a Kirkland deal", "s": "Ramona Nee, the private equity partner once chosen to lead Weil, Gotshal &amp; Manges from 2027, is in advanced talks with Kirkland &amp; Ellis over a deal that could include more than 40 colleagues, Legal Cheek reported Monday, citing Bloomberg Law. A partner vote on the wind-down was still described as coming “in the coming days,” and no source confirmed it has happened.", "paras": ["Ramona Nee, the private equity partner once chosen to lead Weil, Gotshal &amp; Manges from 2027, is in advanced talks with Kirkland &amp; Ellis over a deal that could include more than 40 colleagues, Legal Cheek reported Monday, citing Bloomberg Law. A partner vote on the wind-down was still described as coming “in the coming days,” and no source confirmed it has happened.", "The cost falls lowest. Nearly 600 associates are reaching the market, Bloomberg Law reported, in a year when <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">large firms<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>NALP data show those firms hired 7.5% fewer graduates, so the Weil class arrives in a shrinking intake.<\/span><\/button> cut graduate hiring. About 30 London trainees have no announced placement before an expected Dec. 31 office closure. David Lat’s Sunday post-mortem centers on leadership, citing Wall Street Journal reporting of linked pay above $20 million each for Barry Wolf and Michael Aiello. Weil took $2.078 billion of revenue last year at <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">$5.593 million<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Kirkland and Wachtell pay more than $10 million, a gap that let rivals pick off Weil’s partners one book at a time.<\/span><\/button> per equity partner."], "why": "A firm in the Am Law top 30 can die of a profit gap with no debt and no bankruptcy. Stroock’s out-of-court dissolution took two years to reach a creditor settlement, so this ends well after the lawyers leave.", "c": {"L": 0, "LL": 0, "C": 5, "LR": 0, "R": 0}, "src": [{"n": "Legal Cheek, citing Bloomberg Law", "u": "https://legalcheek.com/2026/11/top-weil-lawyers-eye-lucrative-moves-as-trainees-face-uncertain-future", "t": "C"}, {"n": "Bloomberg Law", "u": "https://news.bloomberglaw.com/business-and-practice/weil-collapse-floods-market-with-lawyers-looking-for-new-jobs", "t": "C"}, {"n": "Original Jurisdiction", "u": "https://davidlat.substack.com/p/weil-gotshal-collapse-dane-butswinkas-williams-connolly-judge-ana-reyes", "t": "C"}, {"n": "Above the Law", "u": "https://abovethelaw.com/2026/11/last-weil-and-testament-see-generally/", "t": "C"}, {"n": "ABA Journal", "u": "https://www.abajournal.com/news/article/rivals-race-to-rescue-weil-lawyers-as-firm-heads-towards-closure", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-02/s9.webp?h=8de49911", "col": "#3b3c3c", "cap": "767 Fifth Avenue, Weil’s New York home.", "credit": "Pablo Costa Tirado, CC BY-SA 3.0 / Wikimedia Commons", "pull": null}, {"id": "s10", "sec": "Law & the Courts", "sid": "s-law", "h": "The justices open November on a waived defense and a halfway-house habeas case, with Colorado’s preschools Tuesday", "s": "The Supreme Court’s November session opens Monday with two cases. Maxwell v.", "paras": ["The Supreme Court’s November session opens Monday with two cases. Maxwell v. Dinis asks whether a federal inmate can use habeas to contest a delayed transfer to a halfway house; the government will not defend the Fifth Circuit, so the Court <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">appointed Brian W. Barnes<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>An amicus appointment is how the Court fills the seat when the winner below abandons its judgment.<\/span><\/button> to do it. Younge v. Fulton Judicial Circuit DA’s Office asks whether an unpleaded affirmative defense can support summary judgment. On Tuesday, St. Mary Catholic Parish v. Roy tests whether Colorado’s universal preschool program may require equal enrollment of participating religious schools, with the United States <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">arguing against the state<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The 10th Circuit upheld the rule under Employment Division v. Smith, so the case is a possible vehicle for pressure on that decision.<\/span><\/button>."], "why": "Younge is the kind of waiver point a litigation associate actually meets. St. Mary is the term’s next test of how far Carson v. Makin reaches.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "SCOTUSblog on Younge", "u": "https://www.scotusblog.com/2026/10/justices-to-decide-whether-failure-to-plead-an-affirmative-defense-prevents-moving-for-summary-j/", "t": null}, {"n": "SCOTUSblog on Maxwell", "u": "https://www.scotusblog.com/2026/10/court-to-consider-federal-inmates-ability-to-use-habeas-to-accelerate-transfer-to-a-halfway-hous/", "t": "C"}, {"n": "SCOTUSblog on St. Mary", "u": "https://www.scotusblog.com/2026/10/court-to-hear-argument-in-religious-discrimination-challenge-brought-by-catholic-preschools-in-c/", "t": "C"}, {"n": "Reuters", "u": "https://www.reuters.com/legal/government/preschool-case-tests-religious-conservatives-us-supreme-court-win-streak-2026-10-31/", "t": "C"}, {"n": "Hearing list", "u": "https://www.supremecourt.gov/oral_arguments/hearinglists/HearingList-November2026.pdf", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-02/s10.webp?h=bc444872", "col": "#344252", "cap": "", "credit": "Joe Ravi, CC BY-SA 3.0 / Wikimedia Commons", "pull": null}, {"id": "s11", "sec": "The World", "sid": "s-world", "h": "The Oleshky truce ends unextended as Russia hits the grid in four regions", "s": "A six-day local ceasefire around Oleshky in Ukraine’s Kherson region expired late Sunday with no violations reported by either side, the BBC reported. A Ukrainian official told AFP that Russia refused Kyiv’s offer to extend it.", "paras": ["A six-day local ceasefire around Oleshky in Ukraine’s Kherson region expired late Sunday with no violations reported by either side, the BBC reported. A Ukrainian official told AFP that Russia refused Kyiv’s offer to extend it. Ukraine evacuated 167 more people on Sunday, including 22 children, from a town that held about 2,000 civilians when the truce began, by a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">route<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>Evacuees went through occupied territory to southern Russia, flew to Belarus, then crossed Ukraine’s northern border.<\/span><\/button> that needed Russian cooperation.", "Russian strikes overnight Saturday hit energy sites in four regions, leaving hundreds of thousands of homes without power and forcing nationwide emergency cuts, with Kyiv dark for most of the day. Russia launched 433 drones, of which 371 were destroyed or suppressed. Zelensky said Russia is “trying to take maximum advantage of the shortage of ballistic missile interceptors.”"], "why": "The longest truceConceptAFP’s description of the Oleshky pause. Moscow’s Peskov called the operation positive, including the two human rights commissioners’ coordination. of the war produced an evacuation channel and nothing else, as winter grid attacks begin and interceptor stocks run short.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "BBC via AOL", "u": "https://www.aol.com/articles/russian-strikes-cut-power-thousands-194939000.html", "t": "C"}, {"n": "Al Jazeera, AFP/AP/Reuters", "u": "https://www.aljazeera.com/news/2026/11/1/ukraine-evacuates-civilians-in-kherson-region-as-localised-ceasefire-ends", "t": "C"}, {"n": "AFP", "u": "https://www.afp.com/en/longest-truce-ukraine-war-ends-kherson", "t": "C"}, {"n": "Japan Times", "u": "https://www.japantimes.co.jp/news/2026/11/01/world/kherson-truce-ukrainian-families/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-02/s11.webp?h=530293e3", "col": "#0a0d0d", "cap": "Kyiv in a wartime blackout, November 2022.", "credit": "Estemelmo Nólemë, CC BY 2.0 / Wikimedia Commons", "pull": null}, {"id": "s12", "sec": "The World", "sid": "s-world", "h": "Gen Z protests jump to Germany and turn violent as France’s turnout slips again", "s": "Germany’s interior minister blamed “violent left-wing groups and troublemakers from migrant communities” after weekend youth marches turned violent, CNN reported Sunday. Organizers claimed 120,000 demonstrators.", "paras": ["Germany’s interior minister blamed “violent left-wing groups and troublemakers from migrant communities” after weekend youth marches turned violent, CNN reported Sunday. Organizers claimed 120,000 demonstrators. In Frankfurt, Molotov cocktails were thrown at emergency workers and a gun shop was broken into; in Berlin, 27 officers were lightly hurt and just under 60 people detained. Organizers said they had no influence on what followed the marches. France’s Interior Ministry counted 320,000, down from 410,000 and 550,000 on the two prior weekends. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">German demands<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>They include opposition to a return of mandatory military service, a defense-spending link the French marches lack.<\/span><\/button> differ from France’s cost-of-living focus."], "why": "A movement crossing borders while shrinking at home is a test for European debt and defense budgets, with France on negative watch and Germany rearming.", "c": {"L": 0, "LL": 2, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "CNN Wire via Scripps News", "u": "https://www.scrippsnews.com/world/europe/germany-blames-infiltrators-as-gen-z-protests-turn-violent", "t": "LL"}, {"n": "CNN", "u": "https://edition.cnn.com/2026/11/01/europe/germany-gen-z-protests-turn-violent-intl", "t": "LL"}, {"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/10/31/tension-and-clashes-as-hundreds-of-thousands-protest-again-in-france", "t": "C"}, {"n": "Morocco World News", "u": "https://www.moroccoworldnews.com/2026/11/344679/france-sees-third-weekend-of-protests-police-fire-tear-gas-at-crowds/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-02/s12.webp?h=48a1c3f7", "col": "#33373d", "cap": "", "credit": "Leonhard Lenz, CC0 / Wikimedia Commons", "pull": null}, {"id": "s13", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "Florida State fires Norvell with about $50 million owed, the third-largest buyout in college football", "s": "Florida State fired football coach Mike Norvell on Sunday, owing about $50 million on an eight-year, $84 million extension signed in 2024, Front Office Sports reported; ESPN put the figure at $50.3 million. Only Jimbo Fisher at Texas A&amp;M, near $77 million, and Brian Kelly at LSU, $54 million, cost more.", "paras": ["Florida State fired football coach Mike Norvell on Sunday, owing about $50 million on an eight-year, $84 million extension signed in 2024, Front Office Sports reported; ESPN put the figure at $50.3 million. Only Jimbo Fisher at Texas A&amp;M, near $77 million, and Brian Kelly at LSU, $54 million, cost more. The team is 3-5 and Norvell went 10-22 after the extension. President Richard McCullough told ESPN, “I just did not see that trajectory.” The buyout shrinks if Norvell takes another job, through <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">offset<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A mitigation clause. It turns a coach’s next contract into a credit against the old employer’s debt, so he has reason to wait.<\/span><\/button> language. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">One search firm<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Florida State let athletic director Michael Alford go Sept. 14, so the same firm is hiring both the boss and the coach.<\/span><\/button> is running the coach and athletic director searches."], "why": "Coach contracts are guaranteed-pay instruments with mitigation terms, and this one shows what a pre-revenue-sharing extension costs a public university once results turn.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Front Office Sports", "u": "https://frontofficesports.com/article/florida-states-norvell-fired-with-50m-left-on-contract/", "t": null}, {"n": "ESPN", "u": "https://www.espn.com/college-football/story/_/id/50350481/florida-state-fires-mike-norvell-amid-3-5-football-season", "t": "C"}, {"n": "Sports Illustrated", "u": "https://www.si.com/college-football/florida-state-fires-football-coach-mike-norvell", "t": "C"}, {"n": "Bleacher Report", "u": "https://bleacherreport.com/articles/25528180-mike-norvell-fired-fsu-latest-contract-buyout-info-and-top-replacements-after-clemson-loss", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-02/s13.webp?h=7d2190df", "col": "#4b5153", "cap": "Doak Campbell Stadium, Tallahassee.", "credit": "Mlsquad, CC BY-SA 4.0 / Wikimedia Commons", "pull": null}, {"id": "s14", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "Rockstar’s UK staff vote on a union in the week GTA VI ships, with the dismissal case near closings", "s": "Rockstar’s UK workers will ballot Nov. 12 to 26 on recognizing the Independent Workers of Great Britain, a vote that spans the Nov. 19 launch of Grand Theft Auto VI, IBTimes UK reported Monday. The union says a yes would cover more than 1,600 workers.", "paras": ["Rockstar’s UK workers will ballot Nov. 12 to 26 on recognizing the Independent Workers of Great Britain, a vote that spans the Nov. 19 launch of Grand Theft Auto VI, IBTimes UK reported Monday. The union says a yes would cover more than 1,600 workers. The ballot concerns <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">recognition only<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Voluntary recognition was requested June 30 and talks ran from July, so the ballot follows a failed negotiation.<\/span><\/button>, not a strike. In Glasgow, an employment tribunal hears closing submissions Nov. 17 and 18 over 34 staff dismissed in October 2025. Rockstar alleges Discord leaks; the workers say organizing. IWGB’s Alex Marshall called the ballot “just as historic as the game release.”"], "why": "The biggest launch in the medium arrives with a live UK labor case. A yes vote would make a template for AAA studios that have stayed largely unorganized.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "IBTimes UK", "u": "https://www.ibtimes.co.uk/rockstar-uk-staff-union-vote-gta-6-launch-1829466", "t": null}, {"n": "Game Developer", "u": "https://www.gamedeveloper.com/business/rockstar-workers-to-vote-on-unionization-ahead-of-grand-theft-auto-vi-release", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-02/s14.webp?h=1d5dd411", "col": "#353029", "cap": "", "credit": "Alexander Kirwin, CC BY-SA 2.0 / Wikimedia Commons", "pull": null}], "week": [], "cover": "img/2026-11-02/s1.webp?h=ba88bc9e"}, {"date": "2026-11-01", "no": 157, "min": 9.3, "stand": "Iran named its price for the strait, a Miami judge ended Trump’s case against the Journal, and the private market marked down the leading AI lab.", "note": "EDITOR’S NOTE. The Sunday Special changes the unit of analysis from the day to the week and does not relax the bar: the Front is recency-gated to the 36 hours from Friday 6 p.m. Eastern, and the departments carry items that already cleared a daily brief, plus the Israel and box-office items first covered inside the window. Front 6, sector briefs 9, week in review 7 days, framing notes 0. Conflict disclosed: Anthropic, whose model helps produce this paper, appears in the OpenAI item, the AI brief and the week in review. Not run: CD&amp;R and GTCR’s reported $40 billion approach for Global Payments broke Friday afternoon, before the window, and is unsigned; Blackstone’s double-B call on Anthropic and Crosby’s bid for Weil already ran Saturday; a reported Justice Department appeal of Judge Thompson’s election-officials order rests on one unopened headline; Russia’s strikes that left 280,000 Ukrainian homes dark had a single source; Anthropic’s reported Claude Code rule against cloning games carried no confirmed time. Sourcing limits: Al Jazeera, NPR, Reuters and the Financial Times originals were not opened; the Hormuz offer rests on The Tribune’s report of Al Jazeera, with Fox and CBS on the surrounding facts; the box office figures are Saturday estimates; the Trump damages figure is withheld because outlets disagree. Missed this week, on the record: the Global Payments approach, which the Oct. 31 edition should have caught, and the drone sinking of a Greek container ship off Bulgaria on Oct. 29.", "items": [{"id": "s1", "sec": "The Front", "sid": "s-front", "h": "Iran offers to reopen Hormuz within two days on seven conditions, as its new supreme leader orders retaliation without limits", "s": "Iran’s foreign minister, Abbas Araghchi, said on Sunday that Qatari mediators have proposed reopening the Strait of Hormuz within two days if Washington meets Tehran’s terms, with the United States acting on the first day and shipping resuming on the second, The Tribune reported, citing Al Jazeera. An earlier draft allowed five days.", "paras": ["Iran’s foreign minister, Abbas Araghchi, said on Sunday that Qatari mediators have proposed reopening the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Strait of Hormuz<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>Under Article 38 of the Law of the Sea convention, ships enjoy transit passage through international straits. Iran signed the treaty in 1982 but never ratified it, the basis of its claim to regulate the lane.<\/span><\/button> within two days if Washington meets Tehran’s terms, with the United States acting on the first day and shipping resuming on the second, The Tribune reported, citing Al Jazeera. An earlier draft allowed five days. No direct talks between the two governments are planned.", "The terms run to seven: lifting the sanctions reimposed after the Islamabad memorandum collapsed in July, a smaller American military presence, restored oil waivers, released frozen funds, recognition of a new route built with Oman, the closure of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">every other route<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Shutting the alternatives would leave the Iran-Oman lane as the only lawful passage, which reads less as a reopening than as a claim to gate the waterway and set its terms.<\/span><\/button>, and an end to the war on all fronts, Lebanon included. President Trump said Iran wants a deal and that Washington is in no hurry, and Secretary of State Marco Rubio said no decision on new strikes has been made.", "Tehran paired the offer with a threat. On Saturday <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Mojtaba Khamenei<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>Al Jazeera noted he had not appeared in public since taking office in March. The same directive ordered the armed forces to update their target database.<\/span><\/button>, who succeeded his assassinated father, ordered an “immediate, impactful, and geographically unrestricted response” to any attack, Fox News reported, and a member of parliament’s security committee said ten bills to quit the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Non-Proliferation Treaty<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Article X allows withdrawal on three months’ notice citing “extraordinary events.” Only North Korea has used it, in 2003. Iran ratified the treaty in 1970.<\/span><\/button> have been filed. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">CENTCOM<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>U.S. Central Command. Its commander, Adm. Brad Cooper, said on Saturday that “Iran’s navy is all at the bottom of the sea.”<\/span><\/button> says its blockade has turned back 144 commercial ships, and December Brent settled at $117.64 on Friday after the Revolutionary Guard seized four tankers."], "why": "Oil near $118 prices a closed strait, so the offer is a trade with two legs: a fast reopening would unwind much of the premium, and a strike after Tuesday’s midterms would add to it. The sixth condition is the tell.", "c": {"L": 2, "LL": 0, "C": 3, "LR": 0, "R": 1}, "src": [{"n": "The Tribune / ANI", "u": "https://www.tribuneindia.com/news/world/araghchi-says-iran-qatar-propose-reopening-strait-of-hormuz-within-two-days-if-us-meets-tehrans-conditions", "t": "C"}, {"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/10/31/iran-warns-of-unfettered-retaliation-if-attacked-as-mediators-try-for-peace", "t": "L"}, {"n": "Fox News", "u": "https://www.foxnews.com/live-news/us-iran-war-trump-israel-strait-hormuz-10-31-26", "t": "R"}, {"n": "CBS News", "u": "https://www.cbsnews.com/live-updates/iran-war-us-trump-diplomacy-threat-resume-attacks/", "t": "C"}, {"n": "Middle East Eye", "u": "https://www.middleeasteye.net/live-blog/live-blog-update/araghchi-says-hormuz-could-be-reopened-two-days-if-conditions-met", "t": "C"}, {"n": "Al Jazeera, NPT bills", "u": "https://www.aljazeera.com/news/2026/10/31/iran-lawmakers-call-for-withdrawal-from-npt-will-we-have-war-or-peace", "t": "L"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-01/s1.webp?h=44305514", "col": "#43494d", "cap": "The frigate USS Taylor passes a tanker after transiting the Strait of Hormuz, 1990.", "credit": "Department of Defense. American Forces Information Service. Defense Visual Infor, Public domain / Wikimedia Commons", "pull": {"text": "Reopening the Strait of Hormuz in accordance with our conditions paves the way for the resumption of negotiations.", "attr": "Abbas Araghchi, via The Tribune, November 1"}}, {"id": "s2", "sec": "The Front", "sid": "s-front", "h": "A Miami federal judge throws out Trump’s suit against the Wall Street Journal over the Epstein letter, this time with prejudice", "s": "U.S. District Judge Darrin P.", "paras": ["U.S. District Judge Darrin P. Gayles dismissed President Trump’s defamation suit against Dow Jones, News Corp, Rupert Murdoch and the reporters on Saturday, ruling that the amended complaint again failed to <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">plausibly allege<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Twombly (2007) and Iqbal (2009) require facts that make a claim plausible, not merely conceivable, which is why a state-of-mind element can be decided before any discovery.<\/span><\/button> <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">actual malice<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The New York Times v. Sullivan (1964) standard: knowledge of falsity or reckless disregard for the truth. It concerns the publisher’s view of accuracy, not ill will toward the subject.<\/span><\/button>, the Associated Press reported. The 20-page order says the suit was “grasping at straws” and tried to “manufacture” flaws in the Journal’s reporting on a birthday letter to Jeffrey Epstein bearing Trump’s name.", "Gayles threw out the first complaint in April, finding it came “nowhere close” to the standard, and let Trump replead. A spokesperson said the president “will continue to press forward,” and CBS News cited a source saying an appeal is likely. Coverage disagrees on the damages sought, so this paper prints no figure until the amended complaint is read."], "why": "Dismissal with prejudiceConceptThe case cannot be refiled in that court. The Eleventh Circuit would review a Rule 12(b)(6) dismissal de novo, giving the district court no deference. at the pleading stage is the media bar’s best result in a public-figure case, and an appeal would test Sullivan in the circuit that hears Florida’s press cases.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "AP via Spectrum News", "u": "https://spectrumlocalnews.com/tx/san-antonio/politics/2026/10/31/trump-lawsuit-wall-street-journal-epstein-letter-dismissed", "t": "C"}, {"n": "CBS News", "u": "https://www.cbsnews.com/news/trump-lawsuit-wall-street-journal-epstein-birthday-letter-dismissed/", "t": "C"}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/10/31/trump-murdoch-wsj-epstein-defamation-lawsuit-dismissed.html", "t": "C"}, {"n": "Hollywood Reporter", "u": "https://www.hollywoodreporter.com/news/politics-news/trump-lawsuit-wall-street-journal-epstein-dismissed-1236744244/", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-01/s2.webp?h=2c4f2311", "col": "#4b494a", "cap": "", "credit": "Phillip Pessar from Miami, USA, CC BY 2.0 / Wikimedia Commons", "pull": null}, {"id": "s3", "sec": "The Front", "sid": "s-front", "h": "OpenAI cuts its funding target by a third to $20 billion after a tepid response from some large investors", "s": "OpenAI has lowered the target for its new round to about $20 billion from $30 billion, at a $1.25 trillion valuation, the Financial Times reported on Friday, and the first close is likely to land below that, TechCrunch reported on Saturday. The company first pitched investors at $1.4 trillion.", "paras": ["OpenAI has lowered the target for its new round to about $20 billion from $30 billion, at a $1.25 trillion valuation, the Financial Times reported on Friday, and the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">first close<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The first tranche of commitments a round finalizes. Later investors can join on the same terms, which is how a round can be announced at a size it has not yet raised.<\/span><\/button> is likely to land below that, TechCrunch reported on Saturday. The company first pitched investors at $1.4 trillion. The Wall Street Journal reported that only $11 billion is secured and that some large investors were “tepid.”", "Investors from the United Arab Emirates, including the state-backed fund MGX, lead the round, and OpenAI would receive an <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">option to lease computing capacity<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Paying part of an equity check in data-center access makes the round partly a compute contract, which muddies any comparison of its price with an all-cash round.<\/span><\/button> in the region. Founders Fund, Coatue, Sequoia and Andreessen Horowitz also plan to invest, and a later offering for wealthy individuals would come at the same price. OpenAI is aiming for a 2027 listing and wants the round closed before Anthropic goes public, Reuters reported. Conflict disclosed: this paper is compiled with Anthropic’s model."], "why": "The markdown came the week Anthropic filed to list and the Nasdaq fell 2.9% in a day, so the private price of the leading lab is now being set by public comparables and Gulf capacity.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "TechCrunch", "u": "https://techcrunch.com/2026/10/31/openai-reportedly-lowers-funding-target-for-new-round/", "t": "C"}, {"n": "The Next Web (Reuters)", "u": "https://thenextweb.com/news/openai-funding-round-20bn-target-cut-ft", "t": "C"}, {"n": "Yahoo Finance", "u": "https://finance.yahoo.com/technology/ai/articles/openai-reportedly-lowers-funding-target-161255478.html", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-01/s3.webp?h=482bea61", "col": "#353a3f", "cap": "", "credit": "HaeB, CC BY-SA 4.0 / Wikimedia Commons", "pull": null}, {"id": "s4", "sec": "The Front", "sid": "s-front", "h": "France’s third weekend of youth-led protests draws 320,000, and a firebomb sets a Paris riot officer alight", "s": "About 320,000 people marched across France on Saturday, 70,000 of them in Paris, by the authorities’ count, against organisers’ claim of nearly 500,000, Agence France-Presse reported. Interior Minister Laurent Nuñez reported 520 arrests by 9 p.m. and called the firebombing of a riot officer an “attempted murder.”", "paras": ["About 320,000 people marched across France on Saturday, 70,000 of them in Paris, by the authorities’ count, against organisers’ claim of nearly 500,000, Agence France-Presse reported. Interior Minister Laurent Nuñez reported 520 arrests by 9 p.m. and called the firebombing of a riot officer an “attempted murder.” Official turnout has fallen from about 550,000 on Oct. 17 and 410,000 on Oct. 24.", "The movement began with high-school students protesting crumbling schools, teacher shortages and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">university admissions<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Places are allocated through Parcoursup, a national platform whose opaque ranking has been a student grievance since its 2018 launch.<\/span><\/button>, and has since drawn the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">yellow vests<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The gilets jaunes rose in November 2018 over a fuel-tax rise and forced Macron to scrap it, the template for a leaderless movement that wins concessions.<\/span><\/button> and the unions. A curfew from 11 p.m. to 6 a.m. covers République and Châtelet-Les Halles through Sunday. Marine Le Pen, who leads presidential polling, demanded the attackers be “punished with the utmost severity.”"], "why": "Fitch has moved France’s outlook to negative and the economy shrank in the third quarter, so a government six months from a presidential vote cannot spend its way to calm, and the bond spread carries the risk.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 1, "R": 0}, "src": [{"n": "AFP via Free Malaysia Today", "u": "https://www.freemalaysiatoday.com/category/highlight/2026/11/01/clashes-break-out-as-hundreds-of-thousands-protest-in-france", "t": "C"}, {"n": "The Telegraph", "u": "https://www.yahoo.com/news/world/articles/protesters-firebomb-french-police-clowns-183632768.html", "t": "LR"}, {"n": "France 24", "u": "https://www.france24.com/en/france/20261031-live-france-braces-for-halloween-protests-government-vows-tough-response", "t": "C"}, {"n": "Times of Israel", "u": "https://www.timesofisrael.com/liveblog-october-31-2026/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-01/s4.webp?h=5d221ca9", "col": "#303132", "cap": "", "credit": "Jorge Jaramillo, CC BY-SA 4.0 / Wikimedia Commons", "pull": null}, {"id": "s5", "sec": "The Front", "sid": "s-front", "h": "Israel’s Arab parties are set to back Eisenkot, leaving him one seat short of a majority before Herzog’s talks", "s": "The Joint List and Ra’am, with 19 seats between them, are expected to recommend Gadi Eisenkot for prime minister, a senior Joint List official told Walla on Sunday, the Jerusalem Post reported. Ynet’s tally puts Eisenkot at 60 recommendations to Benjamin Netanyahu’s 46, with Yisrael Beiteinu and United Torah Judaism, seven seats each, undecided.", "paras": ["The Joint List and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Ra’am<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>In 2021 it became the first Arab party to join an Israeli governing coalition, under Naftali Bennett and Yair Lapid.<\/span><\/button>, with 19 seats between them, are expected to recommend Gadi Eisenkot for prime minister, a senior Joint List official told Walla on Sunday, the Jerusalem Post reported. Ynet’s tally puts Eisenkot at 60 recommendations to Benjamin Netanyahu’s 46, with Yisrael Beiteinu and United Torah Judaism, seven seats each, undecided. A majority is 61.", "Avigdor Liberman’s seven would carry Eisenkot to 67, but Ynet warns that a government resting on both Arab parties and Liberman would be fragile, and Netanyahu has kept a unity option open. President Isaac Herzog receives the official results on Wednesday and must <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">assign the mandate<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Recommendations are advisory. The president may choose whichever member he judges most able to form a government, who then has 28 days, extendable by 14.<\/span><\/button> by Nov. 11."], "why": "Whoever forms Israel’s next government inherits the Iran war at its most delicate point, and an Eisenkot coalition would depend on Arab parties for the first time since 2021.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Jerusalem Post", "u": "https://www.jpost.com/israel-election-2026/article-913448", "t": "C"}, {"n": "Ynet", "u": "https://www.ynetnews.com/article/sk8eaw4pge", "t": "C"}, {"n": "Times of Israel", "u": "https://www.timesofisrael.com/liveblog-november-1-2026/", "t": "C"}, {"n": "The Media Line", "u": "https://themedialine.org/headlines/herzog-calls-for-creative-solutions-ahead-of-wednesday-coalition-talks/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-01/s5.webp?h=173bf843", "col": "#403b38", "cap": "", "credit": "B0 o $17.95.", "paras": ["Third-quarter revenue reached $5.6 billion and adjusted earnings $6.57 a share, and the Miami cruise line guided full-year adjusted earnings to $17.85 to $17.95."], "why": "", "c": {"L": 0, "LL": 0, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "8-K", "u": "https://www.sec.gov/Archives/edgar/data/0000884887/000088488726000042/a2026q3earningsrelease.htm", "t": null}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-01/s14.webp?h=3b0463ed", "col": "#31434a", "cap": "", "credit": "Kiran891, CC BY-SA 4.0 / Wikimedia Commons", "pull": null}, {"id": "s15", "sec": "Wall Street South", "sid": "d-sofla", "h": "The InterContinental Miami trades for $300 million", "s": "Gencom and White Bridge Capital agreed to buy the 652-key bayfront hotel from Dajia, The Real Deal reported, citing Bloomberg.", "paras": ["Gencom and White Bridge Capital agreed to buy the 652-key bayfront hotel from Dajia, The Real Deal reported, citing Bloomberg."], "why": "", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "The Real Deal", "u": "https://therealdeal.com/miami/2026/10/30/gencom-white-bridge-capital-buy-intercontinental-miami/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-01/s15.webp?h=655d7017", "col": "#444a47", "cap": "", "credit": "Averette, CC BY 3.0 / Wikimedia Commons", "pull": null}], "week": [{"day": "Mon Oct 26", "lead": "Lula won Brazil’s runoff with 51.8% as Flávio Bolsonaro sought annulment, and SpaceX closed $40 billion of GPU debt."}, {"day": "Tue Oct 27", "lead": "Anthropic filed its public S-1 for a Nasdaq listing, and EQT agreed to an all-stock merger with Range Resources."}, {"day": "Wed Oct 28", "lead": "Meta priced a $97.5 billion equity program, and Weil hired Davis Polk as restructuring adviser."}, {"day": "Thu Oct 29", "lead": "Alphabet reported negative free cash flow on $51.4 billion of capex, and the Fed held with two dissents for a hike."}, {"day": "Fri Oct 30", "lead": "Weil’s leaders recommended dissolving the firm, and Thrive agreed to take ADT private for $15.3 billion."}, {"day": "Sat Oct 31", "lead": "S&P put Meta on negative outlook as the Nasdaq fell 2.84%, and the Revolutionary Guard seized four tankers in Hormuz."}, {"day": "Sun Nov 1", "lead": "Iran offered a two-day Hormuz reopening on seven conditions, and a Miami judge ended Trump’s suit against the Journal."}], "cover": "img/2026-11-01/s1.webp?h=44305514"}, {"date": "2026-10-31", "no": 156, "min": 9.9, "stand": "The bill for AI reaches the credit markets, Hormuz burns again, and Weil’s rivals divide what is left.", "note": "Editor’s note. 13 items at 2,364 read-words, under the ten-minute cap. The Splash gathers four separate Friday reports on how AI spending is being financed; two of them concern Anthropic, whose model compiles this paper, and Amazon and Google, which also appear, are Anthropic investors. The Anthropic rating report rests on a summary of the Financial Times, which could not be opened. Not run: a judge’s misconduct inquiry into Justice Department lawyers over the East Potomac golf course; the Venice Biennale sculptures stranded by a shipping shortfall; Halloween box office (Friday figures came only from an unattributed site); the Marlins’ Alcantara option; Britain’s possible slavery apology; AutoNation’s quarter; Michal Strnad’s €30 billion offer for Delfin, which broke Thursday; a Wikimedia amicus brief in the Times’ suit against OpenAI (filing date unverified); Apple passing Nvidia in market value (no masthead could be opened). Watch: Tehran’s answer to the Qatari draft this weekend; Weil’s partner vote; Election Day Tuesday; the LIV hearings Nov. 5 and Nov. 19; GFL bids Nov. 9; the election-officials hearing Nov. 13; the Character.AI auction Nov. 23; the Fed Dec. 9. Sourcing limits: every desk exhausted its search budget; The New York Times, BBC, The Guardian, NPR and National Review were not reached directly; Bloomberg, the FT and Law360 were paywalled, so several items rest on syndicated or trade copies; the hotel sale and the Character.AI hearing each rest on one masthead; BASF’s rejection was first reported shortly before the window opened and runs on Friday’s updates.", "items": [{"id": "s1", "sec": "The Front", "sid": "s-front", "h": "S&P puts Meta on negative outlook as the cost of AI reaches the credit markets and the Nasdaq falls 2.8%", "s": "S&amp;P Global Ratings revised its outlook on Meta Platforms to negative from stable on Friday, citing “significant uncertainty around its capital spending and free operating cash flow,” Reuters reported.", "paras": ["S&amp;P Global Ratings revised its <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">outlook<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>An outlook is not a downgrade. It signals the likely direction of a rating over six months to two years, and S&amp;P tied this one to Meta’s planned $97.5 billion stock sale.<\/span><\/button> on Meta Platforms to negative from stable on Friday, citing “significant uncertainty around its capital spending and free operating cash flow,” Reuters reported. The agency forecasts free operating cash flow deficits of $39 billion this year and $71 billion in 2027, and said leverage could pass the 1.0 times limit for Meta’s current rating as early as 2027. Meta guides 2026 capital spending at $135 billion to $145 billion.", "The same day, Bloomberg reported that Amazon had set up a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">secured supplier facility<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Lenders take collateral rights over assets the filing does not name. Amazon’s earlier AI borrowing came through unsecured bonds backed only by its general credit.<\/span><\/button> of up to $80 billion, available from early 2027 to the third quarter of 2028, to borrow against AI hardware it buys. Nvidia is weighing a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">residual value guarantee<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A promise that an asset will hold a floor value, or that the guarantor steps in. If Nscale defaults during construction, Nvidia would take over the site and find a buyer or tenant.<\/span><\/button> on billions of dollars of debt for <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Nscale<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The British neocloud had about 25,000 chips running in August against a plan of nearly 500,000, and is seeking an IPO valuation of up to $35 billion.<\/span><\/button>’s West Virginia data center, whose first building Anthropic contracted for $44.6 billion, TechCrunch reported. And <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Blackstone<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Its funds put $9 billion into $18 billion of junior debt backed by Anthropic’s lease payments on Google-chip capacity, at a target yield above 10%.<\/span><\/button> told clients Anthropic may list with a rating “in the BB range or above,” below investment grade, the Financial Times reported.", "Stocks fell. The Nasdaq Composite dropped 2.84% to 25,442.31 and the S&amp;P 500 lost 1.83%, TheStreet reported, leaving the Nasdaq down 5.2% for October, its worst month since March 2025, according to Yahoo Finance. Intel fell about 29%, its worst day since 1974, on a weak forecast. “Strong AI demand is no longer enough on its own,” said analyst Daniela Hathorn."], "why": "The AI buildout is moving from cash to credit, where rating agencies, collateral and vendor guarantees set the price, and the first test of whether an AI lab is investment grade arrives with Anthropic’s IPO.", "c": {"L": 0, "LL": 0, "C": 6, "LR": 0, "R": 0}, "src": [{"n": "Reuters on S&P and Meta", "u": "https://lufkindailynews.com/news_reuters/business/s-p-global-revises-outlook-on-meta-to-negative-on-cashflow-concerns/article_81ccd3ca-2071-5cd3-9d9a-189180643aef.html", "t": "C"}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/10/30/meta-outlook-to-revised-to-negative-by-sp-after-cash-flow-negative.html", "t": "C"}, {"n": "Investing.com via Yahoo", "u": "https://uk.finance.yahoo.com/news/amazon-sets-80-billion-supplier-172413622.html", "t": "C"}, {"n": "TechCrunch", "u": "https://techcrunch.com/2026/10/30/nvidia-weighs-playing-the-cosigner-for-nscales-ai-data-center-in-west-virginia/", "t": "C"}, {"n": "Oninvest, citing the FT", "u": "https://en.oninvest.com/article/ft-anthropic-may-receive-a-junk-credit-rating-after-its-ipo", "t": "C"}, {"n": "TheStreet", "u": "https://thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-oct-30-2026", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-10-31/s1.webp?h=3ba0b022", "col": "#404952", "cap": "The entrance to Meta’s headquarters in Menlo Park, California.", "credit": "LPS.1, CC0 / Wikimedia Commons", "pull": {"text": "“We are less certain that it will curtail its spending as previously anticipated.”", "attr": "S&P Global Ratings, on Meta, via Reuters, Oct. 30"}}, {"id": "s2", "sec": "The Front", "sid": "s-front", "h": "Iran says four tankers struck mines in Hormuz as Qatar carries a revised draft to Tehran and Brent settles at $117.64", "s": "Iran’s Revolutionary Guard said Friday that a supertanker carrying more than 2 million barrels of oil struck a naval mine and caught fire in the Strait of Hormuz, the fourth tanker explosion of the day; the AP could not verify the claims. Oman evacuated 25 crew from the burning Panama-flagged tanker RITI off Musandam, and UKMTO logged a projectile strike on another vessel.", "paras": ["Iran’s Revolutionary Guard said Friday that a supertanker carrying more than 2 million barrels of oil struck a naval mine and caught fire in the Strait of Hormuz, the fourth tanker explosion of the day; the AP could not verify the claims. Oman evacuated 25 crew from the burning Panama-flagged tanker RITI off Musandam, and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">UKMTO<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The Royal Navy’s maritime security reporting cell counts 145 incidents in the region since the war began, and just over 30 in October, the most of any month but March.<\/span><\/button> logged a projectile strike on another vessel. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Expiring December Brent<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The contract rolled off Friday. The January contract settled at $113.43, which explains the roughly $4 gap between front-month quotes.<\/span><\/button> settled at $117.64, up 2.4%, and rose 13.6% in October, Reuters reported.", "<button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Qatari mediators<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>A Reuters source said the trip was coordinated with Washington. A CBS source said the mediators saw “indications of progress.”<\/span><\/button> returned to Tehran with edits to a draft agreement and expect an answer by the weekend, CBS reported, while a senior Iranian official told Reuters they brought “unacceptable” ideas. President Trump said the war is “going to get wrapped up soon.” The Pentagon’s count of American dead stands at 23."], "why": "Oil’s 13.6% October gain runs straight into rates, inflation and every Gulf-exposed credit, and the weekend’s answer from Tehran decides whether it keeps climbing.", "c": {"L": 1, "LL": 0, "C": 3, "LR": 0, "R": 1}, "src": [{"n": "AP", "u": "https://www.whec.com/ap-top-news/iran-says-4-tankers-strike-mines-and-catch-fire-in-strait-of-hormuz-and-other-mideast-news/", "t": "C"}, {"n": "CBS News", "u": "https://www.cbsnews.com/live-updates/iran-war-us-trump-diplomacy-threat-resume-attacks/", "t": "C"}, {"n": "Reuters", "u": "https://lufkindailynews.com/news_reuters/business/oil-set-for-fourth-monthly-gain-as-hormuz-tanker-attack-highlights-supply-risks/article_713179c5-05da-573a-8327-a64d5d78eeaf.html", "t": "C"}, {"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/10/30/oman-rescues-25-from-burning-oil-tanker-in-strait-of-hormuz", "t": "L"}, {"n": "Fox News", "u": "https://www.foxnews.com/live-news/us-iran-war-oil-prices-strait-hormuz-10-30-26", "t": "R"}], "framing": "", "min": 1, "front": true, "img": "img/2026-10-31/s2.webp?h=44305514", "col": "#43494d", "cap": "", "credit": "Department of Defense. American Forces Information Service. Defense Visual Infor, Public domain / Wikimedia Commons", "pull": null}, {"id": "s3", "sec": "AI", "sid": "s-ai", "h": "A judge clears the Character.AI auction with Disney as the $20 million stalking horse and urges a privacy ombudsman", "s": "Judge Brendan Shannon of the U.S. Bankruptcy Court in Delaware approved bidding procedures Friday for Character Technologies, maker of Character.AI, with Disney as stalking horse at about $20 million for a non-exclusive technology license and the hiring of staff, not the platform or user data, Law360 reported.", "paras": ["Judge Brendan Shannon of the U.S. Bankruptcy Court in Delaware approved bidding procedures Friday for Character Technologies, maker of Character.AI, with Disney as <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">stalking horse<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The first bidder sets the price floor in exchange for protections. Here that is a $700,000 break-up fee if Disney is outbid.<\/span><\/button> at about $20 million for a non-exclusive technology license and the hiring of staff, not the platform or user data, Law360 reported. Rival bids must clear $21.7 million. Shannon overruled objections from more than 30 states and D.C. and said he would “strongly encourage” the company to appoint a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">consumer privacy ombudsman<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Bankruptcy Code section 332 provides one when a sale would transfer personal data in a way that conflicts with the debtor’s own privacy policy.<\/span><\/button>. Bids are due Nov. 20, with an auction Nov. 23."], "why": "Who owns intimate chatbot conversations is now a bankruptcy question, and Disney has structured its bid to take the engineers and the license while leaving the user data behind.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "Law360", "u": "https://www.law360.com/bankruptcy-authority/articles/2544743", "t": null}, {"n": "PPC Land", "u": "https://ppc.land/character-ai-rewrites-disney-sale-notice-after-39-states-and-dc-object/", "t": "C"}, {"n": "Pennsylvania attorney general", "u": "https://www.attorneygeneral.gov/taking-action/ag-sunday-takes-action-to-ensure-sensitive-consumer-information-is-protected-in-character-ai-bankruptcy-potential-sale/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}, {"id": "s4", "sec": "Markets & Deals", "sid": "s-mkt", "h": "SoftBank-backed OPay pulls its $304 million NYSE listing after pricing, citing a foreign regulator’s inquiry", "s": "OPay, the Nigerian payments company backed by SoftBank, withdrew its New York IPO on Friday after pricing 16 million American depositary shares at $19, the bottom of its range, raising $304 million at a valuation of about $4 billion, Reuters reported. OPay and its underwriters, led by Citi, Deutsche Bank and Standard Bank, “mutually agreed to postpone the underwriting agreement,” citing an inquiry in an unnamed foreign jurisdiction.", "paras": ["OPay, the Nigerian payments company backed by SoftBank, withdrew its New York IPO on Friday after pricing 16 million <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">American depositary shares<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Each represents 10 ordinary shares. A secondary listing on the Nigerian Exchange had also been planned.<\/span><\/button> at $19, <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">the bottom of its range<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The range was $19 to $21, and the underwriters held an over-allotment option on 2.4 million more shares.<\/span><\/button>, raising $304 million at a valuation of about $4 billion, Reuters reported. OPay and its underwriters, led by Citi, Deutsche Bank and Standard Bank, “mutually agreed to postpone the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">underwriting agreement<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Signed Oct. 29. Until closing, its conditions and termination clauses can still unwind a deal that has already priced.<\/span><\/button>,” citing an inquiry in an unnamed foreign jurisdiction.", "The shares never traded. At 2 p.m. they were indicated to open at $16.25 to $16.75, below the offer price, and at 3:30 p.m. the exchange halted the stock “with news pending,” Nairametrics reported. OPay said the probe “should not be misconstrued as a reflection on the Company’s business performance.” Closing had been set for Nov. 2, alongside a private placement of up to $200 million from Stanbic Africa."], "why": "A deal pulled between pricing and closing is rare, and it shows what the underwriting agreement’s conditions are for: the banks kept the right to walk until the money moved.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Reuters", "u": "https://www.centraloregondaily.com/news/consumer/softbank-backed-opay-withdraws-304-million-us-ipo-after-regulatory-inquiry/article_db6fed20-c83a-548f-8374-661df23048b6.html", "t": "C"}, {"n": "Bloomberg", "u": "https://www.bloomberg.com/news/articles/2026-10-30/softbank-backed-opay-prices-at-4-billion-value-for-new-york-ipo", "t": "C"}, {"n": "Nairametrics", "u": "https://nairametrics.com/2026/10/30/opay-post-ipo-trading-halted-after-raising-304-million/", "t": "C"}, {"n": "TechPoint Africa", "u": "https://techpoint.africa/news/opay-nyse-ipo/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-31/s4.webp?h=5ee7ef63", "col": "#2c2a27", "cap": "The New York Stock Exchange on Broad Street, where OPay’s shares were halted before they traded.", "credit": "Billie Grace Ward, CC0 / Wikimedia Commons", "pull": null}, {"id": "s5", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Two Fed presidents call for more rate increases as Treasuries finish October with a rally anyway", "s": "St. Louis Fed President Alberto Musalem told the Shadow Open Market Committee on Friday that “additional firming of monetary policy will be necessary, and soon,” and Dallas Fed President Lorie Logan said the Fed needs at least two more quarter-point increases.", "paras": ["St. Louis Fed President Alberto Musalem told the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Shadow Open Market Committee<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>A private group of economists, founded in 1973, that critiques Federal Reserve policy from outside the Fed.<\/span><\/button> on Friday that “additional firming of monetary policy will be necessary, and soon,” and Dallas Fed President Lorie Logan said the Fed needs at least <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">two more quarter-point increases<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>One increase at the Dec. 9 meeting would lift the target range to 4.00% to 4.25%. CME futures put December odds near 80% on Thursday.<\/span><\/button>. The 10-year Treasury yield ended near 4.93% and
