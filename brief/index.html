he BBC, The New York Times, the Guardian, NPR, CNN, Fox News and National Review were not reached directly inside the window, so every Front item is single-tier or single-source and none carries a framing note; the SpaceX item rests on Bloomberg’s paywalled opening and its October reporting; the Kalshi item rests on Law360 summaries. Missed this week, on the record: partner exits and merger talk at Cahill Gordon, reported Nov. 11, and a weight-forensics finding that export-banned Blackwell chips trained Kimi K3 and DeepSeek V4, reported Nov. 13.", "items": [{"id": "s1", "sec": "The Front", "sid": "s-front", "h": "Petition backed by Musk asks Nvidia’s board to bring back Jensen Huang", "s": "A petition calling on Nvidia’s board to reinstate Jensen Huang had more than 115,000 signatures by Saturday afternoon, TechCrunch reported. Colette Kress took over on an interim basis, and every signature is self-reported.", "paras": ["A petition calling on Nvidia’s board to reinstate Jensen Huang had more than 115,000 signatures by Saturday afternoon, TechCrunch reported, two days after the co-founder, who had run the company since 1993, resigned on Thursday as chief executive and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Colette Kress<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>Finance chief since 2013, after senior roles at Cisco and Microsoft. Nvidia kept her in the CFO job while she serves as interim chief executive.<\/span><\/button> took over on an interim basis. Elon Musk, Replit’s Amjad Masad and Epic Games’ Tim Sweeney were among the named signers.", "The site says signers are “concerned that Jensen was removed without meaningful due process” and asks the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">board<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Nvidia has a single class of common stock, so Huang’s stake of roughly 3.5% carried no extra votes. Founders at Meta and Alphabet hold high-vote shares that would have made the same exit their own call.<\/span><\/button> to bring him back while an <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">independent investigation<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A committee of independent directors with outside counsel oversees it. When it opened on Nov. 8 the board said it had “confidence in Jensen and his leadership team.”<\/span><\/button> establishes the facts. Its own breakdown counts 5,965 current employees, 1,108 former employees and 63,063 shareholders, about 70,000 of the total, and every signature is self-reported. The inquiry followed reports that Huang was the target of a foreign intelligence effort through a relationship with a chip executive whom U.S. intelligence identified as a suspected Chinese spy. The shares fell 2% on Friday.", "Governments that depend on the chips moved to steady supply. South Korea’s science ministry said Nvidia had reaffirmed its plan to deliver <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">260,000 advanced GPUs<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Pledged at the APEC summit in Gyeongju in October 2025, for Samsung, SK, Hyundai, Naver and state computing clusters.<\/span><\/button> after an emergency meeting of its AI strategy council, and Taiwan’s economy minister, Kung Ming-shin, said plans for an overseas headquarters in Taipei remain on track, TechCrunch reported. Singapore said its inquiry into <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Megaspeed<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Earlier reporting tied the reseller to restricted processors reaching China. A Reuters review cited by TechCrunch counts more than $3 billion of Chinese AI projects built on such chips.<\/span><\/button>, a local server reseller, and six people continues with limited help from Washington. Nvidia is due to report quarterly results this week."], "why": "A petition binds no director, but its signers include partners and holders the board answers to, and it lands days before earnings. Removing a founder without a high-vote class was the easy part; keeping him out is now the board’s harder call.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "TechCrunch", "u": "https://techcrunch.com/2026/11/14/elon-musk-other-tech-execs-sign-petition-calling-on-nvidia-to-reinstate-jensen-huang/", "t": "C"}, {"n": "TechCrunch (Asia reaction)", "u": "https://techcrunch.com/2026/11/14/asian-governments-react-to-nvidia-ceo-jensen-huangs-exit/", "t": "C"}, {"n": "Nvidia board statement (first-party)", "u": "https://investor.nvidia.com/news/press-release-details/2026/Statement-from-NVIDIA-Board-of-Directors/", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-15/s1.webp?h=3d883bca", "col": "#303d17", "cap": "Nvidia headquarters, Santa Clara, 2018.", "credit": "Coolcaesar, CC BY-SA 4.0 / Wikimedia Commons", "pull": {"text": "Jensen deserves due process, not mob justice.", "attr": "The Stand with Jensen petition, via TechCrunch, November 14"}, "kp": [], "bg": "", "nx": "", "chart": {"type": "bar", "t": "Petition signers by group, self-reported", "rows": [["Shareholders", 63063, "63,063"], ["Current employees", 5965, "5,965"], ["Former employees", 1108, "1,108"]]}}, {"id": "s2", "sec": "The Front", "sid": "s-front", "h": "SpaceX and Tesla merger talks are progressing, Bloomberg reports", "s": "Talks to combine SpaceX and Tesla have been progressing, Bloomberg News reported on Saturday, and a merger would give SpaceX a way into the S&amp;P 500. No terms have been reported.", "paras": ["Talks to combine SpaceX and Tesla have been progressing, Bloomberg News reported on Saturday, and a merger would give SpaceX a way into the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">S&amp;P 500<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>S&amp;P’s rules ask a new listing to trade for 12 months and show positive earnings before it is eligible. SpaceX listed in June.<\/span><\/button>, which denied it a quick place months ago, because Tesla is one of the index’s largest members. Bloomberg cited synergies and the cost of robots, orbital data centers and Mars. No terms have been reported.", "Musk said on Oct. 20 that both companies had formed <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">special committees<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Tesla moved its incorporation from Delaware to Texas in 2024, so Delaware’s MFW roadmap for controller deals does not bind it. A challenge would run through Texas courts.<\/span><\/button>, that he is recused, and that Tesla would need “50% of all shareholders, rather than simply a majority of those voting.” SpaceX was then worth about $2 trillion and Tesla nearly $1.5 trillion. Bloomberg reported in October that the aim is a deal in the first half of 2027 that closes while President Trump is in office. Musk controls more than 80% of SpaceX’s votes and owns about 20% of Tesla."], "why": "At about $3.5 trillion it would be the largest combination on record: a controller on both sides, a recused chief executive and an index rule as a motive.", "c": {"L": 1, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Bloomberg via Bloomberg Law", "u": "https://news.bloomberglaw.com/mergers-and-acquisitions/spacexs-s-p-500-bid-gets-new-life-as-musk-pitches-tesla-merger", "t": "C"}, {"n": "Bloomberg (Oct. 20)", "u": "https://news.bloomberglaw.com/ip-law/musk-says-spacex-tesla-have-formed-committees-to-explore-merger", "t": "C"}, {"n": "investingLive, citing Bloomberg (Oct. 22)", "u": "https://investinglive.com/stocks/musk-races-to-seal-3-7-trillion-spacex-tesla-merger-before-trump-exits-bloomberg-says/", "t": "C"}, {"n": "Al Jazeera (Oct. 21)", "u": "https://aljazeera.com/economy/2026/10/21/elon-musk-says-spacex-and-tesla-exploring-largest-merger-in", "t": "L"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-15/s2.webp?h=edb335a4", "col": "#263b47", "cap": "", "credit": "Alexander Hatley from Spring, Texas, USA, CC BY 2.0 / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": "", "chart": {"type": "bar", "t": "Approximate market value in October", "rows": [["SpaceX", 2, "about $2 trillion"], ["Tesla", 1.5, "nearly $1.5 trillion"]]}}, {"id": "s3", "sec": "The Front", "sid": "s-front", "h": "Zelenskyy calls a US-floated security framework for Europe “dangerous”", "s": "Volodymyr Zelenskyy said a new European security framework raised by the United States in peace talks was “dangerous,” the Associated Press reported. Kyiv will not cede territory or accept neutrality.", "paras": ["Volodymyr Zelenskyy said on Friday that a new <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">European security framework<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Moscow has sought a new continental treaty since its December 2021 drafts, which asked NATO to pull forces back to 1997 lines. Kyiv reads any new framework through that demand.<\/span><\/button> raised by the United States in peace talks was “dangerous” and “should not be the main agenda,” warning that Moscow could use it to weaken NATO and redraw borders, the Associated Press reported. He said U.S. negotiators had asked whether Ukraine would leave the parts of Donbas that Russia does not hold if it were admitted to NATO. Kyiv will not cede territory or accept <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">neutrality<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A February 2019 amendment wrote Ukraine’s course toward NATO and the EU into its constitution, so neutral status would mean reversing it in the Rada.<\/span><\/button>.", "The Moscow round reportedly produced a deal to exchange more than 1,000 prisoners of war each way, and Zelenskyy put the figure at 1,200 to 1,300. He said Russia’s delegates had no mandate on an <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">energy ceasefire<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A 30-day halt on strikes against power infrastructure was agreed in March 2025 after a Trump-Putin call, and each side accused the other of breaking it.<\/span><\/button>. A Russian strike on Zaporizhzhia on Friday injured 22 people, three of them children."], "why": "Washington is widening the agenda to Europe’s security order while Kyiv wants a narrow ceasefire first. Which frame governs the next Abu Dhabi round decides whether land is traded for a NATO promise.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "AP via PBS NewsHour", "u": "https://www.pbs.org/newshour/world/zelenskyy-says-a-new-european-security-framework-floated-by-u-s-could-benefit-putin", "t": "C"}, {"n": "AP via PBS (Nov. 13)", "u": "https://www.pbs.org/newshour/world/europe-to-send-a-diplomat-team-to-ukraine-talks-as-leaders-push-for-a-voice", "t": "C"}, {"n": "dpa via Daily Sabah (Nov. 7)", "u": "https://www.dailysabah.com/world/europe/zelenskyy-cautions-against-trumps-proposed-european-security-deal", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-15/s3.webp?h=c78a00f9", "col": "#303d1b", "cap": "", "credit": "Roman Naumov, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "1,200 to 1,300", "l": "Zelenskyy’s figure for prisoners each way"}}, {"id": "s4", "sec": "The Front", "sid": "s-front", "h": "The CFTC sues Arkansas to stop its case against Kalshi", "s": "The Commodity Futures Trading Commission asked a federal court in Arkansas to block the state’s enforcement action against Kalshi, Law360 reported. A Louisiana state judge has separately ordered Kalshi, Polymarket, Coinbase and others to “temporarily cease operations in the state.”", "paras": ["The Commodity Futures Trading Commission asked a federal court in Arkansas late Friday to block the state’s enforcement action against Kalshi, arguing that regulating prediction markets is “exclusively” a federal job, Law360 reported. A Louisiana state judge has separately ordered Kalshi, Polymarket, Coinbase and several other platforms to “temporarily cease operations in the state” in the attorney general’s suit over sports-event contracts sold without a gambling license.", "The commission has now sued about ten states, Utah among them. The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">circuits are split<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The Sixth Circuit read Dodd-Frank’s swap definition to reach only events with an inherent financial consequence, the narrow reading the states want the justices to adopt.<\/span><\/button> 2 to 1 against Kalshi, with the Third Circuit for it and the Sixth and Ninth against, and New Jersey’s petition, No. 26-299, is pending, with Kalshi’s response due Dec. 7, Steve Vladeck wrote. Kalshi is a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">designated contract market<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>It listed its sports contracts by self-certification, so they went live without prior CFTC approval, although the agency’s Rule 40.11 bars listing contracts that involve gaming.<\/span><\/button>."], "why": "Sports were more than 90% of Kalshi’s 2025 trades. A federal regulator suing states to protect a sportsbook-like product makes a Supreme Court grant likely, and every league and media betting deal waits on it.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "Law360 (CFTC v. Arkansas)", "u": "https://www.law360.com/articles/2549807", "t": "C"}, {"n": "Law360 (Louisiana order)", "u": "https://www.law360.com/articles/2549568", "t": null}, {"n": "One First (Nov. 9, background)", "u": "https://www.stevevladeck.com/p/262-sports-bets-swaps-and-the-kalshi", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "more than 90%", "l": "Sports share of Kalshi’s 2025 trades"}}, {"id": "s5", "sec": "The Front", "sid": "s-front", "h": "Rubio tells the Federalist Society that Americans are “struggling”", "s": "Secretary of State Marco Rubio defended the war with Iran at the Federalist Society’s convention while conceding it had pushed up gasoline and other costs, the AP reported. He attacked the “weaponization of international law.”", "paras": ["Secretary of State Marco Rubio, giving the keynote at the Federalist Society’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">National Lawyers Convention<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Held each November in Washington, it is where administration lawyers and federal judges preview arguments to the conservative bar that staffs the government.<\/span><\/button> on Friday evening, defended the war with Iran as necessary to stop an Iranian bomb while conceding it had pushed up gasoline and other costs: “I think we have to recognize that people are struggling. There’s no doubt about it,” the AP reported.", "He attacked the United Nations, the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">International Criminal Court<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Executive Order 14203, signed in February 2025, authorizes sanctions on its officials, and the State Department has since designated judges and prosecutors under it.<\/span><\/button> and other “global elite” bodies, and defended the strikes on alleged drug boats, the January capture of Nicolás Maduro and the immigration crackdown. The Times of Israel reported him saying further strikes on Iran were unnecessary because of the economic pain already inflicted."], "why": "Rubio pitched the war and the break with international courts as a legal program to the bar that staffs it, and he conceded the cost at home after Democrats took Congress.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "AP via PBS NewsHour", "u": "https://www.pbs.org/newshour/politics/watch-rubio-delivers-keynote-address-at-federalist-society-national-lawyers-convention", "t": "C"}, {"n": "Times of Israel", "u": "https://www.timesofisrael.com/liveblog-november-14-2026/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-15/s5.webp?h=4dc18a97", "col": "#2c3f03", "cap": "", "credit": "U.S. Department of State, Public domain / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": ""}, {"id": "s6", "sec": "The Front", "sid": "s-front", "h": "Washington blames a contractor’s cable upgrade, not AI, for the ground stop", "s": "Transportation Secretary Sean Duffy said “routine maintenance” by L3Harris at a remote site overloaded a critical communications system, TechCrunch reported. Administrator Bryan Bedford said there was “zero evidence of anything AI-related.”", "paras": ["Transportation Secretary Sean Duffy said on Saturday that “routine maintenance” grounded U.S. flights on Friday: <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">L3Harris<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Its predecessor Harris won the FAA Telecommunications Infrastructure contract in 2002, the network linking towers, radar sites and en-route centers.<\/span><\/button> was replacing copper wire with fiber at a remote site at 3 p.m., and a router then overloaded a critical communications system, TechCrunch reported. The FAA’s acting technology chief, Rebecca Guy, said two sources were pinging the network “a thousand connections over every four to five seconds” until both were disabled.", "Administrator Bryan Bedford said there was “zero evidence of anything nefarious and zero evidence of anything AI-related.” Cirium counted more than 8,200 cancellations on Friday evening and at least 3,000 on Saturday, in the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">third nationwide ground stop<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The previous one, in January 2023, followed a contractor’s deletion of files from the NOTAM system that issues alerts to pilots.<\/span><\/button> this century. Duffy said the timing of such work will be reevaluated and pressed Congress for equipment money."], "why": "The official account clears the new AI system and blames aging plumbing and a vendor, which moves the fight from automation to funding and contractor liability.", "c": {"L": 0, "LL": 1, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "TechCrunch", "u": "https://techcrunch.com/2026/11/14/transportation-secretary-blames-routine-equipment-upgrade-for-grounding-flights-nationwide/", "t": "C"}, {"n": "ABC News (Nov. 13)", "u": "https://abcnews.com/US/nationwide-ground-stop-ordered-airports-faa/story?id=138121848", "t": "LL"}, {"n": "AP via PBS (Nov. 13)", "u": "https://www.pbs.org/newshour/nation/watch-homeland-security-secretary-mullin-says-faa-flight-stoppage-isnt-another-9-11", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": "", "chart": {"type": "bar", "t": "Cancellations counted by Cirium", "rows": [["Friday evening", 8200, "more than 8,200"], ["Saturday", 3000, "at least 3,000"]]}}, {"id": "s7", "sec": "AI", "sid": "d-ai", "h": "Anthropic’s IPO prices this week", "s": "The amended filing offers 825 million shares at $70 to $78 on Nasdaq under ANT. Reuters reported on Nov. 13 that the book was about six times covered and that orders from China and Hong Kong were turned away, with pricing set for Nov. 18.", "paras": ["The amended filing offers 825 million shares at $70 to $78 on Nasdaq under ANT. Reuters reported on Nov. 13 that the book was about six times covered and that orders from China and Hong Kong were turned away, with pricing set for Nov. 18. Conflict disclosed."], "why": "", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Reuters via 933thedrive.com", "u": "https://www.933thedrive.com/2026/11/13/exclusive-investors-flock-to-anthropic-ipo-but-question-durability-of-ai-lead/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "$70 to $78", "l": "Offer range per share"}}, {"id": "s8", "sec": "Markets & Deals", "sid": "d-mkt", "h": "Inflation runs hot into December", "s": "October consumer prices rose 0.4%, core 0.3%, and producer prices rose 0.3%, 6.5% on the year, the most since November 2022. Treasury’s curve closed Friday at 4.88% on the two-year, 5.15% on the ten-year and 5.47% on the thirty-year after a thirty-year reopening tailed, and futures treat a December hike as settled, with only its size in doubt.", "paras": ["October consumer prices rose 0.4%, core 0.3%, and producer prices rose 0.3%, 6.5% on the year, the most since November 2022. Treasury’s curve closed Friday at 4.88% on the two-year, 5.15% on the ten-year and 5.47% on the thirty-year after a thirty-year reopening tailed, and futures treat a December hike as settled, with only its size in doubt."], "why": "", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "BLS", "u": "https://www.bls.gov/news.release/ppi.nr0.htm", "t": "C"}, {"n": "Treasury", "u": "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_yield_curve&field_tdr_date_value_month=202611", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pu "The Miami remittance company rejected as invalid Western Union’s Nov. 10 termination of their merger, which cited conditions set by California’s financial regulator."], "why": "", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Intermex (first-party)", "u": "https://investors.intermexonline.com/news-releases/news-release-details/intermex-rejects-western-unions-purported-termination-merger", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": ""}, {"id": "s15", "sec": "Wall Street South", "sid": "d-sofla", "h": "Trump’s suit against the BBC survives", "s": "A federal judge in Miami denied the BBC’s motion to dismiss the defamation claim over a Panorama edit on Nov. 10 and threw out the Florida consumer-protection count. The BBC’s answer is due Dec. 1.", "paras": ["A federal judge in Miami denied the BBC’s motion to dismiss the defamation claim over a Panorama edit on Nov. 10 and threw out the Florida consumer-protection count. The BBC’s answer is due Dec. 1."], "why": "", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "CBS News", "u": "https://www.cbsnews.com/news/trump-bbc-defamation-case-us-judge-denies-motion-to-dismiss/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": ""}, {"id": "s16", "sec": "Wall Street South", "sid": "d-sofla", "h": "Boca’s Office Depot campus gets its money", "s": "Related Group, BH Group and Pebb landed $176.5 million from Wells Fargo for 494 units on the former headquarters site, The Real Deal reported Nov. 9.", "paras": ["Related Group, BH Group and Pebb landed $176.5 million from Wells Fargo for 494 units on the former headquarters site, The Real Deal reported Nov. 9."], "why": "", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "The Real Deal", "u": "https://therealdeal.com/miami/2026/11/09/related-group-and-partners-score-177-million-for-boca-redev/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "$176.5 million", "l": "Wells Fargo financing for 494 units"}}], "week": [{"day": "Mon Nov 9", "lead": "Anthropic’s IPO terms circulated and were retracted, and Thomas Massie moved to force a vote on impeaching Pete Hegseth."}, {"day": "Tue Nov 10", "lead": "Anthropic filed its amended S-1 at $70 to $78 a share, Weil’s partners voted to dissolve, and October CPI rose 0.4%."}, {"day": "Wed Nov 11", "lead": "Anthropic’s book was reported covered several times over, and Iran’s speaker said Hormuz would never return to its prewar status."}, {"day": "Thu Nov 12", "lead": "Jensen Huang resigned as Nvidia’s chief executive, Witkoff and Kushner met Putin in Moscow, and a Cravath employee was charged with insider trading."}, {"day": "Fri Nov 13", "lead": "A nationwide ground stop held U.S. flights for more than four hours, and the SEC proposed cutting executive pay disclosure."}, {"day": "Sat Nov 14", "lead": "A petition to reinstate Huang passed 115,000 signatures, and Zelenskyy rejected a new security framework for Europe."}, {"day": "Sun Nov 15", "lead": "Nvidia’s results, Anthropic’s pricing and the GTA VI launch set up the week ahead."}], "cover": "img/2026-11-15/s2.webp?h=edb335a4"}, {"date": "2026-11-14", "no": 170, "min": 9.8, "stand": "The FAA halts every departure for four hours and looks hard at its new AI tool, the SEC proposes a new pay table, wholesale prices and the two-year yield jump together, and the Supreme Court takes Robinhood’s IPO.", "note": "Editor’s note. 13 items at 2,341 read-words, under the ten-minute cap. Disclosure: Anthropic, whose model compiles this paper, is the issuer in the third Front item. The six-times coverage figure is Reuters’s, from unnamed people on the deal; the China and Hong Kong order screen is Bloomberg’s, relayed by Business Standard and The Decoder. The ground-stop cause is the government’s account; no independent finding exists yet, and the diversion count is AVweb’s. The tanker strike rests on Iranian state media relayed by Reuters. December odds come from CME data cited by ActionForex, not from CME directly. The Weil liquidation vote is Reuters’s alone; the SAG-AFTRA remarks are Deadline’s alone. Not run, for the cap: the FTC and 13 states suing to block Covetrus’s $3.5 billion purchase of MWI Animal Health; a Louisiana order barring Kalshi, Polymarket and others from sports contracts; Reservoir’s amended suits against Suno and Anthropic, filed Wednesday; terrorist designations of three Guatemalan clans; Trump on Cuba; the Army officer held in Britain; Samsung’s reported talks for Modine; Nvidia’s close below $4 trillion and an HSBC downgrade; OpenAI folding its robotics team; questions over Cahill; a Kentucky ruling on AI facial recognition. Magnitude check: no newly signed large merger was found in the window; the largest deal event was H&amp;R’s C$6.7 billion vote, run; the largest live contest, Trian’s bid for Wendy’s, had no new development. Sourcing limits: Money Stuff and Pro Rata were not retrieved; the Harvard forum’s newest post concerns the bump-up exclusion; the Anthropic newsroom had nothing after Nov. 10; the Guardian and National Review had no item in the window. No South Florida item cleared the window. Watch: the Fed’s AI forum in San Francisco Monday; Nvidia earnings Nov. 17; Anthropic’s pricing Nov. 18; GTA VI on Nov. 19.", "items": [{"id": "s1", "sec": "The Front", "sid": "s-front", "h": "A four-hour nationwide ground stop puts the FAA’s new AI tool under review", "s": "The FAA halted departures nationwide at 3:54 p.m. on Friday and lifted the order at 8:15 p.m. Transportation Secretary Sean Duffy ruled out the new SMART system and blamed switches and routers that “actually got overloaded with data.” It was the second nationwide ground stop since 2001, ABC News reported.", "paras": ["The Federal Aviation Administration halted departures nationwide at 3:54 p.m. Eastern on Friday after radar and communications failures spread across control centers, and lifted the order at 8:15 p.m., Transportation Secretary Sean Duffy said. About 3,500 planes were airborne when it began. It was the second nationwide ground stop since Sept. 11, 2001, ABC News reported; the last came in January 2023, when the system that issues notices to pilots failed.", "The halt came three days after the FAA extended <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">SMART<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A cloud platform that merges airline schedules, weather, airport capacity and airspace data to forecast congestion before departure; controllers decide whether to take its advice.<\/span><\/button>, an AI system built to forecast congestion, to all 22 of its en route centers, where it advises controllers on routing. Homeland Security Secretary Markwayne Mullin said the department was ‘looking at’ any link and saw no sign of a cyberattack. ‘It doesn’t appear that way,’ he said, while declining to rule one out. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Air Space Intelligence<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The contractor holds an $875 million, 12-year FAA contract for the system, which was first used in the Washington, D.C., area in September.<\/span><\/button>, which built it, said the stop ‘is not based on or a result of the SMART system.’", "Duffy ruled the tool out, saying it only recommends routes and does not touch the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">radar systems<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>STARS, at approach facilities, and ERAM, at the en route centers, are the automation that tracks every flight; Duffy said SMART connects to neither.<\/span><\/button>. He blamed switches and routers that ‘actually got overloaded with data’ and asked Congress for <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">$50 billion<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The request rides on the Modern Skies Act; air traffic control already received $5 billion under the 2021 infrastructure law and $12.5 billion in the One Big Beautiful Bill.<\/span><\/button>, saying he expected flights to be ‘back up and operational’ heading into Thanksgiving. Cirium counted at least 827 diversions by early evening, AVweb reported. Sen. Maria Cantwell said the Commerce Committee would review the failure, and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Sen. Tammy Duckworth<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>Ranking Democrat on the Senate aviation subcommittee, she wrote that ‘safety of our skies is built on redundancies,’ the principle a single telecom failure puts to the test.<\/span><\/button> said she would demand answers."], "why": "Washington’s first suspect was the AI tool it had switched on three days earlier, and its defense, that a human makes every call, is the liability theory every deployer of advisory AI will lean on.", "c": {"L": 1, "LL": 1, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "ABC News", "u": "https://abcnews.com/US/nationwide-ground-stop-ordered-airports-faa/story?id=138121848", "t": "LL"}, {"n": "WMUR", "u": "https://www.wmur.com/article/faa-ground-stop-raises-questions-after-rollout-of-new-ai-air-traffic-system/74428995", "t": "C"}, {"n": "AVweb", "u": "https://avweb.com/aviation-news/faa-nationwide-ground-stop-lifts-smart-ai/", "t": "C"}, {"n": "KPRC Houston", "u": "https://www.click2houston.com/news/local/2026/11/13/faa-investigating-whether-new-ai-technology-contributed-to-nationwide-ground-stop/", "t": "C"}, {"n": "MLive via Yahoo", "u": "https://www.yahoo.com/news/us/articles/faa-rolled-ai-system-days-015602923.html", "t": "C"}, {"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/13/us-grounds-all-flights-after-communication-issue", "t": "L"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-14/s1.webp?h=68859d0b", "col": "#38392b", "cap": "Controllers at the FAA’s Washington Air Route Traffic Control Center.", "credit": "Work of the United States Federal Government under the terms of 17 U.S.C. § 105, Public domain / Wikimedia Commons", "pull": {"text": "But you will have more of these. You will have more of them unless the American people and the Congress tell us to build.", "attr": "Sean Duffy, White House briefing, Nov. 13"}, "kp": [], "bg": "", "nx": "", "fig": {"v": "3,500", "l": "Planes airborne when the stop began, per Duffy"}}, {"id": "s2", "sec": "The Front", "sid": "s-front", "h": "The SEC proposes cutting proxy pay disclosure to the CEO and finance chief", "s": "The SEC on Friday proposed the broadest rewrite of executive pay disclosure since 2006. Three new tables would replace the four primary tables, and the pay ratio would be computed from U.S. full-time employees only. Comments run 60 days after Federal Register publication.", "paras": ["The Securities and Exchange Commission on Friday proposed the broadest rewrite of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">executive pay disclosure<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Item 402 of Regulation S-K, last overhauled in 2006; Chairman Paul Atkins said it is ‘reaching nearly the end of the alphabet in its internal organizational system.’<\/span><\/button> since 2006, shrinking the named executive officers in most proxy statements from five or more to the principal executive and financial officers. Three new tables, for earned pay, granted pay and the status of equity awards, would replace the four primary tables, and the threshold for reporting perquisites would rise to $150,000 from $10,000.", "The pay ratio would be computed from U.S. full-time employees only, with the median worker re-identified every five years instead of three. Pay-versus-performance would drop <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">‘compensation actually paid,’<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The Dodd-Frank metric adopted in 2022, which marks unvested equity to market each year; the proposal swaps in the total from the new earned-compensation table.<\/span><\/button> and companies filing an S-1 would get up to 120 days after fiscal year-end to supply pay data, according to Cooley’s summary of the 542-page release. Atkins called it the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">second of three steps<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The first was a May 2026 proposal on emerging-growth-company accommodations and filer status; the agency acted as OIRA’s 90-day review window neared its close.<\/span><\/button> toward disclosure based on materiality. Comments run 60 days after Federal Register publication."], "why": "The summary compensation table sits in every proxy and S-1 a capital-markets associate touches; this rebuilds it and gives IPO issuers more time.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "SEC, Atkins statement", "u": "https://www.sec.gov/newsroom/speeches-statements/atkins-statement-proposing-release-executive-compensation-disclosure-reform-111326", "t": null}, {"n": "Reuters via Yahoo Finance", "u": "https://finance.yahoo.com/markets/stocks/articles/us-sec-proposes-scaling-back-171504632.html", "t": "C"}, {"n": "Cooley GovernanceBeat", "u": "https://governancebeat.cooley.com/the-secs-executive-pay-disclosure-reform-proposal-is-here-13-takeaways/", "t": "C"}, {"n": "VitalLaw", "u": "https://www.vitallaw.com/news/executive-compensation-sec-proposed-rules-aim-to-streamline-requirements-while-continuing-to-provide-needed-data/sld012adc292c2fc745f8977864e156ad3d24", "t": "C"}, {"n": "Bloomberg", "u": "https://www.bloomberg.com/news/articles/2026-11-13/sec-moves-to-rein-in-executive-pay-disclosures-to-investors", "t": "C"}], "framing": "", "min": 1, "front": true, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": "", "chart": {"type": "bar", "t": "Perquisites reporting threshold", "rows": [["Current", 10000, "$10,000"], ["Proposed", 150000, "$150,000"]]}}, {"id": "s3", "sec": "The Front", "sid": "s-front", "h": "Anthropic’s IPO book is said to be six times covered", "s": "Orders reached about six times the shares on offer by the end of Thursday, Reuters reported, citing people familiar with the deal. Several underwriters rejected or set aside orders from mainland China and Hong Kong, Bloomberg reported. Pricing is expected Wednesday and trading on Nov. 19.", "paras": ["Orders for Anthropic’s initial public offering reached about six times the shares on offer by the end of Thursday, up from about twice after the roadshow’s first day, Reuters reported, citing people familiar with the deal. The company aims to raise up to $64.4 billion in the listing alongside a $26 billion private placement, with pricing expected Wednesday and trading on Nov. 19. Several underwriters rejected or set aside orders from mainland China and Hong Kong, Bloomberg reported, some citing <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">export rules<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The International Traffic in Arms Regulations govern defense-related goods and data; similar screens were applied to buyers in the SpaceX offering.<\/span><\/button>.", "Speaking with JPMorgan’s Jamie Dimon at the bank’s Manhattan headquarters on Friday, chief executive Dario Amodei called compute ‘the deepest business dilemma that the company faces.’ The latest filing shows nearly <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">$901 billion in commitments<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Valuation models in the book assume 2028 revenue of $270 billion to $280 billion, Reuters reported, so the obligations are underwritten by growth that has not yet arrived.<\/span><\/button>, mostly for compute and chips, about $71 billion of it due in the year to Sept. 30, 2027. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Evercore<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Its estimate gives JPMorgan about $44 million of the pool, against the $75 million the bank earned on the SpaceX listing.<\/span><\/button> estimates the 19 banks will share about $395 million in fees. ‘We want to underpromise and overdeliver,’ Amodei said."], "why": "The largest listing on record now tests whether public investors will fund a $901 billion compute bill, and the China screen shows national security reaching into who gets an allocation.", "c": {"L": 0, "LL": 0, "C": 5, "LR": 0, "R": 0}, "src": [{"n": "Reuters", "u": "https://www.933thedrive.com/2026/11/13/exclusive-investors-flock-to-anthropic-ipo-but-question-durability-of-ai-lead/", "t": "C"}, {"n": "Yahoo Finance", "u": "https://www.aol.com/articles/anthropic-ceo-dario-amodei-aims-181234000.html", "t": "C"}, {"n": "Bloomberg via Business Standard", "u": "https://www.business-standard.com/world-news/anthropic-ceo-dario-amodei-calls-computing-power-deepest-business-dilemma-126111400181_1.html", "t": "C"}, {"n": "The Decoder", "u": "https://the-decoder.com/banks-bar-chinese-and-hong-kong-investors-from-anthropic-ipo-over-us-export-controls/", "t": "C"}, {"n": "Quartz", "u": "https://qz.com/anthropic-ipo-oversubscribed-roadshow-demand-111126", "t": "C"}], "framing": "", "min": 1, "front": true, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "$901 billion", "l": "Commitments in the latest filing, mostly compute"}}, {"id": "s4", "sec": "AI", "sid": "s-ai", "h": "Ontario’s top court keeps publishers’ copyright suit against OpenAI", "s": "The Court of Appeal for Ontario on Friday unanimously dismissed OpenAI’s challenge to its jurisdiction over a suit by Canadian news publishers. The publishers plead copyright infringement, breach of their sites’ terms of use and unjust enrichment.", "paras": ["The Court of Appeal for Ontario on Friday unanimously dismissed OpenAI’s challenge to its jurisdiction over a suit by Torstar, Postmedia, The Globe and Mail, The Canadian Press and CBC/Radio-Canada, upholding Justice Jessica Kimmel of the Superior Court. OpenAI argued the alleged copying took place beyond Canada’s reach. ‘Ontario has a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">real and substantial connection<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The test comes from Club Resorts v. Van Breda (2012), where the Supreme Court of Canada listed presumptive factors such as a contract made, or a tort committed, in the province.<\/span><\/button> to the alleged breaches,’ Justice B.W. Miller wrote. The publishers plead copyright infringement, breach of their sites’ <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">terms of use<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A contract claim does not depend on the fair-dealing defence, which answers only copyright, so it can survive even if the copying is excused.<\/span><\/button> and unjust enrichment. OpenAI owes $100,000 in costs."], "why": "Publishers can now sue an AI developer where their readers are rather than where its servers run, a route other national presses can follow.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Broadcast Dialogue", "u": "https://broadcastdialogue.com/ontario-court-rejects-openai-appeal-in-canadian-media-lawsuit/", "t": null}, {"n": "Canadian Press via BNN Bloomberg", "u": "https://www.bnnbloomberg.ca/business/artificial-intelligence/2026/11/13/court-allows-news-publishers-copyright-lawsuit-against-openai-to-go-ahead/", "t": "C"}, {"n": "CTV News", "u": "https://www.ctvnews.ca/sci-tech/article/court-allows-news-publishers-copyright-lawsuit-against-openai-to-go-ahead/", "t": "C"}, {"n": "The Canadian Press", "u": "https://www.thecanadianpressnews.ca/science/court-allows-news-publishers-copyright-lawsuit-against-openai-to-go-ahead/article_afdcee71-4320-5549-9702-4c0b595b7764.html", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-14/s4.webp?h=f3571748", "col": "#3f3729", "cap": "Osgoode Hall in Toronto, seat of the Court of Appeal for Ontario.", "credit": "Thomas1313, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "$100,000", "l": "Costs OpenAI was ordered to pay"}}, {"id": "s5", "sec": "AI", "sid": "s-ai", "h": "SAG-AFTRA’s negotiator says performers want AI fakes taken down", "s": "Duncan Crabtree-Ireland told a Web Summit audience in Lisbon that members whose likeness is misused mostly want it removed rather than litigated, Deadline reported. He backed the No FAKES Act.", "paras": ["Duncan Crabtree-Ireland, national executive director of SAG-AFTRA, told a Web Summit audience in Lisbon that ‘90-plus percent of the time’ members whose likeness is misused want it removed rather than litigated, Deadline reported. He backed the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">No FAKES Act<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A pending federal bill that would create a right in voice and likeness and give platforms a notice-and-takedown safe harbor modeled on the copyright system.<\/span><\/button>: ‘What it’s really about is getting platforms to take stuff down when your image, likeness and voice is being used without your permission.’ He said 10 to 15 percent of members want the union to refuse AI entirely, and described his own likeness being misused during the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">2023 strike<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The 118-day walkout ended with the first contract terms requiring consent and pay for digital replicas of performers.<\/span><\/button>."], "why": "Publicity rights are shifting from damages to takedowns, and the practice that grows around them will look more like notice work than trial work.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Deadline via Yahoo", "u": "https://www.yahoo.com/entertainment/celebrity/articles/sag-aftra-boss-says-ai-124220292.html", "t": null}, {"n": "Variety", "u": "https://variety.com/2026/film/news/sag-aftra-artificial-intelligence-pensions-concerns-1236746577/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "10 to 15 percent", "l": "Members who want the union to refuse AI entirely"}}, {"id": "s6", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Producer prices rise 6.5 percent on the year; the two-year yield jumps", "s": "The producer price index for final demand rose 0.3 percent in October, below the 0.4 percent economists expected, the Bureau of Labor Statistics said Friday. Futures priced a December rate increase as close to certain, according to CME data cited by ActionForex.", "paras": ["The producer price index for final demand rose <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">0.3 percent in October<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The miss is smaller than it looks: the bureau revised June through September, and September now shows a 1.4 percent monthly gain.<\/span><\/button>, below the 0.4 percent economists expected, but 6.5 percent from a year earlier, the largest 12-month gain since November 2022, the Bureau of Labor Statistics said Friday. Goods prices rose 10.2 percent over the year. Prices excluding food, energy and trade services rose 0.5 percent on the month and 4.9 percent on the year.", "Treasury’s par curve closed with the two-year note at 4.88 percent, up from 4.56 percent on Monday, the 10-year at 5.15 percent and the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">30-year at 5.47 percent<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The 20-year closed at 5.52 percent, above the 30-year, a kink the curve has carried since the Treasury revived the 20-year bond in 2020.<\/span><\/button>. Futures priced a December rate increase as close to certain, with the debate now between a quarter point and a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">half<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The odds of at least 50 basis points of tightening by January rose to 76.6 percent from 15.8 percent a week earlier, on the same CME data.<\/span><\/button>, according to CME FedWatch data cited by ActionForex. The S&amp;P 500 fell 0.4 percent to 7,561.67 and the Nasdaq 0.9 percent."], "why": "Every deal in this paper prices off that curve, and a two-year yield up a third of a point in a week reprices loans, converts and IPO multiples days before Anthropic sets its price.", "c": {"L": 0, "LL": 1, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Bureau of Labor Statistics", "u": "https://www.bls.gov/news.release/ppi.nr0.htm", "t": null}, {"n": "U.S. Treasury yield curve", "u": "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/", "t": "C"}, {"n": "AP via KRMG", "u": "https://krmg.com/2026/11/13/how-major-us-stock-indexes-fared-friday-11-13-2026/", "t": "C"}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/11/13/treasury-yields-fed-rates.html", "t": "C"}, {"n": "CNN", "u": "https://www.cnn.com/2026/11/13/economy/us-wholesale-inflation-ppi-october", "t": "LL"}, {"n": "ActionForex", "u": "https://www.actionforex.com/action-insight/market-overview/weekly-report/660879-hawkish-fed-repricing-punishes-non-yielders-gold-and-bitcoin-slide-as-dollar-surges-to-2026-high/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-14/s6.webp?h=60c144de", "col": "#263854", "cap": "The Eccles Building, the Federal Reserve’s headquarters in Washington.", "credit": "Federalreserve, Public domain / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": "", "chart": {"type": "line", "t": "Treasury par yields at Friday’s close", "rows": [["Two-year", 4.88, "4.88 percent"], ["10-year", 5.15, "5.15 percent"], ["30-year", 5.47, "5.47 percent"]]}}, {"id": "s7", "sec": "Markets & Deals", "sid": "s-mkt", "h": "H&amp;R REIT unitholders reject a C$6.7 billion breakup backed by Blackstone", "s": "Unitholders on Friday voted down a plan of arrangement led by GO Residential REIT, backed by Blackstone Real Estate and an affiliate of chief executive Tom Hofstedter. H&amp;R ended the agreement with no fee owed and restored its monthly distribution.", "paras": ["Unitholders of H&amp;R Real Estate Investment Trust on Friday voted down a plan of arrangement under which GO Residential REIT, backed by Blackstone Real Estate, Crestpoint, PSP Investments and an affiliate of chief executive Tom Hofstedter, would have broken up the trust. The deal needed two-thirds of votes cast and a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">majority of the minority<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Canada’s MI 61-101 requires a separate minority vote when an insider sits on the buying side; the chief executive’s holding company, CRAL, was excluded from that count.<\/span><\/button>. H&amp;R ended the agreement with no fee owed, restored its monthly distribution and plans a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">special payout<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The board’s plan tracks the list Mill Pond’s Daniel Farb published before the vote: terminate, restore distributions, sell the industrial portfolio and refresh the board.<\/span><\/button> of about C$2.30 a unit before year-end, asset sales and up to four new trustees."], "why": "Pension holders including BCI, CalSTRS and New York City’s funds beat an insider-backed deal, which is the minority vote working as designed.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "H&R REIT release", "u": "https://www.tradingview.com/news/prnewswire:a75b4607f9806:0-h-r-reit-announces-next-steps-to-drive-unitholder-value-following-termination-of-arrangement-agreement-with-consortium-of-purchasers/", "t": null}, {"n": "The Real Deal", "u": "https://therealdeal.com/national/2026/11/13/hr-reit-shareholders-vote-down-go-deal", "t": "C"}, {"n": "GO Residential release", "u": "https://www.newswire.ca/news-releases/go-residential-reit-announces-results-of-special-meeting-and-termination-of-arrangement-agreement-with-h-amp-r-real-estate-investment-trust-898136904.html", "t": null}, {"n": "Bloomberg", "u": "https://bloomberg.com/news/articles/2026-11-13/h-r-investors-vote-down-sale-to-blackstone-and-go-rebuking-ceo", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "C$2.30", "l": "Planned special payout a unit, before year-end"}}, {"id": "s8", "sec": "Law & the Courts", "sid": "s-law", "h": "The Supreme Court takes Robinhood’s IPO disclosure case", "s": "The Supreme Court on Friday agreed to hear Robinhood Markets v. Sodha, on whether an issuer can be liable under the Securities Act of 1933 for omitting material interim financial information. The same conference added Mullin v. RAICES, the asylum proclamation case.", "paras": ["The Supreme Court on Friday agreed to hear Robinhood Markets v. Sodha, No. 25-944, which asks whether an issuer can be liable under the Securities Act of 1933 for omitting <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">material interim financial information<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Robinhood listed on July 29, 2021, weeks before its second-quarter figures were due; the claim is that the weakening quarter was already visible inside the company.<\/span><\/button> without any showing that the omission made an <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">affirmative statement misleading<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>In Macquarie v. Moab Partners (2024) the Court held a pure omission is not actionable under Rule 10b-5(b); this case asks whether Section 11 of the 1933 Act differs.<\/span><\/button>. Investors led by Vinod and Amee Sodha say the offering documents hid a shift in revenue toward meme stocks and dogecoin. The Ninth Circuit revived the suit in August 2025 after Judge Edward Chen dismissed it.", "The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Solicitor General<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The justices called for the government’s views on June 1; its brief came Oct. 7, and the case was relisted once before Friday’s grant.<\/span><\/button> backed Robinhood. Jeffrey Wall of Gibson Dunn represents the company; Deepak Gupta and Amanda Lawrence represent the investors. Argument is likely in the spring. The same conference added Mullin v. RAICES, the administration’s appeal of rulings against its proclamation suspending asylum at the southern border, which stays in force; the Court declined to review the class certification."], "why": "Section 11 is the strict-liability exposure every issuer and underwriter drafts against, and a win for Robinhood would narrow what an S-1 must say about the quarter in progress.", "c": {"L": 0, "LL": 1, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "SCOTUSblog", "u": "https://www.scotusblog.com/2026/11/supreme-court-agrees-to-hear-case-on-trump-administrations-suspension-of-asylum/", "t": null}, {"n": "Reuters via Investing.com", "u": "https://www.investing.com/news/stock-market-news/us-supreme-court-to-consider-lawsuit-over-robinhoods-2021-ipo-5026347", "t": "C"}, {"n": "Supreme Court docket", "u": "https://www.supremecourt.gov/docket/docketfiles/html/public/25-944.html", "t": null}, {"n": "CBS News", "u": "https://www.cbsnews.com/news/supreme-court-trump-asylum-u-s-mexico-border/", "t": "C"}, {"n": "Roll Call", "u": "https://rollcall.com/2026/11/13/trumps-invasion-asylum-ban-to-face-justices/", "t": "C"}, {"n": "Washington Post", "u": "https://www.washingtonpost.com/politics/2026/11/13/supreme-court-trump-asylum/070276aa-df94-11f1-912c-4fbb80d73f7f_story.html", "t": "LL"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-14/s8.webp?h=d6ca00bb", "col": "#18395e", "cap": "The west facade of the Supreme Court in Washington.", "credit": "Joe Ravi, CC BY-SA 3.0 / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": ""}, {"id": "s9", "sec": "Law & the Courts", "sid": "s-law", "h": "Weil adopts a liquidation plan as Gibson Dunn takes its funds group", "s": "Weil’s partners voted on Friday to adopt a plan of liquidation, Reuters reported. Gibson Dunn is taking Weil’s 120-lawyer private funds practice from January, the ABA Journal reported.", "paras": ["Partners of Weil, Gotshal &amp; Manges voted on Friday to adopt a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">plan of liquidation<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Weil is paying staff for 90 days plus stay bonuses, the contrast with Dewey &amp; LeBoeuf’s 2012 bankruptcy that Jonah Perlin drew on Steve Vladeck’s One First.<\/span><\/button> and named Ben Schrag and James Mesterharm co-chief restructuring officers, Reuters reported. Gibson Dunn said the same day it is taking Weil’s 120-lawyer <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">private funds practice<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Separately Crosby, a two-year-old AI-native firm that has raised about $85 million, has bid for Weil’s name and some internal data, including templates that could tune legal models.<\/span><\/button>, including 23 partners in New York, Washington and London and co-managing partner Jonathon Soler, from January, the ABA Journal reported. Kirkland is taking about 40 Weil lawyers. ‘This is the most sought-after cross-border funds team in the market,’ said Gibson Dunn’s Shukie Grossman."], "why": "The largest firm collapse since Dewey is being sold practice by practice, and a funds group that moves whole takes its sponsor clients with it.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "ABA Journal", "u": "https://www.abajournal.com/news/article/gibson-dunn-snags-120-lawyer-group-from-weil-including-firms-co-managing-partner", "t": null}, {"n": "Reuters via AOL", "u": "https://www.aol.com/articles/weil-gotshal-manges-approves-liquidation-185151000.html", "t": "C"}, {"n": "Law360", "u": "https://www.law360.com/articles/2549214/gibson-dunn-gains-120-funds-lawyers-from-weil", "t": "C"}, {"n": "Global Legal Post", "u": "https://www.globallegalpost.com/news/gibson-dunn-brings-on-weil-co-managing-partner-soler-in-new-york-552553437", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "23 partners", "l": "In the funds group moving to Gibson Dunn"}}, {"id": "s10", "sec": "The World", "sid": "s-world", "h": "An LNG tanker strikes a mine in Hormuz, Iran says", "s": "Iran’s Revolutionary Guard navy said through state media that a liquefied natural gas tanker hit a naval mine and exploded in the Strait of Hormuz on Friday, Reuters reported. It named no vessel and gave no casualties.", "paras": ["Iran’s Revolutionary Guard navy said through state media that a liquefied natural gas tanker hit a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">naval mine<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>At least 10 ships were hit in the first 10 days of November after 37 attacks in October, a monthly record, by the Washington Institute’s count.<\/span><\/button> and exploded in the Strait of Hormuz on Friday on what it called an unauthorized route; it named no vessel and gave no casualties, Reuters reported. The U.S. military says it has cleared the strait’s routes of mines. Treasury Secretary <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Scott Bessent<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>He runs Operation Economic Outcast, the sanctions campaign begun in August alongside the naval blockade, which targets Gulf bank branches that handle Iranian transactions.<\/span><\/button> told CNBC he had moved from his home to a military base on Secret Service advice and called Iran ‘like a dangerous cornered animal.’ Brent settled at $96.21."], "why": "Gulf cargo insurance prices off claims like this one, and a Treasury secretary sleeping on a base shows how personal the sanctions war has become.", "c": {"L": 0, "LL": 1, "C": 3, "LR": 0, "R": 1}, "src": [{"n": "Reuters via Times of Israel", "u": "https://www.timesofisrael.com/liveblog_entry/us-treasurys-bessent-says-he-wont-be-cowed-by-iranian-death-threats/", "t": "C"}, {"n": "Reuters via gCaptain", "u": "https://gcaptain.com/iran-says-tanker-carrying-lng-hit-mine-suffered-explosion-in-hormuz/", "t": "C"}, {"n": "Fox News", "u": "https://www.foxnews.com/live-news/oil-prices-war-strikes-donald-trump-iran-11-13-26", "t": "R"}, {"n": "CBS News", "u": "https://www.cbsnews.com/live-updates/us-iran-war-trump-nuclear-material-no-deal/", "t": "C"}, {"n": "CNN", "u": "https://www.cnn.com/2026/11/13/middleeast/iran-targets-us-military-site-in-gulf-first-time-in-two-months-intl", "t": "LL"}], "framing": "Fox News described ‘a relative lull in kinetic warfare’; CNN’s headline said Iran struck at a U.S. site ‘as hopes for a deal fade.’", "min": 1, "front": false, "img": "img/2026-11-14/s10.webp?h=0617c083", "col": "#2b3a47", "cap": "A U.S. Navy frigate passes a tanker after transiting the Strait of Hormuz in 1990.", "credit": "Department of Defense. American Forces Information Service. Defense Visual Information Center. 1994, Public domain / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "$96.21", "l": "Brent settlement on Friday"}}, {"id": "s11", "sec": "The World", "sid": "s-world", "h": "Europe names its Ukraine negotiators, and Moscow withholds a seat", "s": "European Union leaders meeting in Dublin agreed that Britain, France, Germany, Italy and Poland will represent Europe at the next round of Ukraine talks, RTÉ reported. Kremlin spokesman Dmitry Peskov said Moscow had not agreed to include them.", "paras": ["European Union leaders meeting informally in Dublin agreed that the E5, made up of Britain, France, Germany, Italy and Poland, will represent Europe alongside EU institutions at the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">next round<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Russia’s lead negotiator, Vladimir Medinsky, has said of the Europeans: ‘We don’t really understand what their status is here.’<\/span><\/button> of Ukraine talks, expected in Abu Dhabi next week, RTÉ reported. Kremlin spokesman Dmitry Peskov said Moscow had not agreed to include them and would decide ‘once we understand their genuine intention and readiness to contribute to the peace process.’ <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Kaja Kallas<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>The former Estonian prime minister, whom Moscow put on a wanted list in 2024, said Russia does not want her because she is ‘too strong.’<\/span><\/button>, the EU’s foreign policy chief, is not on the team. Leaders take up Ukraine’s financing at a summit on Nov. 26 and 27."], "why": "A seat decides who writes the terms of sanctions relief, and frozen Russian assets in Europe are a lever Washington does not hold.", "c": {"L": 1, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "RTÉ", "u": "https://www.rte.ie/news/ireland/2026/1113/1599056-eu-leaders-dublin/", "t": null}, {"n": "Kyiv Independent", "u": "https://kyivindependent.com/european-leaders-agree-on-joint-team-for-ukraine-peace-negotiations-costa-says", "t": "C"}, {"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/13/russias-demands-come-from-different-reality-as-war-efforts-stagnates", "t": "L"}, {"n": "BBC", "u": "https://www.bbc.co.uk/news/articles/ckn80j9jv3jxo", "t": "C"}, {"n": "The Hill", "u": "https://thehill.com/policy/international/6217318-macron-europe-ukraine-support/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": ""}, {"id": "s12", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "Subscribers refile a suit to unwind the Paramount merger", "s": "A group of consumers has refiled a suit in California federal court asking a jury to unwind the merger, or force the sale of HBO Max, CNN and the Warner studio, The Hollywood Reporter and TheWrap reported Friday.", "paras": ["A group of consumers has <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">refiled a suit<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The case has been dismissed twice, and The Hollywood Reporter says this amended complaint is believed to be the plaintiffs’ last chance to plead it.<\/span><\/button> in California federal court asking a jury to unwind Skydance’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">$110 billion<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The deal closed in October only after settlements with 12 state attorneys general and the Writers Guild, leaving nearly $80 billion of net debt.<\/span><\/button> Paramount acquisition of Warner Bros. Discovery, or to force the sale of HBO Max, CNN and the Warner studio, and to keep Paramount+ and HBO Max apart, The Hollywood Reporter and TheWrap reported Friday. The complaint cites the bundle planned for early 2027 and a target of at least $6 billion in annual savings. ‘That choice between independent sellers has been eliminated,’ it says."], "why": "Private plaintiffs rarely unwind a closed merger, but a complaint that survives would put the bundle, and the savings promised to lenders, in front of a jury.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "The Hollywood Reporter via Yahoo", "u": "https://uk.finance.yahoo.com/news/hbo-max-paramount-bundle-targeted-192507213.html", "t": null}, {"n": "TheWrap", "u": "https://thewrap.com/industry-news/public-policy-legal/skydance-consumer-lawsuit-paramount-warner-bros-discovery-merger-refiled", "t": "C"}, {"n": "The Hollywood Reporter", "u": "https://www.hollywoodreporter.com/business/business-news/hbo-max-paramount-bundle-lawsuit-1236754933/", "t": "C"}, {"n": "Yahoo Entertainment", "u": "https://www.yahoo.com/entertainment/tv/articles/subscribers-sue-stop-paramount-hbo-120000597.html", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-14/s12.webp?h=6ca0d971", "col": "#3b3829", "cap": "The Melrose Avenue gate of Paramount’s Hollywood lot.", "credit": "Chris Brown, CC BY 2.0 / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "$6 billion", "l": "Annual savings target the complaint cites"}}, {"id": "s13", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "John Fisher sells the San Jose Earthquakes and PayPal Park for $625 million", "s": "Fisher agreed to sell the MLS club, including the privately financed PayPal Park, to Heath Freeman, co-founder of Alden Global Capital, ESPN reported Friday. Freeman is buying as an individual, not through Alden, the San Francisco Chronicle said.", "paras": ["Fisher, who is moving the Athletics to Las Vegas, agreed to sell Major League Soccer’s San Jose Earthquakes, including the privately financed PayPal Park, to Heath Freeman, co-founder of the hedge fund <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Alden Global Capital<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Owner of the Chicago Tribune, the Denver Post and the San Jose Mercury News, the paper that covers the club.<\/span><\/button>, at an enterprise value of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">$625 million<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Forbes values the club at $540 million, 22nd in MLS; Real Salt Lake and the Utah Royals changed hands last year for about $600 million.<\/span><\/button>, ESPN reported Friday, confirming Sportico. Freeman is buying as an individual, not through Alden, the San Francisco Chronicle said. MLS owners approved the sale unanimously, and Moelis ran a process that began in June 2025. Fisher and Lew Wolff paid a $20 million expansion fee in 2007."], "why": "A price above the Forbes figure for a mid-table club says MLS franchises now trade on stadium control, and this one comes with its building.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "ESPN", "u": "https://www.espn.com/soccer/story/_/id/50474340/san-jose-earthquakes-sold-625-million-heath-freeman", "t": null}, {"n": "Sportico", "u": "https://www.sportico.com/business/team-sales/2026/mls-san-jose-earthquakes-sold-alden-freeman-1234958433/", "t": "C"}, {"n": "San Francisco Chronicle via Yahoo", "u": "https://sports.yahoo.com/articles/john-fisher-agrees-sell-san-235314409.html", "t": "C"}, {"n": "San Francisco Standard", "u": "https://sfstandard.com/2026/11/13/john-fisher-earthquakes-heath-freeman-bay-area/", "t": "C"}, {"n": "Las Vegas Review-Journal", "u": "https://www.reviewjournal.com/sports/soccer/as-fisher-sells-mls-earthquakes-for-reported-625m-3914076/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "$20 million", "l": "Expansion fee Fisher and Lew Wolff paid in 2007"}}], "week": [], "cover": "img/2026-11-14/s1.webp?h=68859d0b"}, {"date": "2026-11-13", "no": 169, "min": 10.0, "stand": "Nvidia loses its founder to a board inquiry, a law-firm clerk is charged with trading on five client deals, the long bond tails again, and Trump says he needs no deal with Iran.", "note": "Editor’s note. 14 items at 2,396 read-words, under the ten-minute cap. Disclosure: Anthropic, whose model compiles this paper, is a defendant in the AI lead and is preparing its own listing. The Nvidia lead rests on the company’s release and ABC News; the reporting on Huang’s personal relationships is the New York Times’s, relayed by CBS and Al Jazeera, and ABC said it could not verify it. Reports differ on the date of the House interview, so none is given. The Cravath charge is the Justice Department’s; the SEC complaint was not opened, and its figures come from a trade summary. The Hancock Whitney deal rests on the companies’ filing; no independent report was found. The auction figures and Fed odds come from market newsletters; closing yields were not confirmed and are not printed. The Simpson Thacher item relays the Financial Times through Above the Law. Posner’s death was first reported Tuesday night; it runs on Thursday’s wire coverage. Not run: the Brooklyn building collapse, now eight dead (cut for the cap); Spain’s housing decree after a general strike; Zelensky’s claim of new Starshield limits, which SpaceX denies; Eisenkot’s first security briefing; the FTC’s $63 million Family Dollar settlement; Foley’s salary match and Latham’s $1 million AI prize; OpenAI’s security agents; Trump’s SEC and CFTC nominees; Dan Hicks’s death; a $10 billion Bears stadium pitch; NFL viewership; the Anthropic book, reported six times covered (no new terms). Magnitude check: the largest announced deal found was Hancock Whitney and Trustmark, about $3.2 billion, run; the largest live bid was the Global Payments take-private, which ended, run. Sourcing limits: the Guardian, BBC and AP sites were not reached directly; the Times was seen by headline; National Review was seen by headline only. Money Stuff’s Thursday issue, on the Nvidia board, was seen in preview; Pro Rata was not retrieved; the Harvard forum’s newest post concerns special equity awards; the Anthropic newsroom had nothing after Nov. 10. No South Florida item cleared the window. Watch: October producer prices at 8:30 a.m. Friday; Supreme Court orders Monday; Nvidia earnings Nov. 17; Anthropic’s pricing Nov. 18; GTA VI on Nov. 19.", "items": [{"id": "s1", "sec": "The Front", "sid": "s-front", "h": "Jensen Huang resigns as Nvidia’s chief; the finance chief takes over", "s": "Jensen Huang resigned on Thursday as president, chief executive and a director of Nvidia, effective immediately, the company said. Colette Kress, the chief financial officer, becomes interim chief executive. A former Synopsys chief executive already on the board was named the company’s first-ever chair.", "paras": ["Jensen Huang resigned on Thursday as president, chief executive and a director of Nvidia, effective immediately, the company said, ending 33 years at the head of the chipmaker he co-founded. Colette Kress, the chief financial officer, becomes interim chief executive and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">keeps the finance job<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Under Sarbanes-Oxley Section 302 the chief executive and the chief financial officer each certify the quarterly report, so on Nov. 17 one person will sign both certifications.<\/span><\/button>. Harvey C. Jones, a former Synopsys chief executive already on the board, was named the company’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">first-ever chair<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Splitting the roles hands an independent director the board agenda and the succession search, the structure proxy advisers press for after a governance failure.<\/span><\/button>.", "The exit follows an inquiry by independent directors and outside counsel into Huang’s relationship with Alice Huang, a former executive at <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Megaspeed<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Singapore filings cited by Reuters show an Alibaba subsidiary financed Speedmatrix, a Malaysian company linked to it, the thread congressional investigators are now pulling.<\/span><\/button> whom U.S. intelligence reportedly believes China’s Ministry of State Security recruited, the New York Times reported. The Times reported on Thursday a second relationship, with Kimberly Powell, Nvidia’s vice president of health care, who reported to him. The shares fell more than 13 percent at the open and closed down 4.3 percent, ABC News reported.", "Third-quarter results stay on Tuesday, Nov. 17, as previously scheduled, the company said. Republican-led House committees have summoned Huang to a closed-door interview, CNN reported, and the Senate Banking chair asked him and Commerce Secretary Howard Lutnick to testify. A <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">securities class action<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Filed in San Jose on Nov. 10, it defines the class as buyers between Oct. 9 and Nov. 8; the stock fell 5.5 percent the day it was filed.<\/span><\/button> is pending. Bernstein’s Stacy Rasgon cut his price target to $200 from $400."], "why": "The founder of the company that supplies nearly every AI build-out is gone days before earnings, and a finance chief now runs it through a congressional inquiry, a class action and a succession nobody planned.", "c": {"L": 1, "LL": 3, "C": 0, "LR": 0, "R": 1}, "src": [{"n": "Nvidia newsroom", "u": "https://nvidianews.nvidia.com/news/nvidia-announces-ceo-transition", "t": null}, {"n": "ABC News", "u": "https://abcnews.com/Business/nvidia-stock-sinks-after-ceo-jensen-huang-resigns/story?id=138076153", "t": "LL"}, {"n": "NPR", "u": "https://www.npr.org/2026/11/12/nx-s1-6037833/jensen-huang-nvidia-stepped-down", "t": "LL"}, {"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/12/why-did-nvidia-ceo-jensen-huang-resign-and-who-is-colette-kress", "t": "L"}, {"n": "Fox Business", "u": "https://www.foxbusiness.com/business-leaders/nvidia-ceo-jensen-huang-resigns-amid-investigation-relationship-alleged-chinese-spy", "t": "R"}, {"n": "CNN", "u": "https://www.cnn.com/2026/11/11/business/live-news/nvidia-jensen-huang-investigation-fallout", "t": "LL"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-13/s1.webp?h=f1a505c3", "col": "#303d17", "cap": "Nvidia’s headquarters in Santa Clara, California.", "credit": "Coolcaesar, CC BY-SA 4.0 / Wikimedia Commons", "pull": {"text": "The Board has full confidence in Colette and the leadership team.", "attr": "Harvey C. Jones, Nvidia statement, Nov. 12"}, "kp": [], "bg": "", "nx": "", "fig": {"v": "4.3 percent", "l": "Nvidia’s fall at Thursday’s close, per ABC News"}}, {"id": "s2", "sec": "The Front", "sid": "s-front", "h": "A Cravath document specialist is charged with trading on five client deals", "s": "Prosecutors in Brooklyn on Thursday charged Chetram Balli, 54, with insider trading ahead of five client deals, for profits of more than $70,000. Bloomberg Law identified the firm as Cravath. Cravath said he was not legal staff and no longer works there.", "paras": ["Prosecutors in Brooklyn on Thursday charged Chetram Balli, 54, a document processing specialist at a major international law firm since about 1989, with <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">insider trading<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Because he owed no duty to the companies he traded, the case rests on the misappropriation theory upheld in United States v. O’Hagan (1997): the fraud is on the firm and clients whose secrets he took.<\/span><\/button> ahead of five client deals between April 2025 and October 2026, for profits of more than $70,000. Bloomberg Law identified the firm as Cravath, Swaine &amp; Moore. Balli was arrested and arraigned the same day on a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">criminal complaint<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A complaint lets prosecutors arrest on a sworn affidavit before a grand jury acts; the Speedy Trial Act then requires an indictment within 30 days.<\/span><\/button> and faces up to 20 years.", "The deals were WiseTech’s purchase of E2open, Schwab’s $660 million deal for Forge Global, Paramount Skydance’s $110 billion acquisition of Warner Bros. Discovery, UHS’s $853 million bid for Talkspace and Viatris’s $1.65 billion deal for Pacira. Prosecutors say he bought about 14,866 E2open shares on May 12, 2025, a stock he had never owned, and sold two days after the May 25 announcement. His last Paramount purchase came about four hours before that merger was announced, Bloomberg Law reported. The SEC filed a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">parallel civil suit<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The SEC counts about eight trades and roughly $55,000, against the Justice Department’s five stocks and more than $70,000; neither agency explained the gap.<\/span><\/button>. Cravath said he was not legal staff and no longer works there."], "why": "Deal secrets at a top M&amp;A firm pass through staff who never sign an engagement letter, and a trade four hours before the year’s largest media merger is exactly what surveillance is built to flag.", "c": {"L": 0, "LL": 1, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "U.S. Attorney, E.D.N.Y.", "u": "https://www.justice.gov/usao-edny/pr/employee-major-international-law-firm-charged-insider-trading", "t": null}, {"n": "Bloomberg Law", "u": "https://news.bloomberglaw.com/business-and-practice/cravath-employee-arrested-in-ny-accused-of-insider-trading", "t": "C"}, {"n": "NBC New York", "u": "https://www.nbcnewyork.com/news/local/crime-and-courts/former-employee-nyc-law-firm-cravath-charged-insider-trading/6571825/", "t": "LL"}, {"n": "Investment Executive", "u": "https://www.investmentexecutive.com/news/regulation/law-firm-employee-accused-of-insider-trading/", "t": "C"}, {"n": "FX News Group", "u": "https://fxnewsgroup.com/forex-news/regulatory/sec-charges-law-firm-employee-with-insider-trading/", "t": "C"}], "framing": "", "min": 1, "front": true, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": ""}, {"id": "s3", "sec": "AI", "sid": "s-ai", "h": "Nonprofits sue five AI developers to halt frontier-model development", "s": "Public Citizen, the Heat Initiative and the Irreplaceable Education Fund sued in San Francisco Superior Court on Thursday, asking a judge to bar further development of advanced models, Reuters reported. The complaint pleads unfair competition and public nuisance. Anthropic, whose model compiles this paper, is a defendant.", "paras": ["Public Citizen, the Heat Initiative and the Irrep
