te summit on record<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The previous mark was COP25 in Madrid in 2019, which ran 44 hours over, the Independent noted.<\/span><\/button>, AFP reported. “Unfortunately, we were unable to reach agreement on a cover decision,” said Australia’s Chris Bowen, who chaired the negotiations. Oil producers blocked any reference to <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">phasing out fossil fuels<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Saudi-led resistance centered on reaffirming the 2023 Dubai pledge to transition away from them, Euronews reported. About 60 countries met separately in April on a phase-out outside the COP process.<\/span><\/button>. The rejected text kept a call to expand carbon capture, and a $120 billion finance target sought by developing countries had already been cut, along with a global electrification goal.", "The European Union, Britain, Norway and small island states rejected the text, Euronews and the Independent reported. “We will not accept negotiating backwards in time,” said Ireland’s Darragh O’Brien, speaking for the EU. Murat Kurum, the Turkish minister who presided, pointed to side agreements on geothermal power, cleaner freight corridors and raising electricity to 35 percent of global energy by 2035."], "why": "With no text, the 2023 Dubai pledge stays the last word, and the climate commitments issuers disclose against move back to national rules and voluntary side deals.", "c": {"L": 0, "LL": 0, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "AFP (via The Korea Herald)", "u": "https://www.koreaherald.com/article/10946205", "t": null}, {"n": "The Independent (via Yahoo)", "u": "https://www.yahoo.com/news/science/articles/cop31-fails-reach-climate-deal-124907599.html", "t": null}, {"n": "Euronews", "u": "https://www.euronews.com/2026/11/23/sanctions-summits-and-strikes-the-war-in-ukraine-shows-no-sign-of-slowing", "t": null}, {"n": "Asharq Al-Awsat", "u": "https://english.aawsat.com/business/5344377-climate-deal-collapses-chaotic-end-cop31", "t": null}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-23/s6.webp?h=3b692883", "col": "#45342a", "cap": "Antalya’s old harbour. The summit ran more than two days past its scheduled end.", "credit": "Maksym Kozlenko, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "kp": ["The summit closed Sunday with no cover decision, more than 49 hours late.", "Oil producers blocked any fossil-fuel phase-out reference.", "The EU, Britain, Norway and small island states rejected the final text."], "bg": "COP31 was scheduled for Nov. 9 to 20 under an arrangement that gave Turkey the presidency and Australia the chair of negotiations, the Earth Negotiations Bulletin noted. High energy prices and the war in the Middle East strained the talks, Asharq Al-Awsat reported. For the EU, Euronews called it the biggest UN climate failure since Copenhagen in 2009.", "nx": "COP33, in November 2028, concludes the second global stocktake, the Earth Negotiations Bulletin noted."}, {"id": "s7", "sec": "The World", "sid": "s-world", "h": "Zelenskyy says Ukrainian sea drones sank a Russian corvette in Benghazi", "s": "Zelenskyy said Ukrainian naval drones sank the corvette Merkury at a naval base in Benghazi, CBS News and AP reported. Libyan officials told Fox News the docked ship capsized. No Russian statement was reported.", "paras": ["Ukrainian naval drones sank the Russian corvette Merkury, which President Volodymyr Zelenskyy called one of Russia’s newest, at a naval base in <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Benghazi<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>Held by forces loyal to Gen. Khalifa Haftar, a Moscow ally whose pact with Russia lets its warships call at the port, Fox reported. Libya has been split between rival governments since 2011.<\/span><\/button> early Sunday, he said on Monday. He also claimed hits on the cargo ship Angara and a Ka-27 helicopter, CBS News and AP reported. Libyan officials told Fox News that two <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">explosive-laden drones<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Libyan military officials told AP the drones appeared to have been launched from western Libya, where Ukrainian drone specialists had operated.<\/span><\/button> hit the docked ship, which capsized, and that at least four more were intercepted. Ten Russian and Libyan nationals were treated for minor injuries. The eastern government asked the UN to investigate. No Russian statement was reported."], "why": "The strike carries Ukraine’s naval campaign out of the Black Sea and into Libya’s split, where Russia’s foothold is Haftar’s east.", "c": {"L": 1, "LL": 0, "C": 1, "LR": 0, "R": 1}, "src": [{"n": "CBS News / AP", "u": "https://www.cbsnews.com/news/ukraine-zelenskyy-2-russian-ships-libya/", "t": "C"}, {"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/23/zelenskyy-says-ukraine-behind-drone-attacks-on-russian-ships-near-libya", "t": "L"}, {"n": "Fox News", "u": "https://www.foxnews.com/world/russian-warship-sinks-libya-suspected-ukrainian-strikes-take-war-beyond-black-sea", "t": "R"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": ""}, {"id": "s8", "sec": "The World", "sid": "s-world", "h": "Trump says he is inclined to resume strikes on Iran after the new year", "s": "Trump told Fox News he is inclined to order new strikes on Iran after the new year if talks fail, calling Iran’s negotiators “professional tap dancers.” Iran’s Revolutionary Guard navy claimed two tankers hit sea mines, a claim not independently confirmed.", "paras": ["President Trump told Fox News on Sunday that he is inclined to order new strikes on Iran after the new year if talks fail, calling Iran’s negotiators “professional tap dancers.” Of a reported Iranian plan to send <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">tankers<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The Tehran municipality paper Hamshahri reported on Nov. 20 that 14 were massing at Kharg Island. An adviser to United Against Nuclear Iran told Fox that satellite images showed no significant loading.<\/span><\/button> through the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">U.S. blockade<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>It was first imposed in April. A Nov. 18 Central Command advisory, cited by Fox from Reuters, warned that ships taking Iranian cargo by ship-to-ship transfer could be seized.<\/span><\/button> of its ports, he said, “I hope they do, they’ll all be at the bottom of the sea.” Saudi Arabia, Qatar and Kuwait condemned Saturday’s Iranian attack on Bahrain, which injured two people, ABC News reported. Iran’s Revolutionary Guard navy claimed that two tankers hit sea mines in the Gulf, a claim not independently confirmed."], "why": "A dated threat puts a January marker on Gulf shipping risk, which sets tanker rates, insurance and the oil price that energy issuers must address in their offering documents.", "c": {"L": 1, "LL": 1, "C": 0, "LR": 0, "R": 2}, "src": [{"n": "Fox News", "u": "https://www.foxnews.com/politics/trump-warns-new-strikes-against-iran-after-new-year-calls-negotiators-professional-tap-dancers", "t": "R"}, {"n": "ABC News", "u": "https://abcnews.com/International/live-updates/iran-live-updates-tanker-attacked-strait-hormuz-ukmto/?id=138171071", "t": "LL"}, {"n": "The Daily Beast (via Yahoo)", "u": "https://www.yahoo.com/news/politics/articles/trump-drops-ominous-hint-plans-202414432.html", "t": "L"}, {"n": "Fox News", "u": "https://www.foxnews.com/world/trump-dares-iran-breach-us-port-blockade-tehran-reportedly-readies-14-oil-tankers", "t": "R"}], "framing": "The right (Fox) leads with the dare: “Trump dares Iran to breach US port blockade.” The left (The Daily Beast) leads with the threat, “Trump Drops Ominous Hint About His New Year’s Plans,” and calls the war “disastrous.”", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": ""}, {"id": "s9", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "Sunrise on the Reaping opens to $120 million in North America", "s": "The Hunger Games: Sunrise on the Reaping opened to an estimated $120 million in North America and $225 million worldwide, Variety reported. It earned an A-minus CinemaScore.", "paras": ["<button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Lionsgate<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The studio’s other 2026 hit, Michael, opened to $97 million, Variety noted. Spider-Man: Brand New Day leads the year with a $360 million start.<\/span><\/button>’s The Hunger Games: Sunrise on the Reaping opened to an estimated $120 million in North America and $105 million from 84 overseas markets, for $225 million worldwide, Variety reported on Sunday. That nearly triples the $44 million start of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">The Ballad of Songbirds &amp; Snakes<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The 2023 prequel went on to gross $363 million worldwide on a budget of about $100 million, Variety noted.<\/span><\/button> and is the series’ largest opening since Mockingjay Part 1 drew $121 million in 2014. The film, budgeted above $150 million before marketing, earned an A-minus CinemaScore and lifted the franchise to $3.43 billion worldwide, passing Twilight as Lionsgate’s biggest."], "why": "A prequel nearly tripling its predecessor’s opening shows the Hunger Games still draws without its original cast, which is the asset Lionsgate’s rights and talent deals are priced on.", "c": {"L": 0, "LL": 0, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "Variety", "u": "https://au.variety.com/2026/film/news/sunrise-on-the-reaping-box-office-hunger-games-opening-weekend-exceeds-expectations-42821/", "t": null}, {"n": "Screen Rant", "u": "https://screenrant.com/domestic-box-office-chart-report-hunger-games-sunrise-on-the-reaping-i-play-rocky/", "t": null}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": ["The film opened to an estimated $120 million domestic and $225 million worldwide.", "The franchise now stands at $3.43 billion, Lionsgate’s largest.", "It drew an A-minus CinemaScore."], "bg": "The film opened on 4,018 screens, the widest release in the series, and posted the second-best debut for a prequel after Rogue One’s $155.1 million, Screen Rant reported. I Play Rocky placed second for the weekend with $9.3 million, Variety reported, and Ebenezer third with $7.7 million. Comscore’s Paul Dergarabedian said there was time to play GTA VI and see the film, which opened in the game’s first weekend on sale.", "nx": "Monday’s actual grosses replace the studio’s Sunday estimates.", "chart": {"type": "bar", "t": "Domestic opening weekends, millions of dollars", "rows": [["Sunrise", 120, "$120 million"], ["Mockingjay Part 1", 121, "$121 million"], ["Songbirds and Snakes", 44, "$44 million"]]}}], "week": [], "cover": "img/2026-11-23/s1.webp?h=ad558ba7"}, {"date": "2026-11-22", "no": 178, "min": 8.9, "stand": "A machine-checked proof claimed mathematics’ most famous problem, NATO promised Poland every inch, and the war at sea reached the Gulf of Finland.", "note": "EDITOR’S NOTE. The Sunday Special changes the unit of analysis from the day to the week and does not relax the bar: the Front is recency-gated to the hours from Friday 6 p.m. Eastern, and the departments carry items that already cleared a daily brief plus the Geneva, Treasury, SCOTUS, COP31, box office and college sports items first reported inside the window. Front 6, sector briefs 10, week in review 7 days, framing notes 0. Conflict disclosed: the Splash concerns an Anthropic employee and Claude, and Anthropic’s model helps produce this paper; Anthropic also appears in the week in review. Import AI, whose author co-founded Anthropic, was not used as a source. Not run: the New York Times report that the SEC’s Nvidia inquiry is at an early stage (a confirmation, not a development); a reported Amazon deal for Decart and an FT interview on machine consciousness (paywalled, timing unverified); Wonder’s exploration of a Grubhub sale (below the line); the New York auction week tally (sources disagree); Houthi missiles at Riyadh and Israel’s coalition talks (no decisive development). Sourcing limits: every desk exhausted its search budget before the roster was complete; the New York Times, the BBC, the Guardian, NPR and National Review were not reached inside the window, so no item carries a framing note; the Kalshi item rests on trade and regional outlets; the COP31 plenary had not concluded at press time. Missed this week, on the record: Sullivan &amp; Cromwell named its next leaders, a capital markets co-head among them, on November 19, and California’s attorney general subpoenaed Nvidia on November 19.", "items": [{"id": "s1", "sec": "The Front", "sid": "s-front", "h": "Lean’s keepers certify a Claude-assisted proof of the Riemann Hypothesis", "s": "The community that maintains the Lean proof assistant said on Saturday it has “full confidence” in a machine-checked proof posted Friday by Levent Alpöge, a mathematician at Anthropic. The formal proof runs to about 17 million lines. Anthropic has posted no statement.", "paras": ["The community that maintains the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Lean<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A proof assistant whose small kernel checks every inference mechanically. A certificate vouches for the formal artifact, not for any human grasp of why the argument works.<\/span><\/button> proof assistant said on Saturday that it has “full confidence” in a machine-checked proof of the Riemann Hypothesis that Levent Alpöge, a mathematician at Anthropic, posted on Friday. Alpöge’s four-page note opens: “I believe I have, working with Claude, discovered a proof of the Riemann Hypothesis.”", "The formal proof runs to about 17 million lines of Lean and covers the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">generalized hypothesis<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Extends Riemann’s 1859 conjecture from the zeta function to Dirichlet L-functions. Many results in number theory were proved conditionally on it and would stand unconditionally.<\/span><\/button>; attempts at a human-readable version ran past 250,000 pages. The joint statement, endorsed by the Lean FRO and the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Mathlib<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The shared Lean library of formalized mathematics. Its existing definition of the conjecture was the fixed target, so the proof could not quietly prove a weaker statement.<\/span><\/button> Initiative, says the theorem matches the library’s own definition, that dozens of people reproduced the same build and that independent checkers agreed. Alpöge told Quanta he had the result on Monday and waited; he called the timing, the day after Anthropic’s Nasdaq debut, “horrible.” Anthropic has posted no statement.", "Number theorists split on what has been shown. James Maynard of Oxford told IBM Think it would be “clearly a historic milestone in mathematics” if it holds. Maksym Radziwiłł of NYU told Quanta the note contains “nonsensical statements” and that the formal proof does not explain why the result is true. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Terence Tao<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>UCLA mathematician and Fields medalist. His blog read the strategy as one that “appears to use the full power of modern developments on the Langlands program.”<\/span><\/button> wrote that the approach draws on the Langlands program. A separate 940-page human proof of the generalized hypothesis by Alessandro Masullo also surfaced Friday, with no machine check."], "why": "The most famous open problem in mathematics may have fallen to a commercial model, with a certificate no human can read in full. Verification without understanding is now a working question for every profession that signs off on work, law included.", "c": {"L": 0, "LL": 1, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Lean community statement", "u": "https://leanprover-community.github.io/blog/posts/riemann-hypothesis/", "t": "C"}, {"n": "The Guardian via AOL", "u": "https://www.aol.com/articles/anthropic-mathematician-claims-used-claude-163949000.html", "t": "LL"}, {"n": "Quanta Magazine", "u": "https://www.quantamagazine.org/updates/transformation/", "t": "C"}, {"n": "IBM Think", "u": "https://www.ibm.com/think/news/anthropic-claude-riemann-hypothesis-math-proof", "t": "C"}, {"n": "Terence Tao", "u": "https://terrytao.wordpress.com/2026/11/20/unforced-euler-singularity-unforced-navier-stokes-singularity-and-the-generalized-riemann-hypothesis/", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-22/s1.webp?h=d7c388a5", "col": "#343b2a", "cap": "The mathematics faculty at Göttingen, where Riemann worked, 2007.", "credit": "Daniel Schwen, CC BY-SA 2.5 / Wikimedia Commons", "pull": {"text": "We hereby certify that both the statement and the proof of the Riemann Hypothesis are correct.", "attr": "Lean community and Mathlib joint statement, November 21"}, "kp": ["Alpöge posted the claim on Friday, November 20, the day after Anthropic began trading on Nasdaq.", "The Lean community and Mathlib certified the statement and the proof on Saturday.", "Anthropic has issued no statement, and its newsroom carries no post on the proof."], "bg": "Bernhard Riemann stated the conjecture in 1859: every nontrivial zero of the zeta function lies on the line with real part one half. It is one of the seven Clay Millennium Prize problems, which pay $1 million only after publication in a qualifying outlet, a two-year wait and general acceptance by the field. Formal checking has grown with Mathlib, a community library that lets a proof be tested against a definition the prover did not write. Earlier AI-assisted work had placed at least 67.25% of the relevant zeros on the critical line, IBM Think reported. Simon Willison flagged both Friday notes, Alpöge’s and Masullo’s, within hours of posting.", "nx": "Anthropic’s shares trade again on Monday, November 23, the first session since the claim and its certification.", "fig": {"v": "250,000", "l": "pages a human-readable version ran past"}}, {"id": "s2", "sec": "The Front", "sid": "s-front", "h": "Kalshi faces a New York hearing Monday it says could shut it nationwide", "s": "US District Judge Lorna Schofield on Friday denied the CFTC’s second emergency request to halt New York’s suit against Kalshi. Justice Melissa Crane hears the state’s restraining-order request Monday at 11:30 a.m., The Block reported.", "paras": ["US District Judge Lorna Schofield on Friday denied the CFTC’s second emergency request to halt New York’s suit against Kalshi, finding from the bench that the agency could not show the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Commodity Exchange Act<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The federal statute behind CFTC oversight of event contracts. Whether it displaces state gambling law is the question splitting the circuits.<\/span><\/button> likely preempts state gaming law. Attorney General Letitia James has refiled for a restraining order barring Kalshi from running an unlicensed gambling business “within or from New York,” and Justice Melissa Crane hears it Monday at 11:30 a.m., The Block reported.", "Kalshi’s lawyer, Sean Murphy of Milbank, argues that because the exchange is based in New York, the order would close it for every customer and force liquidation of open positions, against the CFTC’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">August 11 order<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Chair Michael Selig used emergency authority to direct Kalshi to keep operating, saying New York “has no business regulating these interstate financial markets.”<\/span><\/button>. The state says it seeks no nationwide shutdown. Kalshi counts 1.2 million New York users. The case sits in state court because a federal judge sent it back on <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">remand<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Kalshi had moved the suit to federal court; Judge Vernon Broderick returned it, which is why a state justice rules first.<\/span><\/button>."], "why": "A home-state injunction reaches the whole order book, so New York may settle by Monday what four federal circuits have not.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "The Block", "u": "https://www.theblock.co/news/regulation/2026-11-21-kalshi-faces-monday-hearing-on-new-york-order-it-says-would-shut-down-its-exchange-nationwide-444813", "t": "C"}, {"n": "Times Union via Yahoo", "u": "https://finance.yahoo.com/markets/options/articles/restraining-order-looms-yorks-battle-120025336.html", "t": "C"}, {"n": "Gambling Insider", "u": "https://www.gamblinginsider.com/news/204997/cftc-emergency-tro-denied-new-york-kalshi", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-22/s2.webp?h=d8c07012", "col": "#40362a", "cap": "", "credit": "Photograph by Mike Peel, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "kp": ["Judge Schofield denied the CFTC’s second emergency request on Friday.", "Justice Crane hears New York’s restraining-order request on Monday at 11:30 a.m.", "Kalshi says the order would close its exchange for every customer."], "bg": "New York sued in July. On November 10 Judge Colleen McMahon wrote that the CFTC’s order “smacks of a collusive effort.” By The Block’s count the Fourth, Sixth and Ninth Circuits have sided with states and the Third with Kalshi; the Fourth Circuit ruled against Kalshi on November 18.", "nx": "The hearing is Monday, November 23, in New York County Supreme Court.", "fig": {"v": "1.2 million", "l": "New York users Kalshi counts"}}, {"id": "s3", "sec": "The Front", "sid": "s-front", "h": "Rutte promises NATO will defend “every inch” of Poland", "s": "NATO Secretary General Mark Rutte said in Warsaw on Saturday that the alliance will defend every inch of Polish territory, dpa reported. Lublin prosecutors said one object was a Russian Kh-101 cruise missile manufactured this quarter. The North Atlantic Council meets in Brussels on Monday.", "paras": ["NATO Secretary General Mark Rutte told reporters in Warsaw on Saturday, “I can guarantee that NATO will defend every inch of Polish territory,” after meeting Prime Minister Donald Tusk and President Karol Nawrocki, dpa reported. He would not rule out another breach. The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">North Atlantic Council<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>NATO’s top political body, acting by consensus of all 32 allies; Article 5 is never automatic and needs that political decision.<\/span><\/button> meets in Brussels on Monday.", "Lublin prosecutors said one object was a Russian <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Kh-101<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>An air-launched cruise missile fired from Tu-95 and Tu-160 bombers. A build date this quarter means new production, not old stock.<\/span><\/button> cruise missile, “manufactured in the fourth quarter of this year,” recovered at Nowy Lipowiec, about 60 km from Ukraine. Radar tracked 11 possible threats and three objects came down, with no casualties. A Swedish <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Gripen<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Sweden’s fighter, flying NATO air policing since Stockholm joined the alliance in 2024; its pilot needed visual confirmation before firing.<\/span><\/button> pilot cleared to shoot held fire because weather blocked visual confirmation."], "why": "A fresh missile on NATO soil and a pilot who could not fire test the alliance’s rules of engagement before Monday’s council.", "c": {"L": 1, "LL": 0, "C": 3, "LR": 0, "R": 1}, "src": [{"n": "dpa via Yahoo", "u": "https://www.yahoo.com/news/world/articles/rutte-vows-nato-defence-poland-181832820.html", "t": "C"}, {"n": "Kyiv Post", "u": "https://www.kyivpost.com/post/90841", "t": "C"}, {"n": "AP via PBS (Nov. 20)", "u": "https://www.pbs.org/newshour/world/nato-calls-russian-missiles-landing-in-poland-a-grave-violation-of-airspace", "t": "C"}, {"n": "Fox News (Nov. 20)", "u": "https://www.foxnews.com/world/putin-launches-ukraine-barrage-hours-after-trump-meeting-amid-alleged-russian-missile-breach-nato-airspace", "t": "R"}, {"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/21/russian-missiles-hit-poland-what-happened-and-could-nato-respond", "t": "L"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-22/s3.webp?h=054c13b0", "col": "#313845", "cap": "", "credit": "Romaine, CC0 / Wikimedia Commons", "pull": null, "kp": ["Prosecutors confirmed a Russian Kh-101 built in the fourth quarter of 2026.", "A Swedish pilot cleared to fire held off for want of visual confirmation.", "The North Atlantic Council meets Monday; Poland sends a deputy defense minister."], "bg": "The objects fell on November 19 and 20 during a Russian barrage on Ukraine. Tusk called it an “intentional provocation” and Rutte a “grave violation,” AP reported. Coalition of the willing drills of 2,800 troops from 11 countries end Sunday.", "nx": "The council meets in Brussels on Monday, November 23.", "fig": {"v": "11", "l": "possible threats Polish radar tracked"}}, {"id": "s4", "sec": "The Front", "sid": "s-front", "h": "Drones set a sanctioned Russian cargo ship ablaze off Finland", "s": "Drones struck the Sparta II, a Russian-flagged ship owned by Oboronlogistika, on Saturday west of Gogland island. It drifted into Finnish waters and burned overnight, Al Jazeera and ABC News reported. A Finnish Defence Forces spokesman said Ukraine is likely behind it.", "paras": ["Drones struck the Sparta II, a 121-meter Russian-flagged ship owned by <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Oboronlogistika<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The Russian Defense Ministry’s freight arm, already under US Treasury sanctions, which makes the hull a military target in Kyiv’s eyes.<\/span><\/button>, on Saturday west of Russia’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Gogland<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>Suursaari to Finns; the island was Finnish until the 1940 Moscow Peace Treaty ended the Winter War.<\/span><\/button> island, on a run from St. Petersburg to <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Kaliningrad<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>A Russian exclave between Poland and Lithuania, resupplied by sea, so this shipping lane is its lifeline.<\/span><\/button>. It drifted into Finnish waters and burned overnight; all 16 crew moved to a Russian vessel, Al Jazeera and ABC News reported.", "A Finnish Defence Forces spokesman said it is “likely that Ukraine” is behind the attack, and Prime Minister Petteri Orpo wrote that “war is spilling over into our immediate vicinity.” Ukraine has not claimed it. Early Sunday a Russian drone partly collapsed a building in Dymer, outside Kyiv, leaving 14 people unaccounted for."], "why": "A strike in a NATO member’s waters carries Ukraine’s sea campaign into the Baltic, where the alliance, not Kyiv, lives with the consequences.", "c": {"L": 1, "LL": 1, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/22/russian-cargo-ship-still-on-fire-off-finland-after-drone-attack", "t": "L"}, {"n": "ABC News (Australia)", "u": "https://www.abc.net.au/news/2026-11-22/russian-cargo-ship-burns-in-baltic-sea-after-drone-strike/107413782", "t": "C"}, {"n": "Reuters via Investing.com", "u": "https://in.investing.com/news/economy-news/russian-drone-strike-traps-14-in-kyiv-region-as-cargo-ship-burns-off-finland-5719627", "t": "C"}, {"n": "CNN", "u": "https://www.cnn.com/2026/11/21/europe/russian-ship-fire-baltic-latam-intl", "t": "LL"}, {"n": "France 24", "u": "https://www.france24.com/en/europe/20261121-drone-attack-sets-russian-cargo-ship-ablaze-in-gulf-of-finland", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-22/s4.webp?h=1bc30822", "col": "#5b2513", "cap": "", "credit": "Joe deSousa, CC0 / Wikimedia Commons", "pull": null, "kp": ["The Sparta II left St. Petersburg on November 20 for Kaliningrad.", "Finland’s military named Ukraine as the likely attacker; Kyiv has not claimed it.", "The cargo on board has not been confirmed, Finland’s border guard said."], "bg": "Finland reported a strike on a Russian warship in the Baltic on November 13, Al Jazeera reported. The Leningrad region’s governor said two drones hit the ship and 80 were shot down overnight. Estonia’s navy commander said more attacks cannot be ruled out.", "nx": "", "fig": {"v": "16", "l": "crew moved to a Russian vessel"}}, {"id": "s5", "sec": "The Front", "sid": "s-front", "h": "Péladeau defends his C$31 billion Telus bid as Bell’s talks surface", "s": "Quebecor chief executive Pierre Karl Péladeau defended his unsolicited bid for Telus on CBC, saying “telecom assets are strategic for our country.” Global News, citing the Globe and Mail, reported that BCE held preliminary talks with Telus.", "paras": ["Quebecor chief executive Pierre Karl Péladeau defended his unsolicited bid for Telus on CBC’s Rosemary Barton Live, saying “telecom assets are strategic for our country” and comparing <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Starlink<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>SpaceX’s satellite internet service, which Péladeau casts as a global rival that only a national champion of scale can answer.<\/span><\/button>’s reach to Netflix’s. Quebecor is worth about C$14.77 billion against Telus’s C$21.72 billion, CBC reported. The Telus <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">special committee<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Chaired by John Manley, a former Canadian deputy prime minister and finance minister, it runs the review so management is not judging its own fate.<\/span><\/button> cites “significant risks.”", "Global News, citing the Globe and Mail, reported that BCE held preliminary talks with Telus. Desjardins puts a Bell and Telus combination at about 55% of wireless, against about 40% for Quebecor and Telus, and called it a long shot at the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Competition Bureau<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>One of three reviewers; the CRTC and the industry department, which controls spectrum licence transfers, each rule separately.<\/span><\/button>."], "why": "The smaller company is bidding for the larger, and a rival suitor with a worse antitrust case is now a negotiating tool for Telus.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "CBC via Yahoo", "u": "https://ca.news.yahoo.com/quebecor-ceo-defends-telus-bid-090000586.html", "t": "C"}, {"n": "Canadian Press via Global News", "u": "https://globalnews.ca/news/12158293/quebecor-bell-telus-merger-talks/", "t": "C"}, {"n": "CBC", "u": "https://www.cbc.ca/news/politics/pierre-karl-peladeau-quebecor-telus-bid-9.7431320", "t": "C"}, {"n": "Bloomberg (Nov. 17)", "u": "https://www.bloomberg.com/news/articles/2026-11-17/quebecor-s-peladeau-makes-shocking-c-28-billion-bid-for-canada-s-telus", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-22/s5.webp?h=be797685", "col": "#2b3a47", "cap": "", "credit": "Jeangagnon, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "kp": ["Péladeau defended the bid on CBC on Sunday.", "BCE held preliminary talks with Telus, the Globe and Mail reported on November 18.", "Desjardins puts a Bell and Telus deal at about 55% of wireless."], "bg": "Telus confirmed the unsolicited proposal on November 16. Quebecor became Canada’s fourth national carrier when it bought Freedom Mobile as the remedy in the Rogers and Shaw merger, the basis of its claim that the deal adds competition. NDP leader Avi Lewis has asked the Competition Bureau to block it.", "nx": "", "chart": {"type": "bar", "t": "Market value, as reported by CBC", "rows": [["Quebecor", 14.77, "C$14.77 billion"], ["Telus", 21.72, "C$21.72 billion"]]}}, {"id": "s6", "sec": "The Front", "sid": "s-front", "h": "An Iranian strike sets a Bahrain site on fire as Araghchi opens a debate", "s": "Bahrain said it intercepted Iranian aerial attacks late Saturday and that a fire broke out at an unnamed industrial facility, Al Jazeera reported. Foreign Minister Abbas Araghchi told IRNA that changing Iran’s doctrine is “a major strategic debate.”", "paras": ["Bahrain said it intercepted Iranian aerial attacks late Saturday and that a fire broke out at an unnamed industrial facility, with damage but no injuries, Al Jazeera reported. The IRGC claimed it destroyed two US <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Patriot<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The US air-defense system guarding Gulf bases; its radars are the eyes of the battery, so a destroyed radar blinds the launchers it serves.<\/span><\/button> radars. At least three tankers were hit near Khasab, AP reported.", "Foreign Minister Abbas Araghchi told IRNA that changing Iran’s doctrine is “a major strategic debate,” adding, “For now, our doctrine has not changed.” The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Assembly of Experts<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The clerical body that chooses and can remove the supreme leader, which gives its call for new deterrence on November 12 constitutional weight.<\/span><\/button> called a review “unavoidable” on November 12. Leaving the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">NPT<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The 1970 treaty’s Article X lets a member withdraw on three months’ notice, so any exit would come with a public clock.<\/span><\/button> is the step the debate turns on."], "why": "A foreign minister on record that the bomb is debatable moves Iran from capability to intent while US carriers sit in range.", "c": {"L": 3, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/21/bahrain-says-iranian-attack-causes-fire-at-industrial-facility", "t": "L"}, {"n": "AP via ABC News", "u": "https://abcnews.com/Business/wireStory/iran-strikes-3-tankers-shows-off-missile-launchers-138345075", "t": "C"}, {"n": "Al Jazeera (doctrine)", "u": "https://www.aljazeera.com/news/2026/11/21/could-iran-reverse-its-stated-policy-of-a-civil-only-nuclear-programme", "t": "L"}, {"n": "Al Jazeera (tankers)", "u": "https://www.aljazeera.com/news/2026/11/21/tankers-hit-in-strait-of-hormuz-as-iran-tightens-grip-on-shipping", "t": "L"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-22/s6.webp?h=82d00b2a", "col": "#233a51", "cap": "", "credit": "Zairon, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "kp": ["Bahrain reported its first fire and damage from the Iranian attacks.", "Araghchi said Iran’s doctrine has not changed “for now.”", "AP counted at least three tankers struck on Saturday."], "bg": "Iran held about 440 kg of uranium enriched to 60% by a 2025 estimate, and IAEA chief Rafael Grossi said in March that at least 200 kg is believed to have survived the strikes. Qatari mediators visited Tehran on Friday, a deputy foreign minister said.", "nx": ""}, {"id": "s7", "sec": "AI", "sid": "d-ai", "h": "Killer robots get two more years of talk", "s": "The Geneva review conference ended Saturday with states agreeing only to “elaborate” rules on lethal autonomous weapons by 2028, AP reported. Seven states sought a negotiating mandate and fell short.", "paras": ["The Geneva review conference of the weapons convention ended Saturday with states agreeing only to “elaborate” rules on lethal autonomous weapons by 2028, AP reported. Seven states sought a negotiating mandate and fell short; activists blamed Russia. Max Tegmark said states had agreed to talk “for the 14th year.”"], "why": "", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "AP via Boston Globe", "u": "https://www.bostonglobe.com/2026/11/21/world/ai-killer-robots-un-more-talks/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-22/s7.webp?h=1a647e14", "col": "#3b3829", "cap": "", "credit": "Vassil, CC0 / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": ""}, {"id": "s8", "sec": "Markets & Deals", "sid": "d-mkt", "h": "The curve rallied into a holiday week of supply", "s": "Treasury’s par curve rallied on the week into Thanksgiving. Treasury sells $69 billion of two-year notes Monday, $70 billion of five-year Tuesday and $44 billion of seven-year Wednesday.", "paras": ["Treasury’s par curve closed Friday at 4.63% on the two-year, 4.92% on the ten-year and 5.31% on the thirty-year, down 25, 23 and 16 basis points on the week. Treasury sells $69 billion of two-year notes Monday, $70 billion of five-year Tuesday and $44 billion of seven-year Wednesday, before PCE and the Beige Book. Futures still price a December hike near 90%."], "why": "", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Treasury", "u": "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_yield_curve&field_tdr_date_value_month=202611", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": "", "chart": {"type": "line", "t": "Treasury par yields, Friday close", "rows": [["Two-year", 4.63, "4.63%"], ["Ten-year", 4.92, "4.92%"], ["Thirty-year", 5.31, "5.31%"]]}}, {"id": "s9", "sec": "Law & the Courts", "sid": "d-law", "h": "The Cravath scale spread", "s": "Cravath set 2027 salaries on November 17. Cleary matched within a day, then Paul Hastings, Proskauer and Dechert; Seyfarth stayed below market, Above the Law reported.", "paras": ["Cravath set 2027 salaries at $235,000 to $440,000 with special bonuses up to $40,000 on November 17. Cleary matched within a day, then Paul Hastings, Proskauer and Dechert; Seyfarth stayed below market, Above the Law reported."], "why": "", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Above the Law", "u": "https://abovethelaw.com/2026/11/paul-hastings-matches-cravath-now-can-the-rest-of-biglaw-get-moving/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credi
