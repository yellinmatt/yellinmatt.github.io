the two-year near 4.60%, per Trading Economics, after a fall of more than 30 basis points in October as money left tech stocks."], "why": "With September inflation at 3.6%, hikes are back on the table, and the rate every pending convertible and IPO discounts against is now a two-way bet.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "St. Louis Fed remarks", "u": "https://www.stlouisfed.org/from-the-president/remarks/2026/remarks-on-us-economy-and-monetary-policy-somc", "t": null}, {"n": "Yahoo Finance", "u": "https://finance.yahoo.com/economy/policy/article/rates-need-to-be-higher-3-fed-members-say-the-question-is-how-much-173755732.html", "t": "C"}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/10/30/musalem-fed-monetary-policy-tightening.html", "t": "C"}, {"n": "Quartz", "u": "https://qz.com/fed-officials-signal-more-interest-rate-hikes-103026", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-31/s5.webp?h=baca25d0", "col": "#4b4743", "cap": "", "credit": "Christopher L. Riley, CC BY-SA 4.0 / Wikimedia Commons", "pull": null}, {"id": "s6", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Evonik rebuffs BASF’s raised €11.2 billion bid, keeping Germany’s chemicals takeover fight open", "s": "Evonik’s board said Friday that BASF’s raised offer of €24 a share, about €11.18 billion, was not enough to begin formal talks, though it asked BASF to explain its rationale, Reuters reported. Evonik rejected €22.15 in September.", "paras": ["<button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Evonik<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>It has explored buying Ashland, a deal reported at about $3.3 billion, an alternative to BASF’s approach.<\/span><\/button>’s board said Friday that BASF’s raised offer of €24 a share, about €11.18 billion, was not enough to begin formal talks, though it asked BASF to explain its rationale, Reuters reported. Evonik rejected €22.15 in September. BASF said it was surprised and would not overpay, while acknowledging “Evonik’s willingness to engage in discussions.” Chief executive Markus Kamieth called the deal a “strong German response to global competition.”"], "why": "A raised bid that still cannot open talks puts the next move on BASF: go to shareholders, pay more, or walk.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Reuters via Euronext", "u": "https://live.euronext.com/en/financial-news/evonik-rejects-basf-bid-despite-sweetened-125-billion-terms", "t": "C"}, {"n": "MarketScreener", "u": "https://www.marketscreener.com/news/evonik-declines-basf-takeover-talks-ce785fdbd88eff25", "t": "C"}, {"n": "Law360", "u": "https://www.law360.com/transactions-uk/articles/2544391", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-31/s6.webp?h=17f1fb81", "col": "#3f413e", "cap": "", "credit": "Felix König, CC BY 3.0 / Wikimedia Commons", "pull": null}, {"id": "s7", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Gencom and White Bridge buy the InterContinental Miami from a Chinese state insurer for about $300 million", "s": "Miami-based Gencom and White Bridge Capital bought the 652-room InterContinental Miami at 100 Chopin Plaza for about $300 million, The Real Deal reported Friday, citing Bloomberg. A buyers’ spokesperson confirmed the sale but not the price, which works out to about $460,000 a key, 9% above the Florida full-service average tracked by MSCI.", "paras": ["Miami-based Gencom and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">White Bridge Capital<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Its clients are Latin American family offices. Tommy Campbell is chief executive.<\/span><\/button> bought the 652-room InterContinental Miami at 100 Chopin Plaza for about $300 million, The Real Deal reported Friday, citing Bloomberg. A buyers’ spokesperson confirmed the sale but not the price, which works out to about $460,000 a key, 9% above the Florida full-service average tracked by MSCI. The seller was Strategic Hotels &amp; Resorts, owned by <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Dajia Insurance<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The state-run successor to Anbang Insurance, which bought Strategic Hotels in 2016.<\/span><\/button>. The same day, the ULI and PwC Emerging Trends report ranked Miami third for 2027."], "why": "Local capital is paying a premium per room for a downtown trophy hotel, a clean read on where Miami hotel values sit as Chinese owners keep selling.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "The Real Deal", "u": "https://therealdeal.com/miami/2026/10/30/gencom-white-bridge-capital-buy-intercontinental-miami/", "t": null}, {"n": "The Real Deal on ULI", "u": "https://therealdeal.com/miami/2026/10/30/uli-emerging-real-estate-trends-2027-miami-2/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-31/s7.webp?h=9ee6e52d", "col": "#494c47", "cap": "", "credit": "CC BY 2.0 / Wikimedia Commons", "pull": null}, {"id": "s8", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Analysts tie the record $6.3 billion Binance theft to North Korea as $3 billion is frozen", "s": "Blockchain analysts TRM Labs and Chainalysis attributed the $6.3 billion theft from Binance, most of it taken within about 20 minutes on Thursday across 10 blockchains, to North Korea’s TraderTraitor group. About $3 billion is frozen, more than $2.3 billion of it by Tether and Circle, Reuters reported.", "paras": ["Blockchain analysts TRM Labs and Chainalysis attributed the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">$6.3 billion theft<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>About four times the previous record, Bybit’s $1.5 billion in February 2025.<\/span><\/button> from Binance, most of it taken within about 20 minutes on Thursday across 10 blockchains, to North Korea’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">TraderTraitor<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>A hacking unit linked to the Lazarus Group, which the Treasury sanctioned in 2019.<\/span><\/button> group. About $3 billion is frozen, more than $2.3 billion of it by Tether and Circle, Reuters reported. Co-chief executive Richard Teng said “our investigation has not attributed responsibility to any individual.” Bitcoin hit a six-week low of $76,368."], "why": "Two stablecoin issuers froze more of the stolen money than any government did, which strengthens the case that issuers, not regulators, are crypto’s working enforcement layer.", "c": {"L": 1, "LL": 1, "C": 1, "LR": 0, "R": 1}, "src": [{"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/10/30/binance-says-6-3bn-stolen-in-biggest-crypto-heist-in-history-what-we-know", "t": "L"}, {"n": "CNN", "u": "https://www.cnn.com/2026/10/30/tech/binance-crypto-heist-hnk-intl", "t": "LL"}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/10/30/billions-in-crypto-frozen-in-binance-hack-heres-what-happens-next-.html", "t": "C"}, {"n": "Fox Business", "u": "https://www.foxbusiness.com/technology/expert-warns-ai-hacking-bloodbath-following-massive-binance-cryptocurrency-theft", "t": "R"}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-31/s8.webp?h=15e03b16", "col": "#3d3e34", "cap": "", "credit": "BitcoinXio, CC0 / Wikimedia Commons", "pull": null}, {"id": "s9", "sec": "Law & the Courts", "sid": "s-law", "h": "Rivals carve up Weil as Gibson Dunn takes its London funds team and an AI law firm bids for the brand", "s": "Gibson Dunn is taking Weil, Gotshal &amp; Manges’ London private funds team of almost 40 lawyers, including 10 partners led by James Bromley and James Sargent, City AM reported Friday, and Simpson Thacher is set to hire London private equity partner Lewis Blakey, Legal Business reported. Sullivan &amp; Cromwell and Paul Weiss are talking with Weil associates and trainees, and Paul Weiss has already hired several partners, the ABA Journal reported.", "paras": ["Gibson Dunn is taking Weil, Gotshal &amp; Manges’ London private funds team of almost 40 lawyers, including 10 partners led by James Bromley and James Sargent, City AM reported Friday, and Simpson Thacher is set to hire London private equity partner Lewis Blakey, Legal Business reported. Sullivan &amp; Cromwell and Paul Weiss are talking with Weil associates and trainees, and Paul Weiss has already hired several partners, the ABA Journal reported. The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">partnership vote<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Weil confirmed to The New York Times that it was preparing to vote on dissolution, TechCrunch reported. No result had been reported by Saturday morning.<\/span><\/button> is expected this week.", "Crosby, an <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">AI-native law firm<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Its $60 million Series B was led by Lux and Index. ABA Model Rule 5.4 bars nonlawyer ownership of law firms, with exceptions in Arizona and Utah, so Crosby’s structure bears on what it can buy.<\/span><\/button> that has raised about $85 million, bid for Weil assets including its trademark, brand and some internal data, TechCrunch reported, following The Information. Terms were not disclosed. A former Weil partner told City AM it was “a Titanic situation.” Departing partners take their hourly matters under New York’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">unfinished business<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>In the 2014 Thelen and Coudert decisions, New York’s top court held that a dissolved firm has no property interest in hourly matters a partner takes to a new firm.<\/span><\/button> rule."], "why": "The question at Weil is no longer survival but who gets its practices, and an AI firm bidding for a BigLaw name is a first.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "ABA Journal", "u": "https://www.abajournal.com/news/article/rivals-race-to-rescue-weil-lawyers-as-firm-heads-towards-closure", "t": null}, {"n": "City AM", "u": "https://www.cityam.com/gibson-dunn-snaps-up-weils-private-funds-team-in-city-expansion/", "t": "C"}, {"n": "TechCrunch", "u": "https://techcrunch.com/2026/10/30/ai-law-firm-crosby-bids-on-disintegrating-famed-firm-weil-gotshal/", "t": "C"}, {"n": "Legal Business", "u": "https://www.legalbusiness.co.uk/law-firms/simpson-thacher-set-to-hire-london-pe-partner-as-weil-fallout-continues/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-31/s9.webp?h=8de49911", "col": "#3b3c3c", "cap": "767 Fifth Avenue, Weil’s New York headquarters.", "credit": "Pablo Costa Tirado, CC BY-SA 3.0 / Wikimedia Commons", "pull": null}, {"id": "s10", "sec": "Law & the Courts", "sid": "s-law", "h": "A judge bars Justice Department threats against election officials as the Ninth Circuit again refuses to set aside California ballots", "s": "Judge Trina Thompson of the Northern District of California issued a temporary restraining order Friday barring the Justice Department and Homeland Security from threatening or coercing election officials to stop processing ballots of voters the government calls ineligible, citing likely violations of Section 11(b) of the Voting Rights Act. Unions and the NAACP brought the suit.", "paras": ["Judge Trina Thompson of the Northern District of California issued a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">temporary restraining order<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Granted without notice under Rule 65(b), it runs to 5 p.m. Nov. 16, with a preliminary injunction hearing set for Nov. 13.<\/span><\/button> Friday barring the Justice Department and Homeland Security from threatening or coercing election officials to stop processing ballots of voters the government calls ineligible, citing likely violations of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Section 11(b)<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>It reaches intimidation of anyone “aiding any person to vote,” which is why unions of election workers can bring the claim.<\/span><\/button> of the Voting Rights Act. Unions and the NAACP brought the suit. A Ninth Circuit panel separately ruled 2-1 against the department’s bid to set aside about 20,000 California mail ballots, finding “no feasible way to identify and segregate the ballots of specific individuals.”"], "why": "Three days before Election Day, two courts have told the department that the executive cannot direct how states count ballots.", "c": {"L": 1, "LL": 1, "C": 1, "LR": 0, "R": 1}, "src": [{"n": "TRO, SEIU v. DOJ", "u": "https://storage.courtlistener.com/recap/gov.uscourts.cand.482447/gov.uscourts.cand.482447.26.0.pdf", "t": null}, {"n": "Fox News", "u": "https://www.foxnews.com/politics/federal-judge-blocks-trump-doj-threats-against-election-workers-ahead-2026-midterms", "t": "R"}, {"n": "CNN", "u": "https://www.cnn.com/2026/10/30/politics/emergency-order-halts-doj-pressure-campaign-election-officials", "t": "LL"}, {"n": "CBS News", "u": "https://www.cbsnews.com/news/california-justice-department-ballots-appeals-court/", "t": "C"}, {"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/10/30/us-appeals-court-again-rejects-trump-bid-to-set-aside-california-ballots", "t": "L"}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-31/s10.webp?h=097db3e1", "col": "#383b3b", "cap": "", "credit": "Michael Barera, CC BY-SA 4.0 / Wikimedia Commons", "pull": null}, {"id": "s11", "sec": "The World", "sid": "s-world", "h": "Rubio opens the G20 foreign ministers’ meeting in Atlanta with Lavrov present and the group photo cancelled", "s": "Secretary of State Marco Rubio opened a two-day meeting of G20 foreign ministers in Atlanta on Friday, ahead of a December leaders’ summit at Trump’s Doral resort, telling delegates the world faces a “moment of choosing.” The United States cancelled the customary group photograph after European diplomats objected to posing with Russian Foreign Minister Sergei Lavrov, two U.S. officials told the AP.", "paras": ["Secretary of State Marco Rubio opened a two-day meeting of G20 foreign ministers in Atlanta on Friday, ahead of a December leaders’ summit at Trump’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Doral<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>The Miami-area resort hosts the summit in December. Putin has been invited, and whether he will attend is unclear, the AP reported.<\/span><\/button> resort, telling delegates the world faces a “moment of choosing.” The United States cancelled the customary group photograph after European diplomats objected to posing with Russian Foreign Minister Sergei Lavrov, two U.S. officials told the AP.", "EU foreign policy chief Kaja Kallas said Lavrov “put forward a lot of lies, a lot of false narratives.” Lavrov attacked Europe’s “arrogant boycott” and called a brief exchange with Rubio a “decent talk,” AFP reported. Ukraine was not invited, <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">South Africa<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>It held the G20 presidency in 2025 and says its absence “was not voluntary.”<\/span><\/button> is absent, and China sent a deputy foreign minister. The meeting ends Saturday with a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">chair’s summary<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Issued on the host’s own authority, it needs no consensus, so Russia cannot block its wording.<\/span><\/button> rather than a joint declaration."], "why": "Atlanta is the rehearsal for the Doral summit, where Putin is invited, and it shows Europe will not lend Russia the optics.", "c": {"L": 1, "LL": 1, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "AP via CBS News", "u": "https://www.cbsnews.com/atlanta/news/g20-diplomats-including-from-china-and-russia-face-deep-rifts-as-they-prepare-to-meet-in-atlanta-2/", "t": "C"}, {"n": "CNN", "u": "https://www.cnn.com/2026/10/30/politics/g20-tensions-photo-canceled-lavrov-rubio", "t": "LL"}, {"n": "The Hill", "u": "https://thehill.com/policy/international/6185283-g20-foreign-ministers-skip-russia-photo/", "t": "C"}, {"n": "AFP", "u": "https://www.yahoo.com/news/politics/articles/rubio-hosts-g20-ministers-iran-055055507.html", "t": "C"}, {"n": "Al Jazeera", "u": "https://www.aljazeera.com/video/newsfeed/2026/10/30/aje-onl-nf_rubio-hosts-g20-talks-as-russias-lavrov-present-301026", "t": "L"}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-31/s11.webp?h=e73616d9", "col": "#494d4d", "cap": "Downtown Atlanta, host of the G20 foreign ministers’ meeting.", "credit": "London looks, CC BY 2.0 / Wikimedia Commons", "pull": null}, {"id": "s12", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "EA closed BioWare and cancelled Mass Effect to fund a new Star Wars Battlefront under $18 billion of buyout debt, Bloomberg reports", "s": "Electronic Arts shut BioWare and cancelled its next Mass Effect game because it could not fund two science-fiction projects costing “hundreds of millions” each, choosing a Star Wars Battlefront 3 from DICE and Respawn, Bloomberg’s Jason Schreier reported Friday, according to Game Developer and VGC. The $55 billion buyout led by Saudi Arabia’s Public Investment Fund left EA with about $18 billion of debt and more than $1 billion a year of interest.", "paras": ["Electronic Arts shut <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">BioWare<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>EA announced the closure Oct. 21 with about 400 job cuts, Bloomberg reported. Amazon’s Mass Effect television series is still going ahead.<\/span><\/button> and cancelled its next Mass Effect game because it could not fund two science-fiction projects costing “hundreds of millions” each, choosing a Star Wars Battlefront 3 from DICE and Respawn, Bloomberg’s Jason Schreier reported Friday, according to Game Developer and VGC. The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">$55 billion buyout<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>In a leveraged buyout the acquired company’s own cash flow services the acquisition debt, so interest competes directly with game budgets.<\/span><\/button> led by Saudi Arabia’s Public Investment Fund left EA with about $18 billion of debt and more than $1 billion a year of interest.", "Laura Miele, president of EA Entertainment and BioWare’s main advocate, lost ground to executives from the sports side, the report said. EA said the decision followed “months of planning, review, and analysis.” BioWare co-founder Greg Zeschuk told 80.lv that “none of these people have ever made a game.” The Mass Effect project lost up to two years helping finish <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Dragon Age: The Veilguard<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The 2024 release was BioWare’s last game. EA closed Visceral Games in 2017 in a similar pivot on a Star Wars title.<\/span><\/button>."], "why": "A clean case of leverage setting creative strategy: the debt load decided which franchise lived, which is the question every studio buyout now invites.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Bloomberg", "u": "https://www.bloomberg.com/news/newsletters/2026-10-30/why-electronic-arts-shut-down-bioware-and-cancelled-mass-effect", "t": "C"}, {"n": "Game Developer", "u": "https://www.gamedeveloper.com/business/report-ea-shut-down-bioware-in-favor-of-star-wars-battlefront-sequel-after-previously-decrying-licensed-games", "t": "C"}, {"n": "VGC", "u": "https://www.videogameschronicle.com/news/ea-chose-to-shut-down-bioware-so-it-could-make-star-wars-battlefront-3-instead-its-claimed/", "t": "C"}, {"n": "PC Gamer", "u": "https://www.pcgamer.com/games/mass-effect/ea-reportedly-canned-bioware-and-mass-effect-5-to-make-a-new-star-wars-battlefront-instead/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-31/s12.webp?h=69f7f6f9", "col": "#403f32", "cap": "Electronic Arts’ headquarters in Redwood Shores, California.", "credit": "King of Hearts, CC BY-SA 3.0 / Wikimedia Commons", "pull": null}, {"id": "s13", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "Salesforce asks the LIV Golf bankruptcy court to free it from its sponsorship, blaming AI features that never worked", "s": "Salesforce asked the bankruptcy court in New Jersey to force LIV Golf to decide quickly whether to assume or reject its $6.75 million-a-year sponsorship through 2029, and said it prefers rejection, Bloomberg Law reported Friday. Salesforce says LIV never delivered a fan “digital caddie” or live AI predictions and that its Agentforce chatbot erred at events.", "paras": ["Salesforce asked the bankruptcy court in New Jersey to force <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">LIV Golf<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The league plays its Miami event at Doral. Sergio Garcia left it on Oct. 29, the latest departure.<\/span><\/button> to decide quickly whether to <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">assume or reject<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Section 365(d)(2) of the Bankruptcy Code lets a contract counterparty ask the court to set that deadline before a plan is confirmed.<\/span><\/button> its $6.75 million-a-year sponsorship through 2029, and said it prefers rejection, Bloomberg Law reported Friday. Salesforce says LIV never delivered a fan “digital caddie” or live AI predictions and that its Agentforce chatbot erred at events. The next payment is due Jan. 4, two days before LIV’s restructuring takes effect. A hearing is set for Nov. 19."], "why": "A sponsor using a debtor’s bankruptcy to exit a deal over AI performance is a template other brand partners will study.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Bloomberg Law", "u": "https://news.bloomberglaw.com/bankruptcy-law/salesforce-aims-to-end-liv-golf-sponsorship-deal-over-ai-bugs", "t": "C"}, {"n": "EssentiallySports via Yahoo", "u": "https://sports.yahoo.com/articles/200-billion-tech-giant-targets-182719283.html", "t": "C"}, {"n": "Front Office Sports (background)", "u": "https://frontofficesports.com/article/liv-readies-for-next-phase-of-bankruptcy-as-court-proceedings-ramp-up/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}], "week": [], "cover": "img/2026-10-31/s1.webp?h=3ba0b022"}, {"date": "2026-10-30", "no": 155, "min": 8.4, "stand": "A 95-year-old law firm moves to close, Big Tech borrows to build AI, and a Boca Raton alarm company goes to an AI holding company.", "note": "Editor’s note. 13 items at 2,023 read-words, under the ten-minute cap. Weil’s dissolution leads; the decision was first reported late Wednesday, and this edition runs it on Thursday’s wind-down terms and Reuters’ account. Not run: DoorDash’s $17 billion agreement for Instacart (the announcement could not be placed inside the window); a Bloomberg report that Nvidia may guarantee credit for Nscale’s West Virginia data center for Anthropic (one paywalled report); Universal Music’s third quarter; GM’s $220 million privacy settlement with 36 states; Intel’s after-hours fall; Marvell and Lumentum, still unsigned. Watch: the Public Investment Fund’s LIV Golf decision and the Concord v. Anthropic Daubert hearing, both today; a possible ruling in the Alaska suit; Weil’s partner vote; Apple’s results Nov. 2; Election Day Tuesday; GFL bids Nov. 9; the new Knesset Nov. 10. Sourcing limits: Reuters, The Wall Street Journal, Bloomberg, The New York Times and CNBC could not be opened directly, so several items rest on syndicated copies or reports citing them; the Harvey item is single-source; the seven-year auction result comes from market reports, not the Treasury. No item concerns Anthropic, whose model compiles this paper, though Amazon is an Anthropic investor.", "items": [{"id": "s1", "sec": "The Front", "sid": "s-front", "h": "Weil Gotshal moves to dissolve after 95 years, promising staff 90 days’ pay as partners prepare to vote", "s": "Weil, Gotshal &amp; Manges, the New York firm with about 1,200 lawyers and more than $2 billion of revenue last year, plans to wind down after its management committee recommended dissolution to partners, Reuters reported Thursday. The partnership must still vote.", "paras": ["Weil, Gotshal &amp; Manges, the New York firm with about 1,200 lawyers and more than $2 billion of revenue last year, plans to wind down after its management committee recommended dissolution to partners, Reuters reported Thursday. The partnership must still vote. Weil intends to close <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">out of court<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>No bankruptcy case is needed while a firm stays solvent and pays employees, landlords and lenders. Stroock, which dissolved in 2023, took two years to settle with its major creditors.<\/span><\/button>, advised by <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">AlixPartners<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The turnaround firm follows consultants Weil had already hired to comb through obligations such as pensions and office leases, Above the Law reported.<\/span><\/button> and restructuring counsel from Davis Polk.", "In a message reported by Above the Law, the firm said associates, counsel, <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">non-capital partners<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Salaried partners who hold no equity, so in a dissolution they are paid like employees rather than sharing in what is left over.<\/span><\/button> and staff who stay will receive up to 90 days of salary and benefits. Staff bonuses come in mid-December, and associates who remain through Jan. 1 are paid in early January. Lawyers were told to keep billing and collecting. More than 30 partners left this year, including members of the executive committee, and it is unclear what the firm owes partners under its <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">partnership agreement<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>It governs capital accounts and unfunded retirement promises. In Dewey &amp; LeBoeuf’s 2012 bankruptcy, former partners paid about $71.5 million into a settlement to avoid clawback suits.<\/span><\/button>, Reuters reported.", "The unraveling took weeks. Merger talks with Willkie Farr broke down this month, and Ramona Nee backed away from succeeding longtime leader Barry Wolf. Days earlier Weil had told The Wall Street Journal that “no decision has been made to dissolve the firm.” Bloomberg columnist Matt Levine called it a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">run on the law firm<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Levine likened it to the Reserve Primary Fund breaking the buck in 2008, when early exits made staying irrational for everyone left.<\/span><\/button>, and David Lat wrote that Weil, which carried no debt, may be the most prestigious firm ever to collapse. Clients include Apple, Goldman Sachs and Dow."], "why": "The largest BigLaw failure since Dewey puts about 1,200 lawyers, a leading restructuring and private equity bench, and its clients into the lateral market at once, and shows that partner flight alone can end a debt-free firm.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 1}, "src": [{"n": "Reuters explainer", "u": "https://au.investing.com/news/stock-market-news/explainerwhats-next-for-law-firm-weil-gotshal-as-it-plans-dissolution-4727309", "t": "C"}, {"n": "Above the Law", "u": "https://abovethelaw.com/2026/10/weils-wind-down-message-to-associates-good-luck-out-there-and-dont-forget-your-timesheets/", "t": "C"}, {"n": "Fox Business", "u": "https://www.foxbusiness.com/economy/wall-street-law-firm-handled-enron-lehman-brothers-bankruptcies-plans-dissolve-nearly-century", "t": "R"}, {"n": "Money Stuff", "u": "https://news.bloomberglaw.com/securities-law/matt-levines-money-stuff-run-on-the-law-firm", "t": "C"}, {"n": "Original Jurisdiction", "u": "https://davidlat.substack.com/p/weil-gotshal-manges-biglaw-firm-failure-collapse-dissolution", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-10-30/s1.webp?h=8de49911", "col": "#3b3c3c", "cap": "767 Fifth Avenue, the General Motors Building, where Weil lists more than 500 lawyers.", "credit": "Pablo Costa Tirado, CC BY-SA 3.0 / Wikimedia Commons", "pull": {"text": "“We recognize that asking everyone to remain focused on their work during a period of such personal uncertainty is difficult.”", "attr": "Weil leadership, message to lawyers, via Above the Law, Oct. 29"}}, {"id": "s2", "sec": "The Front", "sid": "s-front", "h": "Amazon’s free cash flow runs $42 billion negative as Microsoft sells its first bonds since 2017 and Alphabet sheds $500 billion", "s": "Amazon said Thursday that free cash flow over the past 12 months was minus $42.4 billion, against $14.8 billion a year earlier, after $215.2 billion of capital spending, and that long-term debt reached $173.1 billion, up from $65.6 billion at the end of 2025. AWS revenue grew 39% to $46.0 billion on total sales of $201.9 billion, and the shares fell as much as 9% after hours, Deadline reported.", "paras": ["Amazon said Thursday that free cash flow over the past 12 months was minus $42.4 billion, against $14.8 billion a year earlier, after $215.2 billion of capital spending, and that long-term debt reached $173.1 billion, up from $65.6 billion at the end of 2025. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">AWS<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Andy Jassy said he expects growth above 40% in both 2027 and 2028, the forecast the spending is sized to, Constellation Research reported.<\/span><\/button> revenue grew 39% to $46.0 billion on total sales of $201.9 billion, and the shares fell as much as 9% after hours, Deadline reported.", "Earlier, Microsoft sought at least $25 billion in 10 tranches, its <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">first U.S. bond sale since 2017<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Microsoft and Johnson &amp; Johnson are the only AAA-rated U.S. companies, so its spread prices AI debt with almost no credit risk attached.<\/span><\/button>, Bloomberg reported. Alphabet fell 12.6%, erasing about $500 billion, the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">second-largest one-day loss<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Nvidia lost about $593 billion on Jan. 27, 2025, the day China’s DeepSeek released a low-cost reasoning model.<\/span><\/button> on record, Platformer reported."], "why": "The three largest cloud builders now fund AI with debt rather than cash flow, which moves the risk from shareholders to bondholders.", "c": {"L": 0, "LL": 1, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Amazon third-quarter release", "u": "https://ir.aboutamazon.com/news-release/news-release-details/2026/Amazon-com-Announces-Third-Quarter-Results/", "t": null}, {"n": "Deadline", "u": "https://uk.finance.yahoo.com/news/amazon-shares-fall-q3-earnings-202746508.html", "t": "C"}, {"n": "Bloomberg via Investing.com", "u": "https://www.investing.com/news/stock-market-news/microsoft-seeks-at-least-25-billion-in-first-bond-sale-since-2017-4983281", "t": "C"}, {"n": "Platformer", "u": "https://www.platformer.news/thursday-newsletter-6/", "t": "C"}, {"n": "CNN", "u": "https://www.cnn.com/2026/10/29/investing/alphabet-google-stock-ai", "t": "LL"}], "framing": "", "min": 1, "front": true, "img": "img/2026-10-30/s2.webp?h=754f116d", "col": "#373c39", "cap": "", "credit": "Sea Cow, CC BY-SA 4.0 / Wikimedia Commons", "pull": null}, {"id": "s3", "sec": "AI", "sid": "s-ai", "h": "Harvey buys Aida, its fifth acquisition this year, to map how law firms’ knowledge fits together", "s": "Harvey has acquired Aida, a sales-execution startup founded by Glean co-founder Piyush Prahladka and Atish Das Sarma, Artificial Lawyer reported Thursday, its fifth purchase of 2026 after Benchmark in July and Guardails in September. Terms were not disclosed.", "paras": ["Harvey has acquired Aida, a sales-execution startup founded by <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Glean<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>An enterprise search company that indexes a business’s internal documents, the same retrieval problem Harvey faces inside a law firm.<\/span><\/button> co-founder Piyush Prahladka and Atish Das Sarma, Artificial Lawyer reported Thursday, its fifth purchase of 2026 after Benchmark in July and Guardails in September. Terms were not disclosed. The team joins Harvey’s product and engineering groups to build firm-specific <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">ontologies<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A structured map linking matters, clauses, people and precedents, so a model can retrieve what a firm already knows rather than what the open web says.<\/span><\/button>. Chief executive Winston Weinberg said unlocking that knowledge “will fundamentally change how they work.”"], "why": "Legal AI vendors are buying their way into a firm’s institutional memory, the asset that walks out the door when partners leave.", "c": {"L": 0, "LL": 0, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "Artificial Lawyer", "u": "https://www.artificiallawyer.com/2026/10/29/harvey-buys-aida-5th-purchase-in-2026/", "t": null}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-30/s3.webp?h=10dac0cf", "col": "#365048", "cap": "", "credit": "Energyme, CC BY-SA 4.0 / Wikimedia Commons", "pull": null}, {"id": "s4", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Kushner’s Thrive Holdings agrees to take Boca Raton’s ADT private for $15.3 billion, with Apollo funding the deal", "s": "ADT agreed Thursday to be acquired by Thrive Holdings for $10 a share in cash, a 45.6% premium to the unaffected Oct. 27 close, valuing the home-security company at about $7.6 billion in equity and $15.3 billion with debt, the companies said. Funds managed by Apollo committed all the financing, with no financing condition, and ADT shares rose 34%.", "paras": ["ADT agreed Thursday to be acquired by <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Thrive Holdings<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Built as permanent capital with no fund life, it buys service businesses such as accounting and IT firms to run them with AI rather than to resell them.<\/span><\/button> for $10 a share in cash, a 45.6% premium to the unaffected Oct. 27 close, valuing the home-security company at about $7.6 billion in equity and $15.3 billion with debt, the companies said. Funds managed by <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Apollo<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Apollo bought ADT in 2016 and took it public in 2018. This time its funds supply the financing rather than the equity.<\/span><\/button> committed all the financing, with no financing condition, and ADT shares rose 34%.", "A <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">go-shop<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A window after signing in which the target may court rival bidders, usually with a reduced break fee owed to the first buyer.<\/span><\/button> runs to Nov. 28, and closing is expected in the first quarter of 2027. Cravath represents ADT and Kirkland &amp; Ellis represents Thrive. Thrive, spun out of Josh Kushner’s Thrive Capital, counts OpenAI as a partner supplying models and engineers and plans to make ADT the base of a smart-home business, TechCrunch reported."], "why": "A take-private by an AI holding company, financed entirely by private credit, brings the newest buyout model to a South Florida public company.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "ADT and Thrive release", "u": "https://www.globenewswire.com/news-release/2026/10/29/3391374/0/en/adt-to-be-acquired-by-thrive-holdings-in-15-3-billion-transaction.html", "t": null}, {"n": "TechCrunch", "u": "https://techcrunch.com/2026/10/29/openai-backed-thrive-holdings-acquires-adt/", "t": "C"}, {"n": "Bloomberg", "u": "https://www.bloomberg.com/news/articles/2026-10-29/kushner-s-thrive-holdings-to-buy-adt-for-7-6-billion-in-cash", "t": "C"}, {"n": "Axios Pro", "u": "https://www.axios.com/pro/all-deals/2026/10/29/thrive-holdings-adt-15b-take-private", "t": "C"}, {"n": "Investing.com", "u": "https://www.investing.com/news/stock-market-news/adt-stock-spikes-34-on-76-billion-takeover-deal-by-josh-kushners-thrive-4984472", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-30/s4.webp?h=05ec7115", "col": "#454a47", "cap": "The Boca Raton building that housed ADT under Tyco.", "credit": "Coolcaesar, CC BY-SA 3.0 / Wikimedia Commons", "pull": null}, {"id": "s5", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Monte dei Paschi shareholders reject their chief’s defense, clearing a path for Intesa’s €33 billion bid", "s": "Holders of about 60% of Monte dei Paschi capital on Thursday rejected chief executive Luigi Lovaglio’s all-share counteroffers for Banco BPM and Banca Generali, after voting down a full merger with Mediobanca, Reuters reported. Intesa Sanpaolo’s offer is worth about €33 billion, and the ECB approved it this week.", "paras": ["Holders of about 60% of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Monte dei Paschi<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Founded in 1472, it is the oldest bank still operating; Italy rescued it in 2017 and sold down its stake in 2023 and 2024.<\/span><\/button> capital on Thursday rejected chief executive Luigi Lovaglio’s all-share counteroffers for Banco BPM and Banca Generali, after voting down a full merger with Mediobanca, Reuters reported. Intesa Sanpaolo’s offer is worth about €33 billion, and the ECB approved it this week. Intesa plans to sell about half of the bank’s roughly 1,200 branches to <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Unipol<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The Bologna insurer is BPER’s largest shareholder, which is why the branches are to be combined with BPER’s network.<\/span><\/button>. Italy’s antitrust ruling is due in November."], "why": "Europe’s largest bank takeover fight was settled by a shareholder vote, and the defense failed once a top holder, Delfin, signed with the bidder.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Reuters via Euronext", "u": "https://live.euronext.com/en/financial-news/mps-investors-sink-ceos-defence-plan-against-intesa-bid", "t": "C"}, {"n": "Bloomberg", "u": "https://www.bloomberg.com/news/articles/2026-10-29/monte-paschi-investors-reject-banco-bpm-bid-in-win-for-intesa", "t": "C"}, {"n": "ANSA", "u": "https://ansa.it/toscana/notizie/2026/10/29/soci-mps-bocciano-lofferta-su-bpm-primo-stop-al-piano-lovaglio_b7d11825-be24-4b36-8d4e-8ea626d1e603.html", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}, {"id": "s6", "sec": "Markets & Deals", "sid": "s-mkt", "h": "The ECB holds at 2.5% as Lagarde says she will leave nine months early, and the Bank of Japan holds 8 to 1", "s": "The European Central Bank kept its deposit rate at 2.50% on Thursday after two increases in five months, and Christine Lagarde said she will step down in February 2027, nine months before her term ends, The Irish Times reported. Klaas Knot and Pablo Hernández de Cos are named as successors.", "paras": ["The European Central Bank kept its deposit rate at 2.50% on Thursday after two increases in five months, and Christine Lagarde said she will step down in February 2027, nine months before her term ends, The Irish Times reported. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Klaas Knot<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>The former Dutch central bank governor is backed by the Netherlands; Spain backs its own former governor.<\/span><\/button> and Pablo Hernández de Cos are named as successors. The Bank of Japan held at 1.25% on Friday, with one member voting to raise, Reuters reported. A $44 billion <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">seven-year note<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The sale came a day after the Fed held, so its yield is an early market read on how long rates stay high.<\/span><\/button> auction cleared at 4.894%, MarketScreener reported."], "why": "Central banks are holding or tightening with oil above $110, and an early handover at the ECB adds succession risk to European rates.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "The Irish Times", "u": "https://www.irishtimes.com/business/2026/10/29/ecb-holds-rates-steady-as-lagardes-departure-overshadows-decision/", "t": null}, {"n": "Reuters via Yahoo (BoJ)", "u": "https://finance.yahoo.com/economy/policy/articles/instant-view-analysts-react-boj-032614967.html", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-30/s6.webp?h=b8f4fd00", "col": "#384e59", "cap": "", "credit": "Thomas Wolf, www.foto-tw.de, CC BY-SA 3.0 de / Wikimedia Commons", "pull": null}, {"id": "s7", "sec": "Law & the Courts", "sid": "s-law", "h": "The Justice Department amends its Alaska certification suit, adding a Supremacy Clause claim to moot three dismissal motions", "s": "The Justice Department filed an amended complaint Thursday in its suit to block Alaska from certifying the Senate race if Sen. Dan Sullivan loses by fewer votes than went to Daniel J.", "paras": ["The Justice Department filed an <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">amended complaint<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A party may amend once as of right within 21 days of a motion to dismiss, and the new pleading supersedes the old, so motions aimed at it fall without a ruling on the merits.<\/span><\/button> Thursday in its suit to block Alaska from certifying the Senate race if Sen. Dan Sullivan loses by fewer votes than went to <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Daniel J. Sullivan<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Alaska’s ranked-choice system, adopted by ballot measure in 2020, transfers votes from eliminated candidates, the mechanism the department says confusion distorts.<\/span><\/button>, adding a Supremacy Clause count and asking Judge Sharon Gleason to deny three dismissal motions as moot, Democracy Docket reported. Gleason on Wednesday let the League of Women Voters and others intervene."], "why": "The amendment buys time and keeps a federal court poised over a Senate certification days before Tuesday’s vote.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "Democracy Docket", "u": "https://www.democracydocket.com/news-alerts/doj-seeks-to-wipe-out-bids-to-dismiss-alaska-election-case-after-amending-lawsuit/", "t": null}, {"n": "Juneau Independent", "u": "https://www.juneauindependent.com/post/trump-ordered-lawsuit-in-alaska-s-us-senate-race-gains-intensity-after-peltola-campaign-revelations", "t": "C"}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/10/29/alaska-senate-governor-investigation-sullivan-peltola-doj.html", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-30/s7.webp?h=45853063", "col": "#434343", "cap": "", "credit": "James Brooks, CC BY 2.0 / Wikimedia Commons", "pull": null}, {"id": "s8", "sec": "Law & the Courts", "sid": "s-law", "h": "The SEC charges two firms that used fake SEC filings and a counterfeit agency seal to raise $130 million", "s": "The Securities and Exchange Commission on Thursday charged BG Wealth Sharing and DSJ Exchange with taking more than $130 million from tens of thousands of retail investors in over 40 states between October 2025 and June 2026 in a Ponzi-like crypto scheme. The two Colorado-incorporated, foreign-operated entities filed false Form D and Form ADV documents and showed investors certificates bearing a fake seal, the agency said.", "paras": ["The Securities and Exchange Commission on Thursday charged BG Wealth Sharing and DSJ Exchange with taking more than $130 million from tens of thousands of retail investors in over 40 states between October 2025 and June 2026 in a Ponzi-like crypto scheme. The two Colorado-incorporated, foreign-operated entities filed false <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Form D<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A notice of an exempt private offering that the agency does not review before it appears on EDGAR, so its presence proves nothing about legitimacy.<\/span><\/button> and Form ADV documents and showed investors certificates bearing a fake seal, the agency said. It has removed the filings from its site."], "why": "EDGAR publishes what filers submit, and fraudsters are selling that publication as an endorsement.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "SEC release 2026-110", "u": "https://www.sec.gov/newsroom/press-releases/2026-110-two-entities-charged-130-million-fraud-scheme-used-false-sec-filings-boost-investor-confidence", "t": null}, {"n": "ABA Banking Journal", "u": "https://bankingjournal.aba.com/2026/10/sec-charges-two-entities-in-130-million-fraud-scheme-using-false-filings-to-boost-investor-confidence", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-30/s8.webp?h=d3a80973", "col": "#363e43", "cap": "", "credit": "AgnosticPreachersKid, CC BY-SA 3.0 / Wikimedia Commons", "pull": null}, {"id": "s9", "sec": "The World", "sid": "s-world", "h": "Iran confirms it has Vance’s letter but sends no reply as the Houthis claim strikes on six Saudi targets", "s": "Iranian news agencies said Thursday that Tehran had received a letter from Vice President JD Vance, delivered by Qatari mediators to Mohsen Rezaei, and had not replied. The letter proposes talks led by Vance, possibly next week in Qatar or Turkey, with the nuclear issue on the table from the start, The New York Times reported.", "paras": ["Iranian news agencies said Thursday that Tehran had received a letter from Vice President JD Vance, delivered by Qatari mediators to <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Mohsen Rezaei<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>He commanded the Revolutionary Guards from 1981 to 1997 and has run for president several times.<\/span><\/button>, and had not replied. The letter proposes talks led by Vance, possibly next week in Qatar or Turkey, with the nuclear issue on the table from the start, The New York Times reported. Parliament Speaker <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Mohammad Bagher Ghalibaf<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>A former Revolutionary Guards air force commander and Tehran mayor, he led Iran’s side in earlier rounds of talks.<\/span><\/button> said any deal requires acceptance of Iran’s seven conditions, Fox News reported.", "The Houthis claimed attacks Thursday on six Saudi sites, including the Ras Tanura refinery, <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Abqaiq<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>The world’s largest crude stabilization plant; a 2019 drone and missile strike on it briefly halved Saudi output.<\/span><\/button> and airports in Riyadh and Dammam, Al Jazeera reported. Saudi Arabia said it intercepted two missiles over Riyadh. December Brent rose $1.20 to $116.08 early Friday, headed for a fourth monthly gain, after a tanker leaving Hormuz was hit by explosives, Reuters reported."], "why": "Tehran’s silence and strikes on Saudi oil leave markets pricing war rather than talks, with Brent near $116 feeding the inflation central banks are fighting.", "c": {"L": 3, "LL": 0, "C": 1, "LR": 0, "R": 1}, "src": [{"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/10/29/what-we-know-of-vances-letter-to-rezaei-as-trump-warns-gulf-to-prepare", "t": "L"}, {"n": "New York Times via Inquirer", "u": "https://www.inquirer.com/news/nation-world/jd-vance-peace-talks-iran-20261029.html", "t": "L"}, {"n": "Fox News", "u": "https://www.foxnews.com/live-news/us-iran-war-trump-military-options-strait-hormuz-10-29-26", "t": "R"}, {"n": "Reuters via Business Recorder", "u": "https://www.brecorder.com/news/40446647/oil-set-for-fourth-monthly-gain-as-hormuz-tanker-attack-highlights-supply-risks-from-war", "t": "C"}, {"n": "Al Jazeera on the Houthi claims", "u": "https://www.aljazeera.com/news/2026/10/30/houthi-forces-claim-six-attacks-on-saudi-airports-oil-facilities", "t": "L"}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-30/s9.webp?h=c430129b", "col": "#3e3a3c", "cap": "", "credit": "Hasso Hohmann, CC BY 4.0 / Wikimedia Commons", "pull": null}, {"id": "s10", "sec": "The World", "sid": "s-world", "h": "Israel’s final count leaves Netanyahu’s bloc at 53 and Eisenkot’s at 48, and Likud says the vote was ‘stolen’", "s": "With all votes counted, Prime Minister Benjamin Netanyahu’s bloc won 53 of 120 Knesset seats and Gadi Eisenkot’s 48, while Arab-led parties won a record 19 on 77.9% turnout, the Times of Israel reported. Likud rose to 27 seats after the double-envelope count.", "paras": ["With all votes counted, Prime Minister Benjamin Netanyahu’s bloc won 53 of 120 Knesset seats and Gadi Eisenkot’s 48, while Arab-led parties won a record 19 on 77.9% turnout, the Times of Israel reported. Likud rose to 27 seats after the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">double-envelope<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Ballots of soldiers, diplomats, prisoners and hospital patients, counted last and nationally, which is how a party gains a seat after election night.<\/span><\/button> count. Elections chief Noam Sohlberg ordered an inquiry after the Shin Bet passed him material on alleged foreign funding of Arab turnout, and Likud said the election was “stolen.” Qatar denied involvement. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">President Isaac Herzog<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>After consulting party leaders he gives one member 28 days, extendable by 14, to form a government; repeated failure leads toward new elections.<\/span><\/button> receives the results Wednesday."], "why": "Neither bloc reaches 61 and most Zionist parties rule out the Arab lists, so Herzog’s choice of who tries first decides whether Israel votes again.", "c": {"L": 1, "LL": 0, "C": 1, "LR": 0, "R": 2}, "src": [{"n": "Times of Israel", "u": "https://www.timesofisrael.com/with-all-votes-counted-netanyahus-bloc-at-53-seats-eisenkots-48-arab-parties-19/", "t": null}, {"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/10/29/israel-election-result-shows-no-overall-majority-as-vote-count-complete", "t": "L"}, {"n": "Fox News", "u": "https://www.foxnews.com/world/netanyahu-bloc-falls-short-arab-vote-surges-qatar-election-interference-allegations-emerge", "t": "R"}, {"n": "Euronews (AP)", "u": "https://www.euronews.com/2026/10/30/netanyahu-bloc-emerges-ahead-in-israeli-election-but-fails-to-secure-majority", "t": "C"}, {"n": "National Review", "u": "https://www.nationalreview.com/2026/10/netanyahu-lives-another-day/", "t": "R"}], "framing": "Fox News gave extended treatment to a Channel 12 report that Qatari money drove Arab turnout; Al Jazeera said Likud “continues to promote unsubstantiated allegations.”", "min": 1, "front": false, "img": "img/2026-10-30/s10.webp?h=b675068d", "col": "#454850", "cap": "", "credit": "Clema12, CC BY-SA 4.0 / Wikimedia Commons", "pull": null}, {"id": "s11", "sec": "The World", "sid": "s-world", "h": "Ukraine has paused strikes on Russian refineries under U.S. pressure, the Journal reports, as Russian attacks kill at least 20", "s": "Ukraine’s long-range units were told in mid-October that strikes on Russian refineries were effectively on hold until after the U.S. midterms, The Wall Street Journal reported Thursday, according to Reuters, which could not verify it. Russian attacks Thursday killed at least 20 people, 14 of them at a Dnipro railway platform.", "paras": ["Ukraine’s long-range units were told in mid-October that strikes on Russian refineries were effectively on hold until after the U.S. midterms, The Wall Street Journal reported Thursday, according to Reuters, which could not verify it. Russian attacks Thursday killed at least 20 people, 14 of them at a Dnipro railway platform. A local truce in occupied <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Oleshky<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>A town on the Dnipro’s occupied left bank in Kherson region; the truce runs to Nov. 1, the first on a large stretch of the front, Meduza reported.<\/span><\/button> held into a third day, and ombudsman <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Dmytro Lubinets<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>He and his Russian counterpart, Yana Lantratova, have been the channel for prisoner exchanges; no Ukrainian official of his rank had entered occupied territory before.<\/span><\/button> entered the town."], "why": "Pausing the refinery campaign eases pressure on Russian fuel revenue and on world diesel, a concession Kyiv appears to make before three-way talks next month.", "c": {"L": 0, "LL": 2, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Reuters via Arab News", "u": "https://www.arabnews.com/world/ukraine-pauses-refinery-strikes-after-trump-pressure-as-russian-attacks-kill-at-least-20-3008931", "t": "C"}, {"n": "Reuters via MarketScreener", "u": "https://www.marketscreener.com/news/ukraine-pauses-strikes-on-russian-refineries-after-pressure-from-trump-wsj-reports-ce785fdade8ef427", "t": "C"}, {"n": "CNN", "u": "https://www.cnn.com/2026/10/29/europe/russia-ukraine-strikes-dnipro-train-station-intl", "t": "LL"}, {"n": "Washington Post", "u": "https://www.washingtonpost.com/world/2026/10/29/russia-ukraine-war-oleshky-melania-trump-putin/8d8bcad4-d380-11f1-9931-2a41b76fc976_story.html", "t": "LL"}, {"n": "Meduza", "u": "https://meduza.io/en/feature/2026/10/29/if-this-works-it-will-be-the-first-real-ceasefire-across-a-large-stretch-of-the-front-russia-and-ukraine-maintain-truce-in-occupied-oleshky-for-more-than-two-days", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-30/s11.webp?h=e5cf2004", "col": "#4c4f51", "cap": "", "credit": "Alexxx1979, CC BY-SA 4.0 / Wikimedia Commons", "pull": null}, {"id": "s12", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "Patrick Stewart, the Shakespearean actor who became Star Trek’s Captain Picard, dies at 86", "s": "Patrick Stewart, who played Captain Jean-Luc Picard for seven seasons of “Star Trek: The Next Generation” and Professor Charles Xavier in the “X-Men” films, died Wednesday at his Los Angeles home at 86, his spokeswoman said Thursday. She cited “a brief and poignant journey with Alzheimer’s Disease and Lewy Body Dementia.”", "paras": ["Patrick Stewart, who played Captain Jean-Luc Picard for seven seasons of “Star Trek: The Next Generation” and Professor Charles Xavier in the “X-Men” films, died Wednesday at his Los Angeles home at 86, his spokeswoman said Thursday. She cited “a brief and poignant journey with Alzheimer’s Disease and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Lewy Body Dementia<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The second most common progressive dementia, caused by protein deposits in the brain and often marked by visual hallucinations and movement problems.<\/span><\/button>.” His wife, Sunny Ozell, cared for him, Fox News reported.", "Stewart came from the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Royal Shakespeare Company<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>He joined it in 1966; decades later he and Ian McKellen played “Waiting for Godot” and “No Man’s Land” together on Broadway and in London.<\/span><\/button> and returned to the stage throughout his career, earning a Tony nomination for “Macbeth” and Emmy nominations for “Moby Dick,” “The Lion in Winter,” “Extras” and “Hamlet.” He revived Picard for three seasons on Paramount+ from 2020. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Knighted<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The honor came in 2010, for services to drama.<\/span><\/button>, he is survived by his children, Sophia and Daniel."], "why": "Few actors moved as freely between Shakespeare and franchise television, and his Picard made a classically trained lead the model for prestige genre TV.", "c": {"L": 0, "LL": 2, "C": 2, "LR": 0, "R": 1}, "src": [{"n": "Fox News", "u": "https://www.foxnews.com/entertainment/patrick-stewart-legendary-star-trek-x-men-actor-dies-86", "t": "R"}, {"n": "NPR", "u": "https://www.npr.org/2026/10/29/1230906945/patrick-stewart-dead", "t": "LL"}, {"n": "CNN", "u": "https://www.cnn.com/2026/10/29/entertainment/patrick-stewart-death", "t": "LL"}, {"n": "The Hollywood Reporter", "u": "https://www.hollywoodreporter.com/movies/movie-news/patrick-stewart-dead-star-trek-x-men-1236742932/", "t": "C"}, {"n": "Variety", "u": "https://variety.com/2026/tv/news/patrick-stewart-dead-star-trek-picardx-men-xavier-1236934412/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}, {"id": "s13", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "Skydance merges CBS Sports and TNT Sports under one rights chief as several senior executives leave", "s": "David Berson, chairman of Skydance’s global sports group, named the leadership of the combined CBS Sports and TNT Sports in a memo Thursday, Front Office Sports reported, with Dan Weinberg running programming including rights acquisition and Craig Barry as chief content officer. TNT finance chief Sophia Constantinides, TNT Sports Ventures president Patrick Crumb and CBS Sports veteran Harold Bryant are leaving, and layoffs were confirmed without a number.", "paras": ["David Berson, chairman of Skydance’s global sports group, named the leadership of the combined CBS Sports and TNT Sports in a memo Thursday, Front Office Sports reported, with Dan Weinberg running programming including <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">rights acquisition<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The unit holds CBS’s NFL and March Madness packages alongside TNT’s NHL and NASCAR rights, so one executive will negotiate across both books.<\/span><\/button> and Craig Barry as chief content officer. TNT finance chief Sophia Constantinides, TNT Sports Ventures president Patrick Crumb and CBS Sports veteran Harold Bryant are leaving, and layoffs were confirmed without a number. The outlet discloses that <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">RedBird Capital<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Gerry Cardinale’s firm co-invested in the Ellison-led takeover of Paramount and owns the Italian club AC Milan.<\/span><\/button> invests in both it and Skydance."], "why": "Two rights portfolios under one negotiator give Skydance more leverage with leagues, which now face one fewer bidder.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Front Office Sports", "u": "https://frontofficesports.com/article/skydance-cbs-tnt-wbd-shakeup/", "t": null}, {"n": "Sports Media Watch", "u": "https://www.sportsmediawatch.com/2026/10/skydance-leadership-combined-cbs-tnt-sports-division/", "t": "C"}, {"n": "Deadline", "u": "https://deadline.com/2026/10/skydance-sports-david-berson-sets-exec-roster-1237208368/", "t": "C"}, {"n": "TheWrap", "u": "https://www.thewrap.com/culture-lifestyle/sports/skydance-sports-executive-roster-set/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-30/s13.webp?h=29a8a257", "col": "#3a3a3e", "cap": "", "credit": "Epicgenius, CC BY-SA 4.0 / Wikimedia Commons", "pull": null}], "week": [], "cover": "img/2026-10-30/s1.webp?h=8de49911"}, {"date": "2026-10-29", "no": 154, "min": 9.0, "stand": "Alphabet’s spending outruns its cash, the Fed holds with two hawks dissenting, and a judge refuses to set aside California ballots.", "note": "Editor’s note. 13 items at 2,153 read-words, under the ten-minute cap. The Splash runs Alphabet and Microsoft together and runs alone on the Front; the Fed leads Markets &amp; Deals and carries the rates lane. Not run: Google’s Gemini 4 Carbon cyber model (first-party benchmarks, one independent report); Ernie Johnson leaving Inside the NBA after 37 years (one outlet); the Supreme Court’s Nov. 2 argument in Younge v. Fulton County on unpleaded defenses; unsealed terms giving Netflix a first-negotiation right on UFC rights (reported Oct. 27); the Bank of Canada’s reported hike to 2.5% (official release not confirmed); Anthropic’s AI for Science expansion; the Brewers’ first World Series title (final score not confirmed). Watch: the Monte dei Paschi vote on Intesa’s roughly €35 billion bid today, where a bloc above one third opposes the defense plan; Amazon’s results; the seven-year auction; the Public Investment Fund’s LIV Golf decision Friday; Israel’s double-envelope count; GFL bids Nov. 9; Election Day Tuesday. Sourcing limits: Reuters, AP, The Wall Street Journal, the New York Times, the BBC and the Hollywood trades could not be opened directly, so several items rest on syndicated copies or reports citing them; the Marvell, Cloudflare and Barkley items are single-source; no Fed press-conference remarks were confirmed. One item concerns Anthropic, whose model compiles this paper.", "items": [{"id": "s1", "sec": "The Front", "sid": "s-front", "h": "Alphabet’s cash flow turns negative and its shares slide 9% as Microsoft’s Azure grows 48% on the same night", "s": "Alphabet reported third-quarter revenue of $127.6 billion on Wednesday, up 25%, but free cash flow of minus $9.1 billion after $51.4 billion of capital spending, and its shares fell more than 9% after hours, SiliconANGLE reported. Net income dropped to $26.2 billion from $35.0 billion, pulled down by an $8.7 billion net loss on equity securities, and long-term debt reached $125.1 billion, up from $46.5 billion at the end of 2025, according to the company’s release.", "paras": ["Alphabet reported third-quarter revenue of $127.6 billion on Wednesday, up 25%, but free cash flow of minus $9.1 billion after $51.4 billion of capital spending, and its shares fell more than 9% after hours, SiliconANGLE reported. Net income dropped to $26.2 billion from $35.0 billion, pulled down by an $8.7 billion <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">net loss on equity securities<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Alphabet marks its stakes in private companies to market each quarter, so the swing is not operating; a year earlier the same line produced a $10.7 billion gain.<\/span><\/button>, and long-term debt reached $125.1 billion, up from $46.5 billion at the end of 2025, according to the company’s release.", "<button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Google Cloud<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Its revenue includes Workspace subscriptions as well as rented computing and chips, so its growth rate is not a like-for-like comparison with Azure.<\/span><\/button> more than doubled to $30.7 billion, with operating income of $11.1 billion, while Search grew 12%. Sundar Pichai said the company is on a “half-trillion dollar revenue run rate,” and the Gemini app passed 1 billion users. Chief financial officer Anat Ashkenazi held 2026 capital spending at $195 billion to $205 billion and said 2027 would exceed $300 billion, SiliconANGLE reported.", "Microsoft, reporting the same evening, said Azure grew 48% to $33.2 billion, the first time it has disclosed the business in dollars, on revenue of $92.3 billion, up 19%. Its <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">commercial remaining performance obligation<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Contracted revenue not yet recognized; it is the backlog that tells investors how much of the new capacity is already sold.<\/span><\/button> rose 73% to $677 billion, and it booked $10 billion of revenue from <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">OpenAI<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Microsoft owns about 24% after the lab’s October 2025 recapitalization, down from about 27%, and its receivables from OpenAI rose to $7.2 billion.<\/span><\/button>, TechCrunch reported. Spending on property and equipment doubled to $39.4 billion, or $45.2 billion counting <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">finance leases<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Data-center capacity rented on long terms and booked like debt-funded property, which is why two capital-spending figures circulate for the quarter.<\/span><\/button>, and the shares rose about 4% late. Chief financial officer Amy Hood said, “We still have demand that exceeds supply,” and guided Azure growth to 49% to 50% in constant currency next quarter, SiliconANGLE reported."], "why": "The two largest cloud builders split on one tape. Microsoft showed the backlog that justifies its spending, while Alphabet showed what the build-out costs before it pays, now funded by bonds rather than cash flow.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Alphabet third-quarter release", "u": "https://s206.q4cdn.com/479360582/files/doc_news/2026/Oct/28/attachments/2026q3-alphabet-earnings-release.pdf", "t": null}, {"n": "SiliconANGLE", "u": "https://siliconangle.com/2026/10/28/alphabets-stock-sinks-after-shocking-investors-with-top-and-bottom-line-miss/", "t": "C"}, {"n": "Microsoft release", "u": "https://www.microsoft.com/en-us/investor/earnings/fy-2027-q1/press-release-webcast", "t": null}, {"n": "TechCrunch on Azure", "u": "https://techcrunch.com/2026/10/28/microsoft-just-shared-azures-actual-revenue-in-dollars-33-2-billion/", "t": "C"}, {"n": "TechCrunch on OpenAI", "u": "https://techcrunch.com/2026/10/28/microsoft-recorded-10-billion-in-revenue-from-openai/", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-10-29/s1.webp?h=4d2d22a7", "col": "#252626", "cap": "The main Google campus in Mountain View, California.", "credit": "Austin McKinley, CC BY 3.0 / Wikimedia Commons", "pull": {"text": "“Right now, Alphabet earns more selling AI to its rivals than using it itself.”", "attr": "Thomas Monteiro, Investing.com, via SiliconANGLE, Oct. 28"}}, {"id": "s2", "sec": "AI", "sid": "s-ai", "h": "Anthropic adds prebuilt legal workflows to Claude, with tools built by Harvey, Goodwin, Foley and PwC", "s": "Anthropic has added a gallery of prebuilt legal workflows, which it calls Artifacts, to Claude, Artificial Lawyer reported on Wednesday. Anthropic’s own include a cite check that flags wrong quotations, wrong page numbers and unsupported claims, a jurisdiction survey matrix, a matter board, a playbook deviation board and a regulatory horizon scan.", "paras": ["Anthropic has added a gallery of prebuilt legal workflows, which it calls Artifacts, to Claude, Artificial Lawyer reported on Wednesday. Anthropic’s own include a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">cite check<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Anthropic’s design has Claude make the first pass and a lawyer sign off, the division courts have demanded since sanctioning briefs that cited invented cases.<\/span><\/button> that flags wrong quotations, wrong page numbers and unsupported claims, a jurisdiction survey matrix, a matter board, a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">playbook deviation<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A contract is compared against a firm’s standard positions, and each exception is routed to an approver rather than fixed automatically.<\/span><\/button> board and a regulatory horizon scan.", "Outside builders supplied the rest: Goodwin an AI governance benchmark, Foley &amp; Lardner an obligations checker for pre- and post-closing covenants, PwC a subpoena response tool, and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Harvey<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The legal-AI startup, last valued at $15.5 billion, competes with Anthropic for law-firm budgets yet now distributes a product through Claude.<\/span><\/button> an intake tool that routes legal requests from inside Claude. A Legal Ambassadors Program and an access-to-justice program were also announced. No pricing was given, and the trade site wrote that “Claude for Legal is really just Claude.” Anthropic also added team spending reports and pooled token budgets, TechCrunch reported."], "why": "Two large firms are building product on a model vendor’s platform, and a rival chose distribution over distance. Anthropic’s model compiles this paper.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Artificial Lawyer", "u": "https://www.artificiallawyer.com/2026/10/28/anthropic-increases-legal-vertical-push-with-artifacts/", "t": null}, {"n": "TechCrunch (spending tools)", "u": "https://techcrunch.com/2026/10/28/anthropic-just-launched-tools-to-show-companies-what-their-ai-spending-is-buying/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}, {"id": "s3", "sec": "AI", "sid": "s-ai", "h": "Canada’s four largest banks move to block third-party AI agents such as Meta’s Muse", "s": "Royal Bank of Canada told staff in a Tuesday memo that it is restricting third-party AI agents such as Meta’s Muse pending a “full security review,” Bloomberg reported on Wednesday, and Bank of Montreal, Toronto-Dominion and Scotiabank said they are taking similar steps.", "paras": ["Royal Bank of Canada told staff in a Tuesday memo that it is restricting third-party AI agents such as Meta’s Muse pending a “full security review,” Bloomberg reported on Wednesday, and Bank of Montreal, Toronto-Dominion and Scotiabank said they are taking similar steps. RBC’s head of AI, <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Bruce Ross<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>In an Oct. 22 interview with The Logic he said the unsettled question is who bears the loss when an agent moves money without authority.<\/span><\/button>, has said the bank must be able to stop unauthorized agent activity, in a country without <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">open-banking rules<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Without regulated data channels, an agent reaches an account by logging in as the customer, which leaves the bank unable to tell the person from the software.<\/span><\/button>. Charles Schwab and JPMorgan Chase already block such agents, Gizmodo reported this month."], "why": "Banks, not regulators, are writing the first rules for AI agents that touch money.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Bloomberg", "u": "https://news.bgov.com/artificial-intelligence/rbc-to-block-ai-agents-calling-out-unacceptable-client-risk", "t": "C"}, {"n": "The Logic", "u": "https://thelogic.co/?p=2139853", "t": "C"}, {"n": "Gizmodo (U.S. banks, Oct. 16)", "u": "https://gizmodo.com/after-muse-launch-u-s-banks-are-saying-hell-no-to-ai-agents-moving-money-2000827221", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-29/s3.webp?h=2fe4c376", "col": "#312d2b", "cap": "", "credit": "Ken Lund from Reno, Nevada, USA, CC BY-SA 2.0 / Wikimedia Commons", "pull": null}, {"id": "s4", "sec": "Markets & Deals", "sid": "s-mkt", "h": "The Fed holds at 3.75% to 4% as Cook and Hammack dissent for a hike, and long yields rise", "s": "The Federal Reserve left its benchmark range at 3.75% to 4% on Wednesday by a 10-2 vote, with Lisa Cook and Beth Hammack preferring a quarter-point increase, according to its statement. The committee said inflation “remains elevated,” described activity as expanding at a strong pace and said it “will deliver price stability.”", "paras": ["The Federal Reserve left its benchmark range at 3.75% to 4% on Wednesday by a 10-2 vote, with <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Lisa Cook<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>Trump tried to remove her in 2025, so her vote for tighter policy cuts against reading the board’s divisions as partisan.<\/span><\/button> and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Beth Hammack<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>The Cleveland Fed president and a former Goldman Sachs treasurer, she holds one of the rotating regional votes this year.<\/span><\/button> preferring a quarter-point increase, according to its statement. The committee said inflation “remains elevated,” described activity as expanding at a strong pace and said it “will deliver price stability.” It raised rates in September.", "Treasury yields <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">bear-steepened<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Long yields rising faster than short ones, the pattern when markets price inflation or heavy government borrowing rather than near-term cuts.<\/span><\/button>: the two-year par yield fell to 4.67% from 4.70%, while the 10-year rose to 5.05% from 4.99% and the 30-year to 5.37% from 5.30%, Treasury data show. Traders had priced a hold at roughly 84% to 91% beforehand, Trading Economics and Kiplinger reported. Officials gave little guidance on December, saying decisions depend on incoming data, Trading Economics reported. A seven-year note auction is due Thursday."], "why": "With the 30-year near 5.4% and two officials pushing for more, the price of the debt-funded AI build-out in the Splash keeps rising.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Federal Reserve statement", "u": "https://www.federalreserve.gov/newsevents/pressreleases/monetary20261028a.htm", "t": null}, {"n": "U.S. Treasury yield curve", "u": "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_yield_curve&field_tdr_date_value_month=202610", "t": "C"}, {"n": "Trading Economics", "u": "https://tradingeconomics.com/united-states/government-bond-yield/news/592994", "t": "C"}, {"n": "Kiplinger", "u": "https://www.kiplinger.com/investing/live/fed-meeting-updates-and-commentary-october-2026", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-29/s4.webp?h=e62abb58", "col": "#3e4a56", "cap": "The Eccles Building in Washington.", "credit": "Federalreserve, Public domain / Wikimedia Commons", "pull": null}, {"id": "s5", "sec": "Markets & Deals", "sid": "s-mkt", "h": "GFL Environmental sets a Nov. 9 deadline for take-private bids and raises its outlook", "s": "GFL Environmental said Wednesday that a special committee of independent directors is reviewing unsolicited proposals to take the company private and has asked for updated bids by Nov. 9, with no assurance of a deal. It raised 2026 revenue guidance by about 7% after third-quarter revenue rose 27.2%, according to its 6-K filing.", "paras": ["GFL Environmental said Wednesday that a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">special committee<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Required here because founder and chief executive Patrick Dovigi is a large holder, so management could end up on the buying side of a bid.<\/span><\/button> of independent directors is reviewing unsolicited proposals to take the company private and has asked for updated bids by Nov. 9, with no assurance of a deal. It raised 2026 revenue guidance by about 7% after third-quarter revenue rose 27.2%, according to its <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">6-K filing<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The form a foreign private issuer uses to furnish material news; GFL trades in New York but is incorporated in Ontario.<\/span><\/button>. It also noted its pending purchase of SECURE Waste. Private Equity Wire has reported rival consortia led by Blackstone and Brookfield."], "why": "A contested sponsor auction now has a hard date, and the committee’s process is the test for any board with a founder on both sides.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "GFL release, SEC EDGAR", "u": "https://www.sec.gov/Archives/edgar/data/0001780232/000110465926119630/tm2626649d2_ex99-1.htm", "t": null}, {"n": "Private Equity Wire", "u": "https://www.privateequitywire.co.uk/blackstone-and-brookfield-lead-rival-pe-consortia-in-gfl-takeover-race/", "t": "C"}, {"n": "Waste Dive", "u": "https://www.wastedive.com/news/gfl-take-private-equity-offers-investor-analysis-deal-breakdown/824827/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-10-29/s5.webp?h=5f910b59", "col": "#37332c", "cap": "", "credit": "Unnerving duck, CC BY-SA 4.0 / Wikimedia Commons", "pull": null}, {"id": "s6", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Marvell is said to be near
