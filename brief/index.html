s pulled out of Utah, and if it returns, so will the charges.” Utah’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">civil suit<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Litigation<\/span>It seeks up to about $61 million. The founders’ arraignment had been set for Dec. 4.<\/span><\/button> continues, and the CFTC has sued Utah on preemption."], "why": "A state got a federally registered exchange to leave by charging its founders personally. The preemption fight now runs through the CFTC’s own suit.", "c": {"L": 0, "LL": 1, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "Front Office Sports", "u": "https://frontofficesports.com/article/utah-drops-criminal-charges-after-kalshi-exit/", "t": null}, {"n": "KUER (NPR Utah)", "u": "https://www.kuer.org/politics-government/2026-11-24/kalshi-prediction-market-gambling-utah-drops-criminal-charges", "t": "LL"}, {"n": "Utah News Dispatch (via Yahoo)", "u": "https://www.yahoo.com/news/politics/articles/utah-dismisses-criminal-charges-against-184126013.html", "t": null}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-25/s8.webp?h=6f23a6d4", "col": "#433525", "cap": "", "credit": "GyozaDumpling, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "12", "l": "felony counts for promoting online gambling"}}, {"id": "s9", "sec": "The World", "sid": "s-world", "h": "Houthi strike hits Riyadh’s fund tower a second time, injuring 11", "s": "The Public Investment Fund’s tower in Riyadh was struck again on Tuesday, five days after the first attack, and Saudi Civil Defence said 11 people were injured, Reuters and AFP reported. The coalition struck Hodeidah port on Wednesday, The National reported.", "paras": ["The Public Investment Fund’s tower in Riyadh’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">King Abdullah Financial District<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>The district also houses the Saudi stock exchange’s headquarters, and Aramco’s tower was hit earlier in November.<\/span><\/button> was struck again on Tuesday, five days after the first attack, and Saudi Civil Defence said <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">11 people<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Casualties<\/span>Two were Saudi, four Egyptian, three Nepali and two Indian, according to Saudi Civil Defence.<\/span><\/button> were injured, Reuters and AFP reported. At least two are in critical condition with severe burns, and several of the injured were repairing damage from the Nov. 19 strike, AFP said. Coalition spokesman Turki al-Malki called it “a cowardly terrorist attack.”", "On Wednesday the coalition struck what it called operational capabilities at <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Hodeidah<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>The port handles about 80 percent of Yemen’s humanitarian aid and 70 percent of its commercial imports, The National reported.<\/span><\/button> port after an evacuation warning, The National reported, and four drones were downed over Ras Tanura, AFP said. Houthi spokesman Yahya Saree said “the port of Jeddah and all enemy Saudi ports along the Red Sea coast” would be targets. Secretary of State Marco Rubio condemned the attacks in a call with the Saudi foreign minister, the State Department said. A coalition strike on vehicles in Lahj on Tuesday killed 26 people, local officials told AFP."], "why": "Repeated hits on the building that houses the kingdom’s sovereign fund put a risk premium on Saudi capital raising and the Gulf deal flow that runs through Riyadh.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "AFP (via SBS)", "u": "https://www.sbs.com.au/news/article/riyadh-saudi-arabia-houthis-us-condemnation/vqi5vb2eb", "t": null}, {"n": "Reuters (via Dawn)", "u": "https://www.dawn.com/news/2046804/11-injured-as-riyadh-skyscraper-hit-second-time-in-less-than-a-week", "t": "C"}, {"n": "AFP (via CP24)", "u": "https://www.cp24.com/news/world/2026/11/24/saudi-skyscraper-hit-again-coalition-slams-terrorist-attack/", "t": "C"}, {"n": "The National", "u": "https://www.thenationalnews.com/news/mena/2026/11/25/saudi-led-coalition-strikes-hodeidah-port-after-riyadh-attack/", "t": null}, {"n": "Middle East Eye", "u": "https://www.middleeasteye.net/news/riyadhs-landmark-pif-tower-struck-aerial-attack-second-time-five-days", "t": null}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-25/s9.webp?h=efcef4e1", "col": "#443429", "cap": "The King Abdullah Financial District in Riyadh.", "credit": "Ahmed, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "kp": ["Eleven people were hurt in the second strike on the fund’s tower.", "The coalition hit Hodeidah port on Wednesday after a warning.", "The Houthis named Jeddah and other Red Sea ports as targets."], "bg": "The Saudi and Houthi war resumed in July. The first strike on the tower on Nov. 19 caused no injuries. In October a strike on King Khalid airport killed 14 and halted flights for two weeks, AFP reported, and Houthi forces are about 60 kilometers from Aden.", "nx": "", "fig": {"v": "26", "l": "killed in a coalition strike in Lahj"}}, {"id": "s10", "sec": "The World", "sid": "s-world", "h": "Japan will prepay its 2027 ICC dues ahead of U.S. sanctions", "s": "Japan, the court’s largest funder at about 15 percent of its budget, will pay its 2027 contribution by the end of this year rather than in April or later, Reuters reported. U.S. sanctions take full effect in April 2027.", "paras": ["Prime Minister Sanae Takaichi told International Criminal Court President Tomoko Akane on Tuesday that Japan, the court’s largest funder at about 15 percent of its budget, will pay its 2027 contribution by the end of this year rather than in April or later, Reuters reported. The money lands before U.S. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">sanctions<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Law<\/span>Imposed Oct. 9 on the court as an institution, with a six-month grace period and carve-outs for telecoms, software and pensions, Al Jazeera reported.<\/span><\/button> take full effect in April 2027. Akane said the court would use it “to ensure its survival and to pay staff salaries,” and officials fear losing <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">banking access<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Mechanism<\/span>Belgium has urged activating the EU Blocking Statute, which bars EU firms from complying with listed foreign sanctions, Al Jazeera reported.<\/span><\/button>, AFP reported."], "why": "When a court’s banks fear U.S. sanctions, its survival becomes a payments problem. Prepaying is how allies keep it solvent through the grace period.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "Reuters (via Daily Maverick)", "u": "https://www.dailymaverick.co.za/article/2026-11-24-japan-accelerates-icc-funding-as-us-sanctions-threaten-court/", "t": "C"}, {"n": "AFP (via GMA)", "u": "https://www.gmanetwork.com/news/topstories/world/1010674/japan-says-to-advance-icc-funding-after-us-sanctions/story/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": ""}, {"id": "s11", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "Netflix buys the Radford lot for $380 million, a fifth of its 2021 price", "s": "Netflix agreed on Tuesday to buy Radford Studio Center in Studio City after a Goldman Sachs-led group of lenders took the lot back from Hackman Capital Partners at a foreclosure auction, Deadline reported. With the transfer tax, the cost comes to about $400 million.", "paras": ["<button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Netflix<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Finance<\/span>It cut its 2026 free cash flow estimate from $12.5 billion to $12 billion in October, citing this purchase, the Los Angeles Times reported.<\/span><\/button> agreed on Tuesday to buy <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Radford Studio Center<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>The lot opened in 1928. ZVantage will manage it for Netflix, with Cinelease supplying equipment, Deadline reported.<\/span><\/button> in Studio City for $380 million after a Goldman Sachs-led group of lenders took the lot back from Hackman Capital Partners at a foreclosure auction, Deadline reported. Hackman and Square Mile bought the 55-acre, 22-stage lot from ViacomCBS for $1.85 billion in 2021 and defaulted on a $1.1 billion mortgage in January. With the city’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Measure ULA<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Law<\/span>Los Angeles’ transfer tax on large property sales, charged here at its top 5.5 percent rate and paid by the buyer.<\/span><\/button> transfer tax, the cost comes to about $400 million.", "It is Netflix’s first owned lot in Los Angeles; it leases more than 700,000 square feet at Sunset Studios through 2031 and is building a $1 billion complex in New Jersey. “This city is home to us,” the company said. Hackman said it was “disappointed.” David Smith of Pepperdine said Netflix is “stepping at the bottom of the cycle to buy some significant L.A. infrastructure.”"], "why": "A studio lot sold at a 79 percent markdown is a distressed-debt story as much as a Hollywood one. Netflix buys production capacity cheaply while the lenders take the loss.", "c": {"L": 0, "LL": 1, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Deadline (via Yahoo)", "u": "https://uk.news.yahoo.com/done-deal-netflix-buys-radford-201429437.html", "t": null}, {"n": "NBC Los Angeles", "u": "https://www.nbclosangeles.com/news/local/netflix-radford-studio-center/3974855/", "t": "LL"}, {"n": "Bisnow", "u": "https://www.bisnow.com/news/los-angeles/office/netflix-closes-on-radford-studio-lot-for-380m", "t": "C"}, {"n": "Los Angeles Times (via The Derrick)", "u": "https://www.thederrick.com/news/entertainment/netflix-to-buy-radford-studio-center-in-380-million-deal/article_42cf1e46-4f55-54bc-8c0f-e1c145e16df0.html", "t": null}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-25/s11.webp?h=9a8f7626", "col": "#433526", "cap": "Soundstage 2 on the Radford lot, photographed when it was CBS Studio Center.", "credit": "Cbl62, CC BY-SA 3.0 / Wikimedia Commons", "pull": null, "kp": ["Netflix pays $380 million, about $400 million with transfer tax.", "Lenders led by Goldman Sachs took the lot at a foreclosure auction.", "The lot sold for $1.85 billion in 2021."], "bg": "Hackman Capital Partners and Square Mile bought the lot from ViacomCBS in 2021 at the top of the streaming boom and defaulted on its $1.1 billion mortgage in January. The site has 210,000 square feet of offices alongside its 22 stages.", "nx": "", "fig": {"v": "$1.85 billion", "l": "what the lot sold for in 2021"}}, {"id": "s12", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "CAS gives Senegal back its Africa Cup of Nations title", "s": "A unanimous Court of Arbitration for Sport panel reinstated Senegal’s 1-0 extra-time win over Morocco in the January final in Rabat, AFP reported. Morocco’s federation said it would “pursue all necessary legal avenues.”", "paras": ["A unanimous three-member Court of Arbitration for Sport panel on Tuesday reinstated Senegal’s 1-0 extra-time win over Morocco in the January final in Rabat, setting aside the forfeit that the Confederation of African Football awarded Morocco in March after Senegal walked off over a penalty, AFP reported. The panel held that resuming play was a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">field-of-play<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Doctrine<\/span>The rule keeps arbitrators out of on-pitch calls, which is why the panel held that CAF’s disciplinary Articles 82 and 84 did not apply.<\/span><\/button> decision within the referee’s sole authority. Morocco’s federation said it would “pursue all <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">necessary legal avenues<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Procedure<\/span>An appeal to the Swiss Federal Tribunal must come within 30 days of formal notice, and the court can only annul and send back, Daily Sabah reported.<\/span><\/button>” and alleges contact between an arbitrator and Senegal’s federation president, which both deny."], "why": "Field-of-play deference is sports law’s version of judicial restraint, and it has now decided a continental title.", "c": {"L": 0, "LL": 0, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "AFP (via Jamaica Observer)", "u": "https://www.jamaicaobserver.com/2026/11/25/senegal-regain-afcon-title-appeal-moroccos-expense/", "t": null}, {"n": "The Independent (via Yahoo)", "u": "https://sports.yahoo.com/articles/morocco-vow-further-legal-action-162909978.html", "t": null}, {"n": "Vanguard", "u": "https://www.vanguardngr.com/2026/11/cas-explains-decision-to-restore-senegals-afcon-title/", "t": null}, {"n": "Daily Sabah", "u": "https://www.dailysabah.com/sports/football/moroccos-title-hopes-hinge-on-swiss-court-after-cas-backs-senegal", "t": null}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-25/s12.webp?h=a8685f8d", "col": "#3e3729", "cap": "", "credit": "Fanny Schertzer, CC BY 3.0 / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": ""}, {"id": "s13", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "LIV Golf’s creditors threaten liquidation over a $2 million pot", "s": "LIV Golf’s unsecured creditors’ committee said it would seek conversion to Chapter 7 if no deal is reached by Dec. 4, Front Office Sports reported. Claims may top $1 billion, the committee estimates.", "paras": ["Judge Michael Kaplan of the federal bankruptcy court in New Jersey on Tuesday conditionally approved LIV Golf’s disclosure statement and wind-down plan, but its unsecured creditors’ committee said it would seek conversion to <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Chapter 7<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Counsel<\/span>LIV’s lawyer at Gibson Dunn, Matthew Williams, said conversion “would destroy value for all parties.” Willkie Farr and Fox Rothschild represent the committee.<\/span><\/button> if no deal is reached by Dec. 4, Front Office Sports reported. The plan offers a $2 million pot funded by Saudi Arabia’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Public Investment Fund<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The fund also holds a secured loan of nearly $500 million and put in $49.6 million of debtor-in-possession financing.<\/span><\/button> against claims the committee estimates may top $1 billion, from creditors including Jon Rahm and Bryson DeChambeau. It yields “materially less than one cent on the dollar,” the committee said."], "why": "The sovereign fund is both the secured lender and the source of the $2 million, so the creditors’ only leverage is the threat of a trustee.", "c": {"L": 0, "LL": 0, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "Front Office Sports", "u": "https://frontofficesports.com/article/liv-golf-creditors-threaten-chapter-7-liquidation-over-2m-offer/", "t": null}, {"n": "GolfMagic", "u": "https://www.golfmagic.com/tour/liv-golf/liv-golf-bankruptcy-takes-dramatic-turn-creditors-reject-2m-recovery-offer", "t": null}, {"n": "Bankruptcy Observer", "u": "https://www.bankruptcyobserver.com/news/liv-golf-disclosure-statement-conditionally-approved-voting-deadline", "t": null}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": ""}], "week": [], "cover": "img/2026-11-25/s1.webp?h=096dedde"}, {"date": "2026-11-24", "no": 180, "min": 9.5, "stand": "Nvidia brings Jensen Huang back and adds nearly a trillion dollars in a day; Sanofi bids $41 billion for Insmed; a New York judge lets Kalshi keep trading; and NATO sends an early-warning plane to Poland.", "note": "Editor’s note. 12 items at 2,290 read-words, inside the ten-minute cap. Disclosure: no item today concerns Anthropic, whose model compiles this paper. The Nvidia account rests on the company’s Form 8-K, read by the reporter, with closing figures from Motley Fool and Fox News; Fox’s claim of a record one-day gain was not independently checked, and CNN, NBC and TIME were seen but could not be opened. The Sanofi and Insmed terms are the companies’ own; CNBC and Reuters were seen only as headlines. The 2-year auction figures come from a data aggregator, Helious, with TipRanks confirming the 4.70 percent clearing level; TreasuryDirect was not reached, so treat them as single-source. The Kalshi hearing was virtual and is reported from Front Office Sports and Forbes; Bloomberg and Law.com headlines describe Kalshi as agreeing to limit younger users, which no opened account confirmed, so it is not reported here. The NATO and Estonia items rest on Reuters, Al Jazeera, RTÉ and regional outlets; the New York Times, BBC, AP, the Guardian, NPR, Fox News and National Review were searched and returned nothing from the window. Not run: the Fourth Circuit ruling that Virginia may not enforce its mask ban on federal immigration officers (a single opened source); the final toll of 11 dead in the Russian strike on Dymer; Iran’s vow to use all means against the U.S. blockade; Zelensky’s appeal to the NATO Parliamentary Assembly; ConocoPhillips’ $4.4 billion sale of its Norway business to Vår Energi, announced before the window; ABB’s $2.65 billion purchase of Ziehl-Abegg; Amazon’s reported $7.5 billion deal for Decart (one Bloomberg source); the Quebecor and Telus chief executives’ meeting in Ottawa, which had no national confirmation; Simon Property’s $1 billion bond reopening; the Super Bowl in IMAX (one source). Cut for length: Shawn Levy’s 21 Laps leaving Netflix for a first-look film deal at Sony, which will be offered again on a fresh beat. Magnitude check: the largest deal in the window is Sanofi and Insmed at about $41 billion, which runs on the Front; CrowdStrike and Zscaler ran Monday; the largest contested bid remains Quebecor’s for Telus. South Florida was quiet: no local deal, ruling or filing cleared the bar. Watch: Sanofi’s call at 8 a.m.; the $70 billion 5-year auction at 1 p.m.; the LIV Golf bankruptcy hearing today; Kalshi’s Nov. 30 report; Estonia’s border closure and baseball’s labor deadline on Dec. 1; Huang’s House interview Dec. 1 and Senate testimony Dec. 3; the SEC presidents’ vote on LSU Dec. 3.", "items": [{"id": "s1", "sec": "The Front", "sid": "s-front", "h": "Nvidia reinstates Jensen Huang six days after ruling it out", "s": "Nvidia’s board voted unanimously on Monday to reinstate Jensen Huang “with immediate effect,” the company said, after “receiving input from senior U.S. government officials.” Shares closed at $165.05, Motley Fool reported.", "paras": ["Nvidia’s board voted unanimously on Monday to reinstate Jensen Huang as president, chief executive and director “with immediate effect,” the company said in a securities filing, six days after it said it did not intend to bring him back. The board said it acted after “receiving <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">input from senior U.S. government officials<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Provenance<\/span>Platformer cited reports that Vice President Vance worked with the board and that President Trump personally called board members. The filing names no official.<\/span><\/button>” and was confident his return posed no national security risk. Colette Kress, the finance chief who served as interim chief executive, goes back to that job.", "Shares closed at $165.05, <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">up 31.48 percent<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Context<\/span>AMD rose 6.85 percent the same day, Motley Fool reported, so the move was far more than a chip-sector rally.<\/span><\/button>, Motley Fool reported, and the Nasdaq rose 6.51 percent. Fox News put the gain at about $952 billion of market value, which it called the largest one-day gain on record. A committee of independent directors examining “reports of a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">foreign intelligence effort<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Background<\/span>Huang stepped down around Nov. 12 after reports, cited by Fox News, that a former Nvidia executive close to him was alleged to be a source for Chinese intelligence.<\/span><\/button> targeting” Huang will finish its work, the board said. It also created a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">National Security and Export Control Committee<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The export pressure is concrete: Commerce has put Megaspeed, a Singapore cloud partner of Nvidia, on the Entity List, Fox reported, and Platformer reports a Justice Department export-control investigation touching it.<\/span><\/button> of independent directors and began a search for a chief compliance officer who will report to its nominating and governance committee.", "The reaction split by party. President Trump called Huang a “Great Patriot and National Treasure” on Truth Social. House Minority Leader Hakeem Jeffries called the decision “indefensible” and promised an inquiry, and Sen. John Curtis, a Utah Republican, said, “I’d like to know what changed,” Fox News reported. Huang sits for a closed-door House interview on Dec. 1 and testifies before the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Senate Banking Committee<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Its jurisdiction covers the Commerce Department’s export-control bureau, which writes the chip rules at issue, so the session is oversight of the regulator as much as of Nvidia.<\/span><\/button> on Dec. 3."], "why": "A board that ruled out a return on Nov. 17 reversed itself after government input, and the market added nearly a trillion dollars in one session. For governance lawyers, it is a chief-executive decision shaped openly by Washington, now headed into two congressional hearings and an unfinished internal investigation.", "c": {"L": 0, "LL": 2, "C": 0, "LR": 0, "R": 1}, "src": [{"n": "Nvidia (Form 8-K)", "u": "https://www.sec.gov/Archives/edgar/data/0001045810/000104581026000090/nov23pressrelease.htm", "t": null}, {"n": "Fox News", "u": "https://www.foxnews.com/live-news/ai-news-tech-markets-nvidia-11-23-26", "t": "R"}, {"n": "NBC News", "u": "https://www.nbcnews.com/tech/tech-news/nvidia-reinstates-jensen-huang-rcna610864", "t": "LL"}, {"n": "CNN", "u": "https://www.cnn.com/2026/11/23/business/live-news/jensen-huang-reinstated-as-ceo-of-nvidia", "t": "LL"}, {"n": "Platformer", "u": "https://www.platformer.news/jensen-huang-returns-nvidia/", "t": null}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-24/s1.webp?h=e6b4fe99", "col": "#303d17", "cap": "Nvidia’s headquarters in Santa Clara. The board acted on Monday after what it called input from Washington.", "credit": "Coolcaesar, CC BY-SA 4.0 / Wikimedia Commons", "pull": {"text": "I take this responsibility with the greatest humility and renewed commitment.", "attr": "Jensen Huang, Nvidia, Nov. 23"}, "kp": ["The board reinstated Huang unanimously, citing input from senior U.S. government officials.", "Nvidia closed at $165.05, up 31.48 percent, and the Nasdaq rose 6.51 percent.", "Huang faces a House interview on Dec. 1 and a Senate hearing on Dec. 3."], "bg": "Huang left the company around Nov. 12, and Kress ran it as interim chief executive through the Nov. 17 earnings report, when Nvidia guided to about $130 billion of quarterly revenue. On Nov. 17 the board said it did not intend to reinstate him, NPR reported. Three days later Reuters reported that SEC enforcement staff were examining Nvidia’s accounting for a change in geographic reporting tied to Singapore, and the shares fell 14 percent as the S&amp;P 500 closed in correction. The California attorney general is separately investigating whether Nvidia misled investors about China, Fox reported. Monday’s filing does not address either inquiry.", "nx": "Huang’s closed-door House interview is on Dec. 1, Teter’s on Dec. 2, and Huang testifies publicly before Senate Banking on Dec. 3.", "fig": {"v": "$952 billion", "l": "market value added in one session, per Fox News"}}, {"id": "s2", "sec": "The Front", "sid": "s-front", "h": "Sanofi agrees to buy Insmed for $41 billion in cash", "s": "Sanofi agreed to pay $175 a share in cash for the lung-disease drugmaker, a premium of about 46 percent to Insmed’s Nov. 18 close, the companies said. The deal is expected to close in the first half of 2027.", "paras": ["Sanofi agreed on Tuesday to acquire Insmed for $175 a share in cash, valuing the lung-disease drugmaker at about $41 billion, the companies said. The price is a premium of about 46 percent to Insmed’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">unaffected close<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Insmed rose 21 percent after the first takeover report and closed Monday at $149.09, FiercePharma said, so the premium to its last trade is about 17 percent.<\/span><\/button> on Nov. 18, the day before reports of a deal. Sanofi will pay with cash and debt under committed financing, expects the deal to add to business earnings per share by the end of 2028, and expects to close in the first half of 2027, after an Insmed shareholder vote and antitrust clearances.", "J.P. Morgan is Sanofi’s exclusive financial adviser, with Cravath, Swaine &amp; Moore as counsel. Goldman Sachs advises Insmed, with Freshfields, Cooley and Hunton Andrews Kurth. Insmed sells <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Brinsupri<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Product<\/span>Approved by the FDA in August 2025 for bronchiectasis, it sold $917 million in its first nine months, FiercePharma reported.<\/span><\/button>, a bronchiectasis drug, and the deal is Sanofi’s largest since Aventis in 2004, FiercePharma said, well past the €25 billion ceiling its finance chief set in April for buying a commercial asset. Sanofi needs growth beyond <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Dupixent<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Product<\/span>The eczema and asthma drug brings in about two-fifths of Sanofi’s revenue and loses patent protection in 2031, FiercePharma noted.<\/span><\/button>. “This acquisition is a major strategic step,” said Belén Garijo, Sanofi’s chief executive."], "why": "The largest deal of the window is an all-cash bet against a patent cliff, funded partly with debt. Expect a large Sanofi bond sale to replace the committed financing; that is analysis, not yet reported.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Insmed", "u": "https://investor.insmed.com/2026-11-24-Sanofi-to-Acquire-Insmed-in-Strategic-Step-that-Strengthens-Long-Term-Future", "t": null}, {"n": "Sanofi", "u": "https://www.sanofi.com/en/media-room/press-releases/2026/2026-11-24-06-30-00-3409002", "t": null}, {"n": "FiercePharma", "u": "https://www.fiercepharma.com/pharma/sanofi-inks-41b-insmed-buyout-post-dupixent-growth-drivers", "t": "C"}, {"n": "CNBC", "u": "https://cnbc.com/2026/11/24/insmed-sanofi-deal-stock-pharma.html", "t": "C"}, {"n": "Reuters (via MarketScreener)", "u": "https://www.marketscreener.com/news/sanofi-strikes-41-billion-deal-to-acquire-us-drugmaker-insmed-ce7851dad18df123", "t": "C"}], "framing": "", "min": 1, "front": true, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": ["Sanofi will pay $175 a share in cash, about $41 billion in all.", "The premium is about 46 percent to Insmed’s Nov. 18 close.", "Closing is expected in the first half of 2027."], "bg": "Reports that Sanofi was circling Insmed surfaced on Nov. 19 and lifted its shares 21 percent, FiercePharma said. Sanofi’s previous large purchase was Genzyme in 2011, at $20.1 billion upfront. The companies disclosed no termination fee in their releases.", "nx": "Sanofi holds an investor call at 8 a.m. Eastern on Tuesday.", "fig": {"v": "$175", "l": "cash per Insmed share"}}, {"id": "s3", "sec": "AI", "sid": "s-ai", "h": "Virginia and Oregon sue SpaceX and X over Grok’s safeguards", "s": "Virginia and Oregon sued SpaceX, X and SpaceX Super Intelligence on Monday in separate state-court suits, alleging that the companies misrepresented the safeguards on Grok, AP reported. Virginia’s complaint cites Grok’s published instruction to “assume good intent.”", "paras": ["The attorneys general of Virginia and Oregon sued SpaceX, X and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">SpaceX Super Intelligence<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>It is the former xAI, which SpaceX acquired in February, making SpaceX the parent of X and Grok, according to the Virginia attorney general.<\/span><\/button> on Monday in <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">separate state-court suits<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Law<\/span>Virginia seeks $2,500 for each willful violation of its Consumer Protection Act, with the total set at trial, plus an injunction and disgorgement.<\/span><\/button>, alleging that the companies misrepresented the safeguards on Grok, which users have used to make sexualized images of real people, including children, AP reported. Virginia’s complaint cites Grok’s published instruction to “assume good intent” and says limiting image tools to paying users “simply made that generation profitable.” “For these Defendants, weak safeguards were not a failure but a feature,” said Attorney General Jay Jones. SpaceX Super Intelligence said such content involving minors “is abhorrent.”"], "why": "A system prompt is now exhibit A for intent. State consumer-protection law is becoming the working AI statute while Congress argues over preemption.", "c": {"L": 1, "LL": 1, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "AP (via KOLD)", "u": "https://kold.com/2026/11/23/states-sue-musk-companies-over-flood-sexualized-images-made-with-ai-chatbot-grok", "t": "C"}, {"n": "The Hill (via Yahoo)", "u": "https://www.yahoo.com/news/us/articles/virginia-oregon-sue-spacex-over-172038584.html", "t": "C"}, {"n": "Al Jazeera", "u": "https://www.aljazeera.com/economy/2026/11/23/us-states-sue-spacex-over-grok-ais-creation-of-child-sexual-abuse-material", "t": "L"}, {"n": "NPR", "u": "https://www.npr.org/2026/11/23/nx-s1-6049124/virginia-oregon-sue-elon-musks-spacexsi-over-deepfake-nonconsensual-sexual-images", "t": "LL"}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/11/23/oregon-virginia-spacex-grok-deepfake-lawsuits.html", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": ["Two states filed separate consumer-protection suits on Monday.", "Virginia cites Grok’s own system prompt as evidence.", "The defendants are SpaceX, X and SpaceX Super Intelligence."], "bg": "Grok’s image generation and editing reached all users in December 2025, the Virginia suit says, and Malaysia and Indonesia imposed temporary bans. X later limited image generation to paying users. SpaceX Super Intelligence says it has sued at least three users over nonconsensual images.", "nx": ""}, {"id": "s4", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Texas Pacific Land buys EagleRock Land in a $3 billion all-stock deal", "s": "EagleRock holders get 0.0831 new TPL shares per Class A share, about $23.56 a share, according to a Monday filing. Holders controlling more than half of EagleRock’s vote signed support agreements.", "paras": ["Texas Pacific Land agreed to buy EagleRock Land for 0.0831 new TPL shares per EagleRock Class A share, about $23.56 a share and $3.0 billion in equity value, according to a Monday filing. EagleRock holders will own about 14 percent. Holders controlling more than half of EagleRock’s vote, including Double Eagle, signed support agreements, and TPL needs no vote of its own. EagleRock owes a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">$96.5 million fee<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The filing mentions no reverse fee payable by TPL, so the deal-break risk runs one way.<\/span><\/button> if it walks. Evercore, Sidley Austin and Haynes Boone advise TPL; Goldman Sachs and Vinson &amp; Elkins advise EagleRock. TPL added $500 million to its buyback."], "why": "A May IPO folded into a bigger peer by November shows how short a public life can be for an Up-CConceptEagleRock’s Class A shares sit beside Class B shares and operating-company units, so the exchange ratio has to reach the unitholders too. issuer whose sponsor keeps voting control.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Texas Pacific Land (8-K)", "u": "https://www.sec.gov/Archives/edgar/data/0001811074/000119312526472518/d166244dex991.htm", "t": null}, {"n": "Reuters (via Boursorama)", "u": "https://www.boursorama.com/bourse/actualites/offres-du-jour-fusions-et-acquisitions-be21154476f01c675cdd6ff83d1dc785", "t": "C"}, {"n": "Latham & Watkins (May IPO)", "u": "https://www.lw.com/en/news/2026/05/latham-advises-on-eaglerock-land-llc-ipo", "t": null}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": ["EagleRock holders get 0.0831 new TPL shares, about $23.56 each.", "Majority holders signed support agreements; TPL needs no vote.", "Closing is expected in the first half of 2027."], "bg": "The combined company holds about 1 million acres of fee surface and about 105,000 water acres in the Permian Basin, the filing says, with water capacity up 49 percent.", "nx": "The deal needs Hart-Scott-Rodino clearance before a first-half 2027 close.", "fig": {"v": "$96.5 million", "l": "fee EagleRock owes if it walks"}}, {"id": "s5", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Williams says inflation is still too high as a December hike nears", "s": "New York Fed President John Williams said inflation is “too high,” Reuters reported. The Treasury sold $69 billion of 2-year notes at 4.700 percent with a bid-to-cover of 2.65, auction data show.", "paras": ["New York Fed President John Williams said on Monday that inflation is “too high” and that he would not rule out raising rates at consecutive meetings, Reuters reported. Earlier, the Treasury sold $69 billion of 2-year notes at 4.700 percent, <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">stopping through<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The opposite of a tail: the auction cleared 0.3 basis point below where the notes traded beforehand, a sign of strong demand.<\/span><\/button> by 0.3 basis point with a bid-to-cover of 2.65, auction data show, though <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">indirect bidders<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The class that includes foreign central banks bidding through the Fed; at 51.5 percent it took 5 points less than its average share.<\/span><\/button> took a thin share. The 2-year closed at 4.63 percent, the 10-year at 4.92 and the 30-year at 5.29, Treasury data show. FedWatch odds of a quarter-point hike on Dec. 9 stood at 96.1 percent, Fox Business said."], "why": "Every deal on this page prices off a curve the Fed may lift again in two weeks. The $70 billion 5-year sale at 1 p.m. Tuesday is the next test of demand.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 1}, "src": [{"n": "Reuters (via Kitco)", "u": "https://www.kitco.com/news/off-the-wire/2026-11-23/feds-williams-says-inflation-still-too-high-signals-more-rate-hikes", "t": "C"}, {"n": "U.S. Treasury", "u": "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_yield_curve&field_tdr_date_value_month=202611", "t": null}, {"n": "Helious (auction data)", "u": "https://helious.io/news/auc-91282CRY9-2026-11-23/2-year-note-auction-in-line", "t": null}, {"n": "Fox Business", "u": "https://www.foxbusiness.com/economy/bill-ackman-says-federal-reserve-about-make-another-mistake", "t": "R"}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/11/23/john-williams-fed-inflation-rate-hikes.html", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": "", "chart": {"type": "line", "t": "Treasury par yields at Monday’s close, percent", "rows": [["2-year", 4.63, "4.63 percent"], ["10-year", 4.92, "4.92"], ["30-year", 5.29, "5.29"]]}}, {"id": "s6", "sec": "Law & the Courts", "sid": "s-law", "h": "A New York judge refuses to halt Kalshi", "s": "Justice Melissa Crane denied the attorney general’s request for a temporary restraining order without reaching the merits, Front Office Sports and Forbes reported. She told the parties to confer on safeguards for users aged 18 to 20 and report by Nov. 30.", "paras": ["Justice Melissa Crane of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">New York State Supreme Court<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Despite the name, it is New York’s trial court. The case returned there after a federal judge, Vernon Broderick, remanded it on Nov. 19.<\/span><\/button> on Monday denied Attorney General Letitia James’s request for a temporary restraining order against Kalshi, without reaching the merits, Front Office Sports and Forbes reported. “It just seems to me that I might be reversed in a minute if I granted the full TRO that you want,” Crane said, adding that an order “doesn’t preserve the status quo because the status quo has been going on for over a year.” She said she was inclined to wait for the U.S. Supreme Court on sports event contracts: “That ultimately will bind me.”", "Kalshi had warned that the order could shut its <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">federal derivatives exchange<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Law<\/span>Kalshi and the CFTC argue the Commodity Exchange Act preempts state gambling law. The Fourth Circuit rejected that argument in Kalshi’s Maryland case last week, widening a split among the circuits.<\/span><\/button> nationwide; the state said it was not seeking that. Crane told the parties to confer on safeguards for users aged 18 to 20 and report by Nov. 30. New York sportsbooks require bettors to be 21. Grant Mainland and Colleen Sinzdak of Milbank argued for Kalshi. The state’s suit seeks at least <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">$36 billion<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Context<\/span>The state’s Gaming Commission had sent Kalshi a cease-and-desist letter in October 2025, Front Office Sports noted, so the claim covers more than a year of trading.<\/span><\/button>."], "why": "The biggest state threat to prediction markets now waits on the Supreme Court. Until then, the fight over users under 21 is where New York can still win something.", "c": {"L": 0, "LL": 1, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Front Office Sports", "u": "https://frontofficesports.com/article/kalshi-notches-win-as-judge-denies-new-york-a-temporary-restraining-order/", "t": null}, {"n": "Forbes (Daniel Wallach)", "u": "https://www.forbes.com/sites/danielwallach/2026/11/23/kalshi-escapes-new-york-tro-but-underage-sports-betting-concerns-loom-over-january-showdown/", "t": "C"}, {"n": "The Block", "u": "https://www.theblock.co/news/regulation/2026-11-23-kalshi-pauses-operations-utah-dodging-ban-new-york-445456", "t": "C"}, {"n": "CNN", "u": "https://www.cnn.com/2026/11/23/politics/judge-kalshi-limiting-bets-under-21", "t": "LL"}, {"n": "Bloomberg", "u": "https://www.bloomberg.com/news/articles/2026-11-23/kalshi-faces-threat-of-nationwide-shutdown-in-new-york-case", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-24/s6.webp?h=a2f0d929", "col": "#2e3e17", "cap": "The New York County Courthouse. Monday’s hearing was held virtually.", "credit": "Ajay Suresh, CC BY 4.0 / Wikimedia Commons", "pull": null, "kp": ["Crane denied the state’s restraining order without reaching the merits.", "The parties report on safeguards for 18-to-20-year-olds by Nov. 30.", "Milbank’s Grant Mainland and Colleen Sinzdak argued for Kalshi."], "bg": "New York sued Kalshi as an unlicensed sports-betting operator. A federal judge sent the case back to state court on Nov. 19, and Judge Lorna Schofield denied the CFTC’s emergency request on Nov. 20. Kalshi also paused operations in Utah on Monday while it awaits a federal ruling there, The Block reported.", "nx": "Opposition papers are due about Dec. 4 and replies about Dec. 11, with an in-person injunction hearing on Jan. 7 or 8, Forbes reported."}, {"id": "s7", "sec": "Law & the Courts", "sid": "s-law", "h": "Orrick matches Cravath in full; K&amp;L Gates pays the scale only for hours", "s": "Orrick matched the $235,000 to $455,000 associate scale and the special bonuses, Above the Law reported. K&amp;L Gates moves associates to the scale only if they log 1,950 creditable hours.", "paras": ["Orrick matched the $235,000 to $455,000 associate scale, Cravath’s year-end bonuses and its <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">special bonuses<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Cravath attached no hours requirement to its specials; Orrick pays them Dec. 31 to associates who meet hours expectations.<\/span><\/button> of $11,000 to $40,000, Above the Law reported on Monday. New salaries take effect Jan. 1 and are paid retroactively on Feb. 15. K&amp;L Gates moves associates to the scale only if they log 1,950 creditable hours, including 1,850 billable and up to 50 for innovation work such as AI, and its memo mentions no specials. The scale began with <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Milbank<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>It set the $235,000 first-year figure in June, effective July 1, with summer specials of $6,000 to $25,000.<\/span><\/button>."], "why": "The match is spreading through Thanksgiving week, and the K&amp;L Gates version shows the next fight: firms paying the number only to associates who bill for it.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "Above the Law", "u": "https://abovethelaw.com/2026/11/orrick-matches-cravath-on-raises-and-bonuses-translated-from-orrick-speak/", "t": null}, {"n": "Above the Law (K&L Gates)", "u": "https://abovethelaw.com/2026/11/biglaw-firm-moves-associates-to-the-cravath-scale-if-they-hit-their-hours/", "t": "C"}, {"n": "The American Lawyer", "u": "https://www.law.com/americanlawyer/2026/11/20/kl-gates-increases-transparency-around-bonuses-boosts-associate-salaries/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "1,950", "l": "creditable hours K&L Gates requires"}}, {"id": "s8", "sec": "The World", "sid": "s-world", "h": "NATO sends an AWACS to Poland; a Russian drone crosses hours later", "s": "NATO’s top commander in Europe authorized the forward deployment of an AWACS to Poland, spokeswoman Allison Hart said. Shortly before midnight local time, a Russian drone entered Polish airspace from Ukraine, Polish officials said.", "paras": ["NATO’s top commander in Europe authorized the forward deployment of an <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">AWACS<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>NATO owns 14 E-3A early-warning aircraft, flown by multinational crews from Geilenkirchen, Germany, UPI reported.<\/span><\/button> to Poland after an extraordinary meeting of allied ambassadors on Monday and is examining further assets, spokeswoman Allison Hart said. “All Allies stand in full solidarity with Poland,” she said. None of the accounts reviewed said Poland invoked <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Article 4<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Law<\/span>The treaty’s consultation clause. Poland last used it in September 2025, after about 20 Russian drones crossed its border.<\/span><\/button>. Two Swedish Gripens on air policing had clearance to fire on the Nov. 20 missiles but could not identify them in time because of weather, Reuters reported.", "Shortly before midnight local time, a Russian drone entered Polish airspace from Ukraine, Polish officials said. Commanders authorized a shootdown but held fire when it turned east, “taking into account the potential threat to civilians.” Radio RMF, citing unnamed sources, said the jet-powered drone flew about 20 kilometers into Poland. “It is difficult to imagine that this was an accident,” Deputy Defense Minister Pawel Zalewski said. The Russian embassy did not respond, Reuters said."], "why": "One aircraft is a modest answer to cruise missiles on alliance soil, and the drone that followed tested it within hours.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "Reuters (via CP24)", "u": "https://www.cp24.com/news/world/2026/11/24/poland-blames-russia-for-drone-incursion-as-fears-grow-of-ukraine-conflict-escalation/", "t": "C"}, {"n": "Notes from Poland", "u": "https://notesfrompoland.com/2026/11/24/nato-to-send-surveillance-aircraft-to-poland-after-russian-missile-strikes/", "t": null}, {"n": "UPI (via Yahoo)", "u": "https://www.yahoo.com/news/us/articles/nato-agrees-send-early-warning-093844222.html", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-24/s8.webp?h=fb00b8b7", "col": "#41362a", "cap": "A NATO E-3A early-warning aircraft from Geilenkirchen, Germany.", "credit": "Airman 1st Class Makenzie Lang, Public domain / Wikimedia Commons", "pull": null, "kp": ["NATO authorized an AWACS deployment to Poland on Monday.", "A Russian drone crossed into Poland hours later and turned back.", "No source reviewed reported an Article 4 request."], "bg": "Three Kh-101 cruise missiles fell in southeastern Poland on Nov. 20 during a mass Russian strike on Ukraine, and Prime Minister Donald Tusk called it a possible deliberate provocation. The missiles were in Polish airspace for about three minutes and injured no one, Reuters said.", "nx": ""}, {"id": "s9", "sec": "The World", "sid": "s-world", "h": "Moscow says Estonia is near “triggering open war” over its border closure", "s": "Russia’s Foreign Ministry summoned Estonia’s chargé d’affaires on Monday, Al Jazeera and Reuters reported. Estonia plans to close every land crossing from Dec. 1 for at least six months.", "paras": ["Russia’s Foreign Ministry summoned Estonia’s chargé d’affaires on Monday and accused Tallinn of “hostile actions” “on the verge of triggering open war,” Al Jazeera and Reuters reported, citing Estonia’s plan to close every land crossing, including <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Narva<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>A majority Russian-speaking city whose castle faces Russia’s Ivangorod fortress across the Narva River.<\/span><\/button>, from Dec. 1 for at least six months. Moscow also accused Estonia of letting Ukrainian drones use its airspace, which Tallinn denies. Estonia ties the closure to an attempted arson at <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Threod Systems<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>An Estonian maker of military drones; Tallinn blames Russian intelligence for the attack on it.<\/span><\/button>. Finland separately summoned Russia’s ambassador over a suspected helicopter incursion, RTÉ reported."], "why": "“Open war” language toward a NATO member, a day after the alliance met over Poland, raises the cost of every incident on the Baltic flank.", "c": {"L": 1, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/23/russia-threatens-hostile-estonia-with-open-war", "t": "L"}, {"n": "Reuters (via CP24)", "u": "https://www.cp24.com/news/world/2026/11/24/poland-blames-russia-for-drone-incursion-as-fears-grow-of-ukraine-conflict-escalation/", "t": "C"}, {"n": "RTÉ", "u": "https://www.rte.ie/news/world/2026/1123/1600353-russia-estonia-finland/", "t": null}, {"n": "Meduza", "u": "https://meduza.io/en/news/2026/11/24/russia-protests-estonia-s-planned-land-border-closure-and-again-accuses-it-of-letting-ukrainian-drones-use-its-airspace", "t": null}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "Dec. 1", "l": "Estonia’s land border closes"}}, {"id": "s10", "sec": "The World", "sid": "s-world", "h": "The EU proposes its 22nd Russia package, aimed at banks and tankers", "s": "The European Commission proposed barring transactions with about 60 more Russian banks and blacklisting more than 70 shadow-fleet tankers, EU Perspectives and UPI reported. The package needs Council approval.", "paras": ["The European Commission on Monday proposed a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">22nd sanctions package<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Context<\/span>It is the first since the 21st was adopted in July; the EU has now listed more than 4,700 people and entities.<\/span><\/button> that would bar transactions with about 60 more Russian banks and cut them from SWIFT, blacklist more than 70 shadow-fleet tankers and ban tankers insured in Russia, EU Perspectives and UPI reported. It would also bar EU firms from servicing Russian refineries and, for the first time, its power sector, and ban entry by Russian former combatants. “They cannot be allowed to wander freely across our countries,” said Ursula von der Leyen. The package needs <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Council approval<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Law<\/span>Sanctions require unanimity among the 27 governments, so a single holdout can stall them; no source named one yet.<\/span><\/button>."], "why": "The service ban reaches EU contractors and the insurance rule reaches shipping desks, which is where sanctions compliance work lands first.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "EU Perspectives", "u": "https://euperspectives.eu/2026/11/russia-eu-22nd-sanctions-package-ukraine-war-peace/", "t": null}, {"n": "UPI (via Yahoo)", "u": "https://www.yahoo.com/news/world/articles/eu-unveils-22nd-russia-sanctions-055125708.html", "t": "C"}, {"n": "Agence Europe", "u": "https://agenceurope.eu/en/bulletin/article/13988/13/european-commission-presents-its-22nd-sanctions-package-which-includes-measures-against-russian-ex-combatants-and-athletes", "t": null}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "about 60", "l": "more Russian banks to be cut from SWIFT"}}, {"id": "s11", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "The SEC seeks to clear the way for a Dec. 3 vote on expelling LSU", "s": "The Southeastern Conference filed an amended complaint on Monday adding coach Will Wade, ESPN and Front Office Sports reported. It accuses LSU of planning to roster RJ Luis Jr. “all along.”", "paras": ["The Southeastern Conference filed an amended complaint on Monday and asked a federal court in Alabama for an order stopping LSU from blocking a Dec. 3 special meeting on “the termination of LSU’s membership,” ESPN and Front Office Sports reported. The complaint adds men’s basketball coach Will Wade and accuses LSU of planning to roster RJ Luis Jr., a former St. John’s guard who took part in NBA preseason, “all along.” Expulsion needs <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">two-thirds of the other 15 presidents<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Math<\/span>Ten votes. The conference concedes it has no other way to penalize LSU under its own rules, ESPN reported, which is why the vote carries the case.<\/span><\/button>.", "LSU rostered Luis on Nov. 17 under a Louisiana court injunction, and he scored 11 points the next night. On Nov. 19 the university’s president told Wade not to play him, and Luis left the team. The reversal gives “the SEC no comfort,” the filing says. The conference grounds the expulsion in a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">right not to associate<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Law<\/span>The conference casts it as a First Amendment interest. Several schools had already weighed boycotting LSU basketball games, one source told Front Office Sports.<\/span><\/button>. Luis’s lawyers have asked a Louisiana court to hold Commissioner <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Greg Sankey<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>In a sworn declaration, he says athletic director Verge Ausberry and Wade assured him Luis would not be rostered.<\/span><\/button> in contempt."], "why": "A conference suing to expel a founding member over eligibility pits private association rights against state-court injunctions, the question that now runs through college sports law.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "Front Office Sports", "u": "https://frontofficesports.com/article/sec-again-consider-expelling-lsu-conference/", "t": null}, {"n": "ESPN", "u": "https://www.espn.com/mens-college-basketball/story/_/id/50577602/sec-consider-termination-lsu-membership", "t": "C"}, {"n": "USA Today Network (via Yahoo)", "u": "https://sports.yahoo.com/articles/sec-calls-meeting-discuss-lsus-005459681.html", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-24/s11.webp?h=76bcf8cc", "col": "#303d1e", "cap": "Champions Plaza at LSU’s Tiger Stadium in Baton Rouge.", "credit": "Spatms, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "kp": ["The SEC seeks an order protecting a Dec. 3 vote on expelling LSU.", "The amended complaint adds basketball coach Will Wade.", "Expulsion needs 10 of the other 15 presidents."], "bg": "The SEC first sued LSU earlier this year over football players Dae’Quan Wright and Zxavian Harris, who had been on NFL preseason rosters, and set an expulsion vote for Sept. 8 that was never held.", "nx": "The presidents meet Dec. 3; a ruling on the restraining order is expected before then.", "fig": {"v": "Dec. 3", "l": "special meeting on LSU’s membership"}}, {"id": "s12", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "MLB offers a $1 million minimum salary, still tied to a cap", "s": "Major League Baseball proposed raising the minimum salary to $1 million from $780,000 in 2027, AP and Front Office Sports reported. Every offer still assumes a salary cap and floor.", "paras": ["Major League Baseball proposed on Monday raising the minimum salary to $1 million from $780,000 in 2027, lifting the pre-arbitration bonus pool to $65 million from $50 million and ending the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">qualifying offer<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>It sets the draft-pick compensation a team receives when a free agent it offered a one-year deal signs elsewhere.<\/span><\/button>, AP and Front Office Sports reported. Every offer still assumes a salary cap and floor. “Any supposed benefits to certain classes of players are simply taken out of the pockets of other players,” said Bruce Meyer of the players’ union, which wants clubs to pool <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">local media revenue<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Figure<\/span>It totaled $1.8 billion this year, down $575 million from about $2.4 billion a year in 2021 to 2024, AP reported.<\/span><\/button> instead. The agreement expires Dec. 1 at 11:59 p.m."], "why": "A cap is the one term the union has never accepted, and a lockout would be baseball’s tenth work stoppage since 1972.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "Front Office Sports", "u": "https://frontofficesports.com/article/mlb-players-latest-league-proposals-dont-add-single-dollar-overall-pay/", "t": null}, {"n": "AP (via Yahoo)", "u": "https://sports.yahoo.com/articles/mlb-sticking-salary-cap-players-204118853.html", "t": "C"}, {"n": "CBS Sports", "u": "https://www.cbssports.com/mlb/news/mlb-lockout-why-leagues-proposed-minimum-salary-increase-isnt-as-historic-as-it-may-seem", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": "", "chart": {"type": "bar", "t": "Pre-arbitration bonus pool", "rows": [["Now", 50, "$50 million"], ["MLB proposal", 65, "$65 million"]]}}], "week": [], "cover": "img/2026-11-24/s1.webp?h=e6b4fe99"}, {"date": "2026-11-23", "no": 179, "min": 7.4, "stand": "CrowdStrike signs a $43.9 billion deal for Zscaler; Reuters details the terms Anthropic set for its banks; COP31 ends in Antalya with no deal; and Ukraine says it sank a Russian warship off Libya.", "note": "Editor’s note. 9 items at 1,785 read-words, inside the ten-minute cap. Disclosure: Anthropic, whose model compiles this paper, is the subject of the second Front story, which rests on one Reuters report read through The Korea Times, with Fox News’ summary and Anthropic’s own Nov. 20 release for context; Anthropic declined to comment to Reuters. The CrowdStrike figures are the companies’ own, read from the release by the editor, with Reuters for the premarket moves; Bloomberg’s account was seen only as a headline. Treasury auction sizes are carried from last week’s published schedule and were not reconfirmed; the FedWatch odds are TheStreet’s from Nov. 15, and CME’s page was not reached. COP31 coverage rests on AFP, the Independent, Euronews and Asharq Al-Awsat; CNN’s report was seen but could not be opened, and no right-of-center outlet covered the close. Box office figures are studio Sunday estimates. NYT, Guardian, BBC, NPR and National Review pages could not be reached in the window. Law &amp; the Courts is quiet: no Supreme Court orders list is due Monday and no ruling in the window cleared the bar. Not run: the New York Times report on Alice Huang’s contacts with a Chinese state-security officer (the Times was not reached and every account was secondhand); Treasury Secretary Bessent and intelligence director Clayton on the Sunday shows; Fortune’s analysis of the fight over power costs for SpaceX’s $74 billion data-center plan; Kalshi’s warning that New York’s restraining order would shut its exchange nationwide (crypto trade press only; the hearing is after press time); the Art Basel Miami Beach preview (one trade source); the Russian strike on Dymer, where the death toll is unsettled. Magnitude check: the largest deal in the window is CrowdStrike and Zscaler at $43.9 billion, which leads; the largest contested bid remains Quebecor’s for Telus, with no readout from Monday’s meeting. Watch: Kalshi’s hearing in Manhattan at 11:30 a.m.; NATO ambassadors meet in Brussels today on the missile in Poland; the European Commission’s 22nd sanctions package; the LIV Golf bankruptcy hearing Tuesday; Nvidia’s House interviews Dec. 1.", "items": [{"id": "s1", "sec": "The Front", "sid": "s-front", "h": "CrowdStrike agrees to buy Zscaler in a $43.9 billion all-stock deal", "s": "Zscaler holders will receive 1.135 CrowdStrike shares for each share they own, worth about $260.41 at CrowdStrike’s Friday close. Both boards approved the deal unanimously, and it is expected to close in the second half of CrowdStrike’s fiscal 2028.", "paras": ["CrowdStrike agreed on Monday to acquire Zscaler in an all-stock deal that values the network-security company at about $43.9 billion, the companies said, three days after Bloomberg and Reuters reported talks. Zscaler holders will receive <button aria-haspopup=\"dialog\" class=\"gloss\" data-gloss-ok=\"fixed-ratio consequence; the premarket move is new\" type=\"button\">1.135 CrowdStrike shares<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The ratio is fixed, so the price Zscaler holders receive will rise or fall with CrowdStrike’s stock until closing. CrowdStrike fell 5 percent in premarket trading on Monday, Reuters reported.<\/span><\/button> for each share they own, worth about $260.41 at CrowdStrike’s Friday close and a premium of about 34 percent.", "Both boards approved the deal unanimously. Jay Chaudhry, Zscaler’s founder, and his affiliates, who hold about 34 percent of its shares, signed voting agreements. CrowdStrike holders will own about 84.1 percent of the combined company, and Chaudhry will keep running the Zscaler business and join CrowdStrike’s board. The deal needs a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Zscaler shareholder vote<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>CrowdStrike will register the new shares on a Form S-4, and Zscaler’s proxy statement will travel inside that filing, so the SEC review of one document sets the timing of the vote.<\/span><\/button> and regulatory approvals, and is expected to close in the second half of CrowdStrike’s fiscal 2028. Davis Polk &amp; Wardwell is counsel to CrowdStrike, with Qatalyst Partners as lead financial adviser. Wilson Sonsini Goodrich &amp; Rosati advises Zscaler, with BDT &amp; MSD Partners leading its bankers.", "The companies target $500 million of annual cost savings within 24 months and about $1 billion a year of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">revenue synergies<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The pitch is cross-selling: about 8,000 Zscaler customers do not yet buy from CrowdStrike, the companies said, and they put the added addressable market above $185 billion in 2029.<\/span><\/button> within 30 months. They say combined <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">annual recurring revenue<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Zscaler reported $3.9 billion of it in its latest quarter, so CrowdStrike is buying a business more than a third the size of its own subscription base.<\/span><\/button> will start above $10 billion. Zscaler rose more than 13 percent before the open, Reuters reported. Enterprises are cutting the number of security vendors they use and buying several products through one relationship, Reuters said, and the deal joins CrowdStrike’s endpoint business to <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Zero Trust<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A design in which no user or device is trusted by default, even inside a company’s network; every request is checked. Zscaler sells it as a cloud service that sits between workers and the internet.<\/span><\/button> network security."], "why": "Signed three days after the Nasdaq’s 5 percent fall, the largest deal of the window prices security software as the defensible end of the AI trade. With a third of the vote locked, the main risk to the 34 percent premium is the long regulatory runway, not a rival bid.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "CrowdStrike", "u": "https://ir.crowdstrike.com/news-releases/news-release-details/crowdstrike-acquire-zscaler-bringing-network-security-and-zero", "t": null}, {"n": "Reuters (via Global Banking & Finance)", "u": "https://www.globalbankingandfinance.com/crowdstrike-buy-zscaler-43-9-billion/", "t": "C"}, {"n": "Investing.com", "u": "https://www.investing.com/news/company-news/crowdstrike-to-acquire-zscaler-for-439-billion-in-stock-93CH-5044852", "t": null}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-23/s1.webp?h=ad558ba7", "col": "#592805", "cap": "The Nasdaq MarketSite in Times Square. CrowdStrike and Zscaler both trade on the Nasdaq.", "credit": "ajay_suresh, CC BY 2.0 / Wikimedia Commons", "pull": {"text": "We see a path to become the largest AI safety and security company the world has ever seen.", "attr": "George Kurtz, CrowdStrike, Nov. 23"}, "kp": ["CrowdStrike will pay 1.135 of its shares for each Zscaler share, about $260.41.", "Chaudhry and his affiliates, with about 34 percent of Zscaler, signed voting agreements.", "Closing is expected in the second half of CrowdStrike’s fiscal 2028."], "bg": "Bloomberg reported on Nov. 20 that CrowdStrike was in talks to buy Zscaler at a value near $32 billion, and Reuters put the figure at $33.5 billion; the signed price is about a third higher. The talks surfaced the day the Nasdaq fell 5.28 percent and the S&amp;P 500 closed in correction after Reuters reported that SEC staff were examining Nvidia’s accounting. The release says the deal will add to free cash flow per share immediately, before any synergies, and to operating margin within the first fiscal year after closing. No termination fee was disclosed in the announcement.", "nx": "The companies host a joint call at 8 a.m. Eastern on Monday. CrowdStrike will then file the S-4 that carries Zscaler’s proxy statement.", "fig": {"v": "34 percent", "l": "premium to Zscaler’s Friday close"}}, {"id": "s2", "sec": "The Front", "sid": "s-front", "h": "Anthropic capped its 22 banks at four senior bankers each, Reuters reports", "s": "Anthropic asked some banks to keep core deal-team members from working for OpenAI, Cursor, DeepSeek or Hugging Face for six months after the listing, Reuters reported. Like SpaceX, it paid underwriters nothing on the overallotment shares, the report said.", "paras": ["Anthropic told the 22 banks underwriting its initial public offering to staff no more than four senior bankers each and asked some to keep core deal-team members from working for OpenAI, Cursor, DeepSeek or Hugging Face for six months after the listing, Reuters reported on Sunday. Like <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">SpaceX<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Its June listing set the template, and the comparison is not flattering: SpaceX shares peaked at $201.80 on June 16 and fell below the $135 offer price by mid-July, Reuters noted.<\/span><\/button> before it, the company negotiated to pay underwriters nothing on the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">overallotment shares<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Anthropic said on Nov. 20 that the underwriters exercised the option in full, 147 million shares, so the zero spread covered the whole tranche.<\/span><\/button>, the report said. The banks still earned more than half a billion dollars on the deal, known internally as Project Lantern.", "The process chafed some bankers, Reuters said. A draft <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">amended registration statement<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Reuters had published details of the draft S-1 nearly four weeks before the company made it public.<\/span><\/button> with wrong price-range and share figures was pulled, and the corrected version went out around 2 a.m. New York time, leaving the banks several hours to sign off. Anthropic, Goldman Sachs and Morgan Stanley declined to comment, according to Fox News. The stock rose 17 percent on its first day and fell 8.5 percent on Friday, still above the $83 offer price."], "why": "A zero spread on the greenshoe of a $93.5 billion offering shows what an issuer with leverage can take from its banks. Jay Ritter told Reuters he doubts most companies can demand it.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 1}, "src": [{"n": "Reuters (via The Korea Times)", "u": "https://www.koreatimes.co.kr/world/20261123/like-spacex-anthropic-ran-an-unusual-ipo-process-chafing-some-bankers", "t": "C"}, {"n": "Fox News", "u": "https://www.foxnews.com/live-news/ai-news-markets-correction-11-22-26", "t": "R"}, {"n": "Anthropic", "u": "https://anthropic.com/news", "t": null}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-23/s2.webp?h=ab13195d", "col": "#1f3663", "cap": "", "credit": "Nielsoncaetanosalmeron, CC BY 4.0 / Wikimedia Commons", "pull": null, "kp": ["Each of the 22 banks was limited to four senior bankers on the deal.", "Some bankers were asked not to work for four named rivals for six months.", "Anthropic and SpaceX each paid no underwriting fee on greenshoe shares."], "bg": "Anthropic priced 980 million shares at $83 on Nov. 18, above its range, and closed the offering on Nov. 20 with the overallotment exercised in full, for gross proceeds of about $93.5 billion, the company said. The stock opened on Nov. 19 and closed its first day up 17 percent.", "nx": "", "fig": {"v": "17 percent", "l": "first-day gain in Anthropic’s stock"}}, {"id": "s3", "sec": "AI", "sid": "s-ai", "h": "Governors ask Congress for one AI framework that leaves states room", "s": "The National Governors Association released six principles for federal AI policy on Sunday. Washington would handle national and international risks, while states would govern how AI is used within their borders.", "paras": ["The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">National Governors Association<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The principles come from its Governors Council to Secure American AI Dominance. Bloomberg reported that they also back independent safety reviews of advanced models and mandatory reporting of serious incidents.<\/span><\/button> on Sunday released six principles for federal AI policy, proposing that Washington handle national and international risks while <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">states<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Several have already moved: New York bars AI chatbots from posing as human with children, and California has sued OpenAI over rogue agents, The Next Web noted.<\/span><\/button> govern how AI is used within their borders. The council is led by Maryland’s Wes Moore and Indiana’s Mike Braun, with North Carolina’s Josh Stein and Utah’s Spencer Cox. The principles tie safeguards to evidence of risk, call for less overlap between federal and state rules and say rules should not favor large companies. “Humans must stay in control,” Moore said."], "why": "Preemption decides whether AI compliance runs on one statute or fifty. The governors are bidding to keep the use layer, where most enforcement happens.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "National Governors Association", "u": "https://www.nga.org/news/press-releases/governors-call-for-ai-action/", "t": null}, {"n": "The Next Web", "u": "https://thenextweb.com/news/governors-ai-principles-federal-state-roles-nga", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-23/s3.webp?h=6c6d2e16", "col": "#2c394b", "cap": "The Capitol’s west front. The governors want Congress to write the national rules.", "credit": "Architect of the Capitol, Public domain / Wikimedia Commons", "pull": null, "kp": ["Washington would handle national and international AI risks; states would govern use.", "Safeguards would be tied to evidence of risk and reviewed regularly.", "The governors say rules should not favor large companies."], "bg": "Congress has not agreed on a broad federal AI framework, and the incoming Congress is drafting one, The Next Web reported. President Trump said at the APEC summit that heavy rules would “stifle” AI, according to Bloomberg. States have pressed ahead: California’s attorney general sued OpenAI on Nov. 16, and Texas has sued over ChatGPT and children.", "nx": ""}, {"id": "s4", "sec": "AI", "sid": "s-ai", "h": "OpenAI’s chief scientist proposes shared limits measured by perplexity", "s": "Jakub Pachocki proposed that AI developers commit to “common limits, based on perplexity and other measurements” that none would cross. The essay sets no value or date for a first limit.", "paras": ["Jakub Pachocki, OpenAI’s chief scientist, proposed on Sunday that AI developers commit to “common limits, based on <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">perplexity<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Pachocki writes that capabilities in cybersecurity and mathematics appear once a model’s log-perplexity falls below about 0.8 on the company’s main internal set.<\/span><\/button> and other measurements” that none would cross until <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">monitoring<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>His example of a milestone that would let labs pass a limit is a successor to chain-of-thought monitors, which read a model’s written reasoning for signs of trouble.<\/span><\/button> catches up. In an essay, he published OpenAI’s scores on its main internal evaluation set for the first time: about 0.99 for GPT-3.5, 0.91 for GPT-4 and 0.76 for the model now producing results on open math problems, with the next step expected near 0.68 to 0.70. The essay sets no value or date for a first limit."], "why": "A lab publishing its own pretraining curve and asking rivals to stop at a shared number is the first concrete offer on coordination. With no number and no date, it remains an offer.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "OpenAI", "u": "https://openai.com/index/perplexity-and-intelligence/", "t": null}, {"n": "Bloomberg (via Bloomberg Law)", "u": "https://news.bloomberglaw.com/ip-law/openai-chief-scientist-urges-industry-limits-on-ai-development", "t": "C"}, {"n": "The Next Web", "u": "https://thenextweb.com/news/openai-chief-scientist-shared-ai-limits", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": "", "chart": {"type": "bar", "t": "OpenAI log-perplexity, lower is better", "rows": [["GPT-3.5", 0.99, "about 0.99"], ["GPT-4", 0.91, "0.91"], ["Current math model", 0.76, "0.76"]]}}, {"id": "s5", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Treasuries enter Thanksgiving week after a 19-basis-point weekly rally", "s": "Two-year yields fell 19.5 basis points last week and 10-year yields 19.1 basis points, according to closing data compiled by Zhitong. Treasury’s par curve put the 10-year at 4.92 percent on Friday.", "paras": ["<button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Two-year<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The two-year tracks expected Fed policy most closely. TheStreet put CME FedWatch odds near 93 percent on Nov. 15 for a quarter-point increase from the 3.75 to 4 percent range at the Dec. 8-9 meeting.<\/span><\/button> Treasury yields fell 19.5 basis points last week, to about 4.65 percent, and 10-year yields fell 19.1 basis points, to about 4.94 percent, as investors bought bonds through <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Friday’s stock sell-off<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The Nasdaq fell 5.28 percent on Friday and turned negative for the year after Reuters reported that SEC staff were examining Nvidia’s accounting.<\/span><\/button>, according to closing data compiled by Zhitong. Treasury’s par curve put the two-year at 4.63 percent and the 10-year at 4.92 percent on Friday, from 4.80 and 5.07 on Wednesday. The Treasury sells $69 billion of two-year notes on Monday, $70 billion of five-year notes on Tuesday and $44 billion of seven-year notes on Wednesday."], "why": "Every deal in this paper prices off this curve. A 19-basis-point drop in a week lowers funding costs for issuers queuing behind the holiday, though a December hike is still priced.", "c": {"L": 0, "LL": 0, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "U.S. Treasury", "u": "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_par_yield_curve&field_tdr_date_value_month=202611", "t": null}, {"n": "Zhitong (via Longbridge)", "u": "https://longbridge.com/en/news/306334837", "t": null}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-23/s5.webp?h=983d888b", "col": "#38392a", "cap": "The Treasury Building in Washington, which sells $183 billion of notes this week.", "credit": "MeanieHyaena, CC BY 4.0 / Wikimedia Commons", "pull": null, "kp": ["The two-year yield fell 19.5 basis points last week, and the 10-year 19.1.", "Treasury’s par curve had the 10-year at 4.92 percent on Friday.", "Two-, five- and seven-year auctions run Monday through Wednesday."], "bg": "The 10-year yield fell for a fifth straight day on Friday, Zhitong reported, as the S&amp;P 500 posted its seventh straight loss. The 30-year par yield ended the week at 5.31 percent, from 5.41 on Wednesday. No Monday move in Asian or London trading was found at press time.", "nx": "The two-year auction is Monday, the five-year Tuesday and the seven-year Wednesday. The Fed meets Dec. 8 and 9.", "chart": {"type": "bar", "t": "Note auctions this week, billions of dollars", "rows": [["Two-year (Mon)", 69, "$69 billion"], ["Five-year (Tue)", 70, "$70 billion"], ["Seven-year (Wed)", 44, "$44 billion"]]}}, {"id": "s6", "sec": "The World", "sid": "s-world", "h": "COP31 ends in Antalya with no overall decision after a record overrun", "s": "The summit ended on Sunday without agreement on its cover decision, more than 49 hours past its scheduled close, AFP reported. Oil producers blocked any reference to phasing out fossil fuels.", "paras": ["The United Nations climate summit in Antalya ended on Sunday without agreement on its <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">cover decision<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The political umbrella text that sits above the technical agreements. AFP reported that the whole package was rejected; none of the sources say whether any technical decision was adopted separately.<\/span><\/button>, more than 49 hours past its scheduled close, the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">longest clima
