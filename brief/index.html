e’s presidential candidacy in Haiti (below the bar); a report that Jensen Huang weighs a return (Fox Business, not verified); a chemical spill at xAI’s Southaven site (primary not reached); Italy’s fine against Meta; a key witness in the Comey case (Saturday); Cahill Gordon’s merger talk (no new step); Bharat Semi’s $24 million seed. Magnitude check: no deal announced in the window was found; the largest live contested bid remains Wendy’s and Trian, with no new step. Sourcing limits: the Times, CNN, the Guardian, NPR, the BBC, Reuters and the AP were not reached directly, so no lean-left outlet appears; National Review was not queried. Money Stuff’s latest issue found is Nov. 12; Pro Rata was not retrieved; the Anthropic newsroom had nothing after Nov. 10. No South Florida item cleared the window. Watch: the Knesset speaker vote Tuesday; Nvidia earnings this week; the 20-year auction and Anthropic’s pricing Wednesday; GTA VI and the Trump, Xi and Putin meeting in Shenzhen Thursday.", "items": [{"id": "s1", "sec": "The Front", "sid": "s-front", "h": "A contractor’s router most likely grounded every U.S. flight, Duffy says", "s": "Transportation Secretary Sean Duffy said on Sunday that a router installed in a contractor’s upgrade most likely caused Friday’s nationwide ground stop. FlightAware counted about 9,159 cancellations that day, CBS reported. Duffy has asked Congress for $50 billion.", "paras": ["Transportation Secretary Sean Duffy said on Sunday that a router installed in a contractor’s upgrade most likely caused Friday’s nationwide <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">ground stop<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>An FAA order holding flights at their origin airports. Friday’s was the second nationwide stop since the September 2001 attacks and the first since January 2023, the AP reported.<\/span><\/button>, and he told CBS’s Face the Nation that the Federal Aviation Administration has to “get off old network, old telecom.” The FAA halted every U.S. departure at 3:36 p.m. Eastern on Nov. 13 with about 3,500 flights in the air. FlightAware counted about 9,159 cancellations and 7,190 delays that day, CBS reported.", "Crews from <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">L3Harris<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Its statement said it takes “the nationwide ground stop and its impact on travelers, airlines and air traffic operations seriously,” and did not address the router or the contract.<\/span><\/button> were replacing <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">copper lines with fiber<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Carriers are retiring legacy copper circuits, which is why Duffy said the FAA was “forced by the telecom provider” to convert the site rather than picking the timing itself.<\/span><\/button> at a remote FAA site when a router began sending about 1,000 log-on attempts every four to five seconds, the AP reported. “We think it was the installation or the router that was the bad actor,” Duffy said on Fox News Sunday, adding that there was no indication of a cyberattack. The FBI remains involved. On NBC’s Meet the Press he said he wants to move away from L3Harris, “but they own the network.”", "Duffy said more than 70 percent of copper lines and almost 470 radios have been switched over, and he has asked Congress for $50 billion. Congress allocated <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">$12.5 billion<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Rep. Rosa DeLauro, the senior Democrat on House Appropriations, said Duffy and the agency “have received historical and monumental investments”; the administration has committed about $4 billion of it.<\/span><\/button> for FAA upgrades in 2025, of which about $1 billion has been spent, the AP reported, and a September GAO report found the agency had missed at least four of 11 modernization recommendations. The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Homeland Security Council<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The White House policy council for domestic security; Trump has also been calling congressional leaders about FAA funding, CBS reported late Saturday.<\/span><\/button> meets on Monday on preventing a repeat."], "why": "The worst air-traffic outage in decades traces to a routine cutover on a network the government does not own, and the fight over who pays to replace it opens with a $50 billion ask.", "c": {"L": 1, "LL": 0, "C": 2, "LR": 0, "R": 1}, "src": [{"n": "CBS News, Face the Nation", "u": "https://www.cbsnews.com/news/ground-stop-faa-telecom-network-sean-duffy-face-the-nation/", "t": "C"}, {"n": "Fox News", "u": "https://www.foxnews.com/us/duffy-investigators-examining-2-routers-nationwide-faa-ground-stop-no-signs-foreign-cyberattack", "t": "R"}, {"n": "Al Jazeera / AP", "u": "https://www.aljazeera.com/news/2026/11/16/after-a-nationwide-ground-stop-us-faces-aviation-infrastructure-questions", "t": "L"}, {"n": "CBS News", "u": "https://www.cbsnews.com/news/faa-ground-stop-trump-admin-response/", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-16/s1.webp?h=eb560291", "col": "#373b20", "cap": "The FAA’s headquarters, the Wilbur Wright Federal Building, in Washington.", "credit": "MBisanz, CC BY-SA 3.0 / Wikimedia Commons", "pull": {"text": "But what I don’t have money for is a new telecom system.", "attr": "Sean Duffy, Face the Nation, Nov. 15"}, "kp": [], "bg": "", "nx": "", "chart": {"type": "bar", "t": "FAA network money, in dollars", "rows": [["Duffy’s request", 50, "$50 billion"], ["Allocated in 2025", 12.5, "$12.5 billion"], ["Spent so far", 1, "about $1 billion"]]}}, {"id": "s2", "sec": "The Front", "sid": "s-front", "h": "Iran fires drones at a U.S. radar in Bahrain as a third carrier arrives", "s": "The Revolutionary Guard said six drones targeted a U.S. air defense radar in Bahrain on Sunday, Fox News reported. Bahrain said it intercepted them, its first interceptions since September, with no casualties. Al Jazeera reported the USS Theodore Roosevelt has reached the region.", "paras": ["The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Islamic Revolutionary Guard Corps<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The Guard also claimed, without evidence, to have seized the guidance system of a U.S. MQM-170 drone by electronic warfare.<\/span><\/button> said six drones from its aerospace force targeted a U.S. air defense radar at the Al-Riffa helicopter base in <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Bahrain<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>The kingdom hosts the headquarters of the U.S. Navy’s Fifth Fleet in Manama, which makes it the most exposed of the Gulf hosts.<\/span><\/button> on Sunday, calling it retaliation for “hostile US actions,” Fox News reported. Bahrain said it intercepted them, its first interceptions since September, with no casualties. The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">USS Theodore Roosevelt<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>It was sent to relieve the USS George Washington, Task &amp; Purpose reported in September; five of the Navy’s 11 carriers have been committed to Iran operations since Feb. 28.<\/span><\/button> has arrived in the Middle East, joining two other carriers, Al Jazeera reported.", "Antony Blinken, the former secretary of state, said in New Delhi on Saturday that a U.S. ground invasion would be “an absolute disaster,” arguing that Iran can “escalate horizontally” while the United States can only “escalate vertically.” Brent crude stood at $95.89 on Nov. 13, against about $72 before the war began in late February, CBS reported. Iran’s embassy in South Africa posted “We will find you” on X, aimed at two named officers of the destroyer USS Spruance, which returned to San Diego on Nov. 13, Fox News reported."], "why": "Each strike on a Gulf host widens the war’s footprint and its insurance bill, and a third carrier is the kind of buildup that precedes a decision, not a lull.", "c": {"L": 1, "LL": 0, "C": 1, "LR": 0, "R": 2}, "src": [{"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/liveblog/2026/11/16/iran-war-live-tehran-warns-it-may-strike-first-before-another-us-attack", "t": "L"}, {"n": "Fox News", "u": "https://www.foxnews.com/world/blinken-warns-us-ground-invasion-iran-would-be-disaster-tehran-escalates-attacks", "t": "R"}, {"n": "CBS News", "u": "https://www.cbsnews.com/live-updates/us-iran-war-trump-nuclear-material-no-deal/", "t": "C"}, {"n": "Fox News", "u": "https://www.foxnews.com/world/iran-vows-we-find-you-2-us-navy-officers-day-warship-returns-from-middle-east", "t": "R"}], "framing": "Fox News headlined Blinken’s warning “as Tehran escalates attacks”; Al Jazeera led with “Third US carrier arrives in Middle East, Iran says oil tankers hit mines.”", "min": 1, "front": true, "img": "img/2026-11-16/s2.webp?h=2c3daa69", "col": "#41362a", "cap": "", "credit": "U.S. Navy photo by Mass Communication Specialist 3rd Class Austin Clayton, Public domain / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": "", "chart": {"type": "bar", "t": "Brent crude, per barrel", "rows": [["Nov. 13", 95.89, "$95.89"], ["Before the war", 72, "about $72"]]}}, {"id": "s3", "sec": "AI", "sid": "s-ai", "h": "“Saturday Night Live” turns the Nvidia scandal into a spycraft sketch", "s": "“Saturday Night Live” gathered the industry’s tycoons for a sketch about Jensen Huang’s ouster, TechCrunch reported on Sunday. Host John Mulaney played a CIA agent, and Bowen Yang appeared as Huang.", "paras": ["NBC’s “Saturday Night Live” gathered the industry’s tycoons for a sketch about <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Jensen Huang’s ouster<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>He resigned Nov. 12 after a board inquiry into his relationship with a former Megaspeed executive; Singapore has since barred her from re-entering the country, Al Jazeera reported.<\/span><\/button>, TechCrunch reported on Sunday. Host John Mulaney played a CIA agent lecturing James Austin Johnson’s Peter Thiel, Ben Marshall’s Sam Altman, Jane Wickline’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Dario Amodei<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>Chief executive of Anthropic, whose model compiles this paper and whose offering is due to price on Wednesday.<\/span><\/button>, Jeremy Culhane’s Elon Musk and Andrew Dismukes’s Mark Zuckerberg; Bowen Yang appeared as Huang. “Name one time technology has let us down,” the Thiel character says, and the agent cites the nationwide groundings."], "why": "When a governance scandal reaches the cold open, the reputational cost lands on the succession, and Nvidia reports earnings this week without its founder.", "c": {"L": 0, "LL": 0, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "TechCrunch", "u": "https://techcrunch.com/2026/11/15/snl-gathers-all-the-tech-tycoons-for-a-lesson-in-dating-and-spycraft/", "t": null}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-16/s3.webp?h=438971a3", "col": "#3e3729", "cap": "", "credit": "Kidfly182, CC BY 4.0 / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": ""}, {"id": "s4", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Glass Lewis’s chief says dual-class control should carry an expiry date", "s": "Bob Mann, chief executive of Glass Lewis, argued on Sunday that “one-share-one-vote should remain the default,” in a post on the Harvard Law School Forum on Corporate Governance. His remedy is a sunset, triggered by time, the founder’s departure or a succession event.", "paras": ["Bob Mann, chief executive of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Glass, Lewis &amp; Co.<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>With ISS, one of the two proxy advisers whose voting recommendations steer a large share of institutional ballots, including votes on directors at dual-class companies.<\/span><\/button>, argued on Sunday that “one-share-one-vote should remain the default,” in a post on the Harvard Law School Forum on Corporate Governance. He wrote that investors price voting limits into the bundle they buy at an IPO and that permanence is the core problem with multi-class structures. “An exceptional founder may justify exceptional treatment,” he wrote.", "His remedy is the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">sunset<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A charter term that converts high-vote shares to one vote each. The Council of Institutional Investors has long urged that time-based sunsets run no more than seven years.<\/span><\/button>, triggered by time, the founder’s departure, the founder’s economic stake falling below a threshold, or a succession event. He cited Britain’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">2024 listing reform<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The FCA’s policy statement PS24/6 merged London’s premium and standard segments into a single category for commercial companies and widened room for enhanced founder votes.<\/span><\/button> and noted that exchanges compete for listings, naming Meta and Alphabet as examples. He offered no data and did not address any pending offering. “The durability of control should bear some relationship to the durability of the circumstances,” he wrote."], "why": "Every dual-class charter now coming to market, including the Class F structure in this week’s Anthropic offering, is drafted against this argument, and it tells deal lawyers which terms proxy advisers will punish.", "c": {"L": 0, "LL": 0, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "Harvard Law School Forum on Corporate Governance", "u": "https://corpgov.law.harvard.edu/2026/11/15/unequal-voting-rights-opportunity-vs-influence/", "t": null}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-16/s4.webp?h=c9ebef1a", "col": "#433526", "cap": "The New York Stock Exchange on Broad Street.", "credit": "Jakub Hałun, CC BY 4.0 / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": ""}, {"id": "s5", "sec": "Markets & Deals", "sid": "s-mkt", "h": "A 20-year bond on Wednesday and a 10-year TIPS reopening on Thursday", "s": "The Treasury settles the refunding auctions on Monday and sells a 20-year bond on Wednesday, the day Anthropic is expected to price its offering, according to its tentative schedule. A 10-year TIPS reopening follows on Thursday.", "paras": ["The Treasury settles the 3-, 10- and 30-year refunding auctions on Monday and sells 13- and 26-week bills, according to its tentative fourth-quarter schedule. A 20-year bond auction follows on Wednesday, the day Anthropic is expected to price its offering, and a 10-year TIPS <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">reopening<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A reopening sells more of an existing security at its original coupon and maturity, deepening one issue rather than creating a new one.<\/span><\/button> on Thursday, when the 2-, 5- and 7-year notes for the week of Nov. 23 are announced. Friday closed with the 2-year at 4.88 percent, the 10-year at 5.15 and the 30-year at 5.47, the Treasury’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">par curve<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The Treasury’s daily fit of yields for bonds priced at par, read at the market close; it is the reference the department publishes for each maturity.<\/span><\/button> shows."], "why": "The long bond tailed in both of last week’s auctions, and a weak 20-year on pricing day would set a harder backdrop for the year’s largest listing.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "U.S. Treasury, tentative auction schedule", "u": "https://home.treasury.gov/system/files/221/TentativeAuctionScheduleQ42026.pdf", "t": null}, {"n": "U.S. Treasury, par yield curve", "u": "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_yield_curve", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": "", "chart": {"type": "line", "t": "Treasury yields at Friday’s close, percent", "rows": [["2-year", 4.88, "4.88"], ["10-year", 5.15, "5.15"], ["30-year", 5.47, "5.47"]]}}, {"id": "s6", "sec": "Law & the Courts", "sid": "s-law", "h": "The justices release orders at 9:30, with Alabama’s map among the relists", "s": "The Supreme Court is scheduled to release orders at 9:30 a.m. on Monday after its Nov. 13 conference. Pending relists include Allen v. Milligan, Alabama’s appeal on its congressional map, and three cases on 9/11 families’ claims against the Taliban.", "paras": ["The Supreme Court is scheduled to release orders at 9:30 a.m. on Monday after its Nov. 13 conference. The cases to watch are relists tracked by John Elwood of SCOTUSblog, two of which were granted Friday. Leading the rest is Allen v. Milligan, No. 26-117, Alabama’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">direct appeal<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Because review is mandatory, the Court must decide the merits, summarily or after argument, rather than simply deny; the challengers filed a motion to dismiss or affirm on Sept. 18.<\/span><\/button> from a May 26 three-judge district court ruling on its congressional map, now distributed for a third conference.", "Also pending are Havlish, Ashton and Owens v. The Taliban, Nos. 26-292 to 26-294, which ask when <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">federal terrorism law<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Section 201 of the Terrorism Risk Insurance Act of 2002 lets judgment holders execute against blocked assets of a terrorist party; Havlish asks whether status is judged when the assets were blocked.<\/span><\/button> lets judgment holders reach blocked assets and how far courts defer to the executive on foreign-state status. ON24 v. Leadersel Innotech ESG, No. 25-1376, raises a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Section 11<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Near-strict issuer liability for a misstatement in a registration statement; the shared question with Robinhood is Item 303, the duty to disclose known trends and uncertainties.<\/span><\/button> question over omitted risks, close to the Robinhood grant, so a hold is possible."], "why": "One morning’s list can reset Alabama’s map fight and settle what 9/11 judgment holders may collect, and the ON24 disposition will show how far Robinhood reaches into IPO disclosure.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "SCOTUSblog, Relist Watch", "u": "https://scotusblog.com/2026/11/eleven-new-relists-in-search-of-four-votes/", "t": null}, {"n": "Supreme Court docket, No. 26-117", "u": "https://www.supremecourt.gov/docket/docketfiles/html/public/26-117.html", "t": null}, {"n": "Supreme Court, November calendar", "u": "https://www.supremecourt.gov/oral_arguments/argument_calendars/MonthlyArgumentCalNovember2026.pdf", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-16/s6.webp?h=d939a0ba", "col": "#3c3923", "cap": "The Supreme Court building in Washington.", "credit": "Sunira Moses, CC BY-SA 3.0 / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": ""}, {"id": "s7", "sec": "The World", "sid": "s-world", "h": "Israel’s attorney general and police reportedly examine Netanyahu’s office", "s": "The attorney general and police are examining whether the Prime Minister’s Office used the police to undermine the Oct. 27 election, Channel 12’s Uvda reported on Sunday, according to the Times of Israel. The prime minister’s office called other claims defamatory.", "paras": ["Attorney General Gali Baharav-Miara and the police Investigations and Intelligence Division are examining whether the Prime Minister’s Office used the police to undermine the Oct. 27 election, Channel 12’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Uvda<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Channel 12’s investigative program. It also reported that Shin Bet chief David Zini sought to wiretap five Arab lawmakers on election day, which the attorney general’s office refused.<\/span><\/button> reported on Sunday, according to the Times of Israel. Chief of staff Ido Norden allegedly passed police a complaint that <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Ra’am<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The United Arab List, which in 2021 became the first Arab party to sit in an Israeli governing coalition.<\/span><\/button> activists were paying voters. Three Bedouin men were arrested at dawn on election day and freed without charges, and police later found the source’s information unfounded, AFP reported.", "The prime minister’s office said “criminal information” reached Norden and called other claims defamatory. Gadi Eisenkot said Netanyahu must not remain “for even one minute longer” and pledged a commission of inquiry; Likud called it “outrageous incitement.” Arab-led parties won a record 19 seats, and neither bloc holds <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">61<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A majority of the 120-seat Knesset, the floor a governing coalition needs to survive a no-confidence vote.<\/span><\/button>. The Knesset elects its speaker on Tuesday."], "why": "An inquiry into whether a sitting government turned the police on an election would hang over coalition talks that already lack a majority, with the attorney general the cabinet tried to dismiss at its center.", "c": {"L": 1, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Times of Israel", "u": "https://www.timesofisrael.com/police-said-to-probe-whether-pms-office-faked-arab-vote-buying-scandal-to-undermine-election/", "t": null}, {"n": "Al Jazeera / AFP", "u": "https://www.aljazeera.com/news/2026/11/16/eisenkot-says-netanyahu-cant-remain-israel-pm-amid-alleged-vote-meddling", "t": "L"}, {"n": "Times of Israel, liveblog", "u": "https://www.timesofisrael.com/liveblog_entry/pmo-rejects-claim-it-manufactured-election-day-arrests-of-raam-members-eisenkot-pledges-inquiry/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-16/s7.webp?h=a5fad523", "col": "#313845", "cap": "The Knesset in Jerusalem.", "credit": "Clema12, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "19 seats", "l": "Record seat total for Arab-led parties"}}, {"id": "s8", "sec": "The World", "sid": "s-world", "h": "An EU naval mission boards a falsely flagged tanker in the Mediterranean", "s": "The EU’s Operation Irini boarded the crude tanker MIDAG on Nov. 13 because it was sailing under a false flag, Kaja Kallas said on Sunday, the Kyiv Independent reported. MarineTraffic listed the ship as Zimbabwe-flagged.", "paras": ["The EU’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Operation Irini<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Launched in 2020 to enforce the UN arms embargo on Libya; its mandate also covers illicit petroleum exports from Libya.<\/span><\/button> boarded the crude tanker MIDAG on Nov. 13, citing the right of visit under <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Article 110<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Boarding a foreign ship on the high seas is lawful only on narrow grounds, among them piracy, statelessness and a false flag; a flag of convenience alone is not enough.<\/span><\/button> of the UN Convention on the Law of the Sea because it was sailing under a false flag, Kaja Kallas, the EU’s foreign-policy chief, said on Sunday. MarineTraffic listed the ship as Zimbabwe-flagged. “The EU will keep disrupting Russia’s shadow fleet at sea and through diplomatic means,” Kallas said, the Kyiv Independent reported."], "why": "A boarding on the false-flag ground is a template for sanctions enforcement without a new UN mandate, and every insurer covering the shadow fleet will read it.", "c": {"L": 0, "LL": 0, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "Kyiv Independent", "u": "https://kyivindependent.com/eu-forces-board-suspected-russian-shadow-fleet-tanker-in-mediterranean-kallas-says/", "t": null}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": ""}, {"id": "s9", "sec": "The World", "sid": "s-world", "h": "ASEAN and China miss their goal of a South China Sea code this year", "s": "ASEAN and Chinese officials failed to conclude a code of conduct in Manila on Sunday, Al Jazeera reported. The sticking point is whether the code would be legally binding. Singapore chairs next year.", "paras": ["Meeting in Manila on Sunday, ASEAN and Chinese officials failed to conclude a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">code of conduct<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Talks trace to the nonbinding 2002 Declaration on the Conduct of Parties; a binding code would sit beside the 2016 arbitral award against China’s claims, which Beijing rejects.<\/span><\/button> for the South China Sea despite tentative agreement on about 80 percent of a draft, Al Jazeera reported, citing AP and Reuters. The sticking point is whether the code would be legally binding. “There is no conclusion yet,” said <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Theresa Lazaro<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>The Philippine foreign secretary, who also said, “The ASEAN countries plus China have also different views on how things are.”<\/span><\/button>. The Philippines, the 2026 chair, had sought a deal by year’s end; Singapore chairs next year."], "why": "Without a binding code, the Philippines’ disputes with China stay with ships and coast guards, the arena where shipping lanes and their insurance are priced.", "c": {"L": 1, "LL": 0, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/16/asean-china-fall-short-of-agreeing-on-south-china-sea-code", "t": "L"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": ""}, {"id": "s10", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "Glenn Close receives her first Oscar, an honorary one", "s": "Glenn Close, 79, received an honorary Oscar on Sunday night, her first after eight nominations without a win, the Associated Press reported. Killer Films’ Christine Vachon and Pamela Koffler received the Thalberg award, the first independent producers to win it.", "paras": ["Glenn Close, 79, received an honorary Oscar at the Academy’s 17th <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Governors Awards<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The Academy moved its honorary Oscars off the main telecast to this separate dinner in 2009, which is why the honorees do not appear on the March broadcast.<\/span><\/button> in Los Angeles on Sunday night, her first after eight nominations without a win, the Associated Press reported. John Malkovich, her co-star in “Dangerous Liaisons,” presented. “I got my first Oscar nomination 43 years ago,” she told the AP. Ridley Scott, 88, with four nominations and no wins, accepted by video and said, “I also accept it for Tony”; Matt Damon presented.", "Floyd Norman, 91, who joined Disney in 1956 as the first Black animator at Walt Disney Animation Studios, said, “Here’s my happy ending.” Christine Vachon and Pamela Koffler of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Killer Films<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Founded in 1995, the company also produced “Boys Don’t Cry,” “Far From Heaven” and “Carol,” largely on independent financing.<\/span><\/button> received the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Thalberg award<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>First given in 1938, to Darryl F. Zanuck, the Irving G. Thalberg Memorial Award goes only in years the Academy’s board chooses to give it.<\/span><\/button>, the first female producing team and the first independent producers to win it. “Past Lives” was their first best picture nomination."], "why": "The Thalberg going to independent producers is the Academy’s signal on who builds a slate now, and Close’s statue ends one of the longest losing streaks in Oscar history.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "AP via Springfield News-Sun", "u": "https://www.springfieldnewssun.com/nation-world/glenn-close-marvels-at-honorary-oscar-as-ridley-scott-and-indie-producers-also-get-statuettes/article_97b9d57b-ad02-507b-8c27-9fc22331aced.html", "t": "C"}, {"n": "The Hollywood Reporter", "u": "https://www.hollywoodreporter.com/movies/movie-news/2026-governors-awards-glenn-close-ridley-scott-floyd-norman-1236749503/", "t": "C"}, {"n": "Deadline", "u": "https://deadline.com/2026/11/oscars-17th-governors-awards-glenn-close-ridley-scott-1237224853/", "t": "C"}, {"n": "Variety", "u": "https://variety.com/2026/film/news/governors-awards-2026-glenn-close-oscars-best-moments-1236948230/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": ""}, {"id": "s11", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "Johnny Depp’s “Ebenezer” opens at No. 1 with about $19 million", "s": "Paramount’s “Ebenezer” took about $19 million from 3,535 North American theaters, studio estimates showed Sunday, against a reported $38 million budget, the AP reported. Amazon MGM’s “How to Rob a Bank” placed seventh.", "paras": ["Paramount’s “Ebenezer,” directed by Ti West with <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Depp<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>His “Fantastic Beasts: The Crimes of Grindelwald” opened to $62 million in 2018; his next film, “Day Drinker,” is due from Lionsgate in March.<\/span><\/button> as Scrooge, took about $19 million from 3,535 North American theaters and $23 million from 63 international markets, studio estimates showed Sunday, against a reported $38 million budget, the AP reported. Some 51 percent of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">PostTrak<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>An exit survey of moviegoers; the same poll found the audience 52 percent female and 81 percent over 25.<\/span><\/button> respondents cited Depp as their reason for going. Amazon MGM’s “How to Rob a Bank”
