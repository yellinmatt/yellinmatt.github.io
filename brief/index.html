 on Nov. 6, NBC Miami reported.", "paras": ["Jason Reding Quiñones stepped down on Nov. 6, NBC Miami reported."], "why": "", "c": {"L": 0, "LL": 1, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "NBC Miami", "u": "https://www.nbcmiami.com/news/local/jason-reding-quinones-miami-us-attorney-for-southern-district-florida-resigns/3884685/", "t": "LL"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}, {"id": "s15", "sec": "Wall Street South", "sid": "d-sofla", "h": "Mizner Park changes hands", "s": "A CP Group-led venture bought Boca Raton’s mixed-use centerpiece from Brookfield, The Real Deal reported Nov. 6.", "paras": ["A CP Group-led venture bought Boca Raton’s mixed-use centerpiece from Brookfield, The Real Deal reported Nov. 6."], "why": "", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "The Real Deal", "u": "https://therealdeal.com/miami/2026/11/06/cp-group-led-venture-buys-boca-ratons-mizner-park/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}, {"id": "s16", "sec": "Wall Street South", "sid": "d-sofla", "h": "Florida caps property taxes", "s": "Voters approved Amendment 3 on Nov. 3, widening the homestead exemption and capping yearly assessment growth on non-homestead property at 5%.", "paras": ["Voters approved Amendment 3 on Nov. 3, widening the homestead exemption and capping yearly assessment growth on non-homestead property at 5%."], "why": "", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Fox 13", "u": "https://www.fox13news.com/news/florida-amendment-3-voters-pass-historic-property-tax-caps", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}], "week": [{"day": "Mon Nov 2", "lead": "Iran said it could reopen Hormuz within two days if Washington met its demands, with Brent near $110."}, {"day": "Tue Nov 3", "lead": "Marvell agreed to combine with Lumentum in a $115 billion deal, and U.S. strikes hit Iran’s Qeshm Island."}, {"day": "Wed Nov 4", "lead": "Democrats won the House and the Senate, and stock futures fell 2% before recovering."}, {"day": "Thu Nov 5", "lead": "CVS said it will split in two, and Brent fell 8.7% to $94.62 on bets of an exit from the Iran war."}, {"day": "Fri Nov 6", "lead": "The Nasdaq fell 5.52% into a correction, and doubts surfaced over the timing of Anthropic’s listing."}, {"day": "Sat Nov 7", "lead": "Payrolls rose 165,000 against 65,000 expected, and Stephen Miller was named White House chief of staff."}, {"day": "Sun Nov 8", "lead": "Herzog gave Eisenkot the first mandate to form Israel’s next government."}], "cover": "img/2026-11-08/s1.webp?h=a33597cc"}, {"date": "2026-11-07", "no": 163, "min": 9.6, "stand": "Hiring runs at more than twice the forecast and the market prices a hike, Stephen Miller takes the chief of staff’s office, the AI labs reprice, and Paraguay removes its president and puts him under house arrest.", "note": "Editor’s note. 13 items at 2,298 read-words, under the ten-minute cap. Disclosure: Anthropic, whose model compiles this paper, is the subject of the IPO price-talk item and is named in the Democrats’ AI item. Rates: no coupon auction fell in the window; yields are Treasury’s par closes, which differ from Reuters’s intraday figures, and no Fed speaker was verified Friday. Magnitude check: no large deal was signed in the window. The largest transaction event was Fox’s $22 billion Roku close, run. Silver Lake and Saudi Arabia’s PIF are in talks to buy Unity at about $25 billion, but Reuters reported it Thursday evening before the window and no Friday step was confirmed; offered on a fresh beat. The largest live contest, Intesa’s roughly €34 billion bid for Monte dei Paschi, had no bid move; MPS reported third-quarter profit of €543 million. Global Payments, DoorDash and Instacart, Wendy’s and Helen of Troy had no fresh beat. Not run: Apple’s $7.5 billion seven-part bond (priced Nov. 5, before the window); Agility Robotics’ listing (Nov. 5 release); DeepMind’s RSA findings (no independent report); the Justice Department’s grand jury subpoenas in the Dobbs leak inquiry (first reported Nov. 5); the Major, Lindsey &amp; Africa partner pay survey, a reported Weil memo on partner resignations (headline only), and the Seattle and Washington arch restraining orders (both issued Nov. 5), all for space or timing; the Zaporizhzhia aid-site toll, now 53, from a Nov. 2 strike this paper did not run, a miss; the Nigerian ruling against Atiku Abubakar (Nov. 5); box office projections without actual grosses; TheWrap’s settlement with Valnet (party-authored); Enhanced Group’s DEAG purchase; the death of Sebastián Lelio, director of “A Fantastic Woman,” at 52 (TheWrap, Nov. 6), cut to hold the ten-minute cap. Joshua Wong’s sentence remains unrun. Sourcing limits: The New York Times, the BBC, National Review and Reuters and AP directly were not reached; AP and Reuters come through syndication; Bloomberg items rest on syndicated copies; CNN, CNBC, NBC, Deadline, Variety and The Hollywood Reporter links were seen and not opened. Paraguay’s vote count differs slightly across outlets (Al Jazeera reports one abstention). The Real Deal is the sole source on the Boca deals. Matt Levine had no Friday column visible, Pro Rata was not retrieved, and the Harvard forum and Anthropic newsroom had nothing usable. Watch: the 3-year, 10-year and 30-year sales Nov. 9, 10 and 12; Herzog’s pick Sunday; Supreme Court orders and the LIV Golf hearing Monday; Anthropic’s roadshow.", "items": [{"id": "s1", "sec": "The Front", "sid": "s-front", "h": "October payrolls rise 165,000, and markets price a December hike", "s": "U.S. employers added 165,000 jobs in October, the Bureau of Labor Statistics said, against the 65,000 that economists polled by Reuters had expected. The unemployment rate held at 4.1 percent. Reuters said bets on a December hike rose to 78 percent from 70 percent.", "paras": ["U.S. employers added 165,000 jobs in October, the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Bureau of Labor Statistics<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Its November report is due Dec. 4, five days before the Fed meets on Dec. 8 and 9.<\/span><\/button> said Friday, against the 65,000 that economists polled by Reuters had expected. The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">unemployment rate<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>It comes from the household survey, a separate sample from the payroll count, and puts 7.1 million people out of work.<\/span><\/button> held at 4.1 percent. Revisions added 84,000 jobs to August and September combined, lifting August to 186,000 and September to 60,000. Average hourly earnings rose 0.4 percent on the month to $38.00, up 3.1 percent from a year earlier.", "The gains were broad. Professional and business services added 70,000, health care 42,000, transportation and warehousing 25,000 and manufacturing 19,000, against a monthly average of 48,000 over the prior year. “The headline number blew the consensus out of the water by 100,000,” said Brian Jacobsen of Annex Wealth Management. Reuters said bets on a December hike rose to 78 percent from 70 percent, and CME’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">FedWatch<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>CME derives the odds from 30-day fed funds futures. InvestmentNews said the curve prices only one more hike after December.<\/span><\/button> tool showed 76.8 percent.", "Treasury’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">par curve<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The closes are bid-side quotes taken near 3:30 p.m., which is why they sit below the intraday 4.52, 4.87 and 5.27 percent that Reuters printed.<\/span><\/button> closed the 2-year at 4.51 percent, up five basis points, the 10-year at 4.86 percent and the 30-year at 5.26 percent. Stocks steadied after Thursday’s rout: the Nasdaq rose 1.09 percent to 24,579.42 and the S&amp;P 500 0.31 percent, while the Dow slipped 0.46 percent. Treasury sells $58 billion of 3-year notes Monday, $42 billion of 10-year notes Tuesday and $25 billion of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">30-year bonds<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The three sales total $125 billion, raise about $28 billion of new cash and settle Nov. 16.<\/span><\/button> Thursday."], "why": "A hike priced at three in four turns next week’s refunding into a test of how much duration buyers will take, and the answer reaches every deal that prices off the curve, Anthropic’s offering included.", "c": {"L": 0, "LL": 0, "C": 5, "LR": 0, "R": 0}, "src": [{"n": "Bureau of Labor Statistics", "u": "https://www.bls.gov/news.release/empsit.nr0.htm", "t": null}, {"n": "Reuters via Yahoo", "u": "https://finance.yahoo.com/economy/policy/articles/strong-october-jobs-report-sends-134858909.html", "t": "C"}, {"n": "InvestmentNews", "u": "https://investmentnews.com/fixed-income/october-jobs-report-beats-forecasts-lifting-december-fed-hike-odds/268915", "t": "C"}, {"n": "U.S. Treasury", "u": "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_yield_curve&field_tdr_date_value_month=202611", "t": "C"}, {"n": "Yahoo Finance", "u": "https://finance.yahoo.com/markets/live/stock-market-today-friday-november-6-dow-sp-500-nasdaq-jobs-report-earnings-135953863.html", "t": "C"}, {"n": "Treasury refunding", "u": "https://home.treasury.gov/news/press-releases/sb0678", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-07/s1.webp?h=de02d275", "col": "#273854", "cap": "The Eccles Building, home of the Federal Reserve Board, in Washington.", "credit": "Federalreserve, Public domain / Wikimedia Commons", "pull": {"text": "“…that just confirms that the Fed has no choice but to raise rates in December.”", "attr": "Peter Cardillo, Spartan Capital Securities, to Reuters, Nov. 6"}, "chart": {"type": "line", "t": "Treasury par yields at Friday’s close", "rows": [["2-year", 4.51, "4.51 percent"], ["10-year", 4.86, "4.86 percent"], ["30-year", 5.26, "5.26 percent"]]}}, {"id": "s2", "sec": "The Front", "sid": "s-front", "h": "Stephen Miller will replace Susie Wiles as chief of staff on Monday", "s": "President Trump said Stephen Miller, his deputy chief of staff, will become White House chief of staff on Monday, replacing Susie Wiles. She submitted her resignation Thursday night, CBS News reported. Accounts differ on her last day.", "paras": ["President Trump said Friday that Stephen Miller, his deputy chief of staff, will become White House <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">chief of staff<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The post needs no Senate confirmation, so the Democratic majority arriving in January cannot block the appointment.<\/span><\/button> on Monday, replacing <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Susie Wiles<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>She was the first woman to hold the post, and served 21 months, the longest of any Trump chief of staff in either term, Fox News said.<\/span><\/button> three days after Republicans lost both chambers of Congress. Trump called Miller “one of my most trusted advisors” on Truth Social and said Wiles “has done an outstanding job” and would move “over to the Trump Political Operation.” She submitted her resignation Thursday night, CBS News reported, citing a U.S. official.", "Democrats answered at once. House Minority Leader Hakeem Jeffries called <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Miller<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>Al Jazeera reported that Democrats are widely expected to open investigations into him once they take control of Congress in January.<\/span><\/button> a “dangerous xenophobe and reckless extremist,” and Chuck Schumer said Trump “couldn’t have made a worse choice,” NPR reported. Accounts differ on Wiles’s last day: CBS said Friday, and Fox said she gave it as Monday."], "why": "Miller built the immigration agenda that voters just punished. Making him the gatekeeper points to a White House that governs by executive action against a hostile Congress, which is where the next round of litigation starts.", "c": {"L": 1, "LL": 2, "C": 1, "LR": 0, "R": 1}, "src": [{"n": "CBS News", "u": "https://www.cbsnews.com/news/stephen-miller-trump-chief-of-staff-susie-wiles/", "t": "C"}, {"n": "Fox News", "u": "https://www.foxnews.com/politics/trump-names-stephen-miller-new-white-house-chief-staff-replacing-susie-wiles", "t": "R"}, {"n": "NPR via MPR", "u": "https://www.mprnews.org/story/2026/11/06/npr-stephen-miller-replace-susie-wiles-trumps-chief-of-staff", "t": "LL"}, {"n": "ABC News", "u": "https://abcnews.com/Politics/trump-chief-staff-susie-wiles-miller-replace/story?id=137921244", "t": "LL"}, {"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/6/trump-says-making-adviser-stephen-miller-white-house-chief-of-staff", "t": "L"}], "framing": "The left (NPR) introduces Miller as “the architect of many of Trump’s most controversial policies”; the right (Fox) leads with a handoff a White House official called “very amicable.”", "min": 1, "front": true, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}, {"id": "s3", "sec": "The Front", "sid": "s-front", "h": "Anthropic IPO talk slides toward $1.2 trillion as OpenAI raises $11 billion", "s": "Prospective investors in Anthropic’s offering are discussing about $1.2 trillion to $1.3 trillion, Bloomberg reported, down from a $1.4 trillion to $1.5 trillion range given to bankers. OpenAI closed $11 billion at $1.25 trillion. Anthropic’s model compiles this paper.", "paras": ["Prospective investors in Anthropic’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">initial public offering<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>An amended S-1 must carry a price range before a roadshow can launch, and none had appeared on EDGAR as of Nov. 5.<\/span><\/button> are now discussing a valuation of about $1.2 trillion to $1.3 trillion, Bloomberg reported Friday, citing a person familiar, down from a $1.4 trillion to $1.5 trillion range given to bankers and early-October talk as high as $2 trillion. “No final decisions have been made,” the person said. Anthropic declined to comment. Yahoo Finance said prediction-market odds of a listing before Dec. 1 fell from about 80 percent to about 50 percent.", "The same day <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">OpenAI<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Its previous round, in March, raised $122 billion at an $852 billion valuation.<\/span><\/button> closed $11 billion at $1.25 trillion, the first part of a round that could reach $20 billion, after cutting a target of $30 billion or more at $1.4 trillion, Bloomberg reported. Card data from <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Ramp<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Its economist, Ara Kharazian, told TechCrunch that almost all AI spending comes from venture-backed, high-growth tech companies.<\/span><\/button> showed business spending on AI tokens grew 1.5 percent across August and September, after 42 percent in July alone. Disclosure: Anthropic’s model compiles this paper."], "why": "Buyers have marked the two largest labs down by a third from October talk before a share trades. The price Anthropic sets becomes the comparable for every late-stage AI round.", "c": {"L": 0, "LL": 0, "C": 5, "LR": 0, "R": 0}, "src": [{"n": "Bloomberg via Investing.com", "u": "https://www.investing.com/news/stock-market-news/anthropic-ipo-valuation-discussions-fall-to-13-trillion-bloomberg-reports-5008125", "t": "C"}, {"n": "Yahoo Finance", "u": "https://finance.yahoo.com/technology/article/anthropics-ipo-valuation-could-plunge-to-near-1-trillion-amid-market-turmoil-153332732.html", "t": "C"}, {"n": "Bloomberg via Investing.com (OpenAI)", "u": "https://www.investing.com/news/stock-market-news/openai-closes-11-billion-funding-at-125-trillion-valuation--report-5009147", "t": "C"}, {"n": "TechCrunch", "u": "https://techcrunch.com/2026/11/06/ramp-data-shows-ai-spending-stalling-just-as-anthropic-nears-its-ipo", "t": "C"}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/11/06/investors-brace-for-anthropic-valuation-1point5-trillion-a-stretch.html", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-07/s3.webp?h=096dedde", "col": "#592805", "cap": "", "credit": "ajay_suresh, CC BY 2.0 / Wikimedia Commons", "pull": null, "fig": {"v": "about 50 percent", "l": "Market odds of a listing before Dec. 1"}}, {"id": "s4", "sec": "AI", "sid": "s-ai", "h": "Democrats plan AI testing and liability bills for January", "s": "Democrats plan bills for January to shield consumers from data-center power costs, require independent testing of advanced models and clarify AI companies’ liability for harm, Reuters reported. Trump wrote that he is “100% in favor of Super Intelligence.”", "paras": ["Democrats plan to introduce bills when they take control of Congress in January to shield consumers from data-center power costs, require <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">independent testing<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>In October, Democrats asked OpenAI, Anthropic, Meta, Google and SpaceX to detail their security practices.<\/span><\/button> of advanced models and clarify AI companies’ liability for harm, Reuters reported Friday. Rep. Lori Trahan is working on testing and liability, and Senator-elect Abdul El-Sayed proposes an independent AI agency. “The probability of legislation is much higher than people anticipate,” said <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Ed Mills<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>The Raymond James analyst said Democrats could attach AI provisions to must-pass bills; overriding a veto takes two-thirds of both chambers.<\/span><\/button> of Raymond James. Trump wrote that he is “100% in favor of Super Intelligence.”"], "why": "Liability for model harms has been settled case by case in the courts. A statute would set the rule before most of the pending copyright and product suits reach judgment.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 1}, "src": [{"n": "Reuters via Claims Journal", "u": "https://www.claimsjournal.com/news/national/2026/11/06/341154.htm", "t": "C"}, {"n": "Reuters via Detroit News", "u": "https://detroitnews.com/story/tech/2026/11/06/democrats-planning-flood-of-ai-bills-when-they-take-control-of-congress/92641085007", "t": "C"}, {"n": "Newsmax via Yahoo", "u": "https://www.yahoo.com/news/politics/articles/trump-states-rich-ai-data-141201792.html", "t": "R"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-07/s4.webp?h=ac53a4a7", "col": "#2c394b", "cap": "", "credit": "Architect of the Capitol, Public domain / Wikimedia Commons", "pull": null}, {"id": "s5", "sec": "AI", "sid": "s-ai", "h": "ING puts $500 million of data-center loans up for sale", "s": "ING is seeking bids on about $500 million across 12 data-center loans, Bloomberg reported, including a $25 million loan tied to an Oracle and Stargate site in New Mexico. Bids are due Nov. 19. A loan sale is not by itself a sign of distress.", "paras": ["ING is seeking bids on about $500 million across 12 data-center loans, Bloomberg reported late Thursday, including a $25 million loan tied to Project Jupiter in Doña Ana County, New Mexico, an Oracle and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Stargate<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Launched in January 2025 by OpenAI, SoftBank and Oracle, it targets up to $500 billion of U.S. AI infrastructure over four years.<\/span><\/button> site, and debt linked to Vantage Data Centers and CyrusOne. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Bids<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The package runs as a bids-wanted auction, in which dealers and funds name prices and the seller takes the best, a quick way to clear exposure.<\/span><\/button> are due Nov. 19, with a $10 million minimum. ING declined to comment. A loan sale is not by itself a sign of distress, and CNBC framed it Friday as a measure of growing concern over AI debt."], "why": "Banks that lent into the buildout are starting to size their exposure. Where these loans clear will be the first price on data-center credit since the selloff.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "IBTimes", "u": "https://www.ibtimes.com/ing-sells-data-center-loans-stargate-debt-3809516", "t": null}, {"n": "Reuters via GBAF", "u": "https://www.globalbankingandfinance.com/ing-puts-500-million-data-center-loans-up-sale-bloomberg/", "t": "C"}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/11/06/ing-ai-data-center-loans-debt.html", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}, {"id": "s6", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Microsoft winds down its rental of Oracle’s AI cloud capacity", "s": "Microsoft has declined to renew an arrangement to rent AI computing capacity from Oracle, Reuters reported, citing Bloomberg. Oracle shares fell nearly 3 percent in afternoon trading, and the company said some details were “inaccurate.”", "paras": ["Microsoft has declined to renew an arrangement to rent AI computing capacity from Oracle and has been switching off <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">rented capacity<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Hyperscalers rent from rivals to bridge gaps until their own data centers open, so ending a rental can mean new capacity arrived or demand cooled.<\/span><\/button> for months, Reuters reported Friday, citing Bloomberg. Oracle shares fell nearly 3 percent in afternoon trading, and the company said some details were “inaccurate.” The report comes days after Oracle’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">$20 billion offering<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>It sold 86.2 million shares at $116 alongside notes paying 7 to 8.65 percent, per its Nov. 2 pricing release.<\/span><\/button> of stock and notes to fund a buildout paid for largely with debt."], "why": "Oracle raised $20 billion on the strength of AI demand. A large customer walking from rented capacity is the exact risk those buyers were paid to hold.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Reuters via GBAF", "u": "https://www.globalbankingandfinance.com/microsoft-winding-down-oracle-deal-rent-ai-cloud-capacity/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}, {"id": "s7", "sec": "Markets & Deals", "sid": "s-mkt", "h": "CP Group buys back Mizner Park, and Welltower buys five nursing homes", "s": "A venture led by CP Group bought Boca Raton’s Mizner Park from Brookfield Properties, The Real Deal reported, with Blackstone financing and the price undisclosed. Welltower paid $208.2 million for five skilled-nursing facilities with 620 beds in Broward and Palm Beach counties.", "paras": ["A venture led by <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">CP Group<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Formerly Crocker Partners, it developed Mizner Park in the 1990s, so the sale returns the project to its builder.<\/span><\/button>, with The Georgetown Co., ACRE and StepStone, bought Boca Raton’s Mizner Park from <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Brookfield Properties<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>It took the center in its 2018 takeover of GGP, the mall REIT.<\/span><\/button>, The Real Deal reported Friday, with Blackstone financing and the price undisclosed. The center has about 838,840 square feet, including roughly 268,000 of office, 276,000 of retail and 272 apartments. Separately, Welltower paid $208.2 million for five skilled-nursing facilities with 620 beds in Broward and Palm Beach counties, sold by entities of the Brooklyn-based TL Management."], "why": "Boca office and retail is changing hands with Blackstone lending into it, a read on South Florida commercial credit in the week national AI credit wobbled.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "The Real Deal", "u": "https://therealdeal.com/miami/2026/11/06/cp-group-led-venture-buys-boca-ratons-mizner-park/", "t": null}, {"n": "The Real Deal (Welltower)", "u": "https://therealdeal.com/miami/2026/11/06/welltower-buys-south-florida-nursing-home-portfolio/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}, {"id": "s8", "sec": "Law & the Courts", "sid": "s-law", "h": "Miami’s U.S. attorney, who indicted Raúl Castro, resigns", "s": "Jason Reding Quiñones resigned as U.S. Attorney for the Southern District of Florida effective Friday and gave no reason. He oversaw a grand jury examining whether former intelligence officials conspired to keep Trump from office. He is the third Justice Department official to leave since Tuesday.", "paras": ["Jason Reding Quiñones resigned as <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">U.S. Attorney<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Under 28 U.S.C. 546 the attorney general can name an interim U.S. attorney for 120 days, after which the district court may appoint one.<\/span><\/button> for the Southern District of Florida effective Friday, writing on X that he had submitted his resignation “to the President” and calling the job “the honor of my lifetime.” He gave no reason. His office indicted Raúl Castro on Oct. 19 over the 1996 <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Brothers to the Rescue<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Cuban MiGs shot down two of the group’s civilian Cessnas on Feb. 24, 1996, killing four.<\/span><\/button> shootdown, and he oversaw a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Fort Pierce<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>It is Judge Aileen Cannon’s division, where she dismissed Trump’s classified-documents case in July 2024.<\/span><\/button> grand jury examining whether former intelligence officials conspired to keep Trump from office.", "That inquiry has named former CIA Director John Brennan as a target and has produced extensive grand jury activity but no conspiracy charges, CBS News reported. Attorney General Todd Blanche thanked Quiñones and named no successor. He is the third Justice Department official to leave since Tuesday: Harmeet Dhillon left the Civil Rights Division on Thursday, and John Eisenberg, head of the National Security Division, resigned Friday, Politico reported."], "why": "The Miami office brings the cases that shape South Florida practice, from sanctions to securities fraud. An interim chief and a stalled flagship inquiry change who gets charged next.", "c": {"L": 0, "LL": 3, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "NBC Miami", "u": "https://www.nbcmiami.com/news/local/jason-reding-quinones-miami-us-attorney-for-southern-district-florida-resigns/3884685/", "t": "LL"}, {"n": "CBS News", "u": "https://www.cbsnews.com/news/doj-jason-reding-quinones-resigns-grand-conspiracy-probe/", "t": "C"}, {"n": "CNN", "u": "https://www.cnn.com/2026/11/06/politics/jason-reding-quinones-resigns-doj-grand-conspiracy-florida", "t": "LL"}, {"n": "NBC News", "u": "https://www.nbcnews.com/politics/justice-department/trump-doj-appointee-led-grand-conspiracy-probe-trump-foes-resigns-rcna607839", "t": "LL"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-07/s8.webp?h=71415df3", "col": "#393b0d", "cap": "The Wilkie D. Ferguson Jr. U.S. Courthouse in Miami.", "credit": "Carol M. Highsmith, Public domain / Wikimedia Commons", "pull": null}, {"id": "s9", "sec": "Law & the Courts", "sid": "s-law", "h": "Arkansas’s former bar exam director is charged with 65 felonies over allegedly moved scores", "s": "Nancie Givens, the former executive director of Arkansas’s bar examination office, faces 65 felony counts of tampering with a public record, Above the Law reported. The Arkansas Supreme Court said the vast majority told they passed did pass.", "paras": ["Nancie Givens, the former executive director of Arkansas’s bar examination office, faces 65 felony counts of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">tampering with a public record<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The charged span covers 11 sittings, held each February and July, and the points allegedly moved within a sitting, so one candidate may have dropped below the line.<\/span><\/button>, Above the Law reported Friday, after an Arkansas State Police and FBI investigation. She is accused of moving points between examinees from July 2020 to July 2025 so that some reached the 270 passing score, and about 11,400 files were deleted or made unavailable in January. The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Arkansas Supreme Court<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Above the Law reported that in at least one administration the top scorer allegedly lost points so someone else would rank first.<\/span><\/button> said the vast majority told they passed did pass."], "why": "Admission rests on the score being the score. Every Arkansas admission since 2020 now carries a record the court has to vouch for.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Above the Law", "u": "https://abovethelaw.com/2026/11/bar-exam-official-charged-with-65-felonies-accused-of-playing-robin-hood-with-test-scores/", "t": null}, {"n": "KARK", "u": "https://www.kark.com/crime/arkansas-court-official-allegedly-altered-bar-exam-scores-facing-charges/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "fig": {"v": "11,400", "l": "Files deleted or made unavailable, about"}}, {"id": "s10", "sec": "The World", "sid": "s-world", "h": "Paraguay’s Senate removes Peña, and prosecutors order house arrest", "s": "Paraguay’s Senate removed President Santiago Peña after a trial of about 10 hours, with 44 senators voting for removal and none against, MercoPress and AP reported. Vice President Pedro Alliana was sworn in. Prosecutors then ordered Peña under house arrest.", "paras": ["Paraguay’s Senate <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">removed<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Removal needed 30 of 45 votes; the lower house had impeached him 78 to 0 the day before.<\/span><\/button> President Santiago Peña on Friday after a trial of about 10 hours, with 44 senators voting for removal and none against, MercoPress and AP reported, and Vice President <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Pedro Alliana<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>A member of the ruling Colorado Party, whose own senators voted for removal, Al Jazeera reported.<\/span><\/button> was sworn in minutes later. Prosecutors then ordered Peña under house arrest on suspicion of breach of trust, influence peddling and self-serving administration, an order that also covers former central bank chief Carlos Carvallo.", "<button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Ueno<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Deposits are guaranteed up to about $38,000, which the Daily Caller said covers an estimated 97 percent of account holders.<\/span><\/button>, seized Nov. 3, served about 3 million customers, nearly two-thirds of adults, Al Jazeera reported, and more than $800 million of public money went into it, according to AP. At least 27 people face charges. “I take my leave with gratitude, while fully acknowledging the anguish of those who are currently awaiting answers,” Peña said. Alliana, 52, serves until Aug. 15, 2028."], "why": "A president removed and detained inside a week over a bank failure is a rare live test of regulators’ conflict-of-interest law, and of whether savers trust the guarantee.", "c": {"L": 1, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/7/paraguays-santiago-pena-under-arrest-new-president-pedro-alliana-sworn-in", "t": "L"}, {"n": "AP via ABC News", "u": "https://abcnews.com/International/wireStory/paraguays-pea-loses-top-aides-impeachment-trial-resumes-137913219", "t": "C"}, {"n": "MercoPress", "u": "https://en.mercopress.com/2026/11/07/paraguay-s-senate-removes-santiago-pena-who-is-placed-under-arrest-and-pedro-alliana-takes-office", "t": null}, {"n": "Daily Caller", "u": "https://dailycaller.com/2026/11/06/paraguay-president-santiago-pena-ousted-arrested-bank-collapse/", "t": null}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-07/s10.webp?h=c683041b", "col": "#393b14", "cap": "The Palacio de los López, seat of Paraguay’s presidency, in Asunción.", "credit": "MosheA, CC0 / Wikimedia Commons", "pull": null, "fig": {"v": "3 million", "l": "Ueno customers, about"}}, {"id": "s11", "sec": "The World", "sid": "s-world", "h": "Trump confirms “minor” new strikes on Qeshm and offers $20 million for tips", "s": "U.S. forces struck an anti-aircraft site on Iran’s Qeshm Island, the first strikes since the midterms, the Guardian and AP reported. Trump said, “We are talking to Iran.” Treasury designated eight Canada-based money services businesses.", "paras": ["U.S. forces struck an anti-aircraft site on Iran’s Qeshm Island on Friday, the first strikes since the midterms, and Trump said “we knocked it out in about 15 minutes, maybe five,” adding, “We are talking to Iran,” the Guardian and AP reported. The State Department offered up to $20 million through <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Rewards for Justice<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>State said Iran’s 60 percent uranium is “a short technical step” from 90 percent and cited lost IAEA continuity of knowledge.<\/span><\/button> for information on Iran’s nuclear program, and Treasury designated <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">eight Canada-based<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The designations, under Executive Order 13902, were coordinated with FinCEN, Canada’s FINTRAC and the DEA.<\/span><\/button> money services businesses tied to IRGC-linked crypto addresses. Brent ended near $98.32, down more than 13 percent on the week."], "why": "Sanctions now reach Canadian money transmitters, which pulls compliance north of the border, while oil’s steepest weekly fall since early 2020 says the market is pricing talks, not war.", "c": {"L": 1, "LL": 1, "C": 2, "LR": 0, "R": 1}, "src": [{"n": "CBS News", "u": "https://www.cbsnews.com/live-updates/iran-war-trump-us-strait-hormuz-persian-gulf/", "t": "C"}, {"n": "Guardian via AOL", "u": "https://www.aol.co.uk/articles/us-carries-another-round-minor-030701000.html", "t": "LL"}, {"n": "Al Jazeera", "u": "https://aljazeera.com/amp/news/2026/11/7/trump-confirms-new-us-strikes-on-irans-qeshm-island", "t": "L"}, {"n": "Fox News", "u": "https://www.foxnews.com/live-news/iran-war-news-nuclear-proposal-hegseth-congress-budget-request-11-06-26", "t": "R"}, {"n": "U.S. Treasury", "u": "https://home.treasury.gov/news/press-releases/sb0686/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "fig": {"v": "$98.32", "l": "Where Brent ended the week, near"}}, {"id": "s12", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "Fox closes its $22 billion purchase of Roku months ahead of schedule", "s": "Fox Corp. completed its $22 billion cash-and-stock acquisition of Roku on Friday, at $160 a share, Variety reported, well before the first-half 2027 close it had guided to.", "paras": ["Fox Corp. completed its $22 billion cash-and-stock acquisition of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Roku<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Sports Media Watch reported its adjusted EBITDA up 113 percent to $248.8 million and platform revenue up 23 percent to $1.3 billion.<\/span><\/button> on Friday, at $160 a share with about $14.2 billion in cash, Variety reported, well before the first-half 2027 close it had guided to. Shareholders of both companies approved the deal Oct. 14. Fox holders own 74 percent of the combined company and Roku holders 26 percent.", "Roku, <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Tubi<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Fox’s free ad-supported streamer. With the Roku Channel, Fox now runs two of the larger free streaming outlets.<\/span><\/button>, Fox One and Red Seat Ventures move into a new division, Fox Digital Platforms, under Paul Cheesbrough, and Roku founder Anthony Wood joins Fox’s board. Fox expects about $400 million of annual cost savings within two years and says Roku will remain an “<button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">open ecosystem<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The pledge is voluntary: the reports on the close describe no regulatory review and no conditions.<\/span><\/button>” in more than 100 million households, with no preferred placement for Fox News or Fox One. Wood spoke of “staying open to every content partner.”"], "why": "A broadcaster now owns the operating system its rivals’ apps run on. The no-preference pledge is voluntary, and carriage disputes will test it long before a regulator does.", "c": {"L": 0, "LL": 1, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "Variety via Yahoo", "u": "https://finance.yahoo.com/media-advertising/articles/fox-closes-22-billion-roku-142117922.html", "t": null}, {"n": "Sports Media Watch", "u": "https://www.sportsmediawatch.com/2026/11/fox-corp-completes-roku-acquisition/", "t": "C"}, {"n": "The Hollywood Reporter", "u": "https://www.hollywoodreporter.com/business/digital/fox-closes-roku-deal-creating-new-streaming-power-player-1236749375/", "t": "C"}, {"n": "Washington Post", "u": "https://www.washingtonpost.com/business/2026/11/06/fox-closes-22b-deal-buy-roku-transaction-that-will-remake-streaming/", "t": "LL"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-07/s12.webp?h=7fff614c", "col": "#373a2b", "cap": "One of the office buildings of Roku’s headquarters in San Jose.", "credit": "Coolcaesar, CC BY 4.0 / Wikimedia Commons", "pull": null, "chart": {"type": "bar", "t": "Ownership of the combined company", "rows": [["Fox holders", 74, "74 percent"], ["Roku holders", 26, "26 percent"]]}}, {"id": "s13", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "The Tenth Circuit reverses the fifth-season injunction for 2022 graduates", "s": "The Tenth Circuit reversed a July ruling that gave football players who finished high school in 2022 a fifth year of eligibility, AP and ESPN reported. Roughly 200 state cases involving up to 850 athletes remain.", "paras": ["The U.S. Court of Appeals for the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Tenth Circuit<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>It had stayed the district court’s order in August, so players have lived under the NCAA rule all season.<\/span><\/button> on Friday reversed a July ruling that gave football players who finished high school in 2022 a fifth year of eligibility, AP and ESPN reported. Judge Carolyn McHugh’s opinion rejected an <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">all-Division I market<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Antitrust plaintiffs must define the relevant market before proving harm, and a narrower market changes which schools count as rival buyers of a player’s services.<\/span><\/button>, saying players “would not view the 101 schools without a football program as reasonably good substitutes.” The NCAA’s Scott Bearby called it “consistent with the approach taken by every federal court of appeals.” Roughly 200 state cases involving up to 850 athletes remain."], "why": "Eligibility suits have run on antitrust theory since Alston. A circuit narrowing the market weakens that template just as the House takes up the Protect College Sports Act.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "ESPN", "u": "https://www.espn.com/college-sports/story/_/id/50402469/ncaa-secures-win-struggle-five-year-eligibility-rule", "t": null}, {"n": "AP via ABC News", "u": "https://abcnews.com/Sports/wireStory/federal-appeals-court-hands-ncaa-victory-struggle-year-137928238", "t": "C"}, {"n": "Sportico", "u": "https://www.sportico.com/law/analysis/2026/wisne-ncaa-10th-circuit-legal-analysis-1234957739/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}], "week": [], "cover": "img/2026-11-07/s1.webp?h=de02d275"}, {"date": "2026-11-06", "no": 162, "min": 9.8, "stand": "The AI trade breaks on the midterm verdict, Anthropic’s calendar slips into doubt, Turkey signs a second alliance, and Paraguay refuses to let its president quit.", "note": "Editor’s note. 14 items at 2,344 read-words, under the ten-minute cap. Disclosure: Anthropic, whose model compiles this paper, is the subject of two items, the IPO timing report and the METR assessment. The Anthropic newsroom showed nothing usable in the window. Rates: no coupon auction fell in the window, and yields here are Treasury’s par closes, which differ from intraday figures in Reuters. Value lost is about $2 trillion on the Nasdaq in Reuters, and other outlets print larger figures on other baskets. Magnitude check: the largest approach near the window is AstraZeneca’s roughly $10 billion for Rhythm, dated Nov. 4 at 5:21 p.m. and not run, with no Nov. 5 beat confirmed. Largest signed deals found were DTE Vantage at about $3 billion and Adani Ports and Evos, both aggregator only, not run. Largest live contest in the window is Wendy’s at $1.4 billion; GameStop and eBay was last verified in May. DoorDash and Instacart and the Global Payments approach have no fresh beat. Not run: China’s reported block of SoftBank’s $5.4 billion ABB robotics purchase (one Reuters reprint dated Nov. 4, no second source, offered again on a confirmation); Joshua Wong’s 10-year sentence (handed down hours before the window; a miss by this paper, offered on a fresh beat); Harmeet Dhillon’s DOJ resignation, Judge Pittman on AI-written filings, and Sheppard Mullin’s pay match, all for space; the xAI book-scanning suits (complaint read, no independent report); Trump’s “very close” on Ukraine (a repeated prediction without terms); Lionsgate’s quarter; Anthem’s catalog sale closing; the “Baby Reindeer” amended complaint (single source). South Florida: nothing cleared. Michael Stern’s claimed $1.1 billion Brickell financing is company-side and not closed. Sourcing limits: The New York Times, The Guardian, the BBC and National Review were not reached; AP and Reuters come through syndication; the Times’s own Letterboxd report and the Journal’s Anthropic report were not opened; Bloomberg Law pages were metered excerpts, and the A&amp;O Shearman and Texas items rest on them; WSJ, CNN, NPR, Post, CNBC and Bloomberg links were seen and not opened. Paraguay’s central bank leadership and the date of the Ueno seizure conflict across sources and are left out. Matt Levine had no Nov. 5 column visible; Pro Rata’s Nov. 5 body was not retrieved; Harvard’s forum had nothing in the window. Watch: payrolls this morning; the Senate’s summons of Peña; refunding sales Nov. 9, 10, 12; Herzog’s mandate Nov. 11; Paramount and Take-Two on Nov. 9.", "items": [{"id": "s1", "sec": "The Front", "sid": "s-front", "h": "The Nasdaq falls 5.52% into a correction after the Democratic sweep", "s": "The Nasdaq fell 5.52 percent on Thursday, its worst day since April 2025, and closed at least 10 percent below its Oct. 6 record. Reuters said chip stocks posted their second-biggest fall on record. Investors were pricing a slower and more expensive AI buildout.", "paras": ["The Nasdaq Composite fell 5.52 percent on Thursday, its worst day since April 2025, and closed in <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">correction territory<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Reuters put the index down as much as 14 percent from its high, a peak reached only a month ago.<\/span><\/button>, at least 10 percent below its Oct. 6 record. The S&amp;P 500 lost 4.36 percent and the Dow gave up 1,833.06 points, or 3.44 percent, to 51,523.06. Reuters said chip stocks posted their second-biggest fall on record, with the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Philadelphia index<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Yahoo Finance put the semiconductor gauge at 9,011.14 at the close, a 12.25 percent loss, with the Nasdaq-100 down 6.3 percent.<\/span><\/button> down 12 percent, and that some $2 trillion came off the Nasdaq’s market value.", "The trigger was the Democratic sweep of Congress, read a day late. Markets rose Wednesday as the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">political risk premium<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Yahoo Finance reported the VIX up more than 65 percent, to as high as 27.45, and also cited hedge funds locking in gains, per Nomura.<\/span><\/button> unwound; by Thursday investors were pricing a buildout that would be “slower and more expensive,” in the words of eToro’s Jakub Rochlitz. SanDisk fell 22 percent, Micron, AMD and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Marvell<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>It signed its $115 billion purchase of Lumentum on Nov. 2, so the acquirer fell three days after committing.<\/span><\/button> fell 17 percent each, and Nvidia fell 9.26 percent. Meta fell 3.96 percent, and IREN, Applied Digital and Nebius each fell more than 14 percent. All 11 S&amp;P sectors fell. Bitcoin dropped 6 percent to $75,000, while oil ended 3 to 4 percent higher.", "The fear now has estimates attached. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Dan Ives<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>He also sees capital-spending growth peaking next year, Fortune reported.<\/span><\/button> of Yorkville Ives wrote that “on the low end” 10 percent of the 800 to 1,000 U.S. AI data centers planned will be “wiped off the roadmap,” with up to 20 percent facing a longer regulatory road. Meta President Dina Powell McCormick told a Wall Street Journal conference Wednesday that “every hyperscaler is now thinking about ‘Do we need to build outside the United States?’”"], "why": "Every large financing of this autumn, from hyperscaler bonds to Anthropic’s IPO, discounts off a buildout the market repriced in one session. The refunding auctions start Monday into that tape.", "c": {"L": 0, "LL": 1, "C": 2, "LR": 0, "R": 1}, "src": [{"n": "Fox Business", "u": "https://www.foxbusiness.com/markets/stocks-nov-5-2026", "t": "R"}, {"n": "Reuters via GBAF", "u": "https://www.globalbankingandfinance.com/trading-day-november-5-market-bonfire/", "t": "C"}, {"n": "Fortune", "u": "https://fortune.com/2026/11/05/tech-stocks-are-suffering-the-biggest-selloff-since-covid-as-investors-see-premature-end-to-ai-datacenter-boom/", "t": "C"}, {"n": "Yahoo Finance", "u": "https://finance.yahoo.com/markets/live/stock-market-today-thursday-november-5-dow-sp-500-nasdaq-plunge-chip-stocks-melt-down-193726491.html", "t": null}, {"n": "CNN", "u": "https://www.cnn.com/2026/11/05/investing/tech-heavy-nasdaq-plunges", "t": "LL"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-06/s1.webp?h=83727c85", "col": "#592805", "cap": "The Nasdaq MarketSite in Times Square, New York.", "credit": "ajay_suresh, CC BY 2.0 / Wikimedia Commons", "pull": {"text": "“This feels like the capitulation phase for the data center capex beneficiary stocks, especially the semiconductors.”", "attr": "Jed Ellerbroek, Argent Capital Management, to Reuters via Fox Business, Nov. 5"}, "chart": {"type": "bar", "t": "Thursday’s losses", "rows": [["Nasdaq Composite", 5.52, "5.52 percent"], ["S&P 500", 4.36, "4.36 percent"], ["Dow", 3.44, "3.44 percent"]]}}, {"id": "s2", "sec": "The Front", "sid": "s-front", "h": "Investors doubt Anthropic can list in November at $1.5 trillion", "s": "Potential investors doubt Anthropic can hold its roadshow next week and still list in November, Reuters reported, citing four people familiar. Some see $1.5 trillion as the high end of expectations. This is investor sentiment, not a schedule change.", "paras": ["Potential investors doubt Anthropic can hold its roadshow next week and still <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">list<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The proposed Nasdaq ticker is ANT, and Goldman Sachs and Morgan Stanley lead 22 banks, FinanceFeeds reported.<\/span><\/button> in November, Reuters reported late Thursday, citing four people familiar. Pricing had been expected the week after. Some now see a $1.5 trillion valuation as the high end of expectations, after earlier talk of as much as $2 trillion, and Reuters said the company may need a bigger discount and could delay if AI assets stay weak. Anthropic declined to comment.", "The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">offering<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>It includes a Japanese tranche of up to ¥552.9 billion, about $3.5 billion. SpaceX’s June listing raised $75 billion.<\/span><\/button> is expected by some to reach $100 billion. Investors are waiting on October revenue, left blank in the updated <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">S-1<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Filed Oct. 26 and amended Nov. 2, with the price cover still blank.<\/span><\/button>; third-quarter revenue was nearly $17 billion, with an operating loss of $567 million. Reuters said the Wall Street Journal reported the same doubt Thursday evening. This is investor sentiment, not a schedule change. Disclosure: Anthropic’s model compiles this paper."], "why": "An offering this size sets the comparable for every late-stage AI valuation. A delay would be the first hard price signal from public buyers.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 1, "R": 0}, "src": [{"n": "Reuters via AOL", "u": "https://www.aol.com/articles/exclusive-ai-backlash-could-threaten-234132000.html", "t": "C"}, {"n": "Yahoo Finance", "u": "https://finance.yahoo.com/technology/article/anthropics-ipo-plans-run-up-against-a-battered-wall-street-192138177.html", "t": null}, {"n": "FinanceFeeds", "u": "https://financefeeds.com/anthropic-ipo-roadshow-looms-with-no-price-range/", "t": "C"}, {"n": "WSJ", "u": "https://www.wsj.com/finance/major-investors-are-skeptical-anthropic-ipo-can-achieve-1-5-trillion-valuation-ca965d8b", "t": "LR"}], "framing": "", "min": 1, "front": true, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "fig": {"v": "$100 billion", "l": "What some expect the offering to reach"}}, {"id": "s3", "sec": "The Front", "sid": "s-front", "h": "Turkey ratifies a NATO-style pact with Saudi Arabia and Pakistan", "s": "Turkey’s parliament ratified the Mecca agreement on Thursday, 279 to 119, Al Jazeera reported. The term is 10 years, and any troop deployment needs a separate vote. Saudi and Pakistani ratification status was not confirmed.", "paras": ["Turkey’s parliament ratified a mutual-defense pact with Saudi Arabia and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Pakistan<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>Nuclear-armed since its 1998 tests, so a NATO member now holds a treaty tie to an atomic power outside the alliance.<\/span><\/button> on Thursday, 279 to 119, with 398 of 592 lawmakers voting, Al Jazeera reported. President Erdogan, Crown Prince Mohammed bin Salman and Prime Minister Sharif signed the 16-article Mecca agreement on Aug. 7. Article 2 commits the parties to “immediately provide assistance” to a member under attack, a clause Al Jazeera said mirrors Article 5 of the North Atlantic Treaty. The term is 10 years, and any troop deployment needs a separate vote.", "The debate ran through Yemen. “They brought this agreement to send Turkish soldiers to the deserts of Yemen,” said opposition deputy leader Murat Emir, in AP’s account. Defense Minister Guler said Turkey foresees no conflict with the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Houthis<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Yemen’s government claims 16,100 Houthis killed or wounded since Oct. 5, a figure unconfirmed.<\/span><\/button>. The secretariat sits in Saudi Arabia, under retired Pakistani Gen. Nauman Mahmood. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Syria<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>It signed a defense deal with Saudi Arabia on Nov. 4 alongside $403 million in loans, terms undisclosed.<\/span><\/button> is weighing entry. Saudi and Pakistani ratification status was not confirmed."], "why": "A NATO member has taken on a second collective-defense obligation while its partner is under fire from Yemen. Alliance lawyers will ask which treaty answers first.", "c": {"L": 1, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/6/turkiyes-parliament-ratifies-mecca-defence-agreement", "t": "L"}, {"n": "AP via DT Next", "u": "https://www.dtnext.in/news/world/turkish-lawmakers-approve-a-3-nation-defense-pact-with-saudi-arabia-and-pakistan", "t": "C"}, {"n": "Asharq Al-Awsat", "u": "https://english.aawsat.com/gulf/5338238-turkish-parliament-ratifies-makkah-defense-pact", "t": null}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-06/s3.webp?h=77461df3", "col": "#4a3217", "cap": "", "credit": "A.Savin, FAL / Wikimedia Commons", "pull": null, "fig": {"v": "10 years", "l": "Term of the 16-article agreement"}}, {"id": "s4", "sec": "AI", "sid": "s-ai", "h": "METR finds Anthropic’s AI development about twice as fast", "s": "METR said a high-access assessment found Anthropic’s internal benchmark index accelerated 1.9 times. It wrote that Anthropic redacted a majority of the evidence it found most informative. The speedup may hold only for easily graded tasks.", "paras": ["The evaluator <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">METR<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Its report says it took no payment from Anthropic. One team member had discussed a role there.<\/span><\/button> said Thursday that a high-access assessment from Aug. 12 to Oct. 29 found Anthropic’s internal benchmark index accelerated 1.9 times (95 percent interval 1.5 to 2.8). It attributed roughly 80 percent of the October acceleration to AI, against 1.4 times for the all-developer frontier. Employees self-reported an uplift of about 12 times. The speedup may hold only for easily graded tasks.", "“Anthropic redacted a majority of the evidence we found most informative for these conclusions,” METR wrote. Anthropic also removed compute-allocation verification from the contract partway through, and METR used Claude extensively in its own analysis. AP reported the findings amid calls for a slowdown, <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">including from Dario Amodei<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>His Sept. 12 essay called to “slow the pace at which we improve the capabilities of AI models,” AP reported.<\/span><\/button>; Anthropic had not responded to AP. Disclosure: Anthropic’s model compiles this paper."], "why": "For a novel about AI hollowing out a profession, this is the first outside measurement of AI building AI. Its central limit is that the subject chose what the examiner could show.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "METR", "u": "https://metr.org/blog/2026-11-05-anthropic-ai-rd-acceleration-assessment/", "t": null}, {"n": "AP via ABC", "u": "https://abcnews.com/Technology/wireStory/anthropic-rapidly-accelerating-ai-development-amid-slowdown-calls-137885082", "t": "C"}, {"n": "The Information", "u": "https://www.theinformation.com/briefings/anthropics-r-d-speed-may-doubled-due-ai-researchers-find", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "fig": {"v": "12 times", "l": "Uplift employees self-reported"}}, {"id": "s5", "sec": "Markets & Deals", "sid": "s-mkt", "h": "The Bank of England hikes to 4% as the selloff steepens Treasuries", "s": "The Bank of England raised its rate to 4 percent from 3.75 percent on Thursday, on an 8-1 vote, Financial News reported. In New York the selloff bought Treasuries. October payrolls are due today, with economists expecting 65,000 jobs.", "paras": ["The Bank of England raised its rate to 4 percent from 3.75 percent on Thursday, on an 8-1 vote with the dissenter seeking a half point, Financial News reported, its first increase since 2023, Reuters said. The bank projects inflation peaking at 4.9 percent in the second quarter of 2027. “Monetary policy cannot influence global energy prices,” Governor Andrew Bailey said.", "In New York the selloff bought Treasuries. The Treasury’s par curve put the two-year at 4.46 percent from 4.58, the 10-year at 4.84 from 4.90 and the 30-year at 5.25 from 5.28, a sharp <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">bull steepening<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Short yields falling faster than long ones: the two-to-10-year gap widened to 38 basis points from 32 on the Treasury’s figures.<\/span><\/button>, Reuters said, with the next Fed hike pushed to <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">March<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>About 40 basis points of tightening remained priced.<\/span><\/button>. No coupon auction fell in the window. The refunding sells $58 billion of three-years Monday, $42 billion of 10-years Tuesday and $25 billion of 30-years Thursday. October payrolls are due today, with economists expecting 65,000 jobs and 4.2 percent unemployment."], "why": "The long end barely rallied on a 4 percent equity loss, and $125 billion of supply arrives next week. A weak 30-year auction would matter more than the jobs print.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Bank of England", "u": "https://www.bankofengland.co.uk/monetary-policy/the-interest-rate-bank-rate", "t": null}, {"n": "Financial News", "u": "https://www.financial-news.co.uk/energy-bills-push-bank-of-england-to-8-1-rate/", "t": "C"}, {"n": "Reuters via GBAF", "u": "https://www.globalbankingandfinance.com/trading-day-november-5-market-bonfire/", "t": "C"}, {"n": "Treasury", "u": "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_yield_curve&field_tdr_date_value_month=202611", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-06/s5.webp?h=894ce2f4", "col": "#40362a", "cap": "The Bank of England on Threadneedle Street, London.", "credit": "Steve Daniels, CC BY-SA 2.0 / Wikimedia Commons", "pull": null, "fig": {"v": "4.9 percent", "l": "Projected UK inflation peak, 2027 second quarter"}}, {"id": "s6", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Wendy’s rejects Peltz’s $1.4 billion bid and adopts a poison pill", "s": "Wendy’s rejected a take-private from Trian on Thursday and adopted a one-year rights plan with a 15 percent trigger, Reuters and AP reported. The bidders hold 16.3 percent. Trian declined comment.", "paras": ["Wendy’s rejected a $1.4 billion take-private from Nelson Peltz’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Trian<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Peter May is a Wendy’s director and Bradley Peltz joined the board in 2025, so the bidder sits in the boardroom.<\/span><\/button> on Thursday and adopted a one-year rights plan with a 15 percent trigger, Reuters and AP reported. An independent committee said unanimously that the $7.35 cash offer, made Oct. 28 with Flynn Group, BlueFive Capital and Sixth Street, “substantially undervalues” the company. The bidders hold 16.3 percent. The stock, near $7.75, already sits above the bid. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Rocco of Zacks<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>The analyst’s case rests on the business: U.S. same-store sales fell 5.7 percent in the third quarter.<\/span><\/button> said Trian must decide whether to sweeten. Trian declined comment."], "why": "A bidder group above a pill’s trigger makes the grandfathering clause the first thing to read. This paper did not see it.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Reuters via Investing.com", "u": "https://www.investing.com/news/stock-market-news/wendys-rejectstrianled-14-billion-buyout-offer-adopts-poison-pill-plan-5004965", "t": "C"}, {"n": "AP via Spectrum", "u": "https://mynews13.com/fl/orlando/ap-top-news/2026/11/05/wendys-rejects-buyout-bid-from-activist-investor-and-adopts-poison-pill-plan0", "t": "C"}, {"n": "Bloomberg", "u": "https://www.bloomberg.com/news/articles/2026-11-05/wendy-s-rejects-takeover-bid-from-trian-to-take-it-private", "t": "C"}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/11/05/wendys-rejects-takeover-proposal.html", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "fig": {"v": "$7.35", "l": "Cash offer a share, made Oct. 28"}}, {"id": "s7", "sec": "Law & the Courts", "sid": "s-law", "h": "A and O Shearman commits $1.1 billion to AI; Paul Weiss goes dark", "s": "A and O Shearman unveiled a five-year AI investment on Thursday, Bloomberg Law reported. Paul Weiss said its 2025 figures will be the last it gives the Am Law 200, Above the Law reported.", "paras": ["A&amp;O Shearman unveiled a $1.1 billion, five-year AI investment on Thursday, more than twice the $500 million over three to four years planned by Kirkland, Bloomberg Law reported. “Today we sell lawyers’ time,” said David Wakeling, and the firm’s fixed-fee income is up about 15 percent in two years.", "Paul Weiss, meanwhile, said its 2025 figures will be the last it gives the Am Law 200, Above the Law reported: $3.3 billion in revenue, up 24 percent, and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">$8.6 million<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>It would be the second big firm in a month to go dark, after Kirkland. Dentons walked away from the same rankings in 2014.<\/span><\/button> in profits per equity partner. “Clients and talent consistently tell us they want transparency and clarity,” said <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Gina Passarella<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>She speaks for the publisher of The American Lawyer, whose rankings depend on the figures firms hand over.<\/span><\/button>. The Paul Weiss news reached AmLaw on Oct. 29; Thursday’s report is the first this paper could date."], "why": "Two firms are moving away from the billable-hour scoreboard at once, one by capitalizing around it and one by refusing to post it. Recruits lose a comparison.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Bloomberg Law", "u": "https://news.bloomberglaw.com/business-and-practice/a-o-shearmans-1-1-billion-ai-bet-tops-kirkland-spending-plans", "t": "C"}, {"n": "Above the Law", "u": "https://abovethelaw.com/2026/11/paul-weiss-would-like-you-to-stop-looking-at-their-financials/", "t": "C"}, {"n": "Nonbillable", "u": "https://www.nonbillable.co.uk/news/paul-weiss-stops-financial-disclosures", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "fig": {"v": "$500 million", "l": "Kirkland’s plan over three to four years"}}, {"id": "s8", "sec": "Law & the Courts", "sid": "s-law", "h": "Paxton’s successor vows to end “political” suits as Texas courts flip", "s": "Attorney General-elect Nathan Johnson told Bloomberg Law he doubts cases against J and J, BlackRock and State Street. Democrats won all 21 contested appellate races, Bloomberg Law reported, and four Texas Supreme Court justices lost.", "paras": ["Texas Attorney General-elect Nathan Johnson told Bloomberg Law that suits “done for political stuntery are going to be terminated,” doubting cases against J&amp;J, BlackRock and State Street and reviewing contingency counsel who could bill up to $3,780 an hour. Democrats won all 21 contested appellate races, Bloomberg Law reported, and four Texas Supreme Court justices lost, including Chief Justice Blacklock. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Three lost seats<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Republicans keep a one-vote majority on the high court, and no Democrat has sat there since 1999.<\/span><\/button> on the new appeals court hear <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Business Court<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Its 10 judges face review in 2028 by Gina Hinojosa, who beat Gov. Abbott.<\/span><\/button> appeals. “All of that is now in flux,” said Dykema’s Kratovil."], "why": "Texas sold itself as Delaware’s rival on judicial predictability. Its anti-ESG docket and its business bench both changed hands in one night.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Bloomberg Law", "u": "https://news.bloomberglaw.com/litigation/paxton-successor-scrutinizes-big-contracts-to-gop-legal-allies", "t": "C"}, {"n": "Bloomberg Law (courts)", "u": "https://news.bloomberglaw.com/litigation/texas-judicial-power-shifts-to-democrats-in-massive-blue-wave", "t": "C"}, {"n": "Texas Lawbook", "u": "https://texaslawbook.net/democrats-appear-to-seize-dallas-court-of-appeals-dems-win-houston-judgeships-tx-lawyers-score-big-congressional-upsets/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "fig": {"v": "$3,780", "l": "Hourly rate contingency counsel could bill"}}, {"id": "s9", "sec": "Law & the Courts", "sid": "s-law", "h": "Newsom moves to commute all 548 California death sentences", "s": "Gov. Gavin Newsom said Thursday he will commute the sentences to life without parole, AP reported. The state constitution requires California Supreme Court approval for repeat felons. How many of the 548 need sign-off was not established.", "paras": ["Gov. Gavin Newsom said Thursday he will commute all 548 California death sentences to life without parole, writing that “state-sanctioned killing is incompatible with California’s values,” AP reported. The state constitution, however, requires <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">California Supreme Court approval<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The rule applies to clemency for anyone convicted of a felony more than once.<\/span><\/button> for repeat felons, so the Post wrote that he “moves to commute” while Bloomberg wrote “commutes.” How many of the 548 need sign-off was not established. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Voters<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>They rejected repeal in 2016. Newsom imposed a moratorium in 2019.<\/span><\/button> have kept the penalty. The ACLU is separately challenging the statute as racially discriminatory."], "why": "A single executive act empties the country’s largest death row against a voter-backed statute. Separation of powers is the live question, not the morality.", "c": {"L": 0, "LL": 2, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "AP via PBS", "u": "https://www.pbs.org/newshour/politics/newsom-says-he-will-commute-all-548-of-californias-death-sentences-to-life-without-parole", "t": "C"}, {"n": "Bloomberg Law", "u": "https://news.bloomberglaw.com/white-collar-and-criminal-law/newsom-commutes-sentences-of-all-california-death-row-inmates", "t": "C"}, {"n": "Washington Post", "u": "https://www.washingtonpost.com/nation/2026/11/05/newsom-begins-commuting-sentences-california-death-row-inmates/", "t": "LL"}, {"n": "NPR", "u": "https://www.npr.org/2026/11/05/nx-s1-6030961/newsom-announces-he-will-commute-sentences-of-inmates-on-californias-death-row", "t": "LL"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}, {"id": "s10", "sec": "The World", "sid": "s-world", "h": "Paraguay’s Congress blocks Peña’s resignation, presses impeachment", "s": "President Santiago Peña submitted his resignation Thursday, and deputies approved impeachment charges within the hour, MercoPress reported. A joint session lost quorum, so he remains president. The Senate needs 30 of 45 votes to remove him.", "paras": ["President Santiago Peña submitted his resignation Thursday, and deputies approved impeachment charges within the hour, all 78 present, MercoPress reported. A joint session to accept the resignation then lost quorum when Colorado lawmakers walked out, so Peña remains president, facing a Senate that needs 30 of 45 votes to remove him. The Senate summoned him for Friday, dpa reported. “Even if they have already made up their minds, I will exercise that right,” he wrote.", "The case is <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Ueno<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>A digital bank tied to Peña, who says he sold his stake in 2025; AP says he was a partner until March 2025. About 32,000 retirees collect through it.<\/span><\/button>, seized this week with about 3 million customers in a country of 6.5 million. AP counts $800 million to $850 million in public funds there, including about $380 million from the state pension and health fund, and three criminal probes are open. A <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">resignation<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Per MercoPress, an accepted exit makes a former president a senator for life, with immunity, a status that would outlast the presidency.<\/span><\/button>, if accepted, was the exit his own party closed."], "why": "A bank failure reached a sitting head of state within days of the seizure. Public pension money parked in a related-party bank is the fact pattern to remember.", "c": {"L": 1, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Al Jazeera", "u": "https://www.aljazeera.com/economy/2026/11/5/paraguay-president-pena-resigns-in-wake-of-bank-collapse", "t": "L"}, {"n": "AP via AJC", "u": "https://www.ajc.com/news/2026/11/paraguay-seizes-major-digital-bank-tied-to-president-leaving-millions-of-customers-in-limbo/", "t": "C"}, {"n": "MercoPress", "u": "https://en.mercopress.com/2026/11/05/paraguay-s-santiago-pena-tenders-his-resignation-but-congress-presses-ahead-with-impeachment", "t": null}, {"n": "dpa via Yahoo", "u": "https://www.yahoo.com/news/world/articles/paraguays-president-faces-impeachment-resignation-014909494.html", "t": null}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-06/s10.webp?h=c41adf05", "col": "#213a54", "cap": "The Palacio de los López, seat of the presidency, in Asunción.", "credit": "Stefano Vigorelli, CC0 / Wikimedia Commons", "pull": null, "fig": {"v": "$380 million", "l": "Approximate state pension and health fund money"}}, {"id": "s11", "sec": "The World", "sid": "s-world", "h": "“You’ll know soon enough”: Trump weighs Iran as tankers burn in the strait", "s": "Trump said Thursday he would rather not destroy the rest of Iran but “maybe I’ll have to,” the Times of Israel reported. Iranian forces said at least five tankers and a tugboat caught fire in Hormuz, citing mines, a claim sourced to Iran alone.", "paras": ["“I would rather not destroy the rest of the country if possible, but maybe I’ll have to,” Trump said of Iran in the Oval Office on Thursday, the Times of Israel reported. Iranian forces said at least five tankers and a tugboat caught fire in Hormuz, citing mines, a claim sourced to Iran alone. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">UKMTO<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The Royal Navy’s reporting desk for merchant shipping says most vessels now refuse to report attacks, so every count is a floor.<\/span><\/button> reported a tanker hit by two projectiles, and Al Jazeera counted over 120 commercial ships struck since the war began, October the worst month. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Iraq<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>It has lost over $60 billion in oil revenue, and oil is about 90 percent of its budget.<\/span><\/button> told Trump its soil will not launch attacks."], "why": "Wednesday’s oil collapse priced a settlement. Thursday’s 3 to 4 percent bounce shows how little of one exists.", "c": {"L": 2, "LL": 0, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "Times of Israel", "u": "https://www.timesofisrael.com/trump-says-hed-rather-not-destroy-iran-but-may-have-to-youll-know-soon-enough", "t": null}, {"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/5/iran-says-tankers-struck-in-hormuz-amid-fears-of-new-us-attack", "t": "L"}, {"n": "Al Jazeera (Iraq)", "u": "https://www.aljazeera.com/news/2026/11/6/iraqs-al-zaidi-talks-to-trump-as-baghdad-seeks-to-stay-out-of-war-on-iran", "t": "L"}, {"n": "The National", "u": "https://www.thenationalnews.com/news/mena/2026/11/06/youll-know-soon-enough-trump-considers-iran-options/", "t": null}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "fig": {"v": "over 120", "l": "Commercial ships struck since the war began"}}, {"id": "s12", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "The New York Times in exclusive talks to buy Letterboxd for $330 million", "s": "The Times reported Thursday it is in exclusive talks at about $330 million, citing two people familiar. TheWrap reported no agreement has been reached. Letterboxd had 28 million users by April, TechCrunch reported.", "paras": ["The New York Times Company is in exclusive talks to buy the film-logging app Letterboxd for about $330 million, the Times reported Thursday, citing two people familiar. That is about 22 times projected adjusted earnings of $15 million. “No agreement has been reached, and talks could still fall apart,” TheWrap reported. The company declined to comment.", "Letterboxd had 28 million users by April, up from 3 million in January 2021, and more than half are under 35, TechCrunch reported. The founders, <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Buchanan and von Randow<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>Matthew Buchanan and Karl von Randow, the New Zealand pair behind it, may stay on after a sale, TheWrap reported.<\/span><\/button>, are said to have favored the Times because studio buyers carry conflicts of interest. A24 was priced out and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Sony<span class=\"gloss-
