 reactions could not be confirmed at the source. The BILL and Mailchimp items rest on the companies’ own release and filings; no independent wire account of either signing was reached. The TIPS result is TIPSWatch’s; the auction’s allotment figures came only from a site that carried instructions aimed at automated readers, so they are not printed. The Riyadh damage account is Reuters’ as carried by Fox News. GTA VI sales are Sensor Tower estimates, and a later estimate of $2.36 billion including pre-orders lacks wire confirmation. Cut for length: Bell’s preliminary talks with Telus and Quebecor’s reply, offered again before Monday’s meeting; Vivid Seats’ deal handing lenders about 80 percent of its equity; The Hunger Games prequel’s $21.25 million in Thursday previews; Florida’s 20th execution of the year, a state record; the solicitor general’s withdrawal of the Venezuelan protected-status application; Google’s Gemini agent for the Mac. Magnitude check: the largest raise was Anthropic’s, now trading; the largest takeover signed in the window was BILL at about $6 billion; the largest contested bid remains Quebecor’s for Telus. Watch: Trump’s press conference today; Fed governors Waller at 8:25 a.m. and Cook at 12:15 p.m.; the Supreme Court’s next private conference on Dec. 4.", "items": [{"id": "s1", "sec": "The Front", "sid": "s-front", "h": "Anthropic opens at $111.50 and closes up 17 percent at $97.17", "s": "Anthropic’s shares first traded at $111.50 at 11:48 a.m. on Thursday, after a delayed opening auction, according to trade data compiled by StockTitan. The stock fell to $92.72 by 1:18 p.m. and closed at $97.17.", "paras": ["Anthropic’s shares first traded at $111.50 at 11:48 a.m. on Thursday, about 34 percent above the $83 offering price, after a delayed <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">opening auction<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Nasdaq’s IPO Cross releases a new listing only once the lead underwriter confirms buy and sell interest have been matched, which is how a first print can arrive more than two hours after the 9:30 bell.<\/span><\/button>, according to trade data compiled by StockTitan. The stock touched about $115 within minutes, fell to $92.72 by 1:18 p.m. and closed at $97.17, up 17.1 percent, on a day the broader market slid, NBC News and Fox News reported.", "More than 830 million shares changed hands. On the 13.2 billion shares outstanding, the close values the company near $1.28 trillion; CNBC’s figure of $1.8 trillion appears to count <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">fully diluted<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The count treats options, restricted units and other claims as already exercised. A half-trillion-dollar gap between the two measures is the equity promised to employees and partners beyond today’s float.<\/span><\/button> stock. Each of the seven co-founders sold about 3.4 million shares, roughly $280 million apiece and $1.95 billion in all, TechCrunch reported, and each has pledged 80 percent of his or her equity to philanthropy, a promise the prospectus calls revocable.", "Amazon’s 14.7 percent stake is worth more than $159 billion on $18 billion invested, TechCrunch said, and Google’s 13.7 percent is worth nearly $149 billion, and chip and cloud suppliers bought $26 billion in a placement at the offering price. Third-quarter revenue was $17 billion, against about $900 billion in computing commitments. Matt Levine titled Thursday’s column “Anthropic Pops.” CNBC reported the shares fell 6 percent in Friday premarket trading as Nvidia and AMD dropped."], "why": "A 17 percent first-day gain on an $81.3 billion raise leaves about $14 billion on the table, and the fade from the open is the number underwriters will defend when the next frontier lab files.", "c": {"L": 0, "LL": 1, "C": 2, "LR": 0, "R": 1}, "src": [{"n": "StockTitan", "u": "https://www.stocktitan.net/articles/anthropic-ipo-live-ant-first-trading-day-2026", "t": null}, {"n": "TechCrunch", "u": "https://techcrunch.com/2026/11/19/anthropics-7-founders-cashed-out-nearly-2b-in-record-breaking-ipo/", "t": "C"}, {"n": "Fox News", "u": "https://www.foxnews.com/live-news/anthropic-claude-ai-ipo-nasdaq-11-19-26", "t": "R"}, {"n": "NBC News", "u": "https://www.nbcnews.com/business/markets/live-blog/anthropic-ipo-live-updates-rcna610159", "t": "LL"}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/11/19/anthropic-ipo-ant-live-updates.html", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-20/s1.webp?h=83727c85", "col": "#592805", "cap": "The Nasdaq MarketSite in Times Square, where ANT began trading Thursday.", "credit": "ajay_suresh, CC BY 2.0 / Wikimedia Commons", "pull": {"text": "Voluntary, revocable expressions of each co-founder’s philanthropic intent.", "attr": "Anthropic prospectus, as quoted by TechCrunch, Nov. 19"}, "kp": ["The first trade came at 11:48 a.m., $111.50, about 34 percent above the offering price.", "The stock closed at $97.17, up 17.1 percent, after a low of $92.72.", "Each of seven co-founders sold about $280 million of stock in the offering."], "bg": "Anthropic priced 980 million shares at $83 on Wednesday, above a $70 to $78 range, raising $81.3 billion in the largest initial public offering on record, and a $26 billion supplier placement lifted the total to $107.3 billion, Reuters reported. Bloomberg Law put the legal fees and expenses at $41.5 million, against $25.5 million for SpaceX in June. Wilson Sonsini represented the company and Freshfields the underwriters, led by Goldman Sachs and Morgan Stanley, and Cleary advised the Long-Term Benefit Trust, Bar &amp; Bench reported. The company is a Delaware public benefit corporation.", "nx": "The offering was scheduled to close on Friday, Nov. 20, the company said.", "chart": {"type": "bar", "t": "Anthropic’s first day, dollars a share", "rows": [["Offering price", 83, "$83"], ["First trade", 111.5, "$111.50"], ["Low", 92.72, "$92.72"], ["Close", 97.17, "$97.17"]]}}, {"id": "s2", "sec": "The Front", "sid": "s-front", "h": "The Shenzhen text shields state officials from the ICC, omits Ukraine", "s": "The White House on Thursday released a four-point declaration signed by Donald Trump, Xi Jinping and Vladimir Putin after about 90 minutes of talks in Shenzhen, Fox News and The Independent reported. The text names no volumes, timetable or arms-control mechanism.", "paras": ["The White House on Thursday released a four-point declaration signed by Donald Trump, Xi Jinping and Vladimir Putin after about 90 minutes of talks in Shenzhen, Fox News and The Independent reported. It says “a nuclear war cannot be won and must never be fought,” calls for reform of the United Nations, and commits the three to “increase production and supplies of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">refined petroleum products<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The pledge lands as Ukrainian drone strikes have cut Russian refinery runs by about 45 percent since late October, Reuters reported, so Moscow gains most from a promise to keep fuel moving.<\/span><\/button>.” A fourth point calls state consent and the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">immunity of state officials<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Article 27 of the Rome Statute says official capacity is no bar to prosecution at the ICC, which is why the court issued a warrant for a sitting Russian president in 2023.<\/span><\/button> of “paramount importance” and warns the ICC not to “abuse” its jurisdiction. The court holds warrants for Putin and Benjamin Netanyahu.", "The text names no volumes, timetable or arms-control mechanism, and omits Ukraine, Europe and Iran. Trump rated the summit “a 12” out of 10, and Jared Kushner said Putin was “comfortable” with NATO-like guarantees for Ukraine, which would need Congress, Fox reported. Hours earlier, Russian strikes on Kyiv damaged the Austrian and Dutch embassies and killed one person, AFP reported. Trump landed at Joint Base Andrews at 8:01 p.m. and holds a press conference today."], "why": "Three nuclear powers, none an ICC memberInstitutionThe United States signed the Rome Statute in 2000 and withdrew its signature in 2002; Russia withdrew its signature in 2016; China never signed., put immunity for leaders into a joint text, a doctrinal move with more legal weight than its energy pledge.", "c": {"L": 0, "LL": 0, "C": 0, "LR": 0, "R": 1}, "src": [{"n": "Fox News", "u": "https://www.foxnews.com/live-news/trump-to-meet-xi-in-shenzhen-ahead-of-high-stakes-trilateral-talks-with-putin", "t": "R"}, {"n": "The Independent", "u": "https://sg.news.yahoo.com/trump-putin-xi-target-un-084654517.html", "t": null}, {"n": "AFP", "u": "https://www.yahoo.com/news/world/articles/russian-strikes-kyiv-kill-one-205810654.html", "t": null}, {"n": "Nasha Niva", "u": "https://nashaniva.com/en/409674", "t": null}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-20/s2.webp?h=acfc86b8", "col": "#2d3946", "cap": "", "credit": "Sparktour, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "kp": ["The declaration has four points: nuclear risk, UN reform, refined fuel supply and state immunity.", "It omits Ukraine, Europe and Iran, and sets no volumes or timetable.", "Russian strikes damaged two European embassies in Kyiv the same day."], "bg": "The three leaders met on the sidelines of the Asia-Pacific summit on Thursday and were first reported to have signed nothing; Chinese state media described a “peace declaration” before any text appeared. New START, the last treaty limiting US and Russian strategic forces, expired in February.", "nx": "Trump holds a White House press conference on Friday, Nov. 20, on trade deals with Thailand and the Philippines, Fox reported."}, {"id": "s3", "sec": "AI", "sid": "s-ai", "h": "The IMF’s Georgieva says AI investment demand will push rates up", "s": "Kristalina Georgieva told the Asia-Pacific summit on Thursday that demand from AI investment is lifting prices and, with the Middle East energy shock, calls for tighter monetary policy in many economies, the Guardian reported.", "paras": ["<button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Kristalina Georgieva<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>A Bulgarian economist and former World Bank chief executive who has run the IMF since 2019 and began a second five-year term in October 2024.<\/span><\/button>, managing director of the International Monetary Fund, told the Asia-Pacific summit on Thursday that demand from AI investment is lifting prices and, with the Middle East energy shock, calls for tighter monetary policy in many economies, the Guardian reported. She credited the AI rollout with stronger-than-expected growth. The IMF projects global inflation of 4.7 percent this year, and AI hardware is more than a tenth of world goods trade. The ECB, the Fed and the Bank of England have each raised rates since June."], "why": "If capital spending on AI raises the neutral rateConceptThe rate that neither speeds nor slows the economy. A surge in investment demand against a fixed pool of savings pushes it up, so policy that looked tight can turn loose., the cost of financing that spending rises with it, for every issuer in this paper.", "c": {"L": 0, "LL": 2, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "The Guardian", "u": "https://www.theguardian.com/world/2026/nov/19/imf-head-warns-ai-demand-push-up-interest-rates-apec", "t": "LL"}, {"n": "Finwire (Guardian copy)", "u": "https://finwire.io/news/economy-news/ai-demand-will-push-up-interest-rates-around-the-world-imf-head-warns", "t": "LL"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-20/s3.webp?h=520cf19e", "col": "#413624", "cap": "The International Monetary Fund headquarters in Washington.", "credit": "International Monetary Fund, Public domain / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "4.7 percent", "l": "global inflation the IMF projects this year"}}, {"id": "s4", "sec": "Markets & Deals", "sid": "s-mkt", "h": "TPG and Corpay agree to take BILL private at $63.25 a share", "s": "BILL Holdings agreed on Thursday to be acquired by TPG and Corpay in cash, an equity value of about $6 billion, the company said. Corpay invests about $1.1 billion for a minority stake.", "paras": ["BILL Holdings agreed on Thursday to be acquired by TPG and Corpay for $63.25 a share in cash, an equity value of about $6 billion and a 31 percent premium to the 60-day average price through Nov. 16, the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">unaffected date<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Bankers anchor a premium to the price before any leak, so the run-up caused by press reports counts toward the premium rather than the base, which makes the offer look richer.<\/span><\/button>, the company said. TPG Capital takes the majority, and Corpay invests about $1.1 billion for a minority stake, repeating the pair’s 2025 purchase of AvidXchange for $2.2 billion.", "The deal has no financing condition. Starboard Value and chief executive René Lacerte, who stays on, signed <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">support agreements<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Commitments by named holders to vote for the merger. They raise the cost of a topping bid, since an interloper starts out behind the locked-up shares.<\/span><\/button>. Fenwick &amp; West advised BILL, with Goldman Sachs and Qatalyst; Davis Polk advised TPG, with BofA, Deutsche Bank and RBC; and Sullivan &amp; Cromwell advised Corpay, with Barclays. Closing is expected in the first half of 2027."], "why": "A sponsor-plus-strategic club with three BigLaw teams is the take-private template for fallen fintech, and the lock-up shows how sponsors now neutralize an activist before signing.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "BILL release", "u": "https://www.bill.com/press-release/bill-to-be-acquired-by-tpg", "t": null}, {"n": "Yahoo Finance", "u": "https://finance.yahoo.com/markets/stocks/articles/bill-agrees-acquired-tpg-partnership-224600587.html", "t": null}, {"n": "Newsquawk (FT report)", "u": "https://www.newsquawk.com/headlines/tpg-is-nearing-a-take-private-deal-for-bill-holdings-bill-that-could-be-agreed-in-the-coming-days-reports-ft-citing-sources-added-the-timeline-could-shift-or-talks-could-collapse", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-20/s4.webp?h=6468c2e0", "col": "#3c3827", "cap": "Downtown San Jose, home of BILL.", "credit": "Michael from San Jose, California, USA, CC BY 2.0 / Wikimedia Commons", "pull": null, "kp": ["The price is $63.25 a share in cash, about $6 billion of equity.", "Corpay takes a minority stake for about $1.1 billion beside TPG.", "Starboard and the chief executive have agreed to vote in favor."], "bg": "The Financial Times reported this week that TPG was nearing a deal. TPG and Corpay closed their AvidXchange take-private in October 2025. Starboard, the activist, had built a stake in BILL before the sale.", "nx": "The deal needs shareholder and regulatory approval and is expected to close in the first half of 2027, the company said.", "fig": {"v": "31 percent", "l": "premium to the 60-day average price"}}, {"id": "s5", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Treasuries rally as stocks slide; 10-year TIPS sells at 2.903 percent", "s": "Yields fell across the curve on Thursday, according to Treasury’s par curve, as stocks slid on Anthropic’s debut day. TIPSWatch reported the high real yield was the highest for the term since July 2002.", "paras": ["The 2-year yield fell to 4.76 percent on Thursday from 4.80, the 10-year to 5.04 percent from 5.07 and the 30-year to 5.40 percent from 5.41, according to Treasury’s par curve, as stocks slid on Anthropic’s debut day. Treasury sold $19 billion of reopened 10-year <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">TIPS<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Notes whose principal rises with consumer prices. A real yield near 2.9 percent locks in that return above inflation for a decade, the best offer at the term in 24 years.<\/span><\/button> at a high real yield of 2.903 percent, the highest for the term since July 2002, TIPSWatch reported. The curve from 2 to 10 years sits at 28 basis points."], "why": "Buyers paid up for inflation protection three weeks before a December hike the market treats as settled, and every deal here prices off a 10-year above 5 percent.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "US Treasury par yield curve", "u": "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_yield_curve&field_tdr_date_value_month=202611", "t": null}, {"n": "TIPSWatch", "u": "https://tipswatch.com/2026/11/19/10-year-tips-auction-gets-real-yield-of-2-903-highest-in-24-years/", "t": null}, {"n": "CNBC", "u": "https://www.cnbc.com/2026/11/19/us-treasury-yields-investors-us-economy.html", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-20/s5.webp?h=152e89d8", "col": "#313845", "cap": "", "credit": "Tony Webster, CC BY-SA 3.0 / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": "", "chart": {"type": "line", "t": "Treasury par yields, Thursday, percent", "rows": [["2-year", 4.76, "4.76 percent"], ["10-year", 5.04, "5.04 percent"], ["30-year", 5.4, "5.40 percent"]]}}, {"id": "s6", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Intuit sells Mailchimp to Bending Spoons for $3.68 billion", "s": "Intuit agreed on Thursday to sell the company behind Mailchimp to a US unit of Bending Spoons in cash, subject to adjustment, according to an 8-K filing. Intuit will reinvest about $368 million in Bending Spoons shares.", "paras": ["Intuit agreed on Thursday to sell <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">The Rocket Science Group<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Mailchimp’s legal name since its founding in Atlanta in 2001 by Ben Chestnut and Dan Kurzius, who built it without venture capital before the 2021 sale.<\/span><\/button>, the company behind Mailchimp, to a US unit of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Bending Spoons<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>A Milan-based serial buyer of consumer software, including Evernote, Vimeo and WeTransfer. It reports to the SEC on Form 6-K as a foreign private issuer.<\/span><\/button> for $3.68 billion in cash, subject to adjustment, according to an 8-K filing. Intuit will reinvest about $368 million for 8,818,595 Bending Spoons shares and accept a two-year noncompete. The deal needs antitrust clearance, with an outside date of Aug. 19, 2027."], "why": "A carve-out at less than a third of the 2021 price, with the seller rolling equity into the buyer, is the write-down structure that private software deals now lean on.", "c": {"L": 0, "LL": 0, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "Intuit Form 8-K", "u": "https://www.sec.gov/Archives/edgar/data/0000896878/000119312526468834/d182669d8k.htm", "t": null}, {"n": "Bending Spoons Form 6-K", "u": "https://www.sec.gov/Archives/edgar/data/0002004711/000200471126000027/bsp_ex99-2.htm", "t": null}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-20/s6.webp?h=f5a50eca", "col": "#413629", "cap": "", "credit": "Tyler Lahti, CC BY-SA 2.0 / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "$12 billion", "l": "what Intuit paid, about"}}, {"id": "s7", "sec": "Law & the Courts", "sid": "s-law", "h": "Paul Hastings, Proskauer and Dechert match Cravath on pay", "s": "Paul Hastings matched the Cravath scale on Thursday and will pay its bonuses on Feb. 26, 2027, Above the Law reported. Proskauer and Dechert also matched, and Seyfarth Shaw announced another below-market package.", "paras": ["Paul Hastings matched the Cravath scale on Thursday: year-end bonuses of $20,000 to $115,000, special bonuses of $11,000 to $40,000 and salaries from $235,000 to $455,000, Above the Law reported. It will pay the bonuses on Feb. 26, 2027, tied to a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">fiscal year<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The scale is matched to the dollar while the payday is not. An associate who leaves before late February forfeits a bonus that Cravath peers have in hand by Dec. 11.<\/span><\/button> that begins Feb. 1, against Dec. 11 at Cravath and Dec. 18 at Cleary.", "Proskauer matched, with bonuses on Dec. 24 and raises on Jan. 1. Dechert matched, with raises on Jan. 1 and bonuses at the end of January, after <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">profits per equity partner<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The American Lawyer’s ranking metric, and the figure that tells a firm whether it can afford to match. A 27 percent rise gives Dechert room that flat-profit firms lack.<\/span><\/button> rose 27 percent last year. Tipsters told the site O’Melveny will match. Seyfarth Shaw announced another below-market package, leaving midlevel associates at least $45,000 behind the top of the scale."], "why": "Lockstep now covers the numbers and not the calendar, and the timing of a payday has become a retention lever written into each firm’s fiscal calendar.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Above the Law", "u": "https://abovethelaw.com/2026/11/paul-hastings-matches-cravath-now-can-the-rest-of-biglaw-get-moving/", "t": null}, {"n": "Above the Law (Proskauer)", "u": "https://abovethelaw.com/2026/11/biglaw-firm-gives-associates-three-reasons-to-celebrate-this-holiday-season/", "t": "C"}, {"n": "Above the Law (Dechert)", "u": "https://abovethelaw.com/2026/11/its-always-market-compensation-in-philadelphia/", "t": "C"}, {"n": "Above the Law (Seyfarth)", "u": "https://abovethelaw.com/2026/11/biglaw-firm-announces-yet-another-below-market-compensation-package-for-associates/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-20/s7.webp?h=80b8d416", "col": "#2e3945", "cap": "The MetLife Building on Park Avenue, home of Paul Hastings in New York.", "credit": "Trxr4kds, Public domain / Wikimedia Commons", "pull": null, "kp": ["Paul Hastings matched Cravath’s scale and pays its bonuses on Feb. 26, 2027.", "Proskauer pays Dec. 24, and Dechert pays at the end of January.", "Seyfarth Shaw again set pay below the market scale."], "bg": "Cravath set its 2027 scale on Nov. 17, with first-year salaries of $235,000 and special bonuses on top of year-end bonuses, payable Dec. 11. Cleary matched on Nov. 18 and pays Dec. 18. Above the Law put Paul Hastings’ gross revenue at $2.68 billion.", "nx": "Cravath pays its bonuses on Dec. 11, the first payday on the new scale.", "fig": {"v": "$455,000", "l": "top of Paul Hastings’ salary scale"}}, {"id": "s8", "sec": "Law & the Courts", "sid": "s-law", "h": "A judge lets part of Trump’s $15 billion suit against the Times proceed", "s": "U.S. District Judge Steven D. Merryday on Thursday let four counts proceed, built on seven accusations of criminal conduct in the book Lucky Loser, Fox News reported. He dismissed two counts and 27 statements.", "paras": ["U.S. District Judge <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Steven D. Merryday<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>The same Tampa judge struck the first version of this complaint in September 2025 as improperly long, and ordered it rewritten before any ruling on the merits.<\/span><\/button> on Thursday let four counts proceed, built on seven accusations of criminal conduct in the book Lucky Loser, finding plausible allegations of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">reckless disregard<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>One prong of the actual-malice test from New York Times v. Sullivan, a 1964 case the same paper won. It asks what the writer knew, not whether he bore ill will.<\/span><\/button>, Fox News reported. He dismissed two counts and 27 statements, and denied a third amendment. The Times, which must answer within 28 days, said it was encouraged that almost all claims were dismissed."], "why": "Surviving a motion to dismiss opens discovery into how the authors vetted their tax conclusions, the costliest phase of a libel case for any publisher.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 1}, "src": [{"n": "Fox News", "u": "https://www.foxnews.com/media/trump-clears-hurdle-15-billion-lawsuit-against-new-york-times", "t": "R"}, {"n": "Associated Press", "u": "https://www.yahoo.com/news/politics/articles/judge-rules-trump-defamation-case-221852555.html", "t": "C"}, {"n": "The Hill", "u": "https://thehill.com/media/6231675-trump-ny-times-lawsuit-proceeds/", "t": "C"}, {"n": "GV Wire (Reuters)", "u": "https://gvwire.com/2026/11/19/trumps-defamation-case-against-new-york-times-may-proceed-judge-rules/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-20/s8.webp?h=82f568f1", "col": "#3f3726", "cap": "", "credit": "Chiefmiz, CC0 / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "28 days", "l": "for the Times to answer"}}, {"id": "s9", "sec": "The World", "sid": "s-world", "h": "A suspected Houthi missile hits the tower of Saudi Arabia’s wealth fund", "s": "A suspected Houthi missile struck the PIF Tower in Riyadh’s King Abdullah Financial District early Thursday, Reuters reported. Saudi Civil Defense reported damage to several floors and nearby buildings and no injuries.", "paras": ["A suspected Houthi missile struck the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">PIF Tower<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Riyadh’s tallest building, at about 385 meters, designed by HOK and first planned as the home of the Capital Market Authority before the fund took it over.<\/span><\/button> in Riyadh’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">King Abdullah Financial District<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>Begun by the state pension agency in 2006 and transferred to the Public Investment Fund in 2018, which turned a stalled office park into the fund’s flagship.<\/span><\/button> early Thursday, shattering windows across as many as eight floors and bending parts of the facade, Reuters reported. Saudi Civil Defense reported damage to several floors and nearby buildings and no injuries, and the district was evacuated.", "Houthi spokesman Yahya Saree said cruise missiles were aimed at King Khalid International Airport and the financial center, CBS News reported. The coalition said it destroyed four ballistic missiles and a launch platform. It is the second strike on the district this month, after the Aramco building on Nov. 8, and Riyadh called it a terrorist attack."], "why": "The Public Investment Fund is the Gulf’s largest anchor investor and a regular bond issuer, and a hit on its headquarters puts war risk on the desk of every banker courting it.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 1}, "src": [{"n": "Fox News (Reuters copy)", "u": "https://www.foxnews.com/world/iran-backed-houthi-terrorist-attack-hits-riyadh-tallest-skyscraper-hq-saudi-public-investment-fund", "t": "R"}, {"n": "CBS News", "u": "https://www.cbsnews.com/live-updates/iran-war-us-gulf-retaliation-strikes-strait-of-hormuz/", "t": "C"}, {"n": "The National", "u": "https://www.thenationalnews.com/news/gulf/2026/11/19/saudi-sovereign-wealth-fund-tower-in-riyadh-damaged-in-houthi-strike/", "t": null}, {"n": "Gulf News", "u": "https://gulfnews.com/world/mena/us-israel-war-on-iran-saudi-faces-houthi-missiles-trump-delays-iran-decision-1.500754425", "t": null}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-20/s9.webp?h=4d085114", "col": "#3e3440", "cap": "The King Abdullah Financial District, seen from northeast Riyadh.", "credit": "B.alotaby, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "kp": ["The missile damaged as many as eight floors of the fund’s headquarters.", "Saudi Civil Defense reported no injuries, and the district was evacuated.", "It is the second strike on the financial district this month."], "bg": "A strike on the Aramco building in the same district on Nov. 8 opened the Houthi campaign against Riyadh’s financial center. Reuters reported on Nov. 18 that Saudi Arabia is planning for its war in Yemen to last into 2027. Qatar, Kuwait, the UAE and the Gulf Cooperation Council condemned Thursday’s attack.", "nx": ""}, {"id": "s10", "sec": "The World", "sid": "s-world", "h": "The IEA calls Hormuz the largest threat to energy security in history", "s": "The International Energy Agency said in its World Energy Outlook on Thursday that the crisis “dwarfs the scale of the oil shocks of the 1970s,” AFP reported. Bloomberg reported oil headed for a third weekly drop.", "paras": ["The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">International Energy Agency<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Founded in 1974 by oil-importing nations in answer to the Arab embargo, and still built around members’ duty to hold 90 days of net imports in emergency stocks.<\/span><\/button> said in its World Energy Outlook on Thursday that the crisis “dwarfs the scale of the oil shocks of the 1970s,” with consumers absorbing the impact as buffers run down, AFP reported. Brent traded at $92.19 on Thursday, Reuters said, and Bloomberg reported oil headed for a third weekly drop. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">UKMTO<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>A Royal Navy reporting cell in Dubai, not a regulator. Masters report voluntarily, so its count of attacks is a floor rather than a census.<\/span><\/button> counts about 14 incidents in November, and Trump told Israel’s Channel 12, “we will see what happens after January 1,” CBS reported."], "why": "Prices falling while attacks rise means buyers have priced supply, not safety, and that bet unwinds the day the strait closes.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "AFP", "u": "https://www.yahoo.com/news/world/articles/mideast-crisis-largest-threat-energy-124316792.html", "t": null}, {"n": "Reuters", "u": "https://finance.yahoo.com/news/oil-prices-steady-supply-surplus-024608326.html", "t": "C"}, {"n": "Bloomberg (via gCaptain)", "u": "https://gcaptain.com/iran-intensifies-hormuz-tanker-attacks-just-as-oil-prices-slide/", "t": "C"}, {"n": "CBS News", "u": "https://www.cbsnews.com/live-updates/iran-war-us-gulf-retaliation-strikes-strait-of-hormuz/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "$92.19", "l": "Brent on Thursday, Reuters said"}}, {"id": "s11", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "GTA VI sold an estimated $1.84 billion by Thursday morning", "s": "Grand Theft Auto VI sold about 19.1 million units by Thursday morning, according to Sensor Tower figures cited by Reuters. Take-Two called demand unprecedented but released no numbers.", "paras": ["Grand Theft Auto VI sold about 19.1 million units worth about $1.84 billion by Thursday morning, according to <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Sensor Tower<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>An app and storefront analytics firm. It models digital sales only, so boxed copies sold at retail are missing from its count.<\/span><\/button> figures cited by Reuters, against about $800 million on the first day of GTA V in 2013. Take-Two called demand unprecedented but released no numbers. “We tend to avoid claiming success before it occurs,” chief executive Strauss Zelnick said. The shares fell about 1 percent after a 6 percent gain Wednesday, as analysts turned to the timing of the next <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">GTA Online<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The multiplayer service, not the boxed story game, is what carried GTA V’s revenue for a decade through in-game currency sales.<\/span><\/button>."], "why": "A billion-dollar budget recouped in a day reprices every studio’s financing math, and Miami’s likeness is now the most valuable set in entertainment.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "Reuters (via The Star)", "u": "https://www.thestar.com.my/tech/tech-news/2026/11/20/take-two-set-to-shatter-sales-records-as-039gta-vi039-launches-to-massive-fanfare", "t": "C"}, {"n": "Reuters (wire copy)", "u": "https://www.globalbankingandfinance.com/take-two-set-shatter-sales-records-gta-vi-launches-massive/", "t": "C"}, {"n": "Notebookcheck", "u": "https://www.notebookcheck.net/GTA-6-passes-2-36-billion-in-estimated-launch-day-sales.1455216.0.html", "t": null}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-20/s11.webp?h=02b5ebdf", "col": "#3f381a", "cap": "Ocean Drive in the Miami Beach Art Deco Historic District, the model for the game’s Vice City.", "credit": "Robbschultz69, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "$800 million", "l": "GTA V’s first day in 2013, about"}}, {"id": "s12", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "Partners Group buys control of Rawlings, and MLB keeps a stake", "s": "Partners Group agreed on Thursday to buy a majority of Rawlings, maker of Easton and Combat gear, from Seidler Equity, Front Office Sports reported. No price was disclosed.", "paras": ["<button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Partners Group<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>A private-markets firm based in Baar, near Zug, and listed on the SIX Swiss Exchange. In September it also bought Sports Entertainment Group, a talent agency with more than 1,000 clients.<\/span><\/button>, with $186 billion under management, agreed on Thursday to buy a majority of Rawlings, maker of Easton and Combat gear, from Seidler Equity, Front Office Sports reported. MLB, which bought the company with Seidler from Newell in 2018, keeps what the release calls meaningful ownership. No price was disclosed. Latham &amp; Watkins advised the buyer, O’Melveny &amp; Myers and Jefferies advised Rawlings, and Paul, Weiss advised MLB."], "why": "A league that owns part of the company making its official ballConceptRawlings has supplied the major league ball since 1977, when it replaced Spalding, so any change in the ball’s construction is a league decision as well as a vendor’s. now shares it with private equity, which puts the maker of the game’s one indispensable input inside a sponsor’s fund and its exit timeline.", "c": {"L": 0, "LL": 0, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "Front Office Sports", "u": "https://frontofficesports.com/article/swiss-pe-firm-buys-mlbs-official-baseball-supplier-rawlings/", "t": null}, {"n": "Partners Group release", "u": "https://www.prnewswire.com/news-releases/partners-group-acquires-rawlings-sporting-goods-the-leading-baseball-and-softball-equipment-provider-302944699.html", "t": null}, {"n": "Swissinfo", "u": "https://www.swissinfo.ch/eng/partners-group-snaps-up-majority-in-rawlings-sporting-goods/92408562", "t": null}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "$186 billion", "l": "Partners Group’s assets under management"}}, {"id": "s13", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "Netflix starts a comedy studio and signs Nikki Glaser to an overall deal", "s": "Netflix set up Netflix Is a Joke Studios on Thursday to build scripted series and new formats beside its stand-up slate, The Hollywood Reporter reported. Terms of the Glaser deal were not disclosed.", "paras": ["Netflix set up <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Netflix Is a Joke<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The name began as a stand-up brand and a Los Angeles comedy festival first staged in 2022, and now labels a studio that develops scripted shows.<\/span><\/button> Studios on Thursday to build scripted series and new formats beside its stand-up slate, and signed Nikki Glaser to an <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">overall deal<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>An exclusive pact that pays talent to develop only for one company, whether or not any project is made, which is why studios ration them.<\/span><\/button>, The Hollywood Reporter reported. It covers a scripted series she will star in, produced by Will Ferrell and Jessica Elbaum’s Gloria Sanchez Productions, and two stand-up specials. Terms were not disclosed. WME, Brillstein and the law firm Ginsburg Daniels represent her."], "why": "Stand-up is the cheapest programming a streamer buys, and turning comics into series talent under one studio moves the leverage to the lawyers who draft the overall deals.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "The Hollywood Reporter", "u": "https://www.hollywoodreporter.com/tv/tv-news/nikki-glaser-overall-deal-netflix-1236759294/", "t": null}, {"n": "Deadline", "u": "https://deadline.com/2026/11/nikki-glaser-netflix-partnership-netflix-is-a-joke-studios-1237229256/", "t": "C"}, {"n": "Variety", "u": "https://variety.com/2026/tv/news/nikki-glaser-netflix-scripted-series-specials-1236952642/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-20/s13.webp?h=7339186b", "col": "#2b3a43", "cap": "", "credit": "Andreas Praefcke, CC BY 3.0 / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": ""}], "week": [], "cover": "img/2026-11-20/s1.webp?h=83727c85"}, {"date": "2026-11-19", "no": 175, "min": 9.9, "stand": "Anthropic goes public at a record $81.3 billion; three leaders meet in Shenzhen and sign nothing; UniCredit settles with Berlin; and Van Gogh sets a mark.", "note": "Editor’s note. 13 items at 2,371 read-words, inside the ten-minute cap. Disclosure: Anthropic, whose model compiles this paper, is the subject of the lead story and appears in the GAO item, where it said it could not verify the findings; the lead rests on the company’s release and on Reuters, TechCrunch and Forbes, and the valuation figures are Reuters’. Cut for length: Palo Alto Networks’ $4.5 billion all-stock purchase of Applied Compute, the largest new acquisition in the window, offered again on a fresh beat. The UniCredit item rests on a single Reuters exclusive. The Shenzhen “peace declaration” rests on Chinese state media as relayed by Al Jazeera, and no text was published. Reports differ on whether the Fourth Circuit ruled Tuesday or Wednesday; the coverage ran Wednesday. The 20-year auction’s tail and bid-to-cover could not be confirmed from a vetted source, and Treasury’s par curve for Wednesday was not available, so no closing yields are printed. The Wells Fargo and Oppenheimer figures are analyst estimates relayed by Reuters. Not run: the solicitor general’s emergency application on Venezuelans’ protected status, due before a Friday deadline; the International Court of Justice’s Rohingya genocide ruling, due today and offered then; a two-hour meeting between Naftali Bennett and Benjamin Netanyahu; a $600 million Ponzi case in Manhattan; Google’s Gemini 4 Neon, priced below Anthropic’s top model; Commerce’s remote-access chip rule, whose Federal Register publication could not be confirmed; a tanker struck off Oman. Magnitude check: the largest raise was Anthropic’s $81.3 billion; the largest takeover, UniCredit and Commerzbank at about €45 billion, settled in the window; Quebecor’s bid for Telus took no new step. Sourcing limits: the Times, the Guardian and National Review were queried, with no page on today’s stories reached; NPR, CNN, NBC and CNBC pages were seen but would not open. Watch: ANT’s first trade and the 10-year TIPS sale today; the Berlin press conference at 17:15; the ICJ ruling; the Supreme Court on protected status by Friday.", "items": [{"id": "s1", "sec": "The Front", "sid": "s-front", "h": "Anthropic prices a record IPO at $83 a share, raising $81.3 billion", "s": "Anthropic priced 980 million Class A shares at $83 on Wednesday, above a marketed range of $70 to $78, Reuters reported. The stock begins trading on the Nasdaq Global Select Market today under the symbol ANT.", "paras": ["Anthropic priced 980 million Class A shares at $83 on Wednesday, above a marketed range of $70 to $78, raising $81.3 billion in the largest initial public offering on record, Reuters reported. The stock begins trading on the Nasdaq Global Select Market today under the symbol ANT, and the offering is expected to close on Friday, the company said.", "The deal was upsized by about 19 percent and tops the $75 billion SpaceX raised in June. A $26 billion <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">concurrent private placement<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Stock sold directly to chosen buyers outside the registered float. TechCrunch reported these shares carry no vote, so the companies that sell Anthropic its chips and cloud capacity become holders without a say in governance.<\/span><\/button> at the IPO price, bought by AMD, Broadcom, Google, Micron, Microsoft, Nvidia and TSMC Partners, lifts the total to $107.3 billion, Reuters said. The price values the company at about $1.5 trillion <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">fully diluted<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A count that treats every option, restricted unit and convertible claim as already exercised. The $400 billion gap to the undiluted figure measures the equity promised beyond the shares now issued.<\/span><\/button> and $1.1 trillion undiluted, against $965 billion in its May private round, TechCrunch reported. Anthropic sold 956.4 million shares, <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">selling stockholders<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Existing holders who sell in the offering and keep the proceeds. The seven co-founders each sold nearly 3.4 million shares, about $282 million apiece, according to the S-1 as TechCrunch reported it.<\/span><\/button> sold 23.6 million, and the banks hold a 30-day <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">greenshoe<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Named for the Green Shoe Manufacturing Company, whose 1963 offering first used it. Banks over-allot and cover by buying in the market if the stock sags, which supports the debut price.<\/span><\/button> on 147 million more.", "Goldman Sachs and Morgan Stanley lead a 22-bank syndicate. Amazon owns nearly 15 percent and Google almost 14 percent, TechCrunch said. The filing shows an annualized revenue run rate of $81 billion at Oct. 31, third-quarter revenue of $16.96 billion and a net loss of $23.3 billion, against about $900 billion in computing commitments, Reuters reported. The issuer is a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">public benefit corporation<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A Delaware form that obliges directors to balance a stated public benefit against shareholder returns. Holders of at least 2 percent of the shares can sue to enforce that balancing.<\/span><\/button>. Nasdaq 100 futures rose 1.83 percent early Thursday."], "why": "The largest equity raise in history turns a safety-branded lab into a listed company answerable to public holders. Its book, its supplier placement and its benefit charter will be the precedents capital markets lawyers cite next year.", "c": {"L": 0, "LL": 1, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Anthropic pricing release", "u": "https://www.anthropic.com/news/anthropic-prices-initial-public-offering", "t": null}, {"n": "Reuters (via RTÉ)", "u": "https://www.rte.ie/news/business/2026/1119/1599784-anthropic-raises-81-billion-in-ipo/", "t": "C"}, {"n": "TechCrunch", "u": "https://techcrunch.com/2026/11/18/anthropic-reportedly-prices-ipo-at-83-a-share-above-projected-range/", "t": "C"}, {"n": "Forbes", "u": "https://www.forbes.com/sites/fionariley/2026/11/18/anthropic-ipo-live-updates-81-billion-raised-breaking-spacexs-record/", "t": "C"}, {"n": "NPR", "u": "https://www.npr.org/2026/11/18/nx-s1-6046212/anthropic-record-ipo-price", "t": "LL"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-19/s1.webp?h=096dedde", "col": "#592805", "cap": "The Nasdaq MarketSite in Times Square, where ANT begins trading today.", "credit": "ajay_suresh, CC BY 2.0 / Wikimedia Commons", "pull": {"text": "Our thesis is that the vast amount of value will accrue to whoever is at the frontier.", "attr": "Peter Singlehurst, Baillie Gifford, to Reuters, Nov. 19"}, "kp": ["Anthropic priced 980 million shares at $83, above its $70 to $78 range.", "A $26 billion placement to chip and cloud suppliers lifts the total to $107.3 billion.", "The company lists on Nasdaq as a public benefit corporation under the symbol ANT."], "bg": "Anthropic set its range in an amended filing on Nov. 10. Bloomberg and the Financial Times reported on Nov. 11 that the book was covered several times over, and Reuters reported on Nov. 13 that orders from China and Hong Kong were turned away. The company raised $65 billion at a $965 billion valuation in May, and had reportedly sought about $2 trillion months ago, TechCrunch said. SpaceX set the previous record in June, raising $75 billion at a $1.77 trillion valuation. Nvidia, one of the placement buyers, reported $115.8 billion of quarterly revenue on Nov. 17, the day before the pricing.", "nx": "Trading opens today on Nasdaq, and the offering is expected to close on Friday, Nov. 20, the company said.", "chart": {"type": "bar", "t": "Money raised, in billions of dollars", "rows": [["IPO", 81.3, "$81.3 billion"], ["With placement", 107.3, "$107.3 billion"], ["SpaceX, June", 75, "$75 billion"]]}}, {"id": "s2", "sec": "The Front", "sid": "s-front", "h": "Trump, Xi and Putin meet in Shenzhen and sign nothing", "s": "Donald Trump, Xi Jinping and Vladimir Putin met for more than an hour at a villa in Shenzhen on Thursday, the Associated Press reported. No agreement was signed, the AP and Reuters reported.", "paras": ["Donald Trump, Xi Jinping and Vladimir Putin met for more than an hour at a villa in Shenzhen on Thursday, on the sidelines of the Asia-Pacific summit, the Associated Press reported. Trump said the three were “uniquely positioned to discuss how to reduce the number of nuclear weapons on Earth,” with no US-Russian treaty limits in force since <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">New START<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Signed in 2010, it capped each side at 1,550 deployed strategic warheads. China was never a party, and its arsenal is far smaller, which is why Beijing has resisted three-way limits.<\/span><\/button> lapsed, and added, “We’re not going to let Iran have a nuclear weapon.” He met Putin alone for about 40 minutes, their first meeting since <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Alaska<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>The August 2025 summit at Joint Base Elmendorf-Richardson in Anchorage, which ended without a ceasefire in Ukraine or a joint statement.<\/span><\/button>.", "No agreement was signed, the AP and Reuters reported. Chinese state media described a “peace declaration” committing to stable energy flows, Al Jazeera said, and no text has been published. Chinese state television quoted Xi as saying “a nuclear war cannot be won and must never be fought,” and he did not mention Ukraine, Reuters said. Trump and Xi discussed restoring oil flows through the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Strait of Hormuz<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>About a fifth of world oil consumption moved through it before the war. Brent traded near $92 a barrel on Thursday morning, below the $95 settle of Monday.<\/span><\/button>, and Trump ruled out new sanctions on Russia. Ukraine was not in the room."], "why": "A great-power table without Ukraine or Europe sets the terms for sanctions, energy and arms-control work, and the US-China trade truce still expires on Jan. 10.", "c": {"L": 1, "LL": 1, "C": 1, "LR": 0, "R": 1}, "src": [{"n": "Associated Press", "u": "https://wsvn.com/news/politics/trump-xi-putin-nukes/", "t": null}, {"n": "Reuters", "u": "https://lufkindailynews.com/news_reuters/top_news/trump-xi-putin-begin-historic-meeting-with-ukraine-war-on-agenda/article_e5c1dbaf-fab8-53b5-86d1-bb74467d0948.html", "t": "C"}, {"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/liveblog/2026/11/19/apec-live-trump-xi-and-putin-to-meet-in-historic-three-way-china-summit", "t": "L"}, {"n": "CNN", "u": "https://www.cnn.com/2026/11/17/politics/live-news/trump-visit-china-philippines", "t": "LL"}, {"n": "Fox News", "u": "https://www.foxnews.com/live-news/trump-to-meet-xi-in-shenzhen-ahead-of-high-stakes-trilateral-talks-with-putin", "t": "R"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-19/s2.webp?h=5927e56a", "col": "#2d3946", "cap": "", "credit": "Sparktour, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "kp": ["The three leaders talked for more than an hour and signed no agreement.", "Chinese state media described a peace declaration on energy flows, with no published text.", "Trump ruled out new Russia sanctions, and Ukraine was not present."], "bg": "China confirmed the meeting on Nov. 17 as Trump arrived in Manila for Quad talks. New START, the last treaty limiting US and Russian strategic forces, expired in February. French Foreign Minister Jean-Noël Barrot said “these three leaders agree on nothing,” the AP reported, and Chinese officials barred a Bloomberg reporter from the event.", "nx": "The US-China trade truce expires on Jan. 10, the AP reported.", "fig": {"v": "40 minutes", "l": "Trump’s meeting alone with Putin, about"}}, {"id": "s3", "sec": "AI", "sid": "s-ai", "h": "A GAO test got ChatGPT, Claude, Gemini and Grok to plan attacks in the US", "s": "Investigators for the Government Accountability Office got ChatGPT, Claude, Gemini and Grok each to generate plans for attacks inside the United States in under 12 hours, according to a 61-page report described by CBS News and the Associated Press.", "paras": ["Investigators for the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Government Accountability Office<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Congress’s audit and investigative arm. It takes assignments from members and committees, which is how a single senator could commission covert tests of commercial products.<\/span><\/button> got ChatGPT, Claude, Gemini and Grok each to generate plans for attacks inside the United States in under 12 hours, according to a 61-page report described by CBS News and the Associated Press on Wednesday. Two produced bombing plans and two produced plans against the electric grid; the report notes many specifics were already online and some were wrong. Sen. Maggie Hassan, who requested it, plans hearings in January. Anthropic, which built the model that compiles this paper, said it “cannot verify” the results, and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">SpaceXAI<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The name under which xAI, the maker of Grok, now operates, Gizmodo has reported, which puts the chatbot inside the SpaceX group that is in merger talks with Tesla.<\/span><\/button> said it works on safety with each release."], "why": "A federal auditor’s finding that every major model can be talked into attack planning gives plaintiffs and state attorneys general a government record to cite, three days after California sued OpenAI over safety.", "c": {"L": 0, "LL": 1, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "CBS News", "u": "https://www.cbsnews.com/news/ai-platforms-plan-us-terror-attack-when-asked-to-senate-hearings/", "t": "C"}, {"n": "Washington Post", "u": "https://www.washingtonpost.com/business/2026/11/18/ai-terrorism-risks-anthropic-grok-gemini-claude/03d1ea28-e337-11f1-a99e-b3e3805c6b8b_story.html", "t": "LL"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-19/s3.webp?h=ab724b6a", "col": "#323d16", "cap": "The Government Accountability Office building in Washington.", "credit": "ajay_suresh, CC BY 2.0 / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": ""}, {"id": "s4", "sec": "Markets & Deals", "sid": "s-mkt", "h": "UniCredit and Berlin reach a broad deal on Commerzbank", "s": "UniCredit and the German government have reached a broad agreement on UniCredit’s takeover of Commerzbank, Reuters reported Wednesday in an exclusive. Commerzbank keeps its headquarters in Frankfurt as a listed company.", "paras": ["UniCredit and the German government have reached a broad agreement on UniCredit’s takeover of Commerzbank, Reuters reported Wednesday in an exclusive. In a letter dated Nov. 18, chief executive <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Andrea Orcel<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>A former UBS investment-banking chief who has run UniCredit since 2021. Santander withdrew his appointment as its chief executive in 2019 over his pay, and he later won damages from the Spanish bank in court.<\/span><\/button> committed the Italian bank to binding principles: Commerzbank keeps its headquarters in Frankfurt as a listed company, and Germans will sit on UniCredit’s board. Berlin dropped its demand to name two Commerzbank supervisory board members.", "UniCredit holds nearly 50 percent of Commerzbank, built through market purchases and <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">derivatives<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Total-return swaps and similar contracts give economic exposure that can later convert to shares, which let UniCredit pass ownership thresholds in steps rather than through a tender offer.<\/span><\/button>, and its approach was valued at about €45 billion, against a Commerzbank market value of about €44.7 billion. The government holds 13.3 percent, and Finance Minister <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Lars Klingbeil<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>Also vice chancellor and co-leader of the Social Democrats. Berlin bought its stake in the 2009 bank rescue, so a sale is a political decision as much as a fiscal one.<\/span><\/button> made no commitment to sell. European Central Bank, European Commission and Federal Reserve clearances are in hand, and Commerzbank now says a combination could “create value,” Reuters said."], "why": "A hostile cross-border bank takeover built by stake-building and then settled by letter with a government is a rare template for European consolidation, and for the governance covenants that close one.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "Reuters", "u": "https://www.marketscreener.com/news/unicredit-and-germany-reach-broad-agreement-on-commerzbank-takeover-ce785edddf8cf522", "t": "C"}, {"n": "Reuters (wire copy)", "u": "https://lufkindailynews.com/news_reuters/business/exclusive-unicredit-and-germany-reach-broad-agreement-on-commerzbank-takeover/article_0df98526-8897-58f7-9366-69d24066ddff.html", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-19/s4.webp?h=8032d3d4", "col": "#293a4a", "cap": "", "credit": "Daniel Case, CC BY-SA 3.0 / Wikimedia Commons", "pull": null, "kp": ["UniCredit committed by letter to keep Commerzbank listed and headquartered in Frankfurt.", "Berlin dropped its demand to name two supervisory board members.", "The government holds 13.3 percent and has made no commitment to sell."], "bg": "UniCredit took a 9 percent stake in September 2024, half of it bought from the government, and then raised its position through derivatives, drawing objections from two German governments and from Commerzbank’s management. Regulators in Frankfurt, Brussels and Washington have already cleared the combination, Reuters reported, which leaves the agreement with Berlin as the last political step.", "nx": "", "fig": {"v": "€45 billion", "l": "Value of UniCredit’s approach, about"}}, {"id": "s5", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Fed minutes float a bigger hike; the 20-year clears at 5.459 percent", "s": "Minutes of the Oct. 27-28 meeting show almost all participants judged further increases necessary, Bloomberg reported. Treasury sold $16 billion of 20-year bonds at a high yield of 5.459 percent, Reuters reported.", "paras": ["Minutes of the Oct. 27-28 meeting, released Wednesday, show almost all participants judged further increases necessary, and a couple said a move of “more than 25 basis points” could be warranted in December if data proved unfavorable, Bloomberg reported. Some called the decision to hold a “close call.” Treasury sold $16 billion of 20-year bonds at a high yield of 5.459 percent, with 70.87 percent of bids <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">at the high<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The share of bids placed at the clearing yield that got filled. A high figure means demand bunched at the stop-out level rather than below it.<\/span><\/button> allotted, Reuters reported. FedWatch priced a 91.7 percent chance of a quarter-point December hike, InvestmentNews said. Treasury reopens $19 billion of 10-year <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">TIPS<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Notes whose principal rises with consumer prices. Secondary trading implied a real yield near 2.87 percent, which would be the highest at a 10-year sale since October 2008, TIPSWatch noted.<\/span><\/button> today."], "why": "A half-point hike moved from tail risk into the minutes, and every deal in this paper, Anthropic’s included, prices off that curve.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Bloomberg (via Transport Topics)", "u": "https://www.ttnews.com/articles/fed-officials-back-rate-hike", "t": "C"}, {"n": "InvestmentNews", "u": "https://www.investmentnews.com/equities/the-fed-came-close-to-an-october-rate-hike-fomc-minutes-show/269079", "t": "C"}, {"n": "Reuters (20-year result)", "u": "https://www.marketscreener.com/news/us-treasury-sells-16-billion-in-20-year-bonds-at-high-yield-of-5-459-ce785edddd80f020", "t": "C"}, {"n": "TIPSWatch", "u": "https://tipswatch.com/2026/11/15/this-weeks-10-year-tips-auction-shows-a-lot-of-potential/", "t": null}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-19/s5.webp?h=20a48bb4", "col": "#3c3829", "cap": "", "credit": "Rob Young from United Kingdom, CC BY 2.0 / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": "", "fig": {"v": "91.7 percent", "l": "FedWatch odds of a quarter-point December hike"}}, {"id": "s6", "sec": "Markets & Deals", "sid": "s-mkt", "h": "GEO Group sells its Tacoma center to Homeland Security for $453 million", "s": "GEO Group sold the 1,635-bed Northwest ICE Processing Center in Tacoma, Wash., to the Department of Homeland Security for $453 million, Oregon Public Broadcasting reported. GEO said net proceeds, plus cash, will fund a $500 million accelerated share repurchase.", "paras": ["<button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">GEO Group<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>A real estate investment trust until 2021, when it became an ordinary corporation. Selling the building while keeping the operating contract moves it further from the landlord model it was built on.<\/span><\/button> sold the 1,635-bed Northwest ICE Processing Center in Tacoma, Wash., to the Department of Homeland Security for $453 million and will keep running it under a 10-year, $1.5 billion contract signed weeks earlier, Oregon Public Broadcasting reported. GEO said about $340 million of net proceeds, plus cash, will fund a $500 million <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">accelerated share repurchase<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A bank borrows and delivers most of the shares at once, then settles against the average price over months, so the share count drops immediately while the final cost floats.<\/span><\/button>. The city assessed the property at $72.6 million. Rep. Pramila Jayapal called the sale a “gross misuse of taxpayer dollars.”"], "why": "A sale at about six times assessed value, paid by the agency that is also the client, turns a Boca Raton company’s buyback into an appropriations question.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "Oregon Public Broadcasting", "u": "https://www.opb.org/article/2026/11/18/geo-sells-tacoma-detention-center/", "t": null}, {"n": "Investing.com", "u": "https://www.investing.com/news/company-news/geo-group-sells-washington-facility-for-453m-plans-buyback-93CH-5035650", "t": "C"}, {"n": "KOMO News", "u": "https://komonews.com/news/local/ice-buys-tacoma-immigrant-detention-facility-for-453m-geo-group-to-provide-services-department-homeland-security-arrest-immigration-trump-federal-government-community-protests-lawsuits-funding-washington", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "kp": [], "bg": "", "nx": "", "chart": {"type": "bar", "t": "Tacoma center, in millions of dollars", "rows": [["Sale price", 453, "$453 million"], ["Assessed value", 72.6, "$72.6 million"]]}}, {"id": "s7", "sec": "Law & the Courts", "sid": "s-law", "h": "Cleary Gottlieb matches Cravath’s bonuses within a day", "s": "Cleary Gottlieb matched Cravath’s associate pay on Wednesday, a day after Cravath’s memo, Above the Law reported. Base salaries run from $235,000 for the class of 2026 to $455,000 for 2019 and senior from Jan. 1.", "paras": ["<button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Cleary Gottlieb<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Founded in 1946 by lawyers who left Root, Clark, Buckner &amp; Ballantine. It is a leading adviser to sovereign and Latin American issuers, which gives its pay decisions weight in capital markets practices.<\/span><\/button> matched Cravath’s associate pay on Wednesday, a day after Cravath’s memo, Above the Law reported: year-end bonuses from a prorated $15,000 to $115,000, and special bonuses from a prorated $11,000 to $40,000 for the class of 2021 and above. Base salaries run from $235,000 for the class of 2026 to $455,000 for 2019 and senior from Jan. 1, with the first payroll on Jan. 15.", "Cleary’s salary figures include its retirement-plan contribution. The firm sets no billable-hours requirement, and associates must be employed and in <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">good standing<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A retention condition. An associate who gives notice before the payment date forfeits the bonus, which holds people in place through the year-end lateral season.<\/span><\/button> on Dec. 18, the payment date. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Baker Botts<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>A Houston firm founded in 1840 and best known for energy work. Above the Law puts its annual revenue at about $843 million.<\/span><\/button> announced Cravath-level bonuses plus raises, with larger awards for top performers, and Choate Hall &amp; Stewart announced changes as well, Above the Law said; neither firm’s figures were published in readable form."], "why": "These are the numbers a capital markets summer associate will be hired against, and a match from a firm of Cleary’s rank inside a day makes Cravath’s scale the market.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "Above the Law", "u": "https://abovethelaw.com/2026/11/that-didnt-take-long-the-first-biglaw-firm-to-match-cravath/", "t": null}, {"n": "Above the Law (Baker Botts)", "u": "https://abovethelaw.com/2026/11/biglaw-firm-goes-big-on-raises-and-even-bigger-on-bonuses/", "t": "C"}, {"n": "Above the Law (roundup)", "u": "https://abovethelaw.com/2026/11/three-down-the-rest-of-biglaw-to-go-see-also/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-19/s7.webp?h=8896ac30", "col": "#313845", "cap": "One Liberty Plaza in lower Manhattan, home of Cleary Gottlieb’s New York office.", "credit": "Ken Lund from Reno, Nevada, USA, CC BY-SA 2.0 / Wikimedia Commons", "pull": null, "kp": ["Cleary matched Cravath’s year-end and special bonuses a day after Cravath’s memo.", "Cleary’s salaries run from $235,000 to $455,000, including a retirement contribution.", "Baker Botts and Choate Hall &amp; Stewart announced changes the same day."], "bg": "Cravath announced its 2027 scale on Nov. 17, with salaries of $235,000 to $440,000 and top combined bonuses of $155,000, up from $140,000. Milbank had set the salary grid in June. Last year Cravath moved first, on Nov. 18, 2025, and Milbank followed six days later. Firms in the lockstep tier match quickly because recruits compare offers on the same grid.", "nx": "Cleary pays the bonuses on Dec. 18.", "chart": {"type": "bar", "t": "Top associate bonuses at Cleary", "rows": [["Year-end", 115000, "$115,000"], ["Special", 40000, "$40,000"]]}}, {"id": "s8", "sec": "Law & the Courts", "sid": "s-law", "h": "A divided Fourth Circuit lets Maryland apply its gambling law to Kalshi", "s": "A Fourth Circuit panel affirmed the denial of an injunction that would have stopped Maryland from enforcing its gaming law against Kalshi’s sports event contracts, Reuters and CBS News reported Wednesday. Judge DeAndrea Gist Benjamin dissented.", "paras": ["A Fourth Circuit panel, in a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">per curiam<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>An unsigned opinion for the court. With three separate rationales behind it, the ruling fixes the result but binds later panels to no single theory of preemption.<\/span><\/button> opinion, affirmed the denial of an injunction that would have stopped Maryland from enforcing its gaming law against Kalshi’s sports event contracts, Reuters and CBS News reported Wednesday. Judge Roger Gregory concurred without deciding whether the contracts are swaps, writing that “Congress knows how to displace traditional state police powers when it chooses to do so.” Judge Stephanie Thacker found they are not swaps. Judge DeAndrea Gist Benjamin dissented, finding them <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">swaps<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The statutory definition reaches contracts that pay on an event’s occurrence. The Third Circuit read it to protect Kalshi, and the Sixth and Ninth did not, Unchained reported, so the split now runs three ways.<\/span><\/button> under the CFTC’s exclusive jurisdiction."], "why": "Prediction-market preemption now divides the circuits, and with the CFTC suing Arkansas on the same question, a Supreme Court petition is the likely next filing.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "CBS News Baltimore", "u": "https://www.cbsnews.com/baltimore/news/maryland-kalshi-lawsuit-appeal-denied/", "t": "C"}, {"n": "Reuters (via The Daily Record)", "u": "https://thedailyrecord.com/2026/11/18/kalshi-loses-appeal-block-maryland-gaming-regulation/", "t": "C"}, {"n": "Unchained", "u": "https://unchainedcrypto.com/kalshi-loses-fourth-circuit-bid-to-block-maryland-gambling-rules-as-judges-split-on-why/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-19/s8.webp?h=214b45ea", "col": "#403625", "cap": "", "credit": "Acroterion, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "kp": [], "bg": "", "nx": ""}, {"id": "s9", "sec": "The World", "sid": "s-world", "h": "Ukraine hits the Crimean Bridge again as allies meet in Berlin", "s": "The Crimean Bridge was struck again just after midnight on Thursday and traffic was halted, Sergei Aksyonov, the Moscow-installed head of Crimea, said on Telegram, the BBC reported. Chancellor Friedrich Merz hosts the Coalition of the Willing in Berlin today.", "paras": ["The Crimean Bridge was struck again just after midnight on Thursday and traffic was halted, Sergei Aksyonov, the Moscow-installed head of Crimea, said on Telegram, the BBC reported. Strikes on Tuesday dropped a span into the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Kerch Strait<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>The bridge is the only fixed link from Russia to Crimea. After the October 2022 and July 2023 strikes, Russia shifted supply to ferries and to the land corridor through occupied southern Ukraine.<\/span><\/button>, and experts told the Kyiv Independent repairs could take a year or more. Kremlin spokesman Dmitry Peskov said the bridge “will be rebuilt.” A Russian drone attack on Odesa killed at least four people on Wednesday.", "Chancellor Friedrich Merz hosts the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Coalition of the Willing<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>A European-led group first convened by Britain and France in 2025 to plan forces for Ukraine after a ceasefire. Its multinational force is already holding initial maneuvers in Poland and the western Black Sea, dpa reported.<\/span><\/button> in Berlin today, with security guarantees and a multinational force on the agenda, dpa and Interfax-Ukraine reported. Jared Kushner said he and Steve Witkoff were heading to Berlin to consult. American envoys have warned both sides this round may be the last realistic chance for a deal, the Kyiv Independent reported, citing unnamed sources."], "why": "Ukraine is cutting the supply line to Crimea while its backers draft the guarantees, and the envoys’ deadline language suggests Washington wants terms before Congress changes hands.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "BBC", "u": "https://www.yahoo.com/news/world/articles/crimean-bridge-attacked-again-russian-010510901.html", "t": "C"}, {"n": "Kyiv Independent", "u": "https://kyivindependent.com/ukrainian-forces-once-more-hit-russias-crimean-bridge-days-after-devastating-strike/", "t": null}, {"n": "Kyiv Independent (envoys)", "u": "https://kyivindependent.com/exclusive-trumps-envoys-warn-russia-that-time-is-running-out-to-secure-a-deal-on-ukraine/", "t": null}, {"n": "dpa", "u": "https://www.yahoo.com/news/world/articles/merz-host-coalition-willing-ukraine-060336162.html", "t": null}, {"n": "Interfax-Ukraine", "u": "https://en.interfax.com.ua/news/general/1239128.html", "t": null}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-19/s9.webp?h=94d562d6", "col": "#383b15", "cap": "The Crimean Bridge, seen from Kerch.", "credit": "Alexxx1979, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "kp": ["The Crimean Bridge was struck after midnight Thursday, two days after a span fell.", "Merz hosts allied leaders in Berlin on security guarantees and a multinational force.", "US envoys Witkoff and Kushner are flying in to consult."], "bg": "The 19-kilometer bridge opened to road traffic in 2018 and to rail in 2019. A truck bomb in October 2022 and sea drones in July 2023 each closed it for weeks. On Wednesday Zelensky backed a European Commission proposal of up to €45 billion for Ukraine in 2027, the Kyiv Independent reported.", "nx": "The Berlin leaders hold a press conference at 17:15 local time today, Interfax-Ukraine reported."}, {"id": "s10", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "A Van Gogh sells for $190.4 million at Sotheby’s, a record for the artist", "s": "Vincent van Gogh’s Blossoming Chestnut Trees sold for $165 million before fees at Sotheby’s in New York on Wednesday, The Art Newspaper reported. The day before, the Blaquier heirs settled with heirs of Samuel and Hedwig Fischer.", "paras": ["Vincent van Gogh’s <em>Blossoming Chestnut Trees<\/em>, painted in 1890, sold for $165 million before fees and $190.4 million <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">with them<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The buyer’s premium Sotheby’s charges on top of the hammer price, here about $25 million. Records are quoted with it, so the house’s fee is part of the mark.<\/span><\/button> at Sotheby’s in New York on Wednesday, against an estimate of about $180 million, The Art Newspaper reported. The previous record for the artist was $117 million, for <em>Orchard with Cypresses<\/em> at Christie’s in 2022. William Acquavella of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Acquavella Galleries<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>A New York dealer founded in 1921 that often bids for clients, so the buyer of record in the room may not be the owner.<\/span><\/button> bought it in the room.", "The day before, the Blaquier heirs settled with heirs of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Samuel and Hedwig Fischer<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>Samuel Fischer founded S. Fischer Verlag in Berlin in 1886, the house that published Thomas Mann. Under German restitution practice, a sale by a persecuted Jewish family after 1933 is presumed to have been forced.<\/span><\/button>, whose family sold the painting in 1936; terms were not disclosed. The Blaquier-Arrieta collection made $412 million with fees, below an estimate of about $450 million, and the night totaled $777.8 million. Aaron Douglas’s <em>Harriet Tubman<\/em> made $14.48 million, against a previous record for him of $600,000."], "why": "Settling the restitution claim before the gavel cleared title for a record, the usual way such claims now resolve, and it showed the top of the market still clears above $100 million.", "c": {"L": 0, "LL": 1, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "The Art Newspaper", "u": "https://www.theartnewspaper.com/2026/11/19/van-gogh-painting-sells-for-record-7778m-after-nazi-loot-claims", "t": null}, {"n": "CNN", "u": "https://www.cnn.com/2026/11/18/style/vincent-van-gogh-painting-auction-record", "t": "LL"}, {"n": "ARTnews", "u": "https://www.artnews.com/art-news/market/van-gogh-auction-record-sothebys-chataigniers-en-fleurs-2026-1234806413/", "t": "C"}, {"n": "JNS", "u": "https://www.jns.org/news/culture-and-society/van-gogh-sells-for-record-190-4-million-after-deal-with-jewish-heirs", "t": null}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-19/s10.webp?h=87594e13", "col": "#43361f", "cap": "", "credit": "Ajay Suresh from New York, NY, USA, CC BY 2.0 / Wikimedia Commons", "pull": null, "kp": ["The painting made $190.4 million with fees, beating the artist’s $117 million record.", "The heirs settled the Fischer family’s claim the day before the sale.", "Sotheby’s Wednesday sales totaled $777.8 million with fees."], "bg": "Christie’s 20th-century evening sale on Nov. 17 made $627 million with fees, led by a record $85.8 million Kandinsky. On Wednesday, Cézanne’s Arlequin made $111 million with fees, below a $120 million estimate, Mary Cassatt’s Summertime set a record for her at $13.3 million, and Remedios Varo’s El vagabundo did not sell.", "nx": "", "chart": {"type": "bar", "t": "Van Gogh at auction, in millions of dollars", "rows": [["This sale", 190.4, "$190.4 million"], ["Previous record", 117, "$117 million"]]}}, {"id": "s11", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "GTA VI goes on sale with a 99 on Metacritic as Take-Two climbs", "s": "Grand Theft Auto VI unlocked at midnight Eastern on Thursday, and Take-Two Interactive shares rose more than 6 percent before the open on Wednesday, Reuters reported. In Miami, the Heat hosted the Bucks on a one-night Vice City court.", "paras": ["Grand Theft Auto VI unlocked at midnight Eastern on Thursday after reviews gave it a Metacritic score of 99, and Take-Two Interactive shares rose more than 6 percent before the open on Wednesday, Reuters reported. Wells Fargo raised its fiscal-year <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">bookings<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Take-Two’s preferred measure counts digital sales when the player pays, not as revenue is recognized over time, so it front-loads a launch quarter.<\/span><\/button> forecast 19 percent to $9.76 billion, against company guidance of $8 billion to $8.2 billion. In Miami, the Heat hosted the Bucks on a one-night <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Vice City<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>Rockstar’s fictional Miami, first used in its 2002 game set in 1986. Miami-Dade separately sold Rockstar advertising space on the county-owned arena.<\/span><\/button> court in licensed uniforms, CBS News reported, and the $120 jerseys were listed above $2,000 on resale sites."], "why": "Oppenheimer puts three-day gross at $1.85 billion, enough to move a large-cap stock, and the Heat deal is a template for licensing a team to a game franchise.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 1}, "src": [{"n": "Reuters (via Investing.com)", "u": "https://www.investing.com/news/stock-market-news/gta-vi-publisher-taketwo-jumps-as-gamers-relish-blockbuster-release-5036414", "t": "C"}, {"n": "Bloomberg", "u": "https://www.bloomberg.com/news/articles/2026-11-18/-grand-theft-auto-vi-becomes-the-best-reviewed-video-game-ever", "t": "C"}, {"n": "Fox Business", "u": "https://www.foxbusiness.com/markets/take-two-stock-jumps-over-6-rockstars-long-awaited-gta-vi-arrives-after-13-year-wait", "t": "R"}, {"n": "CBS News Miami", "u": "https://cbsnews.com/miami/news/miami-hea
