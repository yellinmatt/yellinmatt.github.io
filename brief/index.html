ote-on-union-recognition-as-gta-vi-launch-looms/5309319", "t": null}, {"n": "PC Gamer", "u": "https://www.pcgamer.com/games/grand-theft-auto/rockstar-will-hold-union-vote-right-on-top-of-grand-theft-auto-6-release/", "t": "C"}, {"n": "Game Developer", "u": "https://www.gamedeveloper.com/business/rockstar-workers-to-vote-on-unionization-ahead-of-grand-theft-auto-vi-release", "t": "C"}, {"n": "Bleeding Cool", "u": "https://bleedingcool.com/games/sag-aftra-issues-statement-on-rockstar-games-workers-union-news", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-13/s12.webp?h=90c427d8", "col": "#3f3728", "cap": "Rockstar North’s studio in Edinburgh.", "credit": "Discott, CC0 / Wikimedia Commons", "pull": null}, {"id": "s13", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "College-sports bill backers make a lame-duck push in the House", "s": "Supporters of the Protect College Sports Act are lobbying Republican leaders and House Democrats to send it to President Trump before the new Congress is sworn in, Front Office Sports reported on Thursday. Florida governor-elect Byron Donalds said he hates the bill.", "paras": ["Supporters of the Protect College Sports Act, which passed the Senate 77 to 22, are lobbying Republican leaders and House Democrats to send it to President Trump before the new Congress is sworn in and the bill <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">dies<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Unpassed bills lapse when a two-year Congress ends; the new House convenes on Jan. 3 under the 20th Amendment.<\/span><\/button>, Front Office Sports reported on Thursday. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Saving College Sports<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Organized as a 501(c)(4) social-welfare nonprofit, it can lobby without limit and need not disclose its donors.<\/span><\/button>, led by Texas Tech board chair Cody Campbell, is running a multimillion-dollar ad buy, and Yankees president Randy Levine wrote to every House member. Florida governor-elect Byron Donalds said: ‘I hate that bill.’"], "why": "Federal rules on athlete pay and eligibility will run through every sports contract for a decade, and this version’s window closes in seven weeks.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "Front Office Sports", "u": "https://frontofficesports.com/article/college-sports-bill-proponents-mount-last-ditch-lobbying-effort-during-lame-duck-session/", "t": null}, {"n": "AP via WDIV", "u": "https://www.clickondetroit.com/news/politics/2026/11/05/election-over-the-clock-starts-ticking-again-on-landmark-college-sports-bill-in-lame-duck-house/", "t": "C"}, {"n": "Yahoo Sports", "u": "https://sports.yahoo.com/articles/why-protect-college-sports-act-101029604.html", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "fig": {"v": "77 to 22", "l": "the bill’s Senate vote"}}, {"id": "s14", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "New York’s November sales aim for at least $2 billion", "s": "Auction houses expect at least $2.04 billion and possibly more than $2.4 billion from New York’s November sales, The Art Newspaper reported Thursday. Sotheby’s is targeting a house-record $1.1 billion.", "paras": ["Auction houses expect at least $2.04 billion and possibly more than $2.4 billion from New York’s November sales, The Art Newspaper reported Thursday, with Sotheby’s targeting a house-record $1.1 billion. About $450 million of that rides on the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Blaquier-Arrieta collection<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Consigned by the couple’s five children and fully guaranteed, so the family is paid a floor price however the room bids.<\/span><\/button>, 12 paintings offered Nov. 18, including Van Gogh’s ‘Blossoming Chestnut Trees’ at about $180 million, against a record of $117 million for the artist. Christie’s expects $823 million to $1.1 billion. ‘People aren’t day-trading Picassos,’ said Christie’s Kat Widing."], "why": "Guarantees move the risk from sellers to the houses and their backers, so a $2 billion week is a credit test as much as a test of taste.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "The Art Newspaper", "u": "https://theartnewspaper.com/2026/11/12/new-york-autumn-2026-auctions-preview-bonhams-christies-phillips-sothebys", "t": null}, {"n": "Artnet", "u": "https://news.artnet.com/market/new-york-auctions-november-2026-2835768", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "chart": {"type": "bar", "t": "Van Gogh, in millions of dollars", "rows": [["Chestnut Trees, est.", 180, "$180 million"], ["Artist record", 117, "$117 million"]]}}], "week": [], "cover": "img/2026-11-13/s1.webp?h=f1a505c3"}, {"date": "2026-11-12", "no": 168, "min": 9.9, "stand": "Anthropic’s book fills as bankers weigh a higher price, Trump’s envoys reach Moscow with no trust to spare, the long bond meets a hot inflation print, and Netflix waits for a studio lot at auction.", "note": "Editor’s note. 14 items at 2,375 read-words, under the ten-minute cap. Disclosure: Anthropic, whose model compiles this paper, is the subject of the lead and of the AI item. The lead’s order-book and above-range reports come from Bloomberg and the Financial Times as relayed by Enterprise; the Bloomberg, Quartz and Fortune pieces were seen by headline only, no coverage multiple was reported, and no revised range has been filed. The roadshow claims about AMD and compute multipliers are the company’s own, from an unofficial transcript. The FedWatch odds come from one newsletter; Thursday’s 30-year result falls after this edition. The Kirkland hire is from a paywalled report that did not name the lawyer. The Kalshi warning rests on Politico and Reuters as summarized by Just Security; the originals were not opened. The Investcorp merger rests on the companies’ release. The Israel item reached only Fox News and Israeli outlets. A Veterans Day holiday left the courts and the bond market quiet. Magnitude check: no announced deal above $1 billion was found in the window; the largest transaction in play is the Anthropic offering, run; no new step was found in a live contested bid. Not run: Google’s general release of Gemini 4 Carbon and Australia’s new AI safety regulator (both Tuesday, before the window); Treasury Secretary Bessent on U.S.-China AI talks (report not opened); a DeepMind proof of Signal’s security properties (undated); Thomson Reuters’ $500 million buyback (cut for the cap); the Salvadoran-backed strike on a Haitian gang headquarters (Sunday); Nvidia’s hiring of Wachtell for the Huang inquiry (Tuesday); the baseball union’s cap fight (Tuesday); the death of the actor Anthony Clark (report not opened). Sourcing limits: The New York Times, Guardian, CNN, NPR, BBC and National Review were not reached; Reuters came through syndication. Money Stuff had no issue identified in the window; Pro Rata’s newest issue was Oct. 30; the Harvard forum’s newest post concerns advancement in Lipp v. Mixedbread; the Anthropic newsroom had nothing new after its Nov. 10 roadshow post. Watch: the Putin meeting and the swap numbers Thursday; the 30-year auction at 1 p.m.; Anthropic’s pricing, expected Nov. 18; Nvidia earnings Nov. 17; GTA VI on Nov. 19.", "items": [{"id": "s1", "sec": "The Front", "sid": "s-front", "h": "Anthropic’s book said to be several times covered; a higher price weighed", "s": "Investors have put in orders for several times as many Anthropic shares as are for sale, Bloomberg reported. The Financial Times reported that bankers are weighing a price above the range, which could value the company at $1.5 trillion or more. Anthropic’s model compiles this paper.", "paras": ["Investors have put in orders for <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">several times<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A bookbuild counts indications of interest, which are not binding and are routinely padded by funds expecting a cut, so a multiple overstates final demand and the banks allocate well below it.<\/span><\/button> as many Anthropic shares as are for sale, Bloomberg reported on Wednesday, two days into the roadshow for the largest initial public offering ever filed. The Financial Times reported that bankers are weighing a price <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">above the range<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Under the SEC’s Rule 430A an issuer can price outside its range without a new effective filing if the change moves the maximum offering size by no more than 20 percent; past that, it must amend.<\/span><\/button>, which could value the company at $1.5 trillion or more. Goldman Sachs and Morgan Stanley are expected to price the deal on Nov. 18, with Nasdaq trading on or around Nov. 19, Reuters reported.", "No revised range has been filed. The Nov. 10 amended registration statement offers 825 million Class A shares, a base raise of $57.75 billion to $64.35 billion, beside a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">$26 billion placement<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The buyers take non-voting Class N stock at whatever price the offering sets, so a higher print raises their bill as well as the company’s proceeds.<\/span><\/button> to Google, Nvidia, Microsoft and other technology companies. At the top of the range the deal values Anthropic at up to $1.4 trillion counting every share, Yahoo Finance reported. The size of the coverage multiple was not reported.", "The demand arrives against a weak tape for the trade. AI stocks have only partly recovered from last week’s selloff after the midterms, and Abu Dhabi’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Mubadala<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>One of Abu Dhabi’s sovereign investors; MGX, the AI vehicle it co-founded, and Qatar’s QIA already hold stakes in Anthropic, the same report noted.<\/span><\/button> may be down about $17.5 billion on AI positions since the end of June, with Saudi Arabia’s Public Investment Fund down about $5.64 billion, according to GlobalSWF estimates first reported by Semafor. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">CoreWeave<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>A debt-financed GPU cloud whose customers are the labs and hyperscalers, so its guidance is read as a live gauge of AI capacity demand.<\/span><\/button> rose 17 percent before Wednesday’s open on a stronger outlook. Anthropic’s model compiles this paper."], "why": "A book several times covered gives the banks room to raise the price or the size, and either choice sets the benchmark against which every private AI lab, and every lawyer drafting its filing, will be measured.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "Enterprise", "u": "https://enterpriseam.com/ai/2026/11/12/anthropics-ipo-draws-heavy-demand-and-could-still-fetch-a-usd-1-5-tn-valuation/", "t": null}, {"n": "Yahoo Finance", "u": "https://sg.finance.yahoo.com/news/live/stock-market-today-wednesday-november-11-dow-sp-500-nasdaq-nvidia-treasurys-veterans-day-140638547.html", "t": "C"}, {"n": "Bloomberg", "u": "https://www.bloomberg.com/news/newsletters/2026-11-11/anthropic-bankers-reportedly-look-to-increase-ipo-valuation", "t": "C"}, {"n": "Quartz", "u": "https://qz.com/anthropic-ipo-oversubscribed-roadshow-demand-111126", "t": "C"}, {"n": "Fortune", "u": "https://fortune.com/2026/11/11/anthropic-sets-a-1-4-trillion-ipo-target-but-bankers-may-already-be-aiming-higher-cfo/", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-12/s1.webp?h=ad558ba7", "col": "#592805", "cap": "The Nasdaq MarketSite in Times Square.", "credit": "ajay_suresh, CC BY 2.0 / Wikimedia Commons", "pull": {"text": "Investors have put in orders for several times more stock than is for sale.", "attr": "Enterprise, relaying Bloomberg, Nov. 12"}, "chart": {"type": "bar", "t": "The offering, in billions of dollars", "rows": [["Base raise, low", 57.75, "$57.75 billion"], ["Base raise, high", 64.35, "$64.35 billion"], ["Placement", 26, "$26 billion"]]}}, {"id": "s2", "sec": "The Front", "sid": "s-front", "h": "Witkoff and Kushner land in Moscow; Kushner says ‘there is no trust’", "s": "Steve Witkoff and Jared Kushner arrived in Moscow on Thursday morning to meet Vladimir Putin, Reuters reported. The envoys will raise bringing European partners into the talks, then fly to Dublin to meet Volodymyr Zelensky. The size of the prisoner swap had not been announced by early morning.", "paras": ["Steve Witkoff and Jared Kushner arrived in Moscow on Thursday morning to meet Vladimir Putin, a day after Russia-Ukraine talks in Abu Dhabi ended with a deal in principle on a prisoner exchange, Reuters reported. Kirill Dmitriev, head of the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Russian Direct Investment Fund<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Russia’s sovereign wealth fund, under U.S. Treasury sanctions since February 2022, which makes its chief an unusual official greeter for American envoys.<\/span><\/button>, met them at the airport, TASS said. The envoys will raise bringing European partners into the talks, then fly to <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Dublin<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>Ireland holds the rotating presidency of the Council of the European Union from July to December 2026.<\/span><\/button> to meet Volodymyr Zelensky.", "‘The reality is there is no trust right now between the sides and that is to be expected after a conflict like this,’ Kushner said. The size of the swap, which he called the biggest humanitarian release of prisoners, was due Thursday and had not been announced by early morning. The strikes went on: six substations in central Ukraine were hit, an attack on a market in the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Odesa region<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>Ukraine’s main Black Sea export coast; Kyiv is still awaiting Moscow’s answer on a grain-shipping ceasefire there.<\/span><\/button> killed three, and a Ukrainian drone killed one in Belgorod."], "why": "The prisoners are the only deliverable so far; Kushner’s candor sets a low bar for the Putin meeting, and the push to seat Europeans tests whether Moscow will accept a wider table.", "c": {"L": 0, "LL": 1, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Reuters via West Hawaii Today", "u": "https://www.westhawaiitoday.com/2026/11/12/nation-world-news/russia-ukraine-reach-deal-on-prisoner-swap-as-us-says-lack-of-trust-holds-back-talks/", "t": "C"}, {"n": "ABC News", "u": "https://abcnews.com/International/witkoff-kushner-arrive-moscow-meet-putin-discuss-ukraine/story?id=138070892", "t": "LL"}, {"n": "Reuters via Jerusalem Post", "u": "https://www.jpost.com/international/internationalrussia-ukraine-war/article-914670", "t": "C"}, {"n": "Meduza", "u": "https://meduza.io/en/news/2026/11/12/witkoff-and-kushner-arrive-in-moscow-for-talks-with-putin", "t": "C"}], "framing": "", "min": 1, "front": true, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}, {"id": "s3", "sec": "AI", "sid": "s-ai", "h": "Anthropic’s video says Claude moved its software to AMD in three days", "s": "Anthropic’s roadshow video says the company now trains and serves Claude on four chip families, according to a transcript published by Simon Willison. Anthropic has released no official transcript, and the claims are the company’s own. Anthropic’s model compiles this paper.", "paras": ["Anthropic’s investor roadshow video says the company now trains and serves Claude on four chip families, Amazon’s Trainium, Google’s TPUs and Nvidia and AMD graphics processors, according to a transcript published Wednesday by the developer <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Simon Willison<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>Co-creator of the Django web framework, whose independent blog is among the most closely read records of large language model releases.<\/span><\/button>. In a section on compute featuring co-founder Tom Brown, the video says a new chip platform once took dozens of engineers several months. ‘It got Claude running on AMD in just three days, with basically no human intervention,’ the speaker says, adding that Claude ‘ported or wrote almost 100% of the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">kernels<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The low-level routines that run a model’s math on one vendor’s silicon; rewriting them is the cost that has kept most labs tied to Nvidia’s CUDA.<\/span><\/button>.’", "The video names the rate of discovery of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">compute multipliers<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The video’s example: a fourfold multiplier means 25 units of compute train a model that would otherwise need 100.<\/span><\/button> as a second driver of its advantage and says ‘Claude will be able to discover compute multipliers entirely by itself.’ Anthropic has released no official transcript, and the claims are the company’s own. Anthropic’s model compiles this paper."], "why": "For investors, a model that rewrites its own infrastructure is the case against chip dependence; for the profession, it is a working example of software doing skilled labor in days.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Simon Willison", "u": "https://simonwillison.net/2026/Nov/11/anthropic-ipo-roadshow/", "t": null}, {"n": "Anthropic", "u": "https://ipo.anthropic.com/us/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-12/s3.webp?h=0cd08610", "col": "#2b3a43", "cap": "Google’s data center in The Dalles, Oregon; Claude runs on Google TPUs among four chip families.", "credit": "Visitor7, CC BY-SA 3.0 / Wikimedia Commons", "pull": null, "fig": {"v": "almost 100%", "l": "of the AMD kernels Claude ported or wrote"}}, {"id": "s4", "sec": "Markets & Deals", "sid": "s-mkt", "h": "The long bond faces its first test since the hot CPI", "s": "The Treasury sells $25 billion of reopened 30-year bonds at 1 p.m. Thursday. The cash market was shut Wednesday for Veterans Day. The 10-year yield ended Tuesday at 4.98 percent after trading above 5 percent on the report.", "paras": ["The Treasury sells $25 billion of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">reopened<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A reopening sells more of an outstanding bond at its original coupon, so the price, not the coupon, absorbs any rise in yields since first issue.<\/span><\/button> 30-year bonds at 1 p.m. Thursday, the first long-end sale since October consumer prices rose 0.4 percent against forecasts of 0.3. The cash market was shut Wednesday for Veterans Day. The 10-year yield ended Tuesday at 4.98 percent after trading above 5 percent on the report. Fed governor <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Michelle Bowman<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>The Fed’s vice chair for supervision since 2025, so her view carries weight on bank capital rules as well as on rates.<\/span><\/button> said ‘there is still work to do to bring inflation closer to 2%.’", "CME FedWatch showed 88.5 percent odds of a quarter-point hike at the Dec. 8 and 9 meeting and 11.5 percent of a half point, the Weekend Spread newsletter reported, up from 85 percent after the data. Tuesday’s 10-year sale stopped at 5.02 percent with a one-basis-point <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">tail<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The gap between an auction’s high yield and the when-issued yield at the deadline; a positive tail means dealers had to absorb more than expected.<\/span><\/button>. Stock futures rose Wednesday as CoreWeave’s outlook lifted chipmakers."], "why": "Every deal in this paper prices off this curve, and a soft long-bond sale with a hike already priced would lift borrowing costs just as the Anthropic book closes.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "Investopedia via Yahoo Finance", "u": "https://finance.yahoo.com/markets/stocks/articles/stock-market-today-nasdaq-futures-131247889.html", "t": null}, {"n": "Yahoo Finance", "u": "https://sg.finance.yahoo.com/news/live/stock-market-today-wednesday-november-11-dow-sp-500-nasdaq-nvidia-treasurys-veterans-day-140638547.html", "t": "C"}, {"n": "The Weekend Spread", "u": "https://theweekendspread.substack.com/p/the-open-wednesday-november-11-2026", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-12/s4.webp?h=152e89d8", "col": "#313845", "cap": "The Treasury Building, Washington.", "credit": "Tony Webster, CC BY-SA 3.0 / Wikimedia Commons", "pull": null, "chart": {"type": "bar", "t": "CME FedWatch odds for the December meeting", "rows": [["Quarter-point hike", 88.5, "88.5 percent"], ["Half-point hike", 11.5, "11.5 percent"]]}}, {"id": "s5", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Investcorp’s credit fund agrees to fold into BCP Investment", "s": "Investcorp Credit Management BDC agreed Wednesday to merge into BCP Investment Corp., with holders receiving 90 percent of its net asset value at closing. Holders of about 41 percent signed voting agreements; closing is expected in the first quarter.", "paras": ["Investcorp Credit Management BDC agreed Wednesday to merge into BCP Investment Corp., with holders receiving 90 percent of its <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">net asset value<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>For a business development company, the marked value of its loan book; a share price near a fifth of it, as here, says the market doubts the marks.<\/span><\/button> at closing, paid in BCP shares up to <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">19.99 percent<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Exchange rules require a shareholder vote to issue 20 percent or more of a company’s stock in a deal, so the cap spares BCP’s holders a vote.<\/span><\/button> of BCP’s stock and in cash beyond that. Investcorp’s asset value was $2.76 a share against a $0.61 market price. Holders of about 41 percent signed voting agreements; closing is expected in the first quarter. Simpson Thacher advises BCP, and Dechert and Fried Frank advise Investcorp and its committee."], "why": "Private credit’s weakest listed vehicles are being consolidated below their own marks, the quiet end of the boom.", "c": {"L": 0, "LL": 0, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "GlobeNewswire", "u": "https://www.globenewswire.com/news-release/2026/11/11/3401183/7512/en/investcorp-credit-management-bdc-inc-to-merge-into-bcp-investment-corporation.html", "t": null}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "chart": {"type": "bar", "t": "Investcorp, per share", "rows": [["Asset value", 2.76, "$2.76"], ["Market price", 0.61, "$0.61"]]}}, {"id": "s6", "sec": "Law & the Courts", "sid": "s-law", "h": "Kirkland takes a Weil litigator in Germany after the dissolution vote", "s": "Kirkland and Ellis hired a Weil, Gotshal and Manges litigator to strengthen its German litigation practice on Wednesday, Law360 Pulse reported. The free report did not name the lawyer or the office.", "paras": ["Kirkland &amp; Ellis hired a Weil, Gotshal &amp; Manges litigator to strengthen its German litigation practice on Wednesday, Law360 Pulse reported, a day after Weil’s partners overwhelmingly backed dissolving the 95-year-old firm. The free report did not name the lawyer or the office. On Monday Weil’s real estate head, Jannelle Seales, and five other lawyers accepted offers from <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Latham &amp; Watkins<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>$8.3 billion of 2025 revenue and $8.6 million of profit per equity partner, Bloomberg Law reported, the deepest pockets in this lateral market.<\/span><\/button>, Bloomberg Law reported, after Gibson Dunn and Kirkland had taken larger groups.", "A Nov. 5 memo told remaining equity partners they would be <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">considered withdrawn<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>It removes the penalty for staying late: a partner who rides out the wind-down still keeps the profit share reserved for current partners.<\/span><\/button> by year-end, with no notice period enforced past Dec. 31, Bloomberg Tax reported. Partners who gave notice after the Oct. 27 decision keep their profit rights. Above the Law reported that first-year associates fear there is no seat for them."], "why": "The largest law firm failure since Dewey &amp; LeBoeuf is being divided partner by partner, and the international offices are the next pieces to go.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Law360 Pulse", "u": "https://law360.com/pulse/articles/2548574/kirkland-adds-weil-partner-after-dissolution-vote", "t": null}, {"n": "Bloomberg Law", "u": "https://news.bloomberglaw.com/business-and-practice/weil-real-estate-head-five-other-lawyers-accept-latham-offers", "t": "C"}, {"n": "Bloomberg Tax", "u": "https://news.bloombergtax.com/business-and-practice/weil-gotshal-says-remaining-partners-can-resign-now-keep-profit", "t": "C"}, {"n": "Above the Law", "u": "https://abovethelaw.com/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-12/s6.webp?h=48bf953d", "col": "#25375b", "cap": "300 North LaSalle, Kirkland & Ellis’s Chicago headquarters.", "credit": "Gdefreitas, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "fig": {"v": "Dec. 31", "l": "after which no Weil notice period is enforced"}}, {"id": "s7", "sec": "Law & the Courts", "sid": "s-law", "h": "New Jersey’s ethics office charges Alina Habba over a Bedminster settlement", "s": "New Jersey’s Office of Attorney Ethics filed a 23-page complaint against Alina Habba over a settlement she negotiated for a waitress’s harassment claim at the Bedminster golf club, Forbes reported. A later suit settled for $400,000.", "paras": ["New Jersey’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Office of Attorney Ethics<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>An arm of the state Supreme Court, not the bar; a formal complaint goes to a hearing panel and the Disciplinary Review Board before the court decides any sanction.<\/span><\/button> filed a 23-page complaint against Alina Habba, the president’s former lawyer, over a settlement she negotiated for a waitress’s harassment claim at the Bedminster golf club, Forbes reported. It alleges <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">divided loyalties<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The complaint says Habba ‘created an implied attorney-client relationship’ with the waitress, a duty that can attach from conduct alone, with no retainer.<\/span><\/button>, since Habba had paid more than $80,000 in club dues and fees, and says the $15,000 deal was ‘favorable to the golf club.’ A later suit settled for $400,000. Trump said the case ‘did not involve President Trump.’"], "why": "Nondisclosure terms that bury a harassment claim are now a disciplinary exposure for the lawyer who drafts them.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Forbes", "u": "https://www.forbes.com/sites/siladityaray/2026/11/11/ex-trump-lawyer-alina-habba-faces-ethics-charges-over-bedminster-golf-club-sexual-harassment-settlement/", "t": null}, {"n": "Above the Law", "u": "https://abovethelaw.com/2026/11/morning-docket-11-11-26/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "fig": {"v": "$80,000", "l": "more than this in club dues and fees Habba paid"}}, {"id": "s8", "sec": "Law & the Courts", "sid": "s-law", "h": "The CFTC warns Kalshi that charges over self-certified contracts may come", "s": "The Commodity Futures Trading Commission has privately warned Kalshi it may bring charges over whether the exchange properly notified the agency of dozens of new contracts, Politico reported. No charges have been filed.", "paras": ["The Commodity Futures Trading Commission has privately warned Kalshi it may bring charges over whether the exchange properly notified the agency of dozens of new contracts, Politico reported, and Reuters said the notice suggests charges could come soon. Kalshi called it a ‘procedural error involving a handful of contracts,’ many never live. No charges have been filed. Utah is separately prosecuting the company and its co-founders on <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">13 felony counts<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Utah charged the founders personally as well as the company, and the CFTC has sued Utah, claiming exclusive federal power over event contracts.<\/span><\/button>. The products were <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">self-certified<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Under Part 40 of CFTC rules an exchange certifies compliance and can list the next business day without approval, so this case turns on notice, not legality.<\/span><\/button>."], "why": "The federal regulator shielding prediction markets from the states is now policing them itself, which weakens Kalshi’s preemption argument in every state case.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "Just Security", "u": "https://www.justsecurity.org/164111/early-edition-november-11-2026/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "fig": {"v": "13", "l": "felony counts Utah is separately prosecuting"}}, {"id": "s9", "sec": "The World", "sid": "s-world", "h": "Trump vows ‘total victory’ over Iran; Tehran says its terms sit with the US", "s": "President Trump used his Veterans Day address at Arlington National Cemetery to promise victory over Iran. Mohammad Bagher Ghalibaf, Iran’s chief negotiator, said the Strait of Hormuz would never return to its prewar status. The Revolutionary Guards said two more tankers hit mines.", "paras": ["President Trump used his Veterans Day address at Arlington National Cemetery on Wednesday to promise ‘a total victory, not a 93% victory’ over Iran. ‘America did not start a war with Iran. Iran has been waging war on America since 1979,’ he said. In an Al Jazeera interview published hours later, <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Mohammad Bagher Ghalibaf<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>A former commander of the Revolutionary Guards’ air force and a former mayor of Tehran, now speaker of parliament.<\/span><\/button>, Iran’s chief negotiator, said the Strait of Hormuz would never return to its prewar status and that Iran and Oman had agreed to oversee it, a claim Oman has not confirmed.", "Ghalibaf said Iran’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">seven conditions<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>He said they derive from the memorandum agreed in Islamabad in June and must be met before formal negotiations begin.<\/span><\/button>, including an end to the naval blockade and sanctions, released funds and a declared end to the war, had gone to Washington through a Qatari mediator. ‘What stands in the way of an agreement is our lack of trust in the United States,’ he said. The Revolutionary Guards said two more tankers hit mines. <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Allianz Trade<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The credit insurer formerly called Euler Hermes; it puts total costs of the war at up to $790 billion through 2030.<\/span><\/button> puts Gulf physical damage just above $200 billion, CBS reported."], "why": "With both sides citing distrust, oil, shipping insurance and sanctions exposure stay priced for a long war, a risk carried by every Gulf-linked deal.", "c": {"L": 1, "LL": 0, "C": 1, "LR": 0, "R": 1}, "src": [{"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/11/strait-of-hormuz-will-never-return-to-pre-war-status-ghalibaf", "t": "L"}, {"n": "CBS News", "u": "https://www.cbsnews.com/live-updates/iran-war-us-nuclear-strait-of-hormuz/", "t": "C"}, {"n": "Newsmax via Yahoo", "u": "https://www.yahoo.com/news/politics/articles/trump-honors-vets-vows-total-173326985.html", "t": "R"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-12/s9.webp?h=414686fe", "col": "#383644", "cap": "The Memorial Amphitheater, Arlington National Cemetery.", "credit": "David, CC BY 2.0 / Wikimedia Commons", "pull": null, "fig": {"v": "$200 billion", "l": "just above, Gulf damage per Allianz Trade"}}, {"id": "s10", "sec": "The World", "sid": "s-world", "h": "Eisenkot breaks off Likud talks, leaving him 13 seats short", "s": "Gadi Eisenkot cancelled coalition talks with Likud set for Wednesday, Fox News reported. He holds the mandate with 67 recommendations, but his four-party bloc has 48 seats. His deadline is Dec. 6, extendable to Dec. 20.", "paras": ["Gadi Eisenkot cancelled coalition talks with Likud set for Wednesday after calling Benjamin Netanyahu’s speech at the swearing-in of the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">26th Knesset<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Its first test vote, on a speaker to replace Amir Ohana, is set for Nov. 17, an early count of Eisenkot’s strength.<\/span><\/button> ‘delusional, divisive, hate-filled and shameful,’ Fox News reported. He holds the mandate with 67 recommendations, but his four-party bloc has 48 seats; Shas and United Torah Judaism hold the 13 he lacks and oppose wider conscription. His deadline is Dec. 6, <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">extendable<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Basic Law: The Government lets the president add up to 14 days; after that the mandate can pass to another member or to the Knesset itself.<\/span><\/button> to Dec. 20."], "why": "Without the Haredi parties or an Arab party Eisenkot cannot reach 61, and he has just closed the Likud channel.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 1}, "src": [{"n": "Fox News", "u": "https://www.foxnews.com/world/israels-political-shake-up-enters-new-phase-former-pm-plays-kingmaker-deadline-looms", "t": "R"}, {"n": "Israel Hayom", "u": "https://www.israelhayom.com/2026/11/10/eisenkot-cancels-likud-coalition-talks-over-netanyahus-knesset-speech/", "t": "C"}, {"n": "Jerusalem Post", "u": "https://www.jpost.com/israel-election-2026/article-914603", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}, {"id": "s11", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "Netflix lines up the Radford lot at a Nov. 24 foreclosure auction", "s": "Netflix is expected to be the top bidder when Radford Studio Center goes to a foreclosure auction in Pomona on Nov. 24, The Hollywood Reporter reported. Lenders led by Goldman Sachs seek about $1.3 billion, though the price is expected to be far lower.", "paras": ["Netflix is expected to be the top bidder when the 55-acre <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Radford Studio Center<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>Long known as CBS Studio Center, the lot on Radford Avenue took its present name under Hackman Capital’s ownership.<\/span><\/button> in Studio City goes to a foreclosure auction in Pomona on Nov. 24, The Hollywood Reporter reported, citing a notice recorded in Los Angeles County. Hackman Capital Partners paid $1.85 billion for the lot in 2021. Lenders led by Goldman Sachs took it back about nine months ago and seek about $1.3 billion, roughly the debt, though the price is expected to be far lower. Netflix had been in talks to pay as much as $400 million.", "Netflix asked Goldman to run the foreclosure and the sale, the Reporter said; a direct purchase could have cost about $22 million in the city’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">mansion tax<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Measure ULA, a 5.5 percent transfer tax on Los Angeles sales above $10.9 million, passed by voters in 2022 to fund housing.<\/span><\/button>. ‘The deal is progressing on the agreed upon timetable,’ a Netflix spokesperson said. Buyers are believed to be few because local filming is low, City News Service reported."], "why": "Hollywood real estate is being repriced through the lenders at about a fifth of its 2021 value, and the buyer is the streamer that helped empty the old lots.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "The Hollywood Reporter via Yahoo", "u": "https://uk.finance.yahoo.com/news/netflix-poised-buy-radford-studio-213211308.html", "t": null}, {"n": "City News Service via MyNewsLA", "u": "https://mynewsla.com/business/2026/11/11/report-netflix-poised-to-buy-radford-studio-lot-at-auction/", "t": "C"}, {"n": "Deadline", "u": "https://deadline.com/2026/11/netflix-radford-studio-purchase-latest-1237216149/", "t": "C"}, {"n": "TheWrap", "u": "https://www.thewrap.com/industry-news/business/netflix-radford-studios-lot-deal-stalls/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-12/s11.webp?h=c643d61e", "col": "#433526", "cap": "Soundstage 2 on Radford Avenue, Studio City.", "credit": "Cbl62, CC BY-SA 3.0 / Wikimedia Commons", "pull": null, "fig": {"v": "$400 million", "l": "as much as, Netflix’s earlier talks"}}, {"id": "s12", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "Ohio asks a court to toss the NCAA’s suit over DeWine’s eligibility order", "s": "Ohio has asked the court to dismiss the NCAA’s suit against Gov. Mike DeWine over an executive order on eligibility, Sportico reported. A Nov. 6 brief argues the NCAA lacks standing. The NCAA declined to comment.", "paras": ["Ohio has asked the court to dismiss the NCAA’s suit against Gov. Mike DeWine over <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Executive Order 2026-04D<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Its author leaves office Jan. 11, when Gov.-elect Amy Acton can keep or rescind it, which could moot the case.<\/span><\/button>, which tells Ohio colleges not to enforce NCAA eligibility rules against certain former Division I athletes from the high school class of 2022, Sportico reported. A Nov. 6 brief argues the NCAA lacks standing because nothing in the order ‘requires’ it ‘to sit idly by and permit its members’ noncompliance.’ The NCAA, which claims <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Commerce Clause<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Its model is NCAA v. Miller, a 1993 Ninth Circuit win striking a Nevada statute because conflicting state rules would fragment national play.<\/span><\/button> and First Amendment violations, declined to comment."], "why": "If a governor can switch off eligibility for in-state schools, the national rulebook becomes a patchwork, the result Congress’s pending bill aims to prevent.", "c": {"L": 0, "LL": 0, "C": 0, "LR": 0, "R": 0}, "src": [{"n": "Sportico via Yahoo", "u": "https://sports.yahoo.com/articles/ncaa-dewine-fight-could-open-214951963.html", "t": null}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}, {"id": "s13", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "Irma P. Hall, a Dallas teacher who won a jury prize at Cannes, dies at 91", "s": "Irma P. Hall died Tuesday in Dallas at 91, her family said. She taught in Dallas public schools for more than 20 years before Raymond St. Jacques saw her at a poetry reading and cast her in ‘Book of Numbers’ (1973).", "paras": ["Irma P. Hall died Tuesday in Dallas at 91, her family said. She taught English and foreign languages in Dallas public schools for more than 20 years before <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Raymond St. Jacques<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>An actor best known for ‘Cotton Comes to Harlem’; ‘Book of Numbers’ was the only feature he directed.<\/span><\/button> saw her at a poetry reading and cast her in ‘Book of Numbers’ (1973). She played Big Mama Jo in ‘Soul Food’ and won a jury prize at Cannes for the Coen brothers’ <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">‘The Ladykillers’<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Work<\/span>A remake of the 1955 Ealing comedy, with Hall in the landlady role Katie Johnson played in the original.<\/span><\/button> (2004). ‘She started as a teacher in the classroom but ended up being a teacher to the world,’ her daughter said."], "why": "A career begun in middle age that reached Cannes is a rare Hollywood story in which the classroom came first and stayed central.", "c": {"L": 0, "LL": 1, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "ABC News", "u": "https://abcnews.com/GMA/Culture/irma-hall-soul-food-ladykillers-actress-dies-91/story?id=138056211", "t": "LL"}, {"n": "Variety", "u": "https://variety.com/2026/film/news/irma-p-hall-dead-soul-food-1236945266/", "t": "C"}, {"n": "The Hollywood Reporter", "u": "https://www.hollywoodreporter.com/movies/movie-news/irma-p-hall-dead-soul-food-ladykillers-1236753066/", "t": "C"}, {"n": "Euronews", "u": "https://www.euronews.com/2026/11/12/irma-p-hall-former-teacher-and-star-of-soul-food-and-the-ladykillers-dies-aged-91", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}, {"id": "s14", "sec": "Entertainment & EASL", "sid": "s-ent", "h": "Rockstar’s GTA VI festival in Wynwood goes on general sale", "s": "General sale opened Wednesday for a one-day GTA VI launch festival at Mana Wynwood in Miami on Nov. 21, USA Today reported. Resale listings started at $214.", "paras": ["General sale opened Wednesday for ‘Grand Theft Auto VI: The Festival,’ a one-day event at <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Mana Wynwood<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>Rockstar’s 2002 ‘Vice City’ was a fictional 1986 Miami, and the new game returns to it, which makes the city the natural stage for a launch.<\/span><\/button> on Nov. 21, two days after the game’s Nov. 19 release, USA Today reported. Presented with <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">PlayStation<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>Sony co-presents even though the game also ships on Xbox at launch, a paid marketing tie-up rather than an exclusive.<\/span><\/button>, it is produced by the team behind the III Points festival and features Travis Scott, Cardi B, Metro Boomin and a DJ set by Justice, who scored the game. Resale listings started at $214. The Heat play a Vice City themed game on Nov. 18."], "why": "Rockstar is staging the year’s biggest entertainment launch as a live event in the real city behind its fictional one, a template for IP-to-experience deals.", "c": {"L": 0, "LL": 0, "C": 2, "LR": 0, "R": 0}, "src": [{"n": "USA Today via Yahoo", "u": "https://www.yahoo.com/entertainment/music/festivals/articles/gta-vi-festival-tickets-sale-170830175.html", "t": null}, {"n": "Consequence", "u": "https://consequence.net/2026/11/grand-theft-auto-vi-the-festival-travis-scott-cardi-b-and-justice/", "t": "C"}, {"n": "Rockstar Newswire", "u": "https://www.rockstargames.com/newswire/article/o39o87a435a25a/grand-theft-auto-vi-the-festival", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}], "week": [], "cover": "img/2026-11-12/s1.webp?h=ad558ba7"}, {"date": "2026-11-11", "no": 167, "min": 8.8, "stand": "Anthropic files the range it can stand behind, Weil’s partners vote their firm out of existence, inflation runs hot into a December hike, and a Miami judge keeps Trump’s case against the BBC alive.", "note": "Editor’s note. 14 items at 2,123 read-words, under the ten-minute cap. This edition was compiled late, after the morning’s scheduled runs were missed, so its window runs from 6 a.m. Tuesday. Disclosure: Anthropic, whose model compiles this paper, is the subject of the lead; it rests on the company’s filing and release, and the valuation and Nov. 19 date come from press reports, not the filing. Reports that bankers are weighing pricing above the range were seen only secondhand and are not run. Weil’s 97 percent comes from one person familiar with the vote. OpenAI’s loss figure comes from the Journal as relayed. The Intermex deal value was not confirmed from a primary source and is omitted. Magnitude check: the largest transaction in the window was the Anthropic offering, up to $64.35 billion before the $26 billion placement, run; no large M&amp;A signing was found; the largest live contest, LCI Industries’ rejection of Monomoy’s $104.50 bid ahead of a Nov. 18 vote, was cut for the cap. Also not run: the administration’s petition to end the White House ballroom case; a D.C. Circuit ruling that Kari Lake unlawfully fired the Voice of America director (opinion not opened); the arrest in Britain of a U.S. Army officer on suspicion of spying for Russia; the new Knesset’s swearing-in; Sony’s cancellation of Fairgames; Art Basel’s 20 percent fee rebate to Paris dealers (single source); Bloomberg Law’s survey of lawyers on AI and two new sanctions for fake citations (orders paywalled); a reported CFTC warning to Kalshi (unreached). Sourcing limits: The New York Times, BBC, Guardian, CNN and National Review were not reached directly; Reuters and AP came through syndication; no hero images beyond those shown could be verified. Money Stuff’s Tuesday column was seen by title only; Pro Rata did not load; the Harvard forum’s newest post concerns advancement under Lipp v. Mixedbread. Watch: the Kushner and Witkoff meeting with Putin Thursday; the 30-year auction this week; Anthropic’s roadshow; Nvidia earnings Nov. 17; GTA VI on Nov. 19.", "items": [{"id": "s1", "sec": "The Front", "sid": "s-front", "h": "Anthropic files to sell 825 million shares at $70 to $78", "s": "Anthropic filed an amended registration statement on Tuesday offering 825 million Class A shares at $70 to $78 each, a base raise of $57.75 billion to $64.35 billion. Its chip and cloud suppliers will buy $26 billion of non-voting stock at the IPO price. Anthropic’s model compiles this paper.", "paras": ["Anthropic filed an amended registration statement on Tuesday offering 825 million Class A shares at $70 to $78 each, a base raise of $57.75 billion to $64.35 billion, and launched its roadshow. The company is selling 801,351,354 shares and existing holders 23,648,646. The stock would list on the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Nasdaq Global Select Market<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The exchange’s top tier, with its strictest financial and liquidity standards; a first-day listing there is reserved for issuers that clear those tests at pricing.<\/span><\/button> under the ticker ANT, with 22 underwriters led by Goldman Sachs and Morgan Stanley and a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">greenshoe<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The 123.75 million figure is exactly 15 percent of the base deal, the customary ceiling; banks oversell by that amount and buy back in the market if the price sags.<\/span><\/button> of 123.75 million more.", "The terms replace a draft of about 867 million shares at up to $80 that the company told bankers on Monday was inaccurate. Alongside the offering, Google, Nvidia, AMD, Broadcom, Micron, Microsoft and a TSMC affiliate will buy $26 billion of non-voting <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Class N<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The placement pays no underwriting discount and is unregistered, so the buyers hold restricted stock; Google and Nvidia take about $10 billion each at the $74 midpoint.<\/span><\/button> stock at the IPO price. At the top of the range the base deal alone would more than double the $29.4 billion Saudi Aramco raised in 2019, the largest IPO on record. The filing discloses about $900.9 billion of committed compute spending, $70.7 billion of it due in the 12 months after Sept. 30.", "Control stays narrow. A single <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Class F share<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>IBTimes, reading the prospectus, reports it is held by an entity owned by the seven co-founders, which separates voting control from economic ownership entirely.<\/span><\/button> carries 50.1 percent of the vote, and the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Long-Term Benefit Trust<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The filing calls it ‘an independent body of financially disinterested trustees’; it is the public-benefit corporation’s answer to who polices the mission after the founders.<\/span><\/button> keeps its role. The filing states no valuation; press estimates run from about $1 trillion on basic shares to $1.4 trillion fully diluted. CNBC, citing sources, reported trading could begin Nov. 19. Wilson Sonsini and Freshfields US appear on the cover. Anthropic’s model compiles this paper."], "why": "The largest offering ever filed now has a range it will defend in front of investors, and its two hard numbers, a 50.1 percent founder vote and $900.9 billion of compute obligations, are what the roadshow must sell.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "SEC, Form S-1/A", "u": "https://www.sec.gov/Archives/edgar/data/0002130357/000162828026072484/anthropicpbc-sx1ax2.htm", "t": null}, {"n": "Anthropic", "u": "https://www.anthropic.com/news/roadshow-launch", "t": "C"}, {"n": "Forbes", "u": "https://www.forbes.com/sites/gabrielalinzainescu/2026/11/10/anthropic-ipo-targets-13-trillion-valuation-904-billion-raise/", "t": "C"}, {"n": "IBTimes", "u": "https://www.ibtimes.com.au/anthropic-sets-ipo-price-range-78-1878308", "t": "C"}, {"n": "Decrypt", "u": "https://decrypt.co/383001/morning-minute-what-anthropics-1-4-trillion-ipo-means-for-crypto", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-11/s1.webp?h=83727c85", "col": "#592805", "cap": "The Nasdaq MarketSite in Times Square.", "credit": "ajay_suresh, CC BY 2.0 / Wikimedia Commons", "pull": {"text": "The share of our Class F common stock will be entitled to an aggregate number of votes that equals 50.1% of the total voting power of our outstanding shares of capital stock.", "attr": "Anthropic S-1/A, Nov. 10"}, "fig": {"v": "$900.9 billion", "l": "committed compute spending in the filing"}}, {"id": "s2", "sec": "The Front", "sid": "s-front", "h": "Weil’s partners vote 97 percent to wind down the 95-year-old firm", "s": "Partners of Weil, Gotshal and Manges voted on Tuesday to approve a wind-down plan, with 97 percent in favor, Bloomberg Law reported, citing a person familiar with the results. Control passes to a three-member dissolution committee.", "paras": ["Partners of Weil, Gotshal &amp; Manges voted on Tuesday to approve a wind-down plan, with 97 percent in favor, Bloomberg Law reported, citing a person familiar with the results. Control passes to a three-member <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">dissolution committee<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The vote amends the partnership agreement itself, and partners still at the firm at year-end are deemed withdrawn, which fixes who shares in collections and claims.<\/span><\/button>: general counsel Robert Carangelo, tax partner Paul Wessel and independent director Patricia Ferrari. James Mesterharm of AlixPartners and Ben Schrag of C Street Advisory are co-chief restructuring officers, and chairman Barry Wolf stays as a consultant through year-end.", "The lawyers are already leaving in groups. Gibson Dunn is taking about 120 funds lawyers in New York and London, Kirkland 40 led by <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Ramona Nee<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>Named Wolf’s successor in March, she told firm leaders in August she would not take the job, Bloomberg Law reported, the break that started the defections.<\/span><\/button>, and Latham six, Above the Law reported. A memo told associates the firm would ‘facilitate introductions where we can.’ No firm of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Weil’s size<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>About 1,200 lawyers and more than $2 billion in revenue; its restructuring group was debtors’ counsel in Enron, General Motors and Lehman Brothers.<\/span><\/button> has collapsed since the rankings began, Steve Vladeck noted."], "why": "The lateral market just absorbed an AmLaw 100 firm in a fortnight, and the template it sets for partner exits and associates left behind will be read at every firm.", "c": {"L": 0, "LL": 0, "C": 5, "LR": 0, "R": 0}, "src": [{"n": "Bloomberg Law", "u": "https://news.bloomberglaw.com/business-and-practice/weil-gotshal-partners-vote-to-approve-wind-down-plan-committee", "t": "C"}, {"n": "Reuters", "u": "https://www.tradingview.com/news/reuters.com,2026:newsml_L6N46R18D:0-weil-gotshal-votes-to-dissolve-ending-top-law-firm-s-95-year-run-sources-say/", "t": "C"}, {"n": "Above the Law", "u": "https://abovethelaw.com/2026/11/weils-lifeboats-have-a-seating-chart-first-years-worry-they-arent-on-it/", "t": "C"}, {"n": "City AM", "u": "https://www.cityam.com/weil-partners-green-light-closure-of-legal-powerhouse-after-almost-a-century/", "t": "C"}, {"n": "One First", "u": "https://www.stevevladeck.com/p/first-one-a-run-on-the-bankwhy-weil", "t": "C"}], "framing": "", "min": 1, "front": true, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "fig": {"v": "about 120", "l": "funds lawyers Gibson Dunn is taking"}}, {"id": "s3", "sec": "The Front", "sid": "s-front", "h": "October prices rise 0.4 percent and a December hike is all but priced", "s": "Consumer prices rose 0.4 percent in October and core prices 0.3 percent, the Labor Department said Tuesday. The Treasury sold $42 billion of 10-year notes at 5.02 percent. Bond markets are closed today for Veterans Day.", "paras": ["Consumer prices rose 0.4 percent in October against a 0.3 percent forecast, and core prices 0.3 percent against 0.2 percent, the third straight 0.3 percent core reading, the Labor Department said Tuesday. It published <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">no 12-month rates<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The October 2025 survey was never collected during the shutdown, so there is no base month; the gap returns each month until the series rebuilds.<\/span><\/button>. Shelter rose 0.3 percent, gasoline 1.0 percent and food 0.5 percent.", "That afternoon the Treasury sold $42 billion of 10-year notes at 5.02 percent, a basis point above the when-issued level, with <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">indirect bidders<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A proxy for foreign and fund demand; their 61.2 percent share was well under the recent average, and dealers were left holding the most since May.<\/span><\/button> taking 61.2 percent and a bid-to-cover of 2.46. The 2-year yield jumped about 14 basis points to near 4.69 percent. CME futures put the odds of a quarter-point hike at the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Dec. 8-9 meeting<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Event<\/span>The Fed hiked in September and held in October; October’s PCE gauge, due Nov. 25, is the last major print before the decision.<\/span><\/button> at 85 percent and a half-point at 15, CBS reported. ‘It most likely seals the deal,’ said James McCann of Edward Jones. Bond markets are closed today for Veterans Day."], "why": "A 5 percent 10-year is the discount rate every deal in this paper now prices against, including next week’s Anthropic book.", "c": {"L": 0, "LL": 0, "C": 4, "LR": 0, "R": 0}, "src": [{"n": "BLS", "u": "https://www.bls.gov/news.release/cpi.nr0.htm", "t": null}, {"n": "CBS News", "u": "https://www.cbsnews.com/news/october-cpi-report-elevated-inflation/", "t": "C"}, {"n": "Yahoo Finance", "u": "https://finance.yahoo.com/markets/article/10-year-treasury-yield-jumps-as-odds-of-rate-hike-rise-amid-hot-inflation-print-alphacheck-144120699.html", "t": "C"}, {"n": "InvestingLive", "u": "https://investinglive.com/news/u-s-treasury-sells-42-billion-of-10-year-notes-at-a-high-yield-of-5-02/", "t": "C"}, {"n": "Wolf Street", "u": "https://wolfstreet.com/2026/11/10/10-year-treasury-yield-spikes-as-inflation-spreads-across-economy-driven-by-ugly-core-services-cpi/", "t": "C"}], "framing": "", "min": 1, "front": true, "img": "img/2026-11-11/s3.webp?h=60c144de", "col": "#263854", "cap": "", "credit": "Federalreserve, Public domain / Wikimedia Commons", "pull": null, "chart": {"type": "bar", "t": "October CPI against forecast, percent", "rows": [["Headline", 0.4, "0.4 percent"], ["Headline forecast", 0.3, "0.3 percent"], ["Core", 0.3, "0.3 percent"], ["Core forecast", 0.2, "0.2 percent"]]}}, {"id": "s4", "sec": "AI", "sid": "s-ai", "h": "A shareholder sues Nvidia and Huang over the Megaspeed affair", "s": "A shareholder filed a proposed class action in federal court in San Jose accusing Nvidia and Jensen Huang of misleading investors, AP reported. The class period runs from Oct. 9 to Nov. 8. Earnings are due Nov. 17.", "paras": ["A shareholder, Mark Kistenmacher, filed a proposed class action in federal court in San Jose accusing Nvidia and Jensen Huang of misleading investors about Huang’s relationship with Alice Huang, a former executive of <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Megaspeed<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The complaint says the Singapore firm was ‘suspected of seeking to help smuggle Nvidia products into China,’ which turns a personal matter into an export-control disclosure.<\/span><\/button>, and the company’s ties to the firm, AP reported. The <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">class period<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Its two endpoints, the first Times report and the board’s probe, are the drops the plaintiff will cast as corrective disclosures for loss causation.<\/span><\/button> runs from Oct. 9 to Nov. 8. The shares fell about 5.5 percent Tuesday after a 4.3 percent drop Monday. Earnings are due Nov. 17."], "why": "A board probe became a 10b-5 case in two days, the speed at which disclosure risk now reaches the most valuable company in AI.", "c": {"L": 0, "LL": 1, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "AP via PBS", "u": "https://www.pbs.org/newshour/world/nvidia-and-huang-face-lawsuit-alleging-investors-were-misled-about-spy-affair", "t": "C"}, {"n": "Reuters via Insurance Journal", "u": "https://www.insurancejournal.com/news/international/2026/11/10/892207.htm", "t": "C"}, {"n": "ABC News", "u": "https://abc7news.com/story/nvidia-stock-falls-company-opens-probe-ceo-jensen-huang-alleged-affair-chinese-spy/20026775/", "t": "LL"}, {"n": "Motley Fool", "u": "https://www.fool.com/coverage/stock-market-today/2026/11/10/stock-market-today-nov-10-nvidia-stock-plunges-5-5-as-ceo-scandal-overshadows-its-upcoming-earnings-report/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-11/s4.webp?h=f1a505c3", "col": "#303d17", "cap": "", "credit": "Coolcaesar, CC BY-SA 4.0 / Wikimedia Commons", "pull": null, "fig": {"v": "5.5 percent", "l": "about, the shares’ fall on Tuesday"}}, {"id": "s5", "sec": "AI", "sid": "s-ai", "h": "OpenAI books about $10 billion in a quarter and loses about as much", "s": "OpenAI told investors Tuesday that third-quarter revenue reached about $10 billion, Bloomberg reported. The Wall Street Journal, as relayed by Forbes, reported an adjusted operating loss of about $10.9 billion.", "paras": ["OpenAI told investors Tuesday that third-quarter revenue reached about $10 billion, up nearly 50 percent from about $6.7 billion, Bloomberg reported. ‘Our enterprise business doubled quarter over quarter,’ chief financial officer <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Sarah Friar<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>She blamed the old Microsoft Azure exclusivity for capping enterprise sales and called its end ‘a very big tailwind in 2027.’<\/span><\/button> told Yahoo Finance. The Wall Street Journal, as relayed by Forbes, reported an <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">adjusted operating loss<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>A company-defined, non-GAAP measure; audited figures arrive only with a registration statement, which OpenAI has pushed to 2027.<\/span><\/button> of about $10.9 billion, up from $10.1 billion."], "why": "The rival’s numbers land in the week Anthropic’s book opens, and they are the comparison every allocator will run.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Bloomberg via Spokesman-Review", "u": "https://spokesman.com/stories/2026/nov/10/openai-third-quarter-revenue-soars-nearly-50-to-10", "t": "C"}, {"n": "Yahoo Finance", "u": "https://finance.yahoo.com/technology/article/openai-cfo-q3-was-a-blockbuster-quarter-revenue-jumped-50-225023234.html", "t": "C"}, {"n": "Forbes", "u": "https://www.forbes.com/sites/jonmarkman/2026/11/11/openai-revenue-hits-10-billion-in-q3-as-loss-per-dollar-falls-to-109/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "chart": {"type": "bar", "t": "OpenAI quarterly revenue, about", "rows": [["Second quarter", 6.7, "$6.7 billion"], ["Third quarter", 10, "$10 billion"]]}}, {"id": "s6", "sec": "Markets & Deals", "sid": "s-mkt", "h": "Western Union drops its Intermex deal, and Intermex says it will fight", "s": "Western Union terminated its agreement to buy Intermex after California’s financial regulator delivered final conditions it called ‘unacceptable.’ Intermex rejected the notice and reserved its rights, including specific performance.", "paras": ["Western Union terminated its agreement to buy Intermex after <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">California’s financial regulator<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The DFPI approved the deal in February, extended that approval in April and July, then withdrew it 13 days after the second extension.<\/span><\/button> delivered final conditions on Monday evening that it called ‘unacceptable,’ saying every other jurisdiction had approved and no termination fee is payable. Intermex rejected the notice, saying it ‘will vigorously pursue its remedies and reserves all rights under the Merger Agreement,’ including <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">specific performance<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>An order to close rather than damages; it turns on whether California’s conditions breached the regulatory standard the buyer agreed to accept.<\/span><\/button>."], "why": "A single state’s conditions just became a termination right, the regulatory-efforts clause every deal lawyer drafts and few see litigated.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 0}, "src": [{"n": "Intermex", "u": "https://investors.intermexonline.com/news-releases/news-release-details/intermex-rejects-western-unions-purported-termination-merger", "t": null}, {"n": "Western Union via Business Wire", "u": "https://finance.yahoo.com/markets/stocks/articles/western-union-announces-termination-agreement-044500983.html", "t": "C"}, {"n": "Investing.com", "u": "https://www.investing.com/news/company-news/western-union-terminates-intermex-acquisition-deal-93CH-5017678", "t": "C"}, {"n": "FX News Group", "u": "https://fxnewsgroup.com/forex-news/payments/western-union-terminates-agreement-to-acquire-intermex/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null}, {"id": "s7", "sec": "Markets & Deals", "sid": "s-mkt", "h": "The SEC brings 348 actions in its fiscal year, a historic low, and orders $1.1 billion", "s": "The SEC said Tuesday it brought 348 enforcement actions in the year to Sept. 30 and obtained orders for $1.095 billion, including $343 million in penalties.", "paras": ["The SEC said Tuesday it brought 348 enforcement actions in the year to Sept. 30, 235 standalone and 113 <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">follow-on proceedings<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Administrative bars that follow a court judgment or conviction; they add to the count without a new investigation.<\/span><\/button>, and obtained orders for $1.095 billion, including $343 million in penalties. Reuters counted 456 actions a year earlier against a 2005 to 2025 median of 715. Chairman <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Paul Atkins<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>His division also rescinded the policy that barred settling defendants from denying the charges and named pre-IPO share fraud a priority.<\/span><\/button> said success is ‘ultimately measured by how effectively it advances the SEC’s mission.’"], "why": "A quieter enforcement division shifts the risk of a bad disclosure from the regulator to the plaintiffs’ bar, as Nvidia found this week.", "c": {"L": 0, "LL": 0, "C": 1, "LR": 0, "R": 0}, "src": [{"n": "SEC", "u": "https://www.sec.gov/newsroom/press-releases/2026-113-sec-announces-enforcement-annual-results-fiscal-year-2026", "t": null}, {"n": "Reuters via Yahoo Finance", "u": "https://finance.yahoo.com/markets/stocks/articles/us-sec-enforcement-activity-plummets-190654461.html", "t": "C"}], "framing": "", "min": 1, "front": false, "img": null, "col": "#3a3f4a", "cap": "", "credit": "", "pull": null, "chart": {"type": "bar", "t": "SEC enforcement actions", "rows": [["Latest year", 348, "348"], ["A year earlier", 456, "456"], ["2005 to 2025 median", 715, "715"]]}}, {"id": "s8", "sec": "Law & the Courts", "sid": "s-law", "h": "A Miami judge lets Trump’s defamation claim against the BBC proceed", "s": "A federal judge in Miami on Tuesday denied the BBC’s motion to dismiss Trump’s defamation claim over a Panorama edit of his speech. He dismissed the consumer-protection count.", "paras": ["U.S. District Judge Jeffrey T. Kuntz on Tuesday denied the BBC’s motion to dismiss Trump’s defamation claim over a <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Panorama<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Institution<\/span>The fallout from the edit cost Director General Tim Davie and news chief Deborah Turness their jobs in November 2025, before any suit was filed.<\/span><\/button> edit of his Jan. 6 speech, which CBS said spliced together two clips 55 minutes apart. ‘This was not trimming around the edges but creating something different than what was stated in the speech,’ he wrote. He dismissed the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">FDUTPA<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Florida’s consumer-protection statute reaches trade and commerce; the judge held a documentary is not commercial speech, which halves the exposure to $5 billion.<\/span><\/button> count, cutting the demand from $10 billion to $5 billion.", "The gap in time, Kuntz wrote, ‘tends toward a plausible inference’ that the BBC knew or should have known, so <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">actual malice<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Most public-figure suits die at the pleading stage on this element; inferring it from the edit itself, without internal emails, is unusual.<\/span><\/button> is plausibly pleaded. The BBC said it was ‘surprised by this decision but respect[s] the Court’s authority.’ Its answer is due Dec. 1, and a magistrate judge ordered Trump deposed by Dec. 11."], "why": "A foreign broadcaster now faces discovery in Miami on a single edit, and every newsroom that trims a speech should read the reasoning.", "c": {"L": 0, "LL": 0, "C": 3, "LR": 0, "R": 1}, "src": [{"n": "CBS News", "u": "https://www.cbsnews.com/news/trump-bbc-defamation-case-us-judge-denies-motion-to-dismiss/", "t": "C"}, {"n": "Fox News", "u": "https://www.foxnews.com/media/trump-touts-legal-victory-over-bbc-judge-says-his-lawsuit-against-british-broadcaster-can-proceed", "t": "R"}, {"n": "Euronews", "u": "https://www.euronews.com/2026/11/11/trumps-defamation-lawsuit-against-the-bbc-over-panorama-edit-can-proceed-judge-rules", "t": "C"}, {"n": "TheWrap", "u": "https://www.thewrap.com/industry-news/public-policy-legal/bbc-fails-to-get-trump-defamation-lawsuit-dismissed/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-11/s8.webp?h=df5d5f01", "col": "#2e3945", "cap": "BBC Broadcasting House, London.", "credit": "Les Hull, CC BY-SA 2.0 / Wikimedia Commons", "pull": null, "chart": {"type": "bar", "t": "Trump’s demand, before and after", "rows": [["Before", 10, "$10 billion"], ["After", 5, "$5 billion"]]}}, {"id": "s9", "sec": "Law & the Courts", "sid": "s-law", "h": "Justices press the government on whether Labor can fine a farm without a jury", "s": "The Supreme Court heard DOL v. Sun Valley Orchards on Tuesday, on whether the Labor Department may impose H-2A penalties through its own judges after SEC v. Jarkesy. Several justices doubted the government’s claim.", "paras": ["The Supreme Court heard DOL v. Sun Valley Orchards, No. 25-966, on Tuesday, on whether the Labor Department may impose H-2A visa-program penalties through its own judges after <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">SEC v. Jarkesy<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The 2024 ruling requires a jury when a civil penalty resembles a common-law claim, unless the matter falls within ‘public rights.’<\/span><\/button>. Several justices doubted the government’s claim that the program’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">immigration link<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Immigration is a classic public-rights field; the government needs it to keep cases out of district court, which the Third Circuit ordered below.<\/span><\/button> settles it. ‘So what’s the best way for you to lose?’ Justice Sotomayor asked."], "why": "The answer marks how far Jarkesy reaches past the SEC into every agency that fines through in-house judges.", "c": {"L": 0, "LL": 1, "C": 1, "LR": 0, "R": 1}, "src": [{"n": "Supreme Court", "u": "https://www.supremecourt.gov/oral_arguments/hearinglists/HearingList-November2026.pdf", "t": null}, {"n": "WBUR", "u": "https://www.wbur.org/hereandnow/2026/11/10/scotus-farm-fine", "t": "LL"}, {"n": "Daily Caller", "u": "https://dailycaller.com/2026/11/10/sun-scotus-bashes-lawyer-defending-migrant-workers-undercutting-american-jobs-valley-orchards-dol-rob-johnson-h2a/", "t": "R"}, {"n": "Gray DC via WAFF", "u": "https://www.waff.com/2026/11/11/supreme-court-weighs-whether-government-can-fine-farm-without-trial/", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-11/s9.webp?h=d6ca00bb", "col": "#18395e", "cap": "", "credit": "Joe Ravi, CC BY-SA 3.0 / Wikimedia Commons", "pull": null}, {"id": "s10", "sec": "The World", "sid": "s-world", "h": "Abu Dhabi talks end with a deal on a record prisoner release", "s": "Russian and Ukrainian delegations ended two days of U.S.-brokered talks in Abu Dhabi on Wednesday. Numbers are to be set Thursday. Kushner said territory remains the hardest issue.", "paras": ["Russian and Ukrainian delegations ended two days of U.S.-brokered talks in Abu Dhabi on Wednesday, the first such meeting since February in Geneva. ‘One of the positives is we agreed that we’re going to have the biggest humanitarian release of prisoners,’ said Jared Kushner, who called it ‘a very tough meeting but a productive one.’ Numbers are to be set Thursday; <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">the swap<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>The record to beat is the 1,000-for-1,000 exchange of May 2025; exchanges are the one channel that has delivered through every stalled round.<\/span><\/button> would follow in two to three weeks, TASS said.", "Kushner said territory remains the hardest issue. He and Steve Witkoff meet Putin in Moscow on Thursday. Russia’s negotiator, <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Vladimir Medinsky<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>A former culture minister and Kremlin aide who also led Moscow’s side at Istanbul in 2025, a sign Russia treats these as the same track.<\/span><\/button>, said of European officials present: ‘We don’t really understand in what capacity they are here.’ Overnight Russia said it downed 627 drones and a fire hit the <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Ust-Luga<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Place<\/span>Russia’s main Baltic export terminal for crude and refined products, so a strike there cuts export revenue as well as domestic refining.<\/span><\/button> port, as Baltic states briefly issued shelter alerts."], "why": "Prisoners are moving while borders are not, and Thursday’s Putin meeting tests whether the talks can carry more than humanitarian freight.", "c": {"L": 1, "LL": 0, "C": 3, "LR": 0, "R": 1}, "src": [{"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/11/russia-ukraine-talks-in-abu-dhabi-end-with-prisoner-exchange-agreement", "t": "L"}, {"n": "AP via Boston Globe", "u": "https://www.bostonglobe.com/2026/11/11/world/russia-ukraine-2nd-day-us-brokered-talks-abu-dhabi/", "t": "C"}, {"n": "Fox News", "u": "https://www.foxnews.com/politics/kushner-enters-ukraine-peace-talks-trump-eyes-securing-safeguards-against-another-russian-invasion", "t": "R"}, {"n": "Reuters via Daily Maverick", "u": "https://www.dailymaverick.co.za/article/2026-11-11-baltic-nations-briefly-issue-drone-alerts-as-russia-ukraine-exchange-strikes/", "t": "C"}, {"n": "Euronews", "u": "https://www.euronews.com/2026/11/11/abu-dhabi-peace-talks-end-with-prisoner-exchange-agreement-as-us-envoys-prepare-to-meet-pu", "t": "C"}], "framing": "", "min": 1, "front": false, "img": "img/2026-11-11/s10.webp?h=eaa008aa", "col": "#4d3111", "cap": "The Emirates Palace, Abu Dhabi.", "credit": "Guilhem Vellut from Annecy, France, CC BY 2.0 / Wikimedia Commons", "pull": null, "fig": {"v": "627", "l": "drones Russia said it downed overnight"}}, {"id": "s11", "sec": "The World", "sid": "s-world", "h": "The House shelves Massie’s Hegseth articles as 11 Democrats miss the vote", "s": "The House voted on Tuesday to refer the eight articles against Defense Secretary Pete Hegseth to the Judiciary Committee, effectively ending them in this Congress. Massie was the only Republican opposed.", "paras": ["The House voted 211 to 204 on Tuesday to refer the eight <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">privileged articles<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Concept<\/span>Privilege forces floor action within two legislative days, but a motion to refer needs only a simple majority and stops the clock for good.<\/span><\/button> against Defense Secretary Pete Hegseth to the Judiciary Committee, effectively ending them in this Congress. Massie was the only Republican opposed. Eleven Democrats were absent, more than the margin, among them Nancy Pelosi and Miami’s <button aria-haspopup=\"dialog\" class=\"gloss\" type=\"button\">Frederica Wilson<span class=\"gloss-body\" role=\"dialog\"><span class=\"gloss-kind\">Person<\/span>She represents Florida’s 24th District in northern Miami-Dade, and her absence makes the outcome a local story too.<\/span><\/button>. ‘It’s just the beginning,’ said Hakeem Jeffries."], "why": "Democrats take the gavel in January, so the absences bought Hegseth weeks, not safety.", "c": {"L": 1, "LL": 1, "C": 1, "LR": 0, "R": 1}, "src": [{"n": "CBS News", "u": "https://www.cbsnews.com/news/massie-hegseth-impeachment/", "t": "C"}, {"n": "Fox News", "u": "https://www.foxnews.com/politics/house-gop-leaders-block-massie-hegseth-impeachment-push", "t": "R"}, {"n": "ABC News", "u": "https://abcnews.com/US/hegseth-dismisses-impeachment-effort-political-spectacle/story?id=138002466", "t": "LL"}, {"n": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/11/did-democrats-save-pete-hegseth-from-impeachment", "t": "L"}], "framing": "Fox wrote that the referral ‘effectively killed it in its tracks’ and gave Trump’s ‘EXONERATION’; Al Jazeera called it a ‘surprise reprieve’ and asked, ‘Did Democrats save Pete Hegseth?’", "min": 1, "front": false, "img": "img/2026-11-11/s11.webp?h=6c6d2e16", "col": "#2c394b", "cap": "", "credit":
