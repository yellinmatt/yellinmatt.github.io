{no:"087",t:"Public-Key Cryptography",sub:"Technology",f:"Technology",k:"Every secret you have ever sent over the internet was arranged with a stranger, out loud, on a channel anyone could listen to. For most of the history of secret writing the key gave more trouble than the cipher: to speak privately you first had to agree privately on the setting, which meant meeting in a room, trusting a courier, or weighting a codebook so it sank with the boat. Cryptographers called it the key distribution problem and treated it as a fact of nature, because it reads as a contradiction, since sharing a secret needs a private channel and opening a private channel needs a shared secret. Whitfield Diffie, with no doctorate and no university post, refused to accept that, found Martin Hellman at Stanford and Ralph Merkle circling the same idea, and broke it open in November 1976 in \"New Directions in Cryptography\" for the IEEE Transactions on Information Theory, which opens \"We stand today on the brink of a revolution in cryptography.\" The exchange is easiest to follow in paint: two strangers announce a common colour in the open, each stirs in a secret colour, they swap the mixtures where everyone can see, each adds their own secret again, and both hold an identical result nobody else can reproduce. The arithmetic has the same shape, and an eavesdropper who holds the prime, the base and both published results has to run an exponent backwards, the discrete logarithm problem, for which nobody has a fast method. The paper's second idea, a cipher with a public key for locking and a private key for unlocking, plus the signature you get by running it backwards, was still only a promise; a year later Rivest, Shamir and Adleman built it at MIT, Rivest drafting most of the paper overnight on a couch after a Passover seder, hiding the private key behind the product of two enormous primes. Martin Gardner announced RSA in Scientific American that August under \"A new kind of cipher that would take millions of years to break,\" with a 129-digit number and a hundred-dollar prize; it was factored in April 1994. None of it was first: James Ellis at GCHQ worked out by 1970 that non-secret encryption ought to be possible, Clifford Cocks wrote out RSA in about half an hour one evening in 1973, Malcolm Williamson produced the key exchange in 1974, and all of it stayed classified until December 1997, a month after Ellis died. Closes on the padlock in the address bar, which is a handshake that settles a session key in public and then switches to fast shared-key encryption, and on Shor's 1994 result, harvest-now-decrypt-later, and NIST's first post-quantum standards of August 2024. Carries the 1976 opening as a Read call-out and Computerphile's Mike Pound as a Watch.",dt:"3 August 2026",h:"public-key-cryptography.html",img:"Whitfield%20Diffie%20Royal%20Society%20%28cropped%29.jpg"},
{no:"086",t:"The Map and Compass",sub:"Outdoors & Survival",f:"Outdoors & Survival",k:"The needle lies, the map tells you by how much, and the rest is reading ground. A compass needle settles on a patch of the Arctic Ocean that in 2025 lay at 85.8 degrees north and 139.3 degrees east, nearer to Siberia than to Canada and three hundred miles short of the North Pole; the angle between that and true north is declination, and across the lower forty-eight it runs from about twenty degrees east in parts of Washington to twenty degrees west in parts of Maine, where one degree costs ninety feet in a mile. Edmond Halley mapped the error first, reading the variation hundreds of times on two Atlantic voyages in the Paramore between 1698 and 1700 and publishing in 1701 the first chart ever printed with lines of equal magnetic variation, the trick that later gave us isobars and contour lines. The thing he charted will not hold still: James Clark Ross stood on the north magnetic pole in Arctic Canada in 1831, it worked its way around that archipelago for a century and a half, then in the 1990s it accelerated across the top of the world toward Siberia and over the past year covered thirty-six kilometres against nine for the southern pole, which is why NOAA and the British Geological Survey reissue the World Magnetic Model every five years and why Fairbanks repainted runway 1L-19R as 2L-20R in 2009 (runway numbers being magnetic headings rounded to ten degrees with the last digit dropped). The correction is printed in the map margin as three lines, a star for true north, MN and GN; dial it into the compass with a screwdriver, or carry the rhyme, west is best and east is least, adding a west declination to a map bearing and subtracting an east one. The map's half is the brown line: every point on a contour at one elevation, every fifth drawn heavier and labelled, ten to forty feet apart on the 7.5-minute quadrangle at 1:24,000, crowded for steep and opening out for flat, with a V pointing uphill for a stream and downhill for a spur. Three drills: orient the map, take a bearing, and resection to find yourself inside the triangle three back-bearings make. Then aiming off, deliberately missing a bridge upstream so you know which way to turn, and handrails. Closes on Dahmani and Bohbot's 2020 finding that heavier lifetime GPS use tracks worse self-guided navigation and steeper decline in hippocampus-dependent spatial memory. Carries a Watch call-out with REI's compass demonstration and Halley's 1701 chart.",dt:"2 August 2026",h:"map-and-compass.html",img:"Walkers%20compass%20arp.jpg"},
{no:"085",t:"The Place Setting",sub:"Etiquette",f:"Social Living",k:"Sit down at a properly laid table and the arrangement in front of you is the menu, set out in advance in metal, and the whole of it reads from one rule: start at the outside and work in. The Emily Post Institute's grammar is short. Knife blades face the plate, cutting edge in; no more than three of any one implement go down at once and a fourth course arrives carrying its own fork; the oyster fork is the only fork ever set to the right of the plate; glasses stand above the knives in the order they will be poured, water directly above the dinner knife with the wines to its right; bread sits left and drinks right, which the fingers settle faster than the head, since touching each thumb to its forefinger makes a lowercase b on the left hand and a d on the right. None of it is old. For most of the history of the European table a guest brought his own knife, ate from a shared dish, and worked with bread, a spoon and his fingers, which is exactly what Bruegel's Peasant Wedding of 1567 shows, with not one fork in the room. The fork came from Byzantium and was received as decadence: in 1004 Maria Argyropoulina of Constantinople married Giovanni Orseolo, son of the doge, and brought golden forks to Venice; plague killed her within three years, and half a century later the monk Peter Damian wrote her up as a warning, since she would not touch her food with her fingers but had her eunuchs cut it small enough to spear on \"a certain golden instrument with two prongs.\" Later retellings pin the story on the dogaressa Theodora Doukaina, who arrived seventy years afterward; the target was Maria. Italy came round anyway, and by the fourteenth century the fork was unremarkable there. England waited until Thomas Coryat walked home from Venice, published Coryat's Crudities in 1611 with the first English description of what a fork is for, and was mocked at table by his friend Laurence Whitaker as Furcifer, fork-bearer and also gallows-bird. Closes on the zigzag: the American cut-and-switch, named by Emily Post, is a French fashion of the early eighteenth century that nineteenth-century Americans copied from Paris and that Paris then dropped, a manual of 1853 already calling the no-switch style the newer one. Carries Coryat's Italian passage verbatim, glossed, and a hand-built plan of a five-course setting.",dt:"1 August 2026",h:"place-setting.html",img:"A%20place%20setting%20and%20menu%20for%20the%20State%20Dinner%20for%20President%20Yoon%20Suk%20Yeol%20of%20the%20Republic%20of%20Korea%20and%20Mrs.%20Kim%20Keon%20Hee%20is%20seen%20in%20the%20East%20Room%2C%20April%2026%2C%202023%2C%20at%20the%20White%20House.jpg"},
{no:"084",t:"Upland Bird Hunting",sub:"Outdoor Pursuits",f:"Outdoor Pursuits",k:"The whole sport compressed into one gesture. A pointer running a hillside stops dead, one foreleg still lifted, and holds a bird it has decided not to chase; a dog's predatory sequence runs search, stalk, chase, bite, and the point is the stalk held open indefinitely, bred for since the mid-seventeenth century when birds were still taken with nets and a frozen dog bought the seconds a man needed to throw one. Genetics has found the fingerprint, a stretch of chromosome 22 present in pointing breeds and absent from the rest. The gun rewrote the manners: through the matchlock centuries you shot a bird sitting because ignition was too slow to swing on anything moving, and the flintlock made shooting flying possible, a French fashion Charles II brought home from exile that Richard Blome's Gentleman's Recreation of 1686 was the first English book to depict; within two generations taking a bird on the ground had become the thing nobody admits to. Vocabulary: gauge counts how many round lead balls of that bore's diameter weigh a pound, so the scale runs backwards and the 20 is the smaller bore, the 12 standard for waterfowl and driven birds and the 20 the usual choice for a day of walking. Choke is a slight constriction in the last inch of barrel, graded by firing at paper from forty yards and counting the pellets inside a thirty-inch circle (cylinder about 30 percent, improved cylinder 40, modified 50, full 70), so an open choke suits a grouse breaking at fifteen yards and a tight one a pheasant at thirty-five. Three birds: the ruffed grouse, ranked first, whose drumming male opens a partial vacuum with his wings and hits nothing at all, proved by Arthur Allen of Cornell on film in 1929; the bobwhite, which roosts in a ring with every head facing out and rises all at once; and the ring-necked pheasant, shipped from Shanghai to Oregon by consul general Owen Denny in 1881 aboard the Otago and established by his further shipments in 1882 and 1884. Closes on land: bobwhite counts on the Breeding Bird Survey down about 81 percent between 1966 and 2019 with almost none of it hunting, against Pittman-Robertson of 1937, an 11 percent excise tax on arms and ammunition the industry lobbied for on itself. Carries Leopold's numenon passage from A Sand County Almanac, glossed.",dt:"31 July 2026",h:"upland-bird-hunting.html",img:"Pointers_on_the_Hunt_by_Percival_Rosseau.jpg"},
{no:"083",t:"Vaccination",sub:"Medicine",f:"Medicine & the Body",k:"A country doctor tested a piece of dairy-farm folklore on his gardener's son and proved it. In May 1796 Edward Jenner made two shallow cuts in the arm of James Phipps, his gardener's eight-year-old, worked in fluid from a cowpox sore on the hand of the milkmaid Sarah Nelmes, and seven weeks later deliberately gave the boy smallpox; nothing happened. The Royal Society passed on the paper, so he published the Inquiry himself in 1798, naming the cattle disease variolae vaccinae, from vacca, which is why every shot you have ever had is named after a Gloucestershire cow. He took out no patent, called himself the Vaccine Clerk to the World, and vaccinated the local poor free in a thatched summerhouse he named the Temple of Vaccinia. Covers variolation and Lady Mary Wortley Montagu, the anti-vaccination leagues that arrived immediately, the surveillance-and-containment method and the forked needle that finished the job, and the last names in the record: Rahima Banu, Ali Maow Maalin, Janet Parker. Carries Jenner's own Case XVII verbatim, glossed.",dt:"30 July 2026",h:"vaccination.html",img:"Edward%20Jenner.%20Oil%20painting.%20Wellcome%20V0023503.jpg"},
{no:"082",t:"The Tobacco Leaf",sub:"Smoke",f:"Smoke",k:"How a leaf becomes what it is, which happens in a barn rather than a field. In 1839, on a farm in Caswell County, North Carolina, a young enslaved man named Stephen fell asleep watching a barn of curing tobacco, woke to a dying fire, and threw charred log ends from his blacksmith's charcoal pit onto the embers; the sudden heat produced six hundred pounds of what the trade press later recorded as the brightest yellow tobacco ever seen. Abisha Slade, who owned the farm and owned Stephen, spent a dozen years learning to repeat it on purpose and was selling twenty thousand pounds a year by 1857. The mechanism explains the accident. A cut tobacco leaf is still alive and the barn's first job is to keep it that way: held near 100°F in humid air it goes on respiring, breaks down its chlorophyll and converts stored starch to sugar, so the green drains out and the yellow comes up; when the colour is right the heat is raised to about 130°F to kill the tissue and stop the change, then to 160°F to dry the blade and finally the stem, five or six days in all (the Virginia Cooperative Extension schedule). Kill the leaf too early and the green sets and stays. The barn is called flue-cured after the metal pipes that carry heat in from a furnace outside so smoke never touches the leaf. The real credit, though, belongs to the soil: thin sandy nitrogen-poor piedmont starves the plant, a starved plant makes less protein and stores more starch, and that is the leaf that cures pale and mild. Virginia had found the same thing around 1650, when Edward Digges planted ordinary Orinoco seed on a poor sandy neck of the York River and produced the light aromatic sweet-scented leaf London called the world's best, sold on his initials as E. Dees. The plant is American. Nicotiana rustica is what the Virginia Indians grew, and William Strachey dismissed it as \"poore and weake, and of a byting tast\"; Nicotiana tabacum, the milder Spanish Caribbean plant, is what John Rolfe obtained as seed from Trinidad and Caracas and had growing by July 1612, with samples reaching England in July 1613, 20,000 pounds in 1617 and twice that in 1618, after which Virginia paid its taxes and debts in leaf. The genus honours Jean Nicot, French ambassador in Lisbon, who sent tobacco to Catherine de' Medici in 1560 as a headache cure; Linnaeus named the plant for him and the alkaloid followed. James I published A Counterblaste to Tobacco in 1604, the same year he authorised a duty of six shillings and eightpence a pound, and by 1624 had made the trade a royal monopoly instead; his account of the \"unctuous and oily kinde of Soote\" found in smokers dissected after death precedes the most quoted anti-smoking line ever written. The vocabulary is four cures: flue-cured (four to eight days of clean piped heat, sugars kept, bright mild Virginia, most of the world's cigarettes), air-cured (one to two months, no fire, sugars spent, Burley, low sugar and high nicotine, the neutral carrier blenders add flavour to), fire-cured (hardwood smouldering under the leaf for three to ten weeks, creosote in the tissue, Kentucky dark and Latakia), and sun-cured (a fortnight on open racks, Oriental). A cigar is air-cured then bulk-fermented; a cigarette is mostly flue-cured; an English pipe blend is Virginia with Latakia over it.",dt:"29 July 2026",h:"tobacco-leaf.html",img:"Nicotiana%20tabacum%20-%20K%C3%B6hler%E2%80%93s%20Medizinal-Pflanzen-098.jpg"},
{no:"081",t:"The Federal Reserve",sub:"Finance",f:"Civic & Money",k:"How a duck-hunting cover story in 1910 produced the institution that sets the price of money in America. In 1907 the Knickerbocker Trust failed, runs spread through New York, and the man who stopped them held no office: J. P. Morgan assembled private money and credit lines until the fear burned out, and enough people in Washington found that intolerable that within six years the country had a central bank. The underlying fault was structural. Panics arrived on average every fifteen years, bank reserves sat scattered across thousands of vaults and froze in place in a crisis, and the currency supply was pegged to a class of federal bonds rather than to demand, so it could not swell for the harvest or the Christmas trade. In November 1910 Senator Nelson Aldrich took five men (Paul Warburg of Kuhn Loeb, Henry Davison of J. P. Morgan, Frank Vanderlip of National City, assistant Treasury secretary A. Piatt Andrew, and his own secretary Arthur Shelton) to the Jekyll Island Club off Georgia, boarding one at a time at a New Jersey terminal, using first names only, with a duck hunt as the cover story. They called themselves the First Name Club and denied the meeting for twenty years; B. C. Forbes printed it in 1916 and was dismissed as a yarn. Their Aldrich Plan died with the 1912 election, and Carter Glass and Robert Owen rebuilt the same machine with the politics inverted: a board of presidential appointees over the system, terms stretched to ten staggered years so no two-term president could name them all. Wilson signed on 23 December 1913. Structure: the Board of Governors is an independent federal agency, while the twelve regional Reserve Banks are chartered like private corporations, with member banks subscribing stock worth 6 percent of their capital, electing six of nine directors, and drawing a capped dividend on stock they cannot sell or pledge; everything above that goes to the Treasury ($107.4 billion in 2021). Policy is set by the FOMC: seven governors, the New York Fed president permanently, four of the other eleven on rotation. The 1977 amendment names three goals (maximum employment, stable prices, moderate long-term interest rates) universally called the dual mandate, with a published 2 percent PCE inflation target since 2012, worked through a target range for the federal funds rate. What that costs was settled by Paul Volcker: chairman from August 1979 with inflation near 9 percent, he announced on 6 October 1979 that the Fed would constrain bank reserves and let the rate run, which took it to a record 20 percent in late 1980. Farmers protested at the headquarters, car dealers mailed coffins full of the keys of unsold cars, a congressman threatened impeachment, unemployment hit 10.8 percent in late 1982, and inflation fell from a peak of 11.6 percent to 3.7 percent by 1983. The credibility bought there underwrote the Great Moderation. Since September 2022 the Fed has paid more on reserves than its portfolio earns, so remittances stopped and the shortfall sits as a deferred asset, $133 billion at the end of 2023.",dt:"28 July 2026",h:"federal-reserve.html",img:"Marriner%20S.%20Eccles%20Federal%20Reserve%20Board%20Building.jpg"},
{no:"080",t:"Go",sub:"Games & Pastimes",f:"Games & Pastimes",k:"The oldest board game still played seriously, and the one that held out against computers for nineteen years after chess fell. The board starts empty: nineteen lines cross nineteen lines, giving 361 points, and players alternate placing stones that never move again, each trying to end up owning more of the board than the other. Two ideas do almost all the work. Capture is suffocation: the empty points directly beside a stone (up, down, across, never diagonally) are its liberties, four in the open middle, three on the edge, two in the corner, and filling the last one takes the stone off the board as a prisoner; stones side by side along a line share liberties and die together, which is why players talk about walls rather than pieces. But capture almost never decides a game. When neither side can find a profitable move both pass, twice ends it, and each counts the vacant points enclosed by their own stones plus prisoners taken, with strong games turning on two or three points out of 361. The idea that makes you conversant is life and death: a surrounded group lives forever once it encloses two separate empty points, called eyes, because filling either would be an illegal self-capture, so the attacker can take one eye or the other and never both. One eye is a corpse waiting. Two smaller rules: ko (Japanese for eternity) forbids the immediate recapture that would restore a position exactly, and komi hands White about seven points to offset Black's first move. Go also solved a problem chess never has, since strength is counted in stones and the weaker player simply starts with up to nine of them on the board. History: Chinese, known as weiqi (the surrounding game) by Confucius' day; the earliest boards ran seventeen lines a side, and a white-glazed ceramic board made in 595, lifted from Zhang Sheng's tomb at Anyang in 1959, shows nineteen already standard under the Sui. The oldest surviving manual is a paper scroll from the sealed library cave at Dunhuang, carried off by Aurel Stein in 1907 and titled the Classic of Go (British Library Or.8210/S.5574). Chinese scholars counted qi among the four accomplishments of a cultivated man beside the zither, calligraphy, and painting; in 1612 the shogun put Japan's four strongest players on hereditary stipends and the resulting houses, Honinbo above all, generated most of the theory over the next two and a half centuries; in Korea the game is baduk and five to ten percent of the country plays. Why machines struggled: a Go player has about 250 reasonable moves per turn over about 150 moves where chess has 35 over 80, the exact count of legal positions (settled by distributed computation in January 2016) runs to 171 digits, and nobody could write down what makes a Go position good. DeepMind's AlphaGo (Silver, Huang, Hassabis et al., Nature, January 2016) trained a policy network to propose moves and a value network to judge positions, on human games then on self-play; it beat European champion Fan Hui 5-0 in October 2015 and Lee Sedol 4-1 in Seoul in March 2016 before 200 million viewers. Game two's Move 37, a shoulder hit on the fifth line where convention says the third or fourth, was rated a one-in-ten-thousand human choice and won the game; Lee's Move 78 in game four, equally improbable and nicknamed God's Touch, won the only game AlphaGo has ever lost in a formal match. AlphaGo beat world number one Ke Jie 3-0 at Wuzhen in May 2017 and retired; Lee retired in November 2019 saying there is an entity that cannot be defeated. A 2023 PNAS study of 5.8 million professional moves from 1950 to 2021 found human decision quality measurably improved after 2016. Start on a nine-line board.",dt:"27 July 2026",h:"go.html",img:"114.365%20Opening%20Move.jpg"},
{no:"079",t:"Cheese",sub:"Food",f:"Food",k:"How every cheese in the world comes out of one decision, and how to read a counter because of it. Milk is about seven-eighths water carrying the protein casein, whose clusters are held apart by a fuzzy coat; rennet, an enzyme traditionally taken from a calf's fourth stomach, shears that coat off so the clusters knit into a gel across the vat, and cutting the gel lets the trapped liquid, the whey, run out. How much whey the maker drains decides everything downstream: leave it in and the cheese is soft, mild, and eaten within days, like fresh chevre; press it out, salt the curd, and store it cool and you get a wheel that keeps for years, which was the point before refrigeration, since a cheese carries the milk of August into February. Parmigiano-Reggiano is the limit case, refused its name under twelve months, with an inspector tapping each wheel with a small hammer at that mark and listening for a true ring rather than the dead thud of a crack. Mongers file a counter into eight families set by water content and by what was allowed to grow outside: fresh, bloomy rind (Penicillium camemberti on Brie and Camembert), washed rind (brine or spirit encouraging Brevibacterium linens, the orange tacky rind of Epoisses), semi-soft, hard and alpine (Comte, Gruyere, Parmigiano), blue (mould needled into the interior), pasta filata (curd stretched into fibres, mozzarella and provolone), and processed. Roquefort is the worked example and the origin of modern food law: on 26 July 1925 France gave it the first appellation, before which anyone could sell cow's-milk blue under the name, and French wine waited until 1936 for the same protection. Its wheels ripen in the Combalou caves, ventilated by natural chimneys called fleurines, made only from Lacaune ewes' milk by seven remaining houses, down from about three hundred; the rye bread in every wheel is a myth (the dough is only a nursery for the mould). For the board: three to five cheeses chosen across families rather than countries, out of the refrigerator an hour early because cold cheese is mute, cut so everyone gets rind and centre, served mild to strong.",dt:"26 July 2026",h:"cheese.html",img:"Caves%20affinage%20Marcel%20Petite%20fort%20Saint-Antoine%2020230906%20n03.jpg"},
{no:"078",t:"The Indo-European Language Family",sub:"Language",f:"Language & Rhetoric",k:"The whole family of languages behind English, and how a single lost ancestor was found hiding in the ordinary words we still use. Line up father with Latin pater, Greek pater, and Sanskrit pitr, or three with Latin tres, Greek treis, and Sanskrit trayas, and the match across continents and millennia is too exact for chance or borrowing; the only account is descent from one parent no living speaker ever heard. Sir William Jones, a judge on the Calcutta bench who had learned Sanskrit to read Hindu law, pressed the point in his Third Anniversary Discourse to the Asiatic Society on 2 February 1786, calling Sanskrit, Greek, and Latin sprung from some common source which perhaps no longer exists and adding the Germanic (his Gothic), Celtic, and Old Persian tongues to the same family; he was not the first to notice it (a Dutch scholar in 1653, a French Jesuit in 1767) and got details wrong, folding in Egyptian and Chinese, but his sentence launched the field. The lost source was named Proto-Indo-European, a reconstruction spoken five or six thousand years ago whose descendants (Indo-Iranian, Greek, Latin and the Romance languages, Celtic, Germanic, Balto-Slavic, Armenian, Albanian) make the largest family on Earth, the first language of close to half of humanity. The reconstruction counts as a science because sound change is regular: Jacob Grimm's 1822 law caught the Germanic shift of p to f, which is why Latin pater is father, pes is foot, and piscis is fish. Shared words for the wheel, axle, and yoke (the reconstructed kwekwlos gives both wheel and Greek kuklos, a circle) date the speakers to after wheeled transport, roughly 3500 BC, and point to the Yamnaya herders of the steppe north of the Black Sea, now tied by ancient DNA to Indo-European speakers from Ireland to India. Carry this: when you count one, two, three you are working words older than any nation that speaks them, and from resemblances in living words scholars drew the map of a people who left no writing.",dt:"24 July 2026",h:"indo-european-language-family.html",img:"Sir_William_Jones.jpg"},
{no:"077",t:"The Honeybee",sub:"Insects",f:"The Animal World",k:"How a hive of fifty thousand insects behaves as one animal, and how Karl von Frisch cracked its language. A forager back from a good flower dances on the dark vertical comb: a round dance for a find close by, and for anything past about fifty meters a waggle dance whose straight run carries the message, its tilt off vertical giving the direction (straight up means fly toward the sun) and its length giving the distance. Von Frisch spent decades of glass-hive experiments proving this abstract reference, a symbol standing for a place and the only language of its kind known in an insect, and he shared the 1973 Nobel with Lorenz and Tinbergen as a founder of the science of animal behavior. The colony is a superorganism: one fertile queen laying up to two thousand eggs a day, tens of thousands of sterile female workers who cycle from nurse to builder to guard to forager, and a few hundred male drones that only mate; no bee is in charge, and a lone honeybee soon dies. It matters past the wonder because animal pollinators service about a third of the crops we eat and the trucked honeybee does most of that farmed work, valued by the USDA near fifteen billion dollars a year, which is why Colony Collapse Disorder, first seen in the winter of 2006 as workers vanished from their hives, was such a fright. Modern beekeeping rests on Lorenzo Langstroth, who in 1851 noticed that bees leave a gap of about three-eighths of an inch open and built the movable-frame hive around that bee space, patented in 1852. The thing to carry is the dance: a brain the size of a grass seed encodes where a flower is and hands it to a bee that never saw it.",dt:"23 July 2026",h:"honeybee.html",img:"Apis_mellifera_Western_honey_bee.jpg"},
{no:"076",t:"Judo",sub:"Physical & Self-Defense",f:"Physical & Self-Defense",k:"How a slight schoolteacher turned the samurai art of jujitsu into judo, a way of using a bigger man's own force against him. In 1882 Jigoro Kano, five foot two and under a hundred pounds, opened his Kodokan school in a Tokyo temple. Drawing on two jujitsu styles, he found the trick that lets a small man throw a large one: you do not shove a heavier body over, you first take its balance. He named that opening move kuzushi, the breaking of balance, and taught every throw as three beats, kuzushi to unbalance, tsukuri to fit under, kake to finish, all governed by one principle, seiryoku zen'yo, best use of energy. He cut the maiming techniques the old schools guarded so students could spar full force every day (randori), graded the safe throws into a syllabus (the gokyo), and devised the coloured-belt and dan ladder every later martial art borrowed. His Kodokan team beat the leading jujitsu school at a Tokyo police tournament around 1886 and the argument was over; judo entered Japanese schools as physical education. Kano became the first Asian member of the IOC in 1909 and pressed to bring the Games to Tokyo, dying in 1938 before judo became Olympic there in 1964. His fighter Mitsuyo Maeda carried judo to Belem, Brazil, where the Gracie family reworked it into Brazilian jiu-jitsu. Leverage beats strength once you understand balance, which is why a judo teacher first shows a beginner not a throw but how to fall.",dt:"22 July 2026",h:"judo.html",img:"Jigoro_Kano.jpg"},
{no:"075",t:"The Dress Shoe",sub:"Objects & Style",f:"Objects & Style",k:"Judge a dress shoe by two things before the label. First the lacing: an oxford closes its lace flaps under the vamp into a clean seamless V and reads as the more formal shoe, while a derby sews them on top and leaves them open, giving more room and a touch more ease. Then the decoration, which runs from a plain cap toe down to the punched holes of a brogue; those perforations began as drainage in the wet bogs of Ireland and Scotland, kept the brogue a country shoe for centuries, and now simply mark how casual it is, the full brogue or wingtip most decorated of all. What you actually pay for is the welt, the strip of leather stitched around the edge that joins the sole to the upper by way of the insole; because the outsole is sewn to the welt and not through the upper, a cobbler can cut it off and stitch on a new one for decades without touching the part shaped to your foot. Hand-welting dates to about 1500; the name honours Charles Goodyear Jr., who mechanised it in the 1860s on his father's rubber fortune. The alternatives give themselves away: a Blake stitch runs straight through the sole and resoles poorly, a cemented sole is merely glued and thrown away when it wears. Northampton has owned the English shoe since the Middle Ages, home to Church's, Crockett & Jones, Edward Green, and John Lobb. Buy a welted black cap-toe oxford first, add shoe trees, rotate two pairs, and a pair bought once will last.",dt:"21 July 2026",h:"dress-shoe.html",img:"Acorn%20captoes%20side.JPG"},
{no:"074",t:"Building a Fire",sub:"Outdoors & Survival",f:"Outdoors & Survival",k:"A fire lights or dies on preparation, not the match. Gather and grade tinder, kindling, and fuel before you strike, stand a tepee of kindling over a fist of tinder, and light it low from the upwind side, feeding small to large down to a bed of coals.",dt:"20 July 2026",h:"building-a-fire.html",img:"Campfire_by_Lake_Tahoe.jpg"},
{no:"073",t:"The Periodic Table",sub:"Chemistry",f:"Sciences & Mathematics",k:"Lay the sixty-three elements known in 1869 in order of rising weight and their properties keep returning, so that soft, water-burning metals like lithium, sodium, and potassium fall into one column and greedy fluorine, chlorine, and bromine into another; that recurrence is the periodic law, and the Russian teacher Dmitri Mendeleev read it more boldly than his rivals. Where an element seemed missing he left the square blank and predicted the properties of the thing that would fill it, naming three provisionally eka-boron, eka-aluminium, and eka-silicon; when gallium (1875), scandium (1879), and germanium (1886) turned up matching his figures, a teacher's chart became a law that could foretell the unseen. Julius Lothar Meyer had drawn a similar table but declined to predict, and the two shared the Royal Society's Davy Medal in 1882. One flaw lingered, a few pairs like tellurium and iodine ranked wrongly by weight, until Henry Moseley's 1913 X-ray work showed the true order is set by the atomic number, the count of protons in the nucleus; Moseley died at Gallipoli in 1915, but his atomic number remains the table's spine, and the columns Mendeleev built by hand turned out to be columns of shared electron structure.",dt:"19 July 2026",h:"periodic-table.html",img:"Dmitri_Mendeleev.jpg"},
{no:"072",t:"Port",sub:"Drinks",f:"Drinks",k:"Pour a glass of Port after dinner and you are drinking a wine that was deliberately interrupted: partway through fermentation, a clear grape spirit called aguardente is added, which kills the yeast, leaves the unfermented sugar behind, and lands the wine sweet and strong at nineteen to twenty-two percent. It all begins in the Douro, the gorge of slate terraces in northern Portugal that in 1756, under the Marquês de Pombal, became the first wine region in the world to be formally demarcated; the Methuen Treaty of 1703 had already handed Portuguese wine a tariff edge in Britain, and English and Scottish houses (Taylor's, Graham's, Warre's, Cockburn's, Sandeman) settled in to ship it. Port leads a double life: made up in the Douro, then aged in the cool lodges of Vila Nova de Gaia across the river from Porto, once carried down by flat-bottomed rabelo boats. The one distinction to hold is how it ages: sealed in glass it stays deep and fruity and a great Vintage improves for half a century, throwing a crust that must be decanted; left in small oak casks it oxidises to amber and nut and fig, which is Tawny, bottled with an age indication of 10, 20, 30, or 40 years. Between them sit Ruby, Late Bottled Vintage, single-harvest Colheita, and white Port. And at the table the decanter passes only to the left, clockwise; if it stalls, you ask the hoarder whether he knows the Bishop of Norwich.",dt:"18 July 2026",h:"port.html",img:"Port%20wine.jpg"},
{no:"071",t:"The Great Wave off Kanagawa",sub:"Visual Arts",f:"Visual Arts & Architecture",k:"In the last days of 1830 an Edo print shop advertised Hokusai's Thirty-Six Views of Mount Fuji for the New Year trade, its selling point a deep, newly affordable blue no Japanese landscape had worn before. One sheet showed a great wave curling over three fishing boats, with Mount Fuji shrunk to a speck in the trough; the English-speaking world miscalls it a tsunami, but it is a rogue swell of the open sea. The colour was the technology: the Met's conservators found the printers mixed indigo into Prussian blue for the outlines and double-printed pure Prussian blue in the hollow, so the water climbs from a leaden dusk-blue to a luminous one. A woodblock print was a workshop's work, publisher and block-cutter and printers together, though only Hokusai's name survives. He was around seventy, signing as Iitsu and calling himself the old man mad about painting; the series ran past its own title to forty-six prints and several thousand cheap impressions. When Japan reopened, the print travelled west as packing paper and lit the japonisme that ran through Monet, van Gogh, and Debussy's La Mer, until the wave became the single image the world reaches for when it means Japan, or the sea.",dt:"17 July 2026",h:"great-wave-off-kanagawa.html",img:"Tsunami_by_hokusai_19th_century.jpg"},
{no:"070",t:"The Cuban Missile Crisis",sub:"History",f:"History",k:"For thirteen days in October 1962 the world stood at the edge of nuclear war. A U-2 spy plane photographed Soviet nuclear missile sites under construction in Cuba, ninety miles from Florida; Kennedy convened the ExComm in secret, chose a naval blockade he called a quarantine, and on 22 October told the nation that a launch from Cuba would bring a full retaliatory response on the Soviet Union. The confrontation peaked on Black Saturday, 27 October, when a U-2 was shot down over Cuba, another strayed over Siberia, and a Soviet submarine officer, Vasili Arkhipov, refused to authorize a nuclear torpedo. It ended through back-channels: two Khrushchev letters, a secret deal to pull American Jupiter missiles from Turkey, and Khrushchev's 28 October announcement that the missiles would be withdrawn. The hotline and the first atmospheric test-ban treaty followed within a year.",dt:"16 July 2026",h:"cuban-missile-crisis.html",img:"President%20Kennedy%20signs%20Cuba%20quarantine%20proclamation%2C%2023%20October%201962.jpg"},
{no:"069",t:"Pelé",sub:"Sports",f:"Sports",k:"Pelé rose from a poor town in the Brazilian interior, learned the game barefoot with a rag-stuffed sock for a ball, and by seventeen had won the 1958 World Cup, scoring twice in the final against Sweden. He is the only footballer to win the World Cup three times, in 1958, 1962, and 1970; the 1970 Brazil side he led in Mexico, which beat Italy 4-1 in the final at the Estadio Azteca, is the team most often called the greatest ever assembled. Guinness credits him with 1,279 goals in 1,363 matches, his thousandth a penalty at the Maracanã in November 1969. He carried the game to the United States with the New York Cosmos in 1975, and the phrase that trailed him, o jogo bonito, the beautiful game, became the name the whole sport now gives itself.",dt:"15 July 2026",h:"pele.html",img:"Pel%C3%A9%201960.jpg"},
{no:"068",t:"The Sermon on the Mount",sub:"Religion",f:"Philosophy & Religion",k:"On a hillside above the Sea of Galilee, a young rabbi sat down and taught the crowd the longest unbroken block of Jesus's teaching in any Gospel, Matthew chapters five through seven. It opens with the Beatitudes, eight blessings that fall on all the wrong people (the poor in spirit, the mourning, the meek, the merciful, the persecuted) and turn the world's order of value upside down. From there it gives English 'the salt of the earth,' 'the light of the world,' and 'a city set on a hill'; drives the old law inward from murder to anger and from adultery to the lustful look; answers 'an eye for an eye' with 'turn the other cheek' and 'love your enemies'; sets the Lord's Prayer at its centre and the Golden Rule near its close; and ends on the wise man who builds on rock. Augustine named it, calling it a perfect standard of the Christian life; Tolstoy, Gandhi ('it went straight to my heart'), and Martin Luther King Jr. read a doctrine of nonviolence straight out of it.",dt:"14 July 2026",h:"sermon-on-the-mount.html",img:"Bloch-SermonOnTheMount.jpg"},
{no:"067",t:"The Rite of Spring",sub:"Dance",f:"Film & Performing Arts",k:"On 29 May 1913, at the brand-new Theatre des Champs-Elysees in Paris, Diaghilev's Ballets Russes gave the premiere of Stravinsky's ballet of a pagan Russian spring rite, in which a chosen young woman dances herself to death to renew the earth. Vaslav Nijinsky's choreography turned classical ballet inside out, the dancers pigeon-toed and hunched, stamping the stage flat-footed, while Stravinsky's score hammered dissonant chords with the accents falling in unpredictable places. The audience jeered and shouted until the noise nearly drowned the orchestra, and Nijinsky had to scream the counts from a chair in the wings. The ballet was danced only a handful of times and its choreography was lost within a year, but the music, vindicated at a concert in 1914, became one of the foundations of twentieth-century music.",dt:"13 July 2026",h:"rite-of-spring.html",img:"RiteofSpringDancers.jpg"},
{no:"066",t:"Fly Fishing",sub:"Fishing",f:"Outdoor Pursuits",k:"The lure at the end of the line weighs almost nothing, so the angler casts the heavy line itself, with the long limber rod working as a spring that the line's own moving weight bends and releases. The fly is tied to imitate the insect a trout is eating: a dry fly floating the winged adult on the surface, a nymph sinking to copy the underwater larva, a streamer stripped back like a small fish. Choosing the fly is the easy half; the hard, lifelong half is reading the water, knowing the seam, foam line, and pocket where a trout holds to feed at least cost. The pursuit carries a long literary pedigree, from the 1496 Treatyse and Walton's much-reprinted Compleat Angler of 1653 to Norman Maclean's A River Runs Through It, whose 1992 film more than doubled the sport.",dt:"12 July 2026",h:"fly-fishing.html",img:"Fly Fisher Casting On The Colorado River.jpg"},
{no:"065",t:"The Divine Comedy",sub:"Poetry",f:"Literature & Letters",k:"A Florentine exile, condemned to death by his own city in 1302, spent nearly twenty years of wandering writing himself a journey down through Hell, up the mountain of Purgatory, and out through Heaven, guided first by the Roman poet Virgil and then by the woman he had loved from childhood. He built it in a hundred cantos of interlocking three-line rhyme, and he wrote it not in Latin but in the Tuscan of the Florentine street, a gamble that founded literary Italian and made him the father of the language.",dt:"11 July 2026",h:"divine-comedy.html",img:"Dante_Domenico_di_Michelino_Duomo_Florence.jpg"},
{no:"064",t:"Alan Turing",sub:"Technology",f:"Technology",k:"In 1936, chasing an abstract problem in logic, a twenty-four-year-old Cambridge mathematician imagined a machine that read and wrote symbols on an endless tape and, fed a description of any other machine, could imitate it perfectly. That universal machine is the design every computer has followed since. Turing meant only to answer Hilbert's decision problem, and his answer was no, some questions no rote procedure can settle; the general-purpose computer fell out as a by-product, alongside the Church-Turing thesis. In the war he joined Bletchley Park and, with Gordon Welchman, designed the Bombe that mechanized the breaking of Enigma. In 1950 he asked whether a machine could think and proposed the imitation game we now call the Turing test. Convicted of gross indecency in 1952 and chemically castrated, he died in 1954 aged forty-one; Britain pardoned him in 2013 and put him on the fifty-pound note in 2021.",dt:"10 July 2026",h:"alan-turing.html",img:"Alan_Turing_(1951).jpg"},
{no:"063",t:"The Calling Card",sub:"Etiquette",f:"Social Living",k:"For a century and a half a small rectangle of pasteboard ran the social life of the upper classes. The calling card came out of France in the 1760s, printed and left at a house to announce a visit; the answer came back as a card of one's own, or as silence. Its grammar was strict: a card returned meant a visit would be welcome, one sent sealed in an envelope closed the door, and the whole system leaned on servants to carry the cards on a silver tray. A turned corner meant it was left in person, though the elaborate code of the corners was always looser than legend. Emily Post was still explaining it in 1922, as the automobile and telephone finished it off. Its heirs are the business card and the RSVP.",dt:"9 July 2026",h:"calling-card.html",img:"Francesco_Bartolozzi_-_Visiting_Card_of_Mrs_Parker_-_B1978.43.697_-_Yale_Center_for_British_Art.jpg"},
{no:"062",t:"The Hippocratic Oath",sub:"Medicine",f:"Medicine & the Body",k:"The oldest and best-known text in medical ethics, set down on Kos in the fifth or fourth century BC and almost certainly written by the followers of Hippocrates rather than the man himself. It swears the physician by Apollo, Asclepius, Hygieia, and Panacea, binds him to his teacher's family like a son, and forbids specific acts: no lethal drug, no abortive pessary, no cutting for the stone, no exploiting the household, and strict confidentiality. Its most famous line, first do no harm, appears nowhere in it; that Latin maxim traces to the nineteenth century. Most schools now use a modern rewrite, Louis Lasagna's of 1964.",dt:"8 July 2026",h:"hippocratic-oath.html",img:"Hippocrates_pushkin02.jpg"},
{no:"061",t:"The Bowline",sub:"Practical Skills",f:"Practical Skills",k:"The one knot to learn if you learn only one. The bowline makes a fixed loop at the end of a line that holds under any strain the rope will bear, refuses to jam so it unties with a finger even after a heavy load, and can be tied with one hand, which is why it belongs to rescue crews. Its name comes from the age of sail; its first mention in print is John Smith's A Sea Grammar of 1627; Clifford Ashley listed it as number 1010 and called it a knot a sailor seldom trades for another. Learn it by the rabbit, the hole, and the tree.",dt:"7 July 2026",h:"bowline.html",img:"Palstek_innen.jpg"},
{no:"060",t:"The Marshall Plan",sub:"Diplomacy",f:"Civic & Money",k:"How a soldier's understated ten-minute speech at Harvard in June 1947 became the largest peacetime aid program in history. George Marshall offered American money on the condition that Europe draw up the plan together; roughly thirteen billion dollars flowed to sixteen nations from 1948 to 1952; every recipient's output climbed back above its prewar level; the Soviet walkout in Paris split the continent into two blocs; and Marshall became the only career soldier ever to win the Nobel Peace Prize.",dt:"7 July 2026",h:"marshall-plan.html",img:"George_C._Marshall,_U.S._Secretary_of_State.jpg"},
 {no:"059",t:"Ethos, Pathos, Logos",sub:"Rhetoric",f:"Language & Rhetoric",k:"The Athenian art of persuasion, sorted by Aristotle into three appeals, ethos, pathos, and logos, and shown at work in the most studied speech of the American century.",dt:"6 July 2026",h:"ethos-pathos-logos.html",img:"Aristotle_Altemps_Inv8575.jpg"},
 {no:"058",t:"Beethoven's Ninth Symphony",sub:"Music",f:"Music",k:"How a stone-deaf composer wrote the first symphony to break into song, sang Schiller's Ode to Joy in its finale, and gave the world a melody that became the anthem of a continent.",dt:"5 July 2026",h:"beethovens-ninth-symphony.html",img:"Joseph_Karl_Stieler%27s_Beethoven_mit_dem_Manuskript_der_Missa_solemnis.jpg"},
 {no:"057",t:"The Wolf",sub:"Wildlife",f:"The Animal World",k:"A predator erased from Yellowstone for seventy years and carried back in a crate: how the wolf returned, why the &ldquo;alpha wolf&rdquo; never existed in the wild, and what a top predator really does.",dt:"4 July 2026",h:"wolf.html",img:"Gray_Wolf_-_Canis_lupus_(51545668593).jpg"},
 {no:"056",t:"The Moneymaker Effect",sub:"Poker",f:"Games & Pastimes",k:"An accountant with no live-tournament experience turned an $86 online satellite into $2.5 million and the biggest boom poker has ever seen.",dt:"3 July 2026",h:"moneymaker-effect.html",img:"Chris_Moneymaker.jpg"},
 {no:"055",t:"Beef Bourguignon",sub:"Food",f:"Food",k:"America learned to cook French from this one Burgundian braise, a lesson in what long, low heat and a bottle of red do to a cheap cut of beef.",dt:"2 July 2026",h:"beef-bourguignon.html",img:"Boeuf%20Bourguignon%202022.jpg"},
 {no:"054",t:"The Necktie",sub:"Objects & Style",f:"Objects & Style",k:"The one garment a man wears purely to be looked at, from a Croatian soldier's neckcloth to Jesse Langsdorf's 1922 bias cut.",dt:"1 July 2026",h:"necktie.html",img:"Necktie%20MET%201985.367.11.jpg"},
 {no:"053",t:"Fermat's Last Theorem",sub:"Mathematics",f:"Sciences & Mathematics",k:"A lawyer's margin note in 1637 that took the world three hundred and fifty-eight years, and Andrew Wiles seven secret ones, to prove.",dt:"1 July 2026",h:"fermats-last-theorem.html",img:"Pierre_de_Fermat2.png"},
 {no:"052",t:"The Four-Minute Mile",sub:"Athletics",f:"Sports",k:"On 6 May 1954, on the Iffley Road track in Oxford, the medical student Roger Bannister became the first man to run a mile in under four minutes, a figure physiologists had treated as a wall the body could not pass. The gale that almost cancelled the attempt; the two pacemaker friends, Chris Brasher and Chris Chataway, who set the pace through 1:58 at the half and 3:00.7 at three-quarters before Bannister surged past on the back straight; the 3:59.4, and the statistician Norris McWhirter (later of the Guinness Book of Records) drawing the announcement out until the crowd's roar drowned it; Bannister the twenty-five-year-old who trained on his lunch breaks and read the barrier as much mental as physical; the record falling to John Landy in just forty-six days; the Miracle Mile at Vancouver that August where both men broke four minutes in one race; and the afterlife, Bannister the neurologist and the mile now down to El Guerrouj's 3:43.13.",dt:"30 June 2026",h:"four-minute-mile.html",img:"Roger_Bannister_1953.jpg"},
 {no:"051",t:"The Peregrine Falcon",sub:"Birding",f:"The Animal World",k:"The peregrine falcon, the fastest animal alive and one of conservation's great comebacks: the hunting stoop, a near-vertical dive in which the bird folds its wings and drops at a speed Cornell puts near 238 miles an hour, killing prey on the wing with a single open-footed blow before biting through the neck; a diet of other birds, some 450 species in North America from hummingbird to sandhill crane; the field marks (slate-gray back, barred underparts, the dark moustache mark, the larger female 'falcon' and smaller male 'tiercel'); the name meaning pilgrim or wanderer and a range covering every continent but Antarctica; the mid-century DDT crash that thinned its eggshells and wiped it out east of the Mississippi (a centerpiece of Rachel Carson's Silent Spring); and the recovery led by Tom Cade and the Peregrine Fund from 1970, the 1972 DDT ban, the move into cities, and removal from the U.S. endangered-species list in 1999.",dt:"29 June 2026",h:"peregrine-falcon.html",img:"Falco_peregrinus_good_-_Christopher_Watson.jpg"},
 {no:"050",t:"The Tobacco Pipe",sub:"Smoke",f:"Smoke",k:"How to know and smoke a pipe: briar, the root burl of the Mediterranean tree heath Erica arborea, which since around 1854 at Saint-Claude displaced the fragile clay pipe because it shrugs off heat and chars sweet; the four working parts (bowl and its chamber, the draught hole, the shank, the stem ending in the bit); the other materials (meerschaum, the soft Turkish sepiolite that colours amber with use; clay; and the corncob General MacArthur made his trademark); the Sherlock Holmes calabash that Conan Doyle never wrote, invented for the stage by the actor William Gillette; the four base leaves (sweet Virginia, nutty Burley, smoky Latakia, peppery Perique) and the English-versus-aromatic divide; and how to pack (child, woman, man), light twice, and sip slow so it stays cool.",dt:"28 June 2026",h:"tobacco-pipe.html",img:"Briar_pipe_Lord.jpg"},
 {no:"049",t:"Magna Carta",sub:"Medieval England",f:"History",k:"The 1215 Magna Carta, walked from Runnymede to the modern bill of rights: King John cornered by his rebel barons after losing Normandy and quarreling with Rome; the sixty-three clauses of mostly feudal grievance sealed on 15 June 1215; clauses 39 and 40 on due process and the sale of justice; Pope Innocent III annulling the whole charter within weeks and the First Barons' War that followed; the reissues under Henry III and the 1297 confirmation onto the statute roll; and the long afterlife from Sir Edward Coke to the Fifth Amendment's due process and Eleanor Roosevelt's 'Magna Carta for all mankind', with three clauses still in force today.",dt:"27 June 2026",h:"magna-carta.html",img:"Magna_Carta_(British_Library_Cotton_MS_Augustus_II.106).jpg"},
 {no:"048",t:"The Wet Shave",sub:"Practical Skills",f:"Practical Skills",k:"The traditional wet shave with a double-edged safety razor: the three-piece kit (razor, brush, soap or cream); the history that corrects a common myth, since King Camp Gillette did not invent the safety razor (the straight razor came first, Jean-Jacques Perret fitted a guard around 1770, and the Kampfe brothers of New York sold the first tool called a 'safety razor' in 1880) but in 1904 patented the cheap, thin throwaway blade that made his fortune through the razor-and-blades model and spread further when the U.S. Army issued Gillette kits in the First World War; why the brush and lather matter (they soften and lift the whiskers and slick the blade); the two counter-intuitive habits (hold the blade at about thirty degrees and use no pressure beyond the razor's own weight); and the three-pass method, with, across, and against the grain.",dt:"26 June 2026",h:"wet-shave.html",img:"Rasierpinsel.jpg"},
 {no:"047",t:"Cogito, Ergo Sum",sub:"Philosophy",f:"Philosophy & Religion",k:"Descartes' search for a single belief that could not be doubted, and the answer he built a philosophy on: I think, therefore I am. To find what could be known for certain, he resolved to treat as false anything open to the least doubt. The senses deceive, so he set them aside; dreams feel as real as waking, so he set the waking world aside; and in the Meditations of 1641 he imagined an all-powerful evil demon deceiving him about everything, even arithmetic. One thing survived the doubt: to be deceived at all, he had to exist to be deceived, and doubting is itself a kind of thinking, so a thinker must exist. He first wrote the line in French, 'je pense, donc je suis', in the Discourse on the Method of 1637; the Latin 'Cogito, ergo sum' reached print in the Principles of Philosophy of 1644; and in the Meditations he phrases it as 'I am, I exist', necessarily true each time he conceives it. From this single certainty he set out to rebuild the world, reasoning out through a non-deceiving God to the trustworthiness of clear and distinct ideas, a move critics still attack as the Cartesian circle. The cogito also founded Cartesian dualism, which splits mind from body and opens the modern mind-body problem. Descartes died in 1650 of pneumonia in Stockholm after Queen Christina demanded her lessons at five in the morning; he is called the father of modern philosophy for moving the starting point of knowledge from God and authority to the doubting individual self.",dt:"25 June 2026",h:"cogito-ergo-sum.html",img:"Frans_Hals_-_Portret_van_Ren%C3%A9_Descartes.jpg"},
 {no:"046",t:"Carmen",sub:"Opera",f:"Film & Performing Arts",k:"The opera that scandalized Paris at its 1875 premiere and went on to become one of the most performed works in the world. On 3 March 1875 the Opéra-Comique, a Paris house known for light, well-mannered entertainment that ended with order restored, watched a soldier knife a cigarette-factory worker to death on the steps of a bullring; the woman was Carmen, a Romani factory girl who took her lovers as she pleased and went to her death without repentance, and the first audiences were scandalized. Georges Bizet built the opera from Prosper Mérimée's hard 1845 novella, with a libretto by Henri Meilhac and Ludovic Halévy, setting in Seville the corporal Don José who throws away his rank and his fiancée Micaëla for Carmen, and the toreador Escamillo who supplants him. An opéra-comique meant a French opera mixing sung numbers with spoken dialogue, not necessarily a comedy. The first run played to half-empty houses even after free tickets, sharing the season with Verdi's more popular Requiem, and the critics called it obscene. Yet Bizet had buried two melodies the whole world now knows: the Habanera, 'L'amour est un oiseau rebelle', Carmen's entrance aria over a slowly descending bass, lifted from Sebastián Iradier's song 'El Arreglito' in the belief it was folk music and rewritten about a dozen times for the original Carmen, mezzo-soprano Célestine Galli-Marié; and the Toreador's Song. Bizet died of a heart attack on 3 June 1875, at thirty-six, during the opera's thirty-third performance, still believing it a failure. Within a decade it was a worldwide staple; Tchaikovsky predicted it would be the most popular opera in the world, and Nietzsche worshipped it as the sunlit, Mediterranean cure for Wagner.",dt:"24 June 2026",h:"carmen.html",img:"Henri-Lucien%20Doucet%20-%20Carmen.jpg"},
 {no:"045",t:"ARPANET",sub:"Technology",f:"Technology",k:"The network that became the internet, walked from its first stuttered message to the design choices that still govern the web. On the night of 29 October 1969 a UCLA graduate student, Charley Kline, tried to log in to a computer at the Stanford Research Institute over the new ARPANET and the link crashed after two letters, making the first message ever sent between two computers the accidental word 'lo'. ARPANET was funded by the Pentagon's Advanced Research Projects Agency to let rare, incompatible, expensive computers share work across distance, a vision J.C.R. Licklider had sketched as an 'Intergalactic Computer Network' and Lawrence Roberts turned into a plan. Its breakthrough was packet switching, worked out independently by Paul Baran at RAND and Donald Davies at Britain's NPL with the supporting mathematics from Leonard Kleinrock: every message is broken into small addressed packets that route across the network independently and reassemble at the far end, so a downed line is simply routed around. Bolt Beranek and Newman built the Interface Message Processor, the refrigerator-sized gateway that sat at each node; four were running by the end of 1969, linking UCLA, SRI, UC Santa Barbara, and Utah. Email arrived in 1971 (Ray Tomlinson, who chose the @ sign) and soon dominated the traffic; Vint Cerf and Bob Kahn's TCP/IP, adopted in a coordinated 'flag day' cutover on 1 January 1983, turned a single network into the internet. ARPANET itself was retired in 1990.",dt:"23 June 2026",h:"arpanet.html",img:"Interface_Message_Processor_Front_Panel.jpg"},
 {no:"044",t:"The Handshake",sub:"Etiquette",f:"Social Living",k:"The gesture old enough to seal an Assyrian treaty and tender enough to mark a Greek goodbye. The oldest known image of a handshake is an Assyrian relief of the ninth century BC, where King Shalmaneser III of Assyria and Marduk-zakir-shumi of Babylon clasp right hands to seal an alliance; why the right hand became the hand of greeting is guessed at more than known, between the theory that an open right hand shows no weapon and the theory that two clasped hands make a promise physical. The Greeks named it dexiosis, the giving of the right hand, and by the fifth century BC made it a fixed motif, dominant after about 430 BC on Athenian grave reliefs where a seated and a standing figure clasp hands across the line between living and dead, the same gesture serving greeting, marriage, alliance, and the last farewell. Rome kept it (the dextrarum iunctio at the heart of a wedding, two joined hands on a coin of Concordia), and seventeenth-century Quakers turned it into a leveling courtesy offered to everyone regardless of rank. The craft still comes down to a few seconds: the Emily Post Institute's drill is doorknob pressure, crook of thumb to crook of thumb, two or three pumps, a held eye, and a dry hand, against the two notorious failures of the limp hand and the knuckle-grinder. A 2015 Weizmann Institute study even found people often sniff a just-shaken hand, suggesting the handshake quietly samples a stranger's chemistry.",dt:"22 June 2026",h:"handshake.html",img:"Funerary_stele_of_Thraseas_and_Euandria_Antikensammlung_Berlin_01.jpg"},
 {no:"043",t:"The Jab",sub:"Physical & Self-Defense",f:"Physical & Self-Defense",k:"Boxing's plainest punch, and its most important. The jab is the lead-hand straight punch, punch number one in the gym's numbering system (odd numbers are the lead hand, even numbers the rear, power hand, so the 'one-two' is jab-then-cross): from a hands-up guard the lead fist fires straight to the target, the fist turning over to land on the first two knuckles, then returning to the guard before the opponent can counter. It is the only punch a fighter throws without opening his own guard, which is why it is thrown more than all the others combined. Its work is mostly quiet: it measures range so the heavier punches can land, breaks the opponent's timing, banks points round after round, and held out long and stiff keeps a bigger man at the end of an arm. 'Stick and move' is the craft of the boxer who would rather not be hit, and the stick is the jab. The Victorians called it the straight left, and the argument over who threw it best (Larry Holmes's long heavy jab, Joe Louis's crisp accuracy, Sonny Liston's power, Muhammad Ali's blinding speed) is itself a piece of boxing culture.",dt:"21 June 2026",h:"jab.html",img:"Straight%20Left%20Hand%20Counter,%20Peter%20Jackson%20and%20Fred%20Slavin,%20from%20the%20Boxing%20Positions%20and%20Boxers%20series%20(N266)%20issued%20by%20P.%20Lorillard%20Company%20to%20promote%20Red%20Cross%20Long%20Cut%20Tobacco%20MET%20DPB879434.jpg"},
 {no:"042",t:"Penicillin",sub:"Medicine",f:"Medicine & the Body",k:"How a contaminated dish became the first antibiotic. In September 1928 Alexander Fleming returned to his laboratory at St Mary's Hospital to find a blue-green Penicillium mould growing on a forgotten staphylococcus plate, with a clear ring around it where the bacteria had dissolved; he named the substance penicillin, found it killed common pathogens while sparing the body's own cells, but, trained as a bacteriologist rather than a chemist, could never stabilise it, and for a decade the discovery lapsed. The rescue came from Oxford, where Howard Florey, Ernst Chain, and Norman Heatley worked out how to extract and concentrate the drug, proved it on infected mice in 1940, and treated the first patient, the policeman Albert Alexander, in February 1941, only to watch him relapse and die when the tiny supply ran out. The American scale-up at a government fermentation laboratory in Peoria broke the bottleneck (corn-steep liquor, deep-tank fermentation, and a super-strain found on a mouldy cantaloupe), and by the Normandy landings of June 1944 there was enough to treat every Allied casualty who needed it. Fleming, Florey, and Chain shared the 1945 Nobel Prize, and Fleming used his lecture to warn, presciently, that careless underdosing would breed bacteria the drug could no longer kill.",dt:"20 June 2026",h:"penicillin.html",img:"Professor_Alexander_Fleming_at_work_in_his_laboratory_at_St_Mary's_Hospital,_London,_during_the_Second_World_War._D17801.jpg"},
 {no:"041",t:"Finding North by the Stars",sub:"Outdoors & Survival",f:"Outdoors & Survival",k:"How to find true north on a clear night without a compass. Everything in the sky wheels through the night except one point: Polaris, the North Star, which stands almost exactly over the Earth's north pole. The catch is that Polaris is dim, only second magnitude, so you find it by signpost rather than by hunting: the two pointer stars on the outer lip of the Big Dipper's bowl, Dubhe and Merak, throw a line that lands on Polaris about five times their own gap away, and Cassiopeia's flattened W marks the opposite side of the pole for when the Dipper rides low. Once found, drop a line from Polaris to the horizon for true north, and read its height above the horizon as your latitude (the old sailor's sextant trick). The Earth's slow twenty-six-thousand-year wobble means the job rotates: Thuban held it when the pyramids rose, Vega takes it in twelve thousand years. South of the equator there is no pole star, so the Southern Cross stands in, its long axis extended four and a half times to mark due south. Primary source: U.S. Army Field Manual 21-76, the survival manual.",dt:"19 June 2026",h:"finding-north-by-the-stars.html",img:"Steve_Ryan_-_Stars_around_Polaris_-_Day_62_(by-sa).jpg"},
 {no:"040",t:"The Wealth of Nations",sub:"Economics",f:"Civic & Money",k:"The book that founded modern economics, walked from its opening image to its most misread one. Adam Smith opens the 1776 Inquiry in a pin factory, where ten workers who split the job into about eighteen operations turn out forty-eight thousand pins a day, when one man working alone could barely make twenty: the division of labour, and his redefinition of a nation's wealth as the yearly flow of goods its labour produces rather than the gold in its sovereign's vault. The engine is self-interest, not benevolence (the butcher, the brewer, the baker); the invisible hand, the phrase that appears exactly once in the whole book, as the observation that private interest can be turned to public good under competition; Smith the Glasgow moral philosopher of The Theory of Moral Sentiments (1759), no apostle of greed; his warning that men of the same trade soon conspire against the public; and his profile and pin factory together on the British twenty-pound note from 2007 to 2020.",dt:"18 June 2026",h:"wealth-of-nations.html",img:"Adam_Smith_The_Muir_portrait.jpg"},
 {no:"039",t:"Jesse Owens",sub:"Sports",f:"Sports",k:"Four gold medals at Hitler's Olympics. The 1936 Berlin Games were staged by the Nazi regime as a showcase for racial supremacy, and a twenty-two-year-old Black American won the 100 metres, the 200 metres, the long jump, and a leg of the 4x100 relay, breaking or equalling an Olympic record in each. The Alabama sharecropper's son who became the Buckeye Bullet; the greatest forty-five minutes in sport at Ann Arbor in 1935 (three world records and a fourth tied in under an hour, a long jump that stood twenty-five years); the runway friendship with the German Luz Long; the Hitler-snub myth set against the real snub from FDR, who sent no telegram and no White House invitation; the two Jewish relay runners pulled from the team; and the return to a segregated America where he raced against horses because, as he said, you cannot eat four gold medals.",dt:"17 June 2026",h:"jesse-owens.html",img:"Jesse%20Owens%201936.jpg"},
 {no:"038",t:"Cow and Beef",sub:"Language",f:"Language & Rhetoric",k:"Why English keeps two words for the same animal: a cow in the field becomes beef on the plate, swine becomes pork, sheep becomes mutton, calf becomes veal. The Norman Conquest of 1066 set a French-speaking aristocracy over an English-speaking peasantry for three centuries; the Saxon who raised the beast kept the old Germanic name, and the Norman who ate it brought the French one to the table (beef from Old French boef, pork from porc, mutton from mouton). The deeper twist that cow and beef are cousins, both descended from one Proto-Indo-European root that walked north into Germanic and south through Latin before meeting again on an English plate; Walter Scott's jester Wamba making the point in Ivanhoe (1819); and the wider French and Latin overlay that gave English its formal register (ask and inquire, kingly and royal and regal, freedom and liberty).",dt:"16 June 2026",h:"cow-and-beef.html",img:"Bayeux_Tapestry_scene55_William_Hastings_battlefield.jpg"},
 {no:"037",t:"Backgammon",sub:"Backgammon",f:"Games & Pastimes",k:"The oldest game still played for pleasure, walked from the board to the doubling cube. Fifteen checkers a side race in opposite directions around twenty-four points; you build walls by stacking two or more on a point, hit a lone enemy blot to send it to the bar, and bear off once all your checkers are home, with a gammon worth double. The deep history of the tables family (the Royal Game of Ur, the Roman game of twelve lines, Emperor Zeno's ruinous dice, Hoyle's 1753 treatise); the doubling cube invented in 1920s New York that turned the game into a contest of estimating your odds (take a double only if you will win at least one in four); the 1960s boom under Prince Alexis Obolensky; Paul Magriel's 1976 Bible and his X-22 nickname; and TD-Gammon, the 1992 neural network that taught itself the game and previewed the machine learning that would later conquer Go.",dt:"15 June 2026",h:"backgammon.html",img:"Backgammon_board.jpg"},
 {no:"036",t:"The Maillard Reaction",sub:"Cooking",f:"Food",k:"The browning reaction behind almost everything that smells like cooking: the crust on a steak, the gold of toast, the color of coffee, dark beer, and maple syrup. Amino acids and reducing sugars recombine over heat (around 150 Celsius) into hundreds of new brown pigments (melanoidins) and aroma compounds, with the amino acid setting the smell more than the sugar; why the surface has to be dry to brown at all, since boiling water pins it at 100 Celsius; the distinction from caramelization, which is sugar alone; Louis-Camille Maillard's 1912 discovery while trying to synthesize proteins, the wartime revival, and John E. Hodge's 1953 three-stage mechanism. Jean-Marie Lehn called it the most widely practiced chemical reaction on Earth.",dt:"14 June 2026",h:"maillard-reaction.html",img:"Juicy%20steak%20cooked%20to%20perfection%20on%20a%20black%20stone.jpg"},
 {no:"035",t:"The Octopus",sub:"Marine Life",f:"The Animal World",k:"The cephalopod that built a complex mind on a body plan unlike ours: a boneless body whose only hard part is the beak, three hearts and blue copper-based blood (hemocyanin), and about five hundred million neurons with close to two-thirds in the arms, so each arm can taste, feel, and decide on its own. Peter Godfrey-Smith's Other Minds and the line that split from ours roughly 600 million years ago; skin that changes color and texture in a fifth of a second through chromatophores even though the animal is colorblind (Roger Hanlon's 177 camouflage decisions an hour); the veined octopus carrying coconut shells, the first tool use recorded in an invertebrate; and a one-to-two-year life that ends after a single brood, now written into UK law as sentient.",dt:"14 June 2026",h:"octopus.html",img:"Octopus%20vulgaris%2002.JPG"},
 {no:"034",t:"Sharpening a Knife",sub:"Practical Skills",f:"Practical Skills",k:"How to put a real edge back on a blade with a stone. The difference between honing (realigning the edge, done often) and sharpening (grinding fresh steel, done seldom); the whetstone and its grit grades (coarse ~400 to fine 3,000-6,000); the all-important angle (about 20 degrees per side for a Western knife, 15 for a Japanese one) and the marker trick for finding it; the burr, the wire of steel that proves you have reached the apex; the five-step procedure (set the angle, raise a burr, match the other side, climb the grits, finish and strop); and the paper-and-tomato test.",dt:"13 June 2026",h:"sharpening-a-knife.html",img:"Whetstone%20Knife%20Sharpening%2C%202015-%2801%29.jpg"},
 {no:"033",t:"The Trench Coat",sub:"Objects & Style",f:"Objects & Style",k:"How to read a trench coat: the gun flap, D-rings, epaulettes, and buckled cuffs as a kit list from the Western Front; gabardine, the breathable waterproof cloth Thomas Burberry invented in 1879 and patented in 1888; the Tielocken forerunner (1912), the War Office design submitted in 1901, and Aquascutum's rival claim to the 1850s; the officers-only private-purchase rule and the generous cut sized over the British Warm; and the afterlife from Casablanca and Marlene Dietrich to the modern staple.",dt:"12 June 2026",h:"trench-coat.html",img:"Man%20wearing%20trenchcoat%20%28cropped%29.jpg"},
 {no:"032",t:"The Points of Sail",sub:"Sailing",f:"Outdoor Pursuits",k:"A sailboat cannot sail into the wind, but it can sail almost everywhere else. The points of sail named in order as the boat turns away from the wind (in irons, close-hauled, close reach, beam reach, broad reach, running), the no-go zone, tacking versus jibing and the crew calls (\"ready about\", \"helm's a-lee\", \"jibe-ho\"), and the nautical idioms minted on the angles (\"by and large\", \"taken aback\").",dt:"11 June 2026",h:"points-of-sail.html",img:"Moonbeam%20-%20Brest%202008-10.jpg"},
 {no:"031",t:"The Transistor",sub:"Technology",f:"Technology",k:"Bardeen and Brattain's point-contact device of December 1947 (the plastic triangle, the gold foil, the germanium slab, Shockley's \"magnificent Christmas present\"), the page-46 press debut, the junction transistor born of a patent grudge, the 1956 Nobel, and the road west: Shockley's lab, the traitorous eight, Fairchild, Intel, Moore's law, and the naming of Silicon Valley in 1971.",dt:"10 June 2026",h:"transistor.html",img:"Replica-of-first-transistor.jpg"},
 {no:"030",t:"The Cigar",sub:"Smoke",f:"Smoke",k:"How to read a cigar: the three tobaccos (wrapper, binder, filler), the size system (length in inches plus ring gauge in sixty-fourths), the origin countries (Cuba, Dominican Republic, Nicaragua, Honduras), and the cut-light-draw-rest mechanics. Anchored on the Montecristo No. 4 petit corona, the brand named in 1935 for the Dumas novel the lector read aloud to the rollers, now a quarter of all Habanos sales.",dt:"9 June 2026",h:"cigar.html",img:"MonteCristo%20Cigar.jpg"},

function slugOf(L){return F2SLUG[L.f]||"thought";}

function domLessons(s){return LESSONS.filter(function(L){return slugOf(L)===s;});}

var libFam='',libQ='',libView='index';
function lcard(L){return '<a class="lcard fam-'+slugOf(L)+'" href="'+L.h+'"><span class="lplate"><img loading="lazy" src="'+fp(L.img,500)+'" alt="'+L.t+'"></span><span class="lmeta"><span class="lno">No. '+L.no+'</span> &middot; '+L.dt+'</span><span class="ltag">'+L.sub+'</span><span class="ltt">'+L.t+'</span><span class="ldk">'+L.k+'</span></a>';}
function renderLib(){
  var list=LESSONS.filter(function(L){var okF=!libFam||slugOf(L)===libFam;var okQ=!libQ||(L.t+' '+L.sub+' '+L.f+' '+L.k).toLowerCase().indexOf(libQ)>-1;return okF&&okQ;});
  var box=document.getElementById('lib-results');
  if(!list.length){box.innerHTML='';document.getElementById('lib-empty').style.display='block';return;}
  document.getElementById('lib-empty').style.display='none';
  function idxrow(L,fam){return '<a class="idxrow fam-'+fam+'" href="'+L.h+'"><span class="n">No. '+L.no+'</span><span class="t">'+L.t+'<small>'+L.sub+'</small></span><span class="d">'+L.dt+'</span></a>';}
  if(libView==='gallery'){box.innerHTML='<div class="lgrid">'+list.map(lcard).join('')+'</div>';}
  else if(!libFam){
    // "All": one flat list, newest first (LESSONS is already in accession-descending order)
    box.innerHTML='<div class="idxgroup">'+list.map(function(L){return idxrow(L,slugOf(L));}).join('')+'</div>';
  }
  else{var html='';DOMAINS.forEach(function(D){if(D.slug!==libFam)return;var g=list.slice();g.sort(function(a,b){return a.no<b.no?1:-1;});
    html+='<div class="idxgroup fam-'+D.slug+'"><div class="idx-h">'+D.key+'<span class="c">'+g.length+'</span></div>'+g.map(function(L){return idxrow(L,D.slug);}).join('')+'</div>';});box.innerHTML=html;}
}
