}
*{box-sizing:border-box}

const dayRange=()=>{const T=COURSES.filter(c=>inSchool(c)||ids().includes(c.id)).flatMap(c=>c.sess);return T.length?[Math.floor(Math.min(...T.map(x=>x.from))/60),Math.ceil(Math.max(...T.map(x=>x.to))/60)]:[8,22]};

function renderCal(){{const ag=$('#agenda');if(ag)ag.hidden=true;$('#cal').style.display=''}const wk=S.week,a=wk,b=iso(add(D(wk),6)),d0=D(wk);const H=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hour'))||42;let [H0,H1]=dayRange();breakOcc(a,b).forEach(o=>{H0=Math.min(H0,Math.floor(o.from/60));H1=Math.max(H1,Math.ceil(o.to/60))});const y=m=>(m-H0*60)/60*H;

  let h='<div></div>';for(let i=0;i<ND;i++){const d=add(d0,i);h+=`<div class="dh">${phone()?DN[DAYS[i]].slice(0,phone()?2:3):DN[DAYS[i]]}<span>${d.getUTCDate()}</span></div>`}

  for(let i=0;i<ND;i++){const date=iso(add(d0,i));let inner='';
    br.filter(o=>o.date===date).forEach(o=>inner+=`<div class="brk" style="top:${y(o.from)}px;height:${y(o.to)-y(o.from)}px"><span>${esc(o.label)}</span></div>`);

      const t=Math.max(0,y(e.from)),hh=Math.max(18,y(e.to)-y(e.from)-2);const c=e.c;const sub=fT(e.from)+'–'+fT(e.to)+(c.profs[0]?' · '+last(c.profs[0]):'');
      inner+=`<div class="ev ${colorOf(c.id)}${clash?' x':''}${e.ghost?' ghost':''}${e.gx?' gx':''}${sc?' sc':''}" data-g="${esc(c.code)}" style="top:${t}px;height:${hh}px;left:calc(${e.l*w}% + 2px);width:calc(${ww}% - 4px)" title="${esc(fmtCode(c)+' '+c.name+' '+sub)}"><b class="evn">${esc(c.name)}</b><span class="evm">${phone()?c.code.replace(/^[A-Z]+/,''):fmtCode(c)} · ${esc(phone()?fT(e.from):fT(e.from)+'–'+fT(e.to))}</span>${sc?`<span class="scl">${esc(one?(e.span===0?'One day · '+DN[DC[D(e.date).getUTCDay()]]+' '+fD(e.date):'This week only'):spanLab(c))}</span>`:''}</div>`});
    h+=`<div class="col" style="height:${(H1-H0)*H}px">${inner}</div>`}
  $('#cal').innerHTML=h;$('#cal').querySelectorAll('.ev').forEach(n=>n.onclick=()=>{ret=null;S.open=n.dataset.g;if(phone())S.pane='courses';all();if(phone())window.scrollTo(0,0)});
