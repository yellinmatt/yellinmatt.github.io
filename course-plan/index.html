<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Miami Law Course Planner</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="An unofficial schedule planner for Miami Law upper-level courses, built from public CourseLink data.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
:root{
  --ground:#eef1f4; --panel:#ffffff; --ink:#3a4250; --ink-strong:#18202c; --muted:#6f7888; --faint:#646d7c; --line:#e1e6ec; --pill:#d4dae2;
  --brand:#2b4f7e; --brand-soft:#e3ebf6; --brand-ink:#1d3a60; --on-brand:#ffffff;
  --easl:#5b55c9; --easl-soft:#ecebfb; --easl-ink:#353089;
  --good:#2f8a5f; --good-soft:#e1f2e8; --info:#3a6fc9; --info-soft:#e5edfb; --warn:#9a6a00; --warn-soft:#fbf1d8; --bad:#c43a2f; --bad-soft:#fde7e4; --on-bad:#ffffff;
  --brk:#6a5acd; --brk-soft:#ecebfb; --knob:#ffffff;
  --shadow:0 5px 14px rgba(20,30,50,.09);
  --k0:#dceffd;--k0i:#174a78; --k1:#e2f4ea;--k1i:#185a3b; --k2:#fdeedd;--k2i:#7a4108; --k3:#f1e6fb;--k3i:#5a2d84; --k4:#fde6ea;--k4i:#86203a; --k5:#e3f6f6;--k5i:#135c5c; --k6:#f6f2d8;--k6i:#5e5207; --k7:#e8eaf7;--k7i:#2e3577;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --hour:42px;
  --t-biz:#3456b8; --t-lit:#b5482e; --t-ip:#0f7d7a; --t-ent:#b0307a; --t-pub:#3f7d2c; --t-crim:#9a5a00; --t-intl:#0b74a3; --t-tax:#6e6a10; --t-prac:#5d6675; --t-theory:#7a5a3a;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#11151b; --panel:#1a2029; --ink:#c8d0db; --ink-strong:#eef2f7; --muted:#8c96a5; --faint:#8f9aab; --line:#2a323e; --pill:#3a4452;
  --brand:#8db4ea; --brand-soft:#1d2c42; --brand-ink:#cfe0f8; --on-brand:#0f1622;
  --easl:#a7a2f5; --easl-soft:#26244d; --easl-ink:#dddbff;
  --good:#5bcf98; --good-soft:#163a29; --info:#86aef0; --info-soft:#1b2a45; --warn:#e3b54a; --warn-soft:#3a2f12; --bad:#f07a70; --bad-soft:#3e1d1a; --on-bad:#1a0c0a;
  --brk:#a99df3; --brk-soft:#262250; --knob:#eef2f7;
  --t-biz:#9fb3f5; --t-lit:#f0957d; --t-ip:#5fd0c8; --t-ent:#f08cc4; --t-pub:#8fd27a; --t-crim:#e7b062; --t-intl:#6cc6ef; --t-tax:#d4cf6c; --t-prac:#a9b2c2; --t-theory:#d0a982;
  --shadow:0 5px 14px rgba(0,0,0,.4);
  --k0:#1c3550;--k0i:#cfe6fb; --k1:#173a29;--k1i:#c8f0dc; --k2:#3d2914;--k2i:#fbdcb8; --k3:#30213f;--k3i:#e7d4fb; --k4:#3d1c24;--k4i:#fbd0d9; --k5:#163737;--k5i:#c9f1f1; --k6:#36321a;--k6i:#f2eab6; --k7:#232847;--k7i:#d6dafb;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#11151b; --panel:#1a2029; --ink:#c8d0db; --ink-strong:#eef2f7; --muted:#8c96a5; --faint:#8f9aab; --line:#2a323e; --pill:#3a4452;
  --brand:#8db4ea; --brand-soft:#1d2c42; --brand-ink:#cfe0f8; --on-brand:#0f1622;
  --easl:#a7a2f5; --easl-soft:#26244d; --easl-ink:#dddbff;
  --good:#5bcf98; --good-soft:#163a29; --info:#86aef0; --info-soft:#1b2a45; --warn:#e3b54a; --warn-soft:#3a2f12; --bad:#f07a70; --bad-soft:#3e1d1a; --on-bad:#1a0c0a;
  --brk:#a99df3; --brk-soft:#262250; --knob:#eef2f7;
  --t-biz:#9fb3f5; --t-lit:#f0957d; --t-ip:#5fd0c8; --t-ent:#f08cc4; --t-pub:#8fd27a; --t-crim:#e7b062; --t-intl:#6cc6ef; --t-tax:#d4cf6c; --t-prac:#a9b2c2; --t-theory:#d0a982;
  --shadow:0 5px 14px rgba(0,0,0,.4);
  --k0:#1c3550;--k0i:#cfe6fb; --k1:#173a29;--k1i:#c8f0dc; --k2:#3d2914;--k2i:#fbdcb8; --k3:#30213f;--k3i:#e7d4fb; --k4:#3d1c24;--k4i:#fbd0d9; --k5:#163737;--k5i:#c9f1f1; --k6:#36321a;--k6i:#f2eab6; --k7:#232847;--k7i:#d6dafb;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--panel)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--info)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
.gut-x{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);box-shadow:0 1px 0 var(--line),0 2px 8px rgba(20,30,50,.04);padding-block:10px}
.barrow{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;max-width:1560px;margin:0 auto}
.logo{display:flex;flex-direction:column;color:var(--ink-strong);white-space:nowrap}
.logo b{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.005em;line-height:1.1}
.logo small{font-size:11px;color:var(--muted);letter-spacing:.04em}
.search{flex:1 1 220px;max-width:360px;position:relative}
.search input{width:100%;border:1.5px solid var(--pill);border-radius:999px;padding:6px 12px 6px 32px;background:var(--ground);font-size:13px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--faint)}
.seg{display:inline-flex;border:1.5px solid var(--pill);border-radius:999px;padding:2px;gap:2px}
.seg button{padding:3px 11px;border-radius:999px;font-size:12px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.seg button[data-s="easl"][aria-pressed="true"]{background:var(--easl);color:var(--on-brand)}
.filters{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.flabel{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:13px;margin-right:2px}
.pillwrap{position:relative}
.fpill{border:1.5px solid var(--pill);border-radius:30px;padding:3px 12px;font-size:12px;font-weight:700;color:var(--muted);background:var(--panel);white-space:nowrap}
.fpill.on{border-color:var(--brand);color:var(--brand-ink);background:var(--brand-soft)}
.fpill.fbrk.on{border-color:var(--brk);color:var(--brk);background:var(--brk-soft)}
.clear{font-size:12px;color:var(--muted);padding:3px 6px}
.pop{position:absolute;top:calc(100% + 8px);left:0;z-index:30;background:var(--panel);border-radius:6px;box-shadow:0 8px 24px rgba(20,30,50,.18);padding:12px;min-width:200px;max-width:calc(100vw - 32px);display:flex;flex-direction:column;gap:6px}
.pop label{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.pop h4{margin:0 0 2px;font-size:12px;color:var(--muted);font-weight:700}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days button{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--pill);font-size:11px;font-weight:700;color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.notice{max-width:1560px;margin:12px auto 0;background:var(--warn-soft);color:var(--ink-strong);border-radius:6px;padding:8px 12px;font-size:12.5px;display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center}
.notice b{color:var(--warn)}
.main{max-width:1560px;margin:0 auto;padding-block:16px 10px;display:grid;grid-template-columns:minmax(0,350px) minmax(0,300px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:1180px){.main{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.sched{grid-column:1/-1}}
.phead{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px;flex-wrap:wrap;margin-bottom:8px}
.phead h3{margin:0;font-size:16px;font-weight:700;color:var(--ink-strong)}
.tabs{display:flex;gap:16px}
.tabs button{font-size:16px;font-weight:700;color:var(--faint)}
.tabs button[aria-selected="true"]{color:var(--ink-strong)}
.panel{background:var(--panel);border-radius:4px;box-shadow:var(--shadow);min-height:520px;min-width:0}
.scroll{max-height:calc(100vh - 190px);overflow:auto}
.sortsel{border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:600}
.rhead{display:grid;grid-template-columns:minmax(0,1fr) 38px 46px;gap:6px;padding:16px 18px 6px 30px;font-size:12px;font-weight:700;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) 38px 46px;gap:6px;align-items:center;padding:10px 18px 10px 30px;cursor:pointer;position:relative;border-top:1px solid var(--line)}
.rrow.last{background:var(--brand-soft)}
.rrow.tc{box-shadow:inset 5px 0 0 var(--tc)}
.rrow.tc::before{background:var(--tc)}
.ghead{--tc:var(--brand);display:flex;align-items:center;gap:8px;padding:14px 18px 6px 18px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--tc);border-top:1px solid var(--line)}
.ghead i{width:10px;height:10px;border-radius:3px;background:var(--tc)}
.ghead span{margin-left:auto;font-weight:600;letter-spacing:0;text-transform:none;color:var(--muted)}
.mini.tp{color:var(--tc);background:var(--panel);box-shadow:inset 0 0 0 1.5px var(--tc)}
.tp-biz{--tc:var(--t-biz)}.tp-lit{--tc:var(--t-lit)}.tp-ip{--tc:var(--t-ip)}.tp-ent{--tc:var(--t-ent)}.tp-pub{--tc:var(--t-pub)}.tp-crim{--tc:var(--t-crim)}.tp-intl{--tc:var(--t-intl)}.tp-tax{--tc:var(--t-tax)}.tp-prac{--tc:var(--t-prac)}.tp-theory{--tc:var(--t-theory)}
.rrow:hover{background:var(--ground)}
.rrow::before{content:"";position:absolute;left:14px;top:50%;width:7px;height:7px;border-radius:50%;transform:translateY(-50%);background:var(--brand)}
.rrow.e::before{background:var(--easl)}
.compact .rtag,.compact .rname{display:none}.compact .rrow{padding-top:6px;padding-bottom:6px}
.btn[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}
.rcode{font-weight:700;font-size:15px;color:var(--ink-strong);letter-spacing:.01em}
.rname{font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-grid;place-items:center;min-width:34px;height:22px;border-radius:999px;font-size:11.5px;font-weight:700;padding:0 6px}
.b-g{background:var(--good-soft);color:var(--good)} .b-i{background:var(--info-soft);color:var(--info)} .b-w{background:var(--warn-soft);color:var(--warn)} .b-r{background:var(--bad-soft);color:var(--bad)} .b-n{background:var(--ground);color:var(--muted)}
.rtag{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.mini{font-size:10px;font-weight:700;border-radius:3px;padding:0 5px;line-height:16px;background:var(--ground);color:var(--muted);white-space:nowrap}
.mini.plan{background:var(--brand);color:var(--on-brand)} .mini.easl{background:var(--easl-soft);color:var(--easl-ink)} .mini.perm{background:var(--warn-soft);color:var(--warn)} .mini.rq{background:var(--brand-soft);color:var(--brand-ink)}
.count{padding:4px 18px 14px 30px;font-size:12px;color:var(--faint)}
.empty{padding:60px 24px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink-strong);margin-bottom:6px}
.empty svg{width:120px;height:90px;margin:0 auto 14px;display:block;color:var(--faint)}
.det{padding:16px 18px 18px}
.back{display:inline-flex;gap:6px;align-items:center;font-size:15px;color:var(--ink);margin-bottom:10px}
.det h2{margin:0;font-size:24px;font-weight:700;color:var(--ink-strong);letter-spacing:.01em}
.det .nm{font-size:16px;color:var(--ink);margin:2px 0 12px;text-wrap:balance}
.drow{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px;flex-wrap:wrap}
.drow .k{color:var(--muted)}
.cl{display:inline-block;font-size:13px;margin:6px 0 2px}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:5px 10px;font-size:12px;margin-top:10px}
.kv dt{color:var(--muted)} .kv dd{margin:0;white-space:pre-line;overflow-wrap:anywhere}
.secs{border-top:1px solid var(--line);margin-top:14px}
.sec{display:grid;grid-template-columns:minmax(0,1fr) auto 28px;gap:4px 10px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
.sec .s1{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sec .num{font-size:16px;font-weight:700;color:var(--ink-strong)}
.sec .typ{font-size:11px;color:var(--muted)}
.sec .pr{font-weight:700;color:var(--ink-strong);font-size:13px}
.sec .s2{grid-column:1;font-size:11px;color:var(--muted)}
.plus{width:28px;height:28px;border-radius:50%;font-size:20px;line-height:1;color:var(--faint);display:grid;place-items:center}
.plus:hover{background:var(--ground);color:var(--brand)}
.plus.in{color:var(--brand)}
.citem{display:grid;grid-template-columns:18px 6px minmax(0,1fr) 22px;gap:10px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.citem:hover{background:var(--ground)}
.citem input{width:16px;height:16px;accent-color:var(--brand)}
.sw{width:6px;height:34px;border-radius:3px}
.citem b{display:block;font-size:13px;color:var(--ink-strong)}
.citem span{font-size:11px;color:var(--muted)}
.x{color:var(--faint);font-size:16px}
.x:hover{color:var(--bad)}
.dg{padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.dg h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}
.meter{height:7px;border-radius:999px;background:var(--ground);overflow:hidden;margin:4px 0 6px}
.meter i{display:block;height:100%;background:var(--brand)}
.req{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:3px 0;border-bottom:1px dashed var(--line)}
.req:last-child{border-bottom:0}
.ok{color:var(--good);font-weight:700} .wn{color:var(--warn);font-weight:700} .no{color:var(--bad);font-weight:700}
.bk{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.sel{border:1.5px solid var(--pill);border-radius:6px;background:var(--panel);padding:3px 6px;font-size:12px}
.small{font-size:12px;color:var(--muted)}
.btn{border:1.5px solid var(--pill);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;color:var(--muted);background:var(--panel)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn:hover{border-color:var(--brand)}
.shead{display:flex;align-items:center;gap:8px}
.shead select{border:0;background:transparent;font-size:16px;font-weight:700;color:var(--ink-strong);padding-right:4px;max-width:100%}
.sact{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.calwrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:48px repeat(6,minmax(84px,1fr));min-width:600px;padding:6px 8px 10px 0}
.dh{text-align:center;padding:8px 0 6px;font-size:12px;font-weight:700;color:var(--muted)}
.dh span{display:block;font-size:20px;font-weight:400;color:var(--ink-strong);font-variant-numeric:tabular-nums}
.gut{position:relative}
.gut span{position:absolute;right:6px;transform:translateY(-6px);font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
.col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line) 0,var(--line) 1px,transparent 1px,transparent var(--hour))}
.brk{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,var(--brk-soft) 0 6px,transparent 6px 12px);border-top:1.5px dashed var(--brk);border-bottom:1.5px dashed var(--brk)}
.brk span{position:absolute;right:4px;top:2px;font-size:10px;font-weight:700;color:var(--brk)}
.ev{position:absolute;border-radius:4px;padding:3px 6px;overflow:hidden;font-size:10.5px;line-height:1.25;cursor:pointer;box-shadow:0 1px 2px rgba(20,30,50,.08)}
.ev b{display:block;font-size:11.5px;font-weight:700}
.ev.x{box-shadow:0 0 0 2px var(--bad)}
.ev.x::after{content:"!";position:absolute;right:4px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--bad);color:var(--on-bad);font-size:10px;font-weight:800;display:grid;place-items:center}
.ev.ghost{opacity:.75;outline:1.5px dashed currentColor;outline-offset:-2px}
.k0{background:var(--k0);color:var(--k0i)}.k1{background:var(--k1);color:var(--k1i)}.k2{background:var(--k2);color:var(--k2i)}.k3{background:var(--k3);color:var(--k3i)}.k4{background:var(--k4);color:var(--k4i)}.k5{background:var(--k5);color:var(--k5i)}.k6{background:var(--k6);color:var(--k6i)}.k7{background:var(--k7);color:var(--k7i)}
.below{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;padding:12px 16px 16px;border-top:1px solid var(--line)}
.below h5{margin:0 0 5px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.below ul{margin:0;padding:0;list-style:none;font-size:12px;display:flex;flex-direction:column;gap:3px}
.foot{max-width:1560px;margin:0 auto;text-align:center;color:var(--muted);font-size:12px;padding-block:12px 28px;display:flex;flex-direction:column;gap:4px}
.sum{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);padding:10px 16px;border-bottom:1px solid var(--line)}
.sum b{font-size:15px;color:var(--ink-strong);font-variant-numeric:tabular-nums;margin-right:3px}
.ev .enm{display:block}
.fwrap{display:contents}
.mOnly,.tabbar,.scrim{display:none}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink-strong);color:var(--panel);border-radius:10px;padding:10px 12px 10px 14px;font-size:13px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(20,30,50,.25);max-width:calc(100vw - 32px)}
.toast[hidden]{display:none!important}
.toast button{color:var(--panel);font-weight:700;text-decoration:underline;white-space:nowrap}
.toast .tno{font-weight:800;text-decoration:underline wavy}
.agenda{padding:10px 12px 14px;display:flex;flex-direction:column;gap:10px}
.dchips{display:grid;grid-template-columns:repeat(var(--nd,5),minmax(0,1fr));gap:6px}
.dchips button{border:1.5px solid var(--pill);border-radius:10px;padding:6px 0;font-size:11px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
.dchips button span{font-size:17px;font-weight:500;color:var(--ink-strong);font-variant-numeric:tabular-nums}
.dchips button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink)}
.dchips button i{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--brand)}
.dchips button i.x{background:var(--bad)}
.aitem{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:start;padding:10px;border-radius:8px;cursor:pointer}
.aitem .t{font-size:12px;font-weight:700;color:var(--ink-strong);font-variant-numeric:tabular-nums;line-height:1.3}
.aitem .t small{display:block;font-weight:500;color:var(--muted)}
.aitem b{display:block;font-size:14px}
.aitem span{font-size:12px}
.aitem.x{box-shadow:0 0 0 2px var(--bad)}

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
if(!window.MCP_DATA){document.querySelector('.main').innerHTML='<div class="panel" style="grid-column:1/-1;padding:40px;text-align:center"><b>Course data did not load.</b><br>Reload the page. If it keeps happening, the data file is missing from this folder.</div>';return}
const DATA=window.MCP_DATA, TERM=DATA.term, COURSES=DATA.courses, SRC=DATA.sources;
$('#termlab').textContent=TERM.label.toUpperCase();
const byId={};COURSES.forEach(c=>byId[c.id]=c);
const key=c=>c.code+' '+c.sec;
const cuNum=c=>{const m=String(c.cu).match(/\d+/);return m?+m[0]:0};
const fmtCode=c=>c.code.replace(/^([A-Z]{3})/,'$1 ');
const nice=n=>/^TBA/i.test(n)?'TBA':n.split(',').reverse().join(' ').trim().replace(/\b\w+/g,w=>w[0]+w.slice(1).toLowerCase());
const last=n=>/^TBA/i.test(n)?'TBA':n.split(',')[0].replace(/\b\w+/g,w=>w[0]+w.slice(1).toLowerCase());
const TOPICS=[['biz','Business & transactional'],['lit','Litigation & courts'],['ip','IP & technology'],['ent','Entertainment, arts & sports'],['pub','Public law & regulation'],['crim','Criminal law'],['intl','International'],['tax','Tax, estates & family'],['prac','Practice, writing & bar'],['theory','Theory & perspectives']];const TOPIC_LABEL=Object.fromEntries(TOPICS);const TORDER=Object.fromEntries(TOPICS.map(([k],i)=>[k,i]));
const EASL_LABEL={prereq:'EASL prerequisite',core:'EASL core',elective:'EASL elective',program:'EASL program'};
const perm=c=>/prior permission|with the permission|by permission|permission of|EASL Only|by application|must send an email|placement is confirmed/i.test(c.restr||'');
function evalCode(c){const e=(c.eval||'').toLowerCase();
  if(/mandatory/i.test(c.grading||''))return ['P/F','b-n'];
  if(/take-home|take home/.test(e))return ['TH','b-g'];
  if(/paper|essay|brief/.test(e)&&!/exam/.test(e))return ['PPR','b-i'];
  if(/exam/.test(e)&&/paper|essay/.test(e))return ['X+P','b-i'];
  if(/multiple|multistate/.test(e))return ['MC','b-w'];
  if(/exam/.test(e))return ['EX','b-w'];
  if(/assignment|drafting|participation/.test(e))return ['ASG','b-g'];
  return ['—','b-n']}
const EVAL_LABEL={TH:'Take-home exam',PPR:'Paper',['X+P']:'Exam and paper',MC:'Multiple-choice exam',EX:'Exam',ASG:'Assignments and participation','P/F':'Mandatory pass/fail','—':'Not posted'};
const reqTags=c=>{const t=[];if(/Writing/.test(c.req))t.push('Writing');if(/Skills/.test(c.req))t.push('Skills');if(/Professional Resp/.test(c.req))t.push('Prof Resp');if(/Bar Course/.test(c.attr))t.push('Bar');return t};

const GROUPS={};COURSES.forEach(c=>{(GROUPS[c.code]=GROUPS[c.code]||{key:c.code,code:c.code,name:c.name,secs:[]}).secs.push(c)});
const GLIST=Object.values(GROUPS);
const easlOf=g=>{const b=g.secs.map(s=>s.easl).filter(Boolean);return b.includes('core')?'core':b.includes('prereq')?'prereq':b.includes('elective')?'elective':b[0]||''};

const D=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
const iso=d=>d.toISOString().slice(0,10);const add=(d,n)=>new Date(d.getTime()+n*864e5);
const DC=['U','M','T','W','R','F','S'];const DAYS=['M','T','W','R','F','S'];const DN={M:'Mon',T:'Tue',W:'Wed',R:'Thu',F:'Fri',S:'Sat'};
const SEM0=TERM.classes_start,SEM1=TERM.classes_end,R0=TERM.view_start,R1=TERM.view_end;
const WEEKS=[];for(let d=D(R0);d<=D(R1);d=add(d,7))WEEKS.push(iso(d));
const fT=m=>{let h=Math.floor(m/60),mm=m%60,a=h>=12?'p':'a';h=h%12||12;return h+(mm?':'+String(mm).padStart(2,'0'):'')+a};
const fTL=m=>{let h=Math.floor(m/60),mm=m%60,a=h>=12?'PM':'AM';h=h%12||12;return h+':'+String(mm).padStart(2,'0')+' '+a};
const fD=s=>{const d=D(s);return (d.getUTCMonth()+1)+'/'+d.getUTCDate()};
const dayS=s=>s.replace('R','Th').replace('S','Sa');
function timeStr(c){
  if(!c.sess.length)return /asynch/i.test(c.delivery)?'Online async':'Time TBA';
  const long=c.sess.filter(s=>(D(s.end)-D(s.start))/864e5>20);
  if(long.length)return long.map(s=>dayS(s.days)+' '+fT(s.from)+'–'+fT(s.to)+((D(s.end)-D(s.start))/864e5<80?' ('+fD(s.start)+'–'+fD(s.end)+')':'')).join(', ');
  const a=c.sess.map(s=>s.start).sort()[0],b=c.sess.map(s=>s.end).sort().slice(-1)[0];return 'Intensive '+fD(a)+'–'+fD(b)}
function occ(s,a,b){const o=[];const x=D(s.start>a?s.start:a),y=D(s.end<b?s.end:b);for(let d=x;d<=y;d=add(d,1))if(s.days.includes(DC[d.getUTCDay()]))o.push({date:iso(d),from:s.from,to:s.to});return o}
const cOcc=(c,a,b)=>{let o=[];c.sess.forEach(s=>occ(s,a,b).forEach(x=>o.push(Object.assign(x,{id:c.id}))));return o};
const ov=(a,b)=>a.date===b.date&&a.from<b.to&&b.from<a.to;

const STORE='mlcp-public-v1';
const F0=()=>({fit:false,brk:false,req:[],cu:[],del:[],days:[],easl:[],topic:[],tmin:0,tmax:0});
let S={group:'none',pane:'courses',wview:'grid',mday:0,view:'all',q:'',sort:'code',f:F0(),open:null,mid:'cart',cart:[],scheds:[{name:'Schedule 1',ids:[]}],active:0,week:TERM.default_week,breaks:[],term:TERM.label};
let dropped=0;
try{const s=JSON.parse(localStorage.getItem(STORE));if(s&&s.scheds&&s.term===TERM.label){S=Object.assign(S,s);S.f=Object.assign(F0(),s.f||{});
  const keep=i=>{if(byId[i])return true;dropped++;return false};S.cart=S.cart.filter(keep);S.scheds.forEach(x=>x.ids=x.ids.filter(i=>byId[i]));if(!S.scheds.length)S.scheds=[{name:'Schedule 1',ids:[]}];if(S.active>=S.scheds.length)S.active=0}}catch(e){}
S.pane='courses';
const mq=window.matchMedia('(max-width:720px)');const phone=()=>mq.matches;try{mq.addEventListener('change',()=>all())}catch(e){}
const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}};
const ids=()=>S.scheds[S.active].ids;
const colorOf=id=>{const i=S.cart.indexOf(id);return 'k'+((i<0?0:i)%8)};

function breakOcc(a,b){const o=[];S.breaks.forEach(k=>occ({start:SEM0,end:SEM1,days:k.days.join(''),from:k.from,to:k.to},a,b).forEach(x=>o.push(Object.assign(x,{label:k.label||'Break'}))));return o}
function fits(c,set){const m=cOcc(c,R0,R1);if(!m.length)return true;const o=[];set.forEach(i=>{if(i!==c.id)cOcc(byId[i],R0,R1).forEach(x=>o.push(x))});return !m.some(a=>o.some(b=>ov(a,b)))}
function clearOfBreaks(c){const m=cOcc(c,R0,R1);if(!m.length)return true;const b=breakOcc(R0,R1);return !m.some(a=>b.some(x=>ov(a,x)))}
function conflicts(set){const it=[];set.forEach(i=>cOcc(byId[i],R0,R1).forEach(o=>it.push(Object.assign(o,{label:fmtCode(byId[i])}))));const P={};
  for(let i=0;i<it.length;i++)for(let j=i+1;j<it.length;j++){const a=it[i],b=it[j];if(a.id===b.id)continue;if(ov(a,b)){const k=[a.label,b.label].sort().join(' × ');(P[k]=P[k]||[]).push(a.date)}}
  const B={};const br=breakOcc(R0,R1);it.forEach(a=>br.forEach(b=>{if(ov(a,b)){const k=a.label+' in '+b.label;(B[k]=B[k]||[]).push(a.date)}}));return {P,B}}

function renderSeg(){const el=$('#seg');el.innerHTML='';[['all','All courses'],['easl','EASL']].forEach(([k,l])=>{const b=document.createElement('button');b.type='button';b.dataset.s=k;b.textContent=l;b.setAttribute('aria-pressed',S.view===k);b.onclick=()=>{S.view=k;S.open=null;all()};el.appendChild(b)})}
const FDEF=[
 {k:'req',l:'Requirement',opts:[['Writing','Upper-level writing'],['Skills','Skills'],['Prof Resp','Professional Responsibility'],['Bar','Bar exam subject']]},
 {k:'cu',l:'Credits',opts:[['1','1'],['2','2'],['3','3'],['4','4+']]},
 {k:'days',l:'Day/Time',days:true},
 {k:'del',l:'Delivery',opts:[['Residential','In person'],['Online (all synchronous)','Online live'],['Online (all asynchronous)','Online async']]},
 {k:'topic',l:'Topic',opts:TOPICS},
 {k:'easl',l:'EASL',opts:[['prereq','Prerequisite'],['core','Entertainment core'],['elective','Bulletin elective'],['program','Other EASL program course']]},
 {k:'fit',l:'Fits my schedule',toggle:true},{k:'brk',l:'Clear of my breaks',toggle:true,brk:true}];
let openPop=null;
function renderFilters(){const el=$('#filters');el.innerHTML='<span class="flabel"><svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M1 2h14l-5.5 6.5V14l-3-1.5V8.5z"/></svg>Filter</span>';
  FDEF.forEach(f=>{const w=document.createElement('div');w.className='pillwrap';const on=f.toggle?!!S.f[f.k]:(S.f[f.k].length>0||(f.days&&(S.f.tmin||S.f.tmax)));
    const b=document.createElement('button');b.type='button';b.className='fpill'+(on?' on':'')+(f.brk?' fbrk':'');b.textContent=f.l+(!f.toggle&&S.f[f.k].length?' · '+S.f[f.k].length:'');b.setAttribute('aria-expanded',openPop===f.k);
    b.onclick=e=>{e.stopPropagation();if(f.toggle){S.f[f.k]=!S.f[f.k];all();return}openPop=openPop===f.k?null:f.k;renderFilters()};w.appendChild(b);
    if(openPop===f.k){const p=document.createElement('div');p.className='pop';p.onclick=e=>e.stopPropagation();
      if(f.days){p.innerHTML='<h4>Meets only on</h4>';const d=document.createElement('div');d.className='days';DAYS.forEach(x=>{const bb=document.createElement('button');bb.type='button';bb.textContent=x;bb.setAttribute('aria-pressed',S.f.days.includes(x));bb.onclick=()=>{const i=S.f.days.indexOf(x);i<0?S.f.days.push(x):S.f.days.splice(i,1);all()};d.appendChild(bb)});p.appendChild(d);
        const h4=document.createElement('h4');h4.style.marginTop='8px';h4.textContent='Between';p.appendChild(h4);
        const tr=document.createElement('div');tr.style.cssText='display:flex;gap:6px;align-items:center;flex-wrap:wrap';const mk=(k,lab)=>{const s=document.createElement('select');s.className='sel';s.id='f-'+k;s.setAttribute('aria-label',lab);s.innerHTML='<option value="0">'+lab+'</option>'+Array.from({length:31},(_,i)=>420+i*30).map(m=>`<option value="${m}" ${S.f[k]===m?'selected':''}>${fTL(m)}</option>`).join('');s.onchange=()=>{S.f[k]=+s.value;all()};return s};tr.appendChild(mk('tmin','Starts after'));tr.append('–');tr.appendChild(mk('tmax','Ends by'));p.appendChild(tr);
        const h=document.createElement('div');h.className='small';h.textContent='Courses that meet outside these days or hours are hidden.';p.appendChild(h)}
      else f.opts.forEach(([v,l])=>{const lb=document.createElement('label');const cb=document.createElement('input');cb.type='checkbox';cb.id='f-'+f.k+'-'+v.replace(/\W+/g,'');cb.checked=S.f[f.k].includes(v);cb.onchange=()=>{const i=S.f[f.k].indexOf(v);i<0?S.f[f.k].push(v):S.f[f.k].splice(i,1);all()};lb.appendChild(cb);lb.append(l);p.appendChild(lb)});
      w.appendChild(p)}
    el.appendChild(w)});
  const c=document.createElement('button');c.type='button';c.className='clear';c.textContent='Clear all';c.onclick=()=>{S.f=F0();S.q='';$('#q').value='';all()};el.appendChild(c)}
document.addEventListener('click',()=>{if(openPop){openPop=null;renderFilters()}});

function secPass(c){const f=S.f;
  if(f.req.length&&!f.req.some(r=>reqTags(c).includes(r)))return false;
  if(f.cu.length&&!f.cu.some(v=>v==='4'?cuNum(c)>=4:cuNum(c)===+v))return false;
  if(f.del.length&&!f.del.includes(c.delivery))return false;
  if(f.days.length&&(!c.sess.length||c.sess.some(s=>[...s.days].some(d=>!f.days.includes(d)))))return false;
  if((f.tmin||f.tmax)&&(!c.sess.length||c.sess.some(s=>(f.tmin&&s.from<f.tmin)||(f.tmax&&s.to>f.tmax))))return false;
  if(f.easl.length&&!f.easl.includes(c.easl))return false;
  if(f.topic.length&&!f.topic.includes(c.topic))return false;
  if(f.fit&&!ids().includes(c.id)&&!fits(c,ids()))return false;
  if(f.brk&&!clearOfBreaks(c))return false;
  return true}
function results(){const q=S.q.trim().toLowerCase();
  let r=GLIST.filter(g=>{if(S.view==='easl'&&!easlOf(g))return false;
    if(!g.secs.some(secPass))return false;
    if(q){const hay=(g.code+' '+fmtCode(g.secs[0])+' '+g.name+' '+g.secs.map(s=>s.profs.join(' ')).join(' ')).toLowerCase();if(!q.split(/\s+/).every(w=>hay.includes(w)))return false}
    return true});
  const st=g=>Math.min(...g.secs.map(s=>s.sess.length?Math.min(...s.sess.map(x=>x.from)):9999));
  const s=S.sort;const tk=g=>S.group==='topic'?TORDER[g.secs[0].topic]:S.group==='cu'?Math.min(4,cuNum(g.secs[0])):0;r.sort((a,b)=>tk(a)-tk(b)||(s==='name'?a.name.localeCompare(b.name):s==='cu'?cuNum(b.secs[0])-cuNum(a.secs[0])||a.code.localeCompare(b.code):s==='time'?st(a)-st(b):a.code.localeCompare(b.code)));
  return r}

function renderResults(){const el=$('#results');

  $('#cal').innerHTML=h;$('#cal').querySelectorAll('.ev').forEach(n=>n.onclick=()=>{ret=null;S.open=n.dataset.g;if(phone())S.pane='courses';all();if(phone())window.scrollTo(0,0)});
  renderBelow()}
function renderBelow(){
  const cs=ids().map(i=>byId[i]);const tba=cs.filter(c=>!c.sess.length);const sh=cs.filter(c=>c.sess.length&&!c.sess.some(s=>(D(s.end)-D(s.start))/864e5>20));const {P,B}=conflicts(ids());
  $('#below').innerHTML=`<div><h5>No fixed time</h5><ul>${tba.map(c=>`<li>${fmtCode(c)} · ${esc(timeStr(c))}</li>`).join('')||'<li>Every pick has a posted time.</li>'}</ul></div><div><h5>Intensives</h5><ul>${sh.map(c=>`<li>${fmtCode(c)} · ${esc(timeStr(c))}</li>`).join('')||'<li>None on this schedule.</li>'}</ul></div><div><h5>Term-wide clashes</h5><ul>${Object.entries(P).map(([k,v])=>`<li class="no">${esc(k)} · ${v.length>3?v.length+' dates from '+fD(v[0]):v.map(fD).join(', ')}</li>`).join('')}${Object.entries(B).map(([k,v])=>`<li class="wn">${esc(k)} · ${v.length} dates</li>`).join('')||(Object.keys(P).length?'':'<li class="ok">None across the term.</li>')}</ul></div>`}
$('#copy').onclick=()=>{const t=S.scheds[S.active].name+'\n'+ids().map(i=>{const c=byId[i];return fmtCode(c)+'-'+c.sec+'  '+c.name+'  '+c.cu+' cr  '+c.profs.map(last).join('; ')+'  '+timeStr(c)}).join('\n');const b=$('#copy');try{navigator.clipboard.writeText(t).then(()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy list',1400)},()=>{b.textContent='Copy blocked'})}catch(e){b.textContent='Copy blocked'}};
$('#sort').onchange=e=>{S.sort=e.target.value;all()};
$('#dens').onclick=()=>{S.compact=!S.compact;all()};
$('#grp').onchange=e=>{S.group=e.target.value;all()};
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}if(e.key==='Escape'&&S.open)closeDetail()});
$('#ics').onclick=()=>{const pad=x=>String(x).padStart(2,'0');const dt=(d,m)=>d.replace(/-/g,'')+'T'+pad(Math.floor(m/60))+pad(m%60)+'00';const BY={M:'MO',T:'TU',W:'WE',R:'TH',F:'FR',S:'SA',U:'SU'};
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Miami Law Course Planner (unofficial)//EN','CALSCALE:GREGORIAN'];let k=0;
  ids().forEach(i=>{const c=byId[i];c.sess.forEach(s=>{const first=occ(s,s.start,s.end)[0];if(!first)return;const multi=s.start!==s.end;
    L.push('BEGIN:VEVENT','UID:mlcp-'+c.id+'-'+(k++)+'@mattyellin.com','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z','SUMMARY:'+fmtCode(c)+' '+c.name.replace(/[,;]/g,' '),
      'DTSTART;TZID=America/New_York:'+dt(first.date,s.from),'DTEND;TZID=America/New_York:'+dt(first.date,s.to));
    if(multi)L.push('RRULE:FREQ=WEEKLY;BYDAY='+[...s.days].map(d=>BY[d]).join(',')+';UNTIL='+s.end.replace(/-/g,'')+'T235959');
    L.push('DESCRIPTION:'+(c.profs.map(last).join(' / ')||'')+' '+(c.cu||'')+' cr','END:VEVENT')})});
  L.push('END:VCALENDAR');const b=$('#ics');try{const blob=new Blob([L.join('\r\n')],{type:'text/calendar'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=S.scheds[S.active].name.replace(/[^\w ]+/g,'')+'.ics';document.body.appendChild(a);a.click();a.remove();b.textContent='Downloaded'}catch(e){b.textContent='Export blocked here'}setTimeout(()=>b.textContent='Export .ics',1600)};
let qt;$('#q').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{S.q=e.target.value;S.open=null;renderResults();save()},120)};

function renderSources(){const d=new Date(DATA.generated);const f=(d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear();
  $('#sources').innerHTML=`<div>${esc(TERM.label)} course data from <a href="${esc(SRC.courselink)}" target="_blank" rel="noopener">CourseLink</a>, last updated ${f}. ${COURSES.length} sections. Topic groups are unofficial. EASL tags follow the <a href="${esc(SRC.easl[0])}" target="_blank" rel="noopener">bulletin's EASL LL.M. lists</a>.</div>${dropped?`<div class="wn">${dropped} saved pick(s) are no longer offered and were removed.</div>`:''}<div>Your schedules stay in this browser. Nothing is sent anywhere.</div><div>Unofficial tool built by Matt Yellin · <a href="https://www.linkedin.com/in/mattyellin/" target="_blank" rel="noopener">LinkedIn</a></div>`}
const ICON={courses:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M4 12h16M4 19h10"/></svg>',plan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h3l2.5 11h10L21 8H7"/><circle cx="9.5" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>',week:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>'};
function renderTabbar(){const n=Object.keys(conflicts(ids()).P).length;const el=$('#tabbar');
  el.innerHTML=[['courses','Courses',''],['plan','Cart',S.cart.length?`<span class="bd">${S.cart.length}</span>`:''],['week','Week',n?`<span class="bd x">${n}</span>`:'']].map(([k,l,b])=>`<button type="button" data-p="${k}" ${S.pane===k?'aria-current="page"':''}>${ICON[k]}${l}${b}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.pane=b.dataset.p;if(S.pane!=='courses')S.open=S.open;all();window.scrollTo(0,0)})}
function activeFilters(){const f=S.f;return f.req.length+f.cu.length+f.del.length+f.easl.length+f.topic.length+(f.days.length||f.tmin||f.tmax?1:0)+(f.fit?1:0)+(f.brk?1:0)+(S.view==='easl'?1:0)}
function renderFbtn(){const n=activeFilters();const b=$('#fbtn');b.textContent='Filters'+(n?' · '+n:'');b.classList.toggle('on',!!n)}
$('#fbtn').onclick=e=>{e.stopPropagation();document.body.classList.add('fopen')};
$('#fdone').onclick=()=>{document.body.classList.remove('fopen');S.pane='courses';all()};
$('#scrim').onclick=()=>document.body.classList.remove('fopen');
function renderVtog(){const el=$('#vtog');el.innerHTML=[['grid','Grid'],['day','Day']].map(([k,l])=>`<button type="button" data-v="${k}" aria-pressed="${S.wview===k}">${l}</button>`).join('');el.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.wview=b.dataset.v;all()})}
function all(){document.body.dataset.pane=S.pane;renderTabbar();renderFbtn();renderVtog();renderSeg();renderFilters();$('#sort').value=S.sort;if($('#q').value!==S.q)$('#q').value=S.q;$('#results').classList.toggle('compact',!!S.compact);$('#dens').setAttribute('aria-pressed',!!S.compact);$('#grp').value=S.group||'none';renderResults();renderMidTabs();renderMid();renderSchedHead();renderSum();renderCal();renderSources();save()}
all();
})();
</script>
