<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Not found · Matt Yellin</title>
<meta name="theme-color" content="#0a0b0e">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#0a0b0e;--ink:#efede7;--mut:#9a9ea7;--line:rgba(255,255,255,.14);--acc:#ff6a4d}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Instrument Sans",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:48px 16px;text-align:center}
.mk{font:400 28px/1 Georgia,serif;letter-spacing:-.02em;color:var(--ink);text-decoration:none}.mk i{font-style:normal;color:var(--acc)}
.code{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
h1{font-size:clamp(28px,4vw,44px);font-weight:600;letter-spacing:-.045em;line-height:1.05;max-width:18ch;text-wrap:balance}
p{color:var(--mut);max-width:44ch;text-wrap:pretty}
.path{font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mut);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:6px;padding:4px 10px;max-width:100%;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
a.b{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:500;font-size:14px}
a.b.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
a.b:hover{opacity:.88}
a:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
nav{margin-top:18px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:center;font-size:14px}
nav a{color:var(--mut);text-decoration:none;padding:6px 0}nav a:hover{color:var(--ink)}
</style>
</head>
<body>
<main>
<a class="mk" href="/" aria-label="Matt Yellin, home">M<i>Y</i></a>
<span class="code" id="code">Error 404</span>
<h1 id="h">That page isn’t here</h1>
<p id="p">The link may be mistyped, or the page moved when the site was rebuilt.</p>
<code class="path" id="path" hidden></code>
<div class="acts" id="acts"><a class="b" href="/">Go to the home page</a></div>
<nav aria-label="Site">
<a href="/#work">Work</a><a href="/news/">The Morning Brief</a><a href="/well-versed/">Well-Versed</a><a href="/greatest-bits/">Greatest Bits</a><a href="/#about">About</a>
</nav>
</main>
<script>
(function(){
  try{
    var path=decodeURIComponent(location.pathname), $=function(i){return document.getElementById(i)};
    var pe=$('path'); pe.textContent=path; pe.hidden=false;
    function set(h,p,acts,code){ $('h').textContent=h; $('p').textContent=p; if(code)$('code').textContent=code;
      $('acts').innerHTML=acts.map(function(a,i){return '<a class="b'+(i?' g':'')+'" href="'+a[1]+'">'+a[0]+'</a>'}).join('');
      document.title=h+' · Matt Yellin'; }
    var m=path.match(/^\/news\/(\d{4})-(\d{2})-(\d{2})(\.html)?\/?$/);
    if(m){
      var d=new Date(+m[1],+m[2]-1,+m[3]), now=new Date(), days=Math.floor((now-d)/864e5);
      var nice=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
      if(days>7) set('That edition has rolled off','The Morning Brief keeps its last seven editions online, and the '+nice+' edition is older than that. Today’s Brief is one click away.',[['Read today’s Brief','/news/'],['Home','/']],'Edition expired');
      else if(days<0) set('That edition isn’t out yet','The Brief for '+nice+' hasn’t been published. It comes out every morning.',[['Read today’s Brief','/news/'],['Home','/']],'Not yet published');
      else set('No Brief that day','There’s no edition at this address for '+nice+'. The latest editions are on the Brief’s front page.',[['See recent editions','/news/'],['Home','/']]);
      return;
    }
    if(/^\/(dealcraft|corp-law|portfolio\/demo)(\/|$)/.test(path)){
      set('That project has been retired','It’s no longer published here. The work that’s live now is on the home page.',[['See the work','/#work'],['Home','/']],'Retired');
      return;
    }
    var sec=[[/^\/news\//,'The Morning Brief','/news/'],[/^\/well-versed\//,'Well-Versed','/well-versed/'],[/^\/greatest-bits\//,'Greatest Bits','/greatest-bits/']];
    for(var i=0;i<sec.length;i++) if(sec[i][0].test(path)){
      set('That page isn’t here','Nothing lives at this address in '+sec[i][1]+'. Its front page has everything that’s published.',[['Go to '+sec[i][1],sec[i][2]],['Home','/']]);
      return;
    }
  }catch(e){}
})();
</script>
</body>
</html>
