  --tabh:64px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
:root[data-theme="paper"]{
  --bg:#F4EFE7; --card:#FFFCF7; --card2:#EAE3D8; --raise:#E0D8CB; --scene:#E9E2D6; --track:#D6CDBE; --scene-ink:#231E1B; --scene-sub:rgba(35,30,27,.6); --rain:#3a3434; --scene-dim:#3A3434; --track-dim:#2A2526;
  --ink:#231E1B; --sub:#675E57; --faint:#746B63; --line:rgba(40,30,20,.09); --line2:rgba(40,30,20,.16);
  --accent:#0C7563; --accent-ink:#F4EFE7; --accent-soft:rgba(12,117,99,.12);
  --light:#231E1B; --light-ink:#FFFCF7; --red:#B3262D; --danger:#B3262D; --glass:rgba(250,246,240,.92); --scrim:rgba(30,20,10,.35);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none}
html{font-size:100%}
@supports (font:-apple-system-body){ html{font:-apple-system-body;font-size:100%} }
body{font:400 1rem/1.38 var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{font:inherit;color:inherit;-webkit-user-select:text;user-select:text;font-size:1.0625rem}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif)}
.sub{color:var(--sub)} .faint{color:var(--faint)}
.caps{font:600 0.7188rem/1.2 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--sub)}
svg{display:block}
.press,button,[data-act],[data-push]{transition:transform .14s var(--out),opacity .14s,background-color .2s}
@media (hover:none){ button:active,[data-act]:active,[data-push]:active{transform:scale(.97);opacity:.85} .noscale:active{transform:none!important} }
@media (hover:hover){ [data-act]:hover,[data-push]:hover{opacity:.88} }

#app{position:fixed;inset:0;overflow:hidden}
.tabview{position:absolute;inset:0;display:none}
.tabview.on{display:block}
.tabview.fadein{animation:tvfade .2s var(--out)}
@keyframes tvfade{from{opacity:.4}to{opacity:1}}
.screen{position:absolute;inset:0;background:var(--bg);overflow:hidden;will-change:transform}
.screen.below{visibility:hidden}
.screen .scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;
  padding:calc(var(--safe-t) + 52px) 0 calc(var(--tabh) + var(--safe-b) + 40px)}
body.hasmini .screen .scroll{padding-bottom:calc(var(--tabh) + var(--safe-b) + 112px)}
.inner{max-width:600px;margin:0 auto;padding:0 16px}
.navbar{position:absolute;z-index:5;top:0;left:0;right:0;height:calc(var(--safe-t) + 52px);padding:var(--safe-t) 12px 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  background:transparent;transition:background-color .2s,box-shadow .2s}
.screen.compact .navbar{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);box-shadow:0 .5px 0 var(--line2)}
.navbar .nt{font:600 1rem/1 var(--sans);opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.screen.compact .navbar .nt{opacity:1;transform:none}
.navbar .nl{justify-self:start;display:flex;gap:8px}
.navbar .nr{justify-self:end;display:flex;gap:8px;align-items:center}
.navbtn{height:38px;min-width:38px;border-radius:19px;display:inline-flex;align-items:center;justify-content:center;gap:4px;background:var(--glass);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:inset 0 0 0 .5px var(--line2);color:var(--ink)}
.navbtn svg{width:20px;height:20px}
.navbtn.back span{display:none}
.navbtn.pill{padding:0 15px;font:600 0.9375rem/1 var(--sans)}
.navbtn.circ{width:38px;padding:0}
.navbtn.plain{background:none;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}

.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:2px 0 16px;min-height:40px}
.phead h1{font:600 1.875rem/1.1 var(--serif);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1,h2{text-wrap:balance}
.phead .date{display:block;margin-bottom:2px}
.phead .tools{display:flex;gap:8px;align-items:center}
.streakbtn{height:38px;display:inline-flex;align-items:center;gap:5px;padding:0 10px;border-radius:12px;color:var(--accent);font:700 1.0625rem/1 var(--sans)}
.streakbtn svg{width:19px;height:19px}
.streakbtn.off{color:var(--sub)}
.sqbtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--line2);color:var(--ink)}
.sqbtn svg{width:20px;height:20px}
.sec{display:flex;align-items:center;gap:6px;font:600 1.25rem/1.2 var(--serif);margin:26px 0 12px;color:var(--ink);width:100%;text-align:left}
h2.sec{margin:26px 0 12px}
.sec .chev{width:7px;height:12px;color:var(--faint)}
.sec small{font:500 0.875rem var(--sans);color:var(--sub);margin-left:auto}

.tabbar{position:fixed;z-index:30;left:0;right:0;bottom:0;padding:0 16px calc(var(--safe-b) + 10px);display:flex;gap:10px;align-items:flex-end;justify-content:space-between;pointer-events:none;
  max-width:600px;margin:0 auto}
.tabbar .pillbar{pointer-events:auto;flex:0 1 270px;height:var(--tabh);border-radius:32px;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(1.7);backdrop-filter:blur(26px) saturate(1.7);
  box-shadow:inset 0 0 0 .5px var(--line2),0 8px 30px rgba(0,0,0,.35);display:grid;grid-template-columns:repeat(3,1fr);padding:5px;position:relative}
.tabbar .pillbar .hl{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/3);border-radius:27px;background:rgba(255,255,255,.1);transition:transform .38s var(--ease)}
:root[data-theme="paper"] .tabbar .pillbar .hl{background:rgba(0,0,0,.07)}
.tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 0.6875rem/1 var(--sans);color:var(--sub);border-radius:27px}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar button i{width:24px;height:24px;display:block}
.tabbar button i svg{width:24px;height:24px}
.tabbar .searchtab{pointer-events:auto;width:var(--tabh);height:var(--tabh);border-radius:50%;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(1.7);backdrop-filter:blur(26px) saturate(1.7);
  box-shadow:inset 0 0 0 .5px var(--line2),0 8px 30px rgba(0,0,0,.35)}
.tabbar .searchtab[aria-current="page"]{background:var(--raise)}
body.playing .tabbar{transform:translateY(130%);transition:transform .35s var(--ease)}
.tabbar{transition:transform .35s var(--ease)}

.mini{position:fixed;z-index:29;left:12px;right:12px;max-width:576px;margin:0 auto;bottom:calc(var(--safe-b) + var(--tabh) + 18px);height:64px;border-radius:20px;background:var(--card);
  box-shadow:inset 0 0 0 .5px var(--line2),0 10px 30px rgba(0,0,0,.4);display:flex;align-items:center;gap:12px;padding:0 10px;transform:translateY(160%);opacity:0;transition:transform .42s var(--ease),opacity .25s}
.mini.on{transform:none;opacity:1}
.mini .cover{width:34px;height:51px;border-radius:3px;flex:none}
.mini .mt{flex:1;min-width:0}
.mini .mt b{display:block;font:600 0.9375rem/1.2 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mt span{font:500 0.8125rem/1.3 var(--sans);color:var(--accent)}
.mini .mt span.paused{color:var(--sub)}
.rbtn{width:42px;height:42px;border-radius:50%;background:var(--card2);display:grid;place-items:center;flex:none;color:var(--ink)}
.rbtn svg{width:16px;height:16px}

.cover{display:block;border-radius:3px;object-fit:cover;background:var(--card2);aspect-ratio:2/3;overflow:hidden;position:relative;
  box-shadow:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.25)}
div.cover{display:flex;align-items:flex-end;padding:10%;color:rgba(255,255,255,.92);font:600 0.6875rem/1.15 var(--serif)}
div.cover span{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.cover.fill{width:100%;height:auto}

.tonight{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:inset 0 0 0 .5px var(--line)}
.tonight .tag{font:700 0.6875rem/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:4px 7px;border-radius:6px;flex:none}
.tonight .tag.done{background:var(--card2);color:var(--accent)}
.tonight b{font:600 0.9375rem/1.2 var(--sans);display:block}
.tonight span{font-size:0.8125rem;color:var(--sub)}
.tonight .chev{margin-left:auto;color:var(--faint)}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 4px;scroll-padding:0 16px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.ccard{flex:0 0 calc(100% - 40px);max-width:420px;scroll-snap-align:start;display:flex;gap:14px;padding:0}
.ccard .cv{flex:0 0 46%;max-width:170px}
.ccard .cv .cover{width:100%;border-radius:4px}
.ccard .info{flex:1;min-width:0;display:flex;flex-direction:column;padding-top:2px}
.ccard .t{font:600 0.9688rem/1.25 var(--sans);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ccard .a{font-size:0.875rem;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard .pct{display:flex;align-items:baseline;justify-content:space-between;margin-top:14px}
.ccard .pct b{font:700 1.0625rem/1 var(--sans)}
.ccard .pct span{font:600 0.75rem/1 var(--sans);color:var(--sub)}
.ccard .pct span small{font-size:0.6875rem;letter-spacing:.06em;margin-left:3px}
.pbar{height:4px;border-radius:2px;background:var(--card2);margin-top:8px;position:relative}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--accent);min-width:4px;transition:width .5s var(--out)}
.pbar i::after{content:"";position:absolute;right:-4px;top:-2px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.obtn{display:flex;align-items:center;gap:9px;height:40px;padding:0 12px;border-radius:11px;box-shadow:inset 0 0 0 1.5px var(--line2);font:600 0.9062rem/1 var(--sans);margin-top:10px;color:var(--ink);width:100%}
.obtn svg{width:18px;height:18px;flex:none}
.obtn.go{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.obtn.live{color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ptile{background:var(--card);border-radius:16px;padding:12px 12px 0;min-height:150px;overflow:hidden;position:relative;box-shadow:inset 0 0 0 .5px var(--line);text-align:left;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;width:100%}
.ptile h2{margin:0;font:600 1.0312rem/1.2 var(--serif);display:flex;align-items:center;gap:5px}
.ptile h2 .chev{width:7px;height:12px;color:var(--faint)}
.ptile .fan{position:relative;height:104px;margin-top:12px}
.ptile .fan .cover{position:absolute;width:62px;bottom:-6px}
.ptile .big{font:700 2.125rem/1 var(--sans);margin-top:16px}
.ptile .lbl{font-size:0.8125rem;color:var(--sub);margin-top:4px}
.chal{background:var(--card);border-radius:16px;padding:14px;box-shadow:inset 0 0 0 .5px var(--line)}
.chal .row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.chal b{font:700 1.375rem/1 var(--sans)}
.chal .bar2{height:8px;border-radius:4px;background:var(--card2);margin:12px 0 4px;position:relative;overflow:visible}
.chal .bar2 i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.chal .bar2 u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px;opacity:.7}
.chal .strip{display:flex;gap:6px;margin-top:12px;overflow:hidden}
.chal .strip .cover{width:38px;flex:none}

.rows{background:transparent}
.lrow{display:flex;align-items:center;gap:14px;width:100%;padding:12px 2px;text-align:left;min-height:56px}
.lrow .ic{width:24px;display:grid;place-items:center;color:var(--ink)}
.lrow .ic svg{width:21px;height:21px}
.lrow .tx{flex:1;min-width:0}
.lrow .tx b{display:block;font:600 1.0625rem/1.2 var(--sans)}
.lrow .tx span{font-size:0.8125rem;color:var(--sub)}
.lrow .chev{width:8px;height:14px;color:var(--faint)}
.lrow .arrow{color:var(--sub)}
.grouphead{margin:24px 2px 4px;display:flex;align-items:center;justify-content:space-between}

.group{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:inset 0 0 0 .5px var(--line)}
.cell{display:flex;align-items:center;gap:12px;min-height:50px;padding:10px 14px;width:100%;text-align:left;position:relative}
.cell+.cell::before{content:"";position:absolute;top:0;left:14px;right:0;height:.5px;background:var(--line2)}
.cell .k{flex:1;min-width:0;font-size:1rem}
.cell .v{color:var(--sub);font-size:1rem;text-align:right}
.cell .chev{width:7px;height:12px;color:var(--faint)}
.cell input[type=number],.cell input[type=text],.cell input[type=date],.cell input[type=time],.cell select{background:none;border:0;text-align:right;color:var(--sub);font-size:1.0625rem;max-width:55%;padding:0}
.cell input:focus{color:var(--ink);outline:none}
.gfoot{font-size:0.8125rem;color:var(--sub);margin:8px 14px 0}
.ghead{margin:22px 14px 7px}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card2);border-radius:10px;padding:2px;position:relative}
.seg button{height:34px;border-radius:8px;font:600 0.875rem/1 var(--sans);color:var(--sub);position:relative;z-index:1}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.25)}
:root[data-theme="paper"] .seg button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:16px;background:var(--card2);transition:background .2s;pointer-events:none}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .25s var(--ease)}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::after{transform:translateX(20px)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:12px;font:600 1rem/1 var(--sans);background:var(--light);color:var(--light-ink)}

.btn svg{width:18px;height:18px}
.stack{display:grid;gap:10px}

.chead{display:flex;align-items:flex-end;gap:12px;margin:4px 0 14px}
.chead .ic{width:30px;height:30px;color:var(--ink);margin-bottom:4px}
.chead .ic svg{width:28px;height:28px}
.chead h1{font:600 1.875rem/1.05 var(--serif);margin:6px 0 2px}
.chead span{font-size:0.8125rem;color:var(--sub)}
.toolrow{display:flex;gap:10px;margin-bottom:16px;align-items:center}
.toolrow .tb{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:inset 0 0 0 .5px var(--line2);color:var(--ink)}
.toolrow .tb[aria-pressed="true"]{background:var(--light);color:var(--light-ink)}
.toolrow .tb svg{width:19px;height:19px}
.toolrow .sp{flex:1}
.toolrow .count{font-size:0.8125rem;color:var(--sub)}
.filterfield{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:0 12px;height:42px;margin-bottom:14px;box-shadow:inset 0 0 0 .5px var(--line2)}
.filterfield svg{width:17px;height:17px;color:var(--faint);flex:none}
.filterfield input{flex:1;background:none;border:0;outline:none;min-width:0;height:100%}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 12px}
.gcell{display:block;text-align:left;min-width:0;position:relative}
.gcell .cover{width:100%;border-radius:3px}
.gcell .gp{height:3px;border-radius:2px;background:var(--card2);margin-top:6px;overflow:hidden}
.gcell .gp i{display:block;height:100%;background:var(--accent)}
.gcell .badge{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center;color:#fff}
.gcell .badge svg{width:13px;height:13px}
.brow{display:flex;gap:14px;align-items:center;padding:9px 0;width:100%;text-align:left}
.brow .cover{width:46px;flex:none;border-radius:3px}
.brow .tx{flex:1;min-width:0}
.brow b{display:block;font:600 1rem/1.25 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow span{display:block;font-size:0.8438rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .st{font-size:0.7812rem;color:var(--faint);margin-top:2px}
.brow .more{width:34px;height:34px;border-radius:50%;background:var(--card2);display:grid;place-items:center;flex:none;color:var(--ink)}
.brow .more svg{width:16px;height:16px}
.brow .owned{width:20px;height:20px;border-radius:50%;background:var(--sub);color:var(--bg);display:grid;place-items:center;flex:none}
.brow .owned svg{width:12px;height:12px}
.yearhead{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 12px}
.yearhead b{font:600 1.3125rem/1 var(--serif)}
.yearhead span{font-size:0.8438rem;color:var(--sub)}
.yearhead span.met{color:var(--accent)}
.empty{text-align:center;color:var(--sub);padding:44px 24px;font-size:0.9375rem}
.empty b{display:block;color:var(--ink);font:600 1.1875rem/1.3 var(--serif);margin-bottom:6px}

.bookpage .scroll{padding-top:0}
.bhead{position:relative;margin:0 -16px;padding:calc(var(--safe-t) + 60px) 16px 18px;background:var(--tint,var(--card2));transition:background-color .4s}
.screen.enter .bhead{transition:none}
.bhead::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.28));pointer-events:none}
:root[data-theme="paper"] .bhead::after{background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.12))}
.bhead>*{position:relative;z-index:1}
.bhead .bcv{width:132px;margin:0 auto 18px}

.bhead h1{flex:1;font:700 1.375rem/1.2 var(--sans);margin:0;color:#fff}
.bhead .by{font:500 0.9375rem/1.3 var(--sans);color:rgba(255,255,255,.82);margin-top:3px}
.bhead .side{display:flex;flex-direction:column;gap:8px}
.bhead .side button{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.28);display:grid;place-items:center;color:#fff}

.bhead .side button[aria-pressed="true"]{background:#fff;color:#1a1819}
.chips{display:flex;gap:18px;margin-top:14px;overflow-x:auto;scrollbar-width:none;font:600 0.7812rem/1 var(--sans);color:rgba(255,255,255,.85)}

.bstate{display:flex;gap:10px;margin:16px 0 0}
.bstate .btn{height:46px}
.hcard{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:12px;box-shadow:inset 0 0 0 .5px var(--line);width:100%;text-align:left}
.hcard .cover{width:44px;flex:none;border-radius:2px}
.hcard b{display:block;font:600 0.9688rem/1.25 var(--sans)}
.hcard span{display:block;font-size:0.8438rem;color:var(--sub);line-height:1.35}

.atile.on i{background:var(--light);color:var(--light-ink)}
.quote{background:var(--card);border-radius:14px;padding:16px 18px;font:400 1rem/1.5 var(--serif);color:var(--ink);box-shadow:inset 0 0 0 .5px var(--line)}
.quote.clamp p{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.quote p{margin:0}
.quote button{margin-top:8px}
.stars{display:flex;gap:4px;color:#F2B544}

.stars svg{width:28px;height:28px}
.notes{width:100%;min-height:110px;background:var(--card);border:0;border-radius:14px;padding:14px;color:var(--ink);resize:vertical;outline:none;box-shadow:inset 0 0 0 .5px var(--line)}
.dtiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dtile{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:inset 0 0 0 .5px var(--line)}
.dtile b{display:block;font:700 1.375rem/1.1 var(--sans);margin-top:6px}

.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:inset 0 0 0 .5px var(--line)}

.monthcard{background:var(--paper);color:var(--paper-ink);border-radius:18px;padding:16px;position:relative;overflow:hidden}
.monthcard .mh{display:flex;align-items:center;justify-content:space-between}
.monthcard .mh b{font:600 1.5rem/1 var(--serif)}
.monthcard .mh button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--paper-ink)}
.monthcard .mh button:disabled{opacity:.25}
.monthcard .mh svg{width:18px;height:18px}
.msum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0 6px}
.msum div{display:flex;flex-direction:column}
.msum b{font:700 1.25rem/1.1 var(--sans)}
.msum span{font:600 0.6875rem/1.3 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--paper-sub)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cal .dow{font:600 0.6875rem/1 var(--sans);text-align:center;color:var(--paper-sub);padding:4px 0}
.cal button{aspect-ratio:2/3;border-radius:5px;background:rgba(0,0,0,.05);position:relative;overflow:hidden;font:600 0.6875rem/1 var(--sans);color:var(--paper-sub)}
.cal button span{position:absolute;top:4px;left:5px;z-index:2}
.cal button.has span{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 6px rgba(0,0,0,.7)}
.cal button.has::before{content:"";position:absolute;inset:0 0 auto 0;height:45%;background:linear-gradient(rgba(0,0,0,.45),transparent);z-index:1;pointer-events:none}
.cal button.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal button .cover{position:absolute;inset:0;width:100%;height:100%;border-radius:0;box-shadow:none}
.cal button .cover.second{inset:auto 0 0 auto;width:55%;height:55%;border-top-left-radius:3px;box-shadow:-1px -1px 0 rgba(255,255,255,.5)}
.cal button.met:not(.has)::after{content:"";position:absolute;left:50%;top:60%;width:6px;height:6px;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%)}
.cal .pad{visibility:hidden}
.monthcard .btn{margin-top:14px;background:var(--paper-ink);color:var(--paper)}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.big3 b{display:block;font:700 1.375rem/1.1 var(--sans)}
.big3 span{font-size:0.7812rem;color:var(--sub)}
.hb{display:grid;grid-template-columns:minmax(0,38%) 1fr auto;gap:10px;align-items:center;font-size:0.875rem;padding:4px 0}
.hb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb i{height:8px;border-radius:4px;background:var(--accent);width:var(--w)}
.hb b{font-weight:600;font-variant-numeric:tabular-nums}
.dots{display:grid;grid-template-columns:14px repeat(24,1fr);gap:2px;align-items:center}
.dots span{font-size:0.6875rem;color:var(--faint)}
.dots i{aspect-ratio:1;border-radius:50%;background:var(--card2)}
.dots i.l1{background:rgba(29,180,157,.35)} .dots i.l2{background:rgba(29,180,157,.65)} .dots i.l3{background:var(--accent)}
.chart{width:100%;height:auto}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;margin-top:10px}
.wk i{display:grid;place-items:center;width:34px;height:34px;margin:0 auto;border-radius:50%;background:var(--card2);color:var(--sub)}
.wk i.met{background:var(--accent);color:var(--accent-ink)}
.wk i.today{box-shadow:inset 0 0 0 2px var(--accent)}
.wk i svg{width:16px;height:16px}
.wk span{display:block;font-size:0.7188rem;color:var(--sub);margin-top:5px}
.ledger .cell .v.met{color:var(--accent)}
.flamehero{text-align:center;padding:10px 0 4px}
.flamehero .f{width:64px;height:64px;margin:0 auto;color:var(--accent)}
.flamehero .f svg{width:64px;height:64px}
.flamehero b{display:block;font:700 2.75rem/1 var(--sans);margin-top:6px}
.flamehero span{color:var(--sub)}

.backdrop{position:fixed;inset:0;z-index:50;background:var(--scrim);opacity:0;transition:opacity .35s var(--ease)}
.backdrop.on{opacity:1}
.sheet{position:fixed;z-index:51;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;background:var(--bg);border-radius:22px 22px 0 0;
  box-shadow:0 -10px 40px rgba(0,0,0,.45),inset 0 .5px 0 var(--line2);transform:translateY(105%);transition:transform .42s var(--ease);
  max-height:calc(100% - var(--safe-t) - 12px);display:flex;flex-direction:column;padding-bottom:var(--safe-b)}
.sheet.on{transform:none}
.sheet.dragging{transition:none}
.sheet.large{height:calc(100% - var(--safe-t) - 12px)}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line2);margin:7px auto 0;flex:none}
.shead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 14px 8px;flex:none;min-height:50px}
.shead h2{margin:0;font:600 1.0625rem/1.2 var(--sans);text-align:center}
.shead .l{justify-self:start} .shead .r{justify-self:end}
.shead.bk{display:flex;gap:12px;padding:8px 16px 10px}
.shead.bk .cover{width:34px;flex:none}
.shead.bk .tt{flex:1;min-width:0}
.shead.bk .tt b{display:block;font:600 0.9688rem/1.2 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shead.bk .tt span{font-size:0.875rem;color:var(--sub);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbody{overflow-y:auto;padding:4px 16px 18px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sbody.fade{animation:sfade .22s var(--out)}
@keyframes sfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.stiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 14px}
.stile{background:var(--card);border-radius:14px;padding:12px 8px 14px;text-align:center;box-shadow:inset 0 0 0 .5px var(--line2);min-height:118px;display:flex;flex-direction:column;align-items:center;width:100%}
.stile .caps{font-size:0.6875rem}
.stile small{font-size:0.7188rem;color:var(--faint);margin-top:3px;min-height:14px}
.stile b{font:500 2.5rem/1 var(--serif);margin-top:auto;padding-top:8px}
.stile b sub{font:600 0.6875rem/1 var(--sans);letter-spacing:.06em;vertical-align:baseline;margin-left:2px;text-transform:uppercase}
.stile.na b{color:var(--sub)}
.stile[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}

.pcols{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;margin:6px 0 14px;text-align:center}
.pcols .col{padding:10px 4px;border-radius:14px}
.pcols .col span{display:block;font:600 0.8125rem/1 var(--sans);color:var(--sub);margin-bottom:8px}
.pcols .col b,.pcols .col input{font:500 1.875rem/1.1 var(--serif);color:var(--sub);display:block;width:100%;text-align:center;background:none;border:0;outline:none;padding:0}
.pcols .col.cur{background:var(--card2)}
.pcols .col.cur span{color:var(--ink)}
.pcols .col.cur input{color:var(--ink)}
.pcols .col input.tot{color:var(--sub)}
.unitrow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.unitrow .tx{flex:1;min-width:0}
.unitrow .tx b{display:block;font:600 0.9688rem/1.2 var(--sans)}
.unitrow select{background:none;border:0;color:var(--sub);font-size:0.875rem;padding:0;-webkit-appearance:none;appearance:none}
.daybtn{position:relative;height:38px;min-width:38px;padding:0 10px;border-radius:10px;box-shadow:inset 0 0 0 1.5px var(--line2);display:flex;align-items:center;gap:6px;font:600 0.8438rem/1 var(--sans);color:var(--ink)}
.daybtn svg{width:18px;height:18px}
.daybtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.stepper{display:flex;align-items:center;gap:10px;justify-content:center;margin:6px 0 4px}
.stepper button{width:44px;height:44px;border-radius:50%;background:var(--card2);font:600 1.375rem/1 var(--sans);display:grid;place-items:center}
.stepper b{font:500 2.5rem/1 var(--serif);min-width:110px;text-align:center}
.chiprow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.chip{height:34px;padding:0 13px;border-radius:17px;background:var(--card2);font:600 0.8438rem/1 var(--sans);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--light);color:var(--light-ink)}
.qtiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 4px}
.qtiles .atile{flex:none}
.qtiles .atile i{width:100%;height:auto;aspect-ratio:1}
.pickrow{display:flex;gap:12px;align-items:center;width:100%;padding:8px 0;text-align:left}
.pickrow .cover{width:40px;flex:none}
.pickrow b{font:600 0.9688rem/1.25 var(--sans);display:block}
.pickrow span{font-size:0.8125rem;color:var(--sub)}
.pickrow .ck{margin-left:auto;color:var(--accent);width:22px}
.covergrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.covergrid button{display:block}
.covergrid .cover{width:100%}
.covergrid small{display:block;font-size:0.6875rem;color:var(--faint);margin-top:4px;text-align:center}
.textarea{width:100%;min-height:90px;background:var(--card);border:0;border-radius:12px;padding:12px;color:var(--ink);outline:none;resize:none;box-shadow:inset 0 0 0 .5px var(--line2)}

.recap{background:var(--paper);color:var(--paper-ink);border-radius:20px;padding:22px 20px;text-align:center;position:relative;overflow:hidden}
.recap .rc{width:96px;margin:0 auto 14px;transform:rotate(-4deg)}
.recap .rc .cover{width:100%}
.recap .k{font:600 0.75rem/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--paper-sub);margin-top:14px}
.recap .v{font:italic 500 1.875rem/1.15 var(--serif);margin-top:4px}
.recap .v small{font-size:1.25rem}
.recap .foot{margin-top:18px;font:600 0.8125rem/1.3 var(--sans);color:var(--paper-sub)}
.recap .foot b{color:var(--accent)}

.alert{position:fixed;z-index:70;left:16px;right:16px;max-width:400px;margin:0 auto;top:50%;transform:translateY(-44%) scale(.96);opacity:0;background:var(--card);
  border-radius:20px;padding:20px 16px 16px;box-shadow:0 20px 60px rgba(0,0,0,.55),inset 0 0 0 .5px var(--line2);transition:transform .3s var(--ease),opacity .2s}
.alert.on{transform:translateY(-50%);opacity:1}
.alert h2{margin:0 2px 8px;font:700 1.1875rem/1.25 var(--sans)}
.alert p{margin:0 2px 18px;color:var(--sub);font-size:0.9375rem;line-height:1.45}
.alert .stack{gap:10px}
.alert .btn{height:46px;font-size:0.9688rem}
.alertveil{position:fixed;inset:0;z-index:69;background:var(--scrim);opacity:0;transition:opacity .25s}
.alertveil.on{opacity:1}

.pmenu{position:fixed;z-index:72;min-width:230px;max-width:300px;background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);
  border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 0 0 .5px var(--line2);padding:6px 0;transform:scale(.6);opacity:0;transition:transform .32s var(--ease),opacity .18s;max-height:70vh;overflow-y:auto}
.pmenu.on{transform:none;opacity:1}
.pmenu .ph{font:600 0.7812rem/1 var(--sans);color:var(--faint);padding:8px 16px 6px}
.pmenu button{display:grid;grid-template-columns:18px 22px 1fr;align-items:center;gap:8px;width:100%;padding:11px 14px;text-align:left;font-size:1rem}
.pmenu button svg{width:18px;height:18px}
.pmenu button .ck svg{width:14px;height:14px}
.pmenu hr{border:0;height:6px;background:rgba(0,0,0,.18);margin:4px 0}
.pmveil{position:fixed;inset:0;z-index:71}

.blurveil{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;transition:opacity .25s}
.blurveil.on{opacity:1}
.ctx{position:fixed;z-index:61;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:14px;pointer-events:none}
.ctx>*{pointer-events:auto}
.ctx .preview{width:140px;transform:scale(.9);opacity:0;transition:transform .35s var(--ease),opacity .2s}
.ctx .menu{width:250px;border-radius:14px;overflow:hidden;background:var(--glass);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);transform:scale(.85);opacity:0;transform-origin:top center;transition:transform .35s var(--ease),opacity .2s}
.ctx.on .preview,.ctx.on .menu{transform:none;opacity:1}
.ctx .menu button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:13px 16px;font-size:1rem;text-align:left}
.ctx .menu button+button{box-shadow:inset 0 .5px 0 var(--line2)}
.ctx .menu button svg{width:18px;height:18px}
.ctx .menu .red{color:var(--danger)}

#toast{position:fixed;z-index:80;left:50%;bottom:calc(var(--safe-b) + var(--tabh) + 26px);transform:translate(-50%,24px);opacity:0;pointer-events:none;
  background:var(--light);color:var(--light-ink);border-radius:14px;padding:0 6px 0 16px;height:48px;display:flex;align-items:center;gap:12px;font:600 0.9062rem/1.2 var(--sans);
  box-shadow:0 12px 34px rgba(0,0,0,.45);transition:transform .32s var(--ease),opacity .2s;max-width:calc(100% - 32px);white-space:nowrap}
#toast.solo{padding-right:16px}
#toast.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
body.hasmini #toast{bottom:calc(var(--safe-b) + var(--tabh) + 92px)}
#toast span{overflow:hidden;text-overflow:ellipsis}
#toast button{height:36px;padding:0 12px;border-radius:10px;background:rgba(0,0,0,.1);font-weight:700}

.player{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .5s var(--ease);color:var(--scene-ink)}
.player.on{transform:none}
.player.dragging{transition:none}
.player .scene{position:relative;flex:1;background:var(--scene);overflow:hidden;display:flex;align-items:center;justify-content:center;padding-top:var(--safe-t)}
.player canvas.rain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.player .ptop{position:absolute;top:calc(var(--safe-t) + 8px);left:12px;right:12px;display:flex;justify-content:space-between;z-index:3}
.player .ptop button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--scene-sub);background:rgba(0,0,0,.12)}
.player .ptop svg{width:20px;height:20px}
.ringwrap{position:relative;width:min(74vw,300px,40vh);aspect-ratio:1;z-index:2}
.ringwrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--track);stroke-width:22}
.ring-arc{fill:none;stroke:var(--accent);stroke-width:22;stroke-linecap:butt;opacity:.9}
.ring-knob{fill:var(--accent)}
.ringwrap .clock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.ringwrap .clock .n{font:600 min(19vw,4.75rem,10vh)/1 var(--sans);letter-spacing:-.03em;display:flex;align-items:baseline;font-variant-numeric:tabular-nums}
.ringwrap .clock .n i{font-style:normal;font-weight:500;opacity:.55;margin:0 -.03em;position:relative;top:-.05em}
.ringwrap .clock .n .long{font-size:.72em;letter-spacing:-.02em}
.ringwrap .clock .n small{font-size:.45em;font-weight:600;margin-left:3px}
.ringwrap .clock .n small+span{margin-left:.2em}
.ringwrap .clock .s{font:500 0.8438rem/1.2 var(--sans);color:var(--scene-sub);margin-top:10px;min-height:17px}
.player.paused .clock .n{opacity:.45}
.player .knob{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--scene),0 2px 8px rgba(0,0,0,.28);z-index:3;left:50%;top:0;will-change:transform}
.player .knob::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--scene);opacity:.9}
.player .scene .illo{position:absolute;left:22px;bottom:14px;width:58px;opacity:.5;z-index:2;color:var(--scene-ink)}
.player .panel{background:var(--bg);padding:6px 16px calc(var(--safe-b) + 18px);flex:none}
.player .panel .grab{width:38px;height:5px;border-radius:3px;background:var(--line2);margin:4px auto 12px}
.player .prow{display:flex;align-items:center;gap:12px}
.player .prow .cover{width:40px;flex:none;border-radius:2px}
.player .prow .tt{flex:1;min-width:0}
.player .prow .tt b{display:block;font:600 1rem/1.2 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.player .prow .tt span{font-size:0.8125rem;color:var(--sub)}
.player .prow .rbtn{width:46px;height:46px;background:var(--card2)}
.player .opts{display:flex;gap:10px;margin-top:18px}
.player .opts .atile{color:var(--ink);flex:1 1 0;min-width:0;font-size:0.75rem}
.player .opts .atile i{width:100%;max-width:74px;height:auto;aspect-ratio:1}
.player .opts .atile i{background:var(--card2);box-shadow:none}
.player .opts .atile.on i{background:var(--light);color:var(--light-ink)}
.player.dim .scene{background:var(--scene-dim)}
.player.dim .ring-track{stroke:var(--track-dim)}
.player.dim{--scene-ink:#F7F4F0;--scene-sub:rgba(255,255,255,.55);--rain:#fff}

.welcome{padding-top:20px}
.welcome .hero{font:600 2.125rem/1.1 var(--serif);margin:10px 0 10px}
.welcome p{color:var(--sub);font-size:1rem;line-height:1.5}

.screen.enter{animation:push-in .42s var(--ease) both;box-shadow:-10px 0 30px rgba(0,0,0,.4)}
.screen.leave{animation:push-out .38s var(--ease) both;box-shadow:-10px 0 30px rgba(0,0,0,.4)}
.screen.toBelow{animation:to-below .42s var(--ease) both}
.screen.fromBelow{animation:from-below .38s var(--ease) both}
@keyframes push-in{from{transform:translateX(100%)}to{transform:none}}
@keyframes push-out{from{transform:none}to{transform:translateX(100%)}}
@keyframes to-below{from{transform:none;filter:brightness(1)}to{transform:translateX(-28%);filter:brightness(.8)}}
@keyframes from-below{from{transform:translateX(-28%);filter:brightness(.8)}to{transform:none;filter:brightness(1)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;transition-duration:1ms!important}
}

svg.chev{width:8px;height:14px;flex:none;color:var(--faint)}
.brow .tx,.pickrow,.hcard,.lrow,.cell{text-align:left}
.shead select{-webkit-appearance:none;appearance:none;background:none;border:0;color:var(--sub);font-size:0.875rem;padding:0;font-weight:500}
body.sheetopen #toast,body.playing #toast{bottom:auto;top:calc(var(--safe-t) + 10px);transform:translate(-50%,-24px)}

<main id="app">
  <div class="tabview on" id="tv-home"></div>

  <div class="tabview" id="tv-search"></div>
</main>
<section class="mini" id="mini" aria-label="Reading Time, running"></section>
<nav class="tabbar" aria-label="Tabs">
  <div class="pillbar"><span class="hl" aria-hidden="true"></span>
    <button data-tab="home" data-icon="home" aria-current="page"><i></i>Home</button>
    <button data-tab="library" data-icon="lib"><i></i>Library</button>
    <button data-tab="stats" data-icon="ring"><i></i>Stats</button>

  <div class="scene">
    <canvas class="rain" aria-hidden="true"></canvas>
    <div class="ptop"></div>
    <div class="ringwrap" role="timer" aria-label="Session time">
      <svg viewBox="0 0 300 300" aria-hidden="true"><circle class="ring-track" cx="150" cy="150" r="139"/><circle class="ring-arc" cx="150" cy="150" r="139" transform="rotate(-90 150 150)" stroke-dasharray="0 1000"/></svg>
      <div class="knob" aria-hidden="true"></div>
      <div class="clock"><div class="n num"></div><div class="s"></div></div>
    </div>
    <div class="illo" aria-hidden="true"></div>
  </div>
  <div class="panel"><div class="grab" aria-hidden="true"></div><div class="prow"></div><div class="opts"></div></div>
</section>

<script>
const BUILD = "public";          // "private": library baked in (claude.ai preview). "public": empty shell, data restored from a backup.
const SEED = null;
const LS = "read_v1";

const SEED_V = 6;
const SHELVES = ["Reading","Up Next","Queue","Maybe","Paused","Read","DNF","Reference","Pass","Hidden"];
const SHELF_LABEL = {"Reading":"Reading","Up Next":"Up Next","Queue":"Want to Read","Maybe":"Maybe","Paused":"Stopped","Read":"Finished","DNF":"Did Not Finish","Reference":"Reference","Pass":"Pass","Hidden":"Not a book"};
const RANK = ["Read","Reading","Up Next","DNF","Paused","Queue","Reference","Maybe","Pass","Hidden"];
const DEFAULT_PACE = 0.75;          // pages per minute until his own sessions say otherwise
const DEF_SETTINGS = {goalType:"any",dailyMin:20,dailyPages:20,yearGoal:6,theme:"auto",dimDefault:true,idleMin:90};

function personName(a){ const m=/^([^,]+),\s*([^,]+)$/.exec(String(a||"").trim()); return m&&!/\b(jr|sr|ii|iii|phd|md)\b/i.test(m[2])?m[2]+" "+m[1]:a; }
function fromSeed(b){ return {id:b.id,title:b.t,subtitle:b.sub||"",series:b.ser||"",seriesNo:b.sno||"",isbn:b.isbn||"",author:personName(b.a),genre:b.g||"",
  pages:b.p||0,status:b.s,rating:b.r||0,syn:b.syn||"",format:normFormat(b.fmt||(b.k?"Ebook":"")),unit:b.unit==="percent"?"percent":"page",page:b.page||0,recBy:"",
  started:b.started||"",finished:b.fin||"",fuzzy:b.s==="Read"&&!b.fin?(b.fuzzy||"Not sure"):(b.fuzzy||""),notes:"",added:"2026-09-20",
  tier:b.tier||"",merged:b.merged||[],cu:b.cu||"",hideWhy:b.hideWhy||""}; }
function normFormat(f){ return ({Physical:"Print",Kindle:"Ebook","Apple Books":"Ebook",PDF:"Ebook",Audiobook:"Audio"})[f]||f||""; }
function emptyStore(){ return {v:3,seedV:SEED_V,books:{},sessions:[],activity:[],lists:{},deleted:{},timer:null,settings:{...DEF_SETTINGS},settingsAt:0,created:Date.now()}; }
function seedStore(){
  const st=emptyStore(); if(!SEED) return st;

  st.activity=(SEED.activity||[]).map(a=>({id:uid(),...a}));

}
function migrate(){
  normalize();
  if(!SEED||(S.seedV||1)>=SEED_V) return;
  const fresh=seedStore(), remap={};
  Object.values(fresh.books).forEach(f=>(f.merged||[]).forEach(old=>remap[old]=f.id));

function upgradeStore(){ const t0=S.created||Date.now(); let n=0;
  Object.values(S.books).forEach(b=>{ if(!b.updatedAt){ b.updatedAt=t0; n++; } });
  S.sessions.forEach(x=>{ if(!x.updatedAt){ x.updatedAt=t0; n++; } }); S.activity.forEach(x=>{ if(!x.updatedAt){ x.updatedAt=t0; n++; } });
  S.deleted=S.deleted||{}; S.lists=S.lists||{}; Object.values(S.lists).forEach(l=>{ if(!l.updatedAt){ l.updatedAt=t0; n++; } }); if(S.settingsAt==null) S.settingsAt=t0; if((S.v||2)<3){ S.v=3; n++; } return n; }
function mergeStores(a,b){ const out=emptyStore(); out.v=Math.max(a.v||2,b.v||2); out.seedV=Math.max(a.seedV||1,b.seedV||1); out.created=Math.min(a.created||Date.now(),b.created||Date.now());
  const dead={...(a.deleted||{})}; Object.entries(b.deleted||{}).forEach(([k,t])=>{ if(!dead[k]||t>dead[k]) dead[k]=t; }); const cutoff=Date.now()-180*864e5; Object.keys(dead).forEach(k=>{ if(dead[k]<cutoff) delete dead[k]; }); out.deleted=dead;
  const alive=r=>r&&!(dead[r.id]&&dead[r.id]>(r.updatedAt||0));

  const ids=new Set([...Object.keys(a.books||{}),...Object.keys(b.books||{})]); ids.forEach(id=>{ const r=pick((a.books||{})[id],(b.books||{})[id]); if(alive(r)) out.books[id]=r; });
  out.lists={}; new Set([...Object.keys(a.lists||{}),...Object.keys(b.lists||{})]).forEach(id=>{ const r=pick((a.lists||{})[id],(b.lists||{})[id]); if(alive(r)) out.lists[id]=r; });

  const gl={}; [...(a.goalLog||[]),...(b.goalLog||[])].forEach(g=>{ if(!gl[g.since]||(g.updatedAt||0)>(gl[g.since].updatedAt||0)) gl[g.since]=g; }); out.goalLog=Object.values(gl).sort((x,y)=>x.since.localeCompare(y.since));
  out.lastBook=((b.lastBookAt||0)>(a.lastBookAt||0)?b.lastBook:a.lastBook)||a.lastBook||b.lastBook; out.lastBookAt=Math.max(a.lastBookAt||0,b.lastBookAt||0);

function morph(a,b){
  const bc=[...b.childNodes];
  for(let i=0;i<bc.length;i++){ const x=a.childNodes[i], y=bc[i];
    if(!x){ a.appendChild(y); continue; }
    if(x.nodeType!==y.nodeType||x.nodeName!==y.nodeName||(x.nodeType===1&&(x.getAttribute("data-key")||"")!==(y.getAttribute("data-key")||""))){ a.replaceChild(y,x); continue; }
    if(x.nodeType!==1){ if(x.nodeValue!==y.nodeValue) x.nodeValue=y.nodeValue; continue; }
    if(x.tagName==="IMG"&&x.getAttribute("src")!==y.getAttribute("src")){ a.replaceChild(y,x); continue; }
    for(const at of [...x.attributes]) if(!y.hasAttribute(at.name)) x.removeAttribute(at.name);
    for(const at of [...y.attributes]) if(x.getAttribute(at.name)!==at.value) x.setAttribute(at.name,at.value);
    const tag=x.tagName;
    if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT"){
      if(document.activeElement!==x){
        if(tag==="TEXTAREA"){ if(x.value!==y.textContent) x.value=y.textContent; }
        else if(tag==="SELECT"){ morph(x,y); const sel=y.querySelector("option[selected]"); x.value=sel?sel.value:(y.options[0]||{}).value; continue; }
        else if(x.type==="checkbox") x.checked=y.hasAttribute("checked");
        else if(x.value!==(y.getAttribute("value")||"")) x.value=y.getAttribute("value")||"";
      }
      continue;
    }
    morph(x,y);
  }
  while(a.childNodes.length>bc.length) a.removeChild(a.lastChild);
}

  const pctMode=b.unit==="percent"&&b.pages;
  openSheet({form:{id,unit:pctMode?"percent":"page",cur:pctMode?pctOf(b):(b.page||0),total:b.pages||"",day:todayKey()},headCls:"bk",
    head:()=>{ const b=S.books[F.id], back=progressBack(); return `${cover(b)}<div class="tt"><b>${back?"Move Position":"Update Progress"}</b>${back?`<span>Back to ${F.unit==="percent"?F.cur+"%":"page "+F.cur}</span>`:`<span><select data-f="unit" data-live aria-label="Unit"><option value="page" ${F.unit==="page"?"selected":""}>Pages ▾</option><option value="percent" ${F.unit==="percent"?"selected":""}>Percent ▾</option></select></span>`}</div>
      <label class="daybtn" aria-label="Day">${I.cal}<span>${dayWord(F.day)}</span><input type="date" data-f="day" data-live max="${todayKey()}" value="${F.day}"></label><button class="navbtn circ" data-act="closesheet" aria-label="Close">${I.x}</button>`; },
    render:()=>{ const b=S.books[F.id], last=F.unit==="percent"?pctOf(b):(b.page||0), back=progressBack(), tot=F.unit==="percent"?100:F.total;
      const fin=F.unit==="percent"?+F.cur>=100:(+F.total&&+F.cur>=+F.total);
      const label=back?"Move Position":fin?"Finish Book":F.day===todayKey()?"I Read Today":F.day===addDays(todayKey(),-1)?"I Read Yesterday":"I Read on "+dayWord(F.day);
      return `<div class="pcols num"><div class="col"><span>${back?"Old":"Last"}</span><b>${last}${F.unit==="percent"?"%":""}</b></div>
        <div class="col cur"><span>${back?"New":"Current"}</span><input type="number" inputmode="numeric" pattern="[0-9]*" data-f="cur" data-live value="${F.cur}" aria-label="Current ${F.unit}" min="0"></div>
        <div class="col"><span>${F.unit==="percent"?"Total":"Total Pages"}</span>${F.unit==="percent"?`<b>100%</b>`:`<input class="tot" type="number" inputmode="numeric" data-f="total" data-live value="${tot}" placeholder="—" aria-label="Total pages">`}</div></div>
        <button class="btn ${fin?"teal":""}" data-act="saveprogress">${label}</button>
        ${F.unit==="percent"&&!b.pages?`<p class="gfoot">Add the book’s page count to track by percent.</p>`:""}`; },focus:'input[data-f="cur"]'});
}
function progressBack(){ const b=S.books[F.id]; if(!b) return false; const last=F.unit==="percent"?pctOf(b):(b.page||0); return F.cur!==""&&+F.cur<last; }
function saveProgress(){ const b=S.books[F.id], before=snapshot(), prev=b.page||0;
  if(+F.total>0) b.pages=+F.total; b.unit=F.unit;
  let v=Math.max(0,+F.cur||0); if(F.unit==="percent"){ if(!b.pages){ toast("Add a page count first"); return; } v=Math.round(Math.min(100,v)/100*b.pages); }
  if(b.pages) v=Math.min(v,b.pages);
  if(F.day>todayKey()){ toast("That day hasn’t happened yet"); return; }
  b._pb=prev;
  S.activity.push({id:uid(),day:F.day,bookId:b.id,fromPage:prev,toPage:v,src:v<prev?"correction":"progress",updatedAt:Date.now()}); b.page=v; touch(b);
  if(b.status!=="Reading"&&b.status!=="Read") setShelf(b.id,"Reading",true);
  const done=b.pages&&v>=b.pages&&b.status!=="Read"; if(done) setShelf(b.id,"Read",true);
  save(); closeSheet(true); update(); haptic();
  if(done) finishedCelebration(b,before); else undoable(v<prev?`Moved back to page ${v}`:v===prev?"Logged reading for "+dayWord(F.day).toLowerCase():`Page ${v}${b.pages?" · "+pctOf(b)+"%":""}`,before); }

function sheetEndSession(){ const t=S.timer; if(!t) return; const b=S.books[t.bookId];
  const ms=timerMs(); F={mode:"end",bookId:t.bookId,start:t.startedAt,ms,min:Math.max(1,Math.round(ms/60000)),from:t.fromPage!=null?t.fromPage:(b.page||0),to:"",note:"",total:b.pages||"",showNote:false};
  sheetEndSessionPage(); }
function sheetEndSessionPage(){ const b=S.books[F.bookId];
  openSheet({headCls:"bk",focus:'input[data-f="to"]',
    head:()=>{ const b=S.books[F.bookId]; return bookHead(b,`${F.min} min · started ${clock12(F.start)}`); },
    render:()=>{ const b=S.books[F.bookId], read=F.to!==""&&+F.to>F.from?+F.to-F.from:0, secs=F.min*60, pp=read?Math.round(secs/read):0, tot=F.total||b.pages;
      const fin=tot&&F.to!==""&&+F.to>=+tot;
      return `<div class="onefield"><div class="lbl caps">What page are you on?</div>
        <input class="page num" type="number" inputmode="numeric" pattern="[0-9]*" data-f="to" data-live value="${F.to}" placeholder="${F.from}" aria-label="Page you’re on now">
        <div class="of num">was ${F.from}${tot?` · of ${tot}`:""}${!tot?` · <label class="tot">total <input type="number" inputmode="numeric" data-f="total" data-live value="${F.total}" placeholder="—" aria-label="Total pages"></label>`:""}</div>
        <div class="plus ${read?"":"ghost"}">${read?`+${read} ${read===1?"page":"pages"}${pp?` · ${Math.floor(pp/60)}:${pad(pp%60)} a page`:""}`:"Leave it blank to log time only"}</div>
        <div class="dur"><button data-act="endmin" data-d="-1" aria-label="A minute less">−</button><span><b class="num">${F.min}</b> min</span><button data-act="endmin" data-d="1" aria-label="A minute more">+</button></div>
        ${S.timer&&S.timer.idle?`<div class="gfoot" style="text-align:center">It paused itself when you went quiet; the clock said ${fmtCalm(F.ms)}.</div>`:""}</div>
        ${F.showNote?`<input class="textarea" style="min-height:0;height:46px;margin:12px 0 0" data-f="note" value="${esc(F.note)}" placeholder="A line to remember it by" enterkeyhint="done">`:""}
        <div class="stack" style="margin-top:14px"><button class="btn ${fin?"teal":""}" data-act="savesession">${fin?"Finish Book":"Save"}</button>
        <div class="duo"><button class="btn dark" data-act="shownote">${F.showNote?"Hide note":"Add a note"}</button><button class="btn dark" style="color:var(--danger)" data-act="discardsession">Discard</button></div></div>`; },
    onClose:()=>{ alertCard({title:"Save this reading session?",message:"Your reading session is not saved yet.",buttons:[{label:"Save",fn:saveSession},{label:"Discard",style:"red",fn:discardSession},{label:"Keep editing",style:"dark",cancel:true}]}); return false; }}); }
function saveSession(){ const t=S.timer; if(!t) return; const b=S.books[F.bookId], before=snapshot();
  if(+F.total>0) b.pages=+F.total;
  let to=F.to===""?F.from:Math.max(0,+F.to); if(b.pages) to=Math.min(to,b.pages);
  const s={id:uid(),bookId:F.bookId,start:new Date(F.start).toISOString(),min:F.min,sec:F.min===Math.max(1,Math.round(F.ms/60000))?Math.round(F.ms/1000):F.min*60,fromPage:F.from,toPage:to,note:(F.note||"").trim(),src:"timer",idleTrim:!!t.idle,updatedAt:Date.now()};
  S.sessions.push(s); b._pb=b.page||0; if(to!==(b.page||0)) b.page=to; touch(b); if(b.status!=="Reading"&&b.status!=="Read") setShelf(b.id,"Reading",true);
  S.timer=null; S.lastBook=b.id; let done=false; if(b.pages&&to>=b.pages&&b.status!=="Read"){ setShelf(b.id,"Read",true); done=true; }
  save(); stopAmbience(); closeSheet(true); update(); haptic();
  setTimeout(()=>{ if(done) finishedCelebration(b,before,"restore",s); else recapSheet(s,before,done); },reduced()?0:260); }
function discardSession(){ const before=snapshot(); S.timer=null; save(); stopAmbience(); closeSheet(true); closePlayer(); update(); undoable("Session discarded",before,"restore"); }

function recapSheet(s,before,done){ const b=S.books[s.bookId], pages=Math.max(0,s.toPage-s.fromPage), st=streakInfo(), secs=s.sec||Math.round(s.min*60), pp=pages?Math.round(secs/pages):0;
  openSheet({title:"",right:"",render:()=>`<div class="recap"><div class="rc">${cover(b)}</div>
    ${pages?`<div class="k">Read</div><div class="v num">${pages} <small>${pages===1?"page":"pages"}</small></div>`:""}
    <div class="k">Time</div><div class="v num">${secs>=3600?Math.floor(secs/3600)+"<small>h</small> ":""}${Math.floor(secs%3600/60)}<small>m</small>${secs%60&&secs<3600?` ${pad(secs%60)}<small>s</small>`:""}</div>
    ${pp?`<div class="k">Pace</div><div class="v num">${Math.floor(pp/60)}:${pad(pp%60)} <small>/ page</small></div>`:""}
    <div class="foot">${done?`You finished <b>${bt(b)}</b>.`:st.todayMet&&st.cur?`Night <b>${st.cur}</b> of your streak.`:st.cur?`${esc(tonightLine().b)} to keep the ${st.cur}-night streak.`:"Saved to your log."}${b.pages&&!done?` ${b.pages-(b.page||0)} pages to go.`:""}</div></div>
    <div class="stack" style="margin-top:14px"><button class="btn" data-act="closesheet">Done</button></div>`});
  undoable(done?"Finished "+typo(b.title):"Session saved",before,"restore"); } // Undo brings the paused timer back, so a mistyped page costs nothing
function nextBook(exceptId){ return [...booksBy("Up Next"),...booksBy("Queue")].filter(x=>x.id!==exceptId)[0]||null; }
function finishedCelebration(b,before,dropTimer,sess){ const st=streakInfo(), c=challenge(), nb=nextBook(b.id), pages=sess?Math.max(0,sess.toPage-sess.fromPage):0;
  openSheet({title:"",right:"",render:()=>{ const b2=S.books[b.id]||b; return `<div class="recap"><div class="rc">${cover(b2)}</div><div class="k">Finished</div><div class="v">${bt(b2)}</div>
    ${sess?`<div class="k">Tonight</div><div class="v num">${pages?pages+" <small>pages</small> · ":""}${sess.min>=60?Math.floor(sess.min/60)+"h ":""}${Math.round(sess.min%60)}<small>m</small></div>`:""}
    <div class="k">This year</div><div class="v num">${c.done} <small>of ${c.goal} books</small></div><div class="foot">${esc(c.word)}${st.cur?` · <b>${st.cur}</b>-night streak`:""}</div></div>
    <div class="ghead caps" style="margin-left:2px">Rate it</div><div class="stars" style="justify-content:center">${[1,2,3,4,5].map(i=>`<button data-act="rate" data-id="${esc(b2.id)}" data-v="${i}" aria-label="${i} stars">${I.star(starFill(b2.rating,i),900+i)}</button>`).join("")}</div>
    ${nb?`<div class="ghead caps" style="margin-left:2px">Next up</div><div class="nextbook">${cover(nb)}<div class="tx"><b>${bt(nb)}</b><span>${esc(nb.author)} · ${esc(STATUS_WORD[nb.status])}</span></div><button class="btn teal" style="width:auto;padding:0 14px;height:40px;flex:none" data-act="startnext" data-id="${esc(nb.id)}">Start it</button></div>`:""}
    <div class="stack" style="margin-top:14px"><button class="btn" data-act="closesheet">Done</button></div>`; }});
  sheet.before=before; sheet.dropTimer=dropTimer; undoable("Finished "+typo(b.title),before,dropTimer); }

function sheetActions(id){ const b=S.books[id]; if(!b) return;
  openSheet({headCls:"bk",head:()=>{ const b=S.books[id]; return bookHead(b,STATUS_WORD[b.status]+(b.format?" · "+b.format:"")); },render:()=>{ const b=S.books[id];
    return `<div class="tiles-x" style="margin-top:4px">${bookTiles(b).map(t=>`<button class="atile ${t.cls||""}" data-act="tile" data-t="${t.act}" data-id="${esc(b.id)}"${t.v?` data-v="${t.v}"`:""}><i>${t.icon}</i>${t.label}</button>`).join("")}</div>
    <div class="ghead caps" style="margin-left:2px">Recommended by</div><button class="cell group" style="border-radius:14px" data-act="recby" data-id="${esc(b.id)}"><span class="k">${b.recBy?esc(b.recBy):'<span class="sub">Add a source</span>'}</span>${I.chev}</button>`; }}); }

function sheetTarget(id){ const b=S.books[id]; openSheet({title:"Target Date",form:{id,target:b.target||""},focus:'input[data-f="target"]',render:()=>{ const b=S.books[F.id], left=Math.max(0,(b.pages||0)-(b.page||0));
  const n=F.target?Math.max(1,(dateOfKey(F.target)-dateOfKey(todayKey()))/864e5+1):0;
  return `<div class="group"><label class="cell"><span class="k">Finish by</span><input type="date" data-f="target" data-live min="${todayKey()}" value="${F.target}"></label></div>
  <div class="gfoot">${!b.pages?"Add the page count to see the pace it needs.":F.target?`${left} pages in ${plural(Math.round(n),"night")} · <b>${Math.ceil(left/n)} pages a night</b>`:"Pick a day and Read shows the pages a night it takes."}</div>
  <div class="chiprow">${[["week",7,"A week"],["two",14,"Two weeks"],["month",30,"A month"]].map(([k,d,l])=>`<button class="chip" data-act="tquick" data-d="${d}" aria-pressed="${F.target===addDays(todayKey(),d)}">${l}</button>`).join("")}</div>
  <div class="stack" style="margin-top:12px"><button class="btn" data-act="savetarget">Done</button>${b.target?`<button class="btn dark" data-act="cleartarget">Remove target</button>`:""}</div>`; }}); }

function sheetSessionForm(id,preset={}){ const s=id?S.sessions.find(x=>x.id===id):null; const bid=s?s.bookId:preset.bookId||S.lastBook||(readingNow()[0]||{}).id||Object.keys(S.books)[0];
  const st=s?new Date(s.start):null, day=s?keyOf(st.getTime()):preset.day||todayKey(), b=S.books[bid]||{};
  openSheet({title:s?"Edit Session":"Add Past Session",form:{id:s&&s.id,bookId:bid,day,time:s?pad(st.getHours())+":"+pad(st.getMinutes()):"21:30",min:s?s.min:20,from:s?s.fromPage:"",to:s?s.toPage:"",note:s?s.note||"":""},
    render:()=>{ const opts=Object.values(S.books).filter(x=>!["Hidden","Pass"].includes(x.status)).sort((a,b)=>(lastTouched(b.id)||"").localeCompare(lastTouched(a.id)||"")||a.title.localeCompare(b.title));

      <label class="cell"><span class="k">Night of</span><input type="date" data-f="day" max="${todayKey()}" value="${F.day}"></label>
      <label class="cell"><span class="k">Started at</span><input type="time" data-f="time" value="${F.time}"></label>
      <label class="cell"><span class="k">Minutes</span><input type="number" inputmode="numeric" min="1" data-f="min" value="${F.min}" style="width:80px"></label>
      <label class="cell"><span class="k">From page</span><input type="number" inputmode="numeric" min="0" data-f="from" value="${F.from}" placeholder="—" style="width:80px"></label>
      <label class="cell"><span class="k">To page</span><input type="number" inputmode="numeric" min="0" data-f="to" value="${F.to}" placeholder="—" style="width:80px"></label>
      <label class="cell"><span class="k">Note</span><input type="text" data-f="note" value="${esc(F.note)}" placeholder="Optional" style="max-width:60%"></label></div>
      <div class="stack" style="margin-top:16px"><button class="btn" data-act="savepast">${F.id?"Save Changes":"Add Reading Session"}</button>${F.id?`<button class="btn dark" style="color:var(--danger)" data-act="delsession">Delete Session</button>`:""}</div>`; }});
}
function savePast(){ if(!F.bookId||!S.books[F.bookId]){ toast("Pick a book"); return; } if(!(+F.min>0)){ toast("Add the minutes you read"); return; } if(F.day>todayKey()){ toast("That night hasn’t happened yet"); return; }
  const before=snapshot(); const [h,m]=(F.time||"21:30").split(":").map(Number); const d=dateOfKey(F.day); d.setHours(h,m,0,0); if(h<DAY_ROLL_H) d.setDate(d.getDate()+1);
  const rec={bookId:F.bookId,start:d.toISOString(),min:+F.min,fromPage:+F.from||0,toPage:+F.to||0,note:(F.note||"").trim(),src:"manual",updatedAt:Date.now()};
  if(F.id) Object.assign(S.sessions.find(x=>x.id===F.id),rec); else S.sessions.push({id:uid(),...rec});
  const b=S.books[F.bookId], latest=lastActivityDay(b.id); if(rec.toPage>(b.page||0)&&(!latest||F.day>=latest)){ b.page=rec.toPage; touch(b); } if(b.status!=="Reading"&&b.status!=="Read") setShelf(b.id,"Reading",true);
  save(); closeSheet(true); update(); undoable(F.id?"Session updated":"Session added",before); }

function sheetDates(id){ const b=S.books[id];
  openSheet({title:"Change Dates",form:{id,which:b.status==="Read"?"finished":"started",started:b.started||"",finished:b.finished||"",fuzzy:b.fuzzy||""},
    render:()=>{ const b=S.books[F.id], k=F.which, v=F[k], yr=String(new Date().getFullYear());
      return `<div class="sub" style="text-align:center;font-size:14px;margin-bottom:10px">${F.started?shortDate(F.started):"Start unknown"} – ${b.status==="Read"?(F.finished?shortDate(F.finished):(F.fuzzy||"Unknown")):"Today"}</div>
      ${b.status==="Read"?`<div class="seg"><button data-act="dwhich" data-w="started" aria-pressed="${k==="started"}">Start Date</button><button data-act="dwhich" data-w="finished" aria-pressed="${k==="finished"}">End Date</button></div>`:""}
      <div class="group" style="margin-top:12px"><label class="cell"><span class="k">${k==="started"?"Started":"Finished"}</span><input type="date" data-f="${k}" data-live max="${todayKey()}" value="${v}"></label></div>
      <div class="chiprow"><button class="chip" data-act="dquick" data-q="unknown" aria-pressed="${!v&&!(k==="finished"&&F.fuzzy&&F.fuzzy!=="Not sure"&&!F.fuzzy.includes(yr))}">Unknown</button>${k==="finished"?`<button class="chip" data-act="dquick" data-q="year" aria-pressed="${!v&&F.fuzzy===("Sometime in "+yr)}">Sometime this year</button>`:""}<button class="chip" data-act="dquick" data-q="today" aria-pressed="${v===todayKey()}">Today</button></div>
      <button class="btn" style="margin-top:10px" data-act="savedates">Done</button>`; }}); }

  <div class="group"><label class="cell"><span class="k">Number of pages</span><input type="number" inputmode="numeric" min="1" data-f="pages" value="${F.pages}" placeholder="Add" style="width:90px"></label></div>

function sheetCover(id){ const b=S.books[id]; F={id,res:null,err:false};
  openSheet({title:"Change Cover",size:"large",render:()=>{ const b=S.books[F.id];
    if(F.err) return `<div class="empty"><b>Can’t reach the catalog</b>Covers come from Apple Books and Open Library.</div>`;
    if(!F.res) return `<div class="covergrid" aria-busy="true">${[0,1,2,3,4,5].map(()=>`<span class="cover skel" aria-hidden="true"></span>`).join("")}</div><div class="empty" style="padding-top:14px">Finding editions…</div>`;
    const list=F.res.filter(r=>r.cu); return `<div class="covergrid">${b.cuUser?`<button data-act="coverreset"><div class="cover" style="display:grid;place-items:center;color:var(--sub);font:600 12px var(--sans)">Original</div><small>Reset</small></button>`:""}${list.map((r,i)=>`<button data-act="coverpick" data-i="${i}" data-key="cv-${i}"><span class="cover skel"><img class="cover img" src="${esc(r.cu)}" alt="" loading="lazy" onload="this.parentNode.classList.remove('skel')" onerror="this.closest('button').remove()"></span><small>${esc(r.src)}</small></button>`).join("")}</div>${list.length?"":`<div class="empty">No covers found.</div>`}`; }});
  searchBooks(b.title+" "+b.author.split(",")[0]).then(r=>{ if(F.id!==id) return; F.res=r.filter(x=>x.cu); refreshSheet(); }).catch(()=>{ F.err=true; refreshSheet(); }); }

function sheetShelf(target){ // target: {id} for a library book, or {r} for a catalog result
  const b=target.id?S.books[target.id]:null, r=target.r;

function clockParts(ms){ const s=Math.floor(ms/1000);

    case "setshelf": setShelf(id,t.v); update(); undoable("Moved to "+COLL[t.v].label,before); break;
    case "unfinish": { const fin=b.finished; b.status="Reading"; b.finished=""; if(b.pageBefore!=null){ b.page=b.pageBefore; delete b.pageBefore; }
      S.activity=S.activity.filter(a=>!(a.bookId===id&&a.src==="finish"&&a.day===fin)); touch(b); save(); update(); undoable("Back to Currently Reading · page "+(b.page||0),before); break; }
    case "remove": removeBook(id); break;
    case "dates": sheetDates(id); break;
    case "ratesheet": sheetRate(id); break;
    case "lengthfmt": sheetLength(id); break;
    case "cover": sheetCover(id); break;
    case "target": sheetTarget(id); break;
  } }

let sTimer=0, sSeq=0;
function runSearch(){ const q=searchQ.trim(), seq=++sSeq; if(!q){ searchRes=null; renderEntry(topE()); return; }
  searchBusy=true; searchBooks(q).then(items=>{ if(seq!==sSeq) return; const seen=new Set(); items=items.filter(r=>{ const k=(r.title+"|"+r.author).toLowerCase(); if(seen.has(k)) return false; seen.add(k); return true; });
    searchRes={items:items.slice(0,24)}; }).catch(()=>{ if(seq===sSeq) searchRes={items:[],error:true}; }).finally(()=>{ if(seq!==sSeq) return; searchBusy=false; if(tab==="search") renderEntry(topE("search")); else stacks.search.forEach(e=>e.dirty=true); }); }
document.addEventListener("input",e=>{ const t=e.target;
  if(t.id==="sq"){ searchQ=t.value; clearTimeout(sTimer); if(searchMode==="catalog"&&searchQ.trim()){ searchRes=searchRes&&searchQ.trim()?searchRes:null; sTimer=setTimeout(runSearch,280); } renderEntry(topE()); }
  else if(t.dataset.colq!=null){ colState[t.dataset.colq].q=t.value; renderEntry(topE()); }
});
document.addEventListener("click",e=>{ const m=e.target.closest("#mini"); if(!m||e.target.closest("[data-act]")) return; openPlayer(); });
document.addEventListener("change",e=>{ const t=e.target;
  if(t.hasAttribute("data-list")){ const l=S.lists[t.dataset.list], bid=t.dataset.book; if(l){ const i=l.books.indexOf(bid); if(t.checked&&i<0) l.books.push(bid); if(!t.checked&&i>=0) l.books.splice(i,1); touch(l); save(); haptic(); refreshSheet(); update(); } return; }
  if(t.hasAttribute("data-scanfile")){ const f=t.files&&t.files[0]; if(f) scanPhoto(f); return; }
  if(t.hasAttribute("data-nudge")){ const want=t.checked; (want?nudgeEnable():nudgeDisable().then(()=>true)).then(okk=>{ if(want&&!okk){ t.checked=false; } update(); }); return; }
  if(t.dataset.note!=null){ const b=S.books[t.dataset.note]; if(b){ b.notes=t.value; touch(b); save(); } }
  else if(t.dataset.set){ const k=t.dataset.set; if(t.type==="checkbox") S.settings[k]=t.checked; else S.settings[k]=Math.max(+t.min||1,Math.min(+t.max||999,+t.value||0)); touchSettings(); save(); update(); }
  else if(t.id==="restorefile"&&t.files[0]){ t.files[0].text().then(x=>{ F.txt=x; refreshSheet(); }); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.matches('input[data-f="cur"]')){ e.preventDefault(); saveProgress(); }
  if(e.key==="Enter"&&e.target.matches('.onefield input[data-f="to"]')){ e.preventDefault(); saveSession(); }
  if(e.key==="Enter"&&e.target.matches('.sheet input[data-f="name"]')){ e.preventDefault(); const b=document.querySelector('.sheet [data-act="savelist"]'); if(b) b.click(); }
  if(e.key==="Escape"){ if(sheet) closeSheet(); else if(playerOpen) closePlayer(); else if(stacks[tab].length>1) pop(); } });

function warmTints(){ const ids=Object.keys(S.books).filter(id=>!tintCache[id]&&coverSrc(S.books[id])); let i=0;
  const next=()=>{ const batch=ids.slice(i,i+12); i+=12; if(!batch.length){ saveTints(); if(topE().route==="coll") renderEntry(topE()); return; } let n=batch.length; batch.forEach(id=>tintFor(S.books[id],()=>{ if(--n===0) setTimeout(next,0); })); };
  next(); }
function saveTints(){ try{ localStorage.setItem("read_tints",JSON.stringify(tintCache)); }catch(e){} }
function loadTints(){ try{ Object.assign(tintCache,JSON.parse(localStorage.getItem("read_tints")||"{}")); }catch(e){} }

function rebuildAll(){ TABS.forEach(t=>{ stacks[t].forEach(e=>e.el.remove()); stacks[t]=[]; }); TABS.forEach(t=>{ const e={tab:t,route:t,params:{}}; stacks[t].push(e); mount(e,0); }); paintTabbar(); renderMini(); }

function boot(){
  load(); loadTints(); applyTheme();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme);
  rebuildAll();
  initSwipeBack(); initLongPress(); initPlayerDrag(); initFocusTrap(); initIdleTouch();
  document.querySelectorAll(".tabbar [data-tab]").forEach(b=>b.addEventListener("click",()=>switchTab(b.dataset.tab)));
  $("#player .ringwrap").addEventListener("click",()=>{ S.settings.calmClock=!S.settings.calmClock; save(); lastText=""; tick(); haptic(); });
  if(S.timer){ idleCheck(); renderMini(); if(S.timer.idle) setTimeout(idlePrompt,500); }
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ if(S.timer){ if(idleCheck()) idlePrompt(); tick(); if(playerOpen&&S.settings.awake!==false) getWake(); } update(); } });
  setInterval(()=>{ if(!S.timer&&document.visibilityState==="visible"){ const k=todayKey(); if(k!==boot._day){ boot._day=k; update(); } } },60000); boot._day=todayKey();
  if(BUILD==="public"&&"serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
  openDeepLink(); addEventListener("hashchange",openDeepLink);
  if(syncReady()){ syncPull(); document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") syncPull(); }); }
  if(BUILD==="public"&&"serviceWorker" in navigator&&syncReady()) navigator.serviceWorker.ready.then(swShare).catch(()=>{});
}
function openDeepLink(){ const m=/^#(book|start)=([\w.-]+)$/.exec(location.hash||""); if(!m) return; const b=S.books[m[2]]; history.replaceState(null,"",location.pathname+location.search); if(!b) return;
  if(tab!=="home") switchTab("home"); if(topE().route!=="book"||topE().params.id!==b.id) push("book",{id:b.id});
  if(m[1]==="start") setTimeout(()=>startSession(b.id),350); }
boot();

</script>
