<style>
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#ECEEF2; --ink:#10131A; --sub:#5E6573; --faint:#757C88;
  --line:#E5E8ED; --accent:#2A55D4; --accent-tint:#E6ECFB; --on-accent:#FFFFFF;
  --good:#12814A; --good-tint:#E2F4EA; --flame:#C25A00; --flame-tint:#FCEBD9; --danger:#C62828;

  --r:16px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0D12; --surface:#151922; --surface-2:#1D222D; --ink:#F2F4F8; --sub:#A0A7B4; --faint:#7D8594;
  --line:#262C38; --accent:#7D9BFF; --accent-tint:#1E2747; --on-accent:#0B0D12;
  --good:#3DD68C; --good-tint:#13301F; --flame:#FFA34D; --flame-tint:#3A2410; --danger:#FF6B6B;
  --scrim:rgba(0,0,0,.6); --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0D12; --surface:#151922; --surface-2:#1D222D; --ink:#F2F4F8; --sub:#A0A7B4; --faint:#7D8594;
  --line:#262C38; --accent:#7D9BFF; --accent-tint:#1E2747; --on-accent:#0B0D12;
  --good:#3DD68C; --good-tint:#13301F; --flame:#FFA34D; --flame-tint:#3A2410; --danger:#FF6B6B;
  --scrim:rgba(0,0,0,.6); --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--sans);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
main{max-width:640px;margin:0 auto;padding-block:calc(12px + env(safe-area-inset-top,0px)) 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 14px}
header.top .acts{display:flex;gap:8px}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0}
h2{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);margin:26px 4px 8px}
.iconbtn{width:44px;height:44px;border-radius:22px;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.sub{color:var(--sub)} .faint{color:var(--faint);font-size:13px}
.btn{min-height:44px;border:0;border-radius:12px;padding:0 18px;font-weight:600;background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--on-accent)}

.btn.danger{background:transparent;color:var(--danger)}
.btn.wide{width:100%}

.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}

.hero .big{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1}
.hero .big small{font-size:17px;font-weight:500;color:var(--sub);letter-spacing:0}
.bar{position:relative;height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin-top:14px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:5px;transition:width .5s}
.bar.done i{background:var(--good)}
.bar .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.heroline{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:14px;font-size:13px;font-weight:600;background:var(--surface-2);color:var(--sub);border:0}

.chip.good{background:var(--good-tint);color:var(--good)}
button.chip{min-height:36px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px}
.week div{text-align:center;font-size:11px;color:var(--faint)}
.week b{display:block;margin:4px auto 0;width:26px;height:26px;border-radius:13px;background:var(--surface-2);font-size:11px;line-height:26px;color:var(--faint);font-weight:600}
.week b.part{background:var(--accent-tint);color:var(--accent)}
.week b.met{background:var(--good);color:var(--on-accent)}
.week b.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cover{flex:none;width:52px;aspect-ratio:2/3;border-radius:4px 6px 6px 4px;display:flex;align-items:flex-end;padding:5px;color:#fff;font-family:var(--serif);font-size:8px;line-height:1.1;overflow:hidden;position:relative;box-shadow:inset 3px 0 0 rgba(0,0,0,.18)}
img.cover{padding:0!important;object-fit:cover;background:var(--surface-2);display:block;height:auto;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.cover.lg{width:96px;font-size:13px;padding:8px}
.cover.md{width:72px;font-size:11px;padding:6px}
.cover.xl{width:132px;font-size:17px;padding:10px}
.cbook{display:flex;gap:14px;align-items:flex-start}
.cbook .meta{min-width:0;flex:1}
.btitle{font-family:var(--serif);font-weight:600;font-size:19px;line-height:1.2;letter-spacing:-.005em;text-wrap:balance}
.bauthor{color:var(--sub);font-size:14px;margin-top:2px}
.pbar{height:6px;border-radius:3px;background:var(--surface-2);margin-top:10px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:3px}

.cbook .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.cbook .acts .btn{padding:0 14px;min-height:44px}
.tap{border:0;background:transparent;padding:0;text-align:left;display:block;width:100%}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-left,0px)) 6px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.carousel>article{flex:0 0 86%;scroll-snap-align:center;min-width:0}
.carousel>article:only-child{flex-basis:100%}
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.tiles3 button{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:14px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;line-height:1.2;text-align:center;min-width:0;font-weight:600;color:var(--ink);padding:8px 4px}
.tiles3 button svg{width:22px;height:22px;color:var(--accent)}
.tiles3 button.warn{color:var(--danger)} .tiles3 button.warn svg{color:var(--danger)}
.histcard{display:flex;gap:12px;align-items:center}
.histcard .cover{width:44px}
details.more summary{cursor:pointer;color:var(--accent);font-weight:600;min-height:44px;display:flex;align-items:center;list-style:none}
details.more summary::-webkit-details-marker{display:none}
.search{width:100%;height:44px;border-radius:12px;border:0;background:var(--surface);box-shadow:var(--shadow);padding:0 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;min-height:44px;border-radius:18px;border:0;padding:0 14px;background:var(--surface);box-shadow:var(--shadow);font-size:14px;font-weight:600;color:var(--sub)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips button span{font-weight:500;opacity:.7;margin-left:4px}
.list{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;gap:12px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);min-height:64px}
.li:last-child{border-bottom:0}
.li .cover{width:34px;font-size:0;padding:0}
.li .m{flex:1;min-width:0}
.li .tt{font-family:var(--serif);font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .aa{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .rr{font-size:13px;color:var(--faint);text-align:right;flex:none}
.sortrow{display:flex;justify-content:space-between;align-items:center;margin:10px 4px;gap:8px}
.sortrow .faint{white-space:nowrap}
.sortrow select{border:0;background:transparent;color:var(--accent);font-weight:600;min-height:44px}
.yearhead{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 8px}
.yearhead b{font-size:20px;font-weight:700}
.yearhead span{font-size:13px;color:var(--sub)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;min-height:44px;border-radius:8px;font-weight:600;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.tile .k{font-size:13px;color:var(--sub)} .tile .n{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .c{font-size:12px;color:var(--faint);margin-top:2px}
.chart{width:100%;height:auto;display:block}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.calhead b{font-family:var(--serif);font-size:22px;font-weight:600}
.calsum{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;margin:4px 0 14px;gap:4px}
.calsum b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.calsum span{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
@media (max-width:360px){.cal{gap:2px}.calcard{padding:12px 8px}.sortrow .faint{font-size:12px}.viewtoggle select{max-width:120px}}
.cal .dow{font-size:11px;color:var(--faint);text-align:center;font-weight:600}
.cal button{position:relative;aspect-ratio:2/3;border:0;border-radius:6px;background:var(--surface-2);padding:0;overflow:hidden;min-width:0}
.cal button.empty{background:transparent}
.cal button span{position:absolute;left:4px;top:3px;font-size:11px;font-weight:600;color:var(--faint)}
.cal button img,.cal button .cover{position:absolute;inset:0;width:100%;height:100%;border-radius:4px;object-fit:cover}
.cal button img.second{inset:auto 0 0 auto;width:62%;height:62%;box-shadow:-2px -2px 0 var(--surface)}
.cal button.met{box-shadow:inset 0 0 0 2px var(--good)}
.cal button.today span{color:var(--accent)}
.cal button.has span{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);z-index:2}
.dots{display:grid;grid-template-columns:24px repeat(24,1fr);gap:2px;align-items:center;font-size:10px;color:var(--faint)}
.dots i{height:10px;border-radius:5px;background:var(--surface-2)}
.dots i.l1{background:var(--accent-tint)} .dots i.l2{background:color-mix(in srgb,var(--accent) 55%,var(--surface))} .dots i.l3{background:var(--accent)}
.ins .inh{font-family:var(--serif);font-size:19px;font-weight:600;margin-bottom:8px}
.hb{display:grid;grid-template-columns:minmax(0,38%) 1fr auto;gap:8px;align-items:center;padding:4px 0;font-size:13px}
.hb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--sub)}
.hb i{display:block;height:8px;border-radius:4px;background:var(--accent);width:var(--w)}
.hb b{font-weight:600}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;height:60px}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--faint);min-height:52px;justify-content:center}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .readbtn{width:60px;height:60px;border-radius:30px;margin:-22px auto 0;background:var(--accent);color:var(--on-accent);box-shadow:0 6px 20px color-mix(in srgb,var(--accent) 40%,transparent)}
nav.tabs .readbtn.live{background:var(--good)}
nav.tabs .readbtn svg{width:26px;height:26px}
.livebanner{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:19;background:var(--good);color:var(--on-accent);border:0;border-radius:22px;min-height:44px;padding:0 18px;font-weight:600;box-shadow:var(--shadow)}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:55;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:56;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-block:10px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet.on{transform:none}
.sheet .in{max-width:600px;margin:0 auto}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.shead h3{margin:0;font-size:20px;font-weight:700}
.bookhero{margin:-10px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:18px max(16px,env(safe-area-inset-left,0px)) 18px;border-radius:20px 20px 0 0;color:#fff;transition:background .4s}
.bookhero .bauthor,.bookhero .faint{color:rgba(255,255,255,.78)}
.bookhero .iconbtn{background:rgba(255,255,255,.18);color:#fff;box-shadow:none}
label.f{display:block;font-size:13px;color:var(--sub);margin:14px 2px 6px}
.in input[type=text],.in input[type=search],.in input[type=number],.in input[type=date],.in input[type=datetime-local],.in select,.in textarea{width:100%;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:8px 12px}
.in textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid2>*{min-width:0}
.grid2 input,.grid2 select{min-width:0;max-width:100%}
.prog3{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px;text-align:center;margin-top:12px}
.prog3 div{background:var(--surface);border-radius:12px;padding:10px 6px}
.prog3 div.cur{box-shadow:inset 0 0 0 2px var(--accent)}
.prog3 small{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
.prog3 input{width:100%;border:0;background:transparent;text-align:center;font-size:24px;font-weight:700;min-height:36px;padding:0}

.stepper{display:flex;align-items:center;gap:10px}

.stars{display:flex;gap:4px}

.stars svg{width:30px;height:30px}
.pills{display:flex;flex-wrap:wrap;gap:8px}

.pills button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ledger .lrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}

.ledger .t{flex:1;min-width:0}

.ledger .t span{font-size:13px;color:var(--sub)}
.ledger .ok{width:26px;height:26px;border-radius:13px;border:2px solid var(--line);flex:none}
.ledger .ok.on{background:var(--good);border-color:var(--good)}
.toast button{margin-left:12px;border:0;background:transparent;color:inherit;font-weight:700;min-height:32px;padding:0 4px;text-decoration:underline}
.bgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px}
.bgrid button{border:0;background:transparent;padding:0;text-align:left;min-width:0}

.bgrid .ga{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.viewtoggle svg{width:18px;height:18px}
.inlib{display:block;font-size:11px;font-weight:700;color:var(--good)}
.rain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.cgrid button{border:0;background:transparent;padding:0;text-align:left;min-width:0}
.cgrid img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:6px;background:var(--surface-2);display:block}

const SEED_V = 5;

function fromSeed(b){ return {id:b.id,title:b.t,subtitle:b.sub||"",series:b.ser||"",seriesNo:b.sno||"",isbn:b.isbn||"",author:b.a,genre:b.g||"",

function load(){ try{ const raw=localStorage.getItem(LS); if(raw) S=JSON.parse(raw); }catch(e){}

function save(){ try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){} }
function hasLibrary(){ return Object.keys(S.books).length>0; }

const pad=n=>String(n).padStart(2,"0");

function addDays(k,n){ const [y,m,d]=k.split("-").map(Number); const x=new Date(y,m-1,d+n); return x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate()); }
function dateOfKey(k){ const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); }

function fmtMin(m){ m=Math.round(m); if(m<60) return m+" min"; const h=Math.floor(m/60), r=m%60; return h+"h"+(r?" "+r+"m":""); }

function fullTitle(b){ return b.title+(b.subtitle&&b.title.length<5?": "+b.subtitle:""); }

function pace(){ const cut=Date.now()-60*864e5; let p=0,m=0;

function goalHero(st){

  const done=Math.floor(amt), pct=Math.min(100,amt/g.n*100), left=Math.max(0,Math.ceil(g.n-amt));

function calendarCard(d){
  const [y,m]=calMonth.split("-").map(Number), first=new Date(y,m-1,1), days=new Date(y,m,0).getDate(), lead=(first.getDay()+6)%7, t=todayKey();
  let cells=["M","T","W","T","F","S","S"].map(x=>`<div class="dow">${x}</div>`).join("");

  let mins=0,pages=0,fin=0,active=0;
  for(let i=1;i<=days;i++){ const k=`${y}-${pad(m)}-${pad(i)}`, x=d[k];
    if(x){ mins+=x.min; pages+=x.pages; if(x.active) active++; }
    const bs=x?x.books.map(id=>S.books[id]).filter(Boolean):[];
    const art=bs.length?cover(bs[0],"")+(bs[1]?cover(bs[1],"second"):""):"";
    cells+=`<button class="${bs.length?"has":""} ${dayMet(x)?"met":""} ${k===t?"today":""}" data-act="day" data-k="${k}" aria-label="${fmtDay(k)}${x?", "+Math.round(x.min)+" minutes":""}"><span>${i}</span>${art}</button>`; }
  Object.values(S.books).forEach(b=>{ if(b.status==="Read"&&b.finished&&b.finished.startsWith(calMonth)) fin++; });
  const elapsed=calMonth===t.slice(0,7)?+t.slice(8):days;
  return `<div class="card calcard"><div class="calhead"><button class="iconbtn" data-act="calprev" aria-label="Previous month">${I.left}</button><b>${MONTHS[m-1]} ${y}</b><button class="iconbtn" data-act="calnext" aria-label="Next month" ${calMonth>=t.slice(0,7)?"disabled":""}>${I.right}</button></div>
  <div class="calsum num"><div><b>${fin}</b><span>Books</span></div><div><b>${pages}</b><span>Pages</span></div><div><b>${fmtMin(mins).replace(" min","m")}</b><span>Time</span></div><div><b>${Math.round(pages/Math.max(1,elapsed))}</b><span>Pages/day</span></div></div>
  <div class="cal">${cells}</div>
  <button class="btn wide" style="margin-top:12px" data-act="addsession">+ Add session</button></div>`;
}
function viewStats(){
  const d=dayData(), t=todayKey(), g=goalSpec();

  else if(statRange==="month"){ for(let i=29;i>=0;i--) keys.push(addDays(t,-i)); label="Last 30 nights"; }
  else { for(let i=364;i>=0;i--) keys.push(addDays(t,-i)); label="Last 12 months"; }
  const inR=new Set(keys), ss=S.sessions.filter(s=>inR.has(keyOf(new Date(s.start).getTime())));
  const mins=keys.reduce((a,k)=>a+(d[k]?d[k].min:0),0), pages=keys.reduce((a,k)=>a+(d[k]?d[k].pages:0),0), active=keys.filter(k=>d[k]&&d[k].active).length, met=keys.filter(k=>dayMet(d[k])).length;
  const pmin=ss.filter(s=>s.toPage>s.fromPage).reduce((a,s)=>a+s.min,0), ppages=ss.reduce((a,s)=>a+Math.max(0,s.toPage-s.fromPage),0);
  const fin=Object.values(S.books).filter(b=>b.status==="Read"&&b.finished&&b.finished>=keys[0]).length;
  let bars=[];
  if(statRange==="year"){ const mm={}; keys.forEach(k=>{const m=k.slice(0,7); mm[m]=(mm[m]||0)+(d[k]?d[k].min:0);}); bars=Object.keys(mm).sort().slice(-12).map(m=>({l:MO[+m.slice(5)-1][0],v:mm[m]})); }
  else bars=keys.map((k,i)=>({l:statRange==="week"?WD[dateOfKey(k).getDay()][0]:(i%5===4?dateOfKey(k).getDate():""),v:d[k]?d[k].min:0,met:dayMet(d[k])}));
  const ref=g.type==="minutes"?g.n:0;
  const W=600,H=170,pl=30,pb=22, rawMax=Math.max(statRange==="year"?60:(ref||20),...bars.map(b=>b.v)), st=rawMax>300?120:rawMax>60?30:10, max=Math.ceil(rawMax/st)*st;
  const step=(W-pl)/bars.length, bw=Math.max(3,step*.62), y=v=>H-pb-(v/max)*(H-pb-10);
  let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Minutes read per ${statRange==="year"?"month":"night"}">`;
  [0,max/2,max].forEach(tv=>svg+=`<line x1="${pl}" x2="${W}" y1="${y(tv)}" y2="${y(tv)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(tv)+4}" text-anchor="end" font-size="11" fill="var(--faint)">${tv}</text>`);
  if(statRange!=="year"&&ref) svg+=`<line x1="${pl}" x2="${W}" y1="${y(ref)}" y2="${y(ref)}" stroke="var(--good)" stroke-dasharray="4 4"/>`;

    svg+=`<rect x="${x}" y="${H-pb-hh}" width="${bw}" height="${hh}" rx="${Math.min(4,bw/2)}" fill="${b.met?"var(--good)":"var(--accent)"}"/>`;

  S.sessions.forEach(s=>{ const dt=new Date(s.start); grid[(dt.getDay()+6)%7][dt.getHours()]+=s.min; total+=s.min; if(dt.getHours()>=21||dt.getHours()<4) late+=s.min; });

  return `<header class="top"><h1>Stats</h1></header>

  <div class="seg" role="group" aria-label="Range">${[["week","Week"],["month","Month"],["year","Year"]].map(([k,l])=>`<button data-act="range" data-r="${k}" aria-pressed="${k===statRange}">${l}</button>`).join("")}</div>
  <p class="faint" style="margin:10px 4px">${label}</p>
  <div class="tiles">
    <div class="tile"><div class="k">Time read</div><div class="n">${fmtMin(mins)}</div><div class="c">${active?fmtMin(mins/active)+" a reading night":"No reading logged"}</div></div>
    <div class="tile"><div class="k">Goal nights</div><div class="n">${met}<span class="sub" style="font-size:16px;font-weight:500"> / ${keys.length}</span></div><div class="c">${g.type==="any"?"Any reading":g.n+" "+g.unit+" each"}</div></div>
    <div class="tile"><div class="k">Pages</div><div class="n">${pages}</div><div class="c">${pmin>=10?Math.round(ppages/pmin*60)+" pages an hour":"Time sessions to see pace"}</div></div>
    <div class="tile"><div class="k">Finished</div><div class="n">${fin}</div><div class="c">Streak ${streakInfo().cur} · best ${streakInfo().best}</div></div>
  </div>

let insRange="year";
function hbar(rows,max,fmt){ return rows.map(([l,v])=>`<div class="hb"><span>${esc(l)}</span><i style="--w:${Math.max(3,v/max*100)}%"></i><b class="num">${fmt?fmt(v):v}</b></div>`).join(""); }
function insightsCards(){ // Margins' This-year cards, plus all time

  const mx=a=>Math.max(1,...a.map(x=>x[1]));
  return `<h2>Your books</h2><div class="seg" role="group" aria-label="Books range" style="grid-template-columns:repeat(2,1fr)"><button data-act="insrange" data-r="year" aria-pressed="${insRange==="year"}">This year</button><button data-act="insrange" data-r="all" aria-pressed="${insRange==="all"}">All time</button></div>
  <div class="tiles" style="margin-top:12px"><div class="tile"><div class="k">Books</div><div class="n">${fin.length}</div><div class="c">${pages.toLocaleString()} pages</div></div>

  <div class="stack" style="margin-top:12px">

async function searchBooks(q){

    fetch("https://itunes.apple.com/search?entity=ebook&limit=12&term="+encodeURIComponent(q)).then(r=>r.json()),
    fetch("https://openlibrary.org/search.json?limit=12&fields=key,title,author_name,cover_i,number_of_pages_median,isbn&q="+encodeURIComponent(q)).then(r=>r.json())]);
  if(ap.status==="fulfilled") (ap.value.results||[]).forEach(r=>r.artworkUrl100&&out.push({title:r.trackName,author:r.artistName,cu:r.artworkUrl100.replace("100x100bb","400x600bb"),src:"Apple Books"}));
  if(ol.status==="fulfilled") (ol.value.docs||[]).forEach(d=>out.push({title:d.title,author:(d.author_name||[]).join(", "),cu:d.cover_i?`https://covers.openlibrary.org/b/id/${d.cover_i}-L.jpg`:"",pages:d.number_of_pages_median||0,isbn:(d.isbn||[]).find(x=>x.length===13)||"",src:"Open Library"}));
  if(ap.status==="rejected"&&ol.status==="rejected") throw new Error("offline");
  return out;
}

  if(!id){ pickBookSheet(); return; }
  S.timer={bookId:id,startedAt:Date.now(),runFrom:Date.now(),accum:0,paused:false,fresh:false,idle:false}; S.lastBook=id; save();
  dim=S.settings.dimDefault; $("#rt").hidden=false; drawRT(); clearInterval(rtTick); rtTick=setInterval(tickRT,250);
  if(!wake&&"wakeLock" in navigator) getWake(true);
}
function openRT(bookId){
  if(!S.timer){ const id=bookId||(booksBy("Reading")[0]||{}).id||null;
    S.timer={bookId:id,startedAt:Date.now(),runFrom:Date.now(),accum:0,paused:true,fresh:true}; save(); }
  else if(bookId&&S.timer.fresh){ S.timer.bookId=bookId; save(); }
  dim=S.settings.dimDefault; idleCheck(); $("#rt").hidden=false; drawRT(); clearInterval(rtTick); rtTick=setInterval(tickRT,250);
}
function drawRT(){
  const t=S.timer, b=t&&S.books[t.bookId], el=$("#rt"); el.classList.toggle("dim",dim); const running=t&&!t.paused;
  el.innerHTML=`<button class="iconbtn close" data-act="rtclose" aria-label="Close">${I.x}</button>
  <button class="iconbtn lamp" data-act="rtdim" aria-label="${dim?"Lights on":"Lights off"}" aria-pressed="${dim}">${I.lamp}</button>
  <button class="pick" data-act="rtpick">${b?cover(b):""}<div style="min-width:0"><div class="btitle" style="font-size:16px">${b?esc(typo(b.title)):"Choose a book"}</div><div class="faint">${b?progressLabel(b):"Tap to pick"} · change</div></div></button>
  ${t.idle?`<div class="notice">Paused after ${S.settings.idleMin} minutes. Still reading?</div>`:""}
  ${audio?`<canvas class="rain" id="raincv" aria-hidden="true"></canvas>`:""}<div class="ring">${ringSVG()}<div style="text-align:center"><div class="clock" id="rtclock">${fmtCalm(timerMs())}</div><div class="goalline" id="rtgoal">${goalLine()}</div></div></div>
  <div class="ctrl">${t.fresh?`<button class="btn primary" data-act="rtstart">Start</button>`:
    `<button class="btn" data-act="rtpause">${running?"Pause":"Resume"}</button><button class="btn good" data-act="rtfinish">Finish</button>`}</div>
  <div class="opts"><button class="toggle" data-act="rtrain" aria-pressed="${!!audio}">Rain</button><button class="toggle" data-act="rtwake" aria-pressed="${!!wake}">Keep screen on</button></div>`;
  if(audio) animateRain();
}
function liveFrac(){ const g=goalSpec(), st=streakInfo(), live=timerMs()/60000;
  if(g.type==="minutes") return Math.min(1,(st.today.min+live)/g.n);
  if(g.type==="pages") return Math.min(1,st.today.pages/g.n);
  return st.todayMet||live>=1?1:live; }
function goalLine(){ const g=goalSpec(), st=streakInfo(), f=liveFrac();
  if(f>=1) return "Tonight’s goal is met";
  if(g.type==="minutes") return `${Math.ceil(g.n-(st.today.min+timerMs()/60000))} min to tonight’s goal`;
  if(g.type==="pages") return `${Math.max(0,g.n-st.today.pages)} pages to tonight’s goal`;
  return "Any reading counts tonight"; }
function ringSVG(){ const f=liveFrac(), R=112, C=2*Math.PI*R;
  return `<svg viewBox="0 0 240 240" aria-hidden="true"><circle cx="120" cy="120" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="8"/><circle id="rtarc" cx="120" cy="120" r="${R}" fill="none" stroke="${f>=1?"var(--good)":"var(--accent)"}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-f)}" transform="rotate(-90 120 120)"/></svg>`; }
function tickRT(){ if(idleCheck()){ if(!$("#rt").hidden) drawRT(); else render(); }
  const c=$("#rtclock"); if(c){ c.textContent=fmtCalm(timerMs()); $("#rtgoal").textContent=goalLine();
    const a=$("#rtarc"); if(a){ const f=liveFrac(), C=2*Math.PI*112; a.setAttribute("stroke-dashoffset",C*(1-f)); a.setAttribute("stroke",f>=1?"var(--good)":"var(--accent)"); } }
  const bc=$("#bannerclock"); if(bc) bc.textContent=fmtCalm(timerMs()); }
function closeRT(){ $("#rt").hidden=true; clearInterval(rtTick);
  if(S.timer&&S.timer.fresh){ S.timer=null; save(); stopRain(); releaseWake(); }
  else if(S.timer) rtTick=setInterval(tickRT,1000);
  render(); }
function finishRT(){
  const t=S.timer; if(!t.paused){ t.accum+=Date.now()-t.runFrom; t.paused=true; } save();
  const b=S.books[t.bookId], mins=t.accum/60000, pct=b&&b.unit==="percent"&&b.pages;
  const guess=b?(b.page||0)+Math.round(mins*pace().ppm):0;
  openSheet(head("Nice reading")+`<p class="sub" style="margin-top:0">${fmtClock(t.accum)} with ${b?esc(typo(b.title)):"no book"}</p>
  ${b?`<label class="f" for="endpg">${pct?"What percent are you at?":"What page are you on?"}</label>
  <div class="stepper"><button data-act="endstep" data-d="-1" aria-label="Back one">−</button><input id="endpg" type="number" inputmode="numeric" value="${pct?Math.min(100,Math.round(guess/b.pages*100)):guess}"><button data-act="endstep" data-d="1" aria-label="Forward one">+</button></div>
  <p class="faint">Started at ${progressLabel(b).toLowerCase()}</p>
  ${b.pages?`<button class="btn ghost" data-act="endfinished">I finished the book</button>`:""}`:""}
  <div class="grid2"><div><label class="f" for="endmin">Minutes</label><input id="endmin" type="number" inputmode="numeric" value="${Math.max(1,Math.round(mins))}"></div><div><label class="f">Started</label><div class="sub" style="min-height:44px;display:flex;align-items:center">${new Date(t.startedAt).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}</div></div></div>
  <label class="f" for="endnote">Note</label><input id="endnote" type="text" placeholder="Optional">
  <button class="btn primary wide" style="margin-top:18px" data-act="savert">Save session</button>
  <button class="btn danger wide" data-act="discardrt">Discard</button>`);
}
function startRain(){ try{ const ctx=new (window.AudioContext||window.webkitAudioContext)(); const len=ctx.sampleRate*4, buf=ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0); let last=0;
  for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+0.02*w)/1.02; d[i]=last*3.2+w*0.035; }
  const src=ctx.createBufferSource(); src.buffer=buf; src.loop=true; const f=ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=1400; const g=ctx.createGain(); g.gain.value=.55;
  src.connect(f).connect(g).connect(ctx.destination); src.start(); audio=ctx; }catch(e){ toast("Sound isn’t available here"); } }
let rainRaf=0;
function animateRain(){ cancelAnimationFrame(rainRaf); const cv=$("#raincv"); if(!cv||matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const x=cv.getContext("2d"), W=cv.width=cv.offsetWidth||360, H=cv.height=cv.offsetHeight||640; const drops=Array.from({length:70},()=>({x:Math.random()*W*1.2,y:Math.random()*H,v:6+Math.random()*6,l:10+Math.random()*14}));
  const col=getComputedStyle($("#rt")).color;
  (function f(){ if(!document.body.contains(cv)) return; x.clearRect(0,0,W,H); x.strokeStyle=col; x.globalAlpha=.3; x.lineWidth=1;
    drops.forEach(d=>{ x.beginPath(); x.moveTo(d.x,d.y); x.lineTo(d.x-d.l*.25,d.y+d.l); x.stroke(); d.y+=d.v; d.x-=d.v*.25; if(d.y>H){ d.y=-20; d.x=Math.random()*W*1.2; } });
    rainRaf=requestAnimationFrame(f); })(); }
function stopRain(){ if(audio){ try{audio.close();}catch(e){} audio=null; } }
async function getWake(silent){ try{ wake=await navigator.wakeLock.request("screen"); wake.addEventListener("release",()=>{wake=null; if(!$("#rt").hidden) drawRT();}); }catch(e){ wake=null; if(!silent) toast("This browser won’t keep the screen on"); } }
function releaseWake(){ if(wake){ try{wake.release();}catch(e){} wake=null; } }

function pickBookSheet(){ const opts=[...booksBy("Reading"),...booksBy("Up Next"),...booksBy("Paused")];
  if(!opts.length){ openSheet(head("What are you reading?")+`<p class="sub">Nothing on Reading, Up Next or Stopped yet.</p><button class="btn primary wide" data-act="addbook" data-reading="1">Add a book</button>`); return; }
  openSheet(head("What are you reading?")+`<div class="list">${opts.map(b=>`<button class="li" data-act="rtsetbook" data-id="${b.id}">${cover(b)}<div class="m"><div class="tt">${esc(typo(b.title))}</div><div class="aa">${SHELF_LABEL[b.status]}</div></div></button>`).join("")}</div>`); }
function setShelf(id,s){ const b=S.books[id]; const was=b.status; b.status=s;
  if(s==="Reading"&&!b.started){ b.started=todayKey(); S.activity.push({id:uid(),day:todayKey(),bookId:id,fromPage:null,toPage:b.page||0,src:"start"}); }
  if(s==="Read"){ if(!b.finished) b.finished=todayKey(); if(b.pages) b.page=b.pages; b.fuzzy=""; }
  save(); }
function exportText(){ const copy=JSON.parse(JSON.stringify(S)); copy.timer=null; return JSON.stringify(copy); }
function importText(txt){ const n=JSON.parse(txt); if(!n.books||!n.sessions) throw 0; S=n; normalize(); S.seedV=Math.max(S.seedV||1,SEED_V); save(); applyTheme(); }
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]"); if(!el){ if(e.target.id==="scrim") closeSheet(); return; }
  const a=el.dataset.act, id=el.dataset.id;
  switch(a){
    case "closesheet": closeSheet(); break;
    case "undo": if(toast._undo){ const f=toast._undo; toast._undo=null; $("#toast").classList.remove("on"); f(); } break;
    case "settings": sheetSettings(); break;
    case "streak": sheetStreak(); break;
    case "book": sheetBook(id); break;
    case "progress": sheetProgress(id); break;
    case "unit": { const b=S.books[id]; b.unit=el.dataset.u; save(); sheetProgress(id); break; }
    case "pgstep": { const i=$("#pgv"); i.value=Math.max(0,(+i.value||0)+ +el.dataset.d); break; }
    case "saveprogress": { const before=snapshot(), prevPage=S.books[id].page||0; const b=S.books[id], tp=$("#pgtotal"); if(tp&&+tp.value) b.pages=+tp.value;
      let v=Math.max(0,+$("#pgv").value||0); if(b.unit==="percent"&&b.pages) v=Math.round(Math.min(100,v)/100*b.pages);
      const day=$("#pgday").value||todayKey(); if(day>todayKey()){ toast("That day is in the future"); break; }
      S.activity.push({id:uid(),day,bookId:id,fromPage:b.page||0,toPage:v,src:"progress"}); b.page=v;
      if(b.status!=="Reading"&&b.status!=="Read") setShelf(id,"Reading");
      if(b.pages&&v>=b.pages) setShelf(id,"Read"); save(); closeSheet(); render(); undoable(b.status==="Read"?`Finished ${b.title}`:v<prevPage?`Moved back to ${progressLabel(b).toLowerCase()}`:"Progress logged",before); break; }
    case "shelf": libShelf=el.dataset.s; render(); break;
    case "libview": S.settings.libView=el.dataset.v; save(); render(); break;
    case "range": statRange=el.dataset.r; render(); break;
    case "insrange": insRange=el.dataset.r; render(); break;
    case "calprev": case "calnext": { const [y,m]=calMonth.split("-").map(Number), d=new Date(y,m-1+(a==="calnext"?1:-1),1); calMonth=d.getFullYear()+"-"+pad(d.getMonth()+1); render(); break; }
    case "day": sheetDay(el.dataset.k); break;
    case "setshelf": { const before=snapshot(); if(S.books[id].status===el.dataset.s) break; setShelf(id,el.dataset.s); sheetBook(id); render(); undoable(`Moved to ${SHELF_LABEL[el.dataset.s]}`,before); break; }
    case "shelfsheet": sheetShelf(id); break;
    case "editbook": sheetEdit(id); break;
    case "finishbook": case "stopbook": case "startreading": { const before=snapshot(), to={finishbook:"Read",stopbook:"Paused",startreading:"Reading"}[a]; setShelf(id,to); sheetBook(id); render(); undoable(a==="finishbook"?`Finished ${S.books[id].title}`:`Moved to ${SHELF_LABEL[to]}`,before); break; }
    case "rate": { const b=S.books[id], i=+el.dataset.i; b.rating=b.rating===i?i-.5:(b.rating===i-.5?0:i); save(); sheetBook(id); render(); break; }
    case "delbook": { if(el.dataset.confirm){ const before=snapshot(); delete S.books[id]; save(); closeSheet(); render(); undoable("Removed from library",before); } else { el.dataset.confirm="1"; const sp=el.querySelector("span"); if(sp) sp.textContent="Tap again"; else el.textContent="Tap again to remove"; } break; }
    case "addbook": sheetSearch("add"); if(el.dataset.reading){ const ns=$("#ns"); if(ns) ns.value="Reading"; } break;
    case "cover": sheetSearch("cover",id); break;
    case "dosearch": runSearch(el.dataset.mode,el.dataset.id); break;
    case "pickcover": { const r=searchResults[+el.dataset.i], b=S.books[id]; b.cu=r.cu; b.cuUser=true; delete tintCache[id]; save(); sheetBook(id); render(); toast("Cover changed"); break; }
    case "pickbook": { const r=searchResults[+el.dataset.i], ex=inLibrary(r); if(ex){ sheetBook(ex.id); break; }
      openSheet(head("Add to…")+`<div class="cbook">${r.cu?`<img class="cover lg img" src="${esc(r.cu)}" alt="">`:""}<div class="meta"><div class="btitle">${esc(r.title)}</div><div class="bauthor">${esc(r.author)}</div>${r.pages?`<div class="faint">${r.pages} pages</div>`:""}</div></div>
      <div class="stack" style="margin-top:16px">${[["Queue","Want to Read"],["Up Next","Up Next"],["Reading","Reading now"],["Read","Finished"]].map(([k,l])=>`<button class="btn ${k==="Queue"?"primary":""} wide" data-act="addas" data-s="${k}" data-i="${el.dataset.i}">${l}</button>`).join("")}</div>`); break; }
    case "addas": { const r=searchResults[+el.dataset.i], nid="b"+uid(), st=el.dataset.s, before=snapshot();
      S.books[nid]={...fromSeed({id:nid,t:r.title,a:r.author,p:r.pages||0,s:"Queue"}),isbn:r.isbn||"",cu:r.cu||"",cuUser:!!r.cu,added:todayKey(),fuzzy:""};
      if(st!=="Queue") setShelf(nid,st); save(); closeSheet(); libShelf=st; libQ=""; tab="library"; render(); undoable(`Added to ${SHELF_LABEL[st]}`,before); break; }
    case "savebook": { const t=$("#nt").value.trim(); if(!t){ toast("Add a title"); break; } const nid="b"+uid();
      S.books[nid]={...fromSeed({id:nid,t,a:$("#na").value.trim(),p:+$("#np").value||0,s:$("#ns").value}),added:todayKey(),fuzzy:""};
      if(S.books[nid].status==="Reading") S.books[nid].started=todayKey(); save(); closeSheet(); libShelf=S.books[nid].status; libQ=""; render(); toast("Added");
      if(S.timer&&S.timer.fresh&&!S.timer.bookId&&S.books[nid].status==="Reading"){ S.timer=null; startNow(nid); } break; }
    case "addsession": sessionForm(null,id,el.dataset.day); break;
    case "editsession": sessionForm(S.sessions.find(s=>s.id===id)); break;
    case "savesession": { const isNew=el.dataset.new==="true"; const s=isNew?{id,src:"manual"}:S.sessions.find(x=>x.id===id);
      const st=new Date($("#sstart").value); if(isNaN(st)){ toast("Pick a start time"); break; }
      if(st.getTime()>Date.now()){ toast("That start time is in the future"); break; }
      Object.assign(s,{bookId:$("#sbook").value,start:st.toISOString(),min:Math.max(1,+$("#smin").value||0),fromPage:+$("#sfrom").value||0,toPage:+$("#sto").value||0,note:$("#snote").value.trim()});
      if(isNew) S.sessions.push(s); const b=S.books[s.bookId]; if(b&&s.toPage>(b.page||0)) b.page=s.toPage;
      save(); closeSheet(); render(); toast(isNew?"Session added":"Saved"); break; }
    case "delsession": if(el.dataset.confirm){ S.sessions=S.sessions.filter(s=>s.id!==id); save(); closeSheet(); render(); toast("Deleted"); } else { el.dataset.confirm="1"; el.textContent="Tap again to delete"; } break;
    case "delact": if(el.dataset.confirm){ S.activity=S.activity.filter(x=>x.id!==id); save(); closeSheet(); render(); toast("Removed"); } else { el.dataset.confirm="1"; el.textContent="Tap again"; } break;
    case "goaltype": S.settings.goalType=el.dataset.g; logGoal(); save(); sheetStreak(); render(); break;
    case "goalstep": { const i=$("#sgoal"); i.value=Math.max(5,(+i.value||0)+ +el.dataset.d); const k=S.settings.goalType==="pages"?"dailyPages":"dailyMin"; S.settings[k]=+i.value; logGoal(); save(); render(); break; }
    case "theme": S.settings.theme=el.dataset.t; applyTheme(); save(); document.querySelectorAll('[data-act="theme"]').forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===S.settings.theme)); break;
    case "savesettings": S.settings.yearGoal=Math.max(0,+$("#syear").value||0); S.settings.idleMin=Math.max(15,+$("#sidle").value||90); save(); closeSheet(); render(); toast("Saved"); break;
    case "export": { const txt=exportText(); try{ await navigator.clipboard.writeText(txt); toast("Backup copied"); }catch(err){ $("#importbox").hidden=false; $("#imp").value=txt; $("#imp").select(); toast("Select all and copy"); } break; }
    case "importshow": $("#importbox").hidden=false; $("#imp").value=""; $("#imp").focus(); break;
    case "import": try{ importText($("#imp").value); closeSheet(); render(); toast("Library restored: "+Object.keys(S.books).length+" books"); }catch(err){ toast("That isn’t a Read backup"); } break;
    case "startempty": S.startedEmpty=true; save(); render(); break;
    case "openrt": openRT(); break;
    case "startbook": closeSheet(); startNow(id); break;
    case "startnow": startNow(); break;
    case "rtclose": closeRT(); break;
    case "rtdim": dim=!dim; drawRT(); break;
    case "rtpick": pickBookSheet(); break;
    case "rtsetbook": if(!S.timer||S.timer.fresh){ S.timer=null; closeSheet(); if(S.books[id].status!=="Reading") setShelf(id,"Reading"); startNow(id); break; } S.timer.bookId=id; S.lastBook=id; save(); closeSheet(); drawRT(); break;
    case "rtstart": if(!S.timer.bookId){ pickBookSheet(); break; } Object.assign(S.timer,{fresh:false,paused:false,runFrom:Date.now(),startedAt:Date.now(),accum:0,idle:false}); save();
      if(!wake&&"wakeLock" in navigator) getWake(true); drawRT(); break;
    case "rtpause": { const t=S.timer; if(t.paused){ t.paused=false; t.idle=false; t.runFrom=Date.now(); } else { t.accum+=Date.now()-t.runFrom; t.paused=true; } save(); drawRT(); break; }
    case "rtfinish": if(timerMs()<60000){ openSheet(head("Keep going?")+`<p class="sub" style="margin-top:0">Sessions under a minute aren’t saved.</p><button class="btn primary wide" data-act="rtkeep">Keep reading</button><button class="btn danger wide" style="margin-top:8px" data-act="discardnow">Discard session</button>`); } else finishRT(); break;
    case "rtkeep": { const t=S.timer; if(t.paused){ t.paused=false; t.idle=false; t.runFrom=Date.now(); save(); } closeSheet(); drawRT(); break; }
    case "discardnow": S.timer=null; save(); stopRain(); releaseWake(); closeSheet(); $("#rt").hidden=true; clearInterval(rtTick); render(); toast("Discarded"); break;
    case "rtrain": if(audio) stopRain(); else startRain(); drawRT(); break;
    case "rtwake": if(wake) releaseWake(); else await getWake(); drawRT(); break;
    case "endstep": { const i=$("#endpg"); i.value=Math.max(0,(+i.value||0)+ +el.dataset.d); break; }
    case "endfinished": { const b=S.books[S.timer.bookId]; $("#endpg").value=b.unit==="percent"?100:b.pages; el.dataset.done="1"; el.textContent="Marked finished"; el.disabled=true; break; }
    case "savert": { const t=S.timer, b=S.books[t.bookId], before=snapshot(); let mins=t.accum/60000; const em=$("#endmin"); if(em&&+em.value>0) mins=+em.value;
      if(mins<1){ toast("Under a minute, so nothing was saved"); S.timer=null; save(); closeSheet(); closeRT(); break; }
      const from=b?(b.page||0):0; let to=b?(+$("#endpg").value||from):0; if(b&&b.unit==="percent"&&b.pages) to=Math.round(Math.min(100,to)/100*b.pages); to=Math.max(from,to);
      S.sessions.push({id:uid(),bookId:t.bookId,start:new Date(t.startedAt).toISOString(),min:Math.round(mins*10)/10,fromPage:from,toPage:to,note:$("#endnote").value.trim(),src:"timer",idleTrim:!!t.idle});
      if(b){ b.page=to; if(b.status!=="Reading") setShelf(b.id,"Reading"); const fin=document.querySelector('[data-act="endfinished"][data-done]'); if(fin||(b.pages&&to>=b.pages)) setShelf(b.id,"Read"); }
      S.timer=null; if(b) S.lastBook=b.id; save(); stopRain(); releaseWake(); closeSheet(); $("#rt").hidden=true; clearInterval(rtTick); render();
      const st=streakInfo(); undoable(b&&b.status==="Read"?`Finished ${b.title}`:st.todayMet?`Goal met · ${st.cur} night${st.cur===1?"":"s"} in a row`:`${fmtMin(mins)} logged`,before,true); break; }
    case "discardrt": if(el.dataset.confirm){ S.timer=null; save(); stopRain(); releaseWake(); closeSheet(); $("#rt").hidden=true; clearInterval(rtTick); render(); toast("Discarded"); } else { el.dataset.confirm="1"; el.textContent="Tap again to discard"; } break;
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ if(!$("#sheet").hidden) closeSheet(); else if(!$("#rt").hidden) closeRT(); }
  if(e.key==="Enter"&&e.target.id==="sq"){ e.preventDefault(); const btn=document.querySelector('[data-act="dosearch"]'); if(btn) btn.click(); }
});
document.addEventListener("input",e=>{
  if(e.target.id==="sgoal"){ const v=Math.max(1,+e.target.value||0); if(v){ S.settings[S.settings.goalType==="pages"?"dailyPages":"dailyMin"]=v; logGoal(); save(); render(); } return; }
  if(e.target.id==="sq"){ clearTimeout(runSearch._t); const btn=document.querySelector('[data-act="dosearch"]'); if(btn) runSearch._t=setTimeout(()=>runSearch(btn.dataset.mode,btn.dataset.id),400); return; }
  if(e.target.id==="libq"){ libQ=e.target.value; const pos=e.target.selectionStart; render(); const i=$("#libq"); i.focus(); i.setSelectionRange(pos,pos); return; }
  const f=e.target.dataset.field; if(f){ const b=S.books[e.target.dataset.id]; b[f]=f==="pages"?(+e.target.value||0):e.target.value; save(); }
});
document.addEventListener("change",e=>{ if(e.target.id==="sbook"&&$("#sfrom")){ const b=S.books[e.target.value]; if(b){ $("#sfrom").value=b.page||0; $("#sto").value=b.page||0; } return; }
  if(e.target.id==="libsort"){ libSort=e.target.value; render(); } else if(e.target.dataset.field) render(); });
document.querySelectorAll("nav.tabs [data-tab]").forEach(b=>b.addEventListener("click",()=>{ tab=b.dataset.tab; render(); scrollTo(0,0); }));
$("#readbtn").addEventListener("click",()=>startNow());
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ idleCheck(); if(!$("#rt").hidden){ drawRT(); if(S.timer&&!S.timer.paused&&!wake&&"wakeLock" in navigator) getWake(true); } else render(); } });

load(); applyTheme(); idleCheck(); render();
if(S.timer&&!S.timer.fresh) rtTick=setInterval(tickRT,1000);
setInterval(()=>{ if(tab==="today"&&$("#rt").hidden&&$("#sheet").hidden&&!S.timer) render(); },60000);
if(BUILD==="public"&&"serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
