    case "awake": S.settings.awake=S.settings.awake===false; save(); if(S.settings.awake!==false) getWake(); else releaseWake(); renderPlayer(); break;
    case "dim": S.settings.dim=!S.settings.dim; save(); renderPlayer(); break;
    case "clock": S.settings.preciseClock=!S.settings.preciseClock; save(); lastText=""; tick(); haptic(); break;
    case "changebook": closePlayer(); setTimeout(()=>sheetPick(bid=>{ closeSheet(true); switchBook(bid); setTimeout(openPlayer,200); },"Change Book"),200); break;
    case "pickbook": if(sheet&&sheet.onPick) sheet.onPick(id); break;
    case "endedit": F.edit=F.edit===el.dataset.e?"":el.dataset.e; refreshSheet(); if(F.edit==="progress") setTimeout(()=>{ const i=sheet&&sheet.el.querySelector('input[data-f="to"]'); if(i) i.focus(); },60); break;
    case "endmin": F.min=Math.max(1,F.min+ +el.dataset.d); refreshSheet(); break;
    case "savesession": saveSession(); break;
    case "discardsession": alertCard({title:"Discard this session?",message:"It won’t count toward tonight.",buttons:[{label:"Discard Session",style:"red",fn:discardSession},{label:"Keep editing",style:"dark",cancel:true}]}); break;
    case "progress": sheetProgress(id); break;

    case "fav": { const b=S.books[id]; b.fav=!b.fav; save(); haptic(); update(); toast(b.fav?"Added to Favorites":"Removed from Favorites"); break; }
    case "shelfmenu": sheetShelf({id}); break;
    case "finish": case "stop": case "startbook": case "setshelf": case "unfinish": case "remove": case "dates": case "ratesheet": case "lengthfmt": case "cover":
      runTile({act:a,v:el.dataset.v},id); break;
    case "rate": { const b=S.books[id], v=+el.dataset.v; b.rating=b.rating===v?v-.5:b.rating===v-.5?0:v; save(); haptic(); update(); break; }
    case "readmore": { const e2=topE(); e2.params.more=true; renderEntry(e2); break; }
    case "allsess": { const e2=topE(); e2.params.allsess=true; renderEntry(e2); break; }

    case "saverec": { const b=S.books[F.id]; b.recBy=(F.rec||"").trim(); save(); closeSheet(true); update(); break; }

    case "sort": { const cs=colState[el.dataset.k]; popMenu(el,[{title:"Sort",items:SORTS.map(([k,l,ic])=>({label:l,icon:typeof I[ic]==="function"?I[ic](false):I[ic],on:cs.sort===k,fn:()=>{ cs.sort=k; if(k==="color") warmTints(); renderEntry(topE()); }}))}]); break; }
    case "showonly": { const cs=colState[el.dataset.k]; const opts=[["all","All Items"],["Reading","Currently Reading"],["Up Next","Up Next"],["Queue","Want to Read"],["Read","Finished"],["Paused","Stopped"],["DNF","Did Not Finish"]];
      popMenu(el,[{title:"Show Only",items:opts.map(([k,l])=>({label:l,on:cs.show===k,fn:()=>{ cs.show=k; renderEntry(topE()); }}))}]); break; }
    case "searchmode": searchMode=el.dataset.m; renderEntry(topE()); if(searchMode==="catalog"&&searchQ.trim()) runSearch(); break;
    case "clearsearch": searchQ=""; searchRes=null; renderEntry(topE()); { const i=$("#sq"); if(i) i.focus(); } break;
    case "catmenu": sheetShelf({r:searchRes.items[+el.dataset.i]}); break;
    case "catopen": { const r=searchRes.items[+el.dataset.i], have=inLibrary(r); if(have) push("book",{id:have.id}); else sheetShelf({r}); break; }
    case "addmenu-lib": sheetShelf({id}); break;
    case "manualadd": { const before=snapshot(), nid=addFromResult({title:searchQ.trim(),author:"",cu:""},"Queue"); save(); update(); push("book",{id:nid}); undoable("Added to Want to Read",before); setTimeout(()=>sheetLength(nid),400); break; }
    case "calprev": case "calnext": { const [y,m]=calMonth.split("-").map(Number), d=new Date(y,m-1+(a==="calnext"?1:-1),1); calMonth=d.getFullYear()+"-"+pad(d.getMonth()+1); renderEntry(topE()); break; }
    case "day": sheetDay(el.dataset.k); break;
    case "statsrange": statsRange=el.dataset.r; renderEntry(topE()); break;
    case "addsession": sheetSessionForm(null,{day:el.dataset.k}); break;
    case "editsession": sheetSessionForm(id); break;
    case "savepast": savePast(); break;
    case "delsession": { const before=snapshot(); S.sessions=S.sessions.filter(x=>x.id!==F.id); save(); closeSheet(true); update(); undoable("Session deleted",before); break; }
    case "actmenu": { const act=S.activity.find(x=>x.id===id); alertCard({title:"Remove this entry?",message:"It comes off that night in your log.",buttons:[{label:"Remove",style:"red",fn:()=>{ const before=snapshot(); S.activity=S.activity.filter(x=>x.id!==id); save(); update(); undoable("Removed",before); }},{label:"Cancel",style:"dark",cancel:true}]}); break; }
    case "goaltype": S.settings.goalType=el.dataset.g; logGoal(); save(); haptic(); update(); break;
    case "goalstep": { const s=S.settings, k=s.goalType==="pages"?"dailyPages":"dailyMin"; s[k]=Math.max(5,Math.min(600,(+s[k]||20)+ +el.dataset.d)); logGoal(); save(); update(); break; }
    case "theme": S.settings.theme=el.dataset.v; save(); applyTheme(); update(); break;
    case "backup": doBackup(); break;
    case "copybackup": if(sheet&&sheet.copy) sheet.copy(); break;
    case "restore": sheetRestore(); break;
    case "dorestore": { if(!(F.txt||"").trim()){ toast("Paste a backup first"); break; } alertCard({title:"Replace this library?",message:"The backup replaces every book and session on this device.",buttons:[{label:"Restore",style:"red",fn:()=>{ try{ importText(F.txt); closeSheet(true); rebuildAll(); toast("Library restored"); }catch(err){ toast("That isn’t a Read backup"); } }},{label:"Cancel",style:"dark",cancel:true}]}); break; }
  }
});
function runTile(t,id){ const b=S.books[id], before=snapshot();
  switch(t.act){
    case "progress": sheetProgress(id); break;
    case "finish": finishBook(id); break;
    case "stop": setShelf(id,"Paused"); update(); undoable("Moved to Stopped Reading",before); break;
    case "startbook": startBook(id); break;
    case "setshelf": setShelf(id,t.v); update(); undoable("Moved to "+COLL[t.v].label,before); break;
    case "unfinish": b.status="Reading"; b.finished=""; save(); update(); undoable("Back to Currently Reading",before); break;
    case "remove": removeBook(id); break;
    case "dates": sheetDates(id); break;
    case "ratesheet": sheetRate(id); break;
    case "lengthfmt": sheetLength(id); break;
    case "cover": sheetCover(id); break;
  } }

let sTimer=0, sSeq=0;
function runSearch(){ const q=searchQ.trim(), seq=++sSeq; if(!q){ searchRes=null; renderEntry(topE()); return; }
  searchBusy=true; searchBooks(q).then(items=>{ if(seq!==sSeq) return; const seen=new Set(); items=items.filter(r=>{ const k=(r.title+"|"+r.author).toLowerCase(); if(seen.has(k)) return false; seen.add(k); return true; });
    searchRes={items:items.slice(0,24)}; }).catch(()=>{ if(seq===sSeq) searchRes={items:[],error:true}; }).finally(()=>{ if(seq!==sSeq) return; searchBusy=false; if(tab==="search") renderEntry(topE("search")); else stacks.search.forEach(e=>e.dirty=true); }); }
document.addEventListener("input",e=>{ const t=e.target;
  if(t.id==="sq"){ searchQ=t.value; clearTimeout(sTimer); if(searchMode==="catalog"&&searchQ.trim()){ searchRes=searchRes&&searchQ.trim()?searchRes:null; sTimer=setTimeout(runSearch,280); } renderEntry(topE()); }
  else if(t.dataset.colq!=null){ colState[t.dataset.colq].q=t.value; renderEntry(topE()); }
});
document.addEventListener("change",e=>{ const t=e.target;
  if(t.dataset.note!=null){ const b=S.books[t.dataset.note]; if(b){ b.notes=t.value; save(); } }
  else if(t.dataset.set){ const k=t.dataset.set; if(t.type==="checkbox") S.settings[k]=t.checked; else S.settings[k]=Math.max(+t.min||1,Math.min(+t.max||999,+t.value||0)); save(); update(); }
  else if(t.id==="restorefile"&&t.files[0]){ t.files[0].text().then(x=>{ F.txt=x; refreshSheet(); }); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.matches('input[data-f="cur"]')){ e.preventDefault(); saveProgress(); }
  if(e.key==="Escape"){ if(sheet) closeSheet(); else if(playerOpen) closePlayer(); else if(stacks[tab].length>1) pop(); } });

function warmTints(){ const ids=Object.keys(S.books).filter(id=>!tintCache[id]&&coverSrc(S.books[id])); let i=0;
  const next=()=>{ const batch=ids.slice(i,i+12); i+=12; if(!batch.length){ saveTints(); if(topE().route==="coll") renderEntry(topE()); return; } let n=batch.length; batch.forEach(id=>tintFor(S.books[id],()=>{ if(--n===0) setTimeout(next,0); })); };
  next(); }
function saveTints(){ try{ localStorage.setItem("read_tints",JSON.stringify(tintCache)); }catch(e){} }
function loadTints(){ try{ Object.assign(tintCache,JSON.parse(localStorage.getItem("read_tints")||"{}")); }catch(e){} }

function rebuildAll(){ TABS.forEach(t=>{ stacks[t].forEach(e=>e.el.remove()); stacks[t]=[]; }); TABS.forEach(t=>{ const e={tab:t,route:t,params:{}}; stacks[t].push(e); mount(e,0); }); paintTabbar(); renderMini(); }

function boot(){
  load(); loadTints(); applyTheme();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme);
  rebuildAll();
  initSwipeBack(); initLongPress(); initPlayerDrag();
  document.querySelectorAll(".tabbar [data-tab]").forEach(b=>b.addEventListener("click",()=>switchTab(b.dataset.tab)));
  $("#player .ringwrap").addEventListener("click",()=>{ S.settings.preciseClock=!S.settings.preciseClock; save(); lastText=""; tick(); haptic(); });
  if(S.timer){ idleCheck(); renderMini(); if(S.timer.idle) setTimeout(idlePrompt,500); }
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ if(S.timer){ if(idleCheck()) idlePrompt(); tick(); if(playerOpen&&S.settings.awake!==false) getWake(); } update(); } });
  setInterval(()=>{ if(!S.timer&&document.visibilityState==="visible"){ const k=todayKey(); if(k!==boot._day){ boot._day=k; update(); } } },60000); boot._day=todayKey();
  if(BUILD==="public"&&"serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
}
boot();

</script>
