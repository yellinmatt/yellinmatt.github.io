<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Read</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob: https://*.mzstatic.com https://covers.openlibrary.org https://archive.org https://*.archive.org; connect-src https://itunes.apple.com https://openlibrary.org; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Read">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1A1819">
<style>
:root{
  --bg:#1A1819; --card:#242122; --card2:#2F2B2B; --raise:#3A3536; --scene:#2F2B2B; --track:#201E1F;
  --ink:#F7F4F0; --sub:#A39E99; --faint:#78726E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --accent:#1DB49D; --accent-ink:#06231E; --accent-soft:rgba(29,180,157,.16);
  --light:#E6E2DD; --light-ink:#1A1819; --red:#A8282E; --red-ink:#fff; --flame:#1DB49D;
  --paper:#F1EADD; --paper-ink:#2A2421; --paper-sub:#7B6F65;
  --glass:rgba(38,35,36,.78); --scrim:rgba(0,0,0,.5);
  --serif:"Iowan Old Style","Palatino","Charter",ui-serif,Georgia,serif;
  --sans:"Avenir Next","Avenir",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --ease:cubic-bezier(.32,.72,0,1); --out:cubic-bezier(.2,.8,.2,1);
  --tabh:64px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
:root[data-theme="paper"]{
  --bg:#F4EFE7; --card:#FFFCF7; --card2:#EAE3D8; --raise:#E0D8CB; --scene:#3A3434; --track:#2A2526;
  --ink:#231E1B; --sub:#6E655E; --faint:#9A9089; --line:rgba(40,30,20,.09); --line2:rgba(40,30,20,.16);
  --accent:#118F7C; --accent-ink:#fff; --accent-soft:rgba(17,143,124,.12);
  --light:#231E1B; --light-ink:#FFFCF7; --red:#B3262D; --glass:rgba(250,246,240,.82); --scrim:rgba(30,20,10,.35);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font:400 16px/1.38 var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{font:inherit;color:inherit;-webkit-user-select:text;user-select:text;font-size:17px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif)}
.sub{color:var(--sub)} .faint{color:var(--faint)}
.caps{font:600 11.5px/1.2 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--sub)}
svg{display:block}
.press,button,[data-act],[data-push]{transition:transform .14s var(--out),opacity .14s,background-color .2s}
@media (hover:none){ button:active,[data-act]:active,[data-push]:active{transform:scale(.97);opacity:.85} .noscale:active{transform:none!important} }
@media (hover:hover){ [data-act]:hover,[data-push]:hover{opacity:.88} }

#app{position:fixed;inset:0;overflow:hidden}
.tabview{position:absolute;inset:0;display:none}
.tabview.on{display:block}
.tabview.fadein{animation:tvfade .2s var(--out)}
@keyframes tvfade{from{opacity:.4}to{opacity:1}}
.screen{position:absolute;inset:0;background:var(--bg);overflow:hidden;will-change:transform}
.screen.below{visibility:hidden}
.screen .scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;
  padding:calc(var(--safe-t) + 52px) 0 calc(var(--tabh) + var(--safe-b) + 40px)}
body.hasmini .screen .scroll{padding-bottom:calc(var(--tabh) + var(--safe-b) + 112px)}
.inner{max-width:600px;margin:0 auto;padding:0 16px}
.navbar{position:absolute;z-index:5;top:0;left:0;right:0;height:calc(var(--safe-t) + 52px);padding:var(--safe-t) 12px 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  background:transparent;transition:background-color .2s,box-shadow .2s}
.screen.compact .navbar{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);box-shadow:0 .5px 0 var(--line2)}
.navbar .nt{font:600 16px/1 var(--sans);opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.screen.compact .navbar .nt{opacity:1;transform:none}
.navbar .nl{justify-self:start;display:flex;gap:8px}
.navbar .nr{justify-self:end;display:flex;gap:8px;align-items:center}
.navbtn{height:38px;min-width:38px;border-radius:19px;display:inline-flex;align-items:center;justify-content:center;gap:4px;background:var(--glass);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:inset 0 0 0 .5px var(--line2);color:var(--ink)}
.navbtn svg{width:20px;height:20px}
.navbtn.back span{display:none}
.navbtn.pill{padding:0 15px;font:600 15px/1 var(--sans)}
.navbtn.circ{width:38px;padding:0}
.navbtn.plain{background:none;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}

.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:2px 0 16px;min-height:40px}
.phead h1{font:600 30px/1.1 var(--serif);margin:0;letter-spacing:-.01em}
.phead .date{display:block;margin-bottom:2px}
.phead .tools{display:flex;gap:8px;align-items:center}
.streakbtn{height:38px;display:inline-flex;align-items:center;gap:5px;padding:0 10px;border-radius:12px;color:var(--accent);font:700 17px/1 var(--sans)}
.streakbtn svg{width:19px;height:19px}
.streakbtn.off{color:var(--sub)}
.sqbtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--line2);color:var(--ink)}
.sqbtn svg{width:20px;height:20px}
.sec{display:flex;align-items:center;gap:6px;font:600 20px/1.2 var(--serif);margin:26px 0 12px;color:var(--ink)}
.sec .chev{width:7px;height:12px;color:var(--faint)}
.sec small{font:500 14px var(--sans);color:var(--sub);margin-left:auto}

.tabbar{position:fixed;z-index:30;left:0;right:0;bottom:0;padding:0 16px calc(var(--safe-b) + 10px);display:flex;gap:10px;align-items:flex-end;justify-content:space-between;pointer-events:none;
  max-width:600px;margin:0 auto}
.tabbar .pillbar{pointer-events:auto;flex:0 1 270px;height:var(--tabh);border-radius:32px;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(1.7);backdrop-filter:blur(26px) saturate(1.7);
  box-shadow:inset 0 0 0 .5px var(--line2),0 8px 30px rgba(0,0,0,.35);display:grid;grid-template-columns:repeat(3,1fr);padding:5px;position:relative}
.tabbar .pillbar .hl{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/3);border-radius:27px;background:rgba(255,255,255,.1);transition:transform .38s var(--ease)}
:root[data-theme="paper"] .tabbar .pillbar .hl{background:rgba(0,0,0,.07)}
.tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 10.5px/1 var(--sans);color:var(--sub);border-radius:27px}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar button i{width:24px;height:24px;display:block}
.tabbar button i svg{width:24px;height:24px}
.tabbar .searchtab{pointer-events:auto;width:var(--tabh);height:var(--tabh);border-radius:50%;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(1.7);backdrop-filter:blur(26px) saturate(1.7);
  box-shadow:inset 0 0 0 .5px var(--line2),0 8px 30px rgba(0,0,0,.35)}
.tabbar .searchtab[aria-current="page"]{background:var(--raise)}
body.playing .tabbar{transform:translateY(130%);transition:transform .35s var(--ease)}
.tabbar{transition:transform .35s var(--ease)}

.mini{position:fixed;z-index:29;left:12px;right:12px;max-width:576px;margin:0 auto;bottom:calc(var(--safe-b) + var(--tabh) + 18px);height:64px;border-radius:20px;background:var(--card);
  box-shadow:inset 0 0 0 .5px var(--line2),0 10px 30px rgba(0,0,0,.4);display:flex;align-items:center;gap:12px;padding:0 10px;transform:translateY(160%);opacity:0;transition:transform .42s var(--ease),opacity .25s}
.mini.on{transform:none;opacity:1}
.mini .cover{width:34px;height:51px;border-radius:3px;flex:none}
.mini .mt{flex:1;min-width:0}
.mini .mt b{display:block;font:600 15px/1.2 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mt span{font:500 13px/1.3 var(--sans);color:var(--accent)}
.mini .mt span.paused{color:var(--sub)}
.rbtn{width:42px;height:42px;border-radius:50%;background:var(--card2);display:grid;place-items:center;flex:none;color:var(--ink)}
.rbtn svg{width:16px;height:16px}

.cover{display:block;border-radius:3px;object-fit:cover;background:var(--card2);aspect-ratio:2/3;overflow:hidden;position:relative;
  box-shadow:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.25)}
div.cover{display:flex;align-items:flex-end;padding:10%;color:rgba(255,255,255,.92);font:600 11px/1.15 var(--serif)}
div.cover span{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.cover.fill{width:100%;height:auto}

.tonight{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:inset 0 0 0 .5px var(--line)}
.tonight .tag{font:700 10.5px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:4px 7px;border-radius:6px;flex:none}
.tonight .tag.done{background:var(--card2);color:var(--accent)}
.tonight b{font:600 15px/1.2 var(--sans);display:block}
.tonight span{font-size:13px;color:var(--sub)}
.tonight .chev{margin-left:auto;color:var(--faint)}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 4px;scroll-padding:0 16px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.ccard{flex:0 0 calc(100% - 40px);max-width:420px;scroll-snap-align:start;display:flex;gap:14px;padding:0}
.ccard .cv{flex:0 0 46%;max-width:170px}
.ccard .cv .cover{width:100%;border-radius:4px}
.ccard .info{flex:1;min-width:0;display:flex;flex-direction:column;padding-top:2px}
.ccard .t{font:600 15.5px/1.25 var(--sans);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ccard .a{font-size:14px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard .pct{display:flex;align-items:baseline;justify-content:space-between;margin-top:14px}
.ccard .pct b{font:700 17px/1 var(--sans)}
.ccard .pct span{font:600 12px/1 var(--sans);color:var(--sub)}
.ccard .pct span small{font-size:9.5px;letter-spacing:.06em;margin-left:3px}
.pbar{height:4px;border-radius:2px;background:var(--card2);margin-top:8px;position:relative}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--accent);min-width:4px;transition:width .5s var(--out)}
.pbar i::after{content:"";position:absolute;right:-4px;top:-2px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.obtn{display:flex;align-items:center;gap:9px;height:40px;padding:0 12px;border-radius:11px;box-shadow:inset 0 0 0 1.5px var(--line2);font:600 14.5px/1 var(--sans);margin-top:10px;color:var(--ink);width:100%}
.obtn svg{width:18px;height:18px;flex:none}
.obtn.go{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.obtn.live{color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ptile{background:var(--card);border-radius:16px;padding:12px 12px 0;min-height:150px;overflow:hidden;position:relative;box-shadow:inset 0 0 0 .5px var(--line);text-align:left;display:block;width:100%}
.ptile h3{margin:0;font:600 16.5px/1.2 var(--serif);display:flex;align-items:center;gap:5px}
.ptile h3 .chev{width:7px;height:12px;color:var(--faint)}
.ptile .fan{position:relative;height:104px;margin-top:12px}
.ptile .fan .cover{position:absolute;width:62px;bottom:-6px}
.ptile .big{font:700 34px/1 var(--sans);margin-top:16px}
.ptile .lbl{font-size:13px;color:var(--sub);margin-top:4px}
.chal{background:var(--card);border-radius:16px;padding:14px;box-shadow:inset 0 0 0 .5px var(--line)}
.chal .row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.chal b{font:700 22px/1 var(--sans)}
.chal .bar2{height:8px;border-radius:4px;background:var(--card2);margin:12px 0 4px;position:relative;overflow:visible}
.chal .bar2 i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.chal .bar2 u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px;opacity:.7}
.chal .strip{display:flex;gap:6px;margin-top:12px;overflow:hidden}
.chal .strip .cover{width:38px;flex:none}

.rows{background:transparent}
.lrow{display:flex;align-items:center;gap:14px;width:100%;padding:12px 2px;text-align:left;min-height:56px}
.lrow .ic{width:24px;display:grid;place-items:center;color:var(--ink)}
.lrow .ic svg{width:21px;height:21px}
.lrow .tx{flex:1;min-width:0}
.lrow .tx b{display:block;font:600 17px/1.2 var(--sans)}
.lrow .tx span{font-size:13px;color:var(--sub)}
.lrow .chev{width:8px;height:14px;color:var(--faint)}
.lrow .arrow{color:var(--sub)}
.grouphead{margin:24px 2px 4px;display:flex;align-items:center;justify-content:space-between}

.group{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:inset 0 0 0 .5px var(--line)}
.cell{display:flex;align-items:center;gap:12px;min-height:50px;padding:10px 14px;width:100%;text-align:left;position:relative}
.cell+.cell::before{content:"";position:absolute;top:0;left:14px;right:0;height:.5px;background:var(--line2)}
.cell .k{flex:1;min-width:0;font-size:16px}
.cell .v{color:var(--sub);font-size:16px;text-align:right}
.cell .chev{width:7px;height:12px;color:var(--faint)}
.cell input[type=number],.cell input[type=text],.cell input[type=date],.cell input[type=time],.cell select{background:none;border:0;text-align:right;color:var(--sub);font-size:17px;max-width:55%;padding:0}
.cell input:focus{color:var(--ink);outline:none}
.gfoot{font-size:13px;color:var(--sub);margin:8px 14px 0}
.ghead{margin:22px 14px 7px}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card2);border-radius:10px;padding:2px;position:relative}
.seg button{height:34px;border-radius:8px;font:600 14px/1 var(--sans);color:var(--sub);position:relative;z-index:1}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.25)}
:root[data-theme="paper"] .seg button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:16px;background:var(--card2);transition:background .2s;pointer-events:none}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .25s var(--ease)}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::after{transform:translateX(20px)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:12px;font:600 16px/1 var(--sans);background:var(--light);color:var(--light-ink)}
.btn.red{background:var(--red);color:#fff}
.btn.dark{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line2)}
.btn.teal{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4}
.btn svg{width:18px;height:18px}
.stack{display:grid;gap:10px}

.chead{display:flex;align-items:flex-end;gap:12px;margin:4px 0 14px}
.chead .ic{width:30px;height:30px;color:var(--ink);margin-bottom:4px}
.chead .ic svg{width:28px;height:28px}
.chead h1{font:600 30px/1.05 var(--serif);margin:6px 0 2px}
.chead span{font-size:13px;color:var(--sub)}
.toolrow{display:flex;gap:10px;margin-bottom:16px;align-items:center}
.toolrow .tb{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:inset 0 0 0 .5px var(--line2);color:var(--ink)}
.toolrow .tb[aria-pressed="true"]{background:var(--light);color:var(--light-ink)}
.toolrow .tb svg{width:19px;height:19px}
.toolrow .sp{flex:1}
.toolrow .count{font-size:13px;color:var(--sub)}
.filterfield{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:0 12px;height:42px;margin-bottom:14px;box-shadow:inset 0 0 0 .5px var(--line2)}
.filterfield svg{width:17px;height:17px;color:var(--faint);flex:none}
.filterfield input{flex:1;background:none;border:0;outline:none;min-width:0;height:100%}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 12px}
.gcell{display:block;text-align:left;min-width:0;position:relative}
.gcell .cover{width:100%;border-radius:3px}
.gcell .gp{height:3px;border-radius:2px;background:var(--card2);margin-top:6px;overflow:hidden}
.gcell .gp i{display:block;height:100%;background:var(--accent)}
.gcell .badge{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center;color:#fff}
.gcell .badge svg{width:13px;height:13px}
.brow{display:flex;gap:14px;align-items:center;padding:9px 0;width:100%;text-align:left}
.brow .cover{width:46px;flex:none;border-radius:3px}
.brow .tx{flex:1;min-width:0}
.brow b{display:block;font:600 16px/1.25 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow span{display:block;font-size:13.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .st{font-size:12.5px;color:var(--faint);margin-top:2px}
.brow .more{width:34px;height:34px;border-radius:50%;background:var(--card2);display:grid;place-items:center;flex:none;color:var(--ink)}
.brow .more svg{width:16px;height:16px}
.brow .owned{width:20px;height:20px;border-radius:50%;background:var(--sub);color:var(--bg);display:grid;place-items:center;flex:none}
.brow .owned svg{width:12px;height:12px}
.yearhead{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 12px}
.yearhead b{font:600 21px/1 var(--serif)}
.yearhead span{font-size:13.5px;color:var(--sub)}
.yearhead span.met{color:var(--accent)}
.empty{text-align:center;color:var(--sub);padding:44px 24px;font-size:15px}
.empty b{display:block;color:var(--ink);font:600 19px/1.3 var(--serif);margin-bottom:6px}

.bookpage .scroll{padding-top:0}
.bhead{position:relative;margin:0 -16px;padding:calc(var(--safe-t) + 60px) 16px 18px;background:var(--tint,var(--card2));transition:background-color .4s}
.bhead::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.28));pointer-events:none}
:root[data-theme="paper"] .bhead::after{background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.12))}
.bhead>*{position:relative;z-index:1}
.bhead .bcv{width:132px;margin:0 auto 18px}
.bhead .bcv .cover{width:100%;border-radius:4px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.bhead .btitle{display:flex;gap:12px;align-items:flex-start}
.bhead h1{flex:1;font:700 22px/1.2 var(--sans);margin:0;color:#fff}
.bhead .by{font:500 15px/1.3 var(--sans);color:rgba(255,255,255,.82);margin-top:3px}
.bhead .side{display:flex;flex-direction:column;gap:8px}
.bhead .side button{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.28);display:grid;place-items:center;color:#fff}
.bhead .side button svg{width:17px;height:17px}
.bhead .side button[aria-pressed="true"]{background:#fff;color:#1a1819}
.chips{display:flex;gap:18px;margin-top:14px;overflow-x:auto;scrollbar-width:none;font:600 12.5px/1 var(--sans);color:rgba(255,255,255,.85)}
.chips span{white-space:nowrap;padding-bottom:6px}
.bstate{display:flex;gap:10px;margin:16px 0 0}
.bstate .btn{height:46px}
.hcard{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:12px;box-shadow:inset 0 0 0 .5px var(--line);width:100%;text-align:left}
.hcard .cover{width:44px;flex:none;border-radius:2px}
.hcard b{display:block;font:600 15.5px/1.25 var(--sans)}
.hcard span{display:block;font-size:13.5px;color:var(--sub);line-height:1.35}
.hcard+.hcard{margin-top:8px}
.tiles-x{display:flex;gap:10px;overflow-x:auto;margin:16px -16px 0;padding:0 16px 4px;scrollbar-width:none}
.tiles-x::-webkit-scrollbar{display:none}
.atile{flex:0 0 74px;display:flex;flex-direction:column;align-items:center;gap:8px;font:500 12.5px/1.2 var(--sans);color:var(--ink);text-align:center}
.atile i{width:74px;height:74px;border-radius:16px;background:var(--card);display:grid;place-items:center;box-shadow:inset 0 0 0 .5px var(--line2)}
.atile i svg{width:25px;height:25px}
.atile.red i{color:#FF6B66}
.atile.on i{background:var(--light);color:var(--light-ink)}
.quote{background:var(--card);border-radius:14px;padding:16px 18px;font:400 16px/1.5 var(--serif);color:var(--ink);box-shadow:inset 0 0 0 .5px var(--line)}
.quote.clamp p{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.quote p{margin:0}
.quote button{margin-top:8px}
.stars{display:flex;gap:4px;color:#F2B544}
.stars button{width:38px;height:38px;display:grid;place-items:center}
.stars svg{width:28px;height:28px}
.notes{width:100%;min-height:110px;background:var(--card);border:0;border-radius:14px;padding:14px;color:var(--ink);resize:vertical;outline:none;box-shadow:inset 0 0 0 .5px var(--line)}
.dtiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dtile{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:inset 0 0 0 .5px var(--line)}
.dtile b{display:block;font:700 22px/1.1 var(--sans);margin-top:6px}
.dtile span{font-size:12.5px;color:var(--sub)}

.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:inset 0 0 0 .5px var(--line)}
.card+.card{margin-top:12px}
.card h3{margin:0 0 10px;font:600 18px/1.2 var(--serif);display:flex;align-items:center;justify-content:space-between}
.card h3 small{font:500 13px var(--sans);color:var(--sub)}
.monthcard{background:var(--paper);color:var(--paper-ink);border-radius:18px;padding:16px;position:relative;overflow:hidden}
.monthcard .mh{display:flex;align-items:center;justify-content:space-between}
.monthcard .mh b{font:600 24px/1 var(--serif)}
.monthcard .mh button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--paper-ink)}
.monthcard .mh button:disabled{opacity:.25}
.monthcard .mh svg{width:18px;height:18px}
.msum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0 6px}
.msum div{display:flex;flex-direction:column}
.msum b{font:700 20px/1.1 var(--sans)}
.msum span{font:600 10.5px/1.3 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--paper-sub)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cal .dow{font:600 11px/1 var(--sans);text-align:center;color:var(--paper-sub);padding:4px 0}
.cal button{aspect-ratio:2/3;border-radius:5px;background:rgba(0,0,0,.05);position:relative;overflow:hidden;font:600 11px/1 var(--sans);color:var(--paper-sub)}
.cal button span{position:absolute;top:4px;left:5px;z-index:2}
.cal button.has span{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.cal button.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal button .cover{position:absolute;inset:0;width:100%;height:100%;border-radius:0;box-shadow:none}
.cal button .cover.second{inset:auto 0 0 auto;width:55%;height:55%;border-top-left-radius:3px;box-shadow:-1px -1px 0 rgba(255,255,255,.5)}
.cal button.met:not(.has)::after{content:"";position:absolute;left:50%;top:60%;width:6px;height:6px;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%)}
.cal .pad{visibility:hidden}
.monthcard .btn{margin-top:14px;background:var(--paper-ink);color:var(--paper)}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.big3 b{display:block;font:700 22px/1.1 var(--sans)}
.big3 span{font-size:12.5px;color:var(--sub)}
.hb{display:grid;grid-template-columns:minmax(0,38%) 1fr auto;gap:10px;align-items:center;font-size:14px;padding:4px 0}
.hb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb i{height:8px;border-radius:4px;background:var(--accent);width:var(--w)}
.hb b{font-weight:600;font-variant-numeric:tabular-nums}
.dots{display:grid;grid-template-columns:14px repeat(24,1fr);gap:2px;align-items:center}
.dots span{font-size:10px;color:var(--faint)}
.dots i{aspect-ratio:1;border-radius:50%;background:var(--card2)}
.dots i.l1{background:rgba(29,180,157,.35)} .dots i.l2{background:rgba(29,180,157,.65)} .dots i.l3{background:var(--accent)}
.chart{width:100%;height:auto}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;margin-top:10px}
.wk i{display:grid;place-items:center;width:34px;height:34px;margin:0 auto;border-radius:50%;background:var(--card2);color:var(--sub)}
.wk i.met{background:var(--accent);color:var(--accent-ink)}
.wk i.today{box-shadow:inset 0 0 0 2px var(--accent)}
.wk i svg{width:16px;height:16px}
.wk span{display:block;font-size:11.5px;color:var(--sub);margin-top:5px}
.ledger .cell .v.met{color:var(--accent)}
.flamehero{text-align:center;padding:10px 0 4px}
.flamehero .f{width:64px;height:64px;margin:0 auto;color:var(--accent)}
.flamehero .f svg{width:64px;height:64px}
.flamehero b{display:block;font:700 44px/1 var(--sans);margin-top:6px}
.flamehero span{color:var(--sub)}

.backdrop{position:fixed;inset:0;z-index:50;background:var(--scrim);opacity:0;transition:opacity .35s var(--ease)}
.backdrop.on{opacity:1}
.sheet{position:fixed;z-index:51;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;background:var(--bg);border-radius:22px 22px 0 0;
  box-shadow:0 -10px 40px rgba(0,0,0,.45),inset 0 .5px 0 var(--line2);transform:translateY(105%);transition:transform .42s var(--ease);
  max-height:calc(100% - var(--safe-t) - 12px);display:flex;flex-direction:column;padding-bottom:var(--safe-b)}
.sheet.on{transform:none}
.sheet.dragging{transition:none}
.sheet.large{height:calc(100% - var(--safe-t) - 12px)}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line2);margin:7px auto 0;flex:none}
.shead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 14px 8px;flex:none;min-height:50px}
.shead h3{margin:0;font:600 17px/1.2 var(--sans);text-align:center}
.shead .l{justify-self:start} .shead .r{justify-self:end}
.shead.bk{display:flex;gap:12px;padding:8px 16px 10px}
.shead.bk .cover{width:34px;flex:none}
.shead.bk .tt{flex:1;min-width:0}
.shead.bk .tt b{display:block;font:600 15.5px/1.2 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shead.bk .tt span{font-size:14px;color:var(--sub)}
.sbody{overflow-y:auto;padding:4px 16px 18px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sbody.fade{animation:sfade .22s var(--out)}
@keyframes sfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.stiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 14px}
.stile{background:var(--card);border-radius:14px;padding:12px 8px 14px;text-align:center;box-shadow:inset 0 0 0 .5px var(--line2);min-height:118px;display:flex;flex-direction:column;align-items:center;width:100%}
.stile .caps{font-size:11px}
.stile small{font-size:11.5px;color:var(--faint);margin-top:3px;min-height:14px}
.stile b{font:500 40px/1 var(--serif);margin-top:auto;padding-top:8px}
.stile b sub{font:600 11px/1 var(--sans);letter-spacing:.06em;vertical-align:baseline;margin-left:2px;text-transform:uppercase}
.stile.na b{color:var(--sub)}
.stile[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}

.pcols{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;margin:6px 0 14px;text-align:center}
.pcols .col{padding:10px 4px;border-radius:14px}
.pcols .col span{display:block;font:600 13px/1 var(--sans);color:var(--sub);margin-bottom:8px}
.pcols .col b,.pcols .col input{font:500 30px/1.1 var(--serif);color:var(--sub);display:block;width:100%;text-align:center;background:none;border:0;outline:none;padding:0}
.pcols .col.cur{background:var(--card2)}
.pcols .col.cur span{color:var(--ink)}
.pcols .col.cur input{color:var(--ink)}
.pcols .col input.tot{color:var(--sub)}
.unitrow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.unitrow .tx{flex:1;min-width:0}
.unitrow .tx b{display:block;font:600 15.5px/1.2 var(--sans)}
.unitrow select{background:none;border:0;color:var(--sub);font-size:14px;padding:0;-webkit-appearance:none;appearance:none}
.daybtn{position:relative;height:38px;min-width:38px;padding:0 10px;border-radius:10px;box-shadow:inset 0 0 0 1.5px var(--line2);display:flex;align-items:center;gap:6px;font:600 13.5px/1 var(--sans);color:var(--ink)}
.daybtn svg{width:18px;height:18px}
.daybtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.stepper{display:flex;align-items:center;gap:10px;justify-content:center;margin:6px 0 4px}
.stepper button{width:44px;height:44px;border-radius:50%;background:var(--card2);font:600 22px/1 var(--sans);display:grid;place-items:center}
.stepper b{font:500 40px/1 var(--serif);min-width:110px;text-align:center}
.chiprow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.chip{height:34px;padding:0 13px;border-radius:17px;background:var(--card2);font:600 13.5px/1 var(--sans);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--light);color:var(--light-ink)}
.qtiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 4px}
.qtiles .atile{flex:none}
.qtiles .atile i{width:100%;height:auto;aspect-ratio:1}
.pickrow{display:flex;gap:12px;align-items:center;width:100%;padding:8px 0;text-align:left}
.pickrow .cover{width:40px;flex:none}
.pickrow b{font:600 15.5px/1.25 var(--sans);display:block}
.pickrow span{font-size:13px;color:var(--sub)}
.pickrow .ck{margin-left:auto;color:var(--accent);width:22px}
.covergrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.covergrid button{display:block}
.covergrid .cover{width:100%}
.covergrid small{display:block;font-size:11px;color:var(--faint);margin-top:4px;text-align:center}
.textarea{width:100%;min-height:90px;background:var(--card);border:0;border-radius:12px;padding:12px;color:var(--ink);outline:none;resize:none;box-shadow:inset 0 0 0 .5px var(--line2)}

.recap{background:var(--paper);color:var(--paper-ink);border-radius:20px;padding:22px 20px;text-align:center;position:relative;overflow:hidden}
.recap .rc{width:96px;margin:0 auto 14px;transform:rotate(-4deg)}
.recap .rc .cover{width:100%}
.recap .k{font:600 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--paper-sub);margin-top:14px}
.recap .v{font:italic 500 30px/1.15 var(--serif);margin-top:4px}
.recap .v small{font-size:20px}
.recap .foot{margin-top:18px;font:600 13px/1.3 var(--sans);color:var(--paper-sub)}
.recap .foot b{color:var(--accent)}

.alert{position:fixed;z-index:70;left:16px;right:16px;max-width:400px;margin:0 auto;top:50%;transform:translateY(-44%) scale(.96);opacity:0;background:var(--card);
  border-radius:20px;padding:20px 16px 16px;box-shadow:0 20px 60px rgba(0,0,0,.55),inset 0 0 0 .5px var(--line2);transition:transform .3s var(--ease),opacity .2s}
.alert.on{transform:translateY(-50%);opacity:1}
.alert h4{margin:0 2px 8px;font:700 19px/1.25 var(--sans)}
.alert p{margin:0 2px 18px;color:var(--sub);font-size:15px;line-height:1.45}
.alert .stack{gap:10px}
.alert .btn{height:46px;font-size:15.5px}
.alertveil{position:fixed;inset:0;z-index:69;background:var(--scrim);opacity:0;transition:opacity .25s}
.alertveil.on{opacity:1}

.pmenu{position:fixed;z-index:72;min-width:230px;max-width:300px;background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);
  border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 0 0 .5px var(--line2);padding:6px 0;transform:scale(.6);opacity:0;transition:transform .32s var(--ease),opacity .18s;max-height:70vh;overflow-y:auto}
.pmenu.on{transform:none;opacity:1}
.pmenu .ph{font:600 12.5px/1 var(--sans);color:var(--faint);padding:8px 16px 6px}
.pmenu button{display:grid;grid-template-columns:18px 22px 1fr;align-items:center;gap:8px;width:100%;padding:11px 14px;text-align:left;font-size:16px}
.pmenu button svg{width:18px;height:18px}
.pmenu button .ck svg{width:14px;height:14px}
.pmenu hr{border:0;height:6px;background:rgba(0,0,0,.18);margin:4px 0}
.pmveil{position:fixed;inset:0;z-index:71}

.blurveil{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;transition:opacity .25s}
.blurveil.on{opacity:1}
.ctx{position:fixed;z-index:61;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:14px;pointer-events:none}
.ctx>*{pointer-events:auto}
.ctx .preview{width:140px;transform:scale(.9);opacity:0;transition:transform .35s var(--ease),opacity .2s}
.ctx .menu{width:250px;border-radius:14px;overflow:hidden;background:var(--glass);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);transform:scale(.85);opacity:0;transform-origin:top center;transition:transform .35s var(--ease),opacity .2s}
.ctx.on .preview,.ctx.on .menu{transform:none;opacity:1}
.ctx .menu button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:13px 16px;font-size:16px;text-align:left}
.ctx .menu button+button{box-shadow:inset 0 .5px 0 var(--line2)}
.ctx .menu button svg{width:18px;height:18px}
.ctx .menu .red{color:#FF6B66}

#toast{position:fixed;z-index:80;left:50%;bottom:calc(var(--safe-b) + var(--tabh) + 26px);transform:translate(-50%,24px);opacity:0;pointer-events:none;
  background:var(--light);color:var(--light-ink);border-radius:14px;padding:0 6px 0 16px;height:48px;display:flex;align-items:center;gap:12px;font:600 14.5px/1.2 var(--sans);
  box-shadow:0 12px 34px rgba(0,0,0,.45);transition:transform .32s var(--ease),opacity .2s;max-width:calc(100% - 32px);white-space:nowrap}
#toast.solo{padding-right:16px}
#toast.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
body.hasmini #toast{bottom:calc(var(--safe-b) + var(--tabh) + 92px)}
#toast span{overflow:hidden;text-overflow:ellipsis}
#toast button{height:36px;padding:0 12px;border-radius:10px;background:rgba(0,0,0,.1);font-weight:700}

.player{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .5s var(--ease);color:#F7F4F0}
.player.on{transform:none}
.player.dragging{transition:none}
.player .scene{position:relative;flex:1;background:var(--scene);overflow:hidden;display:flex;align-items:center;justify-content:center;padding-top:var(--safe-t)}
.player canvas.rain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.player .ptop{position:absolute;top:calc(var(--safe-t) + 8px);left:12px;right:12px;display:flex;justify-content:space-between;z-index:3}
.player .ptop button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:rgba(255,255,255,.75);background:rgba(0,0,0,.18)}
.player .ptop svg{width:20px;height:20px}
.ringwrap{position:relative;width:min(74vw,300px,40vh);aspect-ratio:1;z-index:2}
.ringwrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--track);stroke-width:22}
.ring-arc{fill:none;stroke:var(--accent);stroke-width:22;stroke-linecap:round;opacity:.9}
.ring-knob{fill:var(--accent)}
.ringwrap .clock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.ringwrap .clock .n{font:600 min(19vw,76px,10vh)/1 var(--sans);letter-spacing:-.02em;display:flex;align-items:baseline}
.ringwrap .clock .n small{font-size:.45em;font-weight:600;margin-left:3px}
.ringwrap .clock .n small+span{margin-left:.2em}
.ringwrap .clock .s{font:500 13.5px/1.2 var(--sans);color:rgba(255,255,255,.55);margin-top:10px;min-height:17px}
.player.paused .clock .n{opacity:.45}
.player .knobarrow{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#062a24;z-index:3;left:50%;top:0;will-change:transform}
.player .knobarrow svg{width:16px;height:16px}
.player .scene .illo{position:absolute;left:24px;bottom:16px;width:44px;opacity:.5;z-index:2}
.player .panel{background:var(--bg);padding:6px 16px calc(var(--safe-b) + 18px);flex:none}
.player .panel .grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:4px auto 12px}
.player .prow{display:flex;align-items:center;gap:12px}
.player .prow .cover{width:40px;flex:none;border-radius:2px}
.player .prow .tt{flex:1;min-width:0}
.player .prow .tt b{display:block;font:600 16px/1.2 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.player .prow .tt span{font-size:13px;color:var(--sub)}
.player .prow .rbtn{width:46px;height:46px;background:var(--card2)}
.player .opts{display:flex;gap:12px;margin-top:18px}
.player .opts .atile{color:var(--ink)}
.player .opts .atile i{background:var(--card2);box-shadow:none}
.player .opts .atile.on i{background:var(--light);color:var(--light-ink)}
.player.dim .scene{background:#0d0c0c}
.player.dim .ring-track{stroke:#151414}

.welcome{padding-top:20px}
.welcome .hero{font:600 34px/1.1 var(--serif);margin:10px 0 10px}
.welcome p{color:var(--sub);font-size:16px;line-height:1.5}

.screen.enter{animation:push-in .42s var(--ease) both;box-shadow:-10px 0 30px rgba(0,0,0,.4)}
.screen.leave{animation:push-out .38s var(--ease) both;box-shadow:-10px 0 30px rgba(0,0,0,.4)}
.screen.toBelow{animation:to-below .42s var(--ease) both}
.screen.fromBelow{animation:from-below .38s var(--ease) both}
@keyframes push-in{from{transform:translateX(100%)}to{transform:none}}
@keyframes push-out{from{transform:none}to{transform:translateX(100%)}}
@keyframes to-below{from{transform:none;filter:brightness(1)}to{transform:translateX(-28%);filter:brightness(.8)}}
@keyframes from-below{from{transform:translateX(-28%);filter:brightness(.8)}to{transform:none;filter:brightness(1)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;transition-duration:1ms!important}
}

svg.chev{width:8px;height:14px;flex:none;color:var(--faint)}
.brow .tx,.pickrow,.hcard,.lrow,.cell{text-align:left}
.shead select{-webkit-appearance:none;appearance:none;background:none;border:0;color:var(--sub);font-size:14px;padding:0;font-weight:500}
body.sheetopen #toast,body.playing #toast{bottom:auto;top:calc(var(--safe-t) + 10px);transform:translate(-50%,-24px)}
body.sheetopen #toast.on,body.playing #toast.on{transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
  <div class="tabview on" id="tv-home"></div>
  <div class="tabview" id="tv-library"></div>
  <div class="tabview" id="tv-stats"></div>
  <div class="tabview" id="tv-search"></div>
</div>
<div class="mini" id="mini" aria-label="Reading Time"></div>
<nav class="tabbar" aria-label="Tabs">
  <div class="pillbar"><span class="hl" aria-hidden="true"></span>
    <button data-tab="home" data-icon="home" aria-current="page"><i></i>Home</button>
    <button data-tab="library" data-icon="lib"><i></i>Library</button>
    <button data-tab="stats" data-icon="ring"><i></i>Stats</button>
  </div>
  <button class="searchtab" data-tab="search" data-icon="search" aria-label="Search"><i></i></button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<section class="player" id="player" aria-hidden="true" aria-label="Reading Time">
  <div class="scene">
    <canvas class="rain" aria-hidden="true"></canvas>
    <div class="ptop"></div>
    <div class="ringwrap" role="timer" aria-label="Session time">
      <svg viewBox="0 0 300 300" aria-hidden="true"><circle class="ring-track" cx="150" cy="150" r="139"/><circle class="ring-arc" cx="150" cy="150" r="139" transform="rotate(-90 150 150)" stroke-dasharray="0 1000"/></svg>
      <div class="knobarrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 7l5 5-5 5"/></svg></div>
      <div class="clock"><div class="n num"></div><div class="s"></div></div>
    </div>
    <div class="illo" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"><path d="M14 40c-4-6-4-16 2-22 3-3 10-4 14-1 6 4 7 14 3 21"/><path d="M14 18c1-4 4-6 6-6M30 17c1-3 3-5 5-5"/><circle cx="20" cy="22" r="3.5"/><circle cx="29" cy="22" r="3.5"/><path d="m24 26 1 2 1-2M10 41h30M18 41v-3M30 41v-3"/></svg></div>
  </div>
  <div class="panel"><div class="grab" aria-hidden="true"></div><div class="prow"></div><div class="opts"></div></div>
</section>

<script>
const BUILD = "public";          // "private": library baked in (claude.ai preview). "public": empty shell, data restored from a backup.
const SEED = null;
const LS = "read_v1";
const DAY_ROLL_H = 4;               // a session at 1am counts toward the night before
const SEED_V = 5;
const SHELVES = ["Reading","Up Next","Queue","Maybe","Paused","Read","DNF","Reference","Pass","Hidden"];
const SHELF_LABEL = {"Reading":"Reading","Up Next":"Up Next","Queue":"Want to Read","Maybe":"Maybe","Paused":"Stopped","Read":"Finished","DNF":"Did Not Finish","Reference":"Reference","Pass":"Pass","Hidden":"Not a book"};
const RANK = ["Read","Reading","Up Next","DNF","Paused","Queue","Reference","Maybe","Pass","Hidden"];
const DEFAULT_PACE = 0.75;          // pages per minute until his own sessions say otherwise
const DEF_SETTINGS = {goalType:"any",dailyMin:20,dailyPages:20,yearGoal:6,theme:"system",dimDefault:true,idleMin:90};

function fromSeed(b){ return {id:b.id,title:b.t,subtitle:b.sub||"",series:b.ser||"",seriesNo:b.sno||"",isbn:b.isbn||"",author:b.a,genre:b.g||"",
  pages:b.p||0,status:b.s,rating:b.r||0,syn:b.syn||"",format:normFormat(b.fmt||(b.k?"Ebook":"")),unit:"page",page:b.page||0,recBy:"",
  started:b.started||"",finished:b.fin||"",fuzzy:b.s==="Read"&&!b.fin?(b.fuzzy||"Not sure"):(b.fuzzy||""),notes:"",added:"2026-09-20",
  tier:b.tier||"",merged:b.merged||[],cu:b.cu||"",hideWhy:b.hideWhy||""}; }
function normFormat(f){ return ({Physical:"Print",Kindle:"Ebook","Apple Books":"Ebook",PDF:"Ebook",Audiobook:"Audio"})[f]||f||""; }
function emptyStore(){ return {v:2,seedV:SEED_V,books:{},sessions:[],activity:[],timer:null,settings:{...DEF_SETTINGS},created:Date.now()}; }
function seedStore(){
  const st=emptyStore(); if(!SEED) return st;
  SEED.books.forEach(b=>st.books[b.id]=fromSeed(b));
  st.activity=(SEED.activity||[]).map(a=>({id:uid(),...a}));
  st.settings.yearGoal=SEED.yearGoal||DEF_SETTINGS.yearGoal;
  return st;
}
function migrate(){
  normalize();
  if(!SEED||(S.seedV||1)>=SEED_V) return;
  const fresh=seedStore(), remap={};
  Object.values(fresh.books).forEach(f=>(f.merged||[]).forEach(old=>remap[old]=f.id));
  Object.values(S.books).forEach(b=>{
    const id=remap[b.id]||b.id, f=fresh.books[id];
    if(!f){ fresh.books[id]=b; return; }
    f.rating=b.rating||f.rating; f.recBy=b.recBy||""; f.notes=b.notes||""; f.page=Math.max(f.page||0,b.page||0);
    if(b.pages&&!f.pages) f.pages=b.pages;
  });
  S.sessions.forEach(x=>{ if(remap[x.bookId]) x.bookId=remap[x.bookId]; });
  const seen=new Set(S.activity.map(a=>a.day+a.bookId+a.src));
  fresh.activity.forEach(a=>{ if(!seen.has(a.day+a.bookId+a.src)) S.activity.push(a); });
  S.books=fresh.books; S.settings.yearGoal=fresh.settings.yearGoal;
  if((S.seedV||1)<5){ S.settings.goalType="any"; S.goalLog=[{since:"0000-00-00",type:"any",n:1}]; S.activity=S.activity.filter(x=>x.src!=="margins").concat(fresh.activity.filter(x=>x.src==="margins")); } // Margins counts any reading activity; its progress days now carry pages
  S.seedV=SEED_V; save();
}
function normalize(){
  S.v=2; S.sessions=S.sessions||[]; S.activity=S.activity||[];
  S.settings=Object.assign({},DEF_SETTINGS,S.settings||{});
  if(!S.goalLog||!S.goalLog.length){ const g=goalSpec(); S.goalLog=[{since:"0000-00-00",type:g.type,n:g.n}]; }
  Object.values(S.books).forEach(b=>{ b.format=normFormat(b.format); b.unit=b.unit||"page"; b.cu=b.cu||""; });
  if(S.timer&&S.timer.runFrom==null) S.timer=null;
}
let S;
function load(){ try{ const raw=localStorage.getItem(LS); if(raw) S=JSON.parse(raw); }catch(e){}
  if(!S||!S.books) S=BUILD==="public"?emptyStore():seedStore();
  migrate(); }
function save(){ try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){} }
function hasLibrary(){ return Object.keys(S.books).length>0; }

const pad=n=>String(n).padStart(2,"0");
function keyOf(ts){ const d=new Date(ts-DAY_ROLL_H*3600e3); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function todayKey(){ return keyOf(Date.now()); }
function addDays(k,n){ const [y,m,d]=k.split("-").map(Number); const x=new Date(y,m-1,d+n); return x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate()); }
function dateOfKey(k){ const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); }
const WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MO=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
function fmtDay(k){ const d=dateOfKey(k); return WD[d.getDay()]+" "+(d.getMonth()+1)+"/"+d.getDate(); }
function fmtMin(m){ m=Math.round(m); if(m<60) return m+" min"; const h=Math.floor(m/60), r=m%60; return h+"h"+(r?" "+r+"m":""); }
function fmtCalm(ms){ const s=Math.max(0,Math.floor(ms/1000)); if(s<60) return s+"s"; const m=Math.floor(s/60); return m<60?m+"m":Math.floor(m/60)+"h "+(m%60)+"m"; }
function fmtClock(ms){ const s=Math.max(0,Math.floor(ms/1000)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+":"+pad(m):m)+":"+pad(x); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const typo=s=>String(s??"").replace(/'/g,"’");
function fullTitle(b){ return b.title+(b.subtitle&&b.title.length<5?": "+b.subtitle:""); }

function dayData(){ // minutes, pages and books per night, from timed sessions and logged progress
  const d={}; const at=k=>d[k]||(d[k]={k,min:0,pages:0,books:[],active:false});
  S.sessions.forEach(s=>{ const x=at(keyOf(new Date(s.start).getTime())); x.min+=s.min; x.active=true;
    if(s.toPage>s.fromPage) x.pages+=s.toPage-s.fromPage; if(!x.books.includes(s.bookId)) x.books.push(s.bookId); });
  S.activity.forEach(a=>{ const x=at(a.day); x.active=true;
    if(a.toPage!=null&&a.fromPage!=null&&a.toPage>a.fromPage) x.pages+=a.toPage-a.fromPage; if(a.bookId&&!x.books.includes(a.bookId)) x.books.push(a.bookId); });
  return d;
}
function goalFor(k){ const L=S.goalLog||[]; let g=null; for(const e of L){ if(e.since<=k) g=e; } g=g||L[0];
  return g?{type:g.type,n:g.n,unit:g.type==="pages"?"pages":g.type==="minutes"?"min":""}:goalSpec(); }
function logGoal(){ const g=goalSpec(), t=todayKey(); S.goalLog=S.goalLog||[]; const last=S.goalLog[S.goalLog.length-1];
  if(last&&last.since===t) Object.assign(last,{type:g.type,n:g.n}); else S.goalLog.push({since:t,type:g.type,n:g.n}); }
function goalSpec(){ const s=S.settings; return s.goalType==="pages"?{type:"pages",n:Math.max(1,+s.dailyPages||20),unit:"pages"}:s.goalType==="any"?{type:"any",n:1,unit:""}:{type:"minutes",n:Math.max(1,+s.dailyMin||20),unit:"min"}; }
function dayMet(x){ if(!x) return false; const g=x.k?goalFor(x.k):goalSpec(); return g.type==="any"?x.active:g.type==="pages"?x.pages>=g.n:x.min>=g.n; }
function dayAmount(x){ const g=goalSpec(); if(!x) return 0; return g.type==="pages"?x.pages:g.type==="any"?(x.active?1:0):x.min; }
function streakInfo(){
  const d=dayData(), t=todayKey(); const met=k=>dayMet(d[k]);
  let cur=0, k=met(t)?t:addDays(t,-1); while(met(k)){ cur++; k=addDays(k,-1); }
  let best=0, run=0; const keys=Object.keys(d).sort();
  if(keys.length){ let x=keys[0]; while(x<=t){ if(met(x)){run++;best=Math.max(best,run);}else run=0; x=addDays(x,1);} }
  return {cur,best,todayMet:met(t),today:d[t]||{min:0,pages:0,books:[],active:false},days:d};
}
function pace(){ const cut=Date.now()-60*864e5; let p=0,m=0;
  S.sessions.forEach(s=>{ if(new Date(s.start).getTime()>=cut&&s.toPage>s.fromPage&&s.min>=3){p+=s.toPage-s.fromPage;m+=s.min;} });
  return m>=30?{ppm:p/m,own:true}:{ppm:DEFAULT_PACE,own:false}; }
function bookPace(id){ let p=0,m=0; S.sessions.forEach(s=>{ if(s.bookId===id&&s.toPage>s.fromPage&&s.min>=3){p+=s.toPage-s.fromPage;m+=s.min;} }); return m>=20?p/m:null; }
function nightlyMinutes(){ const g=goalSpec(); return g.type==="minutes"?g.n:g.type==="pages"?g.n/pace().ppm:20; }
function projection(b){
  if(!b.pages) return null;
  const left=Math.max(0,b.pages-(b.page||0)), ppm=bookPace(b.id)||pace().ppm, mins=left/ppm, nights=Math.ceil(mins/nightlyMinutes());
  return {left,mins,nights,by:addDays(todayKey(),Math.max(0,nights-1)),pct:Math.min(100,Math.round((b.page||0)/b.pages*100))};
}
function bookMinutes(id){ return S.sessions.filter(s=>s.bookId===id).reduce((a,s)=>a+s.min,0); }
function booksBy(status){ return Object.values(S.books).filter(b=>b.status===status); }
function finishYear(b){ return b.finished?b.finished.slice(0,4):(/(\d{4})/.exec(b.fuzzy||"")||[])[1]||""; }
function finishedIn(year){ return Object.values(S.books).filter(b=>b.status==="Read"&&finishYear(b)===String(year)); }
function progressLabel(b){ if(!b.pages) return "Page "+(b.page||0); return b.unit==="percent"?Math.round((b.page||0)/b.pages*100)+"%":"Page "+(b.page||0)+" of "+b.pages; }

function hue(id){ let h=0; for(const c of String(id)) h=(h*31+c.charCodeAt(0))>>>0; return h%360; }
function drawnCover(b,cls){ const h=hue(b.id||b.title); return `<div class="cover ${cls}" style="background:linear-gradient(160deg,hsl(${h} 45% 38%),hsl(${(h+30)%360} 50% 22%))" aria-hidden="true"><span>${esc(b.title)}</span></div>`; }
function coverSrc(b){ if(b.cuUser&&b.cu) return b.cu; return (window.COVERS&&COVERS[b.id])||b.cu||""; }
function cover(b,cls=""){ const src=coverSrc(b); if(!src) return drawnCover(b,cls);
  return `<img class="cover img ${cls}" src="${esc(src)}" alt="" loading="lazy" decoding="async" data-bid="${esc(b.id)}" data-cls="${esc(cls)}" onerror="coverFail(this)">`; }
window.coverFail=function(img){ const b=S.books[img.dataset.bid]; if(!b){ img.remove(); return; }
  const local=window.COVERS&&COVERS[b.id]; if(local&&img.getAttribute("src")!==local){ img.src=local; return; }
  img.outerHTML=drawnCover(b,img.dataset.cls||""); };
const tintCache={};
function tintFor(b,cb){ if(tintCache[b.id]) return cb(tintCache[b.id]); const src=coverSrc(b); if(!src) return cb(null);
  const im=new Image(); if(!src.startsWith("data:")) im.crossOrigin="anonymous";
  im.onload=()=>{ try{ const c=document.createElement("canvas"); c.width=c.height=12; const x=c.getContext("2d"); x.drawImage(im,0,0,12,12);
      const d=x.getImageData(0,0,12,12).data; let r=0,g=0,bl=0,n=0; for(let i=0;i<d.length;i+=4){ r+=d[i];g+=d[i+1];bl+=d[i+2];n++; }
      r/=n;g/=n;bl/=n; const L=0.2126*r+0.7152*g+0.0722*bl, k=L>90?90/L:1; const col=`rgb(${Math.round(r*k)},${Math.round(g*k)},${Math.round(bl*k)})`;
      tintCache[b.id]=col; cb(col); }catch(e){ cb(null); } };
  im.onerror=()=>cb(null); im.src=src; }


function timerMs(){ const t=S.timer; if(!t) return 0; return t.accum+(t.paused?0:Date.now()-t.runFrom); }
function idleCheck(){ // a forgotten timer stops itself instead of logging hours nobody read
  const t=S.timer; if(!t||t.paused||t.fresh) return false; const lim=Math.max(15,+S.settings.idleMin||90)*60e3;
  if(Date.now()-t.runFrom>lim){ t.accum+=lim; t.paused=true; t.idle=true; save(); return true; } return false; }

async function searchBooks(q){
  const out=[];
  const [ap,ol]=await Promise.allSettled([
    fetch("https://itunes.apple.com/search?entity=ebook&limit=12&term="+encodeURIComponent(q)).then(r=>r.json()),
    fetch("https://openlibrary.org/search.json?limit=12&fields=key,title,author_name,cover_i,number_of_pages_median,isbn&q="+encodeURIComponent(q)).then(r=>r.json())]);
  if(ap.status==="fulfilled") (ap.value.results||[]).forEach(r=>r.artworkUrl100&&out.push({title:r.trackName,author:r.artistName,cu:r.artworkUrl100.replace("100x100bb","400x600bb"),src:"Apple Books"}));
  if(ol.status==="fulfilled") (ol.value.docs||[]).forEach(d=>out.push({title:d.title,author:(d.author_name||[]).join(", "),cu:d.cover_i?`https://covers.openlibrary.org/b/id/${d.cover_i}-L.jpg`:"",pages:d.number_of_pages_median||0,isbn:(d.isbn||[]).find(x=>x.length===13)||"",src:"Open Library"}));
  if(ap.status==="rejected"&&ol.status==="rejected") throw new Error("offline");
  return out;
}

function inLibrary(r){ const n=x=>String(x||"").toLowerCase().replace(/[’']/g,"").replace(/\(.*?\)|:.*$/g,"").replace(/[^a-z0-9]+/g," ").trim();
  const t=n(r.title), a=n(r.author).split(" ").pop(); return Object.values(S.books).find(b=>n(b.title)===t&&(!a||n(b.author).includes(a))); }


const sv=(d,o="")=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${o}>${d}</svg>`;
const I={
  home:on=>on?`<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3.5 10.6 12 3.4l8.5 7.2V20a1 1 0 0 1-1 1H15v-6h-6v6H4.5a1 1 0 0 1-1-1z"/></svg>`:sv('<path d="M3.5 10.6 12 3.4l8.5 7.2V20a1 1 0 0 1-1 1H15v-6h-6v6H4.5a1 1 0 0 1-1-1z"/>'),
  books:on=>on?`<svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><rect x="3" y="3.5" width="4.5" height="17" rx="1"/><rect x="9" y="3.5" width="4.5" height="17" rx="1"/><path d="m15.3 5 4-1 3.6 14.6-4 1z"/></g></svg>`:sv('<rect x="3" y="3.5" width="4.5" height="17" rx="1"/><rect x="9" y="3.5" width="4.5" height="17" rx="1"/><path d="m15.3 5 4-1 3.6 14.6-4 1z"/>'),
  chart:on=>sv(`<path d="M4 20V11M10 20V5M16 20v-6M21 20H3" ${on?'stroke-width="2.6"':''}/>`),
  search:on=>sv(`<circle cx="10.5" cy="10.5" r="6.5" ${on?'stroke-width="2.6"':''}/><path d="m15.5 15.5 5 5" ${on?'stroke-width="2.6"':''}/>`),
  ring:on=>sv(`<circle cx="12" cy="12" r="7.5" ${on?'stroke-width="3"':'stroke-width="2.2"'}/><path d="M12 4.5a7.5 7.5 0 0 1 7.5 7.5" stroke-width="${on?3:2.2}" stroke="currentColor" opacity=".35"/>`),
  lib:on=>sv(`<path d="M5 4v16M9.5 4v16M14 4.5l4.5 15" stroke-width="${on?2.8:2}"/><path d="M3 20.5h18" stroke-width="${on?2.8:2}"/>`),
  heart:sv('<path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/>'),
  heartf:`<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></svg>`,
  bookmark:sv('<path d="M6.5 3.5h11v17l-5.5-4-5.5 4z"/>'),
  reading:sv('<path d="M3.5 5.5h7a1.5 1.5 0 0 1 1.5 1.5v12.5a1.5 1.5 0 0 0-1.5-1.5h-7zM20.5 5.5h-7A1.5 1.5 0 0 0 12 7v12.5a1.5 1.5 0 0 1 1.5-1.5h7z"/>'),
  finished:sv('<path d="M6.5 3.5h11v17l-5.5-4-5.5 4z"/><path d="m9.3 9.8 2 2 3.6-3.8" stroke-width="2.2"/>'),
  stopped:sv('<path d="M6.5 3.5h11v17l-5.5-4-5.5 4z"/><path d="m9.8 7.8 4.4 4.4m0-4.4-4.4 4.4" stroke-width="2.2"/>'),
  person:sv('<circle cx="12" cy="8" r="3.8"/><path d="M4.5 20.5c.8-4 3.8-6 7.5-6s6.7 2 7.5 6"/>'),
  series:sv('<rect x="4" y="6" width="10" height="14" rx="1.5"/><path d="M8 3.5h10.5A1.5 1.5 0 0 1 20 5v13"/>'),
  filter:sv('<path d="M4 6.5h16M7 12h10M10 17.5h4"/>'),
  minimize:sv('<path d="m6 9.5 6 6 6-6" stroke-width="2.4"/>'),
  vol:sv('<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>'),
  muted:sv('<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="m16 9.5 5 5m0-5-5 5"/>'),
  arrow:sv('<path d="M5 12h13M13 7l5 5-5 5" stroke-width="2.6"/>'),
  dates:sv('<rect x="3.5" y="5" width="13" height="13" rx="2"/><path d="M3.5 9h13M7 3v3.5M13 3v3.5"/><circle cx="17" cy="17" r="4.2" fill="var(--card,#242122)"/><path d="M17 15v2.2l1.4.9"/>'),
  ruler:sv('<path d="M4 15.5 15.5 4l4.5 4.5L8.5 20z"/><path d="m8 11.5 2 2M11 8.5l2 2M14 5.5l2 2"/>'),
  xcirc:sv('<circle cx="12" cy="12" r="8.5"/><path d="m9 9 6 6m0-6-6 6"/>'),
  reread:sv('<path d="M6.5 3.5h11v17l-5.5-4-5.5 4z"/><path d="M14.5 9.5a2.7 2.7 0 1 1-.8-1.9M14.6 6.6v1.4h-1.4"/>'),
  add:sv('<circle cx="12" cy="12" r="8.5"/><path d="M12 8v8M8 12h8"/>'),
  awake:sv('<rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M12 8v1.5M9.6 10.2l1 1M14.4 10.2l-1 1M10.5 13h3"/>'),
  share:sv('<path d="M12 15V3.5M8 7.5l4-4 4 4M6 11v8.5h12V11"/>'),
  pages:sv('<path d="M7 3.5h7.5l4 4V20a.5.5 0 0 1-.5.5H7a.5.5 0 0 1-.5-.5V4a.5.5 0 0 1 .5-.5z"/><path d="M14.5 3.5v4h4M9.5 12h6M9.5 15.5h6"/>'),

function morph(a,b){
  const bc=[...b.childNodes];

    if(!x){ a.appendChild(y); continue; }
    if(x.nodeType!==y.nodeType||x.nodeName!==y.nodeName||(x.nodeType===1&&(x.getAttribute("data-key")||"")!==(y.getAttribute("data-key")||""))){ a.replaceChild(y,x); continue; }
    if(x.nodeType!==1){ if(x.nodeValue!==y.nodeValue) x.nodeValue=y.nodeValue; continue; }
    if(x.tagName==="IMG"&&x.getAttribute("src")!==y.getAttribute("src")){ a.replaceChild(y,x); continue; }
    for(const at of [...x.attributes]) if(!y.hasAttribute(at.name)) x.removeAttribute(at.name);
    for(const at of [...y.attributes]) if(x.getAttribute(at.name)!==at.value) x.setAttribute(at.name,at.value);
    const tag=x.tagName;
    if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT"){
      if(document.activeElement!==x){
        if(tag==="TEXTAREA"){ if(x.value!==y.textContent) x.value=y.textContent; }
        else if(tag==="SELECT"){ morph(x,y); const sel=y.querySelector("option[selected]"); x.value=sel?sel.value:(y.options[0]||{}).value; continue; }
        else if(x.type==="checkbox") x.checked=y.hasAttribute("checked");
        else if(x.value!==(y.getAttribute("value")||"")) x.value=y.getAttribute("value")||"";
      }
      continue;
    }
    morph(x,y);
  }
  while(a.childNodes.length>bc.length) a.removeChild(a.lastChild);
}

    ${body}`; }};
function libResult(b){ return `<div class="brow" data-key="lr-${esc(b.id)}"><button style="display:contents" data-push="book" data-id="${esc(b.id)}">${cover(b)}<span class="tx"><b>${bt(b)}</b><span>${esc(b.author)}</span><span class="st">${esc(STATUS_WORD[b.status])}</span></span></button><button class="more" data-act="addmenu-lib" data-id="${esc(b.id)}" aria-label="Shelf">${I.more}</button></div>`; }
function catResult(r,i){ const have=inLibrary(r);

  ${have&&have.status==="Read"?`<span class="owned" aria-label="Finished">${I.check}</span>`:""}<button class="more" data-act="catmenu" data-i="${i}" aria-label="Add">${I.more}</button></div>`; }

function bookHead(b,line,extraRight){ return `${cover(b)}<div class="tt"><b>${bt(b)}</b><span>${esc(line)}</span></div>${extraRight||""}<button class="navbtn circ" data-act="closesheet" aria-label="Close">${I.x}</button>`; }
function dayWord(k){ const t=todayKey(); return k===t?"Today":k===addDays(t,-1)?"Yesterday":MO[dateOfKey(k).getMonth()]+" "+dateOfKey(k).getDate(); }

function sheetProgress(id){ const b=S.books[id]; if(!b) return;
  const pctMode=b.unit==="percent"&&b.pages;
  openSheet({form:{id,unit:pctMode?"percent":"page",cur:pctMode?pctOf(b):(b.page||0),total:b.pages||"",day:todayKey()},headCls:"bk",
    head:()=>{ const b=S.books[F.id], back=progressBack(); return `${cover(b)}<div class="tt"><b>${back?"Move position…":"Track progress in…"}</b>${back?`<span>Back to ${F.unit==="percent"?F.cur+"%":"page "+F.cur}</span>`:`<span><select data-f="unit" data-live aria-label="Unit"><option value="page" ${F.unit==="page"?"selected":""}>Pages ▾</option><option value="percent" ${F.unit==="percent"?"selected":""}>Percent ▾</option></select></span>`}</div>
      <label class="daybtn" aria-label="Day">${I.cal}<span>${dayWord(F.day)}</span><input type="date" data-f="day" data-live max="${todayKey()}" value="${F.day}"></label><button class="navbtn circ" data-act="closesheet" aria-label="Close">${I.x}</button>`; },
    render:()=>{ const b=S.books[F.id], last=F.unit==="percent"?pctOf(b):(b.page||0), back=progressBack(), tot=F.unit==="percent"?100:F.total;
      const fin=F.unit==="percent"?+F.cur>=100:(+F.total&&+F.cur>=+F.total);
      const label=back?"Move Position":fin?"Finish Book":F.day===todayKey()?"I Read Today":"I Read on "+dayWord(F.day);
      return `<div class="pcols num"><div class="col"><span>${back?"Old":"Last"}</span><b>${last}${F.unit==="percent"?"%":""}</b></div>
        <div class="col cur"><span>${back?"New":"Current"}</span><input type="number" inputmode="numeric" pattern="[0-9]*" data-f="cur" data-live value="${F.cur}" aria-label="Current ${F.unit}" min="0"></div>
        <div class="col"><span>${F.unit==="percent"?"Total":"Total Pages"}</span>${F.unit==="percent"?`<b>100%</b>`:`<input class="tot" type="number" inputmode="numeric" data-f="total" data-live value="${tot}" placeholder="—" aria-label="Total pages">`}</div></div>
        <button class="btn ${fin?"teal":""}" data-act="saveprogress">${label}</button>
        ${F.unit==="percent"&&!b.pages?`<p class="gfoot">Add the book’s page count to track by percent.</p>`:""}`; }});
  setTimeout(()=>{ const i=sheet&&sheet.el.querySelector('input[data-f="cur"]'); if(i){ i.focus(); i.select(); } },380);
}
function progressBack(){ const b=S.books[F.id]; if(!b) return false; const last=F.unit==="percent"?pctOf(b):(b.page||0); return F.cur!==""&&+F.cur<last; }
function saveProgress(){ const b=S.books[F.id], before=snapshot(), prev=b.page||0;
  if(+F.total>0) b.pages=+F.total; b.unit=F.unit;
  let v=Math.max(0,+F.cur||0); if(F.unit==="percent"){ if(!b.pages){ toast("Add a page count first"); return; } v=Math.round(Math.min(100,v)/100*b.pages); }
  if(b.pages) v=Math.min(v,b.pages);
  if(F.day>todayKey()){ toast("That day hasn’t happened yet"); return; }
  S.activity.push({id:uid(),day:F.day,bookId:b.id,fromPage:prev,toPage:v,src:"progress"}); b.page=v;
  if(b.status!=="Reading"&&b.status!=="Read") setShelf(b.id,"Reading",true);
  const done=b.pages&&v>=b.pages&&b.status!=="Read"; if(done) setShelf(b.id,"Read",true);
  save(); closeSheet(true); update(); haptic();
  if(done) finishedCelebration(b,before); else undoable(v<prev?`Moved back to page ${v}`:v===prev?"Logged reading for "+dayWord(F.day).toLowerCase():`Page ${v}${b.pages?" · "+pctOf(b)+"%":""}`,before); }

function sheetEndSession(){ const t=S.timer; if(!t) return; const b=S.books[t.bookId];
  const ms=timerMs(); F={mode:"end",bookId:t.bookId,start:t.startedAt,ms,min:Math.max(1,Math.round(ms/60000)),from:t.fromPage!=null?t.fromPage:(b.page||0),to:"",edit:"",note:"",total:b.pages||""};
  openSheet({headCls:"bk",
    head:()=>{ const b=S.books[F.bookId]; return bookHead(b,"Adding Session"); },
    render:()=>{ const b=S.books[F.bookId], read=F.to!==""&&+F.to>F.from?+F.to-F.from:0;
      return `<div class="stiles">
        <button class="stile ${F.to===""?"na":""}" data-act="endedit" data-e="progress" aria-pressed="${F.edit==="progress"}"><span class="caps">Progress</span><small>${F.to===""?"Tap to add your page":`pp. ${F.from}–${F.to}`}</small><b class="num">${F.to===""?"N/A":read?"+"+read:F.to}${F.to!==""?`<sub>${read?"pages":"page"}</sub>`:""}</b></button>
        <button class="stile" data-act="endedit" data-e="duration" aria-pressed="${F.edit==="duration"}"><span class="caps">Duration</span><small>Started at ${clock12(F.start)}</small><b class="num">${F.min}<sub>min</sub></b></button></div>
      ${F.edit==="progress"?`<div class="pcols num" style="margin-top:0"><div class="col"><span>Last</span><b>${F.from}</b></div><div class="col cur"><span>Current</span><input type="number" inputmode="numeric" pattern="[0-9]*" data-f="to" data-live value="${F.to}" placeholder="${F.from}" aria-label="Page you’re on now"></div><div class="col"><span>Total Pages</span><input class="tot" type="number" inputmode="numeric" data-f="total" value="${F.total}" placeholder="—" aria-label="Total pages"></div></div>`:""}
      ${F.edit==="duration"?`<div class="stepper"><button data-act="endmin" data-d="-5">−5</button><button data-act="endmin" data-d="-1">−</button><b class="num" style="min-width:90px">${F.min}</b><button data-act="endmin" data-d="1">+</button><button data-act="endmin" data-d="5">+5</button></div><div class="gfoot" style="text-align:center;margin-bottom:12px">Timer said ${fmtCalm(F.ms)}${S.timer&&S.timer.idle?" · it paused itself when you went quiet":""}</div>`:""}
      <input class="textarea" style="min-height:0;height:46px;margin-bottom:12px" data-f="note" value="${esc(F.note)}" placeholder="A line to remember it by (optional)" enterkeyhint="done">
      <div class="stack"><button class="btn" data-act="savesession">Add Reading Session</button><button class="btn dark" style="color:#FF6B66" data-act="discardsession">Discard Session</button></div>`; },
    onClose:()=>{ alertCard({title:"Save this reading session?",message:"Your reading session is not saved yet.",buttons:[{label:"Save",fn:saveSession},{label:"Discard",style:"red",fn:discardSession},{label:"Keep editing",style:"dark",cancel:true}]}); return false; }});
}
function saveSession(){ const t=S.timer; if(!t) return; const b=S.books[F.bookId], before=snapshot();
  if(+F.total>0) b.pages=+F.total;
  let to=F.to===""?F.from:Math.max(0,+F.to); if(b.pages) to=Math.min(to,b.pages);
  const s={id:uid(),bookId:F.bookId,start:new Date(F.start).toISOString(),min:F.min,fromPage:F.from,toPage:to,note:(F.note||"").trim(),src:"timer",idleTrim:!!t.idle};
  S.sessions.push(s); if(to!==(b.page||0)) b.page=to; if(b.status!=="Reading"&&b.status!=="Read") setShelf(b.id,"Reading",true);
  S.timer=null; S.lastBook=b.id; let done=false; if(b.pages&&to>=b.pages&&b.status!=="Read"){ setShelf(b.id,"Read",true); done=true; }
  save(); stopAmbience(); closeSheet(true); update(); haptic();
  setTimeout(()=>{ recapSheet(s,before,done); },reduced()?0:260); }
function discardSession(){ const before=snapshot(); S.timer=null; save(); stopAmbience(); closeSheet(true); closePlayer(); update(); undoable("Session discarded",before); }

function recapSheet(s,before,done){ const b=S.books[s.bookId], pages=Math.max(0,s.toPage-s.fromPage), st=streakInfo(), secs=Math.round(s.min*60), pp=pages?Math.round(secs/pages):0;
  openSheet({title:"",right:"",render:()=>`<div class="recap"><div class="rc">${cover(b)}</div>
    ${pages?`<div class="k">Read</div><div class="v num">${pages} <small>${pages===1?"page":"pages"}</small></div>`:""}
    <div class="k">Time</div><div class="v num">${s.min>=60?Math.floor(s.min/60)+"h ":""}${Math.round(s.min%60)}<small>m</small></div>
    ${pp?`<div class="k">Pace</div><div class="v num">${Math.floor(pp/60)}:${pad(pp%60)} <small>/ page</small></div>`:""}
    <div class="foot">${done?`You finished <b>${bt(b)}</b>.`:st.cur?`Night <b>${st.cur}</b> of your streak.`:"Saved to your log."}${b.pages&&!done?` ${b.pages-(b.page||0)} pages to go.`:""}</div></div>
    <div class="stack" style="margin-top:14px"><button class="btn" data-act="closesheet">Done</button></div>`});
  undoable(done?"Finished "+typo(b.title):"Session saved",before,true); }
function finishedCelebration(b,before){ const st=streakInfo(), c=challenge();
  openSheet({title:"",right:"",render:()=>`<div class="recap"><div class="rc">${cover(b)}</div><div class="k">Finished</div><div class="v">${bt(b)}</div>
    <div class="k">This year</div><div class="v num">${c.done} <small>of ${c.goal} books</small></div><div class="foot">${esc(c.word)}${st.cur?` · <b>${st.cur}</b>-night streak`:""}</div></div>
    <div class="ghead caps" style="margin-left:2px">Rate it</div><div class="stars" style="justify-content:center">${[1,2,3,4,5].map(i=>`<button data-act="rate" data-id="${esc(b.id)}" data-v="${i}" aria-label="${i} stars">${I.star(b.rating>=i?"full":b.rating>=i-.5?"half":"none",900+i)}</button>`).join("")}</div>
    <div class="stack" style="margin-top:14px"><button class="btn" data-act="closesheet">Done</button></div>`});
  undoable("Finished "+typo(b.title),before); }

function sheetSessionForm(id,preset={}){ const s=id?S.sessions.find(x=>x.id===id):null; const bid=s?s.bookId:preset.bookId||S.lastBook||(readingNow()[0]||{}).id||Object.keys(S.books)[0];

      <label class="cell"><span class="k">From page</span><input type="number" inputmode="numeric" min="0" data-f="from" value="${F.from}" style="width:80px"></label>
      <label class="cell"><span class="k">To page</span><input type="number" inputmode="numeric" min="0" data-f="to" value="${F.to}" style="width:80px"></label>
      <label class="cell"><span class="k">Note</span><input type="text" data-f="note" value="${esc(F.note)}" placeholder="Optional" style="max-width:60%"></label></div>
      <div class="stack" style="margin-top:16px"><button class="btn" data-act="savepast">${F.id?"Save Changes":"Add Reading Session"}</button>${F.id?`<button class="btn dark" style="color:#FF6B66" data-act="delsession">Delete Session</button>`:""}</div>`; }});
}
function savePast(){ if(!F.bookId||!S.books[F.bookId]){ toast("Pick a book"); return; } if(!(+F.min>0)){ toast("Add the minutes you read"); return; } if(F.day>todayKey()){ toast("That night hasn’t happened yet"); return; }
  const before=snapshot(); const [h,m]=(F.time||"21:30").split(":").map(Number); const d=dateOfKey(F.day); d.setHours(h,m,0,0); if(h<DAY_ROLL_H) d.setDate(d.getDate()+1);
  const rec={bookId:F.bookId,start:d.toISOString(),min:+F.min,fromPage:+F.from||0,toPage:+F.to||0,note:(F.note||"").trim(),src:"manual"};
  if(F.id) Object.assign(S.sessions.find(x=>x.id===F.id),rec); else S.sessions.push({id:uid(),...rec});
  const b=S.books[F.bookId]; if(rec.toPage>(b.page||0)) b.page=rec.toPage; if(b.status!=="Reading"&&b.status!=="Read") setShelf(b.id,"Reading",true);
  save(); closeSheet(true); update(); undoable(F.id?"Session updated":"Session added",before); }

function addFromResult(r,status){ const id="u-"+uid(); S.books[id]={id,title:r.title.replace(/\s*\(.*?\)\s*$/,""),subtitle:"",series:"",seriesNo:"",isbn:r.isbn||"",author:r.author||"Unknown",genre:"",pages:r.pages||0,status:"Queue",rating:0,syn:"",format:"Print",unit:"page",page:0,recBy:"",started:"",finished:"",fuzzy:"",notes:"",added:todayKey(),cu:r.cu||"",cuUser:false,merged:[]};

let playerOpen=false, raf=0, lastText="", rainRaf=0, audio=null, wake=null;
const R=139, CIRC=2*Math.PI*R;

function startSession(id){ const b=S.books[id]; if(!b) return;
  if(S.timer&&S.timer.bookId!==id){ const cur=S.books[S.timer.bookId];

  if(S.timer){ openPlayer(); return; }
  const before=b.status; if(b.status!=="Reading") setShelf(id,"Reading",true);
  S.timer={bookId:id,startedAt:Date.now(),runFrom:Date.now(),accum:0,paused:false,fromPage:b.page||0,wasStatus:before}; S.lastBook=id; save();
  haptic(); openPlayer(); startAmbience(); update(); }
function switchBook(id){ const t=S.timer; if(!t) return; const b=S.books[id]; if(b.status!=="Reading") setShelf(id,"Reading",true); t.bookId=id; t.fromPage=b.page||0; S.lastBook=id; save(); update(); }
function togglePause(){ const t=S.timer; if(!t) return; haptic();
  if(t.paused){ t.paused=false; t.idle=false; t.runFrom=Date.now(); startAmbience(true); } else { t.accum+=Date.now()-t.runFrom; t.paused=true; stopAmbience(true); }
  save(); renderPlayer(); renderMini(); }
function stopSession(){ const t=S.timer; if(!t) return; const ms=timerMs();

  if(!t.paused){ t.accum+=Date.now()-t.runFrom; t.paused=true; save(); }
  stopAmbience(true); closePlayer(); renderMini(); setTimeout(sheetEndSession,reduced()?0:240); }

function playerHTML(){ const t=S.timer, b=t&&S.books[t.bookId]; if(!b) return null; const s=S.settings;

function renderPlayer(){ const p=$("#player"), h=playerHTML(); if(!h){ closePlayer(); return; }

function openPlayer(){ if(!S.timer) return; const p=$("#player"); playerOpen=true; renderPlayer(); p.removeAttribute("aria-hidden"); document.body.classList.add("playing");
  requestAnimationFrame(()=>p.classList.add("on")); renderMini(); loop(); rain(); if(S.settings.awake!==false) getWake(); }
function closePlayer(){ const p=$("#player"); if(!playerOpen) return; playerOpen=false; p.classList.remove("on"); p.setAttribute("aria-hidden","true"); document.body.classList.remove("playing");
  cancelAnimationFrame(rainRaf); releaseWake(); renderMini(); }
function clockParts(ms){ const s=Math.floor(ms/1000);
  if(S.settings.preciseClock){ const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return h?`${h}<small>h</small><span>${pad(m)}</span><small>m</small>`:`${m}<small>:</small><span>${pad(x)}</span>`; }
  if(s<60) return `${s}<small>s</small>`; const m=Math.floor(s/60); if(m<60) return `${m}<small>m</small>`; return `${Math.floor(m/60)}<small>h</small><span>${pad(m%60)}</span><small>m</small>`; }
function ringFrac(ms){ const g=goalSpec(); if(g.type==="minutes"){ const before=(streakInfo().today.min||0); return Math.min(1,(before+ms/60000)/g.n); } return (ms%(30*60000))/(30*60000); }
function tick(){ const t=S.timer; if(!t) return; const ms=timerMs(), txt=clockParts(ms);
  if(playerOpen){ const p=$("#player"); if(txt!==lastText){ p.querySelector(".clock .n").innerHTML=txt; lastText=txt; }
    const f=ringFrac(ms), a=-Math.PI/2+f*2*Math.PI, w=p.querySelector(".ringwrap").offsetWidth, r=w*R/300;
    p.querySelector(".ring-arc").style.strokeDasharray=`${f*CIRC} ${CIRC}`;
    const k=p.querySelector(".knobarrow"); k.style.transform=`translate(${Math.cos(a)*r}px,${w/2+Math.sin(a)*r}px) rotate(${f*360}deg)`;
    const g=goalSpec(), s=p.querySelector(".clock .s"), lab=g.type==="minutes"?(f>=1?"Tonight’s goal met":`${Math.max(1,Math.ceil(g.n-(streakInfo().today.min||0)-ms/60000))} min to tonight’s goal`):t.paused?"Paused":"";
    if(s.textContent!==lab) s.textContent=lab; }
  const mt=document.querySelector(".mini .livet"); if(mt){ const v=fmtCalm(ms); if(mt.textContent!==v) mt.textContent=v; }
  document.querySelectorAll(".livetime").forEach(e=>{ const v=fmtCalm(ms); if(e.textContent!==v) e.textContent=v; }); }
function loop(){ cancelAnimationFrame(raf); const f=()=>{ if(!S.timer) return; if(idleCheck()){ renderPlayer(); renderMini(); idlePrompt(); } tick(); raf=requestAnimationFrame(f); }; raf=requestAnimationFrame(f); }

function renderMini(){ const m=$("#mini"), t=S.timer, b=t&&S.books[t.bookId], on=!!b&&!playerOpen;
  document.body.classList.toggle("hasmini",!!b);
  if(b) patch(m,`${cover(b)}<button class="mt" data-act="openplayer" style="text-align:left"><b>${bt(b)}</b><span class="${t.paused?"paused":""}"><span class="livet num">${fmtCalm(timerMs())}</span>${t.paused?" · Paused":" · Reading"}</span></button>

function idlePrompt(){ const t=S.timer; if(!t||!t.idle||alertOpen) return; const min=Math.round(timerMs()/60000);
  alertCard({title:"Still reading?",message:`Reading Time paused itself after ${S.settings.idleMin} minutes without you. ${min} minutes are on the clock.`,
    buttons:[{label:"Save "+min+" Minutes",fn:()=>{ closePlayer(); sheetEndSession(); }},{label:"Keep Reading",style:"dark",fn:()=>{ t.idle=false; togglePause(); openPlayer(); }},{label:"Discard Session",style:"red",fn:()=>{ S.timer=null; save(); closePlayer(); update(); toast("Session discarded"); }}]}); }

function rain(){ cancelAnimationFrame(rainRaf); const cv=$("#player canvas.rain"); if(!cv||reduced()) return;
  const dpr=Math.min(2,devicePixelRatio||1), W=cv.offsetWidth, H=cv.offsetHeight; cv.width=W*dpr; cv.height=H*dpr; const x=cv.getContext("2d"); x.scale(dpr,dpr);
  const drops=Array.from({length:Math.round(W*H/5200)},()=>({x:Math.random()*W*1.4,y:Math.random()*H,v:7+Math.random()*7,l:9+Math.random()*16,a:.08+Math.random()*.16}));
  let last=0; const f=ts=>{ if(!playerOpen) return; rainRaf=requestAnimationFrame(f); if(ts-last<30) return; last=ts;
    x.clearRect(0,0,W,H); x.lineWidth=1; x.strokeStyle="#fff"; const slow=S.timer&&S.timer.paused?.15:1;
    drops.forEach(d=>{ x.globalAlpha=d.a; x.beginPath(); x.moveTo(d.x,d.y); x.lineTo(d.x-d.l*.42,d.y+d.l); x.stroke(); d.y+=d.v*slow; d.x-=d.v*.42*slow; if(d.y>H+20||d.x<-20){ d.y=-20; d.x=Math.random()*W*1.4; } }); };
  rainRaf=requestAnimationFrame(f); }
function startAmbience(resume){ if(S.settings.rain===false) return; try{
  if(audio&&resume){ audio.resume(); return; } if(audio) return;
  const ctx=new (window.AudioContext||window.webkitAudioContext)(), len=ctx.sampleRate*6, buf=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let c=0;c<2;c++){ const d=buf.getChannelData(c); let b0=0,b1=0,b2=0; for(let i=0;i<len;i++){ const w=Math.random()*2-1; b0=.99765*b0+w*.099; b1=.963*b1+w*.2965; b2=.57*b2+w*1.0526; let v=(b0+b1+b2+w*.1848)*.11;
    if(Math.random()<.0009) v+= (Math.random()*2-1)*.5; d[i]=v; } for(let i=0;i<2000;i++){ const k=i/2000; d[i]*=k; d[len-1-i]=d[len-1-i]*k+d[i]*(1-k)*0; } }
  const src=ctx.createBufferSource(); src.buffer=buf; src.loop=true; const lp=ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=2600; const hp=ctx.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=180;
  const g=ctx.createGain(); g.gain.value=0; src.connect(hp).connect(lp).connect(g).connect(ctx.destination); src.start(); g.gain.linearRampToValueAtTime(.5,ctx.currentTime+1.5); audio=ctx; }catch(e){} }
function stopAmbience(pauseOnly){ if(!audio) return; try{ if(pauseOnly) audio.suspend(); else { audio.close(); audio=null; } }catch(e){ audio=null; } }
async function getWake(){ try{ if(!wake&&navigator.wakeLock) { wake=await navigator.wakeLock.request("screen"); wake.addEventListener("release",()=>{ wake=null; }); } }catch(e){ wake=null; } }

function initPlayerDrag(){ const p=$("#player"); let d=null;
  p.addEventListener("pointerdown",e=>{ if(e.target.closest("button")) return; d={y:e.clientY,t:performance.now(),id:e.pointerId}; },{passive:true});
  p.addEventListener("pointermove",e=>{ if(!d||e.pointerId!==d.id) return; const dy=e.clientY-d.y; if(dy<=6&&!d.on) return; if(!d.on){ d.on=true; p.classList.add("dragging"); } d.dy=Math.max(0,dy); p.style.transform=`translateY(${d.dy}px)`; },{passive:true});
  const end=e=>{ if(!d||e.pointerId!==d.id) return; const st=d; d=null; if(!st.on) return; p.classList.remove("dragging"); p.style.transform=""; if(st.dy>120||st.dy/(performance.now()-st.t)>.7){ haptic(); closePlayer(); } };
  p.addEventListener("pointerup",end); p.addEventListener("pointercancel",end); }

document.addEventListener("click",e=>{
  const pushEl=e.target.closest("[data-push]");
  const el=e.target.closest("[data-act]");
  if(pushEl&&(!el||pushEl.contains(el)===false||pushEl===el)){ if(pushEl.dataset.suppress) return;
    const r=pushEl.dataset.push, params={}; if(pushEl.dataset.id) params.id=pushEl.dataset.id; if(pushEl.dataset.k) params.k=pushEl.dataset.k;

    push(r,params); return; }
  if(!el||el.dataset.suppress) return;

  switch(a){
    case "back": pop(); break;
